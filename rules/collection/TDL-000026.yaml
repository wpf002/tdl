rule_id: TDL-COL-000026
v4_id: '000026'
name: SharePoint File Shared Outside Organization
description: Detects a file that is shared with a user that is outside the organization which could allow for unauthorized access by outside users
  to sensitive data.
tactic: Collection
tactic_id: TA0009
technique_id: T1537
technique_name: Transfer Data to Cloud Account
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=o365 sourcetype=\"o365:management:activity\" Operation=\"SharingInvitationCreated\" Workload!=\"OneDrive\" \n| regex TargetUserOrGroupName!=\"\
    .*@(yourcompany\\.com|yourdomain\\.com)$\"\n| table _time, UserId, Operation, Workload, ObjectId, TargetUserOrGroupName, SiteUrl, SourceFileName\n"
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where Operation == "SharingInvitationCreated"
    | where Workload != "OneDrive"
    | extend TargetUserEmail = tostring(TargetUserOrGroupName)
    | where TargetUserEmail !endswith "@yourdomain.com"
    | project TimeGenerated, UserId, TargetUserEmail, OfficeObjectId, Site_Url, SourceFileName, Operation, Workload
  aql: |
    SELECT eventtime, username, "Operation", "Workload", "TargetUserOrGroupName", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Operation" = 'SharingInvitationCreated'
      AND "Workload" != 'OneDrive'
      AND "TargetUserOrGroupName" NOT ILIKE '%@yourdomain.com'
    LAST 24 HOURS
  yara_l: |
    rule sharepoint_external_sharing_invitation {
      meta:
        author = "TDL"
        description = "Detects external sharing invitations in SharePoint excluding OneDrive"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1537"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "SharingInvitationCreated"
        $e.metadata.product_name = "Microsoft 365"
        $e.target.application = $workload
        $workload != "OneDrive"
        $e.target.user.email_addresses = $target_email
        not re.regex($target_email, `@(yourdomain\.com|yourcompany\.com)$`)
        $e.principal.user.userid = $actor

      match:
        $actor over 1h

      condition:
        $e
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"SharingInvitationCreated\" \n  AND o365.audit.Workload\
    \ != \"OneDrive\"\n  AND NOT o365.audit.TargetUserOrGroupName RLIKE \".*@(your-domain\\\\.com|your-org\\\\.com)$\"\n| KEEP @timestamp, user.name,\
    \ host.name, o365.audit.Workload, o365.audit.TargetUserOrGroupName, o365.audit.ObjectId, source.ip\n"
  leql: |
    where(source_json.Operation="SharingInvitationCreated" AND source_json.Workload!="OneDrive" AND source_json.TargetUserOrGroupType="Guest")
  crowdstrike: |
    event_simpleName=SharePointFileOperation Operation=SharingInvitationCreated Workload!=OneDrive
    | regex("@(?<domain>[^@]+)$", field=TargetUserPrincipalName)
    | domain != /.*\.internal$|.*\.local$|.*\.onmicrosoft\.com$/
    | table([@timestamp, ComputerName, UserId, TargetUserPrincipalName, domain, ObjectId, SiteUrl, SourceFileName])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and event_type = "SharingInvitationCreated" and raw_log_json.Workload != "OneDrive" and raw_log_json.TargetUserOrGroupType = "Guest"
    | alter target_user = arrayindex(regextract(coalesce(raw_log_json.TargetUserOrGroupName, ""), "([^@]+@[^@]+)"), 0)
    | alter target_domain = arrayindex(regextract(target_user, "@(.+)$"), 0)
    | filter target_domain not in ("yourdomain.com", "yourorg.onmicrosoft.com")
    | fields _time, actor_user, raw_log_json.ObjectId, target_user, target_domain, raw_log_json.Workload, raw_log_json.SiteUrl
  lucene: |
    Operation:"SharingInvitationCreated" AND NOT Workload:"OneDrive" AND NOT TargetUserOrGroupName:*@yourdomain.com
  sumo: |
    _sourceCategory=*Office365* OR _sourceCategory=*M365* OR _sourceCategory=*SharePoint*
    | json field=_raw "Operation" as operation
    | json field=_raw "Workload" as workload
    | json field=_raw "TargetUserOrGroupName" as target_user
    | where operation = "SharingInvitationCreated" and workload != "OneDrive" and !(target_user matches "*@yourorganization.com")
    | fields _messageTime, _sourceHost, operation, workload, target_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 event where the operation is "SharingInvitationCreated" and the workload is not "OneDrive" and the target user is not a domain
  owned by the organization
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

rule_id: TDL-COL-000062
v4_id: '000062'
name: Mass File Download
description: Detects when a user downloads multiple files from a file transfer/storage appliance. This could indicate a data exfiltration attempt
  by insider threat or a compromised user.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=sharepoint sourcetype=\"ms:o365:reporting\" Workload=\"SharePoint\" Operation=\"FileDownloaded\"\n| bin _time span=10m\n| stats\
    \ dc(ObjectId) as distinct_files values(ObjectId) as file_list by _time, UserId\n| where distinct_files >= 20\n| join type=outer UserId \n\
    \    [search index=mcas sourcetype=\"ms:cloudappsecurity\" Operation=\"AlertTriggered\" alert_name=\"Mass download by a single user\"\n  \
    \  | rename user as UserId]\n| table _time, UserId, distinct_files, file_list\n"
  kql: |
    let SharePointDownloads = OfficeActivity
    | where TimeGenerated > ago(10m)
    | where Operation == "FileDownloaded"
    | where OfficeWorkload == "SharePoint"
    | summarize DistinctFiles = dcount(OfficeObjectId), FileNames = make_set(OfficeObjectId) by bin(TimeGenerated, 10m), UserId
    | where DistinctFiles >= 20;
    let MCASAlerts = SecurityAlert
    | where TimeGenerated > ago(10m)
    | where AlertName == "Mass download by a single user"
    | where ProviderName == "MCAS"
    | extend UserId = tostring(parse_json(Entities)[0].Name);
    SharePointDownloads
    | join kind=inner (MCASAlerts) on UserId
    | project TimeGenerated, UserId, DistinctFiles, FileNames, AlertName, AlertSeverity, ProviderName
  aql: "SELECT username, COUNT(*) AS total_downloads, UNIQUECOUNT(\"FileName\") AS distinct_files\nFROM events\nWHERE \"Operation\" = 'FileDownloaded'\
    \ \n  AND \"Workload\" = 'Sharepoint'\nGROUP BY username\nHAVING distinct_files >= 20\nLAST 10 MINUTES\n"
  yara_l: |
    rule sharepoint_mass_download_collection {
      meta:
        author = "Detection Engineer"
        description = "Detects mass file downloads from SharePoint indicative of data collection (T1213)"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "Medium"

      events:
        $download.metadata.product_name = "Microsoft 365"
        $download.metadata.product_event_type = "FileDownloaded"
        $download.metadata.vendor_name = "Microsoft"
        $download.target.application = "SharePoint"
        $download.target.file.full_path = $filename
        $download.principal.user.userid = $user

        $alert.metadata.product_name = "Microsoft Cloud App Security"
        $alert.metadata.product_event_type = "AlertTriggered"
        $alert.security_result.summary = "Mass download by a single user"
        $alert.principal.user.userid = $user

      match:
        $user over 10m

      outcome:
        $risk_score = 65
        $distinct_files = count_distinct($download.target.file.full_path)
        $total_downloads = count($download.metadata.id)

      condition:
        #download >= 20 or #alert >= 1
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 10 minutes \n  AND event.action == \"FileDownloaded\" \n  AND o365.audit.Workload\
    \ == \"SharePoint\"\n| STATS \n    distinct_files = COUNT_DISTINCT(file.name),\n    total_downloads = COUNT(*)\n  BY user.name, bucket = BUCKET(@timestamp,\
    \ 10 minutes)\n| WHERE distinct_files >= 20\n| KEEP bucket, user.name, distinct_files, total_downloads\n"
  leql: |
    where(source_json.Workload="SharePoint" AND source_json.Operation="FileDownloaded") groupby(source_json.UserId) calculate(unique:source_json.ObjectId)
  crowdstrike: |
    event_platform=Win AND event_simpleName=*SharePoint* Operation=FileDownloaded Workload=SharePoint
    | bucket(span=10m, field=@timestamp, as=timeWindow)
    | groupBy([timeWindow, UserId], function=[count(ObjectId, distinct=true, as=distinctFiles), count(as=totalEvents)])
    | distinctFiles >= 20
    | table([timeWindow, UserId, distinctFiles, totalEvents])
  xql: |
    dataset = msft_365_management_activity_raw
    | filter Operation = "FileDownloaded" and Workload = "SharePoint"
    | bin _time span=10m
    | comp count_distinct(ObjectId) as distinct_files by _time, UserId
    | filter distinct_files >= 20
    | fields _time, UserId, distinct_files
  lucene: |
    (Workload:SharePoint AND Operation:FileDownloaded) OR (Operation:AlertTriggered AND alert.name:"Mass download by a single user")
  sumo: |
    _sourceCategory=*SharePoint* OR _sourceCategory=*CloudAppSecurity*
    | json field=_raw "Operation" as operation
    | json field=_raw "Workload" as workload
    | json field=_raw "UserId" as user_id
    | json field=_raw "SourceFileName" as file_name
    | json field=_raw "AlertName" as alert_name
    | where (operation = "FileDownloaded" and workload = "SharePoint") or (operation = "AlertTriggered" and alert_name = "Mass download by a single user")
    | if(operation = "FileDownloaded", 1, 0) as is_download
    | if(operation = "AlertTriggered", 1, 0) as is_alert
    | timeslice 10m
    | where is_download = 1
    | count_distinct(file_name) as distinct_files by _timeslice, user_id
    | where distinct_files >= 20
    | fields _timeslice, user_id, distinct_files
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "20 Sharepoint Events\nWhere the Operation is \"FileDownloaded\"\nWhere the workload is \"Sharepoint\"\nWith distinct File Names\n\
  With the same Source Username \nWithin 10 minutes\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Microsoft Cloud App Security Event\nWhere the Operation is \"AlertTriggered\"\nWhere the Alert Name is \"Mass download by a single user\""
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

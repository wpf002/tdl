rule_id: TDL-COL-000124
v4_id: '000124'
name: Mass File Download from Unauthorized Country
description: Detects when a user  from an unauthorized country downloads multiple files from a file transfer/storage appliance. This could indicate
  a data exfiltration attempt by insider threat or a compromised user.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=sharepoint Workload=\"SharePoint\" Operation=\"FileDownloaded\" \n| bin _time span=5m \n| stats dc(FileName) as distinct_files values(FileName)\
    \ as files values(Country) as source_countries by _time, UserId \n| where distinct_files >= 10 AND NOT match(source_countries, \"^(US|CA|GB|DE|FR)$\"\
    )\n"
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(5m)
    | where Operation == "FileDownloaded"
    | where OfficeWorkload == "SharePoint"
    | where OfficeObjectId != ""
    | summarize DistinctFiles = dcount(OfficeObjectId), FileList = make_set(OfficeObjectId), Countries = make_set(ClientIP_Country) by UserId, bin(TimeGenerated, 5m)
    | where DistinctFiles >= 10
    | where not(set_has_element(Countries, "United States") or set_has_element(Countries, "Canada") or set_has_element(Countries, "United Kingdom"))
    | project TimeGenerated, UserId, DistinctFiles, FileList, Countries
  aql: |
    SELECT username AS "Source Username", sourceip, "SourceCountry", UNIQUECOUNT("FileName") AS distinct_files, COUNT(*) AS total_downloads
    FROM events
    WHERE "Operation" = 'FileDownloaded' AND "Workload" = 'Sharepoint' AND "SourceCountry" NOT IN ('US', 'GB', 'CA', 'AU', 'NZ')
    GROUP BY username, sourceip, "SourceCountry"
    HAVING distinct_files >= 10
    LAST 5 MINUTES
  yara_l: |
    rule sharepoint_mass_download_unauthorized_country {
      meta:
        author = "TDL"
        description = "Detects 10+ distinct file downloads from SharePoint by a single user from unauthorized country within 5 minutes"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Microsoft 365"
        $e.metadata.product_log_id = "FileDownloaded"
        $e.metadata.vendor_name = "Microsoft"
        $e.target.application = "SharePoint"
        not (
          $e.principal.location.country_or_region = "United States" or
          $e.principal.location.country_or_region = "Canada" or
          $e.principal.location.country_or_region = "United Kingdom" or
          $e.principal.location.country_or_region = "Germany" or
          $e.principal.location.country_or_region = "France"
        )
        $e.principal.user.userid = $user
        $e.target.file.full_path = $file
        $e.principal.location.country_or_region = $country

      match:
        $user over 5m

      outcome:
        $risk_score = max(85)
        $country_list = array_distinct($country)
        $file_list = array_distinct($file)
        $file_count = count_distinct($file)

      condition:
        $user and #e >= 10 and $file_count >= 10
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 5 minute \n  AND event.action == \"FileDownloaded\" \n  AND o365.audit.Workload ==\
    \ \"SharePoint\"\n  AND geo.country_name NOT IN (\"United States\", \"Canada\", \"United Kingdom\", \"Germany\", \"France\", \"Australia\"\
    , \"Japan\")\n| STATS file_count = COUNT_DISTINCT(file.name) BY user.name, source.ip, geo.country_name, window = BUCKET(@timestamp, 5 minute)\n\
    | WHERE file_count >= 10\n| KEEP window, user.name, source.ip, geo.country_name, file_count\n"
  leql: |
    where(source_json.Workload="SharePoint" AND source_json.Operation="FileDownloaded" AND source_json.ClientIP_Country NOT IN ["US", "CA", "GB", "DE", "FR"]) groupby(source_json.UserId) calculate(unique:source_json.ObjectId)
  crowdstrike: |
    #type=sharepoint Operation=FileDownloaded Workload=SharePoint
    | NOT (ClientIP.Country IN ["US", "CA", "GB", "AU", "NZ"])
    | groupBy([UserId], function=[count(ObjectId, distinct=true, as=distinctFiles), collect([ClientIP.Country, ObjectId, ComputerName])])
    | distinctFiles >= 10
    | table([UserId, distinctFiles, ClientIP.Country, ObjectId, ComputerName])
  xql: |
    dataset = msft_365_audit_raw
    | filter Operation = "FileDownloaded" and Workload = "SharePoint"
    | bin _time span=5m
    | comp count_distinct(ObjectId) as distinct_files by _time, UserId, ClientIP
    | filter distinct_files >= 10
    | fields _time, UserId, ClientIP, distinct_files
  lucene: |
    Workload:SharePoint AND Operation:FileDownloaded AND NOT SourceCountry:(US OR CA OR GB OR DE OR FR OR AU)
  sumo: |
    _sourceCategory=*Sharepoint* OR _sourceCategory=*Office365* OR _sourceCategory=*M365*
    | json field=_raw "Operation" as operation
    | json field=_raw "Workload" as workload
    | json field=_raw "UserId" as source_username
    | json field=_raw "SourceFileExtension" as file_name
    | json field=_raw "ClientIP" as client_ip
    | json field=_raw "SourceRelativeUrl" as source_url
    | where operation = "FileDownloaded" and workload = "SharePoint"
    | lookup country_name from geo://location on ip=client_ip
    | where !(country_name in ("United States", "Canada", "United Kingdom"))
    | timeslice 5m
    | count_distinct(source_url) as distinct_files by _timeslice, source_username, country_name
    | where distinct_files >= 10
    | fields _timeslice, source_username, country_name, distinct_files
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "10 Sharepoint Events\nWhere the Operation is \"FileDownloaded\"\nWhere the workload is \"Sharepoint\"\nWhere the Source Country\
  \ is Not on the Authorized Countries List\nWith distinct File Names\nWith the same Source Username \nWithin 5 minutes"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

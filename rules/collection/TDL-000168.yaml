rule_id: TDL-COL-000168
v4_id: 000168
name: RDS Snapshot Sharing
description: Detects the sharing of a snapshot with another account or if the snapshot has been made public. An unauthorized user could potentially
  be given access to all of the data within the snapshot.
tactic: Collection
tactic_id: TA0009
technique_id: T1537
technique_name: Transfer Data to Cloud Account
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName=ModifyDBSnapshotAttribute requestParameters.attributeName=restore requestParameters.valuesToAdd=*

    | table _time, userIdentity.arn, sourceIPAddress, eventName, requestParameters.dBSnapshotIdentifier, requestParameters.attributeName, requestParameters.valuesToAdd

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(24h)
    | where EventName == "ModifyDBSnapshotAttribute"
    | extend attributeName = tostring(parse_json(RequestParameters).attributeName)
    | extend valuesToAdd = tostring(parse_json(RequestParameters).valuesToAdd)
    | where attributeName == "restore"
    | where isnotempty(valuesToAdd)
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, attributeName, valuesToAdd, RequestParameters, ResponseElements
  aql: |
    SELECT sourceip, username, "AWS Account ID", "Event Name", "Request Parameters", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Event Name" = 'ModifyDBSnapshotAttribute'
      AND "Request Parameters" ILIKE '%attributeName%restore%'
      AND "Request Parameters" ILIKE '%valuestoadd%'
    LAST 24 HOURS
  yara_l: |
    rule aws_rds_snapshot_sharing_t1537 {
      meta:
        author = "TDL"
        description = "Detects AWS RDS snapshot sharing via ModifyDBSnapshotAttribute which may indicate data exfiltration attempts (MITRE T1537)"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1537"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        $e.target.resource.name = "ModifyDBSnapshotAttribute"
        $e.security_result.action = "ALLOW"
        re.regex($e.security_result.description, `(?i)"attributeName":\s*"restore"`)
        re.regex($e.security_result.description, `(?i)valuestoadd`)
        $e.principal.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user, $ip over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE event.action == \"ModifyDBSnapshotAttribute\" \n  AND aws.cloudtrail.request_parameters LIKE \"*attributeName*restore*\"\
    \n  AND aws.cloudtrail.request_parameters LIKE \"*valuestoadd*\"\n| KEEP @timestamp, cloud.account.id, user.name, source.ip, event.action,\
    \ aws.cloudtrail.request_parameters, aws.cloudtrail.resources\n"
  leql: |
    where(source_json.eventName=ModifyDBSnapshotAttribute AND source_json.requestParameters.attributeName=restore AND source_json.requestParameters ICONTAINS "valuestoadd")
  crowdstrike: |
    #repo=* event_simpleName=AwsApiCall eventName=ModifyDBSnapshotAttribute
    | requestParameters=*attributeName*restore* requestParameters=*valuestoadd*
    | table([@timestamp, userIdentity.principalId, userIdentity.arn, eventName, requestParameters, awsRegion, sourceIPAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and event_type = "AwsApiCall" and operation_name = "ModifyDBSnapshotAttribute"
    | filter lowercase(json_extract_scalar(action_resource_external_attributes, "$.requestParameters.attributeName")) = "restore"
    | filter json_extract_scalar(action_resource_external_attributes, "$.requestParameters.valuesToAdd") != null
    | fields _time, actor_effective_username, operation_name, action_resource_external_attributes, action_country, agent_ip_addresses_str
  lucene: |
    event.provider:rds.amazonaws.com AND event.action:ModifyDBSnapshotAttribute AND requestParameters.attributeName:restore AND _exists_:requestParameters.valuesToAdd
  sumo: |
    _sourceCategory=*cloudtrail* "ModifyDBSnapshotAttribute"
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.attributeName" as attribute_name
    | json field=_raw "requestParameters" as request_params
    | where event_name = "ModifyDBSnapshotAttribute"
    | where attribute_name = "restore"
    | where request_params matches "*valuestoAdd*" or request_params matches "*valuesToAdd*"
    | fields _messageTime, _sourceHost, event_name, attribute_name, request_params
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS APICall Event

  Where the Event Name is in [ModifyDBSnapshotAttribute]

  Where the Request Parameter attributeName is in [restore]

  Where the Request Parameter contains [valuestoadd]'
suppression:
  window: 12 hours
  fields:
  - src_ip
  - src_user
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

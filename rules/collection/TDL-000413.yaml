rule_id: TDL-COL-000413
v4_id: '000413'
name: Unauthorized Report Exported - Salesforce
description: Detects when a report is exported by an unauthorized user. Reports contain a variety of information that adversaries may attempt
  to exfiltrate.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=salesforce EventType=\"ReportExport\" \n| search NOT [| inputlookup salesforce_admins.csv | fields SourceUsername] \n| table _time,\
    \ SourceUsername, EventType, Report_Name, Report_ID, SourceIP\n"
  kql: |
    SalesforceEnrichedEvents
    | where TimeGenerated > ago(24h)
    | where EventType == "ReportExport"
    | where SourceUsername !in (externaldata(AdminUser:string)[@"https://raw.githubusercontent.com/YOUR_ORG/allowlists/main/salesforce_admins.csv"] with (format="csv", ignoreFirstRecord=true))
    | project TimeGenerated, SourceUsername, EventType, SourceIp, UserAgent, ReportName, ReportId
  aql: |
    SELECT username, sourceip, COUNT(*) AS export_count, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
      AND ("Event Type" = 'ReportExport' OR qidname(qid) ILIKE '%ReportExport%')
      AND username NOT IN ('admin@salesforce.com', 'serviceaccount@salesforce.com')
    GROUP BY username, sourceip, LOGSOURCENAME(logsourceid)
    LAST 24 HOURS
  yara_l: "rule salesforce_report_export_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Salesforce report exports by\
    \ non-admin users - MITRE T1213\"\n    mitre_attack_tactic = \"Collection\"\n    mitre_attack_technique = \"T1213\"\n    \n  events:\n   \
    \ $e.metadata.product_name = \"Salesforce\"\n    $e.metadata.product_event_type = \"ReportExport\"\n    $e.principal.user.userid = $user\n\
    \    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 35\n    \n  condition:\n    $e and not (\n      $user in %salesforce_admins_list\n\
    \    )\n}\n"
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "ReportExport" AND user.name NOT IN ("admin@company.com", "salesforce.admin@company.com", "integration.service@company.com")
    | KEEP @timestamp, user.name, event.action, source.ip, user.email, salesforce.event.type, salesforce.report.name
  leql: |
    where(source_json.EVENT_TYPE="ReportExport" AND NOT(source_user IN ["salesforce_admin1", "salesforce_admin2", "salesforce_admin3"]))
  crowdstrike: "#repo=salesforce EventType=ReportExported \n| not(in(field=Username, values=[\"salesforce_admin1@company.com\", \"salesforce_admin2@company.com\"\
    , \"service_account@company.com\"]))\n| table([@timestamp, Username, EventType, ClientIp, SessionKey, AdditionalInfo])\n"
  xql: |
    dataset = salesforce_raw
    | filter event_type = "ReportExport"
    | filter actor_effective_username not in ("salesforce_admin1", "salesforce_admin2", "salesforce_admin3")
    | fields _time, actor_effective_username, agent_hostname, event_type, action_name
  lucene: |
    event.type:"ReportExport" AND NOT source.user.name:("admin1" OR "admin2" OR "admin3")
  sumo: |
    _sourceCategory=*Salesforce* "ReportExport"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as user_name
    | where event_type = "ReportExport"
    | where !(user_name in ("admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"))
    | fields _messageTime, user_name, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'ReportExport'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

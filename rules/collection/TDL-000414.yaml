rule_id: TDL-COL-000414
v4_id: '000414'
name: Sensitive Report Exported - Salesforce
description: Detects when a sensitive report is exported. Reports contain a variety of information that adversaries may attempt to exfiltrate.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Windows
data_sources:
- Salesforce
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=salesforce EventType=ReportExport NOT [| inputlookup salesforce_admins.csv | fields SourceUsername | format]

    | table _time, SourceUsername, EventType, UserId, LoginHistoryId, SessionLevel, SessionKey, ClientBrowser, Platform, ApiType, ApiVersion

    '
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType == "ReportExport"
    | where SourceUserName !in ((externaldata(AdminUser:string)[@"https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Sample%20Data/Feeds/SalesforceAdmins.csv"] with (format="csv", ignoreFirstRecord=true)))
    | project TimeGenerated, SourceUserName, EventType, SourceIp, UserId, ReportName, AdditionalInfo
  aql: |
    SELECT username, sourceip, COUNT(*) AS export_count, LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE "Event Type" = 'ReportExport'
      AND username NOT IN ('admin@company.com', 'salesforce_admin@company.com', 'service_account@company.com')
    GROUP BY username, sourceip, logsourceid
    LAST 24 HOURS
  yara_l: |
    rule salesforce_report_export_non_admin {
      meta:
        author = "TDL"
        description = "Detects Salesforce report exports by non-admin users (T1213 - Data from Information Repositories)"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Salesforce"
        $e.metadata.product_event_type = "ReportExport"
        $e.principal.user.userid = $user
        not $e.principal.user.attribute.labels.key = "salesforce_admin"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "ReportExport"
    | ENRICH salesforce_admins ON user.name
    | WHERE salesforce_admins_user IS NULL
    | KEEP @timestamp, user.name, user.email, source.ip, salesforce.event_type, salesforce.report.name, salesforce.report.id
  leql: |
    where(source_json.EVENT_TYPE="ReportExported" AND NOT(source_user IN ["admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"]))
  crowdstrike: |
    #type=salesforce EventType=ReportExport
    | SourceUsername!=*admin* AND SourceUsername!=*service*
    | table([@timestamp, SourceUsername, EventType, ComputerName, RemoteAddressIP4])
  xql: |
    dataset = salesforce_raw
    | filter event_type = "ReportExport"
    | filter actor_effective_username not in ("salesforce_admin1@company.com", "salesforce_admin2@company.com")
    | fields _time, actor_effective_username, event_type, agent_hostname
  lucene: |
    event.type:"ReportExport" AND NOT source.user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce* "ReportExport"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_username
    | where event_type = "ReportExport"
    | where !(source_username in ("admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"))
    | fields _messageTime, source_username, event_type, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'ReportExport'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 8 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine the collection scope (single file, recursive
  walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

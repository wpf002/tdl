rule_id: TDL-COL-000417
v4_id: '000417'
name: Unauthorized WaveDownload Event - Salesforce
description: Wave Download events represent downloads made from lens explorations and dashboard widgets in the Tableau CRM user interface. A Wave
  Download event type is captured when a user downloads images ( .png ), Microsoft Excel data ( .xls ), or comma-separated values ( .csv ) files.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=salesforce EventType=WaveDownload

    | search NOT [| inputlookup salesforce_admins.csv | fields SourceUsername]

    | table _time, SourceUsername, EventType, Resource, FileName, RecordId, SessionKey, LoginKey

    '
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType == "WaveDownload"
    | where SourceUserName !in (externaldata(AdminUser:string)[@"https://raw.githubusercontent.com/Azure/Azure-Sentinel/master/Sample%20Data/Feeds/SalesforceAdmins.csv"] with (format="csv", ignoreFirstRecord=true))
    | project TimeGenerated, SourceUserName, EventType, SourceIp, UserAgent, Browser, Platform, ClientVersion
  aql: |
    SELECT username, sourceip, COUNT(*) AS download_count, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
      AND "Event Type" = 'WaveDownload'
      AND username NOT IN ('admin1@company.com', 'admin2@company.com', 'sfadmin@company.com')
    GROUP BY username, sourceip, logsourceid
    LAST 24 HOURS
  yara_l: |
    rule salesforce_wave_download_non_admin {
      meta:
        author = "TDL"
        description = "Detects Salesforce Wave downloads by non-admin users - T1213 Collection"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Salesforce"
        $e.metadata.event_type = "USER_RESOURCE_ACCESS"
        $e.metadata.product_event_type = "WaveDownload"
        $e.principal.user.userid = $user
        not $e.security_result.detection_fields["is_admin"] = "true"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "WaveDownload" AND NOT user.name IN ("admin1", "admin2", "admin3")
    | KEEP @timestamp, user.name, source.ip, event.action, salesforce.event_type
  leql: |
    where(source_json.EVENT_TYPE="WaveDownload" AND NOT(source_json.USER_NAME IN [/* Insert Salesforce Admin usernames here */]))
  crowdstrike: "#type=salesforce EventType=WaveDownload \n| not(SourceUserName in [\"admin1@company.com\", \"admin2@company.com\", \"salesforce_admin@company.com\"\
    ])\n| table([@timestamp, SourceUserName, EventType, SessionKey, ClientIP, RelatedEventIdentifier])\n"
  xql: |
    dataset = salesforce_raw
    | filter event_type = "WaveDownload"
    | alter is_admin = arrayindex(regextract(actor_effective_username, "(?i)(admin|administrator|salesforce.admin)"), 0)
    | filter is_admin = null
    | fields _time, actor_effective_username, event_type, action_file_name, agent_hostname
  lucene: |
    event_type:WaveDownload AND NOT source_username:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce* "WaveDownload"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as user_name
    | where event_type = "WaveDownload"
    | where !(user_name in ("admin1@company.com", "admin2@company.com", "salesforce.admin@company.com"))
    | fields _messageTime, user_name, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'WaveDownload'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

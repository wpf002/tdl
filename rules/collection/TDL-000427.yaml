rule_id: TDL-COL-000427
v4_id: '000427'
name: AWS EC2 VM Export Attempt
description: Detects an attempt to export an AWS EC2 instance. An attacker would attempt to extract information from an instance.
tactic: Collection
tactic_id: TA0009
technique_id: T1005
technique_name: Data from Local System
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=cloudtrail eventSource=ec2.amazonaws.com eventName=CreateInstanceExportTask

    | table _time, userIdentity.principalId, userIdentity.arn, sourceIPAddress, awsRegion, requestParameters.instanceId, responseElements.exportTask.exportTaskId

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventSource == "ec2.amazonaws.com"
    | where EventName == "CreateInstanceExportTask"
    | project TimeGenerated, UserIdentityArn, UserIdentityType, SourceIpAddress, EventName, EventSource, AwsRegion, ErrorCode, ErrorMessage, RequestParameters, ResponseElements
  aql: |
    SELECT eventtime, username, sourceip, "Application" AS application, "Event" AS event_name, "Request Parameters" AS request_params, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Application" = 'ec2.amazonaws.com'
      AND "Event" = 'CreateInstanceExportTask'
    LAST 24 HOURS
  yara_l: |
    rule aws_ec2_data_exfiltration_via_export_task {
      meta:
        author = "TDL"
        description = "Detects potential data collection via EC2 instance export task creation"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1005"
        platform = "AWS"
        data_source = "AWS CloudTrail"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.product_event_type = "CreateInstanceExportTask"
        $e.target.application = "ec2.amazonaws.com"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.provider == "ec2.amazonaws.com" AND event.action == "CreateInstanceExportTask"
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, aws.cloudtrail.user_identity.arn, source.ip, event.outcome
  leql: |
    where(source_json.eventSource=ec2.amazonaws.com AND source_json.eventName=CreateInstanceExportTask)
  crowdstrike: |
    #repo=* event_platform=aws eventSource=ec2.amazonaws.com eventName=CreateInstanceExportTask
    | table([@timestamp, userIdentity.principalId, sourceIPAddress, awsRegion, requestParameters.instanceId, responseElements.exportTask.exportTaskId])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and cloud_provider_event_source = "ec2.amazonaws.com" and cloud_provider_event_operation = "CreateInstanceExportTask"
    | fields _time, actor_user, cloud_provider_event_operation, cloud_provider_event_source, cloud_resource_attributes
  lucene: |
    eventSource:ec2.amazonaws.com AND eventName:CreateInstanceExportTask
  sumo: |
    _sourceCategory=*cloudtrail* "CreateInstanceExportTask"
    | json field=_raw "eventName" as event_name
    | json field=_raw "eventSource" as event_source
    | where event_source = "ec2.amazonaws.com" and event_name = "CreateInstanceExportTask"
    | fields _messageTime, event_name, event_source, userIdentity.principalId, sourceIPAddress, awsRegion
false_positives:
- 'False positives could be dev instances. Rule could be tuned to look for failures or successes.


  https://docs.aws.amazon.com/vm-import/latest/userguide'
tuning_guidance: Tune per environment baseline.
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 AWS CloudTrail Event

  Where the Application is [ec2.amazonaws.com]

  Where the Event is [CreateInstanceExportTask]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine the collection scope (single file, recursive walk, mailbox
  export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

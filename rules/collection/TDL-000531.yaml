rule_id: TDL-COL-000531
v4_id: '000531'
name: Hexadecimal User-Agent
description: User-Agent strings with hexadecimal values are often indicative of malware.
tactic: Collection
tactic_id: TA0009
technique_id: T1132
technique_name: ': Data Encoding'
platform:
- AWS
data_sources:
- AWS ELB
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=cloud sourcetype IN("aws:cloudtrail", "azure:auditlogs", "gcp:audit") eventName=* userAgent=*

    | regex userAgent="(?i)([0-9a-f]{2}){4,}"

    | stats count values(userAgent) as userAgent by userIdentity.arn, eventName, resources{}.ARN

    | where count >= 1

    | sort - count

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where isnotempty(UserAgent)
    | where UserAgent matches regex @"(?i)(%[0-9A-Fa-f]{2})+"
    | where isnotempty(EventName)
    | extend ResourceARN = tostring(parse_json(Resources)[0].ARN)
    | summarize count() by UserIdentityArn, EventName, ResourceARN
    | where count_ >= 1
    | sort by count_ desc
  aql: |
    SELECT useridentity, eventname, useragent, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%aws%'
      AND eventname IS NOT NULL
      AND eventname != ''
      AND (useragent MATCHES '.*[0-9a-fA-F]{8,}.*' OR useragent MATCHES '.*\\x[0-9a-fA-F]{2}.*' OR useragent MATCHES '.*%[0-9a-fA-F]{2}.*')
    GROUP BY useridentity, eventname, useragent
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule aws_elb_hex_encoded_user_agent {
      meta:
        author = "TDL"
        description = "Detects hexadecimal-encoded User-Agent strings in AWS ELB logs - T1132 Collection"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1132"
        severity = "Medium"

      events:
        $e.metadata.product_name = "AWS ELB"
        $e.metadata.vendor_name = "AMAZON"
        re.regex($e.network.http.user_agent, `(?i)(\\x[0-9a-f]{2}|%[0-9a-f]{2}|0x[0-9a-f]{2})`)
        $e.target.resource.name != ""
        $e.principal.user.userid = $user_arn
        $e.target.resource.name = $event_name
        $e.target.resource.id = $resource_arn

      match:
        $user_arn, $event_name, $resource_arn over 24h

      outcome:
        $risk_score = 65
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 24 hour \n  AND user_agent.original RLIKE \".*(%[0-9A-Fa-f]{2}).*\"\n  AND event.action\
    \ IS NOT NULL\n  AND event.action != \"\"\n| STATS count = COUNT(*) BY user_agent.original, cloud.account.id, event.action, user.id\n| WHERE\
    \ count >= 1\n| SORT count DESC\n| KEEP count, user.id, event.action, user_agent.original, cloud.account.id\n"
  leql: |
    where(log_source_name="AWS CloudTrail" AND userAgent=/[0-9a-fA-F]{8,}/ AND eventName!="") groupby(userIdentity.arn, eventName, resources{}.ARN) calculate(count)
  crowdstrike: |
    #type=aws:elb userAgent=/.*[0-9a-fA-F]{8,}.*/ eventName=*
    | groupBy([userIdentity.arn, eventName, resources{}.ARN], function=count(as=cnt))
    | cnt >= 1
    | sort(cnt, order=desc)
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AWS and action_type_name != null and action_type_name != ""
    | filter user_agent ~= "\\x[0-9a-fA-F]{2}"
    | comp count() as cnt by actor_effective_username, action_type_name, action_resource_name
    | filter cnt >= 1
    | sort desc cnt
    | fields actor_effective_username, action_type_name, action_resource_name, cnt
  lucene: |
    sourcetype:"aws:elb" AND userAgent:/.*(%[0-9A-Fa-f]{2}){4,}.*/
  sumo: |
    _sourceCategory=*AWS* OR _sourceCategory=*ELB* OR _sourceCategory=*CloudTrail*
    | json field=_raw "userAgent" as user_agent
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "resources[0].ARN" as resource_arn
    | where user_agent matches "*\\x[0-9a-fA-F][0-9a-fA-F]*" and event_name != ""
    | count as cnt by user_arn, event_name, resource_arn
    | where cnt >= 1
    | sort by cnt desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'
pseudo_logic: '1 Instance over any time window of a cloud audit log event where the User-Agent string contains hexadecimal-encoded values.


  From index=cloud

  Where sourcetype is aws:cloudtrail, azure:auditlogs, or gcp:audit

  Where eventName matches a non-empty pattern (eventName contains one or more characters)

  With count of matching events greater than or equal to 1


  With the same userIdentity.arn, eventName, and resources{}.ARN

  Results sorted descending by count, surfacing the highest-frequency hexadecimal User-Agent activity first.'

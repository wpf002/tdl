rule_id: TDL-COL-000538
v4_id: 000538
name: Mass Repositories Cloned by User
description: Detect when a user attempts to clone multyiple repos. This may be an attempt to exfil sensitive company data.
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Windows
data_sources:
- Github
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=github action="git.clone"

    | stats count by user, repository

    | where count >= 5

    '
  kql: |
    GitHubAuditLogEntries
    | where TimeGenerated > ago(1h)
    | where Action =~ "git.clone"
    | summarize CloneCount = count() by bin(TimeGenerated, 10m), ActorLogin, Repository
    | where CloneCount >= 5
  aql: |
    SELECT username, sourceip, COUNT(*) AS clone_count
    FROM events
    WHERE "Action" = 'git.clone'
    GROUP BY username, sourceip
    HAVING clone_count >= 5
    LAST 1 HOURS
  yara_l: |
    rule github_clone_collection {
      meta:
        author = "TDL"
        description = "Detects potential data collection via multiple git clone operations"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "GITHUB"
        $e.metadata.product_event_type = "git.clone"
        $e.principal.user.userid = $user

      match:
        $user over 1h

      condition:
        #e >= 5
    }
  esql: |
    FROM logs-github.audit-*
    | WHERE @timestamp > NOW() - 1 hour AND event.action == "git.clone"
    | STATS clone_count = COUNT(*) BY user.name, source.ip, window = BUCKET(@timestamp, 10 minute)
    | WHERE clone_count >= 5
    | KEEP window, user.name, source.ip, clone_count
  leql: |
    where(source_json.action="git.clone") groupby(source_json.actor, source_json.repo) calculate(count)
  crowdstrike: |
    #type=github action=git.clone
    | groupBy([], function=count(as=clone_count))
    | clone_count >= 5
  xql: |
    dataset = github_audit_log
    | filter action = "git.clone"
    | comp count() as clone_count
    | filter clone_count >= 5
  lucene: |
    event.type:"github" AND action:"git.clone"
  sumo: "_sourceCategory=*Github* \n| json field=_raw \"action\" as action\n| where action = \"git.clone\"\n| timeslice 1h\n| count as event_count\
    \ by _timeslice\n| where event_count >= 5\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "5 Github event\n   where actions is \"git.clone\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine the collection scope (single file, recursive
  walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

rule_id: TDL-COL-000693
v4_id: 000693
name: Slack Info Export Downloaded by Unauthorized User
description: Detects when a non Slack Admin downloads and slack info exports
tactic: Collection
tactic_id: TA0009
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action IN ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")

    | lookup slack_admins.csv user as user OUTPUT is_admin

    | search NOT is_admin=true

    | table _time, user, action, source_ip, channel, workspace

    '
  kql: |
    SlackAuditLogs
    | where TimeGenerated > ago(1h)
    | where Action in ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")
    | where UserId !in ((SlackUsers | where IsAdmin == true | distinct UserId))
    | project TimeGenerated, UserId, UserName, Action, Channel, Details
  aql: |
    SELECT eventtime, username, "Action", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%slack%'
      AND "Action" IN ('channels_export_downloaded', 'manual_export_downloaded', 'manual_user_export_downloaded')
      AND username NOT IN ('admin1@company.com', 'admin2@company.com', 'slackadmin@company.com')
    LAST 24 HOURS
  yara_l: |
    rule slack_data_export_by_non_admin {
      meta:
        author = "Detection Engineering"
        description = "Detects Slack data export actions by non-admin users - MITRE T1213"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1213"
        severity = "High"

      events:
        $e.metadata.product_name = "Slack"
        (
          $e.metadata.product_event_type = "channels_export_downloaded" or
          $e.metadata.product_event_type = "manual_export_downloaded" or
          $e.metadata.product_event_type = "manual_user_export_downloaded"
        )
        $e.principal.user.userid = $user
        not $e.principal.user.attribute.roles.name = "admin"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action IN ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")
    | WHERE user.name NOT IN ("admin_user1", "admin_user2", "admin_user3")
    | KEEP @timestamp, user.name, event.action, host.name, source.ip
  leql: |
    where(source_json.action IN ["channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded"] AND source_user NOT IN [Slack_Admins_List])
  crowdstrike: |
    #type=slack action IN ["channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded"]
    | NOT (user IN ["slack_admin_user1", "slack_admin_user2", "slack_admin_user3"])
    | table([@timestamp, user, action, channel, ip_address])
  xql: |
    dataset = slack_audit_logs
    | filter action in ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")
    | alter is_admin = arrayany(slack_admins_list, user_id = array_element)
    | filter is_admin = false or is_admin = null
    | fields _time, user_id, user_name, action, entity_id
  lucene: |
    event.action:("channels_export_downloaded" OR "manual_export_downloaded" OR "manual_user_export_downloaded") AND NOT user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Slack* (action="channels_export_downloaded" OR action="manual_export_downloaded" OR action="manual_user_export_downloaded")
    | json field=_raw "action" as action
    | json field=_raw "user.name" as user_name
    | json field=_raw "user.id" as user_id
    | where action in ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")
    | where !(user_name in ("admin_user1", "admin_user2", "admin_user3"))
    | fields _messageTime, user_name, user_id, action, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- collection
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is IN ("channels_export_downloaded", "manual_export_downloaded", "manual_user_export_downloaded")

  Where the Source User is NOT on the Slack Admins List'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — determine the collection scope (single file,
  recursive walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

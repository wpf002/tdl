rule_id: TDL-COL-000783
v4_id: 000783
name: Non-Conferencing Process Activating Microphone
description: Audio device opened via WASAPI / CoreAudio by a process not in the conferencing/recording allowlist (Teams, Zoom, OBS, Audacity).
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1123 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1123
technique_name: Audio Capture
platform:
- Windows
- macOS
data_sources:
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=edr (EventType=AudioDeviceAccess OR EventType=DeviceAccess OR EventType=ProcessAccess OR event_type=audio_access OR event_type=device_access) (action=opened OR action=open OR action=access) (device_type=audio OR device_type=microphone OR device_name=*WASAPI* OR device_name=*CoreAudio* OR api_name=*WASAPI* OR api_name=*CoreAudio*)
    NOT (process_name IN ("Teams.exe", "Zoom.exe", "obs64.exe", "obs32.exe", "obs.exe", "audacity.exe", "Skype.exe", "Discord.exe", "slack.exe", "webexmta.exe", "CiscoCollabHost.exe", "Microsoft.Teams.exe", "ms-teams.exe") OR process_path IN ("*\\Microsoft Teams\\*", "*\\Zoom\\*", "*\\OBS Studio\\*", "*\\Audacity\\*", "*\\Skype\\*", "*\\Discord\\*", "*\\Slack\\*"))
    | stats count values(device_name) as devices values(device_type) as device_types values(action) as actions by _time, host, process_name, process_path, user
    | where count > 0
    | table _time, host, user, process_name, process_path, devices, device_types, actions, count
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_col_000783 {\n  meta:\n    author = \"TDL\"\n    description = \"Non-Conferencing Process Activating Microphone\"\n  \
    \  severity = \"HIGH\"\n    tactic = \"TA0009\"\n    technique = \"T1123\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Audio device opened via WASAPI / CoreAudio by a process not in the conferencing/recording allowlist (Teams, Zoom, OBS, Audacity).
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:

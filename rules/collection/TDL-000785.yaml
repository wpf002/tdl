rule_id: TDL-COL-000785
v4_id: 000785
name: Process Attaching to Browser via Debug/Inspector Port
description: Connection to chrome --remote-debugging-port (9222) or msedge --remote-debugging-pipe by a non-developer process. Generated from
  gap analysis against canonical ATT&CK Enterprise matrix (T1185 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1185
technique_name: Browser Session Hijacking
platform:
- Windows
- macOS
data_sources:
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype IN (edr*, sysmon*, wineventlog*) (EventCode=1 OR EventCode=3 OR event_type IN (process*, network*)) \n((CommandLine=\"\
    *chrome*\" AND CommandLine=\"*--remote-debugging-port*\") OR (CommandLine=\"*msedge*\" AND CommandLine=\"*--remote-debugging-pipe*\") OR (dest_port=9222)\
    \ OR (DestinationPort=9222))\nNOT (Image IN (\"*\\\\Visual Studio*\", \"*\\\\vscode*\", \"*\\\\Code.exe\", \"*\\\\devtools*\", \"*\\\\chrome-devtools*\"\
    , \"*\\\\WebStorm*\", \"*\\\\IntelliJ*\", \"*\\\\PyCharm*\", \"*\\\\rider*\", \"*\\\\Eclipse*\"))\nNOT (process_name IN (\"*Visual Studio*\"\
    , \"*vscode*\", \"*Code.exe\", \"*devtools*\", \"*chrome-devtools*\", \"*WebStorm*\", \"*IntelliJ*\", \"*PyCharm*\", \"*rider*\", \"*Eclipse*\"\
    ))\nNOT (ParentImage IN (\"*\\\\Visual Studio*\", \"*\\\\vscode*\", \"*\\\\Code.exe\", \"*\\\\devtools*\", \"*\\\\chrome-devtools*\", \"*\\\
    \\WebStorm*\", \"*\\\\IntelliJ*\", \"*\\\\PyCharm*\", \"*\\\\rider*\", \"*\\\\Eclipse*\"))\n| stats count values(CommandLine) as command_line\
    \ values(Image) as process values(ParentImage) as parent_process values(dest_port) as destination_port values(DestinationPort) as dest_port_alt\
    \ by _time, ComputerName, Computer, host, User, user\n| table _time, ComputerName, Computer, host, User, user, process, parent_process, command_line,\
    \ destination_port, dest_port_alt, count\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_col_000785 {\n  meta:\n    author = \"TDL\"\n    description = \"Process Attaching to Browser via Debug/Inspector Port\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0009\"\n    technique = \"T1185\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Connection to chrome --remote-debugging-port (9222) or msedge --remote-debugging-pipe by a non-developer process.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-COL-000785
v4_id: 000785
name: Process Attaching to Browser via Debug/Inspector Port
description: Connection to chrome --remote-debugging-port (9222) or msedge --remote-debugging-pipe by a non-developer process. Generated from
  gap analysis against canonical ATT&CK Enterprise matrix (T1185 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1185
technique_name: Browser Session Hijacking
platform:
- Windows
- macOS
data_sources:
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype IN (edr*, sysmon*, wineventlog*) (EventCode=1 OR EventCode=3 OR event_type IN (process*, network*)) \n((CommandLine=\"\
    *chrome*\" AND CommandLine=\"*--remote-debugging-port*\") OR (CommandLine=\"*msedge*\" AND CommandLine=\"*--remote-debugging-pipe*\") OR (dest_port=9222)\
    \ OR (DestinationPort=9222))\nNOT (Image IN (\"*\\\\Visual Studio*\", \"*\\\\vscode*\", \"*\\\\Code.exe\", \"*\\\\devtools*\", \"*\\\\chrome-devtools*\"\
    , \"*\\\\WebStorm*\", \"*\\\\IntelliJ*\", \"*\\\\PyCharm*\", \"*\\\\rider*\", \"*\\\\Eclipse*\"))\nNOT (process_name IN (\"*Visual Studio*\"\
    , \"*vscode*\", \"*Code.exe\", \"*devtools*\", \"*chrome-devtools*\", \"*WebStorm*\", \"*IntelliJ*\", \"*PyCharm*\", \"*rider*\", \"*Eclipse*\"\
    ))\nNOT (ParentImage IN (\"*\\\\Visual Studio*\", \"*\\\\vscode*\", \"*\\\\Code.exe\", \"*\\\\devtools*\", \"*\\\\chrome-devtools*\", \"*\\\
    \\WebStorm*\", \"*\\\\IntelliJ*\", \"*\\\\PyCharm*\", \"*\\\\rider*\", \"*\\\\Eclipse*\"))\n| stats count values(CommandLine) as command_line\
    \ values(Image) as process values(ParentImage) as parent_process values(dest_port) as destination_port values(DestinationPort) as dest_port_alt\
    \ by _time, ComputerName, Computer, host, User, user\n| table _time, ComputerName, Computer, host, User, user, process, parent_process, command_line,\
    \ destination_port, dest_port_alt, count\n"
  kql: |
    DeviceNetworkEvents
    | where TimeGenerated > ago(1h)
    | where RemotePort in (9222, 9223)
    | where InitiatingProcessCommandLine has_any ("chrome", "msedge")
    | where InitiatingProcessCommandLine has_any ("--remote-debugging-port", "--remote-debugging-pipe")
    | join kind=inner (
        DeviceProcessEvents
        | where TimeGenerated > ago(1h)
        | where ProcessCommandLine has_any ("--remote-debugging-port", "--remote-debugging-pipe")
        | where FileName in~ ("chrome.exe", "msedge.exe", "Google Chrome", "Microsoft Edge")
        ) on DeviceId
    | where InitiatingProcessFileName !in~ ("devenv.exe", "code.exe", "python.exe", "python3", "node.exe", "idea64.exe", "pycharm64.exe", "studio64.exe", "eclipse.exe")
    | project TimeGenerated, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, RemoteIP, RemotePort, ProcessCommandLine
  aql: |
    SELECT sourceip, destinationip, destinationport, "Process Name", "Process CommandLine", COUNT(*) AS connection_count
    FROM events
    WHERE (destinationport = 9222 OR "Process CommandLine" ILIKE '%--remote-debugging%')
      AND "Process Name" NOT ILIKE '%code.exe%'
      AND "Process Name" NOT ILIKE '%visual studio%'
      AND "Process Name" NOT ILIKE '%devtools%'
      AND "Process Name" NOT ILIKE '%chrome.exe%'
      AND "Process Name" NOT ILIKE '%msedge.exe%'
    GROUP BY sourceip, destinationip, destinationport, "Process Name", "Process CommandLine"
    LAST 1 HOURS
  yara_l: |
    rule browser_remote_debugging_abuse {
      meta:
        author = "TDL"
        description = "Detects connections to Chrome or Edge remote debugging ports by non-developer processes - MITRE T1185"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1185"
        severity = "High"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        (
          $e.target.port = 9222 or
          re.regex($e.principal.process.command_line, `(?i)--remote-debugging-pipe`)
        )
        (
          re.regex($e.principal.process.file.full_path, `(?i)(chrome|msedge)\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)(Google Chrome|Microsoft Edge)\.app`)
        )
        not re.regex($e.principal.process.file.full_path, `(?i)(visual studio|vscode|code\.exe|idea|pycharm|webstorm|developer|devtools)`)
        not re.regex($e.principal.process.command_line, `(?i)(visual studio|vscode|developer|devtools|selenium|puppeteer|playwright)`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.network*
    | WHERE @timestamp > NOW() - 24 hour
      AND (destination.port == 9222 OR process.command_line LIKE "*--remote-debugging-port*" OR process.command_line LIKE "*--remote-debugging-pipe*")
      AND NOT (process.name IN ("chrome.exe", "msedge.exe", "node.exe", "python.exe", "python3.exe", "visual studio code.exe", "code.exe", "devtools.exe"))
    | STATS count = COUNT(*) BY host.name, process.name, process.executable, user.name, destination.port, process.command_line
    | WHERE count > 0
    | KEEP @timestamp, host.name, process.name, process.executable, user.name, destination.port, process.command_line, count
  leql: |
    where(process_cmd_line ICONTAINS "--remote-debugging-port" OR process_cmd_line ICONTAINS "--remote-debugging-pipe") AND NOT (process_name ICONTAINS "devtools" OR process_name ICONTAINS "vscode" OR process_name ICONTAINS "visual studio" OR parent_process_name ICONTAINS "devtools" OR parent_process_name ICONTAINS "vscode" OR parent_process_name ICONTAINS "visual studio")
  crowdstrike: |
    event_simpleName=NetworkConnectIP4 (LocalPort=9222 OR RemotePort=9222)
    | groupBy([ComputerName, FileName, LocalAddressIP4, RemoteAddressIP4, LocalPort, RemotePort], function=count(as=connections))
    | !in(field=FileName, values=["chrome.exe", "msedge.exe", "chromium.exe", "devtools.exe", "node.exe", "python.exe", "code.exe", "Code.exe", "Code - Insiders.exe"])
    | table([@timestamp, ComputerName, FileName, LocalAddressIP4, RemoteAddressIP4, LocalPort, RemotePort, connections])
  xql: |
    preset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_NETWORK
    | filter action_remote_port in (9222, 9223)
    | filter actor_process_image_name not in ("chrome.exe", "msedge.exe", "node.exe", "python.exe", "python3.exe", "pwsh.exe", "powershell.exe", "code.exe", "devenv.exe", "idea.exe", "idea64.exe", "pycharm.exe", "pycharm64.exe", "webstorm.exe", "webstorm64.exe", "goland.exe", "goland64.exe", "rider.exe", "rider64.exe", "clion.exe", "clion64.exe", "phpstorm.exe", "phpstorm64.exe", "rubymine.exe", "rubymine64.exe", "datagrip.exe", "datagrip64.exe", "studio.exe", "studio64.exe", "eclipse.exe", "java.exe", "javaw.exe", "ruby.exe", "perl.exe", "go.exe", "cargo.exe", "rust.exe", "dotnet.exe", "msbuild.exe", "gradle.exe", "maven.exe", "npm.exe", "yarn.exe", "pnpm.exe", "bun.exe", "deno.exe")
    | filter action_local_ip = "127.0.0.1" or action_remote_ip = "127.0.0.1" or action_local_ip = "::1" or action_remote_ip = "::1"
    | fields _time, agent_hostname, actor_process_image_name, actor_process_image_command_line, action_remote_ip, action_remote_port, actor_effective_username
  lucene: |
    (process.command_line:*--remote-debugging-port* OR process.command_line:*--remote-debugging-pipe*) AND (process.name:chrome.exe OR process.name:msedge.exe OR process.name:"Google Chrome" OR process.name:"Microsoft Edge") AND NOT (process.parent.name:*code.exe OR process.parent.name:*devtools* OR process.parent.name:*vscode* OR process.parent.name:*studio* OR process.parent.name:*idea* OR process.parent.name:*eclipse* OR process.parent.name:*selenium* OR process.parent.name:*puppeteer* OR process.parent.name:*playwright*)
  sumo: |
    _sourceCategory=*EDR* OR _sourceCategory=*Sysmon* OR _sourceCategory=*Windows*
    | parse regex "(?<command_line>.*(?:chrome|msedge).*(?:--remote-debugging-port=9222|--remote-debugging-pipe).*)" nodrop
    | parse regex "(?<parent_process>(?:vscode|devtools|visual studio|pycharm|intellij|eclipse|rider|webstorm))" nodrop
    | where command_line matches "*chrome*--remote-debugging-port=9222*" OR command_line matches "*chrome*--remote-debugging-pipe*" OR command_line matches "*msedge*--remote-debugging-port=9222*" OR command_line matches "*msedge*--remote-debugging-pipe*"
    | where !(parent_process matches "*vscode*" OR parent_process matches "*devtools*" OR parent_process matches "*visual studio*" OR parent_process matches "*pycharm*" OR parent_process matches "*intellij*" OR parent_process matches "*eclipse*" OR parent_process matches "*rider*" OR parent_process matches "*webstorm*")
    | fields _messageTime, _sourceHost, command_line, parent_process
pseudo_logic: Connection to chrome --remote-debugging-port (9222) or msedge --remote-debugging-pipe by a non-developer process.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- browser
- session
- hijack
- t1185
- collection
references:
- https://attack.mitre.org/techniques/T1185/

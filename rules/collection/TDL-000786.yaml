rule_id: TDL-COL-000786
v4_id: 000786
name: Repeated Clipboard Reads From Non-UI Process
description: GetClipboardData / NSPasteboard reads ≥10 times in 60s by a process with no UI. Crypto-clipper / password-grab. Generated from gap
  analysis against canonical ATT&CK Enterprise matrix (T1115 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1115
technique_name: Clipboard Data
platform:
- Windows
- macOS
data_sources:
- EDR
severity: Medium
fidelity: High
lifecycle: Proposed
risk_score: 60
queries:
  spl: "index=edr (source=\"*edr*\" OR sourcetype=\"*edr*\" OR sourcetype=\"sysmon\") (process_name=\"*\" OR Image=\"*\") \n    (event_action=\"\
    GetClipboardData\" OR event_action=\"NSPasteboard\" OR api_name=\"GetClipboardData\" OR api_name=\"NSPasteboard\" OR function_name=\"GetClipboardData\"\
    \ OR function_name=\"NSPasteboard\")\n| eval process=coalesce(process_name, Image, process)\n| eval has_ui=if(match(process, \"(?i)(explorer\\\
    .exe|chrome\\.exe|firefox\\.exe|safari|edge\\.exe|iexplore\\.exe|notepad\\.exe|.*\\.app)\"), 1, 0)\n| where has_ui=0\n| bin _time span=60s\n\
    | stats count values(process) as process values(host) as host values(user) as user by _time, process\n| where count >= 10\n| table _time,\
    \ host, user, process, count\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_col_000786 {\n  meta:\n    author = \"TDL\"\n    description = \"Repeated Clipboard Reads From Non-UI Process\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0009\"\n    technique = \"T1115\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: GetClipboardData / NSPasteboard reads ≥10 times in 60s by a process with no UI. Crypto-clipper / password-grab.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-COL-000786
v4_id: 000786
name: Repeated Clipboard Reads From Non-UI Process
description: GetClipboardData / NSPasteboard reads ≥10 times in 60s by a process with no UI. Crypto-clipper / password-grab. Generated from gap
  analysis against canonical ATT&CK Enterprise matrix (T1115 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1115
technique_name: Clipboard Data
platform:
- Windows
- macOS
data_sources:
- EDR
severity: Medium
fidelity: High
lifecycle: Proposed
risk_score: 60
queries:
  spl: "index=edr (source=\"*edr*\" OR sourcetype=\"*edr*\" OR sourcetype=\"sysmon\") (process_name=\"*\" OR Image=\"*\") \n    (event_action=\"\
    GetClipboardData\" OR event_action=\"NSPasteboard\" OR api_name=\"GetClipboardData\" OR api_name=\"NSPasteboard\" OR function_name=\"GetClipboardData\"\
    \ OR function_name=\"NSPasteboard\")\n| eval process=coalesce(process_name, Image, process)\n| eval has_ui=if(match(process, \"(?i)(explorer\\\
    .exe|chrome\\.exe|firefox\\.exe|safari|edge\\.exe|iexplore\\.exe|notepad\\.exe|.*\\.app)\"), 1, 0)\n| where has_ui=0\n| bin _time span=60s\n\
    | stats count values(process) as process values(host) as host values(user) as user by _time, process\n| where count >= 10\n| table _time,\
    \ host, user, process, count\n"
  kql: |
    DeviceEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in ("GetClipboardData", "ClipboardRead")
    | where ProcessCommandLine !has "explorer.exe" and InitiatingProcessFileName !in~ ("explorer.exe", "dwm.exe", "ctfmon.exe")
    | summarize ReadCount = count() by bin(TimeGenerated, 60s), DeviceId, DeviceName, AccountName, FileName, FolderPath, ProcessCommandLine, InitiatingProcessFileName
    | where ReadCount >= 10
    | project TimeGenerated, DeviceName, AccountName, FileName, FolderPath, ProcessCommandLine, InitiatingProcessFileName, ReadCount
  aql: |
    SELECT "Process Name", "Image Path", sourceip, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS clipboard_reads
    FROM events
    WHERE ("API Call" ILIKE '%GetClipboardData%' OR "API Call" ILIKE '%NSPasteboard%' OR "Event Description" ILIKE '%clipboard%' OR "Function Name" ILIKE '%GetClipboardData%' OR "Function Name" ILIKE '%NSPasteboard%')
      AND ("GUI" = 'false' OR "Window Station" = '' OR "Window Station" IS NULL OR "Interactive" = 'false' OR "Session Type" != 'Interactive')
    GROUP BY "Process Name", "Image Path", sourceip, LOGSOURCENAME(logsourceid)
    HAVING clipboard_reads >= 10
    LAST 1 MINUTES
  yara_l: |
    rule clipboard_access_burst_no_ui {
      meta:
        author = "TDL"
        description = "Detects multiple clipboard access operations by processes without UI - T1115"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1115"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "GENERIC_EVENT"
        (
          re.regex($e.metadata.product_event_type, `(?i)clipboard`) or
          re.regex($e.target.resource.name, `(?i)(GetClipboardData|NSPasteboard)`) or
          re.regex($e.metadata.description, `(?i)(GetClipboardData|NSPasteboard)`)
        )
        $e.principal.process.file.full_path = $process_path
        $e.principal.hostname = $host
        (
          $e.principal.process.command_line != /.*\.exe"?\s*$/ or
          re.regex($e.principal.process.file.full_path, `(?i)(cmd\.exe|powershell\.exe|python\.exe|wscript\.exe|cscript\.exe)`)
        )

      match:
        $host, $process_path over 60s

      condition:
        #e >= 10
    }
  esql: |
    FROM logs-endpoint.events.api*
    | WHERE @timestamp > NOW() - 60 seconds
      AND event.category == "api"
      AND (
        (event.action == "GetClipboardData" AND process.Ext.token.integrity_level_name != "system")
        OR (event.action == "NSPasteboard.readObjectsForClasses" OR event.action == "NSPasteboard.stringForType")
      )
      AND process.Ext.session_info.is_interactive == false
    | STATS clipboard_reads = COUNT(*) BY process.executable, process.name, host.name, user.name
    | WHERE clipboard_reads >= 10
    | KEEP @timestamp, host.name, user.name, process.executable, process.name, clipboard_reads
  leql: |
    where(source_json.EventID=7 AND (source_json.TargetObject ICONTAINS "GetClipboardData" OR source_json.TargetObject ICONTAINS "NSPasteboard")) groupby(process_name, asset) calculate(count)
  crowdstrike: |
    event_simpleName IN [GetClipboardData, NSPasteboardRead]
    | bucket(span=60s, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, ComputerName, TargetProcessId, ImageFileName], function=count(as=clipboard_reads))
    | clipboard_reads >= 10
    | table([time_bucket, ComputerName, ImageFileName, TargetProcessId, clipboard_reads])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_API_CALL \n  and (action_api_name = \"GetClipboardData\" or action_api_name\
    \ = \"NSPasteboard\")\n| bin _time span=60s\n| comp count() as clipboard_reads by _time, agent_hostname, actor_process_image_name, actor_process_pid\n\
    | filter clipboard_reads >= 10\n| fields _time, agent_hostname, actor_process_image_name, actor_process_pid, clipboard_reads\n"
  lucene: |
    (event.action:"GetClipboardData" OR event.action:"NSPasteboard.readObjectsForClasses" OR api.name:"GetClipboardData" OR api.name:"NSPasteboard.readObjectsForClasses" OR process.api:"GetClipboardData" OR process.api:"NSPasteboard") AND process.window_title:("" OR "-" OR NULL) AND NOT process.executable:(*explorer.exe OR *chrome.exe OR *firefox.exe OR *safari.app* OR *edge.exe OR *Teams.exe OR *Slack.exe OR *outlook.exe OR *excel.exe OR *word.exe OR *powerpnt.exe OR *notepad.exe OR *code.exe)
  sumo: |
    _sourceCategory=*EDR* (GetClipboardData OR NSPasteboard)
    | json field=_raw "process_name" as process_name
    | json field=_raw "process_id" as process_id
    | json field=_raw "user_interface" as has_ui
    | json field=_raw "host" as host
    | where (process_name matches "*GetClipboardData*" OR process_name matches "*NSPasteboard*") AND (has_ui = "false" OR has_ui = "" OR isNull(has_ui))
    | timeslice 60s
    | count as clipboard_reads by _timeslice, host, process_name, process_id
    | where clipboard_reads >= 10
    | fields _timeslice, host, process_name, process_id, clipboard_reads
pseudo_logic: GetClipboardData / NSPasteboard reads ≥10 times in 60s by a process with no UI. Crypto-clipper / password-grab.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

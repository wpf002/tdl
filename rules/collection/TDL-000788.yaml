rule_id: TDL-COL-000788
v4_id: 000788
name: TFTP Transfer of running-config or startup-config
description: Network device emits copy running-config tftp:// to a non-management IP, or SNMP bulk-walk against private OIDs from outside management
  subnet. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1602 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1602
technique_name: Data from Configuration Repository
platform:
- Network
data_sources:
- Network Device Logs
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=network sourcetype=cisco:ios (("copy" AND "running-config" AND "tftp://") OR ("snmp" AND "bulk"))
    | rex field=_raw "tftp://(?<tftp_dest>\d+\.\d+\.\d+\.\d+)"
    | rex field=_raw "snmp.*(?<snmp_source>\d+\.\d+\.\d+\.\d+)"
    | eval suspicious_ip=coalesce(tftp_dest, snmp_source)
    | where isnotnull(suspicious_ip) AND NOT (match(suspicious_ip, "^10\.") OR match(suspicious_ip, "^172\.(1[6-9]|2[0-9]|3[0-1])\.") OR match(suspicious_ip, "^192\.168\."))
    | stats count values(_raw) as command_details by _time, host, suspicious_ip
    | table _time, host, suspicious_ip, command_details
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "snmp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%snmp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_col_000788 {\n  meta:\n    author = \"TDL\"\n    description = \"TFTP Transfer of running-config or startup-config\"\n\
    \    severity = \"HIGH\"\n    tactic = \"TA0009\"\n    technique = \"T1602\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /snmp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%snmp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/snmp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*snmp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "snmp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*snmp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*snmp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: Network device emits copy running-config tftp:// to a non-management IP, or SNMP bulk-walk against private OIDs from outside management
  subnet.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

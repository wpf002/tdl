rule_id: TDL-COL-000790
v4_id: 000790
name: Mass File Read from Removable Volume
description: ≥100 file reads from a DriveType=2 (removable) volume by user-shell process in 5m. Generated from gap analysis against canonical
  ATT&CK Enterprise matrix (T1025 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1025
technique_name: Data from Removable Media
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
- Auditd
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"linux:audit\") (EventCode=23 OR type=SYSCALL syscall IN\
    \ (2,257)) \n| eval is_removable=if(match(TargetFilename, \"^[D-Z]:\\\\\") OR match(file, \"^/media/\") OR match(file, \"^/mnt/\"), 1, 0)\n\
    | where is_removable=1\n| bin _time span=5m\n| stats dc(TargetFilename) as file_read_count, values(TargetFilename) as files by _time, User,\
    \ ComputerName, host, Image, exe\n| where file_read_count >= 100\n| table _time, User, ComputerName, host, Image, exe, file_read_count, files\n"
  kql: |
    DeviceFileEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "FileOpened"
    | where FolderPath startswith_any ("E:", "F:", "G:", "H:", "I:", "D:")
    | where InitiatingProcessFileName in~ ("explorer.exe", "cmd.exe", "powershell.exe", "pwsh.exe", "bash", "sh", "zsh")
    | summarize FileReadCount = count() by bin(TimeGenerated, 5m), DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine
    | where FileReadCount >= 100
    | project TimeGenerated, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileReadCount
  aql: |
    SELECT username, "Process Name", "Image", sourceip, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS file_reads
    FROM events
    WHERE ("EventID" = '11' OR "EventID" IN ('FILE_READ', 'FILE_OPEN'))
      AND ("DriveType" = '2' OR "TargetFilename" MATCHES '^[A-Z]:\\.*' OR "file" MATCHES '^/media/.*|^/mnt/.*|^/run/media/.*|^/Volumes/.*')
      AND "Process Name" NOT ILIKE '%explorer.exe%'
      AND "Process Name" NOT ILIKE '%system32%'
    GROUP BY username, "Process Name", "Image", sourceip, LOGSOURCENAME(logsourceid)
    HAVING file_reads >= 100
    LAST 5 MINUTES
  yara_l: |
    rule removable_media_collection {
      meta:
        author = "TDL"
        description = "Detects 100+ file reads from removable media in 5 minutes - T1025 Data from Removable Media"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1025"

      events:
        $e.metadata.event_type = "FILE_READ"
        $e.target.file.full_path = $file_path
        re.regex($file_path, `^[A-Z]:\\`) or re.regex($file_path, `^/media/`) or re.regex($file_path, `^/mnt/`) or re.regex($file_path, `^/Volumes/`)
        $e.principal.process.file.full_path = $process
        $e.principal.user.userid = $user
        $e.principal.hostname = $host

      match:
        $host, $user, $process over 5m

      outcome:
        $risk_score = 75

      condition:
        #e >= 100
    }
  esql: "FROM logs-endpoint.events.file*, logs-windows.sysmon_operational*\n| WHERE @timestamp > NOW() - 5 minutes\n  AND event.action IN (\"\
    open\", \"read\", \"creation\") \n  AND file.path RLIKE \"^[A-Z]:\\\\\\\\.*\"\n  AND process.name IN (\"cmd.exe\", \"powershell.exe\", \"\
    pwsh.exe\", \"bash\", \"sh\", \"zsh\")\n| EVAL drive_letter = SUBSTRING(file.path, 0, 2)\n| STATS file_count = COUNT(*) BY user.name, host.name,\
    \ process.name, drive_letter, bucket = BUCKET(@timestamp, 5 minute)\n| WHERE file_count >= 100\n| KEEP bucket, host.name, user.name, process.name,\
    \ drive_letter, file_count\n"
  leql: |
    where(source_json.EventID=23 AND source_json.Image ICONTAINS "explorer.exe" OR source_json.Image ICONTAINS "cmd.exe" OR source_json.Image ICONTAINS "powershell.exe" OR source_json.Image ICONTAINS "bash" OR source_json.Image ICONTAINS "sh") groupby(source_json.User, asset) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 DriveType=2
    | groupBy([ComputerName, UserName, FileName], function=count(as=file_reads), limit=max)
    | file_reads >= 100
    | table([ComputerName, UserName, FileName, file_reads])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE and event_sub_type = ENUM.EVENT_SUB_TYPE_FILE_OPEN
    | filter action_file_path ~= "^[A-Z]:\\" or action_file_path ~= "^/media/" or action_file_path ~= "^/mnt/" or action_file_path ~= "^/Volumes/"
    | bin _time span=5m
    | comp count() as file_reads by _time, actor_effective_username, agent_hostname, actor_process_image_name
    | filter file_reads >= 100
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, file_reads
  lucene: |
    (event.code:11 OR event.action:"accessed-file" OR event.action:"open") AND (DriveType:2 OR file.path:(/media/* OR /mnt/* OR /Volumes/* OR D:\\ OR E:\\ OR F:\\)) AND (process.name:(cmd.exe OR powershell.exe OR pwsh.exe OR bash OR sh OR zsh) OR process.parent.name:(explorer.exe OR finder))
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*Auditd*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as image
    | json field=_raw "TargetFilename" as target_file
    | json field=_raw "User" as user
    | where event_id = "11" OR event_id = "23"
    | where target_file matches "*:\\*" OR target_file matches "/media/*" OR target_file matches "/mnt/*" OR target_file matches "/Volumes/*"
    | where target_file matches regex "^[D-Z]:\\" OR target_file matches "/media/" OR target_file matches "/mnt/" OR target_file matches "/Volumes/"
    | timeslice 5m
    | count as file_reads by _timeslice, user, image
    | where file_reads >= 100
    | fields _timeslice, user, image, file_reads
pseudo_logic: ≥100 file reads from a DriveType=2 (removable) volume by user-shell process in 5m.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- usb
- removable
- t1025
- collection
references:
- https://attack.mitre.org/techniques/T1025/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — determine the collection scope (single file, recursive
  walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'

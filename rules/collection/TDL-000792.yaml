rule_id: TDL-COL-000792
v4_id: 000792
name: SetWindowsHookEx WH_KEYBOARD_LL Installed
description: EDR signal of low-level keyboard hook from a non-input-tooling process. Classic user-mode keylogger primitive. Generated from gap
  analysis against canonical ATT&CK Enterprise matrix (T1056 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1056
technique_name: Input Capture
platform:
- Windows
- Linux
- macOS
data_sources:
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=edr (event_type=keyboard_hook OR action=keyboard_hook OR event_name=keyboard_hook OR event_category=keyboard_hook OR modload_name=*SetWindowsHook* OR api_call=SetWindowsHookEx OR hook_type=WH_KEYBOARD* OR hook_type=WH_KEYBOARD_LL)
    NOT (process_name IN ("explorer.exe","winlogon.exe","csrss.exe","dwm.exe","svchost.exe","taskmgr.exe","osk.exe","tabtip.exe","narrator.exe","magnify.exe","msedge.exe","chrome.exe","firefox.exe","iexplore.exe","slack.exe","teams.exe","discord.exe","skype.exe","zoom.exe","notepad.exe","notepad++.exe","code.exe","devenv.exe","idea64.exe","pycharm64.exe","studio64.exe","sublime_text.exe","atom.exe"))
    | stats count values(process_path) as process_path values(process_cmdline) as process_cmdline values(parent_process) as parent_process by host, process_name, user
    | where count > 0
    | table host, user, process_name, process_path, process_cmdline, parent_process, count
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_col_000792 {\n  meta:\n    author = \"TDL\"\n    description = \"SetWindowsHookEx WH_KEYBOARD_LL Installed\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0009\"\n    technique = \"T1056\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: EDR signal of low-level keyboard hook from a non-input-tooling process. Classic user-mode keylogger primitive.

rule_id: TDL-COL-000794
v4_id: 000794
name: Camera Device Activated by Non-Conferencing Process
description: Webcam opened via Media Foundation / AVFoundation by a process not in the conferencing/streaming allowlist (Teams, Zoom, OBS). Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1125 under Collection).
tactic: Collection
tactic_id: TA0009
technique_id: T1125
technique_name: Video Capture
platform:
- Windows
- macOS
data_sources:
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=edr sourcetype=edr:* (event_type=device_access OR event_type=camera_access OR process_name IN (\"*MediaFoundation*\",\"*AVFoundation*\"\
    ,\"*QuickTime*\") OR (Image=\"*\" AND (CommandLine=\"*MediaFoundation*\" OR CommandLine=\"*AVFoundation*\" OR CommandLine=\"*QuickTime*\"\
    \ OR file_path=\"*CoreMediaIO*\" OR file_path=\"*AVCaptureDevice*\"))) \n| search NOT (process_name IN (\"*teams.exe\",\"*zoom.exe\",\"*obs64.exe\"\
    ,\"*obs32.exe\",\"*obs.exe\",\"*Skype.exe\",\"*Discord.exe\",\"*Chrome.exe\",\"*firefox.exe\",\"*Safari.app*\",\"*FaceTime.app*\",\"*WebexTeams.exe\"\
    ,\"*slack.exe\")) \n| stats count earliest(_time) as first_seen latest(_time) as last_seen values(process_name) as process values(CommandLine)\
    \ as cmdline values(user) as user by host \n| where count > 0\n| table first_seen last_seen host user process cmdline count\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_col_000794 {\n  meta:\n    author = \"TDL\"\n    description = \"Camera Device Activated by Non-Conferencing Process\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0009\"\n    technique = \"T1125\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Webcam opened via Media Foundation / AVFoundation by a process not in the conferencing/streaming allowlist (Teams, Zoom, OBS).
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

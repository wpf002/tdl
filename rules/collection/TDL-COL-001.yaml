rule_id: TDL-COL-001
name: Suspicious Archive Creation in Staging Directory
tactic: Collection
tactic_id: TA0009
technique_id: T1560.001
technique_name: Archive via Utility
platform:
- Windows
data_sources:
- Windows Security Event Log (4688)
severity: High
fidelity: Medium
lifecycle: Deployed
risk_score: 70
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4688

    | stats count values(ComputerName) as hosts by Account_Name, IpAddress, Logon_Type, EventCode

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4688
    | summarize count_events = count(), hosts = make_set(Computer) by Account, IpAddress, LogonType, EventID
    | where count_events >= 1
    | sort by count_events desc
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid) AS hosts, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '4688'
    GROUP BY username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid)
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule mitre_collection_t1560_001_archive_creation {
      meta:
        author = "Detection Engineering"
        description = "Detects potential archive collection activity via process creation (T1560.001)"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1560.001"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "4688"
        $e.target.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_log_id = $logon_type
        $e.principal.hostname = $host

      match:
        $user, $ip, $logon_type over 5m

      outcome:
        $risk_score = 35
        $hosts = array_distinct($host)
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4688"
    | STATS count = COUNT(*), hosts = VALUES(host.name) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=4688) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventCode) calculate(count)
  crowdstrike: |
    EventCode=4688
    | groupBy([user, IpAddress, LogonType, EventCode], function=[count(as=event_count), collect(host, as=hosts)])
    | event_count >= 1
    | sort(event_count, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4688
    | comp count() as event_count, values(agent_hostname) as hosts by actor_effective_username, action_remote_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    event.code:4688 OR EventID:4688 OR EventCode:4688
  sumo: |
    _sourceCategory=*Windows*Security* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | json field=_raw "EventCode" as EventCode
    | where event_id = "4688"
    | count as count by user, IpAddress, LogonType, EventCode
    | where count >= 1
    | sort by count desc
false_positives:
- IT staff creating manual backups
- Software deployment tools
tags:
- archive
- staging
- collection
author: TDL
created: '2024-03-10'
test_method: synthetic
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — determine the collection scope (single file, recursive
  walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'
pseudo_logic: '1 Instance within any observed window of a Windows Security Event Log process creation event.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4688

  With count of matching events greater than or equal to 1

  With results grouped and correlated by user, IpAddress, LogonType, and EventCode

  With values of host collected across matching events as hosts

  Sorted descending by count'

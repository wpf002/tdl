rule_id: TDL-COL-002
name: Bulk File Access to Sensitive Directories
tactic: Collection
tactic_id: TA0009
technique_id: T1074.001
technique_name: Local Data Staging
platform:
- Windows
data_sources:
- Windows Security Event Log (4663)
severity: High
fidelity: Medium
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4663

    | stats count by user, IpAddress, LogonType, EventCode

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where EventID == 4663
    | summarize AccessCount = count() by Account, IpAddress, LogonType, EventID
    | where AccessCount >= 1
    | sort by AccessCount desc
    | project Account, IpAddress, LogonType, EventID, AccessCount
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", COUNT(*) AS access_count
    FROM events
    WHERE "EventID" = '4663'
    GROUP BY username, sourceip, "Logon Type", "EventID"
    HAVING access_count >= 1
    ORDER BY access_count DESC
    LAST 24 HOURS
  yara_l: |
    rule windows_object_access_staging {
      meta:
        author = "Detection Engineer"
        description = "Detects Windows Security Event 4663 (Object Access) events indicating potential data staging for collection - MITRE T1074.001"
        mitre_attack_tactic = "Collection"
        mitre_attack_technique = "T1074.001"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "4663"
        $e.metadata.event_type = "FILE_READ" or $e.metadata.event_type = "FILE_OPEN" or $e.metadata.event_type = "GENERIC_EVENT"
        $e.target.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_log_id = $logon_type

      match:
        $user, $ip, $logon_type over 24h

      outcome:
        $risk_score = max(35)
        $access_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4663"
    | STATS count = COUNT(*) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE count >= 1
    | SORT count DESC
    | KEEP user.name, source.ip, winlog.logon.type, event.code, count
  leql: |
    where(source_json.EventID=4663) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventCode) calculate(count)
  crowdstrike: |
    EventCode=4663
    | groupBy([user, IpAddress, LogonType, EventCode], function=count(as=access_count))
    | access_count >= 1
    | sort(access_count, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4663
    | comp count() as access_count by actor_effective_username, action_remote_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter access_count >= 1
    | sort desc access_count
  lucene: |
    event.code:4663
  sumo: |
    _sourceCategory=*Windows*Security* "4663"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | where event_id = "4663"
    | count as access_count by user, IpAddress, LogonType, event_id
    | where access_count >= 1
    | sort by access_count desc
false_positives:
- Authorized data analysts
- Batch processing jobs
tags:
- data-staging
- insider-threat
- collection
author: TDL
created: '2024-03-11'
test_method: historical
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the data being read (paths, mailbox, share, repository).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — determine the collection scope (single file, recursive
  walk, mailbox export).
- 'Compare against business need: does this user have a legitimate reason to read this data set in this way?'
- 'Pull staging telemetry: archive creation, large temp folders, encrypted blobs in unusual locations within the next 30 minutes.'
- 'Decide TP / FP: FP for sanctioned migration / backup / DLP testing; TP if collection volume is anomalous and lacks a ticket.'
- 'If TP: determine sensitivity of accessed data, preserve audit logs, prepare for possible DLP / privacy notification, and escalate accordingly.'
pseudo_logic: '1 Instance over any time window of a Windows Security Event Log 4663 (Object Access) event.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4663

  With count of access events grouped by user, IpAddress, LogonType, and EventCode being greater than or equal to 1

  With results sorted by count in descending order to surface highest-volume access activity first

  With the same user, IpAddress, LogonType, and EventCode as the correlation key'

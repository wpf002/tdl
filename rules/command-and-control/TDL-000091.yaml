rule_id: TDL-C2-000091
v4_id: 000091
name: Multiple Connection Attempts to Threat IP
description: Detects multiple outbound connection attempts to a known malicious IP.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=firewall action=allowed direction=outbound \n| bin _time span=5m\n| lookup threat_intel_ip_list ip as dest_ip OUTPUT threat_category\n\
    | search threat_category=*\n| stats count by _time, src_ip, dest_ip, threat_category\n| where count >= 10\n| table _time, src_ip, dest_ip,\
    \ threat_category, count\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(5m)
    | where DeviceAction !in ("Deny", "Drop", "Reject")
    | where DeviceDirection == "Outbound"
    | where isnotempty(SourceIP) and isnotempty(DestinationIP)
    | where ipv4_is_private(SourceIP) and not(ipv4_is_private(DestinationIP))
    | join kind=inner (
        ThreatIntelligenceIndicator
        | where TimeGenerated > ago(14d)
        | where isnotempty(NetworkIP) or isnotempty(EmailSourceIpAddress)
        | extend TI_IP = coalesce(NetworkIP, EmailSourceIpAddress)
        | where isnotempty(TI_IP)
        | project TI_IP
        | distinct TI_IP
    ) on $left.DestinationIP == $right.TI_IP
    | summarize EventCount = count(), DestinationIPs = make_set(DestinationIP), FirstEvent = min(TimeGenerated), LastEvent = max(TimeGenerated) by SourceIP, bin(TimeGenerated, 5m)
    | where EventCount >= 10
    | project TimeGenerated, SourceIP, EventCount, DestinationIPs, FirstEvent, LastEvent
  aql: |
    SELECT sourceip, destinationip, COUNT(*) AS event_count
    FROM events
    WHERE sourceip IN (SELECT sourceip FROM events WHERE INOFFENSE(sourceip))
      AND destinationip IN (SELECT destinationip FROM events WHERE INOFFENSE(destinationip))
      AND direction = 'Outbound'
      AND (categoryname(category) ILIKE '%firewall%' OR logsourcetypename(devicetype) ILIKE '%firewall%')
    GROUP BY sourceip, destinationip
    HAVING event_count >= 10
    LAST 5 MINUTES
  yara_l: "rule c2_beaconing_to_threat_intel_ip {\n  meta:\n    author = \"TDL\"\n    description = \"Detects 10+ outbound firewall events from\
    \ one internal source to one external TI-listed destination within 5 minutes\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1071\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.product_log_id = \"FIREWALL\"\n    $e.network.direction\
    \ = \"OUTBOUND\"\n    $e.principal.ip = $internal_ip\n    $e.target.ip = $external_ip\n    net.ip_in_range_cidr($e.principal.ip, \"10.0.0.0/8\"\
    ) or\n    net.ip_in_range_cidr($e.principal.ip, \"172.16.0.0/12\") or\n    net.ip_in_range_cidr($e.principal.ip, \"192.168.0.0/16\")\n   \
    \ not (\n      net.ip_in_range_cidr($e.target.ip, \"10.0.0.0/8\") or\n      net.ip_in_range_cidr($e.target.ip, \"172.16.0.0/12\") or\n   \
    \   net.ip_in_range_cidr($e.target.ip, \"192.168.0.0/16\")\n    )\n    $e.graph.metadata.threat.threat_feed_name != \"\"\n    \n  match:\n\
    \    $internal_ip, $external_ip over 5m\n    \n  outcome:\n    $risk_score = max(75)\n    \n  condition:\n    #e >= 10\n}\n"
  esql: |
    FROM logs-network.firewall*
    | WHERE @timestamp > NOW() - 5 minutes
      AND source.ip NOT LIKE "172.16.*" OR source.ip NOT LIKE "10.*" OR source.ip NOT LIKE "192.168.*"
      AND destination.ip NOT LIKE "172.16.*" AND destination.ip NOT LIKE "10.*" AND destination.ip NOT LIKE "192.168.*"
      AND threat.indicator.ip IS NOT NULL
    | STATS event_count = COUNT(*) BY source.ip, destination.ip, window = BUCKET(@timestamp, 5 minutes)
    | WHERE event_count >= 10
    | KEEP source.ip, destination.ip, event_count, window
  leql: |
    where(direction=OUTBOUND AND destination_address IN threat_list) groupby(source_address, destination_address) calculate(count)
  crowdstrike: |
    #type=firewall direction=outbound
    | groupBy([src_ip, dest_ip], function=count(as=event_count))
    | event_count >= 10
    | join({#type=threat_intel | select([ip, threat_type])}, field=dest_ip, key=ip, include=[threat_type])
    | isNotNull(threat_type)
    | bucket(span=5m, function=count(as=conn_count))
    | conn_count >= 1
    | table([src_ip, dest_ip, event_count, threat_type, @timestamp])
  xql: "dataset = panw_ngfw_traffic_raw\n| filter action_source_translated_ip != null and action_destination_translated_ip != null \n| filter\
    \ misc_is_dst_in_external_feed = \"Yes\"\n| bin _time span=5m\n| comp count() as firewall_events by _time, action_source_translated_ip, action_destination_translated_ip\n\
    | filter firewall_events >= 10\n| fields _time, action_source_translated_ip, action_destination_translated_ip, firewall_events\n"
  lucene: |
    event.type:firewall AND network.direction:outbound AND threat.indicator.ip:* AND _exists_:source.ip AND _exists_:destination.ip AND NOT destination.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16)
  sumo: |
    _sourceCategory=*Firewall* OR _sourceCategory=*firewall*
    | where direction="outbound" OR action matches "*outbound*" OR src_ip matches "10.*" OR src_ip matches "192.168.*" OR src_ip matches "172.16.*" OR src_ip matches "172.17.*" OR src_ip matches "172.18.*" OR src_ip matches "172.19.*" OR src_ip matches "172.20.*" OR src_ip matches "172.21.*" OR src_ip matches "172.22.*" OR src_ip matches "172.23.*" OR src_ip matches "172.24.*" OR src_ip matches "172.25.*" OR src_ip matches "172.26.*" OR src_ip matches "172.27.*" OR src_ip matches "172.28.*" OR src_ip matches "172.29.*" OR src_ip matches "172.30.*" OR src_ip matches "172.31.*"
    | lookup type, malicious_confidence, threat_level from https://github.com/corelight/threat_hunting_tables/blob/master/intel_ips.csv on dest_ip=ip
    | where !isNull(malicious_confidence)
    | timeslice 5m
    | count as event_count by _timeslice, src_ip, dest_ip
    | where event_count >= 10
    | fields _timeslice, src_ip, dest_ip, event_count
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 Firewall Events

  From one internal source to one external destinations (Outbound)

  Where the Destination IP is on a Threat Intelligence List

  Within 5 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

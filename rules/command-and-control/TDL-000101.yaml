rule_id: TDL-C2-000101
v4_id: '000101'
name: EC2 Suspicious Outbound Communication
description: Detects when there is traffic from a EC2 to an external host labeled as malicious by GuardDuty.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" (EventCode=4624 OR EventCode=4625 OR EventCode=4768 OR EventCode=4769 OR EventCode=4776)

    | stats count values(ComputerName) as hosts by Account_Name, IpAddress, Logon_Type, EventCode

    | lookup guardduty_malicious_ips ip as IpAddress OUTPUT threat_purpose, severity

    | where isnotnull(threat_purpose) AND threat_purpose="*EC2*"

    | where count >= 1

    | sort - count

    | table Account_Name, IpAddress, Logon_Type, EventCode, count, hosts, threat_purpose, severity

    '
  kql: "let GuardDutyIPs = \n    AWSGuardDuty\n    | where TimeGenerated > ago(30d)\n    | where Type =~ \"UnauthorizedAccess:EC2/MaliciousIPCaller.Custom\"\
    \ or Type has \"EC2\" and Type has \"Malicious\"\n    | extend MaliciousIP = tostring(parse_json(AdditionalData).remoteIpDetails.ipAddressV4)\n\
    \    | where isnotempty(MaliciousIP)\n    | distinct MaliciousIP;\nSecurityEvent\n| where EventID in (4624, 4625, 4768, 4769, 4776)\n| where\
    \ isnotempty(IpAddress)\n| join kind=inner (GuardDutyIPs) on $left.IpAddress == $right.MaliciousIP\n| extend EventCode = EventID\n| summarize\
    \ count_ = count(), hosts = make_set(Computer) by TargetUserName, IpAddress, LogonType, EventCode\n| where count_ >= 1\n| sort by count_ desc\n\
    | project TargetUserName, IpAddress, LogonType, EventCode, count_, hosts\n"
  aql: |
    SELECT username, sourceip AS IpAddress, "Logon Type" AS LogonType, "EventID" AS EventCode, LOGSOURCENAME(logsourceid) AS hosts, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" IN ('4624', '4625', '4768', '4769', '4776')
      AND sourceip IN (SELECT sourceip FROM events WHERE CATEGORYNAME(category) ILIKE '%GuardDuty%' AND (qidname(qid) ILIKE '%EC2%' OR qidname(qid) ILIKE '%malicious%'))
    GROUP BY username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid)
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule suspicious_ec2_auth_with_guardduty_ioc {
      meta:
        author = "TDL"
        description = "Detects Windows authentication events involving IPs flagged by GuardDuty for malicious EC2 communication"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $auth.metadata.event_type = "USER_LOGIN"
        (
          $auth.metadata.product_event_type = "4624" or
          $auth.metadata.product_event_type = "4625" or
          $auth.metadata.product_event_type = "4768" or
          $auth.metadata.product_event_type = "4769" or
          $auth.metadata.product_event_type = "4776"
        )
        $auth.principal.ip = $ip
        $auth.target.user.userid = $user
        $auth.principal.hostname = $host

        $guardduty.metadata.product_name = "Amazon GuardDuty"
        $guardduty.security_result.summary = /EC2/
        $guardduty.security_result.severity = "HIGH" or $guardduty.security_result.severity = "MEDIUM"
        (
          $guardduty.principal.ip = $ip or
          $guardduty.target.ip = $ip
        )

      match:
        $user, $ip over 1h

      outcome:
        $risk_score = max(75)
        $event_count = count_distinct($auth.metadata.id)
        $event_codes = array_distinct($auth.metadata.product_event_type)
        $hosts = array_distinct($host)

      condition:
        $auth and $guardduty
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("4624", "4625", "4768", "4769", "4776")
    | STATS count = COUNT(*), hosts = COUNT_DISTINCT(host.name) BY user.name, source.ip, winlog.event_data.LogonType, event.code
    | WHERE count >= 1
    | SORT count DESC
    | KEEP user.name, source.ip, winlog.event_data.LogonType, event.code, count, hosts
  leql: |
    where(source_json.EventID IN [4624, 4625, 4768, 4769, 4776] AND source_json.IpAddress=* AND threat_command.indicator_value=source_json.IpAddress AND threat_command.source="GuardDuty") groupby(source_json.TargetUserName, source_json.IpAddress, source_json.LogonType, source_json.EventID) calculate(count)
  crowdstrike: |
    (EventCode=4624 OR EventCode=4625 OR EventCode=4768 OR EventCode=4769 OR EventCode=4776)
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=count(as=event_count))
    | event_count >= 1
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=[collect(ComputerName, as=hosts), sum(event_count, as=total_count)])
    | sort(total_count, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (4624, 4625, 4768, 4769, 4776)
    | alter IpAddress = coalesce(action_evtlog_event_data_IpAddress, action_remote_ip)
    | alter LogonType = action_evtlog_event_data_LogonType
    | alter EventCode = action_evtlog_event_id
    | alter user = coalesce(action_evtlog_event_data_TargetUserName, actor_effective_username)
    | comp count() as event_count, array_agg(agent_hostname) as hosts by user, IpAddress, LogonType, EventCode
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    (EventCode:4624 OR EventCode:4625 OR EventCode:4768 OR EventCode:4769 OR EventCode:4776) AND _exists_:IpAddress AND guardduty_finding:* AND guardduty_finding_type:*EC2* AND guardduty_threat_purpose:"CryptoCurrency:EC2/*" OR guardduty_threat_purpose:"Backdoor:EC2/*" OR guardduty_threat_purpose:"Trojan:EC2/*" OR guardduty_threat_purpose:"UnauthorizedAccess:EC2/*"
    ```

    Wait, let me reconsider. The query needs to filter for Windows Security events with specific event codes where the IP is flagged by GuardDuty. However, Lucene query-string syntax cannot perform the correlation/aggregation logic described (grouping by user+IP+LogonType+EventCode, counting >= 1, sorting). That logic belongs in the alert condition or aggregation layer outside the query string.

    The query string should simply filter for the relevant events:

    ```
    (EventCode:4624 OR EventCode:4625 OR EventCode:4768 OR EventCode:4769 OR EventCode:4776) AND _exists_:IpAddress
  sumo: |
    _sourceCategory=*Windows*Security* (EventID=4624 OR EventID=4625 OR EventID=4768 OR EventID=4769 OR EventID=4776)
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as ip_address
    | json field=_raw "TargetUserName" as user
    | json field=_raw "LogonType" as logon_type
    | where event_id in ("4624", "4625", "4768", "4769", "4776")
    | lookup type, actor, raw, threatlevel as malicious_level from sumo://threat/cs on threat=ip_address
    | where !isNull(malicious_level)
    | count as event_count by user, ip_address, logon_type, event_id
    | where event_count >= 1
    | sort by event_count desc
    | fields user, ip_address, logon_type, event_id, event_count

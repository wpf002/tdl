triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any time window of a Windows Security Authentication event tied to suspicious EC2 outbound communication flagged
  by GuardDuty.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is one of: 4624 (Successful Logon), 4625 (Failed Logon), 4768 (Kerberos TGT Request), 4769 (Kerberos Service Ticket Request),
  or 4776 (NTLM Credential Validation)

  With a count of matching events greater than or equal to 1 per unique combination of user, IpAddress, LogonType, and EventCode

  With the associated IpAddress flagged as malicious by GuardDuty as an external host communicating with an EC2 instance

  With results sorted descending by count to surface highest-frequency activity first

  With the same user, IpAddress, LogonType, and EventCode as the correlation key across all matching hosts aggregated under the hosts field'

rule_id: TDL-C2-000108
v4_id: 000108
name: Activity From Anonymous Proxy IP Detected
description: Detects users with an IP address that have been identified as an anonymous proxy IP address by O365. These proxies are used by people
  who want to hide their device’s IP address, and may be used for malicious intent.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1090
technique_name: Proxy
platform:
- Windows
data_sources:
- O365 ATP
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=o365 sourcetype="o365:management:activity" Workload="SecurityComplianceCenter" Operation="AlertTriggered" Name="Activity from anonymous
    IP addresses"

    | table _time, UserId, ClientIP, Operation, Name, Data

    '
  kql: |
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "AlertTriggered"
    | where RawEventData.Name =~ "Activity from anonymous IP addresses"
    | project TimeGenerated, AccountObjectId, AccountDisplayName, Application, IPAddress, RawEventData
  aql: |
    SELECT eventtime, username, sourceip, destinationip, "Operation", "Alert Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Operation" = 'AlertTriggered'
      AND "Alert Name" = 'Activity from anonymous IP addresses'
    LAST 24 HOURS
  yara_l: |
    rule o365_atp_anonymous_ip_activity {
      meta:
        author = "TDL"
        description = "Detects Microsoft Cloud App Security alerts for activity from anonymous IP addresses - T1090"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1090"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Microsoft Cloud App Security"
        $e.metadata.event_type = "GENERIC_EVENT"
        $e.metadata.product_event_type = "AlertTriggered"
        $e.security_result.summary = "Activity from anonymous IP addresses"
        $e.principal.user.userid = $user

      match:
        $user over 1h

      condition:
        $e
    }
  esql: "FROM logs-o365*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"AlertTriggered\" \n  AND o365.audit.Name == \"Activity\
    \ from anonymous IP addresses\"\n| KEEP @timestamp, user.name, source.ip, host.name, event.action, o365.audit.Name, o365.audit.AlertEntityId,\
    \ o365.audit.AlertId\n"
  leql: |
    where(source_json.Operation="AlertTriggered" AND source_json.Name="Activity from anonymous IP addresses")
  crowdstrike: |
    #type=O365 Operation="AlertTriggered" Name="Activity from anonymous IP addresses"
    | table([@timestamp, UserId, ClientIP, Operation, Name, AlertType, Severity])
  xql: |
    dataset = msft_cloud_app_security_raw
    | filter operation = "AlertTriggered" and alert_name = "Activity from anonymous IP addresses"
    | fields _time, user, operation, alert_name, alert_severity, ip_address, application
  lucene: |
    Operation:"AlertTriggered" AND alert_name:"Activity from anonymous IP addresses"
  sumo: |
    _sourceCategory=*O365* OR _sourceCategory=*CloudApp* OR _sourceCategory=*ATP*
    | json field=_raw "Operation" as operation
    | json field=_raw "AlertName" as alert_name, "Name" as name
    | where operation = "AlertTriggered" and (alert_name = "Activity from anonymous IP addresses" or name = "Activity from anonymous IP addresses")
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Microsoft Cloud App Security Event

  Where the Operation is "AlertTriggered"

  Where the alert name is "Activity from anonymous IP addresses"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

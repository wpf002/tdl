rule_id: TDL-C2-000233
v4_id: '000233'
name: New Webserver Scripts
description: Detects a web request to a script file that has not been requested before. New script files could be a web shell that was recently
  uploaded by an attacker. This building block will add the new script file names to a list to record them as observed and will be used for further
  correlation.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Webserver
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=web OR index=webserver \n(uri_path=\"*.html\" OR uri_path=\"*.htm\" OR uri_path=\"*.php\" OR uri_path=\"*.aspx\" OR uri_path=\"\
    *.asp\" OR uri_path=\"*.jsp\")\nNOT [| inputlookup observed_scripts.csv | fields uri_path]\n| table _time, src_ip, dest, uri_path, status,\
    \ method, user_agent\n"
  kql: |
    W3CIISLog
    | where TimeGenerated > ago(1h)
    | where csUriStem endswith ".html" or csUriStem endswith ".htm" or csUriStem endswith ".php" or csUriStem endswith ".aspx" or csUriStem endswith ".asp" or csUriStem endswith ".jsp"
    | extend FileName = tostring(split(csUriStem, "/")[-1])
    | join kind=leftanti (
        W3CIISLog
        | where TimeGenerated between (ago(30d) .. ago(1h))
        | where csUriStem endswith ".html" or csUriStem endswith ".htm" or csUriStem endswith ".php" or csUriStem endswith ".aspx" or csUriStem endswith ".asp" or csUriStem endswith ".jsp"
        | extend FileName = tostring(split(csUriStem, "/")[-1])
        | distinct FileName
    ) on FileName
    | project TimeGenerated, csUriStem, FileName, cIP, csMethod, scStatus, csUserAgent, Computer
  aql: |
    SELECT sourceip, destinationip, URL, "Web Script File Name", LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS requests
    FROM events
    WHERE category IN (SELECT category FROM categories WHERE name ILIKE '%web%' OR name ILIKE '%http%')
      AND (URL ILIKE '%.html' OR URL ILIKE '%.htm' OR URL ILIKE '%.php' OR URL ILIKE '%.aspx' OR URL ILIKE '%.asp' OR URL ILIKE '%.jsp')
      AND "Web Script File Name" IS NOT NULL
    GROUP BY sourceip, destinationip, URL, "Web Script File Name", LOGSOURCENAME(logsourceid)
    LAST 1 HOURS
  yara_l: "rule suspicious_web_script_access {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects access to web scripts\
    \ not in observed baseline - potential T1078 Valid Accounts abuse\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    (\n      re.regex($e.target.url,\
    \ `\\.html$`) or\n      re.regex($e.target.url, `\\.htm$`) or\n      re.regex($e.target.url, `\\.php$`) or\n      re.regex($e.target.url,\
    \ `\\.aspx$`) or\n      re.regex($e.target.url, `\\.asp$`) or\n      re.regex($e.target.url, `\\.jsp$`)\n    )\n    not re.regex($e.target.file.full_path,\
    \ `(?i)(index\\.html|home\\.php|login\\.aspx|default\\.asp|main\\.jsp|index\\.htm)`)\n    $e.target.hostname = $webserver\n    \n  match:\n\
    \    $webserver over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-web* \n| WHERE url.path RLIKE \".*\\\\.(html|htm|php|aspx|asp|jsp)$\"\n| EVAL script_name = REPLACE(url.path, \".*/\", \"\"\
    )\n| WHERE script_name NOT IN (\"index.html\", \"index.htm\", \"index.php\", \"default.aspx\", \"default.asp\", \"index.jsp\", \"login.html\"\
    , \"login.php\", \"home.html\", \"home.php\", \"admin.php\", \"dashboard.php\", \"main.html\")\n| KEEP @timestamp, source.ip, url.path, script_name,\
    \ host.name, user.name, http.request.method, http.response.status_code\n"
  leql: |
    where(url_path ENDS-WITH ".html" OR url_path ENDS-WITH ".htm" OR url_path ENDS-WITH ".php" OR url_path ENDS-WITH ".aspx" OR url_path ENDS-WITH ".asp" OR url_path ENDS-WITH ".jsp")
  crowdstrike: |
    #type=webserver url_path=/*.html OR url_path=/*.htm OR url_path=/*.php OR url_path=/*.aspx OR url_path=/*.asp OR url_path=/*.jsp
    | regex("(?<script_name>[^/]+\.(html|htm|php|aspx|asp|jsp))$", field=url_path)
    | !in(field=script_name, values=[/* Add your observed scripts whitelist here */])
    | table([@timestamp, ComputerName, url_path, script_name, src_ip, user_agent])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter http_method != null and url_path != null
    | alter web_script = arrayindex(regextract(url_path, "([^/]+)$"), 0)
    | filter web_script ~= "(?i)\\.(html|htm|php|aspx|asp|jsp)$"
    | alter script_lower = lowercase(web_script)
    | comp count() as request_count by script_lower, dest_ip, url_path
    | comp values(dest_ip) as servers, sum(request_count) as total_requests by script_lower
    | comp count_distinct(script_lower) as unique_scripts
    | join type=left (dataset = panw_ngfw_threat_raw | filter http_method != null | alter web_script = arrayindex(regextract(url_path, "([^/]+)$"), 0) | filter web_script ~= "(?i)\\.(html|htm|php|aspx|asp|jsp)$" | alter script_lower = lowercase(web_script) | comp count() as baseline_count by script_lower | filter baseline_count >= 10 | fields script_lower | alter is_observed = "true") as observed script_lower = observed.script_lower
    | filter observed.is_observed = null
    | fields script_lower, servers, total_requests
  lucene: |
    _exists_:url.path AND (url.path:*.html OR url.path:*.htm OR url.path:*.php OR url.path:*.aspx OR url.path:*.asp OR url.path:*.jsp) AND NOT _exists_:file.name
  sumo: |
    _sourceCategory=*Web* OR _sourceCategory=*IIS* OR _sourceCategory=*Apache* OR _sourceCategory=*nginx*
    | json field=_raw "url" as url_path
    | parse regex field=url_path "(?<script_name>[^\/\?]+\.(html|htm|php|aspx|asp|jsp))(\?.*)?$"
    | where !isNull(script_name)
    | where !(script_name in ("index.html", "index.htm", "home.html", "home.htm", "default.aspx", "default.asp", "index.php", "login.html", "login.php", "login.aspx", "main.html", "main.htm"))
    | fields _messageTime, _sourceHost, url_path, script_name
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Webserver Request Event

  Where the URL Path ends with [.html, .htm, .php, .aspx, .asp, .jsp]

  Where the Web Script File Name is NOT in the Observed Scripts List'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

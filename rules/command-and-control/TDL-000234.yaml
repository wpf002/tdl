rule_id: TDL-C2-000234
v4_id: '000234'
name: Suspicious Webserver Script Location
description: Detects a host sending a request to a script file on a web server that is not in a normal web directory. Attackers will often upload
  web shell scripts to uncommon directories to avoid detection and be able to continue their attack.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Webserver
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=web sourcetype=access_* status=200 referer="-" (uri_path="/*.php" OR uri_path="/*.aspx" OR uri_path="/*.jsp" OR uri_path="/*.cgi")

    | regex uri_path="^/[^/]+\.(php|aspx|jsp|cgi)$"

    | search NOT (uri_path="/index.php" OR uri_path="/login.php" OR uri_path="/default.aspx" OR uri_path="/index.jsp")

    | table _time, src, uri_path, status, referer, user_agent, host

    '
  kql: |
    W3CIISLog
    | where TimeGenerated > ago(1h)
    | where scStatus == 200
    | where csUriStem matches regex @"\.(php|asp|aspx|jsp|cgi|pl|py)$"
    | where csReferer == "-"
    | where csUriStem matches regex @"^/[^/]+\.(php|asp|aspx|jsp|cgi|pl|py)$"
    | where csUriStem !startswith "/wwwroot/" and csUriStem !startswith "/inetpub/" and csUriStem !startswith "/var/www/" and csUriStem !startswith "/usr/share/" and csUriStem !startswith "/home/"
    | project TimeGenerated, Computer, sSiteName, csUriStem, csReferer, cIP, csUserAgent, scStatus
  aql: |
    SELECT sourceip, destinationip, username, URL, "Referer", "HTTP Response Code", COUNT(*) AS request_count
    FROM events
    WHERE "HTTP Response Code" = '200'
      AND (URL ILIKE '%.php' OR URL ILIKE '%.asp' OR URL ILIKE '%.aspx' OR URL ILIKE '%.jsp' OR URL ILIKE '%.cgi')
      AND "Referer" = '-'
      AND URL MATCHES '^/[^/]+\.(php|asp|aspx|jsp|cgi)'
      AND URL NOT ILIKE '%/wwwroot/%'
      AND URL NOT ILIKE '%/www/%'
      AND URL NOT ILIKE '%/public_html/%'
      AND URL NOT ILIKE '%/htdocs/%'
      AND URL NOT ILIKE '%/html/%'
    GROUP BY sourceip, destinationip, username, URL, "Referer", "HTTP Response Code"
    LAST 1 HOURS
  yara_l: "rule webshell_direct_access_t1078 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects direct access to web script files in\
    \ non-standard locations with HTTP 200 response\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"T1078\"\
    \n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.security_result.action = \"ALLOW\"\n   \
    \ $e.network.http.response_code = 200\n    re.regex($e.target.url, `(?i)\\.(asp|aspx|php|jsp|jspx|cfm)($|\\?)`)\n    $e.network.http.referrer\
    \ = \"-\"\n    re.regex($e.target.url, `(?i)^/[^/]+\\.(asp|aspx|php|jsp|jspx|cfm)($|\\?)`)\n    not re.regex($e.target.url, `(?i)^/(www|wwwroot|public_html|html|web|htdocs|inetpub/wwwroot)/`)\n\
    \    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 85\n    \n  condition:\n    $e\n\
    }\n"
  esql: "FROM logs-web* \n| WHERE @timestamp > NOW() - 24 hour \n  AND http.response.status_code == 200 \n  AND (url.path LIKE \"*.php\" OR url.path\
    \ LIKE \"*.asp\" OR url.path LIKE \"*.aspx\" OR url.path LIKE \"*.jsp\" OR url.path LIKE \"*.cgi\")\n  AND (http.request.referrer == \"-\"\
    \ OR http.request.referrer == \"\" OR http.request.referrer IS NULL)\n  AND url.path RLIKE \"^/[^/]+\\\\.(php|asp|aspx|jsp|cgi)$\"\n  AND\
    \ NOT url.path LIKE \"/var/www/*\"\n  AND NOT url.path LIKE \"/usr/share/*\"\n  AND NOT url.path LIKE \"/inetpub/wwwroot/*\"\n| KEEP @timestamp,\
    \ host.name, source.ip, url.path, http.request.referrer, http.response.status_code, user_agent.original\n"
  leql: |
    where(source_json.http_code=200 AND (source_json.url ENDS-WITH ".php" OR source_json.url ENDS-WITH ".asp" OR source_json.url ENDS-WITH ".aspx" OR source_json.url ENDS-WITH ".jsp" OR source_json.url ENDS-WITH ".cgi") AND source_json.referrer="-" AND source_json.url=/^\/[^\/]+\.(php|asp|aspx|jsp|cgi)$/ AND NOT (source_json.url ICONTAINS "/wwwroot/" OR source_json.url ICONTAINS "/www/" OR source_json.url ICONTAINS "/html/" OR source_json.url ICONTAINS "/public_html/" OR source_json.url ICONTAINS "/htdocs/"))
  crowdstrike: "#type=webserver status=200 referer=\"-\" \n| regex(\"^/[^/]+\\.(php|asp|aspx|jsp|cgi|pl)$\", field=uri_path, strict=false)\n|\
    \ regex(\"^(?!/var/www/|/usr/share/|/var/www/html/|/inetpub/wwwroot/)\", field=uri_path, strict=false)\n| table([@timestamp, host, uri_path,\
    \ status, referer, user_agent, src_ip])\n"
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter http_response_code = 200
    | filter http_url ~= "\.(php|asp|aspx|jsp|cgi|pl)$"
    | filter http_referer = "-"
    | filter http_url ~= "^/[^/]+\.(php|asp|aspx|jsp|cgi|pl)$"
    | filter http_url !~= "^/(wwwroot|inetpub|var/www|html|www|public_html|httpdocs)/"
    | fields _time, src_ip, dst_ip, http_url, http_referer, http_response_code
  lucene: |
    http.response.status_code:200 AND url.path:(*.php OR *.asp OR *.aspx OR *.jsp OR *.cgi) AND http.request.referrer:"-" AND url.path:/*.* AND NOT url.path:(/var/www/* OR /usr/share/* OR /inetpub/wwwroot/* OR /opt/*)
  sumo: |
    _sourceCategory=*Web* OR _sourceCategory=*IIS* OR _sourceCategory=*Apache* OR _sourceCategory=*nginx*
    | parse regex "(?<status_code>\d{3})" nodrop
    | parse regex "\"(?<method>\w+)\s+(?<url>[^\s]+)\s+" nodrop
    | parse regex "\"(?<referrer>[^\"]+)\"" nodrop
    | where status_code = "200"
    | where referrer = "-"
    | where url matches "*.php" or url matches "*.aspx" or url matches "*.asp" or url matches "*.jsp" or url matches "*.cgi" or url matches "*.pl"
    | parse regex field=url "^/[^/]+\.(php|aspx|asp|jsp|cgi|pl)" as script_in_root
    | where !isNull(script_in_root)
    | where !(url matches "*/wwwroot/*" or url matches "*/htdocs/*" or url matches "*/www/*" or url matches "*/public_html/*" or url matches "*/html/*")
    | fields _messageTime, _sourceHost, url, referrer, status_code
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Webserver Request Event

  Where the HTTP code is 200

  Where the URL is a script file

  Where the referrer is "-"

  Where the Script file path is in the root directory

  Where the Script file path is not in the normal web directory'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

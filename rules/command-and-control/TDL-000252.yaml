rule_id: TDL-C2-000252
v4_id: '000252'
name: Traffic to Geolocation Tracker
description: Anomaly based detection that identifies traffic to a rare geolocation. The country is added to a tracker list for other content to
  reference.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=firewall \n| lookup authorized_countries.csv country as dest_country OUTPUT authorized \n| where isnull(authorized) OR authorized!=\"\
    yes\" \n| table _time, src_ip, dest_ip, dest_country, dest_port, action, user\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(1h)
    | where DeviceVendor has "Firewall" or DeviceProduct has "Firewall"
    | where isnotempty(DestinationGeoCountry)
    | where DestinationGeoCountry !in ("US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG", "NL", "IE", "CH", "SE", "NO", "DK", "FI")
    | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationIP, DestinationGeoCountry, DestinationPort, Protocol, DeviceAction, Message
  aql: |
    SELECT sourceip, destinationip, destinationcountry, COUNT(*) AS event_count, LOGSOURCENAME(logsourceid) AS firewall
    FROM events
    WHERE devicetype IN (2, 5, 16, 18, 69, 100, 146)
      AND destinationcountry IS NOT NULL
      AND destinationcountry NOT IN ('US', 'CA', 'GB', 'DE', 'FR', 'AU', 'NZ', 'JP')
    GROUP BY sourceip, destinationip, destinationcountry, logsourceid
    LAST 24 HOURS
  yara_l: "rule unauthorized_country_connection {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects firewall connections\
    \ to unauthorized countries - MITRE T1078\"\n    severity = \"Medium\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.product_log_id = \"FIREWALL\"\n    not\
    \ $e.target.location.country_or_region in %authorized_countries\n    $e.principal.hostname = $host\n    $e.target.ip = $dest_ip\n    $e.target.location.country_or_region\
    \ = $dest_country\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 50\n    $dest_country_accessed = $dest_country\n\
    \    $destination_ip = $dest_ip\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-network.firewall*\n| WHERE destination.geo.country_name IS NOT NULL \n  AND destination.geo.country_name NOT IN (\"United States\"\
    , \"Canada\", \"United Kingdom\", \"Germany\", \"France\", \"Australia\", \"Japan\")\n| STATS connection_count = COUNT(*) BY source.ip, destination.ip,\
    \ destination.geo.country_name, destination.port\n| KEEP source.ip, destination.ip, destination.geo.country_name, destination.port, connection_count\n"
  leql: |
    where(log_source_type=FIREWALL AND destination_country NOT IN ["US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG", "NL", "SE", "NO", "DK", "FI", "IE", "CH", "AT", "BE", "IT", "ES", "PT", "PL", "CZ", "IL", "KR"]) groupby(destination_country, source_address, destination_address) calculate(count)
  crowdstrike: "#type=firewall dest_country!=* \n| case {\n    dest_country=\"US\" | allowed:=true;\n    dest_country=\"CA\" | allowed:=true;\n\
    \    dest_country=\"GB\" | allowed:=true;\n    dest_country=\"DE\" | allowed:=true;\n    dest_country=\"FR\" | allowed:=true;\n    dest_country=\"\
    AU\" | allowed:=true;\n    dest_country=\"JP\" | allowed:=true;\n    * | allowed:=false;\n  }\n| allowed=false\n| table([@timestamp, src_ip,\
    \ dest_ip, dest_country, dest_port, action, ComputerName])\n"
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter dest_country != null and dest_country not in ("US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG", "NL", "SE", "NO", "DK", "FI", "IE", "CH", "AT", "BE", "ES", "IT")
    | fields _time, action_source_ip, action_destination_ip, dest_country, app, action_source_user, dest_port, bytes_sent, bytes_received
  lucene: |
    event_data_type:"firewall" AND NOT destination.country:(US OR CA OR GB OR DE OR FR OR JP OR AU)
  sumo: |
    _sourceCategory=*Firewall* OR _sourceCategory=*firewall*
    | where !(dest_country in ("US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG", "IE", "NL", "SE", "NO", "DK", "FI", "CH", "AT", "BE", "ES", "IT"))
    | fields _messageTime, _sourceHost, src_ip, dest_ip, dest_country, dest_port, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Firewall Event

  Where the Destination Country is NOT on the Authorized Countries List'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000259
v4_id: 000259
name: Excessive Outbound Connections to Foreign Country
description: This alert will serve as more of a beaconing alert to identify repeated connections to a potential malicious entity.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=firewall \n| bin _time span=30m\n| search dest_country IN (\"CN\", \"RU\", \"KP\", \"IR\", \"SY\", \"CU\", \"VE\", \"BY\")\n| stats\
    \ count by _time, src_ip, dest_country\n| where count >= 50\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(30m)
    | where DeviceVendor has "Firewall" or DeviceProduct has "Firewall"
    | where isnotempty(DestinationGeoCountry)
    | where DestinationGeoCountry in ("KP", "IR", "SY", "CU", "RU", "CN", "BY")
    | summarize EventCount = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), DestinationIPs = make_set(DestinationIP) by SourceIP, DestinationGeoCountry, bin(TimeGenerated, 30m)
    | where EventCount >= 50
    | project TimeGenerated, SourceIP, DestinationGeoCountry, EventCount, FirstSeen, LastSeen, DestinationIPs
  aql: |
    SELECT sourceip, "Destination Country" AS dest_country, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%firewall%'
      AND "Destination Country" IN ('CN', 'RU', 'KP', 'IR', 'SY', 'CU', 'SD', 'VE', 'BY', 'MM')
    GROUP BY sourceip, "Destination Country"
    HAVING event_count >= 50
    LAST 30 MINUTES
  yara_l: |
    rule c2_high_risk_country_connections {
      meta:
        author = "Detection Engineer"
        description = "Detects 50+ firewall events to high-risk countries from same source IP within 30 minutes"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "High"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.metadata.product_log_id = "FIREWALL"
        (
          $e.principal.location.country_or_region = "CN" or
          $e.principal.location.country_or_region = "RU" or
          $e.principal.location.country_or_region = "IR" or
          $e.principal.location.country_or_region = "KP" or
          $e.principal.location.country_or_region = "SY" or
          $e.target.location.country_or_region = "CN" or
          $e.target.location.country_or_region = "RU" or
          $e.target.location.country_or_region = "IR" or
          $e.target.location.country_or_region = "KP" or
          $e.target.location.country_or_region = "SY"
        )
        $e.principal.ip = $src_ip
        $e.target.location.country_or_region = $dst_country

      match:
        $src_ip, $dst_country over 30m

      condition:
        #e >= 50
    }
  esql: |
    FROM logs-network.firewall*
    | WHERE @timestamp > NOW() - 30 minutes
      AND destination.geo.country_name IN ("Iran", "North Korea", "Syria", "Cuba", "Sudan", "Russia", "China", "Belarus")
    | STATS event_count = COUNT(*) BY source.ip, destination.geo.country_name, time_window = BUCKET(@timestamp, 30 minutes)
    | WHERE event_count >= 50
    | KEEP time_window, source.ip, destination.geo.country_name, event_count
  leql: |
    where(log_source_type=FIREWALL AND destination_country IN ["CN", "RU", "KP", "IR", "SY", "CU", "VE"]) groupby(source_address, destination_country) calculate(count)
  crowdstrike: |
    #type=firewall DestinationCountry IN [CN, RU, KP, IR, SY, CU, BY, VE, SD, SS]
    | bucket(span=30m, field=@timestamp, as=time_bucket)
    | groupBy([SourceIP, DestinationCountry, time_bucket], function=count(as=event_count))
    | event_count >= 50
    | table([SourceIP, DestinationCountry, time_bucket, event_count])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter dest_country in ("CN", "RU", "KP", "IR", "SY", "CU", "VE", "BY")
    | bin _time span=30m
    | comp count() as event_count by _time, src_ip, dest_country
    | filter event_count >= 50
  lucene: |
    _exists_:destination.geo.country_iso_code AND destination.geo.country_iso_code:(CN OR RU OR IR OR KP OR SY OR CU OR BY OR VE OR SD OR MM) AND _exists_:source.ip
  sumo: |
    _sourceCategory=*Firewall*
    | where dest_country in ("CN", "RU", "KP", "IR", "SY", "CU", "SD", "BY")
    | timeslice 30m
    | count as event_count by _timeslice, src_ip, dest_country
    | where event_count >= 50
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '50 Firewall Events

  Where the Destination Country is on the High Risk Countries List

  With the same Source IP and Destination Country

  Within 30 minutes'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

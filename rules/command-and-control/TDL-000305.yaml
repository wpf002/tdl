rule_id: TDL-C2-000305
v4_id: '000305'
name: AWS EC2 Traffic to Malicious IP - GuardDuty
description: Detects when an EC2 instance is attempting to connect to an address that is known to be tied to malicious activity.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty \n(type=\"Trojan:EC2/BlackholeTraffic\" OR type=\"Trojan:EC2/DropPoint\" OR type=\"\
    Trojan:Lambda/BlackholeTraffic\" OR type=\"Trojan:Runtime/BlackholeTraffic\" OR type=\"Trojan:Runtime/BlackholeTraffic!DNS\" OR type=\"Trojan:Runtime/DropPoint\"\
    \ OR type=\"Trojan:Lambda/DropPoint\")\n| table _time, type, accountId, region, resource.instanceDetails.instanceId, resource.instanceDetails.imageId,\
    \ severity, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where EventType in ("Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint")
    | project TimeGenerated, EventType, AwsAccountId, ResourceType, Resource, Severity, Description, Title
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "finding.type" AS finding_type, "resource.instanceDetails.instanceId" AS instance_id, "service.action.networkConnectionAction.remoteIpDetails.ipAddressV4" AS remote_ip, "severity" AS severity
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "finding.type" IN ('Trojan:EC2/BlackholeTraffic', 'Trojan:EC2/DropPoint', 'Trojan:Lambda/BlackholeTraffic', 'Trojan:Runtime/BlackholeTraffic', 'Trojan:Runtime/BlackholeTraffic!DNS', 'Trojan:Runtime/DropPoint', 'Trojan:Lambda/DropPoint')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_blackhole_droppoint_traffic {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for Trojan BlackholeTraffic or DropPoint activity indicating C2 communication"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "AWS GuardDuty"
        (
          $e.metadata.product_event_type = "Trojan:EC2/BlackholeTraffic" or
          $e.metadata.product_event_type = "Trojan:EC2/DropPoint" or
          $e.metadata.product_event_type = "Trojan:Lambda/BlackholeTraffic" or
          $e.metadata.product_event_type = "Trojan:Runtime/BlackholeTraffic" or
          $e.metadata.product_event_type = "Trojan:Runtime/BlackholeTraffic!DNS" or
          $e.metadata.product_event_type = "Trojan:Runtime/DropPoint" or
          $e.metadata.product_event_type = "Trojan:Lambda/DropPoint"
        )
        $e.principal.resource.attribute.cloud.environment = "AMAZON_WEB_SERVICES"

      match:
        $e.principal.resource.name over 5m

      outcome:
        $risk_score = max(75)
        $finding_type = array_distinct($e.metadata.product_event_type)
        $resource_name = array_distinct($e.principal.resource.name)

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.id, aws.guardduty.resource.resource_type, aws.guardduty.severity, source.ip, destination.ip
  leql: |
    where(source_json.type IN ["Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint"])
  crowdstrike: |
    #type=guardduty event.type IN ["Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint"]
    | table([@timestamp, event.type, event.resourceType, event.accountId, event.region, event.severity])
  xql: |
    dataset = aws_guardduty_raw
    | filter finding_type in ("Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint")
    | fields _time, finding_type, account_id, region, resource_type, severity, finding_id, resource_instance_id
  lucene: |
    event.dataset:aws.guardduty AND (finding.type:"Trojan:EC2/BlackholeTraffic" OR finding.type:"Trojan:EC2/DropPoint" OR finding.type:"Trojan:Lambda/BlackholeTraffic" OR finding.type:"Trojan:Runtime/BlackholeTraffic" OR finding.type:"Trojan:Runtime/BlackholeTraffic!DNS" OR finding.type:"Trojan:Runtime/DropPoint" OR finding.type:"Trojan:Lambda/DropPoint")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint", "Trojan:Lambda/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic", "Trojan:Runtime/BlackholeTraffic!DNS", "Trojan:Runtime/DropPoint", "Trojan:Lambda/DropPoint")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["Trojan:EC2/BlackholeTraffic", "Trojan:EC2/DropPoint","Trojan:Lambda/BlackholeTraffic","Trojan:Runtime/BlackholeTraffic",
  "Trojan:Runtime/BlackholeTraffic!DNS","Trojan:Runtime/DropPoint","Trojan:Lambda/DropPoint"]'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000330
v4_id: '000330'
name: AWS Network Activity from Threat Host - GuardDuty
description: Detects when network activity from a known threat is seen within AWS instance
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatchlogs:guardduty (type="UnauthorizedAccess:EC2/MaliciousIPCaller.Custom" OR type="UnauthorizedAccess:EC2/MaliciousIPCaller")

    | table _time, accountId, region, type, severity, resource.instanceDetails.instanceId, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4,
    title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("UnauthorizedAccess:EC2/MaliciousIPCaller.Custom", "UnauthorizedAccess:EC2/MaliciousIPCaller")
    | project TimeGenerated, Title, Description, AccountId, AwsAccountId, Region, ResourceType, Severity, SourceIpAddress = tostring(parse_json(AdditionalData).sourceIpAddress), InstanceId = tostring(parse_json(AdditionalData).instanceId)
  aql: "SELECT sourceip, destinationip, username, QIDNAME(qid), CATEGORYNAME(category), eventtime, LOGSOURCENAME(logsourceid) AS logsource\nFROM\
    \ events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'\n  AND (QIDNAME(qid) ILIKE '%UnauthorizedAccess:EC2/MaliciousIPCaller.Custom%'\
    \ \n       OR QIDNAME(qid) ILIKE '%UnauthorizedAccess:EC2/MaliciousIPCaller%')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_malicious_ip_caller {
      meta:
        author = "Detection Engineer"
        description = "Detects AWS GuardDuty findings for EC2 instances communicating with known malicious IPs"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "High"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "UnauthorizedAccess:EC2/MaliciousIPCaller.Custom" or
          $e.metadata.product_event_type = "UnauthorizedAccess:EC2/MaliciousIPCaller"
        )
        $e.principal.resource.name = $instance

      match:
        $instance over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("UnauthorizedAccess:EC2/MaliciousIPCaller.Custom", "UnauthorizedAccess:EC2/MaliciousIPCaller")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, source.ip, event.type, event.id
  leql: |
    where(source_json.type IN ["UnauthorizedAccess:EC2/MaliciousIPCaller.Custom", "UnauthorizedAccess:EC2/MaliciousIPCaller"])
  crowdstrike: |
    #event_simpleName=GuardDutyFinding (Finding.Type="UnauthorizedAccess:EC2/MaliciousIPCaller.Custom" OR Finding.Type="UnauthorizedAccess:EC2/MaliciousIPCaller")
    | table([@timestamp, AccountId, Region, Finding.Type, Resource.InstanceDetails.InstanceId, Service.Action.NetworkConnectionAction.RemoteIpDetails.IpAddressV4, Finding.Severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log.service.serviceName = "guardduty"
    | filter raw_log.type in ("UnauthorizedAccess:EC2/MaliciousIPCaller.Custom", "UnauthorizedAccess:EC2/MaliciousIPCaller")
    | fields _time, cloud_provider, raw_log.accountId, raw_log.region, raw_log.type, raw_log.severity, raw_log.resource.instanceDetails.instanceId, raw_log.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4
  lucene: |
    event.dataset:aws.guardduty AND (finding.type:"UnauthorizedAccess:EC2/MaliciousIPCaller.Custom" OR finding.type:"UnauthorizedAccess:EC2/MaliciousIPCaller")
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("UnauthorizedAccess:EC2/MaliciousIPCaller.Custom", "UnauthorizedAccess:EC2/MaliciousIPCaller")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"UnauthorizedAccess:EC2/MaliciousIPCaller.Custom\", \"UnauthorizedAccess:EC2/MaliciousIPCaller\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000334
v4_id: '000334'
name: AWS TOR Network Activity - GuardDuty
description: Detects when EC2 instance is making connections to a Tor relay, Tor guard, or authority node. This could be indicative of a compromised
  EC2 acting as a client on a Tor network.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1090
technique_name: Proxy
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=guardduty sourcetype=aws:guardduty \n(type=\"UnauthorizedAccess:EC2/TorClient\" OR type=\"UnauthorizedAccess:EC2/TorRelay\" OR type=\"\
    UnauthorizedAccess:Runtime/TorClient\" OR type=\"UnauthorizedAccess:Runtime/TorRelay\" OR type=\"UnauthorizedAccess:Lambda/TorClient\" OR\
    \ type=\"UnauthorizedAccess:Lambda/TorRelay\")\n| table _time, type, accountId, region, resource.instanceDetails.instanceId, resource.resourceType,\
    \ severity, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("UnauthorizedAccess:EC2/TorClient", "UnauthorizedAccess:EC2/TorRelay", "UnauthorizedAccess:Runtime/TorClient", "UnauthorizedAccess:Runtime/TorRelay", "UnauthorizedAccess:Lambda/TorClient", "UnauthorizedAccess:Lambda/TorRelay")
    | project TimeGenerated, Type, Title, Description, AccountId, Region, Resource = tostring(parse_json(AdditionalData).Resource), Severity
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, qidname(qid) AS event_type, \"instanceId\" AS instance_id, \"resource.resourceType\"\
    \ AS resource_type, sourceip, destinationip, username\nFROM events\nWHERE (qidname(qid) ILIKE '%UnauthorizedAccess:EC2/TorClient%' \n   OR\
    \ qidname(qid) ILIKE '%UnauthorizedAccess:EC2/TorRelay%'\n   OR qidname(qid) ILIKE '%UnauthorizedAccess:Runtime/TorClient%'\n   OR qidname(qid)\
    \ ILIKE '%UnauthorizedAccess:Runtime/TorRelay%'\n   OR qidname(qid) ILIKE '%UnauthorizedAccess:Lambda/TorClient%'\n   OR qidname(qid) ILIKE\
    \ '%UnauthorizedAccess:Lambda/TorRelay%')\n  AND LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_tor_proxy_usage {
      meta:
        author = "TDL"
        description = "Detects AWS resources communicating via Tor network based on GuardDuty findings - T1090 Command and Control"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1090"
        severity = "HIGH"

      events:
        $guardduty.metadata.product_name = "Amazon GuardDuty"
        (
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:EC2/TorClient" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:EC2/TorRelay" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:Runtime/TorClient" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:Runtime/TorRelay" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:Lambda/TorClient" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:Lambda/TorRelay"
        )
        $guardduty.principal.resource.name = $resource

      match:
        $resource over 5m

      outcome:
        $risk_score = max(75)
        $resource_name = array_distinct($guardduty.principal.resource.name)
        $event_types = array_distinct($guardduty.metadata.product_event_type)

      condition:
        $guardduty
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("UnauthorizedAccess:EC2/TorClient", "UnauthorizedAccess:EC2/TorRelay", "UnauthorizedAccess:Runtime/TorClient", "UnauthorizedAccess:Runtime/TorRelay", "UnauthorizedAccess:Lambda/TorClient", "UnauthorizedAccess:Lambda/TorRelay")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.id, event.severity, aws.guardduty.resource.instance_details.instance_id, aws.guardduty.resource.lambda_details.function_name, source.ip, destination.ip
  leql: |
    where(source_json.type IN ["UnauthorizedAccess:EC2/TorClient", "UnauthorizedAccess:EC2/TorRelay", "UnauthorizedAccess:Runtime/TorClient", "UnauthorizedAccess:Runtime/TorRelay", "UnauthorizedAccess:Lambda/TorClient", "UnauthorizedAccess:Lambda/TorRelay"])
  crowdstrike: "#repo=guardduty \n| detail.type in [\"UnauthorizedAccess:EC2/TorClient\", \"UnauthorizedAccess:EC2/TorRelay\", \"UnauthorizedAccess:Runtime/TorClient\"\
    , \"UnauthorizedAccess:Runtime/TorRelay\", \"UnauthorizedAccess:Lambda/TorClient\", \"UnauthorizedAccess:Lambda/TorRelay\"]\n| table([@timestamp,\
    \ detail.type, detail.resource.resourceType, detail.resource.instanceDetails.instanceId, detail.resource.lambdaDetails.functionName, detail.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4,\
    \ detail.severity, detail.accountId, detail.region])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "AWS" and source = "guardduty"
    | filter event_type in ("UnauthorizedAccess:EC2/TorClient", "UnauthorizedAccess:EC2/TorRelay", "UnauthorizedAccess:Runtime/TorClient", "UnauthorizedAccess:Runtime/TorRelay", "UnauthorizedAccess:Lambda/TorClient", "UnauthorizedAccess:Lambda/TorRelay")
    | fields _time, event_type, resource_sub_type, identity_name, cloud_provider_account_id, raw_log
  lucene: |
    aws.guardduty.finding.type:("UnauthorizedAccess:EC2/TorClient" OR "UnauthorizedAccess:EC2/TorRelay" OR "UnauthorizedAccess:Runtime/TorClient" OR "UnauthorizedAccess:Runtime/TorRelay" OR "UnauthorizedAccess:Lambda/TorClient" OR "UnauthorizedAccess:Lambda/TorRelay")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("UnauthorizedAccess:EC2/TorClient", "UnauthorizedAccess:EC2/TorRelay", "UnauthorizedAccess:Runtime/TorClient", "UnauthorizedAccess:Runtime/TorRelay", "UnauthorizedAccess:Lambda/TorClient", "UnauthorizedAccess:Lambda/TorRelay")
    | json field=_raw "id" as finding_id
    | json field=_raw "severity" as severity
    | json field=_raw "region" as region
    | json field=_raw "resource.instanceDetails.instanceId" as instance_id
    | json field=_raw "resource.resourceType" as resource_type
    | json field=_raw "accountId" as account_id
    | fields _messageTime, event_type, finding_id, severity, region, instance_id, resource_type, account_id
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"UnauthorizedAccess:EC2/TorClient\", \"UnauthorizedAccess:EC2/TorRelay\", \"\
  UnauthorizedAccess:Runtime/TorClient\", \"UnauthorizedAccess:Runtime/TorRelay\", \"UnauthorizedAccess:Lambda/TorClient\", \"UnauthorizedAccess:Lambda/TorRelay\"\
  ]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000334
v4_id: '000334'
name: AWS TOR Network Activity - GuardDuty
description: Detects when EC2 instance is making connections to a Tor relay, Tor guard, or authority node. This could be indicative of a compromised
  EC2 acting as a client on a Tor network.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1090
technique_name: Proxy
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=guardduty sourcetype=aws:guardduty \n(type=\"UnauthorizedAccess:EC2/TorClient\" OR type=\"UnauthorizedAccess:EC2/TorRelay\" OR type=\"\
    UnauthorizedAccess:Runtime/TorClient\" OR type=\"UnauthorizedAccess:Runtime/TorRelay\" OR type=\"UnauthorizedAccess:Lambda/TorClient\" OR\
    \ type=\"UnauthorizedAccess:Lambda/TorRelay\")\n| table _time, type, accountId, region, resource.instanceDetails.instanceId, resource.resourceType,\
    \ severity, title, description\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "GuardDuty"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%GuardDuty%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_c2_000334 {\n  meta:\n    author = \"TDL\"\n    description = \"AWS TOR Network Activity - GuardDuty\"\n    severity =\
    \ \"LOW\"\n    tactic = \"TA0011\"\n    technique = \"T1090\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName\
    \ = /GuardDuty/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%GuardDuty%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/GuardDuty/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*GuardDuty*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "GuardDuty"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*GuardDuty*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*GuardDuty*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"UnauthorizedAccess:EC2/TorClient\", \"UnauthorizedAccess:EC2/TorRelay\", \"\
  UnauthorizedAccess:Runtime/TorClient\", \"UnauthorizedAccess:Runtime/TorRelay\", \"UnauthorizedAccess:Lambda/TorClient\", \"UnauthorizedAccess:Lambda/TorRelay\"\
  ]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

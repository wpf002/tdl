rule_id: TDL-C2-000339
v4_id: 000339
name: AWS DNS Request to DGA Domain - GuardDuty
description: Detects when an EC2 instance is attempting to query a domain generated algorithm (DGA) domain.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1568
technique_name: Dynamic Resolution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatchlogs:guardduty (type="Trojan:EC2/DGADomainRequest.B" OR type="Trojan:EC2/DGADomainRequest.C!DNS"
    OR type="Trojan:Runtime/DGADomainRequest.C!DNS")

    | table _time, accountId, region, type, resource.instanceDetails.instanceId, severity, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("Trojan:EC2/DGADomainRequest.B", "Trojan:EC2/DGADomainRequest.C!DNS", "Trojan:Runtime/DGADomainRequest.C!DNS")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(Resource).InstanceDetails.InstanceId), InstanceType = tostring(parse_json(Resource).InstanceDetails.InstanceType)
  aql: |
    SELECT QIDNAME(qid) AS event_name, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, "findingType" AS finding_type, "instanceId" AS instance_id, "resourceType" AS resource_type, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND ("findingType" IN ('Trojan:EC2/DGADomainRequest.B', 'Trojan:EC2/DGADomainRequest.C!DNS', 'Trojan:Runtime/DGADomainRequest.C!DNS')
           OR "findingType" ILIKE '%DGADomainRequest%')
    GROUP BY QIDNAME(qid), sourceip, destinationip, username, LOGSOURCENAME(logsourceid), "findingType", "instanceId", "resourceType"
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_dga_domain_requests {
      meta:
        author = "TDL"
        description = "Detects DGA domain requests via AWS GuardDuty findings - T1568"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1568"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "Trojan:EC2/DGADomainRequest.B" or
          $e.metadata.product_event_type = "Trojan:EC2/DGADomainRequest.C!DNS" or
          $e.metadata.product_event_type = "Trojan:Runtime/DGADomainRequest.C!DNS"
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.guardduty*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.type IN (\"Trojan:EC2/DGADomainRequest.B\", \"Trojan:EC2/DGADomainRequest.C!DNS\"\
    , \"Trojan:Runtime/DGADomainRequest.C!DNS\")\n| KEEP @timestamp, cloud.account.id, cloud.instance.id, event.type, event.severity, source.ip,\
    \ destination.domain, event.id\n"
  leql: |
    where(source_json.type IN ["Trojan:EC2/DGADomainRequest.B", "Trojan:EC2/DGADomainRequest.C!DNS", "Trojan:Runtime/DGADomainRequest.C!DNS"])
  crowdstrike: "#repo=* #type=guardduty event_simpleName=GuardDutyFinding \n(detail.type=\"Trojan:EC2/DGADomainRequest.B\" OR detail.type=\"Trojan:EC2/DGADomainRequest.C!DNS\"\
    \ OR detail.type=\"Trojan:Runtime/DGADomainRequest.C!DNS\")\n| table([@timestamp, detail.type, detail.resource.instanceDetails.instanceId,\
    \ detail.severity, detail.title, detail.description])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "Amazon" and event_source = "guardduty.amazonaws.com"
    | filter json_extract_scalar(raw_log, "$.type") in ("Trojan:EC2/DGADomainRequest.B", "Trojan:EC2/DGADomainRequest.C!DNS", "Trojan:Runtime/DGADomainRequest.C!DNS")
    | fields _time, cloud_provider, resource_name, resource_type, json_extract_scalar(raw_log, "$.type") as finding_type, json_extract_scalar(raw_log, "$.severity") as severity, json_extract_scalar(raw_log, "$.title") as title, json_extract_scalar(raw_log, "$.description") as description
  lucene: |
    event.type:"guardduty" AND (finding.type:"Trojan:EC2/DGADomainRequest.B" OR finding.type:"Trojan:EC2/DGADomainRequest.C!DNS" OR finding.type:"Trojan:Runtime/DGADomainRequest.C!DNS")
  sumo: |
    _sourceCategory=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Trojan:EC2/DGADomainRequest.B", "Trojan:EC2/DGADomainRequest.C!DNS", "Trojan:Runtime/DGADomainRequest.C!DNS")
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Trojan:EC2/DGADomainRequest.B\", \"Trojan:EC2/DGADomainRequest.C!DNS\", Trojan:Runtime/DGADomainRequest.C!DNS]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

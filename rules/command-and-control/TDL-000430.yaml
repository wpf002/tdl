  yara_l: |
    rule apt_malicious_user_agents {
      meta:
        author = "TDL"
        description = "Detects APT-associated user agents in forward proxy traffic - T1071"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        (
          $e.network.http.user_agent = "sjzj (compatible; msie 6.0; win32)" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 6.; wow64; rv:20.0) gecko/20100101 firefox/20.0" or
          $e.network.http.user_agent = "user-agent: mozilla/4.0 (compatible; msie 8.0; windows nt 6.1; trident/4.0; slcc" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 7.4; win32;32-bit)" or
          $e.network.http.user_agent = "webclient" or
          $e.network.http.user_agent = "mozilla/5.0 (windows; u; windows nt 5.1; zh-en; rv:1.7.12) gecko/200" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msi 6.0;" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 6.3; wow64; rv:28.0) gecko/20100101 firefox/28.0" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 6.2; wow64; rv:20.0) gecko/20100101 firefox/" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 6.; wow64; rv:20.0) gecko/20100101 firefox/2" or
          $e.network.http.user_agent = "mozilla/4.0" or
          $e.network.http.user_agent = "netscape" or
          $e.network.http.user_agent = "mozilla/5.0 (windows; u; windows nt 5.1; zh-en; rv:1.7.12) gecko/20100719 firefox/1.0.7" or
          $e.network.http.user_agent = "mozilla/5.0 (windows; u; windows nt 5.1; en-us; rv:1.9.2.13) firefox/3.6.13 gtb7.1" or
          $e.network.http.user_agent = "mozilla/5.0 (compatible; msie 9.0; windows nt 6.1; wow64; trident/5.0)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 8.0; windows nt 6.1; wow64; trident/4.0; slcc2; .netclr 2.0.50727)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 8.0; windows nt 6.0; sv1)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 11.0; windows nt 6.1; sv1)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 8.0; win32)" or
          $e.network.http.user_agent = "mozilla v5.1 (windows nt 6.1; rv:6.0.1) gecko/20100101 firefox/6.0.1" or
          $e.network.http.user_agent = "mozilla/6.1 (compatible; msie 9.0; windows nt 5.3; trident/5.0)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 6.0; windows nt 5.1; sv1; .net clr 1.1.4322; .net clr 2.0.50727; .net clr 3.0.04506.30; .net clr 3.0.04506.648; infopath.1)" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 6.1; wow64) winhttp/1.6.3.8 (winhttp/5.1) like gecko" or
          $e.network.http.user_agent = "mozilla v5.1 " or
          $e.network.http.user_agent = "msie 8.0" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 7.0; windows nt 6.1; slcc2; .net clr 2.0.50727; .net clr 3.5.30729; .net clr 3.0.30729; media center pc 6.0; .net4.0c; .net4.0e; infopath.2)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; rms)" or
          $e.network.http.user_agent = "mozilla/4.0 (compatible; msie 6.0; dyngate)" or
          $e.network.http.user_agent = "o/9.27 (w; u; z)" or
          $e.network.http.user_agent = "mozilla/5.0 (compatible; msie 9.0; windows nt 6.0; trident/5.0;  trident/5.0" or
          $e.network.http.user_agent = "mozilla/5.0 (windows nt 9; " or
          $e.network.http

rule_id: TDL-C2-000431
v4_id: '000431'
name: Bitsadmin to Uncommon TLD
description: Detects Bitsadmin connections to domains with uncommon TLDs
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=proxy sourcetype=proxy* user_agent=\"*microsoft bits/*\" \n| search NOT (fqdn=\"*.com\" OR fqdn=\"*.net\" OR fqdn=\"*.org\" OR fqdn=\"\
    *scdn.co\" OR fqdn=\"*sfx.ms\")\n| table _time, src_ip, user, fqdn, url, user_agent, bytes_out, bytes_in\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has "Proxy" or DeviceProduct has "Proxy"
    | where RequestURL has "microsoft bits/"
    | extend fqdn = tolower(extract(@"([^/]+)", 1, replace_regex(RequestURL, @"^https?://", "")))
    | where fqdn !contains ".com" and fqdn !contains ".net" and fqdn !contains ".org" and fqdn !contains "scdn.co" and fqdn !contains "sfx.ms"
    | project TimeGenerated, SourceIP, DestinationIP, RequestURL, fqdn, SourceUserName, DeviceAction
  aql: "SELECT username, destinationip, \"User Agent\", \"Requested URL\", COUNT(*) AS hits\nFROM events\nWHERE LOWER(\"User Agent\") LIKE '%microsoft\
    \ bits/%'\n  AND (\"Requested URL\" NOT ILIKE '%.com%' \n       AND \"Requested URL\" NOT ILIKE '%.net%'\n       AND \"Requested URL\" NOT\
    \ ILIKE '%.org%'\n       AND \"Requested URL\" NOT ILIKE '%scdn.co%'\n       AND \"Requested URL\" NOT ILIKE '%sfx.ms%')\nGROUP BY username,\
    \ destinationip, \"User Agent\", \"Requested URL\"\nLAST 24 HOURS\n"
  yara_l: |
    rule mitre_t1078_suspicious_bits_useragent {
      meta:
        author = "TDL"
        description = "Detects BITS transfers to non-standard domains - potential C2"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.network.direction = "OUTBOUND"
        re.regex($e.network.http.user_agent, `(?i)microsoft\s+bits/`)
        not re.regex($e.target.url, `(?i)\.(com|net|org)(/|$)`)
        not re.regex($e.target.url, `(?i)\.scdn\.co(/|$)`)
        not re.regex($e.target.url, `(?i)\.sfx\.ms(/|$)`)
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 5m

      outcome:
        $risk_score = 65

      condition:
        $e
    }
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 24 hour
      AND TO_LOWER(user_agent.original) LIKE "*microsoft bits/*"
      AND NOT (
        destination.domain RLIKE ".*\\.(com|net)$"
        OR destination.domain RLIKE ".*\\.org$"
        OR destination.domain LIKE "*scdn.co*"
        OR destination.domain LIKE "*sfx.ms*"
      )
    | KEEP @timestamp, host.name, user.name, user_agent.original, destination.domain, url.full, source.ip, destination.ip
  leql: |
    where(user_agent ICONTAINS "microsoft bits/" AND NOT (fqdn ICONTAINS ".com" OR fqdn ICONTAINS ".net" OR fqdn ICONTAINS ".org" OR fqdn ICONTAINS "scdn.co" OR fqdn ICONTAINS "sfx.ms"))
  crowdstrike: "#type=http_proxy UserAgent=*microsoft?bits/* \n| !match(field=fqdn, regex=\"\\.(com|net|org|scdn\\.co|sfx\\.ms)$\")\n| table([@timestamp,\
    \ ComputerName, UserName, fqdn, UserAgent, RemoteIP])\n"
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter app = "web-browsing" and http_user_agent contains "microsoft bits/"
    | filter dst_host !~= ".*\\.(com|net|org|scdn\\.co|sfx\\.ms)$"
    | fields _time, src_user, src_ip, dst_host, http_user_agent, action
  lucene: |
    user_agent:*microsoft\ bits/* AND NOT fqdn:(*com OR *net OR *org OR *scdn.co OR *sfx.ms)
  sumo: |
    _sourceCategory=*Proxy* "microsoft bits/"
    | parse regex "(?i)user-agent:\s*(?<user_agent>[^\r\n]+)" nodrop
    | parse regex "(?<fqdn>[a-zA-Z0-9][-a-zA-Z0-9]*(\.[a-zA-Z0-9][-a-zA-Z0-9]*)+)" nodrop
    | where user_agent matches "*microsoft bits/*"
    | where !(fqdn matches "*.com" or fqdn matches "*.net" or fqdn matches "*.org" or fqdn matches "*scdn.co*" or fqdn matches "*sfx.ms*")
    | fields _messageTime, _sourceHost, user_agent, fqdn
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Outbound Forward Proxy event\nWhere User Agent contains \"\"microsoft bits/\"\n     AND NOT where fqdn contains (com|net \n \
  \         OR org \n          OR scdn.co \n          OR sfx.ms)"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

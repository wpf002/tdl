rule_id: TDL-C2-000437
v4_id: '000437'
name: Empire UserAgent URI Combo
description: Detects user agent and URI paths used by empire agents
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol="*tcp*"

    | stats count dc(dest_ip) as unique_dests sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(24h)\n| where DeviceVendor has_any (\"Proxy\", \"Firewall\") or DeviceProduct has_any (\"\
    Proxy\", \"Firewall\", \"IDS\", \"IPS\")\n| where Protocol has \"tcp\"\n| summarize \n    connection_count = count(),\n    unique_dests =\
    \ dcount(DestinationIP),\n    total_bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort\n| where connection_count\
    \ >= 1\n| sort by total_bytes_out desc\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_dests, SUM(bytesout) AS total_bytes_out
    FROM flows
    WHERE LOWER(protocolname) LIKE '%tcp%'
    GROUP BY sourceip, destinationip, destinationport
    HAVING connection_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule empire_c2_network_traffic {
      meta:
        author = "Detection Engineering"
        description = "Detects network traffic matching Empire C2 agent characteristics"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "High"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        re.regex($e.metadata.product_name, `(?i)(firewall|ids|proxy)`)
        re.regex($e.network.ip_protocol, `(?i)tcp`)
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port
        $e.network.sent_bytes > 0

      match:
        $src_ip, $dest_ip, $dest_port over 1h

      outcome:
        $risk_score = max(75)
        $total_bytes_out = sum($e.network.sent_bytes)
        $connection_count = count_distinct($e.metadata.id)
        $unique_dest_count = count_distinct($dest_ip)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-network.firewall*, logs-network.ids*
    | WHERE network.protocol LIKE "*tcp*"
    | STATS count = COUNT(*), unique_dests = COUNT_DISTINCT(destination.ip), bytes_out = SUM(network.bytes_sent) BY source.ip, destination.ip, destination.port
    | WHERE count >= 1
    | SORT bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, count, unique_dests, bytes_out
  leql: |
    where(source_json.protocol ICONTAINS "tcp") groupby(source_address, destination_address, destination_port) calculate(count), calculate(unique:destination_address), calculate(sum:bytes_out)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=*tcp*
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | count >= 1
    | sort(total_bytes_out, order=desc, limit=10000)
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter proto = 6
    | comp count() as conn_count, count_distinct(dst) as unique_dests, sum(bytes_sent) as total_bytes_out by src, dst, dport
    | filter conn_count >= 1
    | sort desc total_bytes_out
    | fields src, dst, dport, conn_count, unique_dests, total_bytes_out
  lucene: |
    (sourcetype:firewall OR sourcetype:ids) AND network.protocol:*tcp*
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol matches "*tcp*"
    | count as conn_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes by src_ip, dest_ip, dest_port
    | where conn_count >= 1
    | sort by total_bytes desc
    | fields src_ip, dest_ip, dest_port, conn_count, unique_dests, total_bytes
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any observed window of network traffic matching Empire C2 agent characteristics.


  From index=network

  Where sourcetype is firewall or sourcetype is ids

  With network.protocol matching "*tcp*"


  Aggregate count of connections, count of distinct dest_ip values (unique_dests), and sum of bytes_out grouped by src_ip, dest_ip, and dest_port.


  Where count is greater than or equal to 1.


  Results sorted descending by bytes_out to surface highest-volume Empire agent activity first.


  With the same src_ip, dest_ip, and dest_port as the correlation key.'

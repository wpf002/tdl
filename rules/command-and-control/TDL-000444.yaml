rule_id: TDL-C2-000444
v4_id: '000444'
name: Internal IDS Detection
description: Detects and tracks internal IDS detections
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp

    | stats count dc(dest_ip) as unique_dest_ips sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    '
  kql: "CommonSecurityLog\n| where DeviceVendor has_any (\"firewall\", \"IDS\", \"IPS\") or DeviceProduct has_any (\"firewall\", \"IDS\", \"IPS\"\
    )\n| where Protocol =~ \"tcp\" or toupper(Protocol) == \"TCP\" or ApplicationProtocol =~ \"tcp\"\n| summarize \n    event_count = count(),\n\
    \    unique_dest_ips = dcount(DestinationIP),\n    total_bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort\n| where\
    \ event_count >= 1\n| sort by total_bytes_out desc\n| project SourceIP, DestinationIP, DestinationPort, event_count, unique_dest_ips, total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS event_count, UNIQUECOUNT(destinationip) AS unique_dest_ips, SUM(destinationbytes) AS bytes_out FROM events WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%firewall%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%IDS%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%IPS%' OR categoryname(category) ILIKE '%intrusion%' OR categoryname(category) ILIKE '%firewall%') AND protocolid = 6 GROUP BY sourceip, destinationip, destinationport HAVING event_count >= 1 ORDER BY bytes_out DESC LAST 24 HOURS
  yara_l: |
    rule mitre_t1078_tcp_network_activity {
      meta:
        author = "Detection Engineer"
        description = "Detects TCP network activity from IDS/IPS or firewall events - MITRE T1078"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        (
          $e.metadata.product_name = "firewall" or
          $e.metadata.product_name = "ids" or
          $e.metadata.product_name = "ips" or
          re.regex($e.metadata.vendor_name, `(?i)(firewall|ids|ips)`) or
          re.regex($e.metadata.product_name, `(?i)(firewall|ids|ips)`)
        )
        re.regex($e.network.ip_protocol, `(?i)tcp`) or $e.network.ip_protocol = "TCP"
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port

      match:
        $src_ip, $dest_ip, $dest_port over 1h

      outcome:
        $risk_score = max(35)
        $total_events = count_distinct($e.metadata.id)
        $unique_dest_ips = count_distinct($e.target.ip)
        $total_bytes_out = sum($e.network.sent_bytes)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-network.ids*, logs-network.firewall*, logs-network*
    | WHERE network.transport == "tcp" OR TO_LOWER(network.protocol) == "tcp"
    | STATS event_count = COUNT(*), unique_dest_ips = COUNT_DISTINCT(destination.ip), total_bytes_out = SUM(source.bytes) BY source.ip, destination.ip, destination.port
    | WHERE event_count >= 1
    | SORT total_bytes_out DESC
  leql: |
    where(source_json.protocol ICONTAINS "tcp") groupby(source_address, destination_address, destination_port) calculate(count, unique:destination_address)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=*tcp*
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_dest_ips), sum(bytes_out, as=total_bytes_out)])
    | event_count >= 1
    | sort(field=total_bytes_out, order=desc, limit=10000)
    | table([src_ip, dest_ip, dest_port, event_count, unique_dest_ips, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter protocol = "tcp"
    | comp count() as event_count, count_distinct(dest_ip) as unique_dest_ips, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | filter event_count >= 1
    | sort desc total_bytes_out
  lucene: |
    (sourcetype:firewall OR sourcetype:ids) AND network.protocol:tcp
  sumo: |
    _sourceCategory=*network* AND (_source=*firewall* OR _source=*ids* OR _source=*ips*)
    | where protocol = "tcp" OR protocol = "TCP"
    | count as event_count, count_distinct(dest_ip) as unique_destinations, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | where event_count >= 1
    | sort by total_bytes_out desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any observed window of an IDS/IPS or firewall network event using TCP protocol.


  From index=network with sourcetype of firewall or ids

  Where network.protocol contains "tcp"

  With a count of events per source and destination pair of at least 1

  With statistics tracking total event count, number of unique destination IPs, and total bytes_out calculated per src_ip, dest_ip, and dest_port
  combination

  With results sorted in descending order by bytes_out to surface highest-volume connections first

  With the same src_ip, dest_ip, and dest_port as the correlation key'

author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance over any time window of a network connection observed via firewall or IDS/IPS telemetry.


  From index=network where sourcetype is firewall or sourcetype is ids

  Where network.protocol contains "tcp"

  With fields src_ip, dest_ip, dest_port, bytes_out tracked across connections

  With count of connection events greater than or equal to 1 per src_ip and dest_ip and dest_port combination

  With unique count of dest_ip values and total sum of bytes_out calculated per grouping

  With results sorted descending by bytes_out to surface highest-volume connections first

  With known authorized scanner source IPs and monitoring agent source IPs excluded from alerting

  With the same src_ip, dest_ip, and dest_port as the correlation key'

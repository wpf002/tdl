rule_id: TDL-C2-000446
v4_id: '000446'
name: Malware User Agent
description: Detects when there is a malicious file seen by the IDS/IPS tool
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) network.protocol="*tcp*" NOT (src_ip IN ("10.0.0.100", "10.0.0.101", "192.168.1.50"))

    | stats count dc(dest_ip) as unique_destinations sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    '
  kql: "CommonSecurityLog\n| where DeviceVendor has_any (\"Palo Alto\", \"Fortinet\", \"Cisco\", \"Check Point\", \"Zscaler\", \"Barracuda\",\
    \ \"SonicWall\", \"WatchGuard\", \"Sophos\", \"McAfee\") or DeviceProduct has_any (\"Firewall\", \"IDS\", \"IPS\", \"Proxy\", \"ASA\", \"\
    FortiGate\", \"NGFW\")\n| where Protocol =~ \"tcp\" or toupper(Protocol) == \"TCP\" or ApplicationProtocol =~ \"tcp\"\n| where SourceIP !in\
    \ (\"10.0.0.100\", \"10.0.0.101\", \"192.168.1.50\", \"172.16.0.10\")\n| extend BytesOut = coalesce(SentBytes, BytesSent, 0)\n| summarize\
    \ \n    ConnectionCount = count(),\n    UniqueDestinations = dcount(DestinationIP),\n    TotalBytesOut = sum(BytesOut),\n    FirstSeen = min(TimeGenerated),\n\
    \    LastSeen = max(TimeGenerated)\n    by SourceIP, DestinationIP, DestinationPort\n| where ConnectionCount >= 1\n| sort by TotalBytesOut\
    \ desc\n| project TimeGenerated = FirstSeen, SourceIP, DestinationIP, DestinationPort, ConnectionCount, UniqueDestinations, TotalBytesOut,\
    \ LastSeen\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_destinations, SUM(sourcelastpackettime - sourcefirstpackettime) AS total_bytes_approx
    FROM flows
    WHERE PROTOCOLNAME(protocolid) = 'TCP'
      AND sourceip NOT IN ('10.0.0.100', '10.0.0.101', '192.168.1.50')
    GROUP BY sourceip, destinationip, destinationport
    HAVING connection_count >= 1
    ORDER BY total_bytes_approx DESC
    LAST 24 HOURS
  yara_l: "rule t1071_application_layer_protocol_network_connection {\n  meta:\n    author = \"TDL\"\n    description = \"Detects network connections\
    \ via proxy/firewall for C2 (T1071)\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"T1071\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    (\n      $e.metadata.product_log_id = \"firewall\"\
    \ or\n      $e.metadata.product_log_id = \"ids\" or\n      $e.metadata.product_log_id = \"ips\"\n    )\n    $e.network.ip_protocol = \"TCP\"\
    \n    $e.principal.ip = $src_ip\n    $e.target.ip = $dest_ip\n    $e.target.port = $dest_port\n    not (\n      $src_ip = \"10.0.0.100\" or\n\
    \      $src_ip = \"10.0.0.101\" or\n      $src_ip = \"192.168.1.50\"\n    )\n    \n  match:\n    $src_ip, $dest_ip, $dest_port over 24h\n\
    \    \n  outcome:\n    $risk_score = max(35)\n    $unique_dest_ips = count_distinct($dest_ip)\n    $total_bytes_out = sum($e.network.sent_bytes)\n\
    \    \n  condition:\n    #e >= 1\n}\n"
  esql: "FROM logs-network* \n| WHERE @timestamp > NOW() - 24 hour \n  AND event.dataset IN (\"firewall\", \"ids\", \"ips\") \n  AND network.protocol\
    \ == \"tcp\"\n  AND source.ip NOT IN (\"10.0.0.100\", \"10.0.0.101\", \"172.16.0.50\")\n| STATS \n    connection_count = COUNT(*), \n    unique_destinations\
    \ = COUNT_DISTINCT(destination.ip),\n    total_bytes_out = SUM(source.bytes)\n  BY source.ip, destination.ip, destination.port\n| WHERE connection_count\
    \ >= 1\n| SORT total_bytes_out DESC\n| KEEP source.ip, destination.ip, destination.port, connection_count, unique_destinations, total_bytes_out\n"
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND source_address NOT IN ["10.0.1.50", "10.0.1.51", "172.16.2.100"]) groupby(source_address, destination_address, destination_port) calculate(count, unique:destination_address, sum:bytes_out)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=*tcp* NOT (src_ip IN [10.0.0.50, 10.0.0.51, 172.16.1.100])
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=conn_count), count(dest_ip, distinct=true, as=unique_dest_ips), sum(bytes_out, as=total_bytes_out)])
    | conn_count >= 1
    | sort(field=total_bytes_out, order=desc, limit=10000)
    | table([src_ip, dest_ip, dest_port, conn_count, unique_dest_ips, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_networking_protocol = "tcp"
    | filter action_source_ip != "10.0.0.100" and action_source_ip != "10.0.0.101" and action_source_ip != "192.168.1.50"
    | comp count() as connection_count, count_distinct(action_destination_ip) as unique_destinations, sum(action_upload_bytes) as total_bytes_out by action_source_ip, action_destination_ip, action_destination_port
    | filter connection_count >= 1
    | sort desc total_bytes_out
    | fields action_source_ip, action_destination_ip, action_destination_port, connection_count, unique_destinations, total_bytes_out
  lucene: |
    sourcetype:(firewall OR ids) AND network.protocol:tcp AND NOT src_ip:(known_scanner_ip OR monitoring_agent_ip)
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | json field=_raw "protocol" as protocol
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "bytes_out" as bytes_out
    | where protocol matches "*tcp*"
    | where !(src_ip in ("10.0.0.100", "10.0.0.101", "192.168.1.50"))
    | count as connection_count, count_distinct(dest_ip) as unique_destinations, sum(bytes_out) as total_bytes by src_ip, dest_ip, dest_port
    | where connection_count >= 1
    | sort by total_bytes desc
    | fields src_ip, dest_ip, dest_port, connection_count, unique_destinations, total_bytes
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net

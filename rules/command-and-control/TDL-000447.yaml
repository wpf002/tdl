rule_id: TDL-C2-000447
v4_id: '000447'
name: Outbound IDS Detection
description: Detects and tracks outbound IDS detections
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp

    | stats count dc(dest_ip) as unique_dests sum(bytes_out) as bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where DeviceVendor has_any (\"Firewall\", \"IDS\") or DeviceProduct has_any (\"\
    Firewall\", \"IDS\")\n| where Protocol =~ \"TCP\"\n| summarize \n    event_count = count(),\n    unique_dests = dcount(DestinationIP),\n \
    \   bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort\n| where event_count >= 1\n| sort by bytes_out desc\n| project\
    \ SourceIP, DestinationIP, DestinationPort, event_count, unique_dests, bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) as event_count, UNIQUECOUNT(destinationip) as unique_dests, SUM(sourcebytes) as bytes_out
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%firewall%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%ids%')
      AND protocolid = 6
    GROUP BY sourceip, destinationip, destinationport
    HAVING event_count >= 1
    ORDER BY bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule c2_network_connection_t1078 {
      meta:
        author = "Detection Engineer"
        description = "Command and Control - Valid Accounts - Outbound network connection from firewall/IDS"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.network.ip_protocol = "TCP"
        (
          $e.metadata.product_name = "firewall" or
          $e.metadata.product_name = "ids"
        )
        $e.network.direction = "OUTBOUND"
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port
        $e.network.sent_bytes > 0

      match:
        $src_ip, $dest_ip, $dest_port over 24h

      outcome:
        $bytes_out = max($e.network.sent_bytes)
        $risk_score = max(35)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-network*
    | WHERE @timestamp > NOW() - 24 hours AND (event.dataset LIKE "*firewall*" OR event.dataset LIKE "*ids*") AND network.protocol == "tcp"
    | STATS event_count = COUNT(*), unique_dests = COUNT_DISTINCT(destination.ip), bytes_out = SUM(destination.bytes) BY source.ip, destination.ip, destination.port
    | WHERE event_count >= 1
    | SORT bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, event_count, unique_dests, bytes_out
  leql: |
    where(source_json.protocol ICONTAINS "tcp") groupby(source_address, destination_address, destination_port) calculate(count), calculate(sum:bytes_out)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=*tcp*
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | event_count >= 1
    | sort(total_bytes_out, order=desc)
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter lowercase(proto) = "tcp"
    | comp count() as event_count, count_distinct(dst_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dst_ip, dst_port
    | filter event_count >= 1
    | sort desc total_bytes_out
    | fields src_ip, dst_ip, dst_port, event_count, unique_dests, total_bytes_out
  lucene: |
    (sourcetype:firewall OR sourcetype:ids) AND network.protocol:tcp
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol="tcp" OR protocol="TCP"
    | count as event_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | where event_count >= 1
    | sort by total_bytes_out desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance over any time window of an outbound IDS or firewall network event.


  From index=network where sourcetype is firewall or sourcetype is ids

  Where network.protocol contains "tcp"

  With count of events grouped by src_ip, dest_ip, and dest_port is greater than or equal to 1

  With distinct count of dest_ip as unique_dests and sum of bytes_out calculated per src_ip, dest_ip, and dest_port grouping

  With results sorted descending by bytes_out to surface highest-volume connections first


  With the same src_ip, dest_ip, and dest_port'

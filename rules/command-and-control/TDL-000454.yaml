rule_id: TDL-C2-000454
v4_id: '000454'
name: Suspicious Base64 Encoded User-Agent
description: Detects suspicious encoded User-Agent strings, as seen used by some malware.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp http_user_agent=*

    | regex http_user_agent="(?i)^[A-Za-z0-9+/]{20,}={0,2}$"

    | stats count as connection_count, dc(dest_ip) as unique_dests, sum(bytes_out) as bytes_out by src_ip, dest_ip, dest_port

    | where connection_count >= 1 AND NOT (src_ip IN ("10.0.0.5", "192.168.1.100") OR http_user_agent="*monitoring*" OR http_user_agent="*scanner*")

    | sort - bytes_out

    | table src_ip, dest_ip, dest_port, connection_count, unique_dests, bytes_out

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has_any ("Proxy", "Firewall", "IDS") or DeviceProduct has_any ("Proxy", "Firewall", "IDS")
    | where ApplicationProtocol =~ "tcp" or Protocol =~ "TCP"
    | where RequestClientApplication matches regex @"^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$" and strlen(RequestClientApplication) >= 20
    | where SourceIP !in ("10.0.0.50", "10.0.0.51", "192.168.1.100")
    | where RequestClientApplication !has_any ("scanner", "monitor", "agent", "splunk", "datadog")
    | summarize connection_count = count(), unique_dests = dcount(DestinationIP), total_bytes_out = sum(SentBytes) by SourceIP, DestinationIP, DestinationPort, RequestClientApplication
    | where connection_count >= 1
    | sort by total_bytes_out desc
    | project TimeGenerated = now(), SourceIP, DestinationIP, DestinationPort, RequestClientApplication, connection_count, unique_dests, total_bytes_out
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_dests, SUM(bytesout) AS total_bytes_out, "User Agent" AS user_agent
    FROM flows
    WHERE LOWER(protocolname(protocolid)) = 'tcp'
      AND "User Agent" IS NOT NULL
      AND ("User Agent" MATCHES '.*[A-Za-z0-9+/]{20,}={0,2}.*' OR "User Agent" MATCHES '.*(eyJ|YmF|dGVz|aHR0|bW96|d2lu)[A-Za-z0-9+/=]{10,}.*')
      AND sourceip NOT IN ('10.0.0.5','192.168.1.100','172.16.0.50')
      AND "User Agent" NOT ILIKE '%monitoring%'
      AND "User Agent" NOT ILIKE '%scanner%'
    GROUP BY sourceip, destinationip, destinationport, "User Agent"
    HAVING connection_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule suspicious_base64_useragent_c2 {
      meta:
        author = "TDL"
        description = "Detects suspicious Base64 encoded User-Agent strings in network connections indicating potential C2 communication (T1071)"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.network.ip_protocol = "TCP"
        re.regex($e.network.http.user_agent, `(?i)^[A-Za-z0-9+/]{20,}={0,2}$`) or
        re.regex($e.network.http.user_agent, `(?i)(TVqQAAMAAAAEAAAA|4D5A9000|TVpQAAIAAAAEAA8A|TVoAAAAAAAAAAAAA|TVpTAQEAAAAEAAAA)`)
        not re.regex($e.principal.ip, `(10\.0\.0\.1|192\.168\.1\.100|172\.16\.0\.50)`)
        not re.regex($e.network.http.user_agent, `(?i)(monitoring|scanner|agent|nessus|qualys)`)
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port

      match:
        $src_ip, $dest_ip, $dest_port over 5m

      outcome:
        $risk_score = max(75)
        $total_connections = count_distinct($e.metadata.id)
        $unique_destinations = count_distinct($dest_ip)
        $total_bytes_out = sum($e.network.sent_bytes)

      condition:
        #e >= 1
    }
  esql: "FROM logs-network*\n| WHERE @timestamp > NOW() - 24 hours \n  AND network.protocol == \"tcp\"\n  AND http.request.headers.user-agent\
    \ IS NOT NULL\n  AND (\n    http.request.headers.user-agent RLIKE \".*[A-Za-z0-9+/]{20,}={0,2}.*\"\n    OR http.request.headers.user-agent\
    \ RLIKE \".*(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?.*\"\n  )\n  AND NOT source.ip IN (\"10.0.0.50\", \"10.0.0.51\"\
    , \"192.168.1.100\")\n  AND NOT http.request.headers.user-agent LIKE \"*scanner*\"\n  AND NOT http.request.headers.user-agent LIKE \"*monitor*\"\
    \n| STATS \n    connection_count = COUNT(*),\n    unique_dests = COUNT_DISTINCT(destination.ip),\n    bytes_out = SUM(source.bytes)\n  BY\
    \ source.ip, destination.ip, destination.port\n| WHERE connection_count >= 1\n| SORT bytes_out DESC\n| KEEP source.ip, destination.ip, destination.port,\
    \ connection_count, unique_dests, bytes_out\n"
  leql: |
    where(source_json.http_user_agent=/^[A-Za-z0-9+\/=]{20,}$/ AND proxy_action!=BLOCKED) groupby(source_address, destination_address, destination_port) calculate(count)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=tcp http.user_agent=/^(?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{2}==|[A-Za-z0-9+\/]{3}=)?$/
    | regex("(?<b64_ua>.+)", field=http.user_agent)
    | not (src_ip IN ["10.0.0.100", "10.0.0.101"] OR http.user_agent IN ["monitoring_agent", "authorized_scanner"])
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=conn_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | conn_count >= 1
    | sort(total_bytes_out, reverse=true)
    | table([src_ip, dest_ip, dest_port, conn_count, unique_dests, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter proto = "tcp" and http_user_agent != null and http_user_agent ~= "[A-Za-z0-9+/]{20,}={0,2}"
    | filter src_ip not in ("10.0.0.50", "10.0.0.51", "192.168.1.100") and http_user_agent not contains "monitoring-agent"
    | comp count() as connection_count, count_distinct(dst_ip) as unique_dests, sum(bytes_sent) as bytes_out by src_ip, dst_ip, dst_port
    | filter connection_count >= 1
    | sort desc bytes_out
    | fields src_ip, dst_ip, dst_port, connection_count, unique_dests, bytes_out
  lucene: |
    network.protocol:tcp AND http.request.headers.user-agent:/.*[A-Za-z0-9+\/]{20,}={0,2}.*/ AND NOT (src_ip:(10.0.1.50 OR 10.0.1.51) OR http.request.headers.user-agent:(*scanner* OR *monitoring* OR *nagios* OR *zabbix*))
  sumo: |
    _sourceCategory=*Proxy* OR _sourceCategory=*Firewall*
    | json field=_raw "user_agent" as user_agent
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "bytes_out" as bytes_out
    | json field=_raw "protocol" as protocol
    | where protocol matches "*tcp*" and (user_agent matches "*[A-Za-z0-9+/]{20,}={0,2}*" or user_agent matches regex "[A-Za-z0-9+/]{40,}={0,2}")
    | where !(src_ip in ("10.0.0.100", "192.168.1.50"))
    | where !(user_agent matches "*monitoring*" or user_agent matches "*agent*")
    | count as connection_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | where connection_count >= 1
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, dest_port, connection_count, unique_dests, total_bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any observation window of a network connection event with suspicious Base64 encoded User-Agent string activity.


  From index=network with sourcetype of firewall or sourcetype of ids

  Where network.protocol contains "tcp"

  With a connection count of at least 1 per source and destination pairing

  With metrics aggregated including total connection count, count of distinct dest_ip values as unique_dests, and sum of bytes_out per src_ip,
  dest_ip, and dest_port combination

  With results sorted descending by bytes_out to surface highest-volume suspicious activity first

  With known authorized scanner source IPs and monitoring agent identifiers excluded from alerting

  With the same src_ip, dest_ip, and dest_port as the correlation key'

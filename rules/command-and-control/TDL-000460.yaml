rule_id: TDL-C2-000460
v4_id: '000460'
name: Web Request to DGA Domain
description: Detects a web request to a DGA domain
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) network.protocol="*tcp*"

    | stats count as connection_count sum(bytes_out) as total_bytes_out dc(dest_ip) as unique_dests by src_ip, dest_ip, dest_port

    | where connection_count >= 1

    | sort - total_bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(1h)\n| where DeviceVendor has_any (\"Proxy\", \"Firewall\", \"IDS\") or DeviceProduct has_any\
    \ (\"Proxy\", \"Firewall\", \"Web\")\n| where ApplicationProtocol =~ \"tcp\" or Protocol =~ \"TCP\"\n| where isnotempty(DestinationHostName)\n\
    | extend domain = tolower(DestinationHostName)\n| extend domain_parts = split(domain, \".\")\n| extend tld = tostring(domain_parts[-1])\n\
    | extend sld = tostring(domain_parts[-2])\n| extend label_count = array_length(domain_parts)\n| extend sld_length = strlen(sld)\n| extend\
    \ entropy = log2(sld_length) * -1.0\n| extend consonant_ratio = toreal(countof(sld, \"[bcdfghjklmnpqrstvwxyz]\", \"regex\")) / toreal(sld_length)\n\
    | extend digit_ratio = toreal(countof(sld, \"[0-9]\", \"regex\")) / toreal(sld_length)\n| where sld_length >= 10\n| where entropy < -2.5 or\
    \ consonant_ratio > 0.7 or digit_ratio > 0.3\n| summarize \n    connection_count = count(),\n    unique_dests = dcount(DestinationIP),\n \
    \   total_bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort, DestinationHostName\n| where connection_count >= 1\n\
    | sort by total_bytes_out desc\n| project TimeGenerated = now(), SourceIP, DestinationIP, DestinationPort, DestinationHostName, connection_count,\
    \ unique_dests, total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) as connection_count, SUM(sourcelastpacketsize) as bytes_out FROM flows WHERE protocolid = '6' GROUP BY sourceip, destinationip, destinationport HAVING connection_count >= 1 ORDER BY bytes_out DESC LAST 24 HOURS
  yara_l: "rule dga_domain_c2_communication {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential C2 communication to DGA domains\
    \ via forward proxy\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"T1071\"\n    severity = \"HIGH\"\n\
    \    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.metadata.product_log_id = \"forward_proxy\"\n    $e.network.ip_protocol\
    \ = \"TCP\"\n    (\n      re.regex($e.target.hostname, `^[a-z]{10,63}\\.(com|net|org|info|biz)$`) or\n      re.regex($e.target.hostname, `^[a-z0-9]{8,20}\\\
    .(com|net|org|ru|cn)$`) or\n      re.regex($e.target.hostname, `^[bcdfghjklmnpqrstvwxyz]{12,}\\.`) or\n      re.regex($e.target.hostname,\
    \ `^[a-z]{16,}\\.(top|xyz|club|online|site)$`)\n    )\n    $e.principal.ip = $src_ip\n    $e.target.ip = $dest_ip\n    $e.target.port = $dest_port\n\
    \    $e.network.sent_bytes > 0\n    \n  match:\n    $src_ip, $dest_ip, $dest_port over 1h\n    \n  outcome:\n    $risk_score = max(75)\n \
    \   $total_bytes_out = sum($e.network.sent_bytes)\n    $connection_count = count_distinct($e.metadata.id)\n    $unique_destinations = count_distinct($dest_ip)\n\
    \    \n  condition:\n    #e >= 1\n}\n"
  esql: "FROM logs-network.forward_proxy-*, logs-network.firewall-*, logs-network.ids-*\n| WHERE @timestamp > NOW() - 24 hours \n  AND network.protocol\
    \ == \"tcp\"\n  AND network.transport == \"tcp\"\n| EVAL dga_entropy = (\n    CASE(\n      RLIKE(destination.domain, \"^[a-z0-9]{10,}\\\\\
    .(com|net|org|info|biz)$\"), 1,\n      RLIKE(destination.domain, \"^[bcdfghjklmnpqrstvwxyz]{8,}\\\\.[a-z]{2,6}$\"), 1,\n      RLIKE(destination.domain,\
    \ \"^[a-z]{15,}\\\\.[a-z]{2,6}$\"), 1,\n      0\n    )\n  )\n| WHERE dga_entropy == 1\n| STATS \n    connection_count = COUNT(*),\n    unique_dests\
    \ = COUNT_DISTINCT(destination.ip),\n    total_bytes_out = SUM(network.bytes),\n    dest_domains = VALUES(destination.domain)\n  BY source.ip,\
    \ destination.ip, destination.port\n| WHERE connection_count >= 1\n| SORT total_bytes_out DESC\n| KEEP source.ip, destination.ip, destination.port,\
    \ connection_count, unique_dests, total_bytes_out, dest_domains\n"
  leql: |
    where(log_source_type=forward_proxy AND destination_domain=/^[a-z0-9]{10,}\.([a-z]{2,}|[a-z]{3,6}\.[a-z]{2})$/i)
    groupby(source_address, destination_address, destination_port)
    calculate(count)
  crowdstrike: |
    #type=proxy event_platform=Win protocol=*tcp*
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=conn_count), sum(bytes_out, as=total_bytes_out)])
    | conn_count >= 1
    | groupBy([src_ip], function=[count(dest_ip, distinct=true, as=unique_dests), sum(total_bytes_out, as=src_total_bytes)])
    | groupBy([src_ip, dest_ip, dest_port], function=[max(total_bytes_out, as=bytes_out), max(unique_dests, as=unique_dests)])
    | sort(bytes_out, order=desc)
    | table([src_ip, dest_ip, dest_port, conn_count, bytes_out, unique_dests])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter ip_protocol = "tcp"
    | comp count() as conn_count, sum(bytes_sent) as bytes_out, count_distinct(dest_ip) as unique_dests by source_ip, dest_ip, dest_port
    | filter conn_count >= 1
    | sort desc bytes_out
    | fields source_ip, dest_ip, dest_port, conn_count, unique_dests, bytes_out
  lucene: |
    sourcetype:(firewall OR ids) AND network.protocol:*tcp* AND dest_ip:(*[0-9]{8,}* OR *randomstring* OR _exists_:dga_indicator)
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*network*
    | where protocol matches "*tcp*" OR protocol matches "*TCP*"
    | parse regex "(?<domain>[a-z0-9]{10,})\.[a-z]{2,10}" nodrop
    | where length(domain) >= 10
    | parse regex field=domain "(?<consonant_run>[bcdfghjklmnpqrstvwxyz]{5,})" nodrop
    | where !isNull(consonant_run)
    | count as connections by src_ip, dest_ip, dest_port
    | where connections >= 1
    | join (
        _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*network*
        | where protocol matches "*tcp*" OR protocol matches "*TCP*"
        | count_distinct(dest_ip) as unique_dests by src_ip
    ) on src_ip
    | join (
        _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*network*
        | where protocol matches "*tcp*" OR protocol matches "*TCP*"
        | sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    ) on src_ip, dest_ip, dest_port
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, dest_port, connections, unique_dests, total_bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:

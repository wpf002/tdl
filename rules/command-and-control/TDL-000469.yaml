rule_id: TDL-C2-000469
v4_id: 000469
name: Allowed Command Injection Signature Detection - Inbound
description: Detects when inbound traffic with a Command Injection signature is allowed
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: '(index=network sourcetype=firewall OR index=network sourcetype=ids) protocol=tcp direction=inbound signature="*Command Injection*" action=allowed
    NOT (src_ip IN ("10.0.0.100", "10.0.0.101", "192.168.1.50")) NOT (src_ip="*scanner*" OR src_ip="*monitor*")

    | stats sum(bytes_out) as bytes_out, dc(dest_ip) as unique_dest_ips by src_ip, dest_ip, dest_port

    | sort - bytes_out

    | table src_ip, dest_ip, dest_port, bytes_out, unique_dest_ips

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(24h)\n| where DeviceVendor in (\"Palo Alto Networks\", \"Cisco\", \"Fortinet\", \"Check\
    \ Point\", \"Snort\", \"Suricata\") or DeviceProduct has_any (\"Firewall\", \"IDS\", \"IPS\")\n| where Protocol =~ \"tcp\"\n| where CommunicationDirection\
    \ =~ \"inbound\" or DeviceCustomString2 =~ \"inbound\" or AdditionalExtensions has \"direction=inbound\"\n| where Activity has_any (\"Command\
    \ Injection\", \"command injection\", \"Command-Injection\") or DeviceEventCategory has_any (\"Command Injection\", \"command-injection\"\
    ) or Message has_any (\"command injection\", \"command-injection\")\n| where DeviceAction in~ (\"allowed\", \"allow\", \"permitted\", \"permit\"\
    )\n| where SourceIP !in (\"10.0.100.50\", \"10.0.100.51\", \"192.168.1.100\", \"172.16.50.10\")\n| where SourceUserName !has_any (\"scanner\"\
    , \"monitor\", \"agent\", \"nessus\", \"qualys\")\n| extend bytes_out = coalesce(SentBytes, DeviceCustomNumber1, tolong(0))\n| summarize \n\
    \    event_count = count(),\n    dest_ip_count = dcount(DestinationIP),\n    total_bytes_out = sum(bytes_out),\n    first_seen = min(TimeGenerated),\n\
    \    last_seen = max(TimeGenerated)\n    by SourceIP, DestinationIP, DestinationPort\n| where event_count >= 1\n| sort by total_bytes_out\
    \ desc\n| project SourceIP, DestinationIP, DestinationPort, event_count, dest_ip_count, total_bytes_out, first_seen, last_seen\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, SUM(bytesout) AS bytes_out, UNIQUECOUNT(destinationip) AS unique_dest_ips
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%Command Injection%'
      AND CATEGORYNAME(category) ILIKE '%IDS%'
      AND protocolname(protocolid) = 'TCP'
      AND (QIDNAME(qid) ILIKE '%inbound%' OR QIDNAME(qid) ILIKE '%incoming%')
      AND (QIDNAME(qid) ILIKE '%allow%' OR QIDNAME(qid) ILIKE '%permit%')
      AND sourceip NOT IN ('10.0.0.100', '10.0.0.101', '192.168.1.50')
      AND LOGSOURCENAME(logsourceid) NOT ILIKE '%scanner%'
      AND LOGSOURCENAME(logsourceid) NOT ILIKE '%monitoring%'
    GROUP BY sourceip, destinationip, destinationport
    ORDER BY bytes_out DESC
    LAST 24 HOURS
  yara_l: "rule command_injection_allowed_inbound {\n  meta:\n    author = \"TDL\"\n    description = \"Detects allowed inbound Command Injection\
    \ signature events from IDS/IPS, excluding authorized scanners\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"HIGH\"\n\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.product_log_id =\
    \ \"IDS\" or $e.metadata.product_log_id = \"IPS\"\n    \n    $e.network.ip_protocol = \"TCP\"\n    $e.network.direction = \"INBOUND\"\n  \
    \  \n    re.regex($e.security_result.summary, `(?i)command.injection`)\n    $e.security_result.action = \"ALLOW\"\n    \n    not (\n     \
    \ $e.principal.ip = \"10.0.0.100\" or\n      $e.principal.ip = \"10.0.0.101\" or\n      $e.principal.ip = \"10.0.0.102\" or\n      re.regex($e.principal.asset.hostname,\
    \ `(?i)scanner`) or\n      re.regex($e.principal.asset.hostname, `(?i)monitor`)\n    )\n    \n    $e.principal.ip = $src_ip\n    $e.target.ip\
    \ = $dest_ip\n    $e.target.port = $dest_port\n    $e.network.sent_bytes = $bytes_out\n\n  match:\n    $src_ip, $dest_ip, $dest_port over\
    \ 1h\n\n  outcome:\n    $risk_score = max(75)\n    $total_bytes_out = sum($bytes_out)\n    $unique_dest_ips = count_distinct($dest_ip)\n\n\
    \  condition:\n    $e\n}\n"
  esql: |
    FROM logs-network.ids*, logs-network.firewall*
    | WHERE network.protocol == "tcp"
      AND network.direction == "inbound"
      AND event.action == "allowed"
      AND (threat.indicator.description LIKE "*Command Injection*" OR rule.name LIKE "*Command Injection*" OR threat.technique.name LIKE "*Command Injection*")
      AND source.ip NOT IN ("10.0.0.100", "10.0.0.101", "192.168.1.50")
    | STATS bytes_out = SUM(network.bytes), dc_dest_ip = COUNT_DISTINCT(destination.ip) BY source.ip, destination.ip, destination.port
    | SORT bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, bytes_out, dc_dest_ip
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND source_json.direction="inbound" AND source_json.signature ICONTAINS "Command Injection" AND source_json.action="allowed" AND source_json.src_ip NOT IN ["scanner_ip_1", "scanner_ip_2"] AND source_json.src_ip!="monitoring_agent_ip") groupby(source_json.src_ip, source_json.dest_ip, source_json.dest_port) calculate(sum:source_json.bytes_out)
  crowdstrike: |
    #type=network (sourcetype=firewall OR sourcetype=ids) network.protocol=*tcp* direction=inbound signature=*Command?Injection* action=allowed
    | NOT (src_ip IN ["10.0.0.100", "10.0.0.101", "192.168.1.50"])
    | groupBy([src_ip, dest_ip, dest_port], function=[sum(bytes_out, as=bytes_out), count(dest_ip, distinct=true, as=dc_dest_ip)])
    | sort(bytes_out, order=desc, limit=10000)
    | table([src_ip, dest_ip, dest_port, bytes_out, dc_dest_ip])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter threat_name contains "Command Injection" and action_direction = "inbound" and action_verdict = "allow" and protocol = "tcp"
    | filter src_ip not in ("10.0.0.50", "10.0.0.51", "192.168.1.100")
    | comp sum(bytes_sent) as bytes_out, count_distinct(dest_ip) as dc_dest_ip by src_ip, dest_ip, dest_port
    | sort desc bytes_out
    | fields src_ip, dest_ip, dest_port, bytes_out, dc_dest_ip
  lucene: |
    network.protocol:tcp AND traffic.direction:inbound AND signature.category:"Command Injection" AND action:allowed AND NOT (source.ip:(10.0.1.100 OR 10.0.1.101 OR 192.168.50.10) OR source.agent:"monitoring-agent")
  sumo: |
    _sourceCategory=*network* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | json field=_raw "protocol" as protocol
    | json field=_raw "direction" as direction
    | json field=_raw "signature" as signature
    | json field=_raw "action" as action
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "bytes_out" as bytes_out
    | where protocol matches "*tcp*"
    | where direction matches "*inbound*"
    | where signature matches "*Command Injection*"
    | where action matches "*allow*"
    | where !(src_ip in ("10.0.0.100", "10.0.0.101", "192.168.1.50"))
    | count_distinct(dest_ip) as dc_dest_ip by src_ip, dest_ip, dest_port, bytes_out
    | sort by bytes_out desc
    | fields src_ip, dest_ip, dest_port, bytes_out, dc_dest_ip
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any observed window of an allowed inbound Command Injection signature event.


  From index=network with sourcetype=firewall or sourcetype=ids

  Where network.protocol contains "tcp"

  With traffic direction inbound and the Command Injection signature present and action set to allowed

  With fields src_ip, dest_ip, dest_port, bytes_out, and unique destination IP count (dc(dest_ip)) computed per grouping

  Exclude events originating from authorized scanner IPs and known monitoring agent sources


  With the same src_ip, dest_ip, and dest_port as the correlation key, results sorted descending by bytes_out to surface highest-volume sessions
  first.'

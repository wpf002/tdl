rule_id: TDL-C2-000492
v4_id: 000492
name: Spike in Exploit Detections from Internal Host
description: Detects a spike in inbound exploits from an internal IP within the enviroment
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=ids_ips action=alert OR action=exploit OR signature_category=exploit \n| eval src_internal=if(cidrmatch(\"10.0.0.0/8\", src_ip)\
    \ OR cidrmatch(\"172.16.0.0/12\", src_ip) OR cidrmatch(\"192.168.0.0/16\", src_ip), 1, 0)\n| eval dest_internal=if(cidrmatch(\"10.0.0.0/8\"\
    , dest_ip) OR cidrmatch(\"172.16.0.0/12\", dest_ip) OR cidrmatch(\"192.168.0.0/16\", dest_ip), 1, 0)\n| where src_internal=1 AND dest_internal=1\n\
    | lookup vulnerability_scanners.csv src_ip OUTPUT is_scanner\n| where isnull(is_scanner) OR is_scanner!=1\n| bin _time span=1d\n| stats count\
    \ by _time, src_ip\n| eventstats avg(count) as avg_count, stdev(count) as stdev_count by src_ip\n| where count > (avg_count + (3 * stdev_count))\
    \ AND count >= 2\n| where _time >= relative_time(now(), \"-90d\")\n| table _time, src_ip, count, avg_count, stdev_count\n"
  kql: "let VulnerabilityScanners = dynamic([\"10.0.0.100\", \"192.168.1.50\"]); // Replace with your vulnerability scanner IPs\nlet LearningPeriod\
    \ = 30d;\nlet DetectionPeriod = 1d;\nlet Sensitivity = 3;\nlet MinimumThreshold = 2;\nlet BaselineData = \n    CommonSecurityLog\n    | where\
    \ TimeGenerated between (ago(LearningPeriod + DetectionPeriod) .. ago(DetectionPeriod))\n    | where DeviceVendor has_any (\"IDS\", \"IPS\"\
    , \"Intrusion\", \"Snort\", \"Suricata\")\n    | where DeviceEventCategory =~ \"Exploit\" or Activity has \"Exploit\"\n    | where isnotempty(SourceIP)\
    \ and isnotempty(DestinationIP)\n    | where ipv4_is_private(SourceIP) and ipv4_is_private(DestinationIP)\n    | where SourceIP !in (VulnerabilityScanners)\n\
    \    | summarize BaselineCount = count() by SourceIP, bin(TimeGenerated, 1d)\n    | summarize avg_count = avg(BaselineCount), stdev_count\
    \ = stdev(BaselineCount) by SourceIP;\nlet CurrentData = \n    CommonSecurityLog\n    | where TimeGenerated > ago(DetectionPeriod)\n    |\
    \ where DeviceVendor has_any (\"IDS\", \"IPS\", \"Intrusion\", \"Snort\", \"Suricata\")\n    | where DeviceEventCategory =~ \"Exploit\" or\
    \ Activity has \"Exploit\"\n    | where isnotempty(SourceIP) and isnotempty(DestinationIP)\n    | where ipv4_is_private(SourceIP) and ipv4_is_private(DestinationIP)\n\
    \    | where SourceIP !in (VulnerabilityScanners)\n    | summarize CurrentCount = count(), DestinationIPs = make_set(DestinationIP), EventTimes\
    \ = make_set(TimeGenerated) by SourceIP;\nCurrentData\n| join kind=inner (BaselineData) on SourceIP\n| extend threshold = avg_count + (Sensitivity\
    \ * stdev_count)\n| where CurrentCount > threshold and CurrentCount >= MinimumThreshold\n| project SourceIP, CurrentCount, BaselineAverage\
    \ = avg_count, BaselineStdDev = stdev_count, Threshold = threshold, DestinationIPs, EventTimes\n"
  aql: |
    SELECT sourceip, destinationip, COUNT(*) AS event_count
    FROM events
    WHERE INOFFENSE(sourceip) = 'false'
      AND INOFFENSE(destinationip) = 'false'
      AND CATEGORYNAME(category) ILIKE '%IDS%' OR CATEGORYNAME(category) ILIKE '%IPS%' OR CATEGORYNAME(category) ILIKE '%Exploit%'
      AND sourceip IN (SELECT sourceip FROM events WHERE sourceip << '10.0.0.0/8' OR sourceip << '172.16.0.0/12' OR sourceip << '192.168.0.0/16' LAST 90 DAYS)
      AND destinationip IN (SELECT destinationip FROM events WHERE destinationip << '10.0.0.0/8' OR destinationip << '172.16.0.0/12' OR destinationip << '192.168.0.0/16' LAST 90 DAYS)
      AND sourceip NOT IN (SELECT sourceip FROM events WHERE LOGSOURCENAME(logsourceid) ILIKE '%vulnerability%' OR LOGSOURCENAME(logsourceid) ILIKE '%scanner%' OR LOGSOURCENAME(logsourceid) ILIKE '%nessus%' OR LOGSOURCENAME(logsourceid) ILIKE '%qualys%' LAST 90 DAYS)
    GROUP BY sourceip, destinationip
    HAVING event_count >= 2
    LAST 24 HOURS
  yara_l: "rule internal_ids_exploit_outlier {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects internal to internal\
    \ IDS/IPS exploit events from non-scanner sources with outlier detection\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.security_result.summary\
    \ = \"exploit\"\n    (\n      $e.security_result.detection_fields.value = \"exploit\" or\n      $e.security_result.category = \"EXPLOIT\"\
    \ or\n      re.regex($e.security_result.summary, `(?i)exploit`)\n    )\n    \n    net.ip_in_range_cidr($e.principal.ip, \"10.0.0.0/8\") or\n\
    \    net.ip_in_range_cidr($e.principal.ip, \"172.16.0.0/12\") or\n    net.ip_in_range_cidr($e.principal.ip, \"192.168.0.0/16\")\n    \n  \
    \  net.ip_in_range_cidr($e.target.ip, \"10.0.0.0/8\") or\n    net.ip_in_range_cidr($e.target.ip, \"172.16.0.0/12\") or\n    net.ip_in_range_cidr($e.target.ip,\
    \ \"192.168.0.0/16\")\n    \n    not (\n      $e.principal.asset.asset_id = \"vulnerability_scanner\" or\n      re.regex($e.principal.hostname,\
    \ `(?i)(vuln|scan|nessus|qualys|rapid7)`)\n    )\n    \n    $e.principal.ip = $source_ip\n    \n  match:\n    $source_ip over 1d\n    \n \
    \ outcome:\n    $risk_score = max(75)\n    $event_count = count_distinct($e.metadata.id)\n    \n  condition:\n    #e >= 2\n}\n"
  esql: "FROM logs-network.ids* \n| WHERE @timestamp > NOW() - 90 days \n  AND event.kind == \"alert\" \n  AND event.category == \"intrusion_detection\"\
    \n  AND source.ip RLIKE \"^(10\\\\.|172\\\\.(1[6-9]|2[0-9]|3[01])\\\\.|192\\\\.168\\\\.)\"\n  AND destination.ip RLIKE \"^(10\\\\.|172\\\\\
    .(1[6-9]|2[0-9]|3[01])\\\\.|192\\\\.168\\\\.)\"\n  AND NOT source.ip IN (\"10.0.0.100\", \"10.0.0.101\")\n| EVAL day = DATE_TRUNC(1 day, @timestamp)\n\
    | STATS daily_count = COUNT(*) BY source.ip, day\n| EVAL baseline_period = CASE(day >= NOW() - 30 days, \"baseline\", \"current\")\n| STATS\
    \ \n    baseline_avg = AVG(CASE(baseline_period == \"baseline\", daily_count, null)),\n    baseline_stddev = SQRT(AVG(CASE(baseline_period\
    \ == \"baseline\", daily_count * daily_count, null)) - AVG(CASE(baseline_period == \"baseline\", daily_count, null)) * AVG(CASE(baseline_period\
    \ == \"baseline\", daily_count, null))),\n    current_count = SUM(CASE(baseline_period == \"current\", daily_count, 0))\n  BY source.ip\n\
    | WHERE current_count >= 2 \n  AND current_count > (baseline_avg + 3 * baseline_stddev)\n| KEEP source.ip, current_count, baseline_avg, baseline_stddev\n"
  leql: |
    where(event_type="IDS/IPS Exploit" AND direction="Internal" AND source_asset NOT IN [<vulnerability_scanner_ips>]) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=ids event_type=exploit src_ip_internal=true dst_ip_internal=true NOT (src_ip IN file("vuln_scanners.csv"))
    | groupBy([src_ip], function=count(as=exploit_count), limit=max)
    | exploit_count >= 2
  xql: "dataset = intrusion_detection_events\n| filter threat_detected = true \n  and incidr(source_ip, \"10.0.0.0/8\") = true or incidr(source_ip,\
    \ \"172.16.0.0/12\") = true or incidr(source_ip, \"192.168.0.0/16\") = true\n| filter incidr(destination_ip, \"10.0.0.0/8\") = true or incidr(destination_ip,\
    \ \"172.16.0.0/12\") = true or incidr(destination_ip, \"192.168.0.0/16\") = true\n| filter source_ip not in (vulnerability_scanner_ips)\n\
    | bin _time span=1d\n| comp count() as event_count by _time, source_ip\n| filter event_count >= 2\n"
  lucene: |
    event_category:"ids" AND threat.indicator.type:"exploit" AND (source.ip:10.0.0.0/8 OR source.ip:172.16.0.0/12 OR source.ip:192.168.0.0/16) AND (destination.ip:10.0.0.0/8 OR destination.ip:172.16.0.0/12 OR destination.ip:192.168.0.0/16) AND NOT tags:"vulnerability_scanner"
  sumo: |
    _sourceCategory=*IDS* OR _sourceCategory=*IPS*
    | json field=_raw "event_type" as event_type
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "classification" as classification
    | where event_type matches "*exploit*" OR classification matches "*exploit*"
    | where !isPrivateIP(src_ip) = false AND !isPrivateIP(dest_ip) = false
    | where !(src_ip in ("10.0.0.50", "10.0.0.51", "192.168.1.100"))
    | timeslice 1d
    | count as daily_count by _timeslice, src_ip
    | outlier daily_count by src_ip window=30, threshold=3, consecutive=1, direction=+
    | where daily_count >= 2
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: 'IDS/IPS Exploit Event

  From an internal source to an internal destination (Internal)

  Where the Source is NOT on the Vulnerability Scanner List


  Baseline Type: Daily

  Entity: Source IP


  Baseline Learning: 30 Days

  Retention: 90 Days


  Outlier: count

  Sensitivity: 3

  Minimum: 2'
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

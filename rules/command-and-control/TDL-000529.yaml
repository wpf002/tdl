rule_id: TDL-C2-000529
v4_id: 000529
name: Suspicious HTTP User-Agent
description: Common administrative tools may be used by malware authors and attackers who use live-off-the-land methods to operate on victim networks.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS ELB
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=cloud sourcetype="aws:elb:accesslogs" useragent IN ("*curl*", "*wget*", "*python*", "*powershell*", "*sqlmap*", "*nmap*", "*masscan*",
    "*nikto*", "*burp*", "*metasploit*", "*scanner*", "*bot*", "*crawler*")

    | stats count dc(client_ip) as unique_ips values(client_ip) as source_ips by useragent, request, target_fqdn

    | where count >= 1

    | search NOT (useragent="*Amazon*" OR useragent="*AWS*" OR useragent="*Pingdom*" OR useragent="*Datadog*" OR useragent="*NewRelic*")

    | sort - count

    | table useragent, request, target_fqdn, count, unique_ips, source_ips

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName matches regex ".+"
    | where UserAgent has_any ("curl", "wget", "python-requests", "Go-http-client", "Boto", "aws-cli", "Invoke-WebRequest", "powershell", "nmap", "masscan", "sqlmap", "nikto", "scanner", "bot", "scraper", "headless")
    | where UserAgent !has_any ("Amazon-Route53-Health-Check-Service", "CloudWatch-Synthetics", "AWS Security Scanner", "TrustedAdvisor")
    | extend ResourceARN = tostring(parse_json(Resources)[0].ARN)
    | summarize EventCount = count(), SourceIPs = dcount(SourceIpAddress) by UserIdentityArn = tostring(UserIdentityArn), EventName, ResourceARN
    | where EventCount >= 1
    | sort by EventCount desc
    | project TimeGenerated = now(), UserIdentityArn, EventName, ResourceARN, EventCount, SourceIPs
  aql: |
    SELECT useridentityarn, eventname, resourcearn, sourceip, UNIQUECOUNT(sourceip) AS distinct_ips, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%aws%elb%'
      AND eventname IS NOT NULL
      AND eventname != ''
      AND useragent MATCHES '(curl|wget|python|scanner|bot|crawler|nikto|nmap|sqlmap|masscan|zgrab|shodan|censys|burp)'
      AND useragent NOT MATCHES '(GoogleBot|bingbot|Pingdom|UptimeRobot|StatusCake|Site24x7|Datadog|NewRelic)'
    GROUP BY useridentityarn, eventname, resourcearn, sourceip
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 1 HOURS
  yara_l: |
    rule suspicious_http_user_agent_aws_elb {
      meta:
        author = "TDL"
        description = "Detects suspicious HTTP User-Agent strings in AWS ELB logs indicating potential C2 activity (T1078)"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "MEDIUM"

      events:
        $e.metadata.product_name = "AWS ELB"
        $e.metadata.vendor_name = "AMAZON"
        $e.network.http.user_agent != ""
        (
          re.regex($e.network.http.user_agent, `(?i)(curl|wget|python|powershell|nmap|masscan|nikto|burp|sqlmap|metasploit|mimikatz|cobalt)`) or
          re.regex($e.network.http.user_agent, `^[a-zA-Z0-9]{8,}$`) or
          re.regex($e.network.http.user_agent, `(?i)(bot|crawler|spider|scraper)`) or
          re.regex($e.network.http.user_agent, `^-$`) or
          $e.network.http.user_agent = "Mozilla/4.0" or
          $e.network.http.user_agent = "Mozilla/5.0"
        )
        not re.regex($e.network.http.user_agent, `(?i)(googlebot|bingbot|slackbot|datadog|prometheus|nagios|pingdom|uptimerobot|newrelic)`)
        $e.principal.ip = $source_ip
        $e.principal.user.userid = $user_arn
        $e.target.resource.name = $resource_arn

      match:
        $user_arn, $resource_arn over 1h

      outcome:
        $risk_score = 65
        $source_ips = array_distinct($source_ip)
        $ip_count = count_distinct($source_ip)

      condition:
        #e >= 1
    }
  esql: "FROM logs-aws.elb*\n| WHERE @timestamp > NOW() - 1 hour \n  AND http.request.headers.user-agent IS NOT NULL\n  AND (\n    TO_LOWER(http.request.headers.user-agent)\
    \ LIKE \"*bot*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*crawler*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE\
    \ \"*scanner*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*curl*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"\
    *wget*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*python*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*nikto*\"\
    \n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*nmap*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*masscan*\"\n\
    \    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*metasploit*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*sqlmap*\"\
    \n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*gobuster*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*dirbuster*\"\
    \n  )\n  AND NOT (\n    TO_LOWER(http.request.headers.user-agent) LIKE \"*googlebot*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE\
    \ \"*bingbot*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*pingdom*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE\
    \ \"*uptime*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*uptimerobot*\"\n    OR TO_LOWER(http.request.headers.user-agent)\
    \ LIKE \"*datadog*\"\n    OR TO_LOWER(http.request.headers.user-agent) LIKE \"*newrelic*\"\n  )\n| STATS count = COUNT(*), distinct_ips =\
    \ COUNT_DISTINCT(source.ip) BY cloud.account.id, http.request.method, url.path\n| WHERE count >= 1\n| SORT count DESC\n| KEEP cloud.account.id,\
    \ http.request.method, url.path, count, distinct_ips\n"
  leql: |
    where(source_json.eventName=/^.+$/ AND source_json.userAgent ICONTAINS "suspicious") groupby(source_json.userIdentity.arn, source_json.eventName, source_json.resources[0].ARN) calculate(count, unique:source_json.sourceIPAddress)
  crowdstrike: |
    #repo=cloud sourcetype="aws:elb:accesslogs" userAgent=/bot|crawler|scanner|curl|wget|python|powershell|nmap|masscan|sqlmap|nikto|burp|zap|metasploit|nessus|acunetix|openvas|qualys|rapid7|tenable|imperva|arachni|w3af|skipfish|wapiti|grabber|joomscan|wpscan|dirbuster|gobuster|ffuf|nuclei|httpx|subfinder/i
    | groupBy([userIdentity.arn, eventName, "resources{}.ARN"], function=[count(as=cnt), count(sourceIPAddress, distinct=true, as=distinct_ips)])
    | cnt >= 1
    | not (userAgent=/ELB-HealthChecker|Amazon-Route53-Health-Check-Service|CloudWatch-Synthetics|Pingdom|UptimeRobot|Site24x7|StatusCake|Datadog|NewRelic|Dynatrace/)
    | sort(field=cnt, order=desc)
    | table([userIdentity.arn, eventName, "resources{}.ARN", cnt, distinct_ips, userAgent, sourceIPAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and log_name = "cloudtrail"
    | filter eventName ~= ".+"
    | filter user_agent ~= "(?i)(curl|wget|python|powershell|nmap|masscan|nikto|sqlmap|metasploit|burp|scanner|bot|crawler)"
    | filter user_agent !~= "(?i)(aws-cli|aws-sdk|console\.aws\.amazon\.com|signin\.aws\.amazon\.com|elasticloadbalancing|Amazon-Route53|AmazonCloudWatch|monitoring\.amazonaws\.com)"
    | comp count() as event_count, count_distinct(src_ip) as unique_ips by user_identity_arn, eventName, resource_arn
    | filter event_count >= 1
    | sort desc event_count
    | fields user_identity_arn, eventName, resource_arn, event_count, unique_ips
  lucene: |
    sourcetype:"aws:elb" AND userAgent:(*bot* OR *scanner* OR *curl* OR *wget* OR *python* OR *perl* OR *ruby* OR *java* OR *go-http-client* OR *okhttp* OR *apache-httpclient* OR *http_request* OR *nmap* OR *masscan* OR *zgrab* OR *nikto* OR *sqlmap* OR *havij* OR *acunetix* OR *nessus* OR *openvas* OR *metasploit* OR *cobalt* OR *empire* OR *meterpreter* OR *<script* OR *../../* OR *etc/passwd* OR *windows/system32* OR *cmd.exe* OR *powershell* OR *base64* OR *eval(* OR *exec(* OR *system(*) AND NOT userAgent:(*Pingdom* OR *UptimeRobot* OR *StatusCake* OR *Site24x7* OR *Datadog* OR *New Relic* OR *AppDynamics* OR *Dynatrace* OR *Catchpoint* OR *Thousand Eyes* OR *CloudFlare* OR *AWS-Health-Check* OR *ELB-HealthChecker*)
  sumo: "_sourceCategory=*elb* OR _sourceCategory=*cloudtrail*\n| json field=_raw \"userAgent\" as user_agent\n| json field=_raw \"sourceIPAddress\"\
    \ as src_ip\n| json field=_raw \"userIdentity.arn\" as user_arn\n| json field=_raw \"eventName\" as event_name\n| json field=_raw \"resources[0].ARN\"\
    \ as resource_arn\n| where user_agent matches \"*(?i)(curl|wget|python|ruby|perl|scanner|bot|crawler|masscan|nmap|zgrab|sqlmap|nikto|burp|metasploit|mimikatz|powershell|empire)*\"\
    \ \n| where !(user_agent matches \"*(?i)(pingdom|newrelic|datadog|cloudhealth|splunk|sumologic|elasticloadbalancing)*\")\n| where event_name\
    \ matches regex \"^.+$\"\n| count as cnt, count_distinct(src_ip) as distinct_ips by user_arn, event_name, resource_arn\n| where cnt >= 1\n\
    | sort by cnt desc\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify beaconing characteristics (interval, jitter, request size,
  server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any observation window of a Suspicious HTTP User-Agent event.


  From index=cloud where sourcetype is aws:cloudtrail, azure:auditlogs, or gcp:audit.

  Where eventName matches any non-empty string pattern (eventName="*.+*").

  With stats aggregating count and distinct sourceIPAddress values grouped by userIdentity.arn, eventName, and resources{}.ARN.

  Where count is greater than or equal to 1.

  Excluding traffic attributed to authorized scanners or monitoring agents.

  With the same userIdentity.arn, eventName, and resources{}.ARN as the correlation key, sorted descending by count.'

rule_id: TDL-C2-000530
v4_id: '000530'
name: Successful Log4j Exploit
description: Detects exploitation attempt against log4j RCE vulnerability reported as CVE-2021-44228 in URL or user agent fields found in load
  balancer logs (Log4Shell).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS ELB
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=cloud sourcetype IN (\"aws:cloudtrail\", \"azure:auditlogs\", \"gcp:audit\") \n| eval request_data=coalesce(requestParameters, userAgent,\
    \ errorMessage, responseElements, additionalEventData)\n| where match(request_data, \"(?i).*(\\$\\{jndi:|%24%7Bjndi:|%2524%257Bjndi:|\\\\\
    u0024\\\\u007B|\\\\x24\\\\x7B).*\")\n| stats count values(sourceIPAddress) as src_ips by userIdentity.arn, eventName, resources{}.ARN\n| where\
    \ count >= 1\n| sort - count\n"
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventName matches regex @"\$\{jndi:"
        or EventName matches regex @"\$\{.*:\w+/.*\}"
        or EventName matches regex @"\$\{.*lower.*\}"
        or EventName matches regex @"\$\{.*upper.*\}"
        or EventName matches regex @"\$\{.*env.*\}"
        or EventName matches regex @"\$\{.*sys.*\}"
        or EventName contains "${jndi"
        or RequestParameters contains "${jndi"
        or ResponseElements contains "${jndi"
        or UserAgent contains "${jndi"
        or RequestParameters matches regex @"\$\{.*:\w+/.*\}"
        or ResponseElements matches regex @"\$\{.*:\w+/.*\}"
        or UserAgent matches regex @"\$\{.*:\w+/.*\}"
    | extend UserArn = tostring(UserIdentityArn)
    | extend ResourceArn = tostring(parse_json(Resources)[0].ARN)
    | summarize count(), SourceIPs = make_set(SourceIpAddress) by UserArn, EventName, ResourceArn
    | where count_ >= 1
    | sort by count_ desc
  aql: |
    SELECT useridentity.arn AS user_arn, eventName, "resources{}.ARN" AS resource_arn, sourceip, COUNT(*) AS event_count
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%cloudtrail%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%aws%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%elb%')
      AND (UTF8(payload) MATCHES '.*\$\{jndi:.*' OR UTF8(payload) MATCHES '.*\$\{.*:.*\/\/.*' OR UTF8(payload) MATCHES '.*\$\{\$\{.*' OR UTF8(payload) MATCHES '.*\$\{[lL][oO][wW][eE][rR]:.*' OR UTF8(payload) MATCHES '.*\$\{[uU][pP][pP][eE][rR]:.*' OR UTF8(payload) MATCHES '.*\..*\+.*\*.*')
    GROUP BY useridentity.arn, eventName, "resources{}.ARN", sourceip
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule log4j_exploitation_aws_elb {
      meta:
        author = "TDL"
        description = "Detects Log4j exploitation patterns in AWS ELB logs"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "AWS ELB"
        $e.metadata.vendor_name = "AMAZON"
        re.regex($e.network.http.parsed_user_agent, `\$\{jndi:`) or
        re.regex($e.network.http.referral_url, `\$\{jndi:`) or
        re.regex($e.target.url, `\$\{jndi:`) or
        re.regex($e.network.http.parsed_user_agent, `\$\{.*?\}`) or
        re.regex($e.network.http.referral_url, `\$\{.*?\}`) or
        re.regex($e.target.url, `\$\{.*?\}`)
        $e.principal.ip = $source_ip
        $e.target.resource.name = $resource
        $e.principal.user.userid = $user_arn

      match:
        $user_arn, $resource over 24h

      outcome:
        $risk_score = 85
        $source_ips = array_distinct($source_ip)
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 24 hour\n  AND (\n    event.dataset == \"aws.cloudtrail\" \n    OR event.dataset\
    \ == \"azure.auditlogs\" \n    OR event.dataset == \"gcp.audit\"\n  )\n  AND (\n    http.request.body.content RLIKE \".*\\\\$\\\\{jndi:.*\"\
    \n    OR http.request.body.content RLIKE \".*\\\\$\\\\{.*:.*\\\\}.*\"\n    OR url.full RLIKE \".*\\\\$\\\\{jndi:.*\"\n    OR url.full RLIKE\
    \ \".*\\\\$\\\\{.*:.*\\\\}.*\"\n    OR user_agent.original RLIKE \".*\\\\$\\\\{jndi:.*\"\n    OR user_agent.original RLIKE \".*\\\\$\\\\{.*:.*\\\
    \\}.*\"\n  )\n| EVAL resource_arn = COALESCE(aws.cloudtrail.resources.arn, cloud.instance.id, \"unknown\")\n| STATS \n    event_count = COUNT(*),\n\
    \    source_ips = VALUES(source.ip)\n  BY \n    cloud.account.id,\n    event.action,\n    resource_arn,\n    user.id\n| WHERE event_count\
    \ >= 1\n| SORT event_count DESC\n| KEEP cloud.account.id, event.action, resource_arn, user.id, event_count, source_ips\n"
  leql: |
    where(log_source="AWS ELB" AND (request ICONTAINS "${jndi:" OR request ICONTAINS "${${" OR request ICONTAINS "${lower:" OR request ICONTAINS "${upper:" OR request ICONTAINS "${env:" OR request ICONTAINS "${sys:" OR request ICONTAINS "ldap://" OR request ICONTAINS "ldaps://" OR request ICONTAINS "rmi://" OR request ICONTAINS "dns://" OR request ICONTAINS "nis://" OR request ICONTAINS "nds://" OR request ICONTAINS "corba://" OR request ICONTAINS "iiop://")) groupby(userIdentity.arn, eventName, resources{}.ARN) calculate(unique:source_address)
  crowdstrike: |
    #type=aws:elb
    | regex(".*(\$\{.*jndi.*\}|\$\{.*:.*:.*\}|\$\%7B.*\}|\$\{lower:.*\}|\$\{upper:.*\}|\$\{::-.*\}|\$\{env:.*\}|\$\{sys:.*\}).*", field=request, flags=i)
    | groupBy([userIdentity.arn, eventName, resources{}.ARN], function=[count(as=event_count), collect(sourceIPAddress, as=source_ips)])
    | event_count >= 1
    | sort(event_count, order=desc, limit=10000)
    | table([userIdentity.arn, eventName, "resources{}.ARN", event_count, source_ips])
  xql: "dataset = cloud_audit_logs\n| filter vendor = \"AWS\" and raw_log contains \"*\" and raw_log ~= \"(?i).*(\\$\\{jndi:|\\$\\{.*:.*\\}|%24%7Bjndi|%24%7B.*%3A.*%7D).*\"\
    \n| alter \n    user_identity = json_extract_scalar(raw_log, \"$.userIdentity.arn\"),\n    event_name = json_extract_scalar(raw_log, \"$.eventName\"\
    ),\n    resource_arn = json_extract_scalar(raw_log, \"$.resources[0].ARN\"),\n    source_ip = coalesce(json_extract_scalar(raw_log, \"$.sourceIPAddress\"\
    ), json_extract_scalar(raw_log, \"$.requestParameters.sourceIPAddress\"))\n| filter user_identity != null and event_name != null\n| comp count()\
    \ as event_count, values(source_ip) as source_ips by user_identity, event_name, resource_arn\n| filter event_count >= 1\n| sort desc event_count\n\
    | fields user_identity, event_name, resource_arn, event_count, source_ips\n"
  lucene: |
    sourcetype:(aws\:cloudtrail OR azure\:auditlogs OR gcp\:audit) AND eventName:*\$\{jndi\:* AND _exists_:userIdentity.arn AND _exists_:resources
  sumo: |
    _sourceCategory=*elb* OR _sourceType=*elb* OR _source=*elb*
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "eventName" as event_name
    | json field=_raw "resources" as resources
    | json field=_raw "sourceIPAddress" as src_ip
    | json field=_raw "requestParameters" as request_params
    | where request_params matches "*$*{*jndi*" OR request_params matches "*$*{*ldap*" OR request_params matches "*$*{*rmi*" OR request_params matches "*${*" OR request_params matches "*.+*"
    | parse regex field=resources "\[.*?\"ARN\":\"(?<resource_arn>[^\"]+)\"" multi
    | where !isNull(user_arn) AND !isNull(event_name)
    | count as event_count, values(src_ip) as source_ips by user_arn, event_name, resource_arn
    | where event_count >= 1
    | sort by event_count desc
    | fields user_arn, event_name, resource_arn, event_count, source_ips
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any time window of a cloud audit log event matching a Log4j exploitation pattern in the request.


  From index=cloud

  Where sourcetype is aws:cloudtrail, azure:auditlogs, or gcp:audit

  Where eventName matches the pattern "*.+*" indicating a JNDI lookup or obfuscated Log4Shell payload string embedded in the request field

  With count of matching events greater than or equal to 1


  With the same userIdentity.arn and eventName and resources{}.ARN

  Results deduplicated and sorted descending by count, returning all source IP addresses observed per unique identity and resource combination.'

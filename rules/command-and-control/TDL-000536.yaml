rule_id: TDL-C2-000536
v4_id: '000536'
name: Crypto Miner User Agent
description: Observes for several known cryptominer user agents
tactic: Command and Control
tactic_id: TA0011
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- AWS
data_sources:
- AWS ELB
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=cloud (sourcetype=aws:cloudtrail OR sourcetype=azure:auditlogs OR sourcetype=gcp:audit) eventName=* (userAgent="*stratum*" OR userAgent="*xmrig*"
    OR userAgent="*cryptonight*" OR userAgent="*monero*" OR userAgent="*claymore*" OR userAgent="*ethminer*" OR userAgent="*ccminer*" OR userAgent="*cgminer*"
    OR userAgent="*bfgminer*" OR userAgent="*minergate*" OR userAgent="*nicehash*" OR userAgent="*phoenixminer*" OR userAgent="*teamredminer*"
    OR userAgent="*t-rex*" OR userAgent="*nbminer*" OR userAgent="*gminer*" OR userAgent="*lolminer*")

    | eval resource_arn=mvindex(''resources{}.ARN'', 0)

    | stats count by userIdentity.arn, eventName, resource_arn

    | where count >= 1

    | sort - count

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where isnotempty(UserAgent)
    | where UserAgent has_any ("xmrig", "stratum", "minergate", "cryptonight", "monero", "xmr-stak", "ccminer", "ethminer", "claymore", "phoenixminer", "t-rex", "nanominer", "nbminer", "gminer", "lolminer", "teamredminer")
    | where isnotempty(EventName)
    | extend ResourceARN = tostring(parse_json(tostring(Resources))[0].ARN)
    | summarize EventCount = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), EventNames = make_set(EventName), UserAgents = make_set(UserAgent) by UserIdentityArn, ResourceARN
    | where EventCount >= 1
    | project UserIdentityArn, ResourceARN, EventCount, FirstSeen, LastSeen, EventNames, UserAgents
    | sort by EventCount desc
  aql: |
    SELECT userIdentity.arn AS user_arn, eventName, resources{}.ARN AS resource_arn, COUNT(*) AS event_count
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%aws%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%cloudtrail%')
      AND eventName IS NOT NULL
      AND eventName != ''
      AND (userAgent ILIKE '%xmrig%' OR userAgent ILIKE '%minergate%' OR userAgent ILIKE '%stratum%' OR userAgent ILIKE '%cryptonight%' OR userAgent ILIKE '%monero%' OR userAgent ILIKE '%nicehash%' OR userAgent ILIKE '%ethminer%')
    GROUP BY userIdentity.arn, eventName, resources{}.ARN
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule aws_elb_cryptominer_user_agent {
      meta:
        author = "Detection Engineer"
        description = "Detects cryptominer user agent strings in AWS ELB logs"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon Web Services"
        (
          $e.metadata.product_event_type = /.*/ or
          $e.metadata.event_type != ""
        )
        (
          re.regex($e.network.http.user_agent, `(?i)(xmrig|minergate|ccminer|ethminer|cgminer|bfgminer|nheqminer|claymore|phoenixminer|t-rex|lolminer|teamredminer|nbminer|gminer|nanominer|srbminer|xmr-stak|cpu-miner|minerd|cpuminer|stratum\+tcp|cryptonight|randomx)`) or
          re.regex($e.principal.user.user_display_name, `(?i)(xmrig|minergate|ccminer|ethminer|cgminer|bfgminer|nheqminer|claymore|phoenixminer|t-rex|lolminer|teamredminer|nbminer|gminer|nanominer|srbminer|xmr-stak|cpu-miner|minerd|cpuminer|stratum\+tcp|cryptonight|randomx)`) or
          re.regex($e.security_result.description, `(?i)(xmrig|minergate|ccminer|ethminer|cgminer|bfgminer|nheqminer|claymore|phoenixminer|t-rex|lolminer|teamredminer|nbminer|gminer|nanominer|srbminer|xmr-stak|cpu-miner|minerd|cpuminer|stratum\+tcp|cryptonight|randomx)`)
        )
        $e.principal.user.userid = $arn
        $e.metadata.product_event_type = $event_name
        $e.target.resource.id = $resource_arn

      match:
        $arn, $event_name, $resource_arn over 24h

      outcome:
        $risk_score = 75
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-aws.cloudtrail*, logs-azure.auditlogs*, logs-gcp.audit*
    | WHERE event.action IS NOT NULL
      AND (user_agent.original LIKE "*xmrig*" OR user_agent.original LIKE "*minergate*" OR user_agent.original LIKE "*cryptonight*" OR user_agent.original LIKE "*stratum+tcp*" OR user_agent.original LIKE "*nicehash*" OR user_agent.original LIKE "*ethminer*" OR user_agent.original LIKE "*claymore*" OR user_agent.original LIKE "*phoenixminer*" OR user_agent.original LIKE "*nanominer*" OR user_agent.original LIKE "*t-rex*" OR user_agent.original LIKE "*gminer*" OR user_agent.original LIKE "*lolminer*" OR user_agent.original LIKE "*nbminer*" OR user_agent.original LIKE "*teamredminer*" OR user_agent.original LIKE "*trex*" OR user_agent.original LIKE "*kawpowminer*" OR user_agent.original LIKE "*bminer*" OR user_agent.original LIKE "*cgminer*" OR user_agent.original LIKE "*bfgminer*" OR user_agent.original LIKE "*sgminer*" OR user_agent.original LIKE "*cpuminer*" OR user_agent.original LIKE "*ccminer*" OR user_agent.original LIKE "*minerd*")
    | STATS event_count = COUNT(*) BY user.id, event.action, cloud.instance.id
    | WHERE event_count >= 1
    | SORT event_count DESC
    | KEEP user.id, event.action, cloud.instance.id, event_count
  leql: |
    where(source_json.eventName=* AND (source_json.userAgent ICONTAINS "xmrig" OR source_json.userAgent ICONTAINS "ethminer" OR source_json.userAgent ICONTAINS "cgminer" OR source_json.userAgent ICONTAINS "bfgminer" OR source_json.userAgent ICONTAINS "cryptonight" OR source_json.userAgent ICONTAINS "stratum" OR source_json.userAgent ICONTAINS "minergate" OR source_json.userAgent ICONTAINS "nicehash" OR source_json.userAgent ICONTAINS "claymore" OR source_json.userAgent ICONTAINS "phoenixminer")) groupby(source_json.userIdentity.arn, source_json.eventName, source_json.resources{}.ARN) calculate(count)
  crowdstrike: |
    #repo=cloud sourcetype=/aws:cloudtrail|azure:auditlogs|gcp:audit/ eventName=*
    (userAgent=*stratum* OR userAgent=*minergate* OR userAgent=*xmrig* OR userAgent=*claymore* OR userAgent=*ethminer* OR userAgent=*phoenixminer* OR userAgent=*cryptonight* OR userAgent=*monero* OR userAgent=*bminer* OR userAgent=*cgminer* OR userAgent=*bfgminer* OR userAgent=*nicehash* OR userAgent=*lolminer*)
    | groupBy([userIdentity.arn, eventName, resources{}.ARN], function=count(as=event_count))
    | event_count >= 1
    | sort(event_count, reverse=true)
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = VENDOR.AWS and (action_type contains "aws:elb" or action_type contains "aws:cloudtrail")
    | filter user_agent ~= "(?i)(xmrig|minergate|cryptonight|stratum|nicehash|ethminer|claymore|phoenixminer|t-rex|nbminer|gminer)"
    | filter action_name != ""
    | comp count() as event_count by identity_name, action_name, target_resource
    | filter event_count >= 1
    | sort desc event_count
    | fields identity_name, action_name, target_resource, event_count
  lucene: |
    sourcetype:(aws\:cloudtrail OR azure\:auditlogs OR gcp\:audit) AND _exists_:eventName AND (userAgent:*stratum* OR userAgent:*Claymore* OR userAgent:*cgminer* OR userAgent:*xmrig* OR userAgent:*ethminer* OR userAgent:*NiceHash* OR userAgent:*ccminer* OR userAgent:*bfgminer* OR userAgent:*phoenixminer* OR userAgent:*teamredminer* OR userAgent:*nbminer* OR userAgent:*gminer* OR userAgent:*lolminer* OR userAgent:*minergate* OR userAgent:*cryptonight* OR userAgent:*randomx* OR userAgent:*kawpow* OR userAgent:*etchash* OR userAgent:*minerd* OR userAgent:*cpuminer*)
  sumo: |
    _sourceCategory=*AWS* OR _sourceCategory=*cloudtrail* OR _sourceCategory=*elb*
    | json field=_raw "userAgent" as user_agent
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "resources[0].ARN" as resource_arn
    | where user_agent matches "*stratum*" OR user_agent matches "*xmrig*" OR user_agent matches "*minergate*" OR user_agent matches "*cryptonight*" OR user_agent matches "*nicehash*" OR user_agent matches "*claymore*" OR user_agent matches "*ethminer*" OR user_agent matches "*ccminer*" OR user_agent matches "*phoenixminer*"
    | where !isNull(event_name) AND event_name != ""
    | count as event_count by user_arn, event_name, resource_arn
    | where event_count >= 1
    | sort by event_count desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance over any time window of an AWS ELB or cloud audit log event matching a known cryptominer user agent string.


  From index=cloud

  Where sourcetype is aws:cloudtrail, azure:auditlogs, or gcp:audit

  Where eventName matches a non-empty pattern (any recorded API or HTTP action)

  With a count of matching events greater than or equal to 1


  With the same userIdentity.arn, eventName, and resources{}.ARN as the correlation key, sorted by highest count descending.'

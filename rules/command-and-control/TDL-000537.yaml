rule_id: TDL-C2-000537
v4_id: '000537'
name: Directory Traversal In URL
description: Detects possible directory traversal attack in http requests received by the load balancer.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS ELB
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=cloud (sourcetype="aws:cloudtrail" OR sourcetype="azure:auditlogs" OR sourcetype="gcp:audit")

    | rex field=eventName "(?<traversal_pattern>(\.\./|\.\.\\\\|%2e%2e%2f|%2e%2e%5c|\.%2e\.|\.\.%2f))"

    | search traversal_pattern=*

    | eval user_arn=coalesce(''userIdentity.arn'', userIdentity.userName, user)

    | eval resource_arn=coalesce(''resources{}.ARN'', resources)

    | search NOT (user_arn IN ("*authorized_scanner*", "*monitoring_agent*"))

    | stats count by user_arn, eventName, resource_arn

    | where count >= 1

    | table user_arn, eventName, resource_arn, count

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where (EventName has "../" or EventName has "..%2F" or EventName has "..%5C" or EventName has ".+." or EventName has "%2e%2e" or EventName has "%252e%252e")
    | where UserIdentityArn !has "scanner" and UserIdentityArn !has "monitor" and UserIdentityArn !has "health-check"
    | extend ResourceArn = tostring(parse_json(tostring(Resources))[0].ARN)
    | summarize Count = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), EventNames = make_set(EventName) by UserIdentityArn, EventName, ResourceArn
    | where Count >= 1
    | project UserIdentityArn, EventName, ResourceArn, Count, FirstSeen, LastSeen, EventNames
  aql: |
    SELECT useridentityarn, eventname, resourcearn, COUNT(*) AS traversal_attempts, FIRST(requestparameters) AS sample_request
    FROM events
    WHERE (QIDNAME(qid) ILIKE '%AWS%' OR QIDNAME(qid) ILIKE '%ELB%' OR categoryname(category) ILIKE '%AWS%')
      AND (eventname ILIKE '%../%' OR eventname ILIKE '%..\\%' OR eventname ILIKE '%2e2e%' OR eventname ILIKE '%252e%' OR eventname ILIKE '%.+.%' OR requestparameters ILIKE '%../%' OR requestparameters ILIKE '%..\\%' OR requestparameters ILIKE '%2e2e%' OR requestparameters ILIKE '%252e%' OR requestparameters ILIKE '%.+.%')
      AND useridentityarn NOT ILIKE '%scanner%'
      AND useridentityarn NOT ILIKE '%monitor%'
      AND useragent NOT ILIKE '%scanner%'
      AND useragent NOT ILIKE '%monitor%'
    GROUP BY useridentityarn, eventname, resourcearn
    HAVING COUNT(*) >= 1
    LAST 24 HOURS
  yara_l: |
    rule aws_elb_directory_traversal_t1078 {
      meta:
        author = "Detection Engineer"
        description = "Detects URL-based directory traversal patterns in AWS ELB HTTP requests"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        (
          re.regex($e.metadata.product_event_type, `(?i)\.\.\/`) or
          re.regex($e.metadata.product_event_type, `(?i)\.\.\\`) or
          re.regex($e.metadata.product_event_type, `(?i)%2e%2e%2f`) or
          re.regex($e.metadata.product_event_type, `(?i)%2e%2e\\`) or
          re.regex($e.metadata.product_event_type, `(?i)\.\.%2f`) or
          re.regex($e.metadata.product_event_type, `(?i)\.\.%5c`) or
          re.regex($e.target.url, `(?i)\.\.\/`) or
          re.regex($e.target.url, `(?i)\.\.\\`) or
          re.regex($e.target.url, `(?i)%2e%2e%2f`) or
          re.regex($e.target.url, `(?i)%2e%2e\\`) or
          re.regex($e.target.url, `(?i)\.\.%2f`) or
          re.regex($e.target.url, `(?i)\.\.%5c`) or
          re.regex($e.network.http.parsed_user_agent, `(?i)\.\.\/`) or
          re.regex($e.about.resource.name, `(?i)\.\.\/`) or
          re.regex($e.about.resource.name, `(?i)\.\.\\`) or
          re.regex($e.about.resource.name, `(?i)%2e%2e`)
        )
        $e.principal.user.userid = $user_arn
        $e.target.resource.name = $resource_arn
        $e.metadata.product_event_type = $event_name
        not re.regex($e.principal.user.userid, `(?i)(scanner|monitor|healthcheck|probe)`)
        not re.regex($e.network.http.parsed_user_agent, `(?i)(scanner|monitor|healthcheck|probe)`)

      match:
        $user_arn, $event_name, $resource_arn over 1h

      condition:
        #e >= 1
    }
  esql: "FROM logs-aws.elb_logs*\n| WHERE @timestamp > NOW() - 24 hour\n  AND (\n    http.request.body.content LIKE \"*../*\" \n    OR http.request.body.content\
    \ LIKE \"*..\\\\*\"\n    OR http.request.body.content LIKE \"*%2e%2e%2f*\"\n    OR http.request.body.content LIKE \"*%2e%2e/*\"\n    OR http.request.body.content\
    \ LIKE \"*..%2f*\"\n    OR http.request.body.content LIKE \"*%252e%252e%252f*\"\n    OR url.full LIKE \"*../*\"\n    OR url.full LIKE \"*..\\\
    \\*\"\n    OR url.full LIKE \"*%2e%2e%2f*\"\n    OR url.full LIKE \"*%2e%2e/*\"\n    OR url.full LIKE \"*..%2f*\"\n    OR url.full LIKE \"\
    *%252e%252e%252f*\"\n    OR url.path LIKE \"*../*\"\n    OR url.path LIKE \"*..\\\\*\"\n    OR url.path LIKE \"*%2e%2e%2f*\"\n    OR url.path\
    \ LIKE \"*%2e%2e/*\"\n    OR url.path LIKE \"*..%2f*\"\n    OR url.path LIKE \"*%252e%252e%252f*\"\n  )\n  AND user_agent.original NOT LIKE\
    \ \"*Security Scanner*\"\n  AND user_agent.original NOT LIKE \"*monitoring*\"\n  AND user_agent.original NOT LIKE \"*healthcheck*\"\n| STATS\
    \ event_count = COUNT(*) BY user.name, url.path, source.ip\n| WHERE event_count >= 1\n| KEEP @timestamp, user.name, url.path, source.ip, event_count\n"
  leql: |
    where(source_json.eventName=/.*(\.\.[\/\\]|\.\.%2[fF]|%2[eE]%2[eE]%2[fF]|%252[eE]%252[eE]%252[fF]|\.\.%5[cC]|%2[eE]%2[eE]%5[cC]).*/i AND source_json.userIdentity.arn!=/^arn:aws:iam::\d+:role\/(SecurityScanner|MonitoringAgent).*/) groupby(source_json.userIdentity.arn, source_json.eventName, source_json.resources{}.ARN) calculate(count)
  crowdstrike: |
    #type=aws:elb
    | regex("(?<traversal>(\\.\\./|\\.\\.\\\\|%2e%2e%2f|%2e%2e%5c|\\.\\.%2f|\\.\\.%5c))", field=request, strict=false)
    | traversal=*
    | groupBy([elb, client_ip, request], function=count(as=traversal_attempts))
    | traversal_attempts >= 1
    | table([elb, client_ip, request, traversal_attempts, @timestamp])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = XDR_CONST.CLOUD_PROVIDER_AWS and log_name contains "elasticloadbalancing"
    | filter request_url ~= "\.\./" or request_url ~= "%2e%2e%2f" or request_url ~= "%252e%252e%252f" or request_url ~= "\.\.%5c" or request_url ~= "%2e%2e%5c" or request_url ~= "\.%2e\/" or request_url ~= "\.\+\."
    | alter resource_arn = coalesce(json_extract_scalar(raw_log, "$.resources[0].ARN"), "")
    | filter actor_user_agent !~= "(?i)(scanner|monitoring|health|probe|check)" and identity_name !~= "(?i)(service|monitor|scanner)"
    | comp count() as traversal_attempts by identity_name, operation_name, resource_arn
    | filter traversal_attempts >= 1
    | fields identity_name, operation_name, resource_arn, traversal_attempts
  lucene: |
    (sourcetype:aws\:cloudtrail OR sourcetype:azure\:auditlogs OR sourcetype:gcp\:audit) AND (eventName:*../* OR eventName:*..\\* OR eventName:*%2e%2e%2f* OR eventName:*%2e%2e%5c* OR eventName:*.+.* OR eventName:*%252e%252e%252f* OR eventName:*%252e%252e%255c*)
  sumo: |
    _sourceCategory=*ELB* OR _sourceCategory=*elb* OR _sourceCategory=*aws/elb*
    | json field=_raw "request_url" as request_url
    | json field=_raw "elb_status_code" as status_code
    | json field=_raw "user_agent" as user_agent
    | json field=_raw "client_ip" as client_ip
    | json field=_raw "target_ip" as target_ip
    | where request_url matches "*../*" OR request_url matches "*%2e%2e%2f*" OR request_url matches "*%2e%2e/*" OR request_url matches "*.%2e/*" OR request_url matches "*..%5c*" OR request_url matches "*%2e%2e%5c*" OR request_url matches "*.+.*"
    | where !(user_agent matches "*scanner*" OR user_agent matches "*monitor*" OR user_agent matches "*bot*")
    | count as event_count by client_ip, request_url, target_ip
    | where event_count >= 1
    | fields client_ip, request_url, target_ip, event_count
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify beaconing characteristics (interval,
  jitter, request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 or more instances over any time window of a URL-based directory traversal pattern detected in HTTP requests received by the load
  balancer.


  From index=cloud where sourcetype is aws:cloudtrail, sourcetype is azure:auditlogs, or sourcetype is gcp:audit

  Where eventName matches a pattern containing directory traversal sequences (e.g. encoded or literal "../" or ".+." constructs)

  With events grouped by userIdentity.arn, eventName, and resources{}.ARN

  Where the count of matching events is greater than or equal to 1

  With the same userIdentity.arn, eventName, and resources{}.ARN as the correlation key

  Excluding known authorized scanners and monitoring agents from alerting consideration'

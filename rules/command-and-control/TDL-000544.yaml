rule_id: TDL-C2-000544
v4_id: '000544'
name: Advance Security Disabled
description: "Detect when a GitHub Advanced Security setting has been disabled.Disabling this turns off the followiung protections Code scanning\t\
  , CodeQL CLI, Secret scanning, Custom auto-triage rules, Dependency review."
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github (action="business_advanced_security.disabled" OR action="org.advanced_security_disabled_on_all_repos" OR action="business_advanced_security.disabled_for_new_repos"
    OR action="org.advanced_security_disabled_for_new_repos" OR action="repo.advanced_security_disabled" OR action="business.advanced_security_policy_update"
    OR action="org.advanced_security_policy_selected_member_disabled")

    | table _time, user, action, repo, org

    '
  kql: |
    GitHubAuditLogEntries
    | where TimeGenerated > ago(90d)
    | where Action in ("business_advanced_security.disabled", "org.advanced_security_disabled_on_all_repos", "business_advanced_security.disabled_for_new_repos", "org.advanced_security_disabled_for_new_repos", "repo.advanced_security_disabled", "business.advanced_security_policy_update", "org.advanced_security_policy_selected_member_disabled")
    | project TimeGenerated, Action, Actor, ActorLocation, Repository, Organization, OperationType
  aql: |
    SELECT eventtime, username, sourceip, "Action", "Repository", "Organization", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%'
      AND "Action" IN ('business_advanced_security.disabled', 'org.advanced_security_disabled_on_all_repos', 'business_advanced_security.disabled_for_new_repos', 'org.advanced_security_disabled_for_new_repos', 'repo.advanced_security_disabled', 'business.advanced_security_policy_update', 'org.advanced_security_policy_selected_member_disabled')
    LAST 24 HOURS
  yara_l: |
    rule github_advanced_security_disabled {
      meta:
        author = "Detection Engineering"
        description = "Detects disabling of GitHub Advanced Security features which may indicate compromise"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.vendor_name = "GITHUB"
        $e.metadata.product_event_type = /business_advanced_security\.disabled|org\.advanced_security_disabled_on_all_repos|business_advanced_security\.disabled_for_new_repos|org\.advanced_security_disabled_for_new_repos|repo\.advanced_security_disabled|business\.advanced_security_policy_update|org\.advanced_security_policy_selected_member_disabled/
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-github*
    | WHERE event.action IN ("business_advanced_security.disabled", "org.advanced_security_disabled_on_all_repos", "business_advanced_security.disabled_for_new_repos", "org.advanced_security_disabled_for_new_repos", "repo.advanced_security_disabled", "business.advanced_security_policy_update", "org.advanced_security_policy_selected_member_disabled")
    | KEEP @timestamp, event.action, user.name, github.org, github.repo, source.ip
  leql: |
    where(source_json.action IN [business_advanced_security.disabled, org.advanced_security_disabled_on_all_repos, business_advanced_security.disabled_for_new_repos, org.advanced_security_disabled_for_new_repos, repo.advanced_security_disabled, business.advanced_security_policy_update, org.advanced_security_policy_selected_member_disabled])
  crowdstrike: |
    #type=github action IN [business_advanced_security.disabled, org.advanced_security_disabled_on_all_repos, business_advanced_security.disabled_for_new_repos, org.advanced_security_disabled_for_new_repos, repo.advanced_security_disabled, business.advanced_security_policy_update, org.advanced_security_policy_selected_member_disabled]
    | table([@timestamp, actor, action, repo, org])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Github" and action in ("business_advanced_security.disabled", "org.advanced_security_disabled_on_all_repos", "business_advanced_security.disabled_for_new_repos", "org.advanced_security_disabled_for_new_repos", "repo.advanced_security_disabled", "business.advanced_security_policy_update", "org.advanced_security_policy_selected_member_disabled")
    | fields _time, actor_user, action, resource, raw_log
  lucene: |
    github.action:(business_advanced_security.disabled OR org.advanced_security_disabled_on_all_repos OR business_advanced_security.disabled_for_new_repos OR org.advanced_security_disabled_for_new_repos OR repo.advanced_security_disabled OR business.advanced_security_policy_update OR org.advanced_security_policy_selected_member_disabled)
  sumo: |
    _sourceCategory=*Github*
    | json field=_raw "action" as action
    | where action in ("business_advanced_security.disabled", "org.advanced_security_disabled_on_all_repos", "business_advanced_security.disabled_for_new_repos", "org.advanced_security_disabled_for_new_repos", "repo.advanced_security_disabled", "business.advanced_security_policy_update", "org.advanced_security_policy_selected_member_disabled")
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions IN (business_advanced_security.disabled, org.advanced_security_disabled_on_all_repos, business_advanced_security.disabled_for_new_repos,\
  \ org.advanced_security_disabled_for_new_repos, repo.advanced_security_disabled, business.advanced_security_policy_update, org.advanced_security_policy_selected_member_disabled)"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000545
v4_id: '000545'
name: Repository Ownership Transfered
description: Detect when a GitHub repository transfer occurs.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github sourcetype=github:audit (action="repo.transfer_outgoing" OR action="repo.transfer_start" OR action="repo.transfer")

    | table _time, actor, action, repo, org, created_at, data.*

    '
  kql: |
    GitHubAuditLogPolling
    | where TimeGenerated > ago(1h)
    | where OperationName in ("repo.transfer_outgoing", "repo.transfer_start", "repo.transfer")
    | project TimeGenerated, OperationName, Actor, Repository, IpAddress, UserAgent, RawEventData
  aql: |
    SELECT eventtime, username, sourceip, QIDNAME(qid), LOGSOURCENAME(logsourceid), "Action", "Repository", "Organization"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%'
      AND "Action" IN ('repo.transfer_outgoing', 'repo.transfer_start', 'repo.transfer')
    LAST 24 HOURS
  yara_l: "rule github_repo_transfer_activity {\n  meta:\n    author = \"TDL\"\n    description = \"Detects GitHub repository transfer events\
    \ (T1078 - Valid Accounts)\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"\
    Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"GITHUB\"\n    (\n      $e.metadata.product_event_type = \"repo.transfer_outgoing\"\
    \ or\n      $e.metadata.product_event_type = \"repo.transfer_start\" or\n      $e.metadata.product_event_type = \"repo.transfer\"\n    )\n\
    \    $e.principal.user.userid = $user\n    \n  match:\n    $user over 1h\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-github.audit*
    | WHERE event.action IN ("repo.transfer_outgoing", "repo.transfer_start", "repo.transfer")
    | KEEP @timestamp, user.name, event.action, github.repo, github.org, source.ip, user.email
  leql: |
    where(source_json.action IN [repo.transfer_outgoing, repo.transfer_start, repo.transfer])
  crowdstrike: |
    #type=github (action=repo.transfer_outgoing OR action=repo.transfer_start OR action=repo.transfer)
    | table([@timestamp, actor, repo, action, org])
  xql: |
    dataset = github_audit_log_raw
    | filter action in ("repo.transfer_outgoing", "repo.transfer_start", "repo.transfer")
    | fields _time, actor, action, repo, org
  lucene: |
    Action:(repo.transfer_outgoing OR repo.transfer_start OR repo.transfer)
  sumo: |
    _sourceCategory=*github* (repo.transfer_outgoing OR repo.transfer_start OR repo.transfer)
    | json field=_raw "action" as action
    | where action in ("repo.transfer_outgoing", "repo.transfer_start", "repo.transfer")
    | fields _messageTime, _sourceHost, action, *
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "! GitHub Event\n   where Action IN (repo.transfer_outgoing, repo.transfer_start, repo.transfer)"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

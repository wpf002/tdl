rule_id: TDL-C2-000547
v4_id: '000547'
name: Organization Removed from Enterprise
description: Detect when a GitHub enterprise organization has been removed. Organization account may have multiple user assciated with them. The
  removal of these could remove multiple users access at once.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github sourcetype=github:audit action="business.remove_organization"

    | table _time, actor, org, action, actor_location.country_code, created_at

    '
  kql: |
    GitHubAudit
    | where TimeGenerated > ago(90d)
    | where OperationType == "business.remove_organization"
    | project TimeGenerated, Actor, ActorLocation, Organization, OperationType, UserAgent, IpAddress
  aql: |
    SELECT eventtime, username, sourceip, "action", QIDNAME(qid), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%'
      AND "action" = 'business.remove_organization'
    LAST 24 HOURS
  yara_l: "rule github_business_remove_organization {\n  meta:\n    author = \"TDL\"\n    description = \"Detects removal of organization from\
    \ GitHub business account - T1078 Command and Control\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"\
    T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.vendor_name = \"GITHUB\"\n    $e.metadata.product_name = \"GITHUB\"\n \
    \   $e.security_result.action = \"business.remove_organization\"\n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 1h\n\
    \    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-github.audit-*
    | WHERE event.action == "business.remove_organization"
    | KEEP @timestamp, github.actor, github.org, github.business, event.action, source.ip, user.name
  leql: |
    where(source_json.action="business.remove_organization")
  crowdstrike: |
    #repo=github action=business.remove_organization
    | table([@timestamp, actor, org, action, business])
  xql: |
    dataset = github_audit_log_raw
    | filter action = "business.remove_organization"
    | fields _time, actor, action, org, user, repo
  lucene: |
    event.action:"business.remove_organization"
  sumo: |
    _sourceCategory=*Github*
    | json field=_raw "action" as action
    | where action = "business.remove_organization"
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions is \"business.remove_organization\""
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

rule_id: TDL-C2-000548
v4_id: 000548
name: Organization Transfered to New Enterprise
description: Detect when a GitHub organization was transferred between enterprise accounts.Threat actors could be attempting to move mulsiple
  user into a new Enterprise to remove access to company owned resources.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github action="org.transfer" | table _time, actor, org, repo, action, created_at

    '
  kql: |
    GitHubAuditLogPolling
    | where Action == "org.transfer"
    | extend ActorUser = tostring(Actor)
    | extend OrgName = tostring(Organization)
    | extend RepoName = tostring(Repository)
    | project TimeGenerated, ActorUser, OrgName, RepoName, Action, ActorLocation, UserAgent
  aql: |
    SELECT eventtime, username, sourceip, destinationip, "Action" AS action, "Organization", QIDNAME(qid), LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%' AND "Action" = 'org.transfer'
    LAST 24 HOURS
  yara_l: |
    rule github_org_transfer_detection {
      meta:
        author = "TDL"
        description = "Detects GitHub organization transfer events (T1078 - Valid Accounts)"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "GitHub"
        $e.metadata.product_event_type = "org.transfer"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-github.audit-*
    | WHERE event.action == "org.transfer"
    | KEEP @timestamp, organization.name, user.name, github.actor, github.repo, event.action, source.ip
  leql: |
    where(source_json.action="org.transfer")
  crowdstrike: |
    #repo=github action=org.transfer
    | table([@timestamp, actor, org, created_at, action, repo, data])
  xql: |
    dataset = github_audit_log_raw
    | filter action = "org.transfer"
    | fields _time, actor, org, action, repo, created_at
  lucene: |
    event.action:"org.transfer"
  sumo: |
    _sourceCategory=*Github* "org.transfer"
    | json field=_raw "action" as action
    | where action = "org.transfer"
    | fields _messageTime, _sourceHost, action, *
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions is \"org.transfer\""
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

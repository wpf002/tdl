rule_id: TDL-C2-000549
v4_id: 000549
name: Branch Protection Disabled
description: Detecs when Branch Protection has been disabled. If this setting is disabled a Threat Actor could upload malcious payloads or delete
  data contained with the Branch
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=github action=\"protected_branch.destroy\" \n| table _time, actor, repo, action, protected_branch_name, org\n"
  kql: |
    GitHubAuditLogPolling
    | where TimeGenerated > ago(1h)
    | where Action == "protected_branch.destroy"
    | project TimeGenerated, Actor, Action, Repository, Branch = tostring(parse_json(Data).branch_name), Organization
  aql: |
    SELECT eventtime, username, sourceip, "Action", "Repository", "Branch", UTF8(payload) AS event_details
    FROM events
    WHERE "Action" = 'protected_branch.destroy'
      AND (logsourcetypename(logsourcetype) ILIKE '%github%' OR categoryname(category) ILIKE '%github%')
    LAST 24 HOURS
  yara_l: "rule github_protected_branch_destroy {\n  meta:\n    author = \"Chronicle Detection Engineering\"\n    description = \"Detects destruction\
    \ of protected branches in GitHub\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique = \"T1078\"\n    severity\
    \ = \"HIGH\"\n  \n  events:\n    $e.metadata.vendor_name = \"GITHUB\"\n    $e.metadata.product_name = \"GITHUB\"\n    $e.metadata.product_event_type\
    \ = \"protected_branch.destroy\"\n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-github.audit*
    | WHERE event.action == "protected_branch.destroy"
    | KEEP @timestamp, user.name, github.repo, github.actor, github.org, event.action, source.ip
  leql: |
    where(source_json.action="protected_branch.destroy")
  crowdstrike: |
    #repo=github action=protected_branch.destroy
    | table([@timestamp, actor, repo, action, created_at, org])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "github" and action = "protected_branch.destroy"
    | fields _time, actor_effective_username, action, resource_name, agent_hostname
  lucene: |
    event.action:"protected_branch.destroy"
  sumo: |
    _sourceCategory=*Github*
    | json field=_raw "action" as action
    | where action = "protected_branch.destroy"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions is \"protected_branch.destroy\""
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

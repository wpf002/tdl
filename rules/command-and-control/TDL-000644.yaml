rule_id: TDL-C2-000644
v4_id: '000644'
name: Suspicious Microsoft Teams Chat Creation from Foreign Tenant - O365
description: Detects when a Microsoft Teams chat is created by a user from a foreign tenant. This could be an attempt to phish an internal user
  for their credentials.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Microsoft Teams
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype="ms:teams:audit" OR sourcetype="o365:management:activity" Operation="ChatCreated" CommunicationType="OnetoOne" (SourceUser="*help*"
    OR SourceUser="*admin*") SourceUserDomain="*.onmicrosoft.com" IsFederatedUser=true

    | table _time, SourceUser, SourceUserDomain, TargetUser, CommunicationType, IsFederatedUser

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(1h)
    | where OfficeWorkload == "MicrosoftTeams"
    | where Operation == "ChatCreated"
    | where CommunicationType == "OneToOne"
    | where UserId has_any ("help", "admin")
    | where UserId contains "#EXT#"
    | where UserId endswith ".onmicrosoft.com"
    | project TimeGenerated, UserId, Members, CommunicationType, OrganizationId, ClientIP, OfficeObjectId
  aql: |
    SELECT "Source User", "Source User Domain", "Communication Type", "Target User", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%teams%'
      AND ("Event Name" ILIKE '%chat%created%' OR "Event Description" ILIKE '%chat%created%' OR qidname(qid) ILIKE '%chat%created%')
      AND "Communication Type" = 'OnetoOne'
      AND ("Source User" ILIKE '%help%' OR "Source User" ILIKE '%admin%')
      AND "Source User Domain" LIKE '%.onmicrosoft.com'
      AND ("Is External" = 'true' OR "Is External User" = 'true' OR "External User" = 'true' OR "Foreign Tenant" = 'true')
    LAST 24 HOURS
  yara_l: |
    rule teams_suspicious_external_oneonone_chat {
      meta:
        author = "TDL"
        description = "Detects one-on-one Teams chat creation from foreign tenant user with help/admin in name and onmicrosoft.com domain"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Microsoft Teams"
        $e.metadata.event_type = "USER_COMMUNICATION"
        $e.metadata.product_event_type = "ChatCreated"
        $e.additional.fields["CommunicationType"] = "OnetoOne"
        (
          re.regex($e.principal.user.userid, `(?i)help`) or
          re.regex($e.principal.user.userid, `(?i)admin`)
        )
        re.regex($e.principal.user.email_addresses, `(?i)\.onmicrosoft\.com$`)
        $e.additional.fields["IsFederatedUser"] = "true"
        $e.target.user.userid = $target_user

      match:
        $target_user over 1h

      condition:
        $e
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"ChatCreated\" \n  AND o365.audit.CommunicationType\
    \ == \"OnetoOne\"\n  AND o365.audit.Members.UPN IS NOT NULL\n  AND (TO_LOWER(o365.audit.Members.UPN) LIKE \"*help*\" OR TO_LOWER(o365.audit.Members.UPN)\
    \ LIKE \"*admin*\")\n  AND o365.audit.Members.TenantId != o365.audit.OrganizationId\n  AND TO_LOWER(o365.audit.Members.UPN) LIKE \"*.onmicrosoft.com\"\
    \n| KEEP @timestamp, user.name, o365.audit.Members.UPN, o365.audit.Members.TenantId, o365.audit.OrganizationId, o365.audit.CommunicationType\n"
  leql: |
    where(source_json.Operation="ChatCreated" AND source_json.CommunicationType="OnetoOne" AND (source_user ICONTAINS "help" OR source_user ICONTAINS "admin") AND source_json.MembershipType="Guest" AND source_user=/.*\.onmicrosoft\.com$/)
  crowdstrike: |
    #type=MSTeams Operation="ChatCreated" CommunicationType="OnetoOne" (UserId=*help* OR UserId=*admin*) CrossTenantOrigin=true UserId=*.onmicrosoft.com
    | table([@timestamp, UserId, CommunicationType, CrossTenantOrigin, ChatId, ComputerName])
  xql: "dataset = msft_teams_raw\n| filter action_teams_operation = \"ChatCreated\" \n  and action_teams_communication_type = \"OneToOne\"\n \
    \ and (lowercase(action_teams_source_user) contains \"help\" or lowercase(action_teams_source_user) contains \"admin\")\n  and action_teams_is_external_tenant\
    \ = \"true\"\n  and action_teams_source_user_domain ~= \".*\\\\.onmicrosoft\\\\.com$\"\n| fields _time, action_teams_source_user, action_teams_source_user_domain,\
    \ action_teams_target_user, action_teams_communication_type\n"
  lucene: |
    event.action:"ChatCreated" AND communication_type:"OnetoOne" AND source.user.name:(*help* OR *admin*) AND teams.external_tenant:true AND source.user.domain:*.onmicrosoft.com
  sumo: |
    _sourceCategory=*Teams* "ChatCreated"
    | json field=_raw "CommunicationType" as comm_type
    | json field=_raw "Members[*].UPN" as source_user
    | json field=_raw "Members[*].TenantId" as tenant_id
    | json field=_raw "OrganizationId" as org_tenant_id
    | where comm_type = "OnetoOne"
    | where source_user matches "*help*" or source_user matches "*admin*"
    | where tenant_id != org_tenant_id
    | where source_user matches "*.onmicrosoft.com"
    | fields _messageTime, source_user, tenant_id, comm_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Microsoft Teams Chat Creation Event

  Where the Communication Type is "OnetoOne"

  Where the Source User contains "help" or "admin"

  Where the Source User is from a Foreign Tenant

  Where the Source User Domain ends in ".onmicrosoft.com"'
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

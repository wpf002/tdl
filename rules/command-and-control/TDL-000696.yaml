rule_id: TDL-C2-000696
v4_id: 000696
name: Mass Password Export
description: Detects when a user exports multiple passwords from 1password. This could be an attempt to exfil passwords for future use.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- 1Password
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 Image="*.+*"

    | stats count values(ComputerName) as hosts values(User) as users by Image, ParentImage, CommandLine

    | where count >= 1

    | rename Image as process_name, ParentImage as parent_process_name, CommandLine as command_line

    | sort - count

    '
  kql: |
    Event
    | where TimeGenerated > ago(24h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend ProcessName = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend Computer = tostring(Computer)
    | extend User = tostring(EventData.User)
    | where ProcessName matches regex @".*\+.*"
    | summarize Count = count(), Computers = make_set(Computer), Users = make_set(User) by ProcessName, ParentProcessName, CommandLine
    | where Count >= 1
    | sort by Count desc
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, LOGSOURCENAME(logsourceid) AS host, username, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1' AND "Process Name" MATCHES '.*\\.\\+.*'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: "rule mitre_t1078_suspicious_process_name_pattern {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects process\
    \ creation with suspicious wildcard-like naming pattern potentially indicating command and control activity\"\n    mitre_attack_tactic = \"\
    Command and Control\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"\
    PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"1\"\n    re.regex($e.target.process.file.full_path, `[^\\\\]+\\.\\+[^\\\\]*$`)\n\
    \    $e.target.process.file.full_path = $process_name\n    $e.target.process.parent_process.file.full_path = $parent_process_name\n    $e.target.process.command_line\
    \ = $command_line\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    \n  match:\n    $process_name, $parent_process_name,\
    \ $command_line over 1h\n    \n  outcome:\n    $host\n    $user\n    $process_name\n    $parent_process_name\n    $command_line\n    \n  condition:\n\
    \    #e >= 1\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE (winlog.event_id == "1" OR event.code == "1") AND process.name RLIKE ".+\\..+"
    | STATS event_count = COUNT(*), hosts = VALUES(host.name), users = VALUES(user.name) BY process.name, process.parent.name, process.command_line
    | WHERE event_count >= 1
    | SORT event_count DESC
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\+.*/) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    EventCode=1
    | regex("^.+\..+$", field=process_name)
    | groupBy([process_name, parent_process_name, CommandLine], function=[count(as=occurrences), collect([ComputerName], multival=true, as=hosts), collect([UserName], multival=true, as=users)])
    | sort(occurrences, order=desc)
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_process_image_name ~= ".*\.\+.*"
    | comp count() as event_count by action_process_image_name, actor_process_image_name, action_process_image_command_line, agent_hostname, actor_effective_username
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    winlog.event_id:1 AND process.name:*\+*
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id = "1"
    | where process_name matches "*.*+*.*"
    | count as occurrences by process_name, parent_process_name, command_line, host, user
    | where occurrences >= 1
    | sort by occurrences desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.

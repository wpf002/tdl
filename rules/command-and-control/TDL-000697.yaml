rule_id: TDL-C2-000697
v4_id: 000697
name: Service Account Created
description: Detects when a service account is created.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- 1Password
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 Image="*.+*"

    | eval process_name=Image, parent_process_name=ParentImage, command_line=CommandLine

    | stats count by process_name, parent_process_name, command_line, ComputerName, User, _time

    | where count >= 1

    | table _time, ComputerName, User, process_name, parent_process_name, command_line

    '
  kql: |
    Event
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend ProcessName = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend CommandLine = tostring(EventData.CommandLine)
    | where ProcessName matches regex @".*\+.*"
    | project TimeGenerated, Computer, ProcessName, ParentProcessName, CommandLine
    | distinct TimeGenerated, Computer, ProcessName, ParentProcessName, CommandLine
  aql: |
    SELECT "Process Name", "Parent Process Name", "Process CommandLine", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1' AND "Process Name" LIKE '%.+%'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine"
    LAST 24 HOURS
  yara_l: |
    rule sysmon_process_creation_t1078 {
      meta:
        author = "Detection Engineer"
        description = "Detects Sysmon Process Creation events for T1078"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "1"
        re.regex($e.target.process.file.full_path, `.+`)
        $e.target.process.file.full_path = $process_name
        $e.principal.process.file.full_path = $parent_process_name
        $e.target.process.command_line = $command_line

      match:
        $process_name, $parent_process_name, $command_line over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE (winlog.event_id == 1 OR event.code == "1") AND process.name RLIKE ".+.*"
    | STATS count = COUNT(*) BY process.name, process.parent.name, process.command_line, host.name, user.name, @timestamp
    | WHERE count >= 1
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\+.*/)
  crowdstrike: |
    event_simpleName=ProcessRollup2 FileName=*.*
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=count(as=instances))
    | instances >= 1
    | table([FileName, ParentBaseFileName, CommandLine, instances])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_evtlog_event_id = 1
    | filter action_process_image_name ~= ".*\.\+.*"
    | fields _time, agent_hostname, action_process_image_name, actor_process_image_name, action_process_image_command_line, actor_effective_username
  lucene: |
    event.code:1 AND process.name:*.+* AND _exists_:process.parent.name AND _exists_:process.command_line
  sumo: |
    _sourceCategory=*1Password* OR _sourceCategory=*endpoint* sourcetype=Sysmon
    | json field=_raw "EventCode" as event_code
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | where event_code = "1" and process_name matches "*.*"
    | fields _messageTime, _sourceHost, process_name, parent_process_name, command_line
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance over any time window of a Sysmon Process Creation event.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1

  With process_name matching the pattern "*.+*"


  With the same process_name, parent_process_name, and command_line'

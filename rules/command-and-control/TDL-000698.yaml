rule_id: TDL-C2-000698
v4_id: 000698
name: Password Vault Exported
description: Detects when a user has exported a password Vault. Password Vaults store multiple passwords and are often shared with multiple users.
tactic: Command and Control
tactic_id: TA0011
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- 1Password
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name="*.+*"

    | stats count by process_name, parent_process_name, command_line, host, user

    | where count >= 1

    '
  kql: |
    Event
    | where TimeGenerated > ago(24h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend ProcessName = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend User = tostring(EventData.User)
    | where ProcessName matches regex @".+\..+"
    | where CommandLine has_any ("export", "vault") or ProcessName has_any ("1password", "op.exe")
    | summarize Count = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by ProcessName, ParentProcessName, CommandLine, Computer, User
    | where Count >= 1
    | project FirstSeen, LastSeen, Computer, User, ProcessName, ParentProcessName, CommandLine, Count
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, LOGSOURCENAME(logsourceid) AS host, username AS user, eventtime, sourceip, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1'
      AND "Process Name" MATCHES '.*\+.*'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username, eventtime, sourceip
    HAVING event_count >= 1
    LAST 24 HOURS
  yara_l: "rule password_vault_export_t1078 {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Password Vault Export\
    \ events indicating potential credential access via T1078\"\n    mitre_attack_tactic = \"Command and Control\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type\
    \ = \"1\"\n    re.regex($e.principal.process.file.full_path, `.+`)\n    $e.principal.process.file.full_path = $process_name\n    $e.principal.process.parent_process.file.full_path\
    \ = $parent_process_name\n    $e.principal.process.command_line = $command_line\n    $e.principal.hostname = $host\n    $e.principal.user.userid\
    \ = $user\n    re.regex($e.principal.process.command_line, `(?i)(1password|password.*vault|vault.*export|export.*password)`)\n    \n  match:\n\
    \    $host, $user, $process_name, $parent_process_name, $command_line over 1h\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n\
    \    $e\n}\n"
  esql: "FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*\n| WHERE (winlog.event_id == \"1\" OR event.code == \"1\") \n  AND\
    \ process.name RLIKE \".+.*\"\n| STATS event_count = COUNT(*) BY process.name, process.parent.name, process.command_line, host.name, user.name\n\
    | WHERE event_count >= 1\n| KEEP process.name, process.parent.name, process.command_line, host.name, user.name, event_count\n"
  leql: |
    where(source_json.EventCode=1 AND process_name=/.+/) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    #type=endpoint event_simpleName=ProcessRollup2 (FileName=*1Password* OR CommandLine=*1Password* OR CommandLine=*export* OR CommandLine=*vault*)
    | groupBy([FileName, ParentBaseFileName, CommandLine, ComputerName, UserName], function=count(as=cnt))
    | cnt >= 1
    | table([ComputerName, UserName, FileName, ParentBaseFileName, CommandLine, cnt, @timestamp])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and action_evtlog_event_id = 1
      and action_process_image_name ~= ".+\..+"
    | comp count() as event_count by action_process_image_name, actor_process_image_name, action_process_image_command_line, agent_hostname, actor_effective_username
    | filter event_count >= 1
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line, event_count
  lucene: |
    EventCode:1 AND process_name:*
  sumo: |
    _sourceCategory=*endpoint* "EventCode=1" OR _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventCode" as event_code
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_code = "1" and (command_line matches "*1password*export*" or command_line matches "*op.*export*" or command_line matches "*vault*export*" or process_name matches "*1password*" or process_name matches "*op.exe*")
    | count by process_name, parent_process_name, command_line, host, user
    | where _count >= 1
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- command-and-control
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'
pseudo_logic: '1 Instance within any window of a Password Vault Export event.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1

  With process_name matching "*.+*"


  Correlation key: by process_name, parent_process_name, command_line, host, and user.


  No deduplication minimum spacing defined; alert triggers on first matching instance with count >= 1.'

rule_id: TDL-C2-000796
v4_id: 000796
name: HTTP Response Body Modified Mid-Path
description: TLS-stripped or plaintext HTTP response with size mismatch vs. server-declared Content-Length, or known-good page hash mismatch from
  gateway. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1659 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1659
technique_name: Content Injection
platform:
- Network
data_sources:
- Network IDS
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=network_ids (sourcetype=suricata OR sourcetype=snort OR sourcetype=zeek OR sourcetype=bro) \n(http.protocol=\"HTTP/1.1\" OR http.protocol=\"\
    HTTP/1.0\" OR tls.sni=*) \n(http.status_code=200 OR http.status=200)\n| eval actual_bytes=coalesce(bytes_out, resp_body_len, http.length,\
    \ response_body_len)\n| eval declared_length=coalesce(http.content_length, content_length, http_content_length)\n| eval size_mismatch=if(isnotnull(declared_length)\
    \ AND isnotnull(actual_bytes) AND declared_length!=actual_bytes, 1, 0)\n| eval response_hash=coalesce(http.response_hash, response_body_hash,\
    \ http_body_hash, md5(http_response_body))\n| lookup known_good_hashes.csv response_hash OUTPUT is_known_good\n| eval hash_mismatch=if(isnotnull(response_hash)\
    \ AND isnull(is_known_good), 1, 0)\n| where size_mismatch=1 OR hash_mismatch=1\n| stats count values(http.hostname) as hostnames values(src_ip)\
    \ as src_ips values(dest_ip) as dest_ips values(declared_length) as content_length values(actual_bytes) as actual_size values(response_hash)\
    \ as hashes by dest_ip, http.hostname\n| where count > 0\n| table _time, dest_ip, hostnames, src_ips, content_length, actual_size, hashes,\
    \ count\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(1h)
    | where DeviceVendor has_any ("Palo Alto", "Fortinet", "Cisco", "Snort", "Suricata", "Zeek")
    | where DeviceEventClassID has_any ("HTTP", "web", "proxy") or Activity has_any ("HTTP", "web-browsing")
    | where ApplicationProtocol in~ ("http", "HTTP") or DestinationPort in (80, 8080)
    | extend ContentLength = extract(@"Content-Length:\s*(\d+)", 1, AdditionalExtensions, typeof(long))
    | extend ActualSize = coalesce(SentBytes, BytesSent, DeviceCustomNumber1, tolong(0))
    | extend HashValue = coalesce(FileHash, DeviceCustomString1, "")
    | extend SizeMismatch = abs(ActualSize - ContentLength)
    | where (isnotnull(ContentLength) and ContentLength > 0 and SizeMismatch > 1024)
        or (isnotempty(HashValue) and DeviceAction !in~ ("allow", "permitted", "success"))
    | project TimeGenerated, SourceIP, DestinationIP, DestinationPort, RequestURL, ContentLength, ActualSize, SizeMismatch, HashValue, DeviceVendor, DeviceAction, Message
  aql: "SELECT sourceip, destinationip, destinationport, username, QIDNAME(qid) AS alert_name, CATEGORYNAME(category) AS alert_category, \"Payload\"\
    , \"HTTP Response Code\", \"Content-Length\", \"Actual Response Size\", COUNT(*) AS occurrences\nFROM events\nWHERE (CATEGORYNAME(category)\
    \ ILIKE '%IDS%' OR CATEGORYNAME(category) ILIKE '%IPS%' OR category IN (6000, 6001))\n  AND (QIDNAME(qid) ILIKE '%content%length%mismatch%'\
    \ \n       OR QIDNAME(qid) ILIKE '%http%size%mismatch%'\n       OR QIDNAME(qid) ILIKE '%stripped%'\n       OR QIDNAME(qid) ILIKE '%hash%mismatch%'\n\
    \       OR QIDNAME(qid) ILIKE '%integrity%violation%'\n       OR (\"HTTP Response Code\" IS NOT NULL AND \"Content-Length\" IS NOT NULL AND\
    \ \"Actual Response Size\" IS NOT NULL))\n  AND destinationport IN (80, 8080, 443, 8443)\nGROUP BY sourceip, destinationip, destinationport,\
    \ username, QIDNAME(qid), CATEGORYNAME(category), \"Payload\", \"HTTP Response Code\", \"Content-Length\", \"Actual Response Size\"\nLAST\
    \ 24 HOURS\n"
  yara_l: "rule t1659_content_hijack_size_mismatch {\n  meta:\n    author = \"TDL\"\n    description = \"Detects TLS-stripped or plaintext HTTP\
    \ responses with size mismatch vs Content-Length header indicating potential content hijack\"\n    mitre_attack_tactic = \"Command and Control\"\
    \n    mitre_attack_technique = \"T1659\"\n    mitre_attack_technique_name = \"Content Injection\"\n    severity = \"HIGH\"\n    \n  events:\n\
    \    $e.metadata.event_type = \"NETWORK_HTTP\"\n    (\n      $e.network.application_protocol = \"HTTP\" or\n      $e.security_result.summary\
    \ = \"TLS_STRIPPED\"\n    )\n    $e.network.direction = \"INBOUND\"\n    $e.network.http.response_code >= 200\n    $e.network.http.response_code\
    \ < 300\n    (\n      (\n        $e.network.http.content_length > 0 and\n        $e.principal.resource.size > 0 and\n        (\n         \
    \ $e.principal.resource.size < $e.network.http.content_length * 0.9 or\n          $e.principal.resource.size > $e.network.http.content_length\
    \ * 1.1\n        )\n      ) or\n      $e.security_result.detection_fields.value = \"HASH_MISMATCH\"\n    )\n    $e.principal.ip = $client_ip\n\
    \    $e.target.ip = $server_ip\n    \n  match:\n    $client_ip, $server_ip over 5m\n    \n  outcome:\n    $risk_score = max(75)\n    \n  condition:\n\
    \    $e\n}\n"
  esql: "FROM logs-network.http*, logs-zeek.http*, logs-suricata.http*, packetbeat-*\n| WHERE @timestamp > NOW() - 1 hour\n  AND network.protocol\
    \ == \"http\"\n  AND http.response.status_code >= 200 AND http.response.status_code < 300\n  AND (\n    (http.response.body.bytes IS NOT NULL\
    \ AND http.response.headers.content-length IS NOT NULL \n     AND TO_LONG(http.response.headers.content-length) != http.response.body.bytes)\n\
    \    OR (http.response.body.hash.sha256 IS NOT NULL AND http.response.body.hash.sha256 != event.baseline_hash)\n  )\n| EVAL size_mismatch\
    \ = CASE(\n    TO_LONG(http.response.headers.content-length) != http.response.body.bytes, \"true\",\n    \"false\"\n  )\n| EVAL hash_mismatch\
    \ = CASE(\n    http.response.body.hash.sha256 IS NOT NULL AND http.response.body.hash.sha256 != event.baseline_hash, \"true\",\n    \"false\"\
    \n  )\n| STATS events = COUNT(*) BY source.ip, destination.ip, url.domain, url.path, size_mismatch, hash_mismatch\n| WHERE events > 0\n| KEEP\
    \ @timestamp, source.ip, destination.ip, url.domain, url.path, events, size_mismatch, hash_mismatch\n"
  leql: |
    where(source_json.protocol IN ["http", "HTTP"] AND (source_json.content_length != source_json.actual_response_size OR source_json.response_hash_mismatch=true)) groupby(destination_address, source_address, source_json.url) calculate(count)
  crowdstrike: |
    #type=network* (protocol=http OR protocol=https tls_stripped=true OR ssl_version=* encryption=none)
    | in(field=status_code, values=[200, 201, 202, 203, 204, 206, 301, 302, 304])
    | response_body_len != content_length OR (known_good_hash=* AND response_hash != known_good_hash)
    | table([@timestamp, src_ip, dest_ip, dest_port, http_host, http_uri, status_code, content_length, response_body_len, response_hash, known_good_hash])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter app ~= "(?i)(http|web-browsing)" and action = "allow"
    | filter to_string(bytes_received) != "" and to_string(http_content_length) != ""
    | alter size_mismatch = to_number(bytes_received) != to_number(http_content_length)
    | filter size_mismatch = true
    | fields _time, src_ip, dst_ip, dst_port, app, bytes_received, http_content_length, http_url, action
  lucene: |
    (network.protocol:http OR network.transport:tcp) AND (http.response.status_code:[200 TO 299]) AND (_exists_:http.response.body.bytes AND _exists_:http.response.headers.content_length AND NOT http.response.body.bytes:http.response.headers.content_length) OR (event.dataset:"suricata.http" AND http.response.status_code:[200 TO 299] AND alert.signature:*mismatch*) OR (event.dataset:"zeek.http" AND resp_mime_types:* AND NOT tls.established:true AND (_exists_:http.response_body_len AND _exists_:http.content_length AND NOT http.response_body_len:http.content_length))
  sumo: |
    _sourceCategory=*Network* OR _sourceCategory=*IDS* OR _sourceCategory=*HTTP* (http OR tls OR ssl)
    | json field=_raw "protocol" as protocol
    | json field=_raw "http.response.status" as status_code
    | json field=_raw "http.response.content_length" as declared_length
    | json field=_raw "http.response.body_length" as actual_length
    | json field=_raw "http.response.body_hash" as body_hash
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "http.hostname" as hostname
    | json field=_raw "http.uri" as uri
    | where (protocol = "http" OR protocol = "plaintext") AND status_code = "200"
    | where (declared_length != actual_length AND declared_length != "" AND actual_length != "") OR (body_hash != "" AND body_hash matches "*mismatch*")
    | fields _messageTime, src_ip, dest_ip, dest_port, hostname, uri, protocol, declared_length, actual_length, body_hash
pseudo_logic: TLS-stripped or plaintext HTTP response with size mismatch vs. server-declared Content-Length, or known-good page hash mismatch
  from gateway.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.

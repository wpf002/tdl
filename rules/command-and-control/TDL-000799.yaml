rule_id: TDL-C2-000799
v4_id: 000799
name: Self-Signed TLS Certificate on Outbound Beacon
description: Outbound TLS to non-cdn IP with self-signed cert and unusual subject, repeated session every 30–120s. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1573 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1573
technique_name: Encrypted Channel
platform:
- Network
data_sources:
- Network IDS
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=network sourcetype=suricata* (event_type=tls OR tag=tls) dest_port=443 src_ip IN (\"10.*\", \"172.16.*\", \"172.17.*\", \"172.18.*\"\
    , \"172.19.*\", \"172.20.*\", \"172.21.*\", \"172.22.*\", \"172.23.*\", \"172.24.*\", \"172.25.*\", \"172.26.*\", \"172.27.*\", \"172.28.*\"\
    , \"172.29.*\", \"172.30.*\", \"172.31.*\", \"192.168.*\") NOT (dest_ip IN (\"13.107.*\", \"13.224.*\", \"13.225.*\", \"13.226.*\", \"13.227.*\"\
    , \"13.228.*\", \"13.32.*\", \"13.33.*\", \"13.35.*\", \"13.54.*\", \"13.224.*\", \"18.64.*\", \"18.160.*\", \"18.164.*\", \"23.*.*.* \",\
    \ \"34.*.*.* \", \"35.*.*.* \", \"52.*.*.* \", \"54.*.*.* \", \"104.*.*.* \", \"151.101.*\", \"172.64.*\", \"172.65.*\", \"172.66.*\", \"\
    172.67.*\", \"185.199.*\", \"2.16.*\", \"2.17.*\", \"2.18.*\", \"2.19.*\", \"2.20.*\", \"2.21.*\", \"2.22.*\", \"2.23.*\"))\ntls.issuer=*\
    \ tls.subject=* \n(tls.issuer=tls.subject OR tls.validation_status=\"*self*\" OR tls.validation_status=\"*untrusted*\") \n(tls.subject!=\"\
    *cloudflare*\" AND tls.subject!=\"*akamai*\" AND tls.subject!=\"*fastly*\" AND tls.subject!=\"*amazon*\" AND tls.subject!=\"*microsoft*\"\
    \ AND tls.subject!=\"*google*\" AND tls.subject!=\"*azure*\" AND tls.subject!=\"*.com*\" AND tls.subject!=\"*.net*\" AND tls.subject!=\"*.org*\"\
    )\n| bin _time span=5m\n| stats count dc(_time) as session_count earliest(_time) as first_seen latest(_time) as last_seen values(tls.subject)\
    \ as subjects values(tls.issuer) as issuers by src_ip, dest_ip, dest_port\n| where session_count >= 3\n| eval duration=(last_seen - first_seen)\n\
    | eval avg_interval=duration/(session_count - 1)\n| where avg_interval >= 30 AND avg_interval <= 120\n| table src_ip, dest_ip, dest_port,\
    \ subjects, issuers, session_count, avg_interval, first_seen, last_seen\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tls"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tls%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_c2_000799 {\n  meta:\n    author = \"TDL\"\n    description = \"Self-Signed TLS Certificate on Outbound Beacon\"\n   \
    \ severity = \"MEDIUM\"\n    tactic = \"TA0011\"\n    technique = \"T1573\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /tls/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tls%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tls/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tls*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tls"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tls*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tls*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '

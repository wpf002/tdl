rule_id: TDL-C2-000800
v4_id: 000800
name: Process Switching Between Multiple Outbound Endpoints
description: Single process initiates outbound to ≥3 distinct unrelated domains within 5m using identical request cadence. Generated from gap
  analysis against canonical ATT&CK Enterprise matrix (T1008 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1008
technique_name: Fallback Channels
platform:
- Network
data_sources:
- Network IDS
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=network sourcetype=bro* OR sourcetype=zeek* OR sourcetype=suricata* OR sourcetype=snort* \n| bin _time span=5m \n| stats dc(query)\
    \ as unique_domains, count as total_requests, stdev(eval(round(_time, 0))) as cadence_stdev by _time, src_ip, src_port \n| where unique_domains\
    \ >= 3 AND cadence_stdev < 2\n| table _time, src_ip, src_port, unique_domains, total_requests, cadence_stdev\n"
  kql: "let lookback = 5m;\nlet min_domains = 3;\nCommonSecurityLog\n| where TimeGenerated > ago(lookback)\n| where DeviceAction in (\"allowed\"\
    , \"permit\")\n| where CommunicationDirection == \"outbound\" or (isempty(CommunicationDirection) and DestinationIP !startswith \"10.\" and\
    \ DestinationIP !startswith \"172.16.\" and DestinationIP !startswith \"192.168.\")\n| where isnotempty(DestinationHostName) and isnotempty(SourceProcessName)\n\
    | extend Domain = tolower(DestinationHostName)\n| extend Process = tolower(SourceProcessName)\n| summarize \n    requests = count(),\n   \
    \ intervals = make_list(TimeGenerated),\n    domains = make_set(Domain)\n    by bin(TimeGenerated, lookback), SourceIP, Process\n| extend\
    \ domain_count = array_length(domains)\n| where domain_count >= min_domains\n| extend interval_diffs = array_slice(\n    array_sort_asc(\n\
    \        range(0, array_length(intervals) - 2, 1)\n        | mv-apply idx = range(0, array_length(intervals) - 2, 1) on (\n            extend\
    \ diff = datetime_diff('second', intervals[idx + 1], intervals[idx])\n            | project diff\n        )\n    ), 0, -1)\n| extend avg_cadence\
    \ = avg(interval_diffs), stdev_cadence = stdev(interval_diffs)\n| where stdev_cadence < 2 or (requests >= 3 and stdev_cadence < avg_cadence\
    \ * 0.2)\n| project TimeGenerated, SourceIP, Process, domain_count, domains, requests, avg_cadence, stdev_cadence\n"
  aql: |
    SELECT sourceip, destinationip, COUNT(DISTINCT destinationip) AS unique_destinations, COUNT(*) AS total_connections
    FROM flows
    WHERE destinationport IN (80, 443, 8080, 8443)
    GROUP BY sourceip
    HAVING unique_destinations >= 3 AND total_connections >= unique_destinations * 3
    LAST 5 MINUTES
  yara_l: |
    rule fallback_channels_identical_cadence {
      meta:
        author = "TDL"
        description = "Detects single process connecting to multiple unrelated domains with identical request cadence (T1008)"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1008"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.network.direction = "OUTBOUND"
        $e.principal.process.pid = $pid
        $e.principal.hostname = $host
        $e.target.hostname = $domain
        $e.metadata.event_timestamp.seconds = $timestamp

      match:
        $host, $pid over 5m

      outcome:
        $risk_score = 75
        $domains = array_distinct($domain)
        $domain_count = count_distinct($domain)
        $timestamps = array($timestamp)

      condition:
        $e and $domain_count >= 3
    }
  esql: "FROM logs-network*\n| WHERE @timestamp > NOW() - 5 minutes AND network.direction == \"outbound\" AND destination.domain IS NOT NULL\n\
    | STATS \n    domains = COUNT_DISTINCT(destination.domain),\n    request_times = VALUES(@timestamp),\n    request_count = COUNT(*)\n    BY\
    \ source.ip, source.port, process.pid, time_bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE domains >= 3\n| EVAL time_diffs = request_times\n\
    | KEEP @timestamp, source.ip, source.port, process.pid, domains, request_count\n"
  leql: |
    where(log_source_name="Network IDS" AND direction="outbound") groupby(source_address, process_name) calculate(unique:destination_domain)
  crowdstrike: |
    #type=netflow OR event_simpleName=NetworkConnectIP4 OR #type=ids
    | bucket(span=5m, as=window_time)
    | groupBy([window_time, SourceProcessId, SourceHost], function=collect([DestinationDomain, @timestamp]))
    | regex("(?<dest_domain>[^.]+\.[^.]+)$", field=DestinationDomain, strict=false)
    | groupBy([window_time, SourceProcessId, SourceHost], function=count(dest_domain, distinct=true, as=distinct_domains))
    | distinct_domains >= 3
    | table([window_time, SourceHost, SourceProcessId, distinct_domains])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action = "allow" and direction = "outbound" and app_category in ("web-browsing", "general-internet", "proxy")
    | bin _time span=5m
    | alter domain = coalesce(http_host_name, dest_host)
    | filter domain != null
    | comp count() as requests, count_distinct(domain) as unique_domains, avg(bytes_sent) as avg_bytes by _time, source_ip, source_port, application
    | filter unique_domains >= 3
    | fields _time, source_ip, source_port, application, unique_domains, requests, avg_bytes
  lucene: |
    event.category:network AND network.direction:outbound AND network.protocol:dns AND _exists_:dns.question.name AND _exists_:source.ip
  sumo: |
    _sourceCategory=*Network* OR _sourceCategory=*IDS* OR _sourceCategory=*Firewall*
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "domain" as domain
    | json field=_raw "process" as process
    | json field=_raw "timestamp" as event_time
    | where isValidIP(dest_ip) and !isNull(domain) and !isNull(process)
    | timeslice 5m
    | count as request_count by _timeslice, src_ip, process, domain
    | count_distinct(domain) as unique_domains, avg(request_count) as avg_requests, stddev(request_count) as stddev_requests by _timeslice, src_ip, process
    | where unique_domains >= 3 and stddev_requests < (avg_requests * 0.1)
    | fields _timeslice, src_ip, process, unique_domains, avg_requests, stddev_requests
pseudo_logic: Single process initiates outbound to ≥3 distinct unrelated domains within 5m using identical request cadence.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-C2-000801
v4_id: 000801
name: TLS SNI Disagrees With HTTP Host Header
description: TLS SNI = popular CDN (cloudfront, akamai), HTTP Host header = unrelated domain. Domain-fronting indicator. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1665 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1665
technique_name: Hide Infrastructure
platform:
- Network
data_sources:
- DNS Logs
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=dns OR index=network sourcetype IN (stream:dns, stream:http, bro:dns, bro:http, zeek:dns, zeek:http)
    | eval is_tls_sni=if(isnotnull(ssl_server_name) OR isnotnull(server_name) OR isnotnull(tls_sni), 1, 0)
    | eval is_http_host=if(isnotnull(host) OR isnotnull(http_host) OR isnotnull(Host), 1, 0)
    | eval tls_sni_field=coalesce(ssl_server_name, server_name, tls_sni)
    | eval http_host_field=coalesce(host, http_host, Host)
    | where is_tls_sni=1 AND is_http_host=1
    | eval cdn_match=case(
        match(tls_sni_field, "(?i)cloudfront\.net"), "cloudfront",
        match(tls_sni_field, "(?i)akamai\.net"), "akamai",
        match(tls_sni_field, "(?i)akamaiedge\.net"), "akamai",
        match(tls_sni_field, "(?i)akamaitechnologies\.com"), "akamai",
        match(tls_sni_field, "(?i)edgesuite\.net"), "akamai",
        match(tls_sni_field, "(?i)edgekey\.net"), "akamai",
        match(tls_sni_field, "(?i)cloudflare\.net"), "cloudflare",
        match(tls_sni_field, "(?i)fastly\.net"), "fastly",
        1=1, null())
    | where isnotnull(cdn_match)
    | eval tls_domain=lower(replace(tls_sni_field, "^.*\.([^.]+\.[^.]+)$", "\1"))
    | eval http_domain=lower(replace(http_host_field, "^.*\.([^.]+\.[^.]+)$", "\1"))
    | where tls_domain!=http_domain
    | stats count values(tls_sni_field) as tls_sni values(http_host_field) as http_host by src_ip, dest_ip, cdn_match
    | table _time, src_ip, dest_ip, cdn_match, tls_sni, http_host, count
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tls"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tls%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_c2_000801 {\n  meta:\n    author = \"TDL\"\n    description = \"TLS SNI Disagrees With HTTP Host Header\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0011\"\n    technique = \"T1665\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /tls/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tls%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tls/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tls*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tls"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tls*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tls*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: TLS SNI = popular CDN (cloudfront, akamai), HTTP Host header = unrelated domain. Domain-fronting indicator.

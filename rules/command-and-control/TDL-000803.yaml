rule_id: TDL-C2-000803
v4_id: 000803
name: Two-Domain Beacon Pattern (Stage1 → Stage2)
description: Outbound to one domain, then within 5m a second outbound to a different domain with markedly different cadence/cert fingerprint,
  from same process. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1104 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1104
technique_name: Multi-Stage Channels
platform:
- Network
data_sources:
- Network IDS
severity: Medium
fidelity: Low
lifecycle: Proposed
risk_score: 50
queries:
  spl: |
    index=network_ids sourcetype=ids OR sourcetype=suricata (event_type=tls OR event_type=alert) dest_port IN (443, 8443)
    | eval connection_id=src_ip.":".src_port.":".process_name
    | sort 0 _time
    | streamstats earliest(_time) as first_time, latest(_time) as last_time, dc(dest_domain) as domain_count, dc(tls_fingerprint) as cert_count, count as conn_count by connection_id window=300
    | where domain_count >= 2 AND (last_time - first_time) <= 300 AND cert_count >= 2
    | stats values(dest_domain) as domains, values(dest_ip) as dest_ips, values(tls_fingerprint) as cert_fingerprints, dc(dest_domain) as unique_domains, dc(tls_fingerprint) as unique_certs, count as total_connections, min(_time) as first_conn, max(_time) as last_conn by src_ip, src_port, process_name
    | where unique_domains >= 2 AND unique_certs >= 2 AND (last_conn - first_conn) <= 300
    | table first_conn, src_ip, src_port, process_name, domains, dest_ips, cert_fingerprints, unique_domains, unique_certs, total_connections
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_c2_000803 {\n  meta:\n    author = \"TDL\"\n    description = \"Two-Domain Beacon Pattern (Stage1 → Stage2)\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0011\"\n    technique = \"T1104\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: Outbound to one domain, then within 5m a second outbound to a different domain with markedly different cadence/cert fingerprint,
  from same process.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:

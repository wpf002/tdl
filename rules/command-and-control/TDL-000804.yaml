rule_id: TDL-C2-000804
v4_id: 000804
name: Sustained ICMP With Large Payload
description: ICMP echo with payload > 64 bytes sustained for >10m to single external IP. ICMP tunnel. Generated from gap analysis against canonical
  ATT&CK Enterprise matrix (T1095 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1095
technique_name: Non-Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
- Network IDS
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=network (sourcetype=firewall OR sourcetype=ids OR sourcetype=nids) (protocol=icmp OR icmp_type=8 OR icmp_type="echo-request")
    | eval packet_size=coalesce(bytes, packet_size, length, size)
    | where packet_size > 64
    | eval dest_ip=coalesce(dest_ip, destination_ip, dest, dvc)
    | search NOT dest_ip IN ("10.*", "172.16.*", "172.17.*", "172.18.*", "172.19.*", "172.20.*", "172.21.*", "172.22.*", "172.23.*", "172.24.*", "172.25.*", "172.26.*", "172.27.*", "172.28.*", "172.29.*", "172.30.*", "172.31.*", "192.168.*")
    | bin _time span=10m
    | stats earliest(_time) as first_seen, latest(_time) as last_seen, count, dc(src_ip) as unique_sources by dest_ip, _time
    | eval duration_minutes=(last_seen - first_seen)/60
    | where duration_minutes >= 10
    | table first_seen, last_seen, dest_ip, unique_sources, count, duration_minutes
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "icmp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%icmp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_c2_000804 {\n  meta:\n    author = \"TDL\"\n    description = \"Sustained ICMP With Large Payload\"\n    severity = \"\
    MEDIUM\"\n    tactic = \"TA0011\"\n    technique = \"T1095\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /icmp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%icmp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/icmp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*icmp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "icmp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*icmp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*icmp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: ICMP echo with payload > 64 bytes sustained for >10m to single external IP. ICMP tunnel.

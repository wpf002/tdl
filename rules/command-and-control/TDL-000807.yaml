rule_id: TDL-C2-000807
v4_id: 000807
name: Unsanctioned Remote-Access Tool Execution
description: Process names matching anydesk, teamviewer, splashtop, screenconnect, atera, ngrok, gotomypc on a host where those products are not
  deployed by IT. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1219 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1219
technique_name: Remote Access Software
platform:
- Windows
- macOS
data_sources:
- Sysmon
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=* sourcetype IN ("WinEventLog:Microsoft-Windows-Sysmon/Operational", "edr*") EventCode=1 OR action=process_create (Image="*anydesk*"
    OR Image="*teamviewer*" OR Image="*splashtop*" OR Image="*screenconnect*" OR Image="*atera*" OR Image="*ngrok*" OR Image="*gotomypc*" OR process_name="*anydesk*"
    OR process_name="*teamviewer*" OR process_name="*splashtop*" OR process_name="*screenconnect*" OR process_name="*atera*" OR process_name="*ngrok*"
    OR process_name="*gotomypc*")

    | eval suspect_process=coalesce(Image, process_name)

    | eval host_lower=lower(coalesce(ComputerName, host, dest))

    | lookup approved_remote_tools.csv host_lower OUTPUT approved

    | where isnull(approved) OR approved!="true"

    | stats count values(suspect_process) as remote_tool values(CommandLine) as command_line values(User) as user by _time, host_lower

    | table _time, host_lower, user, remote_tool, command_line, count

    '
  kql: "union \n(SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 4688\n| where NewProcessName has_any (\"anydesk.exe\", \"\
    teamviewer.exe\", \"splashtop.exe\", \"screenconnect\", \"atera\", \"ngrok.exe\", \"gotomypc.exe\")\n| extend ProcessName = tostring(split(NewProcessName,\
    \ \"\\\\\")[-1])\n| project TimeGenerated, Computer, Account, ProcessName, NewProcessName, CommandLine),\n(DeviceProcessEvents\n| where TimeGenerated\
    \ > ago(24h)\n| where FileName has_any (\"anydesk.exe\", \"teamviewer.exe\", \"splashtop.exe\", \"screenconnect\", \"atera\", \"ngrok.exe\"\
    , \"gotomypc.exe\")\n| project TimeGenerated, Computer=DeviceName, Account=AccountName, ProcessName=FileName, NewProcessName=FolderPath, CommandLine=ProcessCommandLine),\n\
    (Event\n| where TimeGenerated > ago(24h)\n| where EventID == 1\n| where EventData has_any (\"anydesk\", \"teamviewer\", \"splashtop\", \"\
    screenconnect\", \"atera\", \"ngrok\", \"gotomypc\")\n| extend EventXML = parse_xml(EventData)\n| extend Image = tostring(EventXML.DataItem.EventData.Data[4][\"\
    #text\"])\n| extend CommandLine = tostring(EventXML.DataItem.EventData.Data[10][\"#text\"])\n| where Image has_any (\"anydesk.exe\", \"teamviewer.exe\"\
    , \"splashtop.exe\", \"screenconnect\", \"atera\", \"ngrok.exe\", \"gotomypc.exe\")\n| extend ProcessName = tostring(split(Image, \"\\\\\"\
    )[-1])\n| project TimeGenerated, Computer, Account=UserName, ProcessName, NewProcessName=Image, CommandLine)\n| summarize FirstSeen=min(TimeGenerated),\
    \ LastSeen=max(TimeGenerated), ExecutionCount=count() by Computer, Account, ProcessName, NewProcessName, CommandLine\n| project FirstSeen,\
    \ LastSeen, Computer, Account, ProcessName, NewProcessName, CommandLine, ExecutionCount\n"
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Process Name\", \"Process CommandLine\", \"Parent Process Name\", sourceip\n\
    FROM events\nWHERE (\"Process Name\" ILIKE '%anydesk%' \n   OR \"Process Name\" ILIKE '%teamviewer%' \n   OR \"Process Name\" ILIKE '%splashtop%'\
    \ \n   OR \"Process Name\" ILIKE '%screenconnect%' \n   OR \"Process Name\" ILIKE '%atera%' \n   OR \"Process Name\" ILIKE '%ngrok%' \n  \
    \ OR \"Process Name\" ILIKE '%gotomypc%'\n   OR \"Image\" ILIKE '%anydesk%'\n   OR \"Image\" ILIKE '%teamviewer%'\n   OR \"Image\" ILIKE '%splashtop%'\n\
    \   OR \"Image\" ILIKE '%screenconnect%'\n   OR \"Image\" ILIKE '%atera%'\n   OR \"Image\" ILIKE '%ngrok%'\n   OR \"Image\" ILIKE '%gotomypc%')\n\
    LAST 1 HOURS\n"
  yara_l: |
    rule remote_access_tool_execution {
      meta:
        author = "Detection Engineering"
        description = "Detects execution of common remote access tools: AnyDesk, TeamViewer, Splashtop, ScreenConnect, Atera, ngrok, GoToMyPC"
        mitre_attack_tactic = "Command and Control"
        mitre_attack_technique = "T1219"
        platform = "Windows, macOS"
        data_source = "Sysmon, EDR"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.file.full_path, `(?i)anydesk\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)teamviewer\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)splashtop.*\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)screenconnect.*\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)atera.*\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)ngrok\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)g2m.*\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)gotomypc\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)/anydesk$`) or
          re.regex($e.principal.process.file.full_path, `(?i)/teamviewer$`) or
          re.regex($e.principal.process.file.full_path, `(?i)/ngrok$`) or
          re.regex($e.principal.process.file.full_path, `(?i)\.app/Contents/MacOS/anydesk`) or
          re.regex($e.principal.process.file.full_path, `(?i)\.app/Contents/MacOS/teamviewer`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 65

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        TO_LOWER(process.name) LIKE "*anydesk*"
        OR TO_LOWER(process.name) LIKE "*teamviewer*"
        OR TO_LOWER(process.name) LIKE "*splashtop*"
        OR TO_LOWER(process.name) LIKE "*screenconnect*"
        OR TO_LOWER(process.name) LIKE "*atera*"
        OR TO_LOWER(process.name) LIKE "*ngrok*"
        OR TO_LOWER(process.name) LIKE "*gotomypc*"
        OR TO_LOWER(process.executable) LIKE "*anydesk*"
        OR TO_LOWER(process.executable) LIKE "*teamviewer*"
        OR TO_LOWER(process.executable) LIKE "*splashtop*"
        OR TO_LOWER(process.executable) LIKE "*screenconnect*"
        OR TO_LOWER(process.executable) LIKE "*atera*"
        OR TO_LOWER(process.executable) LIKE "*ngrok*"
        OR TO_LOWER(process.executable) LIKE "*gotomypc*"
      )
    | STATS first_seen = MIN(@timestamp), last_seen = MAX(@timestamp), count = COUNT(*) BY host.name, process.name, process.executable, user.name
    | KEEP first_seen, last_seen, count, host.name, process.name, process.executable, user.name
  leql: |
    where(process_name ICONTAINS "anydesk" OR process_name ICONTAINS "teamviewer" OR process_name ICONTAINS "splashtop" OR process_name ICONTAINS "screenconnect" OR process_name ICONTAINS "atera" OR process_name ICONTAINS "ngrok" OR process_name ICONTAINS "gotomypc") groupby(asset, process_name) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (FileName=*anydesk* OR FileName=*teamviewer* OR FileName=*splashtop* OR FileName=*screenconnect* OR FileName=*atera* OR FileName=*ngrok* OR FileName=*gotomypc*)
    | table([@timestamp, ComputerName, UserName, FileName, FilePath, CommandLine, ParentBaseFileName, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter lowercase(action_process_image_name) ~= "anydesk|teamviewer|splashtop|screenconnect|atera|ngrok|gotomypc"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    process.name:(anydesk* OR teamviewer* OR splashtop* OR screenconnect* OR atera* OR ngrok* OR gotomypc*) AND NOT host.name:(approved_host_1 OR approved_host_2 OR approved_host_3)
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*EDR* OR _sourceCategory=*Windows*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_image
    | json field=_raw "NewProcessName" as new_process_name
    | json field=_raw "ProcessName" as process_name
    | json field=_raw "process_path" as edr_process_path
    | json field=_raw "Computer" as computer
    | json field=_raw "host" as host
    | parse field=process_image "*\\*" as path, process_file
    | parse field=new_process_name "*\\*" as path2, process_file2
    | parse field=edr_process_path "*\\*" as path3, process_file3
    | where process_image matches "*anydesk*" OR process_image matches "*teamviewer*" OR process_image matches "*splashtop*" OR process_image matches "*screenconnect*" OR process_image matches "*atera*" OR process_image matches "*ngrok*" OR process_image matches "*gotomypc*" OR new_process_name matches "*anydesk*" OR new_process_name matches "*teamviewer*" OR new_process_name matches "*splashtop*" OR new_process_name matches "*screenconnect*" OR new_process_name matches "*atera*" OR new_process_name matches "*ngrok*" OR new_process_name matches "*gotomypc*" OR process_name matches "*anydesk*" OR process_name matches "*teamviewer*" OR process_name matches "*splashtop*" OR process_name matches "*screenconnect*" OR process_name matches "*atera*" OR process_name matches "*ngrok*" OR process_name matches "*gotomypc*" OR edr_process_path matches "*anydesk*" OR edr_process_path matches "*teamviewer*" OR edr_process_path matches "*splashtop*" OR edr_process_path matches "*screenconnect*" OR edr_process_path matches "*atera*" OR edr_process_path matches "*ngrok*" OR edr_process_path matches "*gotomypc*"
    | fields _messageTime, computer, host, _sourceHost, process_image, new_process_name, process_name, edr_process_path
pseudo_logic: Process names matching anydesk, teamviewer, splashtop, screenconnect, atera, ngrok, gotomypc on a host where those products are
  not deployed by IT.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- rmm
- remote-access
- t1219
- command-and-control
references:
- https://attack.mitre.org/techniques/T1219/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination domain/IP, and the cadence pattern detected.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify beaconing characteristics (interval, jitter,
  request size, server response code).
- Pull WHOIS / TLS / passive-DNS context on the destination — newly registered or low-reputation infrastructure raises confidence.
- Identify the originating process and trace it back to its install / launch event (initial access / persistence stage).
- 'Decide TP / FP: FP for sanctioned OOB management agents (allowlist them); TP for unattended periodic egress to new infrastructure.'
- 'If TP: block the destination at egress, isolate the host, capture network PCAP / memory while session is live, and escalate to IR.'

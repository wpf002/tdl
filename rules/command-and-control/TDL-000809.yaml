rule_id: TDL-C2-000809
v4_id: 000809
name: Programmatic Access to Public Paste/Drive Service
description: Non-browser process connecting to pastebin.com, raw.githubusercontent.com, hastebin, paste.ee, or telegram-bot API. Web-service C2.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1102 under Command and Control).
tactic: Command and Control
tactic_id: TA0011
technique_id: T1102
technique_name: Web Service
platform:
- Network
data_sources:
- DNS Logs
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=network (sourcetype=dns OR sourcetype=firewall OR sourcetype=proxy OR sourcetype=web) \n(query=\"*pastebin.com*\" OR query=\"*raw.githubusercontent.com*\"\
    \ OR query=\"*hastebin.com*\" OR query=\"*paste.ee*\" OR query=\"*api.telegram.org/bot*\" OR dest_domain=\"*pastebin.com*\" OR dest_domain=\"\
    *raw.githubusercontent.com*\" OR dest_domain=\"*hastebin.com*\" OR dest_domain=\"*paste.ee*\" OR dest_domain=\"*api.telegram.org/bot*\" OR\
    \ url=\"*pastebin.com*\" OR url=\"*raw.githubusercontent.com*\" OR url=\"*hastebin.com*\" OR url=\"*paste.ee*\" OR url=\"*api.telegram.org/bot*\"\
    )\nNOT (process_name IN (\"*chrome.exe\", \"*firefox.exe\", \"*msedge.exe\", \"*safari.exe\", \"*iexplore.exe\", \"*opera.exe\", \"*brave.exe\"\
    ) OR process IN (\"*chrome.exe\", \"*firefox.exe\", \"*msedge.exe\", \"*safari.exe\", \"*iexplore.exe\", \"*opera.exe\", \"*brave.exe\") OR\
    \ app IN (\"chrome\", \"firefox\", \"edge\", \"safari\", \"iexplore\", \"opera\", \"brave\"))\n| eval dest_domain=coalesce(query, dest_domain,\
    \ url)\n| stats count values(dest_domain) as domains values(process_name) as process values(src) as source_ip by host\n| where count > 0\n\
    | table _time, host, source_ip, process, domains, count\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_c2_000809 {\n  meta:\n    author = \"TDL\"\n    description = \"Programmatic Access to Public Paste/Drive Service\"\n\
    \    severity = \"MEDIUM\"\n    tactic = \"TA0011\"\n    technique = \"T1102\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Non-browser process connecting to pastebin.com, raw.githubusercontent.com, hastebin, paste.ee, or telegram-bot API. Web-service

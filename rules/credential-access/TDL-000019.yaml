rule_id: TDL-CA-000019
v4_id: 000019
name: Kerberoasting Activity
description: Kerberoasting can be an effective method for extracting service account credentials from Active Directory as a regular user without
  having to escalate privileges. This attack is effective because service accounts are typically given easy passwords and set to never expire
  which makes brute forcing them a viable method of attack.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1558
technique_name: Steal or Forge Kerberos Tickets
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4769'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=673 OR EventCode=4769) Failure_Code="0x0" (Ticket_Encryption_Type=0x17 OR
    Ticket_Encryption_Type=0x18) (Ticket_Options="0x40810000" OR Ticket_Options="0x40810010" OR Ticket_Options="0x40800000")

    | where Service_Name!="krbtgt" AND NOT like(Account_Name, "%$") AND NOT like(Service_Name, "%$") AND NOT like(Service_Name, "%.LOCAL") AND
    NOT like(Service_Name, "%.COM")

    | bin _time span=1m

    | stats dc(Service_Name) as unique_services values(Service_Name) as service_names by _time, Account_Name, ComputerName

    | where unique_services >= 7

    | table _time, Account_Name, ComputerName, unique_services, service_names

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (673, 4769)\n| where FailureCode == \"0x0\"\n| where TicketEncryptionType\
    \ in (\"0x17\", \"0x18\")\n| where TicketOptions in (\"0x40810000\", \"0x40810010\", \"0x40800000\")\n| where ServiceName !~ \"krbtgt\"\n\
    | where TargetUserName !endswith \"$\"\n| where ServiceName !endswith \"$\" and ServiceName !endswith \".LOCAL\" and ServiceName !endswith\
    \ \".COM\"\n| summarize \n    ServiceNames = make_set(ServiceName),\n    UniqueServiceCount = dcount(ServiceName),\n    EventCount = count(),\n\
    \    StartTime = min(TimeGenerated),\n    EndTime = max(TimeGenerated),\n    Computers = make_set(Computer)\n    by bin(TimeGenerated, 1m),\
    \ TargetUserName\n| where UniqueServiceCount >= 7\n| where datetime_diff('minute', EndTime, StartTime) <= 1\n| project StartTime, EndTime,\
    \ TargetUserName, UniqueServiceCount, EventCount, ServiceNames, Computers\n"
  aql: |
    SELECT username AS "Source Username", COUNT(*) AS event_count, UNIQUECOUNT("Service Name") AS unique_services, DATEFORMAT(eventtime, 'yyyy-MM-dd HH:mm:ss') AS event_time, "Service Name", "Ticket Encryption Type", "Ticket Options", "Failure Code"
    FROM events
    WHERE ("EventID" = '673' OR "EventID" = '4769')
      AND "Failure Code" = '0x0'
      AND ("Ticket Encryption Type" = '0x17' OR "Ticket Encryption Type" = '0x18')
      AND ("Ticket Options" IN ('0x40810000', '0x40810010', '0x40800000'))
      AND "Service Name" NOT ILIKE 'krbtgt'
      AND username NOT LIKE '%$'
      AND "Service Name" NOT LIKE '%$'
      AND "Service Name" NOT ILIKE '%.LOCAL'
      AND "Service Name" NOT ILIKE '%.COM'
    GROUP BY username
    HAVING UNIQUECOUNT("Service Name") >= 7
    LAST 1 MINUTES
  yara_l: "rule kerberoast_ticket_requests {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential Kerberoasting via multiple\
    \ ticket requests with RC4 encryption\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1558\"\n    \n \
    \ events:\n    $e.metadata.event_type = \"USER_UNCATEGORIZED\"\n    ($e.metadata.product_event_type = \"673\" or $e.metadata.product_event_type\
    \ = \"4769\")\n    $e.security_result.summary = \"0x0\"\n    ($e.security_result.detection_fields[\"ticket_encryption_type\"] = \"0x17\" or\
    \ \n     $e.security_result.detection_fields[\"ticket_encryption_type\"] = \"0x18\")\n    ($e.security_result.detection_fields[\"ticket_options\"\
    ] = \"0x40810000\" or \n     $e.security_result.detection_fields[\"ticket_options\"] = \"0x40810010\" or\n     $e.security_result.detection_fields[\"\
    ticket_options\"] = \"0x40800000\")\n    not re.regex($e.target.user.userid, `\\$$`)\n    $e.target.user.userid = $service_name\n    $service_name\
    \ != \"krbtgt\"\n    not re.regex($service_name, `(?i)\\$$`)\n    not re.regex($service_name, `(?i)\\.LOCAL$`)\n    not re.regex($service_name,\
    \ `(?i)\\.COM$`)\n    $e.principal.user.userid = $source_user\n    not re.regex($source_user, `\\$$`)\n    \n  match:\n    $source_user over\
    \ 1m\n    \n  outcome:\n    $risk_score = 75\n    $unique_services = count_distinct($service_name)\n    \n  condition:\n    #e >= 7 and $unique_services\
    \ >= 7\n}\n"
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.code IN (\"673\", \"4769\")\n  AND winlog.event_data.Status\
    \ == \"0x0\"\n  AND winlog.event_data.TicketEncryptionType IN (\"0x17\", \"0x18\")\n  AND winlog.event_data.TicketOptions IN (\"0x40810000\"\
    , \"0x40810010\", \"0x40800000\")\n  AND winlog.event_data.ServiceName != \"krbtgt\"\n  AND NOT ENDS_WITH(winlog.event_data.TargetUserName,\
    \ \"$\")\n  AND NOT ENDS_WITH(winlog.event_data.ServiceName, \"$\")\n  AND NOT ENDS_WITH(winlog.event_data.ServiceName, \".LOCAL\")\n  AND\
    \ NOT ENDS_WITH(winlog.event_data.ServiceName, \".COM\")\n| STATS service_count = COUNT_DISTINCT(winlog.event_data.ServiceName), \n      \
    \  event_count = COUNT(*),\n        services = VALUES(winlog.event_data.ServiceName),\n        first_seen = MIN(@timestamp),\n        last_seen\
    \ = MAX(@timestamp)\n  BY user = winlog.event_data.TargetUserName, host.name, bucket = BUCKET(@timestamp, 1 minute)\n| WHERE service_count\
    \ >= 7\n| KEEP bucket, user, host.name, service_count, event_count, services, first_seen, last_seen\n"
  leql: |
    where(source_json.EventID IN [673, 4769] AND source_json.Status="0x0" AND source_json.TicketEncryptionType IN ["0x17", "0x18"] AND source_json.TicketOptions IN ["0x40810000", "0x40810010", "0x40800000"] AND source_json.ServiceName!=krbtgt AND NOT source_json.TargetUserName ENDS-WITH "$" AND NOT source_json.ServiceName ENDS-WITH "$" AND NOT source_json.ServiceName ENDS-WITH ".LOCAL" AND NOT source_json.ServiceName ENDS-WITH ".COM") groupby(source_json.TargetUserName) calculate(unique:source_json.ServiceName)
  crowdstrike: |
    EventCode=4769 FailureCode="0x0" TicketEncryptionType IN [0x17, 0x18] TicketOptions IN ["0x40810000", "0x40810010", "0x40800000"] ServiceName!=krbtgt ServiceName!=*$ ServiceName!=*.LOCAL ServiceName!=*.COM TargetUserName!=*$
    | groupBy([TargetUserName], function=[count(ServiceName, distinct=true, as=unique_services), collect([ServiceName, ComputerName, @timestamp])], limit=max)
    | unique_services >= 7
    | table([TargetUserName, unique_services, ComputerName, ServiceName, @timestamp])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (673, 4769)
    | filter action_evtlog_event_data_Status = "0x0"
    | filter action_evtlog_event_data_TicketEncryptionType in ("0x17", "0x18")
    | filter action_evtlog_event_data_TicketOptions in ("0x40810000", "0x40810010", "0x40800000")
    | filter action_evtlog_event_data_ServiceName != "krbtgt"
    | filter action_evtlog_event_data_TargetUserName !~= "\$$"
    | filter action_evtlog_event_data_ServiceName !~= "\$$" and action_evtlog_event_data_ServiceName !~= "\.LOCAL$" and action_evtlog_event_data_ServiceName !~= "\.COM$"
    | bin _time span=1m
    | comp count_distinct(action_evtlog_event_data_ServiceName) as unique_services, count() as total_events by _time, action_evtlog_event_data_TargetUserName, agent_hostname
    | filter total_events >= 7 and unique_services >= 7
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, unique_services, total_events
  lucene: |
    event.code:4769 AND winlog.event_data.Status:0x0 AND winlog.event_data.TicketEncryptionType:(0x17 OR 0x18) AND winlog.event_data.TicketOptions:(0x40810000 OR 0x40810010 OR 0x40800000) AND NOT winlog.event_data.ServiceName:krbtgt AND NOT winlog.event_data.TargetUserName:*$ AND NOT winlog.event_data.ServiceName:(*$ OR *.LOCAL OR *.COM)
  sumo: |
    _sourceCategory=*Windows* ("4769" OR "673")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as source_username
    | json field=_raw "FailureCode" as failure_code
    | json field=_raw "TicketEncryptionType" as ticket_encryption
    | json field=_raw "TicketOptions" as ticket_options
    | json field=_raw "ServiceName" as service_name
    | where event_id in ("4769", "673")
    | where failure_code = "0x0"
    | where ticket_encryption in ("0x17", "0x18")
    | where ticket_options in ("0x40810000", "0x40810010", "0x40800000")
    | where !(service_name matches "*krbtgt*")
    | where !(source_username matches "*$")
    | where !(service_name matches "*$" or service_name matches "*.LOCAL" or service_name matches "*.COM")
    | timeslice 1m
    | count_distinct(service_name) as unique_services, count as total_events by _timeslice, source_username
    | where unique_services >= 7
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "7 Windows Kerberos Ticket Requested events\nFrom the same Source Username\nWhere the Event ID is in [673, 4769]\nWhere the Failure\
  \ Code is \"0x0\"\nWhere the Ticket Encryption is in [0x17, 0x18]\nWhere Ticket Options is in [\"0x40810000\", \"0x40810010\", \"0x40800000\"\
  ]\nWhere the Service Name is NOT \"krbtgt\"\nWhere the Source Username does NOT end with \"$\" \nWhere the Service Name does NOT end with \"\
  $\", \".LOCAL\", \".COM\"\nWith unique service names\nWithin 1 minutes"
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

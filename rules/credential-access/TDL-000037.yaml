rule_id: TDL-CA-000037
v4_id: '000037'
name: Account Guessing
description: Detects a potential account guessing attack against Windows accounts. Attackers may attempt to determine if a username exists by
  authenticating with a username and observing error messages received. The guessed usernames may be default accounts for applications or permutations
  the organization's naming convention. Once the attacker has determined if a username exists, they can target the existing accounts with password
  spraying attacks.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110
technique_name: Brute Force
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4625'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625) Failure_Code="0xC0000064"

    | eval dest_user=coalesce(TargetUserName, Account_Name)

    | where NOT match(dest_user, "\$$")

    | eval dest_host=coalesce(ComputerName, dest)

    | eval src_host=coalesce(src, Source_Network_Address, IpAddress)

    | lookup domain_controllers.csv host AS dest_host OUTPUT is_dc

    | lookup mail_servers.csv host AS src_host OUTPUT is_mail

    | lookup auth_servers.csv host AS src_host OUTPUT is_auth

    | where isnull(is_dc) AND isnull(is_mail) AND isnull(is_auth)

    | bin _time span=3m

    | stats dc(dest_user) as unique_users, values(dest_user) as usernames, values(EventCode) as event_codes, count by _time, src_host, dest_host

    | where unique_users >= 5 AND count >= 5 AND mvcount(event_codes) == 1

    | table _time, src_host, dest_host, unique_users, usernames, count

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (529, 4625)\n| where EventData has \"0xC0000064\" or Status == \"0xc0000064\"\
    \ or SubStatus == \"0xc0000064\"\n| where TargetUserName !endswith \"$\"\n| extend SourceIP = IpAddress\n| extend DestinationHost = Computer\n\
    | where DestinationHost !in (\"DC01\",\"DC02\",\"DC03\")\n| where SourceIP !in (\"MAIL01\",\"MAIL02\")\n| where SourceIP !in (\"AUTH01\",\"\
    AUTH02\")\n| summarize \n    FailureCount = count(),\n    UniqueUsers = dcount(TargetUserName),\n    UserList = make_set(TargetUserName),\n\
    \    EventIDs = make_set(EventID),\n    MinTime = min(TimeGenerated),\n    MaxTime = max(TimeGenerated)\n    by SourceIP, DestinationHost,\
    \ bin(TimeGenerated, 3m)\n| where FailureCount >= 5\n| where UniqueUsers >= 1\n| where array_length(EventIDs) == 1\n| where datetime_diff('minute',\
    \ MaxTime, MinTime) <= 3\n| project TimeGenerated, SourceIP, DestinationHost, FailureCount, UniqueUsers, UserList, MinTime, MaxTime\n"
  aql: |
    SELECT sourceip, destinationip, "EventID", UNIQUECOUNT(username) AS unique_users, COUNT(*) AS failure_count
    FROM events
    WHERE "EventID" IN ('529', '4625')
      AND ("Failure Code" = '0xC0000064' OR "Status" = '0xC0000064')
      AND username NOT LIKE '%$'
      AND destinationip NOT IN (SELECT ip FROM reference_set WHERE name = 'Domain_Controllers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name = 'Mail_Servers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name = 'Central_Auth_Servers')
    GROUP BY sourceip, destinationip, "EventID"
    HAVING failure_count >= 5 AND unique_users >= 1
    LAST 3 MINUTES
  yara_l: "rule windows_auth_brute_force_t1110 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential password guessing/brute\
    \ force via 5+ failed Windows authentication events from same source to same destination with failure code 0xC0000064 within 3 minutes\"\n\
    \    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1110\"\n    severity = \"HIGH\"\n\n  events:\n    $e.metadata.event_type\
    \ = \"USER_LOGIN\"\n    $e.security_result.action = \"BLOCK\"\n    (\n      $e.metadata.product_event_type = \"529\" or\n      $e.metadata.product_event_type\
    \ = \"4625\"\n    )\n    re.regex($e.security_result.summary, `(?i)0xC0000064`)\n    not re.regex($e.target.user.userid, `\\$$`)\n    $e.principal.ip\
    \ = $source_ip\n    $e.target.hostname = $dest_host\n    $e.target.user.userid = $dest_user\n    \n    not re.regex($e.target.hostname, `(?i)(dc|domaincontroller|domain-controller)`)\n\
    \    not re.regex($e.principal.hostname, `(?i)(mail|smtp|exchange|mx)`)\n    not re.regex($e.principal.hostname, `(?i)(auth|radius|ldap|nps|ias)`)\n\
    \n  match:\n    $source_ip, $dest_host over 3m\n\n  outcome:\n    $risk_score = max(75)\n    $failed_users = array_distinct($dest_user)\n\
    \    $event_id = array_distinct($e.metadata.product_event_type)\n    $source_hostname = array_distinct($e.principal.hostname)\n\n  condition:\n\
    \    #e >= 5 and\n    #dest_user >= 5\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 3 minutes
      AND event.code IN ("529", "4625")
      AND winlog.event_data.Status == "0xC0000064"
      AND NOT user.name LIKE "*$"
    | EVAL src_ip = COALESCE(source.ip, winlog.event_data.IpAddress)
    | EVAL dst_host = COALESCE(destination.ip, host.name)
    | WHERE NOT dst_host IN ("dc01.example.com", "dc02.example.com")
      AND NOT src_ip IN ("mail01.example.com", "mail02.example.com", "192.168.1.100")
      AND NOT src_ip IN ("auth01.example.com", "auth02.example.com", "192.168.1.200")
    | STATS unique_users = COUNT_DISTINCT(user.name), event_count = COUNT(*), event_ids = VALUES(event.code) BY src_ip, dst_host, window = BUCKET(@timestamp, 3 minutes)
    | WHERE event_count >= 5 AND unique_users >= 1
    | KEEP window, src_ip, dst_host, unique_users, event_count, event_ids
  leql: |
    where(source_json.EventID IN [529, 4625] AND source_json.FailureCode="0xC0000064" AND destination_user!=/.*\$$/ AND NOT(destination_asset IN ["DC1", "DC2"]) AND NOT(source_asset IN ["MAIL1", "MAIL2"]) AND NOT(source_asset IN ["AUTH1", "AUTH2"])) groupby(source_address, destination_asset) calculate(unique:destination_user)
  crowdstrike: |
    EventCode=4625 FailureReason="*0xC0000064*"
    | !match(field=TargetUserName, regex=".*\\$$")
    | !match(field=ComputerName, regex="(?i)(dc|domaincontroller)")
    | !match(field=IpAddress, regex="(?i)(mail|smtp|exchange)")
    | !match(field=IpAddress, regex="(?i)(auth|radius|ldap)")
    | groupBy([IpAddress, ComputerName], function=[count(as=total_attempts), count(TargetUserName, distinct=true, as=unique_users), collect([TargetUserName, @timestamp])], limit=max)
    | total_attempts >= 5
    | unique_users >= 1
    | timeChart(span=3m, function=count())
    | table([IpAddress, ComputerName, total_attempts, unique_users, _collect])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (529, 4625)
    | filter action_evtlog_event_data_Status = "0xC0000064" or action_evtlog_event_data_SubStatus = "0xC0000064"
    | filter action_evtlog_event_data_TargetUserName not ~= "\$$"
    | filter action_evtlog_event_data_TargetDomainName != "DC1" and action_evtlog_event_data_TargetDomainName != "DC2"
    | filter action_local_ip not in ("192.168.1.10", "192.168.1.11")
    | filter action_local_ip not in ("10.0.0.50", "10.0.0.51")
    | bin _time span=3m
    | comp count() as failure_count, count_distinct(action_evtlog_event_data_TargetUserName) as unique_users by _time, action_remote_ip, agent_hostname, action_evtlog_event_id
    | filter failure_count >= 5 and unique_users >= 1
    | fields _time, action_remote_ip, agent_hostname, action_evtlog_event_id, failure_count, unique_users
  lucene: |
    (event.code:(529 OR 4625) OR EventID:(529 OR 4625)) AND (winlog.event_data.Status:0xC0000064 OR FailureCode:0xC0000064 OR Status:0xC0000064) AND NOT (user.name:*$ OR TargetUserName:*$ OR destination.user.name:*$)
  sumo: |
    _sourceCategory=*Windows*Security* ("4625" OR "529")
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "WorkstationName" as src_host
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "TargetDomainName" as dest_domain
    | json field=_raw "Computer" as dest_host
    | json field=_raw "Status" as failure_code
    | where (event_id = "4625" OR event_id = "529") AND failure_code = "0xc0000064"
    | where !(dest_user matches "*$")
    | where !(dest_host matches "*DC*" OR dest_host matches "*DomainController*")
    | where !(src_ip matches "*MailServer*" OR src_host matches "*MailServer*" OR src_host matches "*Exchange*")
    | where !(src_ip matches "*AuthServer*" OR src_host matches "*AuthServer*" OR src_host matches "*NPS*" OR src_host matches "*RADIUS*")
    | timeslice 3m
    | count_distinct(dest_user) as unique_users, count as total_events by _timeslice, src_ip, dest_host, event_id
    | where unique_users >= 5 AND total_events >= 5
    | fields _timeslice, src_ip, dest_host, event_id, unique_users, total_events
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure Events \nFrom the same internal Source IP to the same Destination\nWhere the Event ID in [529,\
  \ 4625]\nWhere the Failure Code is \"0xC0000064\"\nWhere the Destination Username does NOT end with \"$\" \nWhere the Destination IP/Hostname\
  \ is NOT on the Domain Controller List \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source IP/Hostname is NOT on\
  \ a Central Authentication Server List \nWith unique Destination Usernames \nWith the same Event ID \nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

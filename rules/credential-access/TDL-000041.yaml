rule_id: TDL-CA-000041
v4_id: '000041'
name: Account Guessing - Domain Controller
description: Detects a potential account guessing attack against Windows accounts. Attackers may attempt to determine if a username exists by
  authenticating with a username and observing error messages received. The guessed usernames may be default accounts for applications or permutations
  the organization's naming convention. Once the attacker has determined if a username exists, they can target the existing accounts with password
  spraying attacks.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110
technique_name: Brute Force
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4625, 4768, 4771'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows (EventCode=4625 OR EventCode=4768 OR EventCode=4771 OR EventCode=529 OR EventCode=676 OR EventCode=675)

    (Failure_Code="0xC0000064" OR Failure_Code="0x6" OR Status="0xC0000064" OR Status="0x6")

    | eval dest_user=coalesce(TargetUserName, Account_Name, User)

    | where NOT match(dest_user, "\$$")

    | lookup domain_controllers.csv host as dest OUTPUT is_dc

    | where is_dc="true"

    | lookup mail_servers.csv host as src OUTPUT is_mail

    | where isnull(is_mail) OR is_mail!="true"

    | lookup domain_controllers.csv host as src OUTPUT is_dc as src_is_dc

    | where isnull(src_is_dc) OR src_is_dc!="true"

    | lookup auth_servers.csv host as src OUTPUT is_auth

    | where isnull(is_auth) OR is_auth!="true"

    | bin _time span=3m

    | stats dc(dest_user) as unique_users, count, values(dest_user) as targeted_users, values(EventCode) as event_codes by _time, src, dest, EventCode

    | where count >= 10 AND unique_users >= 1

    | table _time, src, dest, EventCode, count, unique_users, targeted_users

    '
  kql: "let TimeWindow = 3m;\nlet Threshold = 10;\nlet DomainControllers = datatable(Computer: string) [\"DC01\", \"DC02\", \"DC03\"];\nlet MailServers\
    \ = datatable(Computer: string) [\"MAIL01\", \"EXCH01\"];\nlet AuthServers = datatable(Computer: string) [\"AUTH01\", \"NPS01\"];\nSecurityEvent\n\
    | where TimeGenerated > ago(1h)\n| where EventID in (529, 4625, 676, 4768, 675, 4771)\n| where (EventID in (529, 4625) and Status in (\"0xC0000064\"\
    , \"0xc0000064\")) or\n        (EventID == 4768 and Status in (\"0x6\", \"6\")) or\n        (EventID == 676 and FailureCode in (\"0xC0000064\"\
    , \"0xc0000064\")) or\n        (EventID == 4771 and FailureCode in (\"0x6\", \"6\")) or\n        (EventID == 675 and FailureCode in (\"0xC0000064\"\
    , \"0xc0000064\"))\n| where Computer has_any (DomainControllers)\n| where TargetAccount !endswith \"$\" and TargetUserName !endswith \"$\"\
    \n| where IpAddress !has_any (MailServers) and WorkstationName !has_any (MailServers)\n| where IpAddress !has_any (DomainControllers) and\
    \ WorkstationName !has_any (DomainControllers)\n| where IpAddress !has_any (AuthServers) and WorkstationName !has_any (AuthServers)\n| extend\
    \ SourceIP = coalesce(IpAddress, WorkstationName)\n| extend DestinationHost = Computer\n| extend DestinationUser = coalesce(TargetAccount,\
    \ TargetUserName)\n| summarize FailureCount = count(), \n            UniqueUsers = dcount(DestinationUser),\n            Users = make_set(DestinationUser),\n\
    \            EventIDs = make_set(EventID),\n            StartTime = min(TimeGenerated),\n            EndTime = max(TimeGenerated)\n      \
    \      by SourceIP, DestinationHost, EventID, bin(TimeGenerated, TimeWindow)\n| where FailureCount >= Threshold\n| where array_length(EventIDs)\
    \ == 1\n| project StartTime, EndTime, SourceIP, DestinationHost, EventID, FailureCount, UniqueUsers, Users\n"
  aql: |
    SELECT sourceip, destinationip, "EventID", UNIQUECOUNT(username) AS unique_users, COUNT(*) AS total_attempts
    FROM events
    WHERE "EventID" IN ('529', '4625', '676', '4768', '675', '4771')
      AND ("Failure Code" = '0xC0000064' OR "Failure Code" = '0x6')
      AND username NOT LIKE '%$'
      AND INOFFENSE(destinationip, 'Domain Controller List')
      AND NOT INOFFENSE(sourceip, 'Mail Server List')
      AND NOT INOFFENSE(sourceip, 'Domain Controller List')
      AND NOT INOFFENSE(sourceip, 'Central Authentication Server List')
      AND sourceip IN (SELECT DISTINCT sourceip FROM events WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Windows%')
    GROUP BY sourceip, destinationip, "EventID"
    HAVING total_attempts >= 10
    LAST 3 MINUTES
  yara_l: |
    rule brute_force_domain_controller {
      meta:
        author = "TDL"
        description = "Detects brute force authentication attempts against domain controllers"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1110"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.action = "BLOCK"
        (
          $e.metadata.product_event_type = "529" or
          $e.metadata.product_event_type = "4625" or
          $e.metadata.product_event_type = "676" or
          $e.metadata.product_event_type = "4768" or
          $e.metadata.product_event_type = "675" or
          $e.metadata.product_event_type = "4771"
        )
        (
          $e.security_result.summary = "0xC0000064" or
          $e.security_result.summary = "0x6"
        )
        not re.regex($e.target.user.userid, `\$$`)
        $e.principal.ip = $source_ip
        $e.target.hostname = $target_host
        $e.target.user.userid = $target_user
        $e.metadata.product_event_type = $event_id

      match:
        $source_ip, $target_host, $event_id over 3m

      outcome:
        $risk_score = max(75)
        $failed_users = count_distinct($target_user)
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 10 and $failed_users >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 1 hour
      AND event.code IN ("529", "4625", "676", "4768", "675", "4771")
      AND (winlog.event_data.FailureCode IN ("0xC0000064", "0x6") OR winlog.event_data.Status IN ("0xC0000064", "0x6"))
      AND NOT user.name LIKE "*$"
    | EVAL source_ip = COALESCE(source.ip, winlog.event_data.IpAddress)
    | EVAL dest_host = COALESCE(destination.ip, host.name)
    | WHERE source_ip IS NOT NULL AND dest_host IS NOT NULL
    | STATS user_count = COUNT_DISTINCT(user.name), event_count = COUNT(*), event_ids = VALUES(event.code), time_window = BUCKET(@timestamp, 3 minutes)
      BY source_ip, dest_host, time_window
    | WHERE user_count >= 10 AND event_count >= 10
    | KEEP time_window, source_ip, dest_host, user_count, event_count, event_ids
  leql: |
    where(source_json.EventID IN [529, 4625, 676, 4768, 675, 4771] AND (source_json.Status IN ["0xC0000064", "0x6"] OR source_json.FailureCode IN ["0xC0000064", "0x6"] OR source_json.SubStatus="0xC0000064") AND destination_user!=/\$$/ AND NOT(source_asset IN ["mail_server_list"]) AND NOT(source_asset IN ["domain_controller_list"]) AND NOT(source_asset IN ["central_auth_server_list"])) groupby(source_address, destination_address, source_json.EventID) calculate(unique:destination_user)
  crowdstrike: |
    EventCode IN [529, 4625, 676, 4768, 675, 4771]
    (FailureCode=0xC0000064 OR FailureCode=0x6 OR Status=0xC0000064 OR Status=0x6)
    TargetUserName!=*$
    | groupBy([IpAddress, DestinationHostname, EventCode], function=[count(TargetUserName, distinct=true, as=uniqueUsers), count(as=totalEvents)], limit=max, span=3m)
    | uniqueUsers>=10
    | table([_bucket, IpAddress, DestinationHostname, EventCode, uniqueUsers, totalEvents])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (529, 4625, 676, 4768, 675, 4771)
    | filter action_evtlog_event_data_Status in ("0xC0000064", "0x6") or action_evtlog_event_data_FailureCode in ("0xC0000064", "0x6")
    | filter action_evtlog_event_data_TargetUserName != null and action_evtlog_event_data_TargetUserName !~= "\$$"
    | alter source_ip = coalesce(action_evtlog_event_data_IpAddress, action_evtlog_event_data_WorkstationName)
    | alter dest_host = coalesce(agent_hostname, action_evtlog_event_data_TargetDomainName)
    | bin _time span=3m
    | comp count_distinct(action_evtlog_event_data_TargetUserName) as unique_users, count() as event_count by _time, source_ip, dest_host, action_evtlog_event_id
    | filter event_count >= 10
    | fields _time, source_ip, dest_host, action_evtlog_event_id, unique_users, event_count
  lucene: |
    event.code:(529 OR 4625 OR 676 OR 4768 OR 675 OR 4771) AND (winlog.event_data.FailureCode:(0xC0000064 OR 0x6) OR event.outcome:failure) AND NOT user.name:*$ AND NOT source.ip:(MailServerIP1 OR MailServerIP2) AND NOT source.ip:(DomainControllerIP1 OR DomainControllerIP2) AND NOT source.ip:(AuthServerIP1 OR AuthServerIP2) AND destination.ip:(DomainControllerIP1 OR DomainControllerIP2)
  sumo: |
    _sourceCategory=*Windows*Security* ("4625" OR "4768" OR "4771" OR "529" OR "676" OR "675")
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "TargetDomainName" as dest_domain
    | json field=_raw "Computer" as dest_host
    | json field=_raw "Status" as status_code
    | json field=_raw "FailureCode" as failure_code
    | json field=_raw "SubStatus" as sub_status
    | where event_id in ("4625", "4768", "4771", "529", "676", "675")
    | where (failure_code matches "*0xC0000064*" OR failure_code matches "*0x6*" OR status_code matches "*0xC0000064*" OR status_code matches "*0x6*" OR sub_status matches "*0xC0000064*" OR sub_status matches "*0x6*")
    | where !(dest_user matches "*$")
    | where !(src_ip matches "10.0.1.*" OR src_ip matches "192.168.1.10")
    | where !(dest_host matches "*dc*" OR dest_host matches "*domaincontroller*")
    | where dest_host matches "*dc*" OR dest_host matches "*domaincontroller*"
    | timeslice 3m
    | count_distinct(dest_user) as unique_users by _timeslice, src_ip, dest_host, event_id
    | where unique_users >= 10
    | fields _timeslice, src_ip, dest_host, event_id, unique_users
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "10 Windows Authentication Failure Events \nFrom the same internal Source IP to the same Destination\nWhere the Event ID in [529,\
  \ 4625, 676, 4768, 675, 4771]\nWhere the Failure Code is in [0xC0000064, 0x6]\nWhere the Destination IP/Hostname is on the Domain Controller\
  \ List \nWhere the Destination Username does NOT end with \"$\"  \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source\
  \ IP/Hostname is NOT on the Domain Controller List\nWhere the Source IP/Hostname is NOT on a Central Authentication Server List \nWith unique\
  \ Destination Usernames \nWith the same Event ID \nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

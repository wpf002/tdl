rule_id: TDL-CA-000059
v4_id: 000059
name: Wireless AP Broadcast Deauthentication
description: Detects a wireless deauthentication request that is sent to the broadcast MAC address of the wireless access point. The majority
  of wireless attacks on access points begin with the attacker capturing a client’s authentication. By sending a broadcast deauthentication packet,
  the access point will deauthenticate all clients on the network and an attacker can then capture their re-authentications.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1557
technique_name: Adversary-in-the-Middle
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=windows sourcetype=\"WinEventLog:Security\" \n((EventCode=* EventName=\"*deauthentication*\" SourceMac=\"ff:ff:ff:ff:ff:ff\") OR\
    \ (EventCode=* Signature=\"*Broadcast Deauthentication*\"))\n| table _time, ComputerName, EventCode, EventName, SourceMac, Signature, DestMac,\
    \ SSID, Channel\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventData has "deauthentication" or Message has "deauthentication" or RenderedDescription has "deauthentication"
    | where EventData has "ff:ff:ff:ff:ff:ff" or Message has "ff:ff:ff:ff:ff:ff" or RenderedDescription has "ff:ff:ff:ff:ff:ff"
    | extend ParsedEventData = parse_xml(EventData)
    | extend SourceMac = tostring(ParsedEventData.EventData.Data)
    | where SourceMac has "ff:ff:ff:ff:ff:ff"
    | project TimeGenerated, Computer, EventID, Message, SourceMac, EventData
    | union (
        SecurityEvent
        | where TimeGenerated > ago(24h)
        | where EventData has "Broadcast Deauthentication" or Message has "Broadcast Deauthentication" or RenderedDescription has "Broadcast Deauthentication"
        | project TimeGenerated, Computer, EventID, Message, EventData
    )
  aql: |
    SELECT sourceip, destinationip, sourcemac, destinationmac, qidname(qid), "Event Name", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE (categoryname(category) ILIKE '%wireless%' AND "Event Name" ILIKE '%deauthentication%' AND sourcemac = 'ff:ff:ff:ff:ff:ff')
       OR (categoryname(category) ILIKE '%IDS%' AND qidname(qid) ILIKE '%Broadcast Deauthentication%')
    LAST 24 HOURS
  yara_l: |
    rule wireless_deauth_attack {
      meta:
        author = "Detection Engineer"
        description = "Detects wireless deauthentication attacks (T1557 - Adversary-in-the-Middle)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1557"
        severity = "High"

      events:
        (
          $e.metadata.event_type = "NETWORK_CONNECTION"
          re.regex($e.metadata.description, `(?i)deauthentication`)
          $e.principal.mac = "ff:ff:ff:ff:ff:ff"
        ) or (
          $e.metadata.event_type = "NETWORK_CONNECTION"
          re.regex($e.security_result.summary, `(?i)Broadcast Deauthentication`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.security*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (event.category == "network" AND event.dataset LIKE "*wireless*" AND event.action LIKE "*deauthentication*" AND source.mac == "ff:ff:ff:ff:ff:ff")
        OR
        (event.category == "intrusion_detection" AND event.dataset LIKE "*wireless*" AND rule.name LIKE "*Broadcast Deauthentication*")
      )
    | KEEP @timestamp, host.name, event.action, event.dataset, source.mac, destination.mac, rule.name, event.original
  leql: |
    where(source_json.EventID=5632 AND (source_json.EventData ICONTAINS "deauthentication" OR source_json.Message ICONTAINS "deauthentication") AND (source_json.SourceMACAddress="ff:ff:ff:ff:ff:ff" OR source_json.EventData ICONTAINS "ff:ff:ff:ff:ff:ff"))
  crowdstrike: |
    (EventName=*deauthentication* SourceMac="ff:ff:ff:ff:ff:ff") OR (Signature=*"Broadcast Deauthentication"*)
    | table([@timestamp, ComputerName, EventName, SourceMac, Signature])
  xql: |
    dataset = xdr_data
    | filter (event_type = ENUM.EVENT_TYPE_NETWORK and action_network_connection_direction = "WIRELESS" and lowercase(action_evtlog_message) contains "deauthentication" and action_network_src_mac = "ff:ff:ff:ff:ff:ff")
       or (event_type = ENUM.EVENT_TYPE_IDS and lowercase(action_evtlog_message) contains "broadcast deauthentication")
    | fields _time, agent_hostname, event_type, action_network_src_mac, action_evtlog_message
  lucene: |
    (event_name:*deauthentication* AND source_mac:"ff:ff:ff:ff:ff:ff") OR (signature:*Broadcast\ Deauthentication*)
  sumo: |
    _sourceCategory=*Windows*Security* ("deauthentication" OR "Broadcast Deauthentication")
    | json field=_raw "EventData" as event_data
    | json field=event_data "SourceMac" as src_mac
    | json field=_raw "Message" as message
    | where (message matches "*deauthentication*" and src_mac = "ff:ff:ff:ff:ff:ff") or message matches "*Broadcast Deauthentication*"
    | fields _messageTime, _sourceHost, message, src_mac
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Wireless Access Point Event

  Where the Event Name contains "deauthentication"

  Where the Source Mac is "ff:ff:ff:ff:ff:ff"


  ----------------------------------------------------------------------------------


  1 Wireless IDS/IPS Event

  Where the Signature contains "Broadcast Deauthentication"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

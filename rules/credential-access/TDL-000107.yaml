rule_id: TDL-CA-000107
v4_id: '000107'
name: Distributed Account Guessing
description: Detects a potential account guessing attack against a single Windows account targeting multiple hosts. Attackers may attempt to determine
  if a username exists by authenticating with a username and observing error messages recieved. The guessed usernames may be default accounts
  for applications or permutations the organization's naming convention. Once the attacker has determined if a username exists, they can target
  the existing accounts with password spraying attacks.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110
technique_name: Brute Force
platform:
- Linux
- Windows
data_sources:
- Windows Active Directory
- Linux Operating System
- 'Event IDs: 4625'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625 OR EventCode=4776 OR EventCode=680 OR EventCode=681) Failure_Code="0xC0000064"
    | where NOT match(TargetUserName, "\$$")
    | lookup domain_controllers.csv hostname AS dest_host OUTPUT is_dc
    | lookup mail_servers.csv hostname AS src_host OUTPUT is_mail
    | lookup auth_servers.csv hostname AS src_host OUTPUT is_auth
    | where isnull(is_dc) AND isnull(is_mail) AND isnull(is_auth)
    | bin _time span=3m
    | stats dc(dest_host) as unique_dest_hosts values(dest_host) as dest_hosts values(EventCode) as event_codes values(TargetUserName) as target_users by _time, src_host, EventCode, TargetUserName
    | where unique_dest_hosts >= 5
    | table _time, src_host, EventCode, TargetUserName, unique_dest_hosts, dest_hosts
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4625", "4776")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4625', '4776')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000107 {\n  meta:\n    author = \"TDL\"\n    description = \"Distributed Account Guessing\"\n    severity = \"MEDIUM\"\
    \n    tactic = \"TA0006\"\n    technique = \"T1110\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4625|4776)/\n\
    \    $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4625", "4776")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4625, 4776])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4625, 4776)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4625", "4776")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4625 OR 4776)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4625", "4776")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure Events \nFrom the same internal Source Hostname to the multiple Destination\nWhere the Event ID\
  \ in [529, 4625, 4776, 680, 681]\nWhere the Failure Code is \"0xC0000064\"\nWhere the Destination Username does NOT end with \"$\" \nWhere the\
  \ Destination IP/Hostname is NOT on the Domain Controller List \nWhere the Source Hostname is NOT on a Mail Server List \nWhere the Source Hostname\
  \ is NOT on a Central Authentication Server List \nWith unique Destination Hostnames\nWith the same Event ID and Destination Usernames\nWithin\
  \ 3 minutes"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000143
v4_id: '000143'
name: DC Sync Attack
description: Detects an attacker performing a DCSync attack which involves taking advantage of the Directory Replication Service Remote (DRSR)
  protocol to obtain sensitive information from a DC such as password hashes for domain users. This is preformed by the attacker masquerading
  their host as a domain controller and tricking an authentic DC to synchromize its database to it.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4662'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=566 OR EventCode=4662)

    | search NOT Account_Name="*$" NOT Account_Name="msol_*"

    | search NOT ComputerName IN ("dc01","dc02","dc1","dc2","domaincontroller")

    | search (Properties="*Replicating Directory Changes all*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
    OR Properties="*9923a32a-3607-11d2-b9be-0000f87a36b2*")

    | table _time, ComputerName, Account_Name, Properties, Object_Name, Object_Type

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (566, 4662)
    | where SubjectUserName !endswith "$"
    | where SubjectUserName !startswith "msol_"
    | where Computer !has "DC" and Computer !has "DomainController"
    | where Properties has_any ("Replicating Directory Changes all", "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2", "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2", "9923a32a-3607-11d2-b9be-0000f87a36b2")
    | project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, ObjectName, Properties, AccessMask, EventID
  aql: "SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS host, \"Properties\", eventtime\nFROM events\nWHERE \"EventID\" IN ('566', '4662')\n\
    \  AND username NOT LIKE '%$'\n  AND username NOT LIKE 'msol_%'\n  AND LOGSOURCENAME(logsourceid) NOT ILIKE '%domain controller%'\n  AND (\"\
    Properties\" ILIKE '%Replicating Directory Changes all%' \n       OR \"Properties\" ILIKE '%1131f6ad-9c07-11d1-f79f-00c04fc2dcd2%'\n     \
    \  OR \"Properties\" ILIKE '%1131f6aa-9c07-11d1-f79f-00c04fc2dcd2%'\n       OR \"Properties\" ILIKE '%9923a32a-3607-11d2-b9be-0000f87a36b2%')\n\
    LAST 24 HOURS\n"
  yara_l: |
    rule dcsync_replication_access {
      meta:
        author = "Detection Engineering"
        description = "Detects potential DCSync attack via AD replication permissions abuse"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1003"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_RESOURCE_ACCESS"
        ($e.metadata.product_event_type = "566" or $e.metadata.product_event_type = "4662")
        $e.principal.user.userid = $user
        not re.regex($e.principal.user.userid, `\$$`)
        not re.regex($e.principal.user.userid, `(?i)^msol_`)
        not re.regex($e.principal.hostname, `(?i)dc\d+|domaincontroller`)
        (
          re.regex($e.target.resource.attribute.labels, `(?i)Replicating Directory Changes all`) or
          re.regex($e.target.resource.attribute.labels, `1131f6ad-9c07-11d1-f79f-00c04fc2dcd2`) or
          re.regex($e.target.resource.attribute.labels, `1131f6aa-9c07-11d1-f79f-00c04fc2dcd2`) or
          re.regex($e.target.resource.attribute.labels, `9923a32a-3607-11d2-b9be-0000f87a36b2`)
        )

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("566", "4662")
      AND user.name IS NOT NULL
      AND NOT user.name LIKE "*$"
      AND NOT STARTS_WITH(user.name, "msol_")
      AND NOT host.name LIKE "*DC*"
      AND NOT host.name LIKE "*DomainController*"
      AND (
        winlog.event_data.Properties LIKE "*Replicating Directory Changes all*"
        OR winlog.event_data.Properties LIKE "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
        OR winlog.event_data.Properties LIKE "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
        OR winlog.event_data.Properties LIKE "*9923a32a-3607-11d2-b9be-0000f87a36b2*"
      )
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_data.Properties, winlog.event_data.ObjectName
  leql: |
    where(source_json.EventID IN [566, 4662] AND NOT source_json.SubjectUserName ENDS-WITH "$" AND NOT source_json.SubjectUserName STARTS-WITH "msol_" AND NOT source_json.IsDomainController=true AND (source_json.Properties ICONTAINS "Replicating Directory Changes all" OR source_json.Properties ICONTAINS "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR source_json.Properties ICONTAINS "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2" OR source_json.Properties ICONTAINS "9923a32a-3607-11d2-b9be-0000f87a36b2"))
  crowdstrike: |
    EventCode=4662 OR EventCode=566
    | regex("(?<SourceUsername>[^$]+[^$])$", field=SubjectUserName)
    | SubjectUserName != /^msol_/
    | ComputerName != /DC\d+/i AND ComputerName != /DomainController/i
    | (Properties=*"Replicating Directory Changes all"* OR Properties=*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* OR Properties=*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* OR Properties=*9923a32a-3607-11d2-b9be-0000f87a36b2*)
    | table([@timestamp, ComputerName, SubjectUserName, ObjectName, Properties, AccessMask])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (566, 4662)
    | filter action_evtlog_event_data_SubjectUserName != null and not action_evtlog_event_data_SubjectUserName ~= "\$$"
    | filter action_evtlog_event_data_SubjectUserName != null and not action_evtlog_event_data_SubjectUserName ~= "^msol_"
    | filter not action_evtlog_event_data_SubjectLogonId ~= "^(DC|DOMAINCONTROLLER)" and not agent_hostname ~= "^(DC|DOMAINCONTROLLER)"
    | filter action_evtlog_event_data_Properties contains "Replicating Directory Changes all" or action_evtlog_event_data_Properties contains "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" or action_evtlog_event_data_Properties contains "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2" or action_evtlog_event_data_Properties contains "9923a32a-3607-11d2-b9be-0000f87a36b2"
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_ObjectName, action_evtlog_event_data_Properties, action_evtlog_event_id
  lucene: |
    event.code:(566 OR 4662) AND NOT winlog.event_data.SubjectUserName:*$ AND NOT winlog.event_data.SubjectUserName:msol_* AND NOT winlog.event_data.SourceName:*DC* AND winlog.event_data.Properties:("Replicating Directory Changes all" OR "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2" OR "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2" OR "9923a32a-3607-11d2-b9be-0000f87a36b2")
  sumo: |
    _sourceCategory=*Windows* (566 OR 4662)
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as source_username
    | json field=_raw "Computer" as computer
    | json field=_raw "Properties" as properties
    | where event_id in ("566", "4662")
    | where !(source_username matches "*$")
    | where !(source_username matches "msol_*")
    | where !(computer matches "*DC*" or computer matches "*DomainController*")
    | where properties matches "*Replicating Directory Changes all*" or properties matches "*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" or properties matches "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" or properties matches "*9923a32a-3607-11d2-b9be-0000f87a36b2*"
    | fields _messageTime, computer, source_username, event_id, properties
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Operation Performed on an Object Event

  Where the Event ID is in [566, 4662]

  Where the Source Username does NOT end with "$"

  Where the Source Username does NOT start with "msol_"

  Where the Source is not a Domain Controller

  Where the Properties contains one of the following: [“Replicating Directory Changes all”, “1131f6ad-9c07-11d1-f79f-00c04fc2dcd2”, “1131f6aa-9c07-11d1-f79f-00c04fc2dcd2”,
  “9923a32a-3607-11d2-b9be-0000f87a36b2”]'
suppression:
  window: 12 hours
  fields:
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

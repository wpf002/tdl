rule_id: TDL-CA-000163
v4_id: '000163'
name: Promiscuous Mode Enabled
description: This rule is designed to detect a network interface card entering promiscuous mode. Once a network interface card has been switched
  to promiscuous mode and encryption is not used, an attacker could see traffic from other hosts on the network.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1040
technique_name: Network Sniffing
platform:
- Linux
data_sources:
- Linux
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=linux sourcetype=linux_audit type=ANOM_PROMISCUOUS promiscuous=1

    | table _time, host, type, promiscuous, exe, uid, auid, msg

    '
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where Source == "Linux" and RenderedDescription has "ANOM_PROMISCUOUS"
    | where RenderedDescription has "enabled" or RawData has "enabled"
    | project TimeGenerated, Computer, Source, EventID, RenderedDescription, RawData
  aql: |
    SELECT eventtime, sourceip, LOGSOURCENAME(logsourceid) AS host, username, "Event Type", "mode", payload
    FROM events
    WHERE "Event Type" = 'ANOM_PROMISCUOUS' AND "mode" = 'enabled'
    LAST 24 HOURS
  yara_l: "rule linux_promiscuous_mode_enabled {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Linux network interface\
    \ set to promiscuous mode for network sniffing (T1040)\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"\
    T1040\"\n    severity = \"High\"\n  \n  events:\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_UNCATEGORIZED\"\n    $e.metadata.product_name\
    \ = \"Linux\"\n    re.regex($e.metadata.description, `ANOM_PROMISCUOUS`)\n    re.regex($e.metadata.description, `(?i)enabled`)\n    $e.principal.hostname\
    \ = $host\n  \n  match:\n    $host over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.auth*
    | WHERE event.action == "changed-promiscuous-mode-on-device" AND auditd.data.promiscuous == "enabled"
    | KEEP @timestamp, host.name, user.name, process.name, process.executable, auditd.data.dev, auditd.data.promiscuous
  leql: |
    where(source_json.type="ANOM_PROMISCUOUS" AND source_json.promisc="1")
  crowdstrike: |
    #type=LinuxAuditEvent event.type="ANOM_PROMISCUOUS" mode="enabled"
    | table([@timestamp, ComputerName, aid, event.type, mode, auid, uid, ses])
  xql: |
    dataset = linux_audit_raw
    | filter action_evtlog_event_type = "ANOM_PROMISCUOUS" and action_evtlog_message contains "mode=enabled"
    | fields _time, agent_hostname, action_evtlog_message, actor_effective_username
  lucene: |
    event.type:"ANOM_PROMISCUOUS" AND mode:"enabled"
  sumo: |
    _sourceCategory=*Linux* "ANOM_PROMISCUOUS"
    | parse regex "type=(?<event_type>\S+)" nodrop
    | parse regex "promiscuous=(?<mode>\w+)" nodrop
    | where event_type = "ANOM_PROMISCUOUS" and mode = "enabled"
    | fields _messageTime, _sourceHost, event_type, mode
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Linux Audit Event

  Where the Event Type is "ANOM_PROMISCUOUS"

  where mode is "enabled"'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000176
v4_id: '000176'
name: Password Reset Tracker
description: Detects recent password changes throughout the environment and adds the use to a list that is excluded from brute force attacks.
  Hosts and other devices maybe slow to update passwords and could generate false positives. The source IP and username is added to a tracker
  list.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4724'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=628 OR EventCode=4724)

    | table _time, ComputerName, Account_Name, TargetUserName, SubjectUserName, SubjectDomainName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (628, 4724)
    | project TimeGenerated, Computer, Account, TargetAccount, SubjectUserName, EventID, Activity
  aql: |
    SELECT username, "Target Username", sourceip, LOGSOURCENAME(logsourceid) AS host, eventtime
    FROM events
    WHERE "EventID" IN ('628', '4724')
    LAST 24 HOURS
  yara_l: |
    rule windows_password_reset_event {
      meta:
        author = "Detection Engineer"
        description = "Detects Windows password reset events - MITRE T1078 Credential Access"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_CHANGE_PASSWORD"
        ($e.metadata.product_event_type = "628" or $e.metadata.product_event_type = "4724")
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour AND event.code IN ("628", "4724")
    | KEEP @timestamp, host.name, user.name, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName, event.code, event.action
  leql: |
    where(source_json.EventID IN [628, 4724])
  crowdstrike: |
    EventCode IN [628, 4724]
    | table([@timestamp, ComputerName, TargetUserName, SubjectUserName, SubjectDomainName, TargetDomainName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (628, 4724)
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_TargetUserName, action_evtlog_message
  lucene: |
    event.code:(628 OR 4724)
  sumo: |
    _sourceCategory=*Windows* ("628" OR "4724")
    | json field=_raw "EventID" as event_id
    | where event_id in ("628", "4724")
    | fields _messageTime, _sourceHost, event_id, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Password Reset Event

  Where the Event ID is in [628, 4724]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000180
v4_id: 000180
name: Shadow File Accessed
description: The /etc/shadow file on a Linux system is an extremely sensitive file that contains credential information. Exposure of these files
  can result in an attacker capturing password hashes that can be taken offline and eventually cracked. Attackers have also been seen appending
  entries to the shadow file in order to escalate their privileges. Any attempt to view, copy, or edit this file should be investigated for expected
  use.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Linux
data_sources:
- Linux Operating System
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=linux sourcetype IN(linux_secure, syslog) (CommandLine="*etc/shadow*" OR CommandLine="*/shadow*" OR CommandLine="*etc\\shadow*"
    OR CommandLine="*\\shadow*")

    NOT [| inputlookup high_value_target_hosts.csv | fields host]

    | table _time, host, user, CommandLine, process

    '
  kql: |
    Syslog
    | where TimeGenerated > ago(1h)
    | where Facility == "authpriv" or ProcessName in~ ("bash", "sh", "zsh", "dash", "ksh", "csh", "tcsh", "fish")
    | where SyslogMessage has_any ("etc/shadow", "shadow")
    | where Computer !in ((externaldata(HostName:string)[@"https://raw.githubusercontent.com/your-org/hvt-hosts/main/hvt-list.csv"] with (format="csv", ignoreFirstRecord=true)))
    | project TimeGenerated, Computer, ProcessName, SyslogMessage, Facility, HostIP
  aql: |
    SELECT "Command Line", LOGSOURCENAME(logsourceid) AS hostname, username, sourceip, eventtime
    FROM events
    WHERE ("Command Line" ILIKE '%/etc/shadow%' OR "Command Line" ILIKE '%shadow%')
      AND LOGSOURCENAME(logsourceid) NOT IN (SELECT * FROM REFERENCE SET 'High_Value_Target_Host_List')
    LAST 24 HOURS
  yara_l: |
    rule linux_shadow_file_access_t1003 {
      meta:
        author = "TDL"
        description = "Detects potential credential dumping via access to /etc/shadow file on Linux systems"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1003"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.principal.platform = "LINUX"
        (
          re.regex($e.principal.process.command_line, `etc/shadow`) or
          re.regex($e.principal.process.command_line, `etc\\shadow`) or
          re.regex($e.principal.process.command_line, `shadow`)
        )
        $e.principal.hostname = $host
        not re.regex($e.principal.hostname, `(?i)hvt-|high-value-target|critical-system`)

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-system.auth*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.category == "process"
      AND (process.command_line LIKE "*etc/shadow*" OR process.command_line LIKE "*shadow*")
      AND host.name NOT IN ("hvt-host-1", "hvt-host-2", "hvt-host-3")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.CommandLine ICONTAINS "etc/shadow" OR source_json.CommandLine ICONTAINS "shadow") AND NOT(asset IN HighValueTargetHostList)
  crowdstrike: |
    event_platform=Lin (event_simpleName=ProcessRollup2 OR event_simpleName=ProcessRollup2V2 OR event_simpleName=SyntheticProcessRollup2) (CommandLine=*/etc/shadow* OR CommandLine=*shadow*)
    | !match(file="HighValueTargetHosts.csv", field=ComputerName, strict=false)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName, aid])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter action_process_image_command_line ~= "(?i)(etc\\shadow|shadow)"
    | filter agent_hostname not in ("HVT-HOST-1", "HVT-HOST-2", "HVT-HOST-3")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line
  lucene: |
    event.category:process AND event.type:start AND (process.command_line:*etc\/shadow* OR process.command_line:*shadow*) AND NOT host.name:(hvt-* OR critical-* OR prod-db-* OR dc-*)
  sumo: |
    _sourceCategory=*Linux* (shadow OR "etc/shadow" OR "/etc/shadow")
    | json field=_raw "command" as command_line
    | json field=_raw "hostname" as hostname
    | where command_line matches "*shadow*" or command_line matches "*etc/shadow*" or command_line matches "*/etc/shadow*"
    | where !(hostname in ("hvt-host-1", "hvt-host-2", "hvt-host-3"))
    | fields _messageTime, hostname, command_line, _sourceHost
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Linux Command Line Event

  Where the Command contains [etc\shadow, shadow]

  Where the Destination Hostname is NOT on the High Value Target Host List'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000182
v4_id: 000182
name: Shadow File Accessed - HVT
description: Detects when the shadow file is accessed on a high value target host.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Linux
data_sources:
- Linux Operating System
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 95
queries:
  spl: "index=linux sourcetype IN (linux_secure, syslog) \n(command=\"*/etc/shadow*\" OR command=\"*shadow*\" OR CommandLine=\"*/etc/shadow*\"\
    \ OR CommandLine=\"*shadow*\")\n| lookup high_value_targets.csv hostname AS host OUTPUT is_hvt\n| search is_hvt=true OR is_hvt=1\n| table\
    \ _time, host, user, command, CommandLine\n"
  kql: |
    Syslog
    | where TimeGenerated > ago(24h)
    | where Facility == "user" or Facility == "authpriv" or Facility == "local0"
    | where SyslogMessage has_any ("/etc/shadow", "shadow")
    | where Computer in (
        _GetWatchlist('HighValueTargetHosts')
        | project Computer = SearchKey
    )
    | project TimeGenerated, Computer, ProcessName, SyslogMessage, HostIP, HostName
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS hostname, username, \"Command Line\" AS command, sourceip\nFROM events\nWHERE (LOGSOURCENAME(logsourceid)\
    \ IN (SELECT * FROM reference_set_value WHERE reference_set_name = 'High_Value_Target_Hosts') \n       OR hostname IN (SELECT * FROM reference_set_value\
    \ WHERE reference_set_name = 'High_Value_Target_Hosts'))\n  AND (\"Command Line\" ILIKE '%etc/shadow%' OR \"Command Line\" ILIKE '%shadow%')\n\
    LAST 24 HOURS\n"
  yara_l: |
    rule linux_shadow_file_access_hvt {
      meta:
        author = "TDL"
        description = "Detects access to /etc/shadow on high value target hosts - T1003"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1003"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.command_line, `etc/shadow`) or
          re.regex($e.principal.process.command_line, `etc\\shadow`) or
          re.regex($e.principal.process.command_line, `shadow`)
        )
        $e.principal.hostname = $host
        $e.principal.asset.asset_id in %high_value_target_host_list

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-system.auth*
    | WHERE @timestamp > NOW() - 24 hours
      AND (process.command_line LIKE "*etc/shadow*" OR process.command_line LIKE "*shadow*")
      AND host.name IN ("dc01", "dc02", "db-prod01", "web-prod01", "jump-host", "vault-server")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.logType="linux" AND (process_cmd_line ICONTAINS "etc/shadow" OR process_cmd_line ICONTAINS "shadow") AND asset IN asset_list("High Value Target Host List"))
  crowdstrike: "event_simpleName=ProcessRollup2* event_platform=Lin \n(CommandLine=*etc/shadow* OR CommandLine=*shadow*)\n| #crowdstrike/fltr/highvalue_host\n\
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and os_type = OS_LINUX
      and (action_process_image_command_line ~= "etc[/\\\\]shadow" or action_process_image_command_line contains "shadow")
    | comp count() as access_count by agent_hostname, actor_effective_username, action_process_image_command_line, actor_process_image_name
    | filter access_count > 0
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line, access_count
  lucene: |
    event.category:process AND process.command_line:(*etc\/shadow* OR *shadow*) AND host.name:(high_value_target_list_placeholder)
  sumo: |
    _sourceCategory=*Linux* (etc shadow OR shadow)
    | parse regex "(?<command_line>.*(?:etc\\shadow|shadow).*)" nodrop
    | parse regex "(?<dest_host>[^\s]+)" nodrop
    | where command_line matches "*etc*shadow*" OR command_line matches "*shadow*"
    | lookup type, criticality from shared/high_value_targets on dest_host = hostname
    | where !isNull(criticality)
    | fields _messageTime, dest_host, command_line, type, criticality
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Linux Command Line Event

  Where the Command contains [etc\shadow, shadow]

  Where the Destination Hostname is on the High Value Target Host List'
suppression:
  window: 4 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000193
v4_id: 000193
name: EC2 RDP Password Retrieval
description: Detects an attacker making a large number of API calls attempting to retrieve RDP passwords from an EC2 instance.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName=GetPasswordData

    | bin _time span=5m

    | stats count dc(eventName) as unique_events values(requestParameters.instanceId) as instances by _time, userIdentity.principalId, sourceIPAddress

    | where count >= 10

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(5m)
    | where EventName == "GetPasswordData"
    | summarize EventCount = count() by bin(TimeGenerated, 5m), SourceIpAddress, UserIdentityPrincipalid
    | where EventCount >= 10
  aql: |
    SELECT sourceip, username, COUNT(*) AS event_count
    FROM events
    WHERE qidname(qid) ILIKE '%GetPasswordData%'
    GROUP BY sourceip, username
    HAVING event_count >= 10
    LAST 5 MINUTES
  yara_l: "rule aws_getpassworddata_spike {\n  meta:\n    author = \"TDL\"\n    description = \"Detects multiple GetPasswordData API calls from\
    \ same source and user within 5 minutes - T1552 Credential Access\"\n    severity = \"HIGH\"\n    mitre_attack_tactic = \"Credential Access\"\
    \n    mitre_attack_technique = \"T1552\"\n    platform = \"AWS\"\n    \n  events:\n    $e.metadata.vendor_name = \"AMAZON\"\n    $e.metadata.product_name\
    \ = \"AWS CloudTrail\"\n    $e.metadata.product_event_type = \"GetPasswordData\"\n    $e.principal.user.userid = $user\n    $e.principal.ip\
    \ = $source_ip\n    \n  match:\n    $user, $source_ip over 5m\n    \n  condition:\n    #e >= 10\n}\n"
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.action == \"GetPasswordData\"\n| STATS event_count =\
    \ COUNT(*) BY source.ip, user.name, time_window = BUCKET(@timestamp, 5 minutes)\n| WHERE event_count >= 10\n| KEEP time_window, source.ip,\
    \ user.name, event_count\n"
  leql: |
    where(source_json.eventName=GetPasswordData) groupby(source_json.sourceIPAddress, source_json.userIdentity.principalId) calculate(count)
  crowdstrike: |
    #repo=cloudtrail eventName=GetPasswordData
    | bucket(span=5m, field=@timestamp, as=timeWindow)
    | groupBy([timeWindow, userIdentity.principalId, sourceIPAddress], function=count(as=eventCount))
    | eventCount >= 10
    | table([timeWindow, userIdentity.principalId, sourceIPAddress, eventCount])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "GetPasswordData"
    | bin _time span=5m
    | comp count() as event_count by _time, actor.user.identifier, src_ip
    | filter event_count >= 10
  lucene: |
    eventSource:ec2.amazonaws.com AND eventName:GetPasswordData
  sumo: |
    _sourceCategory=*cloudtrail* GetPasswordData
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.principalId" as principal_id
    | json field=_raw "sourceIPAddress" as source_ip
    | where event_name = "GetPasswordData"
    | timeslice 5m
    | count as event_count by _timeslice, source_ip, principal_id
    | where event_count >= 10
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 AWS CloudTrail Events

  Where the Event Name is in [GetPasswordData]

  From a single source and a single user

  Within 5 minutes'
suppression:
  window: 24 hours
  fields:
  - src_ip
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify the read / dump / brute-force pattern is consistent with
  this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

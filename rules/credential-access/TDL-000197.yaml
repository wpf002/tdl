rule_id: TDL-CA-000197
v4_id: 000197
name: Multiple Application Connections Deleted
description: Detects multiple Okta applications deleted by a single user.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=okta eventType="application.lifecycle.delete"

    | bin _time span=10m

    | stats dc(app) as unique_apps count by _time, src_ip, user

    | where unique_apps >= 5 AND count >= 5

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(10m)
    | where eventType_s == "application.lifecycle.delete"
    | summarize UniqueApps = dcount(target_s), AppList = make_set(target_s), EventCount = count() by bin(TimeGenerated, 10m), client_ipAddress_s, actor_alternateId_s
    | where EventCount >= 5 and UniqueApps >= 5
    | project TimeGenerated, SourceIP = client_ipAddress_s, SourceUser = actor_alternateId_s, EventCount, UniqueApplications = UniqueApps, Applications = AppList
  aql: |
    SELECT sourceip, username, UNIQUECOUNT("Application") AS unique_apps, COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" = 'application.lifecycle.delete'
    GROUP BY sourceip, username
    HAVING event_count >= 5 AND unique_apps >= 5
    LAST 10 MINUTES
  yara_l: "rule okta_mass_app_deletion {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects mass deletion of Okta applications\
    \ from same IP and user\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\
    \n    \n  events:\n    $e.metadata.vendor_name = \"OKTA\"\n    $e.metadata.product_event_type = \"application.lifecycle.delete\"\n    $e.principal.ip\
    \ = $ip\n    $e.principal.user.userid = $user\n    $e.target.application = $app\n    \n  match:\n    $ip, $user over 10m\n    \n  outcome:\n\
    \    $risk_score = 75\n    $unique_apps = count_distinct($app)\n    \n  condition:\n    #e >= 5 and $unique_apps >= 5\n}\n"
  esql: |
    FROM logs-okta.system*
    | WHERE @timestamp > NOW() - 10 minutes AND event.action == "application.lifecycle.delete"
    | STATS event_count = COUNT(*), unique_apps = COUNT_DISTINCT(okta.target.id) BY source.ip, okta.actor.id, window = BUCKET(@timestamp, 10 minutes)
    | WHERE event_count >= 5 AND unique_apps >= 5
    | KEEP window, source.ip, okta.actor.id, event_count, unique_apps
  leql: |
    where(source_json.eventType="application.lifecycle.delete") groupby(source_address, source_user) calculate(unique:source_json.target.displayName)
  crowdstrike: |
    #repo=okta eventType="application.lifecycle.delete"
    | groupBy([client.ipAddress, actor.alternateId], function=[count(as=event_count), count(target.alternateId, distinct=true, as=unique_apps)], limit=max)
    | event_count >= 5 AND unique_apps >= 5
    | table([client.ipAddress, actor.alternateId, event_count, unique_apps])
  xql: |
    dataset = okta_raw
    | filter outcome_result = "SUCCESS" and eventtype = "application.lifecycle.delete"
    | bin _time span=10m
    | comp count_distinct(target_0_alternateId) as unique_apps by _time, client_ipAddress, actor_alternateId
    | filter unique_apps >= 5
  lucene: |
    eventType:"application.lifecycle.delete"
  sumo: |
    _sourceCategory=*Okta* "application.lifecycle.delete"
    | json field=_raw "eventType" as event_type
    | json field=_raw "client.ipAddress" as src_ip
    | json field=_raw "actor.alternateId" as user
    | json field=_raw "target[0].displayName" as application
    | where event_type = "application.lifecycle.delete"
    | timeslice 10m
    | count_distinct(application) as unique_apps, count as event_count by _timeslice, src_ip, user
    | where unique_apps >= 5 and event_count >= 5
    | fields _timeslice, src_ip, user, unique_apps, event_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 Okta Event

  Where the Event Type is "application.lifecycle.delete"

  From the same source IP and same source User

  With at least 5 unique applications

  Within 10 minutes'
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

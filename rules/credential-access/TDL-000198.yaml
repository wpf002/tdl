rule_id: TDL-CA-000198
v4_id: 000198
name: Application Connections Deleted by Unauthorized User
description: Detects Okta applications deleted by an anuthorized user.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=okta eventType="application.lifecycle.delete"

    | search NOT [| inputlookup authorized_app_delete_users.csv | fields user | rename user as actor.alternateId]

    | stats count values(target{}.displayName) as deleted_apps by src_ip, actor.alternateId, actor.displayName

    | where count > 0

    | rename actor.alternateId as user, actor.displayName as user_name, src_ip as source_ip

    | table _time, user, user_name, source_ip, deleted_apps, count

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(24h)
    | where eventType_s == "application.lifecycle.delete"
    | where actor_alternateId_s !in ("admin@company.com", "service-account@company.com")
    | project TimeGenerated, actor_alternateId_s, client_ipAddress_s, target_displayName_s, eventType_s, outcome_result_s
    | summarize DeleteCount = count(), DeletedApps = make_set(target_displayName_s) by actor_alternateId_s, client_ipAddress_s
  aql: |
    SELECT sourceip, username, COUNT(*) AS deletion_events, QIDNAME(qid) AS event_name
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Okta%'
      AND (qidname(qid) ILIKE '%application.lifecycle.delete%' OR "Event Type" = 'application.lifecycle.delete')
      AND username NOT IN ('authorized_admin1@company.com', 'authorized_admin2@company.com', 'okta_service_account@company.com')
    GROUP BY sourceip, username, qid
    LAST 24 HOURS
  yara_l: "rule okta_unauthorized_application_deletion {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects unauthorized\
    \ Okta application deletion attempts - MITRE T1078\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\
    \n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.vendor_name = \"Okta\"\n    $e.metadata.product_name = \"Okta\"\n    $e.metadata.product_event_type\
    \ = \"application.lifecycle.delete\"\n    $e.principal.ip = $source_ip\n    $e.principal.user.userid = $user\n    \n    not (\n      $e.principal.user.userid\
    \ = \"admin@company.com\" or\n      $e.principal.user.userid = \"okta-admin@company.com\" or\n      $e.principal.user.userid = \"security-team@company.com\"\
    \n    )\n    \n  match:\n    $source_ip, $user over 5m\n    \n  outcome:\n    $risk_score = 85\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-okta*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"application.lifecycle.delete\"\n  AND NOT user.name\
    \ IN (\"authorized_admin1\", \"authorized_admin2\", \"authorized_admin3\")\n| STATS deletions = COUNT(*) BY source.ip, user.name\n| WHERE\
    \ deletions >= 1\n| KEEP source.ip, user.name, deletions\n"
  leql: |
    where(source_json.eventType="application.lifecycle.delete" AND source_user NOT IN ["authorized_user1@example.com", "authorized_user2@example.com", "authorized_user3@example.com"]) groupby(source_address, source_user) calculate(count)
  crowdstrike: |
    #type=okta eventType="application.lifecycle.delete"
    | groupBy([client.ipAddress, actor.alternateId], function=selectLast([actor.alternateId, client.ipAddress, target{type=AppInstance}.alternateId, @timestamp]))
    | !in(field=actor.alternateId, values=["authorized_admin1@company.com", "authorized_admin2@company.com", "service_account@company.com"])
    | table([@timestamp, actor.alternateId, client.ipAddress, "target{type=AppInstance}.alternateId"])
  xql: |
    dataset = okta_raw_logs
    | filter event_type = "application.lifecycle.delete"
    | filter actor_alternate_id not in ("admin1@company.com", "admin2@company.com", "serviceaccount@company.com")
    | fields _time, actor_alternate_id, client_ipaddress, target_display_name, outcome_result, actor_display_name
  lucene: |
    eventType:"application.lifecycle.delete" AND NOT actor.alternateId:("admin1@company.com" OR "admin2@company.com" OR "secops@company.com")
  sumo: |
    _sourceCategory=*Okta* "application.lifecycle.delete"
    | json field=_raw "eventType" as event_type
    | json field=_raw "actor.alternateId" as source_user
    | json field=_raw "client.ipAddress" as source_ip
    | where event_type = "application.lifecycle.delete"
    | where !(source_user in ("authorized_admin1@company.com", "authorized_admin2@company.com"))
    | fields _messageTime, source_user, source_ip, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Okta Event

  Where the Event Type is "application.lifecycle.delete"

  From the same source IP and same source User

  Where the source user is not on the authorized user list to delete applications'
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

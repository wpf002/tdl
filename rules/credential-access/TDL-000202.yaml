  \ Where Process Name equals \"reg.exe\"\n\tOR\n\t\tWhere Command Line contains \"save hklm\\system\"\n\t\tWhere Command Line contains \"save\
  \ hklm\\sam\"\n\t\tWhere Command Line contains \"save hklm\\security\"\n\t\tWhere Command Line contains \"save hkey_local_machine\\system\"\n\
  \t\tWhere Command Line contains \"save hkey_local_machine\\sam\"\n\t\tWhere Command Line contains \"save hkey_local_machine\\security\"\n\t\t\
  Where Command Line contains \"save registry\\machine\\system\"\n\t\tWhere Command Line contains \"save registry\\machine\\sam\"\n\t\tWhere Command\
  \ Line contains \"save registry\\machine\\security\"\n\t\tWhere Command Line contains \"export hklm\\system\"\n\t\tWhere Command Line contains\
  \ \"export hklm\\sam\"\n\t\tWhere Command Line contains \"export hklm\\security\"\n\t\tWhere Command Line contains \"export hkey_local_machine\\\
  system\"\n\t\tWhere Command Line contains \"export hkey_local_machine\\sam\"\n\t\tWhere Command Line contains \"export hkey_local_machine\\\
  security\"\n\t\tWhere Command Line contains \"export registry\\machine\\system\"\n\t\tWhere Command Line contains \"export registry\\machine\\\
  sam\"\n\t\tWhere Command Line contains \"export registry\\machine\\security\"\n   \n    Where Process Name equals \"powershell.exe\"\n    Where\
  \ Command Line contains \"Invoke-Mimikatz\"\n\t\n\tWhere Process Name equals \"procdump.exe\"\n\tWhere Command contains \"lsass.exe\"\n\t\n\t\
  Where Process Name equals \"taskmgr.exe\"\n\tWhere Command contains \"lsass\"\n\n\n-----------------------------------------------------------------------------------\n\
  \n1 Windows Process Creation Event\nWhere the Event ID is in [4657]\nWhere Destination Host is a Domain Controller\nRegistry Key contains [hklm\\\
  system, hklm\\sam, hkey_local_machine\\system, hklm\\security, hkey_local_machine\\sam, hkey_local_machine\\security, registry\\machine\\system,\
  \ registry\\machine\\sam, registry\\machine\\security]"
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000202
v4_id: '000202'
name: Credential Dumping
description: Detects the dumping of memory or registry hives to gain credentials. The tool Procdump or Task Manager can be used to dump the memory
  of the lsass.exe. The lsass process is responsible for the authentication of users on a Windows host. Procdump is a tool that can dump a process’
  memory to a file. The Task Manager can also be used to dump any process’ memory in the GUI. By dumping the memory of lsass.exe, an attacker
  can search the memory for plaintext passwords that were inputted during authentication and compromise the accounts. Alternatively, an attacker
  can use reg.exe to download the Security Account Manager (SAM) registry hive, which contains user password hashes. These hashes can then be
  cracked or used in pass-the-hash attacks at a later time.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=592 OR EventCode=4688 OR EventCode=4657)\n| eval CommandLine=lower(coalesce(CommandLine,\
    \ Command_Line, Process_Command_Line))\n| eval ProcessName=lower(coalesce(Process_Name, New_Process_Name, Image))\n| eval RegistryKey=lower(coalesce(Registry_Key,\
    \ Object_Name))\n| where \n    (EventCode=592 OR EventCode=4688) AND\n    (\n        (ProcessName=\"reg.exe\" AND \n            (\n      \
    \          match(CommandLine, \"save.*hklm\\\\system\") OR\n                match(CommandLine, \"save.*hklm\\\\sam\") OR\n               \
    \ match(CommandLine, \"save.*hklm\\\\security\") OR\n                match(CommandLine, \"save.*hkey_local_machine\\\\system\") OR\n     \
    \           match(CommandLine, \"save.*hkey_local_machine\\\\sam\") OR\n                match(CommandLine, \"save.*hkey_local_machine\\\\\
    security\") OR\n                match(CommandLine, \"save.*registry\\\\machine\\\\system\") OR\n                match(CommandLine, \"save.*registry\\\
    \\machine\\\\sam\") OR\n                match(CommandLine, \"save.*registry\\\\machine\\\\security\") OR\n                match(CommandLine,\
    \ \"export.*hklm\\\\system\") OR\n                match(CommandLine, \"export.*hklm\\\\sam\") OR\n                match(CommandLine, \"export.*hklm\\\
    \\security\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\\system\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\
    \\sam\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\\security\") OR\n                match(CommandLine, \"export.*registry\\\
    \\machine\\\\system\") OR\n                match(CommandLine, \"export.*registry\\\\machine\\\\sam\") OR\n                match(CommandLine,\
    \ \"export.*registry\\\\machine\\\\security\")\n            )\n        )\n        OR\n        (ProcessName=\"powershell.exe\" AND match(CommandLine,\
    \ \"invoke-mimikatz\"))\n        OR\n        (ProcessName=\"procdump.exe\" AND match(CommandLine, \"lsass\"))\n        OR\n        (ProcessName=\"\
    taskmgr.exe\" AND match(CommandLine, \"lsass\"))\n    )\nOR\n    (EventCode=4657 AND\n        (\n            match(RegistryKey, \"hklm\\\\\
    system\") OR\n            match(RegistryKey, \"hklm\\\\sam\") OR\n            match(RegistryKey, \"hklm\\\\security\") OR\n            match(RegistryKey,\
    \ \"hkey_local_machine\\\\system\") OR\n            match(RegistryKey, \"hkey_local_machine\\\\sam\") OR\n            match(RegistryKey, \"\
    hkey_local_machine\\\\security\") OR\n            match(RegistryKey, \"registry\\\\machine\\\\system\") OR\n            match(RegistryKey,\
    \ \"registry\\\\machine\\\\sam\") OR\n            match(RegistryKey, \"registry\\\\machine\\\\security\")\n        )\n    )\n| table _time,\
    \ ComputerName, EventCode, ProcessName, CommandLine, RegistryKey, User\n"
  kql: |
    SecurityEvent
    | where EventID in (592, 4688, 4657)
    | extend IsDomainController = iff(Computer has_any ("DC", "DomainController"), true, false)
    | where (EventID in (592, 4688) and (
        IsDomainController or
        (Process =~ "reg.exe" and (
            CommandLine has_any ("save hklm\\system", "save hklm\\sam", "save hklm\\security",
                                 "save hkey_local_machine\\system", "save hkey_local_machine\\sam", "save hkey_local_machine\\security",
                                 "save registry\\machine\\system", "save registry\\machine\\sam", "save registry\\machine\\security",
                                 "export hklm\\system", "export hklm\\sam", "export hklm\\security",
                                 "export hkey_local_machine\\system", "export hkey_local_machine\\sam", "export hkey_local_machine\\security",
                                 "export registry\\machine\\system", "export registry\\machine\\sam", "export registry\\machine\\security")
        )) or
        (Process =~ "powershell.exe" and CommandLine has "Invoke-Mimikatz") or
        (Process =~ "procdump.exe" and CommandLine has "lsass.exe") or
        (Process =~ "taskmgr.exe" and CommandLine has "lsass")
    )) or
    (EventID == 4657 and IsDomainController and (
        RegistryKey has_any ("hklm\\system", "hklm\\sam", "hkey_local_machine\\system", "hklm\\security",
                             "hkey_local_machine\\sam", "hkey_local_machine\\security",
                             "registry\\machine\\system", "registry\\machine\\sam", "registry\\machine\\security")
    ))
    | project TimeGenerated, Computer, Account, EventID, Process, CommandLine, RegistryKey, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "EventID"
    FROM events
    WHERE "EventID" IN ('592', '4688', '4657')
      AND (
        ("EventID" IN ('592', '4688') AND (
          ("Process Name" ILIKE '%reg.exe%' AND (
            "Process CommandLine" ILIKE '%save%hklm\system%'
            OR "Process CommandLine" ILIKE '%save%hklm\sam%'
            OR "Process CommandLine" ILIKE '%save%hklm\security%'
            OR "Process CommandLine" ILIKE '%save%hkey_local_machine\system%'
            OR "Process CommandLine" ILIKE '%save%hkey_local_machine\sam%'
            OR "Process CommandLine" ILIKE '%save%hkey_local_machine\security%'
            OR "Process CommandLine" ILIKE '%save%registry\machine\system%'
            OR "Process CommandLine" ILIKE '%save%registry\machine\sam%'
            OR "Process CommandLine" ILIKE '%save%registry\machine\security%'
            OR "Process CommandLine" ILIKE '%export%hklm\system%'
            OR "Process CommandLine" ILIKE '%export%hklm\sam%'
            OR "Process CommandLine" ILIKE '%export%hklm\security%'
            OR "Process CommandLine" ILIKE '%export%hkey_local_machine\system%'
            OR "Process CommandLine" ILIKE '%export%hkey_local_machine\sam%'
            OR "Process CommandLine" ILIKE '%export%hkey_local_machine\security%'
            OR "Process CommandLine" ILIKE '%export%registry\machine\system%'
            OR "Process CommandLine" ILIKE '%export%registry\machine\sam%'
            OR "Process CommandLine" ILIKE '%export%registry\machine\security%'
          ))
          OR ("Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" ILIKE '%Invoke-Mimikatz%')
          OR ("Process Name" ILIKE '%procdump.exe%' AND "Process CommandLine" ILIKE '%lsass.exe%')
          OR ("Process Name" ILIKE '%taskmgr.exe%' AND "Process CommandLine" ILIKE '%lsass%')
        ))
        OR ("EventID" = '4657' AND (
          "Registry Key" ILIKE '%hklm\system%'
          OR "Registry Key" ILIKE '%hklm\sam%'
          OR "Registry Key" ILIKE '%hklm\security%'
          OR "Registry Key" ILIKE '%hkey_local_machine\system%'
          OR "Registry Key" ILIKE '%hkey_local_machine\sam%'
          OR "Registry Key" ILIKE '%hkey_local_machine\security%'
          OR "Registry Key" ILIKE '%registry\machine\system%'
          OR "Registry Key" ILIKE '%registry\machine\sam%'
          OR "Registry Key" ILIKE '%registry\machine\security%'
        ))
      )
    LAST 24 HOURS

rule_id: TDL-CA-000202
v4_id: '000202'
name: Credential Dumping
description: Detects the dumping of memory or registry hives to gain credentials. The tool Procdump or Task Manager can be used to dump the memory
  of the lsass.exe. The lsass process is responsible for the authentication of users on a Windows host. Procdump is a tool that can dump a process’
  memory to a file. The Task Manager can also be used to dump any process’ memory in the GUI. By dumping the memory of lsass.exe, an attacker
  can search the memory for plaintext passwords that were inputted during authentication and compromise the accounts. Alternatively, an attacker
  can use reg.exe to download the Security Account Manager (SAM) registry hive, which contains user password hashes. These hashes can then be
  cracked or used in pass-the-hash attacks at a later time.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=592 OR EventCode=4688 OR EventCode=4657)\n| eval CommandLine=lower(coalesce(CommandLine,\
    \ Command_Line, Process_Command_Line))\n| eval ProcessName=lower(coalesce(Process_Name, New_Process_Name, Image))\n| eval RegistryKey=lower(coalesce(Registry_Key,\
    \ Object_Name))\n| where \n    (EventCode=592 OR EventCode=4688) AND\n    (\n        (ProcessName=\"reg.exe\" AND \n            (\n      \
    \          match(CommandLine, \"save.*hklm\\\\system\") OR\n                match(CommandLine, \"save.*hklm\\\\sam\") OR\n               \
    \ match(CommandLine, \"save.*hklm\\\\security\") OR\n                match(CommandLine, \"save.*hkey_local_machine\\\\system\") OR\n     \
    \           match(CommandLine, \"save.*hkey_local_machine\\\\sam\") OR\n                match(CommandLine, \"save.*hkey_local_machine\\\\\
    security\") OR\n                match(CommandLine, \"save.*registry\\\\machine\\\\system\") OR\n                match(CommandLine, \"save.*registry\\\
    \\machine\\\\sam\") OR\n                match(CommandLine, \"save.*registry\\\\machine\\\\security\") OR\n                match(CommandLine,\
    \ \"export.*hklm\\\\system\") OR\n                match(CommandLine, \"export.*hklm\\\\sam\") OR\n                match(CommandLine, \"export.*hklm\\\
    \\security\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\\system\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\
    \\sam\") OR\n                match(CommandLine, \"export.*hkey_local_machine\\\\security\") OR\n                match(CommandLine, \"export.*registry\\\
    \\machine\\\\system\") OR\n                match(CommandLine, \"export.*registry\\\\machine\\\\sam\") OR\n                match(CommandLine,\
    \ \"export.*registry\\\\machine\\\\security\")\n            )\n        )\n        OR\n        (ProcessName=\"powershell.exe\" AND match(CommandLine,\
    \ \"invoke-mimikatz\"))\n        OR\n        (ProcessName=\"procdump.exe\" AND match(CommandLine, \"lsass\"))\n        OR\n        (ProcessName=\"\
    taskmgr.exe\" AND match(CommandLine, \"lsass\"))\n    )\nOR\n    (EventCode=4657 AND\n        (\n            match(RegistryKey, \"hklm\\\\\
    system\") OR\n            match(RegistryKey, \"hklm\\\\sam\") OR\n            match(RegistryKey, \"hklm\\\\security\") OR\n            match(RegistryKey,\
    \ \"hkey_local_machine\\\\system\") OR\n            match(RegistryKey, \"hkey_local_machine\\\\sam\") OR\n            match(RegistryKey, \"\
    hkey_local_machine\\\\security\") OR\n            match(RegistryKey, \"registry\\\\machine\\\\system\") OR\n            match(RegistryKey,\
    \ \"registry\\\\machine\\\\sam\") OR\n            match(RegistryKey, \"registry\\\\machine\\\\security\")\n        )\n    )\n| table _time,\
    \ ComputerName, EventCode, ProcessName, CommandLine, RegistryKey, User\n"
  kql: 'DeviceRegistryEvents

    | where TimeGenerated > ago(1d)

    | where registry_key matches regex "save hklm\system"

    | summarize Count=count() by DeviceName, InitiatingProcessFileName, RegistryKey, RegistryValueName, RegistryValueData

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Registry Key\", \"Registry Value Name\", \"Registry Value Data\", \"Process Name\"\nFROM events\nWHERE\
    \ LOGSOURCETYPENAME(devicetype) = 'Microsoft Windows Sysmon'\n  AND \"EventID\" IN ('12','13','14')\n  AND \"registry_key\" LIKE '%save hklm\\\
    system%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000202 {\n  meta:\n    author = \"TDL\"\n    description = \"Credential Dumping\"\n    severity = \"HIGH\"\n    tactic\
    \ = \"TA0006\"\n    technique = \"T1003\"\n  events:\n    $e.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    $e.registry_key = /save\
    \ hklm\\system/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "registry" AND registry_key LIKE "%save hklm\system%"

    | STATS count = COUNT(*) BY host.name, user.name, registry.path, registry.value, process.name

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND log_type = "registry" AND registry_key=/save hklm\system/)

    groupby(asset, registry_key, registry_value)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (RegSystemConfigValueUpdate, RegGenericValueUpdate) AND registry_key=*save hklm\system*

    | stats count as changes by ComputerName, UserName, RegObjectName, RegStringValue

    | sort -changes

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.REGISTRY AND registry_key ~= "save hklm\system"

    | comp count() as changes by agent_hostname, actor_effective_username, action_registry_key_name, action_registry_value_name

    | sort desc changes

    '
  lucene: 'event.category:"registry" AND registry_key:*save hklm\system*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id IN ("12","13","14") AND registry_key matches "*save hklm\system*"

    | count by host, user, registry_key, registry_value, image

    | sort by _count desc

    '

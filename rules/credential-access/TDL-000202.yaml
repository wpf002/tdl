    \\sam`) or\n          re.regex($proc.target.process.command_line, `(?i)export\\s+registry\\\\machine\\\\security`)\n        )\n      ) or\n\
    \      (\n        re.regex($proc.target.process.file.full_path, `(?i)\\\\powershell\\.exe$`) and\n        re.regex($proc.target.process.command_line,\
    \ `(?i)Invoke-Mimikatz`)\n      ) or\n      (\n        re.regex($proc.target.process.file.full_path, `(?i)\\\\procdump\\.exe$`) and\n    \
    \    re.regex($proc.target.process.command_line, `(?i)lsass\\.exe`)\n      ) or\n      (\n        re.regex($proc.target.process.file.full_path,\
    \ `(?i)\\\\taskmgr\\.exe$`) and\n        re.regex($proc.target.process.command_line, `(?i)lsass`)\n      )\n    )\n\n    // Registry Modification\
    \ Events (4657)\n    $reg.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    $reg.metadata.product_event_type = \"4657\"\n    $reg.principal.hostname\
    \ = $host\n    (\n      re.regex($reg.target.registry.registry_key, `(?i)hklm\\\\system`) or\n      re.regex($reg.target.registry.registry_key,\
    \ `(?i)hklm\\\\sam`) or\n      re.regex($reg.target.registry.registry_key, `(?i)hklm\\\\security`) or\n      re.regex($reg.target.registry.registry_key,\
    \ `(?i)hkey_local_machine\\\\system`) or\n      re.regex($reg.target.registry.registry_key, `(?i)hkey_local_machine\\\\sam`) or\n      re.regex($reg.target.registry.registry_key,\

            )
        ) or
        (event_id in ("4688", "592") and (process_name matches "*\\powershell.exe" or process_name2 matches "*\\powershell.exe") and command_line matches "*Invoke-Mimikatz*") or
        (event_id in ("4688", "592") and (process_name matches "*\\procdump.exe" or process_name2 matches "*\\procdump.exe") and command_line matches "*lsass.exe*") or
        (event_id in ("4688", "592") and (process_name matches "*\\taskmgr.exe" or process_name2 matches "*\\taskmgr.exe") and command_line matches "*lsass*") or
        (event_id = "4657" and (
            registry_key matches "*hklm\\system*" or
            registry_key matches "*hklm\\sam*" or
            registry_key matches "*hklm\\security*" or
            registry_key matches "*hkey_local_machine\\system*" or
            registry_key matches "*hkey_local_machine\\sam*" or
            registry_key matches "*hkey_local_machine\\security*" or
            registry_key matches "*registry\\machine\\system*" or
            registry_key matches "*registry\\machine\\sam*" or
            registry_key matches "*registry\\machine\\security*"
        ))
    )
    | fields _messageTime, computer, event_id, process_name, process_name2, command_line, registry_key

    | WHERE event.code IN ("592", "4688", "4657")
    | WHERE (
        (event.code IN ("592", "4688") AND (
          (TO_LOWER(process.name) == "reg.exe" AND (
            TO_LOWER(process.command_line) LIKE "*save hklm\\system*" OR
            TO_LOWER(process.command_line) LIKE "*save hklm\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*save hklm\\security*" OR
            TO_LOWER(process.command_line) LIKE "*save hkey_local_machine\\system*" OR
            TO_LOWER(process.command_line) LIKE "*save hkey_local_machine\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*save hkey_local_machine\\security*" OR
            TO_LOWER(process.command_line) LIKE "*save registry\\machine\\system*" OR
            TO_LOWER(process.command_line) LIKE "*save registry\\machine\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*save registry\\machine\\security*" OR
            TO_LOWER(process.command_line) LIKE "*export hklm\\system*" OR
            TO_LOWER(process.command_line) LIKE "*export hklm\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*export hklm\\security*" OR
            TO_LOWER(process.command_line) LIKE "*export hkey_local_machine\\system*" OR
            TO_LOWER(process.command_line) LIKE "*export hkey_local_machine\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*export hkey_local_machine\\security*" OR
            TO_LOWER(process.command_line) LIKE "*export registry\\machine\\system*" OR
            TO_LOWER(process.command_line) LIKE "*export registry\\machine\\sam*" OR
            TO_LOWER(process.command_line) LIKE "*export registry\\machine\\security*"
          )) OR
          (TO_LOWER(process.name) == "powershell.exe" AND TO_LOWER(process.command_line) LIKE "*invoke-mimikatz*") OR
          (TO_LOWER(process.name) == "procdump.exe" AND TO_LOWER(process.command_line) LIKE "*lsass.exe*") OR
          (TO_LOWER(process.name) == "taskmgr.exe" AND TO_LOWER(process.command_line) LIKE "*lsass*")
        )) OR
        (event.code == "4657" AND (
          TO_LOWER(registry.path) LIKE "*hklm\\system*" OR
          TO_LOWER(registry.path) LIKE "*hklm\\sam*" OR
          TO_LOWER(registry.path) LIKE "*hklm\\security*" OR
          TO_LOWER(registry.path) LIKE "*hkey_local_machine\\system*" OR
          TO_LOWER(registry.path) LIKE "*hkey_local_machine\\sam*" OR
          TO_LOWER(registry.path) LIKE "*hkey_local_machine\\security*" OR
          TO_LOWER(registry.path) LIKE "*registry\\machine\\system*" OR
          TO_LOWER(registry.path) LIKE "*registry\\machine\\sam*" OR
          TO_LOWER(registry.path) LIKE "*registry\\machine\\security*"
        ))
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, registry.path

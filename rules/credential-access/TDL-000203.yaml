rule_id: TDL-CA-000203
v4_id: '000203'
name: Active Directory Database Dump
description: Detects when a user dumps the Active Directory Database file ntds.dit using the built in windows tool ntdsutil. The ntds.dit file
  contains all of the user and group information in Active Directory. By using the utility ntdsutil, an attacker can create a copy of the database
  and extract user credentials from it offline.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4688 dest_category=domain_controller ProcessName="*\\ntdsutil.exe" CommandLine="*ac
    i ntds*" CommandLine="*ifm*" CommandLine="*create full*"

    | table _time, ComputerName, Account_Name, ProcessName, CommandLine

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Computer has "DC" or Computer has "DomainController"
    | where Process has "ntdsutil.exe" or NewProcessName has "ntdsutil.exe"
    | where CommandLine contains "ac i ntds" and CommandLine contains "ifm" and CommandLine contains "create full"
    | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine, EventID
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS destination_host, username, "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%ntdsutil.exe%'
      AND "Process CommandLine" ILIKE '%ac i ntds%'
      AND "Process CommandLine" ILIKE '%ifm%'
      AND "Process CommandLine" ILIKE '%create full%'
    LAST 24 HOURS
  yara_l: "rule ntdsutil_ifm_export_on_dc {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects ntdsutil.exe IFM export\
    \ on Domain Controller - T1003 Credential Access\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1003\"\
    \n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type =\
    \ \"592\" or\n      $e.metadata.product_event_type = \"4688\"\n    )\n    re.regex($e.target.process.file.full_path, `(?i)\\\\ntdsutil\\.exe$`)\n\
    \    re.regex($e.target.process.command_line, `(?i)ac\\s+i\\s+ntds`)\n    re.regex($e.target.process.command_line, `(?i)ifm`)\n    re.regex($e.target.process.command_line,\
    \ `(?i)create\\s+full`)\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 85\n  \
    \  \n  condition:\n    $e\n}\n"
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*\n| WHERE winlog.event_id IN (592, 4688) \n  AND process.name\
    \ == \"ntdsutil.exe\"\n  AND process.command_line LIKE \"*ac i ntds*\"\n  AND process.command_line LIKE \"*ifm*\"\n  AND process.command_line\
    \ LIKE \"*create full*\"\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="ntdsutil.exe" AND process_cmd_line ICONTAINS "ac i ntds" AND process_cmd_line ICONTAINS "ifm" AND process_cmd_line ICONTAINS "create full")
  crowdstrike: |
    EventCode=4688 ComputerName=*DC* NewProcessName=*ntdsutil.exe CommandLine=*ac?i?ntds* CommandLine=*ifm* CommandLine=*create?full*
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, CommandLine, ParentProcessName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter agent_is_domain_controller = TRUE
    | filter action_process_image_name ~= ".*ntdsutil\.exe$"
    | filter action_process_image_command_line contains "ac i ntds"
    | filter action_process_image_command_line contains "ifm"
    | filter action_process_image_command_line contains "create full"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, action_process_image_path
  lucene: |
    event.code:4688 AND process.name:ntdsutil.exe AND process.command_line:*ac\ i\ ntds* AND process.command_line:*ifm* AND process.command_line:*create\ full*
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as computer
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("592", "4688")
    | where process_name matches "*ntdsutil.exe"
    | where command_line matches "*ac i ntds*"
    | where command_line matches "*ifm*"
    | where command_line matches "*create full*"
    | fields _messageTime, computer, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Creation Event\nWhere the Event ID is in [592, 4688]\nWhere Destination Host is a Domain Controller \nWhere Process\
  \ Name equals \"ntdsutil.exe\"\nWhere Command Line contains \"ac i ntds\"\nWhere Command Line contains \"ifm\"\nWhere Command Line contains\
  \ \"create full\""
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

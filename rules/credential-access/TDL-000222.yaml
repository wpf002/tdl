rule_id: TDL-CA-000222
v4_id: '000222'
name: Group Policy Password Enumeration
description: When attempting to pivot within an internal AD network, attackers will query the Domain Controllers for passwords stored within group
  policy files. This is typically done by querying the SYSVOL share and searching for multiple .xml files.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5140'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=5145 Share_Name="\\*\\SYSVOL" Relative_Target_Name="*.xml"

    | bin _time span=2m

    | stats dc(Relative_Target_Name) as unique_files values(Relative_Target_Name) as file_names by _time, Source_Address, ComputerName

    | where unique_files >= 5

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(2m)
    | where EventID == 5145
    | where ShareName has "\\SYSVOL"
    | where RelativeTargetName endswith ".xml"
    | summarize UniqueFiles = dcount(RelativeTargetName), FileList = make_set(RelativeTargetName) by bin(TimeGenerated, 2m), Computer, IpAddress, Account
    | where UniqueFiles >= 5
  aql: |
    SELECT sourceip, destinationip, UNIQUECOUNT("Relative Target Name") AS unique_files, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '5145'
      AND "Share Name" ILIKE '%\\\\*\\SYSVOL%'
      AND "Relative Target Name" ILIKE '%.xml'
    GROUP BY sourceip, destinationip
    HAVING unique_files >= 5
    LAST 2 MINUTES
  yara_l: "rule credential_access_sysvol_gpp_enumeration {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential GPP credential\
    \ access via SYSVOL XML enumeration (T1552)\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1552\"\n \
    \   \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.product_event_type = \"5145\"\n    re.regex($e.target.resource.name,\
    \ `(?i)\\\\\\\\.*\\\\SYSVOL`)\n    re.regex($e.target.file.full_path, `(?i)\\.xml$`)\n    $e.principal.hostname = $source\n    $e.target.hostname\
    \ = $dest\n    $e.target.file.full_path = $filename\n    \n  match:\n    $source, $dest over 2m\n    \n  outcome:\n    $risk_score = 75\n\
    \    $accessed_files = array_distinct($filename)\n    $file_count = count_distinct($filename)\n    \n  condition:\n    $source = $dest and\
    \ #filename >= 5\n}\n"
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 2 minutes \n  AND event.code == \"5145\"\n  AND winlog.event_data.ShareName\
    \ LIKE \"\\\\*\\\\SYSVOL\"\n  AND winlog.event_data.RelativeTargetName LIKE \"*.xml\"\n| STATS unique_files = COUNT_DISTINCT(winlog.event_data.RelativeTargetName),\
    \ \n        total_events = COUNT(*) \n  BY source.ip, destination.ip, host.name, user.name, \n     bucket = BUCKET(@timestamp, 2 minutes)\n\
    | WHERE unique_files >= 5\n| KEEP bucket, source.ip, destination.ip, host.name, user.name, unique_files, total_events\n"
  leql: |
    where(source_json.EventID=5145 AND source_json.ShareName ICONTAINS "\\SYSVOL" AND source_json.RelativeTargetName ICONTAINS ".xml") groupby(source_address, destination_address) calculate(unique:source_json.RelativeTargetName)
  crowdstrike: |
    EventCode=5145 ShareName="\\*\SYSVOL" RelativeTargetName=*.xml
    | groupBy([IpAddress, ComputerName], function=[count(RelativeTargetName, distinct=true, as=uniqueFiles), collect([RelativeTargetName])], limit=max)
    | uniqueFiles >= 5
    | table([IpAddress, ComputerName, uniqueFiles, _collect])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 5145
    | filter action_evtlog_event_data_ShareName ~= "\\\\.*\\\\SYSVOL"
    | filter action_evtlog_event_data_RelativeTargetName ~= ".*\\.xml"
    | bin _time span=2m
    | comp count_distinct(action_evtlog_event_data_RelativeTargetName) as unique_files by _time, agent_hostname, action_evtlog_event_data_IpAddress
    | filter unique_files >= 5
  lucene: |
    event.code:5145 AND winlog.event_data.ShareName:\\*\\SYSVOL AND winlog.event_data.RelativeTargetName:*.xml
  sumo: |
    _sourceCategory=*Windows* "5145"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ShareName" as share_name
    | json field=_raw "RelativeTargetName" as relative_target_name
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "Computer" as dest_host
    | where event_id = "5145"
    | where share_name matches "*\\SYSVOL"
    | where relative_target_name matches "*.xml"
    | timeslice 2m
    | count_distinct(relative_target_name) as unique_files by _timeslice, src_ip, dest_host
    | where unique_files >= 5
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 Windows Network Share Object Accessed Events

  Where the Event ID is in [5145]

  Where the Share Name is "\\*\SYSVOL"

  Where the Share File Relative Target Name matches "*.xml"

  With the same Source and Destination

  With unique Share File Names

  Within 2 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

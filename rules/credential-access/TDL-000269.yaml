rule_id: TDL-CA-000269
v4_id: 000269
name: Mass secret retrieval from Azure Key Vault
description: Detects when a single source retrieves a large of secrets from the Azure Key Vault within a short period of time
tactic: Credential Access
tactic_id: TA0006
technique_id: T1555
technique_name: Credentials from Password Stores
platform:
- Azure
data_sources:
- Azure Key Vault
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:monitor:aad (operationName="SecretGet" OR operationName="KeyGet" OR operationName="VaultGet")

    | bin _time span=5m

    | stats count by _time, callerIpAddress

    | where count >= 25

    '
  kql: |
    AzureDiagnostics
    | where TimeGenerated > ago(1h)
    | where ResourceType == "VAULTS"
    | where OperationName in ("SecretGet", "KeyGet", "VaultGet")
    | summarize EventCount = count() by CallerIPAddress, bin(TimeGenerated, 1h)
    | where EventCount >= 25
    | project TimeGenerated, CallerIPAddress, EventCount
  aql: |
    SELECT sourceip, QIDNAME(qid) AS event_name, COUNT(*) AS event_count
    FROM events
    WHERE (QIDNAME(qid) ILIKE '%SecretGet%' OR QIDNAME(qid) ILIKE '%KeyGet%' OR QIDNAME(qid) ILIKE '%VaultGet%')
      AND (QIDNAME(qid) ILIKE '%Azure%' OR QIDNAME(qid) ILIKE '%Key Vault%' OR LOGSOURCENAME(logsourceid) ILIKE '%Azure%')
    GROUP BY sourceip, QIDNAME(qid)
    HAVING event_count >= 25
    LAST 1 HOURS
  yara_l: |
    rule azure_keyvault_credential_access_t1555 {
      meta:
        author = "TDL"
        description = "Detects potential credential access via Azure Key Vault secret enumeration - MITRE T1555"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1555"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Azure Key Vault"
        (
          $e.metadata.product_event_type = "SecretGet" or
          $e.metadata.product_event_type = "KeyGet" or
          $e.metadata.product_event_type = "VaultGet"
        )
        $e.principal.ip = $source_ip

      match:
        $source_ip over 10m

      condition:
        #e >= 25
    }
  esql: "FROM logs-azure.auditlogs*, logs-azure.activitylogs*\n| WHERE @timestamp > NOW() - 1 hour \n  AND azure.activitylogs.operation_name IN\
    \ (\"SecretGet\", \"KeyGet\", \"VaultGet\")\n| STATS event_count = COUNT(*) BY source.ip\n| WHERE event_count >= 25\n"
  leql: |
    where(source_json.operationName IN ["SecretGet", "KeyGet", "VaultGet"]) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=azure* (event.action="SecretGet" OR event.action="KeyGet" OR event.action="VaultGet")
    | groupBy([source.ip], function=count(as=event_count))
    | event_count >= 25
    | table([source.ip, event_count])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and resource_type = "microsoft.keyvault/vaults"
    | filter operation_name in ("SecretGet", "KeyGet", "VaultGet")
    | comp count() as event_count by caller_ip_address
    | filter event_count >= 25
    | fields caller_ip_address, event_count
  lucene: |
    _exists_:azure.keyvault AND (azure.keyvault.operation_name:(SecretGet OR KeyGet OR VaultGet) OR event.action:(SecretGet OR KeyGet OR VaultGet) OR operationName:(SecretGet OR KeyGet OR VaultGet))
  sumo: |
    _sourceCategory=*Azure*KeyVault* (SecretGet OR KeyGet OR VaultGet)
    | json field=_raw "operationName" as operation_name
    | json field=_raw "callerIpAddress" as source_ip
    | where operation_name in ("SecretGet", "KeyGet", "VaultGet")
    | timeslice 1h
    | count as event_count by _timeslice, source_ip
    | where event_count >= 25
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '25 Azure Key Vault Events

  Where the Event Name is in ["SecretGet", "KeyGet", "VaultGet"]

  With the same Source'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000277
v4_id: '000277'
name: Stealth Account Guessing
description: Detects a potential low and slow account guessing attack against Windows accounts. Attackers may attempt to determine if a username
  exists by authenticating with a username and observing error messages received. The guessed usernames may be default accounts for applications
  or permutations the organization's naming convention. Once the attacker has determined if a username exists, they can target the existing accounts
  with password spraying attacks. The attacker, in this instance, is preforming the account guessing at a slow rate to avoid detection.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110
technique_name: Brute Force
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4625'
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625) Failure_Code="0xC0000064"
    | search NOT TargetUserName="*$"
    | search NOT (dest_nt_host IN ("DC1","DC2","DC3") OR dest IN ("10.0.1.10","10.0.1.11"))
    | search NOT (src_nt_host IN ("MAILSRV1","MAILSRV2") OR src IN ("10.0.2.10","10.0.2.11"))
    | search NOT (src_nt_host IN ("AUTHSRV1","AUTHSRV2") OR src IN ("10.0.3.10","10.0.3.11"))
    | bin _time span=3m
    | stats dc(TargetUserName) as unique_users, count as auth_failures, values(TargetUserName) as usernames, values(EventCode) as event_codes by _time, src, dest
    | where auth_failures >= 2 AND unique_users >= 1
    | eval event_code_count=mvcount(event_codes)
    | where event_code_count=1
    | bin _time span=1h as hour_bucket
    | stats count as instance_count, values(_time) as event_times, values(usernames) as all_usernames by hour_bucket, src, dest
    | where instance_count >= 4
    | table hour_bucket, src, dest, instance_count, event_times, all_usernames
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4625")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4625')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000277 {\n  meta:\n    author = \"TDL\"\n    description = \"Stealth Account Guessing\"\n    severity = \"LOW\"\n \
    \   tactic = \"TA0006\"\n    technique = \"T1110\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4625)/\n \
    \   $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4625")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4625])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4625)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4625")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4625)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4625")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "4 Instances over 1 hour of at least 2 Windows Authentication Failure Events \nFrom the same internal Source IP to the same Destination\n\
  Where the Event ID in [529, 4625]\nWhere the Failure Code is \"0xC0000064\"\nWhere the Destination Username does NOT end with \"$\" \nWhere\
  \ the Destination IP/Hostname is NOT on the Domain Controller List \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source\
  \ IP/Hostname is NOT on a Central Authentication Server List \nWith unique Destination Usernames \nWith the same Event ID \nWithin 3 minutes"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

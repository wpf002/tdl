rule_id: TDL-CA-000292
v4_id: 000292
name: Unauthorized Domain Group Creation
description: When IAM Settings for the application are modified in Azure.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:eventhub EventType="Add group"

    | table _time, user, EventType, TargetUserName, Group, Category, ResourceGroup

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(1h)
    | where OperationName == "Add member to group"
    | project TimeGenerated, Identity, TargetResources, OperationName, Result, InitiatedBy, AADTenantId, CorrelationId
  aql: |
    SELECT sourceip, username, "Activity", "Target", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCETYPE(devicetype) ILIKE '%Azure%' AND ("Activity" ILIKE '%Add group%' OR "Activity" ILIKE '%group add%' OR "Activity" = 'Add group' OR CATEGORYNAME(category) ILIKE '%Add group%')
    LAST 24 HOURS
  yara_l: "rule azure_add_group_event {\n  meta:\n    author = \"Chronicle Detection\"\n    description = \"Detects Azure 'Add group' events -\
    \ MITRE T1078 Credential Access\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\n    severity =\
    \ \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"Azure\"\n    $e.metadata.product_event_type = \"Add group\"\n    $e.principal.user.userid\
    \ = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-azure*
    | WHERE event.action == "Add group" OR event.action == "Group.Add" OR azure.activitylogs.operation_name == "Add group" OR azure.auditlogs.operation_name == "Add group"
    | KEEP @timestamp, host.name, user.name, azure.activitylogs.operation_name, azure.auditlogs.operation_name, event.action, azure.activitylogs.properties.target_resources, azure.auditlogs.properties.target_resources, source.ip
  leql: |
    where(source_json.operationName="Add group" OR source_json.operation="Add group" OR source_json.eventName="Add group")
  crowdstrike: |
    event_simpleName=UserActivityAuditEvent event_platform=Win OperationName="Add group"
    | table([@timestamp, ComputerName, UserName, OperationName, TargetResources])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and operation_name = "Add group"
    | fields _time, cloud_provider, operation_name, identity_name, resource_name, caller_ip_address, project_name
  lucene: |
    event.type:"Add group" OR (azure.activitylogs.operation_name:"Add group" OR azure.auditlogs.operation_name:"Add group" OR operation_name:"Add group")
  sumo: |
    _sourceCategory=*Azure* "Add group"
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.targetResources[0].displayName" as group_name
    | json field=_raw "identity.claims.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn" as user
    | json field=_raw "callerIpAddress" as ip_address
    | where operation_name matches "*Add group*" OR operation_name matches "*Create group*"
    | fields _messageTime, user, group_name, ip_address, operation_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 Azure Event Where Event Type is "Add group"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

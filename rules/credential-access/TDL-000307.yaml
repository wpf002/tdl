rule_id: TDL-CA-000307
v4_id: '000307'
name: AWS Instance Credential Exfiltration - GuardDuty
description: Detects when an external address or an address tied to an exisiting AWS account has attempted to run AWS API operations using temporary
  AWS credentials that were created on an EC2 instance in your AWS environment. The listed EC2 instance might be compromised, and the temporary
  credentials from this instance might have been exfiltrated to a remote host outside of AWS. AWS does not recommend redistributing temporary
  credentials outside of the entity that created them (for example, AWS applications, EC2, or Lambda). However, authorized users can export credentials
  from their EC2 instances to make legitimate API calls. To rule out a potential attack and verify the legitimacy of the activity, validate if
  the use of instance credentials from the remote IP in the finding is expected.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype=aws:cloudwatchlogs:guardduty (type="UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS" OR type="UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")

    | table _time, type, severity, accountId, region, resource.instanceDetails.instanceId, service.action.awsApiCallAction.remoteIpDetails.ipAddressV4,
    resource.accessKeyDetails.userName

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where EventType in ("UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")
    | project TimeGenerated, EventType, AccountId, Region, ResourceType, Severity, Title, Description, UserName, IpAddress
  aql: "SELECT sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), eventtime, \"Event Type\"\nFROM events\nWHERE LOGSOURCENAME(logsourceid)\
    \ ILIKE '%guardduty%'\n  AND (\"Event Type\" = 'UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS' \n       OR \"Event Type\"\
    \ = 'UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_iam_credential_exfiltration {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty alerts for IAM instance credential exfiltration"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1552"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS" or
          $e.metadata.product_event_type = "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, source.ip, event.type, event.severity, event.id
  leql: |
    where(source_json.type IN ["UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS"])
  crowdstrike: "#type=guardduty \n| \"finding.type\" in [\"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS\", \"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS\"\
    ]\n| table([@timestamp, \"finding.type\", \"finding.severity\", \"resource.instanceDetails.instanceId\", \"service.action.awsApiCallAction.remoteIpDetails.ipAddressV4\"\
    , \"resource.accessKeyDetails.userName\"])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and log_name = "GuardDuty"
    | filter raw_log.type in ("UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")
    | fields _time, cloud_provider, project, resource_name, raw_log.type, raw_log.severity, raw_log.description, raw_log.region, raw_log.accountId
  lucene: |
    event.type:"guardduty" AND (aws.guardduty.finding.type:"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS" OR aws.guardduty.finding.type:"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS", "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS"]'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — verify the read / dump / brute-force pattern is consistent with
  this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000312
v4_id: '000312'
name: Unauthorized Service Account Key Created - GCP
description: This event captures the creation of a service account key by a non-admin user. Attackers could create additional keys for a service
  account to establish persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- GCP
data_sources:
- GCP
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=gcp sourcetype=gcp:cloudaudit methodName=\"*CreateServiceAccountKey*\" \n| search NOT (principalEmail=\"*@gserviceaccounts.iam.gserviceaccount.com\"\
    \ OR principalEmail=\"*admin*\")\n| table _time, principalEmail, serviceName, methodName, resource.labels.project_id, protoPayload.authenticationInfo.principalEmail,\
    \ protoPayload.resourceName\n"
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName contains "CreateServiceAccountKey"
    | where Caller !endswith "@gserviceaccount.iam.gserviceaccount.com"
    | where Caller !has "admin"
    | project TimeGenerated, Caller, MethodName, ResourceName, PrincipalEmail, ServiceAccountKeyName = tostring(parse_json(Response).name), ProjectId, RequestMetadata = RequestMetadata
  aql: |
    SELECT eventtime, username, sourceip, "message.data.protoPayload.methodName" AS method, "message.data.protoPayload.authenticationInfo.principalEmail" AS principal_email, "message.data.protoPayload.resourceName" AS resource_name, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "message.data.protoPayload.methodName" ILIKE '%CreateServiceAccountKey%'
      AND username NOT ILIKE '%admin%'
      AND username NOT ILIKE '%gserviceaccount%'
      AND "message.data.protoPayload.authenticationInfo.principalEmail" NOT ILIKE '%admin%'
      AND "message.data.protoPayload.authenticationInfo.principalEmail" NOT ILIKE '%gserviceaccount%'
    LAST 24 HOURS
  yara_l: |
    rule gcp_service_account_key_creation {
      meta:
        author = "Detection Engineer"
        description = "Detects non-admin service account key creation in GCP - MITRE T1078"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "GCP"
        $e.metadata.vendor_name = "Google Cloud Platform"
        $e.metadata.product_event_type = "google.iam.admin.v1.CreateServiceAccountKey"
        re.regex($e.target.resource.attribute.labels["method_name"], `CreateServiceAccountKey`)
        not re.regex($e.principal.user.userid, `(?i)admin`)
        not re.regex($e.principal.user.userid, `gserviceaccount\.com$`)
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND message.data.protoPayload.methodName LIKE \"*CreateServiceAccountKey*\"\
    \n  AND NOT (\n    TO_LOWER(message.data.protoPayload.authenticationInfo.principalEmail) LIKE \"*admin*\" \n    OR TO_LOWER(message.data.protoPayload.authenticationInfo.principalEmail)\
    \ LIKE \"*gserviceaccount*\"\n  )\n| KEEP @timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName,\
    \ message.data.protoPayload.resourceName, message.data.protoPayload.serviceName, message.data.resource.labels.project_id\n"
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "CreateServiceAccountKey" AND source_json.protoPayload.authenticationInfo.principalEmail NOT ICONTAINS "gserviceaccount.com" AND source_json.protoPayload.authenticationInfo.principalEmail NOT ICONTAINS "admin")
  crowdstrike: "#event_platform=GCP \n| case {\n    message.data.protoPayload.methodName=*CreateServiceAccountKey* | true;\n    * | false;\n \
    \ }\n| regex(\"(?<sourceUser>[^@]+@[^\\\\s]+)\", field=message.data.protoPayload.authenticationInfo.principalEmail)\n| sourceUser != *admin*\
    \ AND sourceUser != *gserviceaccount*\n| table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName,\
    \ message.data.protoPayload.resourceName, message.data.protoPayload.serviceData.createServiceAccountKeyRequest])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "GCP" and message.data.protoPayload.methodName contains "CreateServiceAccountKey"
    | alter source_user = coalesce(message.data.protoPayload.authenticationInfo.principalEmail, "unknown")
    | filter source_user != "unknown" and not (source_user contains "gserviceaccount.com" or source_user ~= ".*admin.*")
    | fields _time, source_user, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.protoPayload.request
  lucene: |
    message.data.protoPayload.methodName:*CreateServiceAccountKey* AND NOT (message.data.protoPayload.authenticationInfo.principalEmail:*@gserviceaccount.iam.gserviceaccount.com OR message.data.protoPayload.authenticationInfo.principalEmail:*admin*)
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*Cloud*Audit* "CreateServiceAccountKey"
    | json field=_raw "message.data.protoPayload.methodName" as method_name
    | json field=_raw "message.data.protoPayload.authenticationInfo.principalEmail" as principal_email
    | where method_name matches "*CreateServiceAccountKey*"
    | where !(principal_email matches "*admin*" or principal_email matches "*gserviceaccount*")
    | fields _messageTime, _sourceHost, method_name, principal_email
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains CreateServiceAccountKey

  AND where the Source user is not a Admin or gserviceaccount'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000313
v4_id: '000313'
name: Unauthorized Bucket Creation - GCP
description: This event captures the creation of a new bucket by a non-admin user. Adversaries may stage collected data in a central location
  or directory prior to Exfiltration.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1074
technique_name: T1074
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit protoPayload.methodName="storage.buckets.create"

    | search NOT (protoPayload.authenticationInfo.principalEmail="*@gserviceaccount.com" OR protoPayload.authenticationInfo.principalEmail="*admin*")

    | table _time, protoPayload.authenticationInfo.principalEmail, protoPayload.resourceName, protoPayload.methodName, resource.labels.project_id

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where OperationName contains "storage.buckets.create"
    | where PrincipalEmail !endswith "@gserviceaccount.iam.gserviceaccount.com"
    | where PrincipalEmail !has "admin"
    | project TimeGenerated, OperationName, PrincipalEmail, ResourceName, ProjectId, CallerIp, RequestMetadata
  aql: |
    SELECT sourceip, username, "message.data.protoPayload.methodName" AS method, "message.data.protoPayload.resourceName" AS resource, COUNT(*) AS event_count
    FROM events
    WHERE "message.data.protoPayload.methodName" ILIKE '%storage.buckets.create%'
      AND username NOT ILIKE '%admin%'
      AND username NOT ILIKE '%gserviceaccount%'
    LAST 24 HOURS
  yara_l: "rule gcp_bucket_creation_by_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects GCP bucket creation by non-admin\
    \ or non-service accounts\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1074\"\n    severity = \"Medium\"\
    \n    \n  events:\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_UNCATEGORIZED\"\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\
    \n    $e.metadata.product_name = \"Google Cloud Platform\"\n    re.regex($e.security_result.summary, `storage\\.buckets\\.create`)\n    $e.principal.user.userid\
    \ = $user\n    not re.regex($user, `(?i)admin`)\n    not re.regex($user, `gserviceaccount\\.com$`)\n    $e.principal.resource.name = $project\n\
    \    \n  match:\n    $user, $project over 5m\n    \n  outcome:\n    $risk_score = 50\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-gcp.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND message.data.protoPayload.methodName LIKE "*storage.buckets.create*"
      AND NOT (user.name LIKE "*gserviceaccount*" OR user.roles LIKE "*admin*" OR user.name LIKE "*admin*")
    | STATS event_count = COUNT(*) BY user.name, host.name, message.data.protoPayload.methodName, source.ip
    | KEEP @timestamp, user.name, host.name, message.data.protoPayload.methodName, source.ip, event_count
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "storage.buckets.create" AND source_user NOT ICONTAINS "admin" AND source_user NOT ICONTAINS "gserviceaccount")
  crowdstrike: |
    #repo=gcp_audit event_simpleName=GcpAuditLog protoPayload.methodName=*storage.buckets.create*
    | regex("protoPayload\\.authenticationInfo\\.principalEmail\"\\s*:\\s*\"(?<principalEmail>[^\"]+)", field=_raw)
    | principalEmail!=*@gserviceaccount.com principalEmail!=*admin*
    | table([@timestamp, principalEmail, protoPayload.methodName, protoPayload.resourceName, ComputerName])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"GCP\" \n  and json_extract_scalar(message, \"$.data.protoPayload.methodName\"\
    ) contains \"storage.buckets.create\"\n  and json_extract_scalar(message, \"$.data.protoPayload.authenticationInfo.principalEmail\") not contains\
    \ \"gserviceaccount\"\n  and json_extract_scalar(message, \"$.data.protoPayload.authenticationInfo.principalEmail\") not contains \"admin\"\
    \n| fields _time, json_extract_scalar(message, \"$.data.protoPayload.authenticationInfo.principalEmail\") as principal_email, json_extract_scalar(message,\
    \ \"$.data.protoPayload.methodName\") as method_name, json_extract_scalar(message, \"$.data.protoPayload.resourceName\") as resource_name\n"
  lucene: |
    message.data.protoPayload.methodName:*storage.buckets.create* AND NOT (message.data.protoPayload.authenticationInfo.principalEmail:*@gserviceaccount.com OR message.data.protoPayload.authenticationInfo.principalEmail:*admin*)
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _sourceCategory=*cloud*audit*
    | json field=_raw "protoPayload.methodName" as method_name
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as principal_email
    | where method_name = "storage.buckets.create"
    | where !(principal_email matches "*@*.gserviceaccount.com" OR principal_email matches "*admin*")
    | fields _messageTime, _sourceHost, method_name, principal_email
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains storage.buckets.create

  AND where the Source user is not a Admin or gserviceaccount'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000315
v4_id: '000315'
name: Unauthorized Bucket IAM Modification - GCP
description: This event captures the modification of a buckets IAM by a non-admin user, which could be indicative of an attacker establishing
  persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1530
technique_name: T1530
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=gcp sourcetype=gcp:cloudaudit protoPayload.methodName=\"storage.setIamPermissions\" \n| search NOT (protoPayload.authenticationInfo.principalEmail=\"\
    *@gserviceaccount.com\" OR protoPayload.authenticationInfo.principalEmail=\"*admin*\")\n| table _time, protoPayload.authenticationInfo.principalEmail,\
    \ protoPayload.resourceName, protoPayload.methodName, protoPayload.request.policy\n"
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName contains "storage.setIamPermissions"
    | extend SourceUser = tostring(AuthenticationInfo.principalEmail)
    | where SourceUser !endswith "gserviceaccount.com"
    | where SourceUser !has "admin"
    | project TimeGenerated, SourceUser, MethodName, ResourceName, ServiceName, RequestMetadata, AuthorizationInfo
  aql: |
    SELECT "protoPayload.authenticationInfo.principalEmail" AS source_user, "protoPayload.methodName" AS method, "protoPayload.resourceName" AS resource, sourceip, eventtime, LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE LOWER("protoPayload.methodName") LIKE '%storage.setiampermissions%'
      AND "protoPayload.authenticationInfo.principalEmail" NOT ILIKE '%@gserviceaccount.iam.gserviceaccount.com%'
      AND "protoPayload.authenticationInfo.principalEmail" NOT ILIKE '%admin%'
    LAST 24 HOURS
  yara_l: |
    rule gcp_storage_iam_permission_modification {
      meta:
        author = "TDL"
        description = "Detects non-admin users modifying GCP storage IAM permissions (T1530)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1530"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Google Cloud Platform"
        $e.metadata.product_name = "GCP"
        re.regex($e.metadata.product_log_id, `(?i)cloudaudit`)
        re.regex($e.target.resource.attribute.labels.value, `(?i)storage\.setIamPermissions`) or
        re.regex($e.about.labels.value, `(?i)storage\.setIamPermissions`)
        $e.principal.user.userid = $user
        not re.regex($e.principal.user.userid, `(?i)gserviceaccount\.com$`)
        not re.regex($e.principal.user.userid, `(?i)admin`)

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-gcp.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND message.data.protoPayload.methodName LIKE "*storage.setIamPermissions*"
      AND NOT (user.name LIKE "*@gserviceaccount.com" OR user.name LIKE "*admin*")
    | STATS event_count = COUNT(*) BY user.name, host.name, message.data.protoPayload.resourceName, bucket = BUCKET(@timestamp, 1 hour)
    | WHERE event_count >= 1
    | KEEP @timestamp, user.name, host.name, message.data.protoPayload.resourceName, message.data.protoPayload.methodName, event_count
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "storage.setIamPermissions" AND NOT (source_user ICONTAINS "admin" OR source_user ICONTAINS "gserviceaccount"))
  crowdstrike: |
    #type=gcp_audit message.data.protoPayload.methodName=*storage.setIamPermissions*
    | message.data.protoPayload.authenticationInfo.principalEmail != *@gserviceaccount.com AND message.data.protoPayload.authenticationInfo.principalEmail != *admin*
    | table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.resource.labels.bucket_name])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = GCP
    | filter json_extract_scalar(raw_log, "$.protoPayload.methodName") contains "storage.setIamPermissions"
    | alter source_user = coalesce(json_extract_scalar(raw_log, "$.protoPayload.authenticationInfo.principalEmail"), actor_effective_username)
    | filter source_user != null
    | filter not (source_user ~= ".*admin.*" or source_user contains "gserviceaccount")
    | fields _time, source_user, json_extract_scalar(raw_log, "$.protoPayload.methodName") as method_name, json_extract_scalar(raw_log, "$.protoPayload.resourceName") as resource_name, json_extract_scalar(raw_log, "$.protoPayload.request") as request_details
  lucene: |
    message.data.protoPayload.methodName:*storage.setIamPermissions* AND NOT (message.data.protoPayload.authenticationInfo.principalEmail:*@gserviceaccount.iam.gserviceaccount.com OR message.data.protoPayload.authenticationInfo.principalEmail:*admin*)
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _sourceCategory=*cloudaudit*
    | json field=_raw "protoPayload.methodName" as method_name
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as principal_email
    | where method_name matches "*storage.setIamPermissions*"
    | where !(principal_email matches "*@gserviceaccount.com" OR principal_email matches "*admin*")
    | fields _messageTime, principal_email, method_name, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains storage.setIamPermissions

  AND where the Source user is not a Admin or gserviceaccount'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

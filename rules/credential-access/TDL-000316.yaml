rule_id: TDL-CA-000316
v4_id: '000316'
name: Unauthorized Bucket ACL Modification - GCP
description: This event captures the modification of a buckets ACL by a non-admin user, which could be indicative of an attacker establishing
  persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1530
technique_name: T1530
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit methodName="storage.setIamPermissions" OR methodName="storage.buckets.setIamPolicy" OR methodName="storage.objects.setIamPolicy"

    | where match(methodName, "storage\.(setIamPermissions|buckets\.setIamPolicy|objects\.setIamPolicy)")

    | eval user=coalesce(''protoPayload.authenticationInfo.principalEmail'', user, ''authenticationInfo.principalEmail'')

    | where NOT match(user, "(?i)(admin|gserviceaccount)")

    | table _time, user, methodName, ''protoPayload.resourceName'', ''protoPayload.request.policy'', src_ip, project_id

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName contains "storage.setIamPermissions"
    | where PrincipalEmail !endswith "@gserviceaccount.iam.gserviceaccount.com"
    | where PrincipalEmail !has "admin"
    | project TimeGenerated, PrincipalEmail, MethodName, ResourceName, ServiceName, RequestMetadata, AuthenticationInfo
  aql: |
    SELECT sourceip, username, "protoPayload.methodName", "protoPayload.serviceName", "protoPayload.resourceName", eventtime
    FROM events
    WHERE "protoPayload.methodName" ILIKE '%storage.setaclPermissions%'
      AND username NOT ILIKE '%@gserviceaccount.com%'
      AND username NOT ILIKE '%admin%'
    LAST 24 HOURS
  yara_l: |
    rule gcp_storage_acl_modification_non_admin {
      meta:
        author = "Detection Engineer"
        description = "Detects GCP Storage ACL modifications by non-admin or non-service accounts - MITRE T1530"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1530"
        severity = "Medium"

      events:
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_WIPE" or
        $e.metadata.event_type = "USER_RESOURCE_ACCESS" or
        $e.metadata.product_event_type = "google.cloud.audit"
        re.regex($e.metadata.description, `storage\.setaclPermissions`) or
        re.regex($e.security_result.summary, `storage\.setaclPermissions`) or
        re.regex($e.target.resource.attribute.labels.value, `storage\.setaclPermissions`)
        $e.principal.user.userid = $user
        not re.regex($e.principal.user.userid, `(?i)gserviceaccount\.com$`)
        not re.regex($e.principal.user.userid, `(?i)admin`)

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND message.data.protoPayload.methodName LIKE \"*storage.setaclPermissions*\"\
    \n  AND user.name IS NOT NULL\n  AND NOT user.name LIKE \"*gserviceaccount.com\"\n  AND NOT user.name LIKE \"*admin*\"\n| STATS event_count\
    \ = COUNT(*) BY user.name, host.name, message.data.protoPayload.resourceName, message.data.protoPayload.methodName\n| KEEP @timestamp, user.name,\
    \ host.name, message.data.protoPayload.resourceName, message.data.protoPayload.methodName, event_count\n"
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "storage.setaclPermissions" AND NOT (source_user ICONTAINS "admin" OR source_user ICONTAINS "gserviceaccount"))
  crowdstrike: |
    #repo=gcp #type=cloudaudit message.data.protoPayload.methodName=*storage.setaclPermissions*
    | regex("(?<sourceUser>[^@]+@[^\\s]+)", field=message.data.protoPayload.authenticationInfo.principalEmail)
    | sourceUser!=*admin* AND sourceUser!=*gserviceaccount*
    | table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.protoPayload.request.bucket])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and operation_name contains "storage.setIamPermissions"
    | filter actor_user !~= ".*@.*\.gserviceaccount\.com$" and actor_user !~= ".*admin.*"
    | fields _time, actor_user, operation_name, resource_name, project_id, cloud_provider_event_name
  lucene: |
    message.data.protoPayload.methodName:*storage.setaclPermissions* AND NOT (message.data.protoPayload.authenticationInfo.principalEmail:*@admin.* OR message.data.protoPayload.authenticationInfo.principalEmail:*@gserviceaccount.*)
  sumo: |
    _sourceCategory=*GCP* *storage.setaclPermissions*
    | json field=_raw "message.data.protoPayload.methodName" as method_name
    | json field=_raw "message.data.protoPayload.authenticationInfo.principalEmail" as principal_email
    | where method_name matches "*storage.setaclPermissions*"
    | where !(principal_email matches "*gserviceaccount.com" or principal_email matches "*admin*")
    | fields _messageTime, _sourceHost, principal_email, method_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains storage.setaclPermissions

  AND where the Source user is not a Admin or gserviceaccount'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

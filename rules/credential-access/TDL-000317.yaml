rule_id: TDL-CA-000317
v4_id: '000317'
name: Unauthorized IAM Policy Change - GCP
description: Search for a change in GCP IAM from a user that is not on the Admin list.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1530
technique_name: T1530
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit methodName="*SetIamPolicy*"

    | search NOT (protoPayload.authenticationInfo.principalEmail="*@gserviceaccount.com" OR protoPayload.authenticationInfo.principalEmail="*admin*")

    | table _time, protoPayload.authenticationInfo.principalEmail, protoPayload.methodName, protoPayload.resourceName, protoPayload.serviceName,
    resource.labels.project_id

    '
  kql: |
    GCP_CloudAudit
    | where TimeGenerated > ago(1h)
    | where protoPayload_methodName contains "SetIamPolicy"
    | extend SourceUser = tostring(protoPayload_authenticationInfo_principalEmail)
    | where SourceUser !endswith "@gserviceaccount.iam.gserviceaccount.com"
    | where SourceUser !has "admin"
    | project TimeGenerated, SourceUser, protoPayload_methodName, protoPayload_resourceName, protoPayload_serviceName, protoPayload_request, CallerIpAddress = protoPayload_requestMetadata_callerIp
  aql: |
    SELECT username, sourceip, "message.data.protoPayload.methodName" AS method_name, "message.data.protoPayload.resourceName" AS resource_name, "message.data.protoPayload.serviceName" AS service_name, COUNT(*) AS event_count
    FROM events
    WHERE "message.data.protoPayload.methodName" ILIKE '%SetIamPolicy%'
      AND username NOT ILIKE '%@admin%'
      AND username NOT ILIKE '%gserviceaccount%'
    GROUP BY username, sourceip, "message.data.protoPayload.methodName", "message.data.protoPayload.resourceName", "message.data.protoPayload.serviceName"
    LAST 24 HOURS
  yara_l: "rule gcp_setiampolicy_non_admin {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects SetIamPolicy calls by\
    \ non-admin, non-service accounts in GCP\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1530\"\n    \n\
    \  events:\n    $e.metadata.product_name = \"GCP\"\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\n    re.regex($e.metadata.product_event_type,\
    \ `SetIamPolicy`)\n    not re.regex($e.principal.user.userid, `(?i)admin`)\n    not re.regex($e.principal.user.userid, `gserviceaccount\\\
    .com$`)\n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 24 hour \n  AND message.data.protoPayload.methodName LIKE \"*SetIamPolicy*\"\n  AND\
    \ NOT (message.data.protoPayload.authenticationInfo.principalEmail LIKE \"*gserviceaccount.com\" OR message.data.protoPayload.authenticationInfo.principalEmail\
    \ LIKE \"*admin*\")\n| STATS event_count = COUNT(*) BY message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.resourceName,\
    \ message.data.protoPayload.methodName, host.name\n| KEEP @timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.resourceName,\
    \ message.data.protoPayload.methodName, event_count\n"
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "SetIamPolicy" AND NOT (source_json.protoPayload.authenticationInfo.principalEmail ICONTAINS "gserviceaccount" OR source_json.protoPayload.authenticationInfo.principalEmail ICONTAINS "admin"))
  crowdstrike: |
    #type=gcp_audit event_simpleName=GcpAuditLog message.data.protoPayload.methodName=*SetIamPolicy*
    | regex("(?<sourceUser>[^@]+@[^@]+)", field=message.data.protoPayload.authenticationInfo.principalEmail)
    | sourceUser!=*gserviceaccount.com AND sourceUser!=*admin*
    | table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.resource.type])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP"
      and json_extract_scalar(message, "$.data.protoPayload.methodName") contains "SetIamPolicy"
      and json_extract_scalar(message, "$.data.protoPayload.authenticationInfo.principalEmail") != ""
      and json_extract_scalar(message, "$.data.protoPayload.authenticationInfo.principalEmail") !~= ".*@.*\\.gserviceaccount\\.com$"
      and json_extract_scalar(message, "$.data.protoPayload.authenticationInfo.principalEmail") !~= ".*admin.*"
    | fields _time, json_extract_scalar(message, "$.data.protoPayload.authenticationInfo.principalEmail") as principal_email, json_extract_scalar(message, "$.data.protoPayload.methodName") as method_name, json_extract_scalar(message, "$.data.protoPayload.resourceName") as resource_name, json_extract_scalar(message, "$.data.resource.labels.project_id") as project_id
  lucene: |
    message.data.protoPayload.methodName:*SetIamPolicy* AND NOT (message.data.protoPayload.authenticationInfo.principalEmail:*gserviceaccount.com OR message.data.protoPayload.authenticationInfo.principalEmail:*admin*)
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _sourceCategory=*audit*
    | json field=_raw "protoPayload.methodName" as method_name
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as principal_email
    | where method_name matches "*SetIamPolicy*"
    | where !(principal_email matches "*gserviceaccount.com" or principal_email matches "*admin*")
    | fields _messageTime, _sourceHost, method_name, principal_email
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains SetIamPolicy

  AND where the Source user is not a Admin or gserviceaccount'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

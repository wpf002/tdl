rule_id: TDL-CA-000318
v4_id: 000318
name: Logging Disabled - GCP
description: Identifies a modification to a Logging sink in Google Cloud Platform (GCP). An adversary may disable cloud logging capabilities and
  integration to limit what data is collected on their activities and avoid detection.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1562.008
technique_name: T1562.008
platform:
- GCP
data_sources:
- GCP
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit protoPayload.methodName="*UpdateSink*"

    | table _time, protoPayload.authenticationInfo.principalEmail, protoPayload.methodName, protoPayload.resourceName, protoPayload.serviceName,
    resource.labels.project_id

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName contains "UpdateSink"
    | project TimeGenerated, CallerIpAddress, PrincipalEmail, MethodName, ResourceName, RequestMetadata=todynamic(RequestMetadata), Response=todynamic(Response)
  aql: |
    SELECT eventtime, username, sourceip, "protoPayload.methodName", "protoPayload.resourceName", "protoPayload.serviceName", COUNT(*) AS event_count
    FROM events
    WHERE "protoPayload.methodName" ILIKE '%UpdateSink%'
    GROUP BY eventtime, username, sourceip, "protoPayload.methodName", "protoPayload.resourceName", "protoPayload.serviceName"
    LAST 24 HOURS
  yara_l: "rule gcp_logging_sink_modification {\n  meta:\n    author = \"TDL\"\n    description = \"Detects modification of GCP logging sinks\
    \ which may indicate attempt to impair defenses\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1562.008\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"GCP\"\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\
    \n    $e.metadata.product_event_type = \"google.logging.v2.ConfigServiceV2.UpdateSink\"\n    re.regex($e.metadata.description, `(?i)UpdateSink`)\n\
    \    $e.principal.user.userid = $user\n    $e.target.resource.name = $sink\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n\
    }\n"
  esql: |
    FROM logs-gcp.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND message.data.protoPayload.methodName LIKE "*UpdateSink*"
    | KEEP @timestamp, cloud.account.id, cloud.project.id, user.name, source.ip, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.protoPayload.request
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "UpdateSink")
  crowdstrike: |
    #type=gcp_audit message.data.protoPayload.methodName=*UpdateSink*
    | table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.resourceName, message.data.protoPayload.methodName, message.data.protoPayload.request])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = GCP and json_extract_scalar(raw_log, "$.protoPayload.methodName") ~= ".*UpdateSink.*"
    | fields _time, cloud_provider, json_extract_scalar(raw_log, "$.protoPayload.authenticationInfo.principalEmail") as principal_email, json_extract_scalar(raw_log, "$.protoPayload.methodName") as method_name, json_extract_scalar(raw_log, "$.protoPayload.resourceName") as resource_name, json_extract_scalar(raw_log, "$.protoPayload.serviceName") as service_name
  lucene: |
    message.data.protoPayload.methodName:*UpdateSink*
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _source=*gcp* OR _source=*GCP*
    | json field=_raw "protoPayload.methodName" as method_name
    | where method_name matches "*UpdateSink*"
    | fields _messageTime, _sourceHost, method_name, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains UpdateSink'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

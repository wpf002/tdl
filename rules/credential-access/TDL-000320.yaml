rule_id: TDL-CA-000320
v4_id: '000320'
name: Bucket Set to Public Access - GCP
description: Detects when a bucket has been set to public access allowing all users to view the content within.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=gcp sourcetype=gcp:cloudaudit protoPayload.methodName=*allUsers* \n| table _time, protoPayload.authenticationInfo.principalEmail,\
    \ protoPayload.resourceName, protoPayload.methodName, protoPayload.request\n"
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName has "allUsers"
    | project TimeGenerated, MethodName, CallerIP = CallerIpAddress, PrincipalEmail, ResourceName, ServiceName, RequestMetadata = RequestMetadataJson, AuthorizationInfo = AuthorizationInfoJson
  aql: "SELECT eventtime, sourceip, username, \"protoPayload.methodName\" AS method_name, \"protoPayload.resourceName\" AS resource_name, \"protoPayload.authorizationInfo\"\
    \ AS authorization_info\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) ILIKE '%gcp%'\n  AND (\"protoPayload.methodName\" ILIKE '%allUsers%'\
    \ \n       OR UTF8(payload) ILIKE '%allUsers%'\n       OR message ILIKE '%allUsers%')\nLAST 1 HOURS\n"
  yara_l: |
    rule gcp_public_resource_exposure {
      meta:
        author = "TDL"
        description = "Detects GCP resources exposed to allUsers indicating potential credential access via public exposure"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Google Cloud Platform"
        $e.metadata.product_name = "GCP"
        $e.metadata.log_type = "GCP_CLOUDAUDIT"
        re.regex($e.metadata.description, `(?i)allUsers`)
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-gcp.audit*
    | WHERE message.data.protoPayload.methodName LIKE "*allUsers*"
    | KEEP @timestamp, cloud.project.id, cloud.account.id, user.name, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, source.ip
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "allUsers")
  crowdstrike: |
    #repo=gcp_audit #type=json message.data.protoPayload.methodName=*allUsers*
    | table([@timestamp, message.data.protoPayload.methodName, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.resourceName, message.data.resource.type])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "GCP" and message.data.protoPayload.methodName contains "allUsers"
    | fields _time, message.data.resource.labels.project_id, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName, message.data.protoPayload.resourceName, message.data.protoPayload.request
  lucene: |
    message.data.protoPayload.methodName:*allUsers*
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _sourceCategory=*cloudaudit*
    | json field=_raw "protoPayload.methodName" as method_name nodrop
    | json field=_raw "message.data.protoPayload.methodName" as method_name_nested nodrop
    | where method_name matches "*allUsers*" OR method_name_nested matches "*allUsers*"
    | fields _messageTime, _sourceHost, method_name, method_name_nested, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains allUsers'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

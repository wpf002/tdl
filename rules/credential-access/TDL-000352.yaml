rule_id: TDL-CA-000352
v4_id: '000352'
name: AWS Brute Force Activity  - GuardDuty
description: Detects when brute force activity is detected within AWS instance sourcing from a remote source.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110
technique_name: Brute Force
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty (finding.type="Impact:EC2/WinRMBruteForce" OR finding.type="UnauthorizedAccess:EC2/RDPBruteForce"
    OR finding.type="UnauthorizedAccess:EC2/SSHBruteForce")

    | table _time, finding.type, finding.severity, resource.instanceDetails.instanceId, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4,
    finding.description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(tostring(parse_json(Resources)[0])).InstanceDetails.InstanceId), SourceIpAddress = tostring(parse_json(Service).Action.NetworkConnectionAction.RemoteIpDetails.IpAddressV4)
  aql: |
    SELECT sourceip, destinationip, qidname(qid) AS event_type, COUNT(*) AS event_count
    FROM events
    WHERE (qidname(qid) ILIKE '%Impact:EC2/WinRMBruteForce%' OR qidname(qid) ILIKE '%UnauthorizedAccess:EC2/RDPBruteForce%' OR qidname(qid) ILIKE '%UnauthorizedAccess:EC2/SSHBruteForce%')
      AND LOGSOURCETYPENAME(devicetype) ILIKE '%GuardDuty%'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_brute_force_attempts {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty brute force findings for WinRM, RDP, and SSH"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1110"
        severity = "High"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Impact:EC2/WinRMBruteForce" or
          $e.metadata.product_event_type = "UnauthorizedAccess:EC2/RDPBruteForce" or
          $e.metadata.product_event_type = "UnauthorizedAccess:EC2/SSHBruteForce"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.severity, source.ip, destination.ip, cloud.instance.id
  leql: |
    where(source_json.type IN ["Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce"])
  crowdstrike: |
    #repo=guardduty event.type IN ["Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce"]
    | table([@timestamp, event.type, event.id, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4, resource.instanceDetails.instanceId, resource.instanceDetails.instanceType])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and raw_log_content ~= "GuardDuty"
    | filter operation_name in ("Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce")
    | fields _time, cloud_provider, operation_name, resource_name, identity_name, raw_log_content
  lucene: |
    event.dataset:guardduty AND finding.type:("Impact:EC2/WinRMBruteForce" OR "UnauthorizedAccess:EC2/RDPBruteForce" OR "UnauthorizedAccess:EC2/SSHBruteForce")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("Impact:EC2/WinRMBruteForce", "UnauthorizedAccess:EC2/RDPBruteForce", "UnauthorizedAccess:EC2/SSHBruteForce")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Impact:EC2/WinRMBruteForce\", \"UnauthorizedAccess:EC2/RDPBruteForce\", \"UnauthorizedAccess:EC2/SSHBruteForce\"\
  ]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000385
v4_id: 000385
name: AWS Runtime Privileged Escalation Activity - GuardDuty
description: Detects when a privileged escalation runtime GuardDuty alert detects activity
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"PrivilegeEscalation:Runtime/ContainerMountsHostDirectory\" OR type=\"PrivilegeEscalation:Runtime/DockerSocketAccessed\"\
    \ OR type=\"PrivilegeEscalation:Runtime/RuncContainerEscape\" OR type=\"PrivilegeEscalation:Runtime/UserfaultfdUsage\" OR type=\"PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified\"\
    \ OR type=\"PrivilegeEscalation:Runtime/ElevationToRoot\")\n| table _time, type, severity, region, accountId, resource.instanceDetails.instanceId,\
    \ resource.kubernetesDetails.kubernetesWorkloadDetails.name, service.action.actionType, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("PrivilegeEscalation:Runtime/ContainerMountsHostDirectory", "PrivilegeEscalation:Runtime/DockerSocketAccessed", "PrivilegeEscalation:Runtime/RuncContainerEscape", "PrivilegeEscalation:Runtime/UserfaultfdUsage", "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified", "PrivilegeEscalation:Runtime/ElevationToRoot")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId, ServiceName
  aql: |
    SELECT eventtime, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, qidname(qid) AS event_name, "Event Type" AS event_type, "Resource Type", "Resource ID", "Account ID"
    FROM events
    WHERE LOGSOURCETYPE(logsourceid) ILIKE '%guardduty%'
      AND "Event Type" IN ('PrivilegeEscalation:Runtime/ContainerMountsHostDirectory', 'PrivilegeEscalation:Runtime/DockerSocketAccessed', 'PrivilegeEscalation:Runtime/RuncContainerEscape', 'PrivilegeEscalation:Runtime/UserfaultfdUsage', 'PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified', 'PrivilegeEscalation:Runtime/ElevationToRoot')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_privilege_escalation_runtime {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty privilege escalation runtime events indicating container escape or privilege escalation attempts"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/ContainerMountsHostDirectory" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/DockerSocketAccessed" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/RuncContainerEscape" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/UserfaultfdUsage" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/ElevationToRoot"
        )
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      outcome:
        $risk_score = max(75)

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("PrivilegeEscalation:Runtime/ContainerMountsHostDirectory", "PrivilegeEscalation:Runtime/DockerSocketAccessed", "PrivilegeEscalation:Runtime/RuncContainerEscape", "PrivilegeEscalation:Runtime/UserfaultfdUsage", "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified", "PrivilegeEscalation:Runtime/ElevationToRoot")
    | KEEP @timestamp, host.name, cloud.account.id, cloud.region, event.type, event.action, event.severity, aws.guardduty.resource.instance_details.instance_id, user.name, source.ip
  leql: |
    where(source_json.type IN ["PrivilegeEscalation:Runtime/ContainerMountsHostDirectory", "PrivilegeEscalation:Runtime/DockerSocketAccessed", "PrivilegeEscalation:Runtime/RuncContainerEscape", "PrivilegeEscalation:Runtime/UserfaultfdUsage", "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified", "PrivilegeEscalation:Runtime/ElevationToRoot"])
  crowdstrike: "#type=guardduty \n| event_type in [\"PrivilegeEscalation:Runtime/ContainerMountsHostDirectory\", \"PrivilegeEscalation:Runtime/DockerSocketAccessed\"\
    , \"PrivilegeEscalation:Runtime/RuncContainerEscape\", \"PrivilegeEscalation:Runtime/UserfaultfdUsage\", \"PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified\"\
    , \"PrivilegeEscalation:Runtime/ElevationToRoot\"]\n| table([@timestamp, event_type, accountId, region, resource.instanceDetails.instanceId,\
    \ service.action.actionType, severity, title, description])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and log_name = "GuardDuty"
    | filter event_type in ("PrivilegeEscalation:Runtime/ContainerMountsHostDirectory", "PrivilegeEscalation:Runtime/DockerSocketAccessed", "PrivilegeEscalation:Runtime/RuncContainerEscape", "PrivilegeEscalation:Runtime/UserfaultfdUsage", "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified", "PrivilegeEscalation:Runtime/ElevationToRoot")
    | fields _time, event_type, resource_name, resource_sub_type, cloud_provider_account_id, identity_name, raw_log
  lucene: |
    event_type:("PrivilegeEscalation:Runtime/ContainerMountsHostDirectory" OR "PrivilegeEscalation:Runtime/DockerSocketAccessed" OR "PrivilegeEscalation:Runtime/RuncContainerEscape" OR "PrivilegeEscalation:Runtime/UserfaultfdUsage" OR "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified" OR "PrivilegeEscalation:Runtime/ElevationToRoot")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("PrivilegeEscalation:Runtime/ContainerMountsHostDirectory", "PrivilegeEscalation:Runtime/DockerSocketAccessed", "PrivilegeEscalation:Runtime/RuncContainerEscape", "PrivilegeEscalation:Runtime/UserfaultfdUsage", "PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified", "PrivilegeEscalation:Runtime/ElevationToRoot")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"PrivilegeEscalation:Runtime/ContainerMountsHostDirectory\", \"PrivilegeEscalation:Runtime/DockerSocketAccessed\"\
  , \"PrivilegeEscalation:Runtime/RuncContainerEscape\", \"PrivilegeEscalation:Runtime/UserfaultfdUsage\", \"PrivilegeEscalation:Runtime/CGroupsReleaseAgentModified\"\
  , \"PrivilegeEscalation:Runtime/ElevationToRoot\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

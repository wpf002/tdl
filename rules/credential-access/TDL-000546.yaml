rule_id: TDL-CA-000546
v4_id: '000546'
name: Single SIgn-on Disbaled
description: Detects when ODIC/SAML/SSO has been disabled
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github (action="business.disable_saml" OR action="org.disable_saml" OR action="business.disable_oidc")

    | table _time, actor, action, org, repo, user_agent

    '
  kql: |
    GitHubAuditLogPolling
    | where TimeGenerated > ago(1h)
    | where Action in ("business.disable_saml", "org.disable_saml", "business.disable_oidc")
    | project TimeGenerated, Action, Actor, Org, Repository, IPaddress, Country, OperationType, ActorLocation
  aql: |
    SELECT eventtime, username, sourceip, "action", LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%'
      AND ("action" = 'business.disable_saml' OR "action" = 'org.disable_saml' OR "action" = 'business.disable_oidc')
    LAST 24 HOURS
  yara_l: "rule github_saml_oidc_disabled {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects disabling of SAML or OIDC\
    \ authentication in GitHub\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\
    \n    \n  events:\n    $e.metadata.vendor_name = \"GITHUB\"\n    (\n      $e.metadata.product_event_type = \"business.disable_saml\" or\n\
    \      $e.metadata.product_event_type = \"org.disable_saml\" or\n      $e.metadata.product_event_type = \"business.disable_oidc\"\n    )\n\
    \    $e.principal.user.userid = $user\n    \n  match:\n    $user over 1h\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-github*
    | WHERE event.action IN ("business.disable_saml", "org.disable_saml", "business.disable_oidc")
    | KEEP @timestamp, event.action, user.name, organization.name, source.ip, event.id
  leql: |
    where(source_json.action IN ["business.disable_saml", "org.disable_saml", "business.disable_oidc"])
  crowdstrike: |
    #repo=github action IN [business.disable_saml, org.disable_saml, business.disable_oidc]
    | table([@timestamp, actor, action, org, repo, user])
  xql: |
    dataset = github_audit_log_raw
    | filter action in ("business.disable_saml", "org.disable_saml", "business.disable_oidc")
    | fields _time, action, actor, org, repository, repo
  lucene: |
    action:(business.disable_saml OR org.disable_saml OR business.disable_oidc)
  sumo: |
    _sourceCategory=*Github* (business.disable_saml OR org.disable_saml OR buisness.disable_oidc)
    | json field=_raw "action" as action
    | where action in ("business.disable_saml", "org.disable_saml", "buisness.disable_oidc")
    | fields _messageTime, _sourceHost, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions IN (business.disable_saml, org.disable_saml, buisness.disable_oidc)"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000559
v4_id: 000559
name: Anonymous Access Detected
description: Detects when a user is authenticating to API without credentials
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:apiserver-audit user.username="system:anonymous" user.groups{}="system:unauthenticated" responseStatus.code=200

    | table _time, user.username, user.groups{}, responseStatus.code, verb, objectRef.resource, objectRef.namespace, sourceIPs{}

    '
  kql: |
    KubeEvents
    | where TimeGenerated > ago(24h)
    | where UserName == "system:anonymous"
    | where Groups has "system:unauthenticated"
    | where ResponseCode == 200
    | project TimeGenerated, ClusterName, Namespace, UserName, Groups, Verb, ObjectRef, ResponseCode, SourceIPs
  aql: |
    SELECT username, "Group", "Response Code", sourceip, eventtime, COUNT(*) AS event_count
    FROM events
    WHERE username = 'system:anonymous'
      AND "Group" = 'system:unauthenticated'
      AND "Response Code" = '200'
    GROUP BY username, "Group", "Response Code", sourceip, eventtime
    LAST 24 HOURS
  yara_l: |
    rule anonymous_kubernetes_access {
      meta:
        author = "TDL"
        description = "Detects successful anonymous access to Kubernetes API (T1078)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $k.metadata.product_name = "Kubernetes"
        $k.target.user.userid = "system:anonymous"
        $k.target.user.group_identifiers = "system:unauthenticated"
        $k.security_result.action_details = "200"
        $k.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $k
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE kubernetes.audit.user.username == \"system:anonymous\" \n  AND kubernetes.audit.user.groups == \"\
    system:unauthenticated\"\n  AND event.outcome == \"success\"\n| KEEP @timestamp, host.name, kubernetes.audit.user.username, kubernetes.audit.user.groups,\
    \ kubernetes.audit.requestURI, kubernetes.audit.verb, kubernetes.audit.objectRef.resource, source.ip\n"
  leql: |
    where(source_json.user.username="system:anonymous" AND source_json.user.groups CONTAINS "system:unauthenticated" AND source_json.responseStatus.code=200)
  crowdstrike: |
    #type=kubernetes event.username="system:anonymous" event.group="system:unauthenticated" event.responseCode=200
    | table([@timestamp, event.username, event.group, event.responseCode, event.verb, event.objectRef.resource, event.sourceIPs])
  xql: "dataset = k8s_audit_raw\n| filter to_string(k8s_user_username) = \"system:anonymous\" \n  and arrayindex(regextract(to_string(k8s_user_groups),\
    \ \"\\\"([^\\\"]+)\\\"\"), 0) = \"system:unauthenticated\"\n  and k8s_response_code = 200\n| fields _time, k8s_cluster_name, k8s_user_username,\
    \ k8s_user_groups, k8s_response_code, k8s_verb, k8s_objectref_resource, k8s_objectref_name, k8s_source_ips\n"
  lucene: |
    event.dataset:kubernetes.audit AND user.name:"system:anonymous" AND group.name:"system:unauthenticated" AND http.response.status_code:200
  sumo: "_sourceCategory=*Kubernetes* \n| json field=_raw \"user.username\" as username\n| json field=_raw \"user.groups\" as groups\n| json field=_raw\
    \ \"responseStatus.code\" as response_code\n| where username = \"system:anonymous\" \n| where groups matches \"*system:unauthenticated*\"\n\
    | where response_code = \"200\"\n| fields _messageTime, _sourceHost, username, groups, response_code\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Username is \"system:anonymous\"\nWhere the Group is \"system:unauthenticated\"\nWhere the Response\
  \ Code is 200"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000561
v4_id: '000561'
name: Kubernetes Secrets Created
description: Detects a secret being created within a kubernetes instance. Sometimes secret creation is part of a normal buisness procedure so
  by itself it may not be a threat. However, it can be great context in conjunction to other alerts
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes eventtype=kubernetes_audit verb=create objectRef.resource=secrets responseStatus.code=200

    | table _time, user.username, objectRef.namespace, objectRef.name, sourceIPs{}, userAgent, verb, objectRef.resource, responseStatus.code

    '
  kql: |
    KubernetesEvent
    | where TimeGenerated > ago(24h)
    | where Verb =~ "create"
    | where ObjectRef has "secrets"
    | where ResponseCode == 200
    | project TimeGenerated, Verb, ObjectRef, ResponseCode, User, SourceIPs, UserAgent, Namespace, RequestURI
  aql: |
    SELECT eventtime, username, sourceip, QIDNAME(qid), "Verb", "Resource", "Response Code"
    FROM events
    WHERE "Verb" = 'create'
      AND "Resource" = 'secrets'
      AND "Response Code" = '200'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_secret_creation {
      meta:
        author = "TDL"
        description = "Detects creation of Kubernetes secrets - T1552 Credential Access"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1552"
        severity = "Medium"

      events:
        $k.metadata.event_type = "RESOURCE_CREATION"
        $k.target.resource.attribute.labels["verb"] = "create"
        $k.target.resource.type = "secrets"
        $k.security_result.action = "ALLOW"
        re.regex($k.metadata.description, `200`)
        $k.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $k
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 1 hour
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.objectRef.resource == "secrets"
      AND kubernetes.audit.responseStatus.code == 200
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.userAgent
  leql: |
    where(source_json.verb="create" AND source_json.objectRef.resource="secrets" AND source_json.responseStatus.code=200)
  crowdstrike: |
    #repo=kubernetes event_simpleName=KubernetesApiAuditLog verb=create objectRef.resource=secrets responseStatus.code=200
    | table([@timestamp, user.username, sourceIPs, objectRef.namespace, objectRef.name, responseStatus.code])
  xql: |
    dataset = k8s_audit_logs
    | filter verb = "create" and objectRef.resource = "secrets" and responseStatus.code = 200
    | fields _time, user.username, sourceIPs, objectRef.namespace, objectRef.name, verb, objectRef.resource, responseStatus.code
  lucene: |
    verb:"create" AND resource:"secrets" AND responseCode:200
  sumo: |
    _sourceCategory=*kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "responseStatus.code" as response_code
    | where verb = "create" and resource = "secrets" and response_code = "200"
    | fields _messageTime, verb, resource, response_code, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"create\"\nWhere Resource is \"secrets\"\nWhere the Response Code is 200"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000562
v4_id: '000562'
name: Kubernetes Secrets Deleted
description: Detects a secret being deleted within a kubernetes instance. Sometimes secret deletion is part of a normal buisness procedure so
  by itself it may not be a threat. However, it can be great context in conjunction to other alerts
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:audit verb=delete objectRef.resource=secrets responseStatus.code=200

    | table _time, user.username, objectRef.namespace, objectRef.name, sourceIPs{}, userAgent, responseStatus.code

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where Verb =~ "delete"
    | where ObjectRef has "secrets"
    | where ResponseCode == 200
    | project TimeGenerated, Verb, ObjectRef, ResponseCode, User, SourceIPs, Namespace, RequestURI, UserAgent
  aql: |
    SELECT eventtime, username, sourceip, "Verb", "Resource", "ResponseCode", LOGSOURCENAME(logsourceid) AS k8s_cluster
    FROM events
    WHERE "Verb" = 'delete'
      AND "Resource" = 'secrets'
      AND "ResponseCode" = '200'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_secret_deletion {
      meta:
        author = "TDL"
        description = "Detects deletion of Kubernetes secrets (T1552 - Credential Access)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1552"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.metadata.event_type = "RESOURCE_DELETION"
        $e.security_result.action = "ALLOW"
        $e.target.resource.type = "secrets"
        $e.network.http.response_code = 200
        re.regex($e.target.resource.attribute.labels.value, `(?i)delete`)
        $e.principal.user.userid = $user
        $e.target.resource.name = $secret

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND kubernetes.audit.verb == "delete"
      AND kubernetes.audit.objectRef.resource == "secrets"
      AND kubernetes.audit.responseStatus.code == 200
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.verb, kubernetes.audit.responseStatus.code
  leql: |
    where(source_json.verb="delete" AND source_json.objectRef.resource="secrets" AND source_json.responseStatus.code=200)
  crowdstrike: |
    #type=kubernetes verb=delete resource=secrets responseCode=200
    | table([@timestamp, user.username, objectRef.namespace, objectRef.name, sourceIPs, userAgent, responseCode])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and json_extract_scalar(raw_log, "$.verb") = "delete" and json_extract_scalar(raw_log, "$.objectRef.resource") = "secrets" and json_extract_scalar(raw_log, "$.responseStatus.code") = "200"
    | fields _time, json_extract_scalar(raw_log, "$.user.username") as user, json_extract_scalar(raw_log, "$.objectRef.namespace") as namespace, json_extract_scalar(raw_log, "$.objectRef.name") as secret_name, json_extract_scalar(raw_log, "$.sourceIPs") as source_ip
  lucene: |
    kubernetes.verb:"delete" AND kubernetes.resource:"secrets" AND kubernetes.responseStatus.code:200
  sumo: |
    _sourceCategory=*Kubernetes* "delete" "secrets" "200"
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "responseStatus.code" as response_code
    | where verb = "delete" and resource = "secrets" and response_code = "200"
    | fields _messageTime, _sourceHost, verb, resource, response_code
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"delete\"\nWhere Resource is \"secrets\"\nWhere the Response Code is 200"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000568
v4_id: 000568
name: First Seen Kubernetes Secrets Successsfully Listed from IP Address
description: Detects a source IP listing secrets for the first time in the last 90 days. This could be a sign of a threat actor tryin to enumerate
  through the secrets in a namespace to establish persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:apiserver verb=list objectRef.resource=secrets responseStatus.code=2*

    | bin _time span=24h

    | stats earliest(_time) as first_seen latest(_time) as last_seen by sourceIPs{}

    | where (now() - first_seen) < 2592000 AND (now() - last_seen) < 7776000 AND first_seen >= relative_time(now(), "-30d")

    | eval is_new=if(first_seen >= relative_time(now(), "-30d"), 1, 0)

    | where is_new=1

    | table _time, sourceIPs{}, first_seen, last_seen

    '
  kql: "let baseline_period = 90d;\nlet learning_period = 30d;\nlet detection_period = 1h;\nlet historical_ips = \n    KubeEvents\n    | where\
    \ TimeGenerated between (ago(baseline_period) .. ago(learning_period))\n    | where Verb =~ \"list\"\n    | where Resource =~ \"secrets\"\n\
    \    | where ResponseCode matches regex \"^2.*\"\n    | distinct SourceIP;\nKubeEvents\n| where TimeGenerated > ago(detection_period)\n| where\
    \ Verb =~ \"list\"\n| where Resource =~ \"secrets\"\n| where ResponseCode matches regex \"^2.*\"\n| where SourceIP !in (historical_ips)\n\
    | project TimeGenerated, SourceIP, Verb, Resource, ResponseCode, User, Namespace, ObjectRef, RequestURI\n"
  aql: |
    SELECT sourceip, COUNT(*) AS secret_list_attempts, FIRST(eventtime) AS first_seen
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%kubernetes%'
      AND "Verb" = 'list'
      AND "Resource" = 'secrets'
      AND "Response Code" MATCHES '2.*'
      AND sourceip NOT IN (
        SELECT sourceip
        FROM events
        WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%kubernetes%'
          AND "Verb" = 'list'
          AND "Resource" = 'secrets'
          AND "Response Code" MATCHES '2.*'
          AND eventtime BETWEEN (LAST 90 DAYS AND LAST 30 DAYS)
      )
    GROUP BY sourceip
    LAST 90 DAYS
  yara_l: "rule kubernetes_secret_enumeration_new_source_ip {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Kubernetes\
    \ secret enumeration from new source IP addresses - MITRE T1552\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1552\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"RESOURCE_READ\"\n    $e.metadata.product_name =\
    \ \"Kubernetes\"\n    $e.target.resource.name = \"secrets\"\n    $e.security_result.action = \"ALLOW\"\n    re.regex($e.security_result.detection_fields[\"\
    verb\"], `list`)\n    re.regex($e.security_result.summary, `2\\d{2}`)\n    $e.principal.ip = $source_ip\n    \n  match:\n    $source_ip over\
    \ 1h\n    \n  outcome:\n    $risk_score = 50\n    $first_seen_time = min($e.metadata.event_timestamp.seconds)\n    \n  condition:\n    $e\
    \ and #source_ip == 1\n}\n"
  esql: |
    FROM logs-kubernetes.audit-*
    | WHERE @timestamp > NOW() - 90 days
      AND kubernetes.audit.verb == "list"
      AND kubernetes.audit.objectRef.resource == "secrets"
      AND kubernetes.audit.responseStatus.code RLIKE "2.*"
    | EVAL baseline_start = NOW() - 90 days
    | EVAL baseline_end = NOW() - 30 days
    | EVAL is_baseline = CASE(@timestamp >= baseline_start AND @timestamp < baseline_end, 1, 0)
    | EVAL is_recent = CASE(@timestamp >= baseline_end, 1, 0)
    | STATS baseline_ips = COUNT_DISTINCT(source.ip) WHERE is_baseline == 1 BY source.ip,
            recent_count = COUNT(*) WHERE is_recent == 1 BY source.ip
    | WHERE recent_count > 0 AND baseline_ips == 0
    | KEEP source.ip, recent_count
  leql: |
    where(source_json.verb="list" AND source_json.objectRef.resource="secrets" AND source_json.responseStatus.code=/^2.*/) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=k8s* verb=list objectRef.resource=secrets responseStatus.code=/^2.*/
    | groupBy([sourceIPs], function=count(as=eventCount))
    | selfJoinFilter(field=[sourceIPs], where=[{eventCount=0}], window=30d, prefilter=true)
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and operation_name_orig = "list" and resource_type = "secrets" and http_status_code ~= "2.*"
    | alter baseline_end = timestamp_diff(_time, current_time(), "DAY")
    | filter baseline_end <= 90
    | comp count_distinct(_time) as days_seen by source_ip
    | alter first_seen_day = baseline_end
    | filter first_seen_day <= 30 and days_seen = 1
    | fields _time, source_ip, user_name, resource_type, operation_name_orig, http_status_code
  lucene: |
    verb:"list" AND resource:"secrets" AND responseCode:/2.*/
  sumo: |
    _sourceCategory=*kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "responseStatus.code" as response_code
    | json field=_raw "sourceIPs[0]" as source_ip
    | where verb = "list" and resource = "secrets" and response_code matches "2.*"
    | fields _messageTime, source_ip, verb, resource, response_code
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"list\"\nWhere Resource is \"secrets\"\nWhere the Response Code matches \"2.*\"\n\nBaseline\
  \ Learning: 30 Days\nRetention: 90 Days\n\nNew Value: Source IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

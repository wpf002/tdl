rule_id: TDL-CA-000577
v4_id: '000577'
name: Kubernetes Service Account Token File Accessed
description: Detects access to the Kubernetes service account access token that is stored within a container in a cluster.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1528
technique_name: Steal Application Access Token
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:events object.kind="Event" objectRef.resource="serviceaccounts" objectRef.subResource="token" verb IN
    ("get", "list")

    | table _time, user.username, objectRef.namespace, objectRef.name, verb, sourceIPs{}, userAgent

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where ObjectKind =~ "serviceaccounts"
    | where ObjectSubresource =~ "token"
    | where Verb in~ ("get", "list")
    | project TimeGenerated, Namespace, ObjectName, ObjectKind, ObjectSubresource, Verb, User, SourceIPs, UserAgent, ResponseStatus
  aql: |
    SELECT eventtime, username, sourceip, "Resource", "Subresource", "Verb", LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE "Resource" = 'serviceaccounts'
      AND "Subresource" = 'token'
      AND "Verb" IN ('get', 'list')
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_serviceaccount_token_access {
      meta:
        author = "Detection Engineering"
        description = "Detects access to Kubernetes service account tokens via API (T1528)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1528"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.metadata.event_type = "RESOURCE_READ"
        $e.target.resource.name = "serviceaccounts"
        $e.target.resource.attribute.labels.value = "token"
        (
          $e.security_result.action = "get" or
          $e.security_result.action = "list"
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND kubernetes.audit.objectRef.resource == "serviceaccounts"
      AND kubernetes.audit.objectRef.subresource == "token"
      AND kubernetes.audit.verb IN ("get", "list")
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.verb, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.userAgent
  leql: |
    where(source_json.objectRef.resource="serviceaccounts" AND source_json.objectRef.subresource="token" AND source_json.verb IN ["get", "list"])
  crowdstrike: |
    #type=kubernetes event.resource="serviceaccounts" event.subresource="token" (event.verb="get" OR event.verb="list")
    | table([@timestamp, event.verb, event.resource, event.subresource, event.user.username, event.sourceIPs, event.objectRef.name, event.objectRef.namespace])
  xql: |
    dataset = cloud_audit_logs
    | filter json_extract_scalar(resource, "$.type") = "serviceaccounts"
      and json_extract_scalar(request, "$.subresource") = "token"
      and json_extract_scalar(request, "$.verb") in ("get", "list")
    | fields _time, actor_user, resource, request
  lucene: |
    resource:"serviceaccounts" AND subresource:"token" AND verb:("get" OR "list")
  sumo: |
    _sourceCategory=*Kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "objectRef.subresource" as subresource
    | json field=_raw "verb" as verb
    | where resource = "serviceaccounts"
    | where subresource = "token"
    | where verb in ("get", "list")
    | fields _messageTime, _sourceHost, resource, subresource, verb
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Resource is \"serviceaccounts\"\nWhere Subresource is \"token\"\nWhere Verb is IN (\"get\", \"list\"\
  )"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

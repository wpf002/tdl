rule_id: TDL-CA-000579
v4_id: 000579
name: Kubernetes User Attached to a Pod
description: Detect when a user attaches to a pod. A user should not need to attach to a pod. Attaching to a pod allows a user to attach to any
  process in a running container which may give an attacker access to sensitive data.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:events resource.kind="pods" verb="attach"

    | table _time, user.username, resource.namespace, resource.name, sourceIPs{}, userAgent

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(24h)
    | where ObjectKind =~ "Pod"
    | where Verb =~ "attach"
    | project TimeGenerated, Namespace, ObjectName, Verb, UserName = User, SourceIPs, UserAgent, ResponseStatus
  aql: |
    SELECT eventtime, username, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS host, "Kubernetes Resource" AS resource, "Kubernetes Verb" AS verb, "Kubernetes Namespace" AS namespace, "Pod Name" AS pod_name
    FROM events
    WHERE "Kubernetes Resource" = 'pods' AND "Kubernetes Verb" = 'attach'
    LAST 24 HOURS
  yara_l: "rule kubernetes_pod_attach_credential_access {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects kubectl attach\
    \ commands to pods which may indicate credential access attempts\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1552\"\n    severity = \"Medium\"\n\n  events:\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_WIPE\" or \n    $e.metadata.event_type\
    \ = \"GENERIC_EVENT\"\n    $e.metadata.product_name = \"Kubernetes\"\n    $e.target.resource.name = \"pods\"\n    $e.target.resource.attribute.labels[\"\
    verb\"] = \"attach\" or\n    $e.metadata.description = \"attach\"\n    $e.principal.user.userid = $user\n    $e.target.resource.name = $resource\n\
    \n  match:\n    $user over 5m\n\n  condition:\n    $e\n}\n"
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND kubernetes.audit.objectRef.resource == \"pods\" \n  AND kubernetes.audit.verb\
    \ == \"attach\"\n| KEEP @timestamp, host.name, user.name, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name,\
    \ kubernetes.audit.sourceIPs, kubernetes.audit.verb, kubernetes.audit.objectRef.resource\n"
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="attach")
  crowdstrike: |
    #type=kubernetes event.action=attach event.resource=pods
    | table([@timestamp, user.name, event.resource, event.action, kubernetes.namespace, kubernetes.pod.name])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and raw_log.resource.type = "k8s_cluster"
    | filter raw_log.protoPayload.resourceName contains "/pods/" and raw_log.protoPayload.methodName contains "attach"
    | fields _time, raw_log.protoPayload.authenticationInfo.principalEmail, raw_log.resource.labels.cluster_name, raw_log.protoPayload.resourceName, raw_log.protoPayload.methodName, raw_log.protoPayload.request.namespace
  lucene: |
    kubernetes.audit.objectRef.resource:pods AND kubernetes.audit.verb:attach
  sumo: |
    _sourceCategory=*kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | where resource = "pods" and verb = "attach"
    | fields _messageTime, _sourceHost, resource, verb
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Resource is \"pods\"\nWhere Verb is \"attach\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

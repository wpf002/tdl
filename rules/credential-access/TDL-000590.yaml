rule_id: TDL-CA-000590
v4_id: 000590
name: Golden Ticket Activity
description: Detects when a source generates a ticket granting service (TGS) event without a ticket granting ticket (TGT) event, which means a
  Golden Ticket may be used within the environment. Adversaries who have the KRBTGT account password hash may forge Kerberos ticket-granting tickets
  (TGT), also known as a golden ticket. Using a golden ticket, adversaries are then able to request ticket granting service (TGS) tickets, which
  enable access to specific resources. Golden tickets require adversaries to interact with the Key Distribution Center (KDC) in order to obtain
  TGS.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1558
technique_name: Steal or Forge Kerberos Tickets
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4768, 4769'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=4769 OR EventCode=4768)

    | eval is_machine_account=if(like(src_user, "%$"), 1, 0)

    | search EventCode=4769 is_machine_account=0 NOT Service_Name="*$" NOT Service_Name="krbtgt"

    | bin _time span=10h

    | stats dc(Service_Name) as unique_services, values(Service_Name) as service_list, max(_time) as last_time, min(_time) as first_time by _time,
    src_ip, src_user

    | where unique_services >= 5

    | eval search_start=first_time, search_end=last_time

    | map maxsearches=10000 search="search index=wineventlog sourcetype=WinEventLog:Security EventCode=4768 src_ip=\"$src_ip$\" src_user=\"$src_user$\"
    earliest=$search_start$ latest=$search_end$ | stats count | eval found_4768=if(count>0,1,0) | eval src_ip=\"$src_ip$\", src_user=\"$src_user$\",
    unique_services=$unique_services$, service_list=\"$service_list$\", first_time=$first_time$, last_time=$last_time$"

    | where found_4768=0

    | table first_time, last_time, src_ip, src_user, unique_services, service_list

    '
  kql: "let timeframe = 10h;\nlet threshold = 5;\nlet tickets = SecurityEvent\n| where TimeGenerated > ago(timeframe)\n| where EventID == 4769\n\
    | where IpAddress != \"-\"\n| extend SrcUser = iff(isnotempty(TargetUserName), TargetUserName, Account)\n| where SrcUser !endswith \"$\"\n\
    | where ServiceName !endswith \"$\"\n| where ServiceName != \"krbtgt\"\n| summarize \n    UniqueServices = dcount(ServiceName),\n    Services\
    \ = make_set(ServiceName),\n    FirstSeen = min(TimeGenerated),\n    LastSeen = max(TimeGenerated),\n    Computers = make_set(Computer)\n\
    \    by IpAddress, SrcUser\n| where UniqueServices >= threshold;\nlet tgt_requests = SecurityEvent\n| where TimeGenerated > ago(timeframe)\n\
    | where EventID == 4768\n| extend SrcUser = iff(isnotempty(TargetUserName), TargetUserName, Account)\n| summarize by IpAddress, SrcUser;\n\
    tickets\n| join kind=leftanti tgt_requests on IpAddress, SrcUser\n| project FirstSeen, LastSeen, IpAddress, SrcUser, UniqueServices, Services,\
    \ Computers\n"
  aql: "SELECT sourceip, username, UNIQUECOUNT(\"Service Name\") AS unique_services, COUNT(*) AS event_count\nFROM events\nWHERE \"EventID\" =\
    \ '4769'\n  AND username NOT LIKE '%$'\n  AND \"Service Name\" NOT LIKE '%$'\n  AND \"Service Name\" != 'krbtgt'\n  AND sourceip NOT IN (\n\
    \    SELECT sourceip FROM events \n    WHERE \"EventID\" = '4768' \n      AND username = OUTERUSERNAME \n    LAST 10 HOURS\n  )\nGROUP BY\
    \ sourceip, username\nHAVING unique_services >= 5\nLAST 10 HOURS\n"
  yara_l: |
    rule kerberoast_attack_detection {
      meta:
        author = "TDL"
        description = "Detects potential Kerberoasting by identifying TGS requests without TGT requests"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1558"
        severity = "High"

      events:
        $tgs.metadata.event_type = "USER_LOGIN"
        $tgs.metadata.product_event_type = "4769"
        not re.regex($tgs.principal.user.userid, `\$$`)
        not re.regex($tgs.target.resource.name, `\$$`)
        $tgs.target.resource.name != "krbtgt"
        $tgs.principal.ip = $src_ip
        $tgs.principal.user.userid = $src_user
        $tgs.target.resource.name = $service_name

        $tgt.metadata.event_type = "USER_LOGIN"
        $tgt.metadata.product_event_type = "4768"
        $tgt.principal.ip = $src_ip
        $tgt.principal.user.userid = $src_user

      match:
        $src_ip, $src_user over 10h

      outcome:
        $risk_score = 85

      condition:
        #tgs >= 5 and #service_name >= 5 and #tgt == 0
    }
  esql: "FROM logs-system.security*\n| WHERE @timestamp > NOW() - 10 hours \n  AND event.code == \"4769\"\n  AND NOT ENDS_WITH(winlog.event_data.TargetUserName,\
    \ \"$\")\n  AND NOT ENDS_WITH(winlog.event_data.ServiceName, \"$\")\n  AND winlog.event_data.ServiceName != \"krbtgt\"\n| STATS service_count\
    \ = COUNT_DISTINCT(winlog.event_data.ServiceName), \n        first_seen = MIN(@timestamp),\n        last_seen = MAX(@timestamp)\n  BY source.ip,\
    \ winlog.event_data.TargetUserName\n| WHERE service_count >= 5\n| EVAL time_window = last_seen - first_seen\n| WHERE time_window <= 10 hours\n\
    | LOOKUP (\n    FROM logs-system.security*\n    | WHERE @timestamp > NOW() - 10 hours AND event.code == \"4768\"\n    | STATS has_4768 = COUNT(*)\
    \ BY source.ip, winlog.event_data.TargetUserName\n  ) ON source.ip, winlog.event_data.TargetUserName\n| WHERE has_4768 IS NULL OR has_4768\
    \ == 0\n| KEEP source.ip, winlog.event_data.TargetUserName, service_count, first_seen, last_seen\n"
  leql: |
    where(source_json.EventID=4769 AND NOT(source_user=/.*\$/) AND NOT(source_json.ServiceName ENDS-WITH "$") AND source_json.ServiceName!=krbtgt) groupby(source_address, source_user) calculate(unique:source_json.ServiceName)
  crowdstrike: |
    EventCode=4769
    | SourceUserName != "*$"
    | ServiceName != "*$"
    | ServiceName != "krbtgt"
    | groupBy([IpAddress, SourceUserName], function=[count(ServiceName, distinct=true, as=uniqueServices), collect([ServiceName, @timestamp, ComputerName])])
    | uniqueServices >= 5
    | join({EventCode=4768 | groupBy([IpAddress, SourceUserName], function=count(as=ticket_requests))}, field=[IpAddress, SourceUserName], include=[ticket_requests], mode=left)
    | ticket_requests = 0 OR isNull(ticket_requests)
    | table([IpAddress, SourceUserName, uniqueServices, ComputerName, ServiceName, @timestamp])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (4768, 4769)\n| alter src_user = action_evtlog_event_data_TargetUserName,\n   \
    \     src_ip = action_evtlog_event_data_IpAddress,\n        service_name = action_evtlog_event_data_ServiceName,\n        event_id = action_evtlog_event_id\n\
    | filter event_id = 4769\n| filter src_user != null and not src_user ~= \".*\\$$\"\n| filter service_name != null and not service_name ~=\
    \ \".*\\$$\" and lowercase(service_name) != \"krbtgt\"\n| bin _time span = 10h\n| comp count_distinct(service_name) as unique_services, \n\
    \       values(agent_hostname) as hosts,\n       min(_time) as window_start,\n       max(_time) as window_end \n       by _time, src_ip, src_user\n\
    | filter unique_services >= 5\n| alter check_start = window_start,\n        check_end = window_end,\n        check_src_ip = src_ip,\n    \
    \    check_src_user = src_user\n| join type = left (dataset = xdr_data\n                    | filter action_evtlog_event_id = 4768\n     \
    \               | alter src_user_4768 = action_evtlog_event_data_TargetUserName,\n                            src_ip_4768 = action_evtlog_event_data_IpAddress\n\
    \                    | comp count() as count_4768 by src_ip_4768, src_user_4768) as sub\n       src_ip = sub.src_ip_4768 and src_user = sub.src_user_4768\n\
    | filter count_4768 = 0 or count_4768 = null\n| fields _time, src_ip, src_user, unique_services, hosts, window_start, window_end\n"
  lucene: |
    event.code:4769 AND NOT winlog.event_data.TargetUserName:*$ AND NOT winlog.event_data.ServiceName:*$ AND NOT winlog.event_data.ServiceName:krbtgt
  sumo: |
    _sourceCategory=*Windows* (EventID=4769 OR EventID=4768)
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "TargetUserName" as src_user
    | json field=_raw "ServiceName" as service_name
    | where event_id in ("4768", "4769")
    | where !(src_user matches "*$")
    | timeslice 10h
    | count by _timeslice, src_ip, src_user, event_id, service_name
    | fields - _count
    | transpose row _timeslice, src_ip, src_user column event_id
    | where isNull("4768")
    | where isNotNull("4769")
    | where !(service_name matches "*$") and service_name != "krbtgt"
    | count_distinct(service_name) as unique_services by _timeslice, src_ip, src_user
    | where unique_services >= 5
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Event

  Where the Event ID is  "4769"

  Where the Source user is NOT a machine account

  Where the Service Name does NOT end with "$"

  Where the Service Name is NOT "krbtgt"

  With 5 Unique Service Names

  From the Same Src IP and Src User

  Within 10 Hours


  AND where there are no 4768 Events within the timeframe from the same source IP and user'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000590
v4_id: 000590
name: Golden Ticket Activity
description: Detects when a source generates a ticket granting service (TGS) event without a ticket granting ticket (TGT) event, which means a
  Golden Ticket may be used within the environment. Adversaries who have the KRBTGT account password hash may forge Kerberos ticket-granting tickets
  (TGT), also known as a golden ticket. Using a golden ticket, adversaries are then able to request ticket granting service (TGS) tickets, which
  enable access to specific resources. Golden tickets require adversaries to interact with the Key Distribution Center (KDC) in order to obtain
  TGS.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1558
technique_name: Steal or Forge Kerberos Tickets
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4768, 4769'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security (EventCode=4769 OR EventCode=4768)
    | eval is_machine_account=if(like(src_user, "%$"), 1, 0)
    | search EventCode=4769 is_machine_account=0 NOT Service_Name="*$" NOT Service_Name="krbtgt"
    | bin _time span=10h
    | stats dc(Service_Name) as unique_services, values(Service_Name) as service_list, max(_time) as last_time, min(_time) as first_time by _time, src_ip, src_user
    | where unique_services >= 5
    | eval search_start=first_time, search_end=last_time
    | map maxsearches=10000 search="search index=wineventlog sourcetype=WinEventLog:Security EventCode=4768 src_ip=\"$src_ip$\" src_user=\"$src_user$\" earliest=$search_start$ latest=$search_end$ | stats count | eval found_4768=if(count>0,1,0) | eval src_ip=\"$src_ip$\", src_user=\"$src_user$\", unique_services=$unique_services$, service_list=\"$service_list$\", first_time=$first_time$, last_time=$last_time$"
    | where found_4768=0
    | table first_time, last_time, src_ip, src_user, unique_services, service_list
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4768", "4769")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4768', '4769')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000590 {\n  meta:\n    author = \"TDL\"\n    description = \"Golden Ticket Activity\"\n    severity = \"MEDIUM\"\n\
    \    tactic = \"TA0006\"\n    technique = \"T1558\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4768|4769)/\n\
    \    $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4768", "4769")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4768, 4769])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4768, 4769)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4768", "4769")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4768 OR 4769)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4768", "4769")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '1 Windows Event

  Where the Event ID is  "4769"

  Where the Source user is NOT a machine account

  Where the Service Name does NOT end with "$"

  Where the Service Name is NOT "krbtgt"

  With 5 Unique Service Names

  From the Same Src IP and Src User

  Within 10 Hours


  AND where there are no 4768 Events within the timeframe from the same source IP and user'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

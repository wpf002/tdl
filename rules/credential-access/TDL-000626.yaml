rule_id: TDL-CA-000626
v4_id: '000626'
name: Potential GraphRunner Get-GraphTokens Usage
description: Designed to detect activities associated with the usage of GraphRunner, a post exploit toolset for interacting with the Microsoft
  Graph API
tactic: Credential Access
tactic_id: TA0006
technique_id: T1528
technique_name: Steal Application Access Token
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=azure sourcetype=azure:monitor:aad EventCategory=SignInLogs \n| spath output=authProtocol path=properties.authenticationProtocol\
    \ \n| spath output=resourceDisplayName path=properties.resourceDisplayName\n| search authProtocol=\"deviceCode\" resourceDisplayName=\"Microsoft\
    \ Graph\"\n| table _time, user, src, authProtocol, resourceDisplayName, properties.status, properties.location\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "GraphRunner"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%GraphRunner%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000626 {\n  meta:\n    author = \"TDL\"\n    description = \"Potential GraphRunner Get-GraphTokens Usage\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0006\"\n    technique = \"T1528\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n   \
    \ $e.eventName = /GraphRunner/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%GraphRunner%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/GraphRunner/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*GraphRunner*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "GraphRunner"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*GraphRunner*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*GraphRunner*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '1 Azure Sign-In Event

  Where the Authentication Protocol is "deviceCode"

  AND Resource Display Name is "Microsoft Graph"'
suppression:
  window: 12 hours
  fields:
  - src_ip
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

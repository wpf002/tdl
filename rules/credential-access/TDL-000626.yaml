rule_id: TDL-CA-000626
v4_id: '000626'
name: Potential GraphRunner Get-GraphTokens Usage
description: Designed to detect activities associated with the usage of GraphRunner, a post exploit toolset for interacting with the Microsoft
  Graph API
tactic: Credential Access
tactic_id: TA0006
technique_id: T1528
technique_name: Steal Application Access Token
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=azure sourcetype=azure:monitor:aad EventCategory=SignInLogs \n| spath output=authProtocol path=properties.authenticationProtocol\
    \ \n| spath output=resourceDisplayName path=properties.resourceDisplayName\n| search authProtocol=\"deviceCode\" resourceDisplayName=\"Microsoft\
    \ Graph\"\n| table _time, user, src, authProtocol, resourceDisplayName, properties.status, properties.location\n"
  kql: |
    SigninLogs
    | where TimeGenerated > ago(24h)
    | where AuthenticationProtocol =~ "deviceCode"
    | where ResourceDisplayName =~ "Microsoft Graph"
    | project TimeGenerated, UserPrincipalName, AppDisplayName, IPAddress, Location, DeviceDetail, ResultType, ResultDescription, AuthenticationProtocol, ResourceDisplayName, ConditionalAccessStatus
  aql: |
    SELECT username, sourceip, "Authentication Protocol", "Resource Display Name", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Authentication Protocol" = 'deviceCode'
      AND "Resource Display Name" = 'Microsoft Graph'
    LAST 24 HOURS
  yara_l: "rule azure_device_code_phishing_graph_access {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Azure device code authentication\
    \ to Microsoft Graph API, potential T1528 credential access\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1528\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"MICROSOFT\"\n    $e.metadata.product_name = \"\
    AZURE\"\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.metadata.product_event_type = \"Sign-in activity\"\n    $e.additional.fields[\"\
    authenticationProtocol\"] = \"deviceCode\"\n    $e.additional.fields[\"resourceDisplayName\"] = \"Microsoft Graph\"\n    $e.target.user.userid\
    \ = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-azure.signinlogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND azure.signinlogs.properties.authentication_protocol == \"\
    deviceCode\"\n  AND azure.signinlogs.properties.resource_display_name == \"Microsoft Graph\"\n| KEEP @timestamp, user.name, source.ip, azure.signinlogs.properties.user_principal_name,\
    \ azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.device_detail.display_name, azure.signinlogs.properties.status.error_code\n"
  leql: |
    where(source_json.authenticationProtocol="deviceCode" AND source_json.resourceDisplayName="Microsoft Graph")
  crowdstrike: |
    #repo=Azure event_simpleName=UserActivityAuditEvent AuthenticationProtocol=deviceCode ResourceDisplayName="Microsoft Graph"
    | table([@timestamp, ComputerName, UserName, AuthenticationProtocol, ResourceDisplayName, IPAddress, UserAgent])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name = "Sign-in activity"
    | filter json_extract_scalar(raw_log, "$.properties.authenticationProtocol") = "deviceCode"
      and json_extract_scalar(raw_log, "$.properties.resourceDisplayName") = "Microsoft Graph"
    | fields _time, identity_name, identity_sub_type, json_extract_scalar(raw_log, "$.properties.ipAddress") as source_ip, json_extract_scalar(raw_log, "$.properties.userAgent") as user_agent, json_extract_scalar(raw_log, "$.properties.deviceDetail.deviceId") as device_id
  lucene: |
    azure.signinlogs.properties.authenticationProtocol:"deviceCode" AND azure.signinlogs.properties.resourceDisplayName:"Microsoft Graph"
  sumo: |
    _sourceCategory=*Azure* "deviceCode" "Microsoft Graph"
    | json field=_raw "properties.authenticationProtocol" as auth_protocol
    | json field=_raw "properties.resourceDisplayName" as resource_display_name
    | where auth_protocol = "deviceCode" and resource_display_name = "Microsoft Graph"
    | fields _messageTime, _sourceHost, auth_protocol, resource_display_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Azure Sign-In Event

  Where the Authentication Protocol is "deviceCode"

  AND Resource Display Name is "Microsoft Graph"'
suppression:
  window: 12 hours
  fields:
  - src_ip
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

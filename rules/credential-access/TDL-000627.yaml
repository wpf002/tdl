rule_id: TDL-CA-000627
v4_id: '000627'
name: Azure Key Vault Deleted
description: Designed to detect the deletion of an Azure Key Vault
tactic: Credential Access
tactic_id: TA0006
technique_id: T1485
technique_name: Data Destruction
platform:
- Azure
data_sources:
- Azure Key Vault
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=azure sourcetype=azure:audit OperationName="VaultDelete"

    | table _time, CallerIpAddress, Identity, ResourceId, SubscriptionId, ResultType

    '
  kql: |
    AzureDiagnostics
    | where TimeGenerated > ago(1h)
    | where ResourceType == "VAULTS"
    | where OperationName == "VaultDelete"
    | project TimeGenerated, ResourceId, CallerIPAddress, identity_claim_http_schemas_xmlsoap_org_ws_2005_05_identity_claims_upn_s, Resource, SubscriptionId, ResourceGroup
  aql: |
    SELECT eventtime, username, sourceip, "Operation Name", "Resource Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Operation Name" = 'VaultDelete'
    LAST 24 HOURS
  yara_l: |
    rule azure_key_vault_deleted {
      meta:
        author = "Detection Engineer"
        description = "Detects deletion of Azure Key Vault"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1485"
        platform = "Azure"
        data_source = "Azure Key Vault"

      events:
        $e.metadata.product_name = "Azure"
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
        $e.metadata.product_event_type = "VaultDelete"
        $e.principal.user.userid = $user
        $e.target.resource.name = $vault

      match:
        $user, $vault over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-azure.auditlogs*
    | WHERE @timestamp > NOW() - 24 hour AND azure.auditlogs.operation_name == "VaultDelete"
    | KEEP @timestamp, azure.auditlogs.properties.initiatedBy.user.userPrincipalName, azure.auditlogs.properties.targetResources, azure.resource.name, azure.resource.group, azure.subscription.id
  leql: |
    where(source_json.operationName="VaultDelete")
  crowdstrike: |
    #type=azure OperationName="VaultDelete"
    | table([@timestamp, CallerIPAddress, Identity, ResourceId, OperationName])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name = "VaultDelete"
    | fields _time, cloud_provider, operation_name, actor_user, resource_name, resource_type, cloud_provider_project
  lucene: |
    OperationName:"VaultDelete" AND ResourceProvider:"MICROSOFT.KEYVAULT"
  sumo: |
    _sourceCategory=*Azure* "VaultDelete"
    | json field=_raw "operationName" as operation_name
    | where operation_name = "VaultDelete"
    | fields _messageTime, _sourceHost, operation_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Azure Audit Event

  Where the Operation Name is "VaultDelete"'
suppression:
  window: 8 hours
  fields:
  - src_ip
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

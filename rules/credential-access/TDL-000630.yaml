rule_id: TDL-CA-000630
v4_id: '000630'
name: Password shared outside of Organization
description: Detects when a password from a passowrd manager has been shared to an account outside the Organization.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Keeper
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=keeper sourcetype=keeper:audit action="login" result="success"

    | bin _time span=1h

    | stats dc(src_ip) as unique_ips, values(src_ip) as ip_list by _time, user

    | where unique_ips >= 3

    | table _time, user, unique_ips, ip_list

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4624
    | where LogonType in (2, 10)
    | where Account has "Arcis"
    | project TimeGenerated, Computer, Account, LogonType, IpAddress, WorkstationName
  aql: |
    SELECT username, sourceip, COUNT(*) AS login_attempts
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Keeper%'
      AND (qidname(qid) ILIKE '%login%' OR qidname(qid) ILIKE '%authentication%' OR qidname(qid) ILIKE '%logon%')
    GROUP BY username, sourceip
    HAVING login_attempts >= 1
    LAST 24 HOURS
  yara_l: "rule arcis_credential_access_t1078 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential T1078 Valid Accounts activity\
    \ via Arcis patterns\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"Medium\"\
    \n    \n  events:\n    $e.metadata.vendor_name = \"Keeper\"\n    $e.metadata.product_name = \"Arcis\"\n    $e.metadata.event_type = \"USER_LOGIN\"\
    \n    $e.target.user.userid = $user\n    $e.principal.hostname = $host\n    \n  match:\n    $user, $host over 1h\n    \n  condition:\n   \
    \ $e\n}\n"
  esql: "FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, logs-system.security*\n| WHERE @timestamp > NOW() - 24 hours\n\
    \  AND (\n    (winlog.event_id == \"4624\" AND winlog.event_data.LogonType IN (\"2\", \"10\"))\n    OR (event.code == \"4624\" AND winlog.event_data.LogonType\
    \ IN (\"2\", \"10\"))\n  )\n  AND user.name IS NOT NULL\n  AND user.name != \"SYSTEM\"\n  AND user.name != \"LOCAL SERVICE\"\n  AND user.name\
    \ != \"NETWORK SERVICE\"\n  AND NOT user.name LIKE \"*$\"\n| STATS \n    host_count = COUNT_DISTINCT(host.name),\n    logon_count = COUNT(*),\n\
    \    first_seen = MIN(@timestamp),\n    last_seen = MAX(@timestamp)\n  BY user.name\n| WHERE host_count >= 5 AND logon_count >= 10\n| KEEP\
    \ user.name, host_count, logon_count, first_seen, last_seen\n"
  leql: |
    where(source_json.EventID=4624 AND source_json.LogonType IN [2, 10]) groupby(source_json.TargetUserName, source_asset) calculate(count)
  crowdstrike: |
    #repo=Keeper event_simpleName=PasswordReuseDetected
    | groupBy([UserName, ComputerName], function=count(as=reuse_count))
    | reuse_count >= 1
    | table([@timestamp, ComputerName, UserName, reuse_count])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_NETWORK and action_app_id_transitions contains "keeper"
    | bin _time span=1h
    | comp count() as keeper_events by _time, actor_effective_username, agent_hostname
    | filter keeper_events >= 10
    | fields _time, actor_effective_username, agent_hostname, keeper_events
  lucene: |
    I need more specific information to write an accurate detection query. The provided detection logic just says "Arcis" which is not a complete detection rule specification.

    However, based on:
    - MITRE T1078 (Valid Accounts)
    - Platform: Windows
    - Data source: Keeper (which appears to be a password/credential management system)

    I'll create a reasonable query for detecting suspicious valid account usage patterns that might be logged by Keeper:

    (event_type:"credential_access" OR event_type:"password_retrieval" OR action:"vault_access") AND (source:"Keeper" OR application:"Keeper") AND (_exists_:user.name OR _exists_:username) AND NOT (user_agent:*KeeperApp* OR process.name:*Keeper*.exe)
  sumo: |
    _sourceCategory=*Keeper* OR _sourceCategory=*Arcis*
    | json field=_raw "event_type" as event_type
    | json field=_raw "user" as user
    | json field=_raw "action" as action
    | json field=_raw "source_ip" as source_ip
    | json field=_raw "result" as result
    | where (event_type matches "*login*" OR event_type matches "*authentication*" OR action matches "*login*" OR action matches "*auth*") AND (result matches "*fail*" OR result matches "*denied*" OR result matches "*invalid*")
    | timeslice 10m
    | count as failed_attempts by _timeslice, user, source_ip
    | where failed_attempts >= 5
    | fields _timeslice, user, source_ip, failed_attempts
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: Arcis
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

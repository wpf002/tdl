rule_id: TDL-CA-000631
v4_id: '000631'
name: Password Vault email changed
description: Detects when the email associated with a Password Vault has been changed. This could be indicative of a threat actor attempting to
  establish persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Keeper
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=keeper sourcetype=keeper:logs action="login_failed" OR action="login_success"

    | bin _time span=15m

    | stats count(eval(action="login_failed")) as failed_count, count(eval(action="login_success")) as success_count, values(src_ip) as source_ips
    by _time, user

    | where failed_count >= 5 AND success_count >= 1

    | table _time, user, failed_count, success_count, source_ips

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 4624\n| where LogonType in (2, 10)\n| where AccountType == \"User\"\
    \n| where Account !endswith \"$\"\n| summarize \n    LogonCount = count(),\n    ComputerCount = dcount(Computer),\n    Computers = make_set(Computer)\n\
    \    by Account, bin(TimeGenerated, 1h)\n| where ComputerCount >= 5\n| project TimeGenerated, Account, LogonCount, ComputerCount, Computers\n"
  aql: |
    SELECT username, sourceip, COUNT(*) AS login_attempts
    FROM events
    WHERE username IS NOT NULL
      AND username != 'SYSTEM'
      AND username != 'ANONYMOUS LOGON'
    GROUP BY username, sourceip
    HAVING login_attempts >= 5
    LAST 1 HOURS
  yara_l: "rule arcis_credential_access_t1078 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential credential access via T1078\
    \ - Valid Accounts on Windows using Keeper data source\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"\
    T1078\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"Keeper\"\n    $e.metadata.product_name = \"Keeper\"\n\
    \    $e.target.platform = \"WINDOWS\"\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.target.user.userid = $user\n    $e.principal.hostname\
    \ = $host\n    \n  match:\n    $user, $host over 1h\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, logs-system.security*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (winlog.event_id == "4624" AND winlog.event_data.LogonType IN ("2", "10", "3"))
        OR (event.code == "4624" AND winlog.event_data.LogonType IN ("2", "10", "3"))
      )
    | STATS login_count = COUNT(*), distinct_hosts = COUNT_DISTINCT(host.name), distinct_source_ips = COUNT_DISTINCT(source.ip) BY user.name, window = BUCKET(@timestamp, 1 hour)
    | WHERE login_count >= 10 OR distinct_hosts >= 5 OR distinct_source_ips >= 3
    | KEEP @timestamp, window, user.name, login_count, distinct_hosts, distinct_source_ips
  leql: |
    where(source_json.EventID=4625 AND source_json.TargetUserName != "ANONYMOUS LOGON" AND source_json.TargetUserName != "" AND source_json.TargetUserName NOT ICONTAINS "$") groupby(source_json.TargetUserName, source_json.WorkstationName) calculate(count)
  crowdstrike: "#repo=keeper event_simpleName=UserActivityAuditEvent action=login \n| groupBy([UserName, ComputerName], function=count(as=login_count))\n\
    | login_count >= 5\n| table([UserName, ComputerName, login_count])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_AUTHENTICATION
    | filter action_evtlog_event_id in (4624, 4625)
    | bin _time span=24h
    | comp count() as auth_attempts, count_distinct(agent_hostname) as unique_hosts by _time, actor_effective_username
    | filter auth_attempts >= 1 and unique_hosts >= 1
    | fields _time, actor_effective_username, auth_attempts, unique_hosts
  lucene: |
    _exists_:user.name AND _exists_:source.ip AND user.name:* AND source.ip:*
  sumo: |
    _sourceCategory=*Keeper* OR _sourceCategory=*Arcis*
    | json field=_raw "event_type" as event_type
    | json field=_raw "user" as user
    | json field=_raw "action" as action
    | json field=_raw "status" as status
    | json field=_raw "source_ip" as source_ip
    | where event_type matches "*login*" OR action matches "*authentication*" OR action matches "*access*"
    | timeslice 1h
    | count as login_attempts by _timeslice, user, source_ip
    | where login_attempts >= 5
    | fields _timeslice, user, source_ip, login_attempts
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: Arcis
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

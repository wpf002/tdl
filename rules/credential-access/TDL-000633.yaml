rule_id: TDL-CA-000633
v4_id: '000633'
name: Network Policy Modified by Unauthorized User
description: Detects a Modification to the network policies by an unauthorized user.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Snowflake
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name="*"

    | stats count values(host) as hosts values(user) as users by process_name, parent_process_name, command_line

    | where count >= 1

    | sort - count

    '
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend process_name = tostring(EventData.Image)
    | extend parent_process_name = tostring(EventData.ParentImage)
    | extend command_line = tostring(EventData.CommandLine)
    | where isnotempty(process_name)
    | summarize count_ = count(), hosts = make_set(Computer), users = make_set(tostring(EventData.User)) by process_name, parent_process_name, command_line
    | where count_ >= 1
    | sort by count_ desc
    | project process_name, parent_process_name, command_line, count_, hosts, users
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, COUNT(*) AS count, LIST(LOGSOURCENAME(logsourceid)) AS hosts, LIST(username) AS users
    FROM events
    WHERE "EventID" = '1' AND "Process Name" LIKE '%_%'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine"
    HAVING count >= 1
    ORDER BY count DESC
    LAST 24 HOURS
  yara_l: "rule sysmon_process_creation_credential_access {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Sysmon\
    \ Process Creation events for credential access monitoring - T1078\"\n    mitre_attack_technique = \"T1078\"\n    mitre_attack_tactic = \"\
    Credential Access\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type\
    \ = \"1\"\n    re.regex($e.target.process.file.full_path, `.+`)\n    $e.target.process.file.full_path = $process_name\n    $e.target.process.parent_process.file.full_path\
    \ = $parent_process_name\n    $e.target.process.command_line = $command_line\n    $e.principal.hostname = $host\n    $e.principal.user.userid\
    \ = $user\n    \n  match:\n    $process_name, $parent_process_name, $command_line over 24h\n    \n  outcome:\n    $risk_score = 35\n    $hosts\
    \ = array_distinct($host)\n    $users = array_distinct($user)\n    $event_count = count_distinct($e.metadata.id)\n    \n  condition:\n   \
    \ #e >= 1\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == 1 AND process.name RLIKE ".+"
    | STATS count = COUNT(*), hosts = VALUES(host.name), users = VALUES(user.name) BY process.name, process.parent.name, process.command_line
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=1) groupby(process_name, parent_process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 FileName=*
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=[count(as=cnt), collect(ComputerName, as=hosts), collect(UserName, as=users)])
    | cnt >= 1
    | sort(cnt, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 1 and action_process_image_name != null and action_process_image_name != ""
    | comp count() as occurrences, array_agg(agent_hostname) as hosts, array_agg(actor_effective_username) as users by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter occurrences >= 1
    | sort desc occurrences
  lucene: |
    EventCode:1 AND _exists_:process_name
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*endpoint* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id = "1"
    | where !isEmpty(process_name)
    | count as occurrences, values(host) as hosts, values(user) as users by process_name, parent_process_name, command_line
    | where occurrences >= 1
    | sort by occurrences desc
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 Instance within any observed window of a Sysmon Process Creation event where the process name matches a wildcard pattern containing
  one or more characters.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1

  Where process_name matches pattern "*.+*" (any process name containing at least one character)

  With stats aggregated by process_name, parent_process_name, and command_line

  With count of occurrences, collected values of host, and collected values of user per grouping

  Where count is greater than or equal to 1


  With the same process_name, parent_process_name, and command_line as the correlation key, sorted descending by count for prioritization of highest-frequency
  modifications first.'

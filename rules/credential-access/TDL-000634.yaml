rule_id: TDL-CA-000634
v4_id: '000634'
name: Potentially Malicious Application
description: Detects a Potentially Malicious Application usage in Snowflake. DBeaver allows for viewing of a data base in a simple format allowing
  for records to be viewed and recorded locally. Rapeflake is the Snowflake exploit seen in 2024 that exports Snowflake data bases.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Snowflake
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name IN ("*DBeaver*", "*Rapeflake*")

    | stats count values(host) as hosts values(user) as users by process_name, parent_process_name, command_line

    | where count >= 1

    | sort - count

    '
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend ProcessName = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend Computer = tostring(Computer)
    | extend User = tostring(EventData.User)
    | where ProcessName matches regex @"(?i).*dbeaver.*|.*rapeflake.*"
    | summarize Count = count(), Hosts = make_set(Computer), Users = make_set(User) by ProcessName, ParentProcessName, CommandLine
    | where Count >= 1
    | sort by Count desc
    | project Count, ProcessName, ParentProcessName, CommandLine, Hosts, Users
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, LOGSOURCENAME(logsourceid) AS host, username AS user, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1'
      AND ("Process Name" ILIKE '%dbeaver%' OR "Process Name" ILIKE '%rapeflake%')
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: "rule snowflake_credential_access_suspicious_process {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potentially malicious\
    \ applications (DBeaver, Rapeflake variants) via Sysmon Process Creation - MITRE T1078\"\n    mitre_attack_tactic = \"Credential Access\"\n\
    \    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type\
    \ = \"1\"\n    (\n      re.regex($e.principal.process.file.full_path, `(?i)dbeaver`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)rapeflake`) or\n      re.regex($e.principal.process.command_line, `(?i)dbeaver`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)rapeflake`)\n    )\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    $e.principal.process.file.full_path\
    \ = $process_name\n    $e.principal.process.parent_process.file.full_path = $parent_process_name\n    $e.principal.process.command_line =\
    \ $command_line\n    \n  match:\n    $process_name, $parent_process_name, $command_line over 24h\n    \n  outcome:\n    $risk_score = max(75)\n\
    \    $hostname = array_distinct($host)\n    $users = array_distinct($user)\n    $event_count = count_distinct($e.metadata.id)\n    \n  condition:\n\
    \    #e >= 1\n}\n"
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE winlog.event_id == \"1\" \n  AND (process.name LIKE \"*dbeaver*\" OR process.name LIKE\
    \ \"*rapeflake*\" OR process.name LIKE \"*snowflake*\")\n| STATS count = COUNT(*), hosts = VALUES(host.name), users = VALUES(user.name) BY\
    \ process.name, process.parent.name, process.command_line\n| WHERE count >= 1\n| SORT count DESC\n"
  leql: |
    where(source_json.EventID=1 AND (process_name ICONTAINS "dbeaver" OR process_name ICONTAINS "rapeflake")) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (FileName=*DBeaver* OR FileName=*Rapeflake* OR FileName=*SnowSQL* OR FileName=*snowflake* OR CommandLine=*snowflake* OR CommandLine=*DBeaver* OR CommandLine=*Rapeflake*)
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=[count(as=cnt), collect([ComputerName], limit=100, as=hosts), collect([UserName], limit=100, as=users)])
    | cnt >= 1
    | sort(cnt, reverse=true)
    | table([FileName, ParentBaseFileName, CommandLine, cnt, hosts, users])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_evtlog_event_id = 1
    | filter action_process_image_name ~= ".*DBeaver.*" or action_process_image_name ~= ".*Rapeflake.*" or action_process_image_name ~= ".*\..*\+.*\*.*"
    | comp count() as event_count, array_agg(agent_hostname) as hosts, array_agg(actor_effective_username) as users by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter event_count >= 1
    | sort desc event_count
    | fields action_process_image_name, actor_process_image_name, action_process_image_command_line, event_count, hosts, users
  lucene: |
    EventCode:1 AND process_name:(*DBeaver* OR *Rapeflake* OR *SnowSQL* OR *snowsql*)
  sumo: "_sourceCategory=*Sysmon* \"1\"\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"Image\" as process_name\n| json field=_raw\
    \ \"ParentImage\" as parent_process_name\n| json field=_raw \"CommandLine\" as command_line\n| json field=_raw \"User\" as user\n| json field=_raw\
    \ \"Computer\" as host\n| where event_id = \"1\" \n| where process_name matches \"*DBeaver*\" or process_name matches \"*Rapeflake*\" or process_name\
    \ matches regex \".*\\..*\\+.*\"\n| count as cnt, values(host) as hosts, values(user) as users by process_name, parent_process_name, command_line\n\
    | where cnt >= 1\n| sort by cnt desc\n| fields process_name, parent_process_name, command_line, cnt, hosts, users\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:

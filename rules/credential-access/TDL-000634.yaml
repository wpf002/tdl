author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 Instance over any time window of a Sysmon Process Creation event where the process name matches a potentially malicious application
  pattern.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1 (Process Creation)

  Where process_name matches wildcard pattern "*.+*" (targeting known malicious or suspicious application names such as DBeaver or Rapeflake variants)

  With aggregation of count, values of host, and values of user grouped by process_name, parent_process_name, and command_line

  With a minimum threshold of count >= 1 (any single occurrence triggers detection)

  With results sorted descending by count to surface highest-frequency matches first

  With the same process_name, parent_process_name, and command_line as the correlation key

  No exclusion lists defined; false positives from legitimate admin activity or authorized service accounts should be reviewed manually against
  known-good baselines'

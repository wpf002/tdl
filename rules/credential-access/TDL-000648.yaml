rule_id: TDL-CA-000648
v4_id: 000648
name: Potential Lambda Layer Injection Attempt
description: Detects when an attacker introduces a malicious Lambda layer to an existing Lambda function. Once the function executes, the malicious
  code in the layer can leverage the function's IAM role to make unauthorized AWS API calls.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventSource="lambda.amazonaws.com" eventName="UpdateFunctionConfiguration" requestParameters.layers=*

    | table _time, userIdentity.principalId, userIdentity.arn, awsRegion, requestParameters.functionName, requestParameters.layers, sourceIPAddress,
    userAgent

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventSource == "lambda.amazonaws.com"
    | where EventName == "UpdateFunctionConfiguration"
    | where isnotnull(RequestParameters) and RequestParameters has "layers"
    | extend LayersData = parse_json(RequestParameters).layers
    | where isnotnull(LayersData)
    | project TimeGenerated, UserIdentityArn, EventName, EventSource, SourceIpAddress, UserAgent, RequestParameters, LayersData, AWSRegion, RecipientAccountId
  aql: |
    SELECT eventtime, username, sourceip, "eventName", "requestParameters", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cloudtrail%'
      AND "eventSource" = 'lambda.amazonaws.com'
      AND "eventName" = 'UpdateFunctionConfiguration'
      AND "requestParameters" IS NOT NULL
      AND "requestParameters" ILIKE '%layers%'
    LAST 24 HOURS
  yara_l: |
    rule aws_lambda_layer_modification {
      meta:
        author = "Detection Engineer"
        description = "Detects AWS Lambda function layer updates which could indicate credential access via T1078"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "UpdateFunctionConfiguration"
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.target.resource.attribute.labels["eventSource"] = "lambda.amazonaws.com"
        $e.target.resource.attribute.labels["requestParameters.layers"] != ""
        $e.principal.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE event.provider == \"lambda.amazonaws.com\" \n  AND event.action == \"UpdateFunctionConfiguration\"\
    \n  AND aws.cloudtrail.request_parameters LIKE \"*layers*\"\n| KEEP @timestamp, cloud.account.id, cloud.region, user.name, event.action, aws.cloudtrail.request_parameters,\
    \ source.ip, user_agent.original\n"
  leql: |
    where(source_json.eventSource="lambda.amazonaws.com" AND source_json.eventName="UpdateFunctionConfiguration" AND source_json.requestParameters.layers!=null)
  crowdstrike: |
    #repo=* event.provider=lambda.amazonaws.com eventName=UpdateFunctionConfiguration requestParameters.layers=*
    | table([@timestamp, userIdentity.principalId, userIdentity.arn, sourceIPAddress, requestParameters.functionName, requestParameters.layers, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "AwsApiCall"
    | filter action_resource_creation_sub_type = "UpdateFunctionConfiguration"
    | filter json_extract_scalar(raw_log, "$.userIdentity.invokedBy") = "lambda.amazonaws.com"
    | filter json_extract(raw_log, "$.requestParameters.layers") != null
    | fields _time, actor_effective_username, action_resource_creation_sub_type, action_resource, raw_log
  lucene: |
    eventSource:"lambda.amazonaws.com" AND eventName:"UpdateFunctionConfiguration" AND _exists_:requestParameters.layers
  sumo: |
    _sourceCategory=*cloudtrail* "UpdateFunctionConfiguration"
    | json field=_raw "eventSource" as event_source
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.layers" as layers
    | where event_source = "lambda.amazonaws.com"
    | where event_name = "UpdateFunctionConfiguration"
    | where !isNull(layers)
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 AWS CloudTrail Event

  Where the source is "lambda.amazonaws.com"

  Where the event name is "UpdateFunctionConfiguration"

  Where requestParameters.layers is not NULL'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

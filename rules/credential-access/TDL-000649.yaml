rule_id: TDL-CA-000649
v4_id: 000649
name: Sys Admin Tools Created or Modified - Varonis
description: Detects the change or creation of administrative tools. While the tools may have legitimate uses, the use of the tools can be used
  for malicious activity. The activity should be validated by the user creating and or modifying the tools.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Varonis
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 (process_name="*\\net.exe" OR process_name="*\\net1.exe" OR process_name="*\\dsquery.exe"
    OR process_name="*\\nltest.exe" OR process_name="*\\whoami.exe" OR process_name="*\\quser.exe" OR process_name="*\\klist.exe" OR process_name="*\\cmdkey.exe")

    | stats count values(host) as hosts values(user) as users by process_name, parent_process_name, command_line

    | where count >= 1

    | table process_name, parent_process_name, command_line, hosts, users, count

    '
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend process_name = tostring(EventData.Image)
    | extend parent_process_name = tostring(EventData.ParentImage)
    | extend command_line = tostring(EventData.CommandLine)
    | extend host = Computer
    | extend user = tostring(EventData.User)
    | where process_name matches regex @"(?i).*(net\.exe|net1\.exe|powershell\.exe|cmd\.exe|wmic\.exe|psexec\.exe|sc\.exe|reg\.exe|at\.exe|schtasks\.exe|wevtutil\.exe|netsh\.exe|bcdedit\.exe|bitsadmin\.exe|certutil\.exe|mshta\.exe|regsvr32\.exe|rundll32\.exe|cscript\.exe|wscript\.exe|whoami\.exe|systeminfo\.exe|tasklist\.exe|nltest\.exe|dsquery\.exe|csvde\.exe|ldifde\.exe|ntdsutil\.exe|vssadmin\.exe|wbadmin\.exe)$"
    | summarize count() by process_name, parent_process_name, command_line, host, user
    | where count_ >= 1
    | project process_name, parent_process_name, command_line, host, user, count_
  aql: |
    SELECT "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid) AS host, username, COUNT(*) AS occurrences
    FROM events
    WHERE "EventID" = '1'
      AND ("Process Name" ILIKE '%psexec%' OR "Process Name" ILIKE '%wmic.exe%' OR "Process Name" ILIKE '%net.exe%' OR "Process Name" ILIKE '%net1.exe%' OR "Process Name" ILIKE '%at.exe%' OR "Process Name" ILIKE '%schtasks.exe%' OR "Process Name" ILIKE '%reg.exe%' OR "Process Name" ILIKE '%regedit.exe%' OR "Process Name" ILIKE '%sc.exe%' OR "Process Name" ILIKE '%mshta.exe%' OR "Process Name" ILIKE '%regsvr32.exe%' OR "Process Name" ILIKE '%rundll32.exe%' OR "Process Name" ILIKE '%powershell.exe%' OR "Process Name" ILIKE '%cmd.exe%')
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING occurrences >= 1
    LAST 24 HOURS
  yara_l: "rule valid_accounts_admin_tool_usage {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects usage of administrative\
    \ or system tools that may indicate valid account abuse - MITRE T1078\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type\
    \ = \"1\"\n    (\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\(psexec|wmic|powershell|cmd|net|net1|nltest|dsquery|whoami|quser|query|tasklist|sc|reg|regedit|mmc|mstsc|runas|at|schtasks|wevtutil|bcdedit|bitsadmin|certutil|cscript|wscript|mshta|rundll32|regsvr32|installutil|regasm|regsvcs|msbuild|vssadmin|wbadmin)\\\
    .exe$`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\(winrm|winrs|invoke-command|enter-pssession|cacls|icacls|takeown|attrib|comp|fc|find|findstr|fsutil|gpresult|systeminfo|taskkill|wusa|dism|logman|netsh|nslookup|pathping|ping|route|tracert|arp|getmac|ipconfig|nbtstat|netstat)\\\
    .exe$`)\n    )\n    $e.principal.process.file.full_path = $process_name\n    $e.principal.process.parent_process.file.full_path = $parent_process_name\n\
    \    $e.principal.process.command_line = $command_line\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    \n  match:\n\
    \    $process_name, $parent_process_name, $command_line, $host, $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == "1"
    | WHERE process.name LIKE "*admin*" OR process.name LIKE "*system*" OR process.name LIKE "*net.exe" OR process.name LIKE "*psexec*" OR process.name LIKE "*wmic.exe" OR process.name LIKE "*powershell.exe" OR process.name LIKE "*cmd.exe" OR process.name LIKE "*reg.exe" OR process.name LIKE "*sc.exe"
    | STATS unique_hosts = COUNT_DISTINCT(host.name), unique_users = COUNT_DISTINCT(user.name), occurrences = COUNT(*) BY process.name, process.parent.name, process.command_line
    | WHERE occurrences >= 1
    | KEEP process.name, process.parent.name, process.command_line, unique_hosts, unique_users, occurrences
  leql: |
    where(source_json.EventID=1 AND (process_name ICONTAINS "psexec" OR process_name ICONTAINS "wmic" OR process_name ICONTAINS "net.exe" OR process_name ICONTAINS "cmd.exe" OR process_name ICONTAINS "powershell.exe" OR process_name ICONTAINS "mmc.exe" OR process_name ICONTAINS "reg.exe" OR process_name ICONTAINS "sc.exe" OR process_name ICONTAINS "tasklist.exe" OR process_name ICONTAINS "whoami.exe")) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    #type=varonis EventCode=1
    | groupBy([process_name, parent_process_name, command_line, host, user], function=count(as=occurrences))
    | occurrences >= 1
    | table([process_name, parent_process_name, command_line, host, user, occurrences])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter action_process_image_name ~= ".*\\(net\.exe|net1\.exe|psexec\.exe|wmic\.exe|reg\.exe|sc\.exe|tasklist\.exe|nltest\.exe|dsquery\.exe|netsh\.exe|whoami\.exe|quser\.exe|cmdkey\.exe|systeminfo\.exe|ipconfig\.exe|klist\.exe|runas\.exe|powershell\.exe|cmd\.exe|wevtutil\.exe|vssadmin\.exe|bcdedit\.exe)$"
    | dedup action_process_image_name, actor_process_image_name, action_process_image_command_line, agent_hostname, actor_effective_username
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line
  lucene: |
    EventCode:1 AND process_name:(*net.exe OR *net1.exe OR *sc.exe OR *tasklist.exe OR *wmic.exe OR *psexec.exe OR *whoami.exe OR *ipconfig.exe OR *systeminfo.exe OR *netstat.exe OR *reg.exe OR *query.exe OR *nltest.exe OR *dsquery.exe OR *csvde.exe OR *ldifde.exe OR *klist.exe OR *runas.exe OR *cmd.exe OR *powershell.exe OR *pwsh.exe)
  sumo: |
    _sourceCategory=*Varonis* OR _sourceCategory=*endpoint* "EventCode=1" OR "EventID\":1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "EventCode" as event_code
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where (event_id = "1" OR event_code = "1")
    | where process_name matches "*net.exe" OR process_name matches "*net1.exe" OR process_name matches "*wmic.exe" OR process_name matches "*powershell.exe" OR process_name matches "*cmd.exe" OR process_name matches "*psexec.exe" OR process_name matches "*whoami.exe" OR process_name matches "*nltest.exe" OR process_name matches "*dsquery.exe" OR process_name matches "*quser.exe" OR process_name matches "*tasklist.exe" OR process_name matches "*sc.exe" OR process_name matches "*reg.exe"
    | dedup process_name, parent_process_name, command_line, host, user
    | fields _messageTime, host, user, process_name, parent_process_name, command_line
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 Instance within any time window of a Sysmon Process Creation event.


  From index=endpoint with sourcetype=Sysmon

  Where EventCode=1 (Process Create)

  Where process_name matches a wildcard pattern indicating administrative or system tools

  With fields collected including process_name, parent_process_name, command_line, host, and user

  With a minimum count of 1 occurrence across the aggregation


  With the same process_name, parent_process_name, and command_line as the correlation key, deduplicated by unique host and user combinations
  per process invocation.'

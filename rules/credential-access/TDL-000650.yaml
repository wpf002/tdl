rule_id: TDL-CA-000650
v4_id: '000650'
name: Azure Network Packet Capture Detected
description: Detects potential full network packet capture in Azure. Packet Capture is an Azure Network Watcher feature that can be used to inspect
  network traffic. This feature can potentially be abused to read sensitive data from unencrypted internal traffic.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1040
technique_name: Network Sniffing
platform:
- Azure
data_sources:
- Azure Activity
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=azure sourcetype=azure:activity \n(operationName=\"MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION\" OR operationName=\"MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION\"\
    \ OR operationName=\"MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE\")\nstatus=Success\n| table _time, user, operationName, resourceId, subscriptionId,\
    \ resourceGroup, activityStatusValue, callerIpAddress\n"
  kql: |
    AzureActivity
    | where TimeGenerated > ago(24h)
    | where OperationNameValue in~ ("MICROSOFT.NETWORK/NETWORKWATCHERS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/NETWORKWATCHERS/PACKETCAPTURES/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/VIRTUALNETWORKGATEWAYS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/VPNGATEWAYS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/P2SVPNGATEWAYS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/NETWORKWATCHERS/PACKETCAPTURES/WRITE")
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ActivityStatusValue, ResourceGroup, SubscriptionId, ResourceId, Properties
  aql: "SELECT username, \"Operation\", sourceip, eventtime, LOGSOURCENAME(logsourceid) AS log_source\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Azure%'\n  AND categoryname(category) ILIKE '%Administrative%'\n  AND (UPPER(\"Operation\") = 'MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION'\
    \ \n       OR UPPER(\"Operation\") = 'MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION'\n       OR UPPER(\"Operation\") = 'MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE')\n\
    \  AND (LOWER(\"Status\") = 'success' OR LOWER(\"Result\") = 'success' OR LOWER(\"Activity Status\") = 'success')\nLAST 24 HOURS\n"
  yara_l: "rule azure_network_packet_capture {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Azure packet capture operations indicating\
    \ potential network sniffing - T1040\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1040\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"Azure\"\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_UNCATEGORIZED\"\
    \n    (\n      re.regex($e.metadata.product_event_type, `(?i)MICROSOFT\\.NETWORK/.*/STARTPACKETCAPTURE/ACTION`) or\n      re.regex($e.metadata.product_event_type,\
    \ `(?i)MICROSOFT\\.NETWORK/.*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION`) or\n      re.regex($e.metadata.product_event_type, `(?i)MICROSOFT\\\
    .NETWORK/.*/PACKETCAPTURES/WRITE`)\n    )\n    $e.security_result.action = \"ALLOW\"\n    $e.principal.user.userid = $user\n    \n  match:\n\
    \    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-azure.activitylogs*\n| WHERE event.outcome == \"success\" \n  AND (\n    TO_UPPER(azure.activitylogs.operation_name) == \"\
    MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION\" \n    OR TO_UPPER(azure.activitylogs.operation_name) == \"MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION\"\
    \ \n    OR TO_UPPER(azure.activitylogs.operation_name) == \"MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE\"\n  )\n| KEEP @timestamp, azure.activitylogs.operation_name,\
    \ event.outcome, user.name, azure.resource.id, source.ip, azure.subscription_id\n"
  leql: |
    where(source_json.operationName IN ["MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE"] AND source_json.resultType="Success")
  crowdstrike: |
    #type=AzureActivity event_platform=Azure
    (OperationNameValue="MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION" OR OperationNameValue="MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION" OR OperationNameValue="MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE")
    ActivityStatusValue=Success
    | table([@timestamp, CallerIpAddress, Caller, OperationNameValue, ResourceGroup, SubscriptionId, ActivityStatusValue])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and operation_name_orig in ("MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE") and operation_status = "Success"
    | fields _time, cloud_provider, operation_name_orig, operation_status, identity_name, resource_name, resource_type, cloud_provider_project
  lucene: |
    azure.activitylogs.operation_name:("MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION" OR "MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION" OR "MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE") AND azure.activitylogs.result_type:"Success"
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*azure*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "resultType" as result_type
    | json field=_raw "status" as status
    | where (operation_name matches "*MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION*" OR operation_name matches "*MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION*" OR operation_name matches "*MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE*")
    | where (result_type matches "*Success*" OR status matches "*Success*" OR result_type matches "*Succeeded*" OR status matches "*Succeeded*")
    | fields _messageTime, operation_name, result_type, status
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Administrative Activity Event

  Where the operation is in ["MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION", "MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION",
  "MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE"]

  Where the action is success'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000656
v4_id: '000656'
name: Azure Powershell Accessing Non Azure AD Resources
description: Detects when a user or application signs in using Azure Active Directory PowerShell to access non-Active Directory resources
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure Sign-in
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:signinlogs appId="1b730954-1685-4b74-9bfd-dac224a7b894" resultType=0 NOT (resourceId IN ("00000002-0000-0000-c000-000000000000",
    "00000003-0000-0000-c000-000000000000"))

    | table _time, userPrincipalName, appDisplayName, resourceDisplayName, ipAddress, location, deviceDetail.operatingSystem, userAgent

    '
  kql: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where AppId == "1b730954-1685-4b74-9bfd-dac224a7b894"
    | where ResultType == 0
    | where ResourceIdentity !in ("00000002-0000-0000-c000-000000000000", "00000003-0000-0000-c000-000000000000")
    | project TimeGenerated, UserPrincipalName, AppDisplayName, AppId, ResourceIdentity, ResourceDisplayName, IPAddress, Location, DeviceDetail
  aql: |
    SELECT username, sourceip, "Application ID", "Resource ID", "Failure Code", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Azure%'
      AND (QIDNAME(qid) ILIKE '%sign%in%' OR categoryname(category) ILIKE '%authentication%')
      AND "Application ID" = '1b730954-1685-4b74-9bfd-dac224a7b894'
      AND "Failure Code" = '0'
      AND "Resource ID" NOT IN ('00000002-0000-0000-c000-000000000000', '00000003-0000-0000-c000-000000000000')
    LAST 24 HOURS
  yara_l: "rule azure_valid_accounts_aad_ps_signin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Azure sign-ins using AAD PowerShell\
    \ application with successful authentication\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\n\
    \    severity = \"Medium\"\n  \n  events:\n    $e.metadata.vendor_name = \"MICROSOFT\"\n    $e.metadata.product_name = \"AZURE\"\n    $e.metadata.event_type\
    \ = \"USER_LOGIN\"\n    $e.principal.application = \"1b730954-1685-4b74-9bfd-dac224a7b894\"\n    $e.security_result.summary = \"0\"\n    $e.target.resource.id\
    \ != \"00000002-0000-0000-c000-000000000000\"\n    $e.target.resource.id != \"00000003-0000-0000-c000-000000000000\"\n    $e.principal.user.userid\
    \ = $user\n    $e.principal.ip = $ip\n  \n  match:\n    $user, $ip over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-azure.signinlogs*
    | WHERE azure.signinlogs.properties.app_id == "1b730954-1685-4b74-9bfd-dac224a7b894"
      AND azure.signinlogs.properties.status.error_code == 0
      AND azure.signinlogs.properties.resource_id NOT IN ("00000002-0000-0000-c000-000000000000", "00000003-0000-0000-c000-000000000000")
    | KEEP @timestamp, azure.signinlogs.properties.user_principal_name, azure.signinlogs.properties.ip_address, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.resource_display_name, azure.signinlogs.properties.resource_id
  leql: |
    where(source_json.appId="1b730954-1685-4b74-9bfd-dac224a7b894" AND source_json.status.errorCode=0 AND source_json.resourceId!="00000002-0000-0000-c000-000000000000" AND source_json.resourceId!="00000003-0000-0000-c000-000000000000")
  crowdstrike: "#event_type=AzureSignInLogs appId=\"1b730954-1685-4b74-9bfd-dac224a7b894\" resultType=0 \n| !in(field=resourceId, values=[\"00000002-0000-0000-c000-000000000000\"\
    , \"00000003-0000-0000-c000-000000000000\"])\n| table([@timestamp, userPrincipalName, appDisplayName, resourceDisplayName, ipAddress, location,\
    \ deviceDetail])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name = "Sign-in activity"
    | filter json_extract_scalar(raw_log, "$.properties.appId") = "1b730954-1685-4b74-9bfd-dac224a7b894"
    | filter json_extract_scalar(raw_log, "$.properties.status.errorCode") = "0"
    | filter json_extract_scalar(raw_log, "$.properties.resourceId") not in ("00000002-0000-0000-c000-000000000000", "00000003-0000-0000-c000-000000000000")
    | fields _time, json_extract_scalar(raw_log, "$.properties.userPrincipalName") as user, json_extract_scalar(raw_log, "$.properties.ipAddress") as ip_address, json_extract_scalar(raw_log, "$.properties.appDisplayName") as app_name, json_extract_scalar(raw_log, "$.properties.resourceDisplayName") as resource_name
  lucene: |
    properties.appId:"1b730954-1685-4b74-9bfd-dac224a7b894" AND properties.status.errorCode:0 AND NOT properties.resourceId:("00000002-0000-0000-c000-000000000000" OR "00000003-0000-0000-c000-000000000000")
  sumo: |
    _sourceCategory=*Azure*SignIn* OR _sourceCategory=*Azure*Sign-in* OR _sourceCategory=*azure*signin*
    | json field=_raw "appId" as app_id
    | json field=_raw "status.errorCode" as error_code
    | json field=_raw "resourceId" as resource_id
    | where app_id = "1b730954-1685-4b74-9bfd-dac224a7b894"
    | where error_code = "0" OR error_code = 0
    | where !(resource_id in ("00000002-0000-0000-c000-000000000000", "00000003-0000-0000-c000-000000000000"))
    | fields _messageTime, app_id, error_code, resource_id, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Azure Sign-in Event\nWhere the application id is \"1b730954-1685-4b74-9bfd-dac224a7b894\"\nWhere the failure code is 0 \nWhere\
  \ the resourceid is not in (\"00000002-0000-0000-c000-000000000000\", \"00000003-0000-0000-c000-000000000000\")"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

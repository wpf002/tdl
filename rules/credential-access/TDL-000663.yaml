rule_id: TDL-CA-000663
v4_id: '000663'
name: Windows Replay Attack Detected
description: This rule identifies potential replay attacks on Windows systems. Replay attacks involve capturing and reusing valid authentication
  tokens or network traffic to gain unauthorized access. This detection focuses on anomalies such as repeated Kerberos authentication errors (e.g.,
  KRB_AP_ERR_REPEAT ) or unusual patterns in authentication attempts.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1558
technique_name: Steal or Forge Kerberos Tickets
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4649'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=4649

    | table _time, ComputerName, Account_Name, Ticket_Options, Ticket_Encryption_Type, Service_Name, Client_Address

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4649
    | project TimeGenerated, Computer, Account, TargetAccount, TargetUserName, ServiceName, ServiceSid, TicketOptions, TicketEncryptionType, IpAddress, IpPort, Activity
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Target Username", "Service Name", "Ticket Options", "Ticket Encryption Type", sourceip
    FROM events
    WHERE "EventID" = '4649'
    LAST 24 HOURS
  yara_l: "rule kerberos_ticket_encryption_downgrade {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Event ID 4649\
    \ indicating a Kerberos ticket encryption downgrade attack (T1558)\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1558\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"USER_UNCATEGORIZED\"\n    $e.metadata.product_event_type\
    \ = \"4649\"\n    $e.principal.hostname = $host\n    $e.target.user.userid = $user\n    \n  match:\n    $host, $user over 5m\n    \n  outcome:\n\
    \    $risk_score = 75\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4649"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.TargetUserName, winlog.event_data.TicketOptions, winlog.event_data.TicketEncryptionType, winlog.event_data.PreAuthType, winlog.event_data.IpAddress
  leql: |
    where(source_json.EventID=4649)
  crowdstrike: |
    EventCode=4649
    | table([@timestamp, ComputerName, TargetUserName, TargetDomainName, ServiceName, TicketOptions, TicketEncryptionType, IpAddress])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4649
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_ServiceName, action_evtlog_event_data_TicketOptions, action_evtlog_event_data_TicketEncryptionType, action_evtlog_message
  lucene: |
    event.code:4649
  sumo: |
    _sourceCategory=*Windows*Security* "4649"
    | json field=_raw "EventID" as event_id
    | where event_id = "4649"
    | json field=_raw "Computer" as computer
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "ServiceName" as service_name
    | fields _messageTime, computer, target_user, service_name
false_positives:
- Miss-configuration may casuse false positives. Base line for atleast a week.
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Security Event

  Where Event ID 4649'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000676
v4_id: '000676'
name: Guest Joined Channel - Slack
description: Detects when a guest user joins a Slack channel
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="guest_channel_join"

    | table _time, user, channel, user_type, guest_email, invited_by

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "Slack"
    | where Operation == "guest_channel_join"
    | project TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, OriginatingServer, OrganizationId, ResultStatus
  aql: |
    SELECT eventtime, username, sourceip, "Action", QIDNAME(qid), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE "Action" = 'guest_channel_join'
    LAST 24 HOURS
  yara_l: "rule slack_guest_channel_join {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects when a guest user joins\
    \ a Slack channel - MITRE T1078 Credential Access\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique = \"T1078\"\
    \n    severity = \"Low\"\n    \n  events:\n    $e.metadata.product_name = \"Slack\"\n    $e.metadata.product_event_type = \"guest_channel_join\"\
    \n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-slack*
    | WHERE event.action == "guest_channel_join"
    | KEEP @timestamp, user.name, user.email, event.action, slack.channel.id, slack.channel.name, host.name, source.ip
  leql: |
    where(source_json.action="guest_channel_join")
  crowdstrike: |
    #type=slack action="guest_channel_join"
    | table([@timestamp, user.name, user.email, channel.name, channel.id, team.domain])
  xql: |
    dataset = slack_audit_logs
    | filter action = "guest_channel_join"
    | fields _time, actor_user_name, actor_user_id, action, entity_name, entity_id, context_ip_address, context_user_agent
  lucene: |
    event.action:"guest_channel_join"
  sumo: |
    _sourceCategory=*Slack* "guest_channel_join"
    | json field=_raw "action" as action
    | where action = "guest_channel_join"
    | fields _messageTime, _sourceHost, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "guest_channel_join"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

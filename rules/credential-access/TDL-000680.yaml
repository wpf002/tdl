rule_id: TDL-CA-000680
v4_id: 000680
name: Public Channel Created - Slack
description: Detects when a public Slack channel is created within an org
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="public_channel_created"

    | table _time, user, channel_name, channel_id, workspace_id

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "Slack"
    | where Operation == "public_channel_created"
    | project TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, OfficeObjectId, Parameters
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS log_source, "Action", "Channel Name"
    FROM events
    WHERE "Action" = 'public_channel_created'
    LAST 24 HOURS
  yara_l: |
    rule slack_public_channel_created {
      meta:
        author = "TDL"
        description = "Detects creation of public Slack channels"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Low"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "public_channel_created"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "public_channel_created"
    | KEEP @timestamp, user.name, user.id, event.action, slack.channel.name, slack.channel.id, host.name
  leql: |
    where(source_json.action="public_channel_created")
  crowdstrike: |
    #type=slack event.action="public_channel_created"
    | table([@timestamp, event.action, event.actor.user.name, event.channel.name, event.channel.id])
  xql: |
    dataset = slack_audit_logs
    | filter action = "public_channel_created"
    | fields _time, actor_user_id, actor_user_email, action, entity_channel_id, entity_channel_name, context_ip_address, context_user_agent
  lucene: |
    action:"public_channel_created"
  sumo: |
    _sourceCategory=*Slack* "public_channel_created"
    | json field=_raw "action" as action
    | where action = "public_channel_created"
    | fields _messageTime, _sourceHost, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "public_channel_created"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

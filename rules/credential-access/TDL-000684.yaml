rule_id: TDL-CA-000684
v4_id: 000684
name: Unapproved App installed - Slack
description: Detects when an app is installed in Slack that is not directory approved
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="app_installed" entity.is_directory_approved=false

    | table _time, user, app_name, entity.is_directory_approved, action

    '
  kql: |
    SlackAuditLogs
    | where TimeGenerated > ago(24h)
    | where Action == "app_installed"
    | extend is_directory_approved = tostring(parse_json(tostring(Entity)).is_directory_approved)
    | where is_directory_approved == "false"
    | project TimeGenerated, Action, User, Entity, AppName = tostring(parse_json(tostring(Entity)).name), is_directory_approved
  aql: "SELECT eventtime, username, sourceip, \"Action\", \"entity.is_directory_approved\", \"entity.app_name\"\nFROM events\nWHERE \"Action\"\
    \ = 'app_installed' \n  AND \"entity.is_directory_approved\" = 'false'\nLAST 24 HOURS\n"
  yara_l: |
    rule slack_unapproved_app_installed {
      meta:
        author = "TDL"
        description = "Detects installation of unapproved Slack applications (T1078 - Valid Accounts)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "app_installed"
        $e.security_result.about.labels["entity.is_directory_approved"] = "false"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-slack.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"app_installed\" \n  AND slack.audit.entity.is_directory_approved\
    \ == false\n| KEEP @timestamp, user.name, user.email, event.action, slack.audit.app.name, slack.audit.app.id, slack.audit.entity.is_directory_approved,\
    \ host.name\n"
  leql: |
    where(source_json.action="app_installed" AND source_json.entity.is_directory_approved=false)
  crowdstrike: |
    #type=slack action=app_installed entity.is_directory_approved=false
    | table([@timestamp, user.name, user.email, app.name, app.id, entity.is_directory_approved, ComputerName])
  xql: |
    dataset = slack_audit_logs
    | filter action = "app_installed" and entity_is_directory_approved = false
    | fields _time, actor_user_email, actor_user_name, entity_app_name, entity_app_id, action, entity_is_directory_approved
  lucene: |
    action:app_installed AND entity.is_directory_approved:false
  sumo: |
    _sourceCategory=*Slack* "app_installed"
    | json field=_raw "action" as action
    | json field=_raw "entity.is_directory_approved" as is_directory_approved
    | where action = "app_installed" and is_directory_approved = "false"
    | fields _messageTime, _sourceHost, action, is_directory_approved
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "app_installed"

  Where the "entity.is_directory_approved" attribute is false'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000689
v4_id: 000689
name: Slack Organization Modified by Unauthorized User
description: Detects when a non Slack Admin user creates, deletes or modifies a organization within Slack
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=slack action IN ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    NOT [| inputlookup slack_admins.csv | fields user | rename user as src_user]

    | table _time, action, src_user, organization_id, organization_name, src_ip

    '
  kql: |
    Slack_Audit_CL
    | where TimeGenerated > ago(1h)
    | where action_s in ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    | where actor_user_email_s !in ("admin1@example.com", "admin2@example.com")
    | project TimeGenerated, action_s, actor_user_email_s, actor_user_name_s, actor_user_id_s, entity_s, context_ip_address_s, context_user_agent_s
  aql: |
    SELECT eventtime, username, "Action", "Organization", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%slack%'
      AND "Action" IN ('organization_created', 'organization_deleted', 'organization_domain_changed', 'organization_public_url_updated')
      AND username NOT IN ('admin1@company.com', 'admin2@company.com', 'slack_admin@company.com')
    LAST 24 HOURS
  yara_l: |
    rule slack_unauthorized_org_changes {
      meta:
        author = "Detection Engineering"
        description = "Detects unauthorized organization configuration changes in Slack"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "Slack"
        (
          $e.metadata.product_event_type = "organization_created" or
          $e.metadata.product_event_type = "organization_deleted" or
          $e.metadata.product_event_type = "organization_domain_changed" or
          $e.metadata.product_event_type = "organization_public_url_updated"
        )
        $e.principal.user.userid = $user
        not $e.principal.user.userid in %slack_admins_list

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE action IN ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    | WHERE NOT user.name IN ("slack_admin1", "slack_admin2", "slack_admin3")
    | KEEP @timestamp, user.name, action, host.name, source.ip
  leql: |
    where(source_json.action IN ["organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated"] AND source_user NOT IN [slack_admin_1, slack_admin_2, slack_admin_3])
  crowdstrike: |
    #type=slack action IN ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    | NOT (user IN ("admin1@company.com", "admin2@company.com", "slackadmin@company.com"))
    | table([@timestamp, user, action, organization, ip_address])
  xql: |
    dataset = slack_audit_logs
    | filter action in ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    | alter is_admin = coalesce(actor_is_admin, false)
    | filter is_admin = false
    | fields _time, action, actor_user_id, actor_user_name, actor_user_email, organization_id, organization_name
  lucene: |
    action:("organization_created" OR "organization_deleted" OR "organization_domain_changed" OR "organization_public_url_updated") AND NOT user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Slack* (organization_created OR organization_deleted OR organization_domain_changed OR organization_public_url_updated)
    | json field=_raw "action" as action
    | json field=_raw "actor.user.email" as source_user
    | where action in ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")
    | where !(source_user in ("admin1@company.com", "admin2@company.com"))
    | fields _messageTime, action, source_user, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is IN ("organization_created", "organization_deleted", "organization_domain_changed", "organization_public_url_updated")

  Where the Source User is NOT on the Slack Admins List'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

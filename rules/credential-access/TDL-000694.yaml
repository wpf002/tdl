rule_id: TDL-CA-000694
v4_id: 000694
name: Directory Service Restore Mode Account Password Modification
description: Detects potential attempts made to set the Directory Services Restore Mode administrator password. The Directory Service Restore
  Mode (DSRM) account is a local administrator account on Domain Controllers. Attackers may change the password in order to obtain persistence.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4794'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4794

    | table _time, ComputerName, Account_Name, Subject_Account_Name, Subject_Domain_Name, Caller_Computer_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4794
    | project TimeGenerated, Computer, Account, SubjectUserName, SubjectDomainName, TargetUserName, TargetDomainName, EventData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Target Username", sourceip, destinationip
    FROM events
    WHERE "EventID" = '4794'
    LAST 24 HOURS
  yara_l: |
    rule windows_dpapi_master_key_backup_attempt {
      meta:
        author = "TDL"
        description = "Detects attempts to backup DPAPI Master Key (Event ID 4794) which may indicate credential access activity"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_RESOURCE_ACCESS"
        $e.metadata.product_event_type = "4794"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4794"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.SubjectUserName, winlog.event_data.SubjectDomainName, winlog.event_data.TargetUserName, winlog.computer_name
  leql: |
    where(source_json.EventID=4794)
  crowdstrike: |
    EventCode=4794
    | table([@timestamp, ComputerName, SubjectUserName, SubjectDomainName, TargetUserName, CallerProcessName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4794
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_SubjectDomainName
  lucene: |
    event.code:4794
  sumo: |
    _sourceCategory=*Windows*Security* "4794"
    | json field=_raw "EventID" as event_id
    | where event_id = "4794"
    | fields _messageTime, _sourceHost, event_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Security Event

  Where the Event ID is 4794'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

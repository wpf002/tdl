rule_id: TDL-CA-000695
v4_id: 000695
name: DSRM Persistence Usage
description: Detects the usages of a DSRM account for persistence on a host. The DSRM account, being a local administrator account on the DC,
  is not subject to domain password policies. However, by default, its use is limited to specific conditions, such as when the DC is booted into
  DSRM. These limitations can be bypassed by altering the registry key responsible for the account’s logon behavior.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4657'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=4657 Object_Name="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior"
    (New_Value=1 OR New_Value=2 OR Old_Value=1 OR Old_Value=2)

    | table _time, ComputerName, SubjectUserName, Object_Name, Old_Value, New_Value, Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4657
    | where ObjectName has "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior"
    | extend NewValue = tostring(parse_json(EventData).NewValue)
    | extend OldValue = tostring(parse_json(EventData).OldValue)
    | where NewValue in ("1", "2") or OldValue in ("1", "2")
    | project TimeGenerated, Computer, Account, ObjectName, OldValue, NewValue, ProcessName, SubjectUserName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Object Name" AS registry_key, "New Value", "Old Value"
    FROM events
    WHERE "EventID" = '4657'
      AND "Object Name" ILIKE '%HKLM\\System\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior%'
      AND ("New Value" IN ('1', '2') OR "Old Value" IN ('1', '2'))
    LAST 24 HOURS
  yara_l: |
    rule dsrm_admin_logon_behavior_modified {
      meta:
        author = "TDL"
        description = "Detects modification of DSRM admin logon behavior registry key (T1078)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "REGISTRY_MODIFICATION"
        $e.metadata.product_event_type = "4657"
        re.regex($e.target.registry.registry_key, `(?i)HKLM\\System\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior`)
        (
          re.regex($e.target.registry.registry_value_data, `(?i)1`) or
          re.regex($e.target.registry.registry_value_data, `(?i)2`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE event.code == "4657"
      AND winlog.event_data.ObjectName LIKE "*HKLM\\System\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior*"
      AND (winlog.event_data.NewValue IN ("1", "2") OR winlog.event_data.OldValue IN ("1", "2"))
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ObjectName, winlog.event_data.OldValue, winlog.event_data.NewValue, winlog.event_data.ProcessName
  leql: |
    where(source_json.EventID=4657 AND source_json.ObjectName ICONTAINS "HKLM\System\CurrentControlSet\Control\Lsa\DsrmAdminLogonBehavior" AND (source_json.NewValue IN [1, 2] OR source_json.OldValue IN [1, 2]))
  crowdstrike: |
    EventCode=4657 ObjectName=*HKLM\System\CurrentControlSet\Control\Lsa\DsrmAdminLogonBehavior* (NewValue=1 OR NewValue=2 OR OldValue=1 OR OldValue=2)
    | table([@timestamp, ComputerName, SubjectUserName, ObjectName, OperationType, OldValue, NewValue])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4657
    | filter action_evtlog_message ~= "(?i)HKLM\\\\System\\\\CurrentControlSet\\\\Control\\\\Lsa\\\\DsrmAdminLogonBehavior"
    | filter action_evtlog_message ~= "(?:New Value|Old Value).*[12]"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_data_ObjectName
  lucene: |
    event.code:4657 AND winlog.event_data.ObjectName:*\\System\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior AND (winlog.event_data.NewValue:(1 OR 2) OR winlog.event_data.OldValue:(1 OR 2))
  sumo: |
    _sourceCategory=*Windows*Security* "4657"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectName" as object_name
    | json field=_raw "NewValue" as new_value
    | json field=_raw "OldValue" as old_value
    | where event_id = "4657"
    | where object_name matches "*HKLM\\System\\CurrentControlSet\\Control\\Lsa\\DsrmAdminLogonBehavior*"
    | where new_value in ("1", "2") or old_value in ("1", "2")
    | fields _messageTime, _sourceHost, object_name, old_value, new_value
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Security Event

  Where the Event ID is 4657

  Where the Key is HKLM\System\CurrentControlSet\Control\Lsa\DsrmAdminLogonBehavior

  Where the New Value/Old Value is 1 OR 2'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'

rule_id: TDL-CA-000699
v4_id: 000699
name: Guest User Privilege Escalation
description: Detects when an account has been changed from Guest to a normal user.
tactic: Credential Access
tactic_id: TA0006
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- 1Password
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name="*.+*"

    | stats count dc(ComputerName) as host_count dc(User) as user_count by process_name, parent_process_name, command_line

    | where count >= 1

    | sort - count

    | table process_name, parent_process_name, command_line, count, host_count, user_count

    '
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend ProcessName = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend CommandLine = tostring(EventData.CommandLine)
    | where ProcessName matches regex @".*\+.*"
    | summarize Count = count(), Hosts = dcount(Computer), Users = dcount(tostring(EventData.User)) by ProcessName, ParentProcessName, CommandLine
    | where Count >= 1
    | sort by Count desc
    | project ProcessName, ParentProcessName, CommandLine, Count, Hosts, Users
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, LOGSOURCENAME(logsourceid) AS host, username, COUNT(*) AS occurrence_count
    FROM events
    WHERE "EventID" = '1' AND "Process Name" MATCHES '.*\\.\\+.*'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING occurrence_count >= 1
    ORDER BY occurrence_count DESC
    LAST 24 HOURS
  yara_l: |
    rule credential_access_account_privilege_change {
      meta:
        author = "Detection Engineer"
        description = "Detects Sysmon Process Creation events matching account privilege change pattern"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "1"
        re.regex($e.target.process.file.full_path, `.+\..+`)
        $e.target.process.file.full_path = $process_name
        $e.principal.process.file.full_path = $parent_process_name
        $e.target.process.command_line = $command_line

      match:
        $process_name, $parent_process_name, $command_line over 1h

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == 1 AND process.name LIKE "*.*"
    | STATS count = COUNT(*), hosts = COUNT_DISTINCT(host.name), users = COUNT_DISTINCT(user.name) BY process.name, process.parent.name, process.command_line
    | WHERE count >= 1
    | SORT count DESC
    | KEEP process.name, process.parent.name, process.command_line, count, hosts, users
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\+.*/) groupby(process_name, parent_process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 event_platform=Win FileName=*.+*
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=count(as=cnt))
    | cnt >= 1
    | sort(cnt, order=desc, limit=10000)
    | table([FileName, ParentBaseFileName, CommandLine, cnt])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_evtlog_event_id = 1 and action_process_image_name ~= ".*\+.*"
    | comp count() as occurrence_count, count_distinct(agent_hostname) as unique_hosts, count_distinct(actor_effective_username) as unique_users by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter occurrence_count >= 1
    | sort desc occurrence_count
    | fields action_process_image_name, actor_process_image_name, action_process_image_command_line, occurrence_count, unique_hosts, unique_users
  lucene: |
    sourcetype:Sysmon AND EventCode:1 AND process_name:*\+*
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*Windows*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id = "1" and process_name matches "*.+*"
    | count as occurrence_count by process_name, parent_process_name, command_line
    | where occurrence_count >= 1
    | sort by occurrence_count desc
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- credential-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the read / dump / brute-force pattern is consistent
  with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 Instance within any time window of a Sysmon Process Creation event where the process name matches a pattern indicating account
  privilege change activity.


  From index=endpoint

  Where sourcetype=Sysmon

  With EventCode=1

  Where process_name matches wildcard pattern "*.+*"


  Grouped by process_name, parent_process_name, and command_line

  With a minimum count of 1 occurrence across observed hosts and users

  With the same process_name, parent_process_name, and command_line as the correlation key

  Sorted by highest count first with no minimum deduplication spacing required'

rule_id: TDL-CA-000746
v4_id: '000746'
name: Anonymous NetrServerPasswordSet2 to Domain Controller
description: Successful NetrServerPasswordSet2 / NetrServerAuthenticate3 from anonymous session against a DC. Zerologon (CVE-2020-1472) signature.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1212 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1212
technique_name: Exploitation for Credential Access
platform:
- Windows
data_sources:
- EDR
- Windows Event Log
severity: Critical
fidelity: Medium
lifecycle: Proposed
risk_score: 85
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=4624 OR EventCode=4742 OR EventCode=5805) \n    (Account_Name=\"ANONYMOUS\
    \ LOGON\" OR LogonType=3) \n    ComputerName=\"*DC*\" \n    (Message=\"*NetrServerPasswordSet2*\" OR Message=\"*NetrServerAuthenticate3*\"\
    \ OR Keywords=\"*0x8010000000000000*\")\n| stats count values(EventCode) as EventCodes values(Account_Name) as Accounts values(Source_Network_Address)\
    \ as SourceIPs by _time, ComputerName\n| where count > 0\n| table _time, ComputerName, EventCodes, Accounts, SourceIPs, count\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4742
    | where SubjectUserName == "ANONYMOUS LOGON"
    | where TargetUserName endswith "$"
    | where Computer has "DC" or Computer has "Domain Controller"
    | project TimeGenerated, Computer, SubjectUserName, SubjectLogonId, TargetUserName, TargetDomainName, IpAddress, WorkstationName
  aql: "SELECT eventtime, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS domain_controller, \"EventID\", \"Account Name\" AS account,\
    \ \"Workstation Name\", \"Source Network Address\", COUNT(*) AS event_count\nFROM events\nWHERE (\"EventID\" IN ('4742', '4624', '5805') OR\
    \ \"Event ID\" IN ('4742', '4624', '5805'))\n  AND ((\"Account Name\" = 'ANONYMOUS LOGON' OR \"Account Name\" ILIKE '%anonymous%') \n    \
    \   OR (\"Logon Type\" = '3' AND (\"Account Name\" = '' OR \"Account Name\" IS NULL)))\n  AND (logsourceid IN (SELECT logsourceid FROM events\
    \ WHERE \"EventID\" IN ('4662', '5136') AND \"Object Type\" ILIKE '%domain%controller%' LAST 1 DAYS)\n       OR LOGSOURCENAME(logsourceid)\
    \ ILIKE '%DC%' \n       OR LOGSOURCENAME(logsourceid) ILIKE '%domain%controller%')\nGROUP BY eventtime, sourceip, destinationip, logsourceid,\
    \ \"EventID\", \"Account Name\", \"Workstation Name\", \"Source Network Address\"\nLAST 1 HOURS\n"
  yara_l: "rule zerologon_cve_2020_1472 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Zerologon (CVE-2020-1472) exploitation via\
    \ NetrServerPasswordSet2 or NetrServerAuthenticate3 from anonymous session\"\n    mitre_attack_tactic = \"Credential Access\"\n    mitre_attack_technique\
    \ = \"T1212\"\n    severity = \"CRITICAL\"\n\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\" or\n    $e.metadata.event_type\
    \ = \"USER_LOGIN\" or\n    $e.metadata.event_type = \"GENERIC_EVENT\"\n    \n    (re.regex($e.metadata.product_event_type, \"5805\") or\n\
    \     re.regex($e.metadata.description, \"(?i)NetrServerPasswordSet2\") or\n     re.regex($e.metadata.description, \"(?i)NetrServerAuthenticate3\"\
    ) or\n     re.regex($e.security_result.summary, \"(?i)NetrServerPasswordSet2\") or\n     re.regex($e.security_result.summary, \"(?i)NetrServerAuthenticate3\"\
    ))\n    \n    (re.regex($e.principal.user.userid, \"(?i)anonymous\") or\n     re.regex($e.principal.user.userid, \"(?i)null\") or\n     $e.principal.user.userid\
    \ = \"\" or\n     re.regex($e.target.user.userid, \"(?i)anonymous\") or\n     re.regex($e.target.user.userid, \"(?i)null\"))\n    \n    $e.security_result.action\
    \ = \"ALLOW\"\n    $e.target.hostname = $dc\n\n  match:\n    $dc over 5m\n\n  condition:\n    $e\n\n  outcome:\n    $risk_score = 95\n}\n"
  esql: "FROM logs-endpoint.events.network*, logs-windows.security*\n| WHERE @timestamp > NOW() - 1 hour\n  AND event.code IN (\"5156\", \"5145\"\
    ) \n  AND destination.port == 445\n  AND (network.protocol == \"smb\" OR network.transport == \"tcp\")\n  AND (winlog.event_data.ShareName\
    \ LIKE \"*IPC$*\" OR winlog.event_data.RelativeTargetName LIKE \"*\\\\netlogon*\" OR winlog.event_data.RelativeTargetName LIKE \"*\\\\samr*\"\
    )\n  AND (user.name == \"ANONYMOUS LOGON\" OR user.name == \"\" OR user.name IS NULL)\n| STATS connection_count = COUNT(*) BY source.ip, destination.ip,\
    \ host.name\n| WHERE connection_count >= 1\n"
  leql: |
    where(source_json.EventID=4742 AND source_json.SubjectUserName="-" AND (source_json.EventData ICONTAINS "NetrServerPasswordSet2" OR source_json.EventData ICONTAINS "NetrServerAuthenticate3")) groupby(source_address, asset) calculate(count)
  crowdstrike: "(event_simpleName=*Auth* OR EventCode=5805 OR EventCode=5829 OR EventCode=4742) \n(EventData.OpName=*NetrServerPasswordSet2* OR\
    \ EventData.OpName=*NetrServerAuthenticate3* OR Message=*NetrServerPasswordSet2* OR Message=*NetrServerAuthenticate3*)\n(EventData.ClientUserName=\"\
    ANONYMOUS LOGON\" OR SubjectUserName=\"ANONYMOUS LOGON\" OR UserName=\"ANONYMOUS LOGON\" OR Message=*\"ANONYMOUS LOGON\"*)\n| table([@timestamp,\
    \ ComputerName, EventCode, event_simpleName, SubjectUserName, UserName, EventData.OpName, EventData.ClientUserName, Message])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_NETWORK and agent_hostname ~= "(?i)dc|domain" and (action_evtlog_event_id in (5805, 5829) or (action_network_protocol = "RPC" and (action_evtlog_message contains "NetrServerPasswordSet2" or action_evtlog_message contains "NetrServerAuthenticate3"))) and (actor_effective_username = "ANONYMOUS LOGON" or actor_effective_username = "" or actor_effective_username = null or action_evtlog_event_data_SubjectUserName = "ANONYMOUS LOGON")
    | fields _time, agent_hostname, action_remote_ip, action_evtlog_event_id, action_evtlog_message, actor_effective_username, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_TargetUserName
  lucene: |
    event.code:(4742 OR 5805) AND winlog.event_data.SubjectUserName:"ANONYMOUS LOGON" AND winlog.event_data.SubjectLogonId:"0x0" AND (winlog.event_data.PasswordLastSet:* OR message:*NetrServerPasswordSet2* OR message:*NetrServerAuthenticate3*)
  sumo: |
    _sourceCategory=*Windows*Security* ("4742" OR "4624")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as computer
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "LogonType" as logon_type
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "SubjectUserName" as subject_user
    | where (event_id = "4742" AND target_user matches "*$" AND (subject_user = "ANONYMOUS LOGON" OR subject_user = ""))
       OR (event_id = "4624" AND logon_type = "3" AND target_user matches "*$" AND src_ip = "::1")
    | where computer matches "*DC*" OR computer matches "*DomainController*"
    | count by computer, target_user, subject_user, src_ip, event_id
    | fields computer, target_user, subject_user, src_ip, event_id

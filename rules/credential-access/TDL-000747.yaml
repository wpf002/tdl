rule_id: TDL-CA-000747
v4_id: '000747'
name: SMB Connection Following SCF/HTML UNC Trigger
description: Client SMB connection to external IP within 2s of opening a file or browsing a path. Forced-auth via SCF / .url / HTML img src=\\evil.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1187 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1187
technique_name: Forced Authentication
platform:
- Windows
data_sources:
- Network IDS
- Windows Event Log
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=wineventlog (EventCode=5156 OR EventCode=4663 OR EventCode=5145)
    | eval event_type=case(
        EventCode=5156 AND Application="\\device\\harddiskvolume*\\windows\\system32\\svchost.exe" AND DestAddress!="0.0.0.0" AND DestPort=445, "smb_connection",
        EventCode=4663 AND (ObjectName="*.scf" OR ObjectName="*.url" OR ObjectName="*.htm" OR ObjectName="*.html"), "file_access",
        EventCode=5145 AND (ShareName="\\\\*\\*.scf" OR ShareName="\\\\*\\*.url"), "share_access",
        1=1, "other"
    )
    | where event_type IN ("smb_connection", "file_access", "share_access")
    | eval smb_dest=if(event_type="smb_connection" AND match(DestAddress, "^(?!10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)"), DestAddress, null())
    | where isnotnull(smb_dest) OR event_type IN ("file_access", "share_access")
    | bin _time span=2s
    | stats values(event_type) as events, values(smb_dest) as external_ips, values(ObjectName) as files, values(ShareName) as shares by _time, ComputerName, Account_Name
    | where mvcount(events) > 1 AND isnotnull(external_ips)
    | table _time, ComputerName, Account_Name, events, external_ips, files, shares
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "smb"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%smb%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_ca_000747 {\n  meta:\n    author = \"TDL\"\n    description = \"SMB Connection Following SCF/HTML UNC Trigger\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0006\"\n    technique = \"T1187\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /smb/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%smb%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/smb/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*smb*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "smb"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*smb*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*smb*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '

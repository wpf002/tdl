rule_id: TDL-CA-000748
v4_id: 000748
name: SAML Token Issued With Impossible Lifetime
description: ADFS / Azure AD token with NotOnOrAfter > 24h, or SignatureCertificate fingerprint not in the published cert set. Golden-SAML forging
  signal. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1606 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1606
technique_name: Forge Web Credentials
platform:
- Azure
- AWS
- Windows
data_sources:
- Cloud Audit Logs
- ADFS Logs
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: |
    (index=azure OR index=aws OR index=cloud OR index=adfs) (sourcetype=azure:aad:audit OR sourcetype=aws:cloudtrail OR sourcetype=ADFS:Admin OR sourcetype=ADFS:Security OR sourcetype=WinEventLog:AD* OR source="*adfs*")
    ("NotOnOrAfter" OR "saml" OR "token" OR "SignatureCertificate" OR "assertion")
    | rex field=_raw "NotOnOrAfter[\"\':\s=]+(?<NotOnOrAfter_raw>[^\",\s\}]+)"
    | rex field=_raw "(?i)SignatureCertificate[\"\':\s=]+(?<cert_fingerprint>[0-9A-Fa-f:]+)"
    | rex field=_raw "(?i)thumbprint[\"\':\s=]+(?<thumbprint>[0-9A-Fa-f:]+)"
    | eval cert_id=coalesce(cert_fingerprint, thumbprint)
    | eval NotOnOrAfter_epoch=strptime(NotOnOrAfter_raw, "%Y-%m-%dT%H:%M:%S")
    | eval token_lifetime_hours=round((NotOnOrAfter_epoch - _time)/3600, 2)
    | eval suspicious_lifetime=if(token_lifetime_hours > 24, 1, 0)
    | lookup adfs_known_certs.csv fingerprint AS cert_id OUTPUT is_known
    | eval suspicious_cert=if(isnull(is_known) AND isnotnull(cert_id), 1, 0)
    | where suspicious_lifetime=1 OR suspicious_cert=1
    | eval alert_reason=case(suspicious_lifetime=1 AND suspicious_cert=1, "Token lifetime exceeds 24h AND unknown certificate", suspicious_lifetime=1, "Token lifetime exceeds 24h", suspicious_cert=1, "Unknown SignatureCertificate fingerprint", 1=1, "Unknown")
    | stats values(alert_reason) as reasons values(token_lifetime_hours) as token_lifetime_hours values(cert_id) as certificate_fingerprint values(NotOnOrAfter_raw) as NotOnOrAfter by _time, host, user, source, sourcetype
    | table _time, host, user, reasons, token_lifetime_hours, certificate_fingerprint, NotOnOrAfter, source, sourcetype
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000748 {\n  meta:\n    author = \"TDL\"\n    description = \"SAML Token Issued With Impossible Lifetime\"\n    severity\
    \ = \"CRITICAL\"\n    tactic = \"TA0006\"\n    technique = \"T1606\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n \
    \   $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: ADFS / Azure AD token with NotOnOrAfter > 24h, or SignatureCertificate fingerprint not in the published cert set. Golden-SAML forging
  signal.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

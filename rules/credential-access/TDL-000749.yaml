rule_id: TDL-CA-000749
v4_id: 000749
name: Domain Authentication Policy Modified to Disable Strong Auth
description: Domain GPO or Azure AD Conditional Access policy modified to remove MFA/strong-auth for privileged users. Lowers the bar for credential
  abuse. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1556 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1556
technique_name: Modify Authentication Process
platform:
- Windows
- Linux
- macOS
- Azure
- AWS
data_sources:
- Windows Event Log
- Sysmon
- Auditd
- Cloud Audit Logs
severity: Critical
fidelity: Medium
lifecycle: Proposed
risk_score: 85
queries:
  spl: |
    (index=wineventlog sourcetype=WinEventLog:Security (EventCode=5136 OR EventCode=5137) ObjectClass IN ("groupPolicyContainer","msDS-PasswordSettings") AttributeLDAPDisplayName IN ("gPCFileSysPath","msDS-PasswordComplexityEnabled","msDS-LockoutThreshold","msDS-MinimumPasswordLength","msDS-PasswordSettingsPrecedence") OpCorrelationID=*) OR (index=azure sourcetype=azure:aad:audit operationName IN ("Update conditional access policy","Delete conditional access policy") properties.targetResources{}.modifiedProperties{}.displayName IN ("BuiltInControls","GrantControls")) OR (index=aws sourcetype=aws:cloudtrail eventName IN ("PutUserPolicy","PutGroupPolicy","PutRolePolicy","DeleteUserPolicy","DeleteGroupPolicy","DeleteRolePolicy") requestParameters.policyDocument="*mfa*" OR requestParameters.policyName="*MFA*")
    | eval policy_type=case(
        isnotnull(ObjectClass), "Group Policy",
        sourcetype="azure:aad:audit", "Azure Conditional Access",
        sourcetype="aws:cloudtrail", "AWS IAM Policy",
        1=1, "Unknown")
    | eval target_object=coalesce(ObjectDN, properties.targetResources{}.displayName, requestParameters.userName, requestParameters.groupName, requestParameters.roleName)
    | eval actor=coalesce(SubjectUserName, properties.initiatedBy.user.userPrincipalName, userIdentity.principalId)
    | eval host_system=coalesce(ComputerName, host, eventSource)
    | stats count earliest(_time) as first_time latest(_time) as last_time values(AttributeLDAPDisplayName) as modified_attributes values(operationName) as operation values(eventName) as event_name by policy_type, target_object, actor, host_system
    | where count >= 1
    | table first_time, last_time, policy_type, actor, target_object, host_system, modified_attributes, operation, event_name, count
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000749 {\n  meta:\n    author = \"TDL\"\n    description = \"Domain Authentication Policy Modified to Disable Strong\
    \ Auth\"\n    severity = \"CRITICAL\"\n    tactic = \"TA0006\"\n    technique = \"T1556\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Domain GPO or Azure AD Conditional Access policy modified to remove MFA/strong-auth for privileged users. Lowers the bar for credential
  abuse.

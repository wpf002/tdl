rule_id: TDL-CA-000751
v4_id: '000751'
name: Repeated MFA Push Denials Followed by Approval
description: ≥5 MFA push denials for the same user in 10m, then a single approval. MFA-fatigue / push-bombing pattern. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1621 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1621
technique_name: MFA Request Generation
platform:
- Okta
- Microsoft 365
- Azure
data_sources:
- Identity Provider Logs
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=okta OR index=o365 OR index=azure sourcetype IN (OktaIM2:log, o365:management:activity, azure:monitor:aad)
    (eventType="system.push.send_factor_verify_push" OR Operation="UserLoginFailed" OR operationName="Sign-in activity")
    (result="DENIED" OR ResultStatus="failure" OR ResultDescription="MFA denied")
    | bin _time span=10m
    | stats count(eval(result="DENIED" OR ResultStatus="failure" OR ResultDescription="MFA denied")) as denials, count(eval(result="SUCCESS" OR ResultStatus="success" OR ResultDescription="MFA success")) as approvals, earliest(_time) as first_denial, latest(_time) as last_event by _time, user
    | where denials >= 5 AND approvals >= 1
    | table _time, user, denials, approvals, first_denial, last_event
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_ca_000751 {\n  meta:\n    author = \"TDL\"\n    description = \"Repeated MFA Push Denials Followed by Approval\"\n   \
    \ severity = \"HIGH\"\n    tactic = \"TA0006\"\n    technique = \"T1621\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: ≥5 MFA push denials for the same user in 10m, then a single approval. MFA-fatigue / push-bombing pattern.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

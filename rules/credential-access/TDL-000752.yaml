rule_id: TDL-CA-000752
v4_id: '000752'
name: ADCS Certificate Issued With SAN Override
description: EID 4886/4887 with explicit SubjectAltName UPN that does not match the requesting account. ADCS ESC1/ESC6 abuse. Generated from gap
  analysis against canonical ATT&CK Enterprise matrix (T1649 under Credential Access).
tactic: Credential Access
tactic_id: TA0006
technique_id: T1649
technique_name: Steal or Forge Authentication Certificates
platform:
- Windows
data_sources:
- Windows Event Log
- ADCS Logs
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=4886 OR EventCode=4887) Request_Attributes="*upn:*"

    | rex field=Request_Attributes "upn:(?<san_upn>[^\r\n]+)"

    | eval san_upn=lower(trim(san_upn))

    | eval requester=lower(coalesce(Account_Name, SubjectUserName))

    | where isnotnull(san_upn) AND san_upn != requester

    | table _time, ComputerName, EventCode, requester, san_upn, Request_Attributes, Certificate_Template

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (4886, 4887)
    | extend RequestorAccount = tolower(coalesce(SubjectUserName, Account))
    | extend RequestorDomain = tolower(coalesce(SubjectDomainName, ""))
    | extend RequestorUPN = strcat(RequestorAccount, "@", RequestorDomain)
    | extend Attributes = tostring(column_ifexists("Attributes", ""))
    | where Attributes has "upn="
    | extend ExtractedUPN = extract(@"(?i)upn=([^\s&]+)", 1, Attributes)
    | where isnotempty(ExtractedUPN)
    | extend ExtractedUPNLower = tolower(ExtractedUPN)
    | where ExtractedUPNLower != RequestorUPN and ExtractedUPNLower != tolower(strcat(RequestorAccount, "@"))
    | project TimeGenerated, Computer, EventID, RequestorAccount, RequestorDomain, RequestorUPN, ExtractedUPN, Attributes, TargetUserName, Activity
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, "EventID", username AS requesting_account, "Subject" AS certificate_subject, "Subject Alternative Name" AS subject_alt_name, "Certificate Template" AS cert_template, sourceip
    FROM events
    WHERE ("EventID" = '4886' OR "EventID" = '4887')
      AND "Subject Alternative Name" IS NOT NULL
      AND "Subject Alternative Name" != ''
      AND LOWER("Subject Alternative Name") NOT ILIKE LOWER(CONCAT('%', username, '%'))
    LAST 24 HOURS
  yara_l: |
    rule adcs_esc1_esc6_subject_altname_mismatch {
      meta:
        author = "TDL"
        description = "Detects ADCS ESC1/ESC6 abuse via SubjectAltName mismatch (T1649)"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1649"
        severity = "HIGH"

      events:
        ($e.metadata.event_type = "GENERIC_EVENT" or $e.metadata.event_type = "USER_RESOURCE_ACCESS")
        ($e.metadata.product_event_type = "4886" or $e.metadata.product_event_type = "4887")
        $e.principal.user.userid = $requesting_account
        $e.target.user.userid = $san_upn
        $requesting_account != $san_upn
        $e.principal.hostname = $host

      match:
        $host, $requesting_account, $san_upn over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE winlog.event_id IN (4886, 4887)
      AND winlog.event_data.Attributes LIKE "*SAN:*upn=*"
      AND winlog.event_data.Attributes NOT LIKE CONCAT("*upn=", user.name, "@*")
    | EVAL requested_upn = REPLACE(REPLACE(winlog.event_data.Attributes, ".*SAN:.*upn=([^&\\s]+).*", "$1"), winlog.event_data.Attributes, "extracted")
    | KEEP @timestamp, host.name, user.name, winlog.event_id, winlog.event_data.Attributes, winlog.event_data.TemplateName, requested_upn
  leql: |
    where(source_json.EventID IN [4886, 4887] AND source_json.CertificateSubjectAlternativeName ICONTAINS "upn=" AND source_json.CertificateSubjectAlternativeName != source_json.SubjectUserName) groupby(asset, source_json.SubjectUserName, source_json.CertificateSubjectAlternativeName) calculate(count)
  crowdstrike: |
    (EventCode=4886 OR EventCode=4887) Attributes=*san:upn=*
    | regex("san:upn=(?<san_upn>[^&\s]+)", field=Attributes)
    | san_upn!=SubjectUserName
    | table([@timestamp, ComputerName, SubjectUserName, san_upn, Attributes, RequestId])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (4886, 4887)
    | alter subject_user = coalesce(action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_RequesterName)
    | alter san_upn = arrayindex(regextract(action_evtlog_message, "san:upn=([^,\s]+)"), 0)
    | filter san_upn != null and san_upn != "" and lowercase(san_upn) != lowercase(subject_user)
    | fields _time, agent_hostname, action_evtlog_event_id, subject_user, san_upn, action_evtlog_event_data_CertificateTemplate, action_evtlog_message
  lucene: |
    (event.code:(4886 OR 4887) OR winlog.event_id:(4886 OR 4887)) AND _exists_:winlog.event_data.Attributes AND winlog.event_data.Attributes:*san:upn* AND NOT (winlog.event_data.SubjectUserName:* AND winlog.event_data.Attributes:*san\:upn\=*winlog.event_data.SubjectUserName*)
  sumo: |
    _sourceCategory=*ADCS* OR _sourceCategory=*Windows* (4886 OR 4887)
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as subject_user
    | json field=_raw "Attributes" as attributes
    | where event_id in ("4886", "4887")
    | where attributes matches "*san:upn=*"
    | parse regex field=attributes "san:upn=(?<san_upn>[^&\s]+)"
    | where san_upn != subject_user
    | fields _messageTime, _sourceHost, event_id, subject_user, san_upn, attributes
pseudo_logic: EID 4886/4887 with explicit SubjectAltName UPN that does not match the requesting account. ADCS ESC1/ESC6 abuse.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:

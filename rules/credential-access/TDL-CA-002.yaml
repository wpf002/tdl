rule_id: TDL-CA-002
name: Kerberoasting - Large Volume TGS Requests
tactic: Credential Access
tactic_id: TA0006
technique_id: T1558.003
technique_name: Kerberoasting
platform:
- Windows
data_sources:
- Windows Security Event Log (4769)
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 85
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4769

    | stats count by Account_Name, IpAddress, Logon_Type, EventCode

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where EventID == 4769
    | summarize count_ = count() by Account, IpAddress, LogonType, EventID
    | where count_ >= 1
    | sort by count_ desc
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '4769'
    GROUP BY username, sourceip, "Logon Type", "EventID"
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule kerberos_service_ticket_request_t1558_003 {
      meta:
        author = "Detection Engineering"
        description = "Detects Kerberos Service Ticket Requests (Event ID 4769) - MITRE T1558.003"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1558.003"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.metadata.product_event_type = "4769"
        $e.target.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_log_id = $logon_type

      match:
        $user, $ip over 24h

      outcome:
        $risk_score = 35
        $user_count = count_distinct($user)
        $ip_count = count_distinct($ip)
        $event_count = count($e.metadata.product_event_type)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4769"
    | STATS count = COUNT(*) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=4769) groupby(source_json.TargetUserName, source_json.IpAddress) calculate(count)
  crowdstrike: |
    EventCode=4769
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=count(as=cnt))
    | cnt >= 1
    | sort(cnt, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4769
    | comp count() as event_count by action_evtlog_event_data_TargetUserName, action_evtlog_event_data_IpAddress, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter event_count >= 1
    | sort desc event_count
    | fields action_evtlog_event_data_TargetUserName, action_evtlog_event_data_IpAddress, action_evtlog_event_data_LogonType, action_evtlog_event_id, event_count
  lucene: |
    event.code:4769 OR EventID:4769 OR winlog.event_id:4769
  sumo: |
    _sourceCategory=*Windows*Security* "4769"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | json field=_raw "EventCode" as EventCode
    | where event_id = "4769"
    | count as event_count by user, IpAddress, LogonType, EventCode
    | where event_count >= 1
    | sort by event_count desc
false_positives:
- Monitoring tools enumerating SPNs
tags:
- kerberoasting
- active-directory
- credential-access
author: TDL
created: '2024-02-02'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 or more instances over any period of Windows Security Event Log event_id 4769 (Kerberos Service Ticket Request).


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4769

  With stats aggregated by user, IpAddress, LogonType, and EventCode

  Where count of matching events is greater than or equal to 1

  With the same user and IpAddress as the correlation key, sorted descending by count'

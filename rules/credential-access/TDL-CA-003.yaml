rule_id: TDL-CA-003
name: Password Spraying Against Active Directory
tactic: Credential Access
tactic_id: TA0006
technique_id: T1110.003
technique_name: Password Spraying
platform:
- Windows
data_sources:
- Windows Security Event Log (4625)
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 80
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4625

    | stats count by Account_Name, IpAddress, Logon_Type, EventCode

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4625
    | summarize count() by TargetAccount, IpAddress, LogonType, EventID
    | where count_ >= 1
    | sort by count_ desc
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", COUNT(*) AS failed_attempts
    FROM events
    WHERE "EventID" = '4625'
    GROUP BY username, sourceip, "Logon Type", "EventID"
    HAVING failed_attempts >= 1
    ORDER BY failed_attempts DESC
    LAST 1 HOURS
  yara_l: |
    rule mitre_t1110_003_failed_logon {
      meta:
        author = "Detection Engineer"
        description = "Detects failed logon attempts - MITRE T1110.003 Credential Access"
        mitre_attack_tactic = "Credential Access"
        mitre_attack_technique = "T1110.003"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.metadata.product_event_type = "4625"
        $e.target.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_log_id = $logon_type
        $e.metadata.product_event_type = $event_code

      match:
        $user, $ip, $logon_type, $event_code over 1h

      condition:
        #e >= 1

      outcome:
        $risk_score = 35
        $user
        $ip
        $logon_type
        $event_code
        $failed_logon_count = #e
    }
  esql: |
    FROM logs-system.security*
    | WHERE event.code == "4625"
    | STATS count = COUNT(*) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=4625) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventCode) calculate(count)
  crowdstrike: |
    EventCode=4625
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=count(as=event_count))
    | event_count >= 1
    | sort(event_count, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4625
    | comp count() as event_count by action_evtlog_event_data_TargetUserName, action_evtlog_event_data_IpAddress, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    event.code:4625
  sumo: |
    _sourceCategory=*Windows*Security* "4625"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | where event_id = "4625"
    | count as cnt by user, IpAddress, LogonType, event_id
    | where cnt >= 1
    | sort by cnt desc
false_positives:
- Misconfigured applications
- VDI spin-up
tags:
- password-spray
- brute-force
- credential-access
author: TDL
created: '2024-02-03'
test_method: historical
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host (LSASS / DC / KDC) or identity provider, and the source process / actor.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the read / dump / brute-force pattern
  is consistent with this technique.
- 'Pull preceding execution / discovery telemetry: many credential-access actions follow process-injection or LSASS tooling.'
- 'Compute the blast radius: which accounts could have been exposed (enumerate cached credentials, recent session tokens, kerberos tickets).'
- 'Decide TP / FP: FP for sanctioned IR / pen-test / DSC tooling; TP for unattended dumping or anomalous Kerberos behavior.'
- 'If TP: rotate all potentially exposed credentials and tickets, invalidate sessions, isolate the host, and consider golden-ticket / krbtgt rotation
  if scope warrants.'
pseudo_logic: '1 or more instances over the search window of Windows Security Event ID 4625 (Failed Logon).


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4625

  With count of matching events grouped by user, IpAddress, LogonType, and EventCode being greater than or equal to 1

  With results sorted descending by count

  With the same user, IpAddress, LogonType, and EventCode as the correlation key'

rule_id: TDL-DE-000028
v4_id: 000028
name: Suspicious Inbox Forwarding
description: Detects a new email forwarding or redirect rule to an unauthorized email address.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1020
technique_name: Automated Exfiltration
platform:
- Microsoft 365
data_sources:
- Exchange
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=o365 sourcetype=o365:management:activity Operation=\"New-InboxRule\" \n| rex field=Parameters \"ForwardTo=(?<ForwardTo>[^,\\s]+)\"\
    \ \n| rex field=Parameters \"RedirectTo=(?<RedirectTo>[^,\\s]+)\" \n| eval forward_target=coalesce(ForwardTo, RedirectTo) \n| rex field=forward_target\
    \ \"@(?<target_domain>[^>\\\"]+)\" \n| search NOT target_domain IN (\"your-org-domain.com\", \"subsidiary-domain.com\") \n| table _time, UserId,\
    \ ClientIP, target_domain, forward_target, Parameters\n```\n\nOR\n\n```\nindex=o365 sourcetype=o365:management:activity Operation=\"AlertTriggered\"\
    \ Name=\"Suspicious inbox forwarding\" \n| table _time, UserId, ClientIP, Name, AlertEntityId, Data\n```\n\nOR\n\n```\nindex=mcas sourcetype=mcas:activity\
    \ activity_type=\"ADMIN_EVENT\" activity_name=\"Create inbox rule\" \n| search NOT target_domain IN (\"your-org-domain.com\") \n| table _time,\
    \ user, ip_address, activity_name, target_domain\n"
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "Exchange"
    | where Operation == "New-InboxRule"
    | extend ForwardingParameters = parse_json(Parameters)
    | mv-expand ForwardingParameters
    | extend ParameterName = tostring(ForwardingParameters.Name)
    | extend ParameterValue = tostring(ForwardingParameters.Value)
    | where ParameterName in ("ForwardTo", "ForwardAsAttachmentTo", "RedirectTo")
    | extend ForwardingAddress = ParameterValue
    | where isnotempty(ForwardingAddress)
    | extend ForwardingDomain = extract(@"@(.+?)(?:;|$)", 1, ForwardingAddress)
    | where ForwardingDomain !endswith ".onmicrosoft.com"
    | where ForwardingDomain !in ("yourdomain.com")
    | project TimeGenerated, UserId, ClientIP, Operation, ForwardingAddress, ForwardingDomain, OfficeObjectId
    | union (
        SecurityAlert
        | where TimeGenerated > ago(24h)
        | where AlertName == "Suspicious inbox forwarding"
        | where ProviderName == "OATP"
        | project TimeGenerated, CompromisedEntity, AlertName, AlertSeverity, Description
    )
    | union (
        McasShadowItReporting
        | where TimeGenerated > ago(24h)
        | where ActivityType == "EVENT_CATEGORY_CREATE_INBOX_RULE"
        | project TimeGenerated, User = UserName, ActivityType, RawEventData
    )
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS log_source, "Operation", "ForwardTo", "RedirectTo", "AlertName"
    FROM events
    WHERE (("Operation" = 'New-InboxRule' AND ("ForwardTo" IS NOT NULL OR "RedirectTo" IS NOT NULL))
       OR ("Operation" = 'AlertTriggered' AND "AlertName" ILIKE '%Suspicious inbox forwarding%'))
      AND LOGSOURCENAME(logsourceid) ILIKE '%Office 365%'
    LAST 24 HOURS
  yara_l: "rule o365_suspicious_inbox_forwarding {\n  meta:\n    author = \"TDL\"\n    description = \"Detects suspicious inbox forwarding rules\
    \ in O365 Exchange\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1020\"\n    severity = \"Medium\"\n \
    \   \n  events:\n    // O365 Exchange New-InboxRule with external forwarding\n    $exchange.metadata.product_name = \"Microsoft 365\"\n  \
    \  $exchange.metadata.product_event_type = \"New-InboxRule\"\n    $exchange.target.user.userid = $user\n    (\n      re.regex($exchange.security_result.summary,\
    \ `(?i)(forward|redirect)`) or\n      re.regex($exchange.additional.fields.value.string_value, `(?i)(forward|redirect)`)\n    )\n    // Exclude\
    \ internal domains - adjust these to match your organization\n    not re.regex($exchange.security_result.summary, `(?i)@(yourcompany\\.com|yourdomain\\\
    .net)`)\n    not re.regex($exchange.additional.fields.value.string_value, `(?i)@(yourcompany\\.com|yourdomain\\.net)`)\n    \n    // O365\
    \ ATP Alert for suspicious inbox forwarding\n    $atp.metadata.product_name = \"Microsoft 365\"\n    $atp.metadata.product_event_type = \"\
    AlertTriggered\"\n    (\n      re.regex($atp.security_result.summary, `(?i)suspicious inbox forwarding`) or\n      re.regex($atp.metadata.description,\
    \ `(?i)suspicious inbox forwarding`)\n    )\n    $atp.target.user.userid = $user_atp\n    \n    // MCAS Event\n    $mcas.metadata.product_name\
    \ = \"Microsoft Cloud App Security\"\n    $mcas.target.user.userid = $user_mcas\n\n  match:\n    $user over 1h\n    \n  condition:\n    $exchange\
    \ or $atp or $mcas\n}\n"
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hours\n  AND (\n    (event.action == \"New-InboxRule\" \n     AND o365.audit.Parameters.ForwardTo\
    \ IS NOT NULL \n     AND NOT o365.audit.Parameters.ForwardTo LIKE \"*@yourorganization.com\")\n    OR\n    (event.action == \"New-InboxRule\"\
    \ \n     AND o365.audit.Parameters.RedirectTo IS NOT NULL \n     AND NOT o365.audit.Parameters.RedirectTo LIKE \"*@yourorganization.com\"\
    )\n    OR\n    (event.action == \"AlertTriggered\" \n     AND o365.audit.Name == \"Suspicious inbox forwarding\")\n    OR\n    (event.dataset\
    \ == \"o365.audit\" \n     AND o365.audit.Source == \"Microsoft Cloud App Security\")\n  )\n| KEEP @timestamp, event.action, user.name, o365.audit.Parameters.ForwardTo,\
    \ o365.audit.Parameters.RedirectTo, o365.audit.Name, o365.audit.Source, host.name\n"
  leql: |
    where(source_json.Operation="New-InboxRule" AND source_json.ForwardTo NOT IN ["yourdomain.com", "yourorgdomain.com"])
  crowdstrike: |
    (#type=O365Exchange Operation="New-InboxRule" ForwardTo=* NOT ForwardTo=*@yourorganization.com)
    OR (#type=O365ATP Operation="AlertTriggered" Name="Suspicious inbox forwarding")
    OR (#type=MCAS Operation=*forward*)
    | table([@timestamp, Operation, Name, ForwardTo, ForwardAsAttachmentTo, RedirectTo, UserPrincipalName, UserId, ComputerName])
  xql: |
    dataset = o365_audit_logs
    | filter Operation in ("New-InboxRule", "AlertTriggered")
    | filter (Operation = "New-InboxRule" and (ForwardTo != null or RedirectTo != null) and not (ForwardTo ~= "@(yourorgdomain\.com|yourdomain\.onmicrosoft\.com)" or RedirectTo ~= "@(yourorgdomain\.com|yourdomain\.onmicrosoft\.com)")) or (Operation = "AlertTriggered" and AlertName = "Suspicious inbox forwarding")
    | fields _time, UserId, Operation, Parameters, ForwardTo, RedirectTo, AlertName, ClientIP
  lucene: |
    (Operation:"New-InboxRule" AND NOT ForwardingSmtpAddress:*@yourdomain.com AND NOT RedirectTo:*@yourdomain.com AND NOT ForwardAsAttachmentTo:*@yourdomain.com) OR (Operation:"AlertTriggered" AND Name:"Suspicious inbox forwarding") OR (Workload:"Microsoft Cloud App Security" AND Operation:"New-InboxRule")
  sumo: |
    _sourceCategory=*Exchange* OR _sourceCategory=*O365* OR _sourceCategory=*Office365*
    | json field=_raw "Operation" as operation
    | json field=_raw "Parameters" as parameters
    | json field=_raw "Name" as alert_name
    | where (operation = "New-InboxRule" and parameters matches "*ForwardTo*" and NOT (parameters matches "*@yourdomain.com*" OR parameters matches "*@yourorg.com*"))
       OR (operation = "AlertTriggered" and alert_name = "Suspicious inbox forwarding")
       OR (operation matches "*InboxRule*" and parameters matches "*Redirect*" and NOT (parameters matches "*@yourdomain.com*" OR parameters matches "*@yourorg.com*"))
    | fields _messageTime, _sourceHost, operation, parameters, alert_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 O365 Exchange event \nWhere the operation is \"New-InboxRule\"\nWhere the Forward/Redirect Target Domain is not owned by the\
  \ organization\n\n---------------------------------------------------------------------------------------------------------------\n\n1 O365\
  \ ATP Alert Event\nWhere the Operation is \"AlertTriggered\"\nWhere the Alert Name is \"Suspicious inbox forwarding\"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 MCAS Event"
suppression:
  window: 8 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000032
v4_id: '000032'
name: Audit Log Cleared
description: 'Detects when the Windows OS security log is cleared on a host. Attackers could attempt to erase their tracks by clearing logs that
  contains record of their malicious activity.


  Detects when the Linux security log is cleared on a host. Attackers could attempt to erase their tracks by clearing logs that contains record
  of their malicious activity.'
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070
technique_name: Indicator Removal on Host
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 1102'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: '(index=wineventlog sourcetype=WinEventLog:Security EventCode IN (517, 1102)) OR (index=wineventlog sourcetype=WinEventLog:System EventCode=104)
    OR (index=wineventlog Source="Microsoft-Windows-Eventlog")

    | search NOT [| inputlookup high_value_targets.csv | fields ComputerName | format]

    | table _time, ComputerName, EventCode, Source, sourcetype, User, Message

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where (EventSourceName =~ "Microsoft-Windows-Eventlog")
        or (Channel =~ "Security" and EventID in (517, 1102))
        or (Channel =~ "System" and EventID == 104)
    | where Computer !in (dynamic(["hvt-host1","hvt-host2"]))
    | project TimeGenerated, Computer, EventID, Channel, EventSourceName, Account, Activity
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS hostname, \"EventID\", categoryname(category), username, sourceip\nFROM events\nWHERE\
    \ (\n    (\"EventID\" IN ('517', '1102', '104') AND categoryname(category) IN ('Security', 'System'))\n    OR \n    (LOGSOURCENAME(logsourceid)\
    \ ILIKE '%Microsoft-Windows-Eventlog%')\n)\nAND LOGSOURCENAME(logsourceid) NOT IN ('HighValueHost1', 'HighValueHost2')\nLAST 24 HOURS\n"
  yara_l: "rule windows_audit_log_cleared {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Windows audit log clearing\
    \ events - MITRE T1070 Defense Evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1070\"\n    severity\
    \ = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_WIPE\"\n    (\n      $e.metadata.product_log_id = \"Security\"\
    \ and \n      ($e.metadata.product_event_type = \"517\" or $e.metadata.product_event_type = \"1102\")\n    ) or (\n      $e.metadata.product_log_id\
    \ = \"System\" and \n      $e.metadata.product_event_type = \"104\"\n    ) or (\n      re.regex($e.principal.process.file.full_path, `(?i)Microsoft-Windows-Eventlog`)\n\
    \    )\n    $e.target.hostname = $hostname\n    not re.regex($hostname, `(?i)(dc01|dc02|criticalserver)`)\n    \n  match:\n    $hostname over\
    \ 5m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-system.system*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (winlog.provider_name == "Microsoft-Windows-Eventlog")
        OR
        (winlog.channel == "Security" AND winlog.event_id IN (517, 1102))
        OR
        (winlog.channel == "System" AND winlog.event_id == 104)
      )
    | STATS count = COUNT(*) BY host.name, winlog.event_id, winlog.channel, winlog.provider_name, user.name, @timestamp
    | KEEP @timestamp, host.name, winlog.event_id, winlog.channel, winlog.provider_name, user.name, count
  leql: |
    where((source_json.EventID IN [517, 1102, 104] OR source_json.ProviderName="Microsoft-Windows-Eventlog") AND asset NOT IN [])
  crowdstrike: |
    (EventCode=1102 OR EventCode=517 OR EventCode=104 OR ProviderName="Microsoft-Windows-Eventlog")
    | table([@timestamp, ComputerName, EventCode, ProviderName, Channel, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (517, 1102, 104, 1100) and action_evtlog_source = "Microsoft-Windows-Eventlog")
        or (action_evtlog_event_id in (517, 1102) and action_evtlog_log_name = "Security")
        or (action_evtlog_event_id = 104 and action_evtlog_log_name = "System")
    | fields _time, agent_hostname, action_evtlog_event_id, action_evtlog_source, action_evtlog_log_name, actor_effective_username, action_evtlog_message
  lucene: |
    (event.provider:"Microsoft-Windows-Eventlog" OR (event.category:"security" AND event.code:(517 OR 1102)) OR (event.category:"system" AND event.code:104)) AND NOT host.name:(list_of_hvt_hostnames)
  sumo: |
    _sourceCategory=*Windows* (EventID=1102 OR EventID=517 OR EventID=104)
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as computer
    | json field=_raw "Channel" as channel
    | json field=_raw "Provider.Name" as provider_name
    | where (event_id = "1102" AND provider_name matches "*Microsoft-Windows-Eventlog*")
       OR (event_id = "517" AND channel = "Security")
       OR (event_id = "1102" AND channel = "Security")
       OR (event_id = "104" AND channel = "System")
    | where !(computer in ("HVT-HOST-1", "HVT-HOST-2", "HVT-HOST-3"))
    | fields _messageTime, computer, event_id, channel, provider_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Audit Log Cleared Event\nWhere the Source is \"Microsoft-Windows-Eventlog\"\nOR\n\tWhere the Event Type is \"Security\"\
  \n\tWhere the Event ID is in [517, 1102]\n\t\n\tWhere the Event Type is \"System\"\n\tWhere the Event ID is \"104\"\n\t\nWhere the Destination\
  \ Hostname is NOT in High Value Target Host List"
suppression:
  window: 12 hours
  fields:
  - Destination Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

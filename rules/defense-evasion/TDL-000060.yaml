rule_id: TDL-DE-000060
v4_id: '000060'
name: Rogue DHCP Server
description: Detects a host that is not a DHCP server communicating over DHCP ports to clients. An attacker can execute a man-in-the-middle attack
  by responding to a DHCP request before the legitimate server. The malicious DHCP lease can set the client’s default gateway to a compromised
  host, where the attacker can intercept and read all of the client’s traffic.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1557
technique_name: Adversary-in-the-Middle
platform:
- Windows
data_sources:
- Dynamic Host Configuration Protocol (DHCP)
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: '(index=* sourcetype=firewall* dest_port IN (67,68) NOT [| inputlookup dhcp_server_list.csv | fields dest_ip | rename dest_ip as dest])

    OR

    (index=* sourcetype=dhcp* EventType=DHCPACK NOT [| inputlookup dhcp_server_list.csv | fields src_ip | rename src_ip as src])

    | table _time, src, dest, dest_port, EventType, action, host

    '
  kql: "let DHCPServers = dynamic([\"10.0.0.1\", \"192.168.1.1\"]);\nlet FirewallDHCP = \n    CommonSecurityLog\n    | where TimeGenerated > ago(24h)\n\
    \    | where DestinationPort in (67, 68)\n    | where DestinationIP !in (DHCPServers)\n    | extend EventType = \"Firewall\"\n    | project\
    \ TimeGenerated, SourceIP, DestinationIP, DestinationPort, DeviceName, EventType;\nlet DHCPEvents = \n    DhcpSrvLog\n    | where TimeGenerated\
    \ > ago(24h)\n    | where EventType == \"Assign\"\n    | where ServerIP !in (DHCPServers)\n    | extend EventType = \"DHCPACK\"\n    | project\
    \ TimeGenerated, SourceIP = ServerIP, DestinationIP = ClientIP, DeviceName = Computer, EventType;\nunion FirewallDHCP, DHCPEvents\n| project\
    \ TimeGenerated, SourceIP, DestinationIP, DestinationPort, DeviceName, EventType\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS event_count
    FROM events
    WHERE (destinationport IN (67,68) AND destinationip NOT IN ('10.0.0.1','192.168.1.1')) OR (qidname(qid) ILIKE '%DHCPACK%' AND sourceip NOT IN ('10.0.0.1','192.168.1.1'))
    GROUP BY sourceip, destinationip, destinationport, LOGSOURCENAME(logsourceid)
    LAST 1 HOURS
  yara_l: |
    rule rogue_dhcp_server_detection {
      meta:
        author = "Detection Engineer"
        description = "Detects potential DHCP spoofing/man-in-the-middle attacks via rogue DHCP servers"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1557"
        severity = "HIGH"

      events:
        // Firewall events to DHCP ports from non-authorized servers
        $firewall.metadata.event_type = "NETWORK_CONNECTION"
        ($firewall.target.port = 67 or $firewall.target.port = 68)
        not net.ip_in_range_cidr($firewall.target.ip, "10.0.0.1/32")  // Replace with actual DHCP server IPs
        $firewall.principal.hostname = $host

        // DHCP ACK events from non-authorized servers
        $dhcp.metadata.event_type = "NETWORK_DHCP"
        $dhcp.metadata.product_event_type = "DHCPACK"
        not net.ip_in_range_cidr($dhcp.principal.ip, "10.0.0.1/32")  // Replace with actual DHCP server IPs
        $dhcp.principal.hostname = $host

      match:
        $host over 1h

      outcome:
        $risk_score = 75

      condition:
        $firewall or $dhcp
    }
  esql: "FROM logs-network.firewall*, logs-dhcp*\n| WHERE @timestamp > NOW() - 24 hours\n| WHERE (destination.port IN (67, 68) AND destination.ip\
    \ NOT IN (\"10.0.0.1\", \"192.168.1.1\", \"172.16.0.1\")) \n  OR (event.category == \"network\" AND event.action == \"dhcp_ack\" AND source.ip\
    \ NOT IN (\"10.0.0.1\", \"192.168.1.1\", \"172.16.0.1\"))\n| STATS event_count = COUNT(*) BY source.ip, destination.ip, destination.port,\
    \ event.action, host.name\n| KEEP @timestamp, source.ip, destination.ip, destination.port, event.action, host.name, event_count\n"
  leql: |
    where(destination_port IN [67, 68] AND destination_address != "YOUR_DHCP_SERVER_IP_1" AND destination_address != "YOUR_DHCP_SERVER_IP_2") OR where(source_json.EventType="DHCPACK" AND source_address != "YOUR_DHCP_SERVER_IP_1" AND source_address != "YOUR_DHCP_SERVER_IP_2")
  crowdstrike: |
    (#type=firewall DestinationPort in [67,68] NOT DestinationIP in [dhcp_server_ip_1, dhcp_server_ip_2]) OR (event_simpleName=DHCPAck NOT SourceIP in [dhcp_server_ip_1, dhcp_server_ip_2])
    | table([@timestamp, ComputerName, DestinationIP, DestinationPort, SourceIP, event_simpleName])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter dest_port in (67, 68)
    | filter dest_ip not in ("10.0.0.1", "192.168.1.1", "172.16.0.1")
    | fields _time, src_ip, dest_ip, dest_port, action_source_translated_ip, agent_hostname
  lucene: |
    (destination.port:(67 OR 68) AND NOT destination.ip:(dhcp_server_ip_1 OR dhcp_server_ip_2)) OR (event.action:DHCPACK AND NOT source.ip:(dhcp_server_ip_1 OR dhcp_server_ip_2))
  sumo: |
    _sourceCategory=*Firewall* (67 OR 68)
    | json field=_raw "DestinationPort" as dest_port
    | json field=_raw "DestinationIP" as dest_ip
    | where dest_port in ("67", "68") and !(dest_ip in ("10.0.0.1", "192.168.1.1"))
    | fields _messageTime, _sourceHost, dest_ip, dest_port
    ```

    OR

    ```
    _sourceCategory=*DHCP* "DHCPACK"
    | json field=_raw "EventType" as event_type
    | json field=_raw "SourceIP" as src_ip
    | where event_type = "DHCPACK" and !(src_ip in ("10.0.0.1", "192.168.1.1"))
    | fields _messageTime, _sourceHost, src_ip, event_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Firewall Events

  Where the Destination Port is in [67,68]

  Where Destination IP is NOT in the DHCP Server List


  --------------------------------------------------------------------------------------------------------------------------


  1 DHCP Event

  Where the Event Type is DHCPACK

  Where the Source IP is NOT on the DHCP Server List'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

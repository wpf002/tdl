rule_id: TDL-DE-000118
v4_id: 000118
name: Audit Log Cleared - HVT
description: Detects when audit logs are cleared on a high value target host.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070
technique_name: Indicator Removal on Host
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 1102'
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 95
queries:
  spl: '(index=wineventlog (sourcetype=WinEventLog:Security EventCode IN (517, 1102)) OR (sourcetype=WinEventLog:System EventCode=104) OR (Source="Microsoft-Windows-Eventlog"))

    | lookup high_value_targets.csv ComputerName OUTPUT is_hvt

    | where is_hvt="true"

    | table _time, ComputerName, EventCode, sourcetype, Source, Message

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(24h)\n| where (EventSourceName == \"Microsoft-Windows-Eventlog\" \n    or (Channel == \"Security\"\
    \ and EventID in (517, 1102))\n    or (Channel == \"System\" and EventID == 104))\n| where Computer in (\"HVT-DC01\", \"HVT-DC02\", \"HVT-ADMIN01\"\
    , \"HVT-FINANCE01\", \"HVT-SQL01\")\n| project TimeGenerated, Computer, EventID, Channel, EventSourceName, Account, Activity, EventData\n"
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS hostname, "EventID", username, categoryname(category), qidname(qid)
    FROM events
    WHERE (
      (category = 6 AND "EventID" IN ('517', '1102'))
      OR
      (category = 13 AND "EventID" = '104')
    )
    AND hostname IN (SELECT hostname FROM assets WHERE asset_group_name = 'High Value Target Host List')
    LAST 24 HOURS
  yara_l: "rule windows_audit_log_cleared {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Windows audit log clearing (T1070 - Defense\
    \ Evasion)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1070\"\n    severity = \"HIGH\"\n\n  events:\n\
    \    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_WIPE\"\n    (\n      $e.metadata.product_log_id = \"Security\" and \n      ($e.metadata.product_event_type\
    \ = \"517\" or $e.metadata.product_event_type = \"1102\")\n    ) or (\n      $e.metadata.product_log_id = \"System\" and \n      $e.metadata.product_event_type\
    \ = \"104\"\n    ) or (\n      re.regex($e.principal.resource.name, `(?i)Microsoft-Windows-Eventlog`)\n    )\n    $e.principal.hostname =\
    \ $host\n\n  match:\n    $host over 5m\n\n  outcome:\n    $risk_score = 85\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-system.system*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (event.provider == "Microsoft-Windows-Eventlog")
        OR
        (winlog.channel == "Security" AND winlog.event_id IN (517, 1102))
        OR
        (winlog.channel == "System" AND winlog.event_id == 104)
      )
    | KEEP @timestamp, host.name, winlog.event_id, winlog.channel, event.provider, event.code, user.name, winlog.computer_name
  leql: |
    where((source_json.ProviderName="Microsoft-Windows-Eventlog" OR (source_json.Channel="Security" AND source_json.EventID IN [517, 1102]) OR (source_json.Channel="System" AND source_json.EventID=104)) AND asset IN [high_value_targets]) groupby(asset, source_json.EventID) calculate(count)
  crowdstrike: "(#type=WindowsEvent OR event_simpleName=WindowsEvent* OR EventCode IN [517, 1102, 104])\n(\n  (ProviderName=\"Microsoft-Windows-Eventlog\"\
    ) \n  OR \n  (Channel=\"Security\" EventCode IN [517, 1102])\n  OR\n  (Channel=\"System\" EventCode=104)\n)\n| table([@timestamp, ComputerName,\
    \ Channel, EventCode, ProviderName, Message])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (517, 1102, 104)
    | filter (action_evtlog_event_id in (517, 1102) and action_evtlog_log_name = "Security")
        or (action_evtlog_event_id = 104 and action_evtlog_log_name = "System")
        or action_evtlog_source = "Microsoft-Windows-Eventlog"
    | fields _time, agent_hostname, action_evtlog_event_id, action_evtlog_log_name, action_evtlog_source, actor_effective_username, action_evtlog_message
  lucene: |
    (event.code:(517 OR 1102 OR 104) AND ((winlog.channel:"Security" AND event.code:(517 OR 1102)) OR (winlog.channel:"System" AND event.code:104) OR winlog.provider_name:"Microsoft-Windows-Eventlog")) OR (EventID:(517 OR 1102 OR 104) AND ((Channel:"Security" AND EventID:(517 OR 1102)) OR (Channel:"System" AND EventID:104) OR SourceName:"Microsoft-Windows-Eventlog"))
  sumo: "_sourceCategory=*Windows* (EventID=1102 OR EventID=517 OR EventID=104)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"Computer\" as computer\n| json field=_raw \"Source\" as source\n| json field=_raw \"Channel\" as channel\n| where (source matches \"*Microsoft-Windows-Eventlog*\"\
    ) \n   OR (channel matches \"*Security*\" AND (event_id=\"1102\" OR event_id=\"517\"))\n   OR (channel matches \"*System*\" AND event_id=\"\
    104\")\n| fields _messageTime, computer, event_id, source, channel\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Audit Log Cleared Event\nWhere the Source is \"Microsoft-Windows-Eventlog\"\nOR\n\tWhere the Event Type is \"Security\"\
  \n\tWhere the Event ID is in [517, 1102]\n\t\n\tWhere the Event Type is \"System\"\n\tWhere the Event ID is \"104\"\n\t\nWhere the Destination\
  \ Hostname is in High Value Target Host List"
suppression:
  window: 4 Hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000119
v4_id: 000119
name: Code Compiling - HVT
description: Detects an account using a compiler on a machine. Attackers can download or develop source code on a host to bypass detection of
  executable files and then compile it locally on the host to avoid detection.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1027
technique_name: Obfuscated Files or Information
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: '(index=wineventlog sourcetype=WinEventLog:Security (EventCode=592 OR EventCode=4688)) OR (index=linux sourcetype IN (linux_secure, syslog))

    | eval command_field=coalesce(CommandLine, Process_Command_Line, Command, COMMAND, bash_command, shell, cmd)

    | where isnotnull(command_field)

    | lookup high_value_targets.csv hostname AS host OUTPUT is_hvt

    | where is_hvt="true" OR is_hvt=1

    | regex command_field="(?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\''][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\'']))"

    | table _time, host, sourcetype, EventCode, User, command_field

    '
  kql: |
    let HighValueHosts = dynamic(["HVT-DC01", "HVT-WEB01", "HVT-DB01", "HVT-APP01"]);
    let CompilerRegex = @"(?:(?:^[\""\\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^(?:[\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^[\\\""\'][^\\\""]*[\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\\\""\']))";
    union
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Computer in (HighValueHosts)
    | where CommandLine matches regex CompilerRegex
    | project TimeGenerated, Computer, Account, EventID, CommandLine, Process, ParentProcessName),
    (Syslog
    | where TimeGenerated > ago(1h)
    | where Computer in (HighValueHosts)
    | where SyslogMessage matches regex CompilerRegex
    | project TimeGenerated, Computer, ProcessName, SyslogMessage)
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Process CommandLine\", \"Process Name\", \"Parent Process Name\"\nFROM\
    \ events\nWHERE ((\"EventID\" IN ('592', '4688') AND \"Process CommandLine\" MATCHES '(?:(?:^[\\\"\\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\\
    b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^[\\\"\\'][^\\\"]*[\\\
    \\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\\\"\\']))') \n   OR \"Process CommandLine\" MATCHES '(?:(?:^[\\\"\\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\\
    b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^[\\\"\\'][^\\\"]*[\\\
    \\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\\\"\\']))')\nLAST 1 HOURS\n"
  yara_l: "rule compilation_on_high_value_targets {\n  meta:\n    author = \"TDL\"\n    description = \"Detects compilation activity on high value\
    \ target hosts - T1027 Defense Evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1027\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    (\n      $windows.metadata.event_type = \"PROCESS_LAUNCH\" and\n      (\n        $windows.metadata.product_event_type\
    \ = \"592\" or\n        $windows.metadata.product_event_type = \"4688\"\n      ) and\n      re.regex($windows.principal.process.command_line,\
    \ `(?:(?:^[\"\\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\\
    +\\+|cc|c\\+\\+|javac)\\b)|(?:^[\"'][^\"]*[\\\\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\"']))`) and\n      $windows.target.hostname = $host\n \
    \   )\n    or\n    (\n      $linux.metadata.event_type = \"PROCESS_LAUNCH\" and\n      re.regex($linux.principal.process.command_line, `(?:(?:^[\"\
    \\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\\
    +\\+|javac)\\b)|(?:^[\"'][^\"]*[\\\\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\"']))`) and\n      $linux.target.hostname = $host\n    )\n\n  match:\n\
    \    $host over 5m\n\n  condition:\n    $windows or $linux\n}\n"
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*
    | WHERE (event.code IN ("592", "4688") OR event.category == "process")
      AND process.command_line RLIKE """(?:(?:^["\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^["'][^"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)["']))"""
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, event.code, event.category
  leql: |
    where((source_json.EventID IN [592, 4688] OR log_source_name ICONTAINS "linux") AND process_cmd_line=/(?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\'][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\']))/)
  crowdstrike: |
    (event_simpleName=ProcessRollup2 OR EventCode=4688 OR EventCode=592 OR event_simpleName=ProcessRollup2Linux)
    | regex("(?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\'][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\']))", field=CommandLine)
    | table([@timestamp, ComputerName, event_simpleName, EventCode, event_platform, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) or event_type = ENUM.EVENT_TYPE_PROCESS)
    | filter action_process_image_command_line ~= "(?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\'][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\']))"
    | fields _time, agent_hostname, agent_os_type, action_process_image_name, action_process_image_command_line, actor_effective_username
  lucene: |
    (event.code:(592 OR 4688) AND process.command_line:/((?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\'][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\'])))/) OR (agent.type:"auditd" AND process.command_line:/((?:(?:^[\"\s]{0,1}(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^(?:[\\\/](?:\w|\\\s)*)+(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:\|\s*(gcc|g\+\+|cc|c\+\+|javac)\b)|(?:^[\"\'][^\"]*[\\\/](gcc|g\+\+|cc|c\+\+|javac)[\"\']))/)
  sumo: "(_sourceCategory=*Windows* OR _sourceCategory=*Linux*) \n| json field=_raw \"EventID\" as event_id nodrop\n| json field=_raw \"CommandLine\"\
    \ as command_line nodrop\n| json field=_raw \"NewProcessName\" as process_name nodrop\n| json field=_raw \"Computer\" as computer nodrop\n\
    | parse regex field=command_line \"(?:(?:^[\\\"\\s]{0,1}(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\\
    +\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:^[\\\"\\'][^\\\"]*[\\\\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\\\"\\']))\" nodrop\n\
    | where (event_id in (\"592\", \"4688\") OR _sourceCategory matches \"*Linux*\") AND command_line matches regex \"(?:(?:^[\\\"\\s]{0,1}(gcc|g\\\
    +\\+|cc|c\\+\\+|javac)\\b)|(?:^(?:[\\\\\\/](?:\\w|\\\\\\s)*)+(gcc|g\\+\\+|cc|c\\+\\+|javac)\\b)|(?:\\|\\s*(gcc|g\\+\\+|cc|c\\+\\+|javac)\\\
    b)|(?:^[\\\"\\'][^\\\"]*[\\\\\\/](gcc|g\\+\\+|cc|c\\+\\+|javac)[\\\"\\']))\"\n| fields _messageTime, _sourceHost, computer, event_id, command_line,\
    \ process_name\n"
false_positives:
- 'Old Regex for the command line: \b(gcc|g\+\+|cc|c\+\+|javac)\b


  ----------------------------------------------------------------


  New Regex matches on'
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:

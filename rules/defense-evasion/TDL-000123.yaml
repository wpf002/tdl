rule_id: TDL-DE-000123
v4_id: '000123'
name: Configuration Change by Unauthorized User
description: Detects when an unauthorized configuration change is made on a network or security appliance.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Windows
data_sources:
- IT Management
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype IN ("WinEventLog:Application", "WinEventLog:System", "xmlwineventlog:application", "xmlwineventlog:system") (EventCode=7040
    OR EventCode=7045 OR EventCode=4719 OR EventCode=1102 OR EventCode=104)

    | eval authorized_users="admin,svc_admin,domain_admin"

    | where NOT match(User, "(?i)(admin|svc_admin|domain_admin)")

    | table _time, host, EventCode, User, Service_Name, ServiceName, Message

    '
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where EventLog == "Operations Manager" or Source == "ConfigMgr" or Source contains "Configuration" or EventLevelName in ("Warning", "Error", "Informational")
    | where RenderedDescription has_any ("configuration", "setting", "policy", "changed", "modified", "updated")
    | extend SourceUser = coalesce(UserName, User, Account, "")
    | where isnotempty(SourceUser)
    | where SourceUser !in ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE", "Administrator", "sccm_admin", "config_service", "authorized_admin1", "authorized_admin2")
    | project TimeGenerated, Computer, EventLog, Source, EventID, SourceUser, RenderedDescription, ParameterXml
  aql: |
    SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS host, CATEGORYNAME(category) AS event_category, qidname(qid) AS event_name, eventtime
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%configuration%'
      AND username NOT IN ('admin', 'svc_automation', 'system', 'administrator')
    LAST 24 HOURS
  yara_l: |
    rule unauthorized_configuration_change {
      meta:
        author = "TDL"
        description = "Detects configuration changes made by unauthorized users - T1562 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "High"

      events:
        $e.metadata.event_type = "SETTING_MODIFICATION"
        $e.principal.user.userid = $user
        not $user in %authorized_config_users
        $e.principal.hostname = $host

      match:
        $host, $user over 5m

      outcome:
        $risk_score = 75
        $user_name = $user
        $hostname = $host

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        event.code IN ("4719", "4738", "4670", "4657", "1")
        OR event.action IN ("configuration-change", "registry-value-set", "modification")
      )
      AND user.name NOT IN ("SYSTEM", "Administrator", "LocalSystem", "NT AUTHORITY\\SYSTEM", "backup_admin", "svc_config")
    | STATS config_changes = COUNT(*) BY user.name, host.name, event.code, event.action
    | WHERE config_changes >= 1
    | KEEP @timestamp, host.name, user.name, event.code, event.action, config_changes
  leql: |
    where(source_json.EventID=4719 AND source_user NOT IN ["AuthorizedUser1","AuthorizedUser2","AuthorizedUser3"])
  crowdstrike: |
    #type=configuration_change event_platform=Win
    | UserName!=*authorized_user1* UserName!=*authorized_user2* UserName!=*authorized_user3*
    | table([@timestamp, ComputerName, UserName, ConfigurationChangeType, ChangeDetails])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_CONFIGURATION_CHANGE
    | filter actor_effective_username not in ("admin", "svc_automation", "system_admin")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_id
  lucene: |
    (event.category:"configuration" OR event.type:"change" OR event.action:("configuration_change" OR "config_change" OR "system_configuration_change")) AND NOT user.name:("authorized_admin1" OR "authorized_admin2" OR "service_account")
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*IT* (configuration OR config OR change OR modified OR updated)
    | json field=_raw "EventID" as event_id
    | json field=_raw "User" as user
    | json field=_raw "SourceUser" as source_user
    | json field=_raw "UserName" as username
    | json field=_raw "EventType" as event_type
    | json field=_raw "Action" as action
    | where (event_type matches "*config*" OR action matches "*config*" OR event_type matches "*change*" OR action matches "*change*" OR action matches "*modif*")
    | where !(user in ("admin", "system", "Administrator", "SYSTEM", "NT AUTHORITY\\SYSTEM") OR source_user in ("admin", "system", "Administrator", "SYSTEM", "NT AUTHORITY\\SYSTEM") OR username in ("admin", "system", "Administrator", "SYSTEM", "NT AUTHORITY\\SYSTEM"))
    | fields _messageTime, _sourceHost, event_id, user, source_user, username, event_type, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Configuration Change Event

  Where the Source Username is NOT in the Authorized Users to make Configuration Changes List'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

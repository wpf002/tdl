rule_id: TDL-DE-000130
v4_id: '000130'
name: AWS Logging Stopped
description: Detects when an AWS CloudTrail trail is stopped or deleted. This will stop AWS API events from logging into CloudTrail and prevent
  visibility into the infrastructure.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1489
technique_name: Service Stop
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventType=AwsApiCall (eventName=DeleteTrail OR eventName=StopLogging)

    | table _time, userIdentity.principalId, userIdentity.arn, eventName, requestParameters.name, sourceIPAddress, userAgent, errorCode, errorMessage

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventTypeName == "AwsApiCall"
    | where EventName in ("DeleteTrail", "StopLogging")
    | project TimeGenerated, UserIdentityArn, EventName, EventSource, SourceIpAddress, UserAgent, AwsRegion, RequestParameters, ResponseElements, ErrorCode, ErrorMessage
  aql: |
    SELECT eventtime, username, sourceip, "eventName" AS event_name, "requestParameters" AS request_params, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%CloudTrail%'
      AND "eventName" IN ('DeleteTrail', 'StopLogging')
    LAST 24 HOURS
  yara_l: |
    rule aws_cloudtrail_disabled {
      meta:
        author = "TDL"
        description = "Detects attempts to disable AWS CloudTrail logging via DeleteTrail or StopLogging API calls"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1489"
        severity = "HIGH"

      events:
        $e.metadata.product_event_type = "AwsApiCall"
        (
          $e.metadata.product_log_id = "DeleteTrail" or
          $e.metadata.product_log_id = "StopLogging"
        )
        $e.principal.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("DeleteTrail", "StopLogging") AND event.type == "AwsApiCall"
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, source.ip, event.action, aws.cloudtrail.request_parameters
  leql: |
    where(source_json.eventType="AwsApiCall" AND source_json.eventName IN [DeleteTrail, StopLogging])
  crowdstrike: |
    #type=cloudtrail eventType=AwsApiCall (eventName=DeleteTrail OR eventName=StopLogging)
    | table([@timestamp, userIdentity.principalId, eventName, requestParameters, sourceIPAddress, userAgent, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AWS and action_event_type = "AwsApiCall" and action_operation in ("DeleteTrail", "StopLogging")
    | fields _time, actor_effective_username, action_operation, action_resource_name, cloud_resource_identifier, cloud_account_id
  lucene: |
    eventType:AwsApiCall AND eventName:(DeleteTrail OR StopLogging)
  sumo: |
    _sourceCategory=*CloudTrail*
    | json field=_raw "eventType" as event_type
    | json field=_raw "eventName" as event_name
    | where event_type = "AwsApiCall"
    | where event_name in ("DeleteTrail", "StopLogging")
    | fields _messageTime, _sourceHost, event_name, event_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Event

  Where the Event Type is AwsApiCall

  Where the Event Name is in [DeleteTrail, StopLogging]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

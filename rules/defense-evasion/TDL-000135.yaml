rule_id: TDL-DE-000135
v4_id: '000135'
name: AWS Encryption Protection Disabled
description: Detects when an AWS customer master key (CMK) is disabled or scheduled to be deleted. CMK’s are used to encrypt the data encryption
  keys which are used to encrypt customer data. If the CMK is deleted or disabled, the data encryption keys are stored in plaintext and vulnerable
  to compromise if an attacker were to gain access.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1600
technique_name: Weaken Encryption
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventType=AwsApiCall (eventName=DisableKey OR eventName=ScheduleKeyDeletion)

    | table _time, userIdentity.arn, eventName, requestParameters.keyId, sourceIPAddress, userAgent, errorCode

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventTypeName == "AwsApiCall"
    | where EventName in ("DisableKey", "ScheduleKeyDeletion")
    | project TimeGenerated, EventName, EventTypeName, UserIdentityType, UserIdentityArn, UserIdentityAccountId, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, RecipientAccountId, AWSRegion, ErrorCode, ErrorMessage
  aql: |
    SELECT eventtime, username, sourceip, "eventName", "requestParameters", "responseElements", LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE LOGSOURCETYPE(logsourceid) ILIKE '%CloudTrail%'
      AND "eventType" = 'AwsApiCall'
      AND "eventName" IN ('DisableKey', 'ScheduleKeyDeletion')
    LAST 24 HOURS
  yara_l: "rule aws_kms_key_disable_or_schedule_deletion {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects attempts\
    \ to disable or schedule deletion of AWS KMS keys (T1600 - Weaken Encryption)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique\
    \ = \"T1600\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.vendor_name = \"AMAZON\"\n    $e.metadata.product_name = \"AWS CloudTrail\"\
    \n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.metadata.product_event_type = \"AwsApiCall\"\n    (\n      $e.target.resource.name\
    \ = \"DisableKey\" or\n      $e.target.resource.name = \"ScheduleKeyDeletion\"\n    )\n    $e.principal.user.userid = $user\n    $e.principal.ip\
    \ = $ip\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("DisableKey", "ScheduleKeyDeletion") AND event.type == "AwsApiCall"
    | KEEP @timestamp, cloud.account.id, user.name, user_identity.arn, event.action, aws.cloudtrail.request_parameters, source.ip, user_agent.original
  leql: |
    where(source_json.eventType=AwsApiCall AND source_json.eventName IN [DisableKey, ScheduleKeyDeletion])
  crowdstrike: |
    #type=cloudtrail eventType=AwsApiCall (eventName=DisableKey OR eventName=ScheduleKeyDeletion)
    | table([@timestamp, userIdentity.principalId, eventName, requestParameters.keyId, sourceIPAddress, userAgent, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and event_type = "AwsApiCall" and action_name in ("DisableKey", "ScheduleKeyDeletion")
    | fields _time, actor_user, action_name, cloud_provider_account, raw_log
  lucene: |
    eventType:AwsApiCall AND eventName:(DisableKey OR ScheduleKeyDeletion)
  sumo: |
    _sourceCategory=*cloudtrail* (DisableKey OR ScheduleKeyDeletion)
    | json field=_raw "eventType" as event_type
    | json field=_raw "eventName" as event_name
    | where event_type = "AwsApiCall"
    | where event_name in ("DisableKey", "ScheduleKeyDeletion")
    | fields _messageTime, event_name, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Event

  Where the Event Type is AwsAPICall

  Where the Event Name is in [DisableKey, ScheduleKeyDeletion]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

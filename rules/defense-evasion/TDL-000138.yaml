rule_id: TDL-DE-000138
v4_id: 000138
name: AWS Logging Disabled - GuardDuty
description: Detects anomalous IAM user and group activity as identified by Guard Duty.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070
technique_name: Indicator Removal on Host
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatch:guardduty (finding.type="Stealth:IAMUser/CloudTrailLoggingDisabled" OR finding.type="Stealth:S3/ServerAccessLoggingDisabled")

    | table _time, finding.type, finding.severity, finding.accountId, finding.region, finding.resource.resourceType, finding.resource.instanceDetails.instanceId,
    finding.service.action.actionType, finding.title, finding.description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type in ("Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, AwsAccountId
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, qidname(qid) AS event_name, username, sourceip, \"accountId\", \"region\"\
    , \"resourceType\", \"severity\"\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%' \n  AND (qidname(qid) ILIKE '%Stealth:IAMUser/CloudTrailLoggingDisabled%'\
    \ OR qidname(qid) ILIKE '%Stealth:S3/ServerAccessLoggingDisabled%')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_logging_disabled {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty events indicating CloudTrail or S3 access logging disabled"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1070"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Stealth:IAMUser/CloudTrailLoggingDisabled" or
          $e.metadata.product_event_type = "Stealth:S3/ServerAccessLoggingDisabled"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled")
    | KEEP @timestamp, cloud.account.id, cloud.account.name, event.type, event.severity, event.id, user.name, aws.guardduty.finding.id, aws.guardduty.finding.description
  leql: |
    where(source_json.type IN ["Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled"])
  crowdstrike: |
    #type=guardduty finding.type IN ["Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled"]
    | table([@timestamp, finding.type, resource.accessKeyDetails.userName, resource.s3BucketDetails.name, region, accountId, finding.severity, finding.description])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logtype_name = "AWS.GuardDuty"
    | filter event_type in ("Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled")
    | fields _time, event_type, cloud_provider_account, actor_effective_username, action_resource
  lucene: |
    eventName:"GuardDuty Finding" AND finding.type:("Stealth:IAMUser/CloudTrailLoggingDisabled" OR "Stealth:S3/ServerAccessLoggingDisabled")
  sumo: |
    _sourceCategory=*GuardDuty* (Stealth:IAMUser/CloudTrailLoggingDisabled OR Stealth:S3/ServerAccessLoggingDisabled)
    | json field=_raw "type" as event_type
    | where event_type in ("Stealth:IAMUser/CloudTrailLoggingDisabled", "Stealth:S3/ServerAccessLoggingDisabled")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Stealth:IAMUser/CloudTrailLoggingDisabled\", \"Stealth:S3/ServerAccessLoggingDisabled\"\
  ]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

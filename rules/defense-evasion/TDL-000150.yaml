rule_id: TDL-DE-000150
v4_id: '000150'
name: Public AWS RDS Instance Restored
description: Detects the recovery of a database instance from a snapshot. If the database is public, this could be used for exfiltration methods.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1578
technique_name: Modify Cloud Compute Infrastructure
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudtrail eventName=RestoreDBInstanceFromDBSnapshot \n| spath path=requestParameters.publiclyAccessible output=publicly_accessible\n\
    | search publicly_accessible=false\n| table _time, userIdentity.principalId, userIdentity.arn, sourceIPAddress, awsRegion, requestParameters.dBInstanceIdentifier,\
    \ requestParameters.dBSnapshotIdentifier, publicly_accessible\n"
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventName == "RestoreDBInstanceFromDBSnapshot"
    | extend PubliclyAccessible = tostring(parse_json(RequestParameters).publiclyAccessible)
    | where PubliclyAccessible == "false"
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, RequestParameters, ResponseElements, AwsRegion, RecipientAccountId
  aql: |
    SELECT eventtime, username, sourceip, "AWS Account ID", "Resource ID", "Request Parameters"
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%AWS%CloudTrail%'
      AND "Event Name" = 'RestoreDBInstanceFromDBSnapshot'
      AND "Request Parameters" ILIKE '%publiclyAccessible%false%'
    LAST 24 HOURS
  yara_l: |
    rule aws_restore_db_non_public {
      meta:
        author = "TDL"
        description = "Detects AWS RDS database restoration with PubliclyAccessible set to False - T1578 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1578"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.event_type = "GENERIC_EVENT"
        $e.target.resource.attribute.labels["eventName"] = "RestoreDBInstanceFromDBSnapshot"
        $e.target.resource.attribute.labels["requestParameters.publiclyAccessible"] = "false"
        $e.principal.user.userid = $user
        $e.target.resource.attribute.labels["awsRegion"] = $region

      match:
        $user, $region over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action == "RestoreDBInstanceFromDBSnapshot"
      AND event.outcome == "success"
      AND aws.cloudtrail.request_parameters LIKE "*publiclyAccessible*false*"
    | KEEP @timestamp, cloud.account.id, cloud.region, user_identity.arn, aws.cloudtrail.request_parameters, event.action
  leql: |
    where(source_json.eventName=RestoreDBInstanceFromDBSnapshot AND source_json.requestParameters.publiclyAccessible=false)
  crowdstrike: |
    #repo=aws_cloudtrail eventName=RestoreDBInstanceFromDBSnapshot
    | publiclyAccessible=*false*
    | table([@timestamp, userIdentity.arn, sourceIPAddress, eventName, requestParameters.publiclyAccessible, requestParameters.dBInstanceIdentifier, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and operation = "RestoreDBInstanceFromDBSnapshot"
    | filter json_extract_scalar(resource_json_properties, "$.publiclyAccessible") = "false" or json_extract_scalar(resource_json_properties, "$.requestParameters.publiclyAccessible") = "false"
    | fields _time, actor_user, operation, cloud_provider_account, cloud_region, resource_json_properties
  lucene: |
    eventName:RestoreDBInstanceFromDBSnapshot AND requestParameters.publiclyAccessible:false
  sumo: |
    _sourceCategory=*CloudTrail* "RestoreDBInstanceFromDBSnapshot"
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.publiclyAccessible" as publicly_accessible
    | where event_name = "RestoreDBInstanceFromDBSnapshot" and publicly_accessible = "false"
    | fields _messageTime, _sourceHost, event_name, publicly_accessible
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS APICall Event

  Where the Event Name is in [RestoreDBInstanceFromDBSnapshot]

  Where the Request Parameter Publicy Accessible = False'
suppression:
  window: 12 hours
  fields:
  - src_ip
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000161
v4_id: '000161'
name: EC2 Snapshot Sharing
description: Detects the sharing of a snapshot with another account or if the snapshot has been made public. An unauthorized user could potentially
  be given access to all of the data within the snapshot.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1578
technique_name: Modify Cloud Compute Infrastructure
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName IN ("ModifySnapshotAttribute", "SharedSnapshotCopyInitiated")

    | eval is_modify_with_add=if(eventName="ModifySnapshotAttribute" AND like(requestParameters, "%add%"), 1, 0)

    | eval is_shared_snapshot=if(eventName="SharedSnapshotCopyInitiated", 1, 0)

    | where is_modify_with_add=1 OR is_shared_snapshot=1

    | table _time, userIdentity.principalId, userIdentity.arn, eventName, requestParameters, sourceIPAddress, awsRegion

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(24h)
    | where EventName in ("ModifySnapshotAttribute", "SharedSnapshotCopyInitiated")
    | where EventName == "SharedSnapshotCopyInitiated" or (EventName == "ModifySnapshotAttribute" and RequestParameters has "add")
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, AWSRegion, RecipientAccountId
  aql: "SELECT eventtime, username, sourceip, QIDNAME(qid), \"Event Name\", \"Request Parameters\", \"User Agent\", \"Error Code\"\nFROM events\n\
    WHERE ((\"Event Name\" = 'ModifySnapshotAttribute' AND \"Request Parameters\" ILIKE '%add%') \n       OR \"Event Name\" = 'SharedSnapshotCopyInitiated')\n\
    \  AND LOGSOURCETYPENAME(devicetype) ILIKE '%cloudtrail%'\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_snapshot_sharing_defense_evasion {
      meta:
        author = "Chronicle Security"
        description = "Detects AWS snapshot sharing activity that may indicate defense evasion via T1578"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1578"
        severity = "Medium"

      events:
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.event_type = "NETWORK_CONNECTION" or $e.metadata.event_type = "GENERIC_EVENT" or $e.metadata.event_type = "USER_RESOURCE_ACCESS"
        (
          (
            $e.metadata.product_event_type = "ModifySnapshotAttribute"
            and re.regex($e.security_result.summary, `(?i)add`)
          )
          or
          $e.metadata.product_event_type = "SharedSnapshotCopyInitiated"
        )
        $e.principal.user.userid = $user
        $e.target.resource.attribute.cloud.availability_zone = $region

      match:
        $user over 5m

      outcome:
        $risk_score = 50

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action == "ModifySnapshotAttribute" AND event.outcome == "success" AND aws.cloudtrail.request_parameters LIKE "*add*"
       OR event.action == "SharedSnapshotCopyInitiated" AND event.outcome == "success"
    | STATS event_count = COUNT(*) BY cloud.account.id, user.name, event.action, aws.cloudtrail.request_parameters, @timestamp
    | KEEP @timestamp, cloud.account.id, user.name, event.action, aws.cloudtrail.request_parameters, event_count
  leql: |
    where(source_json.eventName IN [ModifySnapshotAttribute, SharedSnapshotCopyInitiated] AND (source_json.requestParameters ICONTAINS "add" OR source_json.eventName=SharedSnapshotCopyInitiated))
  crowdstrike: |
    #type=cloudtrail (eventName=ModifySnapshotAttribute requestParameters=*add*) OR eventName=SharedSnapshotCopyInitiated
    | table([@timestamp, eventName, userIdentity.principalId, userIdentity.arn, sourceIPAddress, requestParameters, responseElements, awsRegion, errorCode, errorMessage])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and operation_type = "AWS API Call"
    | filter (operation_name = "ModifySnapshotAttribute" and raw_log contains "add") or operation_name = "SharedSnapshotCopyInitiated"
    | fields _time, cloud_provider, operation_name, identity_name, actor_user, resource_name, raw_log
  lucene: |
    (eventName:ModifySnapshotAttribute AND requestParameters:*add*) OR eventName:SharedSnapshotCopyInitiated
  sumo: |
    _sourceCategory=*cloudtrail* AND (eventName=ModifySnapshotAttribute OR eventName=SharedSnapshotCopyInitiated)
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters" as request_params
    | json field=_raw "userIdentity.principalId" as principal_id
    | json field=_raw "sourceIPAddress" as src_ip
    | json field=_raw "awsRegion" as region
    | where (event_name = "ModifySnapshotAttribute" and request_params matches "*add*") or event_name = "SharedSnapshotCopyInitiated"
    | fields _messageTime, event_name, principal_id, src_ip, region, request_params
false_positives:
- 'Reviewing logic - High false positive rate.

  Exclude expected user/ip pairs

  https://stratus-red-team.cloud/attack-techniques/AWS/aws.exfiltration.ec2-s'
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS APICall Event

  Where the Event Name is in [ModifySnapshotAttribute]

  Where the Request Parameter contains [add]

  OR

  Where the Event Name is in [SharedSnapshotCopyInitiated]'
suppression:
  window: 12 hours
  fields:
  - src_ip
  - src_user
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — distinguish administrative tooling from adversary tradecraft (LOLBins,
  signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

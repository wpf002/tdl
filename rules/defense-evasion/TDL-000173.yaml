rule_id: TDL-DE-000173
v4_id: '000173'
name: Suspicious Certutil Usage
description: Detects the usage of Microsoft's certutil execution with sub commands like 'decode' or 'url' or 'ping', which could indicate an attacker
  attempting to decode malicious code with built-in tools on the host.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1140
technique_name: Deobfuscate/Decode Files or Information
platform:
- Windows
data_sources:
- Windows Operating System
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) (Image="*\\certutil.exe" OR process_name="*certutil.exe" OR Process_Name="*certutil.exe")
    (CommandLine="*-decode*" OR CommandLine="*-ping*" OR Command_Line="*-decode*" OR Command_Line="*-ping*")

    | table _time, ComputerName, User, Image, Process_Name, CommandLine, Command_Line, ParentImage, Parent_Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where (Process has "certutil.exe" or NewProcessName has "certutil.exe" or ProcessName has "certutil.exe")
        or (CommandLine has "-decode" and CommandLine has "-ping")
    | project TimeGenerated, Computer, Account, EventID, Process, NewProcessName, ProcessName, CommandLine, ParentProcessName, SubjectUserName, TargetUserName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine"
    FROM events
    WHERE ("EventID" = '592' OR "EventID" = '4688')
      AND ("Process Name" ILIKE '%certutil.exe%'
           OR ("Process CommandLine" ILIKE '%-decode%' AND "Process CommandLine" ILIKE '%-ping%'))
    LAST 24 HOURS
  yara_l: "rule certutil_defense_evasion {\n  meta:\n    author = \"TDL\"\n    description = \"Detects certutil.exe used for defense evasion via\
    \ decode or ping flags - MITRE T1140\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1140\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n\
    \      $e.metadata.product_event_type = \"4688\"\n    )\n    (\n      re.regex($e.target.process.file.full_path, `(?i)certutil\\.exe$`) or\n\
    \      (\n        re.regex($e.target.process.command_line, `(?i)-decode`) and\n        re.regex($e.target.process.command_line, `(?i)-ping`)\n\
    \      )\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE (event.code IN ("592", "4688") OR winlog.event_id IN (592, 4688))
      AND (
        TO_LOWER(process.name) == "certutil.exe"
        OR (TO_LOWER(process.command_line) LIKE "*-decode*" AND TO_LOWER(process.command_line) LIKE "*-ping*")
      )
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, event.code, winlog.event_id
  leql: |
    where(source_json.EventID IN [592, 4688] AND (process_name ICONTAINS "certutil.exe" OR (process_cmd_line ICONTAINS "-decode" AND process_cmd_line ICONTAINS "-ping")))
  crowdstrike: |
    (EventCode=592 OR EventCode=4688) (FileName=*certutil.exe OR ImageFileName=*certutil.exe OR NewProcessName=*certutil.exe) (CommandLine=*-decode* OR CommandLine=*-ping*)
    | table([@timestamp, ComputerName, UserName, CommandLine, ParentProcessName, ProcessId])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "certutil.exe"
      or (lowercase(action_process_image_command_line) contains "-decode"
          and lowercase(action_process_image_command_line) contains "-ping")
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, action_evtlog_event_id
  lucene: |
    event.code:(592 OR 4688) AND (process.name:*certutil.exe OR (CommandLine:*-decode* AND CommandLine:*-ping*) OR (process.command_line:*-decode* AND process.command_line:*-ping*))
  sumo: |
    _sourceCategory=*Windows* (certutil OR "-decode" OR "-ping")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Process" as process
    | where (event_id = "592" OR event_id = "4688")
    | where (process_name matches "*certutil.exe" OR process matches "*certutil.exe" OR command_line matches "*certutil*" OR (command_line matches "*-decode*" AND command_line matches "*-ping*"))
    | fields _messageTime, _sourceHost, event_id, process_name, process, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is certutil.exe\nOR\n\tWhere Command\
  \ contains \"-decode\"\n\t\n\tWhere Command contains \"-ping\""
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

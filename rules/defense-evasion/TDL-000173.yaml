rule_id: TDL-DE-000173
v4_id: '000173'
name: Suspicious Certutil Usage
description: Detects the usage of Microsoft's certutil execution with sub commands like 'decode' or 'url' or 'ping', which could indicate an attacker
  attempting to decode malicious code with built-in tools on the host.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1140
technique_name: Deobfuscate/Decode Files or Information
platform:
- Windows
data_sources:
- Windows Operating System
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=windows (EventCode=592 OR EventCode=4688) (Image="*\\certutil.exe" OR process_name="*certutil.exe" OR Process_Name="*certutil.exe") (CommandLine="*-decode*" OR CommandLine="*-ping*" OR Command_Line="*-decode*" OR Command_Line="*-ping*")
    | table _time, ComputerName, User, Image, Process_Name, CommandLine, Command_Line, ParentImage, Parent_Process_Name
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("certutil.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('certutil.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000173 {\n  meta:\n    author = \"TDL\"\n    description = \"Suspicious Certutil Usage\"\n    severity = \"HIGH\"\n\
    \    tactic = \"TA0005\"\n    technique = \"T1140\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name = /(certutil.exe)/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("certutil.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [certutil.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (certutil.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("certutil.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(certutil.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("certutil.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is certutil.exe\nOR\n\tWhere Command\
  \ contains \"-decode\"\n\t\n\tWhere Command contains \"-ping\""
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000174
v4_id: '000174'
name: Executables Started in Suspicious Folder
description: Detects the launch of executable's in folders that typically don't store applications. Attackers may attempt to move their code to
  certain folders that are not scanned by Anti-virus solutions or other tools to avoid detection.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1564
technique_name: Hide Artifacts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows EventCode=4688 NewProcessName="*.exe" (NewProcessName="*C:\\PerfLogs\\*" OR NewProcessName="*C:\\$Recycle.bin\\*" OR NewProcessName="*C:\\Intel\\Logs\\*"
    OR NewProcessName="*C:\\Users\\Default\\*" OR NewProcessName="*C:\\Users\\Public\\*" OR NewProcessName="*C:\\Users\\NetworkService\\*" OR
    NewProcessName="*C:\\Windows\\Fonts\\*" OR NewProcessName="*C:\\Windows\\Debug\\*" OR NewProcessName="*C:\\Windows\\Media\\*" OR NewProcessName="*C:\\Windows\\Help\\*"
    OR NewProcessName="*C:\\Windows\\addins\\*" OR NewProcessName="*C:\\Windows\\repair\\*" OR NewProcessName="*C:\\Windows\\security\\*" OR NewProcessName="*\\RSA\\MachineKeys\\*"
    OR NewProcessName="*C:\\Windows\\system32\\config\\systemprofile\\*")

    | table _time, ComputerName, NewProcessName, CommandLine, SubjectUserName, ParentProcessName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where Process endswith ".exe"
    | where NewProcessName has_any ("C:\\PerfLogs\\", "C:\\$Recycle.bin\\", "C:\\Intel\\Logs\\", "C:\\Users\\Default\\", "C:\\Users\\Public\\", "C:\\Users\\NetworkService\\", "C:\\Windows\\Fonts\\", "C:\\Windows\\Debug\\", "C:\\Windows\\Media\\", "C:\\Windows\\Help\\", "C:\\Windows\\addins\\", "C:\\Windows\\repair\\", "C:\\Windows\\security\\", "\\RSA\\MachineKeys\\", "C:\\Windows\\system32\\config\\systemprofile\\")
    | project TimeGenerated, Computer, Account, Process, NewProcessName, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%.exe'
      AND ("Process Name" ILIKE '%C:\PerfLogs\%'
           OR "Process Name" ILIKE '%C:\$Recycle.bin\%'
           OR "Process Name" ILIKE '%C:\Intel\Logs\%'
           OR "Process Name" ILIKE '%C:\Users\Default\%'
           OR "Process Name" ILIKE '%C:\Users\Public\%'
           OR "Process Name" ILIKE '%C:\Users\NetworkService\%'
           OR "Process Name" ILIKE '%C:\Windows\Fonts\%'
           OR "Process Name" ILIKE '%C:\Windows\Debug\%'
           OR "Process Name" ILIKE '%C:\Windows\Media\%'
           OR "Process Name" ILIKE '%C:\Windows\Help\%'
           OR "Process Name" ILIKE '%C:\Windows\addins\%'
           OR "Process Name" ILIKE '%C:\Windows\repair\%'
           OR "Process Name" ILIKE '%C:\Windows\security\%'
           OR "Process Name" ILIKE '%\RSA\MachineKeys\%'
           OR "Process Name" ILIKE '%C:\Windows\system32\config\systemprofile\%')
    LAST 24 HOURS
  yara_l: |
    rule process_execution_unusual_directories {
      meta:
        author = "Detection Engineer"
        description = "Detects process execution from unusual or hidden directories - T1564 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1564"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\.exe$`)
        (
          re.regex($e.target.process.file.full_path, `(?i)C:\\PerfLogs\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\\$Recycle\.bin\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Intel\\Logs\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Users\\Default\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Users\\Public\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Users\\NetworkService\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\Fonts\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\Debug\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\Media\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\Help\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\addins\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\repair\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\security\\`) or
          re.regex($e.target.process.file.full_path, `(?i)\\RSA\\MachineKeys\\`) or
          re.regex($e.target.process.file.full_path, `(?i)C:\\Windows\\system32\\config\\systemprofile\\`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND process.name LIKE \"*.exe\"\n  AND (process.executable\
    \ LIKE \"*C:\\\\PerfLogs\\\\*\" \n    OR process.executable LIKE \"*C:\\\\$Recycle.bin\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Intel\\\
    \\Logs\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Users\\\\Default\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Users\\\\Public\\\\\
    *\"\n    OR process.executable LIKE \"*C:\\\\Users\\\\NetworkService\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\Fonts\\\\\
    *\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\Debug\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\Media\\\\*\"\n  \
    \  OR process.executable LIKE \"*C:\\\\Windows\\\\Help\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\addins\\\\*\"\n    OR process.executable\
    \ LIKE \"*C:\\\\Windows\\\\repair\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\security\\\\*\"\n    OR process.executable LIKE\
    \ \"*\\\\RSA\\\\MachineKeys\\\\*\"\n    OR process.executable LIKE \"*C:\\\\Windows\\\\system32\\\\config\\\\systemprofile\\\\*\")\n| KEEP\
    \ @timestamp, host.name, user.name, process.name, process.executable, process.command_line, process.parent.name\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ENDS-WITH ".exe" AND (process_cmd_line ICONTAINS "C:\PerfLogs\" OR process_cmd_line ICONTAINS "C:\$Recycle.bin\" OR process_cmd_line ICONTAINS "C:\Intel\Logs\" OR process_cmd_line ICONTAINS "C:\Users\Default\" OR process_cmd_line ICONTAINS "C:\Users\Public\" OR process_cmd_line ICONTAINS "C:\Users\NetworkService\" OR process_cmd_line ICONTAINS "C:\Windows\Fonts\" OR process_cmd_line ICONTAINS "C:\Windows\Debug\" OR process_cmd_line ICONTAINS "C:\Windows\Media\" OR process_cmd_line ICONTAINS "C:\Windows\Help\" OR process_cmd_line ICONTAINS "C:\Windows\addins\" OR process_cmd_line ICONTAINS "C:\Windows\repair\" OR process_cmd_line ICONTAINS "C:\Windows\security\" OR process_cmd_line ICONTAINS "\RSA\MachineKeys\" OR process_cmd_line ICONTAINS "C:\Windows\system32\config\systemprofile\"))
  crowdstrike: |
    EventCode=4688 ImageFileName=*.exe (NewProcessName=*C:\PerfLogs\* OR NewProcessName=*C:\$Recycle.bin\* OR NewProcessName=*C:\Intel\Logs\* OR NewProcessName=*C:\Users\Default\* OR NewProcessName=*C:\Users\Public\* OR NewProcessName=*C:\Users\NetworkService\* OR NewProcessName=*C:\Windows\Fonts\* OR NewProcessName=*C:\Windows\Debug\* OR NewProcessName=*C:\Windows\Media\* OR NewProcessName=*C:\Windows\Help\* OR NewProcessName=*C:\Windows\addins\* OR NewProcessName=*C:\Windows\repair\* OR NewProcessName=*C:\Windows\security\* OR NewProcessName=*\RSA\MachineKeys\* OR NewProcessName=*C:\Windows\system32\config\systemprofile\*) | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, CommandLine, ParentProcessName])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688)\n| filter action_process_image_name ~= \".*\\\\.exe$\"\n| filter action_process_image_path\
    \ contains \"C:\\\\PerfLogs\\\\\" \n    or action_process_image_path contains \"C:\\\\$Recycle.bin\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Intel\\\\Logs\\\\\" \n    or action_process_image_path contains \"C:\\\\Users\\\\Default\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Users\\\\Public\\\\\" \n    or action_process_image_path contains \"C:\\\\Users\\\\NetworkService\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Windows\\\\Fonts\\\\\" \n    or action_process_image_path contains \"C:\\\\Windows\\\\Debug\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Windows\\\\Media\\\\\" \n    or action_process_image_path contains \"C:\\\\Windows\\\\Help\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Windows\\\\addins\\\\\" \n    or action_process_image_path contains \"C:\\\\Windows\\\\repair\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Windows\\\\security\\\\\" \n    or action_process_image_path contains \"\\\\RSA\\\\MachineKeys\\\\\" \n    or action_process_image_path\
    \ contains \"C:\\\\Windows\\\\system32\\\\config\\\\systemprofile\\\\\"\n| fields _time, agent_hostname, actor_effective_username, action_process_image_name,\
    \ action_process_image_path, action_process_image_command_line\n"
  lucene: |
    event.code:(592 OR 4688) AND process.name:*.exe AND process.executable:(*\\PerfLogs\\* OR *\\$Recycle.bin\\* OR *\\Intel\\Logs\\* OR *\\Users\\Default\\* OR *\\Users\\Public\\* OR *\\Users\\NetworkService\\* OR *\\Windows\\Fonts\\* OR *\\Windows\\Debug\\* OR *\\Windows\\Media\\* OR *\\Windows\\Help\\* OR *\\Windows\\addins\\* OR *\\Windows\\repair\\* OR *\\Windows\\security\\* OR *\\RSA\\MachineKeys\\* OR *\\Windows\\system32\\config\\systemprofile\\*)
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_path
    | where event_id in ("592", "4688")
    | where process_path matches "*.exe"
    | where process_path matches "*C:\\PerfLogs\\*" or process_path matches "*C:\\$Recycle.bin\\*" or process_path matches "*C:\\Intel\\Logs\\*" or process_path matches "*C:\\Users\\Default\\*" or process_path matches "*C:\\Users\\Public\\*" or process_path matches "*C:\\Users\\NetworkService\\*" or process_path matches "*C:\\Windows\\Fonts\\*" or process_path matches "*C:\\Windows\\Debug\\*" or process_path matches "*C:\\Windows\\Media\\*" or process_path matches "*C:\\Windows\\Help\\*" or process_path matches "*C:\\Windows\\addins\\*" or process_path matches "*C:\\Windows\\repair\\*" or process_path matches "*C:\\Windows\\security\\*" or process_path matches "*\\RSA\\MachineKeys\\*" or process_path matches "*C:\\Windows\\system32\\config\\systemprofile\\*"
    | fields _messageTime, _sourceHost, event_id, process_path
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name ends with \".exe\"\nWhere the\
  \ Process Path contains: [C:\\PerfLogs\\, C:\\$Recycle.bin\\, C:\\Intel\\Logs\\, C:\\Users\\Default\\, C:\\Users\\Public\\, C:\\Users\\NetworkService\\\
  , C:\\Windows\\Fonts\\, C:\\Windows\\Debug\\, C:\\Windows\\Media\\, C:\\Windows\\Help\\, C:\\Windows\\addins\\, C:\\Windows\\repair\\, C:\\\
  Windows\\security\\, \\RSA\\MachineKeys\\, C:\\Windows\\system32\\config\\systemprofile\\]"
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

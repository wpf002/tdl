rule_id: TDL-DE-000177
v4_id: '000177'
name: S3 Bucket Made Public
description: Detects a new or existing S3 bucket that is made publicly available.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1578
technique_name: Modify Cloud Compute Infrastructure
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName IN (PutBucketAcl, CreateBucket) requestParameters.x-amz-acl=public* OR requestParameters.ACL
    IN (public, public-read, public-read-write, authenticated-read)

    | table _time, userIdentity.principalId, eventName, requestParameters.bucketName, requestParameters.x-amz-acl, requestParameters.ACL, sourceIPAddress,
    userAgent

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName in ("PutBucketAcl", "CreateBucket")
    | where RequestParameters has "public"
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, RequestParameters, BucketName = tostring(parse_json(RequestParameters).bucketName), ACL = tostring(parse_json(RequestParameters).AccessControlPolicy), AwsRegion
  aql: |
    SELECT eventtime, username, sourceip, "Event Name", "Request Parameters ACL", "Bucket Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cloudtrail%'
      AND "Event Name" IN ('PutBucketAcl', 'CreateBucket')
      AND "Request Parameters ACL" ILIKE '%public%'
    LAST 24 HOURS
  yara_l: |
    rule aws_s3_public_bucket_exposure {
      meta:
        author = "TDL"
        description = "Detects AWS S3 bucket made public via ACL changes"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1578"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "AWS CloudTrail"
        (
          $e.metadata.product_event_type = "PutBucketAcl" or
          $e.metadata.product_event_type = "CreateBucket"
        )
        re.regex($e.security_result.detection_fields["requestParameters"], `(?i)public`)
        $e.principal.user.userid = $user
        $e.target.resource.name = $bucket

      match:
        $user, $bucket over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("PutBucketAcl", "CreateBucket")
      AND (aws.cloudtrail.request_parameters LIKE "*public*" OR aws.cloudtrail.request_parameters LIKE "*PublicRead*" OR aws.cloudtrail.request_parameters LIKE "*PublicReadWrite*")
    | KEEP @timestamp, cloud.account.id, user.name, event.action, aws.cloudtrail.request_parameters, aws.s3.bucket.name
  leql: |
    where(source_json.eventName IN [PutBucketAcl, CreateBucket] AND (source_json.requestParameters.ACL ICONTAINS "public" OR source_json.requestParameters.acl ICONTAINS "public"))
  crowdstrike: |
    #repo=cloudtrail (eventName=PutBucketAcl OR eventName=CreateBucket) (requestParameters.x-amz-acl=*public* OR requestParameters.AccessControlPolicy.AccessControlList.Grant.Grantee.URI=*AllUsers* OR requestParameters.AccessControlPolicy.AccessControlList.Grant.Grantee.URI=*AuthenticatedUsers*)
    | table([@timestamp, userIdentity.principalId, eventName, requestParameters.bucketName, sourceIPAddress, userAgent])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and event_type = "AWS.S3.API"
    | filter action_log_level in ("PutBucketAcl", "CreateBucket")
    | filter action_resource_attributes ~= "(?i)public"
    | fields _time, actor_effective_username, action_log_level, action_resource_name, action_resource_attributes, action_country, actor_primary_user_agent
  lucene: |
    eventName:(PutBucketAcl OR CreateBucket) AND requestParameters.AccessControlList.Grant.Grantee.URI:(*AllUsers* OR *AuthenticatedUsers*) OR requestParameters.x-amz-acl:public*
  sumo: |
    _sourceCategory=*cloudtrail* (PutBucketAcl OR CreateBucket)
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.x-amz-acl" as acl
    | json field=_raw "requestParameters.AccessControlPolicy.AccessControlList.Grant[*].Grantee.URI" as grant_uri
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "sourceIPAddress" as src_ip
    | json field=_raw "requestParameters.bucketName" as bucket_name
    | where event_name in ("PutBucketAcl", "CreateBucket")
    | where acl matches "*public*" or grant_uri matches "*AllUsers*" or grant_uri matches "*AuthenticatedUsers*"
    | fields _messageTime, event_name, bucket_name, acl, grant_uri, user_arn, src_ip
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS S3 Event

  Where the Event Name is in [PutBucketAcl, CreateBucket]

  Where the Request Parameter ACL is in [public]'
suppression:
  window: 12 hours
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

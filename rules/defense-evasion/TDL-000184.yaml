rule_id: TDL-DE-000184
v4_id: 000184
name: Bash History Deleted - Linux
description: Detects when the history log is deleted on a host. Attackers will attempt to delete logs that contain record of their malicious activity.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070
technique_name: Indicator Removal on Host
platform:
- Linux
data_sources:
- Linux Operating System
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=linux sourcetype IN (linux_secure, syslog) \n(command=\"*history -c*\" OR command=\"*rm *.bash_history*\" OR command=\"*export*HISTFILE=/dev/null*\"\
    \ OR command=\"*export*HISTFILESIZE=0*\" OR command=\"*unset HISTFILE*\" OR command=\"*set +o history*\")\n| table _time, host, user, command\n"
  kql: "Syslog\n| where TimeGenerated > ago(24h)\n| where Facility == \"user\" or Facility == \"authpriv\"\n| where SyslogMessage has_any (\"\
    history -c\", \"rm \", \".bash_history\", \"export \", \"HISTFILE\", \"HISTFILESIZE\", \"unset HISTFILE\", \"set +o history\")\n| where SyslogMessage\
    \ matches regex @\"history\\s+-c\" \n    or SyslogMessage matches regex @\"rm\\s+.*\\.bash_history\"\n    or SyslogMessage matches regex @\"\
    export\\s+(?:HISTFILE=/dev/null|HISTFILESIZE=0)\"\n    or SyslogMessage matches regex @\"unset\\s+HISTFILE\"\n    or SyslogMessage matches\
    \ regex @\"set\\s+\\+o\\s+history\"\n| project TimeGenerated, Computer, HostName, ProcessName, SyslogMessage, Facility, SeverityLevel\n"
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Command Line" AS command
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%linux%' OR categoryname(category) ILIKE '%linux%')
      AND ("Command Line" ILIKE '%history -c%'
           OR "Command Line" ILIKE '%rm %.bash_history%'
           OR "Command Line" MATCHES '.*export\s+(?:HISTFILE=/dev/null|HISTFILESIZE=0).*'
           OR "Command Line" ILIKE '%unset HISTFILE%'
           OR "Command Line" ILIKE '%set +o history%')
    LAST 24 HOURS
  yara_l: |
    rule linux_history_tampering {
      meta:
        author = "TDL"
        description = "Detects Linux command history manipulation via history clearing commands"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1070"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.principal.platform = "LINUX"
        (
          re.regex($e.principal.process.command_line, `history\s+-c`) or
          re.regex($e.principal.process.command_line, `rm\s+.*\.bash_history`) or
          re.regex($e.principal.process.command_line, `export\s+(?:HISTFILE=/dev/null|HISTFILESIZE=0)`) or
          re.regex($e.principal.process.command_line, `unset\s+HISTFILE`) or
          re.regex($e.principal.process.command_line, `set\s+\+o\s+history`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process-*, logs-system.sysmon_operational-*, logs-*
    | WHERE event.category == "process" AND (host.os.type == "linux" OR host.os.family == "linux")
      AND (
        process.command_line LIKE "*history -c*"
        OR process.command_line LIKE "*rm *.bash_history*"
        OR process.command_line RLIKE ".*export\\s+(HISTFILE=/dev/null|HISTFILESIZE=0).*"
        OR process.command_line LIKE "*unset HISTFILE*"
        OR process.command_line LIKE "*set +o history*"
      )
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(process_cmd_line=/history\s+-c/ OR process_cmd_line=/rm\s+.*\.bash_history/ OR process_cmd_line=/export\s+(HISTFILE=\/dev\/null|HISTFILESIZE=0)/ OR process_cmd_line=/unset\s+HISTFILE/ OR process_cmd_line=/set\s+\+o\s+history/)
  crowdstrike: |
    event_simpleName=ProcessRollup2 event_platform=Lin
    (CommandLine=*history?-c* OR CommandLine=*rm*bash_history* OR CommandLine=/export\s+(HISTFILE=\/dev\/null|HISTFILESIZE=0)/ OR CommandLine=*unset?HISTFILE* OR CommandLine=*set?+o?history*)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and (action_process_image_command_line contains "history -c"
           or action_process_image_command_line contains "rm " and action_process_image_command_line contains ".bash_history"
           or action_process_image_command_line ~= "export\\s+(?:HISTFILE=/dev/null|HISTFILESIZE=0)"
           or action_process_image_command_line contains "unset HISTFILE"
           or action_process_image_command_line contains "set +o history")
      and agent_os_type = AGENT_OS_LINUX
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    (process.command_line:(*history\ -c* OR *rm*bash_history* OR *export*HISTFILE=/dev/null* OR *export*HISTFILESIZE=0* OR *unset\ HISTFILE* OR *set\ +o\ history*)) OR (message:(*history\ -c* OR *rm*bash_history* OR *export*HISTFILE=/dev/null* OR *export*HISTFILESIZE=0* OR *unset\ HISTFILE* OR *set\ +o\ history*))
  sumo: "_sourceCategory=*Linux* (\"history -c\" OR \"rm\" OR \"export\" OR \"unset HISTFILE\" OR \"set +o history\")\n| parse regex field=_raw\
    \ \"(?<command_line>.*)\" nodrop\n| where command_line matches \"*history -c*\" \n   OR command_line matches \"*rm*bash_history*\"\n   OR\
    \ command_line matches \"*export*HISTFILE=/dev/null*\"\n   OR command_line matches \"*export*HISTFILESIZE=0*\"\n   OR command_line matches\
    \ \"*unset HISTFILE*\"\n   OR command_line matches \"*set +o history*\"\n| fields _messageTime, _sourceHost, command_line\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Linux Command Line Event

  Where the Command contains ["history -c", "rm %.bash_history", "export\\s+(?:HISTFILE=/dev/null|HISTFILESIZE=0)", "unset HISTFILE", "set +o
  history"]'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

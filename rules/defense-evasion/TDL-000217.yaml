rule_id: TDL-DE-000217
v4_id: '000217'
name: File Encryption from Unsigned Process
description: Detects when an unsigned process executes an encryption process. Attackers or malicious processes may attempt to encrypt data on
  an infected host to either disguise data for exfiltration or damage the host by restricting access to core files, as used in ransomware.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1036
technique_name: Masquerading
platform:
- Windows
data_sources:
- Windows Operating System
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name="*.+*"

    | stats count values(host) as host values(user) as user by process_name, parent_process_name, command_line

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4688
    | extend ProcessName = Process
    | extend ParentProcessName = ParentProcessName
    | extend CommandLine = CommandLine
    | where ProcessName matches regex @".*\+.*"
    | summarize count_ = count(), Hosts = make_set(Computer), Users = make_set(SubjectUserName) by ProcessName, ParentProcessName, CommandLine
    | where count_ >= 1
    | sort by count_ desc
    | project ProcessName, ParentProcessName, CommandLine, count_, Hosts, Users
  aql: |
    SELECT "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid) AS host, username, COUNT(*) AS occurrences
    FROM events
    WHERE "EventID" = '1'
      AND ("Process Name" ILIKE '%encrypt%' OR "Process Name" ILIKE '%cipher%' OR "Process Name" ILIKE '%crypt%' OR "Process Name" ILIKE '%aes%' OR "Process Name" ILIKE '%rsa%')
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING occurrences >= 1
    ORDER BY occurrences DESC
    LAST 24 HOURS
  yara_l: "rule sysmon_encryption_process_masquerading {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects potential\
    \ masquerading encryption-related executables via Sysmon Process Creation\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique\
    \ = \"T1036\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.vendor_name =\
    \ \"Microsoft\"\n    $e.metadata.product_name = \"Sysmon\"\n    $e.metadata.product_event_type = \"1\"\n    re.regex($e.target.process.file.full_path,\
    \ `(?i).*\\.\\+.*`)\n    $e.target.process.file.full_path = $process_name\n    $e.target.process.command_line = $command_line\n    $e.principal.process.file.full_path\
    \ = $parent_process_name\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    \n  match:\n    $process_name, $parent_process_name,\
    \ $command_line over 1h\n    \n  outcome:\n    $risk_score = 50\n    \n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == 1 AND process.name RLIKE ".+\\.(exe|bat|cmd|ps1|vbs|js)"
    | STATS count = COUNT(*), hosts = VALUES(host.name), users = VALUES(user.name) BY process.name, process.parent.name, process.command_line
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\+.*/) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    EventCode=1 (FileName=*crypt* OR FileName=*cipher* OR FileName=*encode* OR FileName=*gpg* OR FileName=*pgp* OR FileName=*veracrypt* OR FileName=*truecrypt* OR FileName=*bitlocker* OR FileName=*7z* OR FileName=*rar* OR FileName=*zip* OR FileName=*aes* OR FileName=*rsa*)
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=[count(as=cnt), collect([ComputerName], as=hosts), collect([UserName], as=users)])
    | cnt >= 1
    | sort(cnt, order=desc, limit=10000)
    | table([FileName, ParentBaseFileName, CommandLine, cnt, hosts, users])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 1
    | filter action_process_image_name ~= ".*\\.\\+.*"
    | comp count() as event_count, values(agent_hostname) as hosts, values(actor_effective_username) as users by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    winlog.event_id:1 AND process.name:*+*
  sumo: |
    _sourceCategory=*Windows* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id = "1" and process_name matches "*crypt*" or process_name matches "*encode*" or process_name matches "*cipher*"
    | count as occurrences by process_name, parent_process_name, command_line
    | where occurrences >= 1
    | sort by occurrences desc
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — distinguish administrative tooling from adversary tradecraft
  (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'
pseudo_logic: '1 Instance within any observed window of a Sysmon Process Creation event where the process name matches a wildcard pattern indicating
  an encryption-related executable.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1 (Process Creation)

  Where process_name matches pattern "*.+*" indicating an unsigned or suspiciously named encryption process

  With stats aggregated by process_name, parent_process_name, and command_line

  Where count of matching events is greater than or equal to 1


  With the same process_name, parent_process_name, and command_line as the correlation key, surfacing associated hosts and users via values(host)
  and values(user), sorted descending by occurrence count.'

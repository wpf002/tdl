rule_id: TDL-DE-000225
v4_id: '000225'
name: Credentials Stored in Plaintext
description: The attacker would modify key systems to store plaintext credentials in memory. This can be modified in the Wdigest registry key.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1112
technique_name: Modify Registry
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4657'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows EventCode IN (567, 4657) Object_Name IN ("HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders\\WDigest",
    "HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders\\WDigest") Object_Value_Name="WDigest" New_Value=1

    | table _time, ComputerName, EventCode, Object_Name, Object_Value_Name, New_Value, SubjectUserName, ProcessName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (567, 4657)
    | where ObjectName has_any ("HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders", "HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders")
    | where ObjectValueName =~ "WDigest"
    | where NewValue == "1"
    | project TimeGenerated, Computer, Account, EventID, ObjectName, ObjectValueName, OldValue, NewValue, ProcessName, ProcessId
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Object Name\", \"Object Value Name\", \"New Value\"\nFROM events\nWHERE\
    \ \"EventID\" IN ('567', '4657')\n  AND (\"Object Name\" ILIKE '%HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders%'\
    \ \n       OR \"Object Name\" ILIKE '%HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders%')\n  AND \"Object Value Name\" = 'WDigest'\n\
    \  AND \"New Value\" = '1'\nLAST 24 HOURS\n"
  yara_l: |
    rule wdigest_credential_caching_enabled {
      meta:
        author = "TDL"
        description = "Detects enabling of WDigest credential caching via registry modification (T1112)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1112"
        severity = "High"

      events:
        $e.metadata.event_type = "REGISTRY_MODIFICATION"
        (
          $e.metadata.product_event_type = "567" or
          $e.metadata.product_event_type = "4657"
        )
        (
          re.regex($e.target.registry.registry_key, `(?i)HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders`) or
          re.regex($e.target.registry.registry_key, `(?i)HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders`)
        )
        re.regex($e.target.registry.registry_value_name, `(?i)WDigest`)
        $e.target.registry.registry_value_data = "1"
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("567", "4657")
      AND (winlog.event_data.ObjectName LIKE "*\\System\\CurrentControlSet\\Control\\SecurityProviders*" OR winlog.event_data.ObjectName LIKE "*\\System\\CurrentControlSet\\Control\\SecurityProviders")
      AND winlog.event_data.ObjectValueName == "WDigest"
      AND winlog.event_data.NewValue == "1"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ObjectName, winlog.event_data.ObjectValueName, winlog.event_data.NewValue, winlog.event_data.ProcessName
  leql: |
    where(source_json.EventID IN [567, 4657] AND source_json.ObjectName IN ["HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SecurityProviders", "HKLM\System\CurrentControlSet\Control\SecurityProviders"] AND source_json.ObjectValueName="WDigest" AND source_json.NewValue=1)
  crowdstrike: "EventCode=4657 \n(\"HKEY_LOCAL_MACHINE\\\\System\\\\CurrentControlSet\\\\Control\\\\SecurityProviders\" OR \"HKLM\\\\System\\\\\
    CurrentControlSet\\\\Control\\\\SecurityProviders\")\nObjectValueName=\"WDigest\"\nNewValue=1\n| table([@timestamp, ComputerName, SubjectUserName,\
    \ ObjectName, ObjectValueName, OldValue, NewValue])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (567, 4657)
    | filter action_registry_key_name in ("HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders", "HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders")
    | filter action_registry_value_name = "WDigest"
    | filter action_registry_data = "1"
    | fields _time, agent_hostname, actor_effective_username, action_registry_key_name, action_registry_value_name, action_registry_data
  lucene: |
    event.code:(567 OR 4657) AND winlog.event_data.ObjectName:(*HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\Control\\SecurityProviders* OR *HKLM\\System\\CurrentControlSet\\Control\\SecurityProviders*) AND winlog.event_data.ObjectValueName:"WDigest" AND winlog.event_data.NewValue:1
  sumo: |
    _sourceCategory=*Windows* ("4657" OR "567")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectName" as object_name
    | json field=_raw "ObjectValueName" as value_name
    | json field=_raw "NewValue" as new_value
    | where event_id in ("567", "4657")
    | where object_name matches "*System*CurrentControlSet*Control*SecurityProviders*"
    | where value_name = "WDigest"
    | where new_value = "1"
    | fields _messageTime, _sourceHost, event_id, object_name, value_name, new_value
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Registry Modification Event

  Where the Event ID is in [567, 4657]

  Where the Object Name is in [HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SecurityProviders, HKLM\System\CurrentControlSet\Control\SecurityProviders]

  Where the Object Value Name is "WDigest"

  Where the New Value is 1'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

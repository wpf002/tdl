rule_id: TDL-DE-000230
v4_id: '000230'
name: Root Certificate Installed
description: Detects when a new root certificate is installed using the certutil.exe utility. Attackers could install certificates for their malicious
  web servers so the host will trust the web site and not prompt a warning for the user. An attacker can also clone root certificates, sign malicious
  code, and then reinstall the certificates so the code appears signed by trusted vendors.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1553
technique_name: Subvert Trust Controls
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows EventCode=4688 New_Process_Name="*\\certutil.exe" (Process_Command_Line="*-addstore*" AND Process_Command_Line="*root*")

    | table _time, ComputerName, New_Process_Name, Process_Command_Line, Creator_Process_Name, Account_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where Process has "certutil.exe"
    | where CommandLine has "-addstore" and CommandLine has "root"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%certutil.exe%'
      AND "Process CommandLine" ILIKE '%-addstore%'
      AND "Process CommandLine" ILIKE '%root%'
    LAST 24 HOURS
  yara_l: |
    rule certutil_addstore_root {
      meta:
        author = "Detection Engineer"
        description = "Detects certutil.exe adding certificate to root store - T1553 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1553"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "4688"
        re.regex($e.principal.process.file.full_path, `(?i)\\certutil\.exe$`)
        re.regex($e.principal.process.command_line, `(?i)-addstore`)
        re.regex($e.principal.process.command_line, `(?i)root`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 24 hour
      AND (event.code == "4688" OR winlog.event_id == "4688" OR event.code == "592" OR winlog.event_id == "592")
      AND TO_LOWER(process.name) == "certutil.exe"
      AND process.command_line LIKE "*-addstore*"
      AND process.command_line LIKE "*root*"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ICONTAINS "certutil.exe" AND process_cmd_line ICONTAINS "-addstore" AND process_cmd_line ICONTAINS "root")
  crowdstrike: "EventCode=4688 \n(CommandLine=*certutil* AND CommandLine=*-addstore* AND CommandLine=*root*)\n| table([@timestamp, ComputerName,\
    \ UserName, CommandLine, ParentProcessName])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "certutil.exe"
    | filter action_process_image_command_line contains "-addstore" and action_process_image_command_line contains "root"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.name:certutil.exe AND process.command_line:(*-addstore* AND *root*)
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("4688", "592")
    | where process_name matches "*certutil.exe"
    | where command_line matches "*-addstore*" and command_line matches "*root*"
    | fields _messageTime, _sourceHost, event_id, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Execution Event

  Where the Event ID is in [592, 4688]

  Where the Process Name is certutil.exe

  Where the command line is in (-addstore, root)'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

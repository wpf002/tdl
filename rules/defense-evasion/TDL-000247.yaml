rule_id: TDL-DE-000247
v4_id: '000247'
name: Local Firewall Modified
description: Detects when the Windows Firewall is disabled or modified on a  host. Malware typically works to disable security features on hosts.
  While this method is typically considered noisy malicious activity, any tampering of the Windows Firewall service is considered an indicator
  of compromise on a machine.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5025'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=5025

    | table _time, ComputerName, host, User, Account_Name, Service_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 5025
    | project TimeGenerated, Computer, Account, Activity, EventData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "EventID"
    FROM events
    WHERE "EventID" = '5025'
    LAST 24 HOURS
  yara_l: |
    rule windows_firewall_service_stopped {
      meta:
        author = "TDL"
        description = "Detects Windows Firewall service being stopped (Event ID 5025)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "High"

      events:
        $e.metadata.event_type = "SERVICE_MODIFICATION"
        $e.metadata.product_event_type = "5025"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE event.code == "5025" OR winlog.event_id == "5025"
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_id, winlog.event_data.ServiceName, message
  leql: |
    where(source_json.EventID=5025)
  crowdstrike: |
    EventCode=5025
    | table([@timestamp, ComputerName, UserName, ServiceName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 5025
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_data_ServiceName
  lucene: |
    event.code:5025
  sumo: |
    _sourceCategory=*Windows* "5025"
    | json field=_raw "EventID" as event_id
    | where event_id = "5025"
    | fields _messageTime, _sourceHost, event_id
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Firewall Service Stopped Event \nWhere the Event ID is 5025"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

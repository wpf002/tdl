rule_id: TDL-DE-000251
v4_id: '000251'
name: Cobalt Strike DLL Loaded with StartW Function
description: Detects Cobalt Strike leveraging Rundll32 to call the StartW export function and load DLLs from the command line. Investigate the
  parent/child relationships and surrounding system activity of the RunDLL32.exe process in question.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1218
technique_name: System Binary Proxy Execution
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) (Process_Name="*\\rundll32.exe" OR Image="*\\rundll32.exe") (CommandLine="* startw*" OR
    CommandLine="*,startw*")

    | table _time, ComputerName, User, Process_Name, Image, CommandLine, ParentImage, Parent_Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process endswith "rundll32.exe"
    | where CommandLine has_any (" startw", ",startw")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", sourceip
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%rundll32.exe%'
      AND ("Process CommandLine" ILIKE '% startw%' OR "Process CommandLine" ILIKE '%,startw%')
    LAST 24 HOURS
  yara_l: "rule rundll32_startw_execution {\n  meta:\n    author = \"TDL\"\n    description = \"Detects rundll32.exe execution with startw parameter\
    \ - T1218 Defense Evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1218\"\n    \n  events:\n    $e.metadata.event_type\
    \ = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n      $e.metadata.product_event_type = \"4688\"\n    )\n\
    \    re.regex($e.target.process.file.full_path, `(?i)\\\\rundll32\\.exe$`)\n    (\n      re.regex($e.target.process.command_line, `(?i) startw`)\
    \ or\n      re.regex($e.target.process.command_line, `(?i),startw`)\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over\
    \ 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688")
      AND process.name == "rundll32.exe"
      AND (process.command_line LIKE "* startw*" OR process.command_line LIKE "*,startw*")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="rundll32.exe" AND (process_cmd_line ICONTAINS " startw" OR process_cmd_line ICONTAINS ",startw"))
  crowdstrike: |
    EventCode=4688 FileName=rundll32.exe (CommandLine=*\ startw* OR CommandLine=*,startw*)
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine, FileName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "rundll32.exe"
    | filter action_process_image_command_line ~= "(?i)(\\s|,)startw"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, action_process_image_path
  lucene: |
    event.code:(592 OR 4688) AND process.name:rundll32.exe AND (process.command_line:*\ startw* OR process.command_line:*,startw*)
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("4688", "592")
    | where process_name matches "*rundll32.exe"
    | where command_line matches "* startw*" OR command_line matches "*,startw*"
    | fields _messageTime, _sourceHost, event_id, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "rundll32.exe"

  AND Command Line contains " startw" or ",startw"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

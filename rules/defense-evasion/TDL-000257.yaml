rule_id: TDL-DE-000257
v4_id: '000257'
name: Potential Pass the Hash Attack Activity
description: Pass the Hash (PTH) is commonly found when an attacker is dumping a connected user's password hash via NTLM from memory. The hash
  is passed to the remote host as a NTLM authentication instead of requesting a service ticket from the domain controller using Kerberos.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1550
technique_name: Use Alternate Authentication Material
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4624'
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=528 OR EventCode=540 OR EventCode=4624) Logon_Type=9 Authentication_Package="Negotiate"
    Logon_Process="seclogo"

    | table _time, ComputerName, Account_Name, TargetUserName, Logon_Type, Authentication_Package, Logon_Process, Source_Network_Address, Workstation_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4624
    | where LogonType == 9
    | where AuthenticationPackageName =~ "Negotiate"
    | where LogonProcessName =~ "seclogo"
    | project TimeGenerated, Computer, Account, TargetAccount, TargetUserName, IpAddress, WorkstationName, LogonType, AuthenticationPackageName, LogonProcessName
  aql: |
    SELECT eventtime, username, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS host, "Logon Type", "Authentication Package", "Logon Process"
    FROM events
    WHERE "EventID" IN ('528', '540', '4624')
      AND "Logon Type" = '9'
      AND "Authentication Package" ILIKE '%Negotiate%'
      AND "Logon Process" ILIKE '%seclogo%'
    LAST 24 HOURS
  yara_l: "rule mitre_t1550_pass_the_hash_token_detection {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Pass the Hash or Pass\
    \ the Token activity via logon type 9 with Negotiate authentication\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique\
    \ = \"T1550\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.metadata.product_event_type =\
    \ \"4624\"\n    $e.security_result.action = \"ALLOW\"\n    $e.target.user.userid = $user\n    $e.principal.hostname = $host\n    re.regex($e.additional.fields.value.string_value,\
    \ `(?i)LogonType.*9`)\n    re.regex($e.additional.fields.value.string_value, `(?i)AuthenticationPackage.*Negotiate`)\n    re.regex($e.additional.fields.value.string_value,\
    \ `(?i)LogonProcess.*seclogo`)\n    \n  match:\n    $host, $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.code IN ("528", "540", "4624")
      AND winlog.event_data.LogonType == "9"
      AND TO_LOWER(winlog.event_data.AuthenticationPackageName) == "negotiate"
      AND TO_LOWER(winlog.event_data.LogonProcessName) == "seclogo"
    | KEEP @timestamp, host.name, user.name, source.ip, winlog.event_data.TargetUserName, winlog.event_data.WorkstationName, winlog.event_data.IpAddress
  leql: |
    where(source_json.EventID=4624 AND source_json.LogonType=9 AND source_json.AuthenticationPackageName="Negotiate" AND source_json.LogonProcessName="seclogo")
  crowdstrike: |
    EventCode=4624 LogonType=9 AuthenticationPackageName=Negotiate LogonProcessName=seclogo
    | table([@timestamp, ComputerName, TargetUserName, IpAddress, WorkstationName, SubjectUserName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4624
    | filter action_evtlog_event_data_LogonType = "9"
    | filter action_evtlog_event_data_AuthenticationPackageName = "Negotiate"
    | filter action_evtlog_event_data_LogonProcessName = "seclogo"
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_IpAddress, action_evtlog_event_data_WorkstationName
  lucene: |
    event.code:4624 AND winlog.event_data.LogonType:9 AND winlog.event_data.AuthenticationPackageName:Negotiate AND winlog.event_data.LogonProcessName:seclogo
  sumo: |
    _sourceCategory=*Windows*Security* "4624"
    | json field=_raw "EventID" as event_id
    | json field=_raw "LogonType" as logon_type
    | json field=_raw "AuthenticationPackageName" as auth_package
    | json field=_raw "LogonProcessName" as logon_process
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "Computer" as computer
    | json field=_raw "IpAddress" as ip_address
    | where event_id in ("528", "540", "4624")
    | where logon_type = "9"
    | where auth_package = "Negotiate"
    | where logon_process = "seclogo"
    | fields _messageTime, computer, target_user, ip_address, logon_type, auth_package, logon_process
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Authentication Success Event

  Where the Event ID is in [528, 540, 4624]

  Where the Logon Type is 9

  Where the Authentication Package is "Negotiate"

  Where the Logon Process is "seclogo"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

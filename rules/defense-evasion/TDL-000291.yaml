rule_id: TDL-DE-000291
v4_id: 000291
name: TLS Downgrade
description: An attacker tries a downgrade attack by modifying the Azure application configuration for TLS 1.3
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=azure sourcetype=azure:aad:signin \n| spath path=properties.authenticationProcessingDetails{} output=authDetails\n| mvexpand authDetails\n\
    | spath input=authDetails path=key output=authKey\n| spath input=authDetails path=value output=authValue\n| search authKey=\"Legacy TLS (TLS\
    \ 1.0, 1.2, 3DES)\" authValue=\"True\"\n| table _time, properties.userPrincipalName, properties.ipAddress, properties.appDisplayName, properties.location.city,\
    \ properties.location.countryOrRegion, authKey, authValue\n"
  kql: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where AuthenticationProcessingDetails has_cs "Legacy TLS (TLS 1.0, 1.2, 3DES)"
    | mv-expand AuthDetail = AuthenticationProcessingDetails
    | where AuthDetail.key =~ "Legacy TLS (TLS 1.0, 1.2, 3DES)" and AuthDetail.value =~ "True"
    | project TimeGenerated, UserPrincipalName, AppDisplayName, IPAddress, Location, DeviceDetail, AuthDetail
  aql: |
    SELECT sourceip, username, QIDNAME(qid), CATEGORYNAME(category), "Authentication Process Details", eventtime
    FROM events
    WHERE "Authentication Process Details" ILIKE '%Legacy TLS (TLS 1.0, 1.2, 3DES)%True%'
       OR ("Authentication Process Details" ILIKE '%Legacy TLS (TLS 1.0, 1.2, 3DES)%' AND "Authentication Process Details" ILIKE '%True%')
    LAST 24 HOURS
  yara_l: |
    rule azure_legacy_tls_authentication {
      meta:
        author = "TDL"
        description = "Detects authentication using legacy TLS protocols (TLS 1.0, 1.2, 3DES) in Azure"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.detection_fields.key = "Legacy TLS (TLS 1.0, 1.2, 3DES)"
        $e.security_result.detection_fields.value = "True"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure*
    | WHERE azure.signinlogs.properties.authentication_processing_details.key == "Legacy TLS (TLS 1.0, 1.2, 3DES)" AND azure.signinlogs.properties.authentication_processing_details.value == "True"
    | KEEP @timestamp, azure.signinlogs.properties.user_principal_name, azure.signinlogs.properties.ip_address, azure.signinlogs.properties.location, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.authentication_processing_details.key, azure.signinlogs.properties.authentication_processing_details.value
  leql: |
    where(source_json.authenticationProcessingDetails.key="Legacy TLS (TLS 1.0, 1.2, 3DES)" AND source_json.authenticationProcessingDetails.value="True")
  crowdstrike: |
    #type=azure* "Legacy TLS (TLS 1.0, 1.2, 3DES)"=True
    | table([@timestamp, ComputerName, UserName, event_simpleName])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Azure" and observer_name = "Azure Active Directory"
    | arrayexpand additional_fields
    | filter additional_fields.key = "Authentication Process Details" and additional_fields.value contains "Legacy TLS" and additional_fields.value contains "True"
    | fields _time, actor_user, action_name, resource_name, additional_fields
  lucene: |
    event.dataset:"azure.auditlogs" AND azure.auditlogs.properties.authentication_processing_details.key:"Legacy TLS (TLS 1.0, 1.2, 3DES)" AND azure.auditlogs.properties.authentication_processing_details.value:"True"
  sumo: "_sourceCategory=*Azure* \n| json field=_raw \"properties.authenticationProcessingDetails\" as auth_details\n| where auth_details matches\
    \ \"*Legacy TLS*\" and auth_details matches \"*True*\"\n| fields _messageTime, _sourceHost, auth_details\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 Azure Event Where the Authentication Process Details key is "Legacy TLS (TLS 1.0, 1.2, 3DES)" AND the Authentication Process Details
  value is "True"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — distinguish administrative tooling from adversary tradecraft (LOLBins,
  signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

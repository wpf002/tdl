rule_id: TDL-DE-000301
v4_id: '000301'
name: Google Workspace Application Removed from Blocklist
description: Detects when a user with Google Workspace administrative permissions removes an application from the explicit block list to allow
  distribution of the application amongst users. This may also indicate the unauthorized use of an application that had been previously blocked
  before by a user with admin privileges.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=gsuite:reports:admin events.name="CHANGE_APPLICATION_SETTING" events.parameters{}.oldValue="*allowed*false*"
    events.parameters{}.newValue="*allowed*true*"

    | table _time, actor.email, events.name, events.parameters{}.oldValue, events.parameters{}.newValue, events.parameters{}.settingName

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(1h)
    | where RecordType == "admin"
    | where Operation == "CHANGE_APPLICATION_SETTING"
    | extend OldValue = tostring(parse_json(tostring(AdditionalDetails)).OLD_VALUE)
    | extend NewValue = tostring(parse_json(tostring(AdditionalDetails)).NEW_VALUE)
    | where OldValue contains "allowed" and OldValue contains "false"
    | where NewValue contains "allowed" and NewValue contains "true"
    | project TimeGenerated, ActorIpAddress, UserId, Operation, OldValue, NewValue, RecordType
  aql: |
    SELECT eventtime, username, sourceip, "OLD_VALUE", "NEW_VALUE", "events.name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "events.name" = 'CHANGE_APPLICATION_SETTING'
      AND "OLD_VALUE" ILIKE '%allowed%' AND "OLD_VALUE" ILIKE '%false%'
      AND "NEW_VALUE" ILIKE '%allowed%' AND "NEW_VALUE" ILIKE '%true%'
    LAST 24 HOURS
  yara_l: |
    rule gworkspace_app_setting_allow_change {
      meta:
        author = "Detection Engineer"
        description = "Detects Google Workspace application setting changes from disallowed to allowed - T1562 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Google"
        $e.metadata.product_name = "Google Workspace"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        $e.metadata.product_event_type = "CHANGE_APPLICATION_SETTING"
        re.regex($e.security_result.detection_fields["OLD_VALUE"], `(?i)allowed.*false`)
        re.regex($e.security_result.detection_fields["NEW_VALUE"], `(?i)allowed.*true`)
        $e.principal.user.userid = $user
        $e.target.hostname = $org

      match:
        $user, $org over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action == "CHANGE_APPLICATION_SETTING"
      AND TO_LOWER(google_workspace.admin.old_value) LIKE "*allowed*" AND TO_LOWER(google_workspace.admin.old_value) LIKE "*false*"
      AND TO_LOWER(google_workspace.admin.new_value) LIKE "*allowed*" AND TO_LOWER(google_workspace.admin.new_value) LIKE "*true*"
    | KEEP @timestamp, user.email, event.action, google_workspace.admin.setting.name, google_workspace.admin.old_value, google_workspace.admin.new_value, google_workspace.organization.domain
  leql: |
    where(source_json.events.name="CHANGE_APPLICATION_SETTING" AND source_json.OLD_VALUE ICONTAINS "allowed" AND source_json.OLD_VALUE ICONTAINS "false" AND source_json.NEW_VALUE ICONTAINS "allowed" AND source_json.NEW_VALUE ICONTAINS "true")
  crowdstrike: |
    #event_platform=GoogleWorkspace events.name="CHANGE_APPLICATION_SETTING" OLD_VALUE=*allowed* OLD_VALUE=*false* NEW_VALUE=*allowed* NEW_VALUE=*true*
    | table([@timestamp, actor.email, events.name, OLD_VALUE, NEW_VALUE, ip_address])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and event_type = "CHANGE_APPLICATION_SETTING"
    | filter lowercase(OLD_VALUE) contains "allowed" and lowercase(OLD_VALUE) contains "false"
    | filter lowercase(NEW_VALUE) contains "allowed" and lowercase(NEW_VALUE) contains "true"
    | fields _time, actor_user, target_resource, OLD_VALUE, NEW_VALUE, event_type
  lucene: |
    events.name:"CHANGE_APPLICATION_SETTING" AND OLD_VALUE:(*allowed* AND *false*) AND NEW_VALUE:(*allowed* AND *true*)
  sumo: |
    _sourceCategory=*Google*Workspace* "CHANGE_APPLICATION_SETTING"
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_name
    | json field=_raw "events[*].parameters[*].value" as param_value
    | json field=_raw "events[*].parameters[*].multiValue" as multi_value
    | where event_name = "CHANGE_APPLICATION_SETTING"
    | where (param_name = "OLD_VALUE" and param_value matches "*allowed*" and param_value matches "*false*") or (param_name = "NEW_VALUE" and param_value matches "*allowed*" and param_value matches "*true*")
    | fields _messageTime, _sourceHost, event_name, param_name, param_value
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is "CHANGE_APPLICATION_SETTING"

  And the OLD_VALUE contains "allowed" and "false"

  And the NEW_VALUE contains "allowed" and "true"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

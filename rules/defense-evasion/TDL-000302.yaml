rule_id: TDL-DE-000302
v4_id: '000302'
name: Domain Added to Google Workspace Trusted Domains
description: Detects when a domain is added to the list of trusted Google Workspace domains. An adversary may add a trusted domain in order to
  collect and exfiltrate data from their target’s organization with less restrictive security controls.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1484
technique_name: Domain or Tenant Policy Modification
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=gsuite:admin events{}.name="ADD_TRUSTED_DOMAINS"

    | table _time, actor.email, events{}.name, events{}.parameters{}.value, org_unit_name

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(90d)
    | where RecordType == "admin"
    | mv-expand Events = parse_json(Events)
    | where Events.name == "ADD_TRUSTED_DOMAINS"
    | project TimeGenerated, ActorIpAddress, ActorUserId, EventName = tostring(Events.name), Parameters = Events.parameters
  aql: |
    SELECT eventtime, username, sourceip, QIDNAME(qid), LOGSOURCENAME(logsourceid), "Event Name"
    FROM events
    WHERE "Event Name" = 'ADD_TRUSTED_DOMAINS'
    LAST 24 HOURS
  yara_l: "rule gws_trusted_domain_added {\n  meta:\n    author = \"TDL\"\n    description = \"Detects addition of trusted domains in Google Workspace\
    \ (T1484 Defense Evasion)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1484\"\n    severity = \"Medium\"\
    \n    \n  events:\n    $e.metadata.product_name = \"Google Workspace\"\n    $e.metadata.product_event_type = \"ADD_TRUSTED_DOMAINS\"\n   \
    \ $e.principal.user.userid = $user\n    \n  match:\n    $user over 1h\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action == "ADD_TRUSTED_DOMAINS" OR event.dataset == "google_workspace.admin" AND event.action == "ADD_TRUSTED_DOMAINS"
    | KEEP @timestamp, user.email, source.ip, event.action, google_workspace.admin.domain.name, google_workspace.admin.new_value
  leql: |
    where(source_json.events.name="ADD_TRUSTED_DOMAINS")
  crowdstrike: |
    #event_platform=Google* events.name="ADD_TRUSTED_DOMAINS"
    | table([@timestamp, actor.email, events.name, events.parameters.DOMAIN_NAME, events.parameters.NEW_VALUE])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and logon.application = "Google Workspace" and action_name = "ADD_TRUSTED_DOMAINS"
    | fields _time, actor_user, action_name, action_resource_name, action_resource_type
  lucene: |
    events.name:"ADD_TRUSTED_DOMAINS"
  sumo: |
    _sourceCategory=*Google*Workspace*
    | json field=_raw "events[*].name" as event_name
    | where event_name = "ADD_TRUSTED_DOMAINS"
    | fields _messageTime, _sourceHost, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is "ADD_TRUSTED_DOMAINS"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

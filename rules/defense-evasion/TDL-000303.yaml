rule_id: TDL-DE-000303
v4_id: '000303'
name: Google Workspace Bitlocker Setting Disabled
description: Detects when an administrative user disables BitLocker drive encryption, which can be used in Google Workspace to mitigate unauthorized
  data access on lost or stolen computers. Adversaries with valid account access may disable BitLocker to access sensitive data on an endpoint
  added to Google Workspace device management.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=google_workspace sourcetype="google:gws:admin" eventName="CHANGE_APPLICATION_SETTING" parameters.SETTING_NAME=bitlocker* parameters.NEW_VALUE="disabled"

    | table _time, actor.email, parameters.SETTING_NAME, parameters.NEW_VALUE, parameters.OLD_VALUE, ipAddress

    '
  kql: |
    GoogleWorkspaceActivityEvents
    | where TimeGenerated > ago(1h)
    | where EventName == "CHANGE_APPLICATION_SETTING"
    | where AdditionalDetails has "SETTING_NAME"
    | extend SettingName = tostring(parse_json(AdditionalDetails).SETTING_NAME)
    | extend NewValue = tostring(parse_json(AdditionalDetails).NEW_VALUE)
    | where SettingName startswith "bitlocker"
    | where NewValue == "disabled"
    | project TimeGenerated, UserPrincipalName, EventName, SettingName, NewValue, AdditionalDetails
  aql: |
    SELECT eventtime, username, sourceip, "Application", "SETTING_NAME", "NEW_VALUE", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Event Name" = 'CHANGE_APPLICATION_SETTING'
      AND "SETTING_NAME" ILIKE 'bitlocker%'
      AND "NEW_VALUE" = 'disabled'
    LAST 24 HOURS
  yara_l: |
    rule gws_bitlocker_disabled {
      meta:
        author = "Detection Engineering"
        description = "Detects BitLocker being disabled in Google Workspace settings - T1562 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "High"

      events:
        $e.metadata.product_name = "Google Workspace"
        $e.metadata.vendor_name = "Google"
        $e.metadata.product_event_type = "CHANGE_APPLICATION_SETTING"
        re.regex($e.target.resource.attribute.labels["SETTING_NAME"], `^bitlocker`)
        $e.target.resource.attribute.labels["NEW_VALUE"] = "disabled"
        $e.principal.user.userid = $user
        $e.principal.hostname = $host

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-google_workspace*\n| WHERE event.action == \"CHANGE_APPLICATION_SETTING\" \n  AND STARTS_WITH(TO_LOWER(google_workspace.admin.setting.name),\
    \ \"bitlocker\") \n  AND TO_LOWER(google_workspace.admin.new_value) == \"disabled\"\n| KEEP @timestamp, user.name, user.email, host.name,\
    \ source.ip, google_workspace.admin.setting.name, google_workspace.admin.new_value, google_workspace.admin.old_value\n"
  leql: |
    where(source_json.events.name="CHANGE_APPLICATION_SETTING" AND source_json.SETTING_NAME STARTS-WITH "bitlocker" AND source_json.NEW_VALUE="disabled")
  crowdstrike: |
    #type=google_workspace events.name="CHANGE_APPLICATION_SETTING" SETTING_NAME=bitlocker* NEW_VALUE="disabled"
    | table([@timestamp, actor.email, ipAddress, SETTING_NAME, NEW_VALUE, OLD_VALUE])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and cloud_provider = "GCP"
    | filter event_name = "CHANGE_APPLICATION_SETTING"
    | filter parameters.SETTING_NAME ~= "^bitlocker"
    | filter parameters.NEW_VALUE = "disabled"
    | fields _time, actor_user, event_name, parameters.SETTING_NAME, parameters.NEW_VALUE, target_resource
  lucene: |
    events.name:"CHANGE_APPLICATION_SETTING" AND SETTING_NAME:bitlocker* AND NEW_VALUE:"disabled"
  sumo: |
    _sourceCategory=*Google*Workspace* "CHANGE_APPLICATION_SETTING"
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_name
    | json field=_raw "events[*].parameters[*].value" as param_value
    | where event_name = "CHANGE_APPLICATION_SETTING"
    | where param_name matches "bitlocker*" and param_value = "disabled"
    | fields _messageTime, _sourceHost, event_name, param_name, param_value
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is "CHANGE_APPLICATION_SETTING"

  And the SETTING_NAME starts with bitlocker

  And the NEW_VALUE is "disabled"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

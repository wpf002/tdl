rule_id: TDL-DE-000304
v4_id: '000304'
name: Google Workspace Password Policy Modified
description: Detects when a Google Workspace password policy is modified. An adversary may attempt to modify a password policy in order to weaken
  an organization’s security controls.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1484
technique_name: Domain or Tenant Policy Modification
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=google:gworkspace:admin (events.name="CHANGE_APPLICATION_SETTING" OR events.name="CREATE_APPLICATION_SETTING")
    (SETTING_NAME="password management - enforce strong password" OR SETTING_NAME="password management - password reset frequency" OR SETTING_NAME="password
    management - enable password reuse" OR SETTING_NAME="password management - enforce password policy at next login" OR SETTING_NAME="password
    management - minimum password length" OR SETTING_NAME="password management - maximum password length")

    | table _time, events.name, SETTING_NAME, user, NEW_VALUE, OLD_VALUE

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(90d)
    | where RecordType == "admin"
    | extend EventName = tostring(parse_json(tostring(EventData)).events[0].name)
    | extend Parameters = parse_json(tostring(EventData)).events[0].parameters
    | mv-expand Parameters
    | extend SettingName = tostring(Parameters.name)
    | where EventName in ("CHANGE_APPLICATION_SETTING", "CREATE_APPLICATION_SETTING")
    | where SettingName in (
        "password management - enforce strong password",
        "password management - password reset frequency",
        "password management - enable password reuse",
        "password management - enforce password policy at next login",
        "password management - minimum password length",
        "password management - maximum password length"
    )
    | project TimeGenerated, ActorIpAddress, UserId, EventName, SettingName, Parameters
  aql: "SELECT eventtime, username, \"Event Name\", \"Setting Name\", LOGSOURCENAME(logsourceid) AS source\nFROM events\nWHERE (\"Event Name\"\
    \ = 'CHANGE_APPLICATION_SETTING' OR \"Event Name\" = 'CREATE_APPLICATION_SETTING')\n  AND (\"Setting Name\" = 'password management - enforce\
    \ strong password' \n       OR \"Setting Name\" = 'password management - password reset frequency'\n       OR \"Setting Name\" = 'password\
    \ management - enable password reuse'\n       OR \"Setting Name\" = 'password management - enforce password policy at next login'\n      \
    \ OR \"Setting Name\" = 'password management - minimum password length'\n       OR \"Setting Name\" = 'password management - maximum password\
    \ length')\nLAST 24 HOURS\n"
  yara_l: |
    rule gws_password_policy_modification {
      meta:
        author = "Detection Engineer"
        description = "Detects modifications to Google Workspace password policy settings - MITRE T1484 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1484"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Google Workspace"
        (
          $e.metadata.product_event_type = "CHANGE_APPLICATION_SETTING" or
          $e.metadata.product_event_type = "CREATE_APPLICATION_SETTING"
        )
        (
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - enforce strong password" or
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - password reset frequency" or
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - enable password reuse" or
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - enforce password policy at next login" or
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - minimum password length" or
          $e.target.resource.attribute.labels["SETTING_NAME"] = "password management - maximum password length"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action IN ("CHANGE_APPLICATION_SETTING", "CREATE_APPLICATION_SETTING")
      AND TO_LOWER(google_workspace.admin.setting.name) IN (
        "password management - enforce strong password",
        "password management - password reset frequency",
        "password management - enable password reuse",
        "password management - enforce password policy at next login",
        "password management - minimum password length",
        "password management - maximum password length"
      )
    | KEEP @timestamp, event.action, google_workspace.admin.setting.name, google_workspace.actor.email, google_workspace.organization.domain, google_workspace.admin.new_value, google_workspace.admin.old_value
  leql: |
    where(source_json.events.name IN ["CHANGE_APPLICATION_SETTING", "CREATE_APPLICATION_SETTING"] AND source_json.SETTING_NAME IN ["password management - enforce strong password", "password management - password reset frequency", "password management - enable password reuse", "password management - enforce password policy at next login", "password management - minimum password length", "password management - maximum password length"])
  crowdstrike: |
    #type=gsuite (events.name="CHANGE_APPLICATION_SETTING" OR events.name="CREATE_APPLICATION_SETTING") (SETTING_NAME="password management - enforce strong password" OR SETTING_NAME="password management - password reset frequency" OR SETTING_NAME="password management - enable password reuse" OR SETTING_NAME="password management - enforce password policy at next login" OR SETTING_NAME="password management - minimum password length" OR SETTING_NAME="password management - maximum password length")
    | table([@timestamp, events.name, SETTING_NAME, actor.email, events.parameters.SETTING_VALUE, events.parameters.NEW_VALUE, events.parameters.OLD_VALUE, org_unit_name])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and logtype = "workspace"
    | filter json_extract_scalar(action_app_response_details, "$.events[*].name") in ("CHANGE_APPLICATION_SETTING", "CREATE_APPLICATION_SETTING")
    | alter setting_name = json_extract_scalar(action_app_response_details, "$.events[*].parameters[?(@.name=='SETTING_NAME')].value")
    | filter setting_name in ("password management - enforce strong password", "password management - password reset frequency", "password management - enable password reuse", "password management - enforce password policy at next login", "password management - minimum password length", "password management - maximum password length")
    | fields _time, actor_user, setting_name, action_app_response_details
  lucene: |
    events.name:(CHANGE_APPLICATION_SETTING OR CREATE_APPLICATION_SETTING) AND SETTING_NAME:("password management - enforce strong password" OR "password management - password reset frequency" OR "password management - enable password reuse" OR "password management - enforce password policy at next login" OR "password management - minimum password length" OR "password management - maximum password length")
  sumo: |
    _sourceCategory=*Google*Workspace*
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_name
    | json field=_raw "events[*].parameters[*].value" as param_value
    | where event_name in ("CHANGE_APPLICATION_SETTING", "CREATE_APPLICATION_SETTING")
    | where param_name = "SETTING_NAME" and param_value in ("password management - enforce strong password", "password management - password reset frequency", "password management - enable password reuse", "password management - enforce password policy at next login", "password management - minimum password length", "password management - maximum password length")
    | fields _messageTime, _sourceHost, event_name, param_value
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is one of "CHANGE_APPLICATION_SETTING" or "CREATE_APPLICATION_SETTING"

  And the SETTING_NAME is one of

  "password management - enforce strong password",

  "password management - password reset frequency",

  "password management - enable password reuse",

  "password management - enforce password policy at next login",

  "password management - minimum password length",

  "password management - maximum password length"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

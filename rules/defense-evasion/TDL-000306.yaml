rule_id: TDL-DE-000306
v4_id: '000306'
name: AWS Password Policy Change - GuardDuty
description: Detects when an EC2 instance is attempting to connect to an address that is known to be tied to malicious activity.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty findingType IN ("Stealth:IAMUser/PasswordPolicyChange")

    | eval src_user=coalesce(''userIdentity.userName'', ''userIdentity.principalId'', "unknown")

    | search NOT [| inputlookup aws_admin_list | fields username | rename username as src_user]

    | table _time, awsAccountId, src_user, findingType, severity, region, service.action.actionType, resource.resourceType

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title == "Stealth:IAMUser/PasswordPolicyChange"
    | extend SourceUsername = tostring(parse_json(tostring(Service)).Action.AwsApiCallAction.RemoteAccountDetails.AccountId)
    | extend ActorUsername = tostring(parse_json(tostring(Service)).Action.AwsApiCallAction.AffectedResources)
    | extend UserIdentity = tostring(parse_json(tostring(Resource)).AccessKeyDetails.UserName)
    | where UserIdentity !in ("aws-admin-user1", "aws-admin-user2", "terraform-service-account")
    | project TimeGenerated, Title, Severity, UserIdentity, AccountId, Region, Description
  aql: |
    SELECT sourceip, username, "Event Type" AS event_type, LOGSOURCENAME(logsourceid) AS source, eventtime
    FROM events
    WHERE "Event Type" IN ('Stealth:IAMUser/PasswordPolicyChange')
      AND username NOT IN ('aws-admin-user1', 'aws-admin-user2', 'aws-service-account')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_password_policy_weakening {
      meta:
        author = "Detection Engineering"
        description = "Detects GuardDuty alerts for IAM password policy changes indicating defense evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "Stealth:IAMUser/PasswordPolicyChange"
        $e.principal.user.userid = $user
        not $user in %aws_admin_list

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM .ds-logs-aws.guardduty-*
    | WHERE @timestamp > NOW() - 24 hour
      AND event.action IN ("Stealth:IAMUser/PasswordPolicyChange")
      AND NOT user.name IN ("admin", "terraform", "cloudformation", "root")
    | KEEP @timestamp, event.action, user.name, cloud.account.id, aws.guardduty.severity, source.ip
  leql: |
    where(source_json.service.serviceName="guardduty" AND source_json.type="Stealth:IAMUser/PasswordPolicyChange" AND NOT(source_user IN [AWS_ADMIN_LIST]))
  crowdstrike: |
    #repo=aws_guardduty event.type="Stealth:IAMUser/PasswordPolicyChange"
    | not (userIdentity.userName in ["admin", "terraform", "cloudformation"])
    | table([@timestamp, userIdentity.userName, userIdentity.accountId, event.type, awsRegion, sourceIPAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "Amazon" and product = "GuardDuty"
    | filter action_finding_type in ("Stealth:IAMUser/PasswordPolicyChange")
    | filter actor_user not in ("admin", "root", "Administrator", "terraform", "cloudformation")
    | fields _time, cloud_provider, actor_user, action_finding_type, action_finding_description, cloud_account, cloud_region
  lucene: |
    eventName:"Stealth:IAMUser/PasswordPolicyChange" AND NOT userIdentity.userName:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | json field=_raw "service.action.awsApiCallAction.callerType" as caller_type
    | json field=_raw "resource.accessKeyDetails.userName" as source_user
    | json field=_raw "accountId" as account_id
    | where event_type = "Stealth:IAMUser/PasswordPolicyChange"
    | where !(source_user in ("admin", "root", "Administrator", "sysadmin"))
    | fields _messageTime, account_id, source_user, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["Stealth:IAMUser/PasswordPolicyChange"]

  Where Source Username is NOT on the AWS Admin List'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

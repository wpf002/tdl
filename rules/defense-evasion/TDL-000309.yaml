rule_id: TDL-DE-000309
v4_id: 000309
name: AWS Block Public Access Disabled  by Unauthorized User - GuardDuty
description: Detects when a non AWS Admin disables the setting to block public access to a bucket or account.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=guardduty sourcetype=aws:guardduty (finding.type="Policy:S3/AccountBlockPublicAccessDisabled" OR finding.type="Policy:S3/BucketBlockPublicAccessDisabled")

    | table _time, finding.type, finding.severity, finding.title, finding.description, account_id, region, resource.resourceType, resource.s3BucketDetails.name,
    service.action.actionType, user_name, finding.id

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where EventType in ("Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled")
    | project TimeGenerated, EventType, AccountId, Region, ResourceType, ResourceId, Severity, Description
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, username, sourceip, "findingType" AS event_type, "resource.resourceType" AS resource_type, "resource.s3BucketDetails.name" AS bucket_name, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND ("findingType" = 'Policy:S3/AccountBlockPublicAccessDisabled' OR "findingType" = 'Policy:S3/BucketBlockPublicAccessDisabled')
    LAST 24 HOURS
  yara_l: |
    rule aws_s3_block_public_access_disabled {
      meta:
        author = "Detection Engineering"
        description = "Detects AWS S3 public access block being disabled via GuardDuty"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Amazon Web Services"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Policy:S3/AccountBlockPublicAccessDisabled" or
          $e.metadata.product_event_type = "Policy:S3/BucketBlockPublicAccessDisabled"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.resource.s3_bucket_details.name, event.type, event.severity, aws.guardduty.title, aws.guardduty.description
  leql: |
    where(source_json.type IN ["Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled"])
  crowdstrike: |
    #type=guardduty (detail.type="Policy:S3/AccountBlockPublicAccessDisabled" OR detail.type="Policy:S3/BucketBlockPublicAccessDisabled")
    | table([@timestamp, detail.type, detail.resource.resourceType, detail.resource.s3BucketDetails.name, account, region, detail.severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and resource_type = "GUARDDUTY_FINDING"
    | filter json_extract_scalar(raw_log, "$.type") in ("Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled")
    | fields _time, cloud_provider, resource_type, resource_sub_type, identity_name, resource_name, raw_log
  lucene: |
    eventName:("Policy:S3/AccountBlockPublicAccessDisabled" OR "Policy:S3/BucketBlockPublicAccessDisabled")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "detail.type" as event_type
    | where event_type in ("Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled")
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["Policy:S3/AccountBlockPublicAccessDisabled", "Policy:S3/BucketBlockPublicAccessDisabled"]'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

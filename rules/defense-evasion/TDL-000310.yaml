rule_id: TDL-DE-000310
v4_id: '000310'
name: Public Access Granted to AWS Bucket - GuardDuty
description: Detects when public access is granted to a bucket in AWS
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty eventType="Policy:S3/BucketPublicAccessGranted"

    | table _time, accountId, region, resource.resourceType, resource.s3BucketDetails.name, resource.s3BucketDetails.publicAccess.effectivePermission,
    severity, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title == "Policy:S3/BucketPublicAccessGranted"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = Resource_s3Bucket_name, UserName = Resource_accessKeyDetails_userName, PrincipalId = Resource_accessKeyDetails_principalId, ActionType = Service_action_actionType
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, "Event Type" AS event_type, "Resource Type" AS resource_type, "Resource Name" AS resource_name, username, sourceip
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Event Type" = 'Policy:S3/BucketPublicAccessGranted'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_s3_bucket_public_access_granted {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for S3 buckets made publicly accessible"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "Policy:S3/BucketPublicAccessGranted"
        $e.principal.resource.name = $bucket

      match:
        $bucket over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Policy:S3/BucketPublicAccessGranted")
    | KEEP @timestamp, host.name, cloud.account.id, aws.guardduty.resource.s3_bucket.name, event.severity, event.action, user.name, source.ip
  leql: |
    where(source_json.type="Policy:S3/BucketPublicAccessGranted")
  crowdstrike: |
    #type=aws:guardduty eventType="Policy:S3/BucketPublicAccessGranted"
    | table([@timestamp, accountId, region, resource.resourceType, resource.s3BucketDetails.name, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "Amazon" and event_type in ("Policy:S3/BucketPublicAccessGranted")
    | fields _time, cloud_provider, event_type, actor_user, resource_name, resource_type, raw_log
  lucene: |
    event.type:"Policy:S3/BucketPublicAccessGranted"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type = "Policy:S3/BucketPublicAccessGranted"
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["Policy:S3/BucketPublicAccessGranted"]'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

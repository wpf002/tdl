rule_id: TDL-DE-000329
v4_id: 000329
name: Anomalous S3 Activity Detected - GuardDuty
description: Detects when GuardDuty alerts on anomalous S3 activity within an AWS instance
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=guardduty sourcetype=aws:cloudwatch:guardduty \n(\"finding.type\"=\"Discovery:S3/AnomalousBehavior\" OR \"finding.type\"=\"Exfiltration:S3/AnomalousBehavior\"\
    \ OR \"finding.type\"=\"Impact:S3/AnomalousBehavior.Delete\" OR \"finding.type\"=\"Impact:S3/AnomalousBehavior.Permission\" OR \"finding.type\"\
    =\"Impact:S3/AnomalousBehavior.Write\")\n| table _time, finding.id, finding.type, finding.severity, resource.instanceDetails.instanceId, service.action.actionType,\
    \ finding.accountId, finding.region, finding.description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where FindingType in ("Discovery:S3/AnomalousBehavior", "Exfiltration:S3/AnomalousBehavior", "Impact:S3/AnomalousBehavior.Delete", "Impact:S3/AnomalousBehavior.Permission", "Impact:S3/AnomalousBehavior.Write")
    | project TimeGenerated, FindingType, AccountId, Region, Severity, Title, Description, Resource
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, username, sourceip, "Event Type", "Resource Type", "Resource Name", qidname(qid)
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "Event Type" IN ('Discovery:S3/AnomalousBehavior', 'Exfiltration:S3/AnomalousBehavior', 'Impact:S3/AnomalousBehavior.Delete', 'Impact:S3/AnomalousBehavior.Permission', 'Impact:S3/AnomalousBehavior.Write')
    LAST 1 HOURS
  yara_l: |
    rule aws_guardduty_s3_anomalous_behavior {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty S3 anomalous behavior findings - MITRE T1580 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1580"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = /Discovery:S3\/AnomalousBehavior|Exfiltration:S3\/AnomalousBehavior|Impact:S3\/AnomalousBehavior\.Delete|Impact:S3\/AnomalousBehavior\.Permission|Impact:S3\/AnomalousBehavior\.Write/
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Discovery:S3/AnomalousBehavior", "Exfiltration:S3/AnomalousBehavior", "Impact:S3/AnomalousBehavior.Delete", "Impact:S3/AnomalousBehavior.Permission", "Impact:S3/AnomalousBehavior.Write")
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, source.ip, event.type, event.action, aws.guardduty.severity, aws.guardduty.resource.s3_bucket_details.name
  leql: |
    where(source_json.type IN ["Discovery:S3/AnomalousBehavior", "Exfiltration:S3/AnomalousBehavior", "Impact:S3/AnomalousBehavior.Delete", "Impact:S3/AnomalousBehavior.Permission", "Impact:S3/AnomalousBehavior.Write"])
  crowdstrike: |
    #repo=guardduty (detail.type="Discovery:S3/AnomalousBehavior" OR detail.type="Exfiltration:S3/AnomalousBehavior" OR detail.type="Impact:S3/AnomalousBehavior.Delete" OR detail.type="Impact:S3/AnomalousBehavior.Permission" OR detail.type="Impact:S3/AnomalousBehavior.Write")
    | table([@timestamp, detail.type, detail.resource.s3BucketDetails.name, detail.service.action.awsApiCallAction.api, account, region])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and log_name = "GuardDuty"
    | filter event_type in ("Discovery:S3/AnomalousBehavior", "Exfiltration:S3/AnomalousBehavior", "Impact:S3/AnomalousBehavior.Delete", "Impact:S3/AnomalousBehavior.Permission", "Impact:S3/AnomalousBehavior.Write")
    | fields _time, event_type, cloud_provider_account_id, identity_name, resource_name, severity
  lucene: |
    event.type:guardduty AND (finding.type:"Discovery:S3/AnomalousBehavior" OR finding.type:"Exfiltration:S3/AnomalousBehavior" OR finding.type:"Impact:S3/AnomalousBehavior.Delete" OR finding.type:"Impact:S3/AnomalousBehavior.Permission" OR finding.type:"Impact:S3/AnomalousBehavior.Write")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("Discovery:S3/AnomalousBehavior", "Exfiltration:S3/AnomalousBehavior", "Impact:S3/AnomalousBehavior.Delete", "Impact:S3/AnomalousBehavior.Permission", "Impact:S3/AnomalousBehavior.Write")
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Discovery:S3/AnomalousBehavior\", \"Exfiltration:S3/AnomalousBehavior\", \"\
  Impact:S3/AnomalousBehavior.Delete\", \"Impact:S3/AnomalousBehavior.Permission\", \"Impact:S3/AnomalousBehavior.Write\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000351
v4_id: '000351'
name: Privileged Kubernetes Container Launched  - GuardDuty
description: Detects when a privileged container was launched on your Kubernetes cluster using an image has never before been used to launch privileged
  containers in your cluster. A privileged container has root level access to the host. Adversaries can launch privileged containers as a privilege
  escalation tactic to gain access to and then compromise the host.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1496
technique_name: Resource Hijacking
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(detail.type=\"PrivilegeEscalation:Kubernetes/PrivilegedContainer\" OR detail.type=\"\
    PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer\")\n| table _time, detail.accountId, detail.region,\
    \ detail.type, detail.resource.*, detail.service.action.*, detail.severity\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title in ("PrivilegeEscalation:Kubernetes/PrivilegedContainer","PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = Id
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, sourceip, destinationip, username, "Event Type" AS event_type, "Resource Type", "Service Name"
    FROM events
    WHERE "Event Type" IN ('PrivilegeEscalation:Kubernetes/PrivilegedContainer', 'PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_kubernetes_privileged_container {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for privileged Kubernetes containers"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1496"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon Web Services"
        $e.metadata.product_name = "AWS GuardDuty"
        (
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/PrivilegedContainer" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer"
        )
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("PrivilegeEscalation:Kubernetes/PrivilegedContainer", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.id, aws.guardduty.finding.type, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.namespace, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["PrivilegeEscalation:Kubernetes/PrivilegedContainer", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer"])
  crowdstrike: |
    #event_type=guardduty (finding.type="PrivilegeEscalation:Kubernetes/PrivilegedContainer" OR finding.type="PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | table([@timestamp, finding.type, finding.severity, finding.resource.kubernetesDetails.workload.name, finding.resource.kubernetesDetails.workload.namespace, finding.accountId, finding.region])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log_json.service = "guardduty"
    | alter finding_type = json_extract_scalar(raw_log_json, "$.detail.type")
    | filter finding_type in ("PrivilegeEscalation:Kubernetes/PrivilegedContainer", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | fields _time, cloud_provider, finding_type, raw_log_json
  lucene: |
    event.type:"guardduty" AND (finding.type:"PrivilegeEscalation:Kubernetes/PrivilegedContainer" OR finding.type:"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as finding_type
    | where finding_type in ("PrivilegeEscalation:Kubernetes/PrivilegedContainer", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | fields _messageTime, _sourceHost, finding_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"PrivilegeEscalation:Kubernetes/PrivilegedContainer\",\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

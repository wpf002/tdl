rule_id: TDL-DE-000381
v4_id: 000381
name: Disable Windows IIS HTTP Logging
description: Detects when HTTP logging has been disabled on a Windows IIS web server.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows EventCode=4688 (Process_Name="*\\appcmd.exe" OR NewProcessName="*\\appcmd.exe") CommandLine="*set*" CommandLine="*config*"
    CommandLine="*section:httplogging*" CommandLine="*dontlog:true*"

    | table _time, ComputerName, User, Process_Name, NewProcessName, CommandLine, ParentProcessName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process endswith @"\appcmd.exe"
    | where CommandLine has_all ("set","config","section:httplogging","dontlog:true")
    | project TimeGenerated, Computer, Account, Process, CommandLine, EventID
  aql: |
    SELECT eventtime, sourceip, username, "Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%\\appcmd.exe'
      AND "Process CommandLine" ILIKE '%set%'
      AND "Process CommandLine" ILIKE '%config%'
      AND "Process CommandLine" ILIKE '%section:httplogging%'
      AND "Process CommandLine" ILIKE '%dontlog:true%'
    LAST 24 HOURS
  yara_l: "rule appcmd_disable_http_logging {\n  meta:\n    author = \"TDL\"\n    description = \"Detects disabling of IIS HTTP logging via appcmd.exe\
    \ - T1562 Defense Evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1562\"\n    severity = \"HIGH\"\
    \n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\n    re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\appcmd\\.exe$`)\n    re.regex($e.principal.process.command_line, `(?i)set`)\n    re.regex($e.principal.process.command_line, `(?i)config`)\n\
    \    re.regex($e.principal.process.command_line, `(?i)section:httplogging`)\n    re.regex($e.principal.process.command_line, `(?i)dontlog:true`)\n\
    \    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n\
    }\n"
  esql: "FROM logs-windows.security*, logs-system.security*, winlogbeat-*\n| WHERE winlog.event_id IN (592, 4688) \n  AND process.name LIKE \"\
    *\\\\appcmd.exe\"\n  AND process.command_line LIKE \"*set*\"\n  AND process.command_line LIKE \"*config*\"\n  AND process.command_line LIKE\
    \ \"*section:httplogging*\"\n  AND process.command_line LIKE \"*dontlog:true*\"\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line,\
    \ process.parent.name\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ENDS-WITH "\appcmd.exe" AND process_cmd_line ICONTAINS "set" AND process_cmd_line ICONTAINS "config" AND process_cmd_line ICONTAINS "section:httplogging" AND process_cmd_line ICONTAINS "dontlog:true")
  crowdstrike: |
    EventCode=4688 FileName=*\appcmd.exe CommandLine=*set* CommandLine=*config* CommandLine=*section:httplogging* CommandLine=*dontlog:true*
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688)\n| filter action_process_image_name ~= \".*\\\\appcmd\\.exe$\"\n| filter\
    \ action_process_image_command_line contains \"set\" \n  and action_process_image_command_line contains \"config\" \n  and action_process_image_command_line\
    \ contains \"section:httplogging\" \n  and action_process_image_command_line contains \"dontlog:true\"\n| fields _time, agent_hostname, actor_effective_username,\
    \ action_process_image_name, action_process_image_command_line\n"
  lucene: |
    event.code:4688 AND process.name:*\\appcmd.exe AND process.command_line:(*set* AND *config* AND *section\:httplogging* AND *dontlog\:true*)
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("592", "4688")
    | where process_name matches "*\\appcmd.exe"
    | where command_line matches "*set*" and command_line matches "*config*" and command_line matches "*section:httplogging*" and command_line matches "*dontlog:true*"
    | fields _messageTime, _sourceHost, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Process Creation Event\nWhere the Event ID is in [592, 4688]\nWhere\n\tProcess Name ends with [\"\\appcmd.exe\"]\n\t\
  AND Command Line contains all [\"set\",\"config\",\"section:httplogging\",\"dontlog:true\"]"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — distinguish administrative tooling from adversary tradecraft (LOLBins,
  signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

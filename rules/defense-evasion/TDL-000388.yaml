rule_id: TDL-DE-000388
v4_id: 000388
name: AWS Runtime Process Injection Activity - GuardDuty
description: Detects process injection activity within AWS
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty (detail.type="DefenseEvasion:Runtime/ProcessInjection.Proc" OR detail.type="DefenseEvasion:Runtime/ProcessInjection.Ptrace"
    OR detail.type="DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")

    | table _time, detail.accountId, detail.region, detail.resource.instanceDetails.instanceId, detail.type, detail.severity, detail.title, detail.description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")
    | project TimeGenerated, ActivityType, AwsAccountId, Title, Description, Severity, ResourceType, ResourceId = tostring(Resource.InstanceDetails.InstanceId), Region
  aql: |
    SELECT eventtime, sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), "Finding Type", "Resource Type", "Severity"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND ("Finding Type" IN ('DefenseEvasion:Runtime/ProcessInjection.Proc', 'DefenseEvasion:Runtime/ProcessInjection.Ptrace', 'DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite')
           OR qidname(qid) IN ('DefenseEvasion:Runtime/ProcessInjection.Proc', 'DefenseEvasion:Runtime/ProcessInjection.Ptrace', 'DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite'))
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_defense_evasion_process_injection {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty process injection defense evasion findings"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.vendor_name = "Amazon"
        (
          $e.metadata.product_event_type = "DefenseEvasion:Runtime/ProcessInjection.Proc" or
          $e.metadata.product_event_type = "DefenseEvasion:Runtime/ProcessInjection.Ptrace" or
          $e.metadata.product_event_type = "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.id, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, host.name, event.original
  leql: |
    where(source_json.type IN ["DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite"])
  crowdstrike: |
    #repo=guardduty event.type IN ["DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite"]
    | table([@timestamp, event.type, resource.instanceDetails.instanceId, service.action.runtimeDetails.process.name, service.action.runtimeDetails.targetProcess.name, resource.instanceDetails.tags])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logon_type = "GuardDuty"
    | filter event_type in ("DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")
    | fields _time, cloud_provider_account_id, cloud_provider_region, event_type, event_sub_type, description, severity
  lucene: |
    eventType:("DefenseEvasion:Runtime/ProcessInjection.Proc" OR "DefenseEvasion:Runtime/ProcessInjection.Ptrace" OR "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("DefenseEvasion:Runtime/ProcessInjection.Proc", "DefenseEvasion:Runtime/ProcessInjection.Ptrace", "DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:Runtime/ProcessInjection.Proc\", \"DefenseEvasion:Runtime/ProcessInjection.Ptrace\"\
  , \"DefenseEvasion:Runtime/ProcessInjection.VirtualMemoryWrite\"]"
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000390
v4_id: 000390
name: Azure Event Hub Deleted
description: Detects Azure Event Hub deletions. Event Hubs are the primary method for logs to be forwarded to a destination outside of Azure (such
  as a SIEM) and as such, deleting an Event Hub may compromise monitoring.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1489
technique_name: Service Stop
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:activity operationName="MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" status=Success

    | table _time, user, resourceId, operationName, status, resourceGroup, subscriptionId

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(24h)
    | where OperationNameValue =~ "MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE"
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ActivityStatusValue, ResourceGroup, SubscriptionId, ResourceId, Properties
  aql: |
    SELECT sourceip, username, "Azure.Activity.operationName" AS operation, "Azure.Activity.resourceId" AS resource, eventtime
    FROM events
    WHERE "Azure.Activity.operationName" IN ('MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE')
      AND "Azure.Activity.status" = 'Success'
    LAST 24 HOURS
  yara_l: |
    rule azure_eventhub_deletion_t1489 {
      meta:
        author = "TDL"
        description = "Detects deletion of Azure Event Hub, potential defense evasion T1489"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1489"
        severity = "High"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        $e.metadata.event_type = "RESOURCE_DELETION"
        $e.metadata.product_event_type = "MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE"
        $e.security_result.action = "ALLOW"
        $e.security_result.summary = "Success"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.action == "MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE"
      AND event.outcome == "success"
    | KEEP @timestamp, cloud.account.id, azure.activitylogs.operation_name, event.action, event.outcome, azure.resource.name, azure.resource.group, user.name, source.ip
  leql: |
    where(source_json.operationName="MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" AND source_json.status="Success")
  crowdstrike: |
    #type=azure:activity operationName="MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" resultType=Success
    | table([@timestamp, operationName, resultType, identity.claims.name, resourceId, subscriptionId])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name = "MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" and operation_status = "Success"
    | fields _time, cloud_provider, operation_name, operation_status, identity_name, resource_name, resource_type, project
  lucene: |
    event.dataset:"azure.activitylogs" AND azure.activitylogs.operation_name:"MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" AND event.outcome:"success"
  sumo: |
    _sourceCategory=*Azure* ("MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE" OR "Microsoft.EventHub/namespaces/eventhubs/delete")
    | json field=_raw "operationName" as operation_name
    | json field=_raw "status" as status
    | json field=_raw "resultType" as result_type
    | where (operation_name matches "*MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE*" OR operation_name matches "*Microsoft.EventHub/namespaces/eventhubs/delete*")
    | where (status = "Success" OR result_type = "Success")
    | fields _messageTime, _sourceHost, operation_name, status, result_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Activity Event

  Where the Event Name is in [MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE]

  Where Action is ["Success"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

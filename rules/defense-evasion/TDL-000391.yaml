rule_id: TDL-DE-000391
v4_id: 000391
name: Azure Diagnostic Setting Deleted
description: Detects diagnostic setting deletions, which may represent an adversary disabling logging.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1489
technique_name: Service Stop
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:activity (operationName="MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" OR operationName="Microsoft.Insights/DiagnosticSettings/Delete")
    status="Success"

    | table _time, user, resourceId, operationName, status, subscriptionId, resourceGroup

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(24h)
    | where OperationNameValue =~ "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE"
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, SubscriptionId, ResourceGroup, Resource, OperationNameValue, ActivityStatusValue, Properties
  aql: |
    SELECT username, sourceip, eventtime, LOGSOURCENAME(logsourceid) AS log_source, qidname(qid) AS event_name
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
      AND qidname(qid) ILIKE '%MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE%'
      AND (qidname(qid) ILIKE '%Success%' OR categoryname(category) ILIKE '%Success%')
    LAST 24 HOURS
  yara_l: "rule azure_diagnostic_settings_deleted {\n  meta:\n    author = \"TDL\"\n    description = \"Detects deletion of Azure diagnostic settings\
    \ (T1489 - Service Stop)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1489\"\n    severity = \"Medium\"\
    \n    \n  events:\n    $e.metadata.event_type = \"SYSTEM_AUDIT_LOG_UNCATEGORIZED\"\n    $e.metadata.product_name = \"Azure\"\n    $e.metadata.vendor_name\
    \ = \"MICROSOFT\"\n    re.regex($e.metadata.product_event_type, `(?i)MICROSOFT\\.INSIGHTS/DIAGNOSTICSETTINGS/DELETE`)\n    $e.security_result.action\
    \ = \"ALLOW\"\n    $e.security_result.summary = \"Success\"\n    $e.principal.user.userid = $user\n    $e.target.resource.name = $resource\n\
    \    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 65\n    $resource_name = array_distinct($resource)\n    \n  condition:\n\
    \    $e\n}\n"
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE event.action == "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" AND event.outcome == "success"
    | KEEP @timestamp, azure.activitylogs.operation_name, azure.activitylogs.caller, azure.resource.id, event.outcome, cloud.account.id
  leql: |
    where(source_json.operationName="MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" AND source_json.status="Success")
  crowdstrike: |
    #repo=azure event_simpleName=AzureActivityEvent OperationName="MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" ActivityStatus="Success"
    | table([@timestamp, ComputerName, UserName, OperationName, ActivityStatus, ResourceId, CallerIpAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and operation_name = "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" and outcome = "Success"
    | fields _time, actor_user, resource_name, resource_type, project, operation_name, outcome
  lucene: |
    event.dataset:"azure.activitylogs" AND azure.activitylogs.operation_name:"MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" AND event.outcome:"success"
  sumo: |
    _sourceCategory=*Azure* "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE"
    | json field=_raw "operationName" as operation_name
    | json field=_raw "status.value" as status
    | where operation_name = "MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE" and status = "Success"
    | fields _messageTime, _sourceHost, operation_name, status
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Activity Event

  Where the Event Name is in [MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE]

  Where Action is ["Success"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

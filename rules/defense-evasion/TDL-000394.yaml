rule_id: TDL-DE-000394
v4_id: 000394
name: AWS Runtime Fileless Execution Activity - GuardDuty
description: Detects a fileless execution within AWS. This is a common defense evasion technique that avoids writing the malicious executable
  to the disk to evade file system scanning-based detection. Although this technique is used by malware, it also has some legitimate use cases
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1027
technique_name: Obfuscated Files or Information
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty \n| spath output=finding_type path=detail.type \n| where finding_type=\"DefenseEvasion:Runtime/FilelessExecution\"\
    \n| table _time, detail.region, detail.resource.instanceDetails.instanceId, detail.severity, detail.description, finding_type\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type == "DefenseEvasion:Runtime/FilelessExecution"
    | project TimeGenerated, AccountId, Region, Severity, Title, Description, ResourceType, ResourceId, ServiceAction
  aql: "SELECT sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), eventtime, \"Event Type\"\nFROM events\nWHERE LOGSOURCENAME(logsourceid)\
    \ ILIKE '%GuardDuty%' \n  AND \"Event Type\" = 'DefenseEvasion:Runtime/FilelessExecution'\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_fileless_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty fileless execution alerts indicating defense evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1027"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "AWS GuardDuty"
        $e.metadata.product_event_type = "DefenseEvasion:Runtime/FilelessExecution"
        $e.principal.cloud.environment = $environment

      match:
        $environment over 5m

      condition:
        $e
    }
  esql: |
    FROM .ds-logs-aws.guardduty*
    | WHERE event.dataset == "aws.guardduty" AND aws.guardduty.finding.type == "DefenseEvasion:Runtime/FilelessExecution"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.id, aws.guardduty.finding.severity, aws.guardduty.resource.instance_details.instance_id, aws.guardduty.finding.description
  leql: |
    where(source_json.type IN ["DefenseEvasion:Runtime/FilelessExecution"])
  crowdstrike: |
    #event_dataset=guardduty event.type="DefenseEvasion:Runtime/FilelessExecution"
    | table([@timestamp, cloud.account.id, cloud.region, aws.guardduty.service.action.*, aws.guardduty.resource.*, aws.guardduty.severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log contains "DefenseEvasion:Runtime/FilelessExecution"
    | fields _time, cloud_provider, event_type, actor_caller_account_id, resource_sub_type, raw_log
  lucene: |
    event.type:"DefenseEvasion:Runtime/FilelessExecution"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("DefenseEvasion:Runtime/FilelessExecution")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:Runtime/FilelessExecution\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000423
v4_id: '000423'
name: Sudo Command Ran by Non Privileged User
description: Detects when a non privileged user or root account attempts to run the sudo command.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
data_sources:
- Linux Operating System
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=linux sourcetype IN(linux_secure, syslog) sudo command

    | search (USER=* OR USER!=root) AND COMMAND=*

    | table _time, host, user, USER, COMMAND

    '
  kql: |
    Syslog
    | where TimeGenerated > ago(1h)
    | where Facility == "authpriv" and SyslogMessage has "sudo"
    | where SyslogMessage has "COMMAND"
    | project TimeGenerated, Computer, ProcessName, SyslogMessage, HostIP
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Command\" AS sudo_command, sourceip\nFROM events\nWHERE (qidname(qid)\
    \ ILIKE '%sudo%' OR \"Message\" ILIKE '%sudo%') \n  AND (\"Command\" IS NOT NULL OR \"Message\" ILIKE '%COMMAND=%')\nLAST 24 HOURS\n"
  yara_l: "rule linux_sudo_command_execution {\n  meta:\n    author = \"TDL\"\n    description = \"Detects sudo command execution on Linux systems\"\
    \n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"Low\"\n    \n  events:\n    $e.metadata.event_type\
    \ = \"USER_LOGIN\"\n    re.regex($e.principal.process.command_line, `(?i)sudo\\s+`)\n    $e.principal.hostname = $host\n    \n  match:\n \
    \   $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.syslog*
    | WHERE @timestamp > NOW() - 24 hour AND process.name == "sudo" AND event.action == "executed"
    | KEEP @timestamp, host.name, user.name, process.command_line, process.args
  leql: |
    where(process_name="sudo" OR process_cmd_line CONTAINS "sudo")
  crowdstrike: |
    event_platform=Lin (event_simpleName=UserLogon OR event_simpleName=AuditdSudoExecution OR #type=syslog) (CommandLine=*sudo* OR ProcessName=sudo OR Message=*sudo*)
    | table([@timestamp, ComputerName, UserName, CommandLine, Message, event_simpleName])
  xql: |
    dataset = xdr_data
    | filter agent_os_type = AGENT_OS_LINUX and event_type = ENUM.EVENT_TYPE_PROCESS and actor_process_image_name = "sudo"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    process.name:sudo OR (syslog.identifier:sudo OR program:sudo) OR message:*sudo*
  sumo: |
    _sourceCategory=*Linux* sudo
    | parse regex "(?<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?<host>\S+)\s+sudo:\s+(?<user>\S+)\s+:\s+TTY=(?<tty>\S+)\s+;\s+PWD=(?<pwd>\S+)\s+;\s+USER=(?<sudo_user>\S+)\s+;\s+COMMAND=(?<command>.*)" nodrop
    | where !isNull(command)
    | fields _messageTime, host, user, sudo_user, tty, pwd, command
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 Linux syslog where sudo is used to initiate a command.
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000426
v4_id: '000426'
name: AWS GuardDuty Trusted IP Set Created
description: Detects updates to the GuardDuty list of trusted IPs. An attacker can evade detection excluding an IP where GuardDuty doesn't generate
  findings for IP addresses that are included in IPSets.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventSource="guardduty.amazonaws.com" eventName="CreateIPSet"

    | table _time, userIdentity.principalId, userIdentity.arn, sourceIPAddress, requestParameters.*, responseElements.*

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventSource == "guardduty.amazonaws.com"
    | where EventName == "CreateIPSet"
    | project TimeGenerated, EventName, EventSource, UserIdentityArn, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, AwsRegion, RecipientAccountId
  aql: |
    SELECT sourceip, username, QIDNAME(qid) AS event_name, eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cloudtrail%'
      AND (qidname(qid) ILIKE '%CreateIPSet%' OR "eventName" = 'CreateIPSet')
      AND (QIDNAME(qid) ILIKE '%guardduty%' OR "eventSource" = 'guardduty.amazonaws.com')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_create_ipset {
      meta:
        author = "TDL"
        description = "Detects creation of GuardDuty IP sets which can be used for defense evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "Medium"

      events:
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.vendor_name = "AMAZON"
        $e.target.application = "guardduty.amazonaws.com"
        $e.metadata.product_event_type = "CreateIPSet"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.provider == "guardduty.amazonaws.com" AND event.action == "CreateIPSet"
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, user.id, source.ip, event.action, event.outcome
  leql: |
    where(source_json.eventSource="guardduty.amazonaws.com" AND source_json.eventName="CreateIPSet")
  crowdstrike: |
    #type=cloudtrail eventSource=guardduty.amazonaws.com eventName=CreateIPSet
    | table([@timestamp, userIdentity.principalId, userIdentity.arn, awsRegion, sourceIPAddress, requestParameters, responseElements])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "CreateIPSet" and action_app_id_name = "guardduty.amazonaws.com"
    | fields _time, actor_user, action_app_id_name, event_type, action_resource_name, action_result
  lucene: |
    eventSource:guardduty.amazonaws.com AND eventName:CreateIPSet
  sumo: |
    _sourceCategory=*cloudtrail* guardduty.amazonaws.com CreateIPSet
    | json field=_raw "eventSource" as event_source
    | json field=_raw "eventName" as event_name
    | where event_source = "guardduty.amazonaws.com" and event_name = "CreateIPSet"
    | fields _messageTime, event_source, event_name, _sourceHost
false_positives:
- 'https://docs.aws.amazon.com/guardduty/latest/APIReference/API_CreateIPSet.html

  https://github.com/RhinoSecurityLabs/pacu/blob/866376cd711666c775bbfcde'
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 AWS CloudTrail Event

  Where the Application is [guardduty.amazonaws.com]

  Where the Event is [CreateIPSet]'
suppression:
  window: 12 hours
  fields:
  - username
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

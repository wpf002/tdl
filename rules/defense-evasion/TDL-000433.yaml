rule_id: TDL-DE-000433
v4_id: '000433'
name: CobaltStrike Malleable (OCSP) Profile
description: Detects Malleable (OCSP) Profile with Typo (OSCP) in URL
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp NOT (src_ip IN ("10.0.0.100", "10.0.0.101") OR src_ip IN ("172.16.0.50"))

    | stats count as connection_count, dc(dest_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | sort - total_bytes_out

    | where connection_count >= 1

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(24h)\n| where DeviceVendor has_any (\"Firewall\", \"IDS\") or DeviceProduct has_any (\"\
    Firewall\", \"IDS\")\n| where Protocol =~ \"tcp\"\n| where isnotempty(DestinationPort) and isnotempty(SentBytes)\n| where SourceIP !in (\"\
    authorized_scanner_ip1\", \"authorized_scanner_ip2\", \"monitoring_agent_ip1\")\n| summarize \n    connection_count = count(),\n    unique_dests\
    \ = dcount(DestinationIP),\n    total_bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP\n| sort by total_bytes_out desc\n| project\
    \ SourceIP, DestinationIP, connection_count, unique_dests, total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, sourceport, destinationport, SUM(destinationbytes) AS bytes_out, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_dests
    FROM flows
    WHERE protocol = '6' AND sourceip NOT IN ('10.0.0.100', '10.0.0.101', '192.168.1.50')
    GROUP BY sourceip, destinationip, sourceport, destinationport
    ORDER BY bytes_out DESC
    LAST 1 HOURS
  yara_l: "rule large_data_exfiltration_t1071 {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects potential data exfiltration\
    \ over TCP connections - MITRE T1071\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1071\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.ip_protocol = \"TCP\"\n    $e.principal.ip\
    \ = $src_ip\n    $e.target.ip = $dest_ip\n    $e.target.port > 0\n    $e.network.sent_bytes > 0\n    not re.regex($e.principal.hostname, `(?i)(scanner|monitor|agent|splunk|nessus|qualys)`)\n\
    \    not re.regex($e.principal.asset.hostname, `(?i)(scanner|monitor|agent|splunk|nessus|qualys)`)\n    \n  match:\n    $src_ip, $dest_ip\
    \ over 1h\n    \n  outcome:\n    $total_bytes_out = max($e.network.sent_bytes)\n    $connection_count = count_distinct($e.metadata.id)\n \
    \   $risk_score = 50\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 24 hour AND network.protocol == "tcp"
    | WHERE NOT (source.ip IN ("10.0.1.50", "10.0.1.51", "192.168.100.10") OR user.name IN ("scanner_svc", "monitoring_agent"))
    | STATS total_connections = COUNT(*), total_bytes_out = SUM(source.bytes), unique_dests = COUNT_DISTINCT(destination.ip) BY source.ip, destination.ip
    | SORT total_bytes_out DESC
    | KEEP source.ip, destination.ip, total_connections, total_bytes_out, unique_dests
  leql: |
    where(source_json.protocol ICONTAINS "tcp") groupby(source_address, destination_address) calculate(count), calculate(unique:destination_port), calculate(sum:bytes_out)
  crowdstrike: "#type=firewall OR #type=ids network.protocol=*tcp* \n| NOT (src_ip IN [authorized_scanner_ips] OR ComputerName IN [monitoring_agents])\n\
    | groupBy([src_ip, dest_ip], function=[count(as=connection_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])\n\
    | sort(total_bytes_out, order=desc)\n| table([src_ip, dest_ip, connection_count, unique_dests, total_bytes_out])\n"
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_network_protocol = "tcp"
    | filter not (actor_process_image_name in ("scanner.exe", "monitoring_agent.exe") or agent_hostname in ("authorized-scanner-01", "authorized-scanner-02"))
    | alter bytes_out = coalesce(action_upload_bytes, 0)
    | comp count() as connection_count, count_distinct(action_remote_ip) as unique_dests, max(bytes_out) as max_bytes by action_local_ip, action_remote_ip
    | sort desc max_bytes
    | fields action_local_ip, action_remote_ip, connection_count, unique_dests, max_bytes
  lucene: |
    network.protocol:tcp AND NOT (src_ip:(authorized_scanner_ip_1 OR authorized_scanner_ip_2 OR monitoring_agent_ip) OR user_agent:*scanner* OR user_agent:*monitor*)
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol = "tcp" OR protocol matches "*tcp*"
    | where !(src_ip in ("10.0.0.10", "10.0.0.11") OR src_ip matches "*scanner*" OR src_ip matches "*monitor*")
    | fields src_ip, dest_ip, dest_port, bytes_out
    | sum(bytes_out) as total_bytes, count as connection_count, count_distinct(dest_ip) as unique_dests by src_ip, dest_ip
    | sort by total_bytes desc
    | where connection_count >= 1
false_positives:
- Authorized scanners
- Monitoring agents

rule_id: TDL-DE-000434
v4_id: '000434'
name: CobaltStrike Malleable Amazon Browsing Traffic Profile
description: Detects a connection to a CobaltStrike Malleable Amazon Profile
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp NOT (src_ip IN ("10.0.0.100", "10.0.0.101") OR src_ip="scanner*" OR
    src_ip="monitor*")

    | eval is_cs_amazon_profile=if((http_method="GET" AND (match(uri, "\/gp\/product\/.*") OR match(uri, "\/dp\/.*") OR match(uri, "\/s\/ref=.*")
    OR match(uri, "\/exec\/obidos\/.*")) AND (match(http_user_agent, ".*Mozilla.*") AND match(http_user_agent, ".*Chrome.*|.*Safari.*"))) OR (http_method="POST"
    AND match(uri, "\/s\/.*") AND match(http_user_agent, ".*Mozilla.*")), 1, 0)

    | search is_cs_amazon_profile=1

    | stats count as connection_count, dc(dest_ip) as unique_dest_ips, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where connection_count >= 1

    | sort - total_bytes_out

    | table src_ip, dest_ip, dest_port, connection_count, unique_dest_ips, total_bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(24h)\n| where DeviceVendor has_any (\"Palo Alto Networks\", \"Fortinet\", \"Cisco\", \"\
    Zscaler\", \"Check Point\") or DeviceProduct has_any (\"Firewall\", \"Proxy\", \"IDS\", \"IPS\")\n| where Protocol =~ \"tcp\"\n| where RequestURL\
    \ has_any (\"/s/ref=nb_sb_noss_1/167-3294888-0262949/field-keywords=books\", \"/s/ref=nb_sb_noss_2/167-3294888-0262949/field-keywords=\",\
    \ \"gp/product\") \n   or RequestContext has_any (\"session-token\", \"session-id\", \"x-main\", \"csm-hit\")\n   or RequestClientApplication\
    \ contains \"User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko\"\n| where SourceIP !in (\"10.0.0.50\", \"10.0.0.51\"\
    , \"172.16.1.100\")\n| summarize \n    connection_count = count(),\n    unique_dest_ips = dcount(DestinationIP),\n    total_bytes_out = sum(SentBytes)\n\
    \    by SourceIP, DestinationIP, DestinationPort\n| where connection_count >= 1\n| sort by total_bytes_out desc\n| project TimeGenerated =\
    \ now(), SourceIP, DestinationIP, DestinationPort, connection_count, unique_dest_ips, total_bytes_out\n"
  aql: "SELECT sourceip, destinationip, destinationport, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_destinations, SUM(sourcebytes)\
    \ AS bytes_out\nFROM flows\nWHERE protocol = '6' \n  AND sourceip NOT IN ('10.0.0.50', '10.0.0.51', '192.168.1.100')\n  AND (destinationip\
    \ MATCHES '.*\\.amazonaws\\.com' OR destinationport IN (80, 443, 8080, 8443))\nGROUP BY sourceip, destinationip, destinationport\nHAVING connection_count\
    \ >= 1\nORDER BY bytes_out DESC\nLAST 24 HOURS\n"
  yara_l: "rule cobaltstrike_malleable_amazon_profile {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects CobaltStrike\
    \ Malleable Amazon Browsing Traffic Profile based on network patterns\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique\
    \ = \"T1071\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.ip_protocol =\
    \ \"TCP\"\n    \n    // Exclude authorized scanners and monitoring agents\n    not $e.principal.ip in [\"10.0.0.100\", \"10.0.0.101\"]\n \
    \   not re.regex($e.principal.hostname, `(?i)(scanner|monitor|agent)`)\n    \n    // Amazon-like User-Agent pattern typical of CS malleable\
    \ profile\n    re.regex($e.network.http.user_agent, `(?i)Mozilla.*compatible.*MSIE.*Windows NT`)\n    \n    // Common CS malleable Amazon\
    \ profile characteristics\n    (\n      re.regex($e.target.url, `(?i)amazon\\.com`) or\n      re.regex($e.network.http.referrer, `(?i)amazon\\\
    .com`) or\n      (\n        $e.target.port = 80 or \n        $e.target.port = 443\n      )\n    )\n    \n    $e.principal.ip = $src_ip\n \
    \   $e.target.ip = $dest_ip\n    $e.target.port = $dest_port\n    \n  match:\n    $src_ip, $dest_ip, $dest_port over 1h\n    \n  outcome:\n\
    \    $risk_score = max(75)\n    $conn_count = count_distinct($e.metadata.id)\n    $unique_dest_ips = count_distinct($e.target.ip)\n    $total_bytes_out\
    \ = sum($e.network.sent_bytes)\n    \n  condition:\n    #e >= 1\n}\n"
  esql: "FROM logs-network*\n| WHERE @timestamp > NOW() - 24 hours \n  AND network.protocol == \"tcp\"\n  AND network.transport == \"tcp\"\n \
    \ AND http.request.method IN (\"GET\", \"POST\")\n  AND (\n    (http.request.headers.user_agent LIKE \"*Mozilla/5.0 (Windows NT 6.1; WOW64;\
    \ Trident/7.0; rv:11.0) like Gecko*\")\n    OR (http.request.headers.accept LIKE \"*text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8*\"\
    )\n    OR (http.request.headers.accept_language LIKE \"*en-US*\")\n    OR (url.path LIKE \"*/s/ref=*\" OR url.path LIKE \"*/gp/*\" OR url.query\
    \ LIKE \"*field-keywords=*\")\n  )\n  AND source.ip NOT IN (\"10.0.0.10\", \"10.0.0.11\", \"192.168.1.100\")\n  AND NOT STARTS_WITH(source.ip,\
    \ \"172.16.254.\")\n| STATS \n    connection_count = COUNT(*),\n    unique_dest_ips = COUNT_DISTINCT(destination.ip),\n    total_bytes_out\
    \ = SUM(source.bytes)\n  BY source.ip, destination.ip, destination.port\n| WHERE connection_count >= 1\n| SORT total_bytes_out DESC\n| KEEP\
    \ source.ip, destination.ip, destination.port, connection_count, unique_dest_ips, total_bytes_out\n"
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND source_address NOT IN ["10.0.0.5", "10.0.0.6"] AND (destination_address=/.*\.cloudfront\.net$/ OR destination_address=/.*\.amazonaws\.com$/ OR user_agent ICONTAINS "Amazon" OR uri ICONTAINS "/gp/") AND source_address!=null AND destination_address!=null AND destination_port!=null) groupby(source_address, destination_address, destination_port) calculate(count), calculate(unique:destination_address), calculate(sum:bytes_out)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=tcp NOT (src_ip IN ["10.0.0.10", "10.0.0.11"] OR src_ip=*scanner* OR src_ip=*monitor*)
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=conn_count), count(dest_ip, distinct=true, as=unique_dest_ips), sum(bytes_out, as=total_bytes_out)])
    | conn_count >= 1
    | sort(field=total_bytes_out, order=desc, limit=10000)
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter ip_protocol = 6 and action_total_count >= 1
    | filter src_ip not in ("10.0.0.100", "10.0.0.101", "172.16.50.10")
    | comp count() as connection_count, count_distinct(dest_ip) as unique_dest_ips, sum(bytes_sent) as total_bytes_out by src_ip, dest_ip, dest_port
    | filter connection_count >= 1
    | sort desc total_bytes_out
    | fields src_ip, dest_ip, dest_port, connection_count, unique_dest_ips, total_bytes_out
  lucene: |
    network.protocol:tcp AND dest_port:443 AND (url.path:"/s/ref=nb_sb_noss_1/167-3294888-0262949/field-keywords=books" OR url.path:"/N4215/adj/amzn.us.sr.aps" OR http.request.headers.user_agent:"Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko") AND NOT (source.ip:(10.1.1.50 OR 10.1.1.51 OR 192.168.100.10))
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol="tcp" OR protocol matches "*tcp*"
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "bytes_out" as bytes_out
    | json field=_raw "url" as url
    | json field=_raw "user_agent" as user_agent
    | where (url matches "*/s/ref=*" AND url matches "*/field-keywords=*") OR (user_agent matches "*Mozilla/5.0 (Windows NT*" AND user_agent matches "*AppleWebKit*" AND user_agent matches "*Chrome/*")
    | where !(src_ip in ("10.0.0.100", "10.0.0.101", "192.168.1.50"))
    | sum(bytes_out) as total_bytes, count_distinct(dest_ip) as unique_dests, count as conn_count by src_ip, dest_ip, dest_port
    | where conn_count >= 1
    | sort by total_bytes desc
    | fields src_ip, dest_ip, dest_port, conn_count, unique_dests, total_bytes
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:

rule_id: TDL-DE-000450
v4_id: '000450'
name: PwnDrp Access
description: Detects downloads from PwnDrp web servers developed for red team testing and most likely also used for criminal activity
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp

    | search NOT (src_ip IN ("10.0.0.100", "10.0.0.101", "192.168.1.50"))

    | stats count dc(dest_ip) as unique_dest_ips sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(90d)\n| where DeviceVendor has_any (\"Palo Alto\", \"Fortinet\", \"Cisco\", \"Zscaler\"\
    , \"Checkpoint\", \"Barracuda\", \"Squid\", \"Bluecoat\", \"McAfee\", \"Forcepoint\")\n| where ApplicationProtocol =~ \"tcp\" or Protocol\
    \ =~ \"TCP\"\n| where DestinationIP in (\n    \"185.220.100.240\", \"185.220.100.241\", \"185.220.100.242\", \"185.220.100.243\", \"185.220.100.244\"\
    ,\n    \"185.220.100.245\", \"185.220.100.246\", \"185.220.100.247\", \"185.220.100.248\", \"185.220.100.249\",\n    \"185.220.100.250\",\
    \ \"185.220.100.251\", \"185.220.100.252\", \"185.220.100.253\", \"185.220.100.254\",\n    \"185.220.100.255\", \"185.220.101.1\", \"185.220.101.2\"\
    , \"185.220.101.3\", \"185.220.101.4\",\n    \"185.220.101.5\", \"185.220.101.6\", \"185.220.101.7\", \"185.220.101.8\", \"185.220.101.9\"\
    \n)\n| where SourceIP !in (\"10.0.0.100\", \"10.0.0.101\", \"192.168.1.50\", \"172.16.0.10\")\n| summarize \n    connection_count = count(),\n\
    \    distinct_dest_ips = dcount(DestinationIP),\n    total_bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort\n|\
    \ where connection_count >= 1\n| sort by total_bytes_out desc\n| project SourceIP, DestinationIP, DestinationPort, connection_count, distinct_dest_ips,\
    \ total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_destinations, SUM(destinationbytes) AS total_bytes_out
    FROM flows
    WHERE protocol = 6 AND sourceip NOT IN ('10.0.0.100', '10.0.0.101', '192.168.1.50')
    GROUP BY sourceip, destinationip, destinationport
    HAVING connection_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: "rule pwndrop_c2_traffic {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects network traffic to known PwnDrop\
    \ web servers - T1071 Application Layer Protocol\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1071\"\n\
    \    severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.ip_protocol = \"TCP\"\n   \
    \ (\n      $e.target.ip = \"45.9.20.200\" or\n      $e.target.ip = \"185.220.101.0\" or\n      $e.target.ip = \"209.141.40.190\" or\n    \
    \  $e.target.ip = \"185.220.101.1\" or\n      $e.target.ip = \"185.220.101.2\" or\n      $e.target.ip = \"185.220.101.3\" or\n      $e.target.ip\
    \ = \"185.220.101.4\" or\n      $e.target.ip = \"185.220.101.5\"\n    )\n    not (\n      $e.principal.ip = \"10.10.10.50\" or\n      $e.principal.ip\
    \ = \"10.10.10.51\" or\n      $e.principal.ip = \"192.168.1.100\"\n    )\n    $e.principal.ip = $src_ip\n    $e.target.ip = $dest_ip\n   \
    \ $e.target.port = $dest_port\n    \n  match:\n    $src_ip, $dest_ip, $dest_port over 24h\n    \n  outcome:\n    $risk_score = max(75)\n \
    \   $total_bytes_out = sum($e.network.sent_bytes)\n    $unique_destinations = count_distinct($e.target.ip)\n    $connection_count = count_distinct($e.metadata.id)\n\
    \    \n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-network*
    | WHERE @timestamp > NOW() - 24 hour
      AND network.transport == "tcp"
      AND destination.ip IN ("185.220.100.240", "185.220.100.241", "185.220.100.242", "185.220.100.243", "185.220.100.244", "185.220.100.245", "185.220.100.246", "185.220.100.247", "185.220.100.248", "185.220.100.249", "185.220.101.1", "185.220.101.2", "185.220.101.3", "185.220.101.4", "185.220.101.5", "185.220.101.6", "185.220.101.7", "185.220.101.8", "185.220.101.9", "185.220.102.240", "185.220.102.241", "185.220.102.242", "185.220.102.243", "185.220.102.244", "185.220.102.245", "185.220.102.246", "185.220.102.247", "185.220.102.248", "185.220.102.249")
      AND NOT source.ip IN ("10.0.0.100", "10.0.0.101", "192.168.1.50")
    | STATS connections = COUNT(*), distinct_dest = COUNT_DISTINCT(destination.ip), total_bytes_out = SUM(source.bytes) BY source.ip, destination.ip, destination.port
    | WHERE connections >= 1
    | SORT total_bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, connections, distinct_dest, total_bytes_out
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND destination_address IN ["149.28.84.98", "45.76.122.93", "207.148.81.119", "155.138.240.49", "149.28.93.184"] AND source_address NOT IN ["10.0.0.5", "10.0.0.6", "192.168.1.100"]) groupby(source_address, destination_address, destination_port) calculate(count, unique:destination_address, sum:bytes_out)
  crowdstrike: |
    #type=firewall OR #type=ids protocol=tcp dest_ip IN file="pwndrop_indicators.txt"
    | NOT (src_ip IN [10.0.0.100, 10.0.0.101, 192.168.1.50])
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=connections), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | connections >= 1
    | sort(total_bytes_out, order=desc)
    | table([src_ip, dest_ip, dest_port, connections, unique_dests, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter proto = "tcp"
    | filter src not in ("10.0.0.5", "10.0.0.10", "192.168.1.100")
    | comp count() as conn_count, count_distinct(dst) as distinct_dest, sum(bytes_sent) as total_bytes_out by src, dst, dport
    | filter conn_count >= 1
    | sort desc total_bytes_out
    | fields src, dst, dport, conn_count, distinct_dest, total_bytes_out
  lucene: |
    network.protocol:tcp AND dest_ip:("known.pwndrop.server1.com" OR "known.pwndrop.server2.com" OR "1.2.3.4" OR "5.6.7.8") AND NOT src_ip:("10.0.0.50" OR "10.0.0.51" OR "192.168.1.100")
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | json field=_raw "protocol" as protocol
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "bytes_out" as bytes_out
    | where protocol matches "*tcp*"
    | where !(src_ip in ("10.0.0.100", "10.0.0.101", "192.168.1.50"))
    | count as conn_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes by src_ip, dest_ip, dest_port
    | where conn_count >= 1
    | sort by total_bytes desc
    | fields src_ip, dest_ip, dest_port, conn_count, unique_dests, total_bytes
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.

rule_id: TDL-DE-000451
v4_id: '000451'
name: Raw Paste Service Access
description: Detects direct access to raw pastes in different paste services often used by malware in their second stages to download malicious
  code in encrypted or encoded form
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp (dest_ip="*pastebin.com*" OR dest_ip="*raw.githubusercontent.com*"
    OR dest_ip="*paste.ee*" OR dest_ip="*hastebin.com*") (uri_path="*/raw/*" OR uri_path="*/raw" OR url="*pastebin.com/raw*" OR url="*raw.githubusercontent.com*"
    OR url="*paste.ee/r*" OR url="*hastebin.com/raw*")

    NOT [| inputlookup admin_allowlist_scanners.csv | fields src_ip]

    | stats sum(bytes_out) as total_bytes_out, count as session_count by src_ip, dest_ip

    | where session_count >= 1

    | sort - total_bytes_out

    | table src_ip, dest_ip, total_bytes_out, session_count

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has_any ("Palo Alto", "Fortinet", "Cisco", "Zscaler", "Check Point", "Squid") or DeviceProduct has_any ("Firewall", "Proxy", "IDS", "IPS")
    | where Protocol =~ "tcp" or ApplicationProtocol =~ "tcp"
    | where DestinationHostName has_any ("pastebin.com", "raw.githubusercontent.com", "paste.ee", "hastebin.com", "rentry.co", "ghostbin.com", "dpaste.com", "pastelink.net")
        and (RequestURL has "/raw" or RequestURL has "/raw/" or DestinationHostName has "raw.")
    | where SourceIP !in ("10.0.0.100", "10.0.0.101", "192.168.1.50")
    | extend BytesOut = coalesce(SentBytes, BytesSent, 0)
    | summarize TotalBytesOut = sum(BytesOut), SessionCount = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SourceIP, DestinationIP, DestinationHostName, DestinationPort
    | where SessionCount >= 1
    | sort by TotalBytesOut desc
    | project FirstSeen, LastSeen, SourceIP, DestinationIP, DestinationHostName, DestinationPort, SessionCount, TotalBytesOut
  aql: |
    SELECT sourceip, destinationip, destinationport, SUM(bytesout) AS total_bytes_out, COUNT(*) AS session_count
    FROM flows
    WHERE protocol = 6
      AND (destinationip IN (SELECT destinationip FROM flows WHERE (DOMAINNAME(destinationip) ILIKE '%pastebin.com%' OR DOMAINNAME(destinationip) ILIKE '%githubusercontent.com%' OR DOMAINNAME(destinationip) ILIKE '%paste.ee%' OR DOMAINNAME(destinationip) ILIKE '%hastebin.com%'))
           OR "URL" ILIKE '%pastebin.com/raw%' OR "URL" ILIKE '%raw.githubusercontent.com%' OR "URL" ILIKE '%paste.ee/r%' OR "URL" ILIKE '%hastebin.com/raw%')
      AND sourceip NOT IN (SELECT sourceip FROM flows WHERE "Scanner" = 'true' OR "Monitoring_Agent" = 'true')
    GROUP BY sourceip, destinationip, destinationport
    HAVING session_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule defense_evasion_raw_paste_site_access {
      meta:
        author = "TDL"
        description = "T1071 - Application Layer Protocol - Access to raw paste service endpoints"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1071"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.network.ip_protocol = "TCP"
        (
          re.regex($e.target.url, `(?i)pastebin\.com/raw`) or
          re.regex($e.target.url, `(?i)raw\.githubusercontent\.com`) or
          re.regex($e.target.url, `(?i)paste\.ee/r`) or
          re.regex($e.target.url, `(?i)hastebin\.com/raw`) or
          re.regex($e.target.hostname, `(?i)pastebin\.com`) and re.regex($e.target.url, `(?i)/raw/`) or
          re.regex($e.target.hostname, `(?i)githubusercontent\.com`) and re.regex($e.target.url, `(?i)/raw/`) or
          re.regex($e.target.hostname, `(?i)paste\.ee`) and re.regex($e.target.url, `(?i)/r/`) or
          re.regex($e.target.hostname, `(?i)hastebin\.com`) and re.regex($e.target.url, `(?i)/raw/`)
        )
        not (
          $e.principal.ip = "10.0.0.100" or
          $e.principal.ip = "10.0.0.101" or
          $e.principal.ip = "192.168.1.50"
        )
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.network.sent_bytes > 0

      match:
        $src_ip, $dest_ip over 1h

      outcome:
        $risk_score = 50
        $total_bytes_out = sum($e.network.sent_bytes)
        $dest_port = array_distinct($e.target.port)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-network.firewall*, logs-network.ids*
    | WHERE @timestamp > NOW() - 24 hours
      AND network.protocol == "tcp"
      AND (
        destination.domain LIKE "*pastebin.com*" AND destination.domain LIKE "*raw*"
        OR destination.domain LIKE "*raw.githubusercontent.com*"
        OR destination.domain LIKE "*paste.ee*" AND destination.domain LIKE "*r/*"
        OR destination.domain LIKE "*hastebin.com*" AND destination.domain LIKE "*raw*"
        OR url.full LIKE "*pastebin.com/raw*"
        OR url.full LIKE "*raw.githubusercontent.com*"
        OR url.full LIKE "*paste.ee/r/*"
        OR url.full LIKE "*hastebin.com/raw*"
      )
      AND source.ip NOT IN ("10.0.0.100", "10.0.0.101", "192.168.1.50")
    | STATS bytes_out_total = SUM(network.bytes), session_count = COUNT(*) BY source.ip, destination.ip, destination.port
    | WHERE session_count >= 1
    | SORT bytes_out_total DESC
    | KEEP source.ip, destination.ip, destination.port, bytes_out_total, session_count
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND (destination_address ICONTAINS "pastebin.com/raw" OR destination_address ICONTAINS "raw.githubusercontent.com" OR destination_address ICONTAINS "paste.ee/r" OR destination_address ICONTAINS "hastebin.com/raw") AND source_address != "authorized_scanner_ip_1" AND source_address != "authorized_scanner_ip_2") groupby(source_address, destination_address) calculate(sum:bytes_out)
  crowdstrike: |
    #repo=network (sourcetype=firewall OR sourcetype=ids) network.protocol=*tcp*
    | (dest_ip=*pastebin.com* OR dest_ip=*raw.githubusercontent.com* OR dest_ip=*paste.ee* OR dest_ip=*hastebin.com* OR url=*pastebin.com/raw* OR url=*raw.githubusercontent.com* OR url=*paste.ee/r* OR url=*hastebin.com/raw*)
    | src_ip != /^(10\.10\.99\.|192\.168\.200\.)/
    | groupBy([src_ip, dest_ip], function=[sum(bytes_out, as=total_bytes), count(as=session_count)])
    | session_count >= 1
    | sort(total_bytes, order=desc)
    | table([src_ip, dest_ip, total_bytes, session_count])
  xql: "dataset = panw_ngfw_traffic_raw\n| filter proto = \"tcp\"\n| alter raw_paste_domain = arrayindex(regextract(http_hostname, \"([^\\.]+\\\
    .[^\\.]+)$\"), 0)\n| filter (http_hostname contains \"pastebin.com\" and http_url_path contains \"/raw\") \n   or (http_hostname contains\
    \ \"githubusercontent.com\" and http_url_path contains \"/raw\")\n   or (http_hostname contains \"paste.ee\" and http_url_path contains \"\
    /r\")\n   or (http_hostname contains \"hastebin.com\" and http_url_path contains \"/raw\")\n   or http_url_path ~= \".*/raw/.*\"\n| filter\
    \ src_ip not in (\"10.0.0.100\", \"10.0.0.101\", \"192.168.1.50\")\n| comp sum(bytes_sent) as bytes_out, count() as session_count by src_ip,\
    \ dst_ip, dst_port\n| filter session_count >= 1\n| sort desc bytes_out\n| fields src_ip, dst_ip, dst_port, bytes_out, session_count\n"
  lucene: |
    (sourcetype:(firewall OR ids)) AND network.protocol:tcp AND (dest_ip:*pastebin.com* OR dest_ip:*raw.githubusercontent.com* OR dest_ip:*paste.ee* OR dest_ip:*hastebin.com* OR url:*pastebin.com/raw* OR url:*raw.githubusercontent.com* OR url:*paste.ee/r* OR url:*hastebin.com/raw*) AND NOT (src_ip:(10.0.0.100 OR 10.0.0.101 OR 192.168.1.50))
  sumo: |
    _sourceCategory=*network* OR _sourceCategory=*firewall* OR _sourceCategory=*proxy*
    | json field=_raw "protocol" as protocol
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "bytes_out" as bytes_out
    | json field=_raw "dest_host" as dest_host
    | json field=_raw "url" as url
    | where protocol matches "*tcp*"
    | where (dest_host matches "*pastebin.com/raw*" or dest_host matches "*raw.githubusercontent.com*" or dest_host matches "*paste.ee/r*" or dest_host matches "*hastebin.com/raw*" or url matches "*pastebin.com/raw*" or url matches "*raw.githubusercontent.com*" or url matches "*paste.ee/r*" or url matches "*hastebin.com/raw*")
    | where !(src_ip in ("10.0.0.100", "10.0.0.101", "192.168.1.50"))
    | sum(bytes_out) as total_bytes_out by src_ip, dest_ip
    | count as session_count by src_ip, dest_ip, total_bytes_out
    | where session_count >= 1
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, total_bytes_out, session_count
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'
pseudo_logic: '1 Instance within any observed session window of a Forward Proxy or network firewall/IDS event.


  From index=network where sourcetype is firewall or sourcetype is ids.

  Where network.protocol contains "tcp".

  With dest_ip, dest_port, and src_ip captured per connection.

  With bytes_out summed per src_ip and dest_ip pair.

  Where count of matching sessions is greater than or equal to 1.

  Where destination corresponds to a known raw paste service endpoint (e.g., pastebin.com/raw, raw.githubusercontent.com, paste.ee/r, hastebin.com/raw,
  or equivalent raw-content URL paths).

  Excluding traffic originating from authorized scanner source IPs or monitoring agent source IPs as defined in the admin allow-list.


  With the same src_ip and dest_ip, sorted by highest bytes_out to surface largest data retrievals first, with no minimum spacing requirement
  given a threshold of 1 instance.'

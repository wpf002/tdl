rule_id: TDL-DE-000542
v4_id: '000542'
name: Secret Scanning Disabled
description: Detect when Secret Scanning setting has been disabled. GitHub scans repositories for known types of secrets, to prevent fraudulent
  use of secrets that were committed accidentally.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1562
technique_name: Impair Defenses
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github action IN ("secret_scanning.disable", "business_secret_scanning.disable", "repository_secret_scanning.disable", "secret_scanning_new_repos.disable",
    "business_secret_scanning.disabled_for_new_repos", "secret_scanning_push_protection.bypass", "business_secret_scanning_push_protection.disable",
    "repository_secret_scanning_push_protection.disable", "business_secret_scanning_push_protection.disabled_for_new_repos")

    | table _time, user, action, repo, org

    '
  kql: |
    GitHubAuditLogPolling
    | where Action in ("secret_scanning.disable", "business_secret_scanning.disable", "repository_secret_scanning.disable", "secret_scanning_new_repos.disable", "business_secret_scanning.disabled_for_new_repos", "secret_scanning_push_protection.bypass", "business_secret_scanning_push_protection.disable", "repository_secret_scanning_push_protection.disable", "business_secret_scanning_push_protection.disabled_for_new_repos")
    | project TimeGenerated, Action, ActorUsername, Repository, Organization, IPaddress, UserAgent
  aql: |
    SELECT eventtime, username, sourceip, "action", "repository", "organization", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "action" IN ('secret_scanning.disable', 'business_secret_scanning.disable', 'repository_secret_scanning.disable', 'secret_scanning_new_repos.disable', 'business_secret_scanning.disabled_for_new_repos', 'secret_scanning_push_protection.bypass', 'business_secret_scanning_push_protection.disable', 'repository_secret_scanning_push_protection.disable', 'business_secret_scanning_push_protection.disabled_for_new_repos')
    LAST 24 HOURS
  yara_l: |
    rule github_secret_scanning_disabled {
      meta:
        author = "Detection Engineer"
        description = "Detects disabling of GitHub secret scanning or push protection features - MITRE T1562 Defense Evasion"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1562"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "GITHUB"
        $e.metadata.product_event_type = $action
        (
          $action = "secret_scanning.disable" or
          $action = "business_secret_scanning.disable" or
          $action = "repository_secret_scanning.disable" or
          $action = "secret_scanning_new_repos.disable" or
          $action = "business_secret_scanning.disabled_for_new_repos" or
          $action = "secret_scanning_push_protection.bypass" or
          $action = "business_secret_scanning_push_protection.disable" or
          $action = "repository_secret_scanning_push_protection.disable" or
          $action = "business_secret_scanning_push_protection.disabled_for_new_repos"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-github*
    | WHERE github.action IN ("secret_scanning.disable", "business_secret_scanning.disable", "repository_secret_scanning.disable", "secret_scanning_new_repos.disable", "business_secret_scanning.disabled_for_new_repos", "secret_scanning_push_protection.bypass", "business_secret_scanning_push_protection.disable", "repository_secret_scanning_push_protection.disable", "business_secret_scanning_push_protection.disabled_for_new_repos")
    | KEEP @timestamp, github.actor, github.action, github.repository, github.org
  leql: |
    where(source_json.action IN [secret_scanning.disable, business_secret_scanning.disable, repository_secret_scanning.disable, secret_scanning_new_repos.disable, business_secret_scanning.disabled_for_new_repos, secret_scanning_push_protection.bypass, business_secret_scanning_push_protection.disable, repository_secret_scanning_push_protection.disable, business_secret_scanning_push_protection.disabled_for_new_repos])
  crowdstrike: |
    #repo=github action IN (secret_scanning.disable, business_secret_scanning.disable, repository_secret_scanning.disable, secret_scanning_new_repos.disable, business_secret_scanning.disabled_for_new_repos, secret_scanning_push_protection.bypass, business_secret_scanning_push_protection.disable, repository_secret_scanning_push_protection.disable, business_secret_scanning_push_protection.disabled_for_new_repos)
    | table([@timestamp, actor, action, repo, org])
  xql: |
    dataset = github_audit_log_raw
    | filter action in ("secret_scanning.disable", "business_secret_scanning.disable", "repository_secret_scanning.disable", "secret_scanning_new_repos.disable", "business_secret_scanning.disabled_for_new_repos", "secret_scanning_push_protection.bypass", "business_secret_scanning_push_protection.disable", "repository_secret_scanning_push_protection.disable", "business_secret_scanning_push_protection.disabled_for_new_repos")
    | fields _time, action, actor, repo, org
  lucene: |
    actions:(secret_scanning.disable OR business_secret_scanning.disable OR repository_secret_scanning.disable OR secret_scanning_new_repos.disable OR business_secret_scanning.disabled_for_new_repos OR secret_scanning_push_protection.bypass OR business_secret_scanning_push_protection.disable OR repository_secret_scanning_push_protection.disable OR business_secret_scanning_push_protection.disabled_for_new_repos)
  sumo: |
    _sourceCategory=*Github* (secret_scanning.disable OR business_secret_scanning.disable OR repository_secret_scanning.disable OR secret_scanning_new_repos.disable OR business_secret_scanning.disabled_for_new_repos OR secret_scanning_push_protection.bypass OR business_secret_scanning_push_protection.disable OR repository_secret_scanning_push_protection.disable OR business_secret_scanning_push_protection.disabled_for_new_repos)
    | json field=_raw "action" as action
    | where action in ("secret_scanning.disable", "business_secret_scanning.disable", "repository_secret_scanning.disable", "secret_scanning_new_repos.disable", "business_secret_scanning.disabled_for_new_repos", "secret_scanning_push_protection.bypass", "business_secret_scanning_push_protection.disable", "repository_secret_scanning_push_protection.disable", "business_secret_scanning_push_protection.disabled_for_new_repos")
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net

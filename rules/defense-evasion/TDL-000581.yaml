rule_id: TDL-DE-000581
v4_id: 000581
name: Kubernetes Events Deleted
description: 'Detects when events are deleted in Kubernetes. An adversary may delete Kubernetes events in an attempt to evade detection. Sigma
  rule by Leo Tsaousis (@laripping)


  ref: https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Delete%20K8S%20events/'
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070
technique_name: Indicator Removal
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:events resource=events verb=delete

    | table _time, user, sourceIPs, resource, verb, objectRef.name, objectRef.namespace

    '
  kql: |
    KubernetesAudit
    | where TimeGenerated > ago(24h)
    | where ObjectRef.Resource =~ "events"
    | where Verb =~ "delete"
    | project TimeGenerated, User, SourceIPs, ObjectRef, Verb, ResponseStatus, UserAgent
  aql: |
    SELECT sourceip, username, "kubernetes.verb" AS verb, "kubernetes.resource" AS resource, COUNT(*) AS event_count
    FROM events
    WHERE "kubernetes.resource" = 'events'
      AND "kubernetes.verb" = 'delete'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_event_deletion_defense_evasion {
      meta:
        author = "TDL"
        description = "Detects deletion of Kubernetes events which may indicate defense evasion (T1070)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1070"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.metadata.event_type = "RESOURCE_DELETION"
        $e.target.resource.name = "events"
        $e.security_result.action = "delete"
        $e.principal.user.userid = $user
        $e.target.resource.attribute.labels.value = $namespace

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 24 hour \n  AND kubernetes.audit.objectRef.resource == \"events\" \n  AND kubernetes.audit.verb\
    \ == \"delete\"\n| KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name,\
    \ kubernetes.audit.verb, kubernetes.audit.objectRef.resource, host.name\n"
  leql: |
    where(source_json.objectRef.resource="events" AND source_json.verb="delete")
  crowdstrike: |
    #type=kubernetes verb=delete resource=events
    | table([@timestamp, user.username, sourceIPs, objectRef.namespace, objectRef.name, responseStatus.code])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and operation_name = "delete" and resource_type = "events"
    | fields _time, actor_user, resource_name, namespace, cluster_name, operation_name, resource_type
  lucene: |
    resource:events AND verb:delete
  sumo: |
    _sourceCategory=*Kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | where resource = "events" and verb = "delete"
    | fields _messageTime, _sourceHost, resource, verb
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Resource is \"events\"\nWhere Verb is \"delete\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

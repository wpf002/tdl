rule_id: TDL-DE-000589
v4_id: 000589
name: Pass the Ticket Attack Activity
description: Detects when a source generates ticket granting service (TGS) events without ticket granting ticket (TGT) events, which means a Pass
  the Ticket attack may be occurring. Adversaries may "pass the ticket" using stolen Kerberos tickets to move laterally within an environment,
  bypassing normal system access controls. Pass the ticket (PtT) is a method of authenticating to a system using Kerberos tickets without having
  access to an account's password.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1550
technique_name: Use Alternate Authentication Material
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4768, 4769'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=4769 OR EventCode=4768)

    | eval timewindow=relative_time(_time, "-5h")

    | eventstats min(_time) as first_event, max(_time) as last_event, values(EventCode) as all_event_codes, dc(eval(if(EventCode=4769, Service_Name,
    null()))) as unique_services, count(eval(if(EventCode=4769, 1, null()))) as ticket_count by Source_Network_Address, Account_Name

    | where EventCode=4769

    | where NOT match(Account_Name, "\$$")

    | where NOT match(Service_Name, "\$$")

    | where Service_Name!="krbtgt"

    | where (last_event - first_event) <= 18000

    | where ticket_count >= 5

    | where unique_services >= 5

    | where NOT match(all_event_codes, "4768")

    | stats count, values(Service_Name) as service_names, min(_time) as first_seen, max(_time) as last_seen by Source_Network_Address, Account_Name

    | table first_seen, last_seen, Source_Network_Address, Account_Name, count, service_names

    '
  kql: |
    let timeframe = 5h;
    let threshold = 5;
    let suspiciousActivity = SecurityEvent
    | where TimeGenerated > ago(timeframe)
    | where EventID == 4769
    | where Account !endswith "$"
    | extend ServiceName = extract(@"Service Name:\s+(\S+)", 1, EventData)
    | where ServiceName !endswith "$"
    | where ServiceName != "krbtgt"
    | extend SrcIP = IpAddress
    | summarize ServiceNames = make_set(ServiceName), EventCount = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by SrcIP, Account
    | where EventCount >= threshold
    | where array_length(ServiceNames) >= threshold
    | project SrcIP, Account, ServiceNames, EventCount, FirstSeen, LastSeen;
    let tgsWithoutTgt = suspiciousActivity
    | join kind=leftanti (
        SecurityEvent
        | where TimeGenerated > ago(timeframe)
        | where EventID == 4768
        | extend SrcIP = IpAddress
        | project SrcIP, Account
        | distinct SrcIP, Account
    ) on SrcIP, Account;
    tgsWithoutTgt
  aql: |
    SELECT sourceip, username, UNIQUECOUNT("Service Name") AS unique_services, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '4769'
      AND username NOT LIKE '%$'
      AND "Service Name" NOT LIKE '%$'
      AND "Service Name" != 'krbtgt'
      AND sourceip NOT IN (
        SELECT sourceip FROM events WHERE "EventID" = '4768' LAST 5 HOURS
      )
    GROUP BY sourceip, username
    HAVING unique_services >= 5 AND event_count >= 5
    LAST 5 HOURS
  yara_l: |
    rule mitre_t1550_kerberoasting_activity {
      meta:
        author = "Detection Engineer"
        description = "Detects potential Kerberoasting via multiple TGS requests without TGT from same source"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1550"
        severity = "HIGH"

      events:
        $tgs.metadata.event_type = "USER_UNCATEGORIZED"
        $tgs.metadata.product_event_type = "4769"
        $tgs.principal.user.userid = $user
        $tgs.principal.ip = $src_ip
        $tgs.target.resource.name = $service_name
        not re.regex($tgs.principal.user.userid, `\$$`)
        not re.regex($tgs.target.resource.name, `\$$`)
        $tgs.target.resource.name != "krbtgt"

        $tgt.metadata.event_type = "USER_UNCATEGORIZED"
        $tgt.metadata.product_event_type = "4768"
        $tgt.principal.user.userid = $user
        $tgt.principal.ip = $src_ip

      match:
        $src_ip, $user over 5h

      outcome:
        $risk_score = 85
        $unique_services = count_distinct($tgs.target.resource.name)

      condition:
        #tgs >= 5 and
        $unique_services >= 5 and
        #tgt = 0
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 5 hours
      AND event.code IN ("4768", "4769")
    | EVAL is_4768 = CASE(event.code == "4768", 1, 0),
           is_4769 = CASE(event.code == "4769", 1, 0),
           src_user = COALESCE(winlog.event_data.TargetUserName, user.name),
           src_ip = COALESCE(winlog.event_data.IpAddress, source.ip),
           service_name = winlog.event_data.ServiceName
    | WHERE NOT (src_user LIKE "*$")
    | STATS count_4769 = SUM(is_4769),
            count_4768 = SUM(is_4768),
            unique_services = COUNT_DISTINCT(service_name)
      BY src_ip, src_user, service_name
    | WHERE service_name IS NOT NULL
      AND NOT (service_name LIKE "*$")
      AND service_name != "krbtgt"
    | STATS total_4769 = SUM(count_4769),
            total_4768 = SUM(count_4768),
            distinct_services = COUNT_DISTINCT(service_name)
      BY src_ip, src_user
    | WHERE total_4769 >= 5
      AND distinct_services >= 5
      AND total_4768 == 0
    | KEEP src_ip, src_user, total_4769, distinct_services
  leql: |
    where(source_json.EventID=4769 AND source_user NOT ENDS-WITH "$" AND source_json.ServiceName NOT ENDS-WITH "$" AND source_json.ServiceName != "krbtgt") groupby(source_address, source_user) calculate(unique:source_json.ServiceName)
  crowdstrike: |
    EventCode=4769
    | !match(field="TargetUserName", regex=".*\$$")
    | !match(field="ServiceName", regex=".*\$$")
    | ServiceName!=krbtgt
    | groupBy([IpAddress, TargetUserName], function=[count(as=event_count), count(ServiceName, distinct=true, as=unique_services)])
    | event_count >= 5
    | unique_services >= 5
    | join({EventCode=4768 | groupBy([IpAddress, TargetUserName], function=count(as=tgt_count))}, field=[IpAddress, TargetUserName], include=[tgt_count], mode=left)
    | default(field=tgt_count, value=0)
    | tgt_count = 0
    | table([IpAddress, TargetUserName, event_count, unique_services])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (4768, 4769)
    | alter src_user = coalesce(action_evtlog_event_data_TargetUserName, ""),
            src_ip = coalesce(action_evtlog_event_data_IpAddress, ""),
            service_name = coalesce(action_evtlog_event_data_ServiceName, "")
    | filter src_user != "" and src_ip != ""
    | bin _time span = 5h
    | alter is_4769 = if(action_evtlog_event_id = 4769, 1, 0),
            is_4768 = if(action_evtlog_event_id = 4768, 1, 0)
    | comp sum(is_4769) as total_4769,
            sum(is_4768) as total_4768,
            count_distinct(if(is_4769 = 1 and not src_user ~= "\$$" and not service_name ~= "\$$" and service_name != "krbtgt", service_name, null)) as unique_services
      by _time, src_ip, src_user
    | filter total_4769 >= 5 and unique_services >= 5 and total_4768 = 0
    | fields _time, src_ip, src_user, total_4769, unique_services
  lucene: |
    event.code:4769 AND NOT winlog.event_data.TargetUserName:*$ AND NOT winlog.event_data.ServiceName:*$ AND NOT winlog.event_data.ServiceName:krbtgt
  sumo: |
    _sourceCategory=*Windows* ("4769" OR "4768")
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "TargetUserName" as src_user
    | json field=_raw "ServiceName" as service_name
    | where event_id in ("4768", "4769")
    | where !(src_user matches "*$")
    | timeslice 5h
    | where event_id = "4769" and !(service_name matches "*$") and service_name != "krbtgt"
    | count as event_count, count_distinct(service_name) as unique_services by _timeslice, src_ip, src_user
    | where event_count >= 5 and unique_services >= 5
    | join (
        _sourceCategory=*Windows* "4768"
        | json field=_raw "EventID" as event_id
        | json field=_raw "IpAddress" as src_ip_tgt
        | json field=_raw "TargetUserName" as src_user_tgt
        | where event_id = "4768"
        | timeslice 5h
        | count by _timeslice, src_ip_tgt, src_user_tgt
    ) as tgt on _timeslice = tgt._timeslice and src_ip = tgt.src_ip_tgt and src_user = tgt.src_user_tgt
    | where isNull(tgt._timeslice)
    | fields _timeslice, src_ip, src_user, event_count, unique_services
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '5 Windows Events

  Where the Event ID is  "4769"

  Where the Source user is NOT a machine account

  Where the Service Name does NOT end with "$"

  Where the Service Name is NOT "krbtgt"

  With 5 Unique Service Names

  From the Same Src IP and Src User

  Within 5 Hours


  AND where there are no 4768 Events within the timeframe from the same source IP and user'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

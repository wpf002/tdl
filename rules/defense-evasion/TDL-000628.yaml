rule_id: TDL-DE-000628
v4_id: 000628
name: Fork Bomb
description: This command indicates a Linux Fork Bomb. The fork bomb is a form of denial-of-service (DoS) attack against a Linux or Unix-based
  system. It makes use of the fork operation.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1564
technique_name: Hide Artifacts
platform:
- Linux
data_sources:
- Linux
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=linux sourcetype IN(linux_secure, syslog, bash_history) "*:(){:|:&};:*"

    | table _time, host, user, command, process, shell

    '
  kql: |
    Syslog
    | where TimeGenerated > ago(1h)
    | where SyslogMessage contains ":(){:|:&};:"
    | project TimeGenerated, Computer, SyslogMessage, ProcessName, ProcessID, HostIP
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Command Line" AS commandline
    FROM events
    WHERE "Command Line" ILIKE '%:(){:|:&};:%'
    LAST 24 HOURS
  yara_l: "rule fork_bomb_pattern {\n  meta:\n    author = \"TDL\"\n    description = \"Detects fork bomb pattern :(){:|:&};: in command line\"\
    \n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1564\"\n    platform = \"Linux\"\n    \n  events:\n    $e.metadata.event_type\
    \ = \"PROCESS_LAUNCH\"\n    re.regex($e.principal.process.command_line, `:.*\\(\\).*\\{.*:.*\\|.*:.*&.*\\}.*;.*:`)\n    \n  match:\n    $e.principal.hostname\
    \ over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-endpoint.events.process*
    | WHERE process.command_line LIKE "*:(){:|:&};:*"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name
  leql: |
    where(process_cmd_line ICONTAINS ":(){:|:&};:")
  crowdstrike: |
    event_simpleName=ProcessRollup2 event_platform=Lin CommandLine=*":(){:|:&};:"*
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and os_type = OS_LINUX
      and action_process_image_command_line contains ":(){:|:&};:"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    process.command_line:*\:\(\)\{\:\|\:\&\}\;\:*
  sumo: |
    _sourceCategory=*Linux* ":(){:|:&};:"
    | parse regex "(?<command_line>.*:.*\(\).*\{.*\|.*:.*&.*\}.*:.*)" nodrop
    | where command_line matches "*:(){:|:&};:*"
    | fields _messageTime, _sourceHost, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 command line event \n    where command line contains \":(){:|:&};:\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000647
v4_id: '000647'
name: Service Accessing Atypical Folders - Varonis
description: Detects suspicious activity performed by a service account or service accessing directories they typically don't interact with. This
  could be an indication of account compromise or possible malware activity.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1083
technique_name: File and Directory Discovery
platform:
- Windows
data_sources:
- Varonis
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=varonis sourcetype=varonis:datalert Alert_Name="Abnormal service behavior: access to atypical folders"

    | table _time, Alert_Name, User, Computer, Resource, Severity, Description

    '
  kql: |
    VaronisAlerts
    | where TimeGenerated > ago(1h)
    | where AlertName in ("Abnormal service behavior: access to atypical folders")
    | project TimeGenerated, AlertName, AlertSeverity, UserName, DeviceName, ResourceName, Description, RawEventData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, username, sourceip, "Alert Name", "Alert Details"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Varonis%'
      AND "Alert Name" = 'Abnormal service behavior: access to atypical folders'
    LAST 24 HOURS
  yara_l: "rule varonis_abnormal_service_behavior_t1083 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects abnormal service behavior\
    \ accessing atypical folders via Varonis DatAdvantage\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1083\"\
    \n    mitre_attack_technique_name = \"File and Directory Discovery\"\n    severity = \"Medium\"\n    \n  events:\n    $alert.metadata.vendor_name\
    \ = \"Varonis\"\n    $alert.metadata.product_name = \"DatAdvantage\"\n    $alert.security_result.summary = \"Abnormal service behavior: access\
    \ to atypical folders\"\n    $alert.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $alert\n}\n"
  esql: "FROM logs-varonis.datadvantage*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.action == \"alert\" \n  AND TO_LOWER(varonis.alert.name)\
    \ == \"abnormal service behavior: access to atypical folders\"\n| KEEP @timestamp, host.name, user.name, varonis.alert.name, varonis.alert.severity,\
    \ varonis.alert.description, source.ip, file.path\n"
  leql: |
    where(source_json.AlertName="Abnormal service behavior: access to atypical folders")
  crowdstrike: |
    #type=varonis alert_name="Abnormal service behavior: access to atypical folders"
    | table([@timestamp, alert_name, ComputerName, UserName, affected_resource, severity])
  xql: |
    dataset = varonis_datadvantage_alert_raw
    | filter alert_name in ("Abnormal service behavior: access to atypical folders")
    | fields _time, alert_name, alert_severity, source_host, source_user, target_resource, alert_description
  lucene: |
    alert_name:"Abnormal service behavior: access to atypical folders"
  sumo: |
    _sourceCategory=*Varonis* OR _sourceCategory=*DatAdvantage*
    | json field=_raw "AlertName" as alert_name
    | where alert_name in ("Abnormal service behavior: access to atypical folders")
    | fields _messageTime, _sourceHost, alert_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Varonis DatAdvantage Alert \nWhere the Alert Name is in [\"Abnormal service behavior: access to atypical folders\"]"
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

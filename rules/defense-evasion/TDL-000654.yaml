rule_id: TDL-DE-000654
v4_id: '000654'
name: Azure Blob Container Access Level Modified
description: Detects changes to container access levels in Azure and when any modification is made to a blob container, including changing the
  public access level which can introduce risks if sensitive data is exposed to the public or unauthorized users.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1499
technique_name: Data Manipulation
platform:
- Azure
data_sources:
- Azure Activity
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=azure sourcetype=azure:aad:audit OR sourcetype=azure:monitor:activity operationName="MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE"
    status=Success OR resultType=Success

    | table _time, user, operationName, status, resultType, resourceId, subscriptionId, resourceGroup

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(1h)
    | where OperationNameValue =~ "MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE"
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, OperationNameValue, ActivityStatusValue, ResourceGroup, SubscriptionId, ResourceId, Properties
  aql: |
    SELECT username, sourceip, "Azure Operation", "Azure Resource", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Azure%'
      AND categoryname(category) ILIKE '%Azure%Activity%'
      AND "Azure Operation" = 'MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE'
      AND (eventname ILIKE '%success%' OR "Azure Result" ILIKE '%success%' OR "Azure Status" = 'Success')
    LAST 24 HOURS
  yara_l: |
    rule azure_storage_container_write_defense_evasion {
      meta:
        author = "Detection Engineering"
        description = "Detects Azure storage container write operations that may be used for defense evasion (T1499)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1499"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "Administrative"
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        re.regex($e.target.resource.name, `(?i)MICROSOFT\.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE`)
        $e.security_result.action = "ALLOW"
        $e.principal.user.userid = $user
        $e.target.resource.name = $operation

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE @timestamp > NOW() - 24 hours
      AND azure.activitylogs.operation_name == "MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE"
      AND event.outcome == "success"
    | KEEP @timestamp, azure.activitylogs.operation_name, event.outcome, azure.activitylogs.caller, azure.resource.id, azure.resource.group, cloud.account.id
  leql: |
    where(source_json.operationName IN ["MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE"] AND source_json.resultType="Success")
  crowdstrike: |
    event_platform=Azure event_simpleName=AzureActivityLog operationName="MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE" resultType=Success
    | table([@timestamp, ComputerName, UserName, operationName, resourceId, resultType])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name in ("MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE") and operation_status = "Success"
    | fields _time, actor_user, resource_name, operation_name, operation_status, cloud_provider_project
  lucene: |
    operationName:"MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE" AND resultType:Success
  sumo: |
    _sourceCategory=*Azure* ("MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE")
    | json field=_raw "operationName" as operation
    | json field=_raw "resultType" as result
    | where operation matches "*MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE*" and (result = "Success" or result = "Succeeded")
    | fields _messageTime, _sourceHost, operation, result
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Azure Administrative Activity Event

  Where the operation is in ["MICROSOFT.STORAGE/STORAGEACCOUNTS/BLOBSERVICES/CONTAINERS/WRITE"]

  Where the action is success'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

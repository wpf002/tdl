rule_id: TDL-DE-000655
v4_id: '000655'
name: Azure Key Vault Modification
description: Detections modifications to a Key Vault in Azure. The Key Vault is a service that safeguards encryption keys and secrets like certificates,
  connection strings, and passwords.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1213
technique_name: Data from Information Repositories
platform:
- Azure
data_sources:
- Azure Activity
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=azure sourcetype=azure:activity operationName IN (\"MICROSOFT.KEYVAULT/VAULTS/DELETE\", \"MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION\"\
    , \"MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE\", \"MICROSOFT.KEYVAULT/VAULTS/WRITE\") \n| table _time, user, operationName, resourceId,\
    \ callerIpAddress, resultType, properties\n"
  kql: |
    AzureActivity
    | where TimeGenerated > ago(1h)
    | where OperationNameValue in~ ("MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE", "MICROSOFT.KEYVAULT/VAULTS/WRITE")
    | project TimeGenerated, Caller, OperationNameValue, ResourceGroup, SubscriptionId, ResourceId, ActivityStatusValue, CallerIpAddress
  aql: |
    SELECT username, "Azure Activity", "Azure Operation", sourceip, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Azure%'
      AND (
        UPPER("Azure Operation") = 'MICROSOFT.KEYVAULT/VAULTS/DELETE'
        OR UPPER("Azure Operation") = 'MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION'
        OR UPPER("Azure Operation") = 'MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE'
        OR UPPER("Azure Operation") = 'MICROSOFT.KEYVAULT/VAULTS/WRITE'
      )
    GROUP BY username, "Azure Activity", "Azure Operation", sourceip
    LAST 24 HOURS
  yara_l: "rule azure_keyvault_sensitive_operations {\n  meta:\n    author = \"Chronicle Detection Engineering\"\n    description = \"Detects\
    \ sensitive Azure Key Vault operations that may indicate defense evasion - MITRE T1213\"\n    mitre_attack_tactic = \"Defense Evasion\"\n\
    \    mitre_attack_technique = \"T1213\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"Azure\"\n    $e.metadata.product_event_type\
    \ = \"Azure Activity\"\n    (\n      $e.target.resource.attribute.labels[\"operation\"] = \"MICROSOFT.KEYVAULT/VAULTS/DELETE\" or\n      $e.target.resource.attribute.labels[\"\
    operation\"] = \"MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION\" or\n      $e.target.resource.attribute.labels[\"operation\"] = \"MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE\"\
    \ or\n      $e.target.resource.attribute.labels[\"operation\"] = \"MICROSOFT.KEYVAULT/VAULTS/WRITE\"\n    )\n    $e.principal.user.userid\
    \ = $user\n    $e.target.resource.name = $resource\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE event.action IN ("MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE", "MICROSOFT.KEYVAULT/VAULTS/WRITE")
    | KEEP @timestamp, event.action, azure.activitylogs.identity.authorization.evidence.principal_id, azure.activitylogs.identity.claims.name, cloud.account.id, azure.resource.name, azure.resource.group
  leql: |
    where(source_json.operationName IN ["MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE", "MICROSOFT.KEYVAULT/VAULTS/WRITE"])
  crowdstrike: |
    #type=azure:activity (operationName="MICROSOFT.KEYVAULT/VAULTS/DELETE" OR operationName="MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION" OR operationName="MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE" OR operationName="MICROSOFT.KEYVAULT/VAULTS/WRITE")
    | table([@timestamp, operationName, callerIpAddress, caller, resourceId, subscriptionId])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and operation_name in ("MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE", "MICROSOFT.KEYVAULT/VAULTS/WRITE")
    | fields _time, operation_name, actor_user, resource_name, cloud_provider_project, result_status
  lucene: |
    operationName:("MICROSOFT.KEYVAULT/VAULTS/DELETE" OR "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION" OR "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE" OR "MICROSOFT.KEYVAULT/VAULTS/WRITE")
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*azure*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "resourceId" as resource_id
    | json field=_raw "caller" as caller
    | json field=_raw "callerIpAddress" as caller_ip
    | where operation_name in ("MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE", "MICROSOFT.KEYVAULT/VAULTS/WRITE")
    | fields _messageTime, caller, caller_ip, operation_name, resource_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '"1 Azure Administrative Activity Event

  Where the operation is in ["MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION", "MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE","MICROSOFT.KEYVAULT/VAULTS/WRITE"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000661
v4_id: '000661'
name: Windows Active Directory Object WriteDAC Access
description: Detects instances where WriteDAC permissions are modified or accessed. WriteDAC allows users to change the discretionary access control
  list (DACL) of an object, which defines the permissions for that object. Unauthorized or unexpected changes to WriteDAC permissions can indicate
  potential privilege escalation or malicious activity.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1222
technique_name: File and Directory Permissions Modification
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4662'
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4662 ObjectServer="DS" (AccessMask="0x40000" OR (ObjectType="*19195a5b-6da0-11d0-afd3-00c04fd930c9*"
    OR ObjectType="*domainDNS*"))

    | table _time, ComputerName, Account_Name, ObjectServer, AccessMask, ObjectType, ObjectName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4662
    | where ObjectServer == "DS"
    | where AccessMask == "0x40000" or (ObjectType contains "19195a5b-6da0-11d0-afd3-00c04fd930c9" and ObjectType contains "domainDNS")
    | project TimeGenerated, Computer, Account, SubjectUserName, SubjectDomainName, ObjectServer, ObjectType, ObjectName, AccessMask, OperationType, Properties
  aql: |
    SELECT eventtime, sourceip, username, LOGSOURCENAME(logsourceid) AS host, "ObjectServer", "AccessMask", "ObjectType"
    FROM events
    WHERE "EventID" = '4662'
      AND "ObjectServer" = 'DS'
      AND ("AccessMask" = '0x40000' OR "ObjectType" ILIKE '%19195a5b-6da0-11d0-afd3-00c04fd930c9%' OR "ObjectType" ILIKE '%domainDNS%')
    LAST 1 HOURS
  yara_l: "rule ad_permissions_modification_t1222 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential Defense Evasion via\
    \ AD permissions modification (T1222)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1222\"\n    severity\
    \ = \"Medium\"\n\n  events:\n    $e.metadata.event_type = \"GENERIC_EVENT\"\n    $e.metadata.product_event_type = \"4662\"\n    $e.metadata.vendor_name\
    \ = \"Microsoft\"\n    $e.metadata.product_name = \"Windows\"\n    \n    (\n      (\n        $e.security_result.about.labels.value = \"DS\"\
    \ and\n        $e.security_result.about.labels.key = \"ObjectServer\" and\n        $e.security_result.about.labels.value = \"0x40000\" and\n\
    \        $e.security_result.about.labels.key = \"AccessMask\"\n      )\n      or\n      (\n        re.regex($e.security_result.about.resource.attribute.labels.value,\
    \ `19195a5b-6da0-11d0-afd3-00c04fd930c9`)\n      )\n      or\n      (\n        re.regex($e.security_result.about.resource.type, `(?i)domainDNS`)\n\
    \      )\n    )\n    \n    $e.principal.hostname = $host\n\n  match:\n    $host over 5m\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour
      AND event.code == "4662"
      AND winlog.event_data.ObjectServer == "DS"
      AND (
        winlog.event_data.AccessMask == "0x40000"
        OR (
          (winlog.event_data.ObjectType LIKE "*19195a5b-6da0-11d0-afd3-00c04fd930c9*" OR winlog.event_data.ObjectType LIKE "*domainDNS*")
        )
      )
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ObjectServer, winlog.event_data.AccessMask, winlog.event_data.ObjectType, winlog.event_data.ObjectName
  leql: |
    where(source_json.EventID=4662 AND source_json.ObjectServer="DS" AND (source_json.AccessMask="0x40000" OR source_json.ObjectType ICONTAINS "19195a5b-6da0-11d0-afd3-00c04fd930c9" OR source_json.ObjectType ICONTAINS "domainDNS"))
  crowdstrike: |
    EventCode=4662 ObjectServer="DS" (AccessMask="0x40000" OR (ObjectType=*19195a5b-6da0-11d0-afd3-00c04fd930c9* OR ObjectType=*domainDNS*))
    | table([@timestamp, ComputerName, SubjectUserName, ObjectServer, AccessMask, ObjectType, ObjectName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4662
    | filter action_evtlog_event_data_ObjectServer = "DS"
    | filter action_evtlog_event_data_AccessMask = "0x40000" or (action_evtlog_event_data_ObjectType contains "19195a5b-6da0-11d0-afd3-00c04fd930c9" or action_evtlog_event_data_ObjectType contains "domainDNS")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_ObjectServer, action_evtlog_event_data_AccessMask, action_evtlog_event_data_ObjectType, action_evtlog_event_data_ObjectName
  lucene: |
    event.code:4662 AND ObjectServer:"DS" AND (AccessMask:"0x40000" OR (ObjectType:*19195a5b-6da0-11d0-afd3-00c04fd930c9* OR ObjectType:*domainDNS*))
  sumo: |
    _sourceCategory=*Windows*Security* "4662"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectServer" as object_server
    | json field=_raw "AccessMask" as access_mask
    | json field=_raw "ObjectType" as object_type
    | where event_id = "4662" and object_server = "DS" and (access_mask = "0x40000" or object_type matches "*19195a5b-6da0-11d0-afd3-00c04fd930c9*" or object_type matches "*domainDNS*")
    | fields _messageTime, _sourceHost, object_server, access_mask, object_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:

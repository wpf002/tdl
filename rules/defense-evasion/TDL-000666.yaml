rule_id: TDL-DE-000666
v4_id: '000666'
name: Ptrace Anti Debugging Activity - GuardDuty
description: This detection looks for a process running on the listed Amazon EC2 instance or a container within your AWS environment that has
  used the ptrace system call with the PTRACE_TRACEME option. This activity would cause an attached debugger to detach from the running process.
  If no debugger is attached, it has no effect. However, the activity in itself raises suspicion because this might indicate that malware is running
  on the system. Malware frequently uses anti-debugging techniques to evade analysis, and these techniques can be detected at runtime. GuardDuty
  examines related runtime activity and context so that it generates this finding only when the associated activity and context are potentially
  suspicious.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1622
technique_name: Debugger Evasion
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=guardduty sourcetype=aws:cloudwatch:guardduty type IN ("DefenseEvasion:Runtime/PtraceAntiDebugging")
    | table _time, id, type, severity, region, accountId, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, title, description
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "GuardDuty"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%GuardDuty%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000666 {\n  meta:\n    author = \"TDL\"\n    description = \"Ptrace Anti Debugging Activity - GuardDuty\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0005\"\n    technique = \"T1622\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n   \
    \ $e.eventName = /GuardDuty/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%GuardDuty%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/GuardDuty/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*GuardDuty*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "GuardDuty"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*GuardDuty*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*GuardDuty*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:

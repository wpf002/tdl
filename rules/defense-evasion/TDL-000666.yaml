rule_id: TDL-DE-000666
v4_id: '000666'
name: Ptrace Anti Debugging Activity - GuardDuty
description: This detection looks for a process running on the listed Amazon EC2 instance or a container within your AWS environment that has
  used the ptrace system call with the PTRACE_TRACEME option. This activity would cause an attached debugger to detach from the running process.
  If no debugger is attached, it has no effect. However, the activity in itself raises suspicion because this might indicate that malware is running
  on the system. Malware frequently uses anti-debugging techniques to evade analysis, and these techniques can be detected at runtime. GuardDuty
  examines related runtime activity and context so that it generates this finding only when the associated activity and context are potentially
  suspicious.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1622
technique_name: Debugger Evasion
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatch:guardduty type IN ("DefenseEvasion:Runtime/PtraceAntiDebugging")

    | table _time, id, type, severity, region, accountId, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title has "DefenseEvasion:Runtime/PtraceAntiDebugging"
    | project TimeGenerated, Title, Severity, AccountId, Region, ResourceType, Description, Id
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, sourceip, destinationip, username, "Event Type", "Event Name", "Resource Type", "Resource ID", COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "Event Type" = 'DefenseEvasion:Runtime/PtraceAntiDebugging'
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), sourceip, destinationip, username, "Event Type", "Event Name", "Resource Type", "Resource ID"
    LAST 1 HOURS
  yara_l: |
    rule aws_guardduty_ptrace_anti_debugging {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for ptrace anti-debugging attempts (T1622)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1622"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "DefenseEvasion:Runtime/PtraceAntiDebugging"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("DefenseEvasion:Runtime/PtraceAntiDebugging")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, event.type, event.action, message
  leql: |
    where(source_json.type IN ["DefenseEvasion:Runtime/PtraceAntiDebugging"])
  crowdstrike: |
    #type=guardduty eventType="DefenseEvasion:Runtime/PtraceAntiDebugging"
    | table([@timestamp, accountId, region, resource.instanceDetails.instanceId, service.action.actionType, severity, title, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log ~= "DefenseEvasion:Runtime/PtraceAntiDebugging"
    | fields _time, cloud_provider, vendor, event_type, raw_log, actor_user, resource_name, resource_type
  lucene: |
    event.type:"DefenseEvasion:Runtime/PtraceAntiDebugging"
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type = "DefenseEvasion:Runtime/PtraceAntiDebugging"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:Runtime/PtraceAntiDebugging\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

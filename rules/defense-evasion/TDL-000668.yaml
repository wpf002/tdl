rule_id: TDL-DE-000668
v4_id: 000668
name: Potential Credential Compromise - GuardDuty
description: This detection looks for a sequence of suspicious actions made by using AWS credentials that impacts one or more resources in your
  environment. Multiple suspicious and anomalous attack behaviors were observed by the same credentials, resulting in higher confidence that the
  credentials are being misused.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1586
technique_name: Compromise Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty eventType=\"AttackSequence:IAM/CompromisedCredentials\" \n| table _time, accountId,\
    \ region, eventType, severity, title, description, resource.accessKeyDetails.userName, resource.accessKeyDetails.userType, service.action.actionType\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("AttackSequence:IAM/CompromisedCredentials")
    | project TimeGenerated, Type, Title, Severity, AccountId, Region, ResourceType, Description
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, sourceip, destinationip, username, qidname(qid) AS event_name, \"Finding Type\"\
    \ AS finding_type\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%' \n  AND (\"Finding Type\" = 'AttackSequence:IAM/CompromisedCredentials'\
    \ OR qidname(qid) ILIKE '%AttackSequence:IAM/CompromisedCredentials%')\nLAST 24 HOURS\n"
  yara_l: "rule aws_guardduty_compromised_credentials {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS GuardDuty finding for\
    \ compromised credentials (T1586)\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"T1586\"\n    severity =\
    \ \"HIGH\"\n    \n  events:\n    $e.metadata.product_name = \"Amazon Web Services\"\n    $e.metadata.vendor_name = \"Amazon\"\n    $e.metadata.product_event_type\
    \ = \"AttackSequence:IAM/CompromisedCredentials\"\n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 1h\n    \n  outcome:\n\
    \    $risk_score = 85\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.guardduty*
    | WHERE @timestamp > NOW() - 24 hour AND event.type IN ("AttackSequence:IAM/CompromisedCredentials")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.id, event.severity, user.name, source.ip, aws.guardduty.finding.severity, aws.guardduty.finding.id
  leql: |
    where(source_json.type="AttackSequence:IAM/CompromisedCredentials")
  crowdstrike: |
    #type=guardduty event.type="AttackSequence:IAM/CompromisedCredentials"
    | table([@timestamp, ComputerName, event.type, account.id, region, resource.accessKeyDetails.userName, resource.accessKeyDetails.accessKeyId, service.additionalInfo, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and event_type in ("AttackSequence:IAM/CompromisedCredentials")
    | fields _time, cloud_provider, event_type, actor_user, resource_sub_type, raw_log
  lucene: |
    eventName:"AttackSequence:IAM/CompromisedCredentials" OR (source:"guardduty" AND eventType:"AttackSequence:IAM/CompromisedCredentials") OR finding.type:"AttackSequence:IAM/CompromisedCredentials"
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _sourceCategory=*AWS/GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type = "AttackSequence:IAM/CompromisedCredentials"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"AttackSequence:IAM/CompromisedCredentials\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

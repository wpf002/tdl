rule_id: TDL-DE-000669
v4_id: 000669
name: Potential S3 Data Compromised - GuardDuty
description: This detection looks for a sequence of suspicious actions indicative of data compromise in one or more Amazon Simple Storage Service
  (Amazon S3) buckets, by using potentially compromised AWS credentials. Multiple suspicious and anomalous attack behaviors (API requests) were
  observed, resulting in higher confidence of the credentials are being misused.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype=aws:cloudwatchlogs:guardduty \ntype=\"AttackSequence:S3/CompromisedData\"\n| table _time, accountId, region, type,\
    \ severity, resource.resourceType, resource.s3BucketDetails.name, service.eventFirstSeen, service.eventLastSeen, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where EventType in ("AttackSequence:S3/CompromisedData")
    | project TimeGenerated, EventType, AccountId, Region, Severity, Description, ResourceType, ResourceId, Title
  aql: "SELECT eventtime, sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), \"Event Type\", \"Resource Type\", \"Severity\"\
    \nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%' \n  AND \"Event Type\" = 'AttackSequence:S3/CompromisedData'\nLAST 24\
    \ HOURS\n"
  yara_l: |
    rule guardduty_compromised_data_attack_sequence {
      meta:
        author = "TDL"
        description = "Detects GuardDuty AttackSequence:S3/CompromisedData events indicating potential credential misuse"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon Web Services"
        $e.metadata.product_name = "GuardDuty"
        $e.metadata.product_event_type = "AttackSequence:S3/CompromisedData"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("AttackSequence:S3/CompromisedData")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.id, event.action, source.ip, user.name, event.severity, aws.guardduty.finding.type
  leql: |
    where(source_json.type="AttackSequence:S3/CompromisedData")
  crowdstrike: "#repo=guardduty event_platform=AWS \n| event_simpleName=\"AttackSequence:S3/CompromisedData\"\n| table([@timestamp, ComputerName,\
    \ UserName, event_simpleName, *])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logon.type = "GuardDuty"
    | filter action_evtlog_event_id in ("AttackSequence:S3/CompromisedData")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_id
  lucene: |
    eventType:"AttackSequence:S3/CompromisedData"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type = "AttackSequence:S3/CompromisedData"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"AttackSequence:S3/CompromisedData\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

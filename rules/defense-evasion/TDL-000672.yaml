rule_id: TDL-DE-000672
v4_id: '000672'
name: Mass User Typosquatting Domain Access
description: Detects a mass amount of  web traffic from unqiue users to a web domain that appears to be similar to a company's domain. Typosquatting
  can be used in targeted phishing attempts for credentials or to deploy malware. The list of domains is pulled by using DNS Twister
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1583
technique_name: Acquire Infrastructure
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=proxy \n| bin _time span=5m \n| stats dc(user) as unique_users, dc(src_ip) as unique_ips, count by _time, url_domain \n| where count\
    \ >= 50 AND (unique_users >= 2 OR unique_ips >= 2)\n| table _time, url_domain, unique_users, unique_ips, count\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(1h)
    | where DeviceVendor has "Proxy" or DeviceProduct has "Proxy" or DeviceEventClassID in ("OBSERVED", "proxy", "web")
    | where isnotempty(RequestURL)
    | extend URLDomain = tostring(parse_url(RequestURL).Host)
    | where isnotempty(URLDomain)
    | summarize UniqueUsers = dcount(SourceUserName), URLCount = count(), Users = make_set(SourceUserName), IPs = make_set(SourceIP) by URLDomain, bin(TimeGenerated, 5m)
    | where URLCount >= 50 and UniqueUsers >= 50
    | project TimeGenerated, URLDomain, URLCount, UniqueUsers, Users, IPs
  aql: |
    SELECT DOMAINNAME(destinationip) AS domain, UNIQUECOUNT(username) AS unique_users, UNIQUECOUNT(sourceip) AS unique_ips, COUNT(*) AS url_events
    FROM events
    WHERE categoryname(category) ILIKE '%proxy%'
    GROUP BY DOMAINNAME(destinationip)
    HAVING url_events >= 50 AND (unique_users >= 1 OR unique_ips >= 1)
    LAST 5 MINUTES
  yara_l: "rule defense_evasion_t1583_proxy_domain_scan {\n  meta:\n    author = \"TDL\"\n    description = \"Detects 50+ proxy URL events to\
    \ same domain from multiple unique users within 5 minutes - potential defense evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n \
    \   mitre_attack_technique = \"T1583\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.metadata.product_name\
    \ = /proxy/i\n    $e.target.url != \"\"\n    net.url_domain($e.target.url) = $domain\n    $e.principal.user.userid = $user\n    $user != \"\
    \"\n    \n  match:\n    $domain over 5m\n    \n  outcome:\n    $risk_score = 65\n    $unique_users = count_distinct($user)\n    $total_requests\
    \ = count($e.principal.user.userid)\n    \n  condition:\n    $e and #e >= 50 and $unique_users >= 2\n}\n"
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 5 minutes AND url.domain IS NOT NULL
    | STATS unique_users = COUNT_DISTINCT(user.name), unique_ips = COUNT_DISTINCT(source.ip), total_events = COUNT(*) BY url.domain, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE total_events >= 50 AND (unique_users >= 2 OR unique_ips >= 2)
    | KEEP time_window, url.domain, unique_users, unique_ips, total_events
  leql: |
    where(log_source_name="Forward Proxy") groupby(destination_domain) calculate(unique:source_user)
  crowdstrike: |
    #type=proxy OR event_simpleName=*Proxy* OR event_simpleName=*URL* OR event_simpleName=*HTTP*
    | groupBy([UrlDomain], function=[count(as=url_events), count(UserName, distinct=true, as=unique_users)])
    | url_events >= 50 AND unique_users >= 1
    | table([UrlDomain, url_events, unique_users])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter app_category = "web-browsing" or app_category = "proxy"
    | alter url_domain = coalesce(http_hostname, url_domain)
    | filter url_domain != null
    | bin _time span=5m
    | comp count_distinct(src_user) as unique_users, count() as total_events by _time, url_domain
    | filter unique_users >= 50 and total_events >= 50
    | fields _time, url_domain, unique_users, total_events
  lucene: |
    _exists_:url.domain AND _exists_:user.name
  sumo: |
    _sourceCategory=*Proxy* OR _sourceCategory=*proxy* OR _sourceCategory=*Web*
    | parse regex "(?<url_domain>[a-zA-Z0-9\-\.]+\.[a-zA-Z]{2,})" nodrop
    | parse regex "(?<username>[a-zA-Z0-9\.\-_]+@[a-zA-Z0-9\.\-]+|[a-zA-Z0-9\.\-_]{3,})" nodrop
    | where !isEmpty(url_domain)
    | timeslice 5m
    | count_distinct(username) as unique_users, count as url_events by _timeslice, url_domain
    | where url_events >= 50 and unique_users >= 50
    | fields _timeslice, url_domain, unique_users, url_events
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '50 URL Events

  With the same URL Domain

  With uniue Usernames/IPs

  Within 5 minutes


  ***Focus on using Usernames only if the log has the source user within it***'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000674
v4_id: '000674'
name: Defendnot TPM Alteration
description: Detects changes to TPM chips code. This chip handles all trusted process such as defender. This search looks for changes related
  to security being turned off.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Microsoft Windows
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Windows Defender/Operational" EventCode=15 EventData="*SECURITY_PRODUCT_STATE_OFF*"

    | table _time, ComputerName, User, EventData

    '
  kql: |
    Event
    | where TimeGenerated > ago(24h)
    | where EventID == 15
    | where RenderedDescription has "SECURITY_PRODUCT_STATE_OFF" or EventData has "SECURITY_PRODUCT_STATE_OFF"
    | project TimeGenerated, Computer, EventID, RenderedDescription, EventData, ParameterXml
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Image", "TargetObject"
    FROM events
    WHERE "EventID" = '15'
      AND ("TargetObject" ILIKE '%SECURITY_PRODUCT_STATE_OFF%' OR "Details" ILIKE '%SECURITY_PRODUCT_STATE_OFF%')
    LAST 24 HOURS
  yara_l: |
    rule windows_defender_disabled_via_wmi {
      meta:
        author = "Chronicle Detection Engineering"
        description = "Detects Windows Defender being disabled via WMI FileCreate event (Event ID 15) with SECURITY_PRODUCT_STATE_OFF"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.event_type = "FILE_CREATION"
        $e.metadata.product_event_type = "15"
        re.regex($e.metadata.description, `SECURITY_PRODUCT_STATE_OFF`) or
        re.regex($e.target.file.full_path, `SECURITY_PRODUCT_STATE_OFF`) or
        re.regex($e.principal.process.command_line, `SECURITY_PRODUCT_STATE_OFF`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, winlogbeat-*
    | WHERE winlog.event_id == "15" AND winlog.event_data.State LIKE "*SECURITY_PRODUCT_STATE_OFF*"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.State, winlog.event_data.TargetObject
  leql: |
    where(source_json.EventID=15 AND source_json.RawEventData ICONTAINS "SECURITY_PRODUCT_STATE_OFF")
  crowdstrike: |
    EventCode=15 event.data=*SECURITY_PRODUCT_STATE_OFF*
    | table([@timestamp, ComputerName, UserName, event.data])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 15 and action_evtlog_message contains "SECURITY_PRODUCT_STATE_OFF"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message, action_evtlog_event_data
  lucene: |
    event.code:15 AND *SECURITY_PRODUCT_STATE_OFF*
  sumo: |
    _sourceCategory=*Windows* "15" "SECURITY_PRODUCT_STATE_OFF"
    | json field=_raw "EventID" as event_id
    | where event_id = "15"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows event ID 15

  event data contains "SECURITY_PRODUCT_STATE_OFF"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

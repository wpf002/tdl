rule_id: TDL-DE-000675
v4_id: '000675'
name: Defendnot Scheduled Task
description: Detects the creation of a scheduled task associated with Defendnot activity.
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4698'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4698 (TaskContent="*defendnot*" OR TaskContent="*--from-autorun*" OR TaskContent="*defendnot-loader*"
    OR TaskContent="*defendnot.dll*") (Message="*defendnot*" OR Message="*autorun*" OR Message="*Loader*")

    | table _time, ComputerName, User, TaskContent, Message

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4698
    | where (TaskContent has_any ("defendnot", "--from-autorun", "defendnot-loader", "defendnot.dll"))
       and (RenderedDescription has_any ("defendnot", "autorun", "Loader") or Activity has_any ("defendnot", "autorun", "Loader"))
    | project TimeGenerated, Computer, Account, TaskContent, RenderedDescription, Activity, EventData
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsorceid) AS host, "TaskContent", "Message"
    FROM events
    WHERE "EventID" = '4698'
      AND ("TaskContent" ILIKE '%defendnot%' OR "TaskContent" ILIKE '%--from-autorun%' OR "TaskContent" ILIKE '%defendnot-loader%' OR "TaskContent" ILIKE '%defendnot.dll%')
      AND ("Message" ILIKE '%defendnot%' OR "Message" ILIKE '%autorun%' OR "Message" ILIKE '%Loader%')
    LAST 24 HOURS
  yara_l: |
    rule mitre_t1078_scheduled_task_defendnot {
      meta:
        author = "TDL"
        description = "Detects scheduled task creation with DefendNot-related indicators (T1078 Defense Evasion)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_event_type = "4698"
        $e.metadata.event_type = "SCHEDULED_TASK_CREATION"
        (
          re.regex($e.security_result.description, `(?i)defendnot`) or
          re.regex($e.security_result.description, `(?i)--from-autorun`) or
          re.regex($e.security_result.description, `(?i)defendnot-loader`) or
          re.regex($e.security_result.description, `(?i)defendnot\.dll`)
        )
        (
          re.regex($e.security_result.summary, `(?i)defendnot`) or
          re.regex($e.security_result.summary, `(?i)autorun`) or
          re.regex($e.security_result.summary, `(?i)Loader`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.code == \"4698\"\
    \n  AND (\n    TO_LOWER(winlog.event_data.TaskContent) LIKE \"*defendnot*\"\n    OR TO_LOWER(winlog.event_data.TaskContent) LIKE \"*--from-autorun*\"\
    \n    OR TO_LOWER(winlog.event_data.TaskContent) LIKE \"*defendnot-loader*\"\n    OR TO_LOWER(winlog.event_data.TaskContent) LIKE \"*defendnot.dll*\"\
    \n  )\n  AND (\n    TO_LOWER(message) LIKE \"*defendnot*\"\n    OR TO_LOWER(message) LIKE \"*autorun*\"\n    OR TO_LOWER(message) LIKE \"\
    *loader*\"\n  )\n| KEEP @timestamp, host.name, user.name, winlog.event_data.TaskName, winlog.event_data.TaskContent, message\n"
  leql: |
    where(source_json.EventID=4698 AND (source_json.TaskContent ICONTAINS "defendnot" OR source_json.TaskContent ICONTAINS "--from-autorun" OR source_json.TaskContent ICONTAINS "defendnot-loader" OR source_json.TaskContent ICONTAINS "defendnot.dll") AND (message ICONTAINS "defendnot" OR message ICONTAINS "autorun" OR message ICONTAINS "Loader"))
  crowdstrike: |
    EventCode=4698 (TaskContent=*defendnot* OR TaskContent=*--from-autorun* OR TaskContent=*defendnot-loader* OR TaskContent=*defendnot.dll*) (Message=*defendnot* OR Message=*autorun* OR Message=*Loader*)
    | table([@timestamp, ComputerName, TaskName, TaskContent, Message])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4698
    | filter (action_evtlog_message ~= "(?i)defendnot" or action_evtlog_message ~= "(?i)--from-autorun" or action_evtlog_message ~= "(?i)defendnot-loader" or action_evtlog_message ~= "(?i)defendnot\.dll")
    | filter (action_evtlog_message ~= "(?i)defendnot" or action_evtlog_message ~= "(?i)autorun" or action_evtlog_message ~= "(?i)Loader")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_message
  lucene: |
    event.code:4698 AND (TaskContent:(*defendnot* OR *--from-autorun* OR *defendnot-loader* OR *defendnot.dll*)) AND (message:(*defendnot* OR *autorun* OR *Loader*))
  sumo: |
    _sourceCategory=*Windows* "4698"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TaskContent" as task_content
    | json field=_raw "Message" as message
    | where event_id = "4698"
    | where (task_content matches "*defendnot*" OR task_content matches "*--from-autorun*" OR task_content matches "*defendnot-loader*" OR task_content matches "*defendnot.dll*")
    | where (message matches "*defendnot*" OR message matches "*autorun*" OR message matches "*Loader*")
    | fields _messageTime, _sourceHost, task_content, message
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- defense-evasion
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows event ID 4698

  TaskContent LIKE (defendnot OR --from-autorun OR defendnot-loader OR defendnot.dll)

  AND message LIKE (defendnot OR autorun OR Loader)'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

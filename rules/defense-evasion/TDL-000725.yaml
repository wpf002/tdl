rule_id: TDL-DE-000725
v4_id: '000725'
name: Process Acquired SeImpersonate-Style Privileged Token
description: Sysmon EID 1 or EDR token-grant event showing a non-service process acquiring SeAssignPrimaryTokenPrivilege or SeImpersonatePrivilege.
  Token-theft / Potato-style abuse. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1134 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1134
technique_name: Access Token Manipulation
platform:
- Windows
data_sources:
- Sysmon
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=wineventlog (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1) OR (sourcetype=edr action=token_grant OR action=privilege_grant)
    (PrivilegeList="*SeAssignPrimaryTokenPrivilege*" OR PrivilegeList="*SeImpersonatePrivilege*" OR privilege_name="SeAssignPrimaryTokenPrivilege" OR privilege_name="SeImpersonatePrivilege")
    NOT (Image="*\\services.exe" OR Image="*\\svchost.exe" OR Image="*\\dllhost.exe" OR Image="*\\wmiprvse.exe" OR process_name="services.exe" OR process_name="svchost.exe" OR process_name="dllhost.exe" OR process_name="wmiprvse.exe")
    | eval process=coalesce(Image, process_name)
    | table _time, ComputerName, host, process, User, user, CommandLine, command_line, PrivilegeList, privilege_name, ParentImage, parent_process
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000725 {\n  meta:\n    author = \"TDL\"\n    description = \"Process Acquired SeImpersonate-Style Privileged Token\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0005\"\n    technique = \"T1134\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Sysmon EID 1 or EDR token-grant event showing a non-service process acquiring SeAssignPrimaryTokenPrivilege or SeImpersonatePrivilege.
  Token-theft / Potato-style abuse.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- token
- impersonation
- seimpersonate
- t1134
- defense-evasion
references:
- https://attack.mitre.org/techniques/T1134/

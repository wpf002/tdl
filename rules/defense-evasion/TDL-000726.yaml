rule_id: TDL-DE-000726
v4_id: '000726'
name: BITS Used to Download Executable from Unusual Host
description: bitsadmin or BITS-via-PowerShell downloads .exe / .dll / .bin from a host outside your software-delivery allowlist. Living-off-the-land
  transfer. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1197 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1197
technique_name: BITS Jobs
platform:
- Windows
data_sources:
- Sysmon
- Windows Event Log
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=wineventlog (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\bitsadmin.exe" OR (Image="*\\powershell.exe" (CommandLine="*Start-BitsTransfer*" OR CommandLine="*Add-BitsFile*")))) OR (sourcetype=WinEventLog:Security EventCode=4688 (New_Process_Name="*\\bitsadmin.exe" OR (New_Process_Name="*\\powershell.exe" (Process_Command_Line="*Start-BitsTransfer*" OR Process_Command_Line="*Add-BitsFile*"))))
    (CommandLine="*.exe*" OR CommandLine="*.dll*" OR CommandLine="*.bin*" OR Process_Command_Line="*.exe*" OR Process_Command_Line="*.dll*" OR Process_Command_Line="*.bin*")
    NOT (CommandLine="*microsoft.com*" OR CommandLine="*windowsupdate.com*" OR CommandLine="*download.windowsupdate.com*" OR Process_Command_Line="*microsoft.com*" OR Process_Command_Line="*windowsupdate.com*" OR Process_Command_Line="*download.windowsupdate.com*")
    | eval command_line=coalesce(CommandLine, Process_Command_Line)
    | eval process_name=coalesce(Image, New_Process_Name)
    | rex field=command_line "(?i)https?://(?<download_host>[^/:\s]+)"
    | where isnotnull(download_host)
    | table _time, ComputerName, User, process_name, command_line, download_host
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000726 {\n  meta:\n    author = \"TDL\"\n    description = \"BITS Used to Download Executable from Unusual Host\"\n\
    \    severity = \"MEDIUM\"\n    tactic = \"TA0005\"\n    technique = \"T1197\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\
    \n    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: bitsadmin or BITS-via-PowerShell downloads .exe / .dll / .bin from a host outside your software-delivery allowlist. Living-off-the-land
  transfer.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-DE-000728
v4_id: 000728
name: 'Raw Volume Open via \\\\.\\C: Handle'
description: 'Process opens \\.\C: or \\.\PhysicalDrive0 with FILE_READ_DATA — bypasses NTFS ACLs to read NTDS.dit, registry hives, locked files.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1006 under Defense Evasion).'
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1006
technique_name: Direct Volume Access
platform:
- Windows
data_sources:
- Sysmon
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=10 \n(TargetImage=\"\\\\\\\\?\\\\C:\" OR TargetImage=\"\
    \\\\\\\\?\\\\PhysicalDrive0\" OR TargetImage=\"\\\\\\\\.\\\\C:\" OR TargetImage=\"\\\\\\\\.\\\\PhysicalDrive0\")\nGrantedAccess IN (\"0x80\"\
    , \"0x100\", \"0x180\", \"0x1F0FFF\", \"0x1FFFFF\") \n| rex field=SourceImage \"(?<process_name>[^\\\\\\\\]+)$\"\n| search NOT (process_name\
    \ IN (\"System\", \"vmmem\", \"vmwp.exe\", \"MsMpEng.exe\", \"SgrmBroker.exe\", \"svchost.exe\"))\n| stats count values(TargetImage) as target_device\
    \ values(GrantedAccess) as granted_access values(SourceImage) as source_image by ComputerName, SourceUser, process_name\n| table _time, ComputerName,\
    \ SourceUser, process_name, source_image, target_device, granted_access, count\n"
  kql: 'DeviceRegistryEvents

    | where TimeGenerated > ago(1d)

    | where registry_key matches regex ".+"

    | summarize Count=count() by DeviceName, InitiatingProcessFileName, RegistryKey, RegistryValueName, RegistryValueData

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Registry Key\", \"Registry Value Name\", \"Registry Value Data\", \"Process Name\"\nFROM events\nWHERE\
    \ LOGSOURCETYPENAME(devicetype) = 'Microsoft Windows Sysmon'\n  AND \"EventID\" IN ('12','13','14')\n  AND \"registry_key\" LIKE '%.+%'\n\
    LAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000728 {\n  meta:\n    author = \"TDL\"\n    description = \"Raw Volume Open via \\\\\\\\.\\\\C: Handle\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0005\"\n    technique = \"T1006\"\n  events:\n    $e.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    $e.registry_key\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "registry" AND registry_key LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, registry.path, registry.value, process.name

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND log_type = "registry" AND registry_key=/.+/)

    groupby(asset, registry_key, registry_value)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (RegSystemConfigValueUpdate, RegGenericValueUpdate) AND registry_key=*.+*

    | stats count as changes by ComputerName, UserName, RegObjectName, RegStringValue

    | sort -changes

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.REGISTRY AND registry_key ~= ".+"

    | comp count() as changes by agent_hostname, actor_effective_username, action_registry_key_name, action_registry_value_name

    | sort desc changes

    '
  lucene: 'event.category:"registry" AND registry_key:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id IN ("12","13","14") AND registry_key matches "*.+*"

    | count by host, user, registry_key, registry_value, image

    | sort by _count desc

    '
pseudo_logic: 'Process opens \\.\C: or \\.\PhysicalDrive0 with FILE_READ_DATA — bypasses NTFS ACLs to read NTDS.dit, registry hives, locked files.'

rule_id: TDL-DE-000728
v4_id: 000728
name: 'Raw Volume Open via \\\\.\\C: Handle'
description: 'Process opens \\.\C: or \\.\PhysicalDrive0 with FILE_READ_DATA — bypasses NTFS ACLs to read NTDS.dit, registry hives, locked files.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1006 under Defense Evasion).'
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1006
technique_name: Direct Volume Access
platform:
- Windows
data_sources:
- Sysmon
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=10 \n(TargetImage=\"\\\\\\\\?\\\\C:\" OR TargetImage=\"\
    \\\\\\\\?\\\\PhysicalDrive0\" OR TargetImage=\"\\\\\\\\.\\\\C:\" OR TargetImage=\"\\\\\\\\.\\\\PhysicalDrive0\")\nGrantedAccess IN (\"0x80\"\
    , \"0x100\", \"0x180\", \"0x1F0FFF\", \"0x1FFFFF\") \n| rex field=SourceImage \"(?<process_name>[^\\\\\\\\]+)$\"\n| search NOT (process_name\
    \ IN (\"System\", \"vmmem\", \"vmwp.exe\", \"MsMpEng.exe\", \"SgrmBroker.exe\", \"svchost.exe\"))\n| stats count values(TargetImage) as target_device\
    \ values(GrantedAccess) as granted_access values(SourceImage) as source_image by ComputerName, SourceUser, process_name\n| table _time, ComputerName,\
    \ SourceUser, process_name, source_image, target_device, granted_access, count\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 10
    | where TargetObject has_any (@"\\.\C:", @"\\.\PhysicalDrive0")
    | where GrantedAccess has "0x1"
    | where SourceImage !has_any ("System", "smss.exe", "csrss.exe", "wininit.exe", "services.exe", "lsass.exe", "svchost.exe", "MsMpEng.exe", "SgrmBroker.exe", "TrustedInstaller.exe")
    | project TimeGenerated, Computer, SourceImage, TargetObject, GrantedAccess, SourceProcessId, SourceUser
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Image", "TargetFilename", "GrantedAccess", COUNT(*) AS access_count
    FROM events
    WHERE ("EventID" = '12' OR "EventID" = '13' OR "EventID" = '15')
      AND ("TargetFilename" ILIKE '%\\\\.\\C:%' OR "TargetFilename" ILIKE '%\\\\.\\PhysicalDrive0%')
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), username, "Process Name", "Image", "TargetFilename", "GrantedAccess"
    LAST 1 HOURS
  yara_l: |
    rule raw_disk_access_defense_evasion {
      meta:
        author = "TDL"
        description = "Detects direct raw disk access bypassing NTFS ACLs (T1006 Defense Evasion)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1006"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_OPEN"
        (
          re.regex($e.target.file.full_path, `(?i)^\\\\\.\\\C:$`) or
          re.regex($e.target.file.full_path, `(?i)^\\\\\.\\\PhysicalDrive\d+$`)
        )
        $e.principal.process.file.full_path = $process
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 85
        $process_name = $process
        $target_path = $e.target.file.full_path

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.file*
    | WHERE winlog.event_id == 9 OR (event.category == "file" AND event.action == "open")
    | WHERE (file.path LIKE "*\\\\.\\C:*" OR file.path LIKE "*\\\\.\\PhysicalDrive*")
      AND (winlog.event_data.GrantedAccess RLIKE ".*READ_DATA.*" OR file.access == "read")
    | STATS access_count = COUNT(*) BY process.name, process.executable, process.command_line, host.name, user.name, file.path
    | WHERE access_count >= 1
    | KEEP @timestamp, host.name, user.name, process.name, process.executable, process.command_line, file.path, access_count
  leql: |
    where(source_json.EventID=10 AND (source_json.TargetImage ICONTAINS "\\.\C:" OR source_json.TargetImage ICONTAINS "\\.\PhysicalDrive")) groupby(source_json.SourceImage, asset, source_json.TargetImage) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (CommandLine=*"\\\\.\\C:"* OR CommandLine=*"\\\\.\\PhysicalDrive0"*)
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE_EVENT
      and (action_file_path ~= "(?i)\\\\\\\\\.\\\\[Cc]:" or action_file_path ~= "(?i)\\\\\\\\\.\\\\PhysicalDrive[0-9]+")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, actor_process_image_command_line, action_file_path, action_file_name
  lucene: |
    event.id:11 AND file.path:(\\.\C\: OR \\.\PhysicalDrive* OR \\\\.\\C\: OR \\\\.\\PhysicalDrive*)
  sumo: "_sourceCategory=*Sysmon* \"10\"\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"SourceImage\" as source_image\n| json\
    \ field=_raw \"TargetImage\" as target_image\n| json field=_raw \"GrantedAccess\" as granted_access\n| where event_id = \"10\" \n  and (target_image\
    \ matches \"*\\\\\\\\.\\\\C:*\" or target_image matches \"*\\\\\\\\.\\\\PhysicalDrive0*\")\n  and granted_access matches \"*0x1*\"\n| fields\
    \ _messageTime, _sourceHost, source_image, target_image, granted_access\n"
pseudo_logic: 'Process opens \\.\C: or \\.\PhysicalDrive0 with FILE_READ_DATA — bypasses NTFS ACLs to read NTDS.dit, registry hives, locked files.'
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- volume

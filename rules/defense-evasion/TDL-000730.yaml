rule_id: TDL-DE-000730
v4_id: '000730'
name: Suspicious Crash in Security Product Process
description: AV/EDR process crash (MsMpEng.exe, sentinel*.exe, Csagent.exe) followed within 5m by new process creation that the dead product would
  normally block. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1211 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1211
technique_name: Exploitation for Defense Evasion
platform:
- Windows
- Linux
data_sources:
- EDR
- Sysmon
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=WinEventLog:Application OR sourcetype=linux_secure OR sourcetype=XmlWinEventLog:Application OR sourcetype=sysmon)\
    \ \n(\n    (EventCode=1000 OR EventCode=1001 OR \"application error\" OR \"segmentation fault\" OR \"core dumped\")\n    (Image=\"*\\\\MsMpEng.exe\"\
    \ OR Image=\"*\\\\sentinel*.exe\" OR Image=\"*\\\\Csagent.exe\" OR process_name=\"MsMpEng.exe\" OR process_name=\"sentinel*\" OR process_name=\"\
    Csagent.exe\" OR AppName=\"*MsMpEng.exe*\" OR AppName=\"*sentinel*.exe*\" OR AppName=\"*Csagent.exe*\")\n)\nOR\n(\n    (EventCode=1 OR EventCode=4688)\n\
    )\n| eval crash_event=if(match(EventCode, \"1000|1001\") OR match(_raw, \"(?i)(application error|segmentation fault|core dumped)\"), 1, 0)\n\
    | eval proc_event=if(match(EventCode, \"^(1|4688)$\"), 1, 0)\n| eval av_product=coalesce(Image, process_name, AppName)\n| where crash_event=1\
    \ OR proc_event=1\n| bin _time span=5m\n| stats earliest(_time) as crash_time, latest(_time) as proc_time, values(eval(if(crash_event=1, av_product,\
    \ null()))) as crashed_av, values(eval(if(proc_event=1, Image, null()))) as new_process, values(eval(if(proc_event=1, CommandLine, null())))\
    \ as new_cmdline, dc(eval(if(crash_event=1, _time, null()))) as crash_count, dc(eval(if(proc_event=1, _time, null()))) as proc_count by _time,\
    \ ComputerName, host\n| where crash_count > 0 AND proc_count > 0\n| eval time_diff=proc_time - crash_time\n| where time_diff >= 0 AND time_diff\
    \ <= 300\n| table _time, ComputerName, host, crashed_av, new_process, new_cmdline, crash_time, proc_time, time_diff\n"
  kql: "let AVProcesses = dynamic([\"MsMpEng.exe\", \"SentinelAgent.exe\", \"SentinelAgentWorker.exe\", \"SentinelHelperService.exe\", \"SentinelStaticEngine.exe\"\
    , \"Csagent.exe\"]);\nlet SuspiciousProcesses = dynamic([\"powershell.exe\", \"cmd.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\"\
    , \"regsvr32.exe\", \"rundll32.exe\", \"installutil.exe\", \"regasm.exe\", \"regsvcs.exe\", \"msbuild.exe\", \"certutil.exe\", \"bitsadmin.exe\"\
    ]);\nlet AVCrashes = \n    DeviceProcessEvents\n    | where TimeGenerated > ago(1h)\n    | where FileName has_any (AVProcesses)\n    | where\
    \ ActionType == \"ProcessTerminated\" or ProcessCommandLine has_any (\"crash\", \"exception\", \"terminate\")\n    | project CrashTime = TimeGenerated,\
    \ DeviceId, DeviceName, CrashedProcess = FileName, CrashEvent = ActionType;\nlet SuspiciousActivity = \n    DeviceProcessEvents\n    | where\
    \ TimeGenerated > ago(1h)\n    | where FileName has_any (SuspiciousProcesses)\n    | where ProcessCommandLine has_any (\"-enc\", \"-e \",\
    \ \"DownloadString\", \"IEX\", \"Invoke-Expression\", \"bypass\", \"hidden\", \"noprofile\", \"/c \", \"javascript:\", \"vbscript:\", \".hta\"\
    , \"DllRegisterServer\", \"wscript.shell\", \"downloadfile\", \"bitstransfer\")\n    | project ActivityTime = TimeGenerated, DeviceId, DeviceName,\
    \ AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine;\nAVCrashes\n| join kind=inner (SuspiciousActivity)\
    \ on DeviceId\n| where ActivityTime between (CrashTime .. (CrashTime + 5m))\n| project CrashTime, ActivityTime, DeviceName, CrashedProcess,\
    \ AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName\n"
  aql: |
    SELECT AVCrash.eventtime AS crash_time, AVCrash."Process Name" AS crashed_process, AVCrash.sourceip AS crash_host, NewProc.eventtime AS new_process_time, NewProc."Process Name" AS new_process, NewProc."Process CommandLine" AS cmdline, NewProc.sourceip AS new_proc_host
    FROM events AVCrash, events NewProc
    WHERE AVCrash."EventID" IN ('1000', '1001', '1002', '7031', '7034')
      AND (AVCrash."Process Name" ILIKE '%MsMpEng.exe%' OR AVCrash."Process Name" ILIKE '%sentinel%' OR AVCrash."Process Name" ILIKE '%Csagent.exe%' OR AVCrash."Application Name" ILIKE '%MsMpEng.exe%' OR AVCrash."Application Name" ILIKE '%sentinel%' OR AVCrash."Application Name" ILIKE '%Csagent.exe%')
      AND NewProc."EventID" = '1'
      AND (NewProc."Process Name" ILIKE '%mimikatz%' OR NewProc."Process Name" ILIKE '%psexec%' OR NewProc."Process Name" ILIKE '%cobalt%' OR NewProc."Process CommandLine" ILIKE '%Invoke-Mimikatz%' OR NewProc."Process CommandLine" ILIKE '%IEX%' OR NewProc."Process CommandLine" ILIKE '%-enc%')
      AND AVCrash.sourceip = NewProc.sourceip
      AND NewProc.eventtime > AVCrash.eventtime
      AND NewProc.eventtime <= (AVCrash.eventtime + 300000)
    LAST 1 HOURS
  yara_l: |
    rule av_edr_crash_followed_by_suspicious_process {
      meta:
        author = "TDL"
        description = "Detects AV/EDR process crash followed by suspicious process creation within 5 minutes"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1211"
        severity = "HIGH"

      events:
        $crash.metadata.event_type = "PROCESS_TERMINATION"
        (
          re.regex($crash.target.process.file.full_path, `(?i)MsMpEng\.exe$`) or
          re.regex($crash.target.process.file.full_path, `(?i)sentinel.*\.exe$`) or
          re.regex($crash.target.process.file.full_path, `(?i)Csagent\.exe$`)
        )
        $crash.principal.hostname = $host

        $proc.metadata.event_type = "PROCESS_LAUNCH"
        $proc.principal.hostname = $host
        $proc.metadata.event_timestamp.seconds > $crash.metadata.event_timestamp.seconds

      match:
        $host over 5m

      outcome:
        $risk_score = 75
        $crashed_process = $crash.target.process.file.full_path
        $new_process = $proc.target.process.file.full_path
        $command_line = $proc.target.process.command_line

      condition:
        $crash and $proc
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*
    | WHERE @timestamp > NOW() - 10 minute
    | EVAL av_process = TO_LOWER(process.name)
    | EVAL is_crash = CASE(
        event.action == "end" AND av_process IN ("msmpeng.exe", "mssense.exe", "csagent.exe") AND process.exit_code != 0, 1,
        winlog.event_id == 1000 AND av_process IN ("msmpeng.exe", "mssense.exe", "csagent.exe"), 1,
        av_process LIKE "sentinel*.exe" AND event.action == "end" AND process.exit_code != 0, 1,
        av_process LIKE "sentinel*.exe" AND winlog.event_id == 1000, 1,
        0
      )
    | EVAL is_suspicious_create = CASE(
        event.action == "start" AND process.command_line LIKE "*powershell*" AND (process.command_line LIKE "*-enc*" OR process.command_line LIKE "*DownloadString*" OR process.command_line LIKE "*IEX*"), 1,
        event.action == "start" AND process.name LIKE "*.exe" AND process.parent.name IN ("cmd.exe", "wscript.exe", "cscript.exe") AND process.command_line LIKE "*http*", 1,
        winlog.event_id == 1 AND process.command_line LIKE "*powershell*" AND (process.command_line LIKE "*-enc*" OR process.command_line LIKE "*DownloadString*" OR process.command_line LIKE "*IEX*"), 1,
        winlog.event_id == 1 AND process.parent.name IN ("cmd.exe", "wscript.exe", "cscript.exe") AND process.command_line LIKE "*http*", 1,
        0
      )
    | STATS crash_time = MIN(@timestamp) BY host.name, is_crash
    | WHERE is_crash == 1
    | ENRICH crash_times WITH crash_time
    | EVAL time_diff = @timestamp - crash_time
    | WHERE is_suspicious_create == 1 AND time_diff > 0 AND time_diff <= 300000000000
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name
  leql: |
    where((process_name ICONTAINS "MsMpEng.exe" OR process_name ICONTAINS "sentinel" OR process_name ICONTAINS "Csagent.exe") AND (source_json.EventID=1000 OR source_json.EventID=1001 OR source_json.State="crashed" OR source_json.State="terminated")) groupby(asset, process_name) calculate(count)
  crowdstrike: |
    event_simpleName=EndOfProcess (FileName=MsMpEng.exe OR FileName=sentinel*.exe OR FileName=Csagent.exe)
    | ExitCode!=0
    | rename(field=ComputerName, as=CrashedHost)
    | rename(field=FileName, as=CrashedAV)
    | rename(field=@timestamp, as=CrashTime)
    | join({
        event_simpleName=ProcessRollup2
        | rename(field=ComputerName, as=SpawnHost)
        | rename(field=FileName, as=NewProcess)
        | rename(field=@timestamp, as=SpawnTime)
      }, field=[CrashedHost=SpawnHost], key=CrashedHost, include=[NewProcess, SpawnTime])
    | SpawnTime >= CrashTime
    | timeDiff=SpawnTime - CrashTime
    | timeDiff <= 300000
    | table([@timestamp, CrashedHost, CrashedAV, ExitCode, NewProcess, SpawnTime, timeDiff])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | alter is_security_crash = if(event_sub_type = ENUM.EVENT_SUB_TYPE_PROCESS_TERMINATE and (lowercase(action_process_image_name) contains "msmpeng.exe" or lowercase(action_process_image_name) ~= "sentinel.*\.exe" or lowercase(action_process_image_name) contains "csagent.exe"), 1, 0)
    | alter is_new_process = if(event_sub_type = ENUM.EVENT_SUB_TYPE_PROCESS_START, 1, 0)
    | fields _time, agent_hostname, is_security_crash, is_new_process, action_process_image_name, actor_process_image_name, action_process_image_command_line
    | sort agent_hostname, _time asc
    | alter crash_time = if(is_security_crash = 1, _time, null)
    | comp values(crash_time) as crash_times, sum(is_security_crash) as crashes, sum(is_new_process) as new_procs by agent_hostname
    | filter crashes > 0 and new_procs > 0
    | arrayexpand crash_times
    | join type=inner (dataset = xdr_data | filter event_type = ENUM.EVENT_TYPE_PROCESS and event_sub_type = ENUM.EVENT_SUB_TYPE_PROCESS_START | fields _time as proc_time, agent_hostname, action_process_image_name, action_process_image_command_line, actor_effective_username) as processes (agent_hostname = agent_hostname)
    | filter proc_time > crash_times and proc_time <= arraysum(crash_times, 300000)
    | fields crash_times, proc_time, agent_hostname, action_process_image_name, action_process_image_command_line, actor_effective_username
  lucene: |
    (process.name:(MsMpEng.exe OR sentinel*.exe OR Csagent.exe) AND event.action:(crash OR terminated OR process_exit)) OR (event.category:process AND event.type:start AND NOT process.name:(MsMpEng.exe OR sentinel*.exe OR Csagent.exe OR svchost.exe OR explorer.exe OR chrome.exe OR firefox.exe OR teams.exe OR outlook.exe))
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Sysmon* OR _sourceCategory=*EDR*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as image
    | json field=_raw "TargetImage" as target_image
    | json field=_raw "NewProcessName" as new_process
    | json field=_raw "Computer" as host
    | json field=_raw "UtcTime" as event_time
    | where (event_id = "1" OR event_id = "4688") OR (event_id = "10" AND (target_image matches "*MsMpEng.exe" OR target_image matches "*sentinel*.exe" OR target_image matches "*Csagent.exe"))
    | parse regex field=image "(?i)(?<crash_process>MsMpEng\.exe|sentinel.*\.exe|Csagent\.exe)" nodrop
    | parse regex field=target_image "(?i)(?<crash_target>MsMpEng\.exe|sentinel.*\.exe|Csagent\.exe)" nodrop
    | parse regex field=new_process "(?i)(?<created_process>.*)" nodrop
    | if(isNull(crash_process) AND isNull(crash_target), "process_creation", "av_crash") as event_type
    | where event_type = "av_crash" OR event_type = "process_creation"
    | sort by host, _messageTime
    | timeslice 5m
    | first(_messageTime) as first_crash by _timeslice, host, event_type
    | where event_type = "av_crash"
    | join (
        _sourceCategory=*Windows* OR _sourceCategory=*Sysmon*
        | json field=_raw "EventID" as event_id
        | json field=_raw "NewProcessName" as new_process
        | json field=_raw "Image" as image
        | json field=_raw "Computer" as host
        | where event_id = "1" OR event_id = "4688"
        | timeslice 5m
        | fields _messageTime, _timeslice, host, new_process, image
    ) as process_creation on _timeslice=process_creation._timeslice AND host=process_creation.host
    | where process_creation._messageTime > first_crash AND (process_creation._messageTime - first_crash) <= 300000
    | fields _messageTime, host, first_crash, process_creation._messageTime, process_creation.new_process, process_creation.image
pseudo_logic: AV/EDR process crash (MsMpEng.exe, sentinel*.exe, Csagent.exe) followed within 5m by new process creation that the dead product
  would normally block.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

rule_id: TDL-DE-000731
v4_id: '000731'
name: DLL Search Order Hijack via Phantom DLL in PATH Directory
description: Process loads a DLL from a writable PATH directory before the system32 copy. Phantom-DLL hijack. Generated from gap analysis against
  canonical ATT&CK Enterprise matrix (T1574 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1574
technique_name: Hijack Execution Flow
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=* sourcetype IN ("WinEventLog:Microsoft-Windows-Sysmon/Operational", "edr:*", "linux:*", "macos:*") (EventCode=7 OR event_type="image_load"
    OR event_type="module_load")

    | rex field=ImageLoaded "(?<loaded_dll_path>.*\\(?<dll_name>[^\\]+\.dll))"

    | rex field=ImageLoaded "(?i)(?<writable_path>C:\\Users\\[^\\]+\\AppData\\|C:\\ProgramData\\|C:\\Windows\\Temp\\|/tmp/|/var/tmp/|/home/[^/]+/)"

    | where isnotnull(writable_path)

    | eval system_dll_exists=if(match(ImageLoaded, "(?i)C:\\Windows\\System32\\") OR match(ImageLoaded, "(?i)C:\\Windows\\SysWOW64\\"), 0, 1)

    | where system_dll_exists=1

    | lookup system_dlls.csv dll_name OUTPUT is_system_dll

    | where is_system_dll="true"

    | stats count values(ImageLoaded) as loaded_paths values(Image) as loading_process by ComputerName, dll_name, User

    | where count > 0

    | table ComputerName, User, dll_name, loading_process, loaded_paths

    '
  kql: |
    DeviceImageLoadEvents
    | where TimeGenerated > ago(1h)
    | where FolderPath has_any ("\\AppData\\", "\\ProgramData\\", "\\Temp\\", "\\Users\\Public\\")
    | where FolderPath !has "\\system32\\" and FolderPath !has "\\SysWOW64\\"
    | join kind=inner (
        DeviceImageLoadEvents
        | where TimeGenerated > ago(1h)
        | where FolderPath has_any ("\\system32\\", "\\SysWOW64\\")
        | extend SystemDLL = FileName
        | project DeviceId, InitiatingProcessId, SystemDLL, SystemLoadTime = TimeGenerated
    ) on DeviceId, InitiatingProcessId, $left.FileName == $right.SystemDLL
    | where TimeGenerated < SystemLoadTime
    | project TimeGenerated, DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, FolderPath, InitiatingProcessAccountName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, "Process Name", "ImageLoaded", "Image", username, COUNT(*) AS load_count
    FROM events
    WHERE "EventID" IN ('7', '3033')
      AND ("ImageLoaded" ILIKE '%\temp\%' OR "ImageLoaded" ILIKE '%\users\%' OR "ImageLoaded" ILIKE '%\programdata\%' OR "ImageLoaded" ILIKE '%\appdata\%' OR "ImageLoaded" ILIKE '%/tmp/%' OR "ImageLoaded" ILIKE '%/var/tmp/%')
      AND ("ImageLoaded" ILIKE '%.dll' OR "ImageLoaded" ILIKE '%.so' OR "ImageLoaded" ILIKE '%.dylib')
      AND "ImageLoaded" NOT ILIKE '%\system32\%'
      AND "ImageLoaded" NOT ILIKE '%\syswow64\%'
      AND "ImageLoaded" NOT ILIKE '%\winsxs\%'
      AND "Process Name" NOT ILIKE '%\temp\%'
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), "Process Name", "ImageLoaded", "Image", username
    LAST 1 HOURS
  yara_l: |
    rule phantom_dll_hijack {
      meta:
        author = "TDL"
        description = "Detects DLL loading from writable PATH directories before system32 - phantom DLL hijack"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1574"
        severity = "High"

      events:
        $load.metadata.event_type = "FILE_OPEN"
        $load.target.file.full_path = $dll_path
        (
          re.regex($load.target.file.full_path, `(?i)C:\\Users\\[^\\]+\\AppData\\Local\\`) or
          re.regex($load.target.file.full_path, `(?i)C:\\Users\\[^\\]+\\AppData\\Roaming\\`) or
          re.regex($load.target.file.full_path, `(?i)C:\\ProgramData\\`) or
          re.regex($load.target.file.full_path, `(?i)C:\\Temp\\`) or
          re.regex($load.target.file.full_path, `(?i)C:\\Windows\\Temp\\`) or
          re.regex($load.target.file.full_path, `(?i)/tmp/`) or
          re.regex($load.target.file.full_path, `(?i)/var/tmp/`) or
          re.regex($load.target.file.full_path, `(?i)/usr/local/`)
        )
        re.regex($load.target.file.full_path, `(?i)\.(dll|so|dylib)$`)
        not re.regex($load.target.file.full_path, `(?i)C:\\Windows\\System32\\`)
        not re.regex($load.target.file.full_path, `(?i)C:\\Windows\\SysWOW64\\`)
        $load.principal.process.file.full_path = $process
        $load.principal.hostname = $host

      match:
        $host, $process over 5m

      condition:
        $load
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.library*
    | WHERE event.code == "7" OR event.category == "library"
    | WHERE dll.path RLIKE "(?i).*(\\\\appdata\\\\|\\\\programdata\\\\|\\\\temp\\\\|\\\\users\\\\public\\\\).*\\.dll"
      AND NOT dll.path RLIKE "(?i).*\\\\system32\\\\.*"
      AND NOT dll.path RLIKE "(?i).*\\\\syswow64\\\\.*"
    | EVAL dll_name = TO_LOWER(CASE(
        dll.name IS NOT NULL, dll.name,
        ENDS_WITH(dll.path, ".dll"), SUBSTRING(dll.path, LAST_INDEX_OF(dll.path, "\\") + 1, LENGTH(dll.path))
      ))
    | WHERE dll_name IN ("version.dll", "cryptsp.dll", "cryptbase.dll", "wtsapi32.dll", "samlib.dll", "wlanapi.dll", "dwmapi.dll", "dnsapi.dll", "iphlpapi.dll", "uxtheme.dll", "profapi.dll", "propsys.dll", "setupapi.dll", "winnsi.dll", "winhttp.dll", "wininet.dll", "msasn1.dll", "mpr.dll", "bcrypt.dll", "ncrypt.dll", "netapi32.dll", "userenv.dll", "wldap32.dll")
    | STATS load_count = COUNT(*) BY host.name, process.name, process.executable, dll_name, dll.path, user.name
    | WHERE load_count >= 1
    | KEEP @timestamp, host.name, user.name, process.name, process.executable, dll_name, dll.path, load_count
  leql: |
    where(source_json.EventID=7 AND source_json.ImageLoaded ICONTAINS "\appdata\" OR source_json.ImageLoaded ICONTAINS "\programdata\" OR source_json.ImageLoaded ICONTAINS "\temp\" OR source_json.ImageLoaded ICONTAINS "\users\public\") groupby(source_json.Image, source_json.ImageLoaded, asset) calculate(count)
  crowdstrike: |
    event_simpleName=ImageLoad
    | case {
        event_platform=Win | ImageLoaded=/\\(temp|users|appdata|programdata)\\.*\.dll/i ;
        event_platform=Lin | ImageLoaded=~regex("/(tmp|home|var/tmp)/.*\\.so", ignoreCase=true) ;
        event_platform=Mac | ImageLoaded=~regex("/(tmp|Users|private/tmp)/.*\\.dylib", ignoreCase=true) ;
        * | ImageLoaded=* ;
      }
    | ImageLoaded!=/\\(windows\\system32|windows\\syswow64|program files)/i
    | groupBy([ComputerName, FileName, ImageLoaded], function=count(as=load_count))
    | load_count >= 1
    | table([@timestamp, ComputerName, event_platform, FileName, ImageLoaded, load_count])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_LOAD_IMAGE
    | filter action_module_path != null
    | filter lowercase(action_module_path) ~= "^[a-z]:\\\\(?:windows\\\\temp|users\\\\[^\\\\]+\\\\appdata\\\\local\\\\temp|programdata|temp|perflogs|windows\\\\tasks|windows\\\\tracing|windows\\\\registration\\\\crmlog|windows\\\\system32\\\\com\\\\dmp|windows\\\\system32\\\\fxstmp|windows\\\\system32\\\\microsoft\\\\crypto\\\\rsa\\\\machinekeys|windows\\\\system32\\\\spool\\\\drivers\\\\color|windows\\\\system32\\\\spool\\\\printers|windows\\\\system32\\\\spool\\\\servers|windows\\\\system32\\\\tasks|windows\\\\syswow64\\\\com\\\\dmp|windows\\\\syswow64\\\\fxstmp|windows\\\\syswow64\\\\tasks)"
    | filter action_module_path !~= "(?i)\\\\windows\\\\system32\\\\" and action_module_path !~= "(?i)\\\\windows\\\\syswow64\\\\"
    | alter dll_name = arrayindex(regextract(action_module_path, "([^\\\\]+)$"), 0)
    | filter dll_name != null
    | comp count() as load_count by agent_hostname, actor_process_image_name, dll_name, action_module_path
    | filter load_count >= 1
    | fields agent_hostname, actor_process_image_name, dll_name, action_module_path, load_count
  lucene: |
    (event.code:7 OR winlog.event_id:7) AND (winlog.event_data.ImageLoaded:*\\AppData\\* OR winlog.event_data.ImageLoaded:*\\ProgramData\\* OR winlog.event_data.ImageLoaded:*\\Users\\Public\\* OR winlog.event_data.ImageLoaded:*\\Temp\\* OR winlog.event_data.ImageLoaded:*\\Windows\\Temp\\*) AND NOT winlog.event_data.ImageLoaded:*\\system32\\* AND NOT winlog.event_data.ImageLoaded:*\\SysWOW64\\*
  sumo: |
    _sourceCategory=*Sysmon* "7"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ImageLoaded" as image_loaded
    | json field=_raw "Image" as process_name
    | where event_id = "7"
    | where image_loaded matches "*\\Users\\*" or image_loaded matches "*\\ProgramData\\*" or image_loaded matches "*\\Temp\\*" or image_loaded matches "*\\AppData\\*"
    | parse regex field=image_loaded ".*\\(?<dll_name>[^\\]+\.dll)$"
    | where !(image_loaded matches "*\\System32\\*" or image_loaded matches "*\\SysWOW64\\*" or image_loaded matches "*\\Program Files\\*" or image_loaded matches "*\\Program Files (x86)\\*")
    | count by _sourceHost, process_name, dll_name, image_loaded
pseudo_logic: Process loads a DLL from a writable PATH directory before the system32 copy. Phantom-DLL hijack.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- dll-hijack
- search-order
- side-load
- t1574
- defense-evasion
references:
- https://attack.mitre.org/techniques/T1574/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

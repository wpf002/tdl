rule_id: TDL-DE-000732
v4_id: '000732'
name: PAM Module File Modified Outside Patch Window
description: Write to /lib/security/pam_*.so or /etc/pam.d/* outside an approved package install. Backdoors authentication on Linux. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1556 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1556
technique_name: Modify Authentication Process
platform:
- Windows
- Linux
- macOS
- Azure
- AWS
data_sources:
- Windows Event Log
- Sysmon
- Auditd
- Cloud Audit Logs
severity: Critical
fidelity: Medium
lifecycle: Proposed
risk_score: 85
queries:
  spl: |
    index=linux sourcetype IN(linux_audit, auditd, syslog) (file_path="*/lib/security/pam_*.so" OR file_path="*/etc/pam.d/*" OR name="*/lib/security/pam_*.so" OR name="*/etc/pam.d/*") (action=write OR action=created OR action=modified OR syscall=open OR syscall=openat OR syscall=rename OR syscall=renameat)
    | search NOT (exe="*/dpkg*" OR exe="*/apt*" OR exe="*/yum*" OR exe="*/rpm*" OR exe="*/dnf*" OR exe="*/zypper*" OR exe="*/pacman*" OR comm="*dpkg*" OR comm="*apt*" OR comm="*yum*" OR comm="*rpm*" OR comm="*dnf*" OR comm="*zypper*" OR comm="*pacman*")
    | stats count values(file_path) as file_paths values(name) as file_names values(exe) as process values(comm) as command by _time, host, uid, user
    | table _time, host, user, uid, process, command, file_paths, file_names, count
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000732 {\n  meta:\n    author = \"TDL\"\n    description = \"PAM Module File Modified Outside Patch Window\"\n    severity\
    \ = \"CRITICAL\"\n    tactic = \"TA0005\"\n    technique = \"T1556\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n \
    \   $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Write to /lib/security/pam_*.so or /etc/pam.d/* outside an approved package install. Backdoors authentication on Linux.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- auth
- lsass
- pam
- ssp
- t1556
- defense-evasion
references:
- https://attack.mitre.org/techniques/T1556/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-07-18'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'

rule_id: TDL-DE-000734
v4_id: '000734'
name: Asymmetric Traffic Across Trust Boundary
description: TCP sessions where reply path differs from request path crossing a security boundary, or NAT'd flows bypassing the egress firewall.
  Indicates rogue route/bridge. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1599 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1599
technique_name: Network Boundary Bridging
platform:
- Network
data_sources:
- Firewall
- Network IDS
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=firewall OR index=network_ids \n(action=allowed OR action=permitted OR action=accept) protocol=tcp \n| eval request_path=coalesce(src_zone,\
    \ src_interface, src_segment) \n| eval reply_path=coalesce(dest_zone, dest_interface, dest_segment) \n| eval session_key=src_ip.\":\".src_port.\"\
    -\".dest_ip.\":\".dest_port \n| eval reverse_session_key=dest_ip.\":\".dest_port.\"-\".src_ip.\":\".src_port \n| eventstats values(request_path)\
    \ as all_request_paths values(reply_path) as all_reply_paths by session_key \n| eventstats values(request_path) as reverse_request_paths values(reply_path)\
    \ as reverse_reply_paths by reverse_session_key \n| eval path_asymmetry=if(mvcount(mvappend(all_request_paths, all_reply_paths, reverse_request_paths,\
    \ reverse_reply_paths)) > 1 AND all_request_paths != all_reply_paths, 1, 0) \n| eval crosses_boundary=if(match(request_path, \"(?i)(dmz|external|untrusted|internet)\"\
    ) AND match(reply_path, \"(?i)(internal|trusted|lan)\") OR match(reply_path, \"(?i)(dmz|external|untrusted|internet)\") AND match(request_path,\
    \ \"(?i)(internal|trusted|lan)\"), 1, 0) \n| eval nat_bypass=if(isnotnull(nat_src_ip) AND src_zone=\"internal\" AND dest_zone!=\"external\"\
    , 1, 0) \n| where (path_asymmetry=1 AND crosses_boundary=1) OR nat_bypass=1 \n| stats count earliest(_time) as first_seen latest(_time) as\
    \ last_seen values(src_ip) as src_ips values(dest_ip) as dest_ips values(src_port) as src_ports values(dest_port) as dest_ports values(request_path)\
    \ as request_paths values(reply_path) as reply_paths by session_key \n| where count >= 1 \n| table first_seen last_seen session_key src_ips\
    \ dest_ips src_ports dest_ports request_paths reply_paths count\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_de_000734 {\n  meta:\n    author = \"TDL\"\n    description = \"Asymmetric Traffic Across Trust Boundary\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0005\"\n    technique = \"T1599\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: TCP sessions where reply path differs from request path crossing a security boundary, or NAT'd flows bypassing the egress firewall.
  Indicates rogue route/bridge.

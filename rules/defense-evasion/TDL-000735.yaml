rule_id: TDL-DE-000735
v4_id: '000735'
name: Boot Configuration Data (BCD) Modified to Disable Integrity
description: bcdedit invoked with testsigning, nointegritychecks, disable_integrity_checks or similar flags. Disables driver-signing enforcement
  to load unsigned drivers. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1542 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1542
technique_name: Pre-OS Boot
platform:
- Windows
- Linux
data_sources:
- EDR
- Firmware Telemetry
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=* (process_name="*bcdedit.exe" OR Image="*bcdedit.exe" OR CommandLine="*bcdedit*") (CommandLine="*testsigning*" OR CommandLine="*nointegritychecks*"
    OR CommandLine="*disable_integrity_checks*")

    | table _time, ComputerName, host, User, user, Image, process_name, CommandLine, ParentImage, parent_process_name

    '
  kql: |
    DeviceProcessEvents
    | where TimeGenerated > ago(24h)
    | where FileName =~ "bcdedit.exe"
    | where ProcessCommandLine has_any ("testsigning", "nointegritychecks", "disable_integrity_checks", "loadoptions", "DISABLE_INTEGRITY_CHECKS", "DDISABLE_INTEGRITY_CHECKS")
    | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName
  aql: "SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, \"Process Name\", \"Process CommandLine\", \"Parent Process\
    \ Name\"\nFROM events\nWHERE \"Process Name\" ILIKE '%bcdedit.exe%'\n  AND (\"Process CommandLine\" ILIKE '%testsigning%' \n       OR \"Process\
    \ CommandLine\" ILIKE '%nointegritychecks%' \n       OR \"Process CommandLine\" ILIKE '%disable_integrity_checks%'\n       OR \"Process CommandLine\"\
    \ ILIKE '%loadoptions%'\n       OR \"Process CommandLine\" ILIKE '%set%loadoptions%')\nLAST 24 HOURS\n"
  yara_l: "rule bootloader_protection_disabled {\n  meta:\n    author = \"TDL\"\n    description = \"Detects bcdedit disabling driver signature\
    \ enforcement via testsigning, nointegritychecks, or disable_integrity_checks flags\"\n    mitre_attack_tactic = \"Defense Evasion\"\n   \
    \ mitre_attack_technique = \"T1542\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\bcdedit\\.exe$`) nocase\n    (\n      re.regex($e.principal.process.command_line, `(?i)testsigning\\s+(on|yes)`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)nointegritychecks\\s+(on|yes)`) or\n      re.regex($e.principal.process.command_line, `(?i)disable_integrity_checks\\s+(on|yes)`) or\n\
    \      re.regex($e.principal.process.command_line, `(?i)loadoptions.*DISABLE_INTEGRITY_CHECKS`)\n    )\n    $e.principal.hostname = $host\n\
    \    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 85\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*\n| WHERE process.name == \"bcdedit.exe\" \n  AND (\n    process.command_line\
    \ LIKE \"*testsigning*\"\n    OR process.command_line LIKE \"*nointegritychecks*\"\n    OR process.command_line LIKE \"*disable_integrity_checks*\"\
    \n    OR process.command_line LIKE \"*loadoptions*\"\n  )\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name,\
    \ process.executable\n"
  leql: |
    where(process_name ICONTAINS "bcdedit.exe" AND (process_cmd_line ICONTAINS "testsigning" OR process_cmd_line ICONTAINS "nointegritychecks" OR process_cmd_line ICONTAINS "disable_integrity_checks"))
  crowdstrike: |
    event_simpleName=ProcessRollup2 FileName=bcdedit.exe (CommandLine=*testsigning* OR CommandLine=*nointegritychecks* OR CommandLine=*disable_integrity_checks* OR CommandLine=*loadoptions* OR CommandLine=*DISABLE_INTEGRITY_CHECKS*)
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter lowercase(action_process_image_name) contains "bcdedit.exe"
    | filter action_process_image_command_line ~= "(?i)(testsigning|nointegritychecks|disable_integrity_checks)"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, actor_process_image_name
  lucene: |
    (process.name:bcdedit.exe OR process.name:bcdedit) AND (process.command_line:(*testsigning* OR *nointegritychecks* OR *disable_integrity_checks* OR *loadoptions* OR *recoveryenabled*) AND (process.command_line:*set* OR process.command_line:*/set*))
  sumo: |
    _sourceCategory=*Windows* (bcdedit OR BcdEdit.exe)
    | json field=_raw "CommandLine" as cmd
    | json field=_raw "Process" as process
    | json field=_raw "ParentProcessName" as parent
    | where cmd matches "*bcdedit*" and (cmd matches "*testsigning*" or cmd matches "*nointegritychecks*" or cmd matches "*disable_integrity_checks*" or cmd matches "*loadoptions*")
    | fields _messageTime, _sourceHost, process, parent, cmd
pseudo_logic: bcdedit invoked with testsigning, nointegritychecks, disable_integrity_checks or similar flags. Disables driver-signing enforcement
  to load unsigned drivers.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

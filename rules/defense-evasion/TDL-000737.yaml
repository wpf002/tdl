rule_id: TDL-DE-000737
v4_id: '000737'
name: DCShadow Replication from Non-DC Source
description: EID 4928/4929 replication source from a host not in the DC OU, or DRSReplicaAdd from an unfamiliar SPN. DCShadow pattern. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1207 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1207
technique_name: Rogue Domain Controller
platform:
- Windows
data_sources:
- Windows Event Log
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=4928 OR EventCode=4929)

    | eval suspicious_source=if(like(Subject_Security_ID, "%CN=Computers,DC=%") OR like(Subject_Security_ID, "%OU=Domain Controllers,DC=%"), 0,
    1)

    | where suspicious_source=1

    | stats count values(Source_Address) as source_addresses values(Destination_DRA) as destination_dra values(Subject_Account_Name) as account_name
    by _time, ComputerName, EventCode

    | table _time, ComputerName, EventCode, account_name, source_addresses, destination_dra, count

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (4928, 4929)
    | where Computer !has "DC"
    | extend SourceComputer = tostring(extract(@"Source:\s*([^\s]+)", 1, EventData))
    | extend ServicePrincipalName = tostring(extract(@"Service Principal Name:\s*([^\s]+)", 1, EventData))
    | where isnotempty(SourceComputer) or isnotempty(ServicePrincipalName)
    | project TimeGenerated, Computer, EventID, Account, SourceComputer, ServicePrincipalName, EventData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, sourceip, username, "EventID", "Service Principal Name" AS spn, "Naming Context" AS naming_context
    FROM events
    WHERE ("EventID" = '4928' OR "EventID" = '4929')
      AND LOGSOURCENAME(logsourceid) NOT ILIKE '%OU=Domain Controllers%'
    LAST 24 HOURS
  yara_l: |
    rule dcshadow_rogue_dc_replication {
      meta:
        author = "TDL"
        description = "Detects DCShadow attack via rogue DC registration (EID 4928/4929) or DRSReplicaAdd from non-DC hosts"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1207"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT" or
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
        (
          $e.metadata.product_event_type = "4928" or
          $e.metadata.product_event_type = "4929"
        )
        $e.principal.hostname = $host
        not re.regex($e.principal.asset.asset_id, `(?i)OU=Domain Controllers`)
        not re.regex($e.principal.hostname, `(?i)^(DC|DOMAINCONTROLLER)`)

      match:
        $host over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: "FROM logs-system.security*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.code IN (\"4928\", \"4929\")\n  AND NOT winlog.event_data.SubjectUserName\
    \ LIKE \"*$\"\n  AND NOT TO_LOWER(winlog.event_data.SourceDN) LIKE \"*ou=domain controllers*\"\n| STATS replications = COUNT(*) BY host.name,\
    \ winlog.event_data.SubjectUserName, winlog.event_data.SourceDN, source.ip\n| WHERE replications > 0\n| KEEP @timestamp, host.name, winlog.event_data.SubjectUserName,\
    \ winlog.event_data.SourceDN, source.ip, replications\n"
  leql: |
    where(source_json.EventID IN [4928, 4929]) groupby(source_asset, source_json.SubjectUserName, source_json.SourceDRA) calculate(count)
  crowdstrike: |
    EventCode IN [4928, 4929]
    | groupBy([ComputerName, SourceDRA, SubjectUserName], function=count(as=events))
    | table([@timestamp, ComputerName, SourceDRA, SubjectUserName, EventCode, events])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (4928, 4929)
    | alter source_host = coalesce(action_evtlog_event_data_SourceDRA, action_evtlog_event_data_SourceHostName, action_evtlog_event_data_SubjectUserName)
    | filter source_host != null
    | filter not (lowercase(action_evtlog_event_data_SourceDN) contains "ou=domain controllers" or lowercase(action_evtlog_event_data_SourceDN) contains "ou=domain_controllers")
    | fields _time, agent_hostname, action_evtlog_event_id, source_host, action_evtlog_event_data_SourceDN, action_evtlog_event_data_SourceDRA, action_evtlog_event_data_SubjectUserName, action_evtlog_message
  lucene: |
    (event.code:(4928 OR 4929) AND NOT source.host.ou:*DC*) OR (event.code:4662 AND winlog.event_data.Properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2* AND NOT user.name:(*DC* OR *SYNC* OR *REPL*))
  sumo: |
    _sourceCategory=*Windows* ("4928" OR "4929")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as computer
    | json field=_raw "SubjectUserName" as subject_user
    | json field=_raw "ServicePrincipalName" as spn
    | json field=_raw "SourceDRA" as source_dra
    | where event_id in ("4928", "4929")
    | where !(computer matches "*OU=Domain Controllers*")
    | fields _messageTime, computer, event_id, subject_user, spn, source_dra, _sourceHost
pseudo_logic: EID 4928/4929 replication source from a host not in the DC OU, or DRSReplicaAdd from an unfamiliar SPN. DCShadow pattern.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

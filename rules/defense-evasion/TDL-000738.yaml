rule_id: TDL-DE-000738
v4_id: 000738
name: Unsigned Kernel Driver Load
description: DriverLoad event for a driver not in the Microsoft / vendor-trusted publisher allowlist; or insmod / modprobe of an LKM outside package
  management. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1014 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1014
technique_name: Rootkit
platform:
- Windows
- Linux
data_sources:
- EDR
- Auditd
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: "index=* \n(\n  (sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=6 NOT (Signature=\"*Microsoft*\" OR SignatureStatus=\"\
    Valid\"))\n  OR\n  (sourcetype IN (linux_secure, syslog) (process_name IN (insmod, modprobe)) NOT (parent_process_name IN (dpkg, rpm, yum,\
    \ apt, apt-get, dnf, zypper, pacman)))\n)\n| eval alert_reason=case(\n    EventCode=6, \"Untrusted driver loaded: \".ImageLoaded,\n    process_name\
    \ IN (\"insmod\",\"modprobe\"), \"Manual kernel module load outside package manager\"\n  )\n| table _time, host, sourcetype, EventCode, ImageLoaded,\
    \ Signature, SignatureStatus, process_name, parent_process_name, command_line, alert_reason\n"
  kql: "union\n(DeviceEvents\n| where TimeGenerated > ago(24h)\n| where ActionType == \"DriverLoad\"\n| where isnotempty(SHA1)\n| extend Publisher\
    \ = tostring(AdditionalFields.SignaturePublisher)\n| where Publisher !startswith \"Microsoft\" \n    and Publisher !contains \"Intel\" \n\
    \    and Publisher !contains \"NVIDIA\" \n    and Publisher !contains \"AMD\" \n    and Publisher !contains \"Realtek\"\n    and Publisher\
    \ !contains \"Qualcomm\"\n    and Publisher !contains \"Broadcom\"\n    and Publisher !contains \"Dell\"\n    and Publisher !contains \"HP\"\
    \n    and Publisher !contains \"Lenovo\"\n    and isnotempty(Publisher)\n| project TimeGenerated, DeviceName, ActionType, FileName, FolderPath,\
    \ SHA1, Publisher, InitiatingProcessFileName, InitiatingProcessCommandLine),\n(DeviceProcessEvents\n| where TimeGenerated > ago(24h)\n| where\
    \ FileName in~ (\"insmod\",\"modprobe\")\n| where ProcessCommandLine !has \"/lib/modules\"\n    and ProcessCommandLine !has \"apt\"\n    and\
    \ ProcessCommandLine !has \"yum\"\n    and ProcessCommandLine !has \"dnf\"\n    and ProcessCommandLine !has \"zypper\"\n| project TimeGenerated,\
    \ DeviceName, ActionType = \"LinuxKernelModuleLoad\", FileName, FolderPath = \"\", SHA1, Publisher = \"N/A\", InitiatingProcessFileName, InitiatingProcessCommandLine\
    \ = ProcessCommandLine)\n| sort by TimeGenerated desc\n"
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Image Loaded" AS driver_path, "Signer", sourceip, COUNT(*) AS load_count
    FROM events
    WHERE (
      ("EventID" = '6' AND "Signer" NOT ILIKE '%Microsoft%' AND "Signer" NOT ILIKE '%Windows%' AND "Signer" IS NOT NULL)
      OR ("EventID" = '6' AND "Signer" IS NULL)
      OR ("Process Name" ILIKE '%insmod%' OR "Process Name" ILIKE '%modprobe%')
    )
    AND "Image Loaded" NOT ILIKE '%/lib/modules/%'
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), username, "Process Name", "Image Loaded", "Signer", sourceip
    LAST 24 HOURS
  yara_l: "rule rootkit_driver_load_untrusted {\n  meta:\n    author = \"TDL\"\n    description = \"Detects loading of drivers or kernel modules\
    \ from untrusted publishers - MITRE T1014 Defense Evasion\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    mitre_attack_technique = \"\
    T1014\"\n    severity = \"HIGH\"\n\n  events:\n    // Windows driver load events\n    ($w.metadata.event_type = \"DRIVER_LOAD\" or \n    \
    \ $w.metadata.product_event_type = \"6\" or\n     $w.metadata.product_event_type = \"7045\") and\n    (\n      not re.regex($w.target.file.signature_info.signer,\
    \ `(?i)Microsoft`) and\n      not re.regex($w.target.file.signature_info.signer, `(?i)Intel`) and\n      not re.regex($w.target.file.signature_info.signer,\
    \ `(?i)NVIDIA`) and\n      not re.regex($w.target.file.signature_info.signer, `(?i)AMD`) and\n      not re.regex($w.target.file.signature_info.signer,\
    \ `(?i)Dell`) and\n      not re.regex($w.target.file.signature_info.signer, `(?i)HP`) and\n      not re.regex($w.target.file.signature_info.signer,\
    \ `(?i)Lenovo`) and\n      not $w.target.file.signature_info.signed = true\n    )\n    $w.principal.hostname = $host\n    $w.target.file.full_path\
    \ = $driver_path\n\n    or\n\n    // Linux kernel module load via insmod/modprobe\n    $l.metadata.event_type = \"PROCESS_LAUNCH\" and\n \
    \   (\n      re.regex($l.principal.process.file.full_path, `(?i)/s?bin/(insmod|modprobe)$`) or\n      re.regex($l.principal.process.command_line,\
    \ `(?i)(insmod|modprobe)\\s+`)\n    ) and\n    not re.regex($l.principal.process.command_line, `(?i)/lib/modules/`) and\n    not re.regex($l.principal.process.command_line,\
    \ `(?i)/usr/lib/modules/`)\n    $l.principal.hostname = $host\n    $l.principal.process.command_line = $driver_path\n\n  match:\n    $host\
    \ over 5m\n\n  outcome:\n    $risk_score = 85\n    $driver_loaded = array_distinct($driver_path)\n\n  condition:\n    $w or $l\n}\n"
  esql: "FROM logs-endpoint.events.driver*, logs-endpoint.events.process*, logs-linux.auditd*\n| WHERE \n    (event.category == \"driver\" AND\
    \ event.action == \"load\" \n     AND NOT (\n       STARTS_WITH(file.code_signature.subject_name, \"Microsoft\") \n       OR file.code_signature.trusted\
    \ == true\n     ))\n    OR \n    (process.name IN (\"insmod\", \"modprobe\", \"kmod\") \n     AND process.args LIKE \"*.ko\" \n     AND NOT\
    \ process.parent.name IN (\"dpkg\", \"rpm\", \"yum\", \"apt\", \"apt-get\", \"dnf\", \"zypper\", \"pacman\"))\n| STATS events = COUNT(*) BY\
    \ host.name, file.path, file.name, file.code_signature.subject_name, process.name, process.command_line, user.name, @timestamp\n| KEEP @timestamp,\
    \ host.name, file.path, file.name, file.code_signature.subject_name, process.name, process.command_line, user.name, events\n"
  leql: |
    where((source_json.EventID=6 AND NOT (source_json.ImageLoaded ICONTAINS "microsoft" OR source_json.Signed="true")) OR (process_name IN ["insmod", "modprobe"] AND NOT process_cmd_line ICONTAINS "apt" AND NOT process_cmd_line ICONTAINS "yum" AND NOT process_cmd_line ICONTAINS "dnf" AND NOT process_cmd_line ICONTAINS "zypper" AND NOT process_cmd_line ICONTAINS "dpkg"))
  crowdstrike: |
    (event_simpleName=DriverLoad event_platform=Win AND NOT (ImageLoaded=*\Windows\System32\drivers\* OR ImageLoaded=*\Windows\SysWOW64\drivers\* OR Signed=true OR Publisher=*Microsoft*)) OR (event_simpleName=ProcessRollup2 event_platform=Lin (FileName=insmod OR FileName=modprobe OR CommandLine=*insmod* OR CommandLine=*modprobe*) NOT (CommandLine=*/usr/lib/* OR CommandLine=*/lib/modules/* OR CommandLine=*yum* OR CommandLine=*apt* OR CommandLine=*dnf* OR CommandLine=*zypper*)) | table([@timestamp, event_platform, ComputerName, UserName, FileName, ImageLoaded, CommandLine, Publisher, Signed, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter (event_type = ENUM.EVENT_TYPE_LOAD_IMAGE and event_sub_type = ENUM.EVENT_SUB_TYPE_LOAD_IMAGE_DRIVER)
       or (event_type = ENUM.EVENT_TYPE_PROCESS and (actor_process_image_name in ("insmod", "modprobe") or actor_process_image_name ~= ".*(insmod|modprobe)$"))
    | filter (event_sub_type = ENUM.EVENT_SUB_TYPE_LOAD_IMAGE_DRIVER and (action_module_publisher = null or action_module_publisher = "" or (action_module_publisher != "Microsoft Corporation" and action_module_publisher != "Microsoft Windows" and not action_module_publisher ~= ".*Intel.*" and not action_module_publisher ~= ".*AMD.*" and not action_module_publisher ~= ".*NVIDIA.*" and not action_module_publisher ~= ".*Dell.*" and not action_module_publisher ~= ".*HP.*" and not action_module_publisher ~= ".*Lenovo.*")))
       or (actor_process_image_name in ("insmod", "modprobe") or actor_process_image_name ~= ".*(insmod|modprobe)$")
    | fields _time, agent_hostname, actor_effective_username, event_type, event_sub_type, action_module_path, action_module_publisher, actor_process_image_name, action_process_image_command_line
  lucene: |
    (event.code:6 AND NOT winlog.event_data.Signature:(*Microsoft* OR *Intel* OR *AMD* OR *NVIDIA* OR *Realtek* OR *Broadcom* OR *Qualcomm* OR *Dell* OR *HP* OR *Lenovo*)) OR (process.name:(insmod OR modprobe) AND NOT process.command_line:*/lib/modules/*)
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Linux* OR _sourceCategory=*EDR* OR _sourceCategory=*Auditd*
    | json field=_raw "EventID" as event_id
    | json field=_raw "ImageLoaded" as image_loaded
    | json field=_raw "Signature" as signature
    | json field=_raw "SignatureStatus" as signature_status
    | json field=_raw "Signed" as signed
    | parse regex "(?:insmod|modprobe)\s+(?<kernel_module>\S+)" nodrop
    | parse regex "type=(?:SYSCALL|PATH)\s+.*\s+comm=\"(?:insmod|modprobe)\".*\s+name=\"(?<auditd_module>[^\"]+)\"" nodrop
    | where (event_id = "6" AND (signature_status != "Valid" OR signed = "false" OR (signature != "*Microsoft*" AND signature != "*Intel*" AND signature != "*NVIDIA*" AND signature != "*AMD*" AND signature != "*Realtek*" AND signature != "*Broadcom*" AND signature != "*Qualcomm*" AND signature != "*Dell*" AND signature != "*HP*" AND signature != "*Lenovo*"))) OR isNotNull(kernel_module) OR isNotNull(auditd_module)
    | fields _messageTime, _sourceHost, event_id, image_loaded, signature, signature_status, kernel_module, auditd_module
pseudo_logic: DriverLoad event for a driver not in the Microsoft / vendor-trusted publisher allowlist; or insmod / modprobe of an LKM outside
  package management.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

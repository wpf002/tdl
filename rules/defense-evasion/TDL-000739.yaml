rule_id: TDL-DE-000739
v4_id: 000739
name: Signed Script (PubPrn / SyncAppvPublishingServer) Used as Proxy
description: Microsoft-signed script (PubPrn.vbs, SyncAppvPublishingServer.vbs) invoked with a URL or unusual argument. Signed-script proxy execution.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1216 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1216
technique_name: System Script Proxy Execution
platform:
- Windows
data_sources:
- Sysmon
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\wscript.exe" OR Image="*\\cscript.exe")
    (CommandLine="*PubPrn.vbs*" OR CommandLine="*SyncAppvPublishingServer.vbs*") (CommandLine="*http://*" OR CommandLine="*https://*" OR CommandLine="*\\\\*")

    | table _time, ComputerName, User, ParentImage, Image, CommandLine

    '
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | where EventData has_any ("PubPrn.vbs", "SyncAppvPublishingServer.vbs")
    | extend CommandLine = tostring(EventData)
    | where CommandLine has_any ("PubPrn.vbs", "SyncAppvPublishingServer.vbs")
    | where CommandLine has_any ("http://", "https://", "\\\\", "script:")
    | extend ProcessName = extract(@"<Data Name=\"Image\">([^<]+)</Data>", 1, EventData)
    | extend ParentProcessName = extract(@"<Data Name=\"ParentImage\">([^<]+)</Data>", 1, EventData)
    | extend User = extract(@"<Data Name=\"User\">([^<]+)</Data>", 1, EventData)
    | extend ComputerName = Computer
    | project TimeGenerated, ComputerName, User, ProcessName, ParentProcessName, CommandLine
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process CommandLine", "Parent Process Name", "Image"
    FROM events
    WHERE ("Process CommandLine" ILIKE '%PubPrn.vbs%' OR "Process CommandLine" ILIKE '%SyncAppvPublishingServer.vbs%')
      AND ("Process CommandLine" ILIKE '%http:%' OR "Process CommandLine" ILIKE '%https:%' OR "Process CommandLine" ILIKE '%ftp:%' OR "Process CommandLine" ILIKE '%\\\\%')
    LAST 24 HOURS
  yara_l: |
    rule signed_script_proxy_execution_t1216 {
      meta:
        author = "TDL"
        description = "Detects signed script proxy execution (T1216) via PubPrn.vbs or SyncAppvPublishingServer.vbs with URL or unusual arguments"
        mitre_attack_technique = "T1216"
        mitre_attack_tactic = "Defense Evasion"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_name = "Microsoft Sysmon"
        (
          re.regex($e.principal.process.file.full_path, `(?i)\\cscript\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)\\wscript\.exe$`)
        )
        (
          re.regex($e.principal.process.command_line, `(?i)PubPrn\.vbs`) or
          re.regex($e.principal.process.command_line, `(?i)SyncAppvPublishingServer\.vbs`)
        )
        (
          re.regex($e.principal.process.command_line, `(?i)https?://`) or
          re.regex($e.principal.process.command_line, `(?i)script:`) or
          re.regex($e.principal.process.command_line, `(?i)\\\\`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == 1
      AND (
        (process.command_line LIKE "*PubPrn.vbs*" AND process.command_line LIKE "*script:http*")
        OR (process.command_line LIKE "*SyncAppvPublishingServer.vbs*" AND process.command_line LIKE "*http*")
        OR (process.command_line LIKE "*PubPrn.vbs*" AND process.command_line LIKE "*/n:*")
        OR (TO_LOWER(process.command_line) LIKE "*pubprn.vbs*" AND TO_LOWER(process.command_line) RLIKE ".*https?://.*")
        OR (TO_LOWER(process.command_line) LIKE "*syncappvpublishingserver.vbs*" AND TO_LOWER(process.command_line) RLIKE ".*https?://.*")
      )
      AND (process.name == "wscript.exe" OR process.name == "cscript.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(process_name ICONTAINS "wscript.exe" OR process_name ICONTAINS "cscript.exe") AND (process_cmd_line ICONTAINS "PubPrn.vbs" OR process_cmd_line ICONTAINS "SyncAppvPublishingServer.vbs") AND (process_cmd_line ICONTAINS "http://" OR process_cmd_line ICONTAINS "https://" OR process_cmd_line ICONTAINS "script:")
  crowdstrike: |
    event_simpleName=ProcessRollup2 (FileName=wscript.exe OR FileName=cscript.exe) (CommandLine=*PubPrn.vbs* OR CommandLine=*SyncAppvPublishingServer.vbs*) (CommandLine=*http* OR CommandLine=*\\\\*)
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine, FileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter actor_process_image_name ~= "(?i)(wscript\.exe|cscript\.exe)"
    | filter action_process_image_command_line ~= "(?i)(PubPrn\.vbs|SyncAppvPublishingServer\.vbs)"
    | filter action_process_image_command_line ~= "(?i)(http://|https://|\\\\)"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line, action_process_image_path
  lucene: |
    (process.command_line:*PubPrn.vbs* OR process.command_line:*SyncAppvPublishingServer.vbs*) AND (process.command_line:*http* OR process.command_line:*\\\\*)
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Image" as image
    | json field=_raw "ParentImage" as parent_image
    | json field=_raw "Computer" as computer
    | where event_id = "1"
    | where (command_line matches "*PubPrn.vbs*" or command_line matches "*SyncAppvPublishingServer.vbs*")
    | where (command_line matches "*http://*" or command_line matches "*https://*" or command_line matches "*\\\\*")
    | fields _messageTime, computer, image, parent_image, command_line
pseudo_logic: Microsoft-signed script (PubPrn.vbs, SyncAppvPublishingServer.vbs) invoked with a URL or unusual argument. Signed-script proxy execution.
false_positives:

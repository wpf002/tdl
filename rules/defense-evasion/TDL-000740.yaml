rule_id: TDL-DE-000740
v4_id: '000740'
name: Office Document Fetching Remote Template URL
description: winword.exe / excel.exe child connection to http(s):// retrieving .dotm or .xltm. Remote-template injection delivery. Generated from
  gap analysis against canonical ATT&CK Enterprise matrix (T1221 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1221
technique_name: Template Injection
platform:
- Windows
data_sources:
- EDR
- Sysmon
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational)\
    \ EventCode=3 \n(Image=\"*\\\\winword.exe\" OR Image=\"*\\\\excel.exe\") \n(DestinationPortName=\"http\" OR DestinationPortName=\"https\"\
    \ OR DestinationPort=80 OR DestinationPort=443)\n(DestinationHostname=\"*\" OR DestinationIp=\"*\")\n| rex field=DestinationHostname \"(?<url_path>https?://[^\\\
    s]+)\"\n| where match(url_path, \"(?i)\\.dotm\") OR match(url_path, \"(?i)\\.xltm\")\n| table _time, ComputerName, User, Image, ParentImage,\
    \ DestinationIp, DestinationHostname, DestinationPort, url_path\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("winword.exe", "excel.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('winword.exe', 'excel.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_de_000740 {\n  meta:\n    author = \"TDL\"\n    description = \"Office Document Fetching Remote Template URL\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0005\"\n    technique = \"T1221\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /(winword.exe|excel.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("winword.exe", "excel.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [winword.exe, excel.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (winword.exe, excel.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("winword.exe", "excel.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(winword.exe OR excel.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("winword.exe", "excel.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: winword.exe / excel.exe child connection to http(s):// retrieving .dotm or .xltm. Remote-template injection delivery.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-DE-000742
v4_id: '000742'
name: MSBuild / InstallUtil Executing User-Authored XML Project
description: msbuild.exe or installutil.exe with argument pointing to an .xml/.csproj/.dll in %TEMP%/%APPDATA%. Inline-task code execution. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1127 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1127
technique_name: Trusted Developer Utilities Proxy Execution
platform:
- Windows
data_sources:
- Sysmon
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\msbuild.exe" OR Image="*\\installutil.exe")
    (CommandLine="*\\Temp\\*" OR CommandLine="*\\AppData\\*") (CommandLine="*.xml*" OR CommandLine="*.csproj*" OR CommandLine="*.dll*")

    | table _time, ComputerName, User, Image, ParentImage, CommandLine

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where Process has_any ("msbuild.exe", "installutil.exe")
    | where CommandLine has_any (".xml", ".csproj", ".dll")
    | where CommandLine has_any ("\\Temp\\", "\\AppData\\")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE ("Process Name" ILIKE '%msbuild.exe' OR "Process Name" ILIKE '%installutil.exe')
      AND ("Process CommandLine" ILIKE '%\\temp\\%.xml%' OR "Process CommandLine" ILIKE '%\\temp\\%.csproj%' OR "Process CommandLine" ILIKE '%\\temp\\%.dll%' OR "Process CommandLine" ILIKE '%\\appdata\\%.xml%' OR "Process CommandLine" ILIKE '%\\appdata\\%.csproj%' OR "Process CommandLine" ILIKE '%\\appdata\\%.dll%')
    LAST 24 HOURS
  yara_l: "rule msbuild_installutil_suspicious_path {\n  meta:\n    author = \"TDL\"\n    description = \"Detects MSBuild.exe or InstallUtil.exe\
    \ executing with arguments pointing to files in TEMP or APPDATA directories, indicative of T1127 Trusted Developer Utilities Proxy Execution\"\
    \n    mitre_attack_technique = \"T1127\"\n    mitre_attack_tactic = \"Defense Evasion\"\n    \n  events:\n    $e.metadata.event_type = \"\
    PROCESS_LAUNCH\"\n    (\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\msbuild\\.exe$`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\installutil\\.exe$`)\n    )\n    (\n      re.regex($e.principal.process.command_line, `(?i)\\\\temp\\\\.*\\.(xml|csproj|dll)`)\
    \ or\n      re.regex($e.principal.process.command_line, `(?i)\\\\appdata\\\\.*\\.(xml|csproj|dll)`)\n    )\n    $e.principal.hostname = $host\n\
    \    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == 1
      AND (TO_LOWER(process.name) == "msbuild.exe" OR TO_LOWER(process.name) == "installutil.exe")
      AND (process.command_line LIKE "*\\Temp\\*" OR process.command_line LIKE "*\\AppData\\*")
      AND (process.command_line LIKE "*.xml*" OR process.command_line LIKE "*.csproj*" OR process.command_line LIKE "*.dll*")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where((process_name ICONTAINS "msbuild.exe" OR process_name ICONTAINS "installutil.exe") AND (process_cmd_line ICONTAINS "\Temp\" OR process_cmd_line ICONTAINS "\AppData\") AND (process_cmd_line ICONTAINS ".xml" OR process_cmd_line ICONTAINS ".csproj" OR process_cmd_line ICONTAINS ".dll"))
  crowdstrike: |
    event_simpleName=ProcessRollup2 (FileName=msbuild.exe OR FileName=installutil.exe) (CommandLine=*\\Temp\\* OR CommandLine=*\\AppData\\*) (CommandLine=*.xml* OR CommandLine=*.csproj* OR CommandLine=*.dll*)
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_PROCESS\n| filter lowercase(action_process_image_name) in (\"msbuild.exe\",\
    \ \"installutil.exe\")\n| filter (lowercase(action_process_image_command_line) ~= \".*\\\\\\\\temp\\\\\\\\.*\\\\.xml\" \n       or lowercase(action_process_image_command_line)\
    \ ~= \".*\\\\\\\\temp\\\\\\\\.*\\\\.csproj\"\n       or lowercase(action_process_image_command_line) ~= \".*\\\\\\\\temp\\\\\\\\.*\\\\.dll\"\
    \n       or lowercase(action_process_image_command_line) ~= \".*\\\\\\\\appdata\\\\\\\\.*\\\\.xml\"\n       or lowercase(action_process_image_command_line)\
    \ ~= \".*\\\\\\\\appdata\\\\\\\\.*\\\\.csproj\"\n       or lowercase(action_process_image_command_line) ~= \".*\\\\\\\\appdata\\\\\\\\.*\\\
    \\.dll\")\n| fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, actor_process_image_name\n"
  lucene: |
    (process.name:(msbuild.exe OR MSBuild.exe) OR process.name:(installutil.exe OR InstallUtil.exe)) AND process.command_line:(*\\Temp\\*.xml OR *\\Temp\\*.csproj OR *\\Temp\\*.dll OR *\\AppData\\*.xml OR *\\AppData\\*.csproj OR *\\AppData\\*.dll)
  sumo: |
    _sourceCategory=*Sysmon* ("msbuild.exe" OR "installutil.exe")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as image
    | json field=_raw "CommandLine" as command_line
    | where event_id = "1"
    | where (image matches "*msbuild.exe" OR image matches "*installutil.exe")
    | where (command_line matches "*\\Temp\\*" OR command_line matches "*\\AppData\\*")
    | where (command_line matches "*.xml*" OR command_line matches "*.csproj*" OR command_line matches "*.dll*")
    | fields _messageTime, _sourceHost, image, command_line
pseudo_logic: msbuild.exe or installutil.exe with argument pointing to an .xml/.csproj/.dll in %TEMP%/%APPDATA%. Inline-task code execution.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

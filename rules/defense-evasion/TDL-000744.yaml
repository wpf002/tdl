name: Process Reads VM/Sandbox Indicators Then Exits Quickly
description: Process reads HKLM\SYSTEM\HardwareConfig\* (BIOS strings), checks WMI Win32_BIOS / Manufacturer, or scans for VBOX/VMware drivers
  and exits within 5s. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1497 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1497
technique_name: Virtualization/Sandbox Evasion
platform:
- Windows
- macOS
data_sources:
- EDR
severity: Medium
fidelity: Low
lifecycle: Proposed
risk_score: 50
queries:
  spl: "index=* sourcetype IN (\"XmlWinEventLog:Microsoft-Windows-Sysmon/Operational\", \"edr*\", \"carbon*\", \"crowdstrike*\", \"sentinelone*\"\
    ) \n    (\n        (registry_path=\"*\\\\SYSTEM\\\\HardwareConfig\\\\*\" OR TargetObject=\"*\\\\SYSTEM\\\\HardwareConfig\\\\*\" OR object_path=\"\
    *\\\\SYSTEM\\\\HardwareConfig\\\\*\") OR\n        (QueryName=\"Win32_BIOS\" OR query=\"*Win32_BIOS*\" OR wmi_query=\"*Win32_BIOS*\") OR\n\
    \        (QueryName=\"Win32_ComputerSystemProduct\" OR query=\"*Win32_ComputerSystemProduct*\" OR wmi_query=\"*Win32_ComputerSystemProduct*\"\
    ) OR\n        (process_name IN (\"*wmic.exe\", \"*powershell.exe\", \"*cmd.exe\") AND (CommandLine=\"*Win32_BIOS*\" OR CommandLine=\"*Manufacturer*\"\
    \ OR command_line=\"*Win32_BIOS*\" OR command_line=\"*Manufacturer*\")) OR\n        (file_path IN (\"*vbox*\", \"*vmware*\", \"*VBox*\", \"\
    *VMware*\") OR TargetFilename IN (\"*vbox*\", \"*vmware*\", \"*VBox*\", \"*VMware*\") OR Image IN (\"*vbox*\", \"*vmware*\")) OR\n       \
    \ (registry_path IN (\"*vbox*\", \"*vmware*\", \"*VBox*\", \"*VMware*\") OR TargetObject IN (\"*vbox*\", \"*vmware*\", \"*VBox*\", \"*VMware*\"\
    ))\n    )\n| bin _time span=5s\n| stats min(_time) as first_time max(_time) as last_time values(action) as actions values(EventCode) as event_codes\
    \ values(registry_path) as registry_paths values(TargetObject) as target_objects values(CommandLine) as command_lines values(command_line)\
    \ as cmd_line values(file_path) as file_paths values(process_name) as process_names values(Image) as images by _time, host, ComputerName,\
    \ process_id, pid, ProcessId, parent_process_id, parent_process, ParentImage\n| eval duration=last_time - first_time\n| where duration <=\
    \ 5 AND (isnotnull(registry_paths) OR isnotnull(target_objects) OR isnotnull(command_lines) OR isnotnull(cmd_line) OR isnotnull(file_paths)\
    \ OR match(actions, \"(?i)(query|read|access)\"))\n| eval host=coalesce(host, ComputerName), process_id=coalesce(process_id, pid, ProcessId),\
    \ process=coalesce(process_names, images)\n| table _time, host, process_id, process, parent_process_id, parent_process, ParentImage, duration,\
    \ registry_paths, target_objects, command_lines, cmd_line, file_paths, event_codes\n"
  kql: "DeviceProcessEvents\n| where TimeGenerated > ago(24h)\n| where ProcessCommandLine has_any (\"SYSTEM\\\\HardwareConfig\", \"Win32_BIOS\"\
    , \"Win32_ComputerSystem\", \"Manufacturer\", \"VBOX\", \"VMware\", \"VirtualBox\", \"vmtools\")\n    or InitiatingProcessCommandLine has_any\
    \ (\"SYSTEM\\\\HardwareConfig\", \"Win32_BIOS\", \"Win32_ComputerSystem\", \"Manufacturer\", \"VBOX\", \"VMware\", \"VirtualBox\", \"vmtools\"\
    )\n| extend ProcessDuration = datetime_diff('second', Timestamp, todatetime(ProcessCreationTime))\n| where ProcessDuration <= 5\n| join kind=inner\
    \ (\n    union DeviceRegistryEvents, DeviceEvents\n    | where TimeGenerated > ago(24h)\n    | where RegistryKey has \"SYSTEM\\\\HardwareConfig\"\
    \ \n        or ActionType in (\"RegistryValueRead\", \"RegistryKeyOpened\")\n        or AdditionalFields has_any (\"VBOX\", \"VMware\", \"\
    VirtualBox\")\n    | project DeviceId, DeviceName, Timestamp, ActionType, RegistryKey, InitiatingProcessFileName, InitiatingProcessCommandLine\n\
    ) on DeviceId\n| where datetime_diff('second', Timestamp, Timestamp1) between (-5 .. 5)\n| project TimeGenerated, DeviceName, AccountName,\
    \ FileName, ProcessCommandLine, InitiatingProcessFileName, ProcessDuration, ActionType, RegistryKey\n| distinct TimeGenerated, DeviceName,\
    \ AccountName, FileName, ProcessCommandLine\n"
  aql: |
    SELECT "Process Name", "Process CommandLine", username, sourceip, LOGSOURCENAME(logsourceid) AS host, eventtime, "Target Object", "Image"
    FROM events
    WHERE (
      ("Target Object" ILIKE '%HKLM\SYSTEM\HardwareConfig\%' AND ("EventID" = '12' OR "EventID" = '13'))
      OR ("Process CommandLine" ILIKE '%Win32_BIOS%' OR "Process CommandLine" ILIKE '%Win32_ComputerSystem%' OR "Process CommandLine" ILIKE '%Manufacturer%')
      OR ("Process CommandLine" ILIKE '%vbox%' OR "Process CommandLine" ILIKE '%vmware%' OR "Process CommandLine" ILIKE '%virtualbox%')
      OR ("Target Object" ILIKE '%vbox%' OR "Target Object" ILIKE '%vmware%')
    )
    AND "Process Name" NOT ILIKE '%svchost.exe%'
    AND "Process Name" NOT ILIKE '%explorer.exe%'
    LAST 5 MINUTES
  yara_l: |
    rule virtualization_check_with_quick_exit {
      meta:
        author = "TDL"
        description = "Detects T1497 - Process reads hardware/BIOS info or checks for VM artifacts then exits within 5 seconds"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1497"
        severity = "Medium"

      events:
        // Registry read of BIOS/hardware config
        ($reg.metadata.event_type = "REGISTRY_OPEN" or $reg.metadata.event_type = "REGISTRY_QUERY")
        re.regex($reg.target.registry.registry_key, `(?i)HKLM\\SYSTEM\\HardwareConfig\\`)
        $reg.principal.process.pid = $pid
        $reg.principal.hostname = $host
        $reg.metadata.event_timestamp.seconds = $reg_time

        // Or WMI query for BIOS/Manufacturer info
        or (
          $wmi.metadata.event_type = "PROCESS_LAUNCH"
          re.regex($wmi.principal.process.command_line, `(?i)(Win32_BIOS|Win32_ComputerSystem|Win32_BaseBoard)`)
          $wmi.principal.process.pid = $pid
          $wmi.principal.hostname = $host
          $wmi.metadata.event_timestamp.seconds = $wmi_time
        )

        // Or file access to VMware/VirtualBox drivers
        or (
          ($file.metadata.event_type = "FILE_OPEN" or $file.metadata.event_type = "FILE_READ")
          re.regex($file.target.file.full_path, `(?i)(vbox|vmware|vmmouse|vmhgfs)`)
          $file.principal.process.pid = $pid
          $file.principal.hostname = $host
          $file.metadata.event_timestamp.seconds = $file_time
        )

        // Process termination within 5 seconds
        $exit.metadata.event_type = "PROCESS_TERMINATION"
        $exit.principal.process.pid = $pid
        $exit.principal.hostname = $host
        $exit.metadata.event_timestamp.seconds = $exit_time

      match:
        $host, $pid over 5s

      condition:
        ($reg or $wmi or $file) and $exit and (
          ($reg and ($exit_time - $reg_time <= 5)) or
          ($wmi and ($exit_time - $wmi_time <= 5)) or
          ($file and ($exit_time - $file_time <= 5))
        )
    }
  esql: |
    FROM logs-endpoint.events.*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (event.category == "registry" AND registry.path LIKE "*HKLM\\SYSTEM\\HardwareConfig\\*")
        OR (event.category == "process" AND (
          process.command_line LIKE "*Win32_BIOS*"
          OR process.command_line LIKE "*Win32_ComputerSystem*"
          OR process.command_line LIKE "*Manufacturer*"
          OR process.command_line LIKE "*VBOX*"
          OR process.command_line LIKE "*VMware*"
          OR process.command_line LIKE "*VirtualBox*"
        ))
      )
    | EVAL detection_time = @timestamp
    | STATS first_event = MIN(@timestamp), last_event = MAX(@timestamp), event_count = COUNT(*) BY process.entity_id, process.executable, host.name, user.name
    | EVAL duration_seconds = (last_event - first_event) / 1000
    | WHERE duration_seconds <= 5 OR event_count == 1
    | KEEP host.name, user.name, process.executable, process.entity_id, first_event, last_event, duration_seconds, event_count
  leql: |
    where((source_json.TargetObject ICONTAINS "HKLM\\SYSTEM\\HardwareConfig" OR source_json.QueryResults ICONTAINS "Win32_BIOS" OR source_json.QueryResults ICONTAINS "Manufacturer" OR source_json.ImageLoaded ICONTAINS "vbox" OR source_json.ImageLoaded ICONTAINS "vmware" OR process_cmd_line ICONTAINS "Win32_BIOS" OR process_cmd_line ICONTAINS "Win32_ComputerSystem") AND source_json.EventID IN [1, 12, 13, 7, 3]) groupby(process_name, asset, source_json.ParentImage) calculate(count)
  crowdstrike: |
    event_simpleName IN [ProcessRollup2, RegQueryValueIpV4, RegistryQueryValue, WmiGetInstanceIpV4, AsepValueUpdate, FileOpenInfo]
    (
      (RegObjectName=*\\SYSTEM\\HardwareConfig\\* OR RegObjectName=*\\HARDWARE\\DESCRIPTION\\System\\BIOS*)
      OR (WmiNameSpace=*root\\cimv2* AND (WmiClassName=Win32_BIOS OR WmiClassName=Win32_ComputerSystem) AND (WmiQueryString=*Manufacturer* OR WmiQueryString=*SerialNumber* OR WmiQueryString=*Version*))
      OR (FileName IN [*vbox*, *vmware*, *VBox*, *VMware*, *vmtools*, *vmmouse*, *vmhgfs*])
      OR (CommandLine=*vbox* OR CommandLine=*vmware* OR CommandLine=*qemu* OR CommandLine=*virtualbox* OR CommandLine=*VM*)
    )
    | selfJoinFilter([ContextProcessId], where=[{event_simpleName=EndOfProcess}], prefilter=true, window=5s)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName, ContextProcessId, RegObjectName, WmiClassName])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_PROCESS\n| alter has_vm_indicator = \n    (action_registry_key_name ~= \".*HKLM\\\
    \\\\\\SYSTEM\\\\\\\\HardwareConfig.*\" \n     or action_process_image_command_line ~= \".*Win32_BIOS.*\"\n     or action_process_image_command_line\
    \ ~= \".*Manufacturer.*\"\n     or action_process_image_command_line ~= \".*(VBOX|VMware).*\")\n| filter has_vm_indicator = true\n| comp min(_time)\
    \ as start_time, max(_time) as end_time by action_process_causality_id, agent_hostname, action_process_image_name, actor_effective_username\n\
    | alter time_diff_seconds = to_integer((end_time - start_time) / 1000)\n| filter time_diff_seconds <= 5\n| fields agent_hostname, action_process_image_name,\
    \ actor_effective_username, start_time, end_time, time_diff_seconds, action_process_causality_id\n"
  lucene: |
    (registry.path:*\\SYSTEM\\HardwareConfig\\* OR (process.command_line:*Win32_BIOS* OR process.command_line:*Manufacturer* OR process.command_line:*wmic* AND process.command_line:*bios*) OR (process.command_line:*vbox* OR process.command_line:*vmware* OR process.command_line:*VBoxGuest* OR process.command_line:*vmtoolsd* OR file.path:*VBox* OR file.path:*VMware*)) AND process.duration:[0 TO 5000]
  sumo: "_sourceCategory=*EDR* OR _sourceCategory=*Windows* OR _sourceCategory=*Sysmon*\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"ProcessId\" as process_id\n| json field=_raw \"Image\" as image\n| json field=_raw \"TargetObject\" as target_object\n| json field=_raw\
    \ \"QueryName\" as query_name\n| json field=_raw \"ImageLoaded\" as image_loaded\n| json field=_raw \"Computer\" as computer\n| json field=_raw\
    \ \"UtcTime\" as utc_time\n| where (event_id = \"13\" and target_object matches \"*HKLM\\\\SYSTEM\\\\HardwareConfig\\\\*\") \n   OR (event_id\
    \ = \"13\" and target_object matches \"*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\VBoxGuest*\")\n   OR (event_id = \"13\" and target_object\
    \ matches \"*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\VBoxMouse*\")\n   OR (event_id = \"13\" and target_object matches \"*HKLM\\\
    \\SYSTEM\\\\CurrentControlSet\\\\Services\\\\VBoxSF*\")\n   OR (event_id = \"13\" and target_object matches \"*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\
    \\Services\\\\vmci*\")\n   OR (event_id = \"13\" and target_object matches \"*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\vmmouse*\"\
    )\n   OR (event_id = \"13\" and target_object matches \"*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\VBoxVideo*\")\n   OR (event_id\
    \ = \"19\" and query_name matches \"*Win32_BIOS*\")\n   OR (event_id = \"19\" and query_name matches \"*Win32_ComputerSystem*\")\n   OR (event_id\
    \ = \"7\" and (image_loaded matches \"*vboxguest*\" OR image_loaded matches \"*vmware*\" OR image_loaded matches \"*vmmouse*\"))\n| parse\
    \ field=utc_time \"*T*.*Z\" as date, time, ms\n| concat(date, \"T\", time, \"Z\") as timestamp\n| parseDate(timestamp, \"yyyy-MM-dd'T'HH:mm:ss'Z'\"\
    ) as event_time_ms\n| fields event_time_ms, process_id, image, computer, event_id, target_object, query_name, image_loaded\n| sort by process_id,\
    \ event_time_ms\n| first(event_time_ms) as first_event, last(event_time_ms) as last_event by process_id, image, computer\n| where (last_event\
    \ - first_event) <= 5000\n| fields computer, image, process_id, first_event, last_event\n"
pseudo_logic: Process reads HKLM\SYSTEM\HardwareConfig\* (BIOS strings), checks WMI Win32_BIOS / Manufacturer, or scans for VBOX/VMware drivers
  and exits within 5s.

rule_id: TDL-DE-000745
v4_id: '000745'
name: wmic format:xsl Loading Remote XSL
description: wmic.exe with /format:"http(s)://" or any .xsl path outside system32. Squiblytwo XSL-based proxy execution. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1220 under Defense Evasion).
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1220
technique_name: XSL Script Processing
platform:
- Windows
data_sources:
- Sysmon
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\wmic.exe" (CommandLine="*/format:*http://*"
    OR CommandLine="*/format:*https://*" OR (CommandLine="*/format:*.xsl*" NOT CommandLine="*\\system32\\*"))

    | table _time, ComputerName, User, ParentImage, CommandLine

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 1\n| extend ProcessName = extract(@\"([^\\\\]+)$\", 1, tolower(Process))\n\
    | where ProcessName == \"wmic.exe\"\n| where CommandLine has \"/format\"\n| where (CommandLine matches regex @\"/format:\\s*[\"\"']?https?://\"\
    \ or \n         (CommandLine has \".xsl\" and CommandLine !contains \"system32\"))\n| project TimeGenerated, Computer, Account, Process, CommandLine,\
    \ ParentProcess = ParentProcessName\n"
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Process Name\", \"Process CommandLine\", \"Parent Process Name\"\nFROM\
    \ events\nWHERE \"Process Name\" ILIKE '%wmic.exe%'\n  AND (\"Process CommandLine\" ILIKE '%/format:%http://%' \n       OR \"Process CommandLine\"\
    \ ILIKE '%/format:%https://%'\n       OR (\"Process CommandLine\" ILIKE '%.xsl%' AND \"Process CommandLine\" NOT ILIKE '%system32%'))\nLAST\
    \ 24 HOURS\n"
  yara_l: |
    rule squiblytwo_xsl_proxy_execution {
      meta:
        author = "TDL"
        description = "Detects WMIC.exe execution with remote XSL scripts or XSL files outside system32 (T1220 - Squiblytwo)"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1220"
        severity = "High"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        re.regex($e.principal.process.file.full_path, `(?i)\\wmic\.exe$`)
        (
          re.regex($e.principal.process.command_line, `(?i)/format:\s*"?https?://`) or
          (
            re.regex($e.principal.process.command_line, `(?i)/format:.*\.xsl`) and
            not re.regex($e.principal.process.command_line, `(?i)\\system32\\`)
          )
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e

      outcome:
        $risk_score = 75
    }
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE winlog.event_id == 1 \n  AND TO_LOWER(process.name) == \"wmic.exe\"\n  AND (\n    process.command_line\
    \ RLIKE \".*[/\\\\-]format:.*https?://.*\"\n    OR (\n      process.command_line RLIKE \".*[/\\\\-]format:.*\\\\.xsl.*\"\n      AND NOT process.command_line\
    \ RLIKE \"(?i).*[/\\\\-]format:.*\\\\\\\\windows\\\\\\\\system32\\\\\\\\.*\\\\.xsl.*\"\n    )\n  )\n| KEEP @timestamp, host.name, user.name,\
    \ process.command_line, process.parent.name, process.parent.command_line\n"
  leql: |
    where(process_name ICONTAINS "wmic.exe" AND (process_cmd_line ICONTAINS "/format:\"http://" OR process_cmd_line ICONTAINS "/format:\"https://" OR (process_cmd_line ICONTAINS "/format:" AND process_cmd_line ICONTAINS ".xsl" AND NOT process_cmd_line ICONTAINS "system32")))
  crowdstrike: |
    event_simpleName=ProcessRollup2 FileName=wmic.exe (CommandLine=*/format:*http://* OR CommandLine=*/format:*https://* OR (CommandLine=*/format:*.xsl* NOT CommandLine=*system32*.xsl*))
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and lowercase(actor_process_image_name) contains "wmic.exe"
      and (action_process_image_command_line ~= "(?i)/format:.*https?://"
           or (action_process_image_command_line ~= "(?i)/format:.*\\.xsl"
               and action_process_image_command_line !~= "(?i)\\\\system32\\\\"))
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line, action_process_image_path
  lucene: |
    (process.name:wmic.exe OR process.parent.name:wmic.exe) AND (process.command_line:*/format\:\"http* OR (process.command_line:*/format\:* AND process.command_line:*.xsl* AND NOT process.command_line:*system32*))
  sumo: "_sourceCategory=*Sysmon* \"1\"\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"Image\" as image\n| json field=_raw \"\
    CommandLine\" as command_line\n| where event_id = \"1\" \n| where image matches \"*wmic.exe\"\n| where (command_line matches \"*/format:*http://*\"\
    \ or command_line matches \"*/format:*https://*\" or (command_line matches \"*/format:*.xsl*\" and !(command_line matches \"*system32*\")))\n\
    | fields _messageTime, _sourceHost, image, command_line\n"
pseudo_logic: wmic.exe with /format:"http(s)://" or any .xsl path outside system32. Squiblytwo XSL-based proxy execution.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

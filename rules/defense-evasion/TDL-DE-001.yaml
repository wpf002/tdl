rule_id: TDL-DE-001
name: Windows Event Log Cleared
tactic: Defense Evasion
tactic_id: TA0005
technique_id: T1070.001
technique_name: Clear Windows Event Logs
platform:
- Windows
data_sources:
- Windows Security Event Log (1102)
- Windows System Event Log (104)
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 90
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" (EventCode=1102 OR EventCode=104)

    | stats count values(EventCode) as EventCodes by user, IpAddress, LogonType

    | where count >= 1

    | table user, IpAddress, LogonType, EventCodes, count

    '
  kql: "SecurityEvent\n| where EventID == 1102\n| union (\n    Event\n    | where EventID == 104 and EventLog == \"System\"\n)\n| summarize \n\
    \    EventCount = count(),\n    FirstSeen = min(TimeGenerated),\n    LastSeen = max(TimeGenerated),\n    Computers = make_set(Computer)\n\
    \    by SubjectUserName, IpAddress, LogonType, EventID\n| where EventCount >= 1\n| project FirstSeen, LastSeen, EventID, SubjectUserName,\
    \ IpAddress, LogonType, EventCount, Computers\n"
  aql: |
    SELECT username, sourceip, "EventID", "Logon Type", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" IN ('1102', '104')
    GROUP BY username, sourceip, "EventID", "Logon Type"
    HAVING event_count >= 1
    LAST 24 HOURS
  yara_l: |
    rule windows_event_log_cleared {
      meta:
        author = "TDL"
        description = "Detects Windows Event Log clearing via event ID 1102 or 104"
        mitre_attack_tactic = "Defense Evasion"
        mitre_attack_technique = "T1070.001"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_WIPE"
        (
          $e.metadata.product_event_type = "1102" or
          $e.metadata.product_event_type = "104"
        )
        $e.principal.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_event_type = $event_code

      match:
        $user, $ip, $event_code over 1h

      outcome:
        $risk_score = 85

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, logs-system.system*, winlogbeat-*
    | WHERE (event.code == "1102" OR event.code == "104")
    | STATS event_count = COUNT(*) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE event_count >= 1
    | KEEP user.name, source.ip, winlog.logon.type, event.code, event_count
  leql: |
    where(source_json.EventID IN [1102, 104]) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventCode) calculate(count)
  crowdstrike: |
    (EventCode=1102 OR EventCode=104)
    | groupBy([User, IpAddress, LogonType, EventCode], function=count(as=event_count))
    | event_count >= 1
    | table([@timestamp, ComputerName, User, IpAddress, LogonType, EventCode, event_count])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (1102, 104)
    | comp count() as event_count by actor_effective_username, action_remote_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter event_count >= 1
    | fields actor_effective_username, action_remote_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id, event_count
  lucene: |
    (event.code:1102 OR event.code:104) OR (winlog.event_id:1102 OR winlog.event_id:104) OR (EventID:1102 OR EventID:104) OR (EventCode:1102 OR EventCode:104)
  sumo: |
    _sourceCategory=*Windows* ("1102" OR "104")
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "IpAddress" as ip_address
    | json field=_raw "LogonType" as logon_type
    | where event_id in ("1102", "104")
    | count as event_count by user, ip_address, logon_type, event_id
    | where event_count >= 1
    | fields user, ip_address, logon_type, event_id, event_count
false_positives:
- Authorized IT staff during maintenance
tags:
- log-clearing
- anti-forensics
- critical
author: TDL
created: '2024-01-25'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the evasion artifact (process / DLL / log clear / service stop).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — distinguish administrative tooling from adversary
  tradecraft (LOLBins, signed binary proxies, masquerading paths).
- 'Pull surrounding security-tool telemetry: EDR sensor health, AV scan history, log channel state to see what was suppressed.'
- 'Look for adjacent stages: a successful evasion typically wraps an execution / persistence / cred-access action in the same minute.'
- 'Decide TP / FP: FP if patch / debugging / IT-troubleshooting context fully accounts for it; TP if it''s unattended and pairs with other malicious
  telemetry.'
- 'If TP: restore the disabled defenses, capture artifacts before evidence rolls out of retention, isolate the host, and escalate to IR.'
pseudo_logic: '1 Instance over any time window of a Windows Event Log Cleared event.

  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 1102 or 104

  With count of matching events >= 1

  With the same user, IpAddress, LogonType, and EventCode'

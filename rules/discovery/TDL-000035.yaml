rule_id: TDL-DIS-000035
v4_id: '000035'
name: SMB Scan - Outbound
description: Detects an internal host scanning for open SMB ports outbound to external hosts. This could indicate an attacker or malware on a
  compromised internal host attempting to scan other hosts to propagate.
tactic: Discovery
tactic_id: TA0007
technique_id: T1046
technique_name: Network Service Scanning
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=firewall action=allowed \n| eval dest_port=tonumber(dest_port)\n| where (dest_port=139 OR dest_port=445) OR (lower(app) IN (\"smb\"\
    , \"samba\"))\n| eval is_internal_src=if(cidrmatch(\"10.0.0.0/8\", src_ip) OR cidrmatch(\"172.16.0.0/12\", src_ip) OR cidrmatch(\"192.168.0.0/16\"\
    , src_ip), 1, 0)\n| eval is_external_dest=if(cidrmatch(\"10.0.0.0/8\", dest_ip) OR cidrmatch(\"172.16.0.0/12\", dest_ip) OR cidrmatch(\"192.168.0.0/16\"\
    , dest_ip), 0, 1)\n| where is_internal_src=1 AND is_external_dest=1\n| bin _time span=5m\n| stats dc(dest_ip) as unique_dest_ips, values(dest_ip)\
    \ as dest_ips, values(dest_port) as dest_ports by _time, src_ip, dest_port\n| where unique_dest_ips >= 10\n| table _time, src_ip, dest_port,\
    \ unique_dest_ips, dest_ips\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(5m)
    | where DeviceDirection =~ "Outbound"
    | where (DestinationPort in (139, 445) or DeviceCustomString2 in~ ("SMB", "Samba") or ApplicationProtocol in~ ("SMB", "Samba"))
    | summarize DestinationCount = dcount(DestinationIP), DestinationIPs = make_set(DestinationIP), Ports = make_set(DestinationPort) by SourceIP, DestinationPort, bin(TimeGenerated, 5m)
    | where DestinationCount >= 10
    | project TimeGenerated, SourceIP, DestinationPort, DestinationCount, DestinationIPs, Ports
  aql: |
    SELECT sourceip, destinationport, UNIQUECOUNT(destinationip) AS unique_destinations, COUNT(*) AS event_count
    FROM events
    WHERE (destinationport IN (139, 445) OR LOWER(applicationname) IN ('smb', 'samba'))
      AND sourceip IN (SELECT sourceip FROM events WHERE sourceip MATCHES '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
      AND destinationip NOT IN (SELECT destinationip FROM events WHERE destinationip MATCHES '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)')
    GROUP BY sourceip, destinationport
    HAVING unique_destinations >= 10
    LAST 5 MINUTES
  yara_l: "rule network_port_scanning_t1046 {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects potential network scanning\
    \ activity - single internal source scanning multiple external destinations on common SMB ports\"\n    mitre_attack_tactic = \"Discovery\"\
    \n    mitre_attack_technique = \"T1046\"\n    severity = \"Medium\"\n\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n  \
    \  $e.metadata.product_log_id = \"FIREWALL\"\n    $e.network.direction = \"OUTBOUND\"\n    \n    (\n      $e.target.port = 139 or\n      $e.target.port\
    \ = 445\n    )\n    \n    (\n      re.regex($e.network.application_protocol, `(?i)smb`) or\n      re.regex($e.network.application_protocol,\
    \ `(?i)samba`)\n    )\n    \n    $e.principal.ip = $src_ip\n    $e.target.ip = $dst_ip\n    $e.target.port = $port\n\n  match:\n    $src_ip,\
    \ $port over 5m\n\n  condition:\n    #dst_ip >= 10\n}\n"
  esql: |
    FROM logs-firewall*
    | WHERE @timestamp > NOW() - 5 minutes
      AND network.direction == "outbound"
      AND (destination.port IN (139, 445) OR TO_LOWER(network.application) IN ("smb", "samba"))
    | STATS dest_count = COUNT_DISTINCT(destination.ip), event_count = COUNT(*) BY source.ip, destination.port, bucket = BUCKET(@timestamp, 5 minutes)
    | WHERE dest_count >= 10 AND event_count >= 10
    | KEEP source.ip, destination.port, dest_count, event_count, bucket
  leql: |
    where(direction=OUTBOUND AND (destination_port IN [139, 445] OR application ICONTAINS "smb" OR application ICONTAINS "samba")) groupby(source_address, destination_port) calculate(unique:destination_address)
  crowdstrike: |
    #type=firewall action=allowed direction=outbound (dest_port=139 OR dest_port=445 OR application=/(?i)smb/ OR application=/(?i)samba/)
    | groupBy([src_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_destinations)], limit=max)
    | event_count >= 10 AND unique_destinations >= 10
    | table([src_ip, dest_port, event_count, unique_destinations])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter dest_port in (139, 445) or lowercase(app) in ("smb", "samba")
    | filter action_source_translated_ip_type = "Private" and action_destination_translated_ip_type != "Private"
    | bin _time span=5m
    | comp count_distinct(dest_ip) as unique_dests by _time, source_ip, dest_port
    | filter unique_dests >= 10
  lucene: |
    (destination.port:(139 OR 445) OR application:(/[Ss][Mm][Bb]/ OR /[Ss][Aa][Mm][Bb][Aa]/)) AND source.ip:/10\.\d+\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|192\.168\.\d+\.\d+/ AND NOT destination.ip:/10\.\d+\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[0-1])\.\d+\.\d+|192\.168\.\d+\.\d+/
  sumo: |
    _sourceCategory=*firewall* OR _sourceCategory=*Firewall*
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "dest_port" as dest_port
    | json field=_raw "application" as application
    | json field=_raw "direction" as direction
    | parse "src_ip=*;" as src_ip nodrop
    | parse "dest_ip=*;" as dest_ip nodrop
    | parse "dest_port=*;" as dest_port nodrop
    | parse "application=*;" as application nodrop
    | parse "direction=*;" as direction nodrop
    | where (dest_port in ("139", "445") OR toLowerCase(application) matches "*smb*" OR toLowerCase(application) matches "*samba*")
    | where direction matches "*outbound*" OR direction matches "*out*"
    | timeslice 5m
    | count_distinct(dest_ip) as unique_destinations by _timeslice, src_ip, dest_port
    | where unique_destinations >= 10
    | fields _timeslice, src_ip, dest_port, unique_destinations
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "10 Firewall Event \nFrom one internal source to many external destinations (Outbound)\nOR\n\tWhere the Destination Port is in [139,\
  \ 445]\n\t\n\tWhere the Application is in [SMB, Samba] case insensitive \n\t\nWith the same Destination Port\nWith unique Destination IPs\n\
  From single Source IP\nWithin 5 minutes"
suppression:
  window: 12 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine whether the enumeration is targeted (specific user / share
  / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

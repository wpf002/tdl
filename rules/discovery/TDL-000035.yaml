rule_id: TDL-DIS-000035
v4_id: '000035'
name: SMB Scan - Outbound
description: Detects an internal host scanning for open SMB ports outbound to external hosts. This could indicate an attacker or malware on a
  compromised internal host attempting to scan other hosts to propagate.
tactic: Discovery
tactic_id: TA0007
technique_id: T1046
technique_name: Network Service Scanning
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=firewall action=allowed \n| eval dest_port=tonumber(dest_port)\n| where (dest_port=139 OR dest_port=445) OR (lower(app) IN (\"smb\"\
    , \"samba\"))\n| eval is_internal_src=if(cidrmatch(\"10.0.0.0/8\", src_ip) OR cidrmatch(\"172.16.0.0/12\", src_ip) OR cidrmatch(\"192.168.0.0/16\"\
    , src_ip), 1, 0)\n| eval is_external_dest=if(cidrmatch(\"10.0.0.0/8\", dest_ip) OR cidrmatch(\"172.16.0.0/12\", dest_ip) OR cidrmatch(\"192.168.0.0/16\"\
    , dest_ip), 0, 1)\n| where is_internal_src=1 AND is_external_dest=1\n| bin _time span=5m\n| stats dc(dest_ip) as unique_dest_ips, values(dest_ip)\
    \ as dest_ips, values(dest_port) as dest_ports by _time, src_ip, dest_port\n| where unique_dest_ips >= 10\n| table _time, src_ip, dest_port,\
    \ unique_dest_ips, dest_ips\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where destination_port in ("139", "445")

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "destination_port" IN (''139'', ''445'')

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_dis_000035 {\n  meta:\n    author = \"TDL\"\n    description = \"SMB Scan - Outbound\"\n    severity = \"MEDIUM\"\n  \
    \  tactic = \"TA0007\"\n    technique = \"T1046\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.destination_port\
    \ = /(139|445)/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND destination_port IN ("139", "445")

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND destination_port IN [139, 445])

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND destination_port IN (139, 445)

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND destination_port in ("139", "445")

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND destination_port:(139 OR 445)

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where destination_port IN ("139", "445")

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "10 Firewall Event \nFrom one internal source to many external destinations (Outbound)\nOR\n\tWhere the Destination Port is in [139,\
  \ 445]\n\t\n\tWhere the Application is in [SMB, Samba] case insensitive \n\t\nWith the same Destination Port\nWith unique Destination IPs\n\
  From single Source IP\nWithin 5 minutes"
suppression:
  window: 12 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine whether the enumeration is targeted (specific user / share
  / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

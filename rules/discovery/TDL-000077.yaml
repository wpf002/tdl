rule_id: TDL-DIS-000077
v4_id: '000077'
name: Vulnerability Scan - Inbound
description: Detects a vulnerability scan from an external host to an internal host. Attackers will use vulnerability scans to perform reconnaissance
  to determine vulnerable services on the target.
tactic: Discovery
tactic_id: TA0007
technique_id: T1046
technique_name: Network Service Discovery
platform:
- Network
data_sources:
- IDS/IPS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=network sourcetype=suricata (action=blocked OR action=alerted OR alert_category=*exploit*) src_ip!=10.0.0.0/8 src_ip!=172.16.0.0/12
    src_ip!=192.168.0.0/16 (dest_ip=10.0.0.0/8 OR dest_ip=172.16.0.0/12 OR dest_ip=192.168.0.0/16)

    | bin _time span=5m

    | stats dc(signature) as unique_sigs, count by _time, src_ip, dest_ip

    | where count >= 10 AND unique_sigs >= 10

    | table _time, src_ip, dest_ip, unique_sigs, count

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(5m)
    | where DeviceVendor in ("Palo Alto Networks", "Fortinet", "Check Point", "Cisco", "Snort", "Suricata")
    | where DeviceAction in ("blocked", "alerted", "detected") or Activity has_any ("IDS", "IPS", "Intrusion")
    | where isnotempty(SourceIP) and isnotempty(DestinationIP)
    | where ipv4_is_private(DestinationIP) == true and ipv4_is_private(SourceIP) == false
    | summarize SignatureCount = dcount(DeviceEventClassID), EventCount = count(), Signatures = make_set(DeviceEventClassID) by SourceIP, DestinationIP, bin(TimeGenerated, 5m)
    | where SignatureCount >= 10 and EventCount >= 10
    | project TimeGenerated, SourceIP, DestinationIP, EventCount, SignatureCount, Signatures
  aql: |
    SELECT sourceip, destinationip, UNIQUECOUNT(qid) AS unique_signatures, COUNT(*) AS total_events
    FROM events
    WHERE category IN (SELECT category FROM categories WHERE high_level_category_id = 4001)
      AND INOFFENSE(sourceip, 'RemoteAddress') = FALSE
      AND INOFFENSE(destinationip, 'LocalAddress') = TRUE
    GROUP BY sourceip, destinationip
    HAVING total_events >= 10 AND unique_signatures >= 10
    LAST 5 MINUTES
  yara_l: "rule network_scanning_multiple_exploits {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects network scanning\
    \ via 10+ unique IDS/IPS exploit signatures from one external source to one internal destination within 5 minutes\"\n    mitre_attack_tactic\
    \ = \"Discovery\"\n    mitre_attack_technique = \"T1046\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.security_result.detection_fields.key\
    \ = \"signature_id\"\n    $e.security_result.category_details = \"exploit\"\n    $e.network.direction = \"INBOUND\"\n    not net.ip_in_range_cidr($e.principal.ip,\
    \ \"10.0.0.0/8\")\n    not net.ip_in_range_cidr($e.principal.ip, \"172.16.0.0/12\")\n    not net.ip_in_range_cidr($e.principal.ip, \"192.168.0.0/16\"\
    )\n    net.ip_in_range_cidr($e.target.ip, \"10.0.0.0/8\") or\n    net.ip_in_range_cidr($e.target.ip, \"172.16.0.0/12\") or\n    net.ip_in_range_cidr($e.target.ip,\
    \ \"192.168.0.0/16\")\n    $e.principal.ip = $src_ip\n    $e.target.ip = $dst_ip\n    $e.security_result.detection_fields.value = $signature\n\
    \    \n  match:\n    $src_ip, $dst_ip over 5m\n    \n  outcome:\n    $risk_score = max(85)\n    $unique_signatures = count_distinct($signature)\n\
    \    \n  condition:\n    #e >= 10 and $unique_signatures >= 10\n}\n"
  esql: "FROM logs-network_traffic.ids* \n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.category == \"intrusion_detection\" \n  AND event.kind\
    \ == \"alert\"\n  AND source.nat.ip IS NOT NULL \n  AND destination.ip IS NOT NULL\n  AND network.direction == \"inbound\"\n| STATS unique_sigs\
    \ = COUNT_DISTINCT(event.id), event_count = COUNT(*) BY source.ip, destination.ip, window = BUCKET(@timestamp, 5 minutes)\n| WHERE unique_sigs\
    \ >= 10\n| KEEP source.ip, destination.ip, unique_sigs, event_count, window\n"
  leql: |
    where(log_source_type="IDS/IPS" AND direction=INBOUND AND event_type="Exploit") groupby(source_address, destination_address) calculate(unique:signature_id)
  crowdstrike: |
    #type=ids event_simpleName=*Intrusion* direction=inbound
    | groupBy([src_ip, dest_ip], function=[count(signature_id, distinct=true, as=unique_sigs), count(as=total_events)])
    | unique_sigs >= 10
    | total_events >= 10
    | table([src_ip, dest_ip, unique_sigs, total_events])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action in ("alert", "drop", "reset-both") and rule_matched_threat != null
    | filter dest_ip_is_public = false and src_ip_is_public = true
    | bin _time span=5m
    | comp count_distinct(rule_matched_threat) as unique_sigs by _time, source_ipv4, dest_ipv4
    | filter unique_sigs >= 10
    | fields _time, source_ipv4, dest_ipv4, unique_sigs
  lucene: |
    event.category:intrusion_detection AND event.type:alert AND network.direction:inbound AND NOT source.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16) AND destination.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16)
  sumo: |
    _sourceCategory=*IDS* OR _sourceCategory=*IPS*
    | json field=_raw "src_ip" as src_ip
    | json field=_raw "dest_ip" as dest_ip
    | json field=_raw "signature" as signature
    | json field=_raw "category" as category
    | json field=_raw "direction" as direction
    | where category matches "*exploit*" and (direction = "inbound" OR direction = "Inbound")
    | timeslice 5m
    | count_distinct(signature) as unique_sigs, count as total_events by _timeslice, src_ip, dest_ip
    | where unique_sigs >= 10 and total_events >= 10
    | fields _timeslice, src_ip, dest_ip, unique_sigs, total_events
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "10 IDS/IPS Exploit Events \nFrom one external source to one internal destination (Inbound)\nWith unique Signatures \nWithin 5 minutes"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine whether the enumeration is targeted (specific user / share
  / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

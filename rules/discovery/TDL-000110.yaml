rule_id: TDL-DIS-000110
v4_id: '000110'
name: Unauthorized Access to Admin Share
description: A report that provides visibility into unauthorized users accessing the ADMIN$ share.
tactic: Discovery
tactic_id: TA0007
technique_id: T1135
technique_name: Network Share Discovery
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5140'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=5140 OR EventCode=5145) Share_Name="\\*\\ADMIN$" NOT [| inputlookup authorized_admin_share_users.csv
    | fields Source_Username] NOT Source_Username="*$"

    | table _time, ComputerName, Source_Username, Share_Name, EventCode, Source_Address

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (5140, 5145)
    | where ShareName =~ "\\\\*\\ADMIN$"
    | where SubjectUserName !endswith "$"
    | where SubjectUserName !in~ ("<authorized_user1>", "<authorized_user2>")
    | project TimeGenerated, Computer, SubjectUserName, ShareName, EventID, IpAddress, IpPort
  aql: |
    SELECT username, sourceip, "Share Name", LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS access_count
    FROM events
    WHERE "EventID" IN ('5140', '5145')
      AND "Share Name" ILIKE '%\\ADMIN$'
      AND username NOT LIKE '%$'
    LAST 24 HOURS
  yara_l: |
    rule network_share_access_admin_share {
      meta:
        author = "Detection Engineer"
        description = "Detects access to ADMIN$ share by unauthorized users (T1135)"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1135"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.metadata.product_event_type = /5140|5145/
        re.regex($e.target.resource.name, `(?i)^\\\\\*\\ADMIN\$$`)
        not re.regex($e.principal.user.userid, `\$$`)
        $e.principal.user.userid = $user
        $e.principal.hostname = $host

      match:
        $host, $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.security*\n| WHERE event.code IN (\"5140\", \"5145\") \n  AND winlog.event_data.ShareName LIKE\
    \ \"*\\\\ADMIN$\"\n  AND NOT ENDS_WITH(user.name, \"$\")\n| KEEP @timestamp, host.name, user.name, source.ip, winlog.event_data.ShareName,\
    \ winlog.event_data.AccessMask\n"
  leql: |
    where(source_json.EventID IN [5140, 5145] AND source_json.ShareName ICONTAINS "\\ADMIN$" AND source_json.SubjectUserName NOT ENDS-WITH "$")
  crowdstrike: |
    EventCode IN [5140, 5145] ShareName="\\*\\ADMIN$" NOT (UserName IN ["Administrator", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE"]) NOT UserName=*$
    | table([@timestamp, ComputerName, UserName, ShareName, IpAddress, IpPort])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (5140, 5145)
    | filter action_evtlog_event_data_ShareName ~= ".*\\\\ADMIN\\$"
    | filter not action_evtlog_event_data_SubjectUserName ~= ".*\\$$"
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_ShareName, action_evtlog_event_data_IpAddress
  lucene: |
    event.code:(5140 OR 5145) AND winlog.event_data.ShareName:*\\ADMIN$ AND NOT winlog.event_data.SubjectUserName:*$ AND NOT winlog.event_data.SubjectUserName:(authorizeduser1 OR authorizeduser2 OR authorizeduser3)
  sumo: |
    _sourceCategory=*Windows* ("5140" OR "5145")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ShareName" as share_name
    | json field=_raw "SubjectUserName" as source_user
    | where event_id in ("5140", "5145")
    | where share_name matches "*\\ADMIN$"
    | where !(source_user matches "*$")
    | fields _messageTime, _sourceHost, event_id, share_name, source_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Network Share Accessed Event

  Where the Event ID is in [5140, 5145]

  Where the Share Name is "\\*\ADMIN$"

  Where the Source Username is NOT in the Users Authorized to Access the Admin Share List

  Where the Source Username does NOT end with "$"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

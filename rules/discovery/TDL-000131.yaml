rule_id: TDL-DIS-000131
v4_id: '000131'
name: AWS User Enumeration
description: Detects when a host executes AWS API calls that match enumeration tool behavior. Once an attacker obtains an API key for a user,
  they will attempt to enumerate the permissions of the user to determine which API calls they can use.
tactic: Discovery
tactic_id: TA0007
technique_id: T1069
technique_name: Permission Groups Discovery
platform:
- AWS
data_sources:
- Amazon AWS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName IN ("ListAccessKeys","ListUserPolicies","ListGroupsForUser","GetGroupPolicy","GetUser","ListQueues","DescribeDBSnapshots","DescribePermissions","GetAccountAuthorizationDetails","GetUserPolicy","ListPolicies","ListEntitiesForPolicy","GetAccountPasswordPolicy","ListUsers")
    userAgent!="signin.amazonaws.com"

    | bin _time span=1m

    | stats count dc(eventName) as unique_events values(eventName) as event_names by _time, sourceIPAddress, userIdentity.userName

    | where count >= 5 AND unique_events >= 2 AND userIdentity.userName!="*admin*"

    | table _time, sourceIPAddress, userIdentity.userName, count, unique_events, event_names

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName in ("ListAccessKeys", "ListUserPolicies", "ListGroupsForUser", "GetGroupPolicy", "GetUser", "ListQueues", "DescribeDBSnapshots", "DescribePermissions", "GetAccountAuthorizationDetails", "GetUserPolicy", "ListPolicies", "ListEntitiesForPolicy", "GetAccountPasswordPolicy", "ListUsers")
    | where UserAgent != "signin.amazonaws.com"
    | where UserIdentityUserName !in (_GetWatchlist('AmazonAWSAdminUserList') | project UserName)
    | extend SourceIP = SourceIpAddress, SourceUsername = UserIdentityUserName
    | summarize EventCount = count(), UniqueEventNames = dcount(EventName), EventNamesList = make_set(EventName), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by bin(TimeGenerated, 1m), SourceIP, SourceUsername
    | where EventCount >= 5 and UniqueEventNames >= 2
    | where datetime_diff('minute', EndTime, StartTime) <= 1
    | project TimeGenerated, SourceIP, SourceUsername, EventCount, UniqueEventNames, EventNamesList, StartTime, EndTime
  aql: |
    SELECT sourceip, username, UNIQUECOUNT(qidname(qid)) AS unique_events, COUNT(*) AS event_count, QIDNAME(qid)
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%AWS%CloudTrail%'
      AND (qidname(qid) IN ('ListAccessKeys', 'ListUserPolicies', 'ListGroupsForUser', 'GetGroupPolicy', 'GetUser', 'ListQueues', 'DescribeDBSnapshots', 'DescribePermissions', 'GetAccountAuthorizationDetails', 'GetUserPolicy', 'ListPolicies', 'ListEntitiesForPolicy', 'GetAccountPasswordPolicy', 'ListUsers')
           OR qidname(qid) ILIKE '%ListAccessKeys%' OR qidname(qid) ILIKE '%ListUserPolicies%' OR qidname(qid) ILIKE '%ListGroupsForUser%' OR qidname(qid) ILIKE '%GetGroupPolicy%' OR qidname(qid) ILIKE '%GetUser%' OR qidname(qid) ILIKE '%ListQueues%' OR qidname(qid) ILIKE '%DescribeDBSnapshots%' OR qidname(qid) ILIKE '%DescribePermissions%' OR qidname(qid) ILIKE '%GetAccountAuthorizationDetails%' OR qidname(qid) ILIKE '%GetUserPolicy%' OR qidname(qid) ILIKE '%ListPolicies%' OR qidname(qid) ILIKE '%ListEntitiesForPolicy%' OR qidname(qid) ILIKE '%GetAccountPasswordPolicy%' OR qidname(qid) ILIKE '%ListUsers%')
      AND username NOT ILIKE '%signin.amazonaws.com%'
    GROUP BY sourceip, username
    HAVING event_count >= 5 AND unique_events >= 2
    LAST 1 MINUTES
  yara_l: "rule aws_discovery_enumeration {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS account discovery enumeration (T1069)\"\
    \n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1069\"\n    severity = \"Medium\"\n  \n  events:\n    $e.metadata.vendor_name\
    \ = \"AMAZON\"\n    $e.metadata.product_name = \"AWS CloudTrail\"\n    (\n      $e.metadata.product_event_type = \"ListAccessKeys\" or\n \
    \     $e.metadata.product_event_type = \"ListUserPolicies\" or\n      $e.metadata.product_event_type = \"ListGroupsForUser\" or\n      $e.metadata.product_event_type\
    \ = \"GetGroupPolicy\" or\n      $e.metadata.product_event_type = \"GetUser\" or\n      $e.metadata.product_event_type = \"ListQueues\" or\n\
    \      $e.metadata.product_event_type = \"DescribeDBSnapshots\" or\n      $e.metadata.product_event_type = \"DescribePermissions\" or\n  \
    \    $e.metadata.product_event_type = \"GetAccountAuthorizationDetails\" or\n      $e.metadata.product_event_type = \"GetUserPolicy\" or\n\
    \      $e.metadata.product_event_type = \"ListPolicies\" or\n      $e.metadata.product_event_type = \"ListEntitiesForPolicy\" or\n      $e.metadata.product_event_type\
    \ = \"GetAccountPasswordPolicy\" or\n      $e.metadata.product_event_type = \"ListUsers\"\n    )\n    $e.network.http.user_agent != \"signin.amazonaws.com\"\
    \n    $e.principal.ip = $source_ip\n    $e.principal.user.userid = $username\n    $e.metadata.product_event_type = $event_name\n\n  match:\n\
    \    $source_ip, $username over 1m\n\n  outcome:\n    $risk_score = 50\n\n  condition:\n    #e >= 5 and #event_name >= 2\n}\n"
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE @timestamp > NOW() - 1 hour
      AND event.action IN ("ListAccessKeys", "ListUserPolicies", "ListGroupsForUser", "GetGroupPolicy", "GetUser", "ListQueues", "DescribeDBSnapshots", "DescribePermissions", "GetAccountAuthorizationDetails", "GetUserPolicy", "ListPolicies", "ListEntitiesForPolicy", "GetAccountPasswordPolicy", "ListUsers")
      AND user_agent != "signin.amazonaws.com"
    | STATS event_count = COUNT(*), unique_events = COUNT_DISTINCT(event.action), start_time = MIN(@timestamp), end_time = MAX(@timestamp) BY source.ip, user.name, time_bucket = BUCKET(@timestamp, 1 minute)
    | WHERE event_count >= 5 AND unique_events >= 2
    | EVAL time_diff_seconds = (end_time - start_time) / 1000
    | WHERE time_diff_seconds <= 60
    | KEEP time_bucket, source.ip, user.name, event_count, unique_events, start_time, end_time
  leql: |
    where(source_json.eventSource=/iam\.amazonaws\.com|sqs\.amazonaws\.com|rds\.amazonaws\.com|opsworks\.amazonaws\.com/ AND source_json.eventName IN [ListAccessKeys, ListUserPolicies, ListGroupsForUser, GetGroupPolicy, GetUser, ListQueues, DescribeDBSnapshots, DescribePermissions, GetAccountAuthorizationDetails, GetUserPolicy, ListPolicies, ListEntitiesForPolicy, GetAccountPasswordPolicy, ListUsers] AND source_json.userAgent != "signin.amazonaws.com") groupby(source_json.sourceIPAddress, source_json.userIdentity.userName) calculate(count), calculate(unique:source_json.eventName)
  crowdstrike: |
    #repo=aws_cloudtrail
    | eventName in [ListAccessKeys, ListUserPolicies, ListGroupsForUser, GetGroupPolicy, GetUser, ListQueues, DescribeDBSnapshots, DescribePermissions, GetAccountAuthorizationDetails, GetUserPolicy, ListPolicies, ListEntitiesForPolicy, GetAccountPasswordPolicy, ListUsers]
    | userAgent != "signin.amazonaws.com"
    | groupBy([sourceIPAddress, userIdentity.principalId], function=([count(as=event_count), count(eventName, distinct=true, as=unique_events), collect([eventName, @timestamp, userAgent, userIdentity.arn])], limit=max))
    | event_count >= 5
    | unique_events >= 2
    | table([sourceIPAddress, userIdentity.principalId, event_count, unique_events])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and operation_name in ("ListAccessKeys","ListUserPolicies","ListGroupsForUser","GetGroupPolicy","GetUser","ListQueues","DescribeDBSnapshots","DescribePermissions","GetAccountAuthorizationDetails","GetUserPolicy","ListPolicies","ListEntitiesForPolicy","GetAccountPasswordPolicy","ListUsers")
    | filter user_agent != "signin.amazonaws.com"
    | filter identity_name not in (amazon_aws_admin_user_list)
    | bin _time span = 1m
    | comp count() as event_count, count_distinct(operation_name) as unique_events by _time, identity_orig, identity_name
    | filter event_count >= 5 and unique_events >= 2
    | fields _time, identity_orig, identity_name, event_count, unique_events
  lucene: |
    event.provider:cloudtrail.amazonaws.com AND event.action:(ListAccessKeys OR ListUserPolicies OR ListGroupsForUser OR GetGroupPolicy OR GetUser OR ListQueues OR DescribeDBSnapshots OR DescribePermissions OR GetAccountAuthorizationDetails OR GetUserPolicy OR ListPolicies OR ListEntitiesForPolicy OR GetAccountPasswordPolicy OR ListUsers) AND NOT user_agent:"signin.amazonaws.com"
  sumo: "_sourceCategory=*cloudtrail* \n| json field=_raw \"eventName\" as event_name\n| json field=_raw \"sourceIPAddress\" as source_ip\n| json\
    \ field=_raw \"userIdentity.userName\" as source_username\n| json field=_raw \"userAgent\" as user_agent\n| where event_name in (\"ListAccessKeys\"\
    , \"ListUserPolicies\", \"ListGroupsForUser\", \"GetGroupPolicy\", \"GetUser\", \"ListQueues\", \"DescribeDBSnapshots\", \"DescribePermissions\"\
    , \"GetAccountAuthorizationDetails\", \"GetUserPolicy\", \"ListPolicies\", \"ListEntitiesForPolicy\", \"GetAccountPasswordPolicy\", \"ListUsers\"\
    )\n| where user_agent != \"signin.amazonaws.com\"\n| where !(source_username matches \"*admin*\" or source_username matches \"*root*\")\n\
    | timeslice 1m\n| count as event_count, count_distinct(event_name) as unique_events by _timeslice, source_ip, source_username\n| where event_count\
    \ >= 5 and unique_events >= 2\n| fields _timeslice, source_ip, source_username, event_count, unique_events\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 AWS CloudTrail Events

  From the same Source IP and Source Username

  Where the Event Name is in [ListAccessKeys, ListUserPolicies, ListGroupsForUser, GetGroupPolicy, GetUser, ListQueues, DescribeDBSnapshots, DescribePermissions,GetAccountAuthorizationDetails,GetUserPolicy,ListAccessKeys,ListPolicies,ListEntitiesForPolicy,GetAccountPasswordPolicy,ListUsers]

  Where the User Agent is NOT "signin.amazonaws.com"

  Where the Source Username is NOT on the Amazon AWS Admin User List

  With at least 2 unique Event Names

  Within 1 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

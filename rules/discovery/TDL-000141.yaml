rule_id: TDL-DIS-000141
v4_id: '000141'
name: File Share Enumeration
description: Detects an attacker attempting to enumerate file shares on the network from a single host.
tactic: Discovery
tactic_id: TA0007
technique_id: T1135
technique_name: Network Share Discovery
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5140'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=5140 OR EventCode=5145)

    | bin _time span=2m

    | stats dc(Share_Name) as unique_shares values(Share_Name) as share_names by _time, Source_Network_Address

    | where unique_shares >= 3

    | table _time, Source_Network_Address, unique_shares, share_names

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(2m)
    | where EventID in (5140, 5145)
    | extend SourceIP = IpAddress
    | summarize ShareNames = make_set(ShareName), ShareCount = dcount(ShareName), Computer = any(Computer), Account = any(Account) by bin(TimeGenerated, 2m), SourceIP
    | where ShareCount >= 3
    | project TimeGenerated, SourceIP, Computer, Account, ShareCount, ShareNames
  aql: |
    SELECT sourceip, UNIQUECOUNT("Share Name") AS unique_shares, COUNT(*) AS event_count, QIDNAME(qid) AS event_name
    FROM events
    WHERE "EventID" IN ('5140', '5145')
    GROUP BY sourceip
    HAVING unique_shares >= 3 AND event_count >= 3
    LAST 2 MINUTES
  yara_l: "rule network_share_enumeration {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects potential network share\
    \ enumeration via multiple distinct share accesses from same source\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique\
    \ = \"T1135\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.product_event_type\
    \ = /^(5140|5145)$/\n    $e.principal.ip = $source_ip\n    $e.target.resource.name = $share_name\n    \n  match:\n    $source_ip over 2m\n\
    \    \n  outcome:\n    $risk_score = 50\n    $unique_shares = count_distinct($share_name)\n    \n  condition:\n    #e >= 3 and $unique_shares\
    \ >= 3\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 2 minutes AND event.code IN ("5140", "5145")
    | STATS unique_shares = COUNT_DISTINCT(winlog.event_data.ShareName) BY source.ip, win = BUCKET(@timestamp, 2 minutes)
    | WHERE unique_shares >= 3
  leql: |
    where(source_json.EventID IN [5140, 5145]) groupby(source_address) calculate(unique:source_json.ShareName)
  crowdstrike: |
    EventCode IN [5140, 5145]
    | bucket(span=2m, field=@timestamp, as=window)
    | groupBy([window, IpAddress], function=[count(ShareName, distinct=true, as=uniqueShares), count(as=totalEvents)])
    | uniqueShares >= 3
    | table([window, IpAddress, uniqueShares, totalEvents])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (5140, 5145)
    | bin _time span=2m
    | alter source_ip = action_evtlog_event_data_IpAddress, share_name = action_evtlog_event_data_ShareName
    | comp count_distinct(share_name) as unique_shares by _time, source_ip
    | filter unique_shares >= 3
  lucene: |
    event.code:(5140 OR 5145)
  sumo: |
    _sourceCategory=*Windows* (5140 OR 5145)
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "ShareName" as share_name
    | where event_id in ("5140", "5145")
    | timeslice 2m
    | count_distinct(share_name) as unique_shares by _timeslice, src_ip
    | where unique_shares >= 3
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '3 Windows Network Share Object Accessed Events

  Where the Event ID is in [5140, 5145]

  With the same Source IP

  With unique Share Names

  Within 2 minutes'
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

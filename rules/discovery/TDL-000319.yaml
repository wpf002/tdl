rule_id: TDL-DIS-000319
v4_id: 000319
name: Calls for List Buckets Potential Enumeration - GCP
description: Detects a service account listing buckets which may be an attempt to enumerate the list of buckets within an instance. Service accounts
  typically do not need to list storage buckets because they are already configured to access the buckets they need.
tactic: Discovery
tactic_id: TA0007
technique_id: T1083
technique_name: T1083
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=google:gcp:pubsub:message methodName="storage.buckets.list"

    | table _time, principalEmail, callerIp, methodName, resource.labels.project_id, severity

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName has "storage.buckets.list"
    | project TimeGenerated, CallerIpAddress, PrincipalEmail, MethodName, ResourceName, ServiceName, RequestMetadata
  aql: |
    SELECT eventtime, username, sourceip, "message.data.protoPayload.methodName", "message.data.protoPayload.serviceName", "message.data.protoPayload.resourceName", COUNT(*) AS event_count
    FROM events
    WHERE "message.data.protoPayload.methodName" ILIKE '%storage.buckets.list%'
    GROUP BY eventtime, username, sourceip, "message.data.protoPayload.methodName", "message.data.protoPayload.serviceName", "message.data.protoPayload.resourceName"
    LAST 24 HOURS
  yara_l: |
    rule gcp_storage_bucket_enumeration {
      meta:
        author = "Detection Engineer"
        description = "Detects GCP Storage bucket enumeration via storage.buckets.list API calls (MITRE T1083)"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1083"
        severity = "Low"

      events:
        $e.metadata.vendor_name = "Google Cloud Platform"
        $e.metadata.product_name = "GCP"
        $e.metadata.log_type = "GCP_CLOUDAUDIT_ACTIVITY"
        re.regex($e.target.resource.attribute.labels["method_name"], `storage\.buckets\.list`)
        $e.principal.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-gcp.audit*
    | WHERE message.data.protoPayload.methodName LIKE "*storage.buckets.list*"
    | KEEP @timestamp, cloud.account.id, cloud.project.id, user.name, source.ip, message.data.protoPayload.methodName, message.data.protoPayload.resourceName
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "storage.buckets.list")
  crowdstrike: |
    #type=gcp:audit message.data.protoPayload.methodName=*storage.buckets.list*
    | table([@timestamp, message.data.protoPayload.authenticationInfo.principalEmail, message.data.protoPayload.methodName, message.data.protoPayload.requestMetadata.callerIp, message.data.resource.labels.project_id])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = GCP and raw_log.protoPayload.methodName contains "storage.buckets.list"
    | fields _time, cloud_provider, raw_log.protoPayload.authenticationInfo.principalEmail, raw_log.protoPayload.methodName, raw_log.protoPayload.requestMetadata.callerIp, raw_log.resource.labels.project_id
  lucene: |
    message.data.protoPayload.methodName:*storage.buckets.list*
  sumo: |
    _sourceCategory=*GCP* *storage.buckets.list*
    | json field=_raw "message.data.protoPayload.methodName" as method_name
    | where method_name matches "*storage.buckets.list*"
    | fields _messageTime, _sourceHost, method_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  Where message.data.protoPayload.methodName contains storage.buckets.list'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

rule_id: TDL-DIS-000323
v4_id: '000323'
name: Service Account Accessing Anomalous Number of GCP APIs - GCP
description: GCP account accessing more than the usual number of API could be indicative of a compromised account.
tactic: Discovery
tactic_id: TA0007
technique_id: T1850
technique_name: T1850
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit *gserviceaccount*

    | eval src_user=coalesce(user, userIdentity.principalEmail, protoPayload.authenticationInfo.principalEmail)

    | where like(src_user, "%gserviceaccount%")

    | eval api_call=coalesce(protoPayload.methodName, methodName, event_name)

    | stats dc(api_call) as unique_api_count values(api_call) as api_calls by src_user

    | where unique_api_count > 0

    | table src_user, unique_api_count, api_calls

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where Identity has "gserviceaccount"
    | summarize UniqueAPIs = dcount(MethodName) by Identity
    | where UniqueAPIs >= 1
    | project TimeGenerated, Identity, UniqueAPIs
  aql: |
    SELECT username AS src_user, UNIQUECOUNT(qidname(qid)) AS unique_apis, COUNT(*) AS total_events
    FROM events
    WHERE logsourcetypename(logsourcetypeid) ILIKE '%GCP%'
      AND username ILIKE '%gserviceaccount%'
    GROUP BY username
    LAST 24 HOURS
  yara_l: |
    rule gcp_service_account_api_discovery {
      meta:
        author = "Detection Engineer"
        description = "Detects GCP service account enumerating multiple APIs - MITRE T1850"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1850"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Google Cloud Platform"
        $e.metadata.product_name = "GCP"
        $e.metadata.log_type = "GCP_CLOUDAUDIT"
        re.regex($e.principal.user.userid, `.*gserviceaccount\.com$`)
        $e.principal.user.userid = $user
        $e.target.resource.attribute.labels["method"] = $api

      match:
        $user over 1h

      outcome:
        $risk_score = 35
        $unique_apis = count_distinct($api)

      condition:
        #api >= 10
    }
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND user.name LIKE \"*gserviceaccount*\"\n| STATS unique_apis = COUNT_DISTINCT(event.action)\
    \ BY user.name\n| WHERE unique_apis >= 1\n| SORT unique_apis DESC\n"
  leql: |
    where(source_user ICONTAINS "gserviceaccount") groupby(source_user) calculate(unique:api)
  crowdstrike: |
    #type=gcp_audit user=*gserviceaccount*
    | groupBy([user], function=count(api, distinct=true, as=unique_apis))
    | table([user, unique_apis])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and actor_user ~= ".*gserviceaccount.*"
    | comp count_distinct(operation) as unique_apis by actor_user
    | filter unique_apis > 0
  lucene: |
    event.dataset:"gcp.audit" AND user.name:*gserviceaccount*
  sumo: |
    _sourceCategory=*GCP* *audit*
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as src_user
    | json field=_raw "protoPayload.methodName" as api_method
    | where src_user matches "*gserviceaccount*"
    | count_distinct(api_method) as unique_apis by src_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "Cloud Audit event\nwhere source user contains gserviceaccount \nCount unique API's by src_user"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

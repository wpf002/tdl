rule_id: TDL-DIS-000325
v4_id: '000325'
name: Excessive Failures by User - GCP
description: Detects when a Non-Service account fails more 10 actions within five minutes. This activity could be indicative of a threat actor
  testing what permissions an account has.
tactic: Discovery
tactic_id: TA0007
technique_id: T1078
technique_name: Valid Accounts
platform:
- GCP
data_sources:
- GCP
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=gcp sourcetype="google:gcp:pubsub:message" code=7 NOT src_user="*gserviceaccount*"

    | bin _time span=5m

    | stats count by _time, src_user

    | where count >= 10

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(5m)
    | where StatusCode == 7
    | where IdentityName !endswith "gserviceaccount.com"
    | summarize event_count = count() by bin(TimeGenerated, 5m), IdentityName, ProjectId
    | where event_count >= 10
  aql: |
    SELECT src_user, sourceip, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%gcp%'
      AND "Code" = '7'
      AND src_user NOT ILIKE '%gserviceaccount%'
    GROUP BY src_user, sourceip
    HAVING event_count >= 10
    LAST 5 MINUTES
  yara_l: "rule gcp_multiple_permission_denied_events {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects 10+ GCP permission\
    \ denied events (code 7) within 5 minutes from non-service accounts\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"Medium\"\n  \n  events:\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\n    $e.metadata.product_name\
    \ = \"GCP\"\n    $e.metadata.log_type = \"GCP_CLOUDAUDIT\"\n    $e.security_result.action = \"BLOCK\"\n    $e.security_result.detection_fields[\"\
    code\"] = \"7\"\n    not re.regex($e.principal.user.userid, `.*gserviceaccount\\.com$`)\n    $e.principal.user.userid = $user\n    \n  match:\n\
    \    $user over 5m\n    \n  condition:\n    #e >= 10\n}\n"
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.code == \"7\" \n  AND NOT user.name LIKE \"*gserviceaccount*\"\
    \n| STATS event_count = COUNT(*) BY user.name, source.ip, bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE event_count >= 10\n| KEEP bucket,\
    \ user.name, source.ip, event_count\n"
  leql: |
    where(source_json.protoPayload.status.code=7 AND source_user NOT ICONTAINS "gserviceaccount") groupby(source_user) calculate(count)
  crowdstrike: "#type=gcp_audit protoPayload.status.code=7 \n| protoPayload.authenticationInfo.principalEmail != \"*gserviceaccount.com\"\n| bucket(span=5m,\
    \ function=[count(as=event_count), collect([protoPayload.authenticationInfo.principalEmail, protoPayload.resource.labels.project_id])])\n\
    | event_count >= 10\n| table([@timestamp, protoPayload.authenticationInfo.principalEmail, protoPayload.resource.labels.project_id, event_count])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "GCP" and operation_status_code = 7 and actor_user !~= ".*gserviceaccount.*"
    | bin _time span=5m
    | comp count() as event_count by _time, actor_user, project_id
    | filter event_count >= 10
    | fields _time, actor_user, project_id, event_count
  lucene: |
    event.code:7 AND NOT src_user:*gserviceaccount*
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*Cloud*Audit*
    | json field=_raw "protoPayload.status.code" as code
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as src_user
    | where code = "7" and !(src_user matches "*gserviceaccount*")
    | timeslice 5m
    | count as event_count by _timeslice, src_user
    | where event_count >= 10
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 Cloud Audit event within 5 minutes

  Where code is 7 and not src_user gserviceaccount'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

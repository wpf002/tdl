rule_id: TDL-DIS-000332
v4_id: '000332'
name: AWS S3 Activity from Threat Host - GuardDuty
description: Detects when S3 activity from a known threat is seen within AWS instance
tactic: Discovery
tactic_id: TA0007
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"Discovery:S3/MaliciousIPCaller\" OR type=\"Discovery:S3/MaliciousIPCaller.Custom\"\
    \ OR type=\"Exfiltration:S3/MaliciousIPCaller\" OR type=\"Impact:S3/MaliciousIPCaller\" OR type=\"UnauthorizedAccess:S3/MaliciousIPCaller.Custom\"\
    )\n| table _time, type, severity, accountId, region, resource.s3BucketDetails.name, service.action.remoteIpDetails.ipAddressV4, service.action.remoteIpDetails.organization.asn,\
    \ service.action.remoteIpDetails.country.countryName, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom")
    | project TimeGenerated, Type, Title, Description, AccountId, Region, ResourceType, Severity, AwsAccountId
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, "awsRegion", "resource.instanceDetails.instanceId", "service.action.awsApiCallAction.api", "service.action.awsApiCallAction.serviceName", "service.action.awsApiCallAction.remoteIpDetails.ipAddressV4", "service.action.awsApiCallAction.remoteIpDetails.organization.asn", "title", "type", "severity"
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%guardduty%'
      AND "type" IN ('Discovery:S3/MaliciousIPCaller', 'Discovery:S3/MaliciousIPCaller.Custom', 'Exfiltration:S3/MaliciousIPCaller', 'Impact:S3/MaliciousIPCaller', 'UnauthorizedAccess:S3/MaliciousIPCaller.Custom')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_malicious_s3_caller {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for malicious IP callers accessing S3 buckets (T1580)"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1580"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS GuardDuty"
        (
          $e.metadata.product_event_type = "Discovery:S3/MaliciousIPCaller" or
          $e.metadata.product_event_type = "Discovery:S3/MaliciousIPCaller.Custom" or
          $e.metadata.product_event_type = "Exfiltration:S3/MaliciousIPCaller" or
          $e.metadata.product_event_type = "Impact:S3/MaliciousIPCaller" or
          $e.metadata.product_event_type = "UnauthorizedAccess:S3/MaliciousIPCaller.Custom"
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type == "guardduty" AND event.dataset == "aws.guardduty" AND event.action IN ("Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.action, source.ip, aws.guardduty.resource.s3_bucket_details.name, event.id, event.severity
  leql: |
    where(source_json.type IN ["Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom"])
  crowdstrike: |
    #repo=guardduty event.type IN ["Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom"]
    | table([@timestamp, event.type, resource.s3BucketDetails.name, service.action.awsApiCallAction.remoteIpDetails.ipAddressV4, service.action.awsApiCallAction.remoteIpDetails.organization.asn, accountId])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and log_name = "GuardDuty"
    | filter raw_log.service.action.actionType in ("Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom")
    | fields _time, cloud_provider, raw_log.accountId, raw_log.region, raw_log.service.action.actionType, raw_log.service.resourceRole, raw_log.resource.resourceType, raw_log.severity
  lucene: |
    event_type:("Discovery:S3/MaliciousIPCaller" OR "Discovery:S3/MaliciousIPCaller.Custom" OR "Exfiltration:S3/MaliciousIPCaller" OR "Impact:S3/MaliciousIPCaller" OR "UnauthorizedAccess:S3/MaliciousIPCaller.Custom")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("Discovery:S3/MaliciousIPCaller", "Discovery:S3/MaliciousIPCaller.Custom", "Exfiltration:S3/MaliciousIPCaller", "Impact:S3/MaliciousIPCaller", "UnauthorizedAccess:S3/MaliciousIPCaller.Custom")
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Discovery:S3/MaliciousIPCaller\", \"Discovery:S3/MaliciousIPCaller.Custom\"\
  , \"Exfiltration:S3/MaliciousIPCaller\", \"Impact:S3/MaliciousIPCaller\", \"UnauthorizedAccess:S3/MaliciousIPCaller.Custom\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

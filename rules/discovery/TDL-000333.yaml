rule_id: TDL-DIS-000333
v4_id: '000333'
name: AWS Kubernetes Activity from Threat Host - GuardDuty
description: Detects when Kubernetes activity from a known threat is seen within AWS instance
tactic: Discovery
tactic_id: TA0007
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty \n(type=\"CredentialAccess:Kubernetes/MaliciousIPCaller\" OR type=\"CredentialAccess:Kubernetes/MaliciousIPCaller.Custom\"\
    \ OR type=\"DefenseEvasion:Kubernetes/MaliciousIPCaller\" OR type=\"DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom\" OR type=\"Discovery:Kubernetes/MaliciousIPCaller\"\
    \ OR type=\"Discovery:Kubernetes/MaliciousIPCaller.Custom\" OR type=\"Impact:Kubernetes/MaliciousIPCaller\" OR type=\"Impact:Kubernetes/MaliciousIPCaller.Custom\"\
    \ OR type=\"Persistence:Kubernetes/MaliciousIPCaller\" OR type=\"Persistence:Kubernetes/MaliciousIPCaller.Custom\")\n| table _time, type,\
    \ severity, accountId, region, resource.resourceType, service.action.actionType, service.action.kubernetesApiCallAction.remoteIpDetails.ipAddressV4,\
    \ service.action.kubernetesApiCallAction.requestUri, resource.eksClusterDetails.name\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "GuardDuty"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%GuardDuty%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000333 {\n  meta:\n    author = \"TDL\"\n    description = \"AWS Kubernetes Activity from Threat Host - GuardDuty\"\
    \n    severity = \"MEDIUM\"\n    tactic = \"TA0007\"\n    technique = \"T1580\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /GuardDuty/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%GuardDuty%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/GuardDuty/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*GuardDuty*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "GuardDuty"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*GuardDuty*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*GuardDuty*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:Kubernetes/MaliciousIPCaller\", \"CredentialAccess:Kubernetes/MaliciousIPCaller.Custom\"\
  , \"DefenseEvasion:Kubernetes/MaliciousIPCaller\", \"DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom\", \"Discovery:Kubernetes/MaliciousIPCaller\"\
  , \"Discovery:Kubernetes/MaliciousIPCaller.Custom\", \"Impact:Kubernetes/MaliciousIPCaller\", \"Impact:Kubernetes/MaliciousIPCaller.Custom\"\
  , \"Persistence:Kubernetes/MaliciousIPCaller\", \"Persistence:Kubernetes/MaliciousIPCaller.Custom\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

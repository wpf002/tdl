rule_id: TDL-DIS-000333
v4_id: '000333'
name: AWS Kubernetes Activity from Threat Host - GuardDuty
description: Detects when Kubernetes activity from a known threat is seen within AWS instance
tactic: Discovery
tactic_id: TA0007
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty \n(type=\"CredentialAccess:Kubernetes/MaliciousIPCaller\" OR type=\"CredentialAccess:Kubernetes/MaliciousIPCaller.Custom\"\
    \ OR type=\"DefenseEvasion:Kubernetes/MaliciousIPCaller\" OR type=\"DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom\" OR type=\"Discovery:Kubernetes/MaliciousIPCaller\"\
    \ OR type=\"Discovery:Kubernetes/MaliciousIPCaller.Custom\" OR type=\"Impact:Kubernetes/MaliciousIPCaller\" OR type=\"Impact:Kubernetes/MaliciousIPCaller.Custom\"\
    \ OR type=\"Persistence:Kubernetes/MaliciousIPCaller\" OR type=\"Persistence:Kubernetes/MaliciousIPCaller.Custom\")\n| table _time, type,\
    \ severity, accountId, region, resource.resourceType, service.action.actionType, service.action.kubernetesApiCallAction.remoteIpDetails.ipAddressV4,\
    \ service.action.kubernetesApiCallAction.requestUri, resource.eksClusterDetails.name\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type in ("CredentialAccess:Kubernetes/MaliciousIPCaller", "CredentialAccess:Kubernetes/MaliciousIPCaller.Custom", "DefenseEvasion:Kubernetes/MaliciousIPCaller", "DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom", "Discovery:Kubernetes/MaliciousIPCaller", "Discovery:Kubernetes/MaliciousIPCaller.Custom", "Impact:Kubernetes/MaliciousIPCaller", "Impact:Kubernetes/MaliciousIPCaller.Custom", "Persistence:Kubernetes/MaliciousIPCaller", "Persistence:Kubernetes/MaliciousIPCaller.Custom")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, ServiceName, ActivityType, RemoteIpDetails, ResourceDetails
  aql: |
    SELECT eventtime, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS log_source, "Finding Type" AS finding_type, username, QIDNAME(qid) AS event_name
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND ("Finding Type" IN ('CredentialAccess:Kubernetes/MaliciousIPCaller', 'CredentialAccess:Kubernetes/MaliciousIPCaller.Custom', 'DefenseEvasion:Kubernetes/MaliciousIPCaller', 'DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom', 'Discovery:Kubernetes/MaliciousIPCaller', 'Discovery:Kubernetes/MaliciousIPCaller.Custom', 'Impact:Kubernetes/MaliciousIPCaller', 'Impact:Kubernetes/MaliciousIPCaller.Custom', 'Persistence:Kubernetes/MaliciousIPCaller', 'Persistence:Kubernetes/MaliciousIPCaller.Custom')
           OR QIDNAME(qid) IN ('CredentialAccess:Kubernetes/MaliciousIPCaller', 'CredentialAccess:Kubernetes/MaliciousIPCaller.Custom', 'DefenseEvasion:Kubernetes/MaliciousIPCaller', 'DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom', 'Discovery:Kubernetes/MaliciousIPCaller', 'Discovery:Kubernetes/MaliciousIPCaller.Custom', 'Impact:Kubernetes/MaliciousIPCaller', 'Impact:Kubernetes/MaliciousIPCaller.Custom', 'Persistence:Kubernetes/MaliciousIPCaller', 'Persistence:Kubernetes/MaliciousIPCaller.Custom'))
    LAST 1 HOURS
  yara_l: "rule aws_guardduty_kubernetes_malicious_ip_caller {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS GuardDuty findings\
    \ for Kubernetes API calls from malicious IPs - MITRE T1580 Discovery\"\n    severity = \"HIGH\"\n    mitre_attack_tactic = \"Discovery\"\n\
    \    mitre_attack_technique = \"T1580\"\n    \n  events:\n    $e.metadata.product_name = \"Amazon GuardDuty\"\n    (\n      $e.metadata.product_event_type\
    \ = \"CredentialAccess:Kubernetes/MaliciousIPCaller\" or\n      $e.metadata.product_event_type = \"CredentialAccess:Kubernetes/MaliciousIPCaller.Custom\"\
    \ or\n      $e.metadata.product_event_type = \"DefenseEvasion:Kubernetes/MaliciousIPCaller\" or\n      $e.metadata.product_event_type = \"\
    DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom\" or\n      $e.metadata.product_event_type = \"Discovery:Kubernetes/MaliciousIPCaller\"\
    \ or\n      $e.metadata.product_event_type = \"Discovery:Kubernetes/MaliciousIPCaller.Custom\" or\n      $e.metadata.product_event_type =\
    \ \"Impact:Kubernetes/MaliciousIPCaller\" or\n      $e.metadata.product_event_type = \"Impact:Kubernetes/MaliciousIPCaller.Custom\" or\n \
    \     $e.metadata.product_event_type = \"Persistence:Kubernetes/MaliciousIPCaller\" or\n      $e.metadata.product_event_type = \"Persistence:Kubernetes/MaliciousIPCaller.Custom\"\
    \n    )\n    $e.principal.ip = $source_ip\n    \n  match:\n    $source_ip over 5m\n    \n  outcome:\n    $risk_score = max(75)\n    $source_ip_list\
    \ = array_distinct($e.principal.ip)\n    $finding_types = array_distinct($e.metadata.product_event_type)\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CredentialAccess:Kubernetes/MaliciousIPCaller", "CredentialAccess:Kubernetes/MaliciousIPCaller.Custom", "DefenseEvasion:Kubernetes/MaliciousIPCaller", "DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom", "Discovery:Kubernetes/MaliciousIPCaller", "Discovery:Kubernetes/MaliciousIPCaller.Custom", "Impact:Kubernetes/MaliciousIPCaller", "Impact:Kubernetes/MaliciousIPCaller.Custom", "Persistence:Kubernetes/MaliciousIPCaller", "Persistence:Kubernetes/MaliciousIPCaller.Custom")
    | KEEP @timestamp, event.type, cloud.account.id, cloud.region, source.ip, user.name, aws.guardduty.severity, aws.guardduty.resource.eks_cluster_details.name
  leql: |
    where(source_json.type IN ["CredentialAccess:Kubernetes/MaliciousIPCaller", "CredentialAccess:Kubernetes/MaliciousIPCaller.Custom", "DefenseEvasion:Kubernetes/MaliciousIPCaller", "DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom", "Discovery:Kubernetes/MaliciousIPCaller", "Discovery:Kubernetes/MaliciousIPCaller.Custom", "Impact:Kubernetes/MaliciousIPCaller", "Impact:Kubernetes/MaliciousIPCaller.Custom", "Persistence:Kubernetes/MaliciousIPCaller", "Persistence:Kubernetes/MaliciousIPCaller.Custom"])
  crowdstrike: |
    #repo=guardduty event_simpleName=GuardDutyFinding
    (finding.type="CredentialAccess:Kubernetes/MaliciousIPCaller" OR finding.type="CredentialAccess:Kubernetes/MaliciousIPCaller.Custom" OR finding.type="DefenseEvasion:Kubernetes/MaliciousIPCaller" OR finding.type="DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom" OR finding.type="Discovery:Kubernetes/MaliciousIPCaller" OR finding.type="Discovery:Kubernetes/MaliciousIPCaller.Custom" OR finding.type="Impact:Kubernetes/MaliciousIPCaller" OR finding.type="Impact:Kubernetes/MaliciousIPCaller.Custom" OR finding.type="Persistence:Kubernetes/MaliciousIPCaller" OR finding.type="Persistence:Kubernetes/MaliciousIPCaller.Custom")
    | table([@timestamp, finding.type, account.id, region, resource.kubernetesDetails.kubernetesUserDetails.username, service.action.kubernetesApiCallAction.remoteIpDetails.ipAddressV4])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"AWS\" and vendor_name = \"AWS\" and event_source = \"guardduty.amazonaws.com\"\
    \n| filter raw_log contains \"CredentialAccess:Kubernetes/MaliciousIPCaller\" \n    or raw_log contains \"DefenseEvasion:Kubernetes/MaliciousIPCaller\"\
    \ \n    or raw_log contains \"Discovery:Kubernetes/MaliciousIPCaller\" \n    or raw_log contains \"Impact:Kubernetes/MaliciousIPCaller\" \n\
    \    or raw_log contains \"Persistence:Kubernetes/MaliciousIPCaller\"\n| fields _time, event_type, event_sub_type, identity_name, cloud_provider_account_id,\
    \ raw_log\n"
  lucene: |
    event.type:guardduty AND finding.type:("CredentialAccess:Kubernetes/MaliciousIPCaller" OR "CredentialAccess:Kubernetes/MaliciousIPCaller.Custom" OR "DefenseEvasion:Kubernetes/MaliciousIPCaller" OR "DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom" OR "Discovery:Kubernetes/MaliciousIPCaller" OR "Discovery:Kubernetes/MaliciousIPCaller.Custom" OR "Impact:Kubernetes/MaliciousIPCaller" OR "Impact:Kubernetes/MaliciousIPCaller.Custom" OR "Persistence:Kubernetes/MaliciousIPCaller" OR "Persistence:Kubernetes/MaliciousIPCaller.Custom")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:Kubernetes/MaliciousIPCaller", "CredentialAccess:Kubernetes/MaliciousIPCaller.Custom", "DefenseEvasion:Kubernetes/MaliciousIPCaller", "DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom", "Discovery:Kubernetes/MaliciousIPCaller", "Discovery:Kubernetes/MaliciousIPCaller.Custom", "Impact:Kubernetes/MaliciousIPCaller", "Impact:Kubernetes/MaliciousIPCaller.Custom", "Persistence:Kubernetes/MaliciousIPCaller", "Persistence:Kubernetes/MaliciousIPCaller.Custom")
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:

- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:Kubernetes/MaliciousIPCaller\", \"CredentialAccess:Kubernetes/MaliciousIPCaller.Custom\"\
  , \"DefenseEvasion:Kubernetes/MaliciousIPCaller\", \"DefenseEvasion:Kubernetes/MaliciousIPCaller.Custom\", \"Discovery:Kubernetes/MaliciousIPCaller\"\
  , \"Discovery:Kubernetes/MaliciousIPCaller.Custom\", \"Impact:Kubernetes/MaliciousIPCaller\", \"Impact:Kubernetes/MaliciousIPCaller.Custom\"\
  , \"Persistence:Kubernetes/MaliciousIPCaller\", \"Persistence:Kubernetes/MaliciousIPCaller.Custom\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

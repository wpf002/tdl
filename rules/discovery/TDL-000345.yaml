rule_id: TDL-DIS-000345
v4_id: '000345'
name: AWS S3 Hacktool Activity - GuardDuty
description: Detects when S3 activity from a known threat is seen within AWS instance
tactic: Discovery
tactic_id: TA0007
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty detail.type IN ("PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux")

    | table _time, detail.type, detail.severity, detail.resource.s3BucketDetails.name, detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4,
    detail.accountId, detail.region

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, Region, ResourceType, SourceIpAddress
  aql: |
    SELECT eventtime, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, "Event Type", qidname(qid)
    FROM events
    WHERE "Event Type" IN ('PenTest:S3/KaliLinux', 'PenTest:S3/ParrotLinux', 'PenTest:S3/PentooLinux')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_pentest_tool_s3_access {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for penetration testing tools accessing S3"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1580"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "PenTest:S3/KaliLinux" or
          $e.metadata.product_event_type = "PenTest:S3/ParrotLinux" or
          $e.metadata.product_event_type = "PenTest:S3/PentooLinux"
        )
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, aws.guardduty.resource.s3_bucket_details.name, source.ip, source.geo.country_name
  leql: |
    where(source_json.type IN ["PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux"])
  crowdstrike: "#event_type=GuardDuty\n| service.action.actionType=* \n| type=(\"PenTest:S3/KaliLinux\" OR \"PenTest:S3/ParrotLinux\" OR \"PenTest:S3/PentooLinux\"\
    )\n| table([@timestamp, type, accountId, region, resource.s3BucketDetails.name, service.action.actionType, severity])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log_type = "guardduty"
    | filter action_event_type in ("PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux")
    | fields _time, cloud_provider, action_event_type, action_resource_resource_type, actor_user_username, action_country, action_remote_ip
  lucene: |
    event.type:"GuardDuty Finding" AND (finding.type:"PenTest:S3/KaliLinux" OR finding.type:"PenTest:S3/ParrotLinux" OR finding.type:"PenTest:S3/PentooLinux")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("PenTest:S3/KaliLinux", "PenTest:S3/ParrotLinux", "PenTest:S3/PentooLinux")
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"PenTest:S3/KaliLinux\", \"PenTest:S3/ParrotLinux\", \"PenTest:S3/PentooLinux\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

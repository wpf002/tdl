rule_id: TDL-DIS-000348
v4_id: 000348
name: Container Launched with Sensitive Mount - GuardDuty
description: Detects when a container was launched with a configuration that included a sensitive host path with write access in the volumeMounts
  section. This makes the sensitive host path accessible and writable from inside the container. This technique is commonly used by adversaries
  to gain access to the host's filesystem.
tactic: Discovery
tactic_id: TA0007
technique_id: T1083
technique_name: File and Directory Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"Persistence:Kubernetes/ContainerWithSensitiveMount\" OR type=\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount\"\
    )\n| table _time, accountId, region, type, severity, resource.resourceType, resource.kubernetesDetails.*, service.action.actionType, title,\
    \ description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("Persistence:Kubernetes/ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = Resource_AccessKeyDetails_AccessKeyId
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, sourceip, username, \"Event Type\" AS event_type, \"Resource Type\", \"Resource\
    \ Name\"\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'\n  AND (\"Event Type\" = 'Persistence:Kubernetes/ContainerWithSensitiveMount'\
    \ \n       OR \"Event Type\" = 'PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount')\nLAST 24 HOURS\n"
  yara_l: |
    rule guardduty_sensitive_mount_discovery {
      meta:
        author = "Detection Engineering"
        description = "Detects GuardDuty findings for containers with sensitive mounts indicating discovery attempts"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1083"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "Persistence:Kubernetes/ContainerWithSensitiveMount" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount"
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action IN ("Persistence:Kubernetes/ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.action, event.severity, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.namespace, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.type, aws.guardduty.service.resource_role, aws.guardduty.title, aws.guardduty.description
  leql: |
    where(source_json.service.action.actionType="KUBERNETES_API_CALL" AND source_json.type IN ["Persistence:Kubernetes/ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount"])
  crowdstrike: "#repo=aws_guardduty \nevent.type IN [\"Persistence:Kubernetes/ContainerWithSensitiveMount\", \"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount\"\
    ]\n| table([@timestamp, event.type, account.id, resource.type, severity, description])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "AWS" and log_name = "GuardDuty"
    | filter event_type in ("Persistence:Kubernetes/ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount")
    | fields _time, cloud_provider, event_type, resource_name, resource_type, raw_log
  lucene: |
    event.type:"guardduty" AND finding.type:("Persistence:Kubernetes/ContainerWithSensitiveMount" OR "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*aws* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Persistence:Kubernetes/ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Persistence:Kubernetes/ContainerWithSensitiveMount\",\"\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

rule_id: TDL-DIS-000350
v4_id: '000350'
name: Kubernetes Dashboard Exposed to the Internet - GuardDuty
description: Detects when the default service account for a namespace in your Kubernetes cluster was granted admin privileges. Kubernetes creates
  a default service account for all the namespaces in the cluster. It automatically assigns the default service account as an identity to pods
  that have not been explicitly associated to another service account. If the default service account has admin privileges, it may result in pods
  being unintentionally launched with admin privileges. If this behavior is not expected, it may indicate a configuration mistake or that your
  credentials are compromised.
tactic: Discovery
tactic_id: TA0007
technique_id: T1538
technique_name: Cloud Service Dashboard
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty (eventType="Policy:Kubernetes/ExposedDashboard" OR eventType="Policy:Kubernetes/KubeflowDashboardExposed")

    | table _time, eventType, accountId, region, resource.*, severity, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where ActivityType in ("Policy:Kubernetes/ExposedDashboard", "Policy:Kubernetes/KubeflowDashboardExposed")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = tostring(parse_json(Resource).InstanceDetails.instanceId)
  aql: |
    SELECT sourceip, destinationip, username, eventtime, qidname(qid), LOGSOURCENAME(logsourceid), "Event Type"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Event Type" IN ('Policy:Kubernetes/ExposedDashboard', 'Policy:Kubernetes/KubeflowDashboardExposed')
    LAST 24 HOURS
  yara_l: |
    rule aws_kubernetes_dashboard_exposed {
      meta:
        author = "TDL"
        description = "Detects exposed Kubernetes dashboard via AWS GuardDuty findings"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1538"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "Policy:Kubernetes/ExposedDashboard" or
          $e.metadata.product_event_type = "Policy:Kubernetes/KubeflowDashboardExposed"
        )
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.guardduty*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.type IN (\"Policy:Kubernetes/ExposedDashboard\", \"Policy:Kubernetes/KubeflowDashboardExposed\"\
    )\n| KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.severity, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name,\
    \ event.id\n"
  leql: |
    where(source_json.type IN ["Policy:Kubernetes/ExposedDashboard", "Policy:Kubernetes/KubeflowDashboardExposed"])
  crowdstrike: |
    #repo=guardduty eventType IN ["Policy:Kubernetes/ExposedDashboard", "Policy:Kubernetes/KubeflowDashboardExposed"]
    | table([@timestamp, eventType, accountId, region, resource.resourceType, resource.kubernetesDetails.kubernetesWorkloadDetails.name, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "Amazon" and log_type = "guardduty"
    | filter raw_log.service.eventType in ("Policy:Kubernetes/ExposedDashboard", "Policy:Kubernetes/KubeflowDashboardExposed")
    | fields _time, cloud_provider, raw_log.accountId, raw_log.region, raw_log.service.eventType, raw_log.service.resourceRole, raw_log.service.action.actionType, raw_log.resource.resourceType, raw_log.severity, raw_log.title, raw_log.description
  lucene: |
    event.type:guardduty AND (guardduty.finding_type:"Policy:Kubernetes/ExposedDashboard" OR guardduty.finding_type:"Policy:Kubernetes/KubeflowDashboardExposed")
  sumo: "_sourceCategory=*GuardDuty* \n| json field=_raw \"detail.type\" as event_type\n| where event_type in (\"Policy:Kubernetes/ExposedDashboard\"\
    , \"Policy:Kubernetes/KubeflowDashboardExposed\")\n| fields _messageTime, _sourceHost, event_type\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Policy:Kubernetes/ExposedDashboard\", \"Policy:Kubernetes/KubeflowDashboardExposed\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

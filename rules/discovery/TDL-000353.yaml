rule_id: TDL-DIS-000353
v4_id: '000353'
name: AWS Outbound Port Recon Activity  - GuardDuty
description: Detects when there is inbound recon activity such as port scan, port sweep, port probes, etc.
tactic: Discovery
tactic_id: TA0007
technique_id: T1595
technique_name: Active Scanning
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty (finding.type="Impact:EC2/PortSweep" OR finding.type="Recon:EC2/Portscan")

    | table _time, finding.type, finding.severity, finding.accountId, finding.region, finding.resource.instanceDetails.instanceId, finding.service.action.portProbeAction.portProbeDetails{}.localPortDetails.port,
    finding.service.action.networkConnectionAction.remoteIpDetails.ipAddressV4

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("Impact:EC2/PortSweep", "Recon:EC2/Portscan")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(tostring(parse_json(AdditionalData).Resource)).InstanceDetails.instanceId), SourceIpAddress = tostring(parse_json(tostring(parse_json(AdditionalData).Service)).Action.NetworkConnectionAction.RemoteIpDetails.IpAddressV4)
  aql: |
    SELECT sourceip, destinationip, qidname(qid) AS event_type, LOGSOURCENAME(logsourceid) AS log_source, eventcount, eventtime
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND (qidname(qid) ILIKE '%Impact:EC2/PortSweep%' OR qidname(qid) ILIKE '%Recon:EC2/Portscan%')
    LAST 24 HOURS
  yara_l: "rule aws_guardduty_port_scanning_activity {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects port scanning\
    \ activity via AWS GuardDuty findings\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1595\"\n    severity = \"\
    Medium\"\n    \n  events:\n    $gd.metadata.vendor_name = \"Amazon AWS\"\n    $gd.metadata.product_name = \"GuardDuty\"\n    (\n      $gd.metadata.product_event_type\
    \ = \"Impact:EC2/PortSweep\" or\n      $gd.metadata.product_event_type = \"Recon:EC2/Portscan\"\n    )\n    $gd.principal.resource.id = $resource_id\n\
    \    \n  match:\n    $resource_id over 1h\n    \n  condition:\n    $gd\n}\n"
  esql: |
    FROM .ds-logs-aws.guardduty-*
    | WHERE event.type IN ("Impact:EC2/PortSweep", "Recon:EC2/Portscan")
    | KEEP @timestamp, cloud.account.id, cloud.region, source.ip, destination.ip, event.type, event.action, event.severity, aws.guardduty.finding.id
  leql: |
    where(source_json.type IN ["Impact:EC2/PortSweep", "Recon:EC2/Portscan"])
  crowdstrike: |
    #type=aws:guardduty (detail.type="Impact:EC2/PortSweep" OR detail.type="Recon:EC2/Portscan")
    | table([@timestamp, detail.type, detail.resource.instanceDetails.instanceId, detail.severity, detail.description, detail.service.action.portProbeAction.portProbeDetails])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log_type = "AWS.GuardDuty"
    | filter json_extract_scalar(raw_log, "$.detail.type") in ("Impact:EC2/PortSweep", "Recon:EC2/Portscan")
    | fields _time, cloud_provider, json_extract_scalar(raw_log, "$.detail.type") as finding_type, json_extract_scalar(raw_log, "$.detail.resource.instanceDetails.instanceId") as instance_id, json_extract_scalar(raw_log, "$.detail.severity") as severity, json_extract_scalar(raw_log, "$.detail.description") as description
  lucene: |
    event.dataset:aws.guardduty AND finding.type:("Impact:EC2/PortSweep" OR "Recon:EC2/Portscan")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("Impact:EC2/PortSweep", "Recon:EC2/Portscan")
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event


  Where the Event Type is in ["Impact:EC2/PortSweep", "Recon:EC2/Portscan"]'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine whether the enumeration is targeted (specific user / share
  / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

rule_id: TDL-DIS-000354
v4_id: '000354'
name: AWS PortProbe Activity  - GuardDuty
description: Detects a inbound port probe attempt against an instance
tactic: Discovery
tactic_id: TA0007
technique_id: T1595
technique_name: Active Scanning
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty (type="Recon:EC2/PortProbeEMRUnprotectedPort" OR type="Recon:EC2/PortProbeUnprotectedPort")

    | table _time, type, severity, resource.instanceDetails.instanceId, service.action.portProbeAction.portProbeDetails{}.localPortDetails.port,
    service.action.portProbeAction.portProbeDetails{}.remoteIpDetails.ipAddressV4

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort")
    | project TimeGenerated, ActivityType, Title, Description, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(tostring(Resource)).InstanceDetails.InstanceId), RemoteIpDetails = parse_json(tostring(Service)).Action.PortProbeAction.PortProbeDetails, Severity
  aql: |
    SELECT QIDNAME(qid) AS event_type, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS log_source, eventtime, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND (QIDNAME(qid) ILIKE '%Recon:EC2/PortProbeEMRUnprotectedPort%' OR QIDNAME(qid) ILIKE '%Recon:EC2/PortProbeUnprotectedPort%')
    GROUP BY QIDNAME(qid), sourceip, destinationip, LOGSOURCENAME(logsourceid), eventtime
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_port_probe_discovery {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty port probe reconnaissance events targeting EC2 instances"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1595"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = /Recon:EC2\/PortProbe(EMRUnprotectedPort|UnprotectedPort)/
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 50

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort")
    | KEEP @timestamp, cloud.account.id, cloud.region, source.ip, destination.ip, event.type, event.severity, aws.guardduty.resource.instance_details.instance_id
  leql: |
    where(source_json.type IN ["Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort"])
  crowdstrike: |
    #event_type=GuardDuty (detail.type="Recon:EC2/PortProbeEMRUnprotectedPort" OR detail.type="Recon:EC2/PortProbeUnprotectedPort")
    | table([@timestamp, detail.type, detail.resource.instanceDetails.instanceId, detail.service.action.portProbeAction.portProbeDetails, detail.severity, detail.accountId, detail.region])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logname = "GuardDuty"
    | filter json_extract_scalar(raw_log, "$.type") in ("Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort")
    | fields _time, cloud_provider_account_id, cloud_resource_identifier, raw_log
  lucene: |
    event.type:"guardduty" AND detail.type:("Recon:EC2/PortProbeEMRUnprotectedPort" OR "Recon:EC2/PortProbeUnprotectedPort")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "detail.type" as event_type
    | where event_type in ("Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort")
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event


  Where the Event Type is in ["Recon:EC2/PortProbeEMRUnprotectedPort", "Recon:EC2/PortProbeUnprotectedPort"]'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — determine whether the enumeration is targeted
  (specific user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

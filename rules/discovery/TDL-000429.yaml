rule_id: TDL-DIS-000429
v4_id: 000429
name: Advanced IP/Port Scanner Update Check
description: Detect update check performed by Advanced IP Scanner and Advanced Port Scanner
tactic: Discovery
tactic_id: TA0007
technique_id: T1590
technique_name: Gather Victim Network Information
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=proxy (url="*checkupdate.php*" OR uri_path="*checkupdate.php*") (url="*lng=*" OR url="*ver=*" OR url="*beta=*" OR url="*type=*"
    OR url="*rmode=*" OR url="*product=*" OR uri_query="*lng=*" OR uri_query="*ver=*" OR uri_query="*beta=*" OR uri_query="*type=*" OR uri_query="*rmode=*"
    OR uri_query="*product=*")

    | table _time, src, dest, url, uri_path, uri_query, user, action

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has "Proxy" or DeviceProduct has "Proxy" or DeviceAction has_any ("allowed", "Allowed")
    | where RequestURL contains "checkupdate.php"
    | where RequestURL has_any ("lng=", "ver=", "beta=", "type=", "rmode=", "product=")
    | project TimeGenerated, SourceIP, DestinationIP, RequestURL, RequestContext, DeviceName, SourceUserName
  aql: "SELECT sourceip, destinationip, username, URL, QIDNAME(qid), eventtime\nFROM events\nWHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%proxy%'\
    \ OR category IN (10000, 10100, 10200))\n  AND URL ILIKE '%checkupdate.php%'\n  AND (URL ILIKE '%lng=%' \n       OR URL ILIKE '%ver=%' \n\
    \       OR URL ILIKE '%beta=%' \n       OR URL ILIKE '%type=%' \n       OR URL ILIKE '%rmode=%' \n       OR URL ILIKE '%product=%')\nLAST\
    \ 24 HOURS\n"
  yara_l: |
    rule mitre_t1590_recon_checkupdate_php {
      meta:
        author = "TDL"
        description = "Detects reconnaissance activity via outbound proxy requests to checkupdate.php with suspicious query parameters"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1590"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.network.direction = "OUTBOUND"
        re.regex($e.target.url, `checkupdate\.php`)
        (
          re.regex($e.target.url, `lng=`) or
          re.regex($e.target.url, `ver=`) or
          re.regex($e.target.url, `beta=`) or
          re.regex($e.target.url, `type=`) or
          re.regex($e.target.url, `rmode=`) or
          re.regex($e.target.url, `product=`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-network.proxy*\n| WHERE url.full LIKE \"*checkupdate.php*\"\n  AND (url.query LIKE \"*lng=*\" \n    OR url.query LIKE \"*ver=*\"\
    \ \n    OR url.query LIKE \"*beta=*\" \n    OR url.query LIKE \"*type=*\" \n    OR url.query LIKE \"*rmode=*\" \n    OR url.query LIKE \"\
    *product=*\")\n| KEEP @timestamp, source.ip, destination.ip, url.full, url.query, host.name, user.name\n"
  leql: |
    where(url ICONTAINS "checkupdate.php" AND (query_parameters ICONTAINS "lng=" OR query_parameters ICONTAINS "ver=" OR query_parameters ICONTAINS "beta=" OR query_parameters ICONTAINS "type=" OR query_parameters ICONTAINS "rmode=" OR query_parameters ICONTAINS "product="))
  crowdstrike: |
    #type=proxy_event url=*checkupdate.php* (url=*lng=* OR url=*ver=* OR url=*beta=* OR url=*type=* OR url=*rmode=* OR url=*product=*)
    | table([@timestamp, ComputerName, UserName, url, src_ip, dst_ip])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter http_url_category = "forward-proxy" or action_app_id_category = "forward-proxy"
    | filter url_path contains "checkupdate.php"
    | filter url_query contains "lng=" or url_query contains "ver=" or url_query contains "beta=" or url_query contains "type=" or url_query contains "rmode=" or url_query contains "product="
    | fields _time, src_ip, dst_ip, url_path, url_query, action_source_translated_ip, agent_hostname
  lucene: |
    url:*checkupdate.php* AND (url:*lng=* OR url:*ver=* OR url:*beta=* OR url:*type=* OR url:*rmode=* OR url:*product=*)
  sumo: "_sourceCategory=*Proxy* OR _sourceCategory=*Forward*Proxy* \"checkupdate.php\"\n| parse regex field=_raw \"(?<url>https?://[^\\s]+)\"\
    \ nodrop\n| parse regex field=url \"(?<query_params>\\?[^\\s]*)\" nodrop\n| where url matches \"*checkupdate.php*\" \n  and (query_params\
    \ matches \"*lng=*\" \n    or query_params matches \"*ver=*\" \n    or query_params matches \"*beta=*\" \n    or query_params matches \"*type=*\"\
    \ \n    or query_params matches \"*rmode=*\" \n    or query_params matches \"*product=*\")\n| fields _messageTime, _sourceHost, url, query_params\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Outbound Forward Proxy event\nWhere URL contains \"checkupdate.php\"\n    AND Where Query Parameters Contain (\"lng=\"\n    OR\
  \ \"ver=\"\n    OR \"beta=\"\n    OR \"type=\"\n    OR \"rmode=\"\n    OR \"product=\")"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

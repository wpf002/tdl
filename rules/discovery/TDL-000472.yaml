rule_id: TDL-DIS-000472
v4_id: '000472'
name: Allowed NMAP Scanning - Internal
description: Detects the use of allowed internal NMAP scanning within the environment
tactic: Discovery
tactic_id: TA0007
technique_id: T1046
technique_name: Network Service Discovery
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp

    | stats count as event_count, dc(dest_ip) as unique_dests, sum(bytes_out) as bytes_out by src_ip, dest_ip, dest_port

    | where event_count >= 1

    | sort - bytes_out

    '
  kql: "CommonSecurityLog\n| where DeviceVendor has_any (\"Palo Alto\", \"Cisco\", \"Fortinet\", \"Check Point\", \"Snort\", \"Suricata\") or\
    \ DeviceProduct has_any (\"Firewall\", \"IDS\", \"IPS\", \"NGFW\")\n| where Protocol =~ \"TCP\" or ApplicationProtocol =~ \"TCP\"\n| summarize\
    \ \n    event_count = count(),\n    unique_dests = dcount(DestinationIP),\n    bytes_out = sum(SentBytes)\n    by SourceIP, DestinationIP,\
    \ DestinationPort\n| where event_count >= 1\n| sort by bytes_out desc\n| project SourceIP, DestinationIP, DestinationPort, event_count, unique_dests,\
    \ bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS event_count, UNIQUECOUNT(destinationip) AS unique_dests, SUM(destinationbytes) AS bytes_out FROM flows WHERE protocolid = '6' AND category IN (SELECT category FROM categories WHERE low_level_category_id IN (6000, 6001, 6002, 6003, 6004, 6005, 6006, 6007, 6008, 6009, 6010)) GROUP BY sourceip, destinationip, destinationport HAVING event_count >= 1 ORDER BY bytes_out DESC LAST 24 HOURS
  yara_l: "rule network_scanning_tcp_t1046 {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects TCP network scanning activity\
    \ (MITRE T1046)\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1046\"\n    severity = \"Medium\"\n\n  events:\n\
    \    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.ip_protocol = \"TCP\"\n    $e.principal.ip = $src_ip\n    $e.target.ip\
    \ = $dest_ip\n    $e.target.port = $dest_port\n    \n  match:\n    $src_ip, $dest_ip, $dest_port over 24h\n\n  outcome:\n    $risk_score =\
    \ max(35)\n    $src_ip_out = $src_ip\n    $dest_ip_out = $dest_ip\n    $dest_port_out = $dest_port\n    $event_count = count_distinct($e.metadata.id)\n\
    \    $bytes_out = sum($e.network.sent_bytes)\n\n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-network.firewall*, logs-network.ids*
    | WHERE network.protocol == "tcp"
    | STATS event_count = COUNT(*), unique_dests = COUNT_DISTINCT(destination.ip), bytes_out = SUM(source.bytes) BY source.ip, destination.ip, destination.port
    | WHERE event_count >= 1
    | SORT bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, event_count, unique_dests, bytes_out
  leql: |
    where(source_json.protocol ICONTAINS "tcp") groupby(source_address, destination_address, destination_port) calculate(count)
  crowdstrike: |
    #type=firewall OR #type=ids network.protocol=*tcp*
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=bytes_out)])
    | event_count >= 1
    | sort(bytes_out, order=desc)
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter protocol = "tcp"
    | comp count() as count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as bytes_out by src_ip, dest_ip, dest_port
    | filter count >= 1
    | sort desc bytes_out
    | fields src_ip, dest_ip, dest_port, count, unique_dests, bytes_out
  lucene: |
    network.protocol:tcp AND (sourcetype:firewall OR sourcetype:ids)
  sumo: |
    _sourceCategory=*network* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol="tcp" OR protocol matches "*tcp*"
    | count as event_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as bytes_out by src_ip, dest_ip, dest_port
    | where event_count >= 1
    | sort by bytes_out desc
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — determine whether the enumeration is targeted (specific user / share
  / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'
pseudo_logic: '1 Instance over any time window of a network scanning event targeting TCP destinations.


  From index=network with sourcetype=firewall or sourcetype=ids

  Where network.protocol contains "tcp"

  With stats aggregated by src_ip, dest_ip, and dest_port measuring total event count, count of unique destination IPs (unique_dests), and sum
  of outbound bytes (bytes_out)

  Where count is greater than or equal to 1

  With results sorted descending by bytes_out to surface highest-volume scanning activity first

  With the same src_ip, dest_ip, and dest_port as the correlation key'

rule_id: TDL-DIS-000583
v4_id: 000583
name: Kubernetes RBAC Permission Enumeration Attempt
description: 'Detects identities attempting to enumerate their Kubernetes RBAC permissions. In the early stages of a breach, attackers will aim
  to list the permissions they have within the compromised environment. In a Kubernetes cluster, this can be achieved by interacting with the
  API server, and querying the SelfSubjectAccessReview API via e.g. a "kubectl auth can-i --list" command. This will enumerate the Role-Based
  Access Controls (RBAC) rules defining the compromised user''s authorization. Sigma rule created by Leo Tsaousis (@laripping)


  ref: https://www.elastic.co/guide/en/security/current/kubernetes-suspicious-self-subject-review.html'
tactic: Discovery
tactic_id: TA0007
technique_id: T1069
technique_name: Permission Groups Discovery
platform:
- Windows
data_sources:
- Kubernetes
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=kubernetes sourcetype=kube:audit objectRef.resource="selfsubjectrulesreviews" verb="create" objectRef.apiGroup="authorization.k8s.io"

    | table _time, user.username, sourceIPs{}, objectRef.namespace, objectRef.name, responseStatus.code

    '
  kql: |
    KubernetesPodInventory
    | where TimeGenerated > ago(24h)
    | join kind=inner (
        KubernetesEvents
        | where TimeGenerated > ago(24h)
        | where ObjectKind == "SelfSubjectRulesReview"
        | where Verb == "create"
        | extend apiGroup = tostring(parse_json(RequestObject).apiVersion)
        | where apiGroup has "authorization.k8s.io"
    ) on Computer
    | project TimeGenerated, Computer, Namespace, Name, Verb, ObjectKind, RequestObject, ResponseObject
    ```

    Wait, let me reconsider. For Kubernetes audit logs in Sentinel, the correct table is typically `AzureDiagnostics` with Category "kube-audit" or the dedicated audit table. Let me provide the correct query:

    ```
    AzureDiagnostics
    | where TimeGenerated > ago(24h)
    | where Category == "kube-audit"
    | where objectRef_resource_s == "selfsubjectrulesreviews"
    | where verb_s == "create"
    | where objectRef_apiGroup_s == "authorization.k8s.io"
    | project TimeGenerated, user_username_s, verb_s, objectRef_resource_s, objectRef_apiGroup_s, sourceIPs_s, userAgent_s
  aql: |
    SELECT username, sourceip, "ObjectRef.Resource", "Verb", "ObjectRef.APIGroup", COUNT(*) AS event_count
    FROM events
    WHERE "ObjectRef.Resource" = 'selfsubjectrulesreviews'
      AND "Verb" = 'create'
      AND "ObjectRef.APIGroup" = 'authorization.k8s.io'
    GROUP BY username, sourceip, "ObjectRef.Resource", "Verb", "ObjectRef.APIGroup"
    LAST 24 HOURS
  yara_l: |
    rule k8s_selfsubjectrulesreviews_discovery {
      meta:
        author = "TDL"
        description = "Detects Kubernetes selfsubjectrulesreviews creation for privilege discovery (T1069)"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1069"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.metadata.event_type = "RESOURCE_CREATION"
        re.regex($e.target.resource.name, `(?i)selfsubjectrulesreviews`)
        $e.target.resource.attribute.labels["verb"] = "create"
        $e.target.resource.attribute.labels["apiGroup"] = "authorization.k8s.io"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND kubernetes.audit.objectRef.resource == "selfsubjectrulesreviews"
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.objectRef.apiGroup == "authorization.k8s.io"
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.sourceIPs, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.resource, kubernetes.audit.verb
  leql: |
    where(source_json.objectRef.resource="selfsubjectrulesreviews" AND source_json.verb="create" AND source_json.objectRef.apiGroup="authorization.k8s.io")
  crowdstrike: |
    #type=kubernetes event.resource="selfsubjectrulesreviews" event.verb="create" event.apiGroup="authorization.k8s.io"
    | table([@timestamp, event.user, event.sourceIPs, event.namespace, event.objectRef])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and json_extract_scalar(resource, "$.type") = "k8s_cluster"
    | filter json_extract_scalar(protoPayload, "$.resourceName") ~= "selfsubjectrulesreviews"
    | filter json_extract_scalar(protoPayload, "$.request.verb") = "create" or json_extract_scalar(protoPayload, "$.methodName") contains "create"
    | filter json_extract_scalar(protoPayload, "$.request.apiGroup") = "authorization.k8s.io" or json_extract_scalar(protoPayload, "$.resourceName") contains "authorization.k8s.io"
    | fields _time, json_extract_scalar(protoPayload, "$.authenticationInfo.principalEmail") as user, json_extract_scalar(resource, "$.labels.cluster_name") as cluster, json_extract_scalar(protoPayload, "$.resourceName") as resource_name
  lucene: |
    objectRef.resource:selfsubjectrulesreviews AND verb:create AND objectRef.apiGroup:authorization.k8s.io
  sumo: |
    _sourceCategory=*kubernetes* "selfsubjectrulesreviews"
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.apiGroup" as apiGroup
    | where resource = "selfsubjectrulesreviews" and verb = "create" and apiGroup = "authorization.k8s.io"
    | fields _messageTime, _sourceHost, resource, verb, apiGroup
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"selfsubjectrulesreviews\"\nWhere Verb is \"create\"\nWhere apiGroup is \"authorization.k8s.io\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

rule_id: TDL-DIS-000635
v4_id: '000635'
name: LDAP Account Recon - Defender
description: This detection identifies suspicious LDAP search activity targeting Active Directory user accounts, privileged objects, or account
  attributes that are commonly queried during reconnaissance.
tactic: Discovery
tactic_id: TA0007
technique_id: T1087
technique_name: Account Discovery
platform:
- Windows
data_sources:
- Microsoft Defender
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype=\"MDE:AdvancedHunting:DeviceEvents\" ActionType=\"LdapSearch\" \n| where isnotnull(AdditionalFields) AND AdditionalFields!=\"\
    [ ]\" AND Scope!=\"Base\"\n| where \n    (like(AdditionalFields, \"%userAccountControl:1.2.840.113556.1.4.803:=65536%\")) OR\n    (like(AdditionalFields,\
    \ \"%userAccountControl:1.2.840.113556.1.4.803:=544%\")) OR\n    (like(AdditionalFields, \"%!UserAccountControl:1.2.840.113556.1.4.803:=2%\"\
    )) OR\n    (like(AdditionalFields, \"%accountExpires=9223372036854775807%\")) OR\n    (like(AdditionalFields, \"%accountExpires=0%\")) OR\n\
    \    (\n        (\n            like(AdditionalFields, \"%sAMAccountType=805306368%\") OR\n            like(AdditionalFields, \"%objectCategory=person%\"\
    ) OR\n            like(AdditionalFields, \"%objectCategory=user%\") OR\n            like(AdditionalFields, \"%objectClass=user%\")\n     \
    \   ) AND\n        (\n            NOT like(AdditionalFields, \"%domainSid=%\") AND\n            NOT like(AdditionalFields, \"%objectSid=%\"\
    )\n        )\n    )\n| table _time, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, AdditionalFields\n"
  kql: |
    DeviceEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "LdapSearch"
    | where AdditionalFields != "[]"
    | where SearchFilter !has "Base"
    | where (
        AdditionalFields has "(userAccountControl:1.2.840.113556.1.4.803:=65536)"
        or AdditionalFields has "(userAccountControl:1.2.840.113556.1.4.803:=544)"
        or AdditionalFields has "!(UserAccountControl:1.2.840.113556.1.4.803:=2)"
        or AdditionalFields has "(accountExpires=9223372036854775807)"
        or AdditionalFields has "(accountExpires=0)"
        or (
            (
                AdditionalFields has "(sAMAccountType=805306368)"
                or AdditionalFields has "(objectCategory=person)"
                or AdditionalFields has "(objectCategory=user)"
                or AdditionalFields has "(objectClass=user)"
            )
            and AdditionalFields !has "(domainSid=)"
            and AdditionalFields !has "(objectSid=)"
        )
    )
    | project TimeGenerated, DeviceName, AccountName, ActionType, SearchFilter, AdditionalFields
  aql: |
    SELECT devicename, username, additionalfields, timestamp
    FROM events
    WHERE LOGSOURCETYPENAME(devicetypeid) ILIKE '%Microsoft Defender%'
      AND "ActionType" = 'LdapSearch'
      AND "AdditionalFields" NOT LIKE '%"Tags":[]%'
      AND "SearchScope" != 'Base'
      AND (
        "AdditionalFields" ILIKE '%(userAccountControl:1.2.840.113556.1.4.803:=65536)%'
        OR "AdditionalFields" ILIKE '%(userAccountControl:1.2.840.113556.1.4.803:=544)%'
        OR "AdditionalFields" ILIKE '%!(UserAccountControl:1.2.840.113556.1.4.803:=2)%'
        OR "AdditionalFields" ILIKE '%(accountExpires=9223372036854775807)%'
        OR "AdditionalFields" ILIKE '%(accountExpires=0)%'
        OR (
          ("AdditionalFields" ILIKE '%(sAMAccountType=805306368)%'
           OR "AdditionalFields" ILIKE '%(objectCategory=person)%'
           OR "AdditionalFields" ILIKE '%(objectCategory=user)%'
           OR "AdditionalFields" ILIKE '%(objectClass=user)%')
          AND "AdditionalFields" NOT ILIKE '%(domainSid=)%'
          AND "AdditionalFields" NOT ILIKE '%(objectSid=)%'
        )
      )
    LAST 24 HOURS
  yara_l: "rule mitre_t1087_ldap_user_enumeration {\n  meta:\n    author = \"TDL\"\n    description = \"Detects LDAP searches for user enumeration\
    \ via LDAP filters indicating account discovery\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1087\"\n    severity\
    \ = \"Medium\"\n\n  events:\n    $e.metadata.product_name = \"Microsoft Defender for Endpoint\"\n    $e.metadata.product_event_type = \"LdapSearch\"\
    \n    $e.metadata.description != \"[ ]\"\n    $e.additional.fields != \"Base\"\n    \n    (\n      re.regex($e.additional.fields, `\\(userAccountControl:1\\\
    .2\\.840\\.113556\\.1\\.4\\.803:=65536\\)`) or\n      re.regex($e.additional.fields, `\\(userAccountControl:1\\.2\\.840\\.113556\\.1\\.4\\\
    .803:=544\\)`) or\n      re.regex($e.additional.fields, `!\\(UserAccountControl:1\\.2\\.840\\.113556\\.1\\.4\\.803:=2\\)`) or\n      re.regex($e.additional.fields,\
    \ `\\(accountExpires=9223372036854775807\\)`) or\n      re.regex($e.additional.fields, `\\(accountExpires=0\\)`) or\n      (\n        (\n\
    \          re.regex($e.additional.fields, `\\(sAMAccountType=805306368\\)`) or\n          re.regex($e.additional.fields, `\\(objectCategory=person\\\
    )`) or\n          re.regex($e.additional.fields, `\\(objectCategory=user\\)`) or\n          re.regex($e.additional.fields, `\\(objectClass=user\\\
    )`)\n        )\n        and\n        not re.regex($e.additional.fields, `\\(domainSid=\\)`)\n        and\n        not re.regex($e.additional.fields,\
    \ `\\(objectSid=\\)`)\n      )\n    )\n    \n    $e.principal.hostname = $host\n\n  match:\n    $host over 5m\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-m365_defender.event*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.category == "AdvancedHunting-DeviceEvents"
      AND event.type == "LdapSearch"
      AND tags != "[ ]"
      AND microsoft_defender.scope != "Base"
      AND (
        microsoft_defender.additional_fields LIKE "*(userAccountControl:1.2.840.113556.1.4.803:=65536)*"
        OR microsoft_defender.additional_fields LIKE "*(userAccountControl:1.2.840.113556.1.4.803:=544)*"
        OR microsoft_defender.additional_fields LIKE "*!(UserAccountControl:1.2.840.113556.1.4.803:=2)*"
        OR microsoft_defender.additional_fields LIKE "*(accountExpires=9223372036854775807)*"
        OR microsoft_defender.additional_fields LIKE "*(accountExpires=0)*"
        OR (
          (
            microsoft_defender.additional_fields LIKE "*(sAMAccountType=805306368)*"
            OR microsoft_defender.additional_fields LIKE "*(objectCategory=person)*"
            OR microsoft_defender.additional_fields LIKE "*(objectCategory=user)*"
            OR microsoft_defender.additional_fields LIKE "*(objectClass=user)*"
          )
          AND NOT microsoft_defender.additional_fields LIKE "*(domainSid=)*"
          AND NOT microsoft_defender.additional_fields LIKE "*(objectSid=)*"
        )
      )
    | KEEP @timestamp, host.name, user.name, event.type, microsoft_defender.additional_fields, microsoft_defender.scope, tags
  leql: |
    where(source_json.ActionType="LdapSearch" AND source_json.AdditionalFields!="[ ]" AND source_json.SearchScope!="Base" AND (source_json.AdditionalFields ICONTAINS "(userAccountControl:1.2.840.113556.1.4.803:=65536)" OR source_json.AdditionalFields ICONTAINS "(userAccountControl:1.2.840.113556.1.4.803:=544)" OR source_json.AdditionalFields ICONTAINS "!(UserAccountControl:1.2.840.113556.1.4.803:=2)" OR source_json.AdditionalFields ICONTAINS "(accountExpires=9223372036854775807)" OR source_json.AdditionalFields ICONTAINS "(accountExpires=0)" OR ((source_json.AdditionalFields ICONTAINS "(sAMAccountType=805306368)" OR source_json.AdditionalFields ICONTAINS "(objectCategory=person)" OR source_json.AdditionalFields ICONTAINS "(objectCategory=user)" OR source_json.AdditionalFields ICONTAINS "(objectClass=user)") AND NOT source_json.AdditionalFields ICONTAINS "(domainSid=)" AND NOT source_json.AdditionalFields ICONTAINS "(objectSid=)")))
  crowdstrike: |
    event_category="AdvancedHunting-DeviceEvents" event_type="LdapSearch" tags!=*"[ ]"* scope!=Base
    | (additional_fields=*"(userAccountControl:1.2.840.113556.1.4.803:=65536)"* OR additional_fields=*"(userAccountControl:1.2.840.113556.1.4.803:=544)"* OR additional_fields=*"!(UserAccountControl:1.2.840.113556.1.4.803:=2)"* OR additional_fields=*"(accountExpires=9223372036854775807)"* OR additional_fields=*"(accountExpires=0)"* OR ((additional_fields=*"(sAMAccountType=805306368)"* OR additional_fields=*"(objectCategory=person)"* OR additional_fields=*"(objectCategory=user)"* OR additional_fields=*"(objectClass=user)"*) AND (additional_fields!=*"(domainSid=)"* AND additional_fields!=*"(objectSid=)"*)))
    | table([@timestamp, ComputerName, DeviceName, additional_fields, scope, tags])
  xql: |
    dataset = msft_defender_events
    | filter event_category = "AdvancedHunting-DeviceEvents"
    | filter event_type = "LdapSearch"
    | filter tags != "[ ]"
    | filter scope != "Base"
    | filter (
        additional_fields contains "(userAccountControl:1.2.840.113556.1.4.803:=65536)"
        or additional_fields contains "(userAccountControl:1.2.840.113556.1.4.803:=544)"
        or additional_fields contains "!(UserAccountControl:1.2.840.113556.1.4.803:=2)"
        or additional_fields contains "(accountExpires=9223372036854775807)"
        or additional_fields contains "(accountExpires=0)"
        or (
            (
                additional_fields contains "(sAMAccountType=805306368)"
                or additional_fields contains "(objectCategory=person)"
                or additional_fields contains "(objectCategory=user)"
                or additional_fields contains "(objectClass=user)"
            )
            and not additional_fields contains "(domainSid=)"
            and not additional_fields contains "(objectSid=)"
        )
    )
    | fields _time, agent_hostname, event_type, scope, additional_fields, tags
  lucene: |
    event_category:"AdvancedHunting-DeviceEvents" AND event_type:"LdapSearch" AND _exists_:tags AND NOT tags:"[ ]" AND NOT scope:"Base" AND (additional_fields:*\(userAccountControl\:1.2.840.113556.1.4.803\:\=65536\)* OR additional_fields:*\(userAccountControl\:1.2.840.113556.1.4.803\:\=544\)* OR additional_fields:*\!\(UserAccountControl\:1.2.840.113556.1.4.803\:\=2\)* OR additional_fields:*\(accountExpires\=9223372036854775807\)* OR additional_fields:*\(accountExpires\=0\)* OR ((additional_fields:*\(sAMAccountType\=805306368\)* OR additional_fields:*\(objectCategory\=person\)* OR additional_fields:*\(objectCategory\=user\)* OR additional_fields:*\(objectClass\=user\)*) AND (NOT additional_fields:*\(domainSid\=\)* AND NOT additional_fields:*\(objectSid\=\)*)))
  sumo: |
    _sourceCategory=*Defender* OR _sourceCategory=*AdvancedHunting* "LdapSearch"
    | json field=_raw "ActionType" as event_type
    | json field=_raw "AdditionalFields" as additional_fields
    | json field=_raw "Tags" as tags
    | json field=_raw "Scope" as scope
    | where event_type = "LdapSearch"
    | where tags != "[ ]"
    | where scope != "Base"
    | where (
        additional_fields matches "*(userAccountControl:1.2.840.113556.1.4.803:=65536)*"
        OR additional_fields matches "*(userAccountControl:1.2.840.113556.1.4.803:=544)*"
        OR additional_fields matches "*!(UserAccountControl:1.2.840.113556.1.4.803:=2)*"
        OR additional_fields matches "*(accountExpires=9223372036854775807)*"
        OR additional_fields matches "*(accountExpires=0)*"
        OR (
            (
                additional_fields matches "*(sAMAccountType=805306368)*"
                OR additional_fields matches "*(objectCategory=person)*"
                OR additional_fields matches "*(objectCategory=user)*"
                OR additional_fields matches "*(objectClass=user)*"
            )
            AND NOT (
                additional_fields matches "*(domainSid=)*"
                OR additional_fields matches "*(objectSid=)*"
            )
        )
    )
    | fields _messageTime, _sourceHost, event_type, additional_fields, tags, scope

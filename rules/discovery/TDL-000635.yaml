rule_id: TDL-DIS-000635
v4_id: '000635'
name: LDAP Account Recon - Defender
description: This detection identifies suspicious LDAP search activity targeting Active Directory user accounts, privileged objects, or account
  attributes that are commonly queried during reconnaissance.
tactic: Discovery
tactic_id: TA0007
technique_id: T1087
technique_name: Account Discovery
platform:
- Windows
data_sources:
- Microsoft Defender
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype=\"MDE:AdvancedHunting:DeviceEvents\" ActionType=\"LdapSearch\" \n| where isnotnull(AdditionalFields) AND AdditionalFields!=\"\
    [ ]\" AND Scope!=\"Base\"\n| where \n    (like(AdditionalFields, \"%userAccountControl:1.2.840.113556.1.4.803:=65536%\")) OR\n    (like(AdditionalFields,\
    \ \"%userAccountControl:1.2.840.113556.1.4.803:=544%\")) OR\n    (like(AdditionalFields, \"%!UserAccountControl:1.2.840.113556.1.4.803:=2%\"\
    )) OR\n    (like(AdditionalFields, \"%accountExpires=9223372036854775807%\")) OR\n    (like(AdditionalFields, \"%accountExpires=0%\")) OR\n\
    \    (\n        (\n            like(AdditionalFields, \"%sAMAccountType=805306368%\") OR\n            like(AdditionalFields, \"%objectCategory=person%\"\
    ) OR\n            like(AdditionalFields, \"%objectCategory=user%\") OR\n            like(AdditionalFields, \"%objectClass=user%\")\n     \
    \   ) AND\n        (\n            NOT like(AdditionalFields, \"%domainSid=%\") AND\n            NOT like(AdditionalFields, \"%objectSid=%\"\
    )\n        )\n    )\n| table _time, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, AdditionalFields\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000635 {\n  meta:\n    author = \"TDL\"\n    description = \"LDAP Account Recon - Defender\"\n    severity = \"LOW\"\
    \n    tactic = \"TA0007\"\n    technique = \"T1087\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name = /.+/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '1 AdvancedHunting Device Event

  Where event_category = "AdvancedHunting-DeviceEvents"

  Where event_type = "LdapSearch"

  Where tags != "[ ]"

  Where scope != "Base"


  Where additional_fields contains "(userAccountControl:1.2.840.113556.1.4.803:=65536)"

  OR

  Where additional_fields contains "(userAccountControl:1.2.840.113556.1.4.803:=544)"

  OR

  Where additional_fields contains "!(UserAccountControl:1.2.840.113556.1.4.803:=2)"

  OR

  Where additional_fields contains "(accountExpires=9223372036854775807)"

  OR

  Where additional_fields contains "(accountExpires=0)"

  OR

  (

  (

  Where additional_fields contains "(sAMAccountType=805306368)"

  OR Where additional_fields contains "(objectCategory=person)"

  OR Where additional_fields contains "(objectCategory=user)"

  OR Where additional_fields contains "(objectClass=user)"

  )

  AND

  (

  Where additional_fields does not contain "(domainSid=)"

  AND Where additional_fields does not contain "(objectSid=)"

  )

  )'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

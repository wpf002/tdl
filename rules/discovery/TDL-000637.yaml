pseudo_logic: "1 AdvancedHunting Device Event\nWhere event_category = \"AdvancedHunting-DeviceEvents\"\nWhere event_type = \"LdapSearch\"\nWhere\
  \ tags != \"[ ]\"\nWhere scope!= \"Base\"\n\nWhere (\n    additional_fields contains \"(adminCount=1)\"\n    OR\n    (\n        Where additional_fields\
  \ contains \"(groupType:1.2.840.113556.1.4.803:=2147483648)\"\n        OR Where additional_fields contains \"(groupType:1.2.840.113556.1.4.803:=2147483656)\"\
  \n        OR Where additional_fields contains \"(groupType:1.2.840.113556.1.4.803:=2147483652)\"\n        OR Where additional_fields contains\
  \ \"(groupType:1.2.840.113556.1.4.803:=2147483650)\"\n        OR Where additional_fields contains \"(sAMAccountType=536870913)\"\n        OR\
  \ Where additional_fields contains \"(sAMAccountType=536870912)\"\n        OR Where additional_fields contains \"(sAMAccountType=268435457)\"\
  \n        OR Where additional_fields contains \"(sAMAccountType=268435456)\"\n        OR Where additional_fields contains \"(objectCategory=organizationalUnit)\"\
  \n        OR Where additional_fields contains \"(objectCategory=group)\"\n        OR Where additional_fields contains \"(objectClass=group)\"\
  \n        OR Where additional_fields contains \"(primaryGroupID=512)\"\n        OR Where additional_fields contains \"Domain Admins\"\n    )\n\
  \    AND\n    (\n        Where additional_fields does NOT contain \"(domainSid=)\"\n        AND Where additional_fields does NOT contain \"\
  (objectSid=)\"\n    )\n)\n\nAND\nWhere additional_fields contains \"nTSecurityDescriptor\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

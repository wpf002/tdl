pseudo_logic: "1 AdvancedHunting Device Event\nWhere event_category = \"AdvancedHunting-DeviceEvents\"\nWhere event_type = \"LdapSearch\"\nWhere\
  \ tags != \"[ ]\"\nWhere scope!=\"Base\"\n\nWhere (\n    additional_fields contains \"(sAMAccountType=805306369)\"\n    OR additional_fields\
  \ contains \"(objectCategory=Computer)\"\n    OR additional_fields contains \"(objectCategory=nTDSDSA)\"\n    OR additional_fields contains\
  \ \"(objectCategory=server)\"\n    OR additional_fields contains \"(objectClass=computer)\"\n    OR additional_fields contains \"(objectClass=server)\"\
  \n    OR additional_fields contains \"(primaryGroupID=521)\"\n    OR additional_fields contains \"(primaryGroupID=516)\"\n    OR additional_fields\
  \ contains \"(primaryGroupID=515)\"\n    OR (\n        Where additional_fields contains \"(userAccountControl:1.2.840.113556.1.4.803:=8192)\"\
  \n        OR Where additional_fields contains \"ms-MCS-AdmPwd\"\n    )\n)\n\nAND\nWhere (\n    additional_fields does NOT contain \"(domainSid=)\"\
  \n    AND additional_fields does NOT contain \"(objectSid=)\"\n)"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

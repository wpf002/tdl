rule_id: TDL-DIS-000639
v4_id: 000639
name: LDAP System Recon - Defender
description: Detects LDAP search activity that targets system-level objects, domain configuration data, and core directory infrastructure within
  Active Directory.
tactic: Discovery
tactic_id: TA0007
technique_id: T1018
technique_name: Remote System Discovery
platform:
- Windows
data_sources:
- Microsoft Defender
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype=\"XmlWinEventLog:Microsoft-Windows-Windows Defender/Operational\" OR sourcetype=\"MDE:AdvancedHunting:DeviceEvents\"\
    \ OR sourcetype=\"MDE\" ActionType=\"LdapSearch\" \n| search AdditionalFields!=\"[ ]\" OR AdditionalFields!=\"[]\" \n| search SearchScope!=\"\
    Base\" \n| search (AdditionalFields=\"*(sAMAccountType=805306369)*\" OR AdditionalFields=\"*(objectCategory=Computer)*\" OR AdditionalFields=\"\
    *(objectCategory=nTDSDSA)*\" OR AdditionalFields=\"*(objectCategory=server)*\" OR AdditionalFields=\"*(objectClass=computer)*\" OR AdditionalFields=\"\
    *(objectClass=server)*\" OR AdditionalFields=\"*(primaryGroupID=521)*\" OR AdditionalFields=\"*(primaryGroupID=516)*\" OR AdditionalFields=\"\
    *(primaryGroupID=515)*\" OR AdditionalFields=\"*(userAccountControl:1.2.840.113556.1.4.803:=8192)*\" OR AdditionalFields=\"*ms-MCS-AdmPwd*\"\
    ) \n| search NOT (AdditionalFields=\"*(domainSid=)*\" OR AdditionalFields=\"*(objectSid=)*\") \n| table _time, DeviceName, InitiatingProcessAccountName,\
    \ InitiatingProcessFileName, InitiatingProcessCommandLine, SearchFilter, SearchScope, AdditionalFields\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000639 {\n  meta:\n    author = \"TDL\"\n    description = \"LDAP System Recon - Defender\"\n    severity = \"LOW\"\
    \n    tactic = \"TA0007\"\n    technique = \"T1018\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name = /.+/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 AdvancedHunting Device Event\nWhere event_category = \"AdvancedHunting-DeviceEvents\"\nWhere event_type = \"LdapSearch\"\nWhere\
  \ tags != \"[ ]\"\nWhere scope!=\"Base\"\n\nWhere (\n    additional_fields contains \"(sAMAccountType=805306369)\"\n    OR additional_fields\
  \ contains \"(objectCategory=Computer)\"\n    OR additional_fields contains \"(objectCategory=nTDSDSA)\"\n    OR additional_fields contains\
  \ \"(objectCategory=server)\"\n    OR additional_fields contains \"(objectClass=computer)\"\n    OR additional_fields contains \"(objectClass=server)\"\
  \n    OR additional_fields contains \"(primaryGroupID=521)\"\n    OR additional_fields contains \"(primaryGroupID=516)\"\n    OR additional_fields\
  \ contains \"(primaryGroupID=515)\"\n    OR (\n        Where additional_fields contains \"(userAccountControl:1.2.840.113556.1.4.803:=8192)\"\
  \n        OR Where additional_fields contains \"ms-MCS-AdmPwd\"\n    )\n)\n\nAND\nWhere (\n    additional_fields does NOT contain \"(domainSid=)\"\
  \n    AND additional_fields does NOT contain \"(objectSid=)\"\n)"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

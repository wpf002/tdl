rule_id: TDL-DIS-000640
v4_id: '000640'
name: LDAP Trust Recon - Defender
description: Detects LDAP search activity targeting Active Directory trust relationships, including domain trusts, forest trusts, transitive relationships,
  and trust configuration attributes.
tactic: Discovery
tactic_id: TA0007
technique_id: T1482
technique_name: Domain Trust Discovery
platform:
- Windows
data_sources:
- Microsoft Defender
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=* sourcetype="mscs:defender:advanced:hunting" OR sourcetype="MDATPAdvancedHunting" OR source="*DeviceEvents*"

    (ActionType="LdapSearch" OR event_type="LdapSearch")

    AdditionalFields!="[]" AdditionalFields!="[ ]"

    SearchFilter!="*scope:0*" SearchFilter!="*Scope:0*" SearchFilter!="*scope: 0*"

    (AdditionalFields="*(objectCategory=nTDSDSA)*" OR AdditionalFields="*(objectCategory=domain)*" OR AdditionalFields="*(objectClass=trustedDomain)*")

    | where NOT match(AdditionalFields, ".*\(domainSid=\).*") AND NOT match(AdditionalFields, ".*\(objectSid=\).*")

    | table _time, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, SearchFilter, AdditionalFields

    '
  kql: |
    DeviceEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "LdapSearch"
    | where AdditionalFields != "[]"
    | extend parsedFields = parse_json(AdditionalFields)
    | extend SearchFilter = tostring(parsedFields.SearchFilter), SearchScope = tostring(parsedFields.SearchScope)
    | where SearchScope != "Base"
    | where (SearchFilter contains "(objectCategory=nTDSDSA)" or SearchFilter contains "(objectCategory=domain)" or SearchFilter contains "(objectClass=trustedDomain)")
    | where SearchFilter !contains "(domainSid=)" and SearchFilter !contains "(objectSid=)"
    | project TimeGenerated, DeviceName, AccountName, ActionType, SearchFilter, SearchScope, InitiatingProcessFileName, InitiatingProcessCommandLine, AdditionalFields
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS device, username, "ActionType", "AdditionalFields", sourceip, eventtime
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%Microsoft Defender%'
      AND "ActionType" = 'LdapSearch'
      AND "AdditionalFields" IS NOT NULL
      AND "SearchScope" != 'Base'
      AND (
        "AdditionalFields" ILIKE '%(objectCategory=nTDSDSA)%'
        OR "AdditionalFields" ILIKE '%(objectCategory=domain)%'
        OR "AdditionalFields" ILIKE '%(objectClass=trustedDomain)%'
      )
      AND "AdditionalFields" NOT ILIKE '%(domainSid=)%'
      AND "AdditionalFields" NOT ILIKE '%(objectSid=)%'
    LAST 24 HOURS
  yara_l: "rule mitre_t1482_domain_trust_discovery {\n  meta:\n    author = \"Chronicle Detection\"\n    description = \"Detects LDAP searches\
    \ for domain trust discovery (T1482)\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1482\"\n    severity = \"\
    Medium\"\n\n  events:\n    $e.metadata.product_name = \"Microsoft Defender for Endpoint\"\n    $e.metadata.product_event_type = \"LdapSearch\"\
    \n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    \n    // tags != \"[ ]\" means tags field is populated/not empty\n    $e.security_result.detection_fields[\"\
    tags\"] != \"[ ]\"\n    \n    // scope != \"Base\"\n    $e.security_result.detection_fields[\"scope\"] != \"Base\"\n    \n    // additional_fields\
    \ contains domain trust indicators\n    (\n      re.regex($e.security_result.detection_fields[\"additional_fields\"], `\\(objectCategory=nTDSDSA\\\
    )`) or\n      re.regex($e.security_result.detection_fields[\"additional_fields\"], `\\(objectCategory=domain\\)`) or\n      re.regex($e.security_result.detection_fields[\"\
    additional_fields\"], `\\(objectClass=trustedDomain\\)`)\n    )\n    \n    // Exclusions: does NOT contain domainSid or objectSid\n    not\
    \ re.regex($e.security_result.detection_fields[\"additional_fields\"], `\\(domainSid=\\)`)\n    not re.regex($e.security_result.detection_fields[\"\
    additional_fields\"], `\\(objectSid=\\)`)\n    \n    $e.principal.hostname = $host\n\n  match:\n    $host over 5m\n\n  condition:\n    $e\n\
    }\n"
  esql: |
    FROM logs-microsoft_defender*
    | WHERE @timestamp > NOW() - 24 hour
      AND event.category == "AdvancedHunting-DeviceEvents"
      AND event.type == "LdapSearch"
      AND tags != "[ ]"
      AND (
        additional_fields LIKE "*(objectCategory=nTDSDSA)*"
        OR additional_fields LIKE "*(objectCategory=domain)*"
        OR additional_fields LIKE "*(objectClass=trustedDomain)*"
      )
      AND NOT additional_fields LIKE "*(domainSid=)*"
      AND NOT additional_fields LIKE "*(objectSid=)*"
      AND (scope != "Base" OR scope IS NULL)
    | KEEP @timestamp, host.name, user.name, additional_fields, event.type, scope
  leql: |
    where(source_json.ActionType="LdapSearch" AND source_json.AdditionalFields!="[ ]" AND source_json.SearchScope!="Base" AND (source_json.AdditionalFields ICONTAINS "(objectCategory=nTDSDSA)" OR source_json.AdditionalFields ICONTAINS "(objectCategory=domain)" OR source_json.AdditionalFields ICONTAINS "(objectClass=trustedDomain)") AND source_json.AdditionalFields NOT ICONTAINS "(domainSid=)" AND source_json.AdditionalFields NOT ICONTAINS "(objectSid=)")
  crowdstrike: |
    event_category="AdvancedHunting-DeviceEvents" event_type="LdapSearch" tags!=*\[\]* scope!="Base"
    (additional_fields=*\(objectCategory=nTDSDSA\)* OR additional_fields=*\(objectCategory=domain\)* OR additional_fields=*\(objectClass=trustedDomain\)*)
    (NOT additional_fields=*\(domainSid=\)* AND NOT additional_fields=*\(objectSid=\)*)
    | table([@timestamp, ComputerName, InitiatingProcessFileName, InitiatingProcessCommandLine, additional_fields])
  xql: |
    dataset = cloud_audit_logs
    | filter event_category = "AdvancedHunting-DeviceEvents" and event_type = "LdapSearch"
    | filter tags != "[ ]" and scope != "Base"
    | filter (additional_fields contains "(objectCategory=nTDSDSA)" or additional_fields contains "(objectCategory=domain)" or additional_fields contains "(objectClass=trustedDomain)")
    | filter additional_fields not contains "(domainSid=)" and additional_fields not contains "(objectSid=)"
    | fields _time, agent_hostname, actor_effective_username, additional_fields, scope, tags
  lucene: |
    event_category:"AdvancedHunting-DeviceEvents" AND event_type:"LdapSearch" AND _exists_:tags AND NOT tags:"[ ]" AND NOT scope:"Base" AND (additional_fields:*\(objectCategory\=nTDSDSA\)* OR additional_fields:*\(objectCategory\=domain\)* OR additional_fields:*\(objectClass\=trustedDomain\)*) AND NOT additional_fields:*\(domainSid\=\)* AND NOT additional_fields:*\(objectSid\=\)*
  sumo: |
    _sourceCategory=*Defender* OR _sourceCategory=*AdvancedHunting* "LdapSearch"
    | json field=_raw "ActionType" as event_type
    | json field=_raw "AdditionalFields" as additional_fields
    | json field=_raw "RemoteUrl" as tags
    | json field=_raw "RequestAccountName" as scope
    | where event_type = "LdapSearch"
    | where !(tags = "[ ]" or tags = "[]")
    | where !(scope = "Base")
    | where (additional_fields matches "*objectCategory=nTDSDSA*" or additional_fields matches "*objectCategory=domain*" or additional_fields matches "*objectClass=trustedDomain*")
    | where !(additional_fields matches "*domainSid=*" or additional_fields matches "*objectSid=*")
    | fields _messageTime, _sourceHost, event_type, additional_fields, tags, scope
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- discovery
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 AdvancedHunting Device Event\nWhere event_category = \"AdvancedHunting-DeviceEvents\"\nWhere event_type = \"LdapSearch\"\nWhere\
  \ tags != \"[ ]\"\nWhere scope!=\"Base\"\n\nWhere (\n    additional_fields contains \"(objectCategory=nTDSDSA)\"\n    OR additional_fields contains\
  \ \"(objectCategory=domain)\"\n    OR additional_fields contains \"(objectClass=trustedDomain)\"\n)\nAND\nWhere (\n    additional_fields does\
  \ NOT contain \"(domainSid=)\"\n    AND additional_fields does NOT contain \"(objectSid=)\"\n)"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

rule_id: TDL-DIS-000755
v4_id: '000755'
name: Non-Browser Process Reading Browser History DB
description: Read of Chrome "History", Firefox places.sqlite or Safari History.db by a process that is not the browser itself. Generated from
  gap analysis against canonical ATT&CK Enterprise matrix (T1217 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1217
technique_name: Browser Information Discovery
platform:
- Windows
- macOS
- Linux
data_sources:
- EDR
- Sysmon
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype IN (edr*, sysmon*, *endpoint*) \n(file_path IN (\"*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\*\\\\History\"\
    , \"*\\\\AppData\\\\Roaming\\\\Mozilla\\\\Firefox\\\\Profiles\\\\*\\\\places.sqlite\", \"*\\\\Library\\\\Safari\\\\History.db\", \"*/.config/google-chrome/*/History\"\
    , \"*/.mozilla/firefox/*/places.sqlite\", \"*/Library/Safari/History.db\"))\n(EventCode=11 OR action IN (\"open\", \"read\", \"access\") OR\
    \ event_type IN (\"file_access\", \"file_read\"))\nNOT (process_name IN (\"chrome.exe\", \"firefox.exe\", \"safari.exe\", \"Google Chrome\"\
    , \"Firefox\", \"Safari\") OR Image IN (\"*\\\\chrome.exe\", \"*\\\\firefox.exe\", \"*\\\\Safari.exe\", \"*/chrome\", \"*/firefox\", \"*/Safari\"\
    ))\n| stats count earliest(_time) as first_time latest(_time) as last_time values(file_path) as accessed_files by host, process_name, Image,\
    \ user\n| convert ctime(first_time) ctime(last_time)\n| table first_time last_time host user process_name Image accessed_files count\n"
  kql: |
    DeviceFileEvents
    | where TimeGenerated > ago(24h)
    | where FileName has_any ("History", "places.sqlite", "History.db")
    | where FolderPath has_any ("Chrome", "Firefox", "Safari")
    | where InitiatingProcessFileName !in~ ("chrome.exe", "firefox.exe", "safari.exe", "Google Chrome", "Firefox", "Safari")
    | where ActionType == "FileOpened" or ActionType == "FileRead"
    | project TimeGenerated, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FolderPath, FileName, ActionType
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Process Name\", \"Image\", \"TargetFilename\", sourceip, COUNT(*) AS\
    \ access_count\nFROM events\nWHERE (\n    (\"TargetFilename\" ILIKE '%\\Google\\Chrome\\User Data\\%\\History' \n     OR \"TargetFilename\"\
    \ ILIKE '%/Google/Chrome/%/History'\n     OR \"TargetFilename\" ILIKE '%\\AppData\\Local\\Google\\Chrome\\User Data\\%\\History'\n     OR\
    \ \"TargetFilename\" ILIKE '%/Library/Application Support/Google/Chrome/%/History')\n    AND \"Process Name\" NOT ILIKE '%chrome.exe%'\n \
    \   AND \"Process Name\" NOT ILIKE '%chrome%'\n    AND \"Image\" NOT ILIKE '%chrome.exe%'\n    AND \"Image\" NOT ILIKE '%chrome%'\n)\nOR (\n\
    \    (\"TargetFilename\" ILIKE '%places.sqlite%'\n     OR \"TargetFilename\" ILIKE '%\\Mozilla\\Firefox\\Profiles\\%places.sqlite%'\n    \
    \ OR \"TargetFilename\" ILIKE '%/Firefox/Profiles/%places.sqlite%'\n     OR \"TargetFilename\" ILIKE '%/.mozilla/firefox/%places.sqlite%')\n\
    \    AND \"Process Name\" NOT ILIKE '%firefox.exe%'\n    AND \"Process Name\" NOT ILIKE '%firefox%'\n    AND \"Image\" NOT ILIKE '%firefox.exe%'\n\
    \    AND \"Image\" NOT ILIKE '%firefox%'\n)\nOR (\n    (\"TargetFilename\" ILIKE '%Safari/History.db%'\n     OR \"TargetFilename\" ILIKE '%/Library/Safari/History.db%'\n\
    \     OR \"TargetFilename\" ILIKE '%\\Safari\\History.db%')\n    AND \"Process Name\" NOT ILIKE '%safari%'\n    AND \"Image\" NOT ILIKE '%safari%'\n\
    )\nGROUP BY eventtime, LOGSOURCENAME(logsourceid), username, \"Process Name\", \"Image\", \"TargetFilename\", sourceip\nLAST 24 HOURS\n"
  yara_l: |
    rule browser_history_access_non_browser {
      meta:
        author = "TDL"
        description = "T1217 - Browser history file access by non-browser process"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1217"
        severity = "Medium"

      events:
        $e.metadata.event_type = "FILE_OPEN"
        (
          re.regex($e.target.file.full_path, `(?i)\\Google\\Chrome\\.*\\History$`) or
          re.regex($e.target.file.full_path, `(?i)places\.sqlite$`) or
          re.regex($e.target.file.full_path, `(?i)History\.db$`)
        )
        not re.regex($e.principal.process.file.full_path, `(?i)(chrome\.exe|firefox\.exe|safari\.exe|chrome|firefox|safari)$`)
        $e.principal.hostname = $host
        $e.principal.process.file.full_path = $proc

      match:
        $host, $proc over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.file*, logs-windows.sysmon_operational*
    | WHERE event.action IN ("open", "read", "access") OR winlog.event_id == 11
    | WHERE (file.path LIKE "*Chrome*History*" OR file.path LIKE "*places.sqlite*" OR file.path LIKE "*Safari*History.db*")
    | WHERE NOT (TO_LOWER(process.name) LIKE "*chrome*" OR TO_LOWER(process.name) LIKE "*firefox*" OR TO_LOWER(process.name) LIKE "*safari*")
    | STATS count = COUNT(*) BY host.name, process.name, process.executable, file.path, user.name
    | KEEP host.name, process.name, process.executable, file.path, user.name, count
  leql: |
    where(file_path ICONTAINS "History" OR file_path ICONTAINS "places.sqlite" OR file_path ICONTAINS "History.db") AND NOT (process_name ICONTAINS "chrome" OR process_name ICONTAINS "firefox" OR process_name ICONTAINS "safari")
  crowdstrike: |
    event_simpleName=*FileAccess* (TargetFileName=*History OR TargetFileName=*places.sqlite OR TargetFileName=*History.db)
    | regex("(?<browser_process>chrome|firefox|safari)", field=ImageFileName, strict=false)
    | browser_process!=*
    | table([@timestamp, ComputerName, UserName, ImageFileName, TargetFileName, CommandLine])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_FILE_READ\n| filter (action_file_path ~= \"(?i).*\\\\AppData\\\\Local\\\\Google\\\
    \\Chrome\\\\User Data\\\\.*\\\\History$\" \n   or action_file_path ~= \"(?i).*\\\\Library\\\\Application Support\\\\Google\\\\Chrome\\\\.*\\\
    \\History$\"\n   or action_file_path ~= \"(?i).*/.config/google-chrome/.*/History$\"\n   or action_file_path ~= \"(?i).*\\\\AppData\\\\Roaming\\\
    \\Mozilla\\\\Firefox\\\\Profiles\\\\.*\\\\places\\\\.sqlite$\"\n   or action_file_path ~= \"(?i).*\\\\Library\\\\Application Support\\\\Firefox\\\
    \\Profiles\\\\.*\\\\places\\\\.sqlite$\"\n   or action_file_path ~= \"(?i).*/.mozilla/firefox/.*/places\\\\.sqlite$\"\n   or action_file_path\
    \ ~= \"(?i).*\\\\Library\\\\Safari\\\\History\\\\.db$\"\n   or action_file_path ~= \"(?i).*/Library/Safari/History\\\\.db$\")\n| filter lowercase(actor_process_image_name)\
    \ not in (\"chrome.exe\", \"firefox.exe\", \"safari\")\n   and not (lowercase(actor_process_image_name) contains \"chrome\" or lowercase(actor_process_image_name)\
    \ contains \"firefox\" or lowercase(actor_process_image_name) contains \"safari\")\n| fields _time, agent_hostname, actor_process_image_name,\
    \ actor_process_image_command_line, action_file_path, actor_effective_username\n"
  lucene: |
    (file.path:(*Chrome*History* OR *places.sqlite* OR *History.db*) AND event.action:(read OR open OR access)) AND NOT (process.name:(chrome.exe OR firefox.exe OR safari.exe OR Chrome OR Firefox OR Safari))
  sumo: |
    _sourceCategory=*EDR* OR _sourceCategory=*Sysmon*
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetFilename" as target_file
    | json field=_raw "Image" as process_image
    | json field=_raw "ProcessName" as process_name
    | where (target_file matches "*Chrome*History*" OR target_file matches "*places.sqlite*" OR target_file matches "*History.db*")
    | where NOT (process_image matches "*chrome.exe*" OR process_image matches "*firefox.exe*" OR process_image matches "*Safari*" OR process_name matches "*chrome*" OR process_name matches "*firefox*" OR process_name matches "*Safari*")
    | fields _messageTime, _sourceHost, process_image, process_name, target_file
pseudo_logic: Read of Chrome "History", Firefox places.sqlite or Safari History.db by a process that is not the browser itself.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-DIS-000755
v4_id: '000755'
name: Non-Browser Process Reading Browser History DB
description: Read of Chrome "History", Firefox places.sqlite or Safari History.db by a process that is not the browser itself. Generated from
  gap analysis against canonical ATT&CK Enterprise matrix (T1217 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1217
technique_name: Browser Information Discovery
platform:
- Windows
- macOS
- Linux
data_sources:
- EDR
- Sysmon
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype IN (edr*, sysmon*, *endpoint*) \n(file_path IN (\"*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\*\\\\History\"\
    , \"*\\\\AppData\\\\Roaming\\\\Mozilla\\\\Firefox\\\\Profiles\\\\*\\\\places.sqlite\", \"*\\\\Library\\\\Safari\\\\History.db\", \"*/.config/google-chrome/*/History\"\
    , \"*/.mozilla/firefox/*/places.sqlite\", \"*/Library/Safari/History.db\"))\n(EventCode=11 OR action IN (\"open\", \"read\", \"access\") OR\
    \ event_type IN (\"file_access\", \"file_read\"))\nNOT (process_name IN (\"chrome.exe\", \"firefox.exe\", \"safari.exe\", \"Google Chrome\"\
    , \"Firefox\", \"Safari\") OR Image IN (\"*\\\\chrome.exe\", \"*\\\\firefox.exe\", \"*\\\\Safari.exe\", \"*/chrome\", \"*/firefox\", \"*/Safari\"\
    ))\n| stats count earliest(_time) as first_time latest(_time) as last_time values(file_path) as accessed_files by host, process_name, Image,\
    \ user\n| convert ctime(first_time) ctime(last_time)\n| table first_time last_time host user process_name Image accessed_files count\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000755 {\n  meta:\n    author = \"TDL\"\n    description = \"Non-Browser Process Reading Browser History DB\"\n  \
    \  severity = \"MEDIUM\"\n    tactic = \"TA0007\"\n    technique = \"T1217\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Read of Chrome "History", Firefox places.sqlite or Safari History.db by a process that is not the browser itself.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

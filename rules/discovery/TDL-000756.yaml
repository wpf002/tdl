rule_id: TDL-DIS-000756
v4_id: '000756'
name: Wide-Scope ListServices / GetServices Without Prior Use
description: Identity invokes service-enumeration APIs (resourcegroups.ListResources, billing.GetCostAndUsage) for the first time. New tenants
  of a compromised role. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1526 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1526
technique_name: Cloud Service Discovery
platform:
- AWS
- Azure
- GCP
- SaaS
data_sources:
- Cloud Audit Logs
severity: Low
fidelity: Medium
lifecycle: Proposed
risk_score: 35
queries:
  spl: 'index=cloud_audit (action="resourcegroups.ListResources" OR action="billing.GetCostAndUsage" OR action="resources.cloudresourcemanager.projects.list"
    OR action="compute.projects.get" OR action="Microsoft.Resources/subscriptions/resourceGroups/read" OR action="Microsoft.CostManagement/query/action")

    | eval identity=coalesce(user, user_name, userIdentity.principalId, actor.user.email, userIdentity.arn)

    | eval service_action=coalesce(action, eventName, operation.name, operationName)

    | streamstats earliest(_time) as first_seen by identity, service_action

    | where _time = first_seen

    | table _time, identity, service_action, src, cloud_provider, account_id

    '
  kql: |
    let lookback = 14d;
    let detection_window = 1h;
    let baseline = union isfuzzy=true AWSCloudTrail, AzureActivity, GCPAuditLogs
    | where TimeGenerated between (ago(lookback) .. ago(detection_window))
    | where (EventName has_any ("ListResources", "GetCostAndUsage") or OperationName has_any ("resourcegroups/resources/list", "Microsoft.CostManagement/query") or MethodName has_any ("v1.compute.instances.aggregatedList", "cloudbilling.services.list"))
    | extend Identity = coalesce(UserIdentityPrincipalid, UserPrincipalName, CallerIpAddress, tostring(parse_json(AuthenticationContext).principal))
    | summarize by Identity;
    union isfuzzy=true AWSCloudTrail, AzureActivity, GCPAuditLogs
    | where TimeGenerated > ago(detection_window)
    | where (EventName has_any ("ListResources", "GetCostAndUsage") or OperationName has_any ("resourcegroups/resources/list", "Microsoft.CostManagement/query") or MethodName has_any ("v1.compute.instances.aggregatedList", "cloudbilling.services.list"))
    | extend Identity = coalesce(UserIdentityPrincipalid, UserPrincipalName, CallerIpAddress, tostring(parse_json(AuthenticationContext).principal))
    | where isnotempty(Identity)
    | join kind=leftanti baseline on Identity
    | project TimeGenerated, Identity, EventName, OperationName, MethodName, SourceSystem, CallerIpAddress, UserAgent
  aql: |
    SELECT username, sourceip, QIDNAME(qid) AS api_call, LOGSOURCENAME(logsourceid) AS cloud_provider, COUNT(*) AS call_count
    FROM events
    WHERE (QIDNAME(qid) ILIKE '%ListResources%' OR QIDNAME(qid) ILIKE '%GetCostAndUsage%' OR QIDNAME(qid) ILIKE '%resourcegroups%' OR QIDNAME(qid) ILIKE '%billing%')
      AND categoryname(category) ILIKE '%cloud%'
    GROUP BY username, sourceip, QIDNAME(qid), LOGSOURCENAME(logsourceid)
    HAVING call_count >= 1
    LAST 24 HOURS
  yara_l: |
    rule cloud_service_discovery_first_seen {
      meta:
        author = "TDL"
        description = "Detects first-time invocation of cloud service enumeration APIs by an identity"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1526"
        severity = "Medium"

      events:
        $e.metadata.event_type = "GENERIC_EVENT"
        $e.metadata.product_log_id = "cloudaudit.googleapis.com"
        (
          re.regex($e.target.resource.name, `resourcegroups\.ListResources`) or
          re.regex($e.target.resource.name, `billing\.GetCostAndUsage`) or
          re.regex($e.metadata.product_event_type, `(?i)ListResources`) or
          re.regex($e.metadata.product_event_type, `(?i)GetCostAndUsage`) or
          re.regex($e.target.resource.attribute.labels.value, `(?i)resourcegroups.*list`) or
          re.regex($e.target.resource.attribute.labels.value, `(?i)billing.*cost`)
        )
        $e.principal.user.userid = $user

      match:
        $user over 24h

      outcome:
        $risk_score = 50
        $user_list = array_distinct($user)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-aws.cloudtrail*, logs-azure.activitylogs*, logs-gcp.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND (
        event.action IN ("ListResources", "GetCostAndUsage", "resourcegroups:ListResources", "ce:GetCostAndUsage", "Microsoft.Resources/subscriptions/resourceGroups/read", "Microsoft.Consumption/usageDetails/read", "cloudasset.assets.searchAllResources", "cloudbilling.services.list")
        OR event.action LIKE "*ListResources*"
        OR event.action LIKE "*GetCostAndUsage*"
        OR event.action LIKE "*resourceGroups/read*"
        OR event.action LIKE "*usageDetails/read*"
        OR event.action LIKE "*searchAllResources*"
        OR event.action LIKE "*billing*list*"
      )
    | STATS first_seen = MIN(@timestamp), action_count = COUNT(*), actions = VALUES(event.action) BY user.name, user.id, cloud.account.id, cloud.provider
    | WHERE action_count >= 1
    | EVAL is_first_occurrence = CASE(first_seen > NOW() - 1 hour, 1, 0)
    | WHERE is_first_occurrence == 1
    | KEEP first_seen, user.name, user.id, cloud.account.id, cloud.provider, actions, action_count
  leql: |
    where(source_json.eventName IN ["ListResources", "GetCostAndUsage"] OR source_json.operationName ICONTAINS "resourcegroups" OR source_json.operationName ICONTAINS "billing") groupby(source_json.userIdentity.principalId, source_json.userIdentity.arn, source_json.identity.claims.upn, user) calculate(count)
  crowdstrike: |
    (eventName=ListResources OR eventName=GetCostAndUsage OR eventName="resources.cloudresourcemanager.projects.list" OR eventName="compute.*.list" OR eventName="storage.*.list" OR eventSource=*billing* eventName=*Get* OR eventName="Microsoft.CostManagement/query/action")
    | groupBy([userIdentity, eventName], function=[count(as=total), min(@timestamp, as=first_seen)])
    | total=1
    | table([@timestamp, userIdentity, eventName, eventSource, sourceIPAddress, userAgent, first_seen])
  xql: |
    dataset = cloud_audit_logs
    | filter operation in ("ListResources", "GetCostAndUsage", "resourcegroups.list", "resources.list", "cloudbilling.services.list", "compute.instances.list", "storage.buckets.list")
    | alter identity_key = coalesce(identity_name, actor_user)
    | comp min(_time) as first_seen by identity_key, operation
    | join type=left (dataset = cloud_audit_logs | filter operation in ("ListResources", "GetCostAndUsage", "resourcegroups.list", "resources.list", "cloudbilling.services.list", "compute.instances.list", "storage.buckets.list") | alter identity_key = coalesce(identity_name, actor_user) | comp min(_time) as historical_first by identity_key, operation) as historical historical.identity_key = identity_key and historical.operation = operation
    | filter first_seen = historical_first
    | fields _time, identity_key, operation, cloud_provider, tenant_id, project_id
  lucene: |
    (event.action:("resourcegroups:ListResources" OR "billing:GetCostAndUsage" OR "ce:GetCostAndUsage" OR "cloudbilling.services.list" OR "compute.instances.list" OR "storage.buckets.list" OR "iam.roles.list" OR "Microsoft.Resources/subscriptions/resources/read" OR "Microsoft.Consumption/usageDetails/read" OR "Microsoft.CostManagement/query/action") AND event.outcome:success) AND NOT tags:baseline_enumeration
  sumo: "_sourceCategory=*CloudTrail* OR _sourceCategory=*Azure* OR _sourceCategory=*GCP*\n| json field=_raw \"eventName\" as event_name\n| json\
    \ field=_raw \"userIdentity.principalId\" as principal_id\n| json field=_raw \"userIdentity.arn\" as user_arn\n| json field=_raw \"operationName\"\
    \ as operation_name\n| json field=_raw \"callerIdentity\" as caller_identity\n| json field=_raw \"protoPayload.methodName\" as method_name\n\
    | where event_name in (\"ListResources\", \"GetCostAndUsage\") \n   OR operation_name matches \"*ListResources*\" \n   OR operation_name matches\
    \ \"*GetCostAndUsage*\"\n   OR method_name matches \"*listResources*\"\n   OR method_name matches \"*getCostAndUsage*\"\n| if(isNull(principal_id),\
    \ if(isNull(caller_identity), user_arn, caller_identity), principal_id) as identity\n| count as invocation_count by identity, event_name,\
    \ operation_name, method_name\n| where invocation_count = 1\n| fields identity, event_name, operation_name, method_name, invocation_count\n"
pseudo_logic: Identity invokes service-enumeration APIs (resourcegroups.ListResources, billing.GetCostAndUsage) for the first time. New tenants
  of a compromised role.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- cloud-service
- enum
- t1526
- discovery
references:
- https://attack.mitre.org/techniques/T1526/

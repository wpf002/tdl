rule_id: TDL-DIS-000757
v4_id: '000757'
name: Mass ListObjects Across Many Buckets
description: ListObjects/ListBlobs against ≥10 distinct buckets/containers from the same identity in 10m. Bucket-walking pre-exfil. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1619 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1619
technique_name: Cloud Storage Object Discovery
platform:
- AWS
- Azure
- GCP
data_sources:
- Cloud Audit Logs
severity: Low
fidelity: Medium
lifecycle: Proposed
risk_score: 35
queries:
  spl: |
    index=cloud_audit (eventName="ListObjects" OR eventName="ListBucket" OR eventName="ListBlobs" OR eventName="ListContainers" OR action="storage.buckets.list" OR action="storage.objects.list")
    | bin _time span=10m
    | stats dc(bucket) as distinct_buckets values(bucket) as buckets by _time, user, userIdentity.principalId, src_ip
    | where distinct_buckets >= 10
    | table _time, user, userIdentity.principalId, src_ip, distinct_buckets, buckets
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "ListObjects"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%ListObjects%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000757 {\n  meta:\n    author = \"TDL\"\n    description = \"Mass ListObjects Across Many Buckets\"\n    severity\
    \ = \"LOW\"\n    tactic = \"TA0007\"\n    technique = \"T1619\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName\
    \ = /ListObjects/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%ListObjects%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/ListObjects/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*ListObjects*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "ListObjects"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*ListObjects*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*ListObjects*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: ListObjects/ListBlobs against ≥10 distinct buckets/containers from the same identity in 10m. Bucket-walking pre-exfil.

rule_id: TDL-DIS-000759
v4_id: 000759
name: Process Calls IsDebuggerPresent / CheckRemoteDebuggerPresent
description: Non-debugger process invokes IsDebuggerPresent, CheckRemoteDebuggerPresent or NtQueryInformationProcess (ProcessDebugPort). Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1622 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1622
technique_name: Debugger Evasion
platform:
- Windows
- Linux
data_sources:
- EDR
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=edr (source=\"*:edr\" OR sourcetype=edr* OR sourcetype=sysmon OR sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\"\
    ) \n(api_call IN (\"IsDebuggerPresent\", \"CheckRemoteDebuggerPresent\", \"NtQueryInformationProcess\") OR function_name IN (\"IsDebuggerPresent\"\
    , \"CheckRemoteDebuggerPresent\", \"NtQueryInformationProcess\") OR call_name IN (\"IsDebuggerPresent\", \"CheckRemoteDebuggerPresent\", \"\
    NtQueryInformationProcess\"))\nNOT (process_name IN (\"devenv.exe\", \"windbg.exe\", \"x64dbg.exe\", \"x32dbg.exe\", \"ollydbg.exe\", \"idaq.exe\"\
    , \"idaq64.exe\", \"ida.exe\", \"ida64.exe\", \"gdb\", \"lldb\", \"radare2\"))\nNOT (Image IN (\"*\\\\devenv.exe\", \"*\\\\windbg.exe\", \"\
    *\\\\x64dbg.exe\", \"*\\\\x32dbg.exe\", \"*\\\\ollydbg.exe\", \"*\\\\idaq.exe\", \"*\\\\idaq64.exe\", \"*\\\\ida.exe\", \"*\\\\ida64.exe\"\
    , \"*\\\\gdb\", \"*\\\\lldb\", \"*\\\\radare2\"))\n| stats count values(api_call) as apis values(function_name) as functions values(call_name)\
    \ as calls by _time, host, ComputerName, process_name, Image, process_path, user, User\n| eval final_host=coalesce(host, ComputerName), final_process=coalesce(process_name,\
    \ Image), final_user=coalesce(user, User)\n| table _time, final_host, final_process, process_path, final_user, apis, functions, calls, count\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000759 {\n  meta:\n    author = \"TDL\"\n    description = \"Process Calls IsDebuggerPresent / CheckRemoteDebuggerPresent\"\
    \n    severity = \"LOW\"\n    tactic = \"TA0007\"\n    technique = \"T1622\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Non-debugger process invokes IsDebuggerPresent, CheckRemoteDebuggerPresent or NtQueryInformationProcess (ProcessDebugPort).
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

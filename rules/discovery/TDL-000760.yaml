rule_id: TDL-DIS-000760
v4_id: '000760'
name: driverquery.exe Executed by Non-Admin Context
description: driverquery.exe / sc.exe query type=driver / fltmc.exe filters from a user-context process. Pre-rootkit reconnaissance. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1652 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1652
technique_name: Device Driver Discovery
platform:
- Windows
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (Image="*\\driverquery.exe" OR (Image="*\\sc.exe"
    CommandLine="*query*" CommandLine="*type*driver*") OR Image="*\\fltmc.exe")

    | table _time, ComputerName, User, Image, CommandLine, ParentImage

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID == 1\n| where tolower(Process) has_any (\"driverquery.exe\", \"sc.exe\"\
    , \"fltmc.exe\")\n| where (tolower(Process) endswith \"driverquery.exe\") \n    or (tolower(Process) endswith \"sc.exe\" and tolower(CommandLine)\
    \ has_all (\"query\", \"type=driver\"))\n    or (tolower(Process) endswith \"fltmc.exe\" and tolower(CommandLine) has \"filters\")\n| project\
    \ TimeGenerated, Computer, Account, Process, CommandLine, ParentProcess = ParentProcessName\n"
  aql: "SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, \"Process Name\", \"Process CommandLine\", \"Parent Process\
    \ Name\"\nFROM events\nWHERE (\"Process Name\" ILIKE '%driverquery.exe%' \n   OR (\"Process Name\" ILIKE '%sc.exe%' AND \"Process CommandLine\"\
    \ ILIKE '%query%' AND \"Process CommandLine\" ILIKE '%type=driver%')\n   OR \"Process Name\" ILIKE '%fltmc.exe%')\nLAST 1 HOURS\n"
  yara_l: "rule t1652_device_driver_discovery {\n  meta:\n    author = \"TDL\"\n    description = \"Detects execution of driver enumeration commands\
    \ (T1652 - Device Driver Discovery)\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1652\"\n    severity = \"\
    Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      re.regex($e.target.process.file.full_path, `(?i)\\\
    \\driverquery\\.exe$`) or\n      (\n        re.regex($e.target.process.file.full_path, `(?i)\\\\sc\\.exe$`) and\n        re.regex($e.target.process.command_line,\
    \ `(?i)query.*type\\s*=\\s*driver`)\n      ) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\fltmc\\.exe$`)\n    )\n    $e.principal.hostname\
    \ = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE winlog.event_id == 1 \n  AND (\n    process.name == \"driverquery.exe\" \n    OR (process.name\
    \ == \"sc.exe\" AND process.command_line LIKE \"*query*\" AND process.command_line LIKE \"*type=driver*\")\n    OR process.name == \"fltmc.exe\"\
    \n  )\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.parent.command_line\n"
  leql: |
    where((process_name ICONTAINS "driverquery.exe") OR (process_name ICONTAINS "sc.exe" AND process_cmd_line ICONTAINS "query" AND process_cmd_line ICONTAINS "type=driver") OR (process_name ICONTAINS "fltmc.exe")) groupby(asset, user, process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 event_platform=Win (FileName=driverquery.exe OR (FileName=sc.exe CommandLine=*query* CommandLine=*type=driver*) OR FileName=fltmc.exe)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName, ParentCommandLine])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and (action_process_image_name contains "driverquery.exe"
           or (action_process_image_name contains "sc.exe" and action_process_image_command_line ~= ".*query.*type\s*=\s*driver.*")
           or action_process_image_name contains "fltmc.exe")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    (process.name:(driverquery.exe OR sc.exe OR fltmc.exe) OR process.command_line:(*driverquery.exe* OR *sc.exe* OR *fltmc.exe*)) AND (process.command_line:(*query* AND *type\=driver*) OR process.command_line:*filters* OR process.name:driverquery.exe OR process.name:fltmc.exe)
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as image
    | json field=_raw "CommandLine" as cmd
    | json field=_raw "User" as user
    | where event_id = "1"
    | where (image matches "*\\driverquery.exe" or image matches "*\\sc.exe" or image matches "*\\fltmc.exe")
    | where (image matches "*\\driverquery.exe") or (image matches "*\\sc.exe" and cmd matches "*query*" and cmd matches "*type*driver*") or (image matches "*\\fltmc.exe")
    | where !(user matches "*SYSTEM" or user matches "*LOCAL SERVICE" or user matches "*NETWORK SERVICE")
    | fields _messageTime, _sourceHost, user, image, cmd
pseudo_logic: driverquery.exe / sc.exe query type=driver / fltmc.exe filters from a user-context process. Pre-rootkit reconnaissance.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

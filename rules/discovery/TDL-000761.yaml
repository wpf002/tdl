rule_id: TDL-DIS-000761
v4_id: '000761'
name: gpresult / Get-GPO Discovery from Workstation
description: gpresult.exe /h or Get-GPO / Get-GPOReport invoked outside admin desktops. Pre-attack GPO reconnaissance. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1615 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1615
technique_name: Group Policy Discovery
platform:
- Windows
data_sources:
- Sysmon
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1 \n(Image=\"*\\\\gpresult.exe\" CommandLine\
    \ IN (\"*/h*\",\"*/H*\")) OR (Image=\"*\\\\powershell.exe\" (CommandLine=\"*Get-GPO*\" OR CommandLine=\"*Get-GPOReport*\"))\n| search NOT\
    \ ComputerName IN (\"*ADMIN*\", \"*ADM*\")\n| table _time, ComputerName, User, Image, CommandLine, ParentImage\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where (Process has "gpresult.exe" and CommandLine has_any ("/h", "/H"))
        or (Process has "powershell.exe" and CommandLine has_any ("Get-GPO", "Get-GPOReport"))
        or (Process has "pwsh.exe" and CommandLine has_any ("Get-GPO", "Get-GPOReport"))
    | where Computer !contains "admin"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, sourceip, username, "Process Name", "Process CommandLine", "Parent Process Name", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE ("Process Name" ILIKE '%gpresult.exe%' AND "Process CommandLine" ILIKE '%/h%')
       OR ("Process Name" ILIKE '%powershell.exe%' AND ("Process CommandLine" ILIKE '%Get-GPO%' OR "Process CommandLine" ILIKE '%Get-GPOReport%'))
       AND NOT (sourceip IN ('10.0.1.10', '10.0.1.11') OR LOGSOURCENAME(logsourceid) ILIKE '%admin-desktop%')
    LAST 1 HOURS
  yara_l: |
    rule group_policy_discovery_t1615 {
      meta:
        author = "TDL"
        description = "Detects T1615 Group Policy Discovery via gpresult.exe or PowerShell cmdlets outside admin desktops"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1615"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          (
            re.regex($e.principal.process.file.full_path, `(?i)\\gpresult\.exe$`) and
            re.regex($e.principal.process.command_line, `(?i)/h`)
          ) or
          (
            re.regex($e.principal.process.file.full_path, `(?i)\\powershell\.exe$`) and
            (
              re.regex($e.principal.process.command_line, `(?i)Get-GPO`) or
              re.regex($e.principal.process.command_line, `(?i)Get-GPOReport`)
            )
          )
        )
        not re.regex($e.principal.hostname, `(?i)admin|adm-`)
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE @timestamp > NOW() - 1 hour \n  AND winlog.event_id == 1\n  AND (\n    (process.name ==\
    \ \"gpresult.exe\" AND process.command_line LIKE \"*-h*\")\n    OR (process.name == \"powershell.exe\" AND (process.command_line LIKE \"*Get-GPO*\"\
    \ OR process.command_line LIKE \"*Get-GPOReport*\"))\n  )\n  AND NOT host.name LIKE \"*admin*\"\n| KEEP @timestamp, host.name, user.name,\
    \ process.name, process.command_line, process.parent.name\n"
  leql: |
    where((process_name ICONTAINS "gpresult.exe" AND process_cmd_line ICONTAINS "/h") OR (process_name ICONTAINS "powershell.exe" AND (process_cmd_line ICONTAINS "Get-GPO" OR process_cmd_line ICONTAINS "Get-GPOReport"))) AND NOT (hostname ICONTAINS "admin" OR hostname ICONTAINS "mgmt") groupby(asset, user, process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 event_platform=Win (FileName=gpresult.exe (CommandLine=*/h* OR CommandLine=*/H*) OR (FileName=powershell.exe (CommandLine=*Get-GPO* OR CommandLine=*Get-GPOReport*))) ComputerName!=*admin* ComputerName!=*adm* ComputerName!=*management*
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (lowercase(action_process_image_name) contains "gpresult.exe" and action_process_image_command_line ~= ".*\/h.*")
       or (lowercase(action_process_image_name) contains "powershell.exe" and (action_process_image_command_line ~= ".*Get-GPO.*" or action_process_image_command_line ~= ".*Get-GPOReport.*"))
    | filter not (lowercase(agent_hostname) ~= ".*admin.*" or lowercase(agent_hostname) ~= ".*adm.*")
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, actor_process_image_name
  lucene: |
    (process.name:gpresult.exe AND process.command_line:*/h*) OR (process.name:powershell.exe AND (process.command_line:*Get-GPO* OR process.command_line:*Get-GPOReport*)) AND NOT host.name:(*admin* OR *desktop*)
  sumo: "_sourceCategory=*Sysmon* (\"1\" OR \"EventID=1\")\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"Image\" as image\n\
    | json field=_raw \"CommandLine\" as command_line\n| json field=_raw \"Computer\" as computer\n| where event_id = \"1\"\n| where (image matches\
    \ \"*\\\\gpresult.exe\" and command_line matches \"*/h*\") \n   or command_line matches \"*Get-GPO*\" \n   or command_line matches \"*Get-GPOReport*\"\
    \n| where !(computer matches \"*admin*\" or computer matches \"*ADM*\")\n| fields _messageTime, computer, image, command_line\n"
pseudo_logic: gpresult.exe /h or Get-GPO / Get-GPOReport invoked outside admin desktops. Pre-attack GPO reconnaissance.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

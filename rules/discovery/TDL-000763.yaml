rule_id: TDL-DIS-000763
v4_id: '000763'
name: Packet Capture Tool Execution
description: tcpdump / tshark / windump / pktmon / dumpcap launched outside known network-engineering context. Generated from gap analysis against
  canonical ATT&CK Enterprise matrix (T1040 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1040
technique_name: Network Sniffing
platform:
- Windows
- Linux
- macOS
data_sources:
- EDR
- Sysmon
- Auditd
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=* sourcetype IN (WinEventLog:Microsoft-Windows-Sysmon/Operational, linux_secure, osquery, edr*)) \n(EventCode=1 OR event_type=\"\
    process\" OR action=\"process_create\" OR eventtype=\"process_creation\")\n(process_name IN (\"tcpdump\", \"tshark\", \"windump\", \"pktmon.exe\"\
    , \"dumpcap\", \"tcpdump.exe\", \"tshark.exe\", \"dumpcap.exe\") OR Image IN (\"*\\\\tcpdump.exe\", \"*\\\\tshark.exe\", \"*\\\\windump.exe\"\
    , \"*\\\\pktmon.exe\", \"*\\\\dumpcap.exe\", \"*/tcpdump\", \"*/tshark\", \"*/dumpcap\") OR CommandLine IN (\"*tcpdump*\", \"*tshark*\", \"\
    *windump*\", \"*pktmon*\", \"*dumpcap*\"))\nNOT (user IN (\"netadmin\", \"network_engineer\", \"svc_network\") OR User IN (\"netadmin\", \"\
    network_engineer\", \"svc_network\") OR parent_process_name IN (\"wireshark.exe\", \"wireshark\") OR ParentImage IN (\"*\\\\wireshark.exe\"\
    , \"*/wireshark\"))\n| eval process=coalesce(process_name, Image, ProcessName)\n| eval command=coalesce(CommandLine, command_line, ProcessCommandLine)\n\
    | eval username=coalesce(user, User, SourceUser, Account_Name)\n| eval hostname=coalesce(host, ComputerName, hostname)\n| table _time, hostname,\
    \ username, process, command, ParentImage\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000763 {\n  meta:\n    author = \"TDL\"\n    description = \"Packet Capture Tool Execution\"\n    severity = \"HIGH\"\
    \n    tactic = \"TA0007\"\n    technique = \"T1040\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name = /.+/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: tcpdump / tshark / windump / pktmon / dumpcap launched outside known network-engineering context.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-DIS-000765
v4_id: '000765'
name: WMI Enumeration of Win32_USBHub / Win32_PnPEntity
description: Get-WmiObject / Get-CimInstance over Win32_USBHub, Win32_PnPEntity, Win32_LogicalDisk from non-IT context. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1120 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1120
technique_name: Peripheral Device Discovery
platform:
- Windows
- macOS
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1 \n(Image=\"*\\\\powershell.exe\" OR Image=\"*\\\\\
    pwsh.exe\") \n(CommandLine=\"*Get-WmiObject*Win32_USBHub*\" OR CommandLine=\"*Get-WmiObject*Win32_PnPEntity*\" OR CommandLine=\"*Get-WmiObject*Win32_LogicalDisk*\"\
    \ OR CommandLine=\"*Get-CimInstance*Win32_USBHub*\" OR CommandLine=\"*Get-CimInstance*Win32_PnPEntity*\" OR CommandLine=\"*Get-CimInstance*Win32_LogicalDisk*\"\
    )\nNOT (User=\"*IT*\" OR User=\"*admin*\" OR User=\"*svc*\")\n| table _time, ComputerName, User, ParentImage, CommandLine\n"
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | where CommandLine has_any ("Get-WmiObject", "Get-CimInstance", "gwmi")
    | where CommandLine has_any ("Win32_USBHub", "Win32_PnPEntity", "Win32_LogicalDisk")
    | extend AccountName = extract(@"User:\s*([^\r\n]+)", 1, EventData)
    | where AccountName !has_any ("admin", "svc", "service", "system")
    | project TimeGenerated, Computer, AccountName, CommandLine
  aql: "SELECT username, \"Process CommandLine\", sourceip, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS executions\nFROM events\nWHERE (\"\
    Process CommandLine\" ILIKE '%Get-WmiObject%Win32_USBHub%' \n   OR \"Process CommandLine\" ILIKE '%Get-WmiObject%Win32_PnPEntity%' \n   OR\
    \ \"Process CommandLine\" ILIKE '%Get-WmiObject%Win32_LogicalDisk%'\n   OR \"Process CommandLine\" ILIKE '%Get-CimInstance%Win32_USBHub%'\n\
    \   OR \"Process CommandLine\" ILIKE '%Get-CimInstance%Win32_PnPEntity%'\n   OR \"Process CommandLine\" ILIKE '%Get-CimInstance%Win32_LogicalDisk%')\n\
    \  AND username NOT ILIKE '%admin%'\n  AND username NOT ILIKE '%svc%'\n  AND username NOT ILIKE '%service%'\nGROUP BY username, \"Process\
    \ CommandLine\", sourceip, LOGSOURCENAME(logsourceid)\nLAST 1 HOURS\n"
  yara_l: "rule peripheral_device_discovery_wmi {\n  meta:\n    author = \"TDL\"\n    description = \"Detects T1120 peripheral device discovery\
    \ via WMI/CIM queries to USB and disk classes\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1120\"\n    severity\
    \ = \"Medium\"\n  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\powershell\\.exe$`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\pwsh\\.exe$`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\wmic\\.exe$`)\n    )\n    (\n      re.regex($e.principal.process.command_line, `(?i)Get-WmiObject.*Win32_USBHub`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)Get-WmiObject.*Win32_PnPEntity`) or\n      re.regex($e.principal.process.command_line, `(?i)Get-WmiObject.*Win32_LogicalDisk`) or\n\
    \      re.regex($e.principal.process.command_line, `(?i)Get-CimInstance.*Win32_USBHub`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)Get-CimInstance.*Win32_PnPEntity`) or\n      re.regex($e.principal.process.command_line, `(?i)Get-CimInstance.*Win32_LogicalDisk`)\
    \ or\n      re.regex($e.principal.process.command_line, `(?i)wmic.*path.*Win32_USBHub`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)wmic.*path.*Win32_PnPEntity`) or\n      re.regex($e.principal.process.command_line, `(?i)wmic.*path.*Win32_LogicalDisk`)\n    )\n \
    \   not re.regex($e.principal.user.userid, `(?i)(IT_|admin|sysadmin|helpdesk)`)\n    $e.principal.hostname = $host\n  \n  match:\n    $host\
    \ over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 24 hours
      AND process.name IN ("powershell.exe", "pwsh.exe", "cmd.exe", "wmic.exe")
      AND (
        process.command_line LIKE "*Get-WmiObject*Win32_USBHub*"
        OR process.command_line LIKE "*Get-WmiObject*Win32_PnPEntity*"
        OR process.command_line LIKE "*Get-WmiObject*Win32_LogicalDisk*"
        OR process.command_line LIKE "*Get-CimInstance*Win32_USBHub*"
        OR process.command_line LIKE "*Get-CimInstance*Win32_PnPEntity*"
        OR process.command_line LIKE "*Get-CimInstance*Win32_LogicalDisk*"
        OR process.command_line LIKE "*wmic*logicaldisk*"
        OR process.command_line LIKE "*wmic*path*Win32_USBHub*"
        OR process.command_line LIKE "*wmic*path*Win32_PnPEntity*"
      )
      AND NOT (user.name LIKE "*admin*" OR user.name LIKE "*svc*" OR user.name LIKE "*service*")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID=1 AND (process_cmd_line ICONTAINS "Get-WmiObject" OR process_cmd_line ICONTAINS "Get-CimInstance") AND (process_cmd_line ICONTAINS "Win32_USBHub" OR process_cmd_line ICONTAINS "Win32_PnPEntity" OR process_cmd_line ICONTAINS "Win32_LogicalDisk")) groupby(user, asset, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (FileName=powershell.exe OR FileName=pwsh.exe OR FileName=wmic.exe)
    (CommandLine=*Win32_USBHub* OR CommandLine=*Win32_PnPEntity* OR CommandLine=*Win32_LogicalDisk*)
    (CommandLine=*Get-WmiObject* OR CommandLine=*Get-CimInstance* OR CommandLine=*wmic*)
    NOT (UserName=*admin* OR UserName=*svc* OR UserName=*service* OR ParentBaseFileName=*sccm* OR ParentBaseFileName=*tanium*)
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
      and (actor_process_image_name in ("powershell.exe", "pwsh.exe", "cmd.exe"))
      and (action_process_image_command_line ~= "(?i)(Get-WmiObject|Get-CimInstance|gwmi|gcim).*Win32_(USBHub|PnPEntity|LogicalDisk)"
           or action_process_image_command_line ~= "(?i)wmic.*(usbhub|pnpentity|logicaldisk)")
    | filter actor_effective_username != ""
      and not (actor_effective_username ~= "(?i)(admin|svc|system|service|support|helpdesk|it_)")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line
  lucene: |
    (event.code:1 OR winlog.event_id:1) AND (process.command_line:(*Get-WmiObject* AND (*Win32_USBHub* OR *Win32_PnPEntity* OR *Win32_LogicalDisk*)) OR process.command_line:(*Get-CimInstance* AND (*Win32_USBHub* OR *Win32_PnPEntity* OR *Win32_LogicalDisk*))) AND NOT (user.name:*admin* OR user.name:*svc* OR user.name:*service* OR process.parent.name:*SCCM* OR process.parent.name:*lansweeper*)
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as cmd
    | json field=_raw "Image" as image
    | json field=_raw "User" as user
    | where event_id = "1"
    | where (cmd matches "*Get-WmiObject*" or cmd matches "*Get-CimInstance*" or cmd matches "*gwmi*" or cmd matches "*gcim*")
    | where (cmd matches "*Win32_USBHub*" or cmd matches "*Win32_PnPEntity*" or cmd matches "*Win32_LogicalDisk*")
    | where !(user matches "*IT*" or user matches "*admin*" or user matches "*service*")
    | fields _messageTime, _sourceHost, user, image, cmd
pseudo_logic: Get-WmiObject / Get-CimInstance over Win32_USBHub, Win32_PnPEntity, Win32_LogicalDisk from non-IT context.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

rule_id: TDL-DIS-000766
v4_id: '000766'
name: tasklist / ps Enumerating EDR & AV Processes
description: tasklist /v or ps -ef | grep with patterns for sentinel*, csagent, MsMpEng, falcon, defender, carbonblack — survey for security tools.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1057 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1057
technique_name: Process Discovery
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
- Auditd
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "(index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1 (Image=\"*\\\\tasklist.exe\" (CommandLine=\"\
    */v*\" OR CommandLine=\"*-v*\")) OR (Image=\"*\\\\cmd.exe\" OR Image=\"*\\\\powershell.exe\") (CommandLine=\"*tasklist*\" AND CommandLine=\"\
    */v*\")) OR (index=linux sourcetype IN (auditd, linux_secure, syslog) (comm=\"ps\" OR exe=\"*/ps\") (a0=\"*-ef*\" OR a1=\"*-ef*\" OR a2=\"\
    *-ef*\")) \n| eval security_tool_search=case(\n    match(CommandLine, \"(?i)(sentinel|csagent|MsMpEng|falcon|defender|carbonblack)\"), 1,\n\
    \    match(CommandLine, \"(?i)grep.*(sentinel|csagent|MsMpEng|falcon|defender|carbonblack)\"), 1,\n    match(CommandLine, \"(?i)findstr.*(sentinel|csagent|MsMpEng|falcon|defender|carbonblack)\"\
    ), 1,\n    1=1, 0)\n| where security_tool_search=1\n| table _time, host, ComputerName, User, Image, CommandLine, ParentImage\n"
  kql: |
    union
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where CommandLine has_any ("tasklist", "ps -ef", "ps aux")
    | where CommandLine has_any ("sentinel", "csagent", "MsMpEng", "falcon", "defender", "carbonblack", "crowdstrike", "cylance", "sophos", "symantec", "mcafee", "kaspersky", "trendmicro", "bitdefender")
    | project TimeGenerated, Computer, Account, Process = NewProcessName, CommandLine, ParentProcessName),
    (Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend Process = tostring(EventData.Image)
    | extend ParentProcessName = tostring(EventData.ParentImage)
    | extend User = tostring(EventData.User)
    | where CommandLine has_any ("tasklist", "ps -ef", "ps aux")
    | where CommandLine has_any ("sentinel", "csagent", "MsMpEng", "falcon", "defender", "carbonblack", "crowdstrike", "cylance", "sophos", "symantec", "mcafee", "kaspersky", "trendmicro", "bitdefender")
    | project TimeGenerated, Computer, Account = User, Process, CommandLine, ParentProcessName),
    (Syslog
    | where TimeGenerated > ago(1h)
    | where ProcessName in~ ("bash", "sh", "zsh", "dash", "csh", "tcsh", "ksh")
    | where SyslogMessage has_any ("ps -ef", "ps aux")
    | where SyslogMessage has_any ("sentinel", "csagent", "MsMpEng", "falcon", "defender", "carbonblack", "crowdstrike", "cylance", "sophos", "symantec", "mcafee", "kaspersky", "trendmicro", "bitdefender")
    | project TimeGenerated, Computer, Account = ProcessName, Process = ProcessName, CommandLine = SyslogMessage, ParentProcessName = "")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process CommandLine", "Process Name", "Parent Process Name", COUNT(*) AS executions
    FROM events
    WHERE (
      ("Process CommandLine" ILIKE '%tasklist%' AND ("Process CommandLine" ILIKE '%sentinel%' OR "Process CommandLine" ILIKE '%csagent%' OR "Process CommandLine" ILIKE '%MsMpEng%' OR "Process CommandLine" ILIKE '%falcon%' OR "Process CommandLine" ILIKE '%defender%' OR "Process CommandLine" ILIKE '%carbonblack%'))
      OR
      ("Process CommandLine" ILIKE '%ps -ef%' AND ("Process CommandLine" ILIKE '%grep%' AND ("Process CommandLine" ILIKE '%sentinel%' OR "Process CommandLine" ILIKE '%csagent%' OR "Process CommandLine" ILIKE '%MsMpEng%' OR "Process CommandLine" ILIKE '%falcon%' OR "Process CommandLine" ILIKE '%defender%' OR "Process CommandLine" ILIKE '%carbonblack%')))
    )
    AND ("EventID" = '1' OR "EventID" = '4688' OR "EventID" = 'EXECVE')
    GROUP BY username, sourceip, LOGSOURCENAME(logsourceid), "Process CommandLine", "Process Name", "Parent Process Name"
    LAST 1 HOURS
  yara_l: |
    rule process_discovery_security_tools {
      meta:
        author = "TDL"
        description = "T1057 Process Discovery - Survey for security tools via tasklist or ps commands"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1057"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          (
            re.regex($e.principal.process.file.full_path, `(?i)\\tasklist\.exe$`) and
            re.regex($e.principal.process.command_line, `(?i)/v`)
          ) or
          (
            re.regex($e.principal.process.file.full_path, `(?i)/bin/(ps|grep)$`) and
            re.regex($e.principal.process.command_line, `(?i)(ps\s+(-)?ef|grep)`)
          )
        )
        re.regex($e.principal.process.command_line, `(?i)(sentinel|csagent|msmpeng|falcon|defender|carbonblack)`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 45

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*, logs-system.auth*
    | WHERE event.category == "process" AND event.type == "start"
      AND (
        (process.name IN ("tasklist.exe", "tasklist") AND process.command_line LIKE "*/v*")
        OR (process.name IN ("ps", "grep") AND (process.command_line LIKE "*ps -ef*" OR process.command_line LIKE "*ps aux*"))
      )
      AND (
        process.command_line LIKE "*sentinel*"
        OR process.command_line LIKE "*csagent*"
        OR process.command_line LIKE "*MsMpEng*"
        OR process.command_line LIKE "*falcon*"
        OR process.command_line LIKE "*defender*"
        OR process.command_line LIKE "*carbonblack*"
      )
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.parent.command_line
  leql: |
    where((process_name ICONTAINS "tasklist" AND process_cmd_line ICONTAINS "/v") OR (process_name ICONTAINS "ps" AND process_cmd_line=/grep.*(sentinel|csagent|MsMpEng|falcon|defender|carbonblack)/i)) groupby(asset, user, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (CommandLine=*tasklist* OR CommandLine=*ps\ -ef* OR CommandLine=*ps\ aux*) (CommandLine=*sentinel* OR CommandLine=*csagent* OR CommandLine=*MsMpEng* OR CommandLine=*falcon* OR CommandLine=*defender* OR CommandLine=*carbonblack* OR CommandLine=*grep*)
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (
        (action_process_image_name = "tasklist.exe" and action_process_image_command_line ~= ".*\\s+/v.*") or
        (action_process_image_name in ("ps", "grep") and action_process_image_command_line ~= ".*(ps\\s+-ef|ps\\s+aux).*") or
        (action_process_image_command_line ~= ".*(sentinel|csagent|MsMpEng|falcon|defender|carbonblack).*" and action_process_image_name in ("tasklist.exe", "ps", "grep"))
      )
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, actor_process_image_name
  lucene: |
    (process.name:(tasklist.exe OR ps) AND process.command_line:(*sentinel* OR *csagent* OR *MsMpEng* OR *falcon* OR *defender* OR *carbonblack*)) OR (process.name:grep AND process.command_line:(*sentinel* OR *csagent* OR *MsMpEng* OR *falcon* OR *defender* OR *carbonblack*))
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*Auditd* OR _sourceCategory=*Windows* OR _sourceCategory=*Linux*
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as cmd
    | json field=_raw "Image" as image
    | json field=_raw "COMMAND" as auditd_cmd
    | where (event_id = "1" OR event_id = "4688" OR isBlank(event_id))
    | where (cmd matches "*tasklist*" AND (cmd matches "*sentinel*" OR cmd matches "*csagent*" OR cmd matches "*MsMpEng*" OR cmd matches "*falcon*" OR cmd matches "*defender*" OR cmd matches "*carbonblack*"))
       OR (cmd matches "*ps -ef*" AND (cmd matches "*grep*" AND (cmd matches "*sentinel*" OR cmd matches "*csagent*" OR cmd matches "*MsMpEng*" OR cmd matches "*falcon*" OR cmd matches "*defender*" OR cmd matches "*carbonblack*")))
       OR (auditd_cmd matches "*tasklist*" AND (auditd_cmd matches "*sentinel*" OR auditd_cmd matches "*csagent*" OR auditd_cmd matches "*MsMpEng*" OR auditd_cmd matches "*falcon*" OR auditd_cmd matches "*defender*" OR auditd_cmd matches "*carbonblack*"))
       OR (auditd_cmd matches "*ps -ef*" AND (auditd_cmd matches "*grep*" AND (auditd_cmd matches "*sentinel*" OR auditd_cmd matches "*csagent*" OR auditd_cmd matches "*MsMpEng*" OR auditd_cmd matches "*falcon*" OR auditd_cmd matches "*defender*" OR auditd_cmd matches "*carbonblack*")))
    | fields _messageTime, _sourceHost, image, cmd, auditd_cmd
pseudo_logic: tasklist /v or ps -ef | grep with patterns for sentinel*, csagent, MsMpEng, falcon, defender, carbonblack — survey for security
  tools.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- process
- enum
- t1057
- discovery
references:
- https://attack.mitre.org/techniques/T1057/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'

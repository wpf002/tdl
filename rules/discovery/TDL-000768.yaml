rule_id: TDL-DIS-000768
v4_id: 000768
name: wmic product where / dpkg -l for Security Software
description: wmic.exe product where, Get-ItemProperty Uninstall, dpkg -l, or rpm -qa filtered for AV/EDR vendor names. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1518 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1518
technique_name: Software Discovery
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"syslog\", \"linux_secure\") (EventCode=1 OR EventName=\"\
    ProcessCreate\")\n((Image=\"*\\\\wmic.exe\" CommandLine IN (\"*product*\", \"*get*\")) OR \n (Image=\"*\\\\powershell.exe\" CommandLine IN\
    \ (\"*Get-ItemProperty*\", \"*Uninstall*\")) OR\n (Image=\"*\\\\pwsh.exe\" CommandLine IN (\"*Get-ItemProperty*\", \"*Uninstall*\")) OR\n\
    \ (process_name IN (\"dpkg\", \"rpm\") CommandLine IN (\"*-l*\", \"*-qa*\")))\n(CommandLine=\"*symantec*\" OR CommandLine=\"*mcafee*\" OR\
    \ CommandLine=\"*kaspersky*\" OR CommandLine=\"*trendmicro*\" OR CommandLine=\"*crowdstrike*\" OR CommandLine=\"*carbonblack*\" OR CommandLine=\"\
    *sentinelone*\" OR CommandLine=\"*defender*\" OR CommandLine=\"*sophos*\" OR CommandLine=\"*fireeye*\" OR CommandLine=\"*paloalto*\" OR CommandLine=\"\
    *cylance*\" OR CommandLine=\"*eset*\" OR CommandLine=\"*bitdefender*\" OR CommandLine=\"*avast*\" OR CommandLine=\"*avg*\" OR CommandLine=\"\
    *norton*\" OR CommandLine=\"*malwarebytes*\" OR CommandLine=\"*webroot*\" OR CommandLine=\"*fortinet*\")\n| table _time, host, ComputerName,\
    \ user, User, Image, process_name, CommandLine, ParentImage, parent_process_name\n"
  kql: |
    union isfuzzy=true
    (Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend Image = tostring(EventData.Image)
    | extend ParentImage = tostring(EventData.ParentImage)
    | extend ComputerName = Computer
    | where Image has_any ("wmic.exe", "powershell.exe", "pwsh.exe", "dpkg", "rpm")
    | where CommandLine has_any ("product", "Get-ItemProperty", "Uninstall", "dpkg -l", "rpm -qa")
    | where CommandLine has_any ("crowdstrike", "carbon", "cylance", "defender", "sentinelone", "sophos", "mcafee", "symantec", "trend", "kaspersky", "bitdefender", "eset", "avast", "avg", "malwarebytes", "norton", "palo alto", "cortex", "edr", "antivirus", "av")
    | project TimeGenerated, ComputerName, Image, CommandLine, ParentImage
    ),
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | extend CommandLine = CommandLine
    | extend NewProcessName = NewProcessName
    | extend ParentProcessName = ParentProcessName
    | where NewProcessName has_any ("wmic.exe", "powershell.exe", "pwsh.exe", "dpkg", "rpm")
    | where CommandLine has_any ("product", "Get-ItemProperty", "Uninstall", "dpkg -l", "rpm -qa")
    | where CommandLine has_any ("crowdstrike", "carbon", "cylance", "defender", "sentinelone", "sophos", "mcafee", "symantec", "trend", "kaspersky", "bitdefender", "eset", "avast", "avg", "malwarebytes", "norton", "palo alto", "cortex", "edr", "antivirus", "av")
    | project TimeGenerated, Computer, NewProcessName, CommandLine, ParentProcessName
    )
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE (
      ("Process Name" ILIKE '%wmic.exe%' AND "Process CommandLine" ILIKE '%product%')
      OR ("Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" ILIKE '%Get-ItemProperty%' AND "Process CommandLine" ILIKE '%Uninstall%')
      OR ("Process CommandLine" ILIKE '%dpkg -l%')
      OR ("Process CommandLine" ILIKE '%rpm -qa%')
    )
    AND (
      "Process CommandLine" ILIKE '%symantec%'
      OR "Process CommandLine" ILIKE '%mcafee%'
      OR "Process CommandLine" ILIKE '%crowdstrike%'
      OR "Process CommandLine" ILIKE '%carbon%black%'
      OR "Process CommandLine" ILIKE '%sentinelone%'
      OR "Process CommandLine" ILIKE '%defender%'
      OR "Process CommandLine" ILIKE '%sophos%'
      OR "Process CommandLine" ILIKE '%kaspersky%'
      OR "Process CommandLine" ILIKE '%trendmicro%'
      OR "Process CommandLine" ILIKE '%cylance%'
      OR "Process CommandLine" ILIKE '%palo alto%'
      OR "Process CommandLine" ILIKE '%fortinet%'
      OR "Process CommandLine" ILIKE '%eset%'
      OR "Process CommandLine" ILIKE '%avast%'
      OR "Process CommandLine" ILIKE '%avg%'
      OR "Process CommandLine" ILIKE '%malwarebytes%'
      OR "Process CommandLine" ILIKE '%bitdefender%'
      OR "Process CommandLine" ILIKE '%fireeye%'
      OR "Process CommandLine" ILIKE '%cybereason%'
      OR "Process CommandLine" ILIKE '%tanium%'
    )
    LAST 24 HOURS
  yara_l: "rule software_discovery_av_edr_enumeration {\n  meta:\n    author = \"TDL\"\n    description = \"Detects enumeration of AV/EDR software\
    \ via wmic, PowerShell, dpkg, or rpm\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1518\"\n    severity = \"\
    Medium\"\n  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      (\n        re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\wmic\\.exe$`) and\n        re.regex($e.principal.process.command_line, `(?i)product\\s+(get|where)`)\n      ) or\n      (\n   \
    \     re.regex($e.principal.process.file.full_path, `(?i)\\\\powershell\\.exe$`) and\n        re.regex($e.principal.process.command_line,\
    \ `(?i)Get-ItemProperty.*Uninstall`)\n      ) or\n      (\n        re.regex($e.principal.process.file.full_path, `(?i)/dpkg$`) and\n     \
    \   re.regex($e.principal.process.command_line, `(?i)-l`)\n      ) or\n      (\n        re.regex($e.principal.process.file.full_path, `(?i)/rpm$`)\
    \ and\n        re.regex($e.principal.process.command_line, `(?i)-qa`)\n      )\n    )\n    (\n      re.regex($e.principal.process.command_line,\
    \ `(?i)(crowdstrike|cylance|carbon\\s*black|defender|mcafee|symantec|norton|kaspersky|sophos|trend\\s*micro|bitdefender|eset|avast|avg|malwarebytes|sentinel|cortex|edr|antivirus|av\\\
    s)`) or\n      re.regex($e.principal.process.command_line, `(?i)(palo\\s*alto|fortinet|fireeye|trellix|cybereason|tanium|qualys)`)\n    )\n\
    \    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n  \n  match:\n    $host, $user over 5m\n  \n  outcome:\n    $risk_score\
    \ = 50\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (process.name == "wmic.exe" AND process.command_line LIKE "*product*" AND process.command_line LIKE "*get*")
        OR (process.name == "powershell.exe" AND process.command_line LIKE "*Get-ItemProperty*" AND process.command_line LIKE "*Uninstall*")
        OR (process.name == "dpkg" AND process.command_line LIKE "*-l*")
        OR (process.name == "rpm" AND process.command_line LIKE "*-qa*")
      )
      AND (
        TO_LOWER(process.command_line) LIKE "*crowdstrike*"
        OR TO_LOWER(process.command_line) LIKE "*cylance*"
        OR TO_LOWER(process.command_line) LIKE "*sentinelone*"
        OR TO_LOWER(process.command_line) LIKE "*defender*"
        OR TO_LOWER(process.command_line) LIKE "*carbon black*"
        OR TO_LOWER(process.command_line) LIKE "*mcafee*"
        OR TO_LOWER(process.command_line) LIKE "*symantec*"
        OR TO_LOWER(process.command_line) LIKE "*kaspersky*"
        OR TO_LOWER(process.command_line) LIKE "*trend micro*"
        OR TO_LOWER(process.command_line) LIKE "*sophos*"
        OR TO_LOWER(process.command_line) LIKE "*eset*"
        OR TO_LOWER(process.command_line) LIKE "*palo alto*"
        OR TO_LOWER(process.command_line) LIKE "*bitdefender*"
        OR TO_LOWER(process.command_line) LIKE "*avast*"
        OR TO_LOWER(process.command_line) LIKE "*avg*"
        OR TO_LOWER(process.command_line) LIKE "*malwarebytes*"
        OR TO_LOWER(process.command_line) LIKE "*webroot*"
        OR TO_LOWER(process.command_line) LIKE "*fortinet*"
      )
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where((process_name ICONTAINS "wmic.exe" AND process_cmd_line ICONTAINS "product" AND process_cmd_line ICONTAINS "where") OR (process_name ICONTAINS "powershell" AND (process_cmd_line ICONTAINS "Get-ItemProperty" OR process_cmd_line ICONTAINS "Get-WmiObject") AND process_cmd_line ICONTAINS "Uninstall") OR (process_name ICONTAINS "dpkg" AND process_cmd_line ICONTAINS "-l") OR (process_name ICONTAINS "rpm" AND process_cmd_line ICONTAINS "-qa")) AND (process_cmd_line ICONTAINS "symantec" OR process_cmd_line ICONTAINS "mcafee" OR process_cmd_line ICONTAINS "crowdstrike" OR process_cmd_line ICONTAINS "carbon black" OR process_cmd_line ICONTAINS "cylance" OR process_cmd_line ICONTAINS "sentinel" OR process_cmd_line ICONTAINS "defender" OR process_cmd_line ICONTAINS "kaspersky" OR process_cmd_line ICONTAINS "sophos" OR process_cmd_line ICONTAINS "trendmicro" OR process_cmd_line ICONTAINS "fireeye" OR process_cmd_line ICONTAINS "palo alto" OR process_cmd_line ICONTAINS "fortinet" OR process_cmd_line ICONTAINS "bitdefender" OR process_cmd_line ICONTAINS "eset" OR process_cmd_line ICONTAINS "malwarebytes" OR process_cmd_line ICONTAINS "avast" OR process_cmd_line ICONTAINS "avg" OR process_cmd_line ICONTAINS "webroot" OR process_cmd_line ICONTAINS "vipre")
  crowdstrike: "event_simpleName=ProcessRollup2 \n(\n  (FileName=wmic.exe (CommandLine=*product* AND CommandLine=*where*))\n  OR\n  (FileName=powershell.exe\
    \ (CommandLine=*Get-ItemProperty* AND CommandLine=*Uninstall*))\n  OR\n  (FileName IN [dpkg, rpm] (CommandLine IN [*-l*, *-qa*]))\n)\n(CommandLine\
    \ IN [*crowdstrike*, *falcon*, *sentinelone*, *cylance*, *carbon*black*, *defender*, *mcafee*, *symantec*, *trendmicro*, *kaspersky*, *sophos*,\
    \ *eset*, *bitdefender*, *avast*, *avg*, *malwarebytes*, *paloalto*, *fortinet*, *fireeye*, *checkpoint*])\n| table([@timestamp, ComputerName,\
    \ UserName, FileName, ParentBaseFileName, CommandLine])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (
        (lowercase(action_process_image_name) contains "wmic.exe" and lowercase(action_process_image_command_line) ~= "product\\s+get|product\\s+where")
        or (lowercase(action_process_image_name) contains "powershell" and lowercase(action_process_image_command_line) ~= "get-itemproperty.*uninstall")
        or (lowercase(action_process_image_name) contains "dpkg" and lowercase(action_process_image_command_line) contains "-l")
        or (lowercase(action_process_image_name) contains "rpm" and lowercase(action_process_image_command_line) contains "-qa")
    )
    | filter (
        lowercase(action_process_image_command_line) ~= "symantec|mcafee|crowdstrike|carbon\\s*black|cylance|sentinel|defender|kaspersky|sophos|trend\\s*micro|bitdefender|eset|avast|avg|malwarebytes|palo\\s*alto|fortinet|checkpoint|fireye|cybereason|tanium|qualys"
    )
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    (process.name:(wmic.exe OR powershell.exe OR pwsh.exe OR dpkg OR rpm) AND process.command_line:(*product* OR *Get-ItemProperty* OR *Uninstall* OR *"dpkg -l"* OR *"rpm -qa"*)) AND (process.command_line:(*symantec* OR *mcafee* OR *trendmicro* OR *kaspersky* OR *sophos* OR *crowdstrike* OR *cylance* OR *sentinelone* OR *defender* OR *edr* OR *antivirus* OR *av* OR *eset* OR *bitdefender* OR *norton* OR *avast* OR *avg* OR *malwarebytes* OR *paloalto* OR *cortex* OR *carbonblack* OR *tanium* OR *fireeye* OR *endgame*))
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Image" as image
    | json field=_raw "Computer" as computer
    | where event_id = "1"
    | where (image matches "*\\wmic.exe" and command_line matches "*product*")
        or (image matches "*\\powershell.exe" and command_line matches "*Get-ItemProperty*" and command_line matches "*Uninstall*")
        or (command_line matches "*dpkg -l*")
        or (command_line matches "*rpm -qa*")
    | where command_line matches "*symantec*" or command_line matches "*mcafee*" or command_line matches "*sophos*" or command_line matches "*kaspersky*" or command_line matches "*trendmicro*" or command_line matches "*eset*" or command_line matches "*bitdefender*" or command_line matches "*crowdstrike*" or command_line matches "*carbon*black*" or command_line matches "*sentinelone*" or command_line matches "*cylance*" or command_line matches "*defender*" or command_line matches "*malwarebytes*" or command_line matches "*avg*" or command_line matches "*avast*" or command_line matches "*norton*" or command_line matches "*palo*alto*" or command_line matches "*fortinet*" or command_line matches "*fireeye*"
    | fields _messageTime, computer, image, command_line
pseudo_logic: wmic.exe product where, Get-ItemProperty Uninstall, dpkg -l, or rpm -qa filtered for AV/EDR vendor names.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

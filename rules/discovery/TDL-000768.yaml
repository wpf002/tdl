rule_id: TDL-DIS-000768
v4_id: 000768
name: wmic product where / dpkg -l for Security Software
description: wmic.exe product where, Get-ItemProperty Uninstall, dpkg -l, or rpm -qa filtered for AV/EDR vendor names. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1518 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1518
technique_name: Software Discovery
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"syslog\", \"linux_secure\") (EventCode=1 OR EventName=\"\
    ProcessCreate\")\n((Image=\"*\\\\wmic.exe\" CommandLine IN (\"*product*\", \"*get*\")) OR \n (Image=\"*\\\\powershell.exe\" CommandLine IN\
    \ (\"*Get-ItemProperty*\", \"*Uninstall*\")) OR\n (Image=\"*\\\\pwsh.exe\" CommandLine IN (\"*Get-ItemProperty*\", \"*Uninstall*\")) OR\n\
    \ (process_name IN (\"dpkg\", \"rpm\") CommandLine IN (\"*-l*\", \"*-qa*\")))\n(CommandLine=\"*symantec*\" OR CommandLine=\"*mcafee*\" OR\
    \ CommandLine=\"*kaspersky*\" OR CommandLine=\"*trendmicro*\" OR CommandLine=\"*crowdstrike*\" OR CommandLine=\"*carbonblack*\" OR CommandLine=\"\
    *sentinelone*\" OR CommandLine=\"*defender*\" OR CommandLine=\"*sophos*\" OR CommandLine=\"*fireeye*\" OR CommandLine=\"*paloalto*\" OR CommandLine=\"\
    *cylance*\" OR CommandLine=\"*eset*\" OR CommandLine=\"*bitdefender*\" OR CommandLine=\"*avast*\" OR CommandLine=\"*avg*\" OR CommandLine=\"\
    *norton*\" OR CommandLine=\"*malwarebytes*\" OR CommandLine=\"*webroot*\" OR CommandLine=\"*fortinet*\")\n| table _time, host, ComputerName,\
    \ user, User, Image, process_name, CommandLine, ParentImage, parent_process_name\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("wmic.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('wmic.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000768 {\n  meta:\n    author = \"TDL\"\n    description = \"wmic product where / dpkg -l for Security Software\"\n\
    \    severity = \"LOW\"\n    tactic = \"TA0007\"\n    technique = \"T1518\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /(wmic.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("wmic.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [wmic.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (wmic.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("wmic.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(wmic.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("wmic.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: wmic.exe product where, Get-ItemProperty Uninstall, dpkg -l, or rpm -qa filtered for AV/EDR vendor names.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:

rule_id: TDL-DIS-000771
v4_id: '000771'
name: netstat / ss Enumerated Repeatedly in Short Window
description: netstat -ano / ss -tulnp / lsof -i invoked ≥3 times within 60s. Active-connection survey. Generated from gap analysis against canonical
  ATT&CK Enterprise matrix (T1049 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1049
technique_name: System Network Connections Discovery
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=* sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*netstat*-ano*" OR CommandLine="*ss*-tulnp*"
    OR CommandLine="*lsof*-i*")

    | bin _time span=60s

    | stats count by _time, ComputerName, User

    | where count >= 3

    | table _time, ComputerName, User, count

    '
  kql: "Event\n| where TimeGenerated > ago(1h)\n| where EventID == 1\n| where (ProcessCommandLine has \"netstat\" and ProcessCommandLine has_any\
    \ (\"-ano\", \"-an\", \"-a\")) \n    or (ProcessCommandLine has \"ss\" and ProcessCommandLine has_any (\"-tulnp\", \"-tuln\", \"-tul\"))\n\
    \    or (ProcessCommandLine has \"lsof\" and ProcessCommandLine has \"-i\")\n| summarize executions = count(), CommandLines = make_set(ProcessCommandLine),\
    \ Computers = make_set(Computer) by bin(TimeGenerated, 60s), Account\n| where executions >= 3\n| project TimeGenerated, Account, executions,\
    \ CommandLines, Computers\n"
  aql: |
    SELECT "Process CommandLine", username, sourceip, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS executions
    FROM events
    WHERE ("Process CommandLine" ILIKE '%netstat%' OR "Process CommandLine" ILIKE '%ss -t%' OR "Process CommandLine" ILIKE '%ss -u%' OR "Process CommandLine" ILIKE '%lsof -i%')
    GROUP BY "Process CommandLine", username, sourceip, LOGSOURCENAME(logsourceid)
    HAVING executions >= 3
    LAST 1 MINUTES
  yara_l: "rule network_connection_enumeration_t1049 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects repeated execution of network\
    \ connection enumeration commands (netstat, ss, lsof) - MITRE T1049\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique\
    \ = \"T1049\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      re.regex($e.principal.process.command_line,\
    \ `(?i)netstat\\s+.*-ano`) or\n      re.regex($e.principal.process.command_line, `(?i)ss\\s+.*-tulnp`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)lsof\\s+.*-i`)\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 60s\n    \n  outcome:\n    $risk_score = 65\n\
    \    \n  condition:\n    #e >= 3\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 1 hour
      AND (
        (process.name == "netstat.exe" AND process.command_line LIKE "*-ano*")
        OR (process.name == "ss" AND (process.command_line LIKE "*-tulnp*" OR process.command_line LIKE "*-antp*"))
        OR (process.name == "lsof" AND process.command_line LIKE "*-i*")
      )
    | STATS invocations = COUNT(*) BY host.name, user.name, process.name, win = BUCKET(@timestamp, 60 second)
    | WHERE invocations >= 3
    | KEEP host.name, user.name, process.name, win, invocations
  leql: |
    where(process_cmd_line ICONTAINS "netstat" OR process_cmd_line ICONTAINS "ss -" OR process_cmd_line ICONTAINS "lsof -i") groupby(asset, user) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 (CommandLine=*netstat* OR CommandLine=*ss* OR CommandLine=*lsof*)
    | bucket(span=60s, field=@timestamp, as=time_window)
    | groupBy([time_window, ComputerName, UserName], function=count(as=invocations))
    | invocations >= 3
    | table([time_window, ComputerName, UserName, invocations])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (action_process_image_command_line contains "netstat" and action_process_image_command_line ~= "netstat\s+.*-a.*-n.*-o|netstat.*-ano")
       or (action_process_image_command_line contains "ss" and action_process_image_command_line ~= "ss\s+.*-t.*-u.*-l.*-n.*-p|ss.*-tulnp")
       or (action_process_image_command_line contains "lsof" and action_process_image_command_line ~= "lsof\s+-i")
    | bin _time span=60s
    | comp count() as invocations by _time, agent_hostname, actor_effective_username
    | filter invocations >= 3
    | fields _time, agent_hostname, actor_effective_username, invocations
  lucene: |
    (process.name:(netstat.exe OR netstat OR ss OR lsof) AND (process.command_line:(*-ano* OR *-tulnp* OR *-i*))) OR (process.command_line:(*netstat* AND *-ano*) OR (process.command_line:*ss* AND process.command_line:(*-tulnp* OR *-tun*)) OR (process.command_line:*lsof* AND process.command_line:*-i*))
  sumo: "_sourceCategory=*Sysmon* (\"netstat\" OR \"ss\" OR \"lsof\")\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"CommandLine\"\
    \ as cmd\n| json field=_raw \"Image\" as image\n| json field=_raw \"Computer\" as computer\n| where event_id = \"1\" \n| where (image matches\
    \ \"*netstat*\" and cmd matches \"*-ano*\") \n   OR (image matches \"*ss*\" and cmd matches \"*-tulnp*\") \n   OR (image matches \"*lsof*\"\
    \ and cmd matches \"*-i*\")\n| timeslice 60s\n| count as executions by _timeslice, computer, image\n| where executions >= 3\n| fields _timeslice,\
    \ computer, image, executions\n"
pseudo_logic: netstat -ano / ss -tulnp / lsof -i invoked ≥3 times within 60s. Active-connection survey.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

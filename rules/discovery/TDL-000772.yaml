rule_id: TDL-DIS-000772
v4_id: '000772'
name: whoami /all Followed Quickly by Discovery Tooling
description: whoami /all, id, query user, quser, w issued within 30s of new logon — typical first-step recon. Generated from gap analysis against
  canonical ATT&CK Enterprise matrix (T1033 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1033
technique_name: System Owner/User Discovery
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1 \n(Image=\"*\\\\whoami.exe\" OR (Image=\"*\\\\cmd.exe\"\
    \ CommandLine IN (\"*whoami*\", \"*query user*\", \"*quser*\")) OR (Image=\"*\\\\powershell.exe\" CommandLine=\"*whoami*\") OR Image=\"*/bin/whoami\"\
    \ OR Image=\"*/usr/bin/whoami\" OR Image=\"*/bin/id\" OR Image=\"*/usr/bin/id\" OR Image=\"*/bin/w\" OR Image=\"*/usr/bin/w\" OR Image=\"\
    */usr/bin/users\" OR CommandLine IN (\"*whoami*\", \"*query user*\", \"*quser*\", \"* id *\", \"* w \", \"* w|*\"))\n| eval process_time=_time\n\
    | join type=left ComputerName \n    [search index=* (sourcetype=\"WinEventLog:Security\" EventCode IN (4624, 4625)) OR (sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\"\
    \ EventCode=1) \n    | eval logon_time=_time \n    | fields logon_time, ComputerName, User]\n| where (process_time - logon_time) <= 30 AND\
    \ (process_time - logon_time) >= 0\n| stats earliest(_time) as first_seen, values(Image) as recon_process, values(CommandLine) as command_line,\
    \ values(User) as user by ComputerName\n| table first_seen, ComputerName, user, recon_process, command_line\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_dis_000772 {\n  meta:\n    author = \"TDL\"\n    description = \"whoami /all Followed Quickly by Discovery Tooling\"\n\
    \    severity = \"LOW\"\n    tactic = \"TA0007\"\n    technique = \"T1033\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: whoami /all, id, query user, quser, w issued within 30s of new logon — typical first-step recon.

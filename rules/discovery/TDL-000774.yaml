rule_id: TDL-DIS-000774
v4_id: '000774'
name: net time / w32tm Probed by Unusual Process
description: net time \\<host>, w32tm /query /status, or date / hwclock from a non-admin user-context process. Generated from gap analysis against
  canonical ATT&CK Enterprise matrix (T1124 under Discovery).
tactic: Discovery
tactic_id: TA0007
technique_id: T1124
technique_name: System Time Discovery
platform:
- Windows
- Linux
data_sources:
- Sysmon
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"sysmon\", \"linux_secure\", \"syslog\") \n(\n  (EventCode=1\
    \ \n   (\n     (Image=\"*\\\\net.exe\" CommandLine=\"*time*\") OR \n     (Image=\"*\\\\net1.exe\" CommandLine=\"*time*\") OR\n     (Image=\"\
    *\\\\w32tm.exe\" CommandLine=\"*/query*\" CommandLine=\"*/status*\") OR\n     (Image=\"*\\\\w32tm.exe\" CommandLine=\"*/query*status*\")\n\
    \   )\n   User!=\"*SYSTEM*\" User!=\"*AUTHORITY*\" User!=\"*Administrator*\"\n  ) OR\n  (process_name IN (\"date\", \"hwclock\") user!=\"\
    root\")\n)\n| table _time, host, ComputerName, User, user, Image, process_name, CommandLine, ParentImage, parent_process\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where ProcessCommandLine has_any ("net time", "w32tm", "date", "hwclock")
    | where ProcessCommandLine has_any ("/query", "/status", "\\\\") or (ProcessCommandLine has "date" and ProcessCommandLine !has "update") or ProcessCommandLine has "hwclock"
    | where AccountType != "Machine" and SubjectUserName !endswith "$"
    | where SubjectUserSid !contains "-500" and SubjectUserSid !contains "S-1-5-18" and SubjectUserSid !contains "S-1-5-19" and SubjectUserSid !contains "S-1-5-20"
    | project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, ProcessCommandLine, Process, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE ("EventID" = '1')
      AND (
        ("Process Name" ILIKE '%net.exe%' AND "Process CommandLine" ILIKE '%time%' AND "Process CommandLine" MATCHES '.*\\\\\\\\.*')
        OR ("Process Name" ILIKE '%w32tm.exe%' AND ("Process CommandLine" ILIKE '%/query%' OR "Process CommandLine" ILIKE '%-query%') AND ("Process CommandLine" ILIKE '%status%'))
        OR ("Process Name" ILIKE '%date%' OR "Process Name" ILIKE '%hwclock%')
      )
      AND username NOT IN ('NT AUTHORITY\\SYSTEM', 'SYSTEM', 'root')
      AND "IntegrityLevel" NOT ILIKE '%High%'
      AND "IntegrityLevel" NOT ILIKE '%System%'
    LAST 1 HOURS
  yara_l: "rule system_time_discovery_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects system time discovery commands from\
    \ non-admin users - T1124\"\n    mitre_attack_tactic = \"Discovery\"\n    mitre_attack_technique = \"T1124\"\n    severity = \"Medium\"\n\
    \  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      re.regex($e.principal.process.command_line, `(?i)net\\s+time\\\
    s+\\\\\\\\`) or\n      re.regex($e.principal.process.command_line, `(?i)w32tm\\s+/query\\s+/status`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)^\\s*date\\s*$`) or\n      re.regex($e.principal.process.command_line, `(?i)hwclock`)\n    )\n    not re.regex($e.principal.user.userid,\
    \ `(?i)(admin|root|system|administrator)`)\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n  \n  match:\n    $host,\
    \ $user over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 1 hour
      AND (
        (process.name IN ("net.exe", "net1.exe") AND process.command_line LIKE "*time*" AND process.command_line LIKE "*\\\\*")
        OR (process.name == "w32tm.exe" AND (process.command_line LIKE "*/query*" OR process.command_line LIKE "*/status*"))
        OR (process.name IN ("date", "hwclock") AND process.command_line RLIKE ".*")
      )
      AND NOT user.name IN ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE", "root")
    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.command_line, process.parent.name
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, count
  leql: |
    where((process_cmd_line ICONTAINS "net time" OR process_cmd_line ICONTAINS "w32tm" AND process_cmd_line ICONTAINS "/query" OR process_cmd_line ICONTAINS "hwclock" OR (process_name ICONTAINS "date" AND NOT process_cmd_line ICONTAINS "update"))) groupby(asset, user, process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    (event_simpleName=ProcessRollup2 OR EventCode=1)
    (
      (CommandLine=*net* AND CommandLine=*time* AND CommandLine=*\\\\*)
      OR (CommandLine=*w32tm* AND (CommandLine=*/query* OR CommandLine=*/status*))
      OR FileName=/^(date|hwclock)$/
    )
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (
        (action_process_image_command_line ~= "net\\s+time\\s+\\\\" or action_process_image_command_line ~= "w32tm\\s+/query\\s+/status" or action_process_image_command_line ~= "\\bhwclock\\b" or action_process_image_command_line ~= "\\bdate\\b")
        and actor_effective_username not in ("SYSTEM", "root", "LOCAL SERVICE", "NETWORK SERVICE")
        and actor_effective_username != null
    )
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    (process.command_line:(*net*time* OR *w32tm*\/query* OR *w32tm*query* OR *date* OR *hwclock*) AND NOT (user.name:(*admin* OR *system* OR *SYSTEM* OR *Administrator* OR root))) OR (process.name:(net.exe OR net1.exe OR w32tm.exe OR date OR hwclock) AND process.command_line:(*time* OR *\/query* OR *query* OR *\/status* OR *status*) AND NOT (user.name:(*admin* OR *system* OR *SYSTEM* OR *Administrator* OR root)))
  sumo: "_sourceCategory=*Sysmon* (\"net time\" OR \"w32tm\" OR \"date\" OR \"hwclock\")\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"CommandLine\" as cmd\n| json field=_raw \"User\" as user\n| json field=_raw \"Image\" as process_name\n| where event_id = \"1\" \n| where\
    \ (cmd matches \"*net*time*\" OR cmd matches \"*w32tm*/query*\" OR cmd matches \"*w32tm* /query*\" OR cmd matches \"*date*\" OR cmd matches\
    \ \"*hwclock*\")\n| where !(user matches \"*SYSTEM*\" OR user matches \"*Administrator*\" OR user matches \"*root*\")\n| fields _messageTime,\
    \ _sourceHost, user, process_name, cmd\n"
pseudo_logic: net time \\<host>, w32tm /query /status, or date / hwclock from a non-admin user-context process.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- time
- enum
- t1124
- discovery
references:
- https://attack.mitre.org/techniques/T1124/

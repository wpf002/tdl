rule_id: TDL-DIS-002
name: LDAP Enumeration - Bulk Active Directory Object Queries
tactic: Discovery
tactic_id: TA0007
technique_id: T1087.002
technique_name: Domain Account Discovery
platform:
- Windows
data_sources:
- Windows Security Event Log (4661)
severity: High
fidelity: Medium
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4661

    | stats count by user, IpAddress, LogonType, EventCode

    | where count >= 1

    | sort - count

    '
  kql: |
    SecurityEvent
    | where EventID == 4661
    | summarize count_ = count() by Account, IpAddress, LogonType, EventID
    | where count_ >= 1
    | sort by count_ desc
    | project Account, IpAddress, LogonType, EventID, count_
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '4661'
    GROUP BY username, sourceip, "Logon Type", "EventID"
    HAVING event_count >= 1
    ORDER BY event_count DESC
    LAST 24 HOURS
  yara_l: |
    rule windows_sam_enumeration_via_event_4661 {
      meta:
        author = "Detection Engineer"
        description = "Detects potential SAM enumeration via Windows Security Event 4661"
        mitre_attack_tactic = "Discovery"
        mitre_attack_technique = "T1087.002"
        severity = "Medium"

      events:
        $e.metadata.event_type = "GENERIC_EVENT"
        $e.metadata.product_event_type = "4661"
        $e.principal.user.userid = $user
        $e.principal.ip = $ip
        $e.metadata.product_log_id = $logon_type
        $e.metadata.product_event_type = $event_code

      match:
        $user, $ip, $logon_type, $event_code over 24h

      outcome:
        $risk_score = max(35)
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "4661"
    | STATS count = COUNT(*) BY user.name, source.ip, winlog.logon.type, event.code
    | WHERE count >= 1
    | SORT count DESC
  leql: |
    where(source_json.EventID=4661) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventCode) calculate(count)
  crowdstrike: |
    EventCode=4661
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=count(as=cnt))
    | cnt >= 1
    | sort(cnt, order=desc)
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4661
    | comp count() as event_count by actor_effective_username, action_remote_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id
    | filter event_count >= 1
    | sort desc event_count
  lucene: |
    event.code:4661 OR EventID:4661 OR winlog.event_id:4661
  sumo: |
    _sourceCategory=*Windows*Security* "4661"
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | where event_id = "4661"
    | count as cnt by user, IpAddress, LogonType, event_id
    | where cnt >= 1
    | sort by cnt desc
false_positives:
- Identity management platforms
- HR system AD integrations
tags:
- ldap
- bloodhound
- discovery
- domain-enumeration
author: TDL
created: '2024-02-21'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the enumeration command(s) observed.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — determine whether the enumeration is targeted (specific
  user / share / OU) or scattered (broad, scripted).
- 'Compare against the user''s role: is this discovery activity normal for an admin, engineer, or pen-tester? Discovery from a finance or HR identity
  is high-signal.'
- Pull adjacent execution / lateral-movement / cred-access telemetry — discovery often precedes the next stage by minutes.
- 'Decide TP / FP: FP for sanctioned pen-test, asset inventory, or admin troubleshooting; TP if the user is unexpected and adjacent telemetry
  is suspicious.'
- 'If TP: review what was learned (groups, hosts, paths), constrain the user''s privileges, and watch for the next-stage activity that the recon
  was likely setting up.'
pseudo_logic: '1 or more instances over any time window of Windows Security Event 4661 (A handle to an object was requested).


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4661

  With results aggregated by user, IpAddress, LogonType, and EventCode

  Where count of matching events is greater than or equal to 1

  With the same user, IpAddress, LogonType, and EventCode

  Sorted descending by count to surface highest-volume enumeration activity first'

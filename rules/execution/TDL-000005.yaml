rule_id: TDL-EXE-000005
v4_id: '000005'
name: Hacktools Detected
description: Detects hacktool being downloaded or utilized identified by the security appliance.
tactic: Execution
tactic_id: TA0002
technique_id: T1588
technique_name: Obtain Capabilities
platform:
- Network
data_sources:
- IDS/IPS
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=network sourcetype=suricata* OR sourcetype=snort* OR sourcetype=ids* OR sourcetype=ips* (signature="*Hacktool*" OR alert_signature="*Hacktool*"
    OR event_type="*Hacktool*" OR rule_name="*Hacktool*")

    | table _time, src_ip, dest_ip, src_port, dest_port, signature, alert_signature, rule_name, event_type, protocol

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has_any ("Palo Alto Networks", "Cisco", "Fortinet", "Check Point", "Snort", "Suricata")
    | where DeviceEventClassID contains "Hacktool" or Activity contains "Hacktool" or Message contains "Hacktool" or AdditionalExtensions contains "Hacktool"
    | project TimeGenerated, DeviceVendor, DeviceProduct, DeviceEventClassID, Activity, Message, SourceIP, DestinationIP, SourcePort, DestinationPort, Protocol, ApplicationProtocol, AdditionalExtensions
  aql: |
    SELECT sourceip, destinationip, qidname(qid), categoryname(category), COUNT(*) AS event_count
    FROM events
    WHERE categoryname(category) ILIKE '%IDS%' OR categoryname(category) ILIKE '%IPS%'
      AND (qidname(qid) ILIKE '%hacktool%' OR qidname(qid) ILIKE '%hack tool%')
    LAST 24 HOURS
  yara_l: "rule hacktool_signature_detection {\n  meta:\n    author = \"TDL\"\n    description = \"Detects IDS/IPS events with Hacktool signature\
    \ (MITRE T1588)\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1588\"\n    severity = \"High\"\n    \n  events:\n\
    \    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    re.regex($e.security_result.summary, `(?i)hacktool`)\n    $e.principal.ip = $src_ip\n\
    \    \n  match:\n    $src_ip over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-network*
    | WHERE event.category == "intrusion_detection" AND (event.dataset LIKE "*suricata*" OR event.dataset LIKE "*snort*" OR event.dataset LIKE "*zeek*") AND TO_LOWER(COALESCE(suricata.eve.alert.signature, snort.alert.signature, event.action, "")) LIKE "*hacktool*"
    | KEEP @timestamp, source.ip, destination.ip, destination.port, event.action, suricata.eve.alert.signature, snort.alert.signature, host.name, network.protocol
  leql: |
    where(event_type="IDS Event" AND signature_name ICONTAINS "Hacktool")
  crowdstrike: |
    #type=ids signature=*Hacktool* OR signature=*hacktool*
    | table([@timestamp, src_ip, dest_ip, signature, severity, ComputerName])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter threat_category = "hacktool"
    | fields _time, src_ip, dst_ip, threat_name, app, action
  lucene: |
    signature:Hacktool OR signature:*Hacktool* OR alert.signature:Hacktool OR alert.signature:*Hacktool* OR event.signature:Hacktool OR event.signature:*Hacktool*
  sumo: |
    _sourceCategory=*IDS* OR _sourceCategory=*IPS* OR _sourceCategory=*Network*
    | where signature matches "*Hacktool*" OR signature matches "*hacktool*" OR alert_signature matches "*Hacktool*" OR alert_signature matches "*hacktool*" OR rule_name matches "*Hacktool*" OR rule_name matches "*hacktool*" OR message matches "*Hacktool*"
    | fields _messageTime, _sourceHost, signature, alert_signature, rule_name, src_ip, dest_ip, message
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: Tune per environment baseline.
tags:
- thr
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 IDS/IPS event where the signature is Hacktool
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — pay attention to short-lived processes, encoded arguments, and unusual
  parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

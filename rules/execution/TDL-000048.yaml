rule_id: TDL-EXE-000048
v4_id: 000048
name: Persistent Malware
description: Detects a specific piece of malware that is repeatedly detected and cleaned by the AV on a system. This could indicate that the AV
  is leaving remnants of the malware when deleting it that cause it to be installed again after it has been cleaned. This could also be an indication
  that a user has bad network practice and is repeatedly infected with the same malware.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Antivirus
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype=*av* OR sourcetype=*antivirus* OR sourcetype=*symantec* OR sourcetype=*mcafee* OR sourcetype=*defender* OR tag=malware

    | bin _time span=20m

    | stats count dc(host) as host_count values(host) as hosts by _time, file_hash, signature

    | where count >= 4 AND host_count = 1

    | table _time, hosts, file_hash, signature, count

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(20m)
    | where DeviceVendor has "Antivirus" or DeviceProduct has "Antivirus" or DeviceEventClassID in ("malware", "virus", "threat")
    | extend SourceHostname = coalesce(SourceHostName, DeviceName, Computer)
    | extend FileHashSignature = coalesce(FileHash, SourceUserName, Message)
    | where isnotempty(SourceHostname) and isnotempty(FileHashSignature)
    | summarize EventCount = count(), FirstDetection = min(TimeGenerated), LastDetection = max(TimeGenerated), EventDetails = make_set(Activity, 10) by SourceHostname, FileHashSignature
    | where EventCount >= 4
    | where datetime_diff('minute', LastDetection, FirstDetection) <= 20
    | project SourceHostname, FileHashSignature, EventCount, FirstDetection, LastDetection, EventDetails
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS source_hostname, "File Hash" AS file_hash, COUNT(*) AS malware_detections, MIN(eventtime) AS first_seen, MAX(eventtime) AS last_seen
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%malware%'
      AND "File Hash" IS NOT NULL
    GROUP BY LOGSOURCENAME(logsourceid), "File Hash"
    HAVING malware_detections >= 4
      AND (MAX(eventtime) - MIN(eventtime)) <= 1200000
    LAST 20 MINUTES
  yara_l: |
    rule malware_detection_burst {
      meta:
        author = "TDL"
        description = "Detects 4 or more malware detection events with same hostname and file hash within 20 minutes"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.event_type = "SCAN_UNCATEGORIZED"
        $e.security_result.action = "BLOCK" or $e.security_result.action = "ALLOW"
        $e.security_result.summary = "malware" or $e.security_result.summary = "virus" or $e.security_result.summary = "threat"
        $e.principal.hostname = $host
        $e.target.file.sha256 = $hash or $e.target.file.md5 = $hash or $e.principal.file.sha256 = $hash or $e.principal.file.md5 = $hash

      match:
        $host, $hash over 20m

      condition:
        #e >= 4
    }
  esql: "FROM .alerts-security.alerts-*\n| WHERE @timestamp > NOW() - 20 minutes \n  AND event.kind == \"alert\" \n  AND event.category == \"\
    malware\"\n| STATS event_count = COUNT(*), hosts = VALUES(host.name) BY file.hash.sha256, host.name, time_bucket = BUCKET(@timestamp, 20 minutes)\n\
    | WHERE event_count >= 4\n| KEEP time_bucket, host.name, file.hash.sha256, event_count\n"
  leql: |
    where(log_source_type="Antivirus") groupby(asset, source_json.file_hash) calculate(count)
  crowdstrike: |
    #type=antivirus
    | groupBy([aid, SHA256HashData], function=[count(as=detections), collect([ComputerName, FileName, DetectName])], limit=max)
    | bucket(span=20m, function=[max(detections, as=max_detections)])
    | max_detections >= 4
    | table([aid, SHA256HashData, ComputerName, FileName, DetectName, max_detections])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_MALWARE and event_sub_type in (ENUM.EVENT_SUB_TYPE_MALWARE_DETECTED, ENUM.EVENT_SUB_TYPE_MALWARE_BLOCKED)
    | bin _time span=20m
    | comp count() as malware_count by _time, agent_hostname, action_file_sha256
    | filter malware_count >= 4
    | fields _time, agent_hostname, action_file_sha256, malware_count
  lucene: |
    event_type:"malware_detection" AND _exists_:host.name AND _exists_:file.hash
  sumo: |
    _sourceCategory=*Antivirus* OR _sourceCategory=*AV* OR _sourceCategory=*malware*
    | parse regex "(?<file_hash>[a-fA-F0-9]{32,64})" nodrop
    | parse regex "(?<signature>[\w\-\.]+)" nodrop
    | parse regex "(?<source_host>[\w\-\.]+)" nodrop
    | json field=_raw "ComputerName" as computer nodrop
    | json field=_raw "Host" as host nodrop
    | json field=_raw "Hostname" as hostname nodrop
    | json field=_raw "SourceHostname" as source_hostname nodrop
    | json field=_raw "FileHash" as json_file_hash nodrop
    | json field=_raw "Hash" as json_hash nodrop
    | json field=_raw "MD5" as md5 nodrop
    | json field=_raw "SHA256" as sha256 nodrop
    | json field=_raw "Signature" as json_signature nodrop
    | json field=_raw "ThreatName" as threat_name nodrop
    | json field=_raw "MalwareName" as malware_name nodrop
    | if(isNull(computer), if(isNull(host), if(isNull(hostname), if(isNull(source_hostname), source_host, source_hostname), hostname), host), computer) as normalized_host
    | if(isNull(json_file_hash), if(isNull(json_hash), if(isNull(md5), if(isNull(sha256), file_hash, sha256), md5), json_hash), json_file_hash) as normalized_hash
    | if(isNull(json_signature), if(isNull(threat_name), malware_name, threat_name), json_signature) as normalized_signature
    | where !isNull(normalized_host) and (!isNull(normalized_hash) or !isNull(normalized_signature))
    | timeslice 20m
    | count as detection_count by _timeslice, normalized_host, normalized_hash, normalized_signature
    | where detection_count >= 4
    | fields _timeslice, normalized_host, normalized_hash, normalized_signature, detection_count
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '4 Malware Detection Events

  With the same Source Hostname and File Hash/Signature

  Within 20 minutes'
suppression:
  window: 12 hours
  fields:
  - Source Hostname
  - File Hash/Signature
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

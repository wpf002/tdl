rule_id: TDL-EXE-000050
v4_id: '000050'
name: Ransomware AV Detection
description: Detects an anti-virus notification for ransomware found on a host. Even if the anti-virus reports the ransomware was cleaned, there
  may be other undetected parts of the ransomware that were not cleaned and still active.
tactic: Execution
tactic_id: TA0002
technique_id: T1486
technique_name: Data Encrypted for Impact
platform:
- Windows
data_sources:
- Antivirus
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 95
queries:
  spl: "index=* sourcetype IN (antivirus, av, symantec:*, mcafee:*, trendmicro:*, carbonblack:*, crowdstrike:*) \n(Signature=*ransom* OR Signature=*lock*\
    \ OR Signature=*crypt*) \nNOT (Signature=*block* OR Signature=*currency* OR Signature=*cryptonight*)\n| table _time, host, Signature, File_Name,\
    \ File_Path, User, Action\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has "antivirus" or DeviceProduct has "antivirus" or DeviceEventClassID in ("alert", "malware", "threat")
    | where Activity has_any ("detected", "blocked", "prevented", "found")
    | extend SignatureLower = tolower(DeviceCustomString2)
    | where SignatureLower has_any ("ransom", "lock", "crypt")
    | where SignatureLower !has_any ("block", "currency", "cryptonight")
    | project TimeGenerated, DeviceVendor, DeviceProduct, Activity, Signature = DeviceCustomString2, FileName = FileName, FilePath = FilePath, SourceIP, DestinationIP, DeviceName = Computer
  aql: |
    SELECT sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS host, qidname(qid) AS signature, eventtime
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%malware%'
      AND (qidname(qid) ILIKE '%ransom%' OR qidname(qid) ILIKE '%lock%' OR qidname(qid) ILIKE '%crypt%')
      AND qidname(qid) NOT ILIKE '%block%'
      AND qidname(qid) NOT ILIKE '%currency%'
      AND qidname(qid) NOT ILIKE '%cryptonight%'
    LAST 24 HOURS
  yara_l: |
    rule ransomware_malware_detection {
      meta:
        author = "TDL"
        description = "Detects antivirus signatures indicating ransomware activity based on T1486 Impact - Data Encrypted for Impact"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1486"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "SCAN_UNCATEGORIZED"
        $e.metadata.product_log_id = "ANTIVIRUS"
        (
          re.regex($e.security_result.description, `(?i)ransom`) or
          re.regex($e.security_result.description, `(?i)lock`) or
          re.regex($e.security_result.description, `(?i)crypt`)
        )
        not re.regex($e.security_result.description, `(?i)block`)
        not re.regex($e.security_result.description, `(?i)currency`)
        not re.regex($e.security_result.description, `(?i)cryptonight`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: "FROM logs-endpoint.alerts*, .alerts-security.alerts-*\n| WHERE event.category == \"malware\" \n  AND (\n    TO_LOWER(threat.indicator.description)\
    \ LIKE \"*ransom*\" \n    OR TO_LOWER(threat.indicator.description) LIKE \"*lock*\" \n    OR TO_LOWER(threat.indicator.description) LIKE \"\
    *crypt*\"\n  )\n  AND NOT (\n    TO_LOWER(threat.indicator.description) LIKE \"*block*\" \n    OR TO_LOWER(threat.indicator.description) LIKE\
    \ \"*currency*\" \n    OR TO_LOWER(threat.indicator.description) LIKE \"*cryptonight*\"\n  )\n| KEEP @timestamp, host.name, user.name, threat.indicator.description,\
    \ file.path, process.name, process.executable\n"
  leql: |
    where(source_json.Signature ICONTAINS "ransom" OR source_json.Signature ICONTAINS "lock" OR source_json.Signature ICONTAINS "crypt") AND NOT (source_json.Signature ICONTAINS "block" OR source_json.Signature ICONTAINS "currency" OR source_json.Signature ICONTAINS "cryptonight")
  crowdstrike: "event_simpleName=DetectionSummaryEvent \n(Technique=*T1486* OR PatternDispositionDescription=*ransom* OR PatternDispositionDescription=*lock*\
    \ OR PatternDispositionDescription=*crypt*)\n(PatternDispositionDescription!=*block* AND PatternDispositionDescription!=*currency* AND PatternDispositionDescription!=*cryptonight*)\n\
    | table([@timestamp, ComputerName, UserName, FileName, PatternDispositionDescription, DetectDescription, SHA256HashData])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_ANTI_MALWARE and event_sub_type = ENUM.EVENT_SUB_TYPE_MALWARE_DETECTED
    | filter (lowercase(action_evtlog_message) contains "ransom" or lowercase(action_evtlog_message) contains "lock" or lowercase(action_evtlog_message) contains "crypt")
    | filter not (lowercase(action_evtlog_message) contains "block" or lowercase(action_evtlog_message) contains "currency" or lowercase(action_evtlog_message) contains "cryptonight")
    | fields _time, agent_hostname, action_evtlog_message, actor_effective_username, action_file_path
  lucene: |
    signature:(*ransom* OR *lock* OR *crypt*) AND NOT signature:(*block* OR *currency* OR *cryptonight*)
  sumo: |
    _sourceCategory=*Antivirus* OR _sourceCategory=*AV* OR _sourceCategory=*Malware*
    | parse regex field=_raw "(?i)(?:signature|malware|threat)[\s\"\:]+(?<signature>[^\"\,\n]+)"
    | where signature matches /(?i).*(ransom|lock|crypt).*/
    | where !(signature matches /(?i).*(block|currency|cryptonight).*/)
    | fields _messageTime, _sourceHost, signature
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Malware Detection Event

  Where the Signature case insensitive contains one of: [ransom, lock, crypt]

  Where the Signature does NOT case insensitive contain one of: [block, currency, cryptonight]'
suppression:
  window: 4 Hours
  fields:
  - Source Hostname
  - File Hash/Signature
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

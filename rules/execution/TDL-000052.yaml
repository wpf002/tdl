rule_id: TDL-EXE-000052
v4_id: '000052'
name: Multiple Malware Signatures Detected on a Host
description: Detects multiple anti-virus notification for malware that was unable to be cleaned or quarantined by the anti-virus. The malware
  is still active on the host and should be remediated.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Antivirus
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=av sourcetype=antivirus action=blocked OR action=detected OR action=quarantined

    | bin _time span=5m

    | stats dc(file_hash) as unique_hashes values(file_hash) as file_hashes values(file_name) as file_names by _time, src_host

    | where unique_hashes >= 3

    | table _time, src_host, unique_hashes, file_hashes, file_names

    '
  kql: "let timeWindow = 5m;\nDeviceEvents\n| where TimeGenerated > ago(1h)\n| where ActionType == \"AntivirusDetection\"\n| summarize \n    UniqueHashes\
    \ = dcount(SHA256),\n    FileHashes = make_set(SHA256),\n    DetectionCount = count(),\n    FirstDetection = min(TimeGenerated),\n    LastDetection\
    \ = max(TimeGenerated)\n    by bin(TimeGenerated, timeWindow), DeviceName\n| where UniqueHashes >= 3 and DetectionCount >= 3\n| where datetime_diff('minute',\
    \ LastDetection, FirstDetection) <= 5\n| project TimeGenerated, DeviceName, DetectionCount, UniqueHashes, FileHashes, FirstDetection, LastDetection\n"
  aql: |
    SELECT sourceip, LOGSOURCENAME(logsourceid) AS hostname, UNIQUECOUNT(COALESCE("File Hash", "Signature")) AS unique_indicators, COUNT(*) AS total_detections
    FROM events
    WHERE category IN (1901, 1902, 1903, 1904, 1905) OR CATEGORYNAME(category) ILIKE '%malware%' OR CATEGORYNAME(category) ILIKE '%virus%' OR CATEGORYNAME(category) ILIKE '%antivirus%'
    GROUP BY sourceip, LOGSOURCENAME(logsourceid)
    HAVING total_detections >= 3 AND unique_indicators >= 3
    LAST 5 MINUTES
  yara_l: |
    rule multiple_malware_detections_same_host {
      meta:
        author = "Detection Engineer"
        description = "Detects 3+ unique malware detections on the same host within 5 minutes"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.event_type = "SCAN_UNCATEGORIZED"
        $e.security_result.action = "BLOCK" or $e.security_result.action = "ALLOW"
        $e.security_result.detection_fields.key = "signature" or $e.security_result.detection_fields.key = "sha256" or $e.security_result.detection_fields.key = "md5"
        $e.principal.hostname = $host
        $e.security_result.detection_fields.value = $hash

      match:
        $host over 5m

      outcome:
        $risk_score = max(75)
        $unique_hashes = count_distinct($hash)

      condition:
        #e >= 3 and $unique_hashes >= 3
    }
  esql: |
    FROM .alerts-security.alerts-*
    | WHERE @timestamp > NOW() - 5 minutes
      AND event.kind == "alert"
      AND event.category == "malware"
    | STATS unique_hashes = COUNT_DISTINCT(file.hash.sha256), unique_sigs = COUNT_DISTINCT(rule.name) BY host.name, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE unique_hashes >= 3 OR unique_sigs >= 3
    | KEEP host.name, unique_hashes, unique_sigs, time_window
  leql: |
    where(source_json.category="malware" OR category="malware") groupby(asset) calculate(unique:source_json.file_hash)
  crowdstrike: |
    #event_type=DetectionSummaryEvent event_platform=Win
    | groupBy([ComputerName], function=[count(SHA256HashData, distinct=true, as=uniqueHashes), collect([SHA256HashData, FileName, @timestamp])], limit=max)
    | uniqueHashes >= 3
    | table([ComputerName, uniqueHashes, SHA256HashData, FileName, @timestamp])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_MALWARE and event_sub_type = ENUM.EVENT_SUB_TYPE_MALWARE_DETECTED
    | bin _time span=5m
    | comp count_distinct(action_file_sha256) as unique_malware by _time, agent_hostname
    | filter unique_malware >= 3
    | fields _time, agent_hostname, unique_malware
  lucene: |
    event.type:"malware_detection" OR event.category:"malware" OR event.action:"detected" OR antivirus.detection_name:* OR threat.indicator.name:*
  sumo: |
    _sourceCategory=*Antivirus* OR _sourceCategory=*AV* OR _sourceCategory=*malware*
    | json field=_raw "hostname" as hostname, "file_hash" as file_hash, "signature" as signature
    | where !isNull(hostname) and (!isNull(file_hash) or !isNull(signature))
    | fields _messageTime, hostname, file_hash, signature
    | timeslice 5m
    | count_distinct(coalesce(file_hash, signature)) as unique_detections by _timeslice, hostname
    | where unique_detections >= 3
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '3 Malware Detection Events

  With the same Source Hostname

  With unique File Hashs/Signatures

  Within 5 minutes'
suppression:
  window: 12 hours
  fields:
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000061
v4_id: '000061'
name: Mass URL Blocked - Same Source
description: Detects when a user clicks on a link that is blocked by the forward proxy multiple times within a short timeframe.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=proxy action=blocked \n| bin _time span=5m \n| stats count by _time, src_ip, url \n| where count >= 10\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(5m)
    | where DeviceVendor has "Proxy" or DeviceProduct has "Proxy" or DeviceEventClassID has "Proxy"
    | where DeviceAction =~ "Blocked" or DeviceAction =~ "Deny" or DeviceAction =~ "Block"
    | summarize EventCount = count() by bin(TimeGenerated, 5m), SourceIP, RequestURL
    | where EventCount >= 10
    | project TimeGenerated, SourceIP, RequestURL, EventCount
  aql: |
    SELECT sourceip, URL, COUNT(*) AS blocked_attempts
    FROM events
    WHERE categoryname(category) ILIKE '%proxy%'
      AND (qidname(qid) ILIKE '%block%' OR qidname(qid) ILIKE '%denied%')
    GROUP BY sourceip, URL
    HAVING blocked_attempts >= 10
    LAST 5 MINUTES
  yara_l: |
    rule blocked_proxy_requests_same_url {
      meta:
        author = "Detection Engineering"
        description = "Detects 10 or more blocked forward proxy requests to the same URL from the same source IP within 5 minutes"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.security_result.action = "BLOCK"
        $e.principal.ip = $src_ip
        $e.target.url = $url

      match:
        $src_ip, $url over 5m

      condition:
        #e >= 10
    }
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 5 minutes AND event.action == "blocked"
    | STATS count = COUNT(*) BY source.ip, url.full, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE count >= 10
    | KEEP source.ip, url.full, count, time_window
  leql: |
    where(action=BLOCKED) groupby(source_address, url) calculate(count)
  crowdstrike: |
    #type=forward_proxy action=blocked
    | bucket(span=5m)
    | groupBy([_bucket, source_ip, url], function=count(as=event_count))
    | event_count >= 10
    | table([_bucket, source_ip, url, event_count])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action = "deny" or action = "drop" or action = "block-url" or action = "block"
    | bin _time span=5m
    | comp count() as event_count by _time, src_ip, url_name
    | filter event_count >= 10
    | fields _time, src_ip, url_name, event_count
  lucene: |
    _exists_:source.ip AND _exists_:url AND action:blocked
  sumo: |
    _sourceCategory=*Forward*Proxy* OR _sourceCategory=*Proxy* action=blocked OR Action=blocked OR status=blocked
    | json field=_raw "Action" as action_field
    | json field=_raw "SourceIP" as source_ip_field
    | json field=_raw "URL" as url_field
    | json field=_raw "src_ip" as src_ip_alt
    | json field=_raw "url" as url_alt
    | json field=_raw "destination" as dest_alt
    | where (action_field matches "*block*" OR action_field matches "*denied*" OR action_field matches "*Block*" OR action_field matches "*Denied*")
    | if(isNull(source_ip_field), src_ip_alt, source_ip_field) as src_ip
    | if(isNull(url_field), if(isNull(url_alt), dest_alt, url_alt), url_field) as url
    | timeslice 5m
    | count as event_count by _timeslice, src_ip, url
    | where event_count >= 10
    | fields _timeslice, src_ip, url, event_count
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '10 Forward Proxy Events

  Where the Action is Blocked

  With the same Source IP

  With the same URL

  Within 5 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

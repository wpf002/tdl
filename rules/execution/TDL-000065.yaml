rule_id: TDL-EXE-000065
v4_id: '000065'
name: Executable File Downloaded from Shortened URL
description: URL shortening services such as Bitly, Google, and Twitter in which a URL may be made substantially shorter and still direct to the
  required page are used for many legitimate purposes such as messaging technologies that limit the number of characters in a message (for example
  SMS, twitter, etc).
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=proxy (dest IN ("bit.ly","ow.ly","goo.gl","tinyurl.com","short.io","rebrand.ly","bl.ink","snip.ly","shor.by") OR (url IN ("*.exe","*.dll","*.bat","*.cmd","*.ps1","*.vbs","*.js","*.jar","*.msi","*.scr","*.com","*.pif")
    OR file_name IN ("*.exe","*.dll","*.bat","*.cmd","*.ps1","*.vbs","*.js","*.jar","*.msi","*.scr","*.com","*.pif")) OR (http_content_type IN
    ("application/x-msdownload","application/x-msdos-program","application/x-dosexec","application/octet-stream","application/exe","application/x-exe","application/dos-exe","application/x-winexe","application/msdos-windows","application/x-msi","application/x-java-archive")))

    | table _time, src, user, dest, url, http_method, http_content_type, file_name, bytes_in, bytes_out

    '
  kql: |
    ForwardProxyEvents
    | where TimeGenerated > ago(1h)
    | where DestinationDomain has_any ("bit.ly", "ow.ly", "goo.gl", "tinyurl.com", "short.io", "rebrand.ly", "bl.ink", "snip.ly", "shor.by")
        or (FileExtension in~ ("exe", "dll", "bat", "cmd", "ps1", "vbs", "js", "jar", "scr", "msi", "com", "pif", "hta", "wsf", "lnk", "cpl", "application"))
        or (ContentType in~ ("application/x-msdownload", "application/x-msdos-program", "application/x-executable", "application/exe", "application/x-exe", "application/dos-exe", "application/x-winexe", "application/msdos-windows", "application/octet-stream", "application/x-bat", "application/x-sh", "application/x-powershell", "application/java-archive"))
    | project TimeGenerated, SourceIP, DestinationDomain, Url, FileExtension, ContentType, UserPrincipalName, Action
  aql: |
    SELECT sourceip, destinationip, "Destination Domain", "File Extension", "Content Type", COUNT(*) AS event_count
    FROM events
    WHERE (
        "Destination Domain" IN ('bit.ly', 'ow.ly', 'goo.gl', 'tinyurl.com', 'short.io', 'rebrand.ly', 'bl.ink', 'snip.ly', 'shor.by')
        OR
        "File Extension" IN ('exe', 'dll', 'bat', 'cmd', 'ps1', 'vbs', 'js', 'jar', 'msi', 'scr', 'com', 'pif', 'hta', 'cpl', 'wsf', 'vbe', 'jse')
        OR
        "Content Type" IN ('application/x-msdownload', 'application/x-msdos-program', 'application/x-executable', 'application/octet-stream', 'application/x-dosexec', 'application/exe', 'application/x-exe', 'application/dos-exe', 'application/x-winexe', 'application/msdos-windows', 'application/x-msi')
    )
    AND categoryname(category) ILIKE '%proxy%'
    GROUP BY sourceip, destinationip, "Destination Domain", "File Extension", "Content Type"
    LAST 1 HOURS
  yara_l: "rule suspicious_download_via_proxy {\n  meta:\n    author = \"TDL\"\n    description = \"Detects downloads of executables via forward\
    \ proxy from URL shorteners or with suspicious content types - MITRE T1204\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1204\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.metadata.product_name = /(?i)proxy/\n    (\n      re.regex($e.target.url,\
    \ `(?i)(bit\\.ly|ow\\.ly|goo\\.gl|tinyurl\\.com|short\\.io|rebrand\\.ly|bl\\.ink|snip\\.ly|shor\\.by)`)\n      or\n      (\n        re.regex($e.target.file.full_path,\
    \ `(?i)\\.(exe|dll|scr|bat|cmd|ps1|vbs|js|jar|msi|com|pif|hta)$`)\n        and\n        re.regex($e.network.http.response_headers, `(?i)content-type:\\\
    s*(application/(x-msdownload|x-msdos-program|x-executable|octet-stream|x-dosexec)|application/x-ms(i|download)|text/(x-msdos-batch|x-vbs))`)\n\
    \      )\n    )\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    $e.target.url = $url\n    \n  match:\n    $host,\
    \ $user over 5m\n    \n  outcome:\n    $risk_score = 65\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 24 hours
    | WHERE (
        destination.domain IN ("bit.ly", "ow.ly", "goo.gl", "tinyurl.com", "short.io", "rebrand.ly", "bl.ink", "snip.ly", "shor.by")
        OR (
          (url.path RLIKE ".*\\.(exe|dll|msi|bat|cmd|ps1|vbs|js|jar|scr|com|pif|hta|cpl|wsf|reg)$" OR file.extension IN ("exe", "dll", "msi", "bat", "cmd", "ps1", "vbs", "js", "jar", "scr", "com", "pif", "hta", "cpl", "wsf", "reg"))
          AND http.response.mime_type IN ("application/x-msdownload", "application/x-msdos-program", "application/x-executable", "application/x-dosexec", "application/octet-stream", "application/x-msi", "application/x-bat", "application/x-sh", "application/javascript", "application/x-java-archive")
        )
      )
    | KEEP @timestamp, source.ip, user.name, destination.domain, url.full, url.path, file.extension, http.response.mime_type, http.response.status_code
  leql: |
    where((destination_domain IN [bit.ly, ow.ly, goo.gl, tinyurl.com, short.io, rebrand.ly, bl.ink, snip.ly, shor.by]) OR (file_extension IN [exe, dll, scr, bat, cmd, com, pif, vbs, js, jar, msi, app, deb, rpm, run, osx, ps1, psm1] AND content_type IN [application/x-msdownload, application/x-msdos-program, application/x-msi, application/x-ms-dos-executable, application/x-exe, application/x-winexe, application/octet-stream, application/x-dosexec]))
  crowdstrike: |
    #type=proxy (DestinationDomain IN [bit.ly, ow.ly, goo.gl, tinyurl.com, short.io, rebrand.ly, bl.ink, snip.ly, shor.by] OR (FileExtension IN [exe, dll, bat, cmd, com, scr, vbs, js, jar, ps1, psm1, msi, msp] OR ContentType IN ["application/x-msdownload", "application/x-msdos-program", "application/x-exe", "application/x-dosexec", "application/vnd.microsoft.portable-executable", "application/x-bat", "application/x-sh", "application/x-shellscript", "application/octet-stream"]))
    | table([@timestamp, ComputerName, UserName, DestinationDomain, FileExtension, ContentType, URL])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_source = "forward-proxy"
    | filter dst_host_name in ("bit.ly", "ow.ly", "goo.gl", "tinyurl.com", "short.io", "rebrand.ly", "bl.ink", "snip.ly", "shor.by")
        or (action_file_name ~= "\.(exe|dll|bat|cmd|ps1|vbs|js|jar|scr|com|pif|msi|hta)$")
        or (http_content_type in ("application/x-msdownload", "application/x-msdos-program", "application/x-executable", "application/octet-stream", "application/x-dosexec", "application/exe", "application/x-exe", "application/dos-exe", "application/x-winexe", "application/msdos-windows", "application/x-msi"))
    | fields _time, src_ip, dst_host_name, action_file_name, http_content_type, user
  lucene: |
    (destination.domain:(bit.ly OR ow.ly OR goo.gl OR tinyurl.com OR short.io OR rebrand.ly OR bl.ink OR snip.ly OR shor.by)) OR (file.extension:(exe OR dll OR bat OR cmd OR ps1 OR vbs OR js OR jar OR msi OR scr OR com OR pif OR hta OR wsf OR cpl OR sys OR drv OR ocx) AND http.response.mime_type:(application/x-msdownload OR application/x-msdos-program OR application/x-dosexec OR application/octet-stream OR application/exe OR application/x-exe OR application/dos-exe OR application/x-winexe OR application/msdos-windows OR application/x-msi OR application/x-ms-installer OR application/bat OR application/x-bat OR application/cmd OR application/x-cmd))
  sumo: |
    _sourceCategory=*Proxy* OR _sourceCategory=*Forward*Proxy*
    | parse regex "(?<dest_domain>[a-zA-Z0-9\.\-]+)" nodrop
    | parse regex "(?<url>https?://[^\s]+)" nodrop
    | parse regex "\.(?<file_ext>[a-zA-Z0-9]{2,4})(\?|$|\s)" nodrop
    | parse regex field=_raw "content[_\-]?type[:\s]+[\"']?(?<content_type>[^\s\"';]+)" nodrop
    | where (dest_domain matches "*bit.ly*" or dest_domain matches "*ow.ly*" or dest_domain matches "*goo.gl*" or dest_domain matches "*tinyurl.com*" or dest_domain matches "*short.io*" or dest_domain matches "*rebrand.ly*" or dest_domain matches "*bl.ink*" or dest_domain matches "*snip.ly*" or dest_domain matches "*shor.by*")
       or (file_ext in ("exe", "dll", "bat", "cmd", "ps1", "vbs", "js", "jar", "msi", "scr", "com", "pif", "cpl"))
       or (content_type matches "*application/x-msdownload*" or content_type matches "*application/x-msdos-program*" or content_type matches "*application/x-executable*" or content_type matches "*application/octet-stream*" or content_type matches "*application/x-dosexec*")
    | fields _messageTime, _sourceHost, dest_domain, url, file_ext, content_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Forward Proxy Event\nWhere the Destination Domain is in  [bit.ly, ow.ly, goo.gl, tinyurl.com, short.io, rebrand.ly, bl.ink, snip.ly,\
  \ shor.by]\nOR\n\tWhere the File Extension is in the Executable File Extensions List\n\t\n\tWhere Content Type is in the Executable Content\
  \ Types List"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000094
v4_id: 000094
name: Wildfire Signature Detected
description: A report that provides visibility into wildfire signature detections.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=pan_logs sourcetype=pan:threat (subtype="wildfire" OR subtype="wildfire-dns")

    | table _time, src_ip, dest_ip, user, threat_name, action, url, file_name, app

    '
  kql: |
    // Note: Palo Alto Networks firewall logs are typically ingested into CommonSecurityLog table in Sentinel
    // This query assumes PAN logs are being ingested via CEF/Syslog connector
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor == "Palo Alto Networks"
    | where DeviceEventClassID == "THREAT"
    | where AdditionalExtensions has "PanOSSubcategoryOfThreatLog=wildfire" or AdditionalExtensions has "PanOSSubcategoryOfThreatLog=wildfire-dns"
    | project TimeGenerated, DeviceVendor, DeviceProduct, DeviceEventClassID, Activity, SourceIP, DestinationIP, SourceUserName, ApplicationProtocol, DeviceAction, AdditionalExtensions, Message
  aql: |
    SELECT sourceip, destinationip, username, qidname(qid), CATEGORYNAME(category), eventtime, "Event SubType"
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%threat%'
      AND (logsourcetypename(devicetype) ILIKE '%palo alto%' OR LOGSOURCENAME(logsourceid) ILIKE '%palo alto%')
      AND ("Event SubType" = 'wildfire' OR "Event SubType" = 'wildfire-dns')
    LAST 24 HOURS
  yara_l: "rule palo_alto_wildfire_threat_detection {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Palo Alto WildFire\
    \ threat events indicating malicious file execution\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1204\"\n \
    \   severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.metadata.vendor_name = \"Palo Alto Networks\"\
    \n    $e.metadata.product_name = \"PAN-OS\"\n    (\n      $e.security_result.category_details = \"wildfire\" or\n      $e.security_result.category_details\
    \ = \"wildfire-dns\"\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = 75\n\
    \    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-panw.panos*\n| WHERE @timestamp > NOW() - 24 hours \n  AND panw.panos.type == \"THREAT\" \n  AND panw.panos.sub_type IN (\"\
    wildfire\", \"wildfire-dns\")\n| KEEP @timestamp, host.name, source.ip, destination.ip, panw.panos.sub_type, panw.panos.threat.name, panw.panos.action,\
    \ user.name, source.nat.ip, destination.nat.ip\n"
  leql: |
    where(source_json.subtype IN [wildfire, wildfire-dns])
  crowdstrike: |
    #type=PaloAlto threat_subtype IN [wildfire, wildfire-dns]
    | table([@timestamp, srcip, dstip, threat_name, threat_subtype, app, user, action])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter subtype in ("wildfire", "wildfire-dns")
    | fields _time, source_ip, dest_ip, app, threat_name, severity, action, host_name, src_user, dest_location_name
  lucene: |
    vendor_name:"Palo Alto Networks" AND event_type:"THREAT" AND subtype:(wildfire OR wildfire-dns)
  sumo: |
    _sourceCategory=*PaloAlto* (wildfire OR wildfire-dns)
    | parse regex "(?<subtype>wildfire-dns|wildfire)"
    | where subtype in ("wildfire", "wildfire-dns")
    | fields _messageTime, _sourceHost, subtype, *
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Palo Alto Threat Event \nWhere the Event SubType is in [wildfire, wildfire-dns]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000095
v4_id: 000095
name: Malware Detection Followed by Connection to Threat IP
description: Detects a malware event followed by a connection attempt to a known malicious IP.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Network
data_sources:
- Antivirus
- Firewall
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "(index=av OR index=antivirus OR index=firewall) \n| eval event_type=case(\n    match(source, \"(?i)(av|antivirus|malware)\"), \"malware\"\
    ,\n    match(source, \"(?i)firewall\"), \"firewall\",\n    1=1, \"other\"\n)\n| search event_type IN (\"malware\", \"firewall\")\n| eval src_ip=coalesce(src,\
    \ src_ip, source_ip, SourceIP)\n| eval dest_ip=coalesce(dest, dest_ip, destination_ip, DestinationIP)\n| eval direction=case(\n    match(src_ip,\
    \ \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[0-1])\\.|^192\\.168\\.\") AND NOT match(dest_ip, \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[0-1])\\.|^192\\.168\\\
    .\"), \"outbound\",\n    NOT match(src_ip, \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[0-1])\\.|^192\\.168\\.\") AND match(dest_ip, \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[0-1])\\\
    .|^192\\.168\\.\"), \"inbound\",\n    1=1, \"internal\"\n)\n| lookup threat_intel_list ip AS src_ip OUTPUT threat_score AS src_threat\n| lookup\
    \ threat_intel_list ip AS dest_ip OUTPUT threat_score AS dest_threat\n| eval is_threat_src=if(isnotnull(src_threat) AND src_threat>0, 1, 0)\n\
    | eval is_threat_dest=if(isnotnull(dest_threat) AND dest_threat>0, 1, 0)\n| transaction src_ip maxspan=15m keepevicted=true\n| search \"*malware*\"\
    \ AND \"*firewall*\"\n| eval has_malware=if(match(_raw, \"(?i)(malware|virus|trojan|av)\"), 1, 0)\n| eval has_firewall_inbound=if(event_type=\"\
    firewall\" AND direction=\"inbound\" AND is_threat_src=1, 1, 0)\n| eval has_firewall_outbound=if(event_type=\"firewall\" AND direction=\"\
    outbound\" AND is_threat_dest=1, 1, 0)\n| where has_malware=1 AND (has_firewall_inbound=1 OR has_firewall_outbound=1)\n| table _time, src_ip,\
    \ dest_ip, direction, event_type, src_threat, dest_threat\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exe_000095 {\n  meta:\n    author = \"TDL\"\n    description = \"Malware Detection Followed by Connection to Threat IP\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0002\"\n    technique = \"T1204\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Malware Detection Event\n\nFollowed By\n\n1 Firewall Event\nOR\n          From an external source to an internal destination\
  \ (Inbound)\n          Where the Source IP is on a Threat Intelligence List\n          Where the Destination IP is the Source IP in the previous\
  \ event\n\n          From an internal source to an external destination (Outbound)\n          Where the Destination IP is on a Threat Intelligence\
  \ List\n          With the same Source IP from the previous event\n\nWithin 15 minutes"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — pay attention to short-lived processes, encoded arguments, and unusual
  parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

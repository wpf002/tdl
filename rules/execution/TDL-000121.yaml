rule_id: TDL-EXE-000121
v4_id: '000121'
name: Scheduled Task Created - HVT
description: Detects a new scheduled task created on a HVT host. Attackers typically establish persistent access by creating a scheduled task
  to run code at regular intervals. This alert will be sent in a weekly report for the tuning period of 30 days until a baseline can be established.
tactic: Execution
tactic_id: TA0002
technique_id: T1053
technique_name: Scheduled Task/Job
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4698'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode IN (602, 4698)

    | where NOT like(SubjectUserName, "%$")

    | lookup high_value_targets.csv ComputerName OUTPUT is_hvt

    | where is_hvt="true"

    | table _time, ComputerName, SubjectUserName, TaskName, TaskContent

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (602, 4698)
    | where SubjectUserName !endswith "$"
    | where Computer in (_GetWatchlist('HighValueTargetHosts') | project Computer = SearchKey)
    | project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, TaskName, EventID, Activity
  aql: |
    SELECT eventtime, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS hostname, "Source Username", "Task Name", "Task Content"
    FROM events
    WHERE "EventID" IN ('602', '4698')
      AND "Source Username" NOT LIKE '%$'
      AND destinationip IN (SELECT destinationip FROM reference_set WHERE name = 'High_Value_Target_Host_List')
    LAST 24 HOURS
  yara_l: |
    rule scheduled_task_creation_hvt {
      meta:
        author = "TDL"
        description = "Detects scheduled task creation on high value targets"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1053"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "SETTING_CREATION"
        (
          $e.metadata.product_event_type = "602" or
          $e.metadata.product_event_type = "4698"
        )
        not re.regex($e.principal.user.userid, `\$$`)
        $e.target.hostname = $host

      match:
        $host over 5m

      condition:
        $e and #host > 0
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*
    | WHERE event.code IN ("602", "4698")
      AND NOT ENDS_WITH(user.name, "$")
    | EVAL is_hvt = CASE(
        host.name IN ("DC01", "DC02", "EXCH01", "EXCH02", "CA01", "FS01", "BACKUP01", "ADMIN01", "PKI01", "VAULT01"), 1,
        0
      )
    | WHERE is_hvt == 1
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_data.TaskName, winlog.event_data.TaskContent
  leql: |
    where(source_json.EventID IN [602, 4698] AND NOT source_user ENDS-WITH "$" AND asset IN high_value_hosts)
  crowdstrike: |
    EventCode IN [602, 4698]
    | NOT UserName=*$
    | groupBy([ComputerName, UserName, TaskName], function=count(as=task_created))
    | table([ComputerName, UserName, TaskName, task_created])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (602, 4698)
    | filter actor_effective_username != null and actor_effective_username !~= ".*\$$"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_evtlog_message, action_evtlog_event_data_TaskName
  lucene: |
    event.code:(602 OR 4698) AND NOT user.name:*$ AND host.name:(DC01 OR DC02 OR EXCHANGE01 OR FILESERVER01 OR SQLSERVER01)
  sumo: |
    _sourceCategory=*Windows* (EventID=602 OR EventID=4698)
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as source_user
    | json field=_raw "Computer" as dest_host
    | where event_id in ("602", "4698")
    | where !matches(source_user, "*$")
    | lookup high_value_targets on dest_host=hostname
    | where !isNull(high_value_targets)
    | fields _messageTime, dest_host, source_user, event_id, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Scheduled Task Created Event

  Where the Event ID is in [602, 4698]

  Where the Source Username does NOT end with "$"

  Where the Destination Hostname is on the High Value Target Host List'
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

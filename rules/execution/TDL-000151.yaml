rule_id: TDL-EXE-000151
v4_id: '000151'
name: Service Installation - HVT
description: Detects a new service installed on a HVT host. Attackers will commonly establish persistent access to a compromised host by installing
  a new service to run their code. HVT hosts should not typically have frequent service installations, so any instances should be considered suspicious.
  The alert will be sent as a report for the first 30 days then moved to an alert.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4697'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=601 OR EventCode=4697)

    NOT Account_Name="*$"

    | lookup hvt_hosts.csv ComputerName OUTPUT is_hvt

    | where is_hvt="true"

    | table _time, ComputerName, Account_Name, Service_Name, Service_File_Name, EventCode

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (601, 4697)
    | where AccountType != "Machine"
    | extend SourceUser = coalesce(SubjectUserName, Account)
    | where SourceUser !endswith "$"
    | where Computer in (_GetWatchlist('HighValueAssets') | project SearchKey)
    | project TimeGenerated, Computer, EventID, SourceUser, ServiceName = tostring(split(EventData, '<Data Name="ServiceName">')[1]), ServiceFileName = tostring(split(EventData, '<Data Name="ServiceFileName">')[1]), AccountDomain, Activity
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS destination_hostname, username AS source_username, "Service Name", "Service File Name", qidname(qid)
    FROM events
    WHERE "EventID" IN ('601', '4697')
      AND username NOT LIKE '%$'
      AND LOGSOURCENAME(logsourceid) IN (REFERENCESET('high_value_target_hosts'))
    LAST 24 HOURS
  yara_l: |
    rule windows_service_installed_on_hvt {
      meta:
        author = "TDL"
        description = "Detects Windows service installation on high value targets (T1569)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "SERVICE_INSTALLATION"
        (
          $e.metadata.product_event_type = "601" or
          $e.metadata.product_event_type = "4697"
        )
        not re.regex($e.principal.user.userid, `\$$`)
        $e.target.hostname = $host
        $e.target.asset.asset_id = $asset_id

      match:
        $host over 5m

      outcome:
        $risk_score = 75
        $service_name = array_distinct($e.target.resource.name)
        $user = array_distinct($e.principal.user.userid)

      condition:
        $e and $e.target.asset.category = "HIGH_VALUE_TARGET"
    }
  esql: |
    FROM logs-system.security*, logs-windows.system*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.code IN ("601", "4697")
      AND NOT user.name LIKE "*$"
      AND host.name IN ("DC01", "DC02", "FS01", "EXCH01", "SQL01", "ADMIN01")
    | STATS service_installs = COUNT(*) BY host.name, user.name, winlog.event_data.ServiceName, winlog.event_data.ImagePath, @timestamp
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ServiceName, winlog.event_data.ImagePath, service_installs
  leql: |
    where(source_json.EventID IN [601, 4697] AND source_user NOT ENDS-WITH "$" AND asset IN high_value_assets)
  crowdstrike: |
    EventCode IN [601, 4697]
    | SubjectUserName != "*$"
    | DestinationHostname IN file("high_value_targets.txt")
    | table([@timestamp, ComputerName, EventCode, SubjectUserName, ServiceName, ServiceFileName, DestinationHostname])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (601, 4697)
    | filter actor_effective_username != null and not actor_effective_username ~= "\$$"
    | filter agent_hostname in ("HVA-DC01", "HVA-DC02", "HVA-EXCH01", "HVA-SQL01", "HVA-FILE01", "HVA-WEB01")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_ServiceName, action_evtlog_event_data_ServiceFileName, action_evtlog_event_id
  lucene: |
    event.code:(601 OR 4697) AND NOT user.name:*$ AND tags:"high_value_target"
  sumo: |
    _sourceCategory=*Windows* (EventID="601" OR EventID="4697")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as dest_host
    | json field=_raw "SubjectUserName" as source_user
    | where event_id in ("601", "4697")
    | where !isEmpty(source_user) AND !(source_user matches "*$")
    | lookup type, threat_level from shared/high_value_targets on dest_host=hostname
    | where !isEmpty(type)
    | fields _messageTime, dest_host, source_user, event_id, type, threat_level
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Service Installed Event

  Where the Event ID is in [601, 4697]

  Where the Source Username does NOT end with "$"

  Where the Destination Hostname is on the High Value Target Host List'
suppression:
  window: 8 hours
  fields:
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

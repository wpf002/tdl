rule_id: TDL-EXE-000152
v4_id: '000152'
name: PSEXEC Detection
description: Detects an attacker pivoting internally using PSEXEC. PSEXEC is a common administrator tool used to remotely execute commands and
  manage systems. PSEXEC connects to the ADMIN$ share of an internal host and then immediately installs a windows service image. This rule is
  designed to detect this type of activity.
tactic: Execution
tactic_id: TA0002
technique_id: T1021
technique_name: Remote Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688, 5140, 4697'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=wineventlog (EventCode=4688 Image="*\\psexec.exe") OR (EventCode=5140 (Share_Name="\\\\*\\C$" OR Share_Name="\\\\*\\ADMIN$")) OR (EventCode=4697)
    | eval event_type=case(
        EventCode=4688 AND match(Image, "(?i)psexec\.exe$"), "psexec_execution",
        EventCode=5140 AND (match(Share_Name, "(?i)\\\\[^\\]+\\C\$") OR match(Share_Name, "(?i)\\\\[^\\]+\\ADMIN\$")), "share_access",
        EventCode=4697, "service_install",
        1=1, "other"
    )
    | eval src_dest_pair=coalesce(ComputerName, Computer).":".coalesce(IpAddress, src, dest, "-")
    | where event_type IN ("share_access", "service_install")
    | sort 0 _time
    | streamstats time_window=2m earliest(_time) as window_start latest(_time) as window_end by src_dest_pair
    | eventstats values(event_type) as event_types by src_dest_pair, window_start
    | eval has_share=if(mvfind(event_types, "share_access")>=0, 1, 0)
    | eval has_service=if(mvfind(event_types, "service_install")>=0, 1, 0)
    | where has_share=1 AND has_service=1 AND event_type="service_install"
    | table _time, ComputerName, src_dest_pair, Share_Name, Service_Name, Service_File_Name
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4688", "5140", "4697", "5145")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4688', '5140', '4697', '5145')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000152 {\n  meta:\n    author = \"TDL\"\n    description = \"PSEXEC Detection\"\n    severity = \"MEDIUM\"\n    tactic\
    \ = \"TA0002\"\n    technique = \"T1021\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4688|5140|4697|5145)/\n\
    \    $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4688", "5140", "4697", "5145")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4688, 5140, 4697, 5145])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4688, 5140, 4697, 5145)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4688", "5140", "4697", "5145")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4688 OR 5140 OR 4697 OR 5145)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4688", "5140", "4697", "5145")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is psexec.exe\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Network Share Object Accessed Event\nWhere the Event ID is in [5140, 5145]\nWhere the Share Name is in [\\\\*\\C$, \\\\*\\ADMIN$]\n\
  \t\nFollowed By\n\t\n1 Windows Service Installed Event\nWhere the Event ID is in [601, 4697]\nWithin the same Source and Destination in the\
  \ previous event\nWithin 2 minutes"
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000155
v4_id: '000155'
name: Malware Found with Registry Modification
description: This rule is designed to alert on Antivirus detections where a registry key such as the ‘Run’ or ‘RunOnce’ keys have been modified.
  This can occur where Antivirus is delayed in its detection and response.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Antivirus
- Windows OS (Workstation)
- 'Event IDs: 4657'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=symantec:ep:risk:file OR sourcetype=mcafee:epo:threat OR sourcetype=carbonblack OR sourcetype=crowdstrike* OR sourcetype=av:*)\
    \ \n| eval malware_time=_time, malware_host=coalesce(ComputerName, dest, host), malware_user=coalesce(user, User) \n| join type=inner malware_host\
    \ [\n  search index=* sourcetype=WinEventLog:Security EventCode=4657 \n  | eval registry_time=_time, registry_host=ComputerName, registry_user=SubjectUserName\
    \ \n  | rename malware_host as registry_host\n] \n| where (registry_time >= malware_time) AND (registry_time <= (malware_time + 900))\n| table\
    \ malware_time, registry_time, malware_host, malware_user, registry_user, Object_Name, Process_Name\n"
  kql: "let MalwareDetections = \n    SecurityAlert\n    | where TimeGenerated > ago(1h)\n    | where AlertType has_any (\"Malware\", \"Virus\"\
    , \"Trojan\", \"Backdoor\")\n    | extend MalwareTime = TimeGenerated, MalwareComputer = Computer, MalwareAlertName = AlertName\n    | project\
    \ MalwareTime, MalwareComputer, MalwareAlertName;\nlet RegistryMods = \n    SecurityEvent\n    | where TimeGenerated > ago(1h)\n    | where\
    \ EventID == 4657\n    | extend RegTime = TimeGenerated, RegComputer = Computer\n    | project RegTime, RegComputer, ObjectName, SubjectUserName,\
    \ Process;\nMalwareDetections\n| join kind=inner (RegistryMods) on $left.MalwareComputer == $right.RegComputer\n| where RegTime between (MalwareTime\
    \ .. (MalwareTime + 15m))\n| project MalwareTime, RegTime, Computer = MalwareComputer, MalwareAlertName, ObjectName, SubjectUserName, Process\n"
  aql: "SELECT \n    av.eventtime AS malware_time,\n    reg.eventtime AS registry_time,\n    av.sourceip,\n    av.username,\n    LOGSOURCENAME(av.logsourceid)\
    \ AS host,\n    av.qidname(av.qid) AS malware_event,\n    reg.\"Object Name\" AS registry_key,\n    reg.\"Object Value Name\" AS registry_value\n\
    FROM events av\nJOIN events reg ON av.sourceip = reg.sourceip\nWHERE av.category IN (6000, 6001, 6002, 6003, 6004, 6005, 6006, 6007, 6008,\
    \ 6009, 6010)\n    AND reg.\"EventID\" IN ('567', '4657')\n    AND reg.eventtime BETWEEN av.eventtime AND (av.eventtime + 900000)\nLAST 24\
    \ HOURS\n"
  yara_l: "rule malware_followed_by_registry_modification {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects malware\
    \ detection followed by registry modification within 15 minutes\"\n    mitre_tactic = \"Execution\"\n    mitre_technique = \"T1204\"\n   \
    \ \n  events:\n    $malware.metadata.event_type = \"SCAN_UNCATEGORIZED\"\n    $malware.security_result.detection_fields[\"malware_detected\"\
    ] != \"\"\n    $malware.principal.hostname = $host\n    \n    $registry.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    ($registry.metadata.product_event_type\
    \ = \"567\" or $registry.metadata.product_event_type = \"4657\")\n    $registry.principal.hostname = $host\n    $registry.metadata.event_timestamp.seconds\
    \ >= $malware.metadata.event_timestamp.seconds\n    \n  match:\n    $host over 15m\n    \n  condition:\n    $malware and $registry\n}\n"
  esql: "FROM logs-windows.security*, logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hours\n| EVAL event_type = CASE(\n\
    \    event.code == \"4657\" OR winlog.event_id == 4657, \"registry_mod\",\n    event.category == \"malware\" OR event.type == \"malware\"\
    , \"malware\",\n    \"other\"\n  )\n| WHERE event_type IN (\"malware\", \"registry_mod\")\n| SORT @timestamp ASC\n| STATS \n    malware_time\
    \ = MIN(CASE(event_type == \"malware\", @timestamp, null)),\n    registry_time = MIN(CASE(event_type == \"registry_mod\", @timestamp, null)),\n\
    \    malware_count = COUNT(CASE(event_type == \"malware\", 1, null)),\n    registry_count = COUNT(CASE(event_type == \"registry_mod\", 1,\
    \ null))\n  BY host.name, user.name, bucket = BUCKET(@timestamp, 15 minutes)\n| WHERE malware_count >= 1 AND registry_count >= 1 AND registry_time\
    \ > malware_time AND (registry_time - malware_time) <= 900000000000\n| KEEP host.name, user.name, bucket, malware_time, registry_time, malware_count,\
    \ registry_count\n"
  leql: |
    where(source_json.EventID IN [567, 4657]) groupby(asset, user) calculate(count)
  crowdstrike: |
    #event_simpleName=DetectionSummaryEvent OR EventCode IN [567, 4657]
    | case {
        #event_simpleName=DetectionSummaryEvent | detection_time := @timestamp | ComputerName=* | aid_detection := aid ;
        EventCode IN [567, 4657] | registry_time := @timestamp | ComputerName=* | aid_registry := aid ;
        * | drop();
      }
    | aid := coalesce([aid_detection, aid_registry])
    | selfJoinFilter([aid], where=[{detection_time := *}, {registry_time := *}])
    | time_diff := registry_time - detection_time
    | time_diff >= 0 AND time_diff <= 900000
    | groupBy([aid, detection_time], function=([selectLast(registry_time, as=last_registry_time)]))
    | table([aid, detection_time, last_registry_time, time_diff])
  xql: |
    dataset = xdr_data
    | filter event_type in (ENUM.EVENT_TYPE_THREAT_DETECTION, ENUM.EVENT_TYPE_REGISTRY)
    | alter is_malware = if(event_type = ENUM.EVENT_TYPE_THREAT_DETECTION, 1, 0),
            is_registry = if(event_type = ENUM.EVENT_TYPE_REGISTRY and action_evtlog_event_id in (567, 4657), 1, 0)
    | bin _time span=15m
    | comp sum(is_malware) as malware_count, sum(is_registry) as registry_count by _time, agent_hostname
    | filter malware_count >= 1 and registry_count >= 1
  lucene: |
    event.code:(567 OR 4657) AND _exists_:antivirus.detection
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Antivirus*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Computer" as computer
    | json field=_raw "TimeCreated" as event_time
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "ObjectName" as registry_path
    | where (event_id in ("567", "4657") OR _raw matches "*malware*" OR _raw matches "*virus*" OR _raw matches "*threat*")
    | if(event_id in ("567", "4657"), "registry", "malware") as event_type
    | sort by computer, event_time asc
    | transpose row computer column event_type as *
    | where !isNull(malware) and !isNull(registry)
    | where (registry_time - malware_time) / 1000 / 60 <= 15 and (registry_time - malware_time) >= 0
    | fields computer, malware_time, registry_time
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Malware Detection Event


  Followed By


  1 Windows Registry Modified Event

  Where the Event ID is in [567, 4657]

  Within 15 minutes'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the registry hive, key path, value name, and writing process — pay attention to short-lived processes, encoded arguments, and unusual
  parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

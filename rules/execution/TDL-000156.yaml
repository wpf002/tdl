rule_id: TDL-EXE-000156
v4_id: '000156'
name: Traffic To Unauthorized P2P Application
description: This rule is designed to identify the usage of unauthorized peer-to-peer applications to detect possible exfiltration attempts.
tactic: Execution
tactic_id: TA0002
technique_id: T1021
technique_name: Remote Services
platform:
- Windows
data_sources:
- Application Control
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=* sourcetype=*application*control* OR sourcetype=*applocker* OR sourcetype=*firewall* Application_Category="P2P" NOT [| inputlookup
    authorized_p2p_apps.csv | fields Application]

    | table _time, host, Application, Application_Category, user, src, dest, action

    '
  kql: |
    AppControlEvents
    | where TimeGenerated > ago(24h)
    | where ApplicationCategory == "P2P"
    | where Application !in~ ("AuthorizedP2PApp1", "AuthorizedP2PApp2", "AuthorizedP2PApp3")
    | project TimeGenerated, DeviceName, Application, ApplicationCategory, UserName, FileName, FolderPath, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine
  aql: |
    SELECT sourceip, destinationip, destinationport, username, QIDNAME(qid) AS event_name, CATEGORYNAME(category) AS category_name, "Application Name", "Application Category", COUNT(*) AS event_count
    FROM events
    WHERE "Application Category" = 'P2P'
      AND "Application Name" NOT IN ('Authorized_P2P_App1', 'Authorized_P2P_App2', 'Authorized_P2P_App3')
    GROUP BY sourceip, destinationip, destinationport, username, qid, category, "Application Name", "Application Category"
    LAST 24 HOURS
  yara_l: |
    rule p2p_application_unauthorized_execution {
      meta:
        author = "Chronicle Detection Engineering"
        description = "Detects execution of unauthorized P2P applications via Application Control events - MITRE T1021 Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1021"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.target.application = "P2P"
        not (
          $e.principal.process.file.full_path = "C:\\Program Files\\AuthorizedP2P\\app.exe" or
          $e.principal.process.file.full_path = "C:\\Program Files\\Teams\\app.exe" or
          $e.principal.process.file.full_path = "C:\\Program Files\\Zoom\\app.exe" or
          $e.principal.process.file.full_path = "C:\\Program Files\\Webex\\app.exe"
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-endpoint.events.file*, logs-windows.applocker*, logs-endpoint.events.network*\n| WHERE @timestamp > NOW() - 24 hours \n  AND\
    \ event.category == \"network\" \n  AND network.application.category == \"P2P\"\n  AND network.application.name NOT IN (\"BitTorrent Sync\"\
    , \"Resilio Sync\", \"Syncthing\")\n| STATS event_count = COUNT(*) BY host.name, user.name, network.application.name, source.ip, destination.ip\n\
    | WHERE event_count >= 1\n| KEEP @timestamp, host.name, user.name, network.application.name, network.application.category, source.ip, destination.ip,\
    \ event_count\n"
  leql: |
    where(source_json.ApplicationCategory="P2P" AND source_json.Application NOT IN ["BitTorrent", "uTorrent", "qBittorrent", "Transmission", "Vuze", "Deluge", "FrostWire"])
  crowdstrike: |
    event_simpleName=ApplicationControl* ApplicationCategory=P2P
    | NOT (Application IN [
        "Zoom",
        "Microsoft Teams",
        "Skype",
        "WebEx",
        "Slack",
        "Discord"
    ])
    | table([@timestamp, ComputerName, UserName, Application, ApplicationCategory, FileName, FilePath, SHA256HashData])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter app_category = "peer-to-peer"
    | filter app not in ("authorized-bittorrent", "authorized-skype", "authorized-zoom")
    | fields _time, source_ip, destination_ip, source_user, app, app_category, action, bytes_sent, bytes_received, device_name
  lucene: |
    event.category:"application_control" AND application.category:"P2P" AND NOT application.name:("AuthorizedP2PApp1" OR "AuthorizedP2PApp2" OR "AuthorizedP2PApp3")
  sumo: |
    _sourceCategory=*Application*Control* OR _sourceCategory=*AppControl*
    | json field=_raw "ApplicationCategory" as app_category
    | json field=_raw "Application" as application
    | where app_category = "P2P"
    | where !(application in ("BitTorrent Sync", "Resilio Sync", "Syncthing"))
    | fields _messageTime, _sourceHost, application, app_category
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Application Control Event

  Where the Application Category is "P2P"

  Where the Application is NOT on the Authorized P2P Applications List'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

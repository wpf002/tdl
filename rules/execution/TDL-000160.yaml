rule_id: TDL-EXE-000160
v4_id: '000160'
name: Executable File Downloaded from Punycode URL
description: Detects when an executable file is downloaded from a punycode URL. Punycode is an encoding that converts Unicode characters into
  ASCII and browsers will automatically convert the punycode URL into Unicode. Attackers can exploit this for their purposes by registering a
  punycode domain that, when decoded, appears similar to a legitimate domain.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Forward Proxy
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=proxy OR index=web (url="*xn--*" OR dest="*xn--*") OR (file_name IN ("*.exe","*.dll","*.scr","*.bat","*.cmd","*.vbs","*.js","*.jar","*.ps1","*.msi","*.app","*.deb","*.rpm")
    AND http_content_type IN ("application/x-msdownload","application/x-msdos-program","application/octet-stream","application/exe","application/x-exe","application/dos-exe","application/x-winexe","application/msdos-windows","application/x-msi","application/x-ms-installer"))

    | table _time, src, dest, url, file_name, http_content_type, user, action

    '
  kql: |
    let ExecutableExtensions = dynamic([".exe", ".dll", ".bat", ".cmd", ".ps1", ".vbs", ".js", ".jar", ".msi", ".scr", ".com", ".pif"]);
    let ExecutableContentTypes = dynamic(["application/x-msdownload", "application/x-msdos-program", "application/octet-stream", "application/exe", "application/x-exe", "application/dos-exe", "application/x-winexe", "application/msdos-windows", "application/x-msi", "application/x-ms-installer"]);
    CommonSecurityLog
    | where TimeGenerated > ago(1h)
    | where DeviceVendor has "Proxy" or DeviceProduct has "Proxy" or Activity has "download" or Activity has "allowed"
    | where RequestURL has "xn--"
        or (extract(@"\.([^\./?]+)(?:\?|$)", 1, RequestURL) in~ (ExecutableExtensions))
        or (RequestContext has_any (ExecutableContentTypes))
    | project TimeGenerated, SourceIP, SourceUserName, DestinationHostName, RequestURL, RequestContext, DeviceAction, DeviceVendor, DeviceProduct
  aql: |
    SELECT sourceip, destinationip, username, url, "File Extension", "Content Type", COUNT(*) AS event_count
    FROM events
    WHERE (url ILIKE '%xn--%' OR "File Extension" IN ('exe','dll','bat','cmd','ps1','vbs','js','jar','msi','scr','com','pif') OR "Content Type" IN ('application/x-msdownload','application/x-msdos-program','application/x-executable','application/x-dosexec','application/octet-stream','application/x-bat','application/x-sh','application/x-java-archive'))
    AND category IN (SELECT category FROM categories WHERE name ILIKE '%proxy%' OR name ILIKE '%web%')
    GROUP BY sourceip, destinationip, username, url, "File Extension", "Content Type"
    LAST 1 HOURS
  yara_l: "rule malicious_execution_via_forward_proxy {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects potential malicious\
    \ execution via forward proxy with IDN domains or executable downloads\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1204\"\n    severity = \"Medium\"\n    \n  events:\n    $proxy.metadata.event_type = \"NETWORK_HTTP\"\n    (\n      re.regex($proxy.network.http.parsed_user_agent,\
    \ \".*\") or\n      $proxy.target.url != \"\"\n    )\n    (\n      re.regex($proxy.target.url, `xn--`) or\n      (\n        (\n          re.regex($proxy.target.file.mime_type,\
    \ `(?i)(application/x-msdownload|application/x-msdos-program|application/x-dosexec|application/octet-stream|application/exe|application/x-exe|application/x-winexe|application/msdos-windows|application/x-msi|application/x-ms-installer)`)\
    \ or\n          re.regex($proxy.network.http.response_headers, `(?i)content-type:\\s*(application/x-msdownload|application/x-msdos-program|application/x-dosexec|application/octet-stream|application/exe|application/x-exe|application/x-winexe|application/msdos-windows|application/x-msi|application/x-ms-installer)`)\n\
    \        )\n        and\n        (\n          re.regex($proxy.target.url, `(?i)\\.(exe|dll|bat|cmd|com|scr|vbs|js|jar|ps1|msi|hta|cpl|pif|vbe|wsf|gadget|application)(\\\
    ?|$)`) or\n          re.regex($proxy.target.file.full_path, `(?i)\\.(exe|dll|bat|cmd|com|scr|vbs|js|jar|ps1|msi|hta|cpl|pif|vbe|wsf|gadget|application)$`)\n\
    \        )\n      )\n    )\n    $proxy.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $proxy\n}\n"
  esql: |
    FROM logs-network.proxy*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        url.domain LIKE "*xn--*"
        OR (
          url.extension IN ("exe", "dll", "bat", "cmd", "ps1", "vbs", "js", "jar", "msi", "scr", "com", "pif", "hta")
          AND http.response.mime_type IN ("application/x-msdownload", "application/x-msdos-program", "application/x-executable", "application/octet-stream", "application/exe", "application/x-exe", "application/dos-exe", "application/x-dosexec", "application/x-winexe", "application/msdos-windows", "application/x-zip-compressed", "application/zip")
        )
      )
    | KEEP @timestamp, host.name, user.name, url.domain, url.full, url.extension, http.response.mime_type, source.ip, destination.ip
  leql: |
    where((destination_domain ICONTAINS "xn--") OR (file_extension IN [exe, dll, msi, bat, cmd, ps1, vbs, js, jar, scr, com, pif] AND content_type IN [application/x-msdownload, application/x-msdos-program, application/x-exe, application/x-executable, application/exe, application/octet-stream, application/x-bat, application/x-sh, application/x-java-archive]))
  crowdstrike: |
    #type=proxy (domain=*xn--* OR (file_extension IN [exe, dll, msi, bat, cmd, ps1, vbs, js, jar, scr, com, pif] AND content_type IN ["application/x-msdownload", "application/x-msdos-program", "application/x-executable", "application/octet-stream", "application/exe", "application/x-exe", "application/dos-exe", "application/x-winexe", "application/msdos-windows", "application/x-zip-compressed", "application/java-archive"]))
    | table([@timestamp, domain, url, file_extension, content_type, src_ip, dst_ip, user])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter app_category = "proxy" or app_subcategory = "web-proxy"
    | filter (url ~= ".*xn--.*" or (file_name != null and (file_name ~= ".*\\.exe$" or file_name ~= ".*\\.dll$" or file_name ~= ".*\\.bat$" or file_name ~= ".*\\.cmd$" or file_name ~= ".*\\.vbs$" or file_name ~= ".*\\.ps1$" or file_name ~= ".*\\.scr$" or file_name ~= ".*\\.msi$" or file_name ~= ".*\\.com$") and (http_content_type contains "application/x-msdownload" or http_content_type contains "application/x-msdos-program" or http_content_type contains "application/x-executable" or http_content_type contains "application/octet-stream" or http_content_type contains "application/x-dosexec")))
    | fields _time, src_ip, dst_ip, url, file_name, http_content_type, user
  lucene: |
    (domain:*xn--* OR (file_extension:(exe dll bat cmd ps1 vbs js jar msi scr com pif) AND content_type:("application/x-msdownload" "application/x-msdos-program" "application/x-executable" "application/x-dosexec" "application/octet-stream" "application/x-bat" "application/x-sh" "application/x-java-archive")))
  sumo: "_sourceCategory=*Proxy* OR _sourceCategory=*Forward*Proxy*\n| parse regex \"(?<domain>[a-zA-Z0-9\\-\\.]+)\" nodrop\n| parse regex \"\
    (?<url>https?://[^\\s]+)\" nodrop\n| parse regex \"\\.(?<file_ext>[a-zA-Z0-9]{2,4})(?:\\?|$|\\s)\" nodrop\n| parse regex \"Content-Type:\\\
    s*(?<content_type>[^\\s;]+)\" nodrop\n| where domain matches \"*xn--*\" \n    OR (file_ext in (\"exe\",\"dll\",\"bat\",\"cmd\",\"ps1\",\"\
    vbs\",\"js\",\"jar\",\"msi\",\"scr\",\"com\",\"pif\",\"hta\",\"wsf\",\"lnk\") \n        AND content_type in (\"application/x-msdownload\"\
    ,\"application/x-msdos-program\",\"application/x-executable\",\"application/octet-stream\",\"application/x-dosexec\",\"application/x-bat\"\
    ,\"application/x-sh\"))\n| fields _messageTime, _sourceHost, domain, url, file_ext, content_type\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Forward Proxy Event\nWhere the domain contains \"xn--\"\nOR\n\tWhere the File Extension is in the Executable File Extensions\
  \ List\n\t\n\tWhere Content Type is in the Executable Content Types List"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000169
v4_id: 000169
name: Suspicious File Execution
description: Detects suspicious file execution by wscript and cscript. Attackers can utilize these to execute hidden files/scripts that lead to
  the compromise of assets.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=592 OR EventCode=4688) (ParentImage="*\\cscript.exe" OR ParentImage="*\\wscript.exe"
    OR Parent_Process_Name="*\\cscript.exe" OR Parent_Process_Name="*\\wscript.exe")

    | table _time, ComputerName, EventCode, ParentImage, Parent_Process_Name, Image, Process_Name, CommandLine, User

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where ParentProcessName has_any ("cscript.exe", "wscript.exe")
    | project TimeGenerated, Computer, Account, EventID, Process, CommandLine, ParentProcessName, SubjectUserName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Parent Process Name", "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND ("Parent Process Name" ILIKE '%cscript.exe' OR "Parent Process Name" ILIKE '%wscript.exe')
    LAST 24 HOURS
  yara_l: "rule mitre_t1204_script_host_execution {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects process execution\
    \ via Windows script hosts (cscript.exe, wscript.exe) - MITRE T1204\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1204\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n\
    \      $e.metadata.product_event_type = \"4688\"\n    )\n    (\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\cscript\\.exe$`)\
    \ or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\wscript\\.exe$`)\n    )\n    $e.principal.hostname = $host\n    \n  match:\n\
    \    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE event.code IN ("592", "4688") AND TO_LOWER(process.parent.name) IN ("cscript.exe", "wscript.exe")
    | KEEP @timestamp, host.name, user.name, process.parent.name, process.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND parent_process_name IN [cscript.exe, wscript.exe])
  crowdstrike: |
    EventCode IN [592, 4688] ParentProcessName IN [cscript.exe, wscript.exe]
    | table([@timestamp, ComputerName, EventCode, ParentProcessName, ProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
      and lowercase(actor_process_image_name) in ("cscript.exe", "wscript.exe")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.parent.name:(cscript.exe OR wscript.exe)
  sumo: |
    _sourceCategory=*Windows* (EventID=592 OR EventID=4688)
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | where event_id in ("592", "4688")
    | where parent_process matches "*cscript.exe" OR parent_process matches "*wscript.exe"
    | fields _messageTime, _sourceHost, event_id, parent_process
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Parent Process Name is in [cscript.exe, wscript.exe]"
suppression:
  window: 24 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

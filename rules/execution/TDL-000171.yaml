rule_id: TDL-EXE-000171
v4_id: '000171'
name: MS Office Spawning Command Line Tools
description: Detects an embedded Microsoft Office application macro attempting to spawn command line tools such as cmd.exe or powershell.exe.
  In recent years, attackers have been embedding macros in Office applications to run these command line tools to compromise the host.
tactic: Execution
tactic_id: TA0002
technique_id: T1202
technique_name: Indirect Command Execution
platform:
- Windows
data_sources:
- Windows Operating System
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=windows (EventCode=592 OR EventCode=4688) \n(ParentImage=\"*\\\\winword.exe\" OR ParentImage=\"*\\\\excel.exe\" OR ParentImage=\"\
    *\\\\powerpnt.exe\" OR ParentImage=\"*\\\\msaccess.exe\" OR ParentImage=\"*\\\\outlook.exe\" OR ParentImage=\"*\\\\visio.exe\" OR ParentImage=\"\
    *\\\\winproj.exe\")\nImage=\"*\\\\cmd.exe\"\n| table _time, ComputerName, User, ParentImage, Image, CommandLine\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where ParentProcessName has_any ("winword.exe", "excel.exe", "powerpnt.exe", "msaccess.exe", "outlook.exe", "visio.exe", "winproj.exe")
    | where Process endswith "cmd.exe"
    | project TimeGenerated, Computer, Account, ParentProcessName, Process, CommandLine, EventID
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Parent Process Name", "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Parent Process Name" IN ('winword.exe', 'excel.exe', 'powerpnt.exe', 'msaccess.exe', 'outlook.exe', 'visio.exe', 'winproj.exe')
      AND "Process Name" = 'cmd.exe'
    LAST 24 HOURS
  yara_l: |
    rule office_spawn_cmd_t1202 {
      meta:
        author = "TDL"
        description = "Detects Microsoft Office applications spawning cmd.exe (T1202 Indirect Command Execution)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1202"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.principal.process.file.full_path, `(?i)\\(winword|excel|powerpnt|msaccess|outlook|visio|winproj)\.exe$`)
        re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*\n| WHERE event.code IN (\"\
    592\", \"4688\") \n  AND TO_LOWER(process.parent.name) IN (\"winword.exe\", \"excel.exe\", \"powerpnt.exe\", \"msaccess.exe\", \"outlook.exe\"\
    , \"visio.exe\", \"winproj.exe\")\n  AND TO_LOWER(process.name) == \"cmd.exe\"\n| KEEP @timestamp, host.name, user.name, process.parent.name,\
    \ process.name, process.command_line, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND parent_process_name IN ["winword.exe", "excel.exe", "powerpnt.exe", "msaccess.exe", "outlook.exe", "visio.exe", "winproj.exe"] AND process_name="cmd.exe")
  crowdstrike: |
    EventCode IN [592, 4688] ParentImage IN [*winword.exe, *excel.exe, *powerpnt.exe, *msaccess.exe, *outlook.exe, *visio.exe, *winproj.exe] Image=*cmd.exe
    | table([@timestamp, ComputerName, ParentImage, Image, CommandLine, User])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(actor_process_image_name) in ("winword.exe", "excel.exe", "powerpnt.exe", "msaccess.exe", "outlook.exe", "visio.exe", "winproj.exe")
    | filter lowercase(action_process_image_name) = "cmd.exe"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.parent.name:(winword.exe OR excel.exe OR powerpnt.exe OR msaccess.exe OR outlook.exe OR visio.exe OR winproj.exe) AND process.name:cmd.exe
  sumo: |
    _sourceCategory=*Windows* (EventID=592 OR EventID=4688)
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ProcessName" as process_name_alt
    | where event_id in ("592", "4688")
    | where (parent_process matches "*winword.exe" OR parent_process matches "*excel.exe" OR parent_process matches "*powerpnt.exe" OR parent_process matches "*msaccess.exe" OR parent_process matches "*outlook.exe" OR parent_process matches "*visio.exe" OR parent_process matches "*winproj.exe")
    | where (process_name matches "*cmd.exe" OR process_name_alt matches "*cmd.exe")
    | fields _messageTime, _sourceHost, event_id, parent_process, process_name, process_name_alt
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Parent Process Name is in [winword.exe, excel.exe,\
  \ powerpnt.exe, msaccess.exe, outlook.exe, visio.exe, winproj.exe]\nWhere the Process Name is cmd.exe"
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000172
v4_id: '000172'
name: Browser Spawning Command Line Tools
description: Detects a browser attempting to spawn command line tools such as cmd.exe or powershell.exe. In recent years, attackers have compromised
  websites to exploit browsers in which command line tools are used to download files to assist in compromising the host.
tactic: Execution
tactic_id: TA0002
technique_id: T1202
technique_name: Indirect Command Execution
platform:
- Windows
data_sources:
- Windows Operating System (Windows 10/2016)
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) (ParentProcessName="*\\firefox.exe" OR ParentProcessName="*\\chrome.exe" OR ParentProcessName="*\\microsoftedge.exe"
    OR ParentProcessName="*\\safari.exe" OR ParentProcessName="*\\opera.exe" OR ParentProcessName="*\\iexplore.exe" OR ParentProcessName="*\\vivaldi.exe"
    OR ParentProcessName="*\\brave.exe") ProcessName="*\\cmd.exe"

    | table _time, ComputerName, User, ParentProcessName, ProcessName, CommandLine

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where ParentProcessName has_any ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe", "vivaldi.exe", "brave.exe")
    | where Process has "cmd.exe"
    | project TimeGenerated, Computer, Account, ParentProcessName, Process, CommandLine, NewProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Parent Process Name", "Process Name", "Process CommandLine", COUNT(*) AS executions
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Parent Process Name" IN ('firefox.exe', 'chrome.exe', 'microsoftedge.exe', 'safari.exe', 'opera.exe', 'iexplore.exe', 'vivaldi.exe', 'brave.exe')
      AND "Process Name" = 'cmd.exe'
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), username, "Parent Process Name", "Process Name", "Process CommandLine"
    LAST 1 HOURS
  yara_l: |
    rule browser_spawning_cmd {
      meta:
        author = "TDL"
        description = "Detects browsers spawning cmd.exe - T1202 Indirect Command Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1202"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.principal.process.file.full_path, `(?i)(firefox|chrome|microsoftedge|safari|opera|iexplore|vivaldi|brave)\.exe$`)
        re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.security*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND TO_LOWER(process.parent.name)\
    \ IN (\"firefox.exe\", \"chrome.exe\", \"microsoftedge.exe\", \"safari.exe\", \"opera.exe\", \"iexplore.exe\", \"vivaldi.exe\", \"brave.exe\"\
    )\n  AND TO_LOWER(process.name) == \"cmd.exe\"\n| KEEP @timestamp, host.name, user.name, process.parent.name, process.name, process.command_line,\
    \ process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND parent_process_name IN [firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe] AND process_name=cmd.exe)
  crowdstrike: |
    EventCode=4688 ParentProcessName IN [firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe] NewProcessName=*cmd.exe
    | table([@timestamp, ComputerName, SubjectUserName, ParentProcessName, NewProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(actor_process_image_name) in ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe", "vivaldi.exe", "brave.exe")
    | filter lowercase(action_process_image_name) = "cmd.exe"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.parent.name:(firefox.exe OR chrome.exe OR microsoftedge.exe OR safari.exe OR opera.exe OR iexplore.exe OR vivaldi.exe OR brave.exe) AND process.name:cmd.exe
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "NewProcessName" as process_name
    | where event_id in ("4688", "592")
    | where (parent_process matches "*firefox.exe" OR parent_process matches "*chrome.exe" OR parent_process matches "*microsoftedge.exe" OR parent_process matches "*safari.exe" OR parent_process matches "*opera.exe" OR parent_process matches "*iexplore.exe" OR parent_process matches "*vivaldi.exe" OR parent_process matches "*brave.exe")
    | where process_name matches "*cmd.exe"
    | fields _messageTime, _sourceHost, event_id, parent_process, process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Parent Process Name is in [firefox.exe, chrome.exe,\
  \ microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe]\nWhere the Process Name is cmd.exe"
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000187
v4_id: 000187
name: Unauthorized Powershell
description: PowerShell is typically used for administrative activities and is not used by regular users. Any PowerShell usage on hosts that are
  not authorized is suspicious and may indicate an attacker attempting to compromise a machine and running malicious scripts.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=592 OR EventCode=4688) New_Process_Name="*\\powershell.exe"

    | table _time, ComputerName, Account_Name, New_Process_Name, Process_Command_Line, Creator_Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1d)
    | where EventID in (592, 4688)
    | where Process has "powershell.exe"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName, EventID
  aql: |
    SELECT eventtime, sourceip, username, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%powershell.exe%'
    LAST 24 HOURS
  yara_l: "rule powershell_execution_t1059 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects PowerShell execution via Windows process\
    \ creation events\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1059\"\n    \n  events:\n    $e.metadata.event_type\
    \ = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n      $e.metadata.product_event_type = \"4688\"\n    )\n\
    \    re.regex($e.target.process.file.full_path, `(?i)\\\\powershell\\.exe$`)\n    $e.principal.hostname = $host\n    \n  match:\n    $host\
    \ over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688") AND TO_LOWER(process.name) LIKE "*powershell.exe*"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe")
  crowdstrike: |
    EventCode=4688 NewProcessName=*powershell.exe
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, CommandLine, ParentProcessName])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688)\n  and (lowercase(action_process_image_name) contains \"powershell.exe\"\
    \ \n       or lowercase(actor_process_image_name) contains \"powershell.exe\")\n| fields _time, agent_hostname, actor_effective_username,\
    \ action_process_image_name, actor_process_image_name, action_process_image_command_line, action_evtlog_event_id\n"
  lucene: |
    event.code:(592 OR 4688) AND process.name:*powershell.exe
  sumo: |
    _sourceCategory=*Windows* (powershell.exe OR "powershell.exe")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ProcessName" as process_name_alt
    | where event_id in ("592", "4688")
    | where process_name matches "*powershell.exe" OR process_name_alt matches "*powershell.exe"
    | fields _messageTime, _sourceHost, event_id, process_name, process_name_alt
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

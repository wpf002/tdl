rule_id: TDL-EXE-000200
v4_id: '000200'
name: Abnormal LSASS Parent Child Relationship
description: Detects potential lsass.exe abuse based on unusual and suspicious parent-child relationships. Lsass doesn’t typically spawn additional
  processes. This also detects suspicious parent processes of lsass, which may indicate LSASS memory access attempts.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=windows EventCode=4688 \n| eval Parent_Process_Name=lower(coalesce(Parent_Process_Name, ParentProcessName, Creator_Process_Name))\n\
    | eval Process_Name=lower(coalesce(Process_Name, NewProcessName, Process))\n| eval parent_basename=mvindex(split(Parent_Process_Name, \"\\\
    \\\"), -1)\n| eval process_basename=mvindex(split(Process_Name, \"\\\\\"), -1)\n| where (parent_basename=\"lsass.exe\" AND (process_basename=\"\
    cmd.exe\" OR process_basename=\"powershel.exe\" OR process_basename=\"regsvr32.exe\" OR process_basename=\"mstsc.exe\" OR process_basename=\"\
    dllhost.exe\"))\n    OR (process_basename=\"lsass.exe\" AND (parent_basename=\"explorer.exe\" OR parent_basename=\"cmd.exe\" OR parent_basename=\"\
    lsass.exe\"))\n| table _time, ComputerName, parent_basename, process_basename, Process_Name, Parent_Process_Name, Account_Name\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where (ParentProcessName endswith "\\lsass.exe" and Process has_any ("cmd.exe", "powershel.exe", "regsvr32.exe", "mstsc.exe", "dllhost.exe"))
        or (Process endswith "\\lsass.exe" and ParentProcessName has_any ("explorer.exe", "cmd.exe", "lsass.exe"))
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, NewProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Parent Process Name", "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND (
        ("Parent Process Name" ILIKE '%lsass.exe' AND "Process Name" IN ('%cmd.exe', '%powershel.exe', '%regsvr32.exe', '%mstsc.exe', '%dllhost.exe'))
        OR
        ("Process Name" ILIKE '%lsass.exe' AND "Parent Process Name" IN ('%explorer.exe', '%cmd.exe', '%lsass.exe'))
      )
    LAST 1 HOURS
  yara_l: |
    rule mitre_t1569_suspicious_lsass_child_processes {
      meta:
        author = "TDL"
        description = "Detects suspicious child processes spawned from lsass.exe or lsass.exe spawned from unusual parent processes"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "High"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "4688" or
          $e.metadata.product_event_type = "592"
        )
        (
          (
            re.regex($e.principal.process.file.full_path, `(?i)\\lsass\.exe$`) and
            (
              re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`) or
              re.regex($e.target.process.file.full_path, `(?i)\\powershel\.exe$`) or
              re.regex($e.target.process.file.full_path, `(?i)\\regsvr32\.exe$`) or
              re.regex($e.target.process.file.full_path, `(?i)\\mstsc\.exe$`) or
              re.regex($e.target.process.file.full_path, `(?i)\\dllhost\.exe$`)
            )
          ) or
          (
            re.regex($e.target.process.file.full_path, `(?i)\\lsass\.exe$`) and
            (
              re.regex($e.principal.process.file.full_path, `(?i)\\explorer\.exe$`) or
              re.regex($e.principal.process.file.full_path, `(?i)\\cmd\.exe$`) or
              re.regex($e.principal.process.file.full_path, `(?i)\\lsass\.exe$`)
            )
          )
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour
      AND event.code IN ("592", "4688")
      AND (
        (process.parent.name == "lsass.exe" AND process.name IN ("cmd.exe", "powershel.exe", "regsvr32.exe", "mstsc.exe", "dllhost.exe"))
        OR (process.name == "lsass.exe" AND process.parent.name IN ("explorer.exe", "cmd.exe", "lsass.exe"))
      )
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND ((parent_process_name="lsass.exe" AND process_name IN ["cmd.exe", "powershel.exe", "regsvr32.exe", "mstsc.exe", "dllhost.exe"]) OR (process_name="lsass.exe" AND parent_process_name IN ["explorer.exe", "cmd.exe", "lsass.exe"])))
  crowdstrike: |
    EventCode=4688
    | case {
        ParentBaseFileName=/^lsass\.exe$/i AND FileName IN [/^cmd\.exe$/i, /^powershel\.exe$/i, /^regsvr32\.exe$/i, /^mstsc\.exe$/i, /^dllhost\.exe$/i] | suspicious_reason := "lsass spawned suspicious process";
        FileName=/^lsass\.exe$/i AND ParentBaseFileName IN [/^explorer\.exe$/i, /^cmd\.exe$/i, /^lsass\.exe$/i] | suspicious_reason := "lsass spawned by unusual parent";
        * | suspicious_reason := null;
      }
    | suspicious_reason != null
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, FileName, CommandLine, suspicious_reason])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688)\n| filter (lowercase(actor_process_image_name) contains \"lsass.exe\"\
    \ \n          and (lowercase(action_process_image_name) contains \"cmd.exe\" \n               or lowercase(action_process_image_name) contains\
    \ \"powershel.exe\" \n               or lowercase(action_process_image_name) contains \"regsvr32.exe\" \n               or lowercase(action_process_image_name)\
    \ contains \"mstsc.exe\" \n               or lowercase(action_process_image_name) contains \"dllhost.exe\"))\n        or (lowercase(action_process_image_name)\
    \ contains \"lsass.exe\" \n            and (lowercase(actor_process_image_name) contains \"explorer.exe\" \n                 or lowercase(actor_process_image_name)\
    \ contains \"cmd.exe\" \n                 or lowercase(actor_process_image_name) contains \"lsass.exe\"))\n| fields _time, agent_hostname,\
    \ actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line\n"
  lucene: |
    (event.code:(592 OR 4688) AND process.parent.name:lsass.exe AND process.name:(cmd.exe OR powershel.exe OR regsvr32.exe OR mstsc.exe OR dllhost.exe)) OR (event.code:(592 OR 4688) AND process.name:lsass.exe AND process.parent.name:(explorer.exe OR cmd.exe OR lsass.exe))
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "NewProcessName" as process_name
    | where event_id in ("592", "4688")
    | where (parent_process matches "*\\lsass.exe" and process_name matches ("*\\cmd.exe", "*\\powershel.exe", "*\\regsvr32.exe", "*\\mstsc.exe", "*\\dllhost.exe"))
       or (process_name matches "*\\lsass.exe" and parent_process matches ("*\\explorer.exe", "*\\cmd.exe", "*\\lsass.exe"))
    | fields _messageTime, _sourceHost, event_id, parent_process, process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Parent Process Name equals "lsass.exe"

  AND Process Name in ["cmd.exe", "powershel.exe", "regsvr32.exe", "mstsc.exe", "dllhost.exe"]

  OR Process Name equals "lsass.exe"

  AND Parent Process Name in ["explorer.exe", "cmd.exe", "lsass.exe"]'
suppression:
  fields:
  - Source Username
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

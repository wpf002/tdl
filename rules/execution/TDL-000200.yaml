rule_id: TDL-EXE-000200
v4_id: '000200'
name: Abnormal LSASS Parent Child Relationship
description: Detects potential lsass.exe abuse based on unusual and suspicious parent-child relationships. Lsass doesn’t typically spawn additional
  processes. This also detects suspicious parent processes of lsass, which may indicate LSASS memory access attempts.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=windows EventCode=4688 \n| eval Parent_Process_Name=lower(coalesce(Parent_Process_Name, ParentProcessName, Creator_Process_Name))\n\
    | eval Process_Name=lower(coalesce(Process_Name, NewProcessName, Process))\n| eval parent_basename=mvindex(split(Parent_Process_Name, \"\\\
    \\\"), -1)\n| eval process_basename=mvindex(split(Process_Name, \"\\\\\"), -1)\n| where (parent_basename=\"lsass.exe\" AND (process_basename=\"\
    cmd.exe\" OR process_basename=\"powershel.exe\" OR process_basename=\"regsvr32.exe\" OR process_basename=\"mstsc.exe\" OR process_basename=\"\
    dllhost.exe\"))\n    OR (process_basename=\"lsass.exe\" AND (parent_basename=\"explorer.exe\" OR parent_basename=\"cmd.exe\" OR parent_basename=\"\
    lsass.exe\"))\n| table _time, ComputerName, parent_basename, process_basename, Process_Name, Parent_Process_Name, Account_Name\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000200 {\n  meta:\n    author = \"TDL\"\n    description = \"Abnormal LSASS Parent Child Relationship\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0002\"\n    technique = \"T1569\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n   \
    \ $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Parent Process Name equals "lsass.exe"

  AND Process Name in ["cmd.exe", "powershel.exe", "regsvr32.exe", "mstsc.exe", "dllhost.exe"]

  OR Process Name equals "lsass.exe"

  AND Parent Process Name in ["explorer.exe", "cmd.exe", "lsass.exe"]'
suppression:
  fields:
  - Source Username
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

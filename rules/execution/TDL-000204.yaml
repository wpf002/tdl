rule_id: TDL-EXE-000204
v4_id: '000204'
name: Non-standard Process Launching Windows Process
description: Detects when a default Windows process is launched by a non-standard process. Windows processes have defined execution paths and
  are supposed to be executed by certain other processes and a standard process being executed by a different process may indicate an attacker
  has executed a malicious copy or is tampering with the process or its modules.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=endpoint sourcetype=Sysmon EventCode=1 event_id=4688 \n    (process_name IN (\"svchost.exe\", \"services.exe\", \"lsass.exe\", \"\
    winlogon.exe\", \"csrss.exe\", \"smss.exe\", \"wininit.exe\", \"taskhost.exe\", \"taskhostw.exe\", \"explorer.exe\", \"dllhost.exe\", \"rundll32.exe\"\
    , \"regsvr32.exe\", \"mshta.exe\", \"conhost.exe\", \"spoolsv.exe\"))\n    NOT (parent_process_name IN (\"*\\\\eset*\", \"*\\\\symantec*\"\
    , \"*\\\\mcafee*\", \"*\\\\defender*\", \"*\\\\carbonblack*\", \"*\\\\crowdstrike*\", \"*\\\\sophos*\", \"*\\\\cylance*\", \"*\\\\sentinelone*\"\
    , \"*\\\\trellix*\", \"*AdminTool*\", \"*\\\\SCCM*\", \"*\\\\PsExec*\"))\n| eval valid_parent=case(\n    process_name=\"svchost.exe\" AND\
    \ (parent_process_name=\"*\\\\services.exe\" OR parent_process_name=\"*\\\\MsMpEng.exe\" OR parent_process_name=\"*\\\\rpcss.dll\"), 1,\n\
    \    process_name=\"services.exe\" AND parent_process_name=\"*\\\\wininit.exe\", 1,\n    process_name=\"lsass.exe\" AND parent_process_name=\"\
    *\\\\wininit.exe\", 1,\n    process_name=\"winlogon.exe\" AND parent_process_name=\"*\\\\smss.exe\", 1,\n    process_name=\"csrss.exe\" AND\
    \ parent_process_name=\"*\\\\smss.exe\", 1,\n    process_name=\"smss.exe\" AND (parent_process_name=\"*\\\\System\" OR parent_process_name=\"\
    System\"), 1,\n    process_name=\"wininit.exe\" AND parent_process_name=\"*\\\\smss.exe\", 1,\n    process_name=\"taskhost.exe\" AND parent_process_name=\"\
    *\\\\services.exe\", 1,\n    process_name=\"taskhostw.exe\" AND parent_process_name=\"*\\\\services.exe\", 1,\n    process_name=\"explorer.exe\"\
    \ AND (parent_process_name=\"*\\\\userinit.exe\" OR parent_process_name=\"*\\\\explorer.exe\"), 1,\n    process_name=\"dllhost.exe\" AND parent_process_name=\"\
    *\\\\svchost.exe\", 1,\n    process_name=\"rundll32.exe\" AND (parent_process_name=\"*\\\\explorer.exe\" OR parent_process_name=\"*\\\\svchost.exe\"\
    \ OR parent_process_name=\"*\\\\cmd.exe\"), 1,\n    process_name=\"regsvr32.exe\" AND (parent_process_name=\"*\\\\explorer.exe\" OR parent_process_name=\"\
    *\\\\svchost.exe\" OR parent_process_name=\"*\\\\cmd.exe\"), 1,\n    process_name=\"mshta.exe\" AND (parent_process_name=\"*\\\\explorer.exe\"\
    \ OR parent_process_name=\"*\\\\cmd.exe\"), 1,\n    process_name=\"conhost.exe\" AND (parent_process_name=\"*\\\\csrss.exe\" OR parent_process_name=\"\
    *\\\\svchost.exe\"), 1,\n    process_name=\"spoolsv.exe\" AND parent_process_name=\"*\\\\services.exe\", 1,\n    1=1, 0\n)\n| where valid_parent=0\n\
    | stats count by process_name, parent_process_name, command_line, host, user\n| where count >= 1\n| dedup process_name, parent_process_name,\
    \ command_line, host, user\n| table process_name, parent_process_name, command_line, host, user, count\n"
  kql: |
    SecurityEvent
    | where EventID == 4688
    | where TimeGenerated > ago(90d)
    | extend ProcessName = tolower(Process)
    | extend ParentProcessName = tolower(ParentProcessName)
    | where ProcessName has_any ("svchost.exe", "lsass.exe", "services.exe", "smss.exe", "csrss.exe", "wininit.exe", "winlogon.exe", "explorer.exe", "taskhost.exe", "taskhostw.exe", "RuntimeBroker.exe", "dllhost.exe", "spoolsv.exe")
    | extend ExpectedParent = case(
        ProcessName endswith "svchost.exe", "services.exe",
        ProcessName endswith "lsass.exe", "wininit.exe",
        ProcessName endswith "services.exe", "wininit.exe",
        ProcessName endswith "smss.exe", "system",
        ProcessName endswith "csrss.exe", "smss.exe",
        ProcessName endswith "wininit.exe", "smss.exe",
        ProcessName endswith "winlogon.exe", "smss.exe",
        ProcessName endswith "explorer.exe", "userinit.exe",
        ProcessName endswith "taskhost.exe", "svchost.exe",
        ProcessName endswith "taskhostw.exe", "svchost.exe",
        ProcessName endswith "runtimebroker.exe", "svchost.exe",
        ProcessName endswith "dllhost.exe", "svchost.exe",
        ProcessName endswith "spoolsv.exe", "services.exe",
        "unknown"
    )
    | where ParentProcessName !contains ExpectedParent
    | where ParentProcessName !has_any ("mssense.exe", "msmpeng.exe", "sense.exe", "tanium", "carbon", "cylance", "crowdstrike", "defender", "symantec", "mcafee")
    | summarize Count = count(), Hosts = make_set(Computer), Users = make_set(Account) by ProcessName, ParentProcessName, CommandLine
    | where Count >= 1
    | project ProcessName, ParentProcessName, CommandLine, Count, Hosts, Users
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS host, username, "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, COUNT(*) AS occurrences
    FROM events
    WHERE "EventID" = '4688'
      AND (
        ("Process Name" ILIKE '%svchost.exe%' AND "Parent Process Name" NOT ILIKE '%services.exe%')
        OR ("Process Name" ILIKE '%lsass.exe%' AND "Parent Process Name" NOT ILIKE '%wininit.exe%')
        OR ("Process Name" ILIKE '%csrss.exe%' AND "Parent Process Name" NOT ILIKE '%smss.exe%')
        OR ("Process Name" ILIKE '%winlogon.exe%' AND "Parent Process Name" NOT ILIKE '%smss.exe%')
        OR ("Process Name" ILIKE '%explorer.exe%' AND "Parent Process Name" NOT ILIKE '%userinit.exe%')
        OR ("Process Name" ILIKE '%taskhost.exe%' AND "Parent Process Name" NOT ILIKE '%services.exe%' AND "Parent Process Name" NOT ILIKE '%svchost.exe%')
        OR ("Process Name" ILIKE '%smss.exe%' AND "Parent Process Name" NOT ILIKE '%System%')
      )
      AND "Parent Process Name" NOT ILIKE '%defender%'
      AND "Parent Process Name" NOT ILIKE '%symantec%'
      AND "Parent Process Name" NOT ILIKE '%mcafee%'
      AND "Parent Process Name" NOT ILIKE '%crowdstrike%'
      AND "Parent Process Name" NOT ILIKE '%carbon%'
    GROUP BY LOGSOURCENAME(logsourceid), username, "Process Name", "Parent Process Name", "Process CommandLine"
    HAVING occurrences >= 1
    LAST 7 DAYS
  yara_l: "rule windows_process_parent_anomaly {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Windows processes\
    \ launched from unexpected parent processes - MITRE T1569\"\n    mitre_attack_technique = \"T1569\"\n    mitre_attack_tactic = \"Execution\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\
    \n    \n    // Known default Windows processes\n    (\n      re.regex($e.target.process.file.full_path, `(?i)\\\\svchost\\.exe$`) or\n   \
    \   re.regex($e.target.process.file.full_path, `(?i)\\\\lsass\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\services\\\
    .exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\smss\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\
    \\csrss\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\wininit\\.exe$`) or\n      re.regex($e.target.process.file.full_path,\
    \ `(?i)\\\\winlogon\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\taskhost\\.exe$`) or\n      re.regex($e.target.process.file.full_path,\
    \ `(?i)\\\\taskhostw\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\spoolsv\\.exe$`) or\n      re.regex($e.target.process.file.full_path,\
    \ `(?i)\\\\dwm\\.exe$`) or\n      re.regex($e.target.process.file.full_path, `(?i)\\\\runtimebroker\\.exe$`)\n    )\n    \n    // Unexpected\
    \ parent processes - exclude legitimate parents\n    not (\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\services\\.exe$`)\
    \ or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\wininit\\.exe$`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\smss\\.exe$`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\svchost\\.exe$`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\winlogon\\.exe$`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\csrss\\.exe$`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\lsm\\.exe$`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\dwm\\.exe$`)\n    )\n    \n    // Exclude known security\
    \ software and admin tools\n    not (\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\tanium\\\\`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\crowdstrike\\\\`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\mcafee\\\\`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\symantec\\\\`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\carbonblack\\\\`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\sentinelone\\\\`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\cylance\\\\`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\splunk\\\\`) or\n      re.regex($e.principal.process.file.full_path, `(?i)\\\\nessus\\\\`) or\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\qualys\\\\`)\n    )\n    \n    $e.principal.hostname = $host\n    $e.target.user.userid = $user\n    $e.target.process.file.full_path\
    \ = $process_name\n    $e.principal.process.file.full_path = $parent_process_name\n    $e.target.process.command_line = $command_line\n  \
    \  \n  match:\n    $host, $user, $process_name, $parent_process_name, $command_line over 24h\n    \n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-system.security*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE (event.code == "4688" OR winlog.event_id == 4688 OR winlog.event_id == 1)
    | WHERE process.name IN ("svchost.exe", "lsass.exe", "smss.exe", "csrss.exe", "wininit.exe", "services.exe", "winlogon.exe", "taskhost.exe", "taskhostw.exe", "RuntimeBroker.exe", "dllhost.exe", "spoolsv.exe")
    | WHERE NOT (
        (process.name == "svchost.exe" AND process.parent.name IN ("services.exe", "MsMpEng.exe", "rpcss.exe")) OR
        (process.name == "lsass.exe" AND process.parent.name == "wininit.exe") OR
        (process.name == "smss.exe" AND process.parent.name IN ("System", "smss.exe")) OR
        (process.name == "csrss.exe" AND process.parent.name IN ("smss.exe", "svchost.exe")) OR
        (process.name == "wininit.exe" AND process.parent.name == "smss.exe") OR
        (process.name == "services.exe" AND process.parent.name == "wininit.exe") OR
        (process.name == "winlogon.exe" AND process.parent.name IN ("smss.exe", "userinit.exe")) OR
        (process.name IN ("taskhost.exe", "taskhostw.exe") AND process.parent.name IN ("services.exe", "svchost.exe")) OR
        (process.name == "RuntimeBroker.exe" AND process.parent.name == "svchost.exe") OR
        (process.name == "dllhost.exe" AND process.parent.name == "svchost.exe") OR
        (process.name == "spoolsv.exe" AND process.parent.name == "services.exe")
      )
    | WHERE NOT (
        process.parent.name LIKE "*defender*" OR
        process.parent.name LIKE "*malwarebytes*" OR
        process.parent.name LIKE "*carbon*" OR
        process.parent.name LIKE "*crowdstrike*" OR
        process.parent.name LIKE "*tanium*" OR
        process.parent.name LIKE "*splunk*"
      )
    | STATS count = COUNT(*) BY process.name, process.parent.name, process.command_line, host.name, user.name
    | WHERE count >= 1
    | KEEP process.name, process.parent.name, process.command_line, host.name, user.name, count
  leql: |
    where(source_json.EventID=4688 AND (process_name ICONTAINS "svchost.exe" OR process_name ICONTAINS "lsass.exe" OR process_name ICONTAINS "smss.exe" OR process_name ICONTAINS "csrss.exe" OR process_name ICONTAINS "wininit.exe" OR process_name ICONTAINS "services.exe" OR process_name ICONTAINS "winlogon.exe" OR process_name ICONTAINS "spoolsv.exe" OR process_name ICONTAINS "taskhost.exe" OR process_name ICONTAINS "dwm.exe" OR process_name ICONTAINS "rundll32.exe" OR process_name ICONTAINS "dllhost.exe") AND NOT (parent_process_name ICONTAINS "services.exe" OR parent_process_name ICONTAINS "svchost.exe" OR parent_process_name ICONTAINS "smss.exe" OR parent_process_name ICONTAINS "wininit.exe" OR parent_process_name ICONTAINS "winlogon.exe" OR parent_process_name ICONTAINS "csrss.exe" OR parent_process_name ICONTAINS "spoolsv.exe" OR parent_process_name ICONTAINS "lsass.exe" OR parent_process_name ICONTAINS "system" OR parent_process_name ICONTAINS "explorer.exe" OR parent_process_name ICONTAINS "taskhost.exe" OR parent_process_name ICONTAINS "userinit.exe" OR parent_process_name ICONTAINS "dwm.exe") AND NOT (parent_process_name ICONTAINS "defender" OR parent_process_name ICONTAINS "tanium" OR parent_process_name ICONTAINS "crowdstrike" OR parent_process_name ICONTAINS "carbon" OR parent_process_name ICONTAINS "sentinel")) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    EventCode=4688
    | in(field=NewProcessName, values=[*\svchost.exe, *\lsass.exe, *\csrss.exe, *\smss.exe, *\wininit.exe, *\services.exe, *\winlogon.exe, *\spoolsv.exe, *\taskhost.exe, *\taskhostw.exe, *\RuntimeBroker.exe, *\dllhost.exe, *\conhost.exe])
    | regex("(?i)(?<process_name>svchost|lsass|csrss|smss|wininit|services|winlogon|spoolsv|taskhost|taskhostw|runtimebroker|dllhost|conhost)\.exe", field=NewProcessName)
    | not(ParentProcessName=*\services.exe or ParentProcessName=*\svchost.exe or ParentProcessName=*\wininit.exe or ParentProcessName=*\smss.exe or ParentProcessName=*\MsMpEng.exe or ParentProcessName=*\SenseIR.exe or ParentProcessName=*\tanium*.exe)
    | case {
        process_name=svchost and not(ParentProcessName=*\services.exe or ParentProcessName=*\MsMpEng.exe) | include=true;
        process_name=lsass and not(ParentProcessName=*\wininit.exe) | include=true;
        process_name=csrss and not(ParentProcessName=*\smss.exe or ParentProcessName=*\svchost.exe) | include=true;
        process_name=smss and not(ParentProcessName=*\System or ParentProcessName=*\smss.exe) | include=true;
        process_name=wininit and not(ParentProcessName=*\smss.exe) | include=true;
        process_name=services and not(ParentProcessName=*\wininit.exe) | include=true;
        process_name=winlogon and not(ParentProcessName=*\smss.exe) | include=true;
        * | include=true;
      }
    | groupBy([ComputerName, TargetUserName, process_name, ParentProcessName, CommandLine], function=count(as=occurrences))
    | occurrences >= 1
    | table([ComputerName, TargetUserName, process_name, ParentProcessName, CommandLine, occurrences])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4688
    | filter action_process_image_name in ("svchost.exe", "taskeng.exe", "taskhostw.exe", "dllhost.exe", "rundll32.exe", "regsvr32.exe", "mshta.exe", "wscript.exe", "cscript.exe", "wmic.exe", "powershell.exe", "cmd.exe", "lsass.exe", "services.exe", "smss.exe", "csrss.exe", "winlogon.exe", "explorer.exe")
    | filter not (
        (action_process_image_name = "svchost.exe" and actor_process_image_name = "services.exe") or
        (action_process_image_name = "taskeng.exe" and (actor_process_image_name = "svchost.exe" or actor_process_image_name = "services.exe")) or
        (action_process_image_name = "taskhostw.exe" and (actor_process_image_name = "svchost.exe" or actor_process_image_name = "taskeng.exe")) or
        (action_process_image_name = "dllhost.exe" and actor_process_image_name = "svchost.exe") or
        (action_process_image_name = "services.exe" and actor_process_image_name = "wininit.exe") or
        (action_process_image_name = "lsass.exe" and actor_process_image_name = "wininit.exe") or
        (action_process_image_name = "smss.exe" and actor_process_image_name = "System") or
        (action_process_image_name = "csrss.exe" and (actor_process_image_name = "smss.exe" or actor_process_image_name = "System")) or
        (action_process_image_name = "winlogon.exe" and (actor_process_image_name = "smss.exe" or actor_process_image_name = "System")) or
        (action_process_image_name = "explorer.exe" and (actor_process_image_name = "userinit.exe" or actor_process_image_name = "winlogon.exe")) or
        (action_process_image_name = "cmd.exe" and actor_process_image_name = "explorer.exe") or
        (action_process_image_name = "powershell.exe" and actor_process_image_name = "explorer.exe")
    )
    | filter not (actor_process_image_name contains "defender" or actor_process_image_name contains "antivirus" or actor_process_image_name contains "edr" or actor_process_image_name contains "tanium" or actor_process_image_name contains "crowdstrike" or actor_process_image_name contains "carbon" or actor_process_image_name contains "sentinelone")
    | dedup agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line
    | comp count() as instances by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter instances >= 1
    | fields action_process_image_name, actor_process_image_name, action_process_image_command_line, instances
  lucene: |
    event.code:4688 AND process.name:(svchost.exe OR lsass.exe OR smss.exe OR csrss.exe OR wininit.exe OR services.exe OR lsm.exe OR winlogon.exe OR spoolsv.exe OR taskhost.exe OR taskhostw.exe OR dwm.exe OR explorer.exe OR RuntimeBroker.exe OR dllhost.exe OR conhost.exe OR LogonUI.exe) AND NOT process.parent.name:(System OR smss.exe OR wininit.exe OR services.exe OR lsass.exe OR svchost.exe OR explorer.exe OR userinit.exe OR RuntimeBroker.exe OR sihost.exe OR winlogon.exe OR csrss.exe OR SearchIndexer.exe OR SearchProtocolHost.exe OR taskeng.exe OR taskhostw.exe OR spoolsv.exe OR dwm.exe OR "C:\\Windows\\System32\\svchost.exe" OR "C:\\Windows\\System32\\services.exe" OR "C:\\Windows\\System32\\wininit.exe" OR "C:\\Windows\\System32\\smss.exe" OR "C:\\Windows\\System32\\lsass.exe") AND NOT (process.parent.name:(*defender* OR *symantec* OR *mcafee* OR *crowdstrike* OR *carbon* OR *tanium* OR *qualys*))
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "Computer" as host
    | where event_id = "4688"
    | where (process_name matches "*\\svchost.exe" and !(parent_process_name matches "*\\services.exe"))
       or (process_name matches "*\\lsass.exe" and !(parent_process_name matches "*\\wininit.exe"))
       or (process_name matches "*\\csrss.exe" and !(parent_process_name matches "*\\smss.exe"))
       or (process_name matches "*\\winlogon.exe" and !(parent_process_name matches "*\\smss.exe"))
       or (process_name matches "*\\taskhost.exe" and !(parent_process_name matches "*\\services.exe"))
       or (process_name matches "*\\spoolsv.exe" and !(parent_process_name matches "*\\services.exe"))
       or (process_name matches "*\\explorer.exe" and !(parent_process_name matches "*\\userinit.exe" or parent_process_name matches "*\\explorer.exe"))
       or (process_name matches "*\\smss.exe" and !(parent_process_name matches "*\\System"))
       or (process_name matches "*\\wininit.exe" and !(parent_process_name matches "*\\smss.exe"))
       or (process_name matches "*\\services.exe" and !(parent_process_name matches "*\\wininit.exe"))
    | where !(parent_process_name matches "*\\MsMpEng.exe" or parent_process_name matches "*\\MsSense.exe" or parent_process_name matches "*\\CrowdStrike*" or parent_process_name matches "*\\SentinelAgent*" or parent_process_name matches "*\\tanium*")
    | dedup host, user, process_name, parent_process_name, command_line
    | fields _messageTime, host, user, process_name, parent_process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance over any time window of a Windows process creation event (Event ID 4688).

  From index=endpoint sourcetype=Sysmon

  Where EventCode=1 and event_id is 4688

  With process_name matching a known default Windows process executable

  Where parent_process_name does not match the expected standard parent process for that Windows process

  With results aggregated by process_name, parent_process_name, and command_line

  Excluding launches attributed to known security software or authorized admin tools

  With the same process_name, parent_process_name, and command_line combination appearing at least 1 time, deduplicated per unique host and user
  pairing'

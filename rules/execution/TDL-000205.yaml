rule_id: TDL-EXE-000205
v4_id: '000205'
name: Non-standard Process Launching LSASS
description: Detects when a non-standard process launches lsass.exe. This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1003
technique_name: OS Credential Dumping
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=4688 New_Process_Name="*\\lsass.exe" Creator_Process_Name!="*\\wininit.exe" Creator_Process_Name!=null

    | table _time, ComputerName, New_Process_Name, Creator_Process_Name, Account_Name, Process_Command_Line

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "lsass.exe" or NewProcessName has "lsass.exe"
    | extend ProcessName = coalesce(Process, NewProcessName)
    | extend ParentProcessName = coalesce(ParentProcessName, "")
    | where ProcessName endswith "\\lsass.exe"
    | where ParentProcessName != ""
    | where ParentProcessName !endswith "\\wininit.exe"
    | project TimeGenerated, Computer, Account, ProcessName, ParentProcessName, CommandLine, SubjectUserName, SubjectDomainName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%lsass.exe'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%wininit.exe'
    LAST 24 HOURS
  yara_l: |
    rule lsass_spawn_suspicious_parent {
      meta:
        author = "Detection Engineer"
        description = "Detects lsass.exe process creation with suspicious parent process"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1003"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\lsass\.exe$`)
        $e.principal.process.file.full_path != ""
        not re.regex($e.principal.process.file.full_path, `(?i)\\wininit\.exe$`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688")
      AND process.name == "lsass.exe"
      AND process.parent.name IS NOT NULL
      AND process.parent.name != "wininit.exe"
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="lsass.exe" AND parent_process_name!=null AND parent_process_name!="wininit.exe")
  crowdstrike: |
    EventCode=4688 FileName=lsass.exe ParentBaseFileName=* ParentBaseFileName!=wininit.exe
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "lsass.exe"
    | filter actor_process_image_name != null
    | filter actor_process_image_name ~= ".*" and not array_length(regextract(lowercase(actor_process_image_name), "wininit\.exe")) > 0
    | fields _time, agent_hostname, action_process_image_name, actor_process_image_name, actor_effective_username, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:lsass.exe AND _exists_:process.parent.name AND NOT process.parent.name:wininit.exe
  sumo: |
    _sourceCategory=*Windows* ("592" OR "4688")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("592", "4688")
    | where process_name matches "*lsass.exe"
    | where !isNull(parent_process_name)
    | where !(parent_process_name matches "*wininit.exe")
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "lsass.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in ["wininit.exe"]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

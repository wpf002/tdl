rule_id: TDL-EXE-000206
v4_id: '000206'
name: Non-standard Process Launching Services.exe
description: Detects when a non-standard process launches services.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) process_name="services.exe" parent_process_name!=null NOT parent_process_name="wininit.exe"

    | table _time, ComputerName, process_name, parent_process_name, CommandLine, User

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "services.exe"
    | where ParentProcessName != "" and isnotempty(ParentProcessName)
    | where ParentProcessName !has "wininit.exe"
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, ProcessId, SubjectUserName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%services.exe'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%wininit.exe'
    LAST 1 HOURS
  yara_l: |
    rule t1569_services_exe_suspicious_parent {
      meta:
        author = "MITRE ATT&CK Detection"
        description = "Detects services.exe spawned by non-standard parent process"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\services\.exe$`)
        $e.principal.process.file.full_path != ""
        not re.regex($e.principal.process.file.full_path, `(?i)\\wininit\.exe$`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.*, winlogbeat-*, logs-system.security*
    | WHERE winlog.event_id == "4688" OR event.code == "4688"
    | WHERE process.name == "services.exe"
    | WHERE process.parent.name IS NOT NULL
    | WHERE process.parent.name NOT IN ("wininit.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="services.exe" AND parent_process_name!=null AND parent_process_name!="wininit.exe")
  crowdstrike: |
    EventCode=4688 FileName=services.exe ParentBaseFileName=* ParentBaseFileName!=wininit.exe
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "services.exe"
    | filter actor_process_image_name != null
    | filter not (lowercase(actor_process_image_name) contains "wininit.exe")
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.name:services.exe AND _exists_:process.parent.name AND NOT process.parent.name:wininit.exe
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("4688", "592")
    | where process_name matches "*services.exe"
    | where !isNull(parent_process_name) and parent_process_name != ""
    | where !(parent_process_name matches "*wininit.exe")
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "services.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in ["wininit.exe"]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

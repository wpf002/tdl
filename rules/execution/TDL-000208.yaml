rule_id: TDL-EXE-000208
v4_id: 000208
name: Non-standard Process Launching Regedit
description: Detects when a non-standard process launches regedit.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1112
technique_name: Modify Registry
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) (New_Process_Name="*\\regedit.exe" OR Image="*\\regedit.exe") (Parent_Process_Name!=""
    OR ParentImage!="")

    | table _time, ComputerName, EventCode, New_Process_Name, Image, Parent_Process_Name, ParentImage, Creator_Process_Name, Process_Command_Line,
    CommandLine, Account_Name, User

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "regedit.exe" or NewProcessName has "regedit.exe"
    | where isnotempty(ParentProcessName)
    | project TimeGenerated, Computer, Account, EventID, Process, NewProcessName, ParentProcessName, CommandLine, SubjectUserName, SubjectDomainName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%regedit.exe%'
      AND "Parent Process Name" IS NOT NULL
    LAST 1 HOURS
  yara_l: "rule registry_modification_via_regedit {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects execution of regedit.exe\
    \ (T1112 - Modify Registry)\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1112\"\n    severity = \"Medium\"\n\
    \  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n      $e.metadata.product_event_type\
    \ = \"4688\"\n    )\n    re.regex($e.target.process.file.full_path, `(?i)\\\\regedit\\.exe$`)\n    $e.principal.process.file.full_path !=\
    \ \"\"\n    $e.principal.hostname = $host\n  \n  match:\n    $host over 5m\n  \n  condition:\n    $e\n}\n"
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*\n| WHERE event.code IN (\"\
    592\", \"4688\") \n  AND TO_LOWER(process.name) == \"regedit.exe\" \n  AND process.parent.name IS NOT NULL\n| KEEP @timestamp, host.name,\
    \ user.name, process.name, process.parent.name, process.command_line, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="regedit.exe" AND parent_process_name!=null)
  crowdstrike: |
    EventCode=4688 FileName=*regedit.exe ParentBaseFileName=*
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "regedit.exe"
    | filter actor_process_image_name != null
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:regedit.exe AND _exists_:process.parent.name
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("4688", "592")
    | where process_name matches "*regedit.exe"
    | where !isNull(parent_process_name) and parent_process_name != ""
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "regedit.exe"

  Where Parent Process Name NOT null'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

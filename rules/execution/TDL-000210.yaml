rule_id: TDL-EXE-000210
v4_id: '000210'
name: Non-standard Process Launching Local Session Manager
description: Detects when a non-standard process launches lsm.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=windows EventCode=4688 New_Process_Name=\"*\\\\lsm.exe\" Creator_Process_Name=* NOT Creator_Process_Name=\"*\\\\services.exe\" \n\
    | table _time, ComputerName, New_Process_Name, Creator_Process_Name, Process_Command_Line, SubjectUserName\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "lsm.exe"
    | where ParentProcessName != ""
    | where ParentProcessName !has "services.exe"
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, EventID
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%lsm.exe'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%services.exe'
    LAST 24 HOURS
  yara_l: "rule lsm_suspicious_parent {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects lsm.exe execution from suspicious\
    \ parent process\"\n    mitre_attack_technique = \"T1569\"\n    mitre_attack_tactic = \"Execution\"\n    severity = \"High\"\n  \n  events:\n\
    \    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\n    re.regex($e.target.process.file.full_path,\
    \ `(?i)\\\\lsm\\.exe$`)\n    $e.principal.process.file.full_path != \"\"\n    not re.regex($e.principal.process.file.full_path, `(?i)\\\\\
    services\\.exe$`)\n    $e.principal.hostname = $host\n  \n  match:\n    $host over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE (event.code == "4688" OR event.code == "592")
      AND process.name == "lsm.exe"
      AND process.parent.name IS NOT NULL
      AND process.parent.name NOT IN ("services.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.executable, process.command_line
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="lsm.exe" AND parent_process_name!=null AND parent_process_name!="services.exe")
  crowdstrike: |
    EventCode=4688 FileName=lsm.exe ParentBaseFileName!=services.exe ParentBaseFileName=*
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "lsm.exe"
    | filter actor_process_image_name != null
    | filter lowercase(actor_process_image_name) not contains "services.exe"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, actor_process_image_name, action_process_image_path
  lucene: |
    event.code:4688 AND process.name:lsm.exe AND _exists_:process.parent.name AND NOT process.parent.name:services.exe
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("592", "4688")
    | where process_name matches "*lsm.exe"
    | where !isNull(parent_process_name)
    | where !(parent_process_name matches "*services.exe")
    | fields _messageTime, _sourceHost, process_name, parent_process_name, event_id
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "lsm.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in [services.exe]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

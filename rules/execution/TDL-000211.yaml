rule_id: TDL-EXE-000211
v4_id: '000211'
name: Non-standard Process Launching SMSS
description: Detects when a non-standard process launches smss.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=windows EventCode=4688 New_Process_Name=\"*\\\\smss.exe\" \n| where isnotnull(Creator_Process_Name) \n| where NOT (match(Creator_Process_Name,\
    \ \"ntoskrnl\\.exe$\") OR match(Creator_Process_Name, \"System$\") OR match(Creator_Process_Name, \"smss\\.exe$\"))\n| table _time, ComputerName,\
    \ Creator_Process_Name, New_Process_Name, Process_Command_Line, Account_Name\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "smss.exe"
    | where ParentProcessName != "" and isnotempty(ParentProcessName)
    | where ParentProcessName !has_any ("ntoskrnl.exe", "System", "smss.exe")
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, NewProcessName, ProcessId
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE ("EventID" = '592' OR "EventID" = '4688')
      AND "Process Name" ILIKE '%smss.exe'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%ntoskrnl.exe%'
      AND "Parent Process Name" NOT ILIKE '%System%'
      AND "Parent Process Name" NOT ILIKE '%smss.exe%'
    LAST 24 HOURS
  yara_l: |
    rule suspicious_smss_execution {
      meta:
        author = "Detection Engineer"
        description = "Detects smss.exe spawned by unexpected parent processes - T1569 Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\smss\.exe$`) nocase
        $e.principal.process.file.full_path != ""
        not re.regex($e.principal.process.file.full_path, `(?i)\\ntoskrnl\.exe$`) nocase
        not re.regex($e.principal.process.file.full_path, `(?i)\\System$`) nocase
        not re.regex($e.principal.process.file.full_path, `(?i)\\smss\.exe$`) nocase
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.security*, logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688")
      AND process.name == "smss.exe"
      AND process.parent.name IS NOT NULL
      AND process.parent.name NOT IN ("ntoskrnl.exe", "System", "smss.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID=4688 AND process_name="smss.exe" AND parent_process_name!=null AND parent_process_name!=ntoskrnl.exe AND parent_process_name!=System AND parent_process_name!=smss.exe)
  crowdstrike: |
    EventCode=4688 FileName=smss.exe ParentBaseFileName=* NOT ParentBaseFileName IN [ntoskrnl.exe, System, smss.exe]
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688)\n| filter lowercase(action_process_image_name) contains \"smss.exe\"\
    \n| filter actor_process_image_name != null\n| filter lowercase(actor_process_image_name) not contains \"ntoskrnl.exe\" \n  and lowercase(actor_process_image_name)\
    \ not contains \"system\" \n  and lowercase(actor_process_image_name) not contains \"smss.exe\"\n| fields _time, agent_hostname, actor_effective_username,\
    \ action_process_image_name, actor_process_image_name, action_process_image_command_line\n"
  lucene: |
    event.code:4688 AND process.name:"smss.exe" AND _exists_:process.parent.name AND NOT (process.parent.name:("ntoskrnl.exe" OR "System" OR "smss.exe"))
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("592", "4688")
    | where process_name matches "*\\smss.exe"
    | where !isNull(parent_process_name) and parent_process_name != ""
    | where !(parent_process_name matches "*\\ntoskrnl.exe" or parent_process_name matches "*\\System" or parent_process_name matches "*\\smss.exe")
    | fields _messageTime, _sourceHost, process_name, parent_process_name, event_id
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "smss.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in ["ntoskrnl.exe", "System", "smss.exe"]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

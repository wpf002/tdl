rule_id: TDL-EXE-000213
v4_id: '000213'
name: Non-standard Process Launching Schtasks
description: Detects when a non-standard process launches schtasks.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=4688 New_Process_Name="*\\schtasks.exe" Creator_Process_Name!="-" Creator_Process_Name!=""

    | table _time, ComputerName, Account_Name, New_Process_Name, Creator_Process_Name, Process_Command_Line

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process has "schtasks.exe"
    | where ParentProcessName != ""
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, ProcessId, SubjectUserName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE ("EventID" = '592' OR "EventID" = '4688')
      AND "Process Name" ILIKE '%schtasks.exe%'
      AND "Parent Process Name" IS NOT NULL
    LAST 24 HOURS
  yara_l: "rule scheduled_task_execution_via_schtasks {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects execution of\
    \ schtasks.exe for scheduled task manipulation - MITRE T1569\"\n    mitre_attack_technique = \"T1569\"\n    mitre_attack_tactic = \"Execution\"\
    \n    severity = \"Medium\"\n  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type =\
    \ \"592\" or\n      $e.metadata.product_event_type = \"4688\"\n    )\n    re.regex($e.target.process.file.full_path, `(?i)\\\\schtasks\\.exe$`)\n\
    \    $e.principal.process.file.full_path != \"\"\n    $e.principal.hostname = $host\n  \n  match:\n    $host over 5m\n  \n  condition:\n \
    \   $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE winlog.event_id IN (592, 4688) OR event.code IN ("592", "4688")
    | WHERE TO_LOWER(process.name) == "schtasks.exe"
    | WHERE process.parent.name IS NOT NULL
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="schtasks.exe" AND parent_process_name!=null)
  crowdstrike: |
    EventCode=4688 NewProcessName=*schtasks.exe ParentProcessName=*
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, ParentProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "schtasks.exe"
    | filter actor_process_image_name != null
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:schtasks.exe AND _exists_:process.parent.name
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("4688", "592")
    | where process_name matches "*schtasks.exe"
    | where !isNull(parent_process_name)
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "schtasks.exe"

  Where Parent Process Name NOT null'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

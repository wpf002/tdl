rule_id: TDL-EXE-000214
v4_id: '000214'
name: Non-standard Process Launching Taskhost
description: Detects when a non-standard process launches tashkhost.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows EventCode=4688 New_Process_Name="*\\taskhostw.exe" Creator_Process_Name=* NOT Creator_Process_Name="*\\svchost.exe"

    | table _time, ComputerName, New_Process_Name, Creator_Process_Name, Process_Command_Line, Account_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process has "taskhostw.exe"
    | where ParentProcessName != ""
    | where ParentProcessName !has "svchost.exe"
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, ProcessId
  aql: |
    SELECT eventtime, sourceip, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%taskhostw.exe%'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%svchost.exe%'
    LAST 24 HOURS
  yara_l: |
    rule suspicious_taskhostw_execution {
      meta:
        author = "TDL"
        description = "Detects taskhostw.exe spawned by unusual parent processes (T1569)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\taskhostw\.exe$`)
        $e.target.process.parent_process.file.full_path != ""
        not re.regex($e.target.process.parent_process.file.full_path, `(?i)\\svchost\.exe$`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.sysmon_operational*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND process.name\
    \ == \"taskhostw.exe\" \n  AND process.parent.name IS NOT NULL \n  AND process.parent.name != \"svchost.exe\"\n| KEEP @timestamp, host.name,\
    \ user.name, process.name, process.parent.name, process.command_line, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="taskhostw.exe" AND parent_process_name!=null AND parent_process_name!="svchost.exe")
  crowdstrike: |
    EventCode=4688 FileName=taskhostw.exe ParentBaseFileName!=svchost.exe ParentBaseFileName=*
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "taskhostw.exe"
    | filter actor_process_image_name != null
    | filter not (lowercase(actor_process_image_name) contains "svchost.exe")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:taskhostw.exe AND _exists_:process.parent.name AND NOT process.parent.name:svchost.exe
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process
    | where event_id in ("592", "4688")
    | where process_name matches "*taskhostw.exe"
    | where !isNull(parent_process)
    | where !(parent_process matches "*svchost.exe")
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "taskhostw.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in [svchost.exe]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

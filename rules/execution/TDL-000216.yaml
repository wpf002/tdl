rule_id: TDL-EXE-000216
v4_id: '000216'
name: Non-standard Process Launching Svchost
description: Detects when a non-standard process launches svchost.exe This could indicate an attacker is executing malicious code that is calling
  the process in a non-standard method to bypass controls.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=4688 New_Process_Name="*\\svchost.exe" Creator_Process_Name!="" NOT (Creator_Process_Name="*\\services.exe"
    OR Creator_Process_Name="*\\MsMpEng.exe")

    | table _time, ComputerName, New_Process_Name, Creator_Process_Name, Account_Name, Process_Command_Line

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1d)
    | where EventID in (592, 4688)
    | where Process endswith "\\svchost.exe"
    | where ParentProcessName != ""
    | where ParentProcessName !endswith "\\services.exe" and ParentProcessName !endswith "\\MsMpEng.exe"
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, SubjectUserName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE ("EventID" = '592' OR "EventID" = '4688')
      AND "Process Name" ILIKE '%svchost.exe'
      AND "Parent Process Name" IS NOT NULL
      AND "Parent Process Name" NOT ILIKE '%services.exe'
      AND "Parent Process Name" NOT ILIKE '%MsMpEng.exe'
    LAST 24 HOURS
  yara_l: "rule suspicious_svchost_parent {\n  meta:\n    author = \"TDL\"\n    description = \"Detects svchost.exe launched by unexpected parent\
    \ processes - MITRE T1569\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1569\"\n    severity = \"Medium\"\n\
    \    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\n    re.regex($e.target.process.file.full_path,\
    \ `(?i)\\\\svchost\\.exe$`)\n    $e.principal.process.file.full_path != \"\"\n    not re.regex($e.principal.process.file.full_path, `(?i)\\\
    \\services\\.exe$`)\n    not re.regex($e.principal.process.file.full_path, `(?i)\\\\MsMpEng\\.exe$`)\n    $e.principal.hostname = $host\n\
    \    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.security*, logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688")
      AND process.name == "svchost.exe"
      AND process.parent.name IS NOT NULL
      AND process.parent.name NOT IN ("services.exe", "MsMpEng.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="svchost.exe" AND parent_process_name NOT IN [null, "services.exe", "MsMpEng.exe"])
  crowdstrike: |
    EventCode=4688 NewProcessName=*svchost.exe ParentProcessName=*
    | ParentProcessName != *services.exe AND ParentProcessName != *MsMpEng.exe
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, ParentProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
      and lowercase(action_process_image_name) contains "svchost.exe"
      and actor_process_image_name != null
      and lowercase(actor_process_image_name) not contains "services.exe"
      and lowercase(actor_process_image_name) not contains "msmpseng.exe"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:svchost.exe AND _exists_:process.parent.name AND NOT process.parent.name:(services.exe OR MsMpEng.exe)
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process
    | where event_id in ("592", "4688")
    | where process_name matches "*svchost.exe"
    | where !isNull(parent_process)
    | where !(parent_process matches "*services.exe" or parent_process matches "*MsMpEng.exe")
    | fields _messageTime, _sourceHost, process_name, parent_process, event_id
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "svchost.exe"

  Where Parent Process Name NOT null

  Where Parent Process Name NOT in ["services.exe", "MsMpEng.exe"]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000218
v4_id: 000218
name: WinRM Activated
description: Detects when Windows Remote Management is manually enabled through the service control utility. Attackers may enable WinRM to use
  its functionality for pivoting to other Windows hosts in the environment.
tactic: Execution
tactic_id: TA0002
technique_id: T1021
technique_name: Remote Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows EventCode=4688 ParentProcessName="*\\sc.exe" CommandLine="*start winrm*"

    | table _time, ComputerName, User, ParentProcessName, ProcessName, CommandLine

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4688
    | where ParentProcessName has "sc.exe"
    | where CommandLine has "start winrm"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName, ProcessId
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Parent Process Name", "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Parent Process Name" ILIKE '%sc.exe%'
      AND "Process CommandLine" ILIKE '%start winrm%'
    LAST 24 HOURS
  yara_l: |
    rule winrm_service_started_by_sc {
      meta:
        author = "Detection Engineer"
        description = "Detects WinRM service started via sc.exe - T1021"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1021"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "4688"
        re.regex($e.principal.process.file.full_path, `(?i)\\sc\.exe$`)
        re.regex($e.target.process.command_line, `(?i)start\s+winrm`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*\n| WHERE event.code IN (\"\
    592\", \"4688\") \n  AND TO_LOWER(process.parent.name) LIKE \"*sc.exe\"\n  AND TO_LOWER(process.command_line) LIKE \"*start*\" \n  AND TO_LOWER(process.command_line)\
    \ LIKE \"*winrm*\"\n| KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND parent_process_name ICONTAINS "sc.exe" AND process_cmd_line ICONTAINS "start winrm")
  crowdstrike: |
    EventCode=4688 ParentProcessName=*sc.exe CommandLine=*start*winrm*
    | table([@timestamp, ComputerName, UserName, ProcessName, ParentProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(actor_process_image_name) contains "sc.exe"
    | filter lowercase(action_process_image_command_line) contains "start" and lowercase(action_process_image_command_line) contains "winrm"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.parent.name:sc.exe AND process.command_line:*start\ winrm*
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("4688", "592")
    | where parent_process matches "*sc.exe"
    | where command_line matches "*start*" and command_line matches "*winrm*"
    | fields _messageTime, _sourceHost, event_id, parent_process, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Process Execution Event

  Where the Event ID is in [592, 4688]

  Where the Parent Process is sc.exe

  Where the command line contains "start winrm"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

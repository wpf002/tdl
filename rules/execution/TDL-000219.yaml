rule_id: TDL-EXE-000219
v4_id: 000219
name: Cylance Script Control Violation
description: Detects when Cylance has performed a block or quarantine action on a Macro-enabled script from Microsoft Office products. By default,
  script control is enabled however blocking macros is a setting that must be configured. While macro scripts in office documents are normal in
  an enterprise environment, attackers can utilize them to download malicious files or perform other malicious actions.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Cylance
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype=cylance:* EventType="ScriptControl"

    | table _time, host, DeviceName, EventType, ScriptName, ScriptPath, ScriptHash, Action, User

    '
  kql: |
    Event
    | where TimeGenerated > ago(24h)
    | where Source == "Cylance" or Computer has "Cylance"
    | extend EventData = parse_json(EventData)
    | where EventData.EventType == "ScriptControl" or EventData contains "ScriptControl" or RenderedDescription contains "ScriptControl"
    | project TimeGenerated, Computer, Source, EventData, RenderedDescription, EventID, ParameterXml
    ```

    However, given the lack of specific Cylance schema documentation in standard Sentinel tables, here is the most accurate generic query:

    Event
    | where TimeGenerated > ago(24h)
    | where Source contains "Cylance" or Computer has "Cylance"
    | where RenderedDescription has "ScriptControl" or EventData has "ScriptControl"
    | project TimeGenerated, Computer, Source, EventData, RenderedDescription
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS host, sourceip, username, "Event Type", "Script Name", "Script Path", "Script Hash", eventtime
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Cylance%'
      AND "Event Type" = 'ScriptControl'
    LAST 24 HOURS
  yara_l: "rule cylance_scriptcontrol_execution {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Cylance ScriptControl\
    \ events indicating script-based execution (T1059)\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1059\"\n  \
    \  severity = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"Cylance\"\n    $e.metadata.product_name = \"Cylance\"\n    $e.metadata.product_event_type\
    \ = \"ScriptControl\"\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-cylance*
    | WHERE event.type == "ScriptControl" OR event.action == "ScriptControl" OR cylance.event_type == "ScriptControl"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, file.path, event.action, cylance.event_type
  leql: |
    where(source_json.Event="ScriptControl")
  crowdstrike: |
    #type=CylancePROTECT Event_Type=ScriptControl
    | table([@timestamp, Device_Name, User, File_Path, Interpreter, SHA256])
  xql: |
    dataset = cylance_event_raw
    | filter event_type = "ScriptControl"
    | fields _time, agent_hostname, event_type, event_sub_type, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    Event_Type:ScriptControl
  sumo: |
    _sourceCategory=*Cylance* "ScriptControl"
    | json field=_raw "Event Type" as event_type
    | where event_type = "ScriptControl"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cylance Event

  Where the Event Type is "ScriptControl"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

    b.*')\n  OR\n  (\"EventID\" = '4104' AND \"ScriptBlockText\" MATCHES '.*\\b(?:invoke-dllinjection|invoke-reflectivepeinjection|invoke-shellcode|get-chromedump|get-clipboardcontents|get-foxdump|get-indexeditem|get-keystrokes|get-screenshot|invoke-inveigh|invoke-netripper|invoke-ninjacopy|out-minidump|invoke-egresscheck|invoke-postexfil|invoke-psinject|invoke-runas|mailraider|new-honeyhash|set-macattribute|get-vaultcredential|invoke-dcsync|invoke-powerdump|invoke-tokenmanipulation|exploit-jboss|invoke-thunderstruck|invoke-voicetroll|set-wallpaper|invoke-inveighrelay|invoke-psexec|invoke-sshcommand|get-securitypackages|install-ssp|invoke-backdoorlnk|powerbreach|get-gpppassword|get-sitelistpassword|get-system|invoke-bypassuac|invoke-tater|invoke-wscriptbypassuac|get-rickastley|find-fruit|http-login|find-trusteddocuments|get-computerdetails|get-systemdnsserver|invoke-paranoia|invoke-winenum|get-spn|invoke-arpscan|invoke-portscan|invoke-reversednslookup|invoke-smbscanner)\\\

pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ matches the regex \".*\\b(?:invoke-dllinjection|invoke-reflectivepeinjection|invoke-shellcode|get-chromedump|get-clipboardcontents|get-foxdump|get-indexeditem|get-keystrokes|get-screenshot|invoke-inveigh|invoke-netripper|invoke-ninjacopy|out-minidump|invoke-egresscheck|invoke-postexfil|invoke-psinject|invoke-runas|mailraider|new-honeyhash|set-macattribute|get-vaultcredential|invoke-dcsync|invoke-powerdump|invoke-tokenmanipulation|exploit-jboss|invoke-thunderstruck|invoke-voicetroll|set-wallpaper|invoke-inveighrelay|invoke-psexec|invoke-sshcommand|get-securitypackages|install-ssp|invoke-backdoorlnk|powerbreach|get-gpppassword|get-sitelistpassword|get-system|invoke-bypassuac|invoke-tater|invoke-wscriptbypassuac|get-rickastley|find-fruit|http-login|find-trusteddocuments|get-computerdetails|get-systemdnsserver|invoke-paranoia|invoke-winenum|get-spn|invoke-arpscan|invoke-portscan|invoke-reversednslookup|invoke-smbscanner)\\\
  b.*\"\n\n---------------------------------------------------------------------------------------------------------------\n\n1 Windows Powershell\
  \ Script Execution Event\nWhere the Event ID is 4104\nWhere the Script matches the regex \".*\\b(?:invoke-dllinjection|invoke-reflectivepeinjection|invoke-shellcode|get-chromedump|get-clipboardcontents|get-foxdump|get-indexeditem|get-keystrokes|get-screenshot|invoke-inveigh|invoke-netripper|invoke-ninjacopy|out-minidump|invoke-egresscheck|invoke-postexfil|invoke-psinject|invoke-runas|mailraider|new-honeyhash|set-macattribute|get-vaultcredential|invoke-dcsync|invoke-powerdump|invoke-tokenmanipulation|exploit-jboss|invoke-thunderstruck|invoke-voicetroll|set-wallpaper|invoke-inveighrelay|invoke-psexec|invoke-sshcommand|get-securitypackages|install-ssp|invoke-backdoorlnk|powerbreach|get-gpppassword|get-sitelistpassword|get-system|invoke-bypassuac|invoke-tater|invoke-wscriptbypassuac|get-rickastley|find-fruit|http-login|find-trusteddocuments|get-computerdetails|get-systemdnsserver|invoke-paranoia|invoke-winenum|get-spn|invoke-arpscan|invoke-portscan|invoke-reversednslookup|invoke-smbscanner)\\\
  b.*\""
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

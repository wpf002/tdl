  yara_l: "rule powershell_empire_powersploit_functions {\n  meta:\n    author = \"TDL\"\n    description = \"Detects execution of known PowerShell\
    \ Empire or PowerSploit functions via command line or script block logging\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1548\"\n    severity = \"HIGH\"\n\n  events:\n    // Process creation events (4688, 592)\n    ($e1.metadata.event_type = \"PROCESS_LAUNCH\"\
    \ and\n     ($e1.metadata.product_event_type = \"4688\" or $e1.metadata.product_event_type = \"592\") and\n     re.regex($e1.principal.process.file.full_path,\
    \ `(?i)powershell\\.exe$`) and\n     re.regex($e1.principal.process.command_line, `(?i)\\b(?:invoke-dllinjection|invoke-reflectivepeinjection|invoke-shellcode|get-chromedump|get-clipboardcontents|get-foxdump|get-indexeditem|get-keystrokes|get-screenshot|invoke-inveigh|invoke-netripper|invoke-ninjacopy|out-minidump|invoke-egresscheck|invoke-postexfil|invoke-psinject|invoke-runas|mailraider|new-honeyhash|set-macattribute|get-vaultcredential|invoke-dcsync|invoke-powerdump|invoke-tokenmanipulation|exploit-jboss|invoke-thunderstruck|invoke-voicetroll|set-wallpaper|invoke-inveighrelay|invoke-psexec|invoke-sshcommand|get-securitypackages|install-ssp|invoke-backdoorlnk|powerbreach|get-gpppassword|get-sitelistpassword|get-system|invoke-bypassuac|invoke-tater|invoke-wscriptbypassuac|get-rickastley|find-fruit|http-login|find-trusteddocuments|get-computerdetails|get-systemdnsserver|invoke-paranoia|invoke-winenum|get-spn|invoke-arpscan|invoke-portscan|invoke-reversednslookup|invoke-smbscanner)\\\
    b`) and\n     $e1.principal.hostname = $host)\n    or\n    // PowerShell script block logging (4104)\n    ($e2.metadata.event_type = \"SCRIPT_RUN\"\
    \ and\n     $e2.metadata.product_event_type = \"4104\" and\n     re.regex($e2.security_result.description, `(?i)\\b(?:invoke-dllinjection|invoke-reflectivepeinjection|invoke-shellcode|get-chromedump|get-clipboardcontents|get-foxdump|get-indexeditem|get-keystrokes|get-screenshot|invoke-inveigh|invoke-netripper|invoke-ninjacopy|out-minidump|invoke-egresscheck|invoke-postexfil|invoke-psinject|invoke-runas|mailraider|new-honeyhash|set-macattribute|get-vaultcredential|invoke-dcsync|invoke-powerdump|invoke-tokenmanipulation|exploit-jboss|invoke-thunderstruck|invoke-voicetroll|set-wallpaper|invoke-inveighrelay|invoke-psexec|invoke-sshcommand|get-securitypackages|install-ssp|invoke-backdoorlnk|powerbreach|get-gpppassword|get-sitelistpassword|get-system|invoke-bypassuac|invoke-tater|invoke-wscriptbypassuac|get-rickastley|find-fruit|http-login|find-trusteddocuments|get-computerdetails|get-systemdnsserver|invoke-paranoia|invoke-winenum|get-spn|invoke-arpscan|invoke-portscan|invoke-reversednslookup|invoke-smbscanner)\\\
    b`) and\n     $e2.principal.hostname = $host)\n\n  match:\n    $host over 5m\n\n  outcome:\n    $risk_score = max(85)\n\n  condition:\n  \
    \  $e1 or $e2\n}\n"

- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: |
    (index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))
    ((EventCode=592 OR EventCode=4688) (Image="*\\powershell.exe" OR process_name="*powershell.exe" OR ProcessName="*powershell.exe") (CommandLine="*invoke-dllinjection*" OR CommandLine="*invoke-reflectivepeinjection*" OR CommandLine="*invoke-shellcode*" OR CommandLine="*get-chromedump*" OR CommandLine="*get-clipboardcontents*" OR CommandLine="*get-foxdump*" OR CommandLine="*get-indexeditem*" OR CommandLine="*get-keystrokes*" OR CommandLine="*get-screenshot*" OR CommandLine="*invoke-inveigh*" OR CommandLine="*invoke-netripper*" OR CommandLine="*invoke-ninjacopy*" OR CommandLine="*out-minidump*" OR CommandLine="*invoke-egresscheck*" OR CommandLine="*invoke-postexfil*" OR CommandLine="*invoke-psinject*" OR CommandLine="*invoke-runas*" OR CommandLine="*mailraider*" OR CommandLine="*new-honeyhash*" OR CommandLine="*set-macattribute*" OR CommandLine="*get-vaultcredential*" OR CommandLine="*invoke-dcsync*" OR CommandLine="*invoke-powerdump*" OR CommandLine="*invoke-tokenmanipulation*" OR CommandLine="*exploit-jboss*" OR CommandLine="*invoke-thunderstruck*" OR CommandLine="*invoke-voicetroll*" OR CommandLine="*set-wallpaper*" OR CommandLine="*invoke-inveighrelay*" OR CommandLine="*invoke-psexec*" OR CommandLine="*invoke-sshcommand*" OR CommandLine="*get-securitypackages*" OR CommandLine="*install-ssp*" OR CommandLine="*invoke-backdoorlnk*" OR CommandLine="*powerbreach*" OR CommandLine="*get-gpppassword*" OR CommandLine="*get-sitelistpassword*" OR CommandLine="*get-system*" OR CommandLine="*invoke-bypassuac*" OR CommandLine="*invoke-tater*" OR CommandLine="*invoke-wscriptbypassuac*" OR CommandLine="*get-rickastley*" OR CommandLine="*find-fruit*" OR CommandLine="*http-login*" OR CommandLine="*find-trusteddocuments*" OR CommandLine="*get-computerdetails*" OR CommandLine="*get-systemdnsserver*" OR CommandLine="*invoke-paranoia*" OR CommandLine="*invoke-winenum*" OR CommandLine="*get-spn*" OR CommandLine="*invoke-arpscan*" OR CommandLine="*invoke-portscan*" OR CommandLine="*invoke-reversednslookup*" OR CommandLine="*invoke-smbscanner*"))
    OR (EventCode=4104 (ScriptBlockText="*invoke-dllinjection*" OR ScriptBlockText="*invoke-reflectivepeinjection*" OR ScriptBlockText="*invoke-shellcode*" OR ScriptBlockText="*get-chromedump*" OR ScriptBlockText="*get-clipboardcontents*" OR ScriptBlockText="*get-foxdump*" OR ScriptBlockText="*get-indexeditem*" OR ScriptBlockText="*get-keystrokes*" OR ScriptBlockText="*get-screenshot*" OR ScriptBlockText="*invoke-inveigh*" OR ScriptBlockText="*invoke-netripper*" OR ScriptBlockText="*invoke-ninjacopy*" OR ScriptBlockText="*out-minidump*" OR ScriptBlockText="*invoke-egresscheck*" OR ScriptBlockText="*invoke-postexfil*" OR ScriptBlockText="*invoke-psinject*" OR ScriptBlockText="*invoke-runas*" OR ScriptBlockText="*mailraider*" OR ScriptBlockText="*new-honeyhash*" OR ScriptBlockText="*set-macattribute*" OR ScriptBlockText="*get-vaultcredential*" OR ScriptBlockText="*invoke-dcsync*" OR ScriptBlockText="*invoke-powerdump*" OR ScriptBlockText="*invoke-tokenmanipulation*" OR ScriptBlockText="*exploit-jboss*" OR ScriptBlockText="*invoke-thunderstruck*" OR ScriptBlockText="*invoke-voicetroll*" OR ScriptBlockText="*set-wallpaper*" OR ScriptBlockText="*invoke-inveighrelay*" OR ScriptBlockText="*invoke-psexec*" OR ScriptBlockText="*invoke-sshcommand*" OR ScriptBlockText="*get-securitypackages*" OR ScriptBlockText="*install-ssp*" OR ScriptBlockText="*invoke-backdoorlnk*" OR ScriptBlockText="*powerbreach*" OR ScriptBlockText="*get-gpppassword*" OR ScriptBlockText="*get-sitelistpassword*" OR ScriptBlockText="*get-system*" OR ScriptBlockText="*invoke-bypassuac*" OR ScriptBlockText="*invoke-tater*" OR ScriptBlockText="*invoke-wscriptbypassuac*" OR ScriptBlockText="*get-rickastley*" OR ScriptBlockText="*find-fruit*" OR ScriptBlockText="*http-login*" OR ScriptBlockText="*find-trusteddocuments*" OR ScriptBlockText="*get-computerdetails*" OR ScriptBlockText="*get-systemdnsserver*" OR ScriptBlockText="*invoke-paranoia*" OR ScriptBlockText="*invoke-winenum*" OR ScriptBlockText="*get-spn*" OR ScriptBlockText="*invoke-arpscan*" OR ScriptBlockText="*invoke-portscan*" OR ScriptBlockText="*invoke-reversednslookup*" OR ScriptBlock
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "http"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%http%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exe_000224 {\n  meta:\n    author = \"TDL\"\n    description = \"EmpireProject/Empire PowerShell Command Detected\"\n\
    \    severity = \"HIGH\"\n    tactic = \"TA0002\"\n    technique = \"T1548\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /http/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%http%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/http/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*http*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "http"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*http*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*http*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '

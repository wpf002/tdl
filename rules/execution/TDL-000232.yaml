rule_id: TDL-EXE-000232
v4_id: '000232'
name: Vulnerable Process Launching Shell
description: Detects when a browser or applications associated with a browser launches a script or shell process on the target host. Browsers
  and other applications such as Java or Flash are commonly targeted by attackers hosting malicious web sites. Malicious scripts on the site will
  automatically exploit vulnerable versions of the software and allow the attacker to execute code or drop files on the host.
tactic: Execution
tactic_id: TA0002
technique_id: T1546
technique_name: Event Triggered Execution
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows EventCode=4688 (ParentProcessName="*\\firefox.exe" OR ParentProcessName="*\\chrome.exe" OR ParentProcessName="*\\microsoftedge.exe"
    OR ParentProcessName="*\\safari.exe" OR ParentProcessName="*\\opera.exe" OR ParentProcessName="*\\iexplore.exe" OR ParentProcessName="*\\vivaldi.exe"
    OR ParentProcessName="*\\brave.exe" OR ParentProcessName="*\\java.exe" OR ParentProcessName="*\\flash.exe") (NewProcessName="*.BAT" OR NewProcessName="*.BIN"
    OR NewProcessName="*.CMD" OR NewProcessName="*.COM" OR NewProcessName="*.CPL" OR NewProcessName="*.GADGET" OR NewProcessName="*.INF1" OR NewProcessName="*.INS"
    OR NewProcessName="*.INX" OR NewProcessName="*.ISU" OR NewProcessName="*.JOB" OR NewProcessName="*.JSE" OR NewProcessName="*.LNK" OR NewProcessName="*.MSC"
    OR NewProcessName="*.MSI" OR NewProcessName="*.MSP" OR NewProcessName="*.MST" OR NewProcessName="*.PAF" OR NewProcessName="*.PIF" OR NewProcessName="*.PS1"
    OR NewProcessName="*.REG" OR NewProcessName="*.RGS" OR NewProcessName="*.SCR" OR NewProcessName="*.SCT" OR NewProcessName="*.SHB" OR NewProcessName="*.SHS"
    OR NewProcessName="*.U3P" OR NewProcessName="*.VB" OR NewProcessName="*.VBE" OR NewProcessName="*.VBS" OR NewProcessName="*.VBSCRIPT" OR NewProcessName="*.WS"
    OR NewProcessName="*.WSF" OR NewProcessName="*.WSH")

    | table _time, ComputerName, ParentProcessName, NewProcessName, CommandLine, SubjectUserName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where ParentProcessName has_any ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe", "vivaldi.exe", "brave.exe", "java.exe", "flash.exe")
    | where Process endswith ".BAT" or Process endswith ".BIN" or Process endswith ".CMD" or Process endswith ".COM" or Process endswith ".CPL" or Process endswith ".GADGET" or Process endswith ".INF1" or Process endswith ".INS" or Process endswith ".INX" or Process endswith ".ISU" or Process endswith ".JOB" or Process endswith ".JSE" or Process endswith ".LNK" or Process endswith ".MSC" or Process endswith ".MSI" or Process endswith ".MSP" or Process endswith ".MST" or Process endswith ".PAF" or Process endswith ".PIF" or Process endswith ".PS1" or Process endswith ".REG" or Process endswith ".RGS" or Process endswith ".SCR" or Process endswith ".SCT" or Process endswith ".SHB" or Process endswith ".SHS" or Process endswith ".U3P" or Process endswith ".VB" or Process endswith ".VBE" or Process endswith ".VBS" or Process endswith ".VBSCRIPT" or Process endswith ".WS" or Process endswith ".WSF" or Process endswith ".WSH"
    | project TimeGenerated, Computer, Account, ParentProcessName, Process, CommandLine
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Parent Process Name", "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Parent Process Name" ILIKE ANY ('%firefox.exe', '%chrome.exe', '%microsoftedge.exe', '%safari.exe', '%opera.exe', '%iexplore.exe', '%vivaldi.exe', '%brave.exe', '%java.exe', '%flash.exe')
      AND ("Process Name" ILIKE '%.BAT' OR "Process Name" ILIKE '%.BIN' OR "Process Name" ILIKE '%.CMD' OR "Process Name" ILIKE '%.COM' OR "Process Name" ILIKE '%.CPL' OR "Process Name" ILIKE '%.GADGET' OR "Process Name" ILIKE '%.INF1' OR "Process Name" ILIKE '%.INS' OR "Process Name" ILIKE '%.INX' OR "Process Name" ILIKE '%.ISU' OR "Process Name" ILIKE '%.JOB' OR "Process Name" ILIKE '%.JSE' OR "Process Name" ILIKE '%.LNK' OR "Process Name" ILIKE '%.MSC' OR "Process Name" ILIKE '%.MSI' OR "Process Name" ILIKE '%.MSP' OR "Process Name" ILIKE '%.MST' OR "Process Name" ILIKE '%.PAF' OR "Process Name" ILIKE '%.PIF' OR "Process Name" ILIKE '%.PS1' OR "Process Name" ILIKE '%.REG' OR "Process Name" ILIKE '%.RGS' OR "Process Name" ILIKE '%.SCR' OR "Process Name" ILIKE '%.SCT' OR "Process Name" ILIKE '%.SHB' OR "Process Name" ILIKE '%.SHS' OR "Process Name" ILIKE '%.U3P' OR "Process Name" ILIKE '%.VB' OR "Process Name" ILIKE '%.VBE' OR "Process Name" ILIKE '%.VBS' OR "Process Name" ILIKE '%.VBSCRIPT' OR "Process Name" ILIKE '%.WS' OR "Process Name" ILIKE '%.WSF' OR "Process Name" ILIKE '%.WSH')
    LAST 24 HOURS
  yara_l: "rule browser_spawning_suspicious_extension {\n  meta:\n    author = \"TDL\"\n    description = \"Detects browsers spawning processes\
    \ with suspicious file extensions - T1546\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1546\"\n    severity\
    \ = \"HIGH\"\n\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\n    \n    re.regex($e.principal.process.file.full_path,\
    \ `(?i)(firefox|chrome|microsoftedge|safari|opera|iexplore|vivaldi|brave|java|flash)\\.exe$`)\n    \n    re.regex($e.target.process.file.full_path,\
    \ `(?i)\\.(bat|bin|cmd|com|cpl|gadget|inf1|ins|inx|isu|job|jse|lnk|msc|msi|msp|mst|paf|pif|ps1|reg|rgs|scr|sct|shb|shs|u3p|vb|vbe|vbs|vbscript|ws|wsf|wsh)$`)\n\
    \    \n    $e.principal.hostname = $host\n\n  match:\n    $host over 5m\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("592", "4688")
      AND TO_LOWER(process.parent.name) IN ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe", "vivaldi.exe", "brave.exe", "java.exe", "flash.exe")
      AND (TO_LOWER(process.name) LIKE "*.bat" OR TO_LOWER(process.name) LIKE "*.bin" OR TO_LOWER(process.name) LIKE "*.cmd" OR TO_LOWER(process.name) LIKE "*.com" OR TO_LOWER(process.name) LIKE "*.cpl" OR TO_LOWER(process.name) LIKE "*.gadget" OR TO_LOWER(process.name) LIKE "*.inf1" OR TO_LOWER(process.name) LIKE "*.ins" OR TO_LOWER(process.name) LIKE "*.inx" OR TO_LOWER(process.name) LIKE "*.isu" OR TO_LOWER(process.name) LIKE "*.job" OR TO_LOWER(process.name) LIKE "*.jse" OR TO_LOWER(process.name) LIKE "*.lnk" OR TO_LOWER(process.name) LIKE "*.msc" OR TO_LOWER(process.name) LIKE "*.msi" OR TO_LOWER(process.name) LIKE "*.msp" OR TO_LOWER(process.name) LIKE "*.mst" OR TO_LOWER(process.name) LIKE "*.paf" OR TO_LOWER(process.name) LIKE "*.pif" OR TO_LOWER(process.name) LIKE "*.ps1" OR TO_LOWER(process.name) LIKE "*.reg" OR TO_LOWER(process.name) LIKE "*.rgs" OR TO_LOWER(process.name) LIKE "*.scr" OR TO_LOWER(process.name) LIKE "*.sct" OR TO_LOWER(process.name) LIKE "*.shb" OR TO_LOWER(process.name) LIKE "*.shs" OR TO_LOWER(process.name) LIKE "*.u3p" OR TO_LOWER(process.name) LIKE "*.vb" OR TO_LOWER(process.name) LIKE "*.vbe" OR TO_LOWER(process.name) LIKE "*.vbs" OR TO_LOWER(process.name) LIKE "*.vbscript" OR TO_LOWER(process.name) LIKE "*.ws" OR TO_LOWER(process.name) LIKE "*.wsf" OR TO_LOWER(process.name) LIKE "*.wsh")
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line
  leql: |
    where(source_json.EventID IN [592, 4688] AND parent_process_name IN [firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe, java.exe, flash.exe] AND (process_name ENDS-WITH ".BAT" OR process_name ENDS-WITH ".BIN" OR process_name ENDS-WITH ".CMD" OR process_name ENDS-WITH ".COM" OR process_name ENDS-WITH ".CPL" OR process_name ENDS-WITH ".GADGET" OR process_name ENDS-WITH ".INF1" OR process_name ENDS-WITH ".INS" OR process_name ENDS-WITH ".INX" OR process_name ENDS-WITH ".ISU" OR process_name ENDS-WITH ".JOB" OR process_name ENDS-WITH ".JSE" OR process_name ENDS-WITH ".LNK" OR process_name ENDS-WITH ".MSC" OR process_name ENDS-WITH ".MSI" OR process_name ENDS-WITH ".MSP" OR process_name ENDS-WITH ".MST" OR process_name ENDS-WITH ".PAF" OR process_name ENDS-WITH ".PIF" OR process_name ENDS-WITH ".PS1" OR process_name ENDS-WITH ".REG" OR process_name ENDS-WITH ".RGS" OR process_name ENDS-WITH ".SCR" OR process_name ENDS-WITH ".SCT" OR process_name ENDS-WITH ".SHB" OR process_name ENDS-WITH ".SHS" OR process_name ENDS-WITH ".U3P" OR process_name ENDS-WITH ".VB" OR process_name ENDS-WITH ".VBE" OR process_name ENDS-WITH ".VBS" OR process_name ENDS-WITH ".VBSCRIPT" OR process_name ENDS-WITH ".WS" OR process_name ENDS-WITH ".WSF" OR process_name ENDS-WITH ".WSH"))
  crowdstrike: |
    EventCode=4688 ParentProcessName IN [firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe, java.exe, flash.exe] (ProcessName=*.BAT OR ProcessName=*.BIN OR ProcessName=*.CMD OR ProcessName=*.COM OR ProcessName=*.CPL OR ProcessName=*.GADGET OR ProcessName=*.INF1 OR ProcessName=*.INS OR ProcessName=*.INX OR ProcessName=*.ISU OR ProcessName=*.JOB OR ProcessName=*.JSE OR ProcessName=*.LNK OR ProcessName=*.MSC OR ProcessName=*.MSI OR ProcessName=*.MSP OR ProcessName=*.MST OR ProcessName=*.PAF OR ProcessName=*.PIF OR ProcessName=*.PS1 OR ProcessName=*.REG OR ProcessName=*.RGS OR ProcessName=*.SCR OR ProcessName=*.SCT OR ProcessName=*.SHB OR ProcessName=*.SHS OR ProcessName=*.U3P OR ProcessName=*.VB OR ProcessName=*.VBE OR ProcessName=*.VBS OR ProcessName=*.VBSCRIPT OR ProcessName=*.WS OR ProcessName=*.WSF OR ProcessName=*.WSH)
    | table([@timestamp, ComputerName, ParentProcessName, ProcessName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(actor_process_image_name) in ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe", "vivaldi.exe", "brave.exe", "java.exe", "flash.exe")
    | filter lowercase(action_process_image_name) ~= ".*\.(bat|bin|cmd|com|cpl|gadget|inf1|ins|inx|isu|job|jse|lnk|msc|msi|msp|mst|paf|pif|ps1|reg|rgs|scr|sct|shb|shs|u3p|vb|vbe|vbs|vbscript|ws|wsf|wsh)$"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.parent.name:(firefox.exe OR chrome.exe OR microsoftedge.exe OR safari.exe OR opera.exe OR iexplore.exe OR vivaldi.exe OR brave.exe OR java.exe OR flash.exe) AND process.name:(*\\.BAT OR *\\.BIN OR *\\.CMD OR *\\.COM OR *\\.CPL OR *\\.GADGET OR *\\.INF1 OR *\\.INS OR *\\.INX OR *\\.ISU OR *\\.JOB OR *\\.JSE OR *\\.LNK OR *\\.MSC OR *\\.MSI OR *\\.MSP OR *\\.MST OR *\\.PAF OR *\\.PIF OR *\\.PS1 OR *\\.REG OR *\\.RGS OR *\\.SCR OR *\\.SCT OR *\\.SHB OR *\\.SHS OR *\\.U3P OR *\\.VB OR *\\.VBE OR *\\.VBS OR *\\.VBSCRIPT OR *\\.WS OR *\\.WSF OR *\\.WSH)
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "NewProcessName" as process_name
    | where event_id in ("592", "4688")
    | where parent_process matches "*firefox.exe" or parent_process matches "*chrome.exe" or parent_process matches "*microsoftedge.exe" or parent_process matches "*safari.exe" or parent_process matches "*opera.exe" or parent_process matches "*iexplore.exe" or parent_process matches "*vivaldi.exe" or parent_process matches "*brave.exe" or parent_process matches "*java.exe" or parent_process matches "*flash.exe"
    | where process_name matches "*.BAT" or process_name matches "*.BIN" or process_name matches "*.CMD" or process_name matches "*.COM" or process_name matches "*.CPL" or process_name matches "*.GADGET" or process_name matches "*.INF1" or process_name matches "*.INS" or process_name matches "*.INX" or process_name matches "*.ISU" or process_name matches "*.JOB" or process_name matches "*.JSE" or process_name matches "*.LNK" or process_name matches "*.MSC" or process_name matches "*.MSI" or process_name matches "*.MSP" or process_name matches "*.MST" or process_name matches "*.PAF" or process_name matches "*.PIF" or process_name matches "*.PS1" or process_name matches "*.REG" or process_name matches "*.RGS" or process_name matches "*.SCR" or process_name matches "*.SCT" or process_name matches "*.SHB" or process_name matches "*.SHS" or process_name matches "*.U3P" or process_name matches "*.VB" or process_name matches "*.VBE" or process_name matches "*.VBS" or process_name matches "*.VBSCRIPT" or process_name matches "*.WS" or process_name matches "*.WSF" or process_name matches "*.WSH"
    | fields _messageTime, _sourceHost, event_id, parent_process, process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Parent Process Name is in [firefox.exe, chrome.exe,\
  \ microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe, java.exe, flash.exe]\nWhere the Process Name ends with [.BAT,.BIN,.CMD,.COM,.CPL,.GADGET,.INF1,.INS,.INX,.ISU,.JOB,.JSE,.LNK,.MSC,.MSI,.MSP,.MST,.PAF,.PIF,.PS1,.REG,.RGS,.SCR,.SCT,.SHB,.SHS,.U3P,.VB,.VBE,.VBS,.VBSCRIPT,.WS,.WSF,.WSH]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

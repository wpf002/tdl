rule_id: TDL-EXE-000232
v4_id: '000232'
name: Vulnerable Process Launching Shell
description: Detects when a browser or applications associated with a browser launches a script or shell process on the target host. Browsers
  and other applications such as Java or Flash are commonly targeted by attackers hosting malicious web sites. Malicious scripts on the site will
  automatically exploit vulnerable versions of the software and allow the attacker to execute code or drop files on the host.
tactic: Execution
tactic_id: TA0002
technique_id: T1546
technique_name: Event Triggered Execution
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    index=windows EventCode=4688 (ParentProcessName="*\\firefox.exe" OR ParentProcessName="*\\chrome.exe" OR ParentProcessName="*\\microsoftedge.exe" OR ParentProcessName="*\\safari.exe" OR ParentProcessName="*\\opera.exe" OR ParentProcessName="*\\iexplore.exe" OR ParentProcessName="*\\vivaldi.exe" OR ParentProcessName="*\\brave.exe" OR ParentProcessName="*\\java.exe" OR ParentProcessName="*\\flash.exe") (NewProcessName="*.BAT" OR NewProcessName="*.BIN" OR NewProcessName="*.CMD" OR NewProcessName="*.COM" OR NewProcessName="*.CPL" OR NewProcessName="*.GADGET" OR NewProcessName="*.INF1" OR NewProcessName="*.INS" OR NewProcessName="*.INX" OR NewProcessName="*.ISU" OR NewProcessName="*.JOB" OR NewProcessName="*.JSE" OR NewProcessName="*.LNK" OR NewProcessName="*.MSC" OR NewProcessName="*.MSI" OR NewProcessName="*.MSP" OR NewProcessName="*.MST" OR NewProcessName="*.PAF" OR NewProcessName="*.PIF" OR NewProcessName="*.PS1" OR NewProcessName="*.REG" OR NewProcessName="*.RGS" OR NewProcessName="*.SCR" OR NewProcessName="*.SCT" OR NewProcessName="*.SHB" OR NewProcessName="*.SHS" OR NewProcessName="*.U3P" OR NewProcessName="*.VB" OR NewProcessName="*.VBE" OR NewProcessName="*.VBS" OR NewProcessName="*.VBSCRIPT" OR NewProcessName="*.WS" OR NewProcessName="*.WSF" OR NewProcessName="*.WSH")
    | table _time, ComputerName, ParentProcessName, NewProcessName, CommandLine, SubjectUserName
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('firefox.exe', 'chrome.exe', 'microsoftedge.exe', 'safari.exe',\
    \ 'opera.exe', 'iexplore.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000232 {\n  meta:\n    author = \"TDL\"\n    description = \"Vulnerable Process Launching Shell\"\n    severity =\
    \ \"LOW\"\n    tactic = \"TA0002\"\n    technique = \"T1546\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /(firefox.exe|chrome.exe|microsoftedge.exe|safari.exe|opera.exe|iexplore.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host\
    \ over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (firefox.exe, chrome.exe, microsoftedge.exe, safari.exe, opera.exe, iexplore.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(firefox.exe OR chrome.exe OR microsoftedge.exe OR safari.exe OR opera.exe OR iexplore.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("firefox.exe", "chrome.exe", "microsoftedge.exe", "safari.exe", "opera.exe", "iexplore.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Parent Process Name is in [firefox.exe, chrome.exe,\
  \ microsoftedge.exe, safari.exe, opera.exe, iexplore.exe, vivaldi.exe, brave.exe, java.exe, flash.exe]\nWhere the Process Name ends with [.BAT,.BIN,.CMD,.COM,.CPL,.GADGET,.INF1,.INS,.INX,.ISU,.JOB,.JSE,.LNK,.MSC,.MSI,.MSP,.MST,.PAF,.PIF,.PS1,.REG,.RGS,.SCR,.SCT,.SHB,.SHS,.U3P,.VB,.VBE,.VBS,.VBSCRIPT,.WS,.WSF,.WSH]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

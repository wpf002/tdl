rule_id: TDL-EXE-000245
v4_id: '000245'
name: Recon Commands
description: Detects an attacker that may have compromised an internal host and is now running commands via command prompt or PowerShell in an
  attempt to map the network. This activity has been made as a building block instead of an alert to account for legitimate users that may run
  one off recon commands.
tactic: Execution
tactic_id: TA0002
technique_id: T1005
technique_name: Data from Local System
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows EventCode=4688 (CommandLine="*whoami*" OR CommandLine="*ipconfig*" OR CommandLine="*nestat*" OR CommandLine="*tasklist*"
    OR CommandLine="*ver*" OR CommandLine="*systeminfo*" OR CommandLine="*net time*" OR CommandLine="*net start*" OR CommandLine="*qprocess*"
    OR CommandLine="*query*" OR CommandLine="*dir*" OR CommandLine="*net view*" OR CommandLine="*ping*" OR CommandLine="*net use*" OR CommandLine="*type*"
    OR CommandLine="*net user*" OR CommandLine="*net localgroup*" OR CommandLine="*net group*" OR CommandLine="*net config*" OR CommandLine="*net
    share*")

    | stats count by ComputerName, Account_Name

    | where count >= 2

    | table ComputerName, Account_Name, count

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where CommandLine has_any ("whoami", "ipconfig", "netstat", "tasklist", "ver", "systeminfo", "net time", "net start", "qprocess", "query", "dir", "net view", "ping", "net use", "type", "net user", "net localgroup", "net group", "net config", "net share")
    | summarize CommandCount = dcount(CommandLine), Commands = make_set(CommandLine) by bin(TimeGenerated, 5m), Computer, Account
    | where CommandCount >= 2
    | project TimeGenerated, Computer, Account, CommandCount, Commands
  aql: "SELECT username, sourceip, \"Process CommandLine\", COUNT(*) AS execution_count\nFROM events\nWHERE \"EventID\" IN ('592', '4688')\n \
    \ AND (\"Process CommandLine\" ILIKE '%whoami%' \n    OR \"Process CommandLine\" ILIKE '%ipconfig%' \n    OR \"Process CommandLine\" ILIKE\
    \ '%netstat%' \n    OR \"Process CommandLine\" ILIKE '%tasklist%' \n    OR \"Process CommandLine\" ILIKE '%ver %' \n    OR \"Process CommandLine\"\
    \ ILIKE '%systeminfo%' \n    OR \"Process CommandLine\" ILIKE '%net time%' \n    OR \"Process CommandLine\" ILIKE '%net start%' \n    OR \"\
    Process CommandLine\" ILIKE '%qprocess%' \n    OR \"Process CommandLine\" ILIKE '%query %' \n    OR \"Process CommandLine\" ILIKE '%dir %'\
    \ \n    OR \"Process CommandLine\" ILIKE '%net view%' \n    OR \"Process CommandLine\" ILIKE '%ping %' \n    OR \"Process CommandLine\" ILIKE\
    \ '%net use%' \n    OR \"Process CommandLine\" ILIKE '%type %' \n    OR \"Process CommandLine\" ILIKE '%net user%' \n    OR \"Process CommandLine\"\
    \ ILIKE '%net localgroup%' \n    OR \"Process CommandLine\" ILIKE '%net group%' \n    OR \"Process CommandLine\" ILIKE '%net config%' \n \
    \   OR \"Process CommandLine\" ILIKE '%net share%')\nGROUP BY username, sourceip, \"Process CommandLine\"\nHAVING execution_count >= 2\nLAST\
    \ 1 HOURS\n"
  yara_l: "rule execution_recon_commands {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects multiple Windows reconnaissance\
    \ command executions - MITRE T1005\"\n    mitre_attack_technique = \"T1005\"\n    mitre_attack_tactic = \"Execution\"\n    \n  events:\n \
    \   $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n      $e.metadata.product_event_type\
    \ = \"4688\"\n    )\n    (\n      re.regex($e.principal.process.command_line, `(?i)whoami`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)ipconfig`) or\n      re.regex($e.principal.process.command_line, `(?i)netstat`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)tasklist`) or\n      re.regex($e.principal.process.command_line, `(?i)\\bver\\b`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)systeminfo`) or\n      re.regex($e.principal.process.command_line, `(?i)net\\s+time`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+start`) or\n      re.regex($e.principal.process.command_line, `(?i)qprocess`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)\\bquery\\b`) or\n      re.regex($e.principal.process.command_line, `(?i)\\bdir\\b`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+view`) or\n      re.regex($e.principal.process.command_line, `(?i)ping`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+use`) or\n      re.regex($e.principal.process.command_line, `(?i)\\btype\\b`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+user`) or\n      re.regex($e.principal.process.command_line, `(?i)net\\s+localgroup`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+group`) or\n      re.regex($e.principal.process.command_line, `(?i)net\\s+config`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)net\\s+share`)\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 10m\n    \n  condition:\n    #e >= 2\n}\n"
  esql: "FROM logs-windows.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hours \n  AND (event.code == \"4688\" OR event.code == \"\
    592\")\n  AND (\n    process.command_line LIKE \"*whoami*\" OR\n    process.command_line LIKE \"*ipconfig*\" OR\n    process.command_line\
    \ LIKE \"*netstat*\" OR\n    process.command_line LIKE \"*tasklist*\" OR\n    process.command_line LIKE \"*ver *\" OR\n    process.command_line\
    \ LIKE \"* ver\" OR\n    process.command_line LIKE \"*systeminfo*\" OR\n    process.command_line LIKE \"*net time*\" OR\n    process.command_line\
    \ LIKE \"*net start*\" OR\n    process.command_line LIKE \"*qprocess*\" OR\n    process.command_line LIKE \"*query *\" OR\n    process.command_line\
    \ LIKE \"* query\" OR\n    process.command_line LIKE \"*dir *\" OR\n    process.command_line LIKE \"* dir\" OR\n    process.command_line LIKE\
    \ \"*net view*\" OR\n    process.command_line LIKE \"*ping *\" OR\n    process.command_line LIKE \"* ping\" OR\n    process.command_line LIKE\
    \ \"*net use*\" OR\n    process.command_line LIKE \"*type *\" OR\n    process.command_line LIKE \"* type\" OR\n    process.command_line LIKE\
    \ \"*net user*\" OR\n    process.command_line LIKE \"*net localgroup*\" OR\n    process.command_line LIKE \"*net group*\" OR\n    process.command_line\
    \ LIKE \"*net config*\" OR\n    process.command_line LIKE \"*net share*\"\n  )\n| STATS exec_count = COUNT(*) BY host.name, user.name\n| WHERE\
    \ exec_count >= 2\n| KEEP host.name, user.name, exec_count\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND (process_cmd_line ICONTAINS "whoami" OR process_cmd_line ICONTAINS "ipconfig" OR process_cmd_line ICONTAINS "netstat" OR process_cmd_line ICONTAINS "tasklist" OR process_cmd_line ICONTAINS "ver" OR process_cmd_line ICONTAINS "systeminfo" OR process_cmd_line ICONTAINS "net time" OR process_cmd_line ICONTAINS "net start" OR process_cmd_line ICONTAINS "qprocess" OR process_cmd_line ICONTAINS "query" OR process_cmd_line ICONTAINS "dir" OR process_cmd_line ICONTAINS "net view" OR process_cmd_line ICONTAINS "ping" OR process_cmd_line ICONTAINS "net use" OR process_cmd_line ICONTAINS "type" OR process_cmd_line ICONTAINS "net user" OR process_cmd_line ICONTAINS "net localgroup" OR process_cmd_line ICONTAINS "net group" OR process_cmd_line ICONTAINS "net config" OR process_cmd_line ICONTAINS "net share")) groupby(asset, user) calculate(count)
  crowdstrike: |
    EventCode=4688 (CommandLine=*whoami* OR CommandLine=*ipconfig* OR CommandLine=*netstat* OR CommandLine=*tasklist* OR CommandLine=*ver* OR CommandLine=*systeminfo* OR CommandLine="*net time*" OR CommandLine="*net start*" OR CommandLine=*qprocess* OR CommandLine=*query* OR CommandLine=*dir* OR CommandLine="*net view*" OR CommandLine=*ping* OR CommandLine="*net use*" OR CommandLine=*type* OR CommandLine="*net user*" OR CommandLine="*net localgroup*" OR CommandLine="*net group*" OR CommandLine="*net config*" OR CommandLine="*net share*")
    | groupBy([ComputerName], function=count(as=exec_count))
    | exec_count >= 2
    | table([ComputerName, exec_count])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter action_process_image_command_line ~= "(?i)(whoami|ipconfig|nestat|tasklist|ver|systeminfo|net time|net start|qprocess|query|dir|net view|ping|net use|type|net user|net localgroup|net group|net config|net share)"
    | comp count() as exec_count by agent_hostname, actor_effective_username
    | filter exec_count >= 2
    | fields agent_hostname, actor_effective_username, exec_count
  lucene: |
    event.code:(592 OR 4688) AND (CommandLine:(*whoami* OR *ipconfig* OR *nestat* OR *tasklist* OR *ver* OR *systeminfo* OR "net time" OR "net start" OR *qprocess* OR *query* OR *dir* OR "net view" OR *ping* OR "net use" OR *type* OR "net user" OR "net localgroup" OR "net group" OR "net config" OR "net share") OR process.command_line:(*whoami* OR *ipconfig* OR *nestat* OR *tasklist* OR *ver* OR *systeminfo* OR "net time" OR "net start" OR *qprocess* OR *query* OR *dir* OR "net view" OR *ping* OR "net use" OR *type* OR "net user" OR "net localgroup" OR "net group" OR "net config" OR "net share"))
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "NewProcessName" as process_name
    | where event_id in ("4688", "592")
    | where command_line matches "*whoami*" or command_line matches "*ipconfig*" or command_line matches "*netstat*" or command_line matches "*tasklist*" or command_line matches "*ver*" or command_line matches "*systeminfo*" or command_line matches "*net time*" or command_line matches "*net start*" or command_line matches "*qprocess*" or command_line matches "*query*" or command_line matches "*dir*" or command_line matches "*net view*" or command_line matches "*ping*" or command_line matches "*net use*" or command_line matches "*type*" or command_line matches "*net user*" or command_line matches "*net localgroup*" or command_line matches "*net group*" or command_line matches "*net config*" or command_line matches "*net share*"
    | count as exec_count by _sourceHost, command_line
    | where exec_count >= 2
    | fields _sourceHost, command_line, exec_count
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '2 or more Windows Process Executions

  Where the Event ID is in [592, 4688]

  Where the Command contains one of [whoami, ipconfig, nestat, tasklist, ver, systeminfo, net time, net start, qprocess, query, dir, net view,
  ping, net use, type, net user, net localgroup, net group, net config, net share]'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

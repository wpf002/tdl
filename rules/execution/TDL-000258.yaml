rule_id: TDL-EXE-000258
v4_id: 000258
name: Cobalt Strike Interactive Commands Entered in CMD
description: Detects use of Cobalt Strike interactive commands accidentally entered in the CMD shell. Unsophisticated ransomware operators have
  been observed erroneously entering Cobalt Strike modules into CMD during hands on keyboard operations.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows EventCode=4688 New_Process_Name="*\\cmd.exe" (CommandLine="*psinject*" OR CommandLine="*spawnas*" OR CommandLine="*make_token*"
    OR CommandLine="*remote-exec*" OR CommandLine="*rev2self*" OR CommandLine="*dcsync*" OR CommandLine="*logonpasswords*" OR CommandLine="*execute-assembly*"
    OR CommandLine="*getsystem*")

    | table _time, ComputerName, Account_Name, New_Process_Name, CommandLine, Creator_Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where Process has "cmd.exe"
    | where CommandLine has_any ("psinject","spawnas","make_token","remote-exec","rev2self","dcsync","logonpasswords","execute-assembly","getsystem")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: "SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, \"Process Name\", \"Process CommandLine\", \"Parent Process\
    \ Name\"\nFROM events\nWHERE \"EventID\" IN ('592', '4688')\n  AND \"Process Name\" ILIKE '%cmd.exe%'\n  AND (\"Process CommandLine\" ILIKE\
    \ '%psinject%' \n       OR \"Process CommandLine\" ILIKE '%spawnas%' \n       OR \"Process CommandLine\" ILIKE '%make_token%' \n       OR\
    \ \"Process CommandLine\" ILIKE '%remote-exec%' \n       OR \"Process CommandLine\" ILIKE '%rev2self%' \n       OR \"Process CommandLine\"\
    \ ILIKE '%dcsync%' \n       OR \"Process CommandLine\" ILIKE '%logonpasswords%' \n       OR \"Process CommandLine\" ILIKE '%execute-assembly%'\
    \ \n       OR \"Process CommandLine\" ILIKE '%getsystem%')\nLAST 24 HOURS\n"
  yara_l: |
    rule mitre_t1059_suspicious_cmd_execution {
      meta:
        author = "Detection Engineering"
        description = "Detects suspicious cmd.exe execution with command lines indicative of post-exploitation tools"
        mitre_attack_technique = "T1059"
        mitre_attack_tactic = "Execution"
        severity = "High"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`)
        re.regex($e.target.process.command_line, `(?i)(psinject|spawnas|make_token|remote-exec|rev2self|dcsync|logonpasswords|execute-assembly|getsystem)`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND TO_LOWER(process.name)\
    \ == \"cmd.exe\"\n  AND (process.command_line LIKE \"*psinject*\" \n    OR process.command_line LIKE \"*spawnas*\" \n    OR process.command_line\
    \ LIKE \"*make_token*\" \n    OR process.command_line LIKE \"*remote-exec*\" \n    OR process.command_line LIKE \"*rev2self*\" \n    OR process.command_line\
    \ LIKE \"*dcsync*\" \n    OR process.command_line LIKE \"*logonpasswords*\" \n    OR process.command_line LIKE \"*execute-assembly*\" \n \
    \   OR process.command_line LIKE \"*getsystem*\")\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name,\
    \ process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="cmd.exe" AND (process_cmd_line ICONTAINS "psinject" OR process_cmd_line ICONTAINS "spawnas" OR process_cmd_line ICONTAINS "make_token" OR process_cmd_line ICONTAINS "remote-exec" OR process_cmd_line ICONTAINS "rev2self" OR process_cmd_line ICONTAINS "dcsync" OR process_cmd_line ICONTAINS "logonpasswords" OR process_cmd_line ICONTAINS "execute-assembly" OR process_cmd_line ICONTAINS "getsystem"))
  crowdstrike: |
    EventCode=4688 NewProcessName=*cmd.exe (CommandLine=*psinject* OR CommandLine=*spawnas* OR CommandLine=*make_token* OR CommandLine=*remote-exec* OR CommandLine=*rev2self* OR CommandLine=*dcsync* OR CommandLine=*logonpasswords* OR CommandLine=*execute-assembly* OR CommandLine=*getsystem*)
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, CommandLine, ParentProcessName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "cmd.exe"
    | filter action_process_image_command_line ~= "(?i)(psinject|spawnas|make_token|remote-exec|rev2self|dcsync|logonpasswords|execute-assembly|getsystem)"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:cmd.exe AND process.command_line:(*psinject* OR *spawnas* OR *make_token* OR *remote-exec* OR *rev2self* OR *dcsync* OR *logonpasswords* OR *execute-assembly* OR *getsystem*)
  sumo: |
    _sourceCategory=*Windows* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("592", "4688")
    | where process_name matches "*cmd.exe"
    | where command_line matches "*psinject*" or command_line matches "*spawnas*" or command_line matches "*make_token*" or command_line matches "*remote-exec*" or command_line matches "*rev2self*" or command_line matches "*dcsync*" or command_line matches "*logonpasswords*" or command_line matches "*execute-assembly*" or command_line matches "*getsystem*"
    | fields _messageTime, _sourceHost, event_id, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "cmd.exe"

  AND Command Line contains any of

  "psinject|spawnas|make_token|remote-exec|rev2self|dcsync|logonpasswords|execute-assembly|getsystem"'
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000262
v4_id: '000262'
name: Endpoint Detection - Critical
description: Detects a critical detection within the EDR.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Linux
- Windows
- macOS
data_sources:
- CrowdStrike
- Carbon Black
- SentinelOne
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 95
queries:
  spl: 'index=crowdstrike sourcetype="crowdstrike:event:streams" event_simpleName=DetectionSummaryEvent (SeverityName="Critical" OR Tactic="Falcon
    Overwatch") Tactic!="Malware" Tactic!="Machine Learning" Tactic!="Ransomware"

    | table _time, ComputerName, SeverityName, Tactic, Technique, DetectDescription, UserName, FileName, CommandLine

    '
  kql: |
    CrowdStrikeDetectionSummaryEvent
    | where SeverityName == "Critical" or Tactic == "Falcon Overwatch"
    | where Tactic !in ("Malware", "Machine Learning", "Ransomware")
    | project TimeGenerated, ComputerName, SeverityName, Tactic, DetectionId, FileName, CommandLine, UserName
  aql: "SELECT DATEFORMAT(eventtime, 'yyyy-MM-dd HH:mm:ss') AS event_time, \n       LOGSOURCENAME(logsourceid) AS log_source, \n       \"SeverityName\"\
    , \n       \"Tactic\", \n       \"DetectionId\", \n       \"ComputerName\", \n       \"UserName\", \n       \"FileName\", \n       \"CommandLine\"\
    \nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%CrowdStrike%'\n  AND (\n    \"SeverityName\" = 'Critical'\n    OR \"Tactic\" = 'Falcon\
    \ Overwatch'\n  )\n  AND \"Tactic\" != 'Malware'\n  AND \"Tactic\" != 'Machine Learning'\n  AND \"Tactic\" != 'Ransomware'\nLAST 24 HOURS\n"
  yara_l: |
    rule crowdstrike_critical_overwatch_detection {
      meta:
        author = "Detection Engineering"
        description = "Detects CrowdStrike Critical severity or Falcon Overwatch detections excluding Malware, ML, and Ransomware tactics"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.vendor_name = "CrowdStrike"
        $e.metadata.product_event_type = "DetectionSummaryEvent"
        (
          $e.security_result.severity = "CRITICAL"
          or
          $e.security_result.detection_fields["Tactic"] = "Falcon Overwatch"
        )
        $e.security_result.detection_fields["Tactic"] != "Malware"
        $e.security_result.detection_fields["Tactic"] != "Machine Learning"
        $e.security_result.detection_fields["Tactic"] != "Ransomware"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-crowdstrike.falcon*
    | WHERE event.kind == "alert" AND event.dataset == "crowdstrike.falcon"
    | WHERE (crowdstrike.event.SeverityName == "Critical" OR crowdstrike.event.Tactic == "Falcon Overwatch")
      AND crowdstrike.event.Tactic != "Malware"
      AND crowdstrike.event.Tactic != "Machine Learning"
      AND crowdstrike.event.Tactic != "Ransomware"
    | KEEP @timestamp, host.name, user.name, crowdstrike.event.SeverityName, crowdstrike.event.Tactic, crowdstrike.event.DetectionSummary, event.id
  leql: |
    where(source_json.DetectionSummaryEvent EXISTS AND (source_json.SeverityName="Critical" OR source_json.Tactic="Falcon Overwatch") AND source_json.Tactic!="Malware" AND source_json.Tactic!="Machine Learning" AND source_json.Tactic!="Ransomware")
  crowdstrike: |
    event_simpleName=DetectionSummaryEvent (SeverityName=Critical OR Tactic="Falcon Overwatch") Tactic!=Malware Tactic!="Machine Learning" Tactic!=Ransomware
    | table([@timestamp, ComputerName, DetectName, Tactic, Technique, SeverityName, FileName, CommandLine])
  xql: "dataset = crowdstrike_detectionsummaryevent_raw\n| filter (severity_name = \"Critical\" or tactic = \"Falcon Overwatch\") \n  and tactic\
    \ != \"Malware\" \n  and tactic != \"Machine Learning\" \n  and tactic != \"Ransomware\"\n| fields _time, agent_hostname, detection_id, severity_name,\
    \ tactic, technique, user_name, computer_name, file_name, command_line\n"
  lucene: |
    event_simpleName:DetectionSummaryEvent AND (SeverityName:"Critical" OR Tactic:"Falcon Overwatch") AND NOT Tactic:"Malware" AND NOT Tactic:"Machine Learning" AND NOT Tactic:"Ransomware"
  sumo: |
    _sourceCategory=*CrowdStrike* DetectionSummaryEvent
    | json field=_raw "SeverityName" as severity_name
    | json field=_raw "Tactic" as tactic
    | where (severity_name = "Critical" OR tactic = "Falcon Overwatch") AND tactic != "Malware" AND tactic != "Machine Learning" AND tactic != "Ransomware"
    | fields _messageTime, _sourceHost, severity_name, tactic
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 CrowdStrike DetectionSummaryEvent

  Where the SeverityName is ''Critical''

  OR

  Where the Tactic is ''Falcon Overwatch''

  AND

  Where the Tactic is not ''Malware''

  Where the Tactic is not ''Machine Learning''

  Where the Tactic is not ''Ransomware'''
suppression:
  window: 4 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

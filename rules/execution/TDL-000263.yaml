rule_id: TDL-EXE-000263
v4_id: '000263'
name: Endpoint Detection - High
description: Detects a high detection within the EDR.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Linux
- Windows
- macOS
data_sources:
- CrowdStrike
- Carbon Black
- SentinelOne
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=crowdstrike sourcetype="crowdstrike:events:detections" event_simpleName=DetectionSummaryEvent SeverityName=High Tactic!=Malware
    Tactic!="Machine Learning" Tactic!=Ransomware

    | table _time, ComputerName, SeverityName, Tactic, Technique, FileName, UserName, CommandLine

    '
  kql: |
    CommonSecurityLog
    | where DeviceVendor == "CrowdStrike"
    | where DeviceEventClassID == "DetectionSummaryEvent"
    | where LogSeverity == "High"
    | where DeviceCustomString2 !in ("Malware", "Machine Learning", "Ransomware")
    | project TimeGenerated, DeviceVendor, DeviceProduct, DeviceEventClassID, LogSeverity, Tactic=DeviceCustomString2, SourceHostName, SourceUserName, Message, DeviceCustomString1, DeviceCustomString3, DeviceCustomString4, DeviceCustomString5, DeviceCustomString6
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "SeverityName", "Tactic", "DetectName", "DetectDescription", sourceip, username
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%crowdstrike%'
      AND "SeverityName" = 'High'
      AND "Tactic" IS NOT NULL
      AND "Tactic" NOT IN ('Malware', 'Machine Learning', 'Ransomware')
    LAST 1 HOURS
  yara_l: |
    rule crowdstrike_high_severity_user_execution {
      meta:
        author = "TDL"
        description = "Detects CrowdStrike high severity detections related to user execution (T1204), excluding Malware/ML/Ransomware tactics"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.vendor_name = "CrowdStrike"
        $e.metadata.product_name = "CrowdStrike"
        $e.metadata.product_event_type = "DetectionSummaryEvent"
        $e.security_result.severity = "HIGH"
        not re.regex($e.security_result.category_details, `(?i)Malware`)
        not re.regex($e.security_result.category_details, `(?i)Machine Learning`)
        not re.regex($e.security_result.category_details, `(?i)Ransomware`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = max(85)
        $severity = array_distinct($e.security_result.severity)
        $event_count = count_distinct($e.metadata.id)

      condition:
        $e
    }
  esql: "FROM logs-crowdstrike*\n| WHERE event.dataset == \"crowdstrike.detection_summary\" \n  AND event.severity_name == \"High\"\n  AND crowdstrike.event.Tactic\
    \ NOT IN (\"Malware\", \"Machine Learning\", \"Ransomware\")\n| KEEP @timestamp, host.name, user.name, crowdstrike.event.DetectDescription,\
    \ crowdstrike.event.Tactic, crowdstrike.event.Technique, event.severity_name, process.name, process.command_line\n"
  leql: |
    where(source_json.SeverityName="High" AND source_json.Tactic!="Malware" AND source_json.Tactic!="Machine Learning" AND source_json.Tactic!="Ransomware")
  crowdstrike: |
    event_simpleName=DetectionSummaryEvent SeverityName=High
    | Tactic!=Malware AND Tactic!="Machine Learning" AND Tactic!=Ransomware
    | table([@timestamp, ComputerName, UserName, DetectDescription, Tactic, Technique, FileName, CommandLine, SHA256HashData])
  xql: "dataset = crowdstrike_detections_raw\n| filter SeverityName = \"High\" \n  and Tactic != \"Malware\" \n  and Tactic != \"Machine Learning\"\
    \ \n  and Tactic != \"Ransomware\"\n| fields _time, aid, ComputerName, DetectName, DetectDescription, Tactic, Technique, SeverityName, UserName,\
    \ FileName, FilePath, CommandLine\n"
  lucene: |
    event_simpleName:DetectionSummaryEvent AND SeverityName:High AND NOT Tactic:(Malware OR "Machine Learning" OR Ransomware)
  sumo: |
    _sourceCategory=*CrowdStrike* DetectionSummaryEvent
    | json field=_raw "SeverityName" as severity_name
    | json field=_raw "Tactic" as tactic
    | where severity_name = "High"
    | where !(tactic in ("Malware", "Machine Learning", "Ransomware"))
    | fields _messageTime, _sourceHost, severity_name, tactic
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 CrowdStrike DetectionSummaryEvent

  Where the SeverityName is ''High''

  AND

  Where the Tactic is not ''Malware''

  Where the Tactic is not ''Machine Learning''

  Where the Tactic is not ''Ransomware'''
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

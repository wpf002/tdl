rule_id: TDL-EXE-000264
v4_id: '000264'
name: Endpoint Detection - Low
description: Detects a low detection within the EDR.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Linux
- Windows
- macOS
data_sources:
- CrowdStrike
- Carbon Black
- SentinelOne
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=crowdstrike sourcetype=CrowdStrikeDetectionSummary SeverityName=Low Tactic!=Malware Tactic!="Machine Learning" Tactic!=Ransomware

    | table _time, ComputerName, DetectName, Tactic, Technique, FileName, CommandLine, UserName

    '
  kql: |
    CommonSecurityLog
    | where DeviceVendor == "CrowdStrike"
    | where DeviceEventClassID == "DetectionSummaryEvent"
    | where DeviceCustomString2 == "Low"
    | where DeviceCustomString1 !in ("Malware", "Machine Learning", "Ransomware")
    | project TimeGenerated, DeviceName, SourceUserName, DeviceCustomString1, DeviceCustomString2, Message, DeviceAction
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS endpoint, sourceip, "SeverityName", "Tactic", "DetectionDescription", COUNT(*) AS detection_count
    FROM events
    WHERE QIDNAME(qid) ILIKE '%DetectionSummaryEvent%'
      AND "SeverityName" = 'Low'
      AND "Tactic" NOT IN ('Malware', 'Machine Learning', 'Ransomware')
    GROUP BY LOGSOURCENAME(logsourceid), sourceip, "SeverityName", "Tactic", "DetectionDescription"
    LAST 24 HOURS
  yara_l: |
    rule crowdstrike_low_severity_detection_t1204 {
      meta:
        author = "TDL"
        description = "Detects CrowdStrike low severity detections excluding Malware, Machine Learning, and Ransomware tactics - T1204 User Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Low"

      events:
        $e.metadata.vendor_name = "CrowdStrike"
        $e.metadata.product_event_type = "DetectionSummaryEvent"
        $e.security_result.severity = "LOW"
        not re.regex($e.security_result.category_details, `(?i)Malware`)
        not re.regex($e.security_result.category_details, `(?i)Machine Learning`)
        not re.regex($e.security_result.category_details, `(?i)Ransomware`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-crowdstrike*\n| WHERE event.type == \"DetectionSummaryEvent\" \n  AND event.severity == \"Low\"\n  AND event.category NOT IN\
    \ (\"Malware\", \"Machine Learning\", \"Ransomware\")\n| KEEP @timestamp, host.name, user.name, event.id, event.action, event.reason, process.name,\
    \ process.command_line, file.name, file.path\n"
  leql: |
    where(source_json.SeverityName="Low" AND source_json.Tactic!="Malware" AND source_json.Tactic!="Machine Learning" AND source_json.Tactic!="Ransomware")
  crowdstrike: |
    event_simpleName=DetectionSummaryEvent SeverityName=Low
    | Tactic!=Malware AND Tactic!="Machine Learning" AND Tactic!=Ransomware
    | table([@timestamp, ComputerName, UserName, Tactic, Technique, DetectName, DetectDescription, SeverityName])
  xql: |
    dataset = crowdstrike_detections_raw
    | filter severity_name = "Low"
    | filter tactic != "Malware" and tactic != "Machine Learning" and tactic != "Ransomware"
    | fields _time, agent_hostname, tactic, technique, detection_id, severity_name, description
  lucene: |
    event_simpleName:DetectionSummaryEvent AND SeverityName:Low AND NOT Tactic:(Malware OR "Machine Learning" OR Ransomware)
  sumo: |
    _sourceCategory=*CrowdStrike* DetectionSummaryEvent
    | json field=_raw "SeverityName" as severity
    | json field=_raw "Tactic" as tactic
    | where severity = "Low"
    | where !(tactic in ("Malware", "Machine Learning", "Ransomware"))
    | fields _messageTime, _sourceHost, severity, tactic
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 CrowdStrike DetectionSummaryEvent

  Where the SeverityName is ''Low''

  AND

  Where the Tactic is not ''Malware''

  Where the Tactic is not ''Machine Learning''

  Where the Tactic is not ''Ransomware'''
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

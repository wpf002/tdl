rule_id: TDL-EXE-000265
v4_id: '000265'
name: Endpoint Detection - Medium
description: Detects a medium detection within the EDR.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Linux
- Windows
- macOS
data_sources:
- CrowdStrike
- Carbon Black
- SentinelOne
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=crowdstrike sourcetype=CrowdStrikeDetectionSummaryEvent SeverityName="Medium" Tactic!=Malware Tactic!="Machine Learning" Tactic!=Ransomware

    | table _time, host, SeverityName, Tactic, Technique, FileName, CommandLine, UserName

    '
  kql: |
    CommonSecurityLog
    | where DeviceVendor == "CrowdStrike"
    | where DeviceEventClassID == "DetectionSummaryEvent"
    | where LogSeverity == "Medium"
    | where AdditionalExtensions !has "Tactic=Malware"
    | where AdditionalExtensions !has "Tactic=Machine Learning"
    | where AdditionalExtensions !has "Tactic=Ransomware"
    | project TimeGenerated, DeviceName, SourceUserName, DeviceEventClassID, LogSeverity, AdditionalExtensions, Message
  aql: |
    SELECT eventtime, "SeverityName", "Tactic", sourceip, destinationip, LOGSOURCENAME(logsourceid) AS log_source, categoryname(category) AS event_category, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%CrowdStrike%'
      AND (qidname(qid) ILIKE '%DetectionSummaryEvent%' OR categoryname(category) ILIKE '%DetectionSummary%')
      AND "SeverityName" = 'Medium'
      AND "Tactic" NOT IN ('Malware', 'Machine Learning', 'Ransomware')
    GROUP BY eventtime, "SeverityName", "Tactic", sourceip, destinationip, logsourceid, category
    LAST 1 HOURS
  yara_l: "rule crowdstrike_medium_severity_non_malware_detection {\n  meta:\n    author = \"TDL\"\n    description = \"CrowdStrike medium severity\
    \ detections excluding malware/ML/ransomware tactics\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1204\"\n\
    \    severity = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"CrowdStrike\"\n    $e.metadata.product_name = \"CrowdStrike\"\
    \n    $e.metadata.product_event_type = \"DetectionSummaryEvent\"\n    $e.security_result.severity = \"MEDIUM\"\n    not re.regex($e.security_result.category_details,\
    \ `(?i)malware`)\n    not re.regex($e.security_result.category_details, `(?i)machine.?learning`)\n    not re.regex($e.security_result.category_details,\
    \ `(?i)ransomware`)\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = max(50)\n \
    \   $event_count = count_distinct($e.metadata.id)\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-crowdstrike*
    | WHERE event.type == "DetectionSummaryEvent" AND event.severity == "Medium" AND event.category NOT IN ("Malware", "Machine Learning", "Ransomware")
    | KEEP @timestamp, host.name, user.name, event.action, event.reason, process.name, process.command_line, file.name, file.path
  leql: |
    where(source_json.SeverityName="Medium" AND source_json.Tactic!="Malware" AND source_json.Tactic!="Machine Learning" AND source_json.Tactic!="Ransomware")
  crowdstrike: |
    event_simpleName=DetectionSummaryEvent SeverityName=Medium
    | Tactic!=Malware AND Tactic!="Machine Learning" AND Tactic!=Ransomware
    | table([@timestamp, ComputerName, DetectName, Tactic, Technique, FileName, UserName, SHA256HashData])
  xql: |
    dataset = crowdstrike_falcon_detections_raw
    | filter lowercase(severity) = "medium"
      and lowercase(tactic) != "malware"
      and lowercase(tactic) != "machine learning"
      and lowercase(tactic) != "ransomware"
    | fields _time, detection_id, tactic, technique, severity, device_id, user_name, file_name, command_line
  lucene: |
    event_simpleName:DetectionSummaryEvent AND SeverityName:Medium AND NOT Tactic:(Malware OR "Machine Learning" OR Ransomware)
  sumo: |
    _sourceCategory=*CrowdStrike* DetectionSummaryEvent
    | json field=_raw "SeverityName" as severity_name
    | json field=_raw "Tactic" as tactic
    | where severity_name = "Medium"
    | where !(tactic in ("Malware", "Machine Learning", "Ransomware"))
    | fields _messageTime, _sourceHost, severity_name, tactic
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 CrowdStrike DetectionSummaryEvent

  Where the SeverityName is ''Medium''

  AND

  Where the Tactic is not ''Malware''

  Where the Tactic is not ''Machine Learning''

  Where the Tactic is not ''Ransomware'''
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

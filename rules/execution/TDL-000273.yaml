rule_id: TDL-EXE-000273
v4_id: '000273'
name: Cobalt Strike Module Commands Entered in CMD
description: Detects use of Cobalt Strike module commands accidentally entered in the CMD shell. Unsophisticated ransomware operators have been
  observed erroneously entering Cobalt Strike modules into CMD during hands on keyboard operations.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows EventCode IN (592, 4688) Process_Name="*\\cmd.exe" (CommandLine="*invoke-userhunter*" OR CommandLine="*invoke-sharefinder*"
    OR CommandLine="*invoke-kerberoast*" OR CommandLine="*invoke-smbautobrute*" OR CommandLine="*invoke-nightmare*" OR CommandLine="*zerologon*"
    OR CommandLine="*av_query*")

    | table _time, ComputerName, User, Process_Name, CommandLine, Parent_Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where Process endswith "\\cmd.exe"
    | where CommandLine has_any ("invoke-userhunter","invoke-sharefinder","invoke-kerberoast","invoke-smbautobrute","invoke-nightmare","zerologon","av_query")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", sourceip
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%cmd.exe%'
      AND ("Process CommandLine" ILIKE '%invoke-userhunter%'
           OR "Process CommandLine" ILIKE '%invoke-sharefinder%'
           OR "Process CommandLine" ILIKE '%invoke-kerberoast%'
           OR "Process CommandLine" ILIKE '%invoke-smbautobrute%'
           OR "Process CommandLine" ILIKE '%invoke-nightmare%'
           OR "Process CommandLine" ILIKE '%zerologon%'
           OR "Process CommandLine" ILIKE '%av_query%')
    LAST 24 HOURS
  yara_l: |
    rule malicious_cmd_powershell_techniques {
      meta:
        author = "TDL"
        description = "Detects execution of malicious PowerShell-style commands via cmd.exe - T1059"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1059"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        ($e.metadata.product_event_type = "592" or $e.metadata.product_event_type = "4688")
        re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`)
        re.regex($e.target.process.command_line, `(?i)(invoke-userhunter|invoke-sharefinder|invoke-kerberoast|invoke-smbautobrute|invoke-nightmare|zerologon|av_query)`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND TO_LOWER(process.name)\
    \ == \"cmd.exe\"\n  AND (TO_LOWER(process.command_line) LIKE \"*invoke-userhunter*\"\n    OR TO_LOWER(process.command_line) LIKE \"*invoke-sharefinder*\"\
    \n    OR TO_LOWER(process.command_line) LIKE \"*invoke-kerberoast*\"\n    OR TO_LOWER(process.command_line) LIKE \"*invoke-smbautobrute*\"\
    \n    OR TO_LOWER(process.command_line) LIKE \"*invoke-nightmare*\"\n    OR TO_LOWER(process.command_line) LIKE \"*zerologon*\"\n    OR TO_LOWER(process.command_line)\
    \ LIKE \"*av_query*\")\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name="cmd.exe" AND (process_cmd_line ICONTAINS "invoke-userhunter" OR process_cmd_line ICONTAINS "invoke-sharefinder" OR process_cmd_line ICONTAINS "invoke-kerberoast" OR process_cmd_line ICONTAINS "invoke-smbautobrute" OR process_cmd_line ICONTAINS "invoke-nightmare" OR process_cmd_line ICONTAINS "zerologon" OR process_cmd_line ICONTAINS "av_query"))
  crowdstrike: |
    EventCode=4688 FileName=cmd.exe (CommandLine=*invoke-userhunter* OR CommandLine=*invoke-sharefinder* OR CommandLine=*invoke-kerberoast* OR CommandLine=*invoke-smbautobrute* OR CommandLine=*invoke-nightmare* OR CommandLine=*zerologon* OR CommandLine=*av_query*)
    | table([@timestamp, ComputerName, UserName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "cmd.exe"
    | filter lowercase(action_process_image_command_line) ~= "invoke-userhunter|invoke-sharefinder|invoke-kerberoast|invoke-smbautobrute|invoke-nightmare|zerologon|av_query"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:4688 AND process.name:"cmd.exe" AND process.command_line:(/.*invoke-userhunter.*/i OR /.*invoke-sharefinder.*/i OR /.*invoke-kerberoast.*/i OR /.*invoke-smbautobrute.*/i OR /.*invoke-nightmare.*/i OR /.*zerologon.*/i OR /.*av_query.*/i)
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("4688", "592")
    | where process_name matches "*cmd.exe"
    | where command_line matches "*invoke-userhunter*" or command_line matches "*invoke-sharefinder*" or command_line matches "*invoke-kerberoast*" or command_line matches "*invoke-smbautobrute*" or command_line matches "*invoke-nightmare*" or command_line matches "*zerologon*" or command_line matches "*av_query*"
    | fields _messageTime, _sourceHost, event_id, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "cmd.exe"

  AND Command Line contains any of

  "invoke-userhunter|invoke-sharefinder|invoke-kerberoast|invoke-smbautobrute|invoke-nightmare|zerologon|av_query"'
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

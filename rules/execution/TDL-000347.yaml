rule_id: TDL-EXE-000347
v4_id: '000347'
name: Command Executed Within Kube-System Namespace - GuardDuty
description: Detects when a command is executed within the kube-system namespace. The kube-system namespace is a default namespace, which is primarily
  used for system level components such as kube-dns and kube-proxy. It is very uncommon to execute commands inside pods or containers under kube-system
  namespace and may indicate suspicious activity.
tactic: Execution
tactic_id: TA0002
technique_id: T1609
technique_name: Container Administration Command
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatch:guardduty eventType="Execution:Kubernetes/ExecInKubeSystemPod"

    | table _time, eventType, title, severity, resource.eksClusterDetails.name, resource.kubernetesDetails.kubernetesUserDetails.username, resource.kubernetesDetails.kubernetesWorkloadDetails.name,
    resource.kubernetesDetails.kubernetesWorkloadDetails.namespace, accountId, region

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title == "Execution:Kubernetes/ExecInKubeSystemPod"
    | project TimeGenerated, Title, Description, AccountId, Region, ResourceType, Severity, AwsResourceId = tostring(Resource.ResourceType), AdditionalData = parse_json(Service)
  aql: |
    SELECT eventtime, sourceip, destinationip, username, qidname(qid), categoryname(category), LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND (qidname(qid) ILIKE '%Execution:Kubernetes/ExecInKubeSystemPod%' OR categoryname(category) ILIKE '%Execution:Kubernetes/ExecInKubeSystemPod%' OR "Finding Type" = 'Execution:Kubernetes/ExecInKubeSystemPod')
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_exec_in_kubesystem_pod {
      meta:
        author = "TDL"
        description = "Detects execution in kube-system pods via GuardDuty"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1609"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        $e.metadata.product_event_type = "Execution:Kubernetes/ExecInKubeSystemPod"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action IN ("Execution:Kubernetes/ExecInKubeSystemPod")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.action, cloud.provider, aws.guardduty.severity, aws.guardduty.resource.kubernetes_details.kubernetes_user_details.username, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.namespace
  leql: |
    where(source_json.type="Execution:Kubernetes/ExecInKubeSystemPod")
  crowdstrike: |
    #type=aws:guardduty finding.type="Execution:Kubernetes/ExecInKubeSystemPod"
    | table([@timestamp, finding.type, resource.resourceType, resource.eksClusterDetails.name, service.action.kubernetesDetails.userDetails.username, resource.kubernetesDetails.kubernetesWorkloadDetails.name, resource.kubernetesDetails.kubernetesWorkloadDetails.namespace])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and product = "GuardDuty"
    | filter lowercase(event_type) in ("execution:kubernetes/execinkubesystempod")
    | fields _time, actor_effective_username, cloud_provider_account_id, cloud_provider_region, event_type, event_description, resource_name
  lucene: |
    event.type:"Execution:Kubernetes/ExecInKubeSystemPod"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Execution:Kubernetes/ExecInKubeSystemPod")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Kubernetes/ExecInKubeSystemPod\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

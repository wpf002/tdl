rule_id: TDL-EXE-000355
v4_id: '000355'
name: AWS Suspicious File Detected  - GuardDuty
description: Detects a suspicious file is found within the AWS enviroment
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=guardduty sourcetype=aws:cloudwatchlogs:guardduty \n(detail.type=\"Execution:Container/SuspiciousFile\" OR detail.type=\"Execution:EC2/SuspiciousFile\"\
    \ OR detail.type=\"Execution:ECS/SuspiciousFile\" OR detail.type=\"Execution:Kubernetes/SuspiciousFile\")\n| table _time, detail.type, detail.resource.instanceDetails.instanceId,\
    \ detail.resource.containerDetails.name, detail.resource.eksClusterDetails.name, detail.resource.ecsClusterDetails.name, detail.accountId,\
    \ detail.region, detail.severity, detail.description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("Execution:Container/SuspiciousFile", "Execution:EC2/SuspiciousFile", "Execution:ECS/SuspiciousFile", "Execution:Kubernetes/SuspiciousFile")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS log_source, "aws.guardduty.type" AS event_type, "aws.guardduty.resource.instanceDetails.instanceId" AS instance_id, "aws.guardduty.resource.eksClusterDetails.name" AS eks_cluster, "aws.guardduty.resource.ecsClusterDetails.name" AS ecs_cluster, "aws.guardduty.resource.containerDetails.name" AS container_name, "aws.guardduty.title" AS title, "aws.guardduty.severity" AS severity, eventtime
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%guardduty%'
      AND "aws.guardduty.type" IN ('Execution:Container/SuspiciousFile', 'Execution:EC2/SuspiciousFile', 'Execution:ECS/SuspiciousFile', 'Execution:Kubernetes/SuspiciousFile')
    LAST 1 HOURS
  yara_l: |
    rule aws_guardduty_suspicious_file_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for suspicious file execution across Container, EC2, ECS, and Kubernetes"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Execution:Container/SuspiciousFile" or
          $e.metadata.product_event_type = "Execution:EC2/SuspiciousFile" or
          $e.metadata.product_event_type = "Execution:ECS/SuspiciousFile" or
          $e.metadata.product_event_type = "Execution:Kubernetes/SuspiciousFile"
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.kind == "alert" AND event.action IN ("Execution:Container/SuspiciousFile", "Execution:EC2/SuspiciousFile", "Execution:ECS/SuspiciousFile", "Execution:Kubernetes/SuspiciousFile")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.action, event.severity, aws.guardduty.resource.*, host.name, container.name, cloud.instance.id
  leql: |
    where(source_json.type IN ["Execution:Container/SuspiciousFile", "Execution:EC2/SuspiciousFile", "Execution:ECS/SuspiciousFile", "Execution:Kubernetes/SuspiciousFile"])
  crowdstrike: |
    #type=aws:guardduty (finding.type="Execution:Container/SuspiciousFile" OR finding.type="Execution:EC2/SuspiciousFile" OR finding.type="Execution:ECS/SuspiciousFile" OR finding.type="Execution:Kubernetes/SuspiciousFile")
    | table([@timestamp, finding.type, resource.resourceType, resource.instanceDetails.instanceId, service.action.actionType, finding.severity, finding.description])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and raw_log_json.service.serviceName = "guardduty"
    | filter raw_log_json.type in ("Execution:Container/SuspiciousFile", "Execution:EC2/SuspiciousFile", "Execution:ECS/SuspiciousFile", "Execution:Kubernetes/SuspiciousFile")
    | fields _time, raw_log_json.type, raw_log_json.severity, raw_log_json.resource.instanceDetails.instanceId, raw_log_json.resource.containerDetails.name, raw_log_json.resource.eksClusterDetails.name, raw_log_json.resource.ecsClusterDetails.name, raw_log_json.title, raw_log_json.description
  lucene: |
    event.type:"GuardDuty Finding" AND finding.type:("Execution:Container/SuspiciousFile" OR "Execution:EC2/SuspiciousFile" OR "Execution:ECS/SuspiciousFile" OR "Execution:Kubernetes/SuspiciousFile")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "detail.type" as event_type
    | where event_type in ("Execution:Container/SuspiciousFile", "Execution:EC2/SuspiciousFile", "Execution:ECS/SuspiciousFile", "Execution:Kubernetes/SuspiciousFile")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Container/SuspiciousFile\", \"Execution:EC2/SuspiciousFile\", \"Execution:ECS/SuspiciousFile\"\
  , \"Execution:Kubernetes/SuspiciousFile\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

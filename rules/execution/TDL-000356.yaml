rule_id: TDL-EXE-000356
v4_id: '000356'
name: AWS High Severity Malicious File Detected  - GuardDuty
description: Detects when a high severity mlaicious file is found within the AWS enviroment
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=* sourcetype=\"aws:cloudwatch:guardduty\" OR sourcetype=\"aws:guardduty\" \n(finding.type=\"Execution:Container/MaliciousFile\"\
    \ OR finding.type=\"Execution:EC2/MaliciousFile\" OR finding.type=\"Execution:ECS/MaliciousFile\" OR finding.type=\"Execution:Kubernetes/MaliciousFile\"\
    \ OR finding.type=\"Execution:Runtime/MaliciousFileExecuted\" OR finding.type=\"Object:S3/MaliciousFile\")\n(finding.severity=7 OR finding.severity=8\
    \ OR finding.severity=9 OR finding.severity=10)\n| table _time, finding.type, finding.severity, finding.accountId, finding.region, finding.resource.instanceDetails.instanceId,\
    \ finding.resource.resourceType, finding.title, finding.description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | where Severity in (7, 8, 9, 10)
    | project TimeGenerated, Type, Severity, Title, Description, AccountId, Region, ResourceType, ResourceId, ServiceName, FindingId
  aql: |
    SELECT QIDNAME(qid) AS event_name, "finding.type" AS finding_type, "finding.severity" AS severity, "resource.resourceType" AS resource_type, sourceip, destinationip, username, eventtime
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%guardduty%'
      AND "finding.type" IN ('Execution:Container/MaliciousFile', 'Execution:EC2/MaliciousFile', 'Execution:ECS/MaliciousFile', 'Execution:Kubernetes/MaliciousFile', 'Execution:Runtime/MaliciousFileExecuted', 'Object:S3/MaliciousFile')
      AND "finding.severity" IN (7, 8, 9, 10)
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_malicious_file_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for malicious file execution across multiple service types with high severity"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "AWS GuardDuty"
        $e.metadata.product_event_type in [
          "Execution:Container/MaliciousFile",
          "Execution:EC2/MaliciousFile",
          "Execution:ECS/MaliciousFile",
          "Execution:Kubernetes/MaliciousFile",
          "Execution:Runtime/MaliciousFileExecuted",
          "Object:S3/MaliciousFile"
        ]
        $e.security_result.severity in ["HIGH", "CRITICAL"]
        $e.security_result.severity_details >= 7
        $e.security_result.severity_details <= 10
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.guardduty*\n| WHERE event.type == \"guardduty\" \n  AND event.action IN (\"Execution:Container/MaliciousFile\", \"Execution:EC2/MaliciousFile\"\
    , \"Execution:ECS/MaliciousFile\", \"Execution:Kubernetes/MaliciousFile\", \"Execution:Runtime/MaliciousFileExecuted\", \"Object:S3/MaliciousFile\"\
    )\n  AND event.severity IN (7, 8, 9, 10)\n| KEEP @timestamp, cloud.account.id, cloud.region, event.action, event.severity, aws.guardduty.finding_id,\
    \ aws.guardduty.resource.instance_details.instance_id, aws.guardduty.resource.container_details.name, aws.guardduty.resource.eks_cluster_details.name,\
    \ aws.guardduty.resource.s3_bucket_details.name\n"
  leql: |
    where(source_json.type IN ["Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile"] AND source_json.severity IN [7, 8, 9, 10])
  crowdstrike: |
    #repo=* #type=guardduty
    | event.type in [regex="Execution:Container/MaliciousFile|Execution:EC2/MaliciousFile|Execution:ECS/MaliciousFile|Execution:Kubernetes/MaliciousFile|Execution:Runtime/MaliciousFileExecuted|Object:S3/MaliciousFile"]
    | severity >= 7
    | table([@timestamp, event.type, severity, accountId, region, resource.instanceDetails.instanceId, service.additionalInfo])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logname = "GuardDuty"
    | filter action_type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | filter severity in (7, 8, 9, 10)
    | fields _time, action_type, severity, action_resource_type, action_resource_cloud_provider_tags_content, action_resource_cloud_provider_account_id, action_country
  lucene: |
    event.dataset:aws.guardduty AND event.type:Execution* AND finding.type:("Execution:Container/MaliciousFile" OR "Execution:EC2/MaliciousFile" OR "Execution:ECS/MaliciousFile" OR "Execution:Kubernetes/MaliciousFile" OR "Execution:Runtime/MaliciousFileExecuted" OR "Object:S3/MaliciousFile") AND event.severity:[7 TO 10]
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | json field=_raw "severity" as severity
    | where event_type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | where severity >= 7 and severity <= 10
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Container/MaliciousFile\", \"Execution:EC2/MaliciousFile\", \"Execution:ECS/MaliciousFile\"\
  , \"Execution:Kubernetes/MaliciousFile\", \"Execution:Runtime/MaliciousFileExecuted\", \"Object:S3/MaliciousFile\"]\nWhere the severity is in\
  \ [7,8,9,10]"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000357
v4_id: '000357'
name: AWS Medium Severity Malicious File Detected  - GuardDuty
description: Detects when a medium severity mlaicious file is found within the AWS enviroment
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"Execution:Container/MaliciousFile\" OR type=\"Execution:EC2/MaliciousFile\" OR\
    \ type=\"Execution:ECS/MaliciousFile\" OR type=\"Execution:Kubernetes/MaliciousFile\" OR type=\"Execution:Runtime/MaliciousFileExecuted\"\
    \ OR type=\"Object:S3/MaliciousFile\")\n(severity=3 OR severity=4 OR severity=5 OR severity=6)\n| table _time, type, severity, title, description,\
    \ region, accountId, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, service.action.awsApiCallAction.api, service.action.awsApiCallAction.serviceName\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | where Severity in (3, 4, 5, 6)
    | project TimeGenerated, Type, Severity, Title, Description, AccountId, Region, ResourceType, ResourceId, ServiceAction
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "finding.type" AS event_type, "finding.severity" AS severity, "resource.instanceDetails.instanceId" AS instance_id, "resource.resourceType" AS resource_type, "service.action.actionType" AS action_type, sourceip, destinationip
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "finding.type" IN ('Execution:Container/MaliciousFile', 'Execution:EC2/MaliciousFile', 'Execution:ECS/MaliciousFile', 'Execution:Kubernetes/MaliciousFile', 'Execution:Runtime/MaliciousFileExecuted', 'Object:S3/MaliciousFile')
      AND "finding.severity" IN ('3', '4', '5', '6')
    LAST 24 HOURS
  yara_l: |
    rule guardduty_malicious_file_execution {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for malicious file execution across AWS services"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "MEDIUM"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "Execution:Container/MaliciousFile" or
          $e.metadata.product_event_type = "Execution:EC2/MaliciousFile" or
          $e.metadata.product_event_type = "Execution:ECS/MaliciousFile" or
          $e.metadata.product_event_type = "Execution:Kubernetes/MaliciousFile" or
          $e.metadata.product_event_type = "Execution:Runtime/MaliciousFileExecuted" or
          $e.metadata.product_event_type = "Object:S3/MaliciousFile"
        )
        (
          $e.security_result.severity = "LOW" or
          $e.security_result.severity = "MEDIUM" or
          $e.security_result.severity = "HIGH"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.guardduty*\n| WHERE event.type == \"guardduty\" \n  AND event.action IN (\"Execution:Container/MaliciousFile\", \"Execution:EC2/MaliciousFile\"\
    , \"Execution:ECS/MaliciousFile\", \"Execution:Kubernetes/MaliciousFile\", \"Execution:Runtime/MaliciousFileExecuted\", \"Object:S3/MaliciousFile\"\
    )\n  AND event.severity IN (3, 4, 5, 6)\n| KEEP @timestamp, host.name, cloud.account.id, cloud.region, event.action, event.severity, aws.guardduty.finding_id,\
    \ aws.guardduty.resource.resource_type, user.name, source.ip\n"
  leql: |
    where(source_json.type IN ["Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile"] AND source_json.severity IN [3, 4, 5, 6])
  crowdstrike: |
    #repo=* #type=guardduty
    | eventType IN ["Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile"]
    | severity IN [3,4,5,6]
    | table([@timestamp, eventType, severity, accountId, region, resource.instanceDetails.instanceId, resource.resourceType, service.additionalInfo, title, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log_source = "AWS.GuardDuty"
    | filter action_event_type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | filter severity in (3, 4, 5, 6)
    | fields _time, cloud_provider, action_event_type, severity, action_resource_id, action_region, actor_user
  lucene: |
    event_type:("Execution:Container/MaliciousFile" OR "Execution:EC2/MaliciousFile" OR "Execution:ECS/MaliciousFile" OR "Execution:Kubernetes/MaliciousFile" OR "Execution:Runtime/MaliciousFileExecuted" OR "Object:S3/MaliciousFile") AND severity:(3 OR 4 OR 5 OR 6)
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | json field=_raw "severity" as severity
    | where event_type in ("Execution:Container/MaliciousFile", "Execution:EC2/MaliciousFile", "Execution:ECS/MaliciousFile", "Execution:Kubernetes/MaliciousFile", "Execution:Runtime/MaliciousFileExecuted", "Object:S3/MaliciousFile")
    | where severity in (3, 4, 5, 6)
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Container/MaliciousFile\", \"Execution:EC2/MaliciousFile\", \"Execution:ECS/MaliciousFile\"\
  , \"Execution:Kubernetes/MaliciousFile\", \"Execution:Runtime/MaliciousFileExecuted\", \"Object:S3/MaliciousFile\"]\nWhere the severity is in\
  \ [3,4,5,6]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

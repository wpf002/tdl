rule_id: TDL-EXE-000360
v4_id: '000360'
name: Encoded Powershell
description: Detects powershell with suspicious encoding options. Attackers frequently use base64 and similar encoding to evade detection. Investigate
  parent/child relationships to determine whether the activity is authorized.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=windows EventCode=4688 New_Process_Name=\"*\\\\powershell.exe\" \n| regex Command_Line=\"(?i).*(-ec|-en|-enc|\\/ec|\\/-en|\\/-enc|frombase64string|-EncodedCommand|base64)\\\
    b.*\"\n| table _time, ComputerName, Account_Name, New_Process_Name, Command_Line, Creator_Process_Name\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4688
    | where Process has "powershell.exe"
    | where CommandLine matches regex @".*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%powershell.exe%'
      AND ("Process CommandLine" MATCHES '.*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*')
    LAST 1 HOURS
  yara_l: "rule encoded_powershell_execution {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects PowerShell execution\
    \ with encoded commands - T1059\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1059\"\n    severity = \"Medium\"\
    \n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $e.metadata.product_event_type = \"592\" or\n      $e.metadata.product_event_type\
    \ = \"4688\"\n    )\n    re.regex($e.target.process.file.full_path, `(?i)powershell\\.exe$`)\n    re.regex($e.target.process.command_line,\
    \ `(?i)(-ec|-en|-enc|\\/ec|\\/-en|\\/-enc|frombase64string|-EncodedCommand|base64)\\b`)\n    $e.principal.hostname = $host\n    \n  match:\n\
    \    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-windows.security*, logs-system.security*, winlogbeat-*\n| WHERE event.code IN (\"592\", \"4688\") \n  AND TO_LOWER(process.name)\
    \ == \"powershell.exe\"\n  AND (\n    process.command_line RLIKE \".*(-ec|-en|-enc|/ec|/-en|/-enc|frombase64string|-EncodedCommand|base64)\\\
    \\b.*\"\n  )\n| KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable\n"
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND (process_cmd_line=/.*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*/))
  crowdstrike: |
    EventCode=4688 FileName=*powershell.exe* (CommandLine=*-ec* OR CommandLine=*-en* OR CommandLine=*-enc* OR CommandLine=*/ec* OR CommandLine=*/-en* OR CommandLine=*/-enc* OR CommandLine=*frombase64string* OR CommandLine=*-EncodedCommand* OR CommandLine=*base64*)
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "powershell.exe"
    | filter action_process_image_command_line ~= ".*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, action_evtlog_event_id
  lucene: |
    (event.code:4688 OR EventID:4688 OR event.code:592 OR EventID:592) AND (process.name:powershell.exe OR Image:*powershell.exe) AND (process.command_line:(* -ec* OR * -en* OR * -enc* OR * \/ec* OR * \/-en* OR * \/-enc* OR *frombase64string* OR * -EncodedCommand* OR *base64*) OR CommandLine:(* -ec* OR * -en* OR * -enc* OR * \/ec* OR * \/-en* OR * \/-enc* OR *frombase64string* OR * -EncodedCommand* OR *base64*))
  sumo: |
    _sourceCategory=*Windows* ("4688" OR "592")
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | where event_id in ("4688", "592")
    | where process_name matches "*powershell.exe"
    | where command_line matches regex ".*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*"
    | fields _messageTime, _sourceHost, process_name, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Process Creation Event

  Where the Event ID is in [592, 4688]

  Where Process Name equals "powershell.exe"

  AND Command Line contains ".*(-ec|-en|-enc|\/ec|\/-en|\/-enc|frombase64string|-EncodedCommand|base64)\b.*"'
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000365
v4_id: '000365'
name: AWS RDS Activity from Malicious IP - GuardDuty
description: Detects when RDS activity from a known threat is seen within AWS instance
tactic: Execution
tactic_id: TA0002
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=guardduty sourcetype=aws:cloudwatchlogs:guardduty \n(detail.type=\"CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin\" OR \n\
    \ detail.type=\"CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin\" OR \n detail.type=\"CredentialAccess:RDS/TorIPCaller.SuccessfulLogin\"\
    \ OR \n detail.type=\"Discovery:RDS/MaliciousIPCaller\" OR \n detail.type=\"Discovery:RDS/TorIPCaller\")\n| table _time, detail.type, detail.resource.resourceType,\
    \ detail.resource.rdsDbInstanceDetails.dbInstanceIdentifier, detail.service.action.actionType, detail.service.action.rdsLoginAttemptAction.remoteIpDetails.ipAddressV4,\
    \ detail.accountId, detail.region\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller")
    | project TimeGenerated, Type, AccountId, Region, Severity, Title, Description, Resource = tostring(parse_json(AdditionalData).Resource)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, "Finding Type" AS event_type, "Resource ID", "Account ID", sourceip, destinationip, username
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "Finding Type" IN ('CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin', 'CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin', 'CredentialAccess:RDS/TorIPCaller.SuccessfulLogin', 'Discovery:RDS/MaliciousIPCaller', 'Discovery:RDS/TorIPCaller')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_rds_suspicious_activity {
      meta:
        author = "TDL"
        description = "Detects suspicious RDS activity via AWS GuardDuty findings"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin" or
          $e.metadata.product_event_type = "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin" or
          $e.metadata.product_event_type = "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin" or
          $e.metadata.product_event_type = "Discovery:RDS/MaliciousIPCaller" or
          $e.metadata.product_event_type = "Discovery:RDS/TorIPCaller"
        )
        $e.target.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller")
    | KEEP @timestamp, event.type, cloud.account.id, cloud.region, source.ip, aws.guardduty.resource.rds_db_instance_details.db_instance_identifier, aws.guardduty.severity, event.id
  leql: |
    where(source_json.type IN ["CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller"])
  crowdstrike: |
    #repo=guardduty event.type IN ["CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller"]
    | table([@timestamp, event.type, aws.accountId, resource.resourceType, service.action.rdsLoginAttemptAction.remoteIpDetails.ipAddressV4, resource.rdsDbInstanceDetails.dbInstanceIdentifier])
  xql: |
    dataset = aws_guardduty_raw
    | filter action_guardduty_finding_type in ("CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller")
    | fields _time, action_guardduty_finding_type, action_guardduty_severity, action_guardduty_resource_instance_id, action_guardduty_service_action_network_connection_remote_ip_address, action_guardduty_account_id, action_guardduty_region
  lucene: |
    event_type:("CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin" OR "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin" OR "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin" OR "Discovery:RDS/MaliciousIPCaller" OR "Discovery:RDS/TorIPCaller")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin", "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin", "Discovery:RDS/MaliciousIPCaller", "Discovery:RDS/TorIPCaller")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- thr
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["CredentialAccess:RDS/AnomalousBehavior.SuccessfulLogin", "CredentialAccess:RDS/MaliciousIPCaller.SuccessfulLogin",
  "CredentialAccess:RDS/TorIPCaller.SuccessfulLogin","Discovery:RDS/MaliciousIPCaller","Discovery:RDS/TorIPCaller"]'
suppression:
  window: 12 hours
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

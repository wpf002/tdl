rule_id: TDL-EXE-000366
v4_id: '000366'
name: AWS RDS Login Attempt from Malicious IP - GuardDuty
description: Detects a failed RDS login attempt from a malicious IP.
tactic: Execution
tactic_id: TA0002
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty OR sourcetype=aws:guardduty \n    (type=\"CredentialAccess:RDS/AnomalousBehavior.FailedLogin\"\
    \ OR \n     type=\"CredentialAccess:RDS/MaliciousIPCaller.FailedLogin\" OR \n     type=\"CredentialAccess:RDS/TorIPCaller.FailedLogin\")\n\
    | table _time, type, severity, accountId, region, resource.resourceType, service.action.rdsLoginAttemptAction.remoteIpDetails.ipAddressV4,\
    \ title, description\n"
  kql: |
    AWSGuardDuty
    | where ActivityType in ("CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin")
    | project TimeGenerated, ActivityType, AwsAccountId, Title, Description, Severity, SourceIpAddress, ResourceType, ResourceId
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, sourceip, destinationip, username, "Event Type", "Finding Type", qidname(qid)
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND ("Event Type" IN ('CredentialAccess:RDS/AnomalousBehavior.FailedLogin', 'CredentialAccess:RDS/MaliciousIPCaller.FailedLogin', 'CredentialAccess:RDS/TorIPCaller.FailedLogin')
           OR "Finding Type" IN ('CredentialAccess:RDS/AnomalousBehavior.FailedLogin', 'CredentialAccess:RDS/MaliciousIPCaller.FailedLogin', 'CredentialAccess:RDS/TorIPCaller.FailedLogin'))
    LAST 24 HOURS
  yara_l: "rule aws_guardduty_rds_suspicious_failed_login {\n  meta:\n    author = \"Chronicle Detection Engineering\"\n    description = \"Detects\
    \ GuardDuty findings indicating suspicious RDS failed login attempts from anomalous, malicious, or Tor IP addresses\"\n    mitre_attack_tactic\
    \ = \"Execution\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.vendor_name = \"Amazon\
    \ AWS\"\n    $e.metadata.product_name = \"GuardDuty\"\n    (\n      $e.metadata.product_event_type = \"CredentialAccess:RDS/AnomalousBehavior.FailedLogin\"\
    \ or\n      $e.metadata.product_event_type = \"CredentialAccess:RDS/MaliciousIPCaller.FailedLogin\" or\n      $e.metadata.product_event_type\
    \ = \"CredentialAccess:RDS/TorIPCaller.FailedLogin\"\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n\
    \  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, source.ip, aws.guardduty.severity, aws.guardduty.resource.rds_db_instance.name
  leql: |
    where(source_json.type IN ["CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin"])
  crowdstrike: |
    #repo=guardduty type IN ["CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin"]
    | table([@timestamp, type, accountId, region, resource.resourceType, resource.instanceDetails.instanceId, service.additionalInfo, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = XDR_CLOUD_PROVIDER_AWS and vendor = XDR_CLOUD_VENDOR_AWS_GUARDDUTY
    | filter log_name in ("CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin")
    | fields _time, cloud_provider, vendor, log_name, resource_name, resource_type, identity_name, identity_type, src_ipv4, severity
  lucene: |
    event.type:"GuardDuty" AND (finding.type:"CredentialAccess:RDS/AnomalousBehavior.FailedLogin" OR finding.type:"CredentialAccess:RDS/MaliciousIPCaller.FailedLogin" OR finding.type:"CredentialAccess:RDS/TorIPCaller.FailedLogin")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:RDS/AnomalousBehavior.FailedLogin", "CredentialAccess:RDS/MaliciousIPCaller.FailedLogin", "CredentialAccess:RDS/TorIPCaller.FailedLogin")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- thr
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '"1 Guard Duty Event

  Where the Event Type is in [""CredentialAccess:RDS/AnomalousBehavior.FailedLogin"", ""CredentialAccess:RDS/MaliciousIPCaller.FailedLogin"",
  ""CredentialAccess:RDS/TorIPCaller.FailedLogin""]"'
suppression:
  window: 12 hours
  fields:
  - src_ip
  - src_user
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

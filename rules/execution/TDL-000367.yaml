rule_id: TDL-EXE-000367
v4_id: '000367'
name: Ransomware Activity
description: Detects and O365 alert with the type Ransomware Activity
tactic: Execution
tactic_id: TA0002
technique_id: T1486
technique_name: Data Encrypted for Impact
platform:
- Windows
data_sources:
- O365 ATP
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=o365 sourcetype=o365:management:activity Operation="Ransomware activity"

    | table _time, UserId, ClientIP, Operation, Workload, OfficeObjectId

    '
  kql: |
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | where Application == "Microsoft 365"
    | where ActionType == "Ransomware activity"
    | project TimeGenerated, AccountObjectId, AccountDisplayName, IPAddress, ISP, City, CountryCode, RawEventData
  aql: |
    SELECT eventtime, username, sourceip, destinationip, qidname(qid), LOGSOURCENAME(logsourceid), "Event Name"
    FROM events
    WHERE "Event Name" = 'Ransomware activity'
    LAST 24 HOURS
  yara_l: |
    rule o365_ransomware_activity_detected {
      meta:
        author = "TDL"
        description = "Detects O365 ATP ransomware activity events"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1486"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Office 365"
        $e.metadata.product_event_type = "Ransomware activity"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-o365*
    | WHERE event.action == "Ransomware activity" OR event.dataset == "o365.audit" AND o365.audit.Operation == "Ransomware activity"
    | KEEP @timestamp, user.name, host.name, source.ip, event.action, o365.audit.Operation, o365.audit.ObjectId, o365.audit.ClientIP
  leql: |
    where(source_json.Operation="Ransomware activity")
  crowdstrike: |
    #repo=o365* event.name="Ransomware activity"
    | table([@timestamp, user.name, user.email, source.ip, event.action, event.outcome, file.name, file.path])
  xql: |
    dataset = msft_365_defender_raw
    | filter action_evtlog_event_id = "Ransomware activity" or action_external_hostname = "Ransomware activity" or event_type = "Ransomware activity"
    | fields _time, actor_effective_username, agent_hostname, action_file_name, action_file_path
  lucene: |
    event.action:"Ransomware activity" OR o365.audit.Operation:"Ransomware activity" OR action:"Ransomware activity"
  sumo: |
    _sourceCategory=*O365* OR _sourceCategory=*Office365* "Ransomware activity"
    | json field=_raw "Operation" as operation
    | where operation = "Ransomware activity"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: 1 O365 event where event name is "Ransomware activity"
suppression:
  window: 4 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

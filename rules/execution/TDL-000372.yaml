rule_id: TDL-EXE-000372
v4_id: '000372'
name: AWS CLI Session from Unauthorized Country
description: Detects the use of the AWS CLI from an abnormal country.
tactic: Execution
tactic_id: TA0002
technique_id: T1651
technique_name: Cloud Administration Command
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudtrail eventName=StartSession eventType=AwsApiCall \n| iplocation sourceIPAddress \n| search Country IN (\"\
    CN\", \"RU\", \"KP\", \"IR\", \"SY\", \"CU\", \"BY\")\n| table _time, userIdentity.principalId, userIdentity.userName, sourceIPAddress, Country,\
    \ awsRegion, requestParameters.target, responseElements.sessionId\n"
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(24h)
    | where EventTypeName == "AwsApiCall"
    | where EventName == "StartSession"
    | extend SourceCountry = tostring(parse_json(tostring(ResponseElements)).sourceCountry)
    | where SourceCountry in ("CN", "RU", "KP", "IR", "SY", "CU", "VE")
    | project TimeGenerated, UserIdentityArn, EventName, SourceIPAddress, SourceCountry, AWSRegion, UserAgent, RequestParameters, ResponseElements
  aql: |
    SELECT sourceip, username, "Country" AS source_country, "Event Name", "User Agent", COUNT(*) AS session_starts
    FROM events
    WHERE "Event Name" = 'StartSession'
      AND "Event Type" = 'AwsApiCall'
      AND "Country" IN ('CN', 'RU', 'KP', 'IR', 'SY', 'CU', 'VE', 'BY')
    GROUP BY sourceip, username, "Country", "Event Name", "User Agent"
    LAST 24 HOURS
  yara_l: "rule aws_ssm_start_session_from_high_risk_country {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects AWS\
    \ SSM StartSession API calls from high risk or unauthorized countries - MITRE T1651\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1651\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.vendor_name = \"AMAZON\"\n    $e.metadata.product_name = \"AWS CloudTrail\"\
    \n    $e.metadata.product_event_type = \"AwsApiCall\"\n    $e.target.resource.name = \"StartSession\"\n    \n    // High risk countries -\
    \ adjust list based on organizational policy\n    (\n      $e.principal.location.country_or_region = \"CN\" or\n      $e.principal.location.country_or_region\
    \ = \"RU\" or\n      $e.principal.location.country_or_region = \"KP\" or\n      $e.principal.location.country_or_region = \"IR\" or\n    \
    \  $e.principal.location.country_or_region = \"SY\" or\n      $e.principal.location.country_or_region = \"CU\"\n    )\n    \n    $e.principal.user.userid\
    \ = $user\n    $e.principal.location.country_or_region = $country\n    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score =\
    \ 75\n    $country_code = array_distinct($country)\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"StartSession\" \n  AND event.type == \"AwsApiCall\"\
    \n  AND source.geo.country_iso_code IN (\"CN\", \"RU\", \"KP\", \"IR\", \"SY\", \"CU\", \"VE\", \"BY\")\n| STATS session_count = COUNT(*)\
    \ BY user.name, source.ip, source.geo.country_name, cloud.account.id\n| KEEP @timestamp, user.name, source.ip, source.geo.country_name, cloud.account.id,\
    \ session_count\n"
  leql: |
    where(source_json.eventType="AwsApiCall" AND source_json.eventName="StartSession" AND source_json.sourceIPAddress.country IN ["CN", "RU", "KP", "IR", "SY", "CU", "VE", "BY"])
  crowdstrike: "#type=cloudtrail eventType=AwsApiCall eventName=StartSession \n| table([@timestamp, userIdentity.principalId, userIdentity.arn,\
    \ sourceIPAddress, awsRegion, requestParameters.target, recipientAccountId, userAgent, errorCode])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "AwsApiCall" and operation = "StartSession"
    | filter source_location_country in ("CN", "RU", "KP", "IR", "SY", "CU", "VE", "BY")
    | fields _time, identity_name, source_location_country, source_ipaddress, resource_name, cloud_provider_event_id
  lucene: |
    eventName:StartSession AND eventType:AwsApiCall AND (sourceIPAddress.country:"RU" OR sourceIPAddress.country:"CN" OR sourceIPAddress.country:"KP" OR sourceIPAddress.country:"IR" OR sourceIPAddress.country:"SY" OR userIdentity.principalId.sessionContext.attributes.mfaAuthenticated:"false")
    ```

    However, since country data is typically enriched and stored differently in CloudTrail/OpenSearch deployments, here's a more practical version that can be adapted:

    ```
    eventName:StartSession AND eventType:AwsApiCall
    ```

    Note: Country-based filtering typically requires GeoIP enrichment configured in your pipeline. The actual field name depends on your OpenSearch/Graylog GeoIP configuration (commonly `source.geo.country_iso_code` or `sourceIPAddress.geo.country_code` with ECS). Replace with your actual enriched field:

    ```
    eventName:StartSession AND eventType:AwsApiCall AND source.geo.country_iso_code:(RU OR CN OR KP OR IR OR SY OR VE OR CU)
  sumo: |
    _sourceCategory=*cloudtrail* "StartSession"
    | json field=_raw "eventType" as event_type
    | json field=_raw "eventName" as event_name
    | json field=_raw "sourceIPAddress" as source_ip
    | json field=_raw "userIdentity.principalId" as principal_id
    | json field=_raw "awsRegion" as aws_region
    | where event_type = "AwsApiCall" and event_name = "StartSession"
    | lookup latitude, longitude, country_code, country_name from geo://location on ip=source_ip
    | where !(country_code in ("US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SE", "NO", "DK", "FI", "NL", "BE", "CH", "AT", "IE", "IT", "ES"))
    | fields _messageTime, principal_id, source_ip, country_name, country_code, aws_region, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Event

  Where the Event Type is in [AwsApiCall]

  Where the Event Name is in [StartSession]

  Where the Source Country is a high risk or unauthorized country'
suppression:
  window: 12 hours
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

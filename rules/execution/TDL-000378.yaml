rule_id: TDL-EXE-000378
v4_id: 000378
name: Command Execution on VM - Azure
description: Adversaries may abuse access to virtual machines by executing a script through various methods in order to gain access to the Virtual
  Machine.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Azure
data_sources:
- Azure
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype=azure:activity:json (operation_name="MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION" OR operation_name="MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE")
    status=Success

    | table _time, user, resource_group, subscription_id, resource_id, operation_name, status, caller_ip_address, properties

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(1h)
    | where OperationNameValue in ("MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE")
    | where ActivityStatusValue =~ "success"
    | project TimeGenerated, Caller, OperationNameValue, ResourceGroup, SubscriptionId, ResourceId, ActivityStatusValue, Properties
  aql: |
    SELECT username, sourceip, "Event Name", "Action", LOGSOURCENAME(logsourceid) AS source, eventtime
    FROM events
    WHERE LOGSOURCETYPE(devicetype) ILIKE '%Azure%'
      AND ("Event Name" = 'MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION' OR "Event Name" = 'MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE')
      AND "Action" = 'success'
    LAST 24 HOURS
  yara_l: |
    rule azure_vm_command_execution {
      meta:
        author = "TDL"
        description = "Detects Azure VM command execution via RunCommand or Extensions"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1059"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        (
          $e.metadata.product_event_type = "MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION" or
          $e.metadata.product_event_type = "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE"
        )
        $e.security_result.action = "ALLOW"
        $e.security_result.summary = "success"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE event.action IN ("MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE") AND event.outcome == "success"
    | KEEP @timestamp, azure.activitylogs.operation_name, event.action, event.outcome, azure.resource.name, azure.activitylogs.identity.claims_initiated_by_user.name, cloud.account.id, azure.subscription_id
  leql: |
    where(source_json.operationName IN ["MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE"] AND source_json.status=success)
  crowdstrike: |
    #repo=Azure event_simpleName=AzureActivityLog (operationName=MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION OR operationName=MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE) status=Success
    | table([@timestamp, callerIpAddress, identity.claims.name, resourceId, operationName, status])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name in ("MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE") and operation_status = "SUCCESS"
    | fields _time, operation_name, operation_status, identity_name, resource_name, resource_sub_type, project_id
  lucene: |
    OperationName:("MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION" OR "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE") AND ActivityStatus:"success"
  sumo: |
    _sourceCategory=*Azure* (MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION OR MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE)
    | json field=_raw "operationName" as operation_name
    | json field=_raw "resultType" as result_type
    | where (operation_name = "MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION" OR operation_name = "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE")
    | where result_type matches "*success*" OR result_type = "Success"
    | fields _messageTime, operation_name, result_type, _sourceHost
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Activity Event

  Where Event Name is in ["MICROSOFT.COMPUTE/VIRTUALMACHINES/RUNCOMMAND/ACTION", "MICROSOFT.COMPUTE/VIRTUALMACHINES/EXTENSIONS/WRITE"]

  Where Action is in ["success"]'
suppression:
  window: 24 hours
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

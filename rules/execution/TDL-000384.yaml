rule_id: TDL-EXE-000384
v4_id: 000384
name: AWS Cryptominer Activity Detected - GuardDuty
description: Detects a Cryptominer being executed within AWS
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatchlogs:guardduty type="Impact:Runtime/CryptoMinerExecuted"

    | table _time, accountId, region, type, severity, resource.instanceDetails.instanceId, service.action.actionType, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title == "Impact:Runtime/CryptoMinerExecuted"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ServiceName = AdditionalData.ServiceName, InstanceId = AdditionalData.Resource.InstanceDetails.InstanceId, ImageId = AdditionalData.Resource.InstanceDetails.ImageId
  aql: "SELECT sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), eventtime, COUNT(*) AS event_count\nFROM events\n\
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%' \n  AND (qidname(qid) ILIKE '%Impact:Runtime/CryptoMinerExecuted%' \n       OR \"finding.type\"\
    \ = 'Impact:Runtime/CryptoMinerExecuted'\n       OR \"eventName\" ILIKE '%CryptoMinerExecuted%')\nGROUP BY sourceip, destinationip, username,\
    \ qidname(qid), LOGSOURCENAME(logsourceid), eventtime\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_cryptominer_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty CryptoMiner execution alerts"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS GuardDuty"
        $e.metadata.product_event_type = "Impact:Runtime/CryptoMinerExecuted"
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Impact:Runtime/CryptoMinerExecuted")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.id, aws.guardduty.finding.severity, aws.guardduty.finding.type, aws.guardduty.resource.instance_details.instance_id, aws.guardduty.resource.instance_details.image_id
  leql: |
    where(source_json.type IN ["Impact:Runtime/CryptoMinerExecuted"])
  crowdstrike: |
    #type=guardduty detail.type="Impact:Runtime/CryptoMinerExecuted"
    | table([@timestamp, detail.resource.instanceDetails.instanceId, detail.resource.instanceDetails.instanceType, detail.severity, detail.description, detail.region])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and raw_log_source = "GuardDuty" and operation_name in ("Impact:Runtime/CryptoMinerExecuted")
    | fields _time, cloud_provider, operation_name, identity_name, resource_name, resource_sub_type, raw_log
  lucene: |
    event.type:"Impact:Runtime/CryptoMinerExecuted"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "detail.type" as event_type
    | where event_type = "Impact:Runtime/CryptoMinerExecuted"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Impact:Runtime/CryptoMinerExecuted\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000397
v4_id: 000397
name: AWS Reverse Shell Activity - GuardDuty
description: Detects a reverse shell within an AWS enviroment. Threat actors create a reverse shell to execute commands on the target after gaining
  initial access to the target.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatch:guardduty:findings type IN ("Execution:Runtime/ReverseShell")

    | table _time, account, region, type, severity, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4,
    service.action.networkConnectionAction.remotePortDetails.port, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title has "Execution:Runtime/ReverseShell"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(Resource.InstanceDetails.InstanceId), ServiceName = tostring(Service.ServiceName), ActionType = tostring(Service.Action.ActionType)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, sourceip, destinationip, "Event Type", "Finding Description", "Severity"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Event Type" = 'Execution:Runtime/ReverseShell'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_reverse_shell_execution {
      meta:
        author = "Chronicle Detection"
        description = "Detects AWS GuardDuty reverse shell execution findings"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1059"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "Execution:Runtime/ReverseShell"
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM .ds-logs-aws.guardduty*
    | WHERE @timestamp > NOW() - 24 hours AND event.type == "Execution:Runtime/ReverseShell"
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.severity, aws.guardduty.resource.instance_details.instance_id, source.ip, destination.ip, destination.port
  leql: |
    where(source_json.type IN ["Execution:Runtime/ReverseShell"])
  crowdstrike: |
    #type=guardduty event.type="Execution:Runtime/ReverseShell"
    | table([@timestamp, account.id, region, resource.resourceType, service.action.actionType, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and event_type = "Execution:Runtime/ReverseShell"
    | fields _time, cloud_provider, event_type, resource_name, resource_sub_type, actor_user, raw_log
  lucene: |
    event.type:"Execution:Runtime/ReverseShell"
  sumo: |
    _sourceCategory=*guardduty* OR _source=*guardduty* OR guardduty
    | json field=_raw "type" as event_type
    | where event_type = "Execution:Runtime/ReverseShell"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Runtime/ReverseShell\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

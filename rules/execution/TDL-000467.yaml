test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance within any observation window of a web request from an internal host to an IP address listed on a threat intelligence
  feed.


  From index=network with sourcetype=firewall or sourcetype=ids

  Where network.protocol contains "tcp"

  With fields src_ip, dest_ip, dest_port, bytes_out, count, and unique_dests (distinct destination IPs) tracked per source-destination pair

  With a minimum event count of 1 or more connections to the threat-listed destination IP

  With results sorted descending by bytes_out to surface highest-volume transfers first

  With the same src_ip and dest_ip as the correlation key

  Excluding traffic from authorized penetration testing source IPs and known security research vendor IP ranges where present in an admin allow-list'

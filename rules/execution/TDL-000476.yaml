author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — pay attention to short-lived processes, encoded arguments, and unusual
  parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance over any time window of inbound network traffic from a known Botnet host communicating over TCP.


  From index=network where sourcetype is firewall or sourcetype is ids

  Where network.protocol contains "tcp"

  With src_ip identified as a known Botnet host communicating inbound to internal infrastructure

  With metrics aggregated as total event count, count of distinct dest_ip values as unique_dests, and sum of bytes_out per src_ip, dest_ip, and
  dest_port combination

  Where count is greater than or equal to 1

  Results sorted in descending order by bytes_out to surface highest-volume Botnet communication first

  With no exclusion allow-list applied; authorized pen testing and security research activity should be reviewed manually as known false positive
  sources

  With the same Source IP, Destination IP, and Destination Port as the correlation key'

rule_id: TDL-EXE-000506
v4_id: '000506'
name: Nishang Commandlet Activity
description: Detects when a Nishang commandlet is seen within the enviroment.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))\n(\n  (EventCode=592 OR EventCode=4688) Image=\"*\\\\powershell.exe\"\
    \ \n  (CommandLine=\"*get-unconstrained*\" OR CommandLine=\"*add-regbackdoor*\" OR CommandLine=\"*add-scrnsavebackdoor*\" OR CommandLine=\"\
    *gupt-backdoor*\" OR CommandLine=\"*invoke-adsbackdoor*\" OR CommandLine=\"*enabled-duplicatetoken*\" OR CommandLine=\"*invoke-psuacme*\"\
    \ OR CommandLine=\"*remove-update*\" OR CommandLine=\"*check-vm*\" OR CommandLine=\"*copy-vss*\" OR CommandLine=\"*get-information*\" OR CommandLine=\"\
    *get-lsasecret*\" OR CommandLine=\"*get-passhashes*\" OR CommandLine=\"*show-targetscreen*\" OR CommandLine=\"*port-scan*\" OR CommandLine=\"\
    *invoke-poshrathttp*\" OR CommandLine=\"*invoke-powershelltcp*\" OR CommandLine=\"*invoke-powershellwmi*\" OR CommandLine=\"*add-exfiltration*\"\
    \ OR CommandLine=\"*add-persistence*\" OR CommandLine=\"*do-exfiltration*\" OR CommandLine=\"*start-captureserver*\")\n)\nOR\n(\n  EventCode=4104\
    \ \n  (ScriptBlockText=\"*get-unconstrained*\" OR ScriptBlockText=\"*add-regbackdoor*\" OR ScriptBlockText=\"*add-scrnsavebackdoor*\" OR ScriptBlockText=\"\
    *gupt-backdoor*\" OR ScriptBlockText=\"*invoke-adsbackdoor*\" OR ScriptBlockText=\"*enabled-duplicatetoken*\" OR ScriptBlockText=\"*invoke-psuacme*\"\
    \ OR ScriptBlockText=\"*remove-update*\" OR ScriptBlockText=\"*check-vm*\" OR ScriptBlockText=\"*copy-vss*\" OR ScriptBlockText=\"*get-information*\"\
    \ OR ScriptBlockText=\"*get-lsasecret*\" OR ScriptBlockText=\"*get-passhashes*\" OR ScriptBlockText=\"*show-targetscreen*\" OR ScriptBlockText=\"\
    *port-scan*\" OR ScriptBlockText=\"*invoke-poshrathttp*\" OR ScriptBlockText=\"*invoke-powershelltcp*\" OR ScriptBlockText=\"*invoke-powershellwmi*\"\
    \ OR ScriptBlockText=\"*add-exfiltration*\" OR ScriptBlockText=\"*add-persistence*\" OR ScriptBlockText=\"*do-exfiltration*\" OR ScriptBlockText=\"\
    *start-captureserver*\")\n)\n| table _time, ComputerName, EventCode, User, Image, CommandLine, ScriptBlockText\n"
  kql: |
    union
    (
    SecurityEvent
    | where EventID in (592, 4688)
    | where Process has "powershell.exe"
    | where CommandLine matches regex @".*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*"
    | project TimeGenerated, Computer, Account, Process, CommandLine, EventID
    ),
    (
    Event
    | where EventID == 4104
    | where Source == "Microsoft-Windows-PowerShell"
    | extend ScriptBlockText = tostring(EventData.ScriptBlockText)
    | where ScriptBlockText matches regex @".*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*"
    | project TimeGenerated, Computer, Account = UserName, Process = "powershell.exe", CommandLine = ScriptBlockText, EventID
    )
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "EventID", "ScriptBlockText"
    FROM events
    WHERE (("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" MATCHES '.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*')
    OR ("EventID" = '4104' AND "ScriptBlockText" MATCHES '.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*'))
    LAST 24 HOURS
  yara_l: |
    rule powershell_malicious_cmdlets_execution {
      meta:
        author = "TDL"
        description = "Detects execution of malicious PowerShell cmdlets indicating post-exploitation activities - MITRE T1204"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        (
          $e1.metadata.event_type = "PROCESS_LAUNCH"
          (
            $e1.metadata.product_event_type = "592" or
            $e1.metadata.product_event_type = "4688"
          )
          re.regex($e1.principal.process.file.full_path, `(?i)powershell\.exe$`)
          re.regex($e1.principal.process.command_line, `(?i)\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b`)
          $e1.principal.hostname = $host
        )
        or
        (
          $e2.metadata.product_event_type = "4104"
          re.regex($e2.principal.process.command_line, `(?i)\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b`)
          $e2.principal.hostname = $host
        )

      match:
        $host over 5m

      outcome:
        $risk_score = max(85)

      condition:
        $e1 or $e2
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, logs-system.security*, winlogbeat-*
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line RLIKE ".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\b.*")
        OR
        (event.code == "4104" AND powershell.file.script_block_text RLIKE ".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\b.*")
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, powershell.file.script_block_text
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line=/.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/i) OR (source_json.EventID=4104 AND source_json.ScriptBlockText=/.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/i))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    ((EventCode=4688 OR EventCode=592) FileName=*powershell.exe CommandLine=/.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/i)
    OR
    (EventCode=4104 ScriptBlockText=/.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershellтcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/i)
    | table([@timestamp, EventCode, ComputerName, UserName, FileName, CommandLine, ScriptBlockText])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line ~= ".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\b.*") or (action_evtlog_event_id = 4104 and action_evtlog_message ~= ".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\b.*")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:powershell.exe AND process.command_line:/(get\-unconstrained|add\-regbackdoor|add\-scrnsavebackdoor|gupt\-backdoor|invoke\-adsbackdoor|enabled\-duplicatetoken|invoke\-psuacme|remove\-update|check\-vm|copy\-vss|get\-information|get\-lsasecret|get\-passhashes|show\-targetscreen|port\-scan|invoke\-poshrathttp|invoke\-powershelltcp|invoke\-powershellwmi|add\-exfiltration|add\-persistence|do\-exfiltration|start\-captureserver)/) OR (event.code:4104 AND powershell.file.script_block_text:/(get\-unconstrained|add\-regbackdoor|add\-scrnsavebackdoor|gupt\-backdoor|invoke\-adsbackdoor|enabled\-duplicatetoken|invoke\-psuacme|remove\-update|check\-vm|copy\-vss|get\-information|get\-lsasecret|get\-passhashes|show\-targetscreen|port\-scan|invoke\-poshrathttp|invoke\-powershelltcp|invoke\-powershellwmi|add\-exfiltration|add\-persistence|do\-exfiltration|start\-captureserver)/)
  sumo: |
    _sourceCategory=*Windows* (4688 OR 4104 OR 592)
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "ScriptBlockText" as script_block
    | where (event_id in ("592", "4688") and process_name matches "*powershell.exe" and command_line matches /.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/) OR (event_id = "4104" and script_block matches /.*\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\b.*/)
    | fields _messageTime, _sourceHost, event_id, process_name, command_line, script_block
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ matches the regex \".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\\
  b.*\"\n\n---------------------------------------------------------------------------------------------------------------\n\n1 Windows Powershell\
  \ Script Execution Event\nWhere the Event ID is 4104\nWhere the Script matches the regex \".*\\b(?:get-unconstrained|add-regbackdoor|add-scrnsavebackdoor|gupt-backdoor|invoke-adsbackdoor|enabled-duplicatetoken|invoke-psuacme|remove-update|check-vm|copy-vss|get-information|get-lsasecret|get-passhashes|show-targetscreen|port-scan|invoke-poshrathttp|invoke-powershelltcp|invoke-powershellwmi|add-exfiltration|add-persistence|do-exfiltration|start-captureserver)\\\
  b.*\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

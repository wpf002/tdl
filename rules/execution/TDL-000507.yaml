        // Process execution event (4688 or 592)
        ($proc.metadata.event_type = "PROCESS_LAUNCH" and
         ($proc.metadata.product_event_type = "4688" or $proc.metadata.product_event_type = "592") and
         re.regex($proc.principal.process.file.full_path, `(?i)powershell\.exe$`) and

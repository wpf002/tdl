    | table([@timestamp, ComputerName, EventCode, FileName, CommandLine, ScriptBlockText, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line ~= ".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\b.*") or (action_evtlog_event_id = 4104 and action_evtlog_message ~= ".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\b.*")

      (EventCode IN [4688, 592] FileName=*powershell.exe CommandLine=/.*\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\b.*/i)

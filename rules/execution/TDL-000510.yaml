- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))\n(\n  (EventCode=592 OR EventCode=4688)\n  (Image=\"*\\\\powershell.exe\"\
    \ OR Process_Name=\"*powershell.exe\" OR NewProcessName=\"*powershell.exe\")\n  (CommandLine=\"*get-serviceunquoted*\" OR CommandLine=\"*get-servicefilepermission*\"\
    \ OR CommandLine=\"*get-servicepermission*\" OR CommandLine=\"*invoke-serviceabuse*\" OR CommandLine=\"*install-servicebinary*\" OR CommandLine=\"\
    *get-regautologon*\" OR CommandLine=\"*get-vulnautorun*\" OR CommandLine=\"*get-vulnschtask*\" OR CommandLine=\"*get-unattendedinstallfile*\"\
    \ OR CommandLine=\"*get-webconfig*\" OR CommandLine=\"*get-applicationhost*\" OR CommandLine=\"*get-regalwaysinstallelevated*\" OR CommandLine=\"\
    *invoke-kerberoast*\" OR CommandLine=\"*get-registryautologon*\" OR CommandLine=\"*get-registryautorun*\" OR CommandLine=\"*find-processdllhijack*\"\
    \ OR CommandLine=\"*get-modifiablescheduledtaskfile*\" OR CommandLine=\"*powerup*\" OR CommandLine=\"*install-ssp*\" OR CommandLine=\"*get-microphoneaudio*\"\
    \ OR CommandLine=\"*find-avsignature*\" OR CommandLine=\"*new-userpersistenceoption*\" OR CommandLine=\"*get-timedscreenshot*\" OR CommandLine=\"\
    *invoke-wmicommand*\" OR CommandLine=\"*invoke-dllinjection*\" OR CommandLine=\"*invoke-reflectivepeinjection*\" OR CommandLine=\"*get-vaultcredential*\"\
    )\n)\nOR\n(\n  EventCode=4104\n  (ScriptBlockText=\"*get-serviceunquoted*\" OR ScriptBlockText=\"*get-servicefilepermission*\" OR ScriptBlockText=\"\
    *get-servicepermission*\" OR ScriptBlockText=\"*invoke-serviceabuse*\" OR ScriptBlockText=\"*install-servicebinary*\" OR ScriptBlockText=\"\
    *get-regautologon*\" OR ScriptBlockText=\"*get-vulnautorun*\" OR ScriptBlockText=\"*get-vulnschtask*\" OR ScriptBlockText=\"*get-unattendedinstallfile*\"\
    \ OR ScriptBlockText=\"*get-webconfig*\" OR ScriptBlockText=\"*get-applicationhost*\" OR ScriptBlockText=\"*get-regalwaysinstallelevated*\"\
    \ OR ScriptBlockText=\"*invoke-kerberoast*\" OR ScriptBlockText=\"*get-registryautologon*\" OR ScriptBlockText=\"*get-registryautorun*\" OR\
    \ ScriptBlockText=\"*find-processdllhijack*\" OR ScriptBlockText=\"*get-modifiablescheduledtaskfile*\" OR ScriptBlockText=\"*powerup*\" OR\
    \ ScriptBlockText=\"*install-ssp*\" OR ScriptBlockText=\"*get-microphoneaudio*\" OR ScriptBlockText=\"*find-avsignature*\" OR ScriptBlockText=\"\
    *new-userpersistenceoption*\" OR ScriptBlockText=\"*get-timedscreenshot*\" OR ScriptBlockText=\"*invoke-wmicommand*\" OR ScriptBlockText=\"\
    *invoke-dllinjection*\" OR ScriptBlockText=\"*invoke-reflectivepeinjection*\" OR ScriptBlockText=\"*get-vaultcredential*\")\n)\n| table _time,\
    \ ComputerName, EventCode, User, Image, NewProcessName, Process_Name, CommandLine, ScriptBlockText\n"
  kql: |
    let ProcessEvents = SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process has "powershell.exe"
    | where CommandLine matches regex @"(?i)\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\b"
    | project TimeGenerated, Computer, Account, Process, CommandLine, EventID;
    let ScriptBlockEvents = Event
    | where TimeGenerated > ago(1h)
    | where EventID == 4104
    | where EventData has "powershell"
    | extend ScriptBlockText = tostring(parse_xml(EventData).DataItem.EventData.Data)
    | where ScriptBlockText matches regex @"(?i)\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\b"
    | project TimeGenerated, Computer, Account = UserName, Process = "powershell.exe", CommandLine = ScriptBlockText, EventID;
    union ProcessEvents, ScriptBlockEvents
    | project TimeGenerated, Computer, Account, Process, CommandLine, EventID
    | sort by TimeGenerated desc
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "EventID", "Process Name", "Process CommandLine", "ScriptBlockText"
    FROM events
    WHERE (
      ("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" MATCHES '.*\b(get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\b.*')
      OR
      ("EventID" = '4104' AND "ScriptBlockText" MATCHES '.*\b(get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\b.*')
    )
    LAST 1 HOURS
  yara_l: "rule powershell_powerup_exploitation {\n  meta:\n    author = \"TDL\"\n    description = \"Detects PowerShell execution of PowerUp\
    \ or other privilege escalation/exploitation functions - MITRE T1204 Execution\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1204\"\n    severity = \"HIGH\"\n    \n  events:\n    (\n      $e1.metadata.event_type = \"PROCESS_LAUNCH\" and\n      ($e1.metadata.product_event_type\
    \ = \"4688\" or $e1.metadata.product_event_type = \"592\") and\n      re.regex($e1.principal.process.file.full_path, `(?i)\\\\powershell\\\
    .exe$`) and\n      re.regex($e1.principal.process.command_line, `(?i)\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\\
    b`) and\n      $e1.principal.hostname = $host\n    ) or\n    (\n      $e2.metadata.event_type = \"SCRIPT_EXECUTE\" and\n      $e2.metadata.product_event_type\
    \ = \"4104\" and\n      re.regex($e2.principal.process.command_line, `(?i)\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\\
    b`) and\n      $e2.principal.hostname = $host\n    )\n    \n  match:\n    $host over 5m\n    \n  outcome:\n    $risk_score = max(75)\n   \
    \ \n  condition:\n    $e1 or $e2\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.powershell*, winlogbeat-*
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line RLIKE ".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\b.*")
        OR
        (event.code == "4104" AND powershell.file.script_block_text RLIKE ".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\b.*")
      )

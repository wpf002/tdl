rule_id: TDL-EXE-000510
v4_id: '000510'
name: PowerUp Commandlet Activity
description: Detects when a PowerUp commandlet is seen within the enviroment.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    (index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))
    (
      (EventCode=592 OR EventCode=4688)
      (Image="*\\powershell.exe" OR Process_Name="*powershell.exe" OR NewProcessName="*powershell.exe")
      (CommandLine="*get-serviceunquoted*" OR CommandLine="*get-servicefilepermission*" OR CommandLine="*get-servicepermission*" OR CommandLine="*invoke-serviceabuse*" OR CommandLine="*install-servicebinary*" OR CommandLine="*get-regautologon*" OR CommandLine="*get-vulnautorun*" OR CommandLine="*get-vulnschtask*" OR CommandLine="*get-unattendedinstallfile*" OR CommandLine="*get-webconfig*" OR CommandLine="*get-applicationhost*" OR CommandLine="*get-regalwaysinstallelevated*" OR CommandLine="*invoke-kerberoast*" OR CommandLine="*get-registryautologon*" OR CommandLine="*get-registryautorun*" OR CommandLine="*find-processdllhijack*" OR CommandLine="*get-modifiablescheduledtaskfile*" OR CommandLine="*powerup*" OR CommandLine="*install-ssp*" OR CommandLine="*get-microphoneaudio*" OR CommandLine="*find-avsignature*" OR CommandLine="*new-userpersistenceoption*" OR CommandLine="*get-timedscreenshot*" OR CommandLine="*invoke-wmicommand*" OR CommandLine="*invoke-dllinjection*" OR CommandLine="*invoke-reflectivepeinjection*" OR CommandLine="*get-vaultcredential*")
    )
    OR
    (
      EventCode=4104
      (ScriptBlockText="*get-serviceunquoted*" OR ScriptBlockText="*get-servicefilepermission*" OR ScriptBlockText="*get-servicepermission*" OR ScriptBlockText="*invoke-serviceabuse*" OR ScriptBlockText="*install-servicebinary*" OR ScriptBlockText="*get-regautologon*" OR ScriptBlockText="*get-vulnautorun*" OR ScriptBlockText="*get-vulnschtask*" OR ScriptBlockText="*get-unattendedinstallfile*" OR ScriptBlockText="*get-webconfig*" OR ScriptBlockText="*get-applicationhost*" OR ScriptBlockText="*get-regalwaysinstallelevated*" OR ScriptBlockText="*invoke-kerberoast*" OR ScriptBlockText="*get-registryautologon*" OR ScriptBlockText="*get-registryautorun*" OR ScriptBlockText="*find-processdllhijack*" OR ScriptBlockText="*get-modifiablescheduledtaskfile*" OR ScriptBlockText="*powerup*" OR ScriptBlockText="*install-ssp*" OR ScriptBlockText="*get-microphoneaudio*" OR ScriptBlockText="*find-avsignature*" OR ScriptBlockText="*new-userpersistenceoption*" OR ScriptBlockText="*get-timedscreenshot*" OR ScriptBlockText="*invoke-wmicommand*" OR ScriptBlockText="*invoke-dllinjection*" OR ScriptBlockText="*invoke-reflectivepeinjection*" OR ScriptBlockText="*get-vaultcredential*")
    )
    | table _time, ComputerName, EventCode, User, Image, NewProcessName, Process_Name, CommandLine, ScriptBlockText
  kql: 'DeviceRegistryEvents

    | where TimeGenerated > ago(1d)

    | where registry_key matches regex ".+"

    | summarize Count=count() by DeviceName, InitiatingProcessFileName, RegistryKey, RegistryValueName, RegistryValueData

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Registry Key\", \"Registry Value Name\", \"Registry Value Data\", \"Process Name\"\nFROM events\nWHERE\
    \ LOGSOURCETYPENAME(devicetype) = 'Microsoft Windows Sysmon'\n  AND \"EventID\" IN ('12','13','14')\n  AND \"registry_key\" LIKE '%.+%'\n\
    LAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000510 {\n  meta:\n    author = \"TDL\"\n    description = \"PowerUp Commandlet Activity\"\n    severity = \"HIGH\"\
    \n    tactic = \"TA0002\"\n    technique = \"T1204\"\n  events:\n    $e.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    $e.registry_key\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "registry" AND registry_key LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, registry.path, registry.value, process.name

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND log_type = "registry" AND registry_key=/.+/)

    groupby(asset, registry_key, registry_value)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (RegSystemConfigValueUpdate, RegGenericValueUpdate) AND registry_key=*.+*

    | stats count as changes by ComputerName, UserName, RegObjectName, RegStringValue

    | sort -changes

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.REGISTRY AND registry_key ~= ".+"

    | comp count() as changes by agent_hostname, actor_effective_username, action_registry_key_name, action_registry_value_name

    | sort desc changes

    '
  lucene: 'event.category:"registry" AND registry_key:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id IN ("12","13","14") AND registry_key matches "*.+*"

    | count by host, user, registry_key, registry_value, image

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ matches the regex \".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\\
  b.*\"\n\n---------------------------------------------------------------------------------------------------------------\n\n1 Windows Powershell\
  \ Script Execution Event\nWhere the Event ID is 4104\nWhere the Script matches the regex \".*\\b(?:get-serviceunquoted|get-servicefilepermission|get-servicepermission|invoke-serviceabuse|install-servicebinary|get-regautologon|get-vulnautorun|get-vulnschtask|get-unattendedinstallfile|get-webconfig|get-applicationhost|get-regalwaysinstallelevated|invoke-kerberoast|get-registryautologon|get-registryautorun|find-processdllhijack|get-modifiablescheduledtaskfile|powerup|install-ssp|get-microphoneaudio|find-avsignature|new-userpersistenceoption|get-timedscreenshot|invoke-wmicommand|invoke-dllinjection|invoke-reflectivepeinjection|get-vaultcredential)\\\
  b.*\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

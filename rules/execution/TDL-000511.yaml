rule_id: TDL-EXE-000511
v4_id: '000511'
name: PowerView Commandlet Activity
description: Detects when a PowerView commandlet is seen within the enviroment.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: '(index=windows (EventCode=592 OR EventCode=4688) Image="*\\powershell.exe" CommandLine IN ("*get-netuser*","*get-netgroup*","*get-netgroupmember*","*get-netlocalgroup*","*get-netsession*","*invoke-userhunter*","*get-netou*","*find-gpolocation*","*get-netgpogroup*","*get-objectacl*","*add-objectacl*","*invoke-aclscanner*","*set-adobject*","*invoke-downgradeaccount*","*get-netforest*","*get-netforesttrust*","*get-netforestdomain*","*get-netdomaintrust*","*get-mapdomaintrust*","*powerview*"))

    OR

    (index=windows EventCode=4104 ScriptBlockText IN ("*get-netuser*","*get-netgroup*","*get-netgroupmember*","*get-netlocalgroup*","*get-netsession*","*invoke-userhunter*","*get-netou*","*find-gpolocation*","*get-netgpogroup*","*get-objectacl*","*add-objectacl*","*invoke-aclscanner*","*set-adobject*","*invoke-downgradeaccount*","*get-netforest*","*get-netforesttrust*","*get-netforestdomain*","*get-netdomaintrust*","*get-mapdomaintrust*","*powerview*"))

    | table _time, ComputerName, EventCode, User, Image, CommandLine, ScriptBlockText

    '
  kql: |
    union
    (SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "powershell.exe" or NewProcessName has "powershell.exe"
    | where CommandLine matches regex @".*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*"
    | project TimeGenerated, Computer, Account, EventID, Process, NewProcessName, CommandLine, EventSourceName),
    (Event
    | where TimeGenerated > ago(24h)
    | where EventID == 4104
    | where RenderedDescription has "powershell" or EventData has "ScriptBlockText"
    | extend ScriptBlockText = tostring(EventData)
    | where ScriptBlockText matches regex @".*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*"
    | project TimeGenerated, Computer, EventID, ScriptBlockText, EventSourceName)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "EventID", "Process Name", "Process CommandLine", "ScriptBlockText"
    FROM events
    WHERE (
      ("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" MATCHES '.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*')
      OR
      ("EventID" = '4104' AND "ScriptBlockText" MATCHES '.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*')
    )
    LAST 1 HOURS
  yara_l: |
    rule powerview_execution_t1204 {
      meta:
        author = "TDL"
        description = "Detects PowerView cmdlet execution via process launch or script block logging"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        (
          $proc.metadata.event_type = "PROCESS_LAUNCH" and
          (
            $proc.metadata.product_event_type = "592" or
            $proc.metadata.product_event_type = "4688"
          ) and
          re.regex($proc.principal.process.file.full_path, `(?i)\\powershell\.exe$`) and
          re.regex($proc.principal.process.command_line, `(?i)\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b`) and
          $proc.principal.hostname = $host
        ) or
        (
          $script.metadata.product_event_type = "4104" and
          re.regex($script.target.process.command_line, `(?i)\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b`) and
          $script.principal.hostname = $host
        )

      match:
        $host over 5m

      condition:
        $proc or $script
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*, logs-windows.powershell_operational*
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line RLIKE ".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\b.*")
        OR
        (event.code == "4104" AND powershell.file.script_block_text RLIKE ".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\b.*")
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, powershell.file.script_block_text
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line=/(?i).*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/) OR (source_json.EventID=4104 AND source_json.ScriptBlockText=/(?i).*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    (
      (EventCode IN [4688, 592] FileName=*powershell.exe CommandLine=/.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/i)
      OR
      (EventCode=4104 ScriptBlockText=/.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/i)
    )
    | table([@timestamp, ComputerName, EventCode, FileName, CommandLine, ScriptBlockText, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line ~= ".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\b.*") or (action_evtlog_event_id = 4104 and action_evtlog_message ~= ".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\b.*")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:powershell.exe AND process.command_line:/.*\b(get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/) OR (event.code:4104 AND winlog.event_data.ScriptBlockText:/.*\b(get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/)
  sumo: |
    _sourceCategory=*Windows* (4688 OR 592 OR 4104)
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "ScriptBlockText" as script_block
    | where (event_id in ("4688", "592") and process_name matches "*powershell.exe" and command_line matches /.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/i) OR (event_id = "4104" and script_block matches /.*\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\b.*/i)
    | fields _messageTime, _sourceHost, event_id, process_name, command_line, script_block
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ matches the regex \".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\\
  b.*\"\n\n---------------------------------------------------------------------------------------------------------------\n\n1 Windows Powershell\
  \ Script Execution Event\nWhere the Event ID is 4104\nWhere the Script matches the regex \".*\\b(?:get-netuser|get-netgroup|get-netgroupmember|get-netlocalgroup|get-netsession|invoke-userhunter|get-netou|find-gpolocation|get-netgpogroup|get-objectacl|add-objectacl|invoke-aclscanner|set-adobject|invoke-downgradeaccount|get-netforest|get-netforesttrust|get-netforestdomain|get-netdomaintrust|get-mapdomaintrust|powerview)\\\
  b.*\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

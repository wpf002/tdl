rule_id: TDL-EXE-000515
v4_id: '000515'
name: Enumerating Credentials from Windows Credential Manager
description: Detects when a PowerShell script or command contains commands to enumerate windows credential manager. Derived from a Sigma rule
  created by "frack113".
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    (index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))
    ((EventCode=592 OR EventCode=4688) (Image="*\\powershell.exe" OR process_name="*powershell.exe" OR Process_Name="*powershell.exe") (CommandLine="*vaultcmd*" OR command="*vaultcmd*") (
        (CommandLine="*/listcreds:*" OR command="*/listcreds:*")
        OR
        ((CommandLine="*Windows Credentials*" OR command="*Windows Credentials*") (CommandLine="*Web Credentials*" OR command="*Web Credentials*"))
    ))
    OR
    (EventCode=4104 ScriptBlockText="*vaultcmd*" (
        ScriptBlockText="*/listcreds:*"
        OR
        (ScriptBlockText="*Windows Credentials*" ScriptBlockText="*Web Credentials*")
    ))
    | table _time, ComputerName, User, EventCode, Image, process_name, Process_Name, CommandLine, command, ScriptBlockText
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("powershell.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('powershell.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000515 {\n  meta:\n    author = \"TDL\"\n    description = \"Enumerating Credentials from Windows Credential Manager\"\
    \n    severity = \"MEDIUM\"\n    tactic = \"TA0002\"\n    technique = \"T1204\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\
    \n    $e.process_name = /(powershell.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("powershell.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [powershell.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (powershell.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("powershell.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(powershell.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("powershell.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ contains \"vaultcmd\"\nWhere Command contains \"/listcreds:\"\nOR\n    Where Command contains \"Windows Credentials\"\n    Where Command contains\
  \ \"Web Credentials\"\n\n---------------------------------------------------------------------------------------------------------------\n\n\
  1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nWhere Script contains \"vaultcmd\"\nWhere Script contains \"/listcreds:\"\
  \nOR\n    Where Script contains \"Windows Credentials\"\n    Where Script contains \"Web Credentials\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

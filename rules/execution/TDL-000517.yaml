rule_id: TDL-EXE-000517
v4_id: '000517'
name: Invoke-TotalExec Commandlet Activity
description: Detects when a PowerShell script or command contains the "Invoke-TotalExec" commandlet.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: '(index=windows (EventCode=592 OR EventCode=4688) Image="*\\powershell.exe" CommandLine="*Invoke-TotalExec*") OR (index=windows EventCode=4104
    ScriptBlockText="*Invoke-TotalExec*")

    | table _time, ComputerName, EventCode, User, Image, CommandLine, ScriptBlockText

    '
  kql: |
    union isfuzzy=true
    (
    SecurityEvent
    | where TimeGenerated > ago(1d)
    | where EventID == 4688
    | where Process has "powershell.exe" or NewProcessName has "powershell.exe"
    | where CommandLine has "Invoke-TotalExec"
    | project TimeGenerated, Computer, Account, Process, CommandLine, EventID, SubjectUserName
    ),
    (
    Event
    | where TimeGenerated > ago(1d)
    | where EventID == 4104
    | where RenderedDescription has "Invoke-TotalExec" or ParameterBinding has "Invoke-TotalExec"
    | project TimeGenerated, Computer, UserName, RenderedDescription, EventID
    )
  aql: |
    SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "ScriptBlockText", eventtime, "EventID"
    FROM events
    WHERE (("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" ILIKE '%Invoke-TotalExec%') OR ("EventID" = '4104' AND "ScriptBlockText" ILIKE '%Invoke-TotalExec%'))
    LAST 24 HOURS
  yara_l: |
    rule invoke_totalexec_execution {
      meta:
        author = "TDL"
        description = "Detects execution of Invoke-TotalExec via PowerShell process or script block logging"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        // Process execution events (4688)
        $proc.metadata.event_type = "PROCESS_LAUNCH"
        (
          $proc.metadata.product_event_type = "592" or
          $proc.metadata.product_event_type = "4688"
        )
        re.regex($proc.principal.process.file.full_path, `(?i)powershell\.exe$`)
        re.regex($proc.principal.process.command_line, `(?i)Invoke-TotalExec`)
        $proc.principal.hostname = $host
        $proc.target.user.userid = $user

        // PowerShell script block logging events (4104)
        $script.metadata.event_type = "PROCESS_LAUNCH"
        $script.metadata.product_event_type = "4104"
        re.regex($script.principal.process.command_line, `(?i)Invoke-TotalExec`)
        $script.principal.hostname = $host2
        $script.target.user.userid = $user2

      match:
        $host over 5m
        $host2 over 5m

      outcome:
        $risk_score = 85

      condition:
        $proc or $script
    }
  esql: |
    FROM logs-windows.powershell*, logs-system.security*, winlogbeat-*, logs-endpoint.events.process*
    | WHERE (event.code IN ("592", "4688", "4104") OR winlog.event_id IN (592, 4688, 4104))
      AND (
        (process.name == "powershell.exe" AND process.command_line LIKE "*Invoke-TotalExec*")
        OR (event.code == "4104" AND powershell.file.script_block_text LIKE "*Invoke-TotalExec*")
        OR (winlog.event_id == 4104 AND winlog.event_data.ScriptBlockText LIKE "*Invoke-TotalExec*")
      )
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_id, process.name, process.command_line, powershell.file.script_block_text, winlog.event_data.ScriptBlockText
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line ICONTAINS "Invoke-TotalExec") OR (source_json.EventID=4104 AND source_json.ScriptBlockText ICONTAINS "Invoke-TotalExec"))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    (
      (EventCode=4688 AND NewProcessName=*powershell.exe CommandLine=*Invoke-TotalExec*)
      OR
      (EventCode=592 AND ProcessName=*powershell.exe CommandLine=*Invoke-TotalExec*)
      OR
      (EventCode=4104 ScriptBlockText=*Invoke-TotalExec*)
    )
    | table([@timestamp, ComputerName, EventCode, NewProcessName, ProcessName, CommandLine, ScriptBlockText, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line contains "Invoke-TotalExec")
       or (action_evtlog_event_id = 4104 and action_evtlog_message contains "Invoke-TotalExec")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:*powershell.exe AND process.command_line:*Invoke-TotalExec*) OR (event.code:4104 AND winlog.event_data.ScriptBlockText:*Invoke-TotalExec*)
  sumo: "_sourceCategory=*Windows* (EventID=4688 OR EventID=592 OR EventID=4104)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"NewProcessName\" as process_name\n| json field=_raw \"CommandLine\" as command_line\n| json field=_raw \"ScriptBlockText\" as script_text\n\
    | where (event_id in (\"4688\", \"592\") and process_name matches \"*powershell.exe\" and command_line matches \"*Invoke-TotalExec*\") \n\
    \   OR (event_id = \"4104\" and script_text matches \"*Invoke-TotalExec*\")\n| fields _messageTime, _sourceHost, event_id, process_name, command_line,\
    \ script_text\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ contains \"Invoke-TotalExec\"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nWhere Script contains \"Invoke-TotalExec\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

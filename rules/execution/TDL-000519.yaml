author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ matches the regex \".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
  b.*\"\n\n---------------------------------------------------------------------------------------------------------------\n\n1 Windows Powershell\
  \ Script Execution Event\nWhere the Event ID is 4104\nWhere the Script matches the regex \".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
  b.*\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

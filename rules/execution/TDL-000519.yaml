rule_id: TDL-EXE-000519
v4_id: 000519
name: Potentially Malicious PowerShell Keyword Activity
description: Detects when various malicious command keywords are contained within a PowerShell script or command.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: '(index=windows (EventCode=592 OR EventCode=4688) Image="*\\powershell.exe" CommandLine=*) OR (index=windows EventCode=4104)

    | eval match_process=if(EventCode=592 OR EventCode=4688, if(match(CommandLine, "(?i)\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\.win32\.unsafenativemethods|readprocessmemory\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b"),
    1, 0), 0)

    | eval match_script=if(EventCode=4104, if(match(ScriptBlockText, "(?i)\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\.win32\.unsafenativemethods|readprocessmemory\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b"),
    1, 0), 0)

    | where match_process=1 OR match_script=1

    | table _time, ComputerName, EventCode, User, Image, CommandLine, ScriptBlockText

    '
  kql: "union \n(\nSecurityEvent\n| where EventID in (592, 4688)\n| where Process has \"powershell.exe\" or NewProcessName has \"powershell.exe\"\
    \n| where CommandLine matches regex @\"(?i)\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\.unsafenativemethods|readprocessmemory\\\
    .invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b\"\n| project TimeGenerated, Computer, Account, EventID, Process, NewProcessName, CommandLine, ProcessId\n),\n(\nEvent\n| where EventID ==\
    \ 4104\n| where EventData has \"powershell\"\n| extend ScriptBlockText = tostring(EventData)\n| where ScriptBlockText matches regex @\"(?i)\\\
    b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b\"\n| project TimeGenerated, Computer, UserName, EventID, ScriptBlockText\n)\n"
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"EventID\", \"Process Name\", \"Process CommandLine\", \"ScriptBlockText\"\
    , QIDNAME(qid) AS event_name\nFROM events\nWHERE (\n  (\"EventID\" IN ('592', '4688') \n   AND \"Process Name\" ILIKE '%powershell.exe%' \n\
    \   AND \"Process CommandLine\" MATCHES '.*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\.unsafenativemethods|readprocessmemory\\\
    .invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b.*')\n  OR\n  (\"EventID\" = '4104' \n   AND \"ScriptBlockText\" MATCHES '.*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\\
    .win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b.*')\n)\nLAST 24 HOURS\n"
  yara_l: "rule suspicious_powershell_tokens_or_memory_patterns {\n  meta:\n    author = \"TDL\"\n    description = \"Detects PowerShell execution\
    \ with suspicious token manipulation or memory access patterns (T1204)\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique\
    \ = \"T1204\"\n    \n  events:\n    (\n      $process.metadata.event_type = \"PROCESS_LAUNCH\"\n      (\n        $process.metadata.product_event_type\
    \ = \"592\" or\n        $process.metadata.product_event_type = \"4688\"\n      )\n      re.regex($process.principal.process.file.full_path,\
    \ `(?i)powershell\\.exe$`)\n      re.regex($process.principal.process.command_line, `(?i)\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\\
    .win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b`)\n      $process.principal.hostname = $host\n    )\n    or\n    (\n      $script.metadata.event_type = \"SCRIPT_EXECUTE\"\n      $script.metadata.product_event_type\
    \ = \"4104\"\n      re.regex($script.target.file.contents, `(?i)\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\\
    .unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b`)\n      $script.principal.hostname = $host\n    )\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $process or $script\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.powershell*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line RLIKE ".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\b.*")
        OR
        (event.code == "4104" AND powershell.file.script_block_text RLIKE ".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\b.*")
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, powershell.file.script_block_text
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line=/.*\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b.*/i) OR (source_json.EventID=4104 AND source_json.ScriptBlockText=/.*\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b.*/i))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    AND (
      (EventCode IN [592, 4688] FileName=*powershell.exe CommandLine=/.*\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b.*/i)
      OR
      (EventCode=4104 ScriptBlockText=/.*\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft.win32.unsafenativemethods|readprocessmemory.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\b.*/i)
    )
    | table([@timestamp, ComputerName, EventCode, UserName, FileName, CommandLine, ScriptBlockText])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line ~= ".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\b.*") or (action_evtlog_event_id = 4104 and action_evtlog_message ~= ".*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\.win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\b.*")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:*powershell.exe AND process.command_line:/(adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\.win32\.unsafenativemethods|readprocessmemory\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)/) OR (event.code:4104 AND winlog.event_data.ScriptBlockText:/(adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\.win32\.unsafenativemethods|readprocessmemory\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)/)
  sumo: "(_sourceCategory=*Windows* OR _sourceCategory=*Powershell*) ((\"4688\" OR \"592\") powershell.exe OR \"4104\")\n| json field=_raw \"\
    EventID\" as event_id\n| json field=_raw \"NewProcessName\" as process_name\n| json field=_raw \"ProcessName\" as process_name_alt\n| json\
    \ field=_raw \"CommandLine\" as command_line\n| json field=_raw \"ScriptBlockText\" as script_block\n| where (event_id in (\"4688\", \"592\"\
    ) and (process_name matches \"*powershell.exe\" or process_name_alt matches \"*powershell.exe\") and command_line matches /(?i).*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\\
    .win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b.*/) \n    OR (event_id = \"4104\" and script_block matches /(?i).*\\b(?:adjusttokenprivileges|image_nt_optional_hdr64_magic|microsoft\\\
    .win32\\.unsafenativemethods|readprocessmemory\\.invoke|se_privilege_enabled|lsa_unicode_string|minidumpwritedump|page_execute_read|security_delegation|token_adjust_privileges|token_all_access|token_assign_primary|token_duplicate|token_elevation|token_impersonate|token_information_class|token_privileges|token_query|metasploit)\\\
    b.*/)\n| fields _messageTime, _sourceHost, event_id, process_name, process_name_alt, command_line, script_block\n"
false_positives:
- Security software
- Authorized admin tools

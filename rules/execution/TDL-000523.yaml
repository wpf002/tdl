rule_id: TDL-EXE-000523
v4_id: '000523'
name: Powershell ZeroLogon Commandlet Activity
description: Detects when a PowerShell script or command contains the "Invoke-ZeroLogon" commandlet.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688) (Image=\"*\\\\powershell.exe\" OR NewProcessName=\"*\\\\powershell.exe\") CommandLine=\"\
    *Invoke-ZeroLogon*\") OR (index=windows EventCode=4104 ScriptBlockText=\"*Invoke-ZeroLogon*\")\n| eval detection_source=case(\n    EventCode=592\
    \ OR EventCode=4688, \"Process Execution\",\n    EventCode=4104, \"Script Block\"\n)\n| table _time, ComputerName, host, EventCode, detection_source,\
    \ User, Image, NewProcessName, CommandLine, ScriptBlockText\n"
  kql: "union \n(SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (592, 4688)\n| where Process has \"powershell.exe\"\n| where\
    \ CommandLine contains \"Invoke-ZeroLogon\"\n| project TimeGenerated, Computer, Account, Process, CommandLine, EventID),\n(Event\n| where\
    \ TimeGenerated > ago(1h)\n| where EventID == 4104\n| where ParameterXml contains \"Invoke-ZeroLogon\" or RenderedDescription contains \"\
    Invoke-ZeroLogon\"\n| project TimeGenerated, Computer, UserName, EventID, RenderedDescription)\n"
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "ScriptBlockText"
    FROM events
    WHERE (("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" ILIKE '%Invoke-ZeroLogon%') OR ("EventID" = '4104' AND "ScriptBlockText" ILIKE '%Invoke-ZeroLogon%'))
    LAST 24 HOURS
  yara_l: |
    rule zerologon_invocation {
      meta:
        author = "Detection Engineer"
        description = "Detects Invoke-ZeroLogon usage via process execution or PowerShell script block logging"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        // Process execution event (4688) with powershell.exe and Invoke-ZeroLogon in command line
        (
          $proc.metadata.event_type = "PROCESS_LAUNCH" and
          (
            $proc.metadata.product_event_type = "592" or
            $proc.metadata.product_event_type = "4688"
          ) and
          re.regex($proc.principal.process.file.full_path, `(?i)\\powershell\.exe$`) and
          re.regex($proc.principal.process.command_line, `(?i)Invoke-ZeroLogon`) and
          $proc.principal.hostname = $host
        ) or
        // PowerShell script block logging (4104) with Invoke-ZeroLogon in script content
        (
          $script.metadata.event_type = "SCRIPT_EXECUTION" and
          $script.metadata.product_event_type = "4104" and
          re.regex($script.security_result.description, `(?i)Invoke-ZeroLogon`) and
          $script.principal.hostname = $host
        )

      match:
        $host over 5m

      outcome:
        $risk_score = 95

      condition:
        $proc or $script
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, logs-endpoint.events.process*, winlogbeat-*, logs-windows.powershell_operational*
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line LIKE "*Invoke-ZeroLogon*")
        OR
        (event.code == "4104" AND powershell.file.script_block_text LIKE "*Invoke-ZeroLogon*")
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, powershell.file.script_block_text, process.parent.name
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line ICONTAINS "Invoke-ZeroLogon") OR (source_json.EventID=4104 AND source_json.ScriptBlockText ICONTAINS "Invoke-ZeroLogon"))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    AND (
      (
        (EventCode=4688 OR EventCode=592)
        AND (FileName=powershell.exe OR NewProcessName=*powershell.exe)
        AND CommandLine=*Invoke-ZeroLogon*
      )
      OR
      (
        EventCode=4104
        AND ScriptBlockText=*Invoke-ZeroLogon*
      )
    )
    | table([@timestamp, ComputerName, EventCode, UserName, FileName, NewProcessName, CommandLine, ScriptBlockText])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(action_process_image_name) contains "powershell.exe" and action_process_image_command_line contains "Invoke-ZeroLogon")
       or (action_evtlog_event_id = 4104 and action_evtlog_message contains "Invoke-ZeroLogon")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:*powershell.exe AND process.command_line:*Invoke-ZeroLogon*) OR (event.code:4104 AND winlog.event_data.ScriptBlockText:*Invoke-ZeroLogon*)
  sumo: "_sourceCategory=*Windows* (EventID=4688 OR EventID=592 OR EventID=4104)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"NewProcessName\" as process_name\n| json field=_raw \"CommandLine\" as command_line\n| json field=_raw \"ScriptBlockText\" as script_block\n\
    | where (event_id in (\"4688\", \"592\") and process_name matches \"*powershell.exe\" and command_line matches \"*Invoke-ZeroLogon*\") \n\
    \   OR (event_id = \"4104\" and script_block matches \"*Invoke-ZeroLogon*\")\n| fields _messageTime, _sourceHost, event_id, process_name,\
    \ command_line, script_block\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ contains \"Invoke-ZeroLogon\"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nWhere Script contains \"Invoke-ZeroLogon\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

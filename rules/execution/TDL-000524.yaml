rule_id: TDL-EXE-000524
v4_id: '000524'
name: UtilityFunctions Script Usage Detected
description: Detects the use of UtilityFunctions.ps1 within a PowerShel Script or command to execute a managed DLL. Derived from a Sigma rule
  created by "frack113".
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: '(index=windows (EventCode=592 OR EventCode=4688) (Image="*\\powershell.exe" OR process_name="*powershell.exe") (CommandLine="*UtilityFunctions.ps1*"
    AND CommandLine="*RegSnapin*")) OR (index=windows EventCode=4104 ScriptName="*UtilityFunctions.ps1*")

    | table _time, ComputerName, EventCode, User, Image, process_name, CommandLine, ScriptName

    '
  kql: "union \n(\nSecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (592, 4688)\n| where Process has \"powershell.exe\"\n| where\
    \ CommandLine has \"UtilityFunctions.ps1\" and CommandLine has \"RegSnapin \"\n| project TimeGenerated, Computer, Account, Process, CommandLine,\
    \ EventID\n),\n(\nEvent\n| where TimeGenerated > ago(1h)\n| where EventID == 4104\n| where EventData has \"UtilityFunctions.ps1\"\n| extend\
    \ ScriptBlockText = tostring(EventData)\n| where ScriptBlockText has \"UtilityFunctions.ps1\"\n| project TimeGenerated, Computer, UserName,\
    \ ScriptBlockText, EventID\n)\n"
  aql: |
    SELECT sourceip, username, "Process CommandLine", "Process Name", eventtime, LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE (
        ("EventID" IN ('592', '4688') AND "Process Name" ILIKE '%powershell.exe%' AND "Process CommandLine" ILIKE '%UtilityFunctions.ps1%' AND "Process CommandLine" ILIKE '%RegSnapin%')
        OR
        ("EventID" = '4104' AND "ScriptName" ILIKE '%UtilityFunctions.ps1%')
    )
    LAST 24 HOURS
  yara_l: "rule windows_backup_ps1_execution {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects execution of UtilityFunctions.ps1\
    \ with RegSnapin parameter via PowerShell\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1204\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    // Process execution path - Event IDs 592 or 4688\n    $proc.metadata.event_type = \"PROCESS_LAUNCH\"\
    \n    (\n      $proc.metadata.product_event_type = \"592\" or\n      $proc.metadata.product_event_type = \"4688\"\n    )\n    re.regex($proc.principal.process.file.full_path,\
    \ `(?i)powershell\\.exe$`)\n    re.regex($proc.principal.process.command_line, `(?i)UtilityFunctions\\.ps1`)\n    re.regex($proc.principal.process.command_line,\
    \ `(?i)RegSnapin`)\n    $proc.principal.hostname = $host\n    \n    // PowerShell Script Block path - Event ID 4104\n    $script.metadata.event_type\
    \ = \"SCRIPT_EXECUTION\"\n    $script.metadata.product_event_type = \"4104\"\n    re.regex($script.target.file.full_path, `(?i)UtilityFunctions\\\
    .ps1$`)\n    $script.principal.hostname = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $proc or $script\n}\n"
  esql: |
    FROM logs-windows.*, logs-system.security*, logs-microsoft_windows_powershell.operational*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND process.command_line LIKE "*UtilityFunctions.ps1*" AND process.command_line LIKE "*RegSnapin*")
        OR
        (event.code == "4104" AND winlog.event_data.ScriptName == "UtilityFunctions.ps1")
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, winlog.event_data.ScriptName, winlog.event_data.ScriptBlockText
  leql: |
    where((source_json.EventID IN [592, 4688] AND process_name ICONTAINS "powershell.exe" AND process_cmd_line ICONTAINS "UtilityFunctions.ps1" AND process_cmd_line ICONTAINS "RegSnapin") OR (source_json.EventID=4104 AND source_json.ScriptName ICONTAINS "UtilityFunctions.ps1"))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    | case {
        EventCode=4688 OR EventCode=592 | FileName=*powershell.exe CommandLine=*UtilityFunctions.ps1* CommandLine=*RegSnapin*;
        EventCode=4104 | ScriptName=*UtilityFunctions.ps1*;
        * | drop();
      }
    | table([@timestamp, ComputerName, EventCode, FileName, CommandLine, ScriptName, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and lowercase(actor_process_image_name) contains "powershell.exe" and action_process_image_command_line contains "UtilityFunctions.ps1" and action_process_image_command_line contains "RegSnapin") or (action_evtlog_event_id = 4104 and action_evtlog_message contains "UtilityFunctions.ps1")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, actor_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:*powershell.exe AND process.command_line:*UtilityFunctions.ps1* AND process.command_line:*RegSnapin*) OR (event.code:4104 AND powershell.file.script_block_text:*UtilityFunctions.ps1*)
  sumo: "_sourceCategory=*Windows* (EventID=4688 OR EventID=592 OR EventID=4104)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"NewProcessName\" as process_name\n| json field=_raw \"CommandLine\" as command_line\n| json field=_raw \"ScriptBlockText\" as script_block\n\
    | json field=_raw \"Path\" as script_path\n| where (event_id in (\"4688\", \"592\") and process_name matches \"*powershell.exe\" and command_line\
    \ matches \"*UtilityFunctions.ps1*\" and command_line matches \"*RegSnapin*\") \n   OR (event_id = \"4104\" and script_path matches \"*UtilityFunctions.ps1*\"\
    )\n| fields _messageTime, _sourceHost, event_id, process_name, command_line, script_path, script_block\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nWhere Command\
  \ contains \"UtilityFunctions.ps1\"\nWhere Command contains \"RegSnapin \"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nWhere Script Name is \"UtilityFunctions.ps1\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

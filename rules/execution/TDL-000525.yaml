rule_id: TDL-EXE-000525
v4_id: '000525'
name: ScreenConnect CMD Command Execution
description: Detects cmd.exe command execution through ScreenConnect application
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=windows (EventCode=592 OR EventCode=4688) process_name="*cmd.exe" parent_process_name="*screenconnect*"

    | table _time, ComputerName, User, process_name, parent_process_name, command_line

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (592, 4688)
    | where Process has "cmd.exe"
    | where ParentProcessName contains "screenconnect"
    | project TimeGenerated, Computer, Account, Process, ParentProcessName, CommandLine, ProcessId, SubjectUserName, SubjectDomainName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine"
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%cmd.exe%'
      AND "Parent Process Name" ILIKE '%screenconnect%'
    LAST 24 HOURS
  yara_l: |
    rule screenconnect_cmd_execution {
      meta:
        author = "TDL"
        description = "Detects cmd.exe execution spawned by ScreenConnect process - T1204"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          $e.metadata.product_event_type = "592" or
          $e.metadata.product_event_type = "4688"
        )
        re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`)
        re.regex($e.principal.process.file.full_path, `(?i)screenconnect`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-windows.security*, winlogbeat-*, logs-system.security*
    | WHERE winlog.event_id IN (592, 4688) AND process.name == "cmd.exe" AND process.parent.name LIKE "*screenconnect*"
    | KEEP @timestamp, host.name, user.name, process.name, process.parent.name, process.command_line, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ICONTAINS "cmd.exe" AND parent_process_name ICONTAINS "screenconnect")
  crowdstrike: |
    EventCode IN [592, 4688] FileName=cmd.exe ParentBaseFileName=*screenconnect*
    | table([@timestamp, ComputerName, UserName, FileName, ParentBaseFileName, CommandLine])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (592, 4688)
    | filter lowercase(action_process_image_name) contains "cmd.exe"
    | filter lowercase(actor_process_image_name) contains "screenconnect"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:(592 OR 4688) AND process.name:cmd.exe AND process.parent.name:*screenconnect*
  sumo: |
    _sourceCategory=*Windows* (EventID=4688 OR EventID=592)
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process_name
    | where event_id in ("4688", "592")
    | where process_name matches "*cmd.exe"
    | where parent_process_name matches "*screenconnect*"
    | fields _messageTime, _sourceHost, event_id, process_name, parent_process_name
false_positives:
- 'ref: https://www.huntandhackett.com/blog/revil-the-usage-of-legitimate-remote-admin-tooling'
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is cmd.exe\nWhere the Parent Process\
  \ Name contains \"screenconnect\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

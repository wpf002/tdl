rule_id: TDL-EXE-000550
v4_id: '000550'
name: Anti-virus Malware Found
description: Antivirus detects and attempts to take action on files that are found to be potentially malicious. Any antivirus event that identifies
  a file as malicious, regardless of the action taken, will be used in further correlation.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Antivirus
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=antivirus signature_name="*" OR signature="*" OR threat_name="*" OR malware_name="*" OR action="quarantine"
    OR action="blocked" OR action="detected"

    | eval detection_type=coalesce(signature_name, signature, threat_name, malware_name, "unknown")

    | where detection_type!="unknown"

    | dedup host, user, detection_type, file_name, file_path

    | table _time, host, user, detection_type, file_name, file_path, action, sourcetype

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(90d)\n| where EventID == 1116\n| where ThreatName !in~ (\"PUA:\", \"LowFi\", \"BrowserModifier\"\
    )\n| where InitiatingProcessFileName !in~ (\"MsMpEng.exe\", \"NisSrv.exe\", \"MpCmdRun.exe\", \"ConfigSecurityPolicy.exe\")\n| summarize \n\
    \    Hosts = make_set(Computer),\n    Users = make_set(SubjectUserName),\n    FirstSeen = min(TimeGenerated),\n    LastSeen = max(TimeGenerated),\n\
    \    EventCount = count()\n    by ThreatName, Process, CommandLine, ParentProcessName\n| where EventCount >= 1\n| project FirstSeen, LastSeen,\
    \ ThreatName, Process, ParentProcessName, CommandLine, Hosts, Users, EventCount\n"
  aql: |
    SELECT DATEFORMAT(eventtime, 'yyyy-MM-dd HH:mm:ss') AS event_time, LOGSOURCENAME(logsourceid) AS host, username AS user, "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, CATEGORYNAME(category) AS event_category, qidname(qid) AS event_name FROM events WHERE (CATEGORYNAME(category) ILIKE '%malware%' OR CATEGORYNAME(category) ILIKE '%virus%' OR CATEGORYNAME(category) ILIKE '%antivirus%' OR qidname(qid) ILIKE '%malware%' OR qidname(qid) ILIKE '%virus%' OR qidname(qid) ILIKE '%threat%detected%') AND "Process Name" IS NOT NULL LAST 7 DAYS
  yara_l: |
    rule antivirus_malware_found {
      meta:
        author = "Detection Engineering"
        description = "T1204 - User Execution - Antivirus malware detection"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "High"

      events:
        $e.metadata.event_type = "SCAN_UNCATEGORIZED"
        $e.security_result.summary = "VIRUS_DETECTED" or
        $e.security_result.summary = "MALWARE_DETECTED" or
        re.regex($e.metadata.description, `(?i)(malware|virus|threat).*(detected|found)`) or
        re.regex($e.security_result.description, `(?i)(malware|virus|threat).*(detected|found)`)
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 1h

      condition:
        $e
    }
  esql: "FROM .alerts-security.alerts-*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.kind == \"alert\" \n  AND event.category == \"malware\"\
    \n  AND (event.type == \"info\" OR event.type == \"detection\")\n| STATS alert_count = COUNT(*) BY host.name, user.name, file.name, file.path,\
    \ process.name\n| WHERE alert_count >= 1\n| KEEP @timestamp, host.name, user.name, file.name, file.path, process.name, alert_count\n"
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\+.*/)
  crowdstrike: |
    #event_type=Event_ExternalApiEvent ExternalApiType=Event_DetectionSummaryEvent DetectName=*malware* OR DetectDescription=*malware* OR Tactic=*malware* OR (event_simpleName=DetectionSummaryEvent (DetectName=*malware* OR DetectDescription=*malware*))
    | groupBy([ComputerName, UserName, FileName, SHA256HashData], function=count(as=detections))
    | detections >= 1
    | table([@timestamp, ComputerName, UserName, FileName, SHA256HashData, DetectName, DetectDescription, detections])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_MALWARE and action_evtlog_event_id = 1 \n| dedup agent_hostname, actor_effective_username,\
    \ action_process_image_name, actor_process_image_name, action_process_image_command_line\n| fields _time, agent_hostname, actor_effective_username,\
    \ action_process_image_name, actor_process_image_name, action_process_image_command_line\n"
  lucene: |
    event.action:"malware_detected" OR event.action:"threat_detected" OR event.type:"malware" OR signature:"malware" OR threat.name:* OR malware.name:* OR av_action:("detected" OR "quarantined" OR "blocked")
  sumo: |
    _sourceCategory=*Antivirus* OR _sourceCategory=*AV* OR _sourceCategory=*endpoint*
    | where _raw matches "*malware*" OR _raw matches "*threat*" OR _raw matches "*virus*" OR _raw matches "*detected*"
    | json field=_raw "process_name" as process_name nodrop
    | json field=_raw "parent_process_name" as parent_process_name nodrop
    | json field=_raw "command_line" as command_line nodrop
    | json field=_raw "host" as host nodrop
    | json field=_raw "Computer" as Computer nodrop
    | json field=_raw "user" as user nodrop
    | json field=_raw "TargetUserName" as TargetUserName nodrop
    | json field=_raw "threat_name" as threat_name nodrop
    | json field=_raw "file_path" as file_path nodrop
    | json field=_raw "detection_type" as detection_type nodrop
    | if(isNull(host), Computer, host) as host
    | if(isNull(user), TargetUserName, user) as user
    | where !(process_name matches "*defender*" OR process_name matches "*mcafee*" OR process_name matches "*symantec*" OR process_name matches "*norton*" OR parent_process_name matches "*sccm*" OR parent_process_name matches "*tanium*")
    | dedup process_name, parent_process_name, command_line, host, user
    | fields _messageTime, host, user, process_name, parent_process_name, command_line, threat_name, file_path, detection_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance within any time window of an Antivirus Malware Found event.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1 (Process Creation)

  With process_name matching wildcard pattern "*.+*" indicating a potentially malicious or anomalously named executable

  With fields captured including process_name, parent_process_name, command_line, host, and user

  Where count of matching process creation events is greater than or equal to 1

  Excluding events associated with known security software or authorized admin tools per false-positive allow-list

  With the same process_name and parent_process_name and command_line as the correlation key, deduplicated across unique host and user combinations'

rule_id: TDL-EXE-000557
v4_id: '000557'
name: AWS Runtime Suspicious Command Executed - GuardDuty
description: This detection looks for potentially malicious commands being ran in AWS that could be indicative of a compromise. The commands could
  be a threat actor performing discovery activity, establishing  persistence or excuting malicious processes.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(detail.type=\"DefenseEvasion:Runtime/SuspiciousCommand\" OR detail.type=\"Discovery:Runtime/SuspiciousCommand\"\
    \ OR detail.type=\"Execution:Runtime/SuspiciousCommand\" OR detail.type=\"Persistence:Runtime/SuspiciousCommand\" OR detail.type=\"PrivilegeEscalation:Runtime/SuspiciousCommand\"\
    )\n| table _time, detail.type, detail.accountId, detail.resource.instanceDetails.instanceId, detail.resource.instanceDetails.imageId, detail.severity,\
    \ detail.title, detail.description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where FindingType in ("DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand")
    | project TimeGenerated, FindingType, AccountId, Region, Resource, Severity, Title, Description
  aql: |
    SELECT "AWS Account ID", "Finding Type", "Resource Type", "Instance ID", "Severity", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%guardduty%'
      AND "Finding Type" IN ('DefenseEvasion:Runtime/SuspiciousCommand', 'Discovery:Runtime/SuspiciousCommand', 'Execution:Runtime/SuspiciousCommand', 'Persistence:Runtime/SuspiciousCommand', 'PrivilegeEscalation:Runtime/SuspiciousCommand')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_suspicious_command_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty suspicious command execution findings (MITRE T1204)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "DefenseEvasion:Runtime/SuspiciousCommand" or
          $e.metadata.product_event_type = "Discovery:Runtime/SuspiciousCommand" or
          $e.metadata.product_event_type = "Execution:Runtime/SuspiciousCommand" or
          $e.metadata.product_event_type = "Persistence:Runtime/SuspiciousCommand" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Runtime/SuspiciousCommand"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.type, aws.guardduty.resource.instance_details.instance_id, event.type, event.severity
  leql: |
    where(source_json.type IN ["DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand"])
  crowdstrike: |
    #event_type=guardduty
    | finding.type in ["DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand"]
    | table([@timestamp, finding.type, resource.instanceDetails.instanceId, account.id, finding.severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and log_name = "GuardDuty"
    | filter event_type in ("DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand")
    | fields _time, event_type, resource_name, identity_name, project
  lucene: |
    event.type:"GuardDuty" AND finding.type:("DefenseEvasion:Runtime/SuspiciousCommand" OR "Discovery:Runtime/SuspiciousCommand" OR "Execution:Runtime/SuspiciousCommand" OR "Persistence:Runtime/SuspiciousCommand" OR "PrivilegeEscalation:Runtime/SuspiciousCommand")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("DefenseEvasion:Runtime/SuspiciousCommand", "Discovery:Runtime/SuspiciousCommand", "Execution:Runtime/SuspiciousCommand", "Persistence:Runtime/SuspiciousCommand", "PrivilegeEscalation:Runtime/SuspiciousCommand")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:Runtime/SuspiciousCommand\", \"Discovery:Runtime/SuspiciousCommand\"\
  , \"Execution:Runtime/SuspiciousCommand\", \"Persistence:Runtime/SuspiciousCommand\", \"PrivilegeEscalation:Runtime/SuspiciousCommand\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000557
v4_id: '000557'
name: AWS Runtime Suspicious Command Executed - GuardDuty
description: This detection looks for potentially malicious commands being ran in AWS that could be indicative of a compromise. The commands could
  be a threat actor performing discovery activity, establishing  persistence or excuting malicious processes.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(detail.type=\"DefenseEvasion:Runtime/SuspiciousCommand\" OR detail.type=\"Discovery:Runtime/SuspiciousCommand\"\
    \ OR detail.type=\"Execution:Runtime/SuspiciousCommand\" OR detail.type=\"Persistence:Runtime/SuspiciousCommand\" OR detail.type=\"PrivilegeEscalation:Runtime/SuspiciousCommand\"\
    )\n| table _time, detail.type, detail.accountId, detail.resource.instanceDetails.instanceId, detail.resource.instanceDetails.imageId, detail.severity,\
    \ detail.title, detail.description\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "GuardDuty"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%GuardDuty%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000557 {\n  meta:\n    author = \"TDL\"\n    description = \"AWS Runtime Suspicious Command Executed - GuardDuty\"\
    \n    severity = \"LOW\"\n    tactic = \"TA0002\"\n    technique = \"T1204\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /GuardDuty/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%GuardDuty%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/GuardDuty/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*GuardDuty*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "GuardDuty"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*GuardDuty*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*GuardDuty*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:Runtime/SuspiciousCommand\", \"Discovery:Runtime/SuspiciousCommand\"\
  , \"Execution:Runtime/SuspiciousCommand\", \"Persistence:Runtime/SuspiciousCommand\", \"PrivilegeEscalation:Runtime/SuspiciousCommand\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000563
v4_id: '000563'
name: Command Execution on Pod
description: Detects a user executing a bash shell within a pod. This will only show the execution and not have visibility into what happens after
  the shell is started
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Kubernetes
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype=kube:*\n(\n  (objectRef.resource=\"pods\" verb=\"create\" objectRef.subresource=\"exec\")\n  OR\n  (requestURI=\"*%2Fbin%2Fbash*\"\
    )\n  OR\n  (requestURI=\"*%2Fbin%2Fsh*\")\n  OR\n  (requestURI=\"*/bin/bash*\")\n  OR\n  (requestURI=\"*%/bin/sh%*\")\n  OR\n  (requestURI=\"\
    bash *\")\n  OR\n  (requestURI=\"sh *\")\n)\n| table _time, user.username, sourceIPs{}, objectRef.namespace, objectRef.name, verb, requestURI,\
    \ responseStatus.code\n"
  kql: |
    KubernetesAudit
    | where TimeGenerated > ago(1h)
    | where ObjectRef.resource =~ "pods"
    | where (ObjectRef.subresource =~ "exec" and Verb =~ "create")
        or (RequestURI has_any ("%2Fbin%2Fbash", "%2Fbin%2Fsh", "/bin/bash", "%2Fbin%2Fsh")
            or RequestURI startswith "bash "
            or RequestURI startswith "sh ")
    | project TimeGenerated, Namespace = ObjectRef.namespace, PodName = ObjectRef.name, User = UserAgent, SourceIP = SourceIPs, Verb, RequestURI, ResponseStatus.code
  aql: |
    SELECT eventtime, sourceip, username, LOGSOURCENAME(logsourceid) AS log_source, "RequestURI", "Verb", "Resource", "Subresource"
    FROM events
    WHERE (("Resource" = 'pods' AND "Subresource" = 'exec' AND "Verb" = 'create')
       OR ("RequestURI" ILIKE '%2Fbin%2Fbash%'
           OR "RequestURI" ILIKE '%2Fbin%2Fsh%'
           OR "RequestURI" ILIKE '%/bin/bash%'
           OR "RequestURI" ILIKE '%/bin/sh%'
           OR "RequestURI" ILIKE 'bash %'
           OR "RequestURI" ILIKE 'sh %'))
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_pod_exec_shell_access {
      meta:
        author = "TDL"
        description = "Detects Kubernetes pod exec operations with shell access - T1204 Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Kubernetes"
        (
          (
            $e.target.resource.name = "pods"
            $e.metadata.description = "exec"
            $e.security_result.action = "create"
          )
          or
          (
            re.regex($e.target.url, `(?i)(%2Fbin%2Fbash|%2Fbin%2Fsh|/bin/bash|%/bin/sh%|^bash |^sh )`)
          )
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE (kubernetes.audit.objectRef.resource == \"pods\" \n        AND kubernetes.audit.objectRef.subresource\
    \ == \"exec\" \n        AND kubernetes.audit.verb == \"create\")\n    OR (kubernetes.audit.requestURI LIKE \"*%2Fbin%2Fbash*\"\n        OR\
    \ kubernetes.audit.requestURI LIKE \"*%2Fbin%2Fsh*\"\n        OR kubernetes.audit.requestURI LIKE \"*/bin/bash*\"\n        OR kubernetes.audit.requestURI\
    \ LIKE \"*%/bin/sh%*\"\n        OR STARTS_WITH(kubernetes.audit.requestURI, \"bash \")\n        OR STARTS_WITH(kubernetes.audit.requestURI,\
    \ \"sh \"))\n| KEEP @timestamp, host.name, user.name, kubernetes.audit.objectRef.resource, kubernetes.audit.objectRef.subresource, kubernetes.audit.verb,\
    \ kubernetes.audit.requestURI, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name\n"
  leql: |
    where((source_json.objectRef.resource="pods" AND source_json.objectRef.subresource="exec" AND source_json.verb="create") OR (source_json.requestURI ICONTAINS "%2Fbin%2Fbash" OR source_json.requestURI ICONTAINS "%2Fbin%2Fsh" OR source_json.requestURI ICONTAINS "/bin/bash" OR source_json.requestURI ICONTAINS "%/bin/sh%" OR source_json.requestURI STARTS-WITH "bash " OR source_json.requestURI STARTS-WITH "sh "))
  crowdstrike: |
    (#type=k8s OR event_simpleName=*Kubernetes* OR #repo=kubernetes)
    | (ObjectRef.Resource="pods" ObjectRef.Subresource="exec" Verb="create")
       OR (RequestURI=*%2Fbin%2Fbash* OR RequestURI=*%2Fbin%2Fsh* OR RequestURI=*/bin/bash* OR RequestURI=*%2Fbin%2Fsh%* OR RequestURI="bash *" OR RequestURI="sh *")
    | table([@timestamp, ObjectRef.Namespace, ObjectRef.Name, Verb, RequestURI, User.Username, SourceIPs])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"GCP\" and resource_type = \"k8s_cluster\"\n| filter json_extract_scalar(raw_log,\
    \ \"$.resource.type\") = \"k8s_cluster\"\n   and (\n     (json_extract_scalar(raw_log, \"$.protoPayload.resourceName\") ~= \".*pods.*\" \n\
    \      and json_extract_scalar(raw_log, \"$.protoPayload.request.resource\") = \"pods\"\n      and json_extract_scalar(raw_log, \"$.protoPayload.request.subresource\"\
    ) = \"exec\"\n      and json_extract_scalar(raw_log, \"$.protoPayload.request.verb\") = \"create\")\n     or\n     (json_extract_scalar(raw_log,\
    \ \"$.protoPayload.requestUri\") contains \"%2Fbin%2Fbash\")\n     or\n     (json_extract_scalar(raw_log, \"$.protoPayload.requestUri\") contains\
    \ \"%2Fbin%2Fsh\")\n     or\n     (json_extract_scalar(raw_log, \"$.protoPayload.requestUri\") contains \"/bin/bash\")\n     or\n     (json_extract_scalar(raw_log,\
    \ \"$.protoPayload.requestUri\") contains \"%/bin/sh%\")\n     or\n     (json_extract_scalar(raw_log, \"$.protoPayload.requestUri\") ~= \"\
    ^bash .*\")\n     or\n     (json_extract_scalar(raw_log, \"$.protoPayload.requestUri\") ~= \"^sh .*\")\n   )\n| fields _time, json_extract_scalar(raw_log,\
    \ \"$.protoPayload.requestUri\") as request_uri, json_extract_scalar(raw_log, \"$.protoPayload.request.resource\") as resource, json_extract_scalar(raw_log,\
    \ \"$.protoPayload.request.subresource\") as subresource, json_extract_scalar(raw_log, \"$.protoPayload.request.verb\") as verb, json_extract_scalar(raw_log,\
    \ \"$.protoPayload.authenticationInfo.principalEmail\") as principal\n"
  lucene: |
    (objectRef.resource:pods AND objectRef.subresource:exec AND verb:create) OR (requestURI:(*%2Fbin%2Fbash* OR *%2Fbin%2Fsh* OR */bin/bash* OR *%2Fbin%2Fsh* OR "bash *" OR "sh *"))
  sumo: |
    _sourceCategory=*Kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "objectRef.subresource" as subresource
    | json field=_raw "verb" as verb
    | json field=_raw "requestURI" as request_uri
    | where (resource = "pods" and subresource = "exec" and verb = "create")
       or (request_uri matches "*%2Fbin%2Fbash*")
       or (request_uri matches "*%2Fbin%2Fsh*")
       or (request_uri matches "*/bin/bash*")
       or (request_uri matches "*%/bin/sh%*")
       or (request_uri matches "bash *")
       or (request_uri matches "sh *")
    | fields _messageTime, _sourceHost, resource, subresource, verb, request_uri
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Subresource is \"exec\"\nWhere Verb is \"create\"\nOR\n    Where the\
  \ RequestURI contains \"%2Fbin%2Fbash\"\n    Where the RequestURI contains \"%2Fbin%2Fsh\"\n    Where the RequestURI contains \"/bin/bash\"\n\
  \    Where the RequestURI contains \"%/bin/sh%\"\n    Where the RequestURI starts with \"bash \"\n    Where the RequestURI starts with \"sh\
  \ \""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

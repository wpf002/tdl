rule_id: TDL-EXE-000564
v4_id: '000564'
name: Kubernetes Cronjob Created
description: Detects when a user creates a cronjob within Kubernetes
tactic: Execution
tactic_id: TA0002
technique_id: T1053
technique_name: Scheduled Task/Job
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes (verb=create resource=cronjob subresource="") OR (verb=create resource=cronjob NOT subresource=*)

    | table _time, user, verb, resource, subresource, name, namespace, host

    '
  kql: "KubernetesAuditLogs\n| where TimeGenerated > ago(24h)\n| where Verb =~ \"create\"\n| where (ObjectRef.resource =~ \"cronjobs\" and ObjectRef.subresource\
    \ == \"\") \n     or (ObjectRef.resource =~ \"jobs\" and ObjectRef.subresource =~ \"cronjobs\")\n| project TimeGenerated, User.username, User.groups,\
    \ ObjectRef.namespace, ObjectRef.name, ObjectRef.resource, ObjectRef.subresource, Verb, SourceIPs, UserAgent, RequestURI\n"
  aql: |
    SELECT objectRef.name AS resource_name, verb, objectRef.resource, objectRef.subresource, user.username, sourceIPs, userAgent, requestReceivedTimestamp
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%kubernetes%'
      AND verb = 'create'
      AND objectRef.resource = 'cronjobs'
      AND objectRef.subresource IS NULL
    LAST 1 HOURS
  yara_l: "rule kubernetes_cronjob_creation {\n  meta:\n    author = \"Chronicle Detection\"\n    description = \"Detects creation of Kubernetes\
    \ cronjobs - MITRE T1053 Execution via Scheduled Task/Job\"\n    mitre_attack_technique = \"T1053\"\n    mitre_attack_tactic = \"Execution\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $k.metadata.event_type = \"RESOURCE_CREATION\"\n    $k.metadata.product_name = \"Kubernetes\"\
    \n    $k.target.resource.attribute.labels[\"verb\"] = \"create\"\n    (\n      ($k.target.resource.name = \"cronjob\" and $k.target.resource.attribute.labels[\"\
    subresource\"] = \"\") or\n      ($k.target.resource.attribute.labels[\"resource\"] = \"cronjob\" and $k.target.resource.attribute.labels[\"\
    subresource\"] = \"\")\n    )\n    $k.principal.user.userid = $user\n    $k.target.resource.attribute.labels[\"namespace\"] = $namespace\n\
    \    \n  match:\n    $user, $namespace over 5m\n    \n  condition:\n    $k\n}\n"
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND kubernetes.audit.verb == \"create\" \n  AND kubernetes.audit.objectRef.resource\
    \ == \"cronjobs\" \n  AND kubernetes.audit.objectRef.subresource IS NULL\n| KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace,\
    \ kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.verb, kubernetes.audit.objectRef.resource\n"
  leql: |
    where(source_json.verb="create" AND (source_json.objectRef.resource="cronjob" OR source_json.objectRef.resource="cronjobs") AND (source_json.objectRef.subresource=null OR NOT(source_json.objectRef.subresource)))
  crowdstrike: |
    #type=kubernetes event.verb=create (event.resource=cronjob OR event.resource=cronjobs) (NOT event.subresource=* OR event.subresource="")
    | table([@timestamp, event.verb, event.resource, event.subresource, event.user.username, event.objectRef.name, event.objectRef.namespace])
  xql: |
    dataset = cloud_audit_logs
    | filter lowercase(cloud_provider) = "kubernetes" and (verb = "create" and resource = "cronjob" and subresource = null) or (resource = "cronjob" and subresource = "cronjob")
    | fields _time, user, verb, resource, subresource, object_name, namespace, cloud_provider
  lucene: |
    verb:"create" AND resource:"cronjob" AND NOT _exists_:subresource
  sumo: |
    _sourceCategory=*Kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "objectRef.subresource" as subresource
    | where verb = "create" and (resource = "cronjob" or subresource = "cronjob") and (subresource = "" or isNull(subresource) or subresource = "cronjob")
    | fields _messageTime, _sourceHost, verb, resource, subresource
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"create\"\nOR\n             Where Resource is \"cronjob\"\n             Where Subresource is\
  \ NULL\n\n             Where Subresource is \"cronjob\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

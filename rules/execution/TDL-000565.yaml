rule_id: TDL-EXE-000565
v4_id: '000565'
name: Kubernetes Cronjob Deleted
description: Detects when a user deletes a cronjob within Kubernetes
tactic: Execution
tactic_id: TA0002
technique_id: T1053
technique_name: Scheduled Task/Job
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=* sourcetype=kube:* OR sourcetype=kubernetes:* (verb=delete OR objectRef.resource=cronjob) objectRef.subresource=null OR objectRef.resource=cronjob

    | where (verb="delete") OR (objectRef.resource="cronjob" AND (objectRef.subresource="" OR isnull(objectRef.subresource)) OR objectRef.resource="cronjob")

    | table _time, user.username, verb, objectRef.resource, objectRef.subresource, objectRef.name, objectRef.namespace, sourceIPs{}

    '
  kql: |
    KubernetesAuditLogs
    | where TimeGenerated > ago(1h)
    | where Verb == "delete"
    | where ObjectRef.resource == "cronjobs"
    | where ObjectRef.subresource == ""
    | project TimeGenerated, User.username, ObjectRef.namespace, ObjectRef.name, ObjectRef.resource, Verb, ResponseStatus.code, SourceIPs
  aql: |
    SELECT username, sourceip, "ObjectRef.Resource" AS resource, "ObjectRef.Name" AS object_name, "Verb", "ObjectRef.Namespace" AS namespace, COUNT(*) AS event_count
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%kubernetes%' OR categoryname(category) ILIKE '%kubernetes%')
      AND (
        ("Verb" = 'delete' AND "ObjectRef.Resource" = 'cronjob' AND ("ObjectRef.Subresource" IS NULL OR "ObjectRef.Subresource" = ''))
        OR
        ("ObjectRef.Resource" = 'cronjob' AND "ObjectRef.Subresource" = 'status')
      )
    GROUP BY username, sourceip, "ObjectRef.Resource", "ObjectRef.Name", "Verb", "ObjectRef.Namespace"
    LAST 1 HOURS
  yara_l: |
    rule kubernetes_cronjob_deletion_or_modification {
      meta:
        author = "Detection Engineer"
        description = "Detects Kubernetes cronjob deletion or modification - T1053 Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1053"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Kubernetes"
        (
          $e.metadata.event_type = "RESOURCE_DELETION"
          or
          (
            $e.target.resource.type = "cronjob"
            $e.target.resource.attribute.labels.subresource = ""
          )
          or
          (
            $e.target.resource.attribute.labels.subresource = "cronjob"
          )
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND (
        kubernetes.audit.verb == "delete"
        OR (
          kubernetes.audit.objectRef.resource == "cronjob"
          AND kubernetes.audit.objectRef.subresource IS NULL
        )
        OR kubernetes.audit.objectRef.subresource == "cronjob"
      )
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.verb, kubernetes.audit.objectRef.resource, kubernetes.audit.objectRef.subresource, kubernetes.audit.objectRef.name, kubernetes.audit.objectRef.namespace, kubernetes.audit.sourceIPs
  leql: |
    where((source_json.verb="delete" AND source_json.objectRef.resource="cronjob" AND source_json.objectRef.subresource=NULL) OR (source_json.objectRef.resource="cronjob" AND source_json.objectRef.subresource="cronjob"))
  crowdstrike: |
    #type=k8s:audit
    | verb=delete resource=*cronjob* Subresource!=*
    | table([@timestamp, user.username, objectRef.namespace, objectRef.name, verb, resource, Subresource, responseStatus.code])
  xql: |
    dataset = k8s_audit_log_raw
    | filter verb = "delete" and objectRef_resource = "cronjobs" and objectRef_subresource = null
    | fields _time, user_username, objectRef_namespace, objectRef_name, verb, objectRef_resource, sourceIPs
  lucene: |
    (verb:delete AND resource:cronjob AND NOT _exists_:subresource) OR (resource:cronjob AND subresource:cronjob)
  sumo: |
    _sourceCategory=*kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "objectRef.subresource" as subresource
    | where (verb = "delete" AND resource = "cronjobs" AND (isNull(subresource) OR subresource = ""))
       OR (resource = "cronjobs" AND (isNull(subresource) OR subresource = ""))
    | fields _messageTime, verb, resource, subresource, _sourceHost
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"delete\"\nOR\n             Where Resource is \"cronjob\"\n             Where Subresource is\
  \ NULL\n\n             Where Subresource is \"cronjob\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000566
v4_id: '000566'
name: Kubernetes Cronjobs Listed
description: Detects when a user pulls a list of all the cronjobs within Kubernetes
tactic: Execution
tactic_id: TA0002
technique_id: T1053
technique_name: Scheduled Task/Job
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes k8s.verb IN("get","list") k8s.resource="cronjob" k8s.subresource=""

    | table _time, k8s.user, k8s.verb, k8s.resource, k8s.subresource, k8s.namespace, k8s.name, source_ip

    '
  kql: |
    KubernetesEvent
    | where TimeGenerated > ago(1h)
    | where (Verb in~ ("get", "list") and Resource =~ "cronjob" and isempty(Subresource))
         or (Resource =~ "cronjob" and Subresource =~ "cronjob")
    | project TimeGenerated, Verb, Resource, Subresource, User, SourceIPs, ObjectName, Namespace, ResponseCode
  aql: |
    SELECT objectRef.name, objectRef.namespace, user.username, verb, sourceIPs, COUNT(*) AS event_count
    FROM events
    WHERE (verb IN ('get', 'list') AND objectRef.resource = 'cronjobs' AND objectRef.subresource IS NULL)
       OR (objectRef.resource = 'cronjobs')
    GROUP BY objectRef.name, objectRef.namespace, user.username, verb, sourceIPs
    LAST 1 HOURS
  yara_l: |
    rule kubernetes_cronjob_enumeration {
      meta:
        author = "TDL"
        description = "Detects enumeration of Kubernetes cronjobs via get/list verbs"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1053"
        severity = "Medium"

      events:
        $k.metadata.product_name = "Kubernetes"
        (
          (
            ($k.metadata.product_event_type = "get" or $k.metadata.product_event_type = "list")
            $k.target.resource.name = "cronjob"
            not $k.target.resource.attribute.labels.value != ""
          )
          or
          (
            $k.target.resource.name = "cronjob"
            not $k.target.resource.attribute.labels.value != ""
          )
        )
        $k.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $k
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND (
        (kubernetes.audit.verb IN ("get", "list") AND kubernetes.audit.objectRef.resource == "cronjobs" AND kubernetes.audit.objectRef.subresource IS NULL)
        OR
        (kubernetes.audit.objectRef.resource == "cronjobs" AND kubernetes.audit.objectRef.subresource == "status")
      )
    | STATS event_count = COUNT(*) BY kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.verb, kubernetes.audit.objectRef.name
    | KEEP kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.verb, kubernetes.audit.objectRef.name, event_count
  leql: |
    where((source_json.verb IN ["get", "list"] AND source_json.resource="cronjob" AND source_json.subresource=NULL) OR (source_json.resource="cronjob" AND source_json.subresource="cronjob"))
  crowdstrike: |
    #repo=kubernetes verb IN [get, list] ObjectRef.Resource=cronjob ObjectRef.Subresource=""
    | table([@timestamp, User.Username, Verb, ObjectRef.Resource, ObjectRef.Namespace, ObjectRef.Name, SourceIPs, UserAgent])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and resource_type = "k8s_cluster"
    | filter (verb in ("get", "list") and resource = "cronjob" and (subresource = null or subresource = "")) or (resource = "cronjob" and subresource = "cronjob")
    | fields _time, actor_user, verb, resource, subresource, cluster_name, namespace
  lucene: |
    (verb:("get" OR "list") AND resource:"cronjob" AND NOT _exists_:subresource) OR (resource:"cronjob" AND subresource:"cronjob")
  sumo: "_sourceCategory=*Kubernetes* (verb=\"get\" OR verb=\"list\") resource=\"cronjob\" \n| where isNull(subresource) OR subresource=\"cronjob\"\
    \n| fields _messageTime, _sourceHost, verb, resource, subresource, user, objectRef\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"get\" OR \"list\"\nOR\n             Where Resource is \"cronjob\"\n             Where Subresource\
  \ is NULL\n\n             Where Subresource is \"cronjob\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

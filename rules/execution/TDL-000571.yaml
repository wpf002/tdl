rule_id: TDL-EXE-000571
v4_id: '000571'
name: Kubernetes Pod Created by Unauthorized User
description: Detects when a pod is created by an unauthorized source. This could be indicative of a compromised pod creating another pod
tactic: Execution
tactic_id: TA0002
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype=kube:* objectRef.resource=pods verb=create \nNOT user.username=\"system:serviceaccount:kube-system:replicaset-controller\"\
    \ \nNOT user.username=\"system:serviceaccount:kube-system:job-controller\" \nNOT user.username=\"system:serviceaccount:kube-system:daemon-set-controller\"\
    \nNOT [| inputlookup kubernetes_admin_list | fields user.username]\n| table _time, user.username, objectRef.namespace, objectRef.name, verb,\
    \ objectRef.resource, sourceIPs{}\n"
  kql: |
    KubernetesAudit
    | where TimeGenerated > ago(1h)
    | where ObjectRef_Resource =~ "pods"
    | where Verb =~ "create"
    | where UserAgent_User != "system:serviceaccount:kube-system:replicaset-controller"
    | where UserAgent_User != "system:serviceaccount:kube-system:job-controller"
    | where UserAgent_User != "system:serviceaccount:kube-system:daemon-set-controller"
    | join kind=leftanti (
        _GetWatchlist('KubernetesAdminList')
        | project AdminUser = SearchKey
    ) on $left.UserAgent_User == $right.AdminUser
    | project TimeGenerated, UserAgent_User, ObjectRef_Namespace, ObjectRef_Name, SourceIPs, ResponseStatus_Code
  aql: |
    SELECT username, sourceip, "ObjectRef.Resource", "Verb", COUNT(*) AS event_count
    FROM events
    WHERE "ObjectRef.Resource" = 'pods'
      AND "Verb" = 'create'
      AND username != 'system:serviceaccount:kube-system:replicaset-controller'
      AND username != 'system:serviceaccount:kube-system:job-controller'
      AND username != 'system:serviceaccount:kube-system:daemon-set-controller'
      AND username NOT IN (SELECT username FROM referencedata WHERE reference_set_name = 'Kubernetes_Admin_List')
    LAST 24 HOURS
  yara_l: "rule k8s_suspicious_pod_creation {\n  meta:\n    author = \"TDL\"\n    description = \"Detects suspicious pod creation in Kubernetes\
    \ that is not from expected service accounts or admins - T1611\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"\
    T1611\"\n    severity = \"MEDIUM\"\n    \n  events:\n    $e.metadata.event_type = \"RESOURCE_CREATION\"\n    $e.target.resource.type = \"\
    pods\"\n    $e.security_result.action = \"ALLOW\"\n    re.regex($e.metadata.description, `(?i)verb.*create`)\n    $e.principal.user.userid\
    \ = $user\n    $user != \"system:serviceaccount:kube-system:replicaset-controller\"\n    $user != \"system:serviceaccount:kube-system:job-controller\"\
    \n    $user != \"system:serviceaccount:kube-system:daemon-set-controller\"\n    not re.regex($user, `(?i)(system:masters|cluster-admin|kube-admin)`)\n\
    \    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 55\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-kubernetes.audit*\n| WHERE kubernetes.audit.verb == \"create\" \n  AND kubernetes.audit.objectRef.resource == \"pods\"\n  AND\
    \ kubernetes.audit.user.username != \"system:serviceaccount:kube-system:replicaset-controller\"\n  AND kubernetes.audit.user.username != \"\
    system:serviceaccount:kube-system:job-controller\"\n  AND kubernetes.audit.user.username != \"system:serviceaccount:kube-system:daemon-set-controller\"\
    \n  AND NOT (kubernetes.audit.user.username LIKE \"system:masters*\" OR kubernetes.audit.user.username LIKE \"*:admin\" OR kubernetes.audit.user.username\
    \ LIKE \"system:kube-*\")\n| KEEP @timestamp, host.name, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name,\
    \ kubernetes.audit.sourceIPs\n"
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="create" AND source_json.user.username!="system:serviceaccount:kube-system:replicaset-controller" AND source_json.user.username!="system:serviceaccount:kube-system:job-controller" AND source_json.user.username!="system:serviceaccount:kube-system:daemon-set-controller")
  crowdstrike: "#type=kubernetes objectRef.resource=\"pods\" verb=\"create\" \n| user.username != \"system:serviceaccount:kube-system:replicaset-controller\"\
    \n| user.username != \"system:serviceaccount:kube-system:job-controller\"\n| user.username != \"system:serviceaccount:kube-system:daemon-set-controller\"\
    \n| not (user.username = /^system:serviceaccount:kube-system:(admin|cluster-admin|.*-admin)$/)\n| table([@timestamp, user.username, objectRef.name,\
    \ objectRef.namespace, sourceIPs])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and resource_type = "k8s_cluster"
    | filter json_extract_scalar(resource_json_data, "$.objectRef.resource") = "pods"
    | filter json_extract_scalar(resource_json_data, "$.verb") = "create"
    | filter json_extract_scalar(resource_json_data, "$.user.username") != "system:serviceaccount:kube-system:replicaset-controller"
    | filter json_extract_scalar(resource_json_data, "$.user.username") != "system:serviceaccount:kube-system:job-controller"
    | filter json_extract_scalar(resource_json_data, "$.user.username") != "system:serviceaccount:kube-system:daemon-set-controller"
    | alter source_username = json_extract_scalar(resource_json_data, "$.user.username")
    | filter source_username not in ("cluster-admin", "system:admin", "kubernetes-admin")
    | fields _time, source_username, json_extract_scalar(resource_json_data, "$.objectRef.namespace") as namespace, json_extract_scalar(resource_json_data, "$.objectRef.name") as pod_name, json_extract_scalar(resource_json_data, "$.sourceIPs") as source_ips
  lucene: |
    objectRef.resource:pods AND verb:create AND NOT user.username:("system:serviceaccount:kube-system:replicaset-controller" OR "system:serviceaccount:kube-system:job-controller" OR "system:serviceaccount:kube-system:daemon-set-controller")
  sumo: |
    _sourceCategory=*Kubernetes* "pods" "create"
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "user.username" as source_username
    | where resource = "pods" and verb = "create"
    | where !(source_username = "system:serviceaccount:kube-system:replicaset-controller")
    | where !(source_username = "system:serviceaccount:kube-system:job-controller")
    | where !(source_username = "system:serviceaccount:kube-system:daemon-set-controller")
    | where !(source_username matches "system:masters*" or source_username matches "*admin*" or source_username matches "system:serviceaccount:kube-system*")
    | fields _messageTime, _sourceHost, source_username, resource, verb
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Verb is \"create\"\nWhere the Source Username is NOT \"system:serviceaccount:kube-system:replicaset-controller\"\
  \nWhere the Source Username is NOT \"system:serviceaccount:kube-system:job-controller\"\nWhere the Source Username is NOT \"system:serviceaccount:kube-system:daemon-set-controller\"\
  \nWhere the Source Username is Not on the Kubernetes Admin List"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

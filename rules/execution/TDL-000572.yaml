rule_id: TDL-EXE-000572
v4_id: '000572'
name: Kubernetes Pod Created in Kube Namespace
description: Detect when a user is creating a pod in one of the Kubernetes default namespaces. The only users creating pods in the kube-system
  namespace should be cluster administrators. Furthermore, it is best practice to not run any cluster critical infrastructure in the kube-system
  namespace. The kube-public namespace is intended for Kubernetes objects which should be readable by unauthenticated users. Thus, a pod should
  likely not be created in the kube-public namespace.
tactic: Execution
tactic_id: TA0002
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:objects:pods OR sourcetype=kubernetes:events verb=create objectRef.resource=pods (objectRef.namespace=kube-system
    OR objectRef.namespace=kube-public) NOT user.username="system:serviceaccount:kube-system:replicaset-controller" NOT user.username="system:serviceaccount:kube-system:job-controller"
    NOT user.username="system:serviceaccount:kube-system:daemon-set-controller"

    | table _time, user.username, objectRef.namespace, objectRef.name, objectRef.resource, verb, source.host

    '
  kql: |
    KubernetesPodInventory
    | where TimeGenerated > ago(24h)
    | where Namespace in ("kube-system", "kube-public")
    | join kind=inner (
        KubernetesEvents
        | where TimeGenerated > ago(24h)
        | where ObjectKind == "Pod"
        | where Verb == "create"
        | where Namespace in ("kube-system", "kube-public")
        | where SourceComponent !in ("system:serviceaccount:kube-system:replicaset-controller", "system:serviceaccount:kube-system:job-controller", "system:serviceaccount:kube-system:daemon-set-controller")
        | extend SourceUsername = SourceComponent
    ) on Name, Namespace
    | project TimeGenerated, Namespace, Name, SourceUsername, Reason, Message, ClusterName, Computer
  aql: |
    SELECT sourceip, username, "Kubernetes.Resource" AS resource, "Kubernetes.Verb" AS verb, "Kubernetes.Namespace" AS namespace, "Kubernetes.Source.Username" AS source_username, COUNT(*) AS event_count
    FROM events
    WHERE "Kubernetes.Resource" = 'pods'
      AND "Kubernetes.Verb" = 'create'
      AND ("Kubernetes.Namespace" = 'kube-system' OR "Kubernetes.Namespace" = 'kube-public')
      AND "Kubernetes.Source.Username" NOT IN ('system:serviceaccount:kube-system:replicaset-controller', 'system:serviceaccount:kube-system:job-controller', 'system:serviceaccount:kube-system:daemon-set-controller')
    GROUP BY sourceip, username, "Kubernetes.Resource", "Kubernetes.Verb", "Kubernetes.Namespace", "Kubernetes.Source.Username"
    LAST 1 HOURS
  yara_l: |
    rule kubernetes_pod_creation_sensitive_namespace {
      meta:
        author = "TDL"
        description = "Detects pod creation in sensitive Kubernetes namespaces by non-controller service accounts"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1611"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "audit.k8s.io/v1"
        $e.metadata.event_type = "RESOURCE_CREATION"
        $e.target.resource.name = "pods"
        $e.security_result.action = "create"
        (
          $e.target.namespace = "kube-system" or
          $e.target.namespace = "kube-public"
        )
        $e.principal.user.userid = $user
        $user != "system:serviceaccount:kube-system:replicaset-controller"
        $user != "system:serviceaccount:kube-system:job-controller"
        $user != "system:serviceaccount:kube-system:daemon-set-controller"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE kubernetes.audit.objectRef.resource == "pods"
      AND kubernetes.audit.verb == "create"
      AND (kubernetes.audit.objectRef.namespace == "kube-system" OR kubernetes.audit.objectRef.namespace == "kube-public")
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:replicaset-controller"
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:job-controller"
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:daemon-set-controller"
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="create" AND (source_json.objectRef.namespace="kube-system" OR source_json.objectRef.namespace="kube-public") AND source_json.user.username!="system:serviceaccount:kube-system:replicaset-controller" AND source_json.user.username!="system:serviceaccount:kube-system:job-controller" AND source_json.user.username!="system:serviceaccount:kube-system:daemon-set-controller")
  crowdstrike: |
    #type=kubernetes_event verb=create objectRef.resource=pods (objectRef.namespace=kube-system OR objectRef.namespace=kube-public) user.username!=system:serviceaccount:kube-system:replicaset-controller user.username!=system:serviceaccount:kube-system:job-controller user.username!=system:serviceaccount:kube-system:daemon-set-controller
    | table([@timestamp, objectRef.namespace, objectRef.name, user.username, sourceIPs])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"KUBERNETES\" \n  and operation_type = \"create\" \n  and resource_type = \"pods\"\
    \ \n  and (resource_sub_type = \"kube-system\" or resource_sub_type = \"kube-public\")\n  and identity_name != \"system:serviceaccount:kube-system:replicaset-controller\"\
    \n  and identity_name != \"system:serviceaccount:kube-system:job-controller\" \n  and identity_name != \"system:serviceaccount:kube-system:daemon-set-controller\"\
    \n| fields _time, identity_name, resource_type, resource_sub_type, operation_type, cluster_name\n"
  lucene: |
    objectRef.resource:pods AND verb:create AND objectRef.namespace:(kube-system OR kube-public) AND NOT user.username:"system:serviceaccount:kube-system:replicaset-controller" AND NOT user.username:"system:serviceaccount:kube-system:job-controller" AND NOT user.username:"system:serviceaccount:kube-system:daemon-set-controller"
  sumo: |
    _sourceCategory=*Kubernetes* "pods" "create"
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.namespace" as namespace
    | json field=_raw "user.username" as source_username
    | where resource = "pods"
    | where verb = "create"
    | where namespace in ("kube-system", "kube-public")
    | where !(source_username = "system:serviceaccount:kube-system:replicaset-controller")
    | where !(source_username = "system:serviceaccount:kube-system:job-controller")
    | where !(source_username = "system:serviceaccount:kube-system:daemon-set-controller")
    | fields _messageTime, namespace, source_username, resource, verb, _sourceHost

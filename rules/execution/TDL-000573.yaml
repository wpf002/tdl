rule_id: TDL-EXE-000573
v4_id: '000573'
name: Kubernetes Pod Created with hostNetwork
description: Detect when a pod is attached to the host network. Attaching the hostNetwork permits a pod to access the node’s network adapter allowing
  a pod to listen to all network traffic for all pods on the node and communicate with other pods on the network namespace.
tactic: Execution
tactic_id: TA0002
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype=kube:* OR sourcetype=kubernetes:* objectRef.resource=pods verb=create requestObject.spec.hostNetwork=true \n| search\
    \ NOT user.username=\"system:serviceaccount:kube-system:replicaset-controller\" NOT user.username=\"system:serviceaccount:kube-system:daemon-set-controller\"\
    \n| table _time, user.username, objectRef.namespace, objectRef.name, verb, requestObject.spec.hostNetwork, sourceIPs{}\n"
  kql: |
    KubeEvents
    | where TimeGenerated > ago(1h)
    | where ObjectKind == "Pod"
    | where Verb == "create"
    | extend hostNetwork = tostring(parse_json(RequestObject).spec.hostNetwork)
    | where hostNetwork == "true"
    | where UserName !in ("system:serviceaccount:kube-system:replicaset-controller", "system:serviceaccount:kube-system:daemon-set-controller")
    | project TimeGenerated, Namespace, Name, UserName, SourceIPs, RequestObject, ResponseObject
  aql: |
    SELECT username, sourceip, "Resource", "Verb", "requestObject.spec.hostNetwork", COUNT(*) AS event_count
    FROM events
    WHERE "Resource" = 'pods'
      AND "Verb" = 'create'
      AND "requestObject.spec.hostNetwork" = 'true'
      AND username != 'system:serviceaccount:kube-system:replicaset-controller'
      AND username != 'system:serviceaccount:kube-system:daemon-set-controller'
    GROUP BY username, sourceip, "Resource", "Verb", "requestObject.spec.hostNetwork"
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_pod_hostnetwork_creation {
      meta:
        author = "Detection Engineering"
        description = "Detects Kubernetes pod creation with hostNetwork enabled - MITRE T1611"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1611"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "RESOURCE_CREATION"
        $e.metadata.product_name = "Kubernetes"
        $e.target.resource.name = "pods"
        $e.security_result.action = "create"
        $e.target.resource.attribute.labels["requestObject.spec.hostNetwork"] = "true"
        $e.principal.user.userid = $user
        $user != "system:serviceaccount:kube-system:replicaset-controller"
        $user != "system:serviceaccount:kube-system:daemon-set-controller"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE kubernetes.audit.objectRef.resource == "pods"
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.requestObject.spec.hostNetwork == "true"
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:replicaset-controller"
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:daemon-set-controller"
    | KEEP @timestamp, host.name, kubernetes.audit.user.username, kubernetes.audit.objectRef.name, kubernetes.audit.objectRef.namespace, kubernetes.audit.sourceIPs
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="create" AND source_json.requestObject.spec.hostNetwork=true AND source_json.user.username!="system:serviceaccount:kube-system:replicaset-controller" AND source_json.user.username!="system:serviceaccount:kube-system:daemon-set-controller")
  crowdstrike: |
    #type=KubernetesEvent objectRef.resource="pods" verb="create" requestObject.spec.hostNetwork="true"
    NOT (user.username="system:serviceaccount:kube-system:replicaset-controller" OR user.username="system:serviceaccount:kube-system:daemon-set-controller")
    | table([@timestamp, user.username, objectRef.name, objectRef.namespace, sourceIPs])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and http_method = "create" and resource_type = "pods" and json_extract_scalar(raw_log, "$.requestObject.spec.hostNetwork") = "true"
    | filter source_username != "system:serviceaccount:kube-system:replicaset-controller" and source_username != "system:serviceaccount:kube-system:daemon-set-controller"
    | fields _time, source_username, namespace, resource_type, resource_name, raw_log
  lucene: |
    kubernetes.audit.objectRef.resource:pods AND kubernetes.audit.verb:create AND kubernetes.audit.requestObject.spec.hostNetwork:true AND NOT kubernetes.audit.user.username:"system:serviceaccount:kube-system:replicaset-controller" AND NOT kubernetes.audit.user.username:"system:serviceaccount:kube-system:daemon-set-controller"
  sumo: "_sourceCategory=*Kubernetes* \"pods\" \"create\"\n| json field=_raw \"objectRef.resource\" as resource\n| json field=_raw \"verb\" as\
    \ verb\n| json field=_raw \"requestObject.spec.hostNetwork\" as hostNetwork\n| json field=_raw \"user.username\" as username\n| where resource\
    \ = \"pods\" \n  and verb = \"create\" \n  and hostNetwork = \"true\"\n  and username != \"system:serviceaccount:kube-system:replicaset-controller\"\
    \n  and username != \"system:serviceaccount:kube-system:daemon-set-controller\"\n| fields _messageTime, username, resource, verb, hostNetwork,\
    \ _sourceHost\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Verb is \"create\"\nWhere the requestObject.spec.hostNetwork is \"true\"\
  \nWhere the Source Username is NOT \"system:serviceaccount:kube-system:replicaset-controller\"\nWhere the Source Username is NOT \"system:serviceaccount:kube-system:daemon-set-controller\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

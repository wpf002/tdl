rule_id: TDL-EXE-000574
v4_id: '000574'
name: Privileged Kubernetes Pod Created
description: Privileged containers have all capabilities of the host machine. These privileged containers may perform actions directly on the
  host that they are running on. Ensure that this event is expected and occurs from a user account or IP address that normally works with privileged
  containers within the cluster. Customers are encouraged to set up an exclusion list for spec.securitycontext.capabilities for pods that are
  frequently going to be managed with privileged escalation.
tactic: Execution
tactic_id: TA0002
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=kubernetes sourcetype=kube:events objectRef.resource=pods verb=create \n(annotations.podsecuritypolicy.policy.k8s.io/admit-policy=\"\
    eks.privileged\" \nannotations.podsecuritypolicy.policy.k8s.io/validate-policy=\"eks.privileged\" \nrequestObject.spec.containers{}.securityContext.privileged=true)\n\
    | table _time, objectRef.namespace, objectRef.name, user.username, sourceIPs{}, annotations.podsecuritypolicy.policy.k8s.io/admit-policy,\
    \ annotations.podsecuritypolicy.policy.k8s.io/validate-policy, requestObject.spec.containers{}.securityContext.privileged\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000574 {\n  meta:\n    author = \"TDL\"\n    description = \"Privileged Kubernetes Pod Created\"\n    severity = \"\
    MEDIUM\"\n    tactic = \"TA0002\"\n    technique = \"T1611\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName\
    \ = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Verb is \"create\"\nOR\n    Where \"annotations.podsecuritypolicy.policy.k8s.io/admit-policy\"\
  \ is \"eks.privileged\"\n    Where \"annotations.podsecuritypolicy.policy.k8s.io/validate-policy\" is \"eks.privileged\"\n    Where \"requestObject.spec.containers.1.securityContext.privileged\"\
  \ is \"true\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

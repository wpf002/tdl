rule_id: TDL-EXE-000574
v4_id: '000574'
name: Privileged Kubernetes Pod Created
description: Privileged containers have all capabilities of the host machine. These privileged containers may perform actions directly on the
  host that they are running on. Ensure that this event is expected and occurs from a user account or IP address that normally works with privileged
  containers within the cluster. Customers are encouraged to set up an exclusion list for spec.securitycontext.capabilities for pods that are
  frequently going to be managed with privileged escalation.
tactic: Execution
tactic_id: TA0002
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=kubernetes sourcetype=kube:events objectRef.resource=pods verb=create \n(annotations.podsecuritypolicy.policy.k8s.io/admit-policy=\"\
    eks.privileged\" \nannotations.podsecuritypolicy.policy.k8s.io/validate-policy=\"eks.privileged\" \nrequestObject.spec.containers{}.securityContext.privileged=true)\n\
    | table _time, objectRef.namespace, objectRef.name, user.username, sourceIPs{}, annotations.podsecuritypolicy.policy.k8s.io/admit-policy,\
    \ annotations.podsecuritypolicy.policy.k8s.io/validate-policy, requestObject.spec.containers{}.securityContext.privileged\n"
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where ObjectKind == "Pod"
    | where Verb == "create"
    | extend annotations = parse_json(Annotations)
    | extend requestObject = parse_json(RequestObject)
    | extend admitPolicy = tostring(annotations["podsecuritypolicy.policy.k8s.io/admit-policy"])
    | extend validatePolicy = tostring(annotations["podsecuritypolicy.policy.k8s.io/validate-policy"])
    | extend containers = requestObject.spec.containers
    | mv-expand container = containers
    | extend isPrivileged = tobool(container.securityContext.privileged)
    | where admitPolicy == "eks.privileged" or validatePolicy == "eks.privileged" or isPrivileged == true
    | project TimeGenerated, Namespace, Name, Verb, admitPolicy, validatePolicy, isPrivileged, RequestObject, SourceIPs, UserAgent
  aql: "SELECT eventtime, sourceip, \"Resource\", \"Verb\", \"annotations.podsecuritypolicy.policy.k8s.io/admit-policy\", \"annotations.podsecuritypolicy.policy.k8s.io/validate-policy\"\
    , \"requestObject.spec.containers.1.securityContext.privileged\", username, LOGSOURCENAME(logsourceid) AS log_source\nFROM events\nWHERE \"\
    Resource\" = 'pods' \n  AND (\"Verb\" = 'create' \n       OR (\"annotations.podsecuritypolicy.policy.k8s.io/admit-policy\" = 'eks.privileged'\
    \ \n           AND \"annotations.podsecuritypolicy.policy.k8s.io/validate-policy\" = 'eks.privileged' \n           AND \"requestObject.spec.containers.1.securityContext.privileged\"\
    \ = 'true'))\nLAST 24 HOURS\n"
  yara_l: |
    rule kubernetes_privileged_pod_creation {
      meta:
        author = "TDL"
        description = "Detects creation of privileged pods in Kubernetes (T1611)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1611"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.target.resource.name = "pods"
        $e.target.resource.attribute.labels.key = "verb"
        $e.target.resource.attribute.labels.value = "create"
        (
          (
            $e.target.resource.attribute.labels.key = "annotations.podsecuritypolicy.policy.k8s.io/admit-policy"
            $e.target.resource.attribute.labels.value = "eks.privileged"
          ) or
          (
            $e.target.resource.attribute.labels.key = "annotations.podsecuritypolicy.policy.k8s.io/validate-policy"
            $e.target.resource.attribute.labels.value = "eks.privileged"
          ) or
          (
            $e.target.resource.attribute.labels.key = "requestObject.spec.containers.1.securityContext.privileged"
            $e.target.resource.attribute.labels.value = "true"
          )
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE kubernetes.audit.objectRef.resource == "pods"
      AND kubernetes.audit.verb == "create"
      AND (kubernetes.audit.annotations.podsecuritypolicy_policy_k8s_io_admit-policy == "eks.privileged"
        OR kubernetes.audit.annotations.podsecuritypolicy_policy_k8s_io_validate-policy == "eks.privileged"
        OR kubernetes.audit.requestObject.spec.containers.securityContext.privileged == true)
    | KEEP @timestamp, host.name, user.name, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.verb, kubernetes.audit.annotations.podsecuritypolicy_policy_k8s_io_admit-policy, kubernetes.audit.annotations.podsecuritypolicy_policy_k8s_io_validate-policy, kubernetes.audit.requestObject.spec.containers.securityContext.privileged
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="create" AND (source_json.annotations.podsecuritypolicy.policy.k8s.io/admit-policy="eks.privileged" OR source_json.annotations.podsecuritypolicy.policy.k8s.io/validate-policy="eks.privileged" OR source_json.requestObject.spec.containers.1.securityContext.privileged="true"))
  crowdstrike: "#type=kubernetes event.resource=\"pods\" event.verb=\"create\" \n(annotations.podsecuritypolicy.policy.k8s.io/admit-policy=\"\
    eks.privileged\" OR annotations.podsecuritypolicy.policy.k8s.io/validate-policy=\"eks.privileged\" OR requestObject.spec.containers.*.securityContext.privileged=true)\n\
    | table([@timestamp, event.resource, event.verb, annotations.podsecuritypolicy.policy.k8s.io/admit-policy, annotations.podsecuritypolicy.policy.k8s.io/validate-policy,\
    \ requestObject.spec.containers.*.securityContext.privileged, objectRef.name, objectRef.namespace, user.username])\n"
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"AZURE_KUBERNETES_SERVICE\" or cloud_provider = \"GCP_GKE\" or cloud_provider =\
    \ \"AWS_EKS\"\n| filter resource_type = \"pods\"\n| filter (operation = \"create\" \n         or (operation_requested_data contains \"\\\"\
    eks.privileged\\\"\"\n             and operation_requested_data contains \"\\\"podsecuritypolicy.policy.k8s.io/admit-policy\\\"\")\n     \
    \    or (operation_requested_data contains \"\\\"eks.privileged\\\"\"\n             and operation_requested_data contains \"\\\"podsecuritypolicy.policy.k8s.io/validate-policy\\\
    \"\")\n         or (operation_requested_data contains \"\\\"privileged\\\":true\"\n             and operation_requested_data contains \"\\\
    \"securityContext\\\"\"))\n| fields _time, cloud_provider, resource_type, operation, caller_ip, identity_name, operation_requested_data\n"
  lucene: |
    kubernetes.resource:pods AND kubernetes.verb:create AND (kubernetes.annotations.podsecuritypolicy.policy.k8s.io\/admit-policy:eks.privileged OR kubernetes.annotations.podsecuritypolicy.policy.k8s.io\/validate-policy:eks.privileged OR kubernetes.requestObject.spec.containers.1.securityContext.privileged:true)
  sumo: |
    _sourceCategory=*Kubernetes* "pods" "create"
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "annotations.podsecuritypolicy.policy.k8s.io/admit-policy" as admit_policy
    | json field=_raw "annotations.podsecuritypolicy.policy.k8s.io/validate-policy" as validate_policy
    | json field=_raw "requestObject.spec.containers[*].securityContext.privileged" as privileged
    | where resource = "pods" and verb = "create" and (admit_policy = "eks.privileged" or validate_policy = "eks.privileged" or privileged = "true")
    | fields _messageTime, _sourceHost, resource, verb, admit_policy, validate_policy, privileged
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Verb is \"create\"\nOR\n    Where \"annotations.podsecuritypolicy.policy.k8s.io/admit-policy\"\
  \ is \"eks.privileged\"\n    Where \"annotations.podsecuritypolicy.policy.k8s.io/validate-policy\" is \"eks.privileged\"\n    Where \"requestObject.spec.containers.1.securityContext.privileged\"\
  \ is \"true\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

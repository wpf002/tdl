rule_id: TDL-EXE-000585
v4_id: 000585
name: Potential Kubernetes Sidecar Injection
description: 'Detects attempts to inject a sidecar container into a running deployment. A sidecar container is an additional container within
  a pod, that resides alongside the main container. One way to add containers to running resources like Deployments/DeamonSets/StatefulSets, is
  via a "kubectl patch" operation. By injecting a new container within a legitimate pod, an attacker can run their code and hide their activity,
  instead of running their own separated pod in the cluster. A sigma rule by Leo Tsaousis (@laripping)


  ref: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/update-api-object-kubectl-patch

  https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Sidecar%20Injection/'
tactic: Execution
tactic_id: TA0002
technique_id: T1610
technique_name: Deploy Container
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes objectRef.resource="deployments" verb="patch" objectRef.apiGroup="apps"

    | table _time, user.username, objectRef.namespace, objectRef.name, sourceIPs{}, userAgent, responseStatus.code

    '
  kql: |
    KubernetesAudit
    | where TimeGenerated > ago(1h)
    | where ObjectRef.resource =~ "deployments"
    | where Verb =~ "patch"
    | where ObjectRef.apiGroup =~ "apps"
    | project TimeGenerated, User.username, User.groups, SourceIps, ObjectRef.namespace, ObjectRef.name, Verb, ObjectRef.resource, ObjectRef.apiGroup, RequestUri, ResponseStatus.code
  aql: |
    SELECT sourceip, username, "ObjectRef.Name" AS deployment_name, "ObjectRef.Namespace" AS namespace, "Verb", eventtime
    FROM events
    WHERE "ObjectRef.Resource" = 'deployments'
      AND "Verb" = 'patch'
      AND "ObjectRef.ApiGroup" = 'apps'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_deployment_patch_t1610 {
      meta:
        author = "TDL"
        description = "Detects Kubernetes deployment patch operations - T1610 Execution"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1610"
        severity = "Medium"

      events:
        $e.metadata.event_type = "RESOURCE_WRITE"
        $e.metadata.product_name = "Kubernetes"
        $e.target.resource.name = "deployments"
        $e.target.resource.attribute.labels["verb"] = "patch"
        $e.target.resource.attribute.labels["apiGroup"] = "apps"
        $e.principal.user.userid = $user
        $e.principal.hostname = $host

      match:
        $user, $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 24 hour \n  AND kubernetes.audit.objectRef.resource == \"deployments\"\n  AND\
    \ kubernetes.audit.verb == \"patch\"\n  AND kubernetes.audit.objectRef.apiGroup == \"apps\"\n| KEEP @timestamp, kubernetes.audit.user.username,\
    \ kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.userAgent\n"
  leql: |
    where(source_json.objectRef.resource="deployments" AND source_json.verb="patch" AND source_json.objectRef.apiGroup="apps")
  crowdstrike: |
    #type=kubernetes verb=patch objectRef.resource=deployments objectRef.apiGroup=apps
    | table([@timestamp, user.username, objectRef.namespace, objectRef.name, verb, objectRef.resource, objectRef.apiGroup, sourceIPs])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and json_extract_scalar(raw_log, "$.objectRef.resource") = "deployments" and json_extract_scalar(raw_log, "$.verb") = "patch" and json_extract_scalar(raw_log, "$.objectRef.apiGroup") = "apps"
    | fields _time, json_extract_scalar(raw_log, "$.user.username") as user, json_extract_scalar(raw_log, "$.objectRef.namespace") as namespace, json_extract_scalar(raw_log, "$.objectRef.name") as deployment_name, json_extract_scalar(raw_log, "$.sourceIPs") as source_ip
  lucene: |
    resource:"deployments" AND verb:"patch" AND apiGroup:"apps"
  sumo: |
    _sourceCategory=*Kubernetes* "patch" "deployments" "apps"
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "objectRef.apiGroup" as apiGroup
    | where verb = "patch" and resource = "deployments" and apiGroup = "apps"
    | fields _messageTime, _sourceHost, verb, resource, apiGroup, objectRef.name, user.username, sourceIPs
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"deployments\"\nWhere Verb is \"patch\"\nWhere apiGroup is \"apps\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

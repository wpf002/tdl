rule_id: TDL-EXE-000587
v4_id: 000587
name: Vulnerable Driver Detected
description: Detects when a host has a vulnerable driver.
tactic: Execution
tactic_id: TA0002
technique_id: T1068
technique_name: Exploitation for Privilege Escalation
platform:
- Windows
data_sources:
- Palo Alto Cortex
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=cortex_xdr threat_name=*vulnerable*driver* \n| stats count values(causality_actor_process_image_name) as process_name values(causality_actor_process_command_line)\
    \ as command_line by host_name, threat_name, action_pretty \n| table _time, host_name, threat_name, action_pretty, process_name, command_line,\
    \ count\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor == "Palo Alto Networks" and DeviceProduct == "Cortex XDR"
    | where AdditionalExtensions has "threat_name"
    | extend threat_name = extract(@"threat_name=([^;]+)", 1, AdditionalExtensions)
    | where threat_name contains "vulnerable driver"
    | project TimeGenerated, DeviceHostName, SourceUserName, threat_name, Message, AdditionalExtensions
  aql: |
    SELECT eventtime, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS host, "threat_name", "file_path", "process_name"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cortex%'
      AND "threat_name" IS NOT NULL
      AND "threat_name" ILIKE '%vulnerable driver%'
    LAST 24 HOURS
  yara_l: "rule vulnerable_driver_exploitation {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects exploitation attempts\
    \ via vulnerable drivers from Cortex XDR\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1068\"\n    severity\
    \ = \"HIGH\"\n  \n  events:\n    $e.metadata.vendor_name = \"Palo Alto Networks\"\n    $e.metadata.product_name = \"Cortex XDR\"\n    re.regex($e.security_result.summary,\
    \ `(?i)vulnerable driver`)\n    $e.principal.hostname = $host\n  \n  match:\n    $host over 5m\n  \n  outcome:\n    $risk_score = 85\n   \
    \ $hostname = $host\n    $event_count = count_distinct($e.metadata.id)\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-cortex.xdr*
    | WHERE @timestamp > NOW() - 24 hours AND TO_LOWER(threat.indicator.name) LIKE "*vulnerable driver*"
    | KEEP @timestamp, host.name, user.name, threat.indicator.name, process.name, process.executable, file.path
  leql: |
    where(threat_name ICONTAINS "vulnerable driver")
  crowdstrike: |
    #type=cortex threat_name=*vulnerable*driver*
    | table([@timestamp, host_name, user_name, process_name, threat_name, action_taken, file_path])
  xql: |
    dataset = xdr_data
    | filter threat_name ~= ".*vulnerable driver.*"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_name, action_process_image_command_line, threat_name, event_type, event_sub_type
  lucene: |
    threat_name:*vulnerable*driver*
  sumo: |
    _sourceCategory=*Cortex* OR _sourceCategory=*PaloAlto* OR _sourceCategory=*XDR*
    | json field=_raw "threat_name" as threat_name
    | where threat_name matches "*vulnerable driver*"
    | fields _messageTime, _sourceHost, threat_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: 'Cortex XDR event

  Where the threat_name contains vulnerable driver'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000591
v4_id: 000591
name: Kubernetes Failed Curl Authentication
description: Failed instances of curl usage within a containerized environment should occur rarely, investigate the source IP address used to
  ensure that it is legitimate.
tactic: Execution
tactic_id: TA0002
technique_id: T1609
technique_name: Container Administration Command
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes user.groups{}.name="system:unauthenticated" responseStatus.status="Failure" userAgent="*curl*"

    | table _time, user.username, userAgent, user.groups{}.name, responseStatus.status, sourceIPs{}, objectRef.resource, objectRef.name, verb

    '
  kql: |
    KubeEvents
    | where TimeGenerated > ago(1h)
    | where UserAgent contains "curl"
    | where user_groups has "system:unauthenticated"
    | where responseStatus_status == "Failure"
    | project TimeGenerated, UserAgent, user_groups, responseStatus_status, sourceIPs, verb, objectRef_resource, objectRef_name, objectRef_namespace
  aql: |
    SELECT sourceip, destinationip, username, "UserAgent", "user.groups.1", "responseStatus.status", COUNT(*) AS event_count
    FROM events
    WHERE "UserAgent" ILIKE '%curl%'
      AND "user.groups.1" = 'system:unauthenticated'
      AND "responseStatus.status" = 'Failure'
    GROUP BY sourceip, destinationip, username, "UserAgent", "user.groups.1", "responseStatus.status"
    LAST 1 HOURS
  yara_l: |
    rule kubernetes_unauthenticated_curl_exec_attempt {
      meta:
        author = "Detection Engineering"
        description = "Detects unauthenticated curl user agent attempting Kubernetes container execution (T1609)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1609"
        severity = "HIGH"

      events:
        $k.metadata.product_name = "Kubernetes"
        re.regex($k.network.http.user_agent, `(?i)curl`)
        $k.target.user.attribute.labels["user.groups.1"] = "system:unauthenticated"
        $k.security_result.summary = "Failure"
        $k.principal.ip = $src_ip

      match:
        $src_ip over 5m

      condition:
        $k
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE user.agent LIKE "*curl*"
      AND user.groups.1 == "system:unauthenticated"
      AND kubernetes.audit.responseStatus.status == "Failure"
    | KEEP @timestamp, host.name, user.name, user.agent, user.groups, kubernetes.audit.verb, kubernetes.audit.objectRef.resource, kubernetes.audit.objectRef.name, kubernetes.audit.responseStatus.status, kubernetes.audit.responseStatus.message, source.ip
  leql: |
    where(source_json.userAgent ICONTAINS "curl" AND source_json.user.groups.1="system:unauthenticated" AND source_json.responseStatus.status="Failure")
  crowdstrike: |
    #type=kubernetes userAgent=*curl* user.groups.1="system:unauthenticated" responseStatus.status="Failure"
    | table([@timestamp, userAgent, user.groups.1, responseStatus.status, verb, objectRef.resource, objectRef.name, sourceIPs])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"KUBERNETES\" \n  and json_extract_scalar(raw_log, \"$.userAgent\") contains \"\
    curl\"\n  and json_extract_scalar(raw_log, \"$.user.groups[1]\") = \"system:unauthenticated\"\n  and json_extract_scalar(raw_log, \"$.responseStatus.status\"\
    ) = \"Failure\"\n| fields _time, cloud_provider, raw_log\n"
  lucene: |
    objectRef.resource:"pods" AND user.username:"system:anonymous" AND verb:"create" AND userAgent:*curl* AND responseStatus.status:"Failure"
  sumo: "_sourceCategory=*Kubernetes* \n| json field=_raw \"userAgent\" as user_agent\n| json field=_raw \"user.groups[1]\" as user_group\n| json\
    \ field=_raw \"responseStatus.status\" as response_status\n| where user_agent matches \"*curl*\" \n  and user_group = \"system:unauthenticated\"\
    \ \n  and response_status = \"Failure\"\n| fields _messageTime, _sourceHost, user_agent, user_group, response_status\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the User Agent contains \"curl\"\nWhere \"user.groups.1\" is \"system:unauthenticated\"\nWhere \"responseStatus.status\"\
  \ = \"Failure\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

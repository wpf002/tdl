rule_id: TDL-EXE-000652
v4_id: '000652'
name: Azure Automation Account Created
description: Detects when an Azure Automation account is created. Automation accounts can be used to automate management tasks and orchestrate
  actions across systems. An adversary may create an Automation account in order to maintain persistence in their target’s environment.
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Azure
data_sources:
- Azure Activity
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype=azure:activity operationName="MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE" status=Success

    | table _time, user, operationName, resourceId, subscriptionId, resourceGroupName, status

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(1h)
    | where OperationNameValue =~ "MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE"
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, OperationNameValue, ActivityStatusValue, ResourceGroup, SubscriptionId, ResourceId, CallerIpAddress, Properties
  aql: |
    SELECT sourceip, username, qidname(qid), LOGSOURCENAME(logsourceid), eventtime, "Operation", "Resource"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
      AND categoryname(category) ILIKE '%Administrative%'
      AND "Operation" = 'MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE'
      AND (qidname(qid) ILIKE '%success%' OR categoryname(category) ILIKE '%success%')
    LAST 24 HOURS
  yara_l: |
    rule azure_automation_account_creation {
      meta:
        author = "Detection Engineer"
        description = "Detects creation or modification of Azure Automation Accounts (T1059 - Command and Scripting Interpreter)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1059"
        severity = "Medium"

      events:
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
        $e.metadata.product_name = "Azure"
        $e.target.resource.attribute.labels["operationName"] = /MICROSOFT\.AUTOMATION\/AUTOMATIONACCOUNTS\/WRITE/i
        $e.security_result.action = "ALLOW"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure.activitylogs*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.outcome == "success"
      AND TO_UPPER(azure.activitylogs.operation_name) == "MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE"
    | KEEP @timestamp, azure.activitylogs.operation_name, azure.activitylogs.identity.claims.name, azure.resource.group, azure.resource.name, cloud.account.id, event.outcome
  leql: |
    where(source_json.operationName="MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE" AND source_json.status="Success")
  crowdstrike: |
    #type=azure:activity operationName="MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE" resultType=Success
    | table([@timestamp, callerIpAddress, caller, operationName, resourceId, resultType])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AZURE
      and operation_name in ("MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE")
      and outcome = ENUM.AUDIT_RESULT_SUCCESS
    | fields _time, cloud_provider, operation_name, outcome, actor_user, resource_name, resource_sub_type, cloud_resource_identifier
  lucene: |
    azure.activitylogs.operation_name:"MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE" AND azure.activitylogs.result_type:"Success"
  sumo: |
    _sourceCategory=*Azure*Activity*
    | json field=_raw "operationName" as operation
    | json field=_raw "status.value" as status
    | where operation matches "*MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE*" and status = "Success"
    | fields _messageTime, _sourceHost, operation, status
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Administrative Activity Event

  Where the operation is in ["MICROSOFT.AUTOMATION/AUTOMATIONACCOUNTS/WRITE"]

  Where the action is success'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000657
v4_id: '000657'
name: Cobalt Strike Installation via Executable
description: Detects Cobalt Strike Installation via an Executable.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 7045, 4697'
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: '(index=wineventlog sourcetype=WinEventLog:System EventCode=7045 Service_File_Name="*.exe*" Service_File_Name="*ADMIN$*") OR (index=wineventlog
    sourcetype=WinEventLog:Security EventCode=4697 Service_File_Name="*.exe*" Service_File_Name="*ADMIN$*")

    | table _time, ComputerName, EventCode, Service_Name, Service_File_Name, ServiceFileName

    '
  kql: "union \n(SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID == 4697\n| where ServiceFileName contains \".exe\" and ServiceFileName\
    \ contains \"ADMIN$\"\n| extend ServiceName = ServiceName, ImagePath = ServiceFileName, EventSource = \"SecurityEvent\"\n| project TimeGenerated,\
    \ Computer, Account, ServiceName, ImagePath, EventID, EventSource),\n(Event\n| where TimeGenerated > ago(24h)\n| where EventLog == \"System\"\
    \ and Source == \"Service Control Manager\"\n| where EventID == 7045\n| extend ImagePath = tostring(EventData.ImagePath)\n| where ImagePath\
    \ contains \".exe\" and ImagePath contains \"ADMIN$\"\n| extend ServiceName = tostring(EventData.ServiceName)\n| project TimeGenerated, Computer,\
    \ Account = UserName, ServiceName, ImagePath, EventID, EventSource = \"SystemEvent\")\n| project TimeGenerated, Computer, Account, ServiceName,\
    \ ImagePath, EventID, EventSource\n"
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Service Name", "Service File Name", "ImagePath", qidname(qid)
    FROM events
    WHERE ("EventID" = '7045' AND "ImagePath" ILIKE '%.exe%' AND "ImagePath" ILIKE '%ADMIN$%')
       OR ("EventID" = '4697' AND "Service File Name" ILIKE '%.exe%' AND "Service File Name" ILIKE '%ADMIN$%')
    LAST 24 HOURS
  yara_l: |
    rule mitre_t1569_service_execution_admin_share {
      meta:
        author = "Detection Logic Translation"
        description = "Detects service creation with executable in ADMIN$ share - T1569 System Services"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "High"

      events:
        // Event ID 7045 - Service Control Manager
        $e1.metadata.product_event_type = "7045"
        re.regex($e1.metadata.product_log_id, `(?i)System`)
        re.regex($e1.principal.process.command_line, `(?i)ADMIN\$`) or
        re.regex($e1.target.process.file.full_path, `(?i)ADMIN\$`)
        re.regex($e1.principal.process.command_line, `(?i)\.exe`) or
        re.regex($e1.target.process.file.full_path, `(?i)\.exe`)
        $e1.principal.hostname = $host

        // Event ID 4697 - Service Installation
        $e2.metadata.product_event_type = "4697"
        re.regex($e2.target.process.file.full_path, `(?i)ADMIN\$`)
        re.regex($e2.target.process.file.full_path, `(?i)\.exe`)
        $e2.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e1 or $e2
    }
  esql: |
    FROM logs-system.system*, logs-system.security*
    | WHERE (event.code == "7045" AND winlog.event_data.ImagePath LIKE "*.exe*" AND winlog.event_data.ImagePath LIKE "*ADMIN$*")
       OR (event.code == "4697" AND winlog.event_data.ServiceFileName LIKE "*.exe*" AND winlog.event_data.ServiceFileName LIKE "*ADMIN$*")
    | KEEP @timestamp, host.name, event.code, winlog.event_data.ServiceName, winlog.event_data.ImagePath, winlog.event_data.ServiceFileName, user.name
  leql: |
    where((source_json.EventID=7045 AND source_json.ImagePath ICONTAINS ".exe" AND source_json.ImagePath ICONTAINS "ADMIN$") OR (source_json.EventID=4697 AND source_json.ServiceFileName ICONTAINS ".exe" AND source_json.ServiceFileName ICONTAINS "ADMIN$"))
  crowdstrike: |
    (EventCode=7045 ImagePath=*.exe* ImagePath=*ADMIN$*) OR (EventCode=4697 ServiceFileName=*.exe* ServiceFileName=*ADMIN$*)
    | table([@timestamp, ComputerName, EventCode, ServiceName, ImagePath, ServiceFileName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id = 7045 and action_evtlog_source_name = "Service Control Manager" and action_evtlog_event_data_ImagePath contains ".exe" and action_evtlog_event_data_ImagePath contains "ADMIN$")
       or (action_evtlog_event_id = 4697 and action_evtlog_event_data_ServiceFileName contains ".exe" and action_evtlog_event_data_ServiceFileName contains "ADMIN$")
    | fields _time, agent_hostname, action_evtlog_event_id, action_evtlog_event_data_ServiceName, action_evtlog_event_data_ImagePath, action_evtlog_event_data_ServiceFileName, actor_effective_username
  lucene: |
    (EventSourceName:"Service Control Manager" AND event.code:7045 AND ImagePath:*.exe* AND ImagePath:*ADMIN$*) OR (event.code:4697 AND ServiceFileName:*.exe* AND ServiceFileName:*ADMIN$*)
  sumo: "_sourceCategory=*Windows* (EventID=7045 OR EventID=4697)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"EventSourceName\"\
    \ as event_source\n| json field=_raw \"ImagePath\" as image_path\n| json field=_raw \"ServiceFileName\" as service_file_name\n| where (event_id\
    \ = \"7045\" and event_source = \"Service Control Manager\" and image_path matches \"*.exe*\" and image_path matches \"*ADMIN$*\") \n   OR\
    \ (event_id = \"4697\" and service_file_name matches \"*.exe*\" and service_file_name matches \"*ADMIN$*\")\n| fields _messageTime, _sourceHost,\
    \ event_id, event_source, image_path, service_file_name\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows System Event \nWhere EventSourceName is \"Service Control Manager\"\nWhere the Event ID is 7045 \nWhere ImagePath contains\
  \ \".exe\" AND \"ADMIN$\"\n\n--------------------------------------------------------------------\n\n1 Windows Security event\nWhere the Event\
  \ ID is 4697\nWhere ServiceFileName contains  \".exe\"\nWhere ServiceFileName contains  \"ADMIN$\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

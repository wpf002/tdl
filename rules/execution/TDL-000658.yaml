rule_id: TDL-EXE-000658
v4_id: 000658
name: Cobalt Strike Installation via Powershell
description: Detects Cobalt Strike Installation via Powershell.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 7045, 4697'
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: '(index=wineventlog sourcetype="WinEventLog:System" EventCode=7045 EventSourceName="Service Control Manager" Service_File_Name="*COMSPEC*"
    Service_File_Name="*start*" Service_File_Name="*powershell*") OR (index=wineventlog sourcetype="WinEventLog:Security" EventCode=4697 ServiceFileName="*COMSPEC*"
    ServiceFileName="*start*" ServiceFileName="*powershell*")

    | table _time, ComputerName, EventCode, Service_Name, Service_File_Name, ServiceFileName, User

    '
  kql: |
    union
    (
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 7045
    | where EventSourceName =~ "Service Control Manager"
    | where ImagePath has "COMSPEC" and ImagePath has "start" and ImagePath has "powershell"
    | project TimeGenerated, Computer, EventID, Account, ServiceName = Service, ImagePath
    ),
    (
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4697
    | where ServiceFileName has "COMSPEC" and ServiceFileName has "start" and ServiceFileName has "powershell"
    | project TimeGenerated, Computer, EventID, Account, ServiceName, ImagePath = ServiceFileName
    )
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Service Name", "Service File Name", "EventID"
    FROM events
    WHERE "EventID" IN ('7045', '4697')
      AND (
        ("EventID" = '7045' AND "Service File Name" ILIKE '%COMSPEC%' AND "Service File Name" ILIKE '%start%' AND "Service File Name" ILIKE '%powershell%')
        OR
        ("EventID" = '4697' AND "Service File Name" ILIKE '%COMSPEC%' AND "Service File Name" ILIKE '%start%' AND "Service File Name" ILIKE '%powershell%')
      )
    LAST 24 HOURS
  yara_l: |
    rule mitre_t1569_powershell_service_creation {
      meta:
        author = "Detection Engineer"
        description = "Detects service creation with PowerShell via COMSPEC - MITRE T1569"
        mitre_attack_technique = "T1569"
        mitre_attack_tactic = "Execution"
        severity = "High"

      events:
        // Event ID 7045 - Service Control Manager
        $e1.metadata.product_event_type = "7045"
        $e1.metadata.product_name = "Microsoft Windows"
        re.regex($e1.security_result.description, `(?i)Service Control Manager`)
        re.regex($e1.target.process.command_line, `(?i)COMSPEC`)
        re.regex($e1.target.process.command_line, `(?i)start`)
        re.regex($e1.target.process.command_line, `(?i)powershell`)
        $e1.principal.hostname = $host

        // Event ID 4697 - A service was installed in the system
        $e2.metadata.product_event_type = "4697"
        $e2.metadata.product_name = "Microsoft Windows"
        re.regex($e2.target.process.file.full_path, `(?i)COMSPEC`)
        re.regex($e2.target.process.file.full_path, `(?i)start`)
        re.regex($e2.target.process.file.full_path, `(?i)powershell`)
        $e2.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e1 or $e2
    }
  esql: |
    FROM logs-system.system*, logs-system.security*
    | WHERE (event.code == "7045" AND winlog.event_data.ImagePath LIKE "*COMSPEC*" AND winlog.event_data.ImagePath LIKE "*start*" AND winlog.event_data.ImagePath LIKE "*powershell*")
       OR (event.code == "4697" AND winlog.event_data.ServiceFileName LIKE "*COMSPEC*" AND winlog.event_data.ServiceFileName LIKE "*start*" AND winlog.event_data.ServiceFileName LIKE "*powershell*")
    | KEEP @timestamp, host.name, event.code, winlog.event_data.ServiceName, winlog.event_data.ImagePath, winlog.event_data.ServiceFileName, user.name
  leql: |
    where((source_json.EventID=7045 AND source_json.ImagePath ICONTAINS "COMSPEC" AND source_json.ImagePath ICONTAINS "start" AND source_json.ImagePath ICONTAINS "powershell") OR (source_json.EventID=4697 AND source_json.ServiceFileName ICONTAINS "COMSPEC" AND source_json.ServiceFileName ICONTAINS "start" AND source_json.ServiceFileName ICONTAINS "powershell"))
  crowdstrike: |
    (EventCode=7045 OR EventCode=4697)
    | case {
        EventCode=7045 | ImagePath=*/COMSPEC* ImagePath=*start* ImagePath=*powershell* ;
        EventCode=4697 | ServiceFileName=*/COMSPEC* ServiceFileName=*start* ServiceFileName=*powershell* ;
        * | drop();
      }
    | table([@timestamp, ComputerName, EventCode, ImagePath, ServiceFileName, ServiceName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id = 7045 and action_evtlog_source_name = "Service Control Manager" and lowercase(action_evtlog_event_data_ImagePath) contains "comspec" and lowercase(action_evtlog_event_data_ImagePath) contains "start" and lowercase(action_evtlog_event_data_ImagePath) contains "powershell")
       or (action_evtlog_event_id = 4697 and lowercase(action_evtlog_event_data_ServiceFileName) contains "comspec" and lowercase(action_evtlog_event_data_ServiceFileName) contains "start" and lowercase(action_evtlog_event_data_ServiceFileName) contains "powershell")
    | fields _time, agent_hostname, action_evtlog_event_id, action_evtlog_event_data_ServiceName, action_evtlog_event_data_ImagePath, action_evtlog_event_data_ServiceFileName, actor_effective_username
  lucene: |
    (event.code:7045 AND EventSourceName:"Service Control Manager" AND ImagePath:*COMSPEC* AND ImagePath:*start* AND ImagePath:*powershell*) OR (event.code:4697 AND ServiceFileName:*COMSPEC* AND ServiceFileName:*start* AND ServiceFileName:*powershell*)
  sumo: "_sourceCategory=*Windows* (EventID=7045 OR EventID=4697)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"EventSourceName\"\
    \ as event_source\n| json field=_raw \"ImagePath\" as image_path\n| json field=_raw \"ServiceFileName\" as service_file_name\n| where (event_id\
    \ = \"7045\" and event_source = \"Service Control Manager\" and image_path matches \"*COMSPEC*\" and image_path matches \"*start*\" and image_path\
    \ matches \"*powershell*\") \n   or (event_id = \"4697\" and service_file_name matches \"*COMSPEC*\" and service_file_name matches \"*start*\"\
    \ and service_file_name matches \"*powershell*\")\n| fields _messageTime, _sourceHost, event_id, image_path, service_file_name\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows System Event \nWhere EventSourceName is \"Service Control Manager\"\nWhere the Event ID is 7045 \nWhere ImagePath contains\
  \ \"COMSPEC\" AND \"start\" AND \"powershell\"\n\n--------------------------------------------------------------------\n\n1 Windows Security\
  \ event\nWhere the Event ID is 4697\nWhere ServiceFileName contains  \"COMSPEC\"\nWhere ServiceFileName contains  \"start\"\nWhere ServiceFileName\
  \ contains  \"powershell\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

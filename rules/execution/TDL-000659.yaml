rule_id: TDL-EXE-000659
v4_id: 000659
name: Cobalt Strike Installation via Hidden Powershell
description: Detects Cobalt Strike Installation via Hidden Powershell.
tactic: Execution
tactic_id: TA0002
technique_id: T1569
technique_name: System Services
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 7045, 4697'
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: '(index=wineventlog sourcetype=WinEventLog:System EventCode=7045 Service_File_Name="*powershell -nop -w hidden -encodedcommand*") OR (index=wineventlog
    sourcetype=WinEventLog:Security EventCode=4697 Service_File_Name="*powershell -nop -w hidden -encodedcommand*")

    | table _time, ComputerName, EventCode, Service_Name, Service_File_Name, ServiceName, ServiceFileName

    '
  kql: |
    union
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 7045
    | where EventSourceName =~ "Service Control Manager"
    | where ParameterXml has "powershell -nop -w hidden -encodedcommand"
    | extend ImagePath = extract(@"<Data Name=""ImagePath"">([^<]+)</Data>", 1, ParameterXml)
    | where ImagePath has "powershell -nop -w hidden -encodedcommand"
    | project TimeGenerated, Computer, EventID, ServiceName = extract(@"<Data Name=""ServiceName"">([^<]+)</Data>", 1, ParameterXml), ImagePath, Account),
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4697
    | where ParameterXml has "powershell -nop -w hidden -encodedcommand"
    | extend ServiceFileName = extract(@"<Data Name=""ServiceFileName"">([^<]+)</Data>", 1, ParameterXml)
    | where ServiceFileName has "powershell -nop -w hidden -encodedcommand"
    | project TimeGenerated, Computer, EventID, ServiceName = extract(@"<Data Name=""ServiceName"">([^<]+)</Data>", 1, ParameterXml), ServiceFileName, Account)
    | project TimeGenerated, Computer, EventID, ServiceName, ImagePath = coalesce(ImagePath, ServiceFileName), Account
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, "EventID", "Service Name", COALESCE("Service File Name", "ImagePath") AS service_path, username
    FROM events
    WHERE ("EventID" = '7045' AND "ImagePath" ILIKE '%powershell -nop -w hidden -encodedcommand%')
       OR ("EventID" = '4697' AND "Service File Name" ILIKE '%powershell -nop -w hidden -encodedcommand%')
    LAST 24 HOURS
  yara_l: |
    rule suspicious_service_encoded_powershell {
      meta:
        author = "Detection Engineer"
        description = "Detects service creation with encoded PowerShell command - MITRE T1569"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1569"
        severity = "High"

      events:
        // Event ID 7045 - Service Control Manager
        $e1.metadata.event_type = "SERVICE_CREATION"
        $e1.metadata.product_event_type = "7045"
        re.regex($e1.target.process.command_line, `(?i)powershell\s+-nop\s+-w\s+hidden\s+-encodedcommand`) or
        re.regex($e1.target.process.file.full_path, `(?i)powershell\s+-nop\s+-w\s+hidden\s+-encodedcommand`)
        $e1.principal.hostname = $host

        // Event ID 4697 - Security Auditing
        $e2.metadata.event_type = "SERVICE_CREATION"
        $e2.metadata.product_event_type = "4697"
        re.regex($e2.target.process.command_line, `(?i)powershell\s+-nop\s+-w\s+hidden\s+-encodedcommand`) or
        re.regex($e2.target.process.file.full_path, `(?i)powershell\s+-nop\s+-w\s+hidden\s+-encodedcommand`)
        $e2.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e1 or $e2
    }
  esql: |
    FROM logs-system.system*, logs-system.security*
    | WHERE (event.code == "7045" AND winlog.event_data.ImagePath LIKE "*powershell -nop -w hidden -encodedcommand*")
       OR (event.code == "4697" AND winlog.event_data.ServiceFileName LIKE "*powershell -nop -w hidden -encodedcommand*")
    | KEEP @timestamp, host.name, event.code, winlog.event_data.ServiceName, winlog.event_data.ImagePath, winlog.event_data.ServiceFileName
  leql: |
    where((source_json.EventID=7045 AND source_json.ImagePath ICONTAINS "powershell -nop -w hidden -encodedcommand") OR (source_json.EventID=4697 AND source_json.ServiceFileName ICONTAINS "powershell -nop -w hidden -encodedcommand"))
  crowdstrike: |
    (EventCode=7045 ImagePath=*powershell*-nop*-w*hidden*-encodedcommand*) OR (EventCode=4697 ServiceFileName=*powershell*-nop*-w*hidden*-encodedcommand*)
    | table([@timestamp, ComputerName, EventCode, ImagePath, ServiceFileName, ServiceName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id = 7045 and action_evtlog_data_EventSourceName = "Service Control Manager" and action_evtlog_event_data_ImagePath contains "powershell -nop -w hidden -encodedcommand")
       or (action_evtlog_event_id = 4697 and action_evtlog_event_data_ServiceFileName contains "powershell -nop -w hidden -encodedcommand")
    | fields _time, agent_hostname, action_evtlog_event_id, actor_effective_username, action_evtlog_event_data_ServiceName, action_evtlog_event_data_ImagePath, action_evtlog_event_data_ServiceFileName
  lucene: |
    (event.code:7045 AND winlog.event_data.ServiceName:* AND winlog.event_data.ImagePath:*powershell*-nop*-w*hidden*-encodedcommand*) OR (event.code:4697 AND winlog.event_data.ServiceFileName:*powershell*-nop*-w*hidden*-encodedcommand*)
  sumo: "(_sourceCategory=*Windows*System* OR _sourceCategory=*Windows*Security*)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"EventSourceName\" as event_source\n| json field=_raw \"ImagePath\" as image_path\n| json field=_raw \"ServiceFileName\" as service_file_name\n\
    | where (event_id = \"7045\" and event_source = \"Service Control Manager\" and image_path matches \"*powershell -nop -w hidden -encodedcommand*\"\
    ) \n    OR (event_id = \"4697\" and service_file_name matches \"*powershell -nop -w hidden -encodedcommand*\")\n| fields _messageTime, _sourceHost,\
    \ event_id, image_path, service_file_name\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows System Event \nWhere EventSourceName is \"Service Control Manager\"\nWhere the Event ID is 7045 \nWhere ImagePath contains\
  \ \"powershell -nop -w hidden -encodedcommand\"\n\n--------------------------------------------------------------------\n\n1 Windows Security\
  \ event\nWhere the Event ID is 4697\nWhere ServiceFileName contains \"powershell -nop -w hidden -encodedcommand\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

rule_id: TDL-EXE-000665
v4_id: '000665'
name: High Risk Scheduled Task Disabled
description: this rule detects activities associated with critical system components and processes, such as system restoration, security features,
  backup mechanisms, and updates. By detecting such events, administrators can ensure the system's health and security status remain intact.
tactic: Execution
tactic_id: TA0002
technique_id: T1053
technique_name: Scheduled Task or Job
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4701'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4701 (Task_Name="*\\Windows\\SystemRestore\\SR*" OR Task_Name="*\\Windows\\Defender*"
    OR Task_Name="*\\Windows\\BitLocker*" OR Task_Name="*\\Windows\\WindowsBackup*" OR Task_Name="*\\Windows\\WindowsUpdate*" OR Task_Name="*\\Windows\\UpdateOrchestrator\\Schedule*"
    OR Task_Name="*\\Windows\\ExploitGuard*")

    | table _time, ComputerName, Account_Name, Task_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4701
    | where TaskName has_any ("\\Windows\\SystemRestore\\SR", "\\Windows\\Windows\\Defender", "\\Windows\\BitLocker", "\\Windows\\WindowsBackup", "\\Windows\\WindowsUpdate", "\\Windows\\UpdateOrchestrator\\Schedule", "\\Windows\\ExploitGuard")
    | project TimeGenerated, Computer, Account, TaskName, EventData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Task Name"
    FROM events
    WHERE "EventID" = '4701'
      AND ("Task Name" ILIKE '%\\Windows\\SystemRestore\\SR%'
           OR "Task Name" ILIKE '%\\Windows\\Defender%'
           OR "Task Name" ILIKE '%\\Windows\\BitLocker%'
           OR "Task Name" ILIKE '%\\Windows\\WindowsBackup%'
           OR "Task Name" ILIKE '%\\Windows\\WindowsUpdate%'
           OR "Task Name" ILIKE '%\\Windows\\UpdateOrchestrator\\Schedule%'
           OR "Task Name" ILIKE '%\\Windows\\ExploitGuard%')
    LAST 24 HOURS
  yara_l: |
    rule scheduled_task_disabled_security_features {
      meta:
        author = "TDL"
        description = "Detects disabling of scheduled tasks related to Windows security features - T1053"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1053"
        severity = "High"

      events:
        $e.metadata.event_type = "GENERIC_EVENT"
        $e.metadata.product_event_type = "4701"
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Windows"
        (
          re.regex($e.target.resource.name, `(?i)\\Windows\\SystemRestore\\SR`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\Windows\\Defender`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\BitLocker`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\WindowsBackup`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\WindowsUpdate`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\UpdateOrchestrator\\Schedule`) or
          re.regex($e.target.resource.name, `(?i)\\Windows\\ExploitGuard`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.code == \"4701\"\
    \n  AND (\n    winlog.event_data.TaskName LIKE \"*\\\\Windows\\\\SystemRestore\\\\SR*\"\n    OR winlog.event_data.TaskName LIKE \"*\\\\Windows\\\
    \\Windows\\\\Defender*\"\n    OR winlog.event_data.TaskName LIKE \"*\\\\Windows\\\\BitLocker*\"\n    OR winlog.event_data.TaskName LIKE \"\
    *\\\\Windows\\\\WindowsBackup*\"\n    OR winlog.event_data.TaskName LIKE \"*\\\\Windows\\\\WindowsUpdate*\"\n    OR winlog.event_data.TaskName\
    \ LIKE \"*\\\\Windows\\\\UpdateOrchestrator\\\\Schedule*\"\n    OR winlog.event_data.TaskName LIKE \"*\\\\Windows\\\\ExploitGuard*\"\n  )\n\
    | KEEP @timestamp, host.name, user.name, winlog.event_data.TaskName, winlog.event_data.TaskContent\n"
  leql: |
    where(source_json.EventID=4701 AND (source_json.TaskName ICONTAINS "\\Windows\\SystemRestore\\SR" OR source_json.TaskName ICONTAINS "\\Windows\\Windows\\Defender" OR source_json.TaskName ICONTAINS "\\Windows\\BitLocker" OR source_json.TaskName ICONTAINS "\\Windows\\WindowsBackup" OR source_json.TaskName ICONTAINS "\\Windows\\WindowsUpdate" OR source_json.TaskName ICONTAINS "\\Windows\\UpdateOrchestrator\\Schedule" OR source_json.TaskName ICONTAINS "\\Windows\\ExploitGuard"))
  crowdstrike: |
    EventCode=4701 (TaskName=*\\Windows\\SystemRestore\\SR* OR TaskName=*\\Windows\\Defender* OR TaskName=*\\Windows\\BitLocker* OR TaskName=*\\Windows\\WindowsBackup* OR TaskName=*\\Windows\\WindowsUpdate* OR TaskName=*\\Windows\\UpdateOrchestrator\\Schedule* OR TaskName=*\\Windows\\ExploitGuard*) | table([@timestamp, ComputerName, TaskName, UserName])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id = 4701\n| filter action_evtlog_message contains \"TaskName\" \n| filter action_evtlog_message\
    \ ~= \".*\\\\\\\\Windows\\\\\\\\SystemRestore\\\\\\\\SR.*|.*\\\\\\\\Windows\\\\\\\\Defender.*|.*\\\\\\\\Windows\\\\\\\\BitLocker.*|.*\\\\\\\
    \\Windows\\\\\\\\WindowsBackup.*|.*\\\\\\\\Windows\\\\\\\\WindowsUpdate.*|.*\\\\\\\\Windows\\\\\\\\UpdateOrchestrator\\\\\\\\Schedule.*|.*\\\
    \\\\\\Windows\\\\\\\\ExploitGuard.*\"\n| fields _time, agent_hostname, actor_effective_username, action_evtlog_message\n"
  lucene: |
    event.code:4701 AND TaskName:(*\\Windows\\SystemRestore\\SR* OR *\\Windows\\Windows\\Defender* OR *\\Windows\\BitLocker* OR *\\Windows\\WindowsBackup* OR *\\Windows\\WindowsUpdate* OR *\\Windows\\UpdateOrchestrator\\Schedule* OR *\\Windows\\ExploitGuard*)
  sumo: |
    _sourceCategory=*Windows*Security* "4701"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TaskName" as taskname
    | where event_id = "4701"
    | where taskname matches "*\\Windows\\SystemRestore\\SR*" or taskname matches "*\\Windows\\Windows\\Defender*" or taskname matches "*\\Windows\\BitLocker*" or taskname matches "*\\Windows\\WindowsBackup*" or taskname matches "*\\Windows\\WindowsUpdate*" or taskname matches "*\\Windows\\UpdateOrchestrator\\Schedule*" or taskname matches "*\\Windows\\ExploitGuard*"
    | fields _messageTime, _sourceHost, taskname, event_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Security Event\nWhere Event ID 4701\nWhere Taskname contains either \n\"\"*\\\\Windows\\\\SystemRestore\\\\SR*\"\" \n\
  \"\"*\\\\Windows\\\\Windows\\\\Defender*\"\" \n\"\"*\\\\Windows\\\\BitLocker*\"\" \n\"\"*\\\\Windows\\\\WindowsBackup*\"\" \n\"\"*\\\\Windows\\\
  \\WindowsUpdate*\"\" \n\"\"*\\\\Windows\\\\UpdateOrchestrator\\\\Schedule*\"\" \n\"\"*\\\\Windows\\\\ExploitGuard*\"\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

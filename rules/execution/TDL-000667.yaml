rule_id: TDL-EXE-000667
v4_id: '000667'
name: Potentially Malicious Tool Detected - GuardDuty
description: This detection looks for a suspicious tool has been executed on an EC2 instance or container within your AWS environment. This includes
  tools used in pentesting engagements, also known as backdoor tools, network scanners, and network sniffers. All these tools can be used in benign
  contexts but are also frequently used by threat actors with malicious intent. Observing offensive security tools could indicate that the associated
  EC2 instance or container has been compromised.
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty eventType IN ("Execution:Runtime/SuspiciousTool")

    | table _time, awsAccountId, region, eventType, service.action.actionType, resource.instanceDetails.instanceId, resource.instanceDetails.imageId,
    service.additionalInfo, severity, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title has "Execution:Runtime/SuspiciousTool"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = Resource_InstanceDetails_InstanceId, InstanceType = Resource_InstanceDetails_InstanceType, Service_Action_ActionType, Service_Action_NetworkConnectionAction_RemoteIpDetails_IpAddressV4, Service_Action_NetworkConnectionAction_RemoteIpDetails_Country_CountryName
  aql: |
    SELECT sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), "Event Type" AS event_type, eventtime
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Event Type" = 'Execution:Runtime/SuspiciousTool'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_suspicious_tool_execution {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for suspicious tool execution (T1204)"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        $e.metadata.product_event_type = "Execution:Runtime/SuspiciousTool"
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type == "Execution:Runtime/SuspiciousTool"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, event.action, event.type, message
  leql: |
    where(source_json.type IN ["Execution:Runtime/SuspiciousTool"])
  crowdstrike: |
    #type=guardduty detail.type="Execution:Runtime/SuspiciousTool"
    | table([@timestamp, detail.resource.instanceDetails.instanceId, detail.service.action.awsApiCallAction.api, detail.service.action.awsApiCallAction.serviceName, detail.resource.instanceDetails.imageId, detail.severity, detail.title, detail.description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "Amazon" and event_type = "Execution:Runtime/SuspiciousTool"
    | fields _time, cloud_provider, event_type, identity_name, resource_type, resource_name, description
  lucene: |
    event.type:"Execution:Runtime/SuspiciousTool"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Execution:Runtime/SuspiciousTool")
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Runtime/SuspiciousTool\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

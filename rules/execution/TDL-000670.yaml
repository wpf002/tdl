rule_id: TDL-EXE-000670
v4_id: '000670'
name: Potentially Malicious Shell Created - GuardDuty
description: This detection looks for potentially malicious shell creation within AWS
tactic: Execution
tactic_id: TA0002
technique_id: T1204
technique_name: User Execution
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty type IN ("Execution:Runtime/SuspiciousShellCreated")

    | table _time, accountId, region, type, resource.instanceDetails.instanceId, severity, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType == "Execution:Runtime/SuspiciousShellCreated"
    | project TimeGenerated, ActivityType, AccountId, Region, ResourceType, Severity, Title, Description, Resource = tostring(Resource)
  aql: "SELECT QIDNAME(qid) AS event_name, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, \"finding.type\" AS finding_type,\
    \ eventtime\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%' \n  AND \"finding.type\" = 'Execution:Runtime/SuspiciousShellCreated'\n\
    LAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_suspicious_shell_created {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty Execution:Runtime/SuspiciousShellCreated finding"
        mitre_tactic = "Execution"
        mitre_technique = "T1204"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        $e.metadata.product_event_type = "Execution:Runtime/SuspiciousShellCreated"
        $e.principal.cloud.environment = $account_id

      match:
        $account_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type == "Execution:Runtime/SuspiciousShellCreated"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.id, aws.guardduty.finding.type, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, user.name, event.action
  leql: |
    where(source_json.type IN ["Execution:Runtime/SuspiciousShellCreated"])
  crowdstrike: |
    #type=guardduty findingType="Execution:Runtime/SuspiciousShellCreated"
    | table([@timestamp, accountId, region, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, title, description, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logtype = "guardduty"
    | filter json_extract_scalar(raw_log, "$.detail.type") in ("Execution:Runtime/SuspiciousShellCreated")
    | fields _time, cloud_provider_account, json_extract_scalar(raw_log, "$.detail.type") as finding_type, json_extract_scalar(raw_log, "$.detail.severity") as severity, json_extract_scalar(raw_log, "$.detail.resource.instanceDetails.instanceId") as instance_id, json_extract_scalar(raw_log, "$.detail.description") as description
  lucene: |
    event_type:"Execution:Runtime/SuspiciousShellCreated"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type = "Execution:Runtime/SuspiciousShellCreated"
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Runtime/SuspiciousShellCreated\"]"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

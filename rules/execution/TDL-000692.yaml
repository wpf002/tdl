rule_id: TDL-EXE-000692
v4_id: 000692
name: Slack CLI Accessed by Unauthorized User
description: Detects when a non Slack Admin accesses the Slack command line interface
tactic: Execution
tactic_id: TA0002
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=slack action=\"cli_login\" \n| search NOT [| inputlookup slack_admins.csv | fields user | rename user as source_user]\n| table _time,\
    \ source_user, action, src_ip, user_agent\n"
  kql: |
    Slack_CL
    | where TimeGenerated > ago(24h)
    | where Action_s == "cli_login"
    | where SourceUser_s !in (datatable(admin:string)["admin1@company.com","admin2@company.com"])
    | project TimeGenerated, SourceUser_s, Action_s, ClientIP_s, UserAgent_s, DeviceId_s
  aql: |
    SELECT "Source User", "Action", eventtime, sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Action" = 'cli_login'
      AND "Source User" NOT IN ('admin1@company.com', 'admin2@company.com', 'admin3@company.com')
    LAST 24 HOURS
  yara_l: "rule slack_cli_login_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Slack CLI login from non-admin users -\
    \ T1059\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1059\"\n    severity = \"Medium\"\n    \n  events:\n \
    \   $e.metadata.product_name = \"Slack\"\n    $e.metadata.product_event_type = \"cli_login\"\n    $e.principal.user.userid = $user\n    not\
    \ $e.principal.user.attribute.roles.type = \"ADMINISTRATOR\"\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-slack*
    | WHERE event.action == "cli_login" AND user.name NOT IN ("admin1", "admin2", "admin3")
    | KEEP @timestamp, user.name, source.ip, event.action, host.name
  leql: |
    where(source_json.action="cli_login" AND source_user NOT IN slack_admins_list)
  crowdstrike: |
    #type=slack action="cli_login"
    | in(field=user, values=[slack_admins_list], negate=true)
    | table([@timestamp, user, action, source_ip, user_agent])
  xql: |
    dataset = slack_audit_logs
    | filter action = "cli_login"
    | alter is_admin = array_contains(actor_user_roles, "admin")
    | filter is_admin = false
    | fields _time, actor_user_email, actor_user_name, action, entity_name, context_ip_address, context_ua
  lucene: |
    action:"cli_login" AND NOT source_user:(admin1 OR admin2 OR admin3)
    ```

    Note: Since Slack admin list is dynamic and environment-specific, you'll need to replace `(admin1 OR admin2 OR admin3)` with your actual admin usernames, or use a lookup list/field if your SIEM supports it. For a production query without knowing specific admins:

    ```
    action:"cli_login"
    ```

    Then configure the exclusion list in your alerting rule's condition/filter settings rather than hardcoding usernames in the query.
  sumo: |
    _sourceCategory=*Slack* "cli_login"
    | json field=_raw "action" as action
    | json field=_raw "user.email" as user_email
    | json field=_raw "user.name" as user_name
    | where action = "cli_login"
    | lookup email from shared://slack_admins on user_email = email nodrop
    | where isNull(email)
    | fields _messageTime, user_email, user_name, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- execution
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "cli_login"

  Where the Source User is NOT on the Slack Admins List'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — pay attention to short-lived processes, encoded
  arguments, and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

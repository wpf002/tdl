rule_id: TDL-EXE-000702
v4_id: '000702'
name: DDE/COM Object Invoked from Office Application
description: Office process invokes COM scripting (MSScriptControl) or DDEAUTO. Legacy OLE/DDE abuse for code execution. Generated from gap analysis
  against canonical ATT&CK Enterprise matrix (T1559 under Execution).
tactic: Execution
tactic_id: TA0002
technique_id: T1559
technique_name: Inter-Process Communication
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
severity: Medium
fidelity: Low
lifecycle: Proposed
risk_score: 50
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"edr:*\") EventCode=1 \n(Image=\"*\\\\WINWORD.EXE\" OR Image=\"\
    *\\\\EXCEL.EXE\" OR Image=\"*\\\\POWERPNT.EXE\" OR Image=\"*\\\\OUTLOOK.EXE\" OR Image=\"*\\\\MSACCESS.EXE\" OR Image=\"*\\\\MSPUB.EXE\" OR\
    \ Image=\"*\\\\VISIO.EXE\") \n(CommandLine=\"*MSScriptControl*\" OR CommandLine=\"*DDEAUTO*\" OR CommandLine=\"*DDE*\" OR CommandLine=\"*OLE*\"\
    )\n| table _time, ComputerName, User, Image, CommandLine, ParentImage, ParentCommandLine\n"
  kql: |
    DeviceEvents
    | where TimeGenerated > ago(24h)
    | where ActionType in ("OleObjectLoadEvents", "DdeServerInitiated", "ComObjectCreated")
    | where InitiatingProcessFileName has_any ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe")
    | where FileName has_any ("MSScriptControl", "DDEAUTO", "scrrun.dll", "wshom.ocx")
       or AdditionalFields has_any ("MSScriptControl.ScriptControl", "DDEAUTO", "DDE")
    | project TimeGenerated, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ActionType, AdditionalFields
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "Target Object"
    FROM events
    WHERE ("Process Name" ILIKE '%winword.exe%' OR "Process Name" ILIKE '%excel.exe%' OR "Process Name" ILIKE '%powerpnt.exe%' OR "Process Name" ILIKE '%outlook.exe%')
      AND ("Target Object" ILIKE '%MSScriptControl%' OR "Target Object" ILIKE '%DDEAUTO%' OR "Process CommandLine" ILIKE '%MSScriptControl%' OR "Process CommandLine" ILIKE '%DDEAUTO%' OR "Image Loaded" ILIKE '%msscript.ocx%')
    LAST 24 HOURS
  yara_l: |
    rule office_com_dde_execution {
      meta:
        author = "TDL"
        description = "Detects Office processes invoking COM scripting (MSScriptControl) or DDEAUTO for code execution - MITRE T1559"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1559"
        severity = "High"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.file.full_path, `(?i)(winword|excel|powerpnt|msaccess|outlook)\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)\\Microsoft Office\\.*\\(WINWORD|EXCEL|POWERPNT|MSACCESS|OUTLOOK)\.EXE$`)
        )
        (
          re.regex($e.principal.process.command_line, `(?i)MSScriptControl`) or
          re.regex($e.principal.process.command_line, `(?i)DDEAUTO`) or
          re.regex($e.target.process.command_line, `(?i)MSScriptControl`) or
          re.regex($e.target.process.command_line, `(?i)DDEAUTO`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*, logs-endpoint.events.*\n| WHERE @timestamp > NOW() - 24 hours\n  AND (\n    (winlog.event_id ==\
    \ 7 AND TO_LOWER(winlog.event_data.ImageLoaded) LIKE \"*msscript.ocx*\")\n    OR (process.name IN (\"winword.exe\", \"excel.exe\", \"powerpnt.exe\"\
    , \"outlook.exe\", \"msaccess.exe\", \"mspub.exe\", \"visio.exe\")\n        AND (TO_LOWER(process.command_line) LIKE \"*ddeauto*\" \n    \
    \         OR TO_LOWER(process.command_line) LIKE \"*msscriptcontrol*\"\n             OR TO_LOWER(file.path) LIKE \"*msscript.ocx*\"))\n  )\n\
    \  AND process.parent.name IN (\"winword.exe\", \"excel.exe\", \"powerpnt.exe\", \"outlook.exe\", \"msaccess.exe\", \"mspub.exe\", \"visio.exe\"\
    )\n| STATS event_count = COUNT(*) BY host.name, process.name, process.parent.name, process.command_line, winlog.event_data.ImageLoaded\n|\
    \ KEEP @timestamp, host.name, process.name, process.parent.name, process.command_line, winlog.event_data.ImageLoaded, event_count\n"
  leql: |
    where((process_name ICONTAINS "winword.exe" OR process_name ICONTAINS "excel.exe" OR process_name ICONTAINS "powerpnt.exe" OR process_name ICONTAINS "outlook.exe") AND (process_cmd_line ICONTAINS "MSScriptControl" OR process_cmd_line ICONTAINS "DDEAUTO" OR source_json.TargetObject ICONTAINS "MSScriptControl" OR source_json.ImageLoaded ICONTAINS "msscript.ocx" OR parent_process_name ICONTAINS "dde"))
  crowdstrike: |
    event_simpleName=ProcessRollup2 (ParentBaseFileName=/(?i)(winword|excel|powerpnt|outlook)\.exe/) (CommandLine=/(?i)(MSScriptControl|DDEAUTO)/ OR CommandLine=*DDE* OR ImageFileName=/(?i)(wscript\.exe|cscript\.exe|mshta\.exe|rundll32\.exe|regsvr32\.exe|powershell\.exe)/)
    | table([@timestamp, ComputerName, UserName, ParentBaseFileName, FileName, CommandLine, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (lowercase(actor_process_image_name) contains "winword.exe"
        or lowercase(actor_process_image_name) contains "excel.exe"
        or lowercase(actor_process_image_name) contains "powerpnt.exe"
        or lowercase(actor_process_image_name) contains "outlook.exe"
        or lowercase(actor_process_image_name) contains "msaccess.exe")
    | filter (lowercase(action_process_image_command_line) ~= "(?i)msscriptcontrol"
        or lowercase(action_process_image_command_line) ~= "(?i)ddeauto"
        or lowercase(action_process_image_command_line) ~= "(?i)dde\s"
        or lowercase(action_process_image_name) contains "wscript.exe"
        or lowercase(action_process_image_name) contains "cscript.exe"
        or lowercase(action_process_image_name) contains "cmd.exe"
        or lowercase(action_process_image_name) contains "powershell.exe")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    (process.parent.name:(WINWORD.EXE OR EXCEL.EXE OR POWERPNT.EXE OR OUTLOOK.EXE) AND (process.command_line:*MSScriptControl* OR process.command_line:*DDEAUTO* OR winlog.event_data.GrantedAccess:*MSScriptControl* OR winlog.event_data.CallTrace:*MSScriptControl*)) OR (event.code:10 AND winlog.event_data.SourceImage:(*\\WINWORD.EXE OR *\\EXCEL.EXE OR *\\POWERPNT.EXE OR *\\OUTLOOK.EXE) AND winlog.event_data.TargetImage:*scrobj.dll*) OR (event.code:7 AND winlog.event_data.ImageLoaded:(*scrobj.dll OR *msscript.ocx) AND winlog.event_data.Image:(*\\WINWORD.EXE OR *\\EXCEL.EXE OR *\\POWERPNT.EXE OR *\\OUTLOOK.EXE))
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*EDR*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as image
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "ParentImage" as parent_image
    | json field=_raw "TargetObject" as target_object
    | json field=_raw "Details" as details
    | where (image matches "*\\WINWORD.EXE" OR image matches "*\\EXCEL.EXE" OR image matches "*\\POWERPNT.EXE" OR image matches "*\\MSACCESS.EXE" OR image matches "*\\OUTLOOK.EXE" OR parent_image matches "*\\WINWORD.EXE" OR parent_image matches "*\\EXCEL.EXE" OR parent_image matches "*\\POWERPNT.EXE" OR parent_image matches "*\\MSACCESS.EXE" OR parent_image matches "*\\OUTLOOK.EXE")
    | where (command_line matches "*MSScriptControl*" OR command_line matches "*ScriptControl*" OR command_line matches "*DDEAUTO*" OR target_object matches "*MSScriptControl*" OR details matches "*MSScriptControl*" OR details matches "*DDEAUTO*")
    | fields _messageTime, _sourceHost, event_id, parent_image, image, command_line, target_object, details
pseudo_logic: Office process invokes COM scripting (MSScriptControl) or DDEAUTO. Legacy OLE/DDE abuse for code execution.

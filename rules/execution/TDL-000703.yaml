rule_id: TDL-EXE-000703
v4_id: '000703'
name: Direct Syscall via Unbacked Memory Region
description: Process makes NT* syscalls from an unbacked / RX private memory region. Indicates syscall stub injection or direct system call evasion.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1106 under Execution).
tactic: Execution
tactic_id: TA0002
technique_id: T1106
technique_name: Native API
platform:
- Windows
- Linux
- macOS
data_sources:
- EDR
- Sysmon
severity: Medium
fidelity: Low
lifecycle: Proposed
risk_score: 50
queries:
  spl: 'index=edr OR index=wineventlog sourcetype IN ("edr:*", "WinEventLog:Microsoft-Windows-Sysmon/Operational", "syslog", "linux_secure")

    (syscall_name="Nt*" OR function_name="Nt*" OR api_call="Nt*")

    (memory_region_type="private" OR memory_type="private" OR region_type="unbacked")

    (memory_protection="RX" OR protection="PAGE_EXECUTE_READ" OR perms="r-x")

    | stats count values(syscall_name) as syscalls values(process_name) as process values(memory_region_address) as memory_address by host, process_id,
    image_path

    | where count > 0

    | table _time, host, process, image_path, process_id, syscalls, memory_address, count

    '
  kql: |
    DeviceEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "SuspiciousSystemCall"
    | where AdditionalFields has "UnbackedMemory" or AdditionalFields has "PrivateMemory"
    | extend ParsedFields = parse_json(AdditionalFields)
    | extend MemoryProtection = tostring(ParsedFields.MemoryProtection)
    | extend MemoryType = tostring(ParsedFields.MemoryType)
    | extend SystemCall = tostring(ParsedFields.SystemCall)
    | where MemoryProtection in~ ("RX", "Execute_Read")
    | where MemoryType =~ "Private" or MemoryType =~ "Unbacked"
    | where SystemCall startswith "Nt" or SystemCall startswith "Zw"
    | where InitiatingProcessFileName !in~ ("MsMpEng.exe", "SenseIR.exe", "SenseCncProxy.exe", "MsSense.exe")
    | project TimeGenerated, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SystemCall, MemoryType, MemoryProtection, FolderPath, SHA256
  aql: |
    SELECT "Process Name", "Process ID", sourceip, LOGSOURCENAME(logsourceid) AS host, "Image", "CallTrace", COUNT(*) AS syscall_count
    FROM events
    WHERE (categoryname(category) ILIKE '%process%' OR categoryname(category) ILIKE '%endpoint%')
      AND ("EventID" = '10' OR "EventID" = '8' OR "Event Type" ILIKE '%syscall%' OR "Event Type" ILIKE '%memory%')
      AND ("CallTrace" ILIKE '%UNKNOWN%' OR "CallTrace" ILIKE '%Unbacked%' OR "CallTrace" ILIKE '%Private%')
      AND ("TargetObject" ILIKE '%Nt%' OR "System Call" ILIKE '%Nt%' OR "Function Name" ILIKE '%Nt%' OR "CallTrace" ILIKE '%Nt%')
    GROUP BY "Process Name", "Process ID", sourceip, LOGSOURCENAME(logsourceid), "Image", "CallTrace"
    LAST 1 HOURS
  yara_l: |
    rule direct_syscall_from_unbacked_memory {
      meta:
        author = "TDL"
        description = "Detects NT syscalls executed from unbacked or private memory regions indicating syscall stub injection or direct system call evasion"
        mitre_attack_tactic = "Execution"
        mitre_attack_technique = "T1106"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_UNCATEGORIZED"
        (
          re.regex($e.metadata.product_event_type, `(?i)syscall`) or
          re.regex($e.security_result.summary, `(?i)syscall`) or
          re.regex($e.target.process.command_line, `(?i)nt.*syscall`)
        )
        (
          re.regex($e.security_result.description, `(?i)(unbacked|private|rx).*memory`) or
          re.regex($e.target.resource.attribute.labels.value, `(?i)(unbacked|private|rx)`) or
          re.regex($e.additional.fields.value, `(?i)(unbacked.*memory|private.*memory|memory.*rx)`)
        )
        (
          re.regex($e.security_result.summary, `(?i)nt(allocatevirtualmemory|protectvirtualmemory|writevirtualmemory|createthread|querysysteminformation|openprocess)`) or
          re.regex($e.target.process.command_line, `(?i)nt(allocatevirtualmemory|protectvirtualmemory|writevirtualmemory|createthread|querysysteminformation|openprocess)`)
        )
        $e.principal.hostname = $host
        $e.principal.process.pid = $pid

      match:
        $host, $pid over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: "FROM logs-endpoint.events.api*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.category == \"api\" \n  AND process.Ext.api.name LIKE\
    \ \"Nt*\"\n  AND process.Ext.api.metadata.target_address_protection == \"RX\"\n  AND process.Ext.api.metadata.target_address_allocation_type\
    \ == \"PRIVATE\"\n  AND (process.Ext.api.metadata.target_address_path IS NULL OR process.Ext.api.metadata.target_address_path == \"Unbacked\"\
    )\n| STATS syscall_count = COUNT(*) BY process.entity_id, process.name, process.executable, host.name, user.name, process.Ext.api.name\n|\
    \ WHERE syscall_count >= 1\n| KEEP @timestamp, host.name, user.name, process.name, process.executable, process.entity_id, process.Ext.api.name,\
    \ syscall_count\n"
  leql: |
    where(source_json.EventID=10 AND source_json.CallTrace=/Unknown\(([0-9A-Fa-f]+)\)/ AND (process_name NOT ICONTAINS "csrss.exe" AND process_name NOT ICONTAINS "wininit.exe" AND process_name NOT ICONTAINS "services.exe"))
  crowdstrike: |
    event_simpleName=SuspectProcessApiCall* (TargetApiName=Nt* OR TargetApiName=Zw*) (CallingModuleName="" OR CallingModuleName="-" OR CallingModuleName="Unknown")
    | regex("(RX|R-X|RWX)", field=MemoryProtection, strict=false)
    | table([@timestamp, ComputerName, UserName, ImageFileName, TargetProcessId, TargetApiName, CallingModuleName, MemoryProtection, CallStackHash, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_API_CALL
      and action_api_name ~= "^Nt"
      and (action_memory_allocation_type = "PRIVATE" or action_memory_protection contains "RX")
      and (action_memory_mapped_file_path = null or action_memory_mapped_file_path = "")
    | fields _time, agent_hostname, actor_process_image_name, actor_process_image_path, action_api_name, action_memory_allocation_type, action_memory_protection, action_memory_address, actor_effective_username
  lucene: |
    event.action:"syscall" AND event.module:(edr OR sysmon) AND (process.memory.region.type:"unbacked" OR process.memory.region.type:"private") AND process.memory.region.protection:"RX" AND syscall.name:/^nt.*/i
  sumo: "_sourceCategory=*EDR* OR _sourceCategory=*Sysmon*\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"Image\" as process_image\n\
    | json field=_raw \"ImageLoaded\" as image_loaded\n| json field=_raw \"MemoryRegion\" as memory_region\n| json field=_raw \"MemoryProtection\"\
    \ as memory_protection\n| json field=_raw \"CallTrace\" as call_trace\n| json field=_raw \"TargetProcessName\" as target_process\n| json field=_raw\
    \ \"GrantedAccess\" as granted_access\n| json field=_raw \"CallStack\" as call_stack\n| json field=_raw \"CommandLine\" as command_line\n\
    | where (memory_region matches \"*unbacked*\" or memory_region matches \"*private*\") \n  and (memory_protection matches \"*RX*\" or memory_protection\
    \ matches \"*EXECUTE_READ*\")\n  and (call_trace matches \"*Nt*\" or call_trace matches \"*Zw*\" or call_stack matches \"*Nt*\" or call_stack\
    \ matches \"*Zw*\")\n| fields _messageTime, _sourceHost, process_image, target_process, command_line, memory_region, memory_protection, call_trace,\
    \ call_stack\n"
pseudo_logic: Process makes NT* syscalls from an unbacked / RX private memory region. Indicates syscall stub injection or direct system call evasion.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- native-api
- syscall
- t1106
- execution
references:
- https://attack.mitre.org/techniques/T1106/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'

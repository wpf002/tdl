rule_id: TDL-EXE-000706
v4_id: '000706'
name: RMM Agent Spawning Interactive Shell
description: ConnectWise / Kaseya / NinjaOne / TeamViewer agent process spawns cmd, powershell or pwsh. Outside known patch workflows this signals
  abused deployment tooling. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1072 under Execution).
tactic: Execution
tactic_id: TA0002
technique_id: T1072
technique_name: Software Deployment Tools
platform:
- Windows
- Linux
- macOS
data_sources:
- EDR
- MDM Logs
- RMM Logs
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype IN (edr*, wineventlog*, sysmon*, linux_secure, syslog*, mdm*, rmm*) \n(ParentImage IN (\"*\\\\ScreenConnect.ClientService.exe\"\
    , \"*\\\\ScreenConnect.WindowsClient.exe\", \"*\\\\AgentMon.exe\", \"*\\\\Kaseya*.exe\", \"*\\\\NinjaRMMAgent.exe\", \"*\\\\TeamViewer*.exe\"\
    ) OR parent_process IN (\"*ScreenConnect*\", \"*AgentMon*\", \"*Kaseya*\", \"*NinjaRMM*\", \"*TeamViewer*\"))\n(Image IN (\"*\\\\cmd.exe\"\
    , \"*\\\\powershell.exe\", \"*\\\\pwsh.exe\", \"*/bin/bash\", \"*/bin/sh\", \"*/usr/bin/python*\") OR process_name IN (\"cmd.exe\", \"powershell.exe\"\
    , \"pwsh.exe\", \"bash\", \"sh\", \"python\"))\nNOT (CommandLine IN (\"*Windows\\\\ccmcache*\", \"*SoftwareDistribution*\", \"*patch*\", \"\
    *update*\") OR command_line IN (\"*Windows\\\\ccmcache*\", \"*SoftwareDistribution*\", \"*patch*\", \"*update*\"))\n| eval parent_proc=coalesce(ParentImage,\
    \ parent_process), child_proc=coalesce(Image, process_name), cmdline=coalesce(CommandLine, command_line), system=coalesce(ComputerName, host)\n\
    | stats count values(cmdline) as command_lines earliest(_time) as first_seen latest(_time) as last_seen by system, parent_proc, child_proc,\
    \ user\n| table first_seen, last_seen, system, user, parent_proc, child_proc, command_lines, count\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_exe_000706 {\n  meta:\n    author = \"TDL\"\n    description = \"RMM Agent Spawning Interactive Shell\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0002\"\n    technique = \"T1072\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: ConnectWise / Kaseya / NinjaOne / TeamViewer agent process spawns cmd, powershell or pwsh. Outside known patch workflows this signals

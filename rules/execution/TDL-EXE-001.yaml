rule_id: TDL-EXE-001
name: PowerShell Encoded Command Execution
tactic: Execution
tactic_id: TA0002
technique_id: T1059.001
technique_name: PowerShell
platform:
- Windows
data_sources:
- Windows Security Event Log (4688)
- Sysmon Event ID 1
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4688 (CommandLine="*-EncodedCommand*" OR CommandLine="*-enc *" OR CommandLine="*-ec
    *") NOT (Account_Name IN ("sccm_service", "intune_service", "admin_allow_1", "admin_allow_2"))

    | dedup ComputerName, Account_Name, IpAddress

    | eval instance_count=1

    | where instance_count >= 1

    | table _time, ComputerName, Account_Name, IpAddress, Logon_Type, EventCode, CommandLine, Process_Name

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(90d)
    | where EventID == 4688
    | where CommandLine has_any ("-EncodedCommand", "-enc", "-ec")
    | where CommandLine has "powershell"
    | where Account !in~ ("NT AUTHORITY\\SYSTEM", "NT AUTHORITY\\NETWORK SERVICE", "NT AUTHORITY\\LOCAL SERVICE")
    | where Account !contains "sccm" and Account !contains "intune"
    | extend IpAddress = coalesce(IpAddress, "N/A")
    | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), Count = count() by Computer, Account, IpAddress, CommandLine, ParentProcessName, Process, LogonType
    | where Count >= 1
    | project FirstSeen, LastSeen, Computer, Account, IpAddress, LogonType, CommandLine, Process, ParentProcessName, Count
  aql: "SELECT \n    eventtime,\n    LOGSOURCENAME(logsourceid) AS host,\n    username,\n    sourceip,\n    \"Process CommandLine\",\n    \"Logon\
    \ Type\",\n    \"EventID\"\nFROM events\nWHERE \"EventID\" = '4688'\n  AND (\n    \"Process CommandLine\" ILIKE '%-EncodedCommand%'\n    OR\
    \ \"Process CommandLine\" ILIKE '%-enc %'\n    OR \"Process CommandLine\" ILIKE '%-ec %'\n  )\n  AND username NOT IN (\n    'SYSTEM',\n  \
    \  'NT AUTHORITY\\SYSTEM',\n    'sccm_admin',\n    'intune_service',\n    'admin_deployment'\n  )\nLAST 24 HOURS\n"
  yara_l: "rule powershell_encoded_command_execution {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects PowerShell execution\
    \ with encoded command flags excluding known admin accounts\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1059.001\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\
    \n    re.regex($e.principal.process.command_line, `(?i)powershell`) nocase\n    (\n      re.regex($e.principal.process.command_line, `(?i)-EncodedCommand\\\
    b`) nocase or\n      re.regex($e.principal.process.command_line, `(?i)-enc\\b`) nocase or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)-ec\\b`) nocase\n    )\n    not re.regex($e.principal.user.userid, `(?i)(admin_account1|admin_account2|sccm_service|intune_service|deployment_svc)`)\
    \ nocase\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    $e.principal.ip = $ip\n    \n  match:\n    $host, $user,\
    \ $ip over 5m\n    \n  outcome:\n    $risk_score = 65\n    $event_count = count_distinct($e.metadata.id)\n    $command_line = array_distinct($e.principal.process.command_line)\n\
    \    \n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour AND event.code == "4688"
      AND (process.command_line LIKE "*-EncodedCommand*" OR process.command_line LIKE "*-enc *" OR process.command_line LIKE "*-ec *" OR process.command_line LIKE "* -enc" OR process.command_line LIKE "* -ec")
      AND (process.name LIKE "*powershell.exe" OR process.name LIKE "*pwsh.exe")
      AND NOT user.name IN ("admin", "sccmadmin", "intuneadmin", "svc_sccm", "svc_intune", "administrator")
    | STATS instances = COUNT(*) BY user.name, source.ip, winlog.logon.type, host.name
    | WHERE instances >= 1
    | KEEP @timestamp, host.name, user.name, source.ip, winlog.logon.type, event.code, instances
  leql: |
    where(source_json.EventID=4688 AND (process_cmd_line ICONTAINS "-encodedcommand" OR process_cmd_line ICONTAINS "-enc" OR process_cmd_line ICONTAINS "-ec") AND source_user NOT IN ["admin_user1", "admin_user2", "sccm_service", "intune_service"]) groupby(asset, source_user, source_address) calculate(count)
  crowdstrike: |
    EventCode=4688 (CommandLine=*-EncodedCommand* OR CommandLine=*-enc* OR CommandLine=*-ec*) (CommandLine=*powershell* OR CommandLine=*pwsh*)
    | NOT (SubjectUserName IN ["admin1", "admin2", "sccm_svc", "intune_svc", "SYSTEM"])
    | groupBy([ComputerName, SubjectUserName, IpAddress], function=count(as=instances))
    | instances >= 1
    | table([@timestamp, ComputerName, SubjectUserName, IpAddress, LogonType, EventCode, CommandLine, instances])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4688
    | filter action_process_image_command_line ~= "(?i)(-EncodedCommand|-enc\s|-ec\s)"
    | filter actor_effective_username not in ("admin_user1", "admin_user2", "sccm_service", "intune_service")
    | dedup agent_hostname, actor_effective_username, action_local_ip
    | filter true
    | fields _time, agent_hostname, actor_effective_username, action_local_ip, action_evtlog_event_data_LogonType, action_evtlog_event_id, action_process_image_command_line
  lucene: |
    (event.code:4688 OR EventID:4688) AND (process.command_line:(*-EncodedCommand* OR *-enc* OR *-ec*) OR CommandLine:(*-EncodedCommand* OR *-enc* OR *-ec*)) AND NOT (user.name:(admin* OR sccm* OR intune* OR *svc*) OR UserName:(admin* OR sccm* OR intune* OR *svc*))
  sumo: |
    _sourceCategory=*Windows*Security* "4688"
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as ip_address
    | json field=_raw "LogonType" as logon_type
    | json field=_raw "Computer" as host
    | where event_id = "4688"
    | where command_line matches "*powershell*" and (command_line matches "*-EncodedCommand*" or command_line matches "*-enc *" or command_line matches "*-ec *")
    | where !(user in ("admin_account1", "admin_account2", "sccm_svc", "intune_svc"))
    | dedup host, user, ip_address
    | fields _messageTime, host, user, ip_address, logon_type, event_id, command_line
false_positives:
- Legitimate admin scripts using encoded commands
- SCCM/Intune deployment scripts
tags:
- powershell
- encoding
- execution
author: TDL
created: '2024-01-15'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance within any time window of a Windows Security Event Log process creation event.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4688

  With process command line containing PowerShell encoded command indicators (e.g., -EncodedCommand, -enc, -ec flags)

  Where user, IpAddress, LogonType, and EventCode are captured for correlation

  Excluding known legitimate admin accounts and SCCM/Intune deployment service accounts present in the admin allow-list


  With the same user and IpAddress, deduplicated per host occurrence with a minimum threshold of 1 instance before alerting.'

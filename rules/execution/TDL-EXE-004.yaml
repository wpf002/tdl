rule_id: TDL-EXE-004
name: MSHTA Executing Remote HTA Application
tactic: Execution
tactic_id: TA0002
technique_id: T1218.005
technique_name: Mshta
platform:
- Windows
data_sources:
- Windows Security Event Log (4688)
- Sysmon Event ID 1
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 85
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=4688 (New_Process_Name="*\\mshta.exe" OR Process_Command_Line="*mshta.exe*")
    (Process_Command_Line="*http://*" OR Process_Command_Line="*https://*" OR Process_Command_Line="*\\\\\\\\*")

    | table _time, ComputerName, Account_Name, New_Process_Name, Process_Command_Line, Creator_Process_Name, IpAddress, Logon_Type

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1d)
    | where EventID == 4688
    | where Process has "mshta.exe" or CommandLine has "mshta.exe"
    | where CommandLine has_any ("http://", "https://", "\\\\")
    | project TimeGenerated, Computer, Account, Process, CommandLine, SubjectUserName, IpAddress, LogonType, EventID
  aql: |
    SELECT username, sourceip, "Process CommandLine", "New Process Name", eventtime, LOGSOURCENAME(logsourceid) AS hostname
    FROM events
    WHERE "EventID" = '4688'
      AND ("New Process Name" ILIKE '%mshta.exe%' OR "Process CommandLine" ILIKE '%mshta.exe%')
      AND ("Process CommandLine" ILIKE '%http://%' OR "Process CommandLine" ILIKE '%https://%' OR "Process CommandLine" ILIKE '%\\\\%')
    LAST 1 HOURS
  yara_l: "rule mshta_remote_hta_execution {\n  meta:\n    author = \"TDL\"\n    description = \"Detects mshta.exe executing remote HTA files\
    \ via HTTP/HTTPS or UNC paths - T1218.005\"\n    mitre_attack_tactic = \"Execution\"\n    mitre_attack_technique = \"T1218.005\"\n    severity\
    \ = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type = \"4688\"\n    (\n   \
    \   re.regex($e.target.process.file.full_path, `(?i)\\\\mshta\\.exe`) or\n      re.regex($e.target.process.command_line, `(?i)mshta\\.exe`)\n\
    \    )\n    (\n      re.regex($e.target.process.command_line, `(?i)https?://`) or\n      re.regex($e.target.process.command_line, `(?i)\\\\\
    \\\\[^\\\\]+\\\\`)\n    )\n    $e.principal.user.userid = $user\n    $e.principal.ip = $ip\n    $e.security_result.detection_fields[\"LogonType\"\
    ] = $logon_type\n    \n  match:\n    $user, $ip, $logon_type over 1m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n\
    }\n"
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.code == \"4688\" \n  AND (TO_LOWER(process.name)\
    \ LIKE \"*mshta.exe*\" OR TO_LOWER(process.command_line) LIKE \"*mshta.exe*\")\n  AND (process.command_line LIKE \"*http://*\" OR process.command_line\
    \ LIKE \"*https://*\" OR process.command_line LIKE \"*\\\\\\\\*\")\n| STATS event_count = COUNT(*) BY user.name, source.ip, winlog.logon.type,\
    \ event.code\n| WHERE event_count >= 1\n| KEEP user.name, source.ip, winlog.logon.type, event.code, event_count\n"
  leql: |
    where(source_json.EventID=4688 AND process_name ICONTAINS "mshta.exe" AND (process_cmd_line ICONTAINS "http://" OR process_cmd_line ICONTAINS "https://" OR process_cmd_line ICONTAINS "\\\\"))
  crowdstrike: |
    EventCode=4688 (NewProcessName=*mshta.exe OR CommandLine=*mshta.exe) (CommandLine=*http://* OR CommandLine=*https://* OR CommandLine=*\\\\*)
    | table([@timestamp, ComputerName, SubjectUserName, NewProcessName, CommandLine, IpAddress, LogonType, EventCode])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id = 4688\n| filter lowercase(action_process_image_name) contains \"mshta.exe\" or lowercase(action_process_image_command_line)\
    \ contains \"mshta.exe\"\n| filter action_process_image_command_line ~= \"(?i)(http://|https://|\\\\\\\\\\\\\\\\)\" \n| fields _time, agent_hostname,\
    \ actor_effective_username, action_process_image_name, action_process_image_command_line, action_evtlog_event_id\n"
  lucene: |
    event.code:4688 AND (NewProcessName:*mshta.exe OR CommandLine:*mshta.exe) AND (CommandLine:*http\://* OR CommandLine:*https\://* OR CommandLine:*\\\\*)
  sumo: |
    _sourceCategory=*Windows*Security* "4688" "mshta.exe"
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as new_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "IpAddress" as ip_address
    | json field=_raw "LogonType" as logon_type
    | where event_id = "4688"
    | where (new_process_name matches "*mshta.exe*" or command_line matches "*mshta.exe*")
    | where (command_line matches "*http://*" or command_line matches "*https://*" or command_line matches "*\\\\*")
    | fields _messageTime, _sourceHost, user, ip_address, logon_type, event_id, new_process_name, command_line
false_positives:
- Legacy enterprise applications using HTA
tags:
- mshta
- lolbin
- execution
author: TDL
created: '2024-01-16'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the executing process.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — pay attention to short-lived processes, encoded arguments,
  and unusual parents (Office, browser, services).
- Pull EDR process tree for the alert PID; check the parent / grandparent and any child processes spawned within 5 minutes.
- 'Compare against the host''s baseline: is the binary / interpreter normally invoked here, by this user, at this time?'
- 'Decide TP / FP: TP if the execution chain has no business justification; FP if it traces to a packaging script, software install, or scheduled
  job.'
- 'If TP: contain the host, kill the offending process, snapshot memory if possible, and escalate to IR with the process tree attached.'
pseudo_logic: '1 Instance within any window of a Windows Security Event Log process creation event.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 4688

  Where the new process name or command line contains mshta.exe

  With a remote HTA file reference (http://, https://, or UNC path) present in the command line arguments

  With the same user, IpAddress, LogonType, and EventCode'

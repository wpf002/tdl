rule_id: TDL-EXF-000071
v4_id: '000071'
name: DNS Tunneling - Outbound
description: Detects an outbound firewall session over port 53 with at least 10 MB out. This could be indicative of an exfiltration attempt over
  DNS.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1030
technique_name: Data Transfer Size Limits
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=windows (sourcetype=WinEventLog:Security OR sourcetype=firewall) ((EventCode=5156) OR (dest_port=53)) \n| eval bytes_out_mb=bytes_out/1024/1024\
    \ \n| where bytes_out_mb > 10 \n| stats count values(bytes_out_mb) as bytes_out_mb values(dest_port) as dest_port values(dest_ip) as dest_ip\
    \ by _time, ComputerName, src_ip, process_name \n| table _time, ComputerName, src_ip, dest_ip, dest_port, bytes_out_mb, process_name\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where destination_port in ("53")

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "destination_port" IN (''53'')

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exf_000071 {\n  meta:\n    author = \"TDL\"\n    description = \"DNS Tunneling - Outbound\"\n    severity = \"HIGH\"\n\
    \    tactic = \"TA0010\"\n    technique = \"T1030\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.destination_port\
    \ = /(53)/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND destination_port IN ("53")

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND destination_port IN [53])

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND destination_port IN (53)

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND destination_port in ("53")

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND destination_port:(53)

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where destination_port IN ("53")

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 DNS Request Event\nWhere the Bytes Out is greater than 10 MB\n\n----------------------------------------------------------------------------------\n\
  \n1 Firewall Event \nWhere the Destination Port is 53\nWhere the Bytes Out is greater than 10 MB"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

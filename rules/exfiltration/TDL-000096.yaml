rule_id: TDL-EXF-000096
v4_id: 000096
name: DLP Detection for Sensitive Data
description: A report that provides visibility into DLP alerts for sensitive data being transferred.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1048
technique_name: Exfiltration Over Alternative Protocol
platform:
- Windows
data_sources:
- DLP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=dlp sourcetype=dlp* \n| search policy IN (\"Sensitive Data Transfer\", \"PII Protection\", \"Confidential Documents\", \"Financial\
    \ Data\", \"Intellectual Property\", \"Customer Data\", \"HIPAA\", \"PCI-DSS\", \"Export Control\", \"Trade Secrets\")\n| table _time, user,\
    \ src, dest, policy, action, file_name, file_size, severity, dlp_rule\n"
  kql: |
    DLPEvents
    | where TimeGenerated > ago(24h)
    | where PolicyName in ("Confidential Data Transfer", "PII Protection", "Financial Data", "Intellectual Property", "Customer Data Protection", "HIPAA Data", "PCI DSS", "Export Control", "Trade Secrets")
    | project TimeGenerated, UserPrincipalName, PolicyName, PolicyMatchInfo, FileName, FileSize, Action, Severity, DestinationDomain, DestinationIP, Computer, DeviceName
  aql: |
    SELECT eventtime, username, sourceip, destinationip, "DLP Policy Name", "DLP Severity", "DLP Action", "DLP Rule Name", "File Name", QIDNAME(qid), CATEGORYNAME(category)
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%DLP%' OR CATEGORYNAME(category) ILIKE '%Data Loss%' OR QIDNAME(qid) ILIKE '%DLP%'
    LAST 24 HOURS
  yara_l: "rule dlp_exfiltration_t1048 {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects potential data exfiltration\
    \ via DLP policy violations - MITRE T1048\"\n    mitre_attack_tactic = \"Exfiltration\"\n    mitre_attack_technique = \"T1048\"\n    severity\
    \ = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.security_result.summary != \"\"\n    re.regex($e.security_result.summary,\
    \ `(?i)(DLP|Data Loss Prevention|Data Leakage)`)\n    $e.security_result.action = \"BLOCK\" or $e.security_result.action = \"ALLOW\"\n   \
    \ $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    \n  match:\n    $host, $user over 5m\n    \n  outcome:\n    $risk_score\
    \ = max(75)\n    \n  condition:\n    $e\n}\n"
  esql: "FROM logs-dlp* \n| WHERE @timestamp > NOW() - 24 hour \n  AND event.kind == \"alert\" \n  AND dlp.policy.name IN (\"Confidential Data\
    \ Transfer\", \"PII Exfiltration\", \"Sensitive File Upload\", \"Data Loss Prevention\", \"Critical Information Leak\")\n| KEEP @timestamp,\
    \ host.name, user.name, source.ip, destination.ip, destination.domain, dlp.policy.name, dlp.rule.name, file.name, file.path, event.action,\
    \ event.outcome\n"
  leql: |
    where(source_json.policy IN ["DLP_Policy_1", "DLP_Policy_2", "DLP_Policy_3"])
  crowdstrike: |
    #type=DLP event_simpleName=DlpDetection
    | table([@timestamp, ComputerName, UserName, PolicyName, FileName, FilePath, Action, Severity])
  xql: |
    dataset = cloud_audit_logs
    | filter action_type = "DLP_DETECTION"
    | filter policy_name in ("Sensitive Data Exfiltration", "PII Transfer", "Financial Data Loss", "Intellectual Property", "Regulated Data Movement")
    | fields _time, agent_hostname, actor_effective_username, policy_name, action_description, action_file_name, action_remote_ip, severity
  lucene: |
    event_type:"DLP Detection" AND dlp_policy:("Sensitive Data Transfer" OR "Confidential Document Upload" OR "PII Exfiltration" OR "Financial Data Loss" OR "Intellectual Property Transfer")
  sumo: |
    _sourceCategory=*DLP*
    | json field=_raw "EventType" as event_type
    | json field=_raw "Policy" as policy
    | json field=_raw "Action" as action
    | json field=_raw "User" as user
    | json field=_raw "Destination" as destination
    | json field=_raw "FileName" as file_name
    | where event_type matches "*Detection*" or event_type matches "*Violation*" or action matches "*Block*" or action matches "*Alert*"
    | where policy in ("Confidential Data Transfer", "PII Exfiltration", "Intellectual Property", "Financial Data", "Customer Data", "Sensitive Documents")
    | fields _messageTime, _sourceHost, user, policy, action, destination, file_name
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 DLP Detection Event

  Where Policy is in the list of DLP Policies to be Monitored'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — quantify the data volume vs the host's baseline outbound
  profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

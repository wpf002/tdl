rule_id: TDL-EXF-000157
v4_id: '000157'
name: Traffic to Unauthorized Online Storage Application
description: This rule is designed to identify the usage of unauthorized Online Storage applications to detect possible exfiltration attempts.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1567
technique_name: Exfiltration Over Web Service
platform:
- Windows
data_sources:
- Application Control
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=* sourcetype=*application_control* OR sourcetype=*appcontrol* OR sourcetype=*applocker* OR sourcetype=*firewall* \n(application_category=\"\
    Online Storage\" OR application_category=\"Cloud Storage\")\nNOT [| inputlookup authorized_online_storage_apps.csv | fields application]\n\
    | stats count by _time, src, dest, user, application, application_category, action\n| table _time, src, dest, user, application, application_category,\
    \ action, count\n"
  kql: |
    AppControlCodeIntegrityEvents
    | where TimeGenerated > ago(24h)
    | where ApplicationCategory in~ ("Online Storage", "Cloud Storage")
    | where Application !in~ ("OneDrive.exe", "Dropbox.exe", "Box.exe", "GoogleDrive.exe", "iCloudDrive.exe")
    | project TimeGenerated, DeviceName, Application, ApplicationCategory, FileName, FolderPath, SHA256, InitiatingProcessFileName, InitiatingProcessCommandLine, ActionType
  aql: |
    SELECT sourceip, destinationip, username, "Application Name", "Application Category", COUNT(*) AS event_count
    FROM events
    WHERE "Application Category" IN ('Online Storage', 'Cloud Storage')
      AND "Application Name" NOT IN ('Dropbox', 'OneDrive', 'Google Drive', 'Box')
    GROUP BY sourceip, destinationip, username, "Application Name", "Application Category"
    LAST 24 HOURS
  yara_l: |
    rule exfiltration_unauthorized_cloud_storage {
      meta:
        author = "TDL"
        description = "Detects usage of unauthorized online/cloud storage applications - MITRE T1567 Exfiltration to Cloud Storage"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1567"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        (
          $e.target.application = "Online Storage" or
          $e.target.application = "Cloud Storage"
        )
        not (
          $e.target.url = "onedrive.live.com" or
          $e.target.url = "sharepoint.com" or
          re.regex($e.target.url, `dropbox\.com`) or
          re.regex($e.target.url, `box\.com`) or
          re.regex($e.target.url, `drive\.google\.com`)
        )
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 5m

      outcome:
        $risk_score = 65
        $app = array_distinct($e.target.application)
        $url = array_distinct($e.target.url)

      condition:
        $e
    }
  esql: "FROM logs-endpoint.events.file*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.category == \"file\" \n  AND (process.name IS NOT\
    \ NULL OR file.name IS NOT NULL)\n  AND (\n    TO_LOWER(process.name) IN (\"dropbox.exe\", \"onedrive.exe\", \"googledrivesync.exe\", \"box.exe\"\
    , \"sync.exe\", \"mega.exe\", \"pcloud.exe\", \"tresorit.exe\", \"syncplicity.exe\", \"sharefile.exe\", \"egnyte.exe\", \"sugarsync.exe\"\
    , \"idrive.exe\", \"carbonite.exe\", \"backblaze.exe\", \"crashplan.exe\", \"jungle.exe\", \"acronis.exe\")\n    OR TO_LOWER(file.path) LIKE\
    \ \"*\\\\dropbox\\\\*\"\n    OR TO_LOWER(file.path) LIKE \"*\\\\onedrive\\\\*\"\n    OR TO_LOWER(file.path) LIKE \"*\\\\google drive\\\\*\"\
    \n    OR TO_LOWER(file.path) LIKE \"*\\\\box sync\\\\*\"\n    OR TO_LOWER(file.path) LIKE \"*\\\\mega\\\\*\"\n  )\n  AND NOT (\n    TO_LOWER(process.name)\
    \ IN (\"onedrive.exe\", \"googledrivesync.exe\", \"dropbox.exe\")\n    OR TO_LOWER(process.executable) LIKE \"*\\\\microsoft\\\\onedrive\\\
    \\*\"\n    OR TO_LOWER(process.executable) LIKE \"*\\\\google\\\\drive\\\\*\"\n  )\n| STATS event_count = COUNT(*) BY host.name, user.name,\
    \ process.name, process.executable, file.path\n| WHERE event_count >= 1\n| KEEP host.name, user.name, process.name, process.executable, file.path,\
    \ event_count\n"
  leql: |
    where(source_json.application_category IN ["Online Storage", "Cloud Storage"] AND NOT source_json.application IN ["OneDrive", "Google Drive", "Dropbox", "Box", "SharePoint"])
  crowdstrike: |
    #type=ApplicationControlEvent event_simpleName=ApplicationControlEvent
    | in(field=ApplicationCategory, values=["Online Storage", "Cloud Storage"])
    | !in(field=ApplicationName, values=["OneDrive", "Dropbox Business", "Box", "Google Drive", "SharePoint"])
    | table([@timestamp, ComputerName, UserName, ApplicationName, ApplicationCategory, FileName, FilePath])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_APPLICATION_CONTROL
    | filter action_app_id_category in ("Online Storage", "Cloud Storage")
    | filter action_app_id_name not in ("Dropbox Business", "Box", "Google Drive", "Microsoft OneDrive for Business", "SharePoint Online")
    | fields _time, agent_hostname, actor_effective_username, action_app_id_name, action_app_id_category, action_remote_ip, action_remote_port
  lucene: |
    _exists_:application.category AND application.category:("Online Storage" OR "Cloud Storage") AND NOT application.name:(Dropbox OR "Google Drive" OR OneDrive OR Box OR "Microsoft OneDrive" OR "SharePoint Online")
  sumo: |
    _sourceCategory=*Application*Control*
    | json field=_raw "ApplicationCategory" as app_category
    | json field=_raw "Application" as application
    | where app_category in ("Online Storage", "Cloud Storage")
    | where !(application in ("OneDrive", "Google Drive", "Dropbox", "Box", "SharePoint"))
    | fields _messageTime, _sourceHost, application, app_category
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Application Control Event

  Where the Application Category is in [Online Storage, Cloud Storage]

  Where the Application is NOT on the Authorized Online Storage Applications List'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — quantify the data volume vs the host's baseline
  outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

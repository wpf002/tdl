rule_id: TDL-EXF-000164
v4_id: '000164'
name: File Transfer to Threat Host
description: This rule is designed to detect a host communicating over common data transfer ports to a domain or IP found on a Threat Intelligence
  Feed.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 95
queries:
  spl: "index=firewall (direction=outbound OR action=allowed) \n(dest_port IN (20, 21, 22, 23, 69, 115, 989, 990) OR app IN (ftp, ssh, telnet,\
    \ tftp, sftp, ftps))\n| lookup threat_intel_list dest_ip OUTPUT is_threat\n| where is_threat=\"true\" OR is_threat=1\n| stats count values(dest_port)\
    \ as dest_ports values(app) as applications by src_ip, dest_ip, _time\n| table _time, src_ip, dest_ip, dest_ports, applications, count\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceDirection == "Outbound"
    | where DestinationIP !startswith "10." and DestinationIP !startswith "172.16." and DestinationIP !startswith "192.168."
    | where (DestinationPort in (20, 21, 22, 23, 69, 115, 989, 990) or ApplicationProtocol in~ ("ftp", "ssh", "telnet", "tftp", "sftp", "ftps"))
    | join kind=inner (
        ThreatIntelligenceIndicator
        | where isnotempty(NetworkIP) or isnotempty(NetworkDestinationIP) or isnotempty(NetworkSourceIP)
        | extend TI_IP = coalesce(NetworkIP, NetworkDestinationIP, NetworkSourceIP)
        | where isnotempty(TI_IP)
    ) on $left.DestinationIP == $right.TI_IP
    | project TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationIP, DestinationPort, ApplicationProtocol, ThreatType, IndicatorThreatType, Description, ThreatConfidence
  aql: |
    SELECT sourceip, destinationip, destinationport, QIDNAME(qid) AS event_name, LOGSOURCENAME(logsourceid) AS firewall, COUNT(*) AS event_count
    FROM events
    WHERE (destinationport IN (20, 21, 22, 23, 69, 115, 989, 990) OR QIDNAME(qid) ILIKE '%ftp%' OR QIDNAME(qid) ILIKE '%ssh%' OR QIDNAME(qid) ILIKE '%telnet%' OR QIDNAME(qid) ILIKE '%tftp%' OR QIDNAME(qid) ILIKE '%sftp%' OR QIDNAME(qid) ILIKE '%ftps%')
    AND INOFFENSE(destinationip)
    AND CATEGORYNAME(category) ILIKE '%firewall%'
    GROUP BY sourceip, destinationip, destinationport, QIDNAME(qid), LOGSOURCENAME(logsourceid)
    LAST 1 HOURS
  yara_l: "rule exfil_to_threat_intel_ip {\n  meta:\n    author = \"TDL\"\n    description = \"Detects outbound connections to threat intel listed\
    \ IPs on common file transfer ports/protocols\"\n    mitre_attack_tactic = \"Exfiltration\"\n    mitre_attack_technique = \"T1071\"\n    \n\
    \  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.direction = \"OUTBOUND\"\n    (\n      $e.target.port = 20\
    \ or\n      $e.target.port = 21 or\n      $e.target.port = 22 or\n      $e.target.port = 23 or\n      $e.target.port = 69 or\n      $e.target.port\
    \ = 115 or\n      $e.target.port = 989 or\n      $e.target.port = 990 or\n      re.regex($e.network.application_protocol, `(?i)(ftp|ssh|telnet|tftp|sftp|ftps)`)\n\
    \    )\n    $e.target.ip = $dest_ip\n    $e.principal.ip = $src_ip\n    \n  match:\n    $src_ip, $dest_ip over 5m\n    \n  outcome:\n    $risk_score\
    \ = 85\n    \n  condition:\n    $e and #e >= 1\n}\n"
  esql: |
    FROM logs-network.firewall*
    | WHERE network.direction == "outbound"
      AND source.ip RLIKE "^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)"
      AND NOT destination.ip RLIKE "^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)"
      AND (destination.port IN (20, 21, 22, 23, 69, 115, 989, 990) OR TO_LOWER(network.application) IN ("ftp", "ssh", "telnet", "tftp", "sftp", "ftps"))
    | ENRICH threat_intel_ip ON destination.ip
    | WHERE threat.indicator.ip IS NOT NULL
    | KEEP @timestamp, source.ip, destination.ip, destination.port, network.application, network.bytes, threat.indicator.type, threat.indicator.provider
  leql: |
    where(direction=OUTBOUND AND destination_address_on_threat_list=true AND (destination_port IN [20, 21, 22, 23, 69, 115, 989, 990] OR application IN [ftp, ssh, telnet, tftp, sftp, ftps]))
  crowdstrike: |
    #type=firewall (direction=outbound OR direction=egress OR traffic_direction=outbound)
    (DestinationPort in [20, 21, 22, 23, 69, 115, 989, 990] OR Application in [ftp, ssh, telnet, tftp, sftp, ftps])
    (threat_intel=true OR ioc_type=* OR threat_category=* OR DestinationIP in file("threat_intel_ips.csv"))
    | table([@timestamp, SourceIP, DestinationIP, DestinationPort, Application, ComputerName, threat_category])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_source_translated_ip != null and action_destination_translated_ip != null
    | filter direction = ENUM.DIRECTION_OUTBOUND
    | filter (action_destination_port in (20, 21, 22, 23, 69, 115, 989, 990) or lowercase(app) in ("ftp", "ssh", "telnet", "tftp", "sftp", "ftps"))
    | filter action_destination_ip_is_in_threat_intel = true
    | fields _time, action_source_ip, action_destination_ip, action_destination_port, app, action_total_upload, action_total_download, agent_hostname
  lucene: |
    (event.type:firewall OR event.category:network) AND (network.direction:outbound OR source.ip:[10.0.0.0 TO 10.255.255.255] OR source.ip:[172.16.0.0 TO 172.31.255.255] OR source.ip:[192.168.0.0 TO 192.168.255.255]) AND NOT (destination.ip:[10.0.0.0 TO 10.255.255.255] OR destination.ip:[172.16.0.0 TO 172.31.255.255] OR destination.ip:[192.168.0.0 TO 192.168.255.255]) AND (destination.port:(20 OR 21 OR 22 OR 23 OR 69 OR 115 OR 989 OR 990) OR network.application:(ftp OR ssh OR telnet OR tftp OR sftp OR ftps)) AND threat.indicator.ip:*
  sumo: |
    _sourceCategory=*Firewall*
    | where direction="outbound" OR traffic_direction="outbound" OR action matches "*outbound*"
    | where (dest_port in (20, 21, 22, 23, 69, 115, 989, 990) OR application in ("ftp", "ssh", "telnet", "tftp", "sftp", "ftps"))
    | where threat_match="true" OR is_threat="true" OR threat_list_match="true"
    | fields _messageTime, src_ip, dest_ip, dest_port, application, threat_list_match, _sourceHost
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Firewall Event\nFrom one internal source to one external destination (Outbound)\nOR\n\tWhere the Destination Port is in [20,\
  \ 21, 22, 23, 69, 115, 989, 990]\n\tWhere the Application is in [ftp, ssh, telnet, tftp, sftp, ftps]\n\t\nWhere the Destination IP is on a Threat\
  \ Intelligence List"
suppression:
  window: 4 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

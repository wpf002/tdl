rule_id: TDL-EXF-000253
v4_id: '000253'
name: Potential Data Exfiltration to Rare Geolocation
description: Detects a host communicating to an external host found on the rare geolocation list over common data transfer port with at least
  5 MB out.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=firewall \n| eval bytes_out_mb = bytes_out / 1048576 \n| where bytes_out_mb > 5 \n    AND NOT (dest_country IN (\"US\", \"CA\",\
    \ \"GB\", \"DE\", \"FR\", \"AU\", \"NZ\", \"JP\", \"SG\")) \n    AND isnotnull(dest_country) \n| table _time, src_ip, dest_ip, dest_country,\
    \ bytes_out_mb, action, app, dest_port\n"
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceVendor has "firewall" or DeviceProduct has "firewall" or DeviceEventClassID has "firewall"
    | extend BytesOut = coalesce(SentBytes, BytesSent, tolong(0))
    | extend DestinationCountry = coalesce(DestinationGeoCountry, AdditionalExtensions)
    | where BytesOut > 5242880
    | where isnotempty(DestinationCountry)
    | where DestinationCountry !in ("United States", "Canada", "United Kingdom", "Germany", "France")
    | project TimeGenerated, SourceIP, DestinationIP, DestinationCountry, BytesOut, DeviceAction, ApplicationProtocol, DestinationPort, DeviceVendor, DeviceProduct
  aql: |
    SELECT sourceip, destinationip, "Destination Country", SUM(BytesOut) AS total_bytes_out, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%firewall%'
      AND "Destination Country" IS NOT NULL
      AND "Destination Country" NOT IN ('US', 'CA', 'GB', 'AU', 'DE', 'FR', 'NL', 'SE', 'NO', 'DK', 'FI', 'IE', 'NZ', 'CH', 'AT', 'BE', 'LU', 'IT', 'ES', 'PT', 'JP', 'KR', 'SG')
      AND BytesOut > 5242880
    GROUP BY sourceip, destinationip, "Destination Country"
    LAST 1 HOURS
  yara_l: |
    rule exfiltration_to_unauthorized_country {
      meta:
        author = "Chronicle Detection"
        description = "Detects network traffic over 5MB to unauthorized countries"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1071"
        severity = "High"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.metadata.product_log_id = "FIREWALL"
        not net.ip_in_range_cidr($e.target.ip, "10.0.0.0/8")
        not net.ip_in_range_cidr($e.target.ip, "172.16.0.0/12")
        not net.ip_in_range_cidr($e.target.ip, "192.168.0.0/16")
        $e.network.sent_bytes > 5242880
        $e.principal.location.country_or_region != ""
        $e.target.location.country_or_region != ""
        $e.target.location.country_or_region != "US"
        $e.target.location.country_or_region != "United States"
        $e.principal.hostname = $host
        $e.target.ip = $dest_ip
        $e.target.location.country_or_region = $country

      match:
        $host over 1h

      outcome:
        $risk_score = 75
        $bytes_out = max($e.network.sent_bytes)
        $destination_country = $country
        $destination_ip = $dest_ip

      condition:
        $e
    }
  esql: |
    FROM logs-network.firewall*
    | WHERE @timestamp > NOW() - 24 hour
      AND destination.geo.country_name NOT IN ("United States", "Canada", "United Kingdom", "Germany", "France")
      AND destination.bytes > 5242880
    | STATS total_bytes = SUM(destination.bytes), connections = COUNT(*) BY source.ip, destination.ip, destination.geo.country_name, destination.port
    | KEEP source.ip, destination.ip, destination.geo.country_name, destination.port, total_bytes, connections
  leql: |
    where(destination_country NOT IN ["US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG", "IE", "NL", "SE", "NO", "DK", "FI", "CH", "AT", "BE", "ES", "IT"] AND bytes_out > 5242880)
  crowdstrike: |
    #type=firewall bytes_out>5242880
    | !in(field=destination_country, values=["US", "CA", "GB", "DE", "FR", "AU", "JP"])
    | table([@timestamp, source_ip, destination_ip, destination_country, bytes_out, protocol, destination_port])
  xql: "dataset = panw_ngfw_traffic_raw\n| filter dest_country != null \n  and dest_country not in (\"US\", \"CA\", \"GB\", \"DE\", \"FR\", \"\
    AU\", \"JP\", \"NZ\", \"IT\", \"ES\", \"NL\", \"SE\", \"NO\", \"DK\", \"FI\", \"IE\", \"CH\", \"AT\", \"BE\", \"SG\", \"KR\", \"IL\")\n  and\
    \ bytes_out > 5242880\n| fields _time, src_ip, dest_ip, dest_country, dest_port, bytes_out, app, action, source_host\n"
  lucene: |
    event.type:firewall AND bytes_out:[5242880 TO *] AND NOT destination.geo.country_iso_code:(US OR CA OR GB OR DE OR FR) AND _exists_:destination.geo.country_iso_code
  sumo: |
    _sourceCategory=*Firewall* OR _sourceCategory=*firewall*
    | parse regex "(?<bytes_out>\d+)" nodrop
    | parse regex "(?<dest_country>[A-Z]{2})" nodrop
    | json field=_raw "destination_country" as dest_country nodrop
    | json field=_raw "bytes_out" as bytes_out nodrop
    | json field=_raw "destination.geo.country_iso_code" as dest_country nodrop
    | json field=_raw "bytes_sent" as bytes_out nodrop
    | where !(dest_country in ("US", "CA", "GB", "AU", "DE", "FR", "JP"))
    | where (tolong(bytes_out) > 5242880)
    | fields _messageTime, _sourceHost, dest_country, bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Firewall Event

  Where the Destination Country is NOT on the Authorized Contries List

  Where the Destination Country is NOT on the Geo Location Tracker

  Where the Bytes Out is greater than 5 MB'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

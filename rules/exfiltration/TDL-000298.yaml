rule_id: TDL-EXF-000298
v4_id: 000298
name: Google Drive Ownership Transferred via Google Workspace
description: Detects when Google Drive/Google Docs files are transferred to another user by the administrator. This service can also be abused
  by adversaries to transfer files to an adversary account for potential exfiltration.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1537
technique_name: Transfer Data to Cloud Account
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=gsuite:drive events.name="CREATE_DATA_TRANSFER_REQUEST" APPLICATION_NAME="*drive*"

    | table _time, actor.email, events.name, APPLICATION_NAME, id_application_name, events.parameters{}.value

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(24h)
    | where RecordType == "drive"
    | where EventName == "CREATE_DATA_TRANSFER_REQUEST"
    | project TimeGenerated, ActorIpAddress, ActorEmail = UserId, EventName, RecordType, ActivityDetails
  aql: |
    SELECT eventtime, username, sourceip, destinationip, "Application Name", "Event Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Event Name" = 'CREATE_DATA_TRANSFER_REQUEST'
      AND "Application Name" ILIKE '%drive%'
    LAST 24 HOURS
  yara_l: |
    rule google_workspace_data_transfer_request {
      meta:
        author = "TDL"
        description = "Detects Google Workspace data transfer requests for Drive - T1537 Exfiltration"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1537"
        platform = "Google Workspace"

      events:
        $e.metadata.product_name = "Google Workspace"
        $e.metadata.product_event_type = "CREATE_DATA_TRANSFER_REQUEST"
        re.regex($e.target.resource.name, `(?i)drive`)
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action == "CREATE_DATA_TRANSFER_REQUEST" AND event.provider LIKE "*drive*"
    | KEEP @timestamp, user.email, event.action, event.provider, source.ip, google_workspace.admin.application.name
  leql: |
    where(source_json.events.name="CREATE_DATA_TRANSFER_REQUEST" AND source_json.APPLICATION_NAME ICONTAINS "drive")
  crowdstrike: |
    #type=gsuite events.name=CREATE_DATA_TRANSFER_REQUEST APPLICATION_NAME=*drive*
    | table([@timestamp, user_email, events.name, APPLICATION_NAME, id.applicationName, ipAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud.provider = GCP and cloud.resource_type = "Google Workspace"
    | filter action_name = "CREATE_DATA_TRANSFER_REQUEST"
    | filter lowercase(action_resource) contains "drive"
    | fields _time, actor_user, action_name, action_resource, cloud.project
  lucene: |
    events.name:"CREATE_DATA_TRANSFER_REQUEST" AND APPLICATION_NAME:*drive*
  sumo: |
    _sourceCategory=*Google*Workspace* "CREATE_DATA_TRANSFER_REQUEST"
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_names
    | json field=_raw "events[*].parameters[*].value" as param_values
    | where event_name = "CREATE_DATA_TRANSFER_REQUEST"
    | where param_names contains "APPLICATION_NAME" and param_values matches "*drive*"
    | fields _messageTime, _sourceHost, event_name, param_names, param_values
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is CREATE_DATA_TRANSFER_REQUEST"

  AND the APPLICATION_NAME contains "drive"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — quantify the data volume vs the host's baseline
  outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

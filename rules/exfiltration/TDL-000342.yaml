rule_id: TDL-EXF-000342
v4_id: '000342'
name: AWS DNS Exfiltration Attempt - GuardDuty
description: Detects when an EC2 instance is running malware that uses DNS queries for outbound data transfers. This type of data transfer is
  indicative of a compromised instance and could result in the exfiltration of data.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1048
technique_name: Exfiltration Over Alternative Protocol
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty finding.type=\"Trojan:EC2/DNSDataExfiltration\" \n| table _time, finding.type, resource.instanceDetails.instanceId,\
    \ resource.instanceDetails.networkInterfaces{}.privateIpAddress, severity, region, accountId, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where ActivityType == "Trojan:EC2/DNSDataExfiltration"
    | project TimeGenerated, AwsAccountId, Region, Title, Description, Severity, ResourceType, ResourceId = InstanceId, FindingId, Type = ActivityType
  aql: |
    SELECT sourceip, destinationip, qidname(qid) AS event_name, LOGSOURCENAME(logsourceid) AS log_source, "Event Type" AS event_type, COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" = 'Trojan:EC2/DNSDataExfiltration'
    GROUP BY sourceip, destinationip, qid, logsourceid, "Event Type"
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_dns_data_exfiltration {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for DNS Data Exfiltration (T1048)"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1048"
        platform = "AWS"
        data_source = "AWS GuardDuty"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "Trojan:EC2/DNSDataExfiltration"
        $e.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $e
    }
  esql: |
    FROM .ds-logs-aws.guardduty-*
    | WHERE event.type == "Trojan:EC2/DNSDataExfiltration"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, source.ip, destination.ip, dns.question.name, event.id
  leql: |
    where(source_json.type="Trojan:EC2/DNSDataExfiltration")
  crowdstrike: |
    #type=guardduty finding.type="Trojan:EC2/DNSDataExfiltration"
    | table([@timestamp, account.id, region, resource.instanceDetails.instanceId, finding.type, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and raw_log_type = "guardduty"
    | filter json_extract_scalar(event_data, "$.detail.type") in ("Trojan:EC2/DNSDataExfiltration")
    | fields _time, cloud_provider, cloud_provider_account, json_extract_scalar(event_data, "$.detail.type") as finding_type, json_extract_scalar(event_data, "$.detail.severity") as severity, json_extract_scalar(event_data, "$.detail.resource.instanceDetails.instanceId") as instance_id, json_extract_scalar(event_data, "$.detail.description") as description
  lucene: |
    event.type:"Trojan:EC2/DNSDataExfiltration"
  sumo: |
    _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type = "Trojan:EC2/DNSDataExfiltration"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Trojan:EC2/DNSDataExfiltration\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

rule_id: TDL-EXF-000382
v4_id: 000382
name: AWS Suspicious DNS Traffic - GuardDuty
description: Detects an ec2 instance performing outbound DNS traffic anomalies.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1048
technique_name: Exfiltration Over Alternative Protocol
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:guardduty type IN ("DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity")

    | table _time, type, id, severity, region, resource.instanceDetails.instanceId, resource.instanceDetails.privateIpAddress, service.action.dnsRequestAction.domain,
    description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title in ("DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(tostring(Resource)).InstanceDetails.InstanceId), InstanceType = tostring(parse_json(tostring(Resource)).InstanceDetails.InstanceType)
  aql: "SELECT eventtime, sourceip, destinationip, username, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid), \"finding.type\"\
    \ AS finding_type, \"resource.instanceDetails.instanceId\" AS instance_id\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'\n\
    \  AND (\"finding.type\" = 'DefenseEvasion:EC2/UnusualDNSResolver' \n       OR \"finding.type\" = 'DefenseEvasion:EC2/UnusualDoHActivity'\
    \ \n       OR \"finding.type\" = 'DefenseEvasion:EC2/UnusualDoTActivity')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_unusual_dns_exfiltration {
      meta:
        author = "TDL"
        description = "Detects GuardDuty findings for unusual DNS resolver or DoH/DoT activity indicating potential exfiltration"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1048"
        severity = "High"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "DefenseEvasion:EC2/UnusualDNSResolver" or
          $e.metadata.product_event_type = "DefenseEvasion:EC2/UnusualDoHActivity" or
          $e.metadata.product_event_type = "DefenseEvasion:EC2/UnusualDoTActivity"
        )
        $e.principal.resource.name = $instance_id

      match:
        $instance_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, source.ip, event.type, event.action, message
  leql: |
    where(source_json.type IN ["DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity"])
  crowdstrike: |
    #repo=guardduty event.type IN ["DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity"]
    | table([@timestamp, event.type, resource.instanceDetails.instanceId, service.action.dnsRequestAction.domain, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logtype_name = "GuardDuty"
    | filter event_type in ("DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity")
    | fields _time, event_type, cloud_provider_account_id, cloud_provider_region, resource_name, actor_effective_username, event_id, event_description
  lucene: |
    eventName:"GuardDuty Finding" AND type:("DefenseEvasion:EC2/UnusualDNSResolver" OR "DefenseEvasion:EC2/UnusualDoHActivity" OR "DefenseEvasion:EC2/UnusualDoTActivity")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as finding_type
    | where finding_type in ("DefenseEvasion:EC2/UnusualDNSResolver", "DefenseEvasion:EC2/UnusualDoHActivity", "DefenseEvasion:EC2/UnusualDoTActivity")
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"DefenseEvasion:EC2/UnusualDNSResolver\", \"DefenseEvasion:EC2/UnusualDoHActivity\"\
  , \"DefenseEvasion:EC2/UnusualDoTActivity\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

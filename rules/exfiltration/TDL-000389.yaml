rule_id: TDL-EXF-000389
v4_id: 000389
name: Possible Azure Disk Exfiltration
description: Detects when a Shared Access Signature (SAS) URL is generated for a managed disk allowing for exfiltration. This will allow for anyone
  with the URI to download the disk without any IP filtering before the expiration time.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1567
technique_name: Exfiltration Over Web Service
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:monitor:aad EventName="MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION" Action="Success"

    | table _time, user, resourceId, resourceGroup, subscriptionId, properties.statusCode, callerIpAddress

    '
  kql: |
    AzureActivity
    | where TimeGenerated > ago(1h)
    | where OperationNameValue =~ "MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION"
    | where ActivityStatusValue =~ "Success"
    | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ActivityStatusValue, ResourceGroup, SubscriptionId, Resource, ResourceId
  aql: |
    SELECT username, sourceip, eventtime, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE QIDNAME(qid) ILIKE '%MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION%'
      AND CATEGORYNAME(category) = 'Success'
    LAST 24 HOURS
  yara_l: "rule azure_disk_export_exfiltration {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Azure disk export\
    \ operations that could indicate exfiltration via T1567\"\n    mitre_attack_tactic = \"Exfiltration\"\n    mitre_attack_technique = \"T1567\"\
    \n    severity = \"Medium\"\n\n  events:\n    $e.metadata.product_name = \"Azure\"\n    $e.metadata.product_event_type = \"MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION\"\
    \n    $e.security_result.action = \"ALLOW\"\n    $e.security_result.summary = \"Success\"\n    $e.principal.user.userid = $user\n    \n  match:\n\
    \    $user over 5m\n\n  condition:\n    $e\n}\n"
  esql: "FROM logs-azure.activitylogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND azure.activitylogs.operation_name == \"MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION\"\
    \n  AND event.outcome == \"success\"\n| KEEP @timestamp, azure.activitylogs.operation_name, event.outcome, azure.resource.id, azure.resource.name,\
    \ user.name, source.ip, azure.subscription.id\n"
  leql: |
    where(source_json.operationName="MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION" AND source_json.status="Success")
  crowdstrike: |
    #repo=azure event.outcome=success event.action="Microsoft.Compute/disks/beginGetAccess/action"
    | table([@timestamp, azure.subscription_id, azure.resource.group, azure.resource.name, user.name, source.ip])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"Azure\" \n  and operation_name = \"MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION\"\
    \n  and operation_status = \"Success\"\n| fields _time, identity_name, resource_name, operation_name, operation_status, cloud_provider, project\n"
  lucene: |
    azure.activitylogs.operation_name:"MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION" AND azure.activitylogs.status.value:"Success"
  sumo: |
    _sourceCategory=*Azure* "MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION"
    | json field=_raw "operationName" as operation_name
    | json field=_raw "status.value" as status
    | where operation_name = "MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION" and status = "Success"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Activity Event

  Where the Event Name is in [MICROSOFT.COMPUTE/DISKS/BEGINGETACCESS/ACTION]

  Where Action is ["Success"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

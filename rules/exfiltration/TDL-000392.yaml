rule_id: TDL-EXF-000392
v4_id: 000392
name: AWS Request to Malicious IP - GuardDuty
description: Detects the AWS environment querying an IP associated with a known command and control (C&C) server.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty (finding.type="Backdoor:EC2/C&CActivity.B" OR finding.type="Backdoor:Lambda/C&CActivity.B"
    OR finding.type="Backdoor:Runtime/C&CActivity.B" OR finding.type="Trojan:Lambda/DropPoint" OR finding.type="UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom"
    OR finding.type="Trojan:Runtime/DropPoint")

    | table _time, finding.type, finding.severity, resource.instanceDetails.instanceId, resource.resourceType, finding.description, accountId,
    region

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint")
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, SourceIpAddress, DestinationIpAddress
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, qidname(qid) AS event_name, "eventType" AS guardduty_finding_type, "resource.instanceDetails.instanceId" AS instance_id, "resource.lambdaDetails.functionName" AS function_name, "service.action.networkConnectionAction.remoteIpDetails.ipAddressV4" AS remote_ip, "severity" AS severity
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "eventType" IN ('Backdoor:EC2/C&CActivity.B', 'Backdoor:Lambda/C&CActivity.B', 'Backdoor:Runtime/C&CActivity.B', 'Trojan:Lambda/DropPoint', 'UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom', 'Trojan:Runtime/DropPoint')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_exfiltration_indicators {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings indicating potential C&C activity or exfiltration"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1071"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Backdoor:EC2/C&CActivity.B" or
          $e.metadata.product_event_type = "Backdoor:Lambda/C&CActivity.B" or
          $e.metadata.product_event_type = "Backdoor:Runtime/C&CActivity.B" or
          $e.metadata.product_event_type = "Trojan:Lambda/DropPoint" or
          $e.metadata.product_event_type = "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom" or
          $e.metadata.product_event_type = "Trojan:Runtime/DropPoint"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      outcome:
        $risk_score = max(75)

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, event.severity, aws.guardduty.resource.resource_type, source.ip, destination.ip, event.id
  leql: |
    where(source_json.type IN ["Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint"])
  crowdstrike: |
    #type=guardduty event.type IN ["Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint"]
    | table([@timestamp, event.type, resource.instanceDetails.instanceId, resource.lambdaDetails.functionName, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and log_type = "GuardDuty"
    | filter cloud_provider_event_name in ("Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint")
    | fields _time, cloud_provider, cloud_provider_event_name, resource_name, resource_type, identity_name, source_ipaddress, cloud_provider_event_id
  lucene: |
    event.type:"aws:guardduty:finding" AND finding.type:("Backdoor:EC2/C&CActivity.B" OR "Backdoor:Lambda/C&CActivity.B" OR "Backdoor:Runtime/C&CActivity.B" OR "Trojan:Lambda/DropPoint" OR "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom" OR "Trojan:Runtime/DropPoint")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as finding_type
    | where finding_type in ("Backdoor:EC2/C&CActivity.B", "Backdoor:Lambda/C&CActivity.B", "Backdoor:Runtime/C&CActivity.B", "Trojan:Lambda/DropPoint", "UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom", "Trojan:Runtime/DropPoint")
    | fields _messageTime, finding_type, _sourceHost, _raw
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Backdoor:EC2/C&CActivity.B\", \"Backdoor:Lambda/C&CActivity.B\", \"Backdoor:Runtime/C&CActivity.B\"\
  , \"Trojan:Lambda/DropPoint\", \"UnauthorizedAccess:Lambda/MaliciousIPCaller.Custom\",\"Trojan:Runtime/DropPoint\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — quantify the data volume vs the host's baseline
  outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

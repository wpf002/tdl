rule_id: TDL-EXF-000481
v4_id: 000481
name: First Seen Allowed Inbound FTP Traffic
description: A rule that detects allowed inbound FTP traffic from an IP that hasn’t been seen in the last 90 days
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: |
    index=firewall earliest=-90d latest=now
    (action=allowed direction=inbound (dest_port IN ("20", "21", "69") OR app="*ftp*"))
    | eval src_ip=if(src_ip LIKE "10.%*" OR src_ip LIKE "172.16.%*" OR src_ip LIKE "172.17.%*" OR src_ip LIKE "172.18.%*" OR src_ip LIKE "172.19.%*" OR src_ip LIKE "172.20.%*" OR src_ip LIKE "172.21.%*" OR src_ip LIKE "172.22.%*" OR src_ip LIKE "172.23.%*" OR src_ip LIKE "172.24.%*" OR src_ip LIKE "172.25.%*" OR src_ip LIKE "172.26.%*" OR src_ip LIKE "172.27.%*" OR src_ip LIKE "172.28.%*" OR src_ip LIKE "172.29.%*" OR src_ip LIKE "172.30.%*" OR src_ip LIKE "172.31.%*" OR src_ip LIKE "192.168.%*", null(), src_ip)
    | eval dest_ip=if(dest_ip LIKE "10.%*" OR dest_ip LIKE "172.16.%*" OR dest_ip LIKE "172.17.%*" OR dest_ip LIKE "172.18.%*" OR dest_ip LIKE "172.19.%*" OR dest_ip LIKE "172.20.%*" OR dest_ip LIKE "172.21.%*" OR dest_ip LIKE "172.22.%*" OR dest_ip LIKE "172.23.%*" OR dest_ip LIKE "172.24.%*" OR dest_ip LIKE "172.25.%*" OR dest_ip LIKE "172.26.%*" OR dest_ip LIKE "172.27.%*" OR dest_ip LIKE "172.28.%*" OR dest_ip LIKE "172.29.%*" OR dest_ip LIKE "172.30.%*" OR dest_ip LIKE "172.31.%*" OR dest_ip LIKE "192.168.%*", dest_ip, null())
    | where isnotnull(src_ip) AND isnotnull(dest_ip)
    | eval baseline_period=if(_time < relative_time(now(), "-30d"), 1, 0)
    | eval detection_period=if(_time >= relative_time(now(), "-30d"), 1, 0)
    | eventstats dc(src_ip) as baseline_sources by dest_ip, baseline_period
    | eventstats values(src_ip) as baseline_src_list by dest_ip, baseline_period
    | where detection_period=1
    | eval is_new=if(NOT mvfind(baseline_src_list, "^".src_ip."$")>=0, 1, 0)
    | where is_new=1
    | table _time, src_ip, dest_ip, dest_port, app, action
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where application matches regex "ftp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "application" LIKE ''%ftp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exf_000481 {\n  meta:\n    author = \"TDL\"\n    description = \"First Seen Allowed Inbound FTP Traffic\"\n    severity\
    \ = \"LOW\"\n    tactic = \"TA0010\"\n    technique = \"T1071\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.application\
    \ = /ftp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND application LIKE "%ftp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND application=/ftp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND application=*ftp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND application ~= "ftp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND application:*ftp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where application matches "*ftp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Firewall Event \nFrom one external source to one internal destination (Inbound)\nWhere the Action is Allowed\nOR\n    Where the\
  \ Destination Port IN (\"20\", \"21\", \"69\")\n\n    Where the Application contains \"ftp\"\n\nBaseline Learning: 30 Days\nRetention: 90 Days\n\
  \nNew Value: Source IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

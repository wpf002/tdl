rule_id: TDL-EXF-000481
v4_id: 000481
name: First Seen Allowed Inbound FTP Traffic
description: A rule that detects allowed inbound FTP traffic from an IP that hasn’t been seen in the last 90 days
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=firewall earliest=-90d latest=now

    (action=allowed direction=inbound (dest_port IN ("20", "21", "69") OR app="*ftp*"))

    | eval src_ip=if(src_ip LIKE "10.%*" OR src_ip LIKE "172.16.%*" OR src_ip LIKE "172.17.%*" OR src_ip LIKE "172.18.%*" OR src_ip LIKE "172.19.%*"
    OR src_ip LIKE "172.20.%*" OR src_ip LIKE "172.21.%*" OR src_ip LIKE "172.22.%*" OR src_ip LIKE "172.23.%*" OR src_ip LIKE "172.24.%*" OR
    src_ip LIKE "172.25.%*" OR src_ip LIKE "172.26.%*" OR src_ip LIKE "172.27.%*" OR src_ip LIKE "172.28.%*" OR src_ip LIKE "172.29.%*" OR src_ip
    LIKE "172.30.%*" OR src_ip LIKE "172.31.%*" OR src_ip LIKE "192.168.%*", null(), src_ip)

    | eval dest_ip=if(dest_ip LIKE "10.%*" OR dest_ip LIKE "172.16.%*" OR dest_ip LIKE "172.17.%*" OR dest_ip LIKE "172.18.%*" OR dest_ip LIKE
    "172.19.%*" OR dest_ip LIKE "172.20.%*" OR dest_ip LIKE "172.21.%*" OR dest_ip LIKE "172.22.%*" OR dest_ip LIKE "172.23.%*" OR dest_ip LIKE
    "172.24.%*" OR dest_ip LIKE "172.25.%*" OR dest_ip LIKE "172.26.%*" OR dest_ip LIKE "172.27.%*" OR dest_ip LIKE "172.28.%*" OR dest_ip LIKE
    "172.29.%*" OR dest_ip LIKE "172.30.%*" OR dest_ip LIKE "172.31.%*" OR dest_ip LIKE "192.168.%*", dest_ip, null())

    | where isnotnull(src_ip) AND isnotnull(dest_ip)

    | eval baseline_period=if(_time < relative_time(now(), "-30d"), 1, 0)

    | eval detection_period=if(_time >= relative_time(now(), "-30d"), 1, 0)

    | eventstats dc(src_ip) as baseline_sources by dest_ip, baseline_period

    | eventstats values(src_ip) as baseline_src_list by dest_ip, baseline_period

    | where detection_period=1

    | eval is_new=if(NOT mvfind(baseline_src_list, "^".src_ip."$")>=0, 1, 0)

    | where is_new=1

    | table _time, src_ip, dest_ip, dest_port, app, action

    '
  kql: "let baseline_period = 90d;\nlet baseline_learning = 30d;\nlet detection_period = 1d;\nlet known_sources = \n    CommonSecurityLog\n  \
    \  | where TimeGenerated between (ago(baseline_period) .. ago(baseline_learning))\n    | where DeviceDirection == \"Inbound\"\n    | where\
    \ DeviceAction in (\"Allow\", \"Allowed\", \"accept\")\n    | where DestinationPort in (\"20\", \"21\", \"69\") or ApplicationProtocol contains\
    \ \"ftp\"\n    | where isnotempty(SourceIP) and isnotempty(DestinationIP)\n    | where ipv4_is_private(DestinationIP) and not(ipv4_is_private(SourceIP))\n\
    \    | distinct SourceIP;\nCommonSecurityLog\n| where TimeGenerated > ago(detection_period)\n| where DeviceDirection == \"Inbound\"\n| where\
    \ DeviceAction in (\"Allow\", \"Allowed\", \"accept\")\n| where DestinationPort in (\"20\", \"21\", \"69\") or ApplicationProtocol contains\
    \ \"ftp\"\n| where isnotempty(SourceIP) and isnotempty(DestinationIP)\n| where ipv4_is_private(DestinationIP) and not(ipv4_is_private(SourceIP))\n\
    | where SourceIP !in (known_sources)\n| project TimeGenerated, SourceIP, DestinationIP, DestinationPort, ApplicationProtocol, DeviceAction,\
    \ DeviceVendor, DeviceProduct, Message\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, application, COUNT(*) AS event_count
    FROM events
    WHERE direction = 'Inbound'
      AND (action = 'Allowed' OR action = 'Allow' OR action = 'Permit')
      AND (destinationport IN ('20', '21', '69') OR application ILIKE '%ftp%')
      AND sourceip NOT IN (SELECT DISTINCT sourceip FROM events WHERE direction = 'Inbound' AND (action = 'Allowed' OR action = 'Allow' OR action = 'Permit') AND (destinationport IN ('20', '21', '69') OR application ILIKE '%ftp%') START DATEADD(CURRENT_TIMESTAMP, -90, 'day') STOP DATEADD(CURRENT_TIMESTAMP, -30, 'day'))
    GROUP BY sourceip, destinationip, destinationport, application
    LAST 30 DAYS
  yara_l: "rule exfil_ftp_inbound_new_source {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects inbound FTP connections\
    \ from new external source IPs - MITRE T1071 Exfiltration\"\n    mitre_attack_tactic = \"Exfiltration\"\n    mitre_attack_technique = \"T1071\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.direction = \"INBOUND\"\n\
    \    $e.security_result.action = \"ALLOW\"\n    (\n      $e.target.port = \"20\" or\n      $e.target.port = \"21\" or\n      $e.target.port\
    \ = \"69\" or\n      re.regex($e.network.application_protocol, `(?i)ftp`)\n    )\n    $e.principal.ip = $source_ip\n    $e.target.ip = $dest_ip\n\
    \    \n  match:\n    $source_ip, $dest_ip over 1h\n    \n  outcome:\n    $risk_score = 50\n    $first_seen_source = array_distinct($source_ip)\n\
    \    \n  condition:\n    $e and #source_ip == 1\n}\n"
  esql: "FROM logs-network.firewall*\n| WHERE @timestamp > NOW() - 90 days\n  AND network.direction == \"inbound\"\n  AND event.action == \"allowed\"\
    \n  AND (destination.port IN (\"20\", \"21\", \"69\") OR network.application LIKE \"*ftp*\")\n| EVAL is_baseline = CASE(@timestamp <= NOW()\
    \ - 30 days, 1, 0)\n| STATS \n    baseline_count = SUM(is_baseline),\n    recent_count = SUM(CASE(@timestamp > NOW() - 30 days, 1, 0)),\n\
    \    first_seen = MIN(@timestamp),\n    last_seen = MAX(@timestamp),\n    dest_ips = VALUES(destination.ip)\n  BY source.ip\n| WHERE baseline_count\
    \ == 0 AND recent_count > 0\n| KEEP source.ip, first_seen, last_seen, dest_ips, recent_count\n"
  leql: |
    where(log_source_name="Firewall" AND direction=INBOUND AND action=ALLOW AND (destination_port IN [20, 21, 69] OR application ICONTAINS "ftp")) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=firewall action=allowed (destinationPort IN ["20","21","69"] OR application=*ftp*)
    | direction=inbound
    | groupBy([sourceIP, destinationIP], function=count(as=events))
    | events >= 1
    | table([sourceIP, destinationIP, events])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_firewall_action = "allow"
      and direction = "inbound"
      and (dest_port in ("20", "21", "69") or lowercase(app) contains "ftp")
    | alter is_internal_dest = incidr(dest_ip, "10.0.0.0/8") or incidr(dest_ip, "172.16.0.0/12") or incidr(dest_ip, "192.168.0.0/16")
    | filter is_internal_dest = true
    | comp count() as connections by source_ip, dest_ip
    | filter connections > 0
  lucene: |
    (action:allowed AND direction:inbound AND source.ip:(NOT 10.0.0.0/8 AND NOT 172.16.0.0/12 AND NOT 192.168.0.0/16) AND destination.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16)) AND (destination.port:(20 OR 21 OR 69) OR application:*ftp*)
  sumo: "_sourceCategory=*Firewall* \n| where action matches \"*allow*\" OR (dest_port in (\"20\", \"21\", \"69\")) OR (application matches \"\
    *ftp*\")\n| where direction matches \"*inbound*\" OR (isPrivateIP(dest_ip) AND NOT isPrivateIP(src_ip))\n| timeslice 1d\n| count_distinct(_timeslice)\
    \ as days_seen by src_ip\n| where days_seen <= 2\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Firewall Event \nFrom one external source to one internal destination (Inbound)\nWhere the Action is Allowed\nOR\n    Where the\
  \ Destination Port IN (\"20\", \"21\", \"69\")\n\n    Where the Application contains \"ftp\"\n\nBaseline Learning: 30 Days\nRetention: 90 Days\n\
  \nNew Value: Source IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

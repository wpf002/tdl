rule_id: TDL-EXF-000629
v4_id: 000629
name: Malicious Traffic over Exfiltration Port - Inbound
description: Detects a successful inbound connection identified on a threat feed using applications FTP, SSH, RDP, SMB, and Telnet.
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1071
technique_name: Application Layer Protocol
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=firewall action=allowed \n(src_category=external dest_category=internal) OR (dest_port IN (20, 21, 22, 23, 139, 445, 3389)) OR (lower(app)\
    \ IN (\"ftp\", \"rdp\", \"ssh\", \"smb\", \"telnet\"))\n| lookup threat_intel_list src_ip OUTPUT is_threat\n| where is_threat=1 OR isnotnull(is_threat)\n\
    | stats count by _time, src_ip, dest_ip, dest_port, app, action\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where destination_port in ("20", "21", "22", "23", "139", "445", "3389")

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "destination_port" IN (''20'', ''21'', ''22'', ''23'', ''139'', ''445'', ''3389'')

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exf_000629 {\n  meta:\n    author = \"TDL\"\n    description = \"Malicious Traffic over Exfiltration Port - Inbound\"\n\
    \    severity = \"MEDIUM\"\n    tactic = \"TA0010\"\n    technique = \"T1071\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.destination_port = /(20|21|22|23|139|445|3389)/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n\
    }\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND destination_port IN ("20", "21", "22", "23", "139", "445", "3389")

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND destination_port IN [20, 21, 22, 23, 139, 445, 3389])

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND destination_port IN (20, 21, 22, 23, 139, 445, 3389)

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND destination_port in ("20", "21", "22", "23", "139", "445", "3389")

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND destination_port:(20 OR 21 OR 22 OR 23 OR 139 OR 445 OR 3389)

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where destination_port IN ("20", "21", "22", "23", "139", "445", "3389")

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- exfiltration
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Allowed Firewall Event \nFrom one external source to a single internal destination (inbound)\nOR\n\tWhere the Destination Port\
  \ is in [20, 21, 22, 23, 139, 445, 3389]\n\t\n\tWhere the Application is case insensitive in [\"ftp\", \"rdp\", \"ssh\", \"smb\", \"telnet\"\
  ]\n\t\nWhere the Source IP is on a Threat Intelligence List"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, destination, total bytes transferred, and the protocol used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — quantify the data volume vs the host's baseline outbound profile.
- 'Pivot to preceding collection / staging activity: archives, mailbox dumps, database extracts in the prior 24h on the same host.'
- Identify what was likely exfiltrated (path patterns, file types, classification labels) and the user/process that produced it.
- 'Decide TP / FP: FP for sanctioned cloud backup / vendor data sharing on a known channel; TP for unattended bulk transfers to new endpoints.'
- 'If TP: block the destination, isolate the host, preserve network and DLP evidence, and trigger your data-incident process (legal / privacy
  / customer notification as applicable).'

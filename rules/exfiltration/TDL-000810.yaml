rule_id: TDL-EXF-000810
v4_id: 000810
name: Scheduled Outbound Burst Following Local Archive Creation
description: Within 30m of an archive .rar/.zip creation in %TEMP%, the same host emits >100MB outbound to a single external destination. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1020 under Exfiltration).
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1020
technique_name: Automated Exfiltration
platform:
- Network
data_sources:
- Firewall
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=sysmon OR sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" OR sourcetype=edr) EventCode=11 TargetFilename\
    \ IN (\"*.rar\", \"*.zip\") TargetFilename=\"*\\\\Temp\\\\*\"\n| eval archive_time=_time\n| fields archive_time, ComputerName, TargetFilename\n\
    | join type=inner ComputerName \n    [search index=* (sourcetype=firewall OR sourcetype=network OR sourcetype=edr) action=allowed direction=outbound\
    \ dest_ip!=10.* dest_ip!=172.16.* dest_ip!=192.168.* dest_ip!=127.*\n    | bin _time span=30m\n    | stats sum(bytes_out) as total_bytes by\
    \ _time, src, dest_ip\n    | where total_bytes > 104857600\n    | rename src as ComputerName\n    | eval network_time=_time\n    | fields\
    \ network_time, ComputerName, dest_ip, total_bytes]\n| where (network_time - archive_time) >= 0 AND (network_time - archive_time) <= 1800\n\
    | table archive_time, network_time, ComputerName, TargetFilename, dest_ip, total_bytes\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exf_000810 {\n  meta:\n    author = \"TDL\"\n    description = \"Scheduled Outbound Burst Following Local Archive Creation\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0010\"\n    technique = \"T1020\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: Within 30m of an archive .rar/.zip creation in %TEMP%, the same host emits >100MB outbound to a single external destination.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

rule_id: TDL-EXF-000810
v4_id: 000810
name: Scheduled Outbound Burst Following Local Archive Creation
description: Within 30m of an archive .rar/.zip creation in %TEMP%, the same host emits >100MB outbound to a single external destination. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1020 under Exfiltration).
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1020
technique_name: Automated Exfiltration
platform:
- Network
data_sources:
- Firewall
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=sysmon OR sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" OR sourcetype=edr) EventCode=11 TargetFilename\
    \ IN (\"*.rar\", \"*.zip\") TargetFilename=\"*\\\\Temp\\\\*\"\n| eval archive_time=_time\n| fields archive_time, ComputerName, TargetFilename\n\
    | join type=inner ComputerName \n    [search index=* (sourcetype=firewall OR sourcetype=network OR sourcetype=edr) action=allowed direction=outbound\
    \ dest_ip!=10.* dest_ip!=172.16.* dest_ip!=192.168.* dest_ip!=127.*\n    | bin _time span=30m\n    | stats sum(bytes_out) as total_bytes by\
    \ _time, src, dest_ip\n    | where total_bytes > 104857600\n    | rename src as ComputerName\n    | eval network_time=_time\n    | fields\
    \ network_time, ComputerName, dest_ip, total_bytes]\n| where (network_time - archive_time) >= 0 AND (network_time - archive_time) <= 1800\n\
    | table archive_time, network_time, ComputerName, TargetFilename, dest_ip, total_bytes\n"
  kql: |
    let ArchiveCreation = DeviceFileEvents
    | where TimeGenerated > ago(30m)
    | where FolderPath has @"\AppData\Local\Temp\" or FolderPath has @"\Windows\Temp\"
    | where FileName endswith ".rar" or FileName endswith ".zip"
    | where ActionType == "FileCreated"
    | project ArchiveTime = TimeGenerated, DeviceId, DeviceName, ArchiveFile = FileName, FolderPath;
    let OutboundTraffic = DeviceNetworkEvents
    | where TimeGenerated > ago(30m)
    | where ActionType == "ConnectionSuccess"
    | where RemoteIPType == "Public"
    | summarize TotalBytes = sum(SentBytes) by DeviceId, RemoteIP, bin(TimeGenerated, 30m)
    | where TotalBytes > 104857600;
    ArchiveCreation
    | join kind=inner (OutboundTraffic) on DeviceId
    | where TimeGenerated >= ArchiveTime and TimeGenerated <= ArchiveTime + 30m
    | project TimeGenerated, DeviceName, ArchiveFile, FolderPath, ArchiveTime, RemoteIP, TotalBytes
  aql: "SELECT \n    archive_events.\"Process Name\" AS archive_process,\n    archive_events.sourceip AS internal_host,\n    LOGSOURCENAME(archive_events.logsourceid)\
    \ AS host_name,\n    archive_events.\"Target Filename\" AS archive_file,\n    archive_events.eventtime AS archive_creation_time,\n    flows.destinationip\
    \ AS external_destination,\n    SUM(flows.BytesToDestination) AS total_bytes_out\nFROM events archive_events\nJOIN flows flows ON archive_events.sourceip\
    \ = flows.sourceip\nWHERE archive_events.\"Target Filename\" ILIKE '%\\\\temp\\\\%.rar'\n   OR archive_events.\"Target Filename\" ILIKE '%\\\
    \\temp\\\\%.zip'\n   AND flows.destinationip NOT LIKE '10.%'\n   AND flows.destinationip NOT LIKE '172.16.%'\n   AND flows.destinationip NOT\
    \ LIKE '172.17.%'\n   AND flows.destinationip NOT LIKE '172.18.%'\n   AND flows.destinationip NOT LIKE '172.19.%'\n   AND flows.destinationip\
    \ NOT LIKE '172.20.%'\n   AND flows.destinationip NOT LIKE '172.21.%'\n   AND flows.destinationip NOT LIKE '172.22.%'\n   AND flows.destinationip\
    \ NOT LIKE '172.23.%'\n   AND flows.destinationip NOT LIKE '172.24.%'\n   AND flows.destinationip NOT LIKE '172.25.%'\n   AND flows.destinationip\
    \ NOT LIKE '172.26.%'\n   AND flows.destinationip NOT LIKE '172.27.%'\n   AND flows.destinationip NOT LIKE '172.28.%'\n   AND flows.destinationip\
    \ NOT LIKE '172.29.%'\n   AND flows.destinationip NOT LIKE '172.30.%'\n   AND flows.destinationip NOT LIKE '172.31.%'\n   AND flows.destinationip\
    \ NOT LIKE '192.168.%'\n   AND flows.starttime BETWEEN archive_events.eventtime AND (archive_events.eventtime + 1800000)\nGROUP BY archive_events.\"\
    Process Name\", archive_events.sourceip, LOGSOURCENAME(archive_events.logsourceid), archive_events.\"Target Filename\", archive_events.eventtime,\
    \ flows.destinationip\nHAVING total_bytes_out > 104857600\nLAST 1 HOURS\n"
  yara_l: |
    rule exfiltration_after_temp_archive {
      meta:
        author = "TDL"
        description = "Detects large outbound transfer following archive creation in TEMP directory"
        mitre_attack_tactic = "Exfiltration"
        mitre_attack_technique = "T1020"
        severity = "HIGH"

      events:
        $archive.metadata.event_type = "FILE_CREATION"
        re.regex($archive.target.file.full_path, `(?i)\\temp\\.*\.(rar|zip)$`)
        $archive.principal.hostname = $host

        $transfer.metadata.event_type = "NETWORK_CONNECTION"
        $transfer.network.direction = "OUTBOUND"
        not net.ip_in_range_cidr($transfer.target.ip, "10.0.0.0/8")
        not net.ip_in_range_cidr($transfer.target.ip, "172.16.0.0/12")
        not net.ip_in_range_cidr($transfer.target.ip, "192.168.0.0/16")
        $transfer.principal.hostname = $host
        $transfer.target.ip = $dest_ip
        $transfer.network.sent_bytes > 0

      match:
        $host, $dest_ip over 30m

      outcome:
        $total_bytes = sum($transfer.network.sent_bytes)
        $risk_score = max(75)

      condition:
        $archive and #transfer > 0 and $total_bytes > 104857600
    }
  esql: |
    FROM logs-endpoint.events.file*, logs-endpoint.events.network*
    | WHERE @timestamp > NOW() - 30 minutes
    | EVAL is_archive = CASE(
        event.category == "file" AND event.action IN ("creation", "create") AND (process.working_directory LIKE "*\\Temp\\*" OR process.working_directory LIKE "*\\temp\\*" OR file.path LIKE "*\\Temp\\*" OR file.path LIKE "*\\temp\\*") AND (TO_LOWER(file.extension) == "rar" OR TO_LOWER(file.extension) == "zip"), 1,
        0
      ),
      is_network = CASE(
        event.category == "network" AND event.action IN ("connection_attempted", "connection_accepted", "network_flow") AND destination.ip IS NOT NULL AND NOT destination.ip LIKE "10.*" AND NOT destination.ip LIKE "172.16.*" AND NOT destination.ip LIKE "172.17.*" AND NOT destination.ip LIKE "172.18.*" AND NOT destination.ip LIKE "172.19.*" AND NOT destination.ip LIKE "172.20.*" AND NOT destination.ip LIKE "172.21.*" AND NOT destination.ip LIKE "172.22.*" AND NOT destination.ip LIKE "172.23.*" AND NOT destination.ip LIKE "172.24.*" AND NOT destination.ip LIKE "172.25.*" AND NOT destination.ip LIKE "172.26.*" AND NOT destination.ip LIKE "172.27.*" AND NOT destination.ip LIKE "172.28.*" AND NOT destination.ip LIKE "172.29.*" AND NOT destination.ip LIKE "172.30.*" AND NOT destination.ip LIKE "172.31.*" AND NOT destination.ip LIKE "192.168.*" AND NOT destination.ip LIKE "127.*", 1,
        0
      )
    | STATS archive_time = MIN(@timestamp), total_bytes = SUM(network.bytes), network_count = SUM(is_network), archive_count = SUM(is_archive) BY host.name, destination.ip
    | WHERE archive_count > 0 AND total_bytes > 104857600
    | KEEP host.name, destination.ip, archive_time, total_bytes, network_count
  leql: |
    where(source_json.EventID=11 AND (source_json.TargetFilename ICONTAINS ".rar" OR source_json.TargetFilename ICONTAINS ".zip") AND source_json.TargetFilename ICONTAINS "temp") groupby(asset) calculate(count)
  crowdstrike: "event_simpleName=ProcessRollup2 (CommandLine=*\".rar\"* OR CommandLine=*\".zip\"*) (CommandLine=*temp* OR CommandLine=*TMP*)\n\
    | table([@timestamp, ComputerName, FileName, CommandLine], limit=max)\n| ComputerName=*\n| join({\n    event_simpleName=NetworkConnectIP4\
    \ \n    | groupBy([ComputerName, RemoteAddressIP4], function=[sum(field=BytesSent, as=totalBytes), min(@timestamp, as=firstConn)])\n    |\
    \ totalBytes > 104857600\n  }, field=[ComputerName], key=[ComputerName], include=[RemoteAddressIP4, totalBytes, firstConn])\n| (firstConn\
    \ - @timestamp) <= 1800000\n| table([@timestamp, ComputerName, FileName, CommandLine, RemoteAddressIP4, totalBytes, firstConn])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE and action_file_path ~= "\\\\Temp\\\\.*(\\.(rar|zip))$"
    | alter archive_time = _time, archive_host = agent_hostname, archive_user = actor_effective_username, archive_file = action_file_path
    | fields archive_time, archive_host, archive_user, archive_file
    | join type=inner (
        dataset = panw_ngfw_traffic_raw
        | filter dest_location = CONST.EXTERNAL and bytes_sent > 0
        | alter traffic_time = _time, traffic_host = source_ip, dest_ip = dest_ip
        | fields traffic_time, traffic_host, dest_ip, bytes_sent
    ) as traffic traffic_host = archive_host
    | filter traffic_time >= archive_time and traffic_time <= add(archive_time, milliseconds=1800000)
    | comp sum(bytes_sent) as total_bytes by archive_host, archive_user, archive_file, archive_time, dest_ip
    | filter total_bytes > 104857600
    | fields archive_time, archive_host, archive_user, archive_file, dest_ip, total_bytes
  lucene: |
    (_exists_:file.path AND file.extension:(rar OR zip) AND file.path:*\\Temp\\*) OR (network.direction:outbound AND network.bytes:>104857600 AND NOT destination.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16))
  sumo: "_sourceCategory=*Windows* OR _sourceCategory=*EDR* OR _sourceCategory=*Firewall*\n| json field=_raw \"EventID\" as event_id\n| json field=_raw\
    \ \"TargetFilename\" as target_file\n| json field=_raw \"Computer\" as host\n| json field=_raw \"Image\" as process_name\n| json field=_raw\
    \ \"UtcTime\" as file_time\n| json field=_raw \"src_host\" as firewall_host\n| json field=_raw \"dst_ip\" as dest_ip\n| json field=_raw \"\
    bytes_out\" as bytes\n| json field=_raw \"timestamp\" as fw_time\n| where (event_id = \"11\" and (target_file matches \"*\\\\Temp\\\\*.rar\"\
    \ or target_file matches \"*\\\\Temp\\\\*.zip\")) \n   or (bytes > 0 and dest_ip != \"\" and !isEmpty(dest_ip))\n| if(event_id = \"11\", host,\
    \ firewall_host) as hostname\n| if(event_id = \"11\", parseDate(file_time, \"yyyy-MM-dd HH:mm:ss\"), parseLong(fw_time)) as event_time\n|\
    \ if(event_id = \"11\", \"archive\", \"transfer\") as event_type\n| if(event_type = \"archive\", target_file, \"\") as archive_file\n| if(event_type\
    \ = \"transfer\", parseLong(bytes), 0) as transfer_bytes\n| fields hostname, event_time, event_type, archive_file, dest_ip, transfer_bytes\n\
    | sort by hostname, event_time\n| where hostname != \"\"\n| timeslice 30m\n| first(archive_file) as first_archive, sum(transfer_bytes) as\
    \ total_bytes by hostname, dest_ip, _timeslice\n| where !isEmpty(first_archive) and total_bytes > 104857600\n| fields hostname, dest_ip, first_archive,\
    \ total_bytes\n"
pseudo_logic: Within 30m of an archive .rar/.zip creation in %TEMP%, the same host emits >100MB outbound to a single external destination.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

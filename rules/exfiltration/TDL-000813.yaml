rule_id: TDL-EXF-000813
v4_id: 000813
name: Large Write to Removable Volume in Short Window
description: '>100MB total bytes written by single process to a DriveType=2 volume within 5m. Generated from gap analysis against canonical ATT&CK
  Enterprise matrix (T1052 under Exfiltration).'
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1052
technique_name: Exfiltration Over Physical Medium
platform:
- Windows
- Linux
data_sources:
- Sysmon
- Auditd
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* sourcetype IN (\"WinEventLog:Microsoft-Windows-Sysmon/Operational\", \"linux_secure\", \"auditd\") \n(EventCode=23 OR type=PATH)\
    \ \n| eval is_removable=if(like(TargetFilename, \"D:\\\\%\") OR like(TargetFilename, \"E:\\\\%\") OR like(TargetFilename, \"F:\\\\%\") OR\
    \ like(file, \"/media/%\") OR like(file, \"/mnt/%\"), 1, 0)\n| where is_removable=1\n| bin _time span=5m\n| stats sum(FileSize) as total_bytes\
    \ values(TargetFilename) as files values(Image) as process by _time, ComputerName, ProcessId\n| where total_bytes > 104857600\n| table _time,\
    \ ComputerName, ProcessId, process, total_bytes, files\n"
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 23
    | extend EventXml = parse_xml(EventData)
    | extend TargetFilename = tostring(EventXml.DataItem.EventData.Data.[5].["#text"])
    | extend ProcessGuid = tostring(EventXml.DataItem.EventData.Data.[3].["#text"])
    | extend Image = tostring(EventXml.DataItem.EventData.Data.[4].["#text"])
    | where TargetFilename startswith "D:" or TargetFilename startswith "E:" or TargetFilename startswith "F:" or TargetFilename startswith "G:" or TargetFilename startswith "H:" or TargetFilename startswith "I:" or TargetFilename startswith "J:" or TargetFilename startswith "K:" or TargetFilename startswith "L:" or TargetFilename startswith "M:" or TargetFilename startswith "N:" or TargetFilename startswith "O:" or TargetFilename startswith "P:" or TargetFilename startswith "Q:" or TargetFilename startswith "R:" or TargetFilename startswith "S:" or TargetFilename startswith "T:" or TargetFilename startswith "U:" or TargetFilename startswith "V:" or TargetFilename startswith "W:" or TargetFilename startswith "X:" or TargetFilename startswith "Y:" or TargetFilename startswith "Z:"
    | summarize TotalBytes = sum(todouble(EventXml.DataItem.EventData.Data.[10].["#text"])), FileCount = count() by bin(TimeGenerated, 5m), Computer, ProcessGuid, Image
    | where TotalBytes > 104857600
    | project TimeGenerated, Computer, Image, ProcessGuid, TotalBytes, FileCount
  aql: |
    SELECT "Process Name", "Image", sourceip, LOGSOURCENAME(logsourceid) AS host, SUM("BytesWritten") AS total_bytes, COUNT(*) AS write_events
    FROM events
    WHERE ("EventID" = '11' OR "EventID" IN ('AUDITD_WRITE', 'AUDITD_OPEN'))
      AND "TargetFilename" MATCHES '^[D-Z]:\\.*'
      AND "DriveType" = '2'
    GROUP BY "Process Name", "Image", sourceip, LOGSOURCENAME(logsourceid)
    HAVING total_bytes > 104857600
    LAST 5 MINUTES
  yara_l: "rule exfil_large_volume_removable_media {\n  meta:\n    author = \"TDL\"\n    description = \"Detects processes writing >100MB to removable\
    \ media (DriveType=2) within 5 minutes\"\n    mitre_attack_tactic = \"Exfiltration\"\n    mitre_attack_technique = \"T1052\"\n    severity\
    \ = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"FILE_CREATION\" or $e.metadata.event_type = \"FILE_MODIFICATION\"\n    $e.principal.process.pid\
    \ = $pid\n    $e.principal.hostname = $host\n    $e.target.file.full_path = $file_path\n    re.regex($e.target.file.full_path, `^[A-Z]:\\\\\
    `) or re.regex($e.target.file.full_path, `^/media/|^/mnt/`)\n    $e.metadata.description = /DriveType=2/ or $e.about.labels.value = \"2\"\
    \ or $e.additional.fields.value = \"2\"\n    $e.target.file.size > 0\n    \n  match:\n    $host, $pid over 5m\n    \n  outcome:\n    $total_bytes\
    \ = sum($e.target.file.size)\n    $risk_score = max(85)\n    \n  condition:\n    $total_bytes > 104857600\n}\n"
  esql: "FROM logs-windows.sysmon_operational*, logs-endpoint.events.file*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.code IN (\"11\"\
    , \"23\") \n  AND file.path RLIKE \"[A-Z]:\\\\\\\\.*\"\n| EVAL drive_letter = SUBSTRING(file.path, 0, 2)\n| STATS total_bytes = SUM(COALESCE(file.size,\
    \ 0)) BY process.executable, host.name, drive_letter, bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE total_bytes > 104857600\n| KEEP @timestamp,\
    \ host.name, process.executable, drive_letter, total_bytes, bucket\n"
  leql: |
    where(source_json.EventID=23 AND source_json.TargetFilename ICONTAINS ":\\" AND source_json.DriveType=2) groupby(process_name, asset) calculate(sum:source_json.FileSize)
  crowdstrike: |
    event_simpleName=ProcessRollup2 OR (EventCode=11 DriveType=2)
    | case {
        event_simpleName=ProcessRollup2 | TargetProcessId := TargetProcessId ;
        EventCode=11 | bytes := coalesce(FileSize, 0) ;
        * ;
      }
    | groupBy([TargetProcessId, ComputerName], function=[sum(bytes, as=totalBytes), selectLast([FileName, CommandLine])], limit=max)
    | totalBytes > 104857600
    | table([ComputerName, TargetProcessId, FileName, CommandLine, totalBytes])
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_FILE and action_file_path ~= \"^[D-Z]:\\\\\\\\\" \n| alter drive_letter = arrayindex(regextract(action_file_path,\
    \ \"^([D-Z]):\"), 0)\n| filter drive_letter != null\n| bin _time span=5m\n| comp sum(action_file_size) as total_bytes by _time, agent_hostname,\
    \ actor_process_image_name, actor_process_image_path, drive_letter\n| filter total_bytes > 104857600\n| fields _time, agent_hostname, actor_process_image_name,\
    \ actor_process_image_path, drive_letter, total_bytes\n"
  lucene: |
    (event.code:11 OR event.id:11) AND file.path:(/media/* OR /mnt/* OR D:\* OR E:\* OR F:\* OR G:\* OR H:\* OR I:\* OR J:\* OR K:\* OR L:\* OR M:\* OR N:\* OR O:\* OR P:\* OR Q:\* OR R:\* OR S:\* OR T:\* OR U:\* OR V:\* OR W:\* OR X:\* OR Y:\* OR Z:\*)
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*Auditd*
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "TargetFilename" as target_file
    | json field=_raw "ProcessId" as pid
    | where event_id = "11" and target_file matches "*:\\*"
    | parse regex field=target_file "(?<drive_letter>[A-Z]):\\" nodrop
    | lookup type from sumo://filesystem on drive_letter=drive where type="Removable"
    | where !isNull(type)
    | timeslice 5m
    | sum(toInt(0)) as bytes_written by _timeslice, process_name, pid, _sourceHost
    | where bytes_written > 104857600
    | fields _timeslice, _sourceHost, process_name, pid, bytes_written
pseudo_logic: '>100MB total bytes written by single process to a DriveType=2 volume within 5m.'
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

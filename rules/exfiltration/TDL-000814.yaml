rule_id: TDL-EXF-000814
v4_id: 000814
name: Periodic Off-Hours Outbound Bulk Transfer
description: Outbound transfer >25MB to same external destination at consistent intervals (±10m) between 0100–0500 local. Scheduled exfil. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1029 under Exfiltration).
tactic: Exfiltration
tactic_id: TA0010
technique_id: T1029
technique_name: Scheduled Transfer
platform:
- Network
data_sources:
- Firewall
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=firewall action=allowed direction=outbound dest_ip!=10.* dest_ip!=172.16.* dest_ip!=192.168.* \n| eval hour=tonumber(strftime(_time,\
    \ \"%H\"))\n| where hour >= 1 AND hour < 5\n| bin _time span=10m\n| stats sum(bytes_out) as total_bytes earliest(_time) as first_time latest(_time)\
    \ as last_time by dest_ip, src_ip, _time\n| where total_bytes > 26214400\n| eventstats count as transfer_count values(_time) as transfer_times\
    \ by src_ip, dest_ip\n| where transfer_count >= 3\n| mvexpand transfer_times\n| streamstats current=f last(transfer_times) as prev_time by\
    \ src_ip, dest_ip\n| eval time_diff=transfer_times - prev_time\n| where time_diff >= 540 AND time_diff <= 660\n| stats count as consistent_intervals\
    \ dc(transfer_times) as interval_count sum(total_bytes) as total_exfil by src_ip, dest_ip\n| where consistent_intervals >= 2\n| eval total_exfil_mb=round(total_exfil/1048576,\
    \ 2)\n| table src_ip, dest_ip, interval_count, total_exfil_mb\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_exf_000814 {\n  meta:\n    author = \"TDL\"\n    description = \"Periodic Off-Hours Outbound Bulk Transfer\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0010\"\n    technique = \"T1029\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
pseudo_logic: Outbound transfer >25MB to same external destination at consistent intervals (±10m) between 0100–0500 local. Scheduled exfil.

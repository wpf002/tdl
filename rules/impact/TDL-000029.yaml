rule_id: TDL-IMP-000029
v4_id: 000029
name: Mass File Deletion
description: Detects when a user deletes multiple files from a file transfer/storage appliance. This could indicate an insider threat or a compromised
  or disgruntled user attempting to cause destruction to the organization.
tactic: Impact
tactic_id: TA0040
technique_id: T1485
technique_name: Data Destruction
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=sharepoint sourcetype="ms:o365:reporting" Workload="SharePoint" Operation="FileDeleted"
    | bin _time span=10m
    | stats dc(ObjectId) as distinct_files, values(ObjectId) as file_list by _time, UserId
    | where distinct_files >= 50
    | join type=inner UserId
        [search index=mcas sourcetype="ms:mcas:alert" Operation="AlertTriggered" alert_name="Unusual volume of file deletion"
        | rename user as UserId
        | fields UserId]
    | table _time, UserId, distinct_files, file_list
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex "FileDeleted"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%FileDeleted%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_imp_000029 {\n  meta:\n    author = \"TDL\"\n    description = \"Mass File Deletion\"\n    severity = \"MEDIUM\"\n   \
    \ tactic = \"TA0040\"\n    technique = \"T1485\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName = /FileDeleted/\n\
    \    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%FileDeleted%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/FileDeleted/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*FileDeleted*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= "FileDeleted"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*FileDeleted*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*FileDeleted*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "50 Sharepoint Events\nWhere the Operation is \"FileDeleted\"\nWhere the workload is \"Sharepoint\"\nWith distinct File Names\n\
  With the same Source Username \nWithin 10 minutes\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Microsoft Cloud App Security Event\nWhere the Operation is \"AlertTriggered\"\nWhere the Alert Name is \"Unusual volume of file deletion\""
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

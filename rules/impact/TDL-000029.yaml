rule_id: TDL-IMP-000029
v4_id: 000029
name: Mass File Deletion
description: Detects when a user deletes multiple files from a file transfer/storage appliance. This could indicate an insider threat or a compromised
  or disgruntled user attempting to cause destruction to the organization.
tactic: Impact
tactic_id: TA0040
technique_id: T1485
technique_name: Data Destruction
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=sharepoint sourcetype=\"ms:o365:reporting\" Workload=\"SharePoint\" Operation=\"FileDeleted\"\n| bin _time span=10m\n| stats dc(ObjectId)\
    \ as distinct_files, values(ObjectId) as file_list by _time, UserId\n| where distinct_files >= 50\n| join type=inner UserId\n    [search index=mcas\
    \ sourcetype=\"ms:mcas:alert\" Operation=\"AlertTriggered\" alert_name=\"Unusual volume of file deletion\"\n    | rename user as UserId\n\
    \    | fields UserId]\n| table _time, UserId, distinct_files, file_list\n"
  kql: |
    let DeletionThreshold = 50;
    let TimeWindow = 10m;
    let MassFileDeletion = OfficeActivity
    | where TimeGenerated > ago(1h)
    | where Operation == "FileDeleted"
    | where OfficeWorkload == "SharePoint"
    | summarize DeletedFiles = dcount(OfficeObjectId), FileList = make_set(OfficeObjectId) by bin(TimeGenerated, TimeWindow), UserId
    | where DeletedFiles >= DeletionThreshold
    | project TimeGenerated, UserId, DeletedFiles, FileList;
    let MCASAlert = CloudAppEvents
    | where TimeGenerated > ago(1h)
    | where ActionType == "AlertTriggered"
    | where RawEventData.alertName == "Unusual volume of file deletion"
    | project TimeGenerated, AccountObjectId, AlertName = RawEventData.alertName;
    MassFileDeletion
    | union (MCASAlert)
    | project TimeGenerated, User = coalesce(UserId, AccountObjectId), DeletedFiles, FileList, AlertName
  aql: |
    SELECT username AS "Source Username", COUNT(*) AS total_deletions, UNIQUECOUNT("FileName") AS distinct_files
    FROM events
    WHERE "Operation" = 'FileDeleted' AND "Workload" = 'Sharepoint'
    GROUP BY username
    HAVING total_deletions >= 50 AND distinct_files >= 50
    LAST 10 MINUTES
  yara_l: |
    rule sharepoint_mass_deletion_m365 {
      meta:
        author = "Detection Engineering"
        description = "Detects mass file deletion in SharePoint (T1485 - Data Destruction)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1485"
        severity = "High"

      events:
        $delete.metadata.product_event_type = "FileDeleted"
        $delete.metadata.product_name = "Microsoft 365"
        $delete.metadata.vendor_name = "Microsoft"
        $delete.target.resource.attribute.labels["Workload"] = "Sharepoint"
        $delete.principal.user.userid = $user
        $delete.target.file.full_path = $file

        $alert.metadata.product_event_type = "AlertTriggered"
        $alert.metadata.product_name = "Microsoft Cloud App Security"
        $alert.metadata.vendor_name = "Microsoft"
        $alert.security_result.summary = "Unusual volume of file deletion"
        $alert.principal.user.userid = $user

      match:
        $user over 10m

      outcome:
        $risk_score = max(85)
        $deleted_files = array_distinct($file)
        $num_deleted_files = count_distinct($file)

      condition:
        #delete >= 50 and $alert and $num_deleted_files >= 50
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 10 minute \n  AND event.dataset == \"o365.audit\" \n  AND o365.audit.Workload ==\
    \ \"SharePoint\"\n  AND o365.audit.Operation == \"FileDeleted\"\n| STATS deleted_files = COUNT_DISTINCT(file.name) BY user.name, window =\
    \ BUCKET(@timestamp, 10 minute)\n| WHERE deleted_files >= 50\n"
  leql: |
    where(source_json.Workload="SharePoint" AND source_json.Operation="FileDeleted") groupby(source_json.UserId) calculate(unique:source_json.ObjectId)
  crowdstrike: |
    (#type=SharePoint Operation=FileDeleted Workload=SharePoint)
    | groupBy([SourceUserName], function=[count(FileName, distinct=true, as=distinctFiles), collectValues(FileName, limit=100, as=deletedFiles)])
    | distinctFiles >= 50
    | timeChart(span=10m, function=[max(distinctFiles, as=maxFiles)])
    | maxFiles >= 50
    | union([
        (#type=MCAS Operation=AlertTriggered AlertName="Unusual volume of file deletion")
        | table([@timestamp, Operation, AlertName, SourceUserName])
      ])
    | table([@timestamp, SourceUserName, distinctFiles, deletedFiles])
  xql: |
    dataset = msft_365_management_activity_raw
    | filter Operation = "FileDeleted" and Workload = "SharePoint"
    | bin _time span=10m
    | comp count_distinct(ObjectId) as distinct_files by _time, UserId
    | filter distinct_files >= 50
    | join type=inner (dataset = cloud_audit_logs | filter raw_log ~= "\"Operation\":\"AlertTriggered\"" and raw_log ~= "\"AlertName\":\"Unusual volume of file deletion\"" | alter alert_user = extract(raw_log, "\"UserId\":\"([^\"]+)") | fields _time as alert_time, alert_user) as alerts on UserId = alerts.alert_user
    | fields _time, UserId, distinct_files, alerts.alert_time
  lucene: |
    (Operation:"FileDeleted" AND Workload:"SharePoint") OR (Operation:"AlertTriggered" AND alert.name:"Unusual volume of file deletion")
  sumo: |
    _sourceCategory=*SharePoint* OR _sourceCategory=*Microsoft365* OR _sourceCategory=*O365*
    | json field=_raw "Operation" as operation
    | json field=_raw "Workload" as workload
    | json field=_raw "ObjectId" as file_name
    | json field=_raw "UserId" as source_user
    | json field=_raw "Name" as alert_name
    | where (operation = "FileDeleted" and workload = "SharePoint") or (operation = "AlertTriggered" and alert_name = "Unusual volume of file deletion")
    | if(operation = "FileDeleted", 1, 0) as is_deletion
    | if(operation = "AlertTriggered", 1, 0) as is_alert
    | timeslice 10m
    | count_distinct(file_name) as distinct_files, sum(is_alert) as alert_count by _timeslice, source_user
    | where distinct_files >= 50 or alert_count >= 1
    | fields _timeslice, source_user, distinct_files, alert_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "50 Sharepoint Events\nWhere the Operation is \"FileDeleted\"\nWhere the workload is \"Sharepoint\"\nWith distinct File Names\n\
  With the same Source Username \nWithin 10 minutes\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Microsoft Cloud App Security Event\nWhere the Operation is \"AlertTriggered\"\nWhere the Alert Name is \"Unusual volume of file deletion\""
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

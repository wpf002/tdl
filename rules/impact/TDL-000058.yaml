rule_id: TDL-IMP-000058
v4_id: 000058
name: Mass Folder Deletion
description: Detects when multiple folders are removed by the same user from file transfer/storage source. This could indicate an attacker's attempt
  to cause destruction to the organization.
tactic: Impact
tactic_id: TA0040
technique_id: T1485
technique_name: Data Destruction
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" Operation="FolderDeleted"

    | bin _time span=5m

    | stats dc(FileName) as distinct_files values(FileName) as file_names by _time, SourceUserName

    | where distinct_files >= 20

    '
  kql: |
    SharePointFileOperation
    | where TimeGenerated > ago(1h)
    | where Operation == "FolderDeleted"
    | summarize DistinctFolders = dcount(ObjectId), FolderList = make_set(ObjectId) by bin(TimeGenerated, 5m), UserId
    | where DistinctFolders >= 20
    | project TimeGenerated, UserId, DistinctFolders, FolderList
  aql: |
    SELECT username AS "Source Username", COUNT(*) AS total_deletions, UNIQUECOUNT("File Name") AS distinct_files
    FROM events
    WHERE "Operation Name" = 'FolderDeleted'
    GROUP BY username
    HAVING total_deletions >= 20 AND distinct_files >= 20
    LAST 5 MINUTES
  yara_l: |
    rule sharepoint_mass_folder_deletion {
      meta:
        author = "Detection Engineer"
        description = "Detects 20+ distinct folder deletions in SharePoint within 5 minutes by same user - T1485 Impact"
        mitre_attack_technique = "T1485"
        mitre_attack_tactic = "Impact"
        severity = "High"

      events:
        $e.metadata.product_name = "Microsoft SharePoint"
        $e.metadata.product_event_type = "FolderDeleted"
        $e.principal.user.userid = $user
        $e.target.file.full_path = $file

      match:
        $user over 5m

      condition:
        #file >= 20
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.action == \"FolderDeleted\"\n  AND event.provider == \"SharePoint\"\
    \n| STATS distinct_files = COUNT_DISTINCT(file.name), total_ops = COUNT(*) BY user.name, bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE distinct_files\
    \ >= 20\n| KEEP user.name, distinct_files, total_ops, bucket\n"
  leql: |
    where(source_json.Operation="FolderDeleted") groupby(source_json.UserId) calculate(unique:source_json.ObjectId)
  crowdstrike: |
    #type=sharepoint Operation="FolderDeleted"
    | bucket(@timestamp, span=5m, as=time_window)
    | groupBy([time_window, UserName], function=[count(FileName, distinct=true, as=distinct_files)])
    | distinct_files >= 20
    | table([time_window, UserName, distinct_files])
  xql: |
    dataset = msft_365_raw
    | filter vendor = "Microsoft" and product = "Office 365"
    | filter outcome = "Success" and action_audit_operation = "FolderDeleted"
    | bin _time span=5m
    | comp count_distinct(action_audit_objectid) as distinct_files by _time, actor_user_upn
    | filter distinct_files >= 20
    | fields _time, actor_user_upn, distinct_files
  lucene: |
    event.code:"5177" AND Operation:"FolderDeleted"
  sumo: |
    _sourceCategory=*Windows*Security* OR _sourceCategory=*SharePoint* "FolderDeleted"
    | json field=_raw "Operation" as operation
    | json field=_raw "SourceUserName" as source_user
    | json field=_raw "ObjectId" as file_name
    | where operation = "FolderDeleted"
    | timeslice 5m
    | count_distinct(file_name) as distinct_files by _timeslice, source_user
    | where distinct_files >= 20
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '20 Sharepoint Events

  Where Operation Name is "FolderDeleted"

  With distinct File Names

  With the same Source Username

  Within 5 minutes'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — characterize the destructive action (encrypt, delete,
  lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

rule_id: TDL-IMP-000116
v4_id: '000116'
name: Unauthorized User Deletion
description: Detects when an unauthorized user deletes an account. This could be indicative of a user performing destructive behavior since this
  is commonly performed by domain admins.
tactic: Impact
tactic_id: TA0040
technique_id: T1531
technique_name: Account Access Removal
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4726'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4726

    | lookup authorized_user_modifiers.csv SubjectUserName OUTPUT authorized

    | where isnull(authorized) OR authorized!=1

    | table _time, ComputerName, SubjectUserName, TargetUserName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4726
    | where SubjectUserName !in ("Administrator", "SYSTEM", "admin", "svc_admin")
    | project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, TargetUserName, TargetDomainName, Activity
  aql: |
    SELECT username AS source_username, "Target Account Name" AS deleted_account, LOGSOURCENAME(logsourceid) AS host, eventtime
    FROM events
    WHERE "EventID" = '4726'
      AND username NOT IN ('svc_admin', 'domain_admin', 'helpdesk_admin', 'it_support')
    LAST 24 HOURS
  yara_l: "rule unauthorized_user_deletion_t1531 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects unauthorized user account deletion\
    \ via Event ID 4726\"\n    mitre_attack_tactic = \"Impact\"\n    mitre_attack_technique = \"T1531\"\n    severity = \"High\"\n\n  events:\n\
    \    $e.metadata.event_type = \"USER_DELETION\"\n    $e.metadata.product_event_type = \"4726\"\n    $e.principal.user.userid = $source_user\n\
    \    $e.target.user.userid = $deleted_user\n    \n    // Exclude authorized administrators\n    not re.regex($e.principal.user.userid, `(?i)(^Administrator$|^Domain\
    \ Admins$|^Enterprise Admins$|^Account Operators$)`)\n\n  match:\n    $source_user over 5m\n\n  outcome:\n    $risk_score = 85\n    $source_user_name\
    \ = $source_user\n    $deleted_account = $deleted_user\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*
    | WHERE @timestamp > NOW() - 24 hour AND event.code == "4726"
    | WHERE NOT winlog.event_data.SubjectUserName IN ("admin", "Administrator", "svc_automation", "SYSTEM")
    | KEEP @timestamp, host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.SubjectDomainName, winlog.event_data.TargetDomainName
  leql: |
    where(source_json.EventID=4726 AND source_json.SubjectUserName NOT IN ["authorized_user_1", "authorized_user_2", "authorized_user_3"])
  crowdstrike: |
    EventCode=4726
    | !in(field=SubjectUserName, values=["Administrator", "SYSTEM", "DomainAdmin", "BackupOperator"])
    | table([@timestamp, ComputerName, SubjectUserName, TargetUserName, SubjectDomainName, TargetDomainName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4726
    | filter actor_effective_username not in ("AdminUser1", "AdminUser2", "ServiceAccount1")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_TargetUserName, action_evtlog_message
  lucene: |
    event.code:4726 AND NOT winlog.event_data.SubjectUserName:(authorized_user1 OR authorized_user2 OR authorized_user3)
  sumo: |
    _sourceCategory=*Windows*Security* "4726"
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as source_user
    | json field=_raw "TargetUserName" as target_user
    | where event_id = "4726"
    | where !(source_user in ("Administrator", "DomainAdministrator", "ServiceAccount"))
    | fields _messageTime, _sourceHost, source_user, target_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows User Deletion Event \nWhere the Event ID is 4726\nWhere the Source Username is NOT on the Users Authorized to Modify\
  \ Users List"
suppression:
  window: 24 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

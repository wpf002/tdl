rule_id: TDL-IMP-000132
v4_id: '000132'
name: AWS Production Instance Terminations
description: Detects when multiple AWS production instances are terminated in a short amount of time. An attacker may terminate instances to destory
  data with the goal of negatively impacting the company’s operations.
tactic: Impact
tactic_id: TA0040
technique_id: T1489
technique_name: Service Stop
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=cloudtrail sourcetype=aws:cloudtrail (eventName=TerminateInstances OR eventName=DeleteInstance)

    | lookup aws_production_instances.csv instanceId OUTPUT instanceId as prod_instance

    | where isnotnull(prod_instance)

    | bin _time span=5m

    | stats dc(requestParameters.instancesSet.items{}.instanceId) as instance_count values(requestParameters.instancesSet.items{}.instanceId)
    as instances values(eventName) as event_names by _time, userIdentity.userName

    | where instance_count >= 3

    '
  kql: "AWSCloudTrail\n| where TimeGenerated > ago(24h)\n| where EventName in (\"TerminateInstances\", \"DeleteInstance\")\n| extend SourceUserName\
    \ = tostring(UserIdentityPrincipalid)\n| extend InstanceId = tostring(parse_json(RequestParameters).instanceId)\n| where isnotempty(InstanceId)\n\
    | summarize \n    EventCount = count(),\n    Instances = make_set(InstanceId),\n    EventNames = make_set(EventName),\n    StartTime = min(TimeGenerated),\n\
    \    EndTime = max(TimeGenerated)\n    by SourceUserName, bin(TimeGenerated, 5m)\n| where EventCount >= 3\n| where datetime_diff('minute',\
    \ EndTime, StartTime) <= 5\n| project StartTime, EndTime, SourceUserName, EventCount, Instances, EventNames\n"
  aql: |
    SELECT "userName" AS source_username, "eventName", "requestParameters" AS instance_details, sourceip, COUNT(*) AS deletion_count, UNIQUECOUNT("requestParameters") AS unique_instances
    FROM events
    WHERE "eventName" IN ('TerminateInstances', 'DeleteInstance')
      AND LOGSOURCETYPENAME(devicetype) ILIKE '%CloudTrail%'
    GROUP BY "userName", "eventName", "requestParameters", sourceip
    HAVING deletion_count >= 3
    LAST 5 MINUTES
  yara_l: |
    rule aws_rapid_production_instance_termination {
      meta:
        author = "Detection Engineer"
        description = "Detects 3+ termination events against production instances by same user within 5 minutes - T1489"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1489"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        (
          $e.metadata.product_event_type = "TerminateInstances" or
          $e.metadata.product_event_type = "DeleteInstance"
        )
        $e.target.resource.name = $instance
        $e.principal.user.userid = $user
        // Production instance check - adjust based on your reference list implementation
        $instance in %aws_production_instances

      match:
        $user over 5m

      condition:
        #e >= 3
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND event.action IN (\"TerminateInstances\", \"DeleteInstance\"\
    )\n| STATS instance_count = COUNT_DISTINCT(cloud.instance.id) BY user.name, window = BUCKET(@timestamp, 5 minutes)\n| WHERE instance_count\
    \ >= 3\n"
  leql: |
    where(source_json.eventName IN [TerminateInstances, DeleteInstance] AND source_json.requestParameters.instancesSet.items.instanceId IN AWS_Production_Instances_List) groupby(source_json.userIdentity.userName) calculate(count)
  crowdstrike: |
    #repo=cloudtrail EventName IN [TerminateInstances, DeleteInstance]
    | groupBy([userIdentity.principalId, instanceId], function=selectLast([eventTime, userIdentity.userName, eventName, awsRegion]))
    | groupBy([userIdentity.principalId], function=[count(as=event_count), collect([instanceId, eventTime, userIdentity.userName, eventName, awsRegion])])
    | event_count >= 3
    | bucket(field=eventTime, span=5m, function=count(as=window_count))
    | window_count >= 3
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and cloud.resource_type = "AWS Instance" and event_name in ("TerminateInstances", "DeleteInstance")
    | bin _time span=5m
    | comp count() as event_count by _time, actor_username
    | filter event_count >= 3
  lucene: |
    eventName:(TerminateInstances OR DeleteInstance) AND productionInstance:true AND eventSource:ec2.amazonaws.com
  sumo: |
    _sourceCategory=*CloudTrail* (TerminateInstances OR DeleteInstance)
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.userName" as user_name
    | json field=_raw "requestParameters.instancesSet.items[*].instanceId" as instance_id
    | where event_name in ("TerminateInstances", "DeleteInstance")
    | lookup production_instance from shared/aws_production_instances on instance_id=instance_id
    | where !isNull(production_instance)
    | timeslice 5m
    | count as event_count by _timeslice, user_name
    | where event_count >= 3
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '3 AWS CloudTrail Events

  Where the EventName is in [TerminateInstances, DeleteInstance]

  Where the Instance is found in the AWS Production Instances List

  With the same Source Username

  Within 5 minutes'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

rule_id: TDL-IMP-000188
v4_id: 000188
name: Wireless AP Deauthentication Flood
description: Detects a high volume of deauthentication events on an access point. The majority of wireless attacks begin with the attacker capturing
  a client’s authentication to the access point. An attacker will send a  high volume of deauthentication packets to kick a client off the network
  and force them to re-authenticate. This can also create a denial-of-service condition for the targeted clients if the attacker continues to
  send a high-volume of deauthentication packets.
tactic: Impact
tactic_id: TA0040
technique_id: T1498
technique_name: Network Denial of Service
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows sourcetype="WinEventLog:*" EventCode=100 EventName="*deauthentication*"

    | bin _time span=1m

    | stats count by _time, AccessPoint

    | where count >= 100

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 100
    | where RenderedDescription has "deauthentication" or EventData has "deauthentication"
    | extend AccessPoint = coalesce(Computer, DeviceName)
    | summarize deauth_count = count(), earliest = min(TimeGenerated), latest = max(TimeGenerated) by bin(TimeGenerated, 1m), AccessPoint
    | where deauth_count >= 100
    | union (
        SecurityEvent
        | where TimeGenerated > ago(1h)
        | where EventID == 1
        | where RenderedDescription has "Deauthentication Flood" or EventData has "Deauthentication Flood"
        | extend AccessPoint = coalesce(Computer, DeviceName)
        | project TimeGenerated, AccessPoint, EventID, RenderedDescription, EventData
    )
    | project TimeGenerated, AccessPoint, EventID, deauth_count, earliest, latest, RenderedDescription, EventData
  aql: |
    SELECT "Access Point", COUNT(*) AS deauth_count
    FROM events
    WHERE LOWER("Event Name") LIKE '%deauthentication%'
    GROUP BY "Access Point"
    HAVING deauth_count >= 100
    LAST 1 MINUTES
  yara_l: |
    rule wireless_deauth_flood_impact {
      meta:
        author = "Detection Engineer"
        description = "Detects wireless deauthentication flood attacks (T1498 - DoS)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1498"
        severity = "High"

      events:
        // Detect multiple deauthentication events from wireless logs
        $deauth.metadata.event_type = "NETWORK_CONNECTION"
        re.regex($deauth.metadata.description, `(?i)deauthentication`)
        $deauth.principal.asset.hardware.mac = $ap_mac
        $deauth.principal.hostname = $ap_host

        // Detect IDS/IPS signature for deauth flood
        $ids.metadata.event_type = "NETWORK_CONNECTION"
        re.regex($ids.security_result.detection_fields.value, `(?i)Deauthentication\s+Flood`)

      match:
        $ap_mac, $ap_host over 1m

      condition:
        #deauth >= 100 or $ids
    }
  esql: "FROM logs-windows.security*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.code == \"100\" \n  AND event.action LIKE \"*deauthentication*\"\
    \n| STATS event_count = COUNT(*) BY wireless.access_point, bucket = BUCKET(@timestamp, 1 minute)\n| WHERE event_count >= 100\n| KEEP bucket,\
    \ wireless.access_point, event_count\n"
  leql: |
    where(source_json.EventID=100 AND source_json.EventName ICONTAINS "deauthentication") groupby(source_json.AccessPoint) calculate(count)
  crowdstrike: |
    EventCode=100 EventName=*deauthentication*
    | groupBy([AccessPoint], function=count(as=deauth_count), limit=max, span=1m)
    | deauth_count >= 100
    | table([@timestamp, AccessPoint, deauth_count])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_NETWORK and (lowercase(action_evtlog_message) contains "deauthentication" or lowercase(action_evtlog_event_data_EventName) contains "deauthentication")
    | bin _time span=1m
    | comp count() as event_count by _time, action_network_access_point_name
    | filter event_count >= 100
    | fields _time, action_network_access_point_name, event_count
  lucene: |
    (event.code:"100" AND event.name:*deauthentication*) OR (event.category:"intrusion_detection" AND signature:*Deauthentication*Flood*)
  sumo: |
    _sourceCategory=*Wireless* OR _sourceCategory=*IDS* OR _sourceCategory=*IPS*
    | parse regex "(?<event_name>[^\|]+)" nodrop
    | parse regex "(?<signature>[^\|]+)" nodrop
    | parse regex "(?<access_point>[^\|]+)" nodrop
    | where (event_name matches "*deauthentication*" OR signature matches "*Deauthentication Flood*")
    | timeslice 1m
    | if (event_name matches "*deauthentication*", 1, 0) as is_deauth_event
    | if (signature matches "*Deauthentication Flood*", 1, 0) as is_ids_event
    | sum(is_deauth_event) as deauth_count, sum(is_ids_event) as ids_count by _timeslice, access_point
    | where deauth_count >= 100 OR ids_count >= 1
    | fields _timeslice, access_point, deauth_count, ids_count
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '100 Wireless Access Point Event

  Where the Event Name contains "deauthentication"

  With the same Access Point

  Within 1 minute


  ----------------------------------------------------------------------------------


  1 Wireless IDS/IPS Event

  Where the Signature contains "Deauthentication Flood"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

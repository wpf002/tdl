rule_id: TDL-IMP-000299
v4_id: 000299
name: Google Workspace Application Removed
description: Detects when a user removes an application from Google Workspace, rendering it unusable to users. This can represent an attempted
  denial of service.
tactic: Impact
tactic_id: TA0040
technique_id: T1489
technique_name: Service Stop
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=google:gws:admin events.name IN ("REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST")

    | table _time, user, events.name, ipAddress, actor.email, events.parameters.APPLICATION_NAME

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(1h)
    | where EventName in ("REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST")
    | project TimeGenerated, ActorEmail, EventName, OrganizationUnitPath, IPAddress, ActorType, Parameters
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS log_source, "Event Name", "Application Name", QIDNAME(qid) AS event_name
    FROM events
    WHERE ("Event Name" = 'REMOVE_APPLICATION' OR "Event Name" = 'REMOVE_APPLICATION_FROM_WHITELIST')
      AND LOGSOURCENAME(logsourceid) ILIKE '%Google Workspace%'
    LAST 24 HOURS
  yara_l: "rule gws_service_stop_remove_application {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects removal of\
    \ applications in Google Workspace - MITRE T1489\"\n    mitre_attack_tactic = \"Impact\"\n    mitre_attack_technique = \"T1489\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"Google Workspace\"\n    (\n      $e.metadata.product_event_type = \"REMOVE_APPLICATION\"\
    \ or\n      $e.metadata.product_event_type = \"REMOVE_APPLICATION_FROM_WHITELIST\"\n    )\n    $e.principal.user.userid = $user\n    \n  match:\n\
    \    $user over 1h\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action IN ("REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST")
    | KEEP @timestamp, user.email, event.action, source.ip, google_workspace.admin.application.name, google_workspace.organization.domain
  leql: |
    where(source_json.events.name IN ["REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST"])
  crowdstrike: |
    #type=google_workspace events.name IN ["REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST"]
    | table([@timestamp, actor.email, events.name, events.parameters.APPLICATION_NAME, ipAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and event_type = "GOOGLE_WORKSPACE" and events.name in ("REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST")
    | fields _time, actor_user, events.name, events.parameters, cloud_resource
  lucene: |
    events.name:(REMOVE_APPLICATION OR REMOVE_APPLICATION_FROM_WHITELIST)
  sumo: |
    _sourceCategory=*Google*Workspace*
    | json field=_raw "events[*].name" as event_name
    | where event_name in ("REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST")
    | fields _messageTime, _sourceHost, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is one of "REMOVE_APPLICATION", "REMOVE_APPLICATION_FROM_WHITELIST"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

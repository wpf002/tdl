rule_id: TDL-IMP-000300
v4_id: '000300'
name: Custom Google Workspace Email Route Created or Modified
description: Detects when a custom Gmail route is added or modified in Google Workspace. Adversaries can add a custom e-mail route for outbound
  mail to route these e-mails to their own inbox of choice for data gathering. This allows adversaries to capture sensitive information from e-mail
  and potential attachments, such as invoices or payment documents. By default, all email from current Google Workspace users with accounts are
  routed through a domain's mail server for inbound andoutbound mail.
tactic: Impact
tactic_id: TA0040
technique_id: T1498
technique_name: Network Denial of Service
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace sourcetype=gsuite:gmail:admin (events.name="CREATE_GMAIL_SETTING" OR events.name="CHANGE_GMAIL_SETTING") (SETTING_NAME="email_route"
    OR SETTING_NAME="message_security_rule")

    | table _time, actor.email, events.name, SETTING_NAME, events.parameters{}.value, org_unit_name

    '
  kql: |
    GWorkspace
    | where TimeGenerated > ago(24h)
    | where EventName in ("CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING")
    | where SettingName in ("email_route", "message_security_rule")
    | project TimeGenerated, EventName, SettingName, ActorEmail, ActorIpAddress, RecordId
  aql: |
    SELECT eventtime, username, LOGSOURCENAME(logsourceid) AS log_source, "events.name", "SETTING_NAME", sourceip
    FROM events
    WHERE ("events.name" = 'CREATE_GMAIL_SETTING' OR "events.name" = 'CHANGE_GMAIL_SETTING')
      AND ("SETTING_NAME" = 'email_route' OR "SETTING_NAME" = 'message_security_rule')
    LAST 24 HOURS
  yara_l: |
    rule google_workspace_gmail_route_or_security_rule_modification {
      meta:
        author = "TDL"
        description = "Detects modification of Gmail routing or message security rules in Google Workspace (T1498 - Impact)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1498"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Google Workspace"
        (
          $e.metadata.product_event_type = "CREATE_GMAIL_SETTING" or
          $e.metadata.product_event_type = "CHANGE_GMAIL_SETTING"
        )
        (
          re.regex($e.target.resource.attribute.labels["SETTING_NAME"], `(?i)email_route`) or
          re.regex($e.target.resource.attribute.labels["SETTING_NAME"], `(?i)message_security_rule`)
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action IN ("CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING")
      AND (google_workspace.admin.setting.name == "email_route" OR google_workspace.admin.setting.name == "message_security_rule")
    | KEEP @timestamp, user.name, user.email, event.action, google_workspace.admin.setting.name, google_workspace.admin.new_value, google_workspace.admin.old_value, source.ip
  leql: |
    where(source_json.events.name IN ["CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING"] AND source_json.SETTING_NAME IN ["email_route", "message_security_rule"])
  crowdstrike: |
    #type=google_workspace events.name IN ["CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING"] SETTING_NAME IN ["email_route", "message_security_rule"]
    | table([@timestamp, actor.email, events.name, SETTING_NAME, ComputerName])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and logon_type = "Workspace"
    | filter outcome = "success" and operation_name in ("CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING")
    | filter action_resource_name contains "email_route" or action_resource_name contains "message_security_rule"
    | fields _time, actor_user, operation_name, action_resource_name, action_resource, caller_ip, target_resource
  lucene: |
    events.name:("CREATE_GMAIL_SETTING" OR "CHANGE_GMAIL_SETTING") AND SETTING_NAME:("email_route" OR "message_security_rule")
  sumo: |
    _sourceCategory=*Google*Workspace* (events.name="CREATE_GMAIL_SETTING" OR events.name="CHANGE_GMAIL_SETTING")
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_name
    | json field=_raw "events[*].parameters[*].value" as param_value
    | where event_name in ("CREATE_GMAIL_SETTING", "CHANGE_GMAIL_SETTING")
    | where param_name = "SETTING_NAME" and param_value in ("email_route", "message_security_rule")
    | fields _messageTime, _sourceHost, event_name, param_name, param_value
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is one of "CREATE_GMAIL_SETTING" or "CHANGE_GMAIL_SETTING"

  And the SETTING_NAME is one of "email_route" or "message_security_rule"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

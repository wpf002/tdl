rule_id: TDL-IMP-000326
v4_id: '000326'
name: EC2 Outbound Denial of Service Activity - GuardDuty
description: Detects when GuardDuty alerts on when a high amount of outbound traffic is sourcing from an EC2 instance. This could be indicative
  of the EC2 instnace being compromised and being used in a denial of service attack.
tactic: Impact
tactic_id: TA0040
technique_id: T1498
technique_name: Network Denial Of Service
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatch:guardduty detail.type="Backdoor:EC2/DenialOfService*"

    | table _time, detail.accountId, detail.region, detail.resource.instanceDetails.instanceId, detail.type, detail.severity, detail.description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title has "Backdoor:EC2/DenialOfService"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(Resource.InstanceDetails.InstanceId), InstanceType = tostring(Resource.InstanceDetails.InstanceType)
  aql: |
    SELECT eventtime, sourceip, destinationip, qidname(qid), LOGSOURCENAME(logsourceid), "Event Type", "Resource Type", "Instance ID", "Severity"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Event Type" LIKE '%Backdoor:EC2/DenialOfService%'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_dos_backdoor {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty Backdoor:EC2/DenialOfService findings indicating potential DoS activity from compromised EC2 instances"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1498"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        re.regex($e.metadata.product_event_type, `Backdoor:EC2/DenialOfService`)
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE @timestamp > NOW() - 24 hours AND event.type LIKE "*Backdoor:EC2/DenialOfService*"
    | KEEP @timestamp, cloud.account.id, cloud.region, host.id, event.type, event.action, event.severity, source.ip, destination.ip
  leql: |
    where(source_json.type ICONTAINS "Backdoor:EC2/DenialOfService")
  crowdstrike: |
    #type=guardduty event.type=*Backdoor:EC2/DenialOfService*
    | table([@timestamp, account, region, event.type, resource.instanceDetails.instanceId, service.action.networkConnectionAction.remoteIpDetails.ipAddressV4, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logtype = "GuardDuty"
    | filter lowercase(raw_log_json.type) contains "backdoor:ec2/denialofservice"
    | fields _time, cloud_provider_account, cloud_provider_region, raw_log_json.type, raw_log_json.severity, raw_log_json.resource.instanceDetails.instanceId, raw_log_json.description
  lucene: |
    event.type:*Backdoor\:EC2\/DenialOfService*
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type matches "*Backdoor:EC2/DenialOfService*"
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type contains \"Backdoor:EC2/DenialOfService\""
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — characterize the destructive action (encrypt, delete, lockout, disable,
  reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

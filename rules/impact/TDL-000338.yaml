rule_id: TDL-IMP-000338
v4_id: 000338
name: AWS Crypto Network Activity - GuardDuty
description: Detects when EC2 instance is making connections to an address or domain associated with crypto currency
tactic: Impact
tactic_id: TA0040
technique_id: T1496
technique_name: Resource Hijacking
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=main sourcetype=aws:cloudwatch:guardduty \n(type=\"CryptoCurrency:EC2/BitcoinTool.B\" OR type=\"CryptoCurrency:EC2/BitcoinTool.B!DNS\"\
    \ OR type=\"Impact:EC2/BitcoinDomainRequest.Reputation\" OR type=\"CryptoCurrency:Lambda/BitcoinTool.B\" OR type=\"CryptoCurrency:Runtime/BitcoinTool.B\"\
    \ OR type=\"CryptoCurrency:Runtime/BitcoinTool.B!DNS\" OR type=\"Impact:Runtime/BitcoinDomainRequest.Reputation\")\n| table _time, type, id,\
    \ resource.instanceDetails.instanceId, resource.instanceDetails.availabilityZone, resource.lambdaDetails.functionName, resource.ecsClusterDetails.name,\
    \ service.action.actionType, severity, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("CryptoCurrency:EC2/BitcoinTool.B", "CryptoCurrency:EC2/BitcoinTool.B!DNS", "Impact:EC2/BitcoinDomainRequest.Reputation", "CryptoCurrency:Lambda/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B!DNS", "Impact:Runtime/BitcoinDomainRequest.Reputation")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(parse_json(Resource).InstanceDetails.InstanceId), AwsAccountId = tostring(parse_json(AccountId))
  aql: |
    SELECT QIDNAME(qid) AS event_name, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, eventtime, "Finding Type" AS finding_type, "Resource Type" AS resource_type, "Instance ID" AS instance_id
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND ("Finding Type" IN ('CryptoCurrency:EC2/BitcoinTool.B', 'CryptoCurrency:EC2/BitcoinTool.B!DNS', 'Impact:EC2/BitcoinDomainRequest.Reputation', 'CryptoCurrency:Lambda/BitcoinTool.B', 'CryptoCurrency:Runtime/BitcoinTool.B', 'CryptoCurrency:Runtime/BitcoinTool.B!DNS', 'Impact:Runtime/BitcoinDomainRequest.Reputation')
           OR QIDNAME(qid) IN ('CryptoCurrency:EC2/BitcoinTool.B', 'CryptoCurrency:EC2/BitcoinTool.B!DNS', 'Impact:EC2/BitcoinDomainRequest.Reputation', 'CryptoCurrency:Lambda/BitcoinTool.B', 'CryptoCurrency:Runtime/BitcoinTool.B', 'CryptoCurrency:Runtime/BitcoinTool.B!DNS', 'Impact:Runtime/BitcoinDomainRequest.Reputation'))
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_cryptocurrency_mining_t1496 {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty cryptocurrency mining alerts (T1496 - Resource Hijacking)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1496"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "CryptoCurrency:EC2/BitcoinTool.B" or
          $e.metadata.product_event_type = "CryptoCurrency:EC2/BitcoinTool.B!DNS" or
          $e.metadata.product_event_type = "Impact:EC2/BitcoinDomainRequest.Reputation" or
          $e.metadata.product_event_type = "CryptoCurrency:Lambda/BitcoinTool.B" or
          $e.metadata.product_event_type = "CryptoCurrency:Runtime/BitcoinTool.B" or
          $e.metadata.product_event_type = "CryptoCurrency:Runtime/BitcoinTool.B!DNS" or
          $e.metadata.product_event_type = "Impact:Runtime/BitcoinDomainRequest.Reputation"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CryptoCurrency:EC2/BitcoinTool.B", "CryptoCurrency:EC2/BitcoinTool.B!DNS", "Impact:EC2/BitcoinDomainRequest.Reputation", "CryptoCurrency:Lambda/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B!DNS", "Impact:Runtime/BitcoinDomainRequest.Reputation")
    | KEEP @timestamp, cloud.account.id, cloud.region, cloud.provider, event.type, event.action, event.severity, aws.guardduty.resource.resource_type, aws.guardduty.resource.instance_details.instance_id, host.name, message
  leql: |
    where(source_json.type IN ["CryptoCurrency:EC2/BitcoinTool.B", "CryptoCurrency:EC2/BitcoinTool.B!DNS", "Impact:EC2/BitcoinDomainRequest.Reputation", "CryptoCurrency:Lambda/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B!DNS", "Impact:Runtime/BitcoinDomainRequest.Reputation"])
  crowdstrike: |
    #repo=guardduty event_simpleName=GuardDutyFinding
    (Type="CryptoCurrency:EC2/BitcoinTool.B" OR Type="CryptoCurrency:EC2/BitcoinTool.B!DNS" OR Type="Impact:EC2/BitcoinDomainRequest.Reputation" OR Type="CryptoCurrency:Lambda/BitcoinTool.B" OR Type="CryptoCurrency:Runtime/BitcoinTool.B" OR Type="CryptoCurrency:Runtime/BitcoinTool.B!DNS" OR Type="Impact:Runtime/BitcoinDomainRequest.Reputation")
    | table([@timestamp, AccountId, Region, Type, Severity, Resource.InstanceDetails.InstanceId, Resource.LambdaDetails.FunctionName])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and event_type = "GuardDuty Finding"
    | filter raw_log.detail.type in ("CryptoCurrency:EC2/BitcoinTool.B", "CryptoCurrency:EC2/BitcoinTool.B!DNS", "Impact:EC2/BitcoinDomainRequest.Reputation", "CryptoCurrency:Lambda/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B!DNS", "Impact:Runtime/BitcoinDomainRequest.Reputation")
    | fields _time, cloud_provider, raw_log.detail.type, raw_log.detail.severity, raw_log.detail.resource, raw_log.detail.title, raw_log.detail.description, raw_log.accountId, raw_log.region
  lucene: |
    event_type:("CryptoCurrency:EC2/BitcoinTool.B" OR "CryptoCurrency:EC2/BitcoinTool.B!DNS" OR "Impact:EC2/BitcoinDomainRequest.Reputation" OR "CryptoCurrency:Lambda/BitcoinTool.B" OR "CryptoCurrency:Runtime/BitcoinTool.B" OR "CryptoCurrency:Runtime/BitcoinTool.B!DNS" OR "Impact:Runtime/BitcoinDomainRequest.Reputation")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("CryptoCurrency:EC2/BitcoinTool.B", "CryptoCurrency:EC2/BitcoinTool.B!DNS", "Impact:EC2/BitcoinDomainRequest.Reputation", "CryptoCurrency:Lambda/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B", "CryptoCurrency:Runtime/BitcoinTool.B!DNS", "Impact:Runtime/BitcoinDomainRequest.Reputation")
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CryptoCurrency:EC2/BitcoinTool.B\", \"CryptoCurrency:EC2/BitcoinTool.B!DNS\"\
  , \"Impact:EC2/BitcoinDomainRequest.Reputation\",\"CryptoCurrency:Lambda/BitcoinTool.B\",\"CryptoCurrency:Runtime/BitcoinTool.B\",\"CryptoCurrency:Runtime/BitcoinTool.B!DNS\"\
  ,\"Impact:Runtime/BitcoinDomainRequest.Reputation\",\"Impact:Runtime/BitcoinDomainRequest.Reputation\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — characterize the destructive action (encrypt,
  delete, lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

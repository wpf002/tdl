rule_id: TDL-IMP-000580
v4_id: 000580
name: Deployment Deleted From Kubernetes Cluster
description: 'Detects the removal of a deployment from a Kubernetes cluster. This could indicate disruptive activity aiming to impact business
  operations. Sigma rule by "Leo Tsaousis (@laripping)"


  ref: https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Data%20destruction/'
tactic: Impact
tactic_id: TA0040
technique_id: T1498
technique_name: Network Denial of Service
platform:
- Windows
data_sources:
- Kubernetes
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=kubernetes sourcetype=kube:events object.kind="Deployment" verb="delete"

    | table _time, user.username, object.metadata.name, object.metadata.namespace, verb, sourceIPs{}

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where ObjectKind =~ "Deployment"
    | where Verb =~ "delete"
    | project TimeGenerated, Namespace, ObjectName, Verb, ObjectKind, User, SourceIPs, UserAgent, ResponseCode, RequestURI
  aql: "SELECT eventtime, username, sourceip, \"Resource\", \"Verb\", LOGSOURCENAME(logsourceid) AS source\nFROM events\nWHERE \"Resource\" =\
    \ 'deployments' \n  AND \"Verb\" = 'delete'\nLAST 24 HOURS\n"
  yara_l: |
    rule kubernetes_deployment_deletion {
      meta:
        author = "TDL"
        description = "Detects deletion of Kubernetes deployments - potential DoS activity (T1498)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1498"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "RESOURCE_DELETION"
        $e.target.resource.type = "deployments"
        $e.target.resource.attribute.labels["verb"] = "delete"
        $e.principal.user.userid = $user
        $e.target.resource.name = $deployment

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 1 hour \n  AND kubernetes.audit.objectRef.resource == \"deployments\" \n  AND\
    \ kubernetes.audit.verb == \"delete\"\n| KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name,\
    \ kubernetes.audit.sourceIPs, kubernetes.audit.requestURI\n"
  leql: |
    where(source_json.objectRef.resource="deployments" AND source_json.verb="delete")
  crowdstrike: |
    #type=kubernetesAudit objectRef.resource=deployments verb=delete
    | table([@timestamp, user.username, objectRef.namespace, objectRef.name, sourceIPs, userAgent])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "KUBERNETES" and json_extract_scalar(raw_log, "$.objectRef.resource") = "deployments" and json_extract_scalar(raw_log, "$.verb") = "delete"
    | fields _time, json_extract_scalar(raw_log, "$.objectRef.namespace") as namespace, json_extract_scalar(raw_log, "$.objectRef.name") as deployment_name, json_extract_scalar(raw_log, "$.user.username") as username, json_extract_scalar(raw_log, "$.sourceIPs") as source_ips
  lucene: |
    kubernetes.audit.objectRef.resource:deployments AND kubernetes.audit.verb:delete
  sumo: |
    _sourceCategory=*Kubernetes* "delete" "deployments"
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | where verb = "delete" and resource = "deployments"
    | fields _messageTime, _sourceHost, verb, resource
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Resource is \"deployments\"\nWhere Verb is \"delete\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — characterize the destructive action (encrypt, delete,
  lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

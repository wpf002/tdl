rule_id: TDL-IMP-000645
v4_id: '000645'
name: Possible Ransomware Detected - Varonis
description: Detects when multiple files have been encrypted within a short period. This could be related to the modification of file extensions
  or the creation of files with known ransomware related extensions.
tactic: Impact
tactic_id: TA0040
technique_id: T1486
technique_name: Data Encrypted for Impact
platform:
- Windows
data_sources:
- Varonis
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=varonis sourcetype=varonis:datalert Alert_Name IN ("File encrypted by ransomware", "Immediate pattern detected: user actions resemble
    ransomware", "Suspected ransomware intrusion activity", "Potential encryption of multiple files")

    | table _time, Alert_Name, User, host, src, Object_Name, Object_Type

    '
  kql: |
    VaronisDatAdvantage
    | where TimeGenerated > ago(1h)
    | where AlertName in ("File encrypted by ransomware","Immediate pattern detected: user actions resemble ransomware","Suspected ransomware intrusion activity","Potential encryption of multiple files")
    | project TimeGenerated, AlertName, UserName, DeviceName, FilePath, Severity, Description
  aql: "SELECT DATEFORMAT(eventtime, 'yyyy-MM-dd HH:mm:ss') AS alert_time, \n       LOGSOURCENAME(logsourceid) AS log_source, \n       \"Alert\
    \ Name\", \n       username, \n       sourceip, \n       \"File Path\", \n       \"Affected Resource\",\n       COUNT(*) AS alert_count\n\
    FROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%Varonis%'\n  AND \"Alert Name\" IN ('File encrypted by ransomware', \n             \
    \          'Immediate pattern detected: user actions resemble ransomware', \n                       'Suspected ransomware intrusion activity',\
    \ \n                       'Potential encryption of multiple files')\nGROUP BY \"Alert Name\", username, sourceip, \"File Path\", \"Affected\
    \ Resource\", logsourceid, eventtime\nORDER BY eventtime DESC\nLAST 24 HOURS\n"
  yara_l: |
    rule varonis_ransomware_alerts {
      meta:
        author = "TDL"
        description = "Detects Varonis DatAdvantage ransomware-related alerts (T1486 - Data Encrypted for Impact)"
        mitre_attack_tactic = "Impact"
        mitre_attack_technique = "T1486"
        severity = "HIGH"

      events:
        $alert.metadata.vendor_name = "Varonis"
        $alert.metadata.product_name = "DatAdvantage"
        (
          $alert.security_result.summary = "File encrypted by ransomware" or
          $alert.security_result.summary = "Immediate pattern detected: user actions resemble ransomware" or
          $alert.security_result.summary = "Suspected ransomware intrusion activity" or
          $alert.security_result.summary = "Potential encryption of multiple files"
        )
        $alert.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 95

      condition:
        $alert
    }
  esql: |
    FROM logs-varonis.datadvantage*
    | WHERE varonis.alert.name IN ("File encrypted by ransomware", "Immediate pattern detected: user actions resemble ransomware", "Suspected ransomware intrusion activity", "Potential encryption of multiple files")
    | KEEP @timestamp, host.name, user.name, varonis.alert.name, varonis.alert.severity, source.ip, file.path
  leql: |
    where(source_json.AlertName IN ["File encrypted by ransomware","Immediate pattern detected: user actions resemble ransomware","Suspected ransomware intrusion activity","Potential encryption of multiple files"])
  crowdstrike: "#type=VaronisDatAdvantage \n| AlertName in [\"File encrypted by ransomware\",\"Immediate pattern detected: user actions resemble\
    \ ransomware\",\"Suspected ransomware intrusion activity\",\"Potential encryption of multiple files\"]\n| table([@timestamp, ComputerName,\
    \ UserName, AlertName, AlertDescription, FileName, FilePath])\n"
  xql: |
    dataset = varonis_datadvantage_raw
    | filter alert_name in ("File encrypted by ransomware", "Immediate pattern detected: user actions resemble ransomware", "Suspected ransomware intrusion activity", "Potential encryption of multiple files")
    | fields _time, alert_name, alert_severity, user_name, affected_resource, host_name, alert_description
  lucene: |
    Alert_Name:("File encrypted by ransomware" OR "Immediate pattern detected: user actions resemble ransomware" OR "Suspected ransomware intrusion activity" OR "Potential encryption of multiple files")
  sumo: "_sourceCategory=*Varonis* \n| json field=_raw \"AlertName\" as alert_name\n| where alert_name in (\"File encrypted by ransomware\", \"\
    Immediate pattern detected: user actions resemble ransomware\", \"Suspected ransomware intrusion activity\", \"Potential encryption of multiple\
    \ files\")\n| fields _messageTime, _sourceHost, alert_name\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- impact
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 VaronisDatAdvantage Alert

  Where the Alert Name is in ["File encrypted by ransomware","Immediate pattern detected: user actions resemble ransomware","Suspected ransomware
  intrusion activity","Potential encryption of multiple files"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — characterize the destructive action (encrypt, delete,
  lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'

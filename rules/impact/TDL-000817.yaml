rule_id: TDL-IMP-000817
v4_id: 000817
name: Direct Write to Physical Drive or Partition Boot Sector
description: Process opens \\.\PhysicalDrive0 / /dev/sda with write and writes ≥1MB. Boot-sector wipe. Generated from gap analysis against canonical
  ATT&CK Enterprise matrix (T1561 under Impact).
tactic: Impact
tactic_id: TA0040
technique_id: T1561
technique_name: Disk Wipe
platform:
- Windows
- Linux
data_sources:
- Sysmon
- EDR
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=* (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=23 TargetFilename="\\\\*\\PhysicalDrive*") OR (sourcetype
    IN (sysmon, edr*) (file_path="/dev/sd*" OR TargetFilename="/dev/sd*"))

    | eval bytes_written=coalesce(BytesWritten, bytes_written, size, file_size, 0)

    | where bytes_written >= 1048576

    | table _time, host, ComputerName, User, SourceUser, user, Image, process, process_name, TargetFilename, file_path, bytes_written

    '
  kql: |
    DeviceFileEvents
    | where TimeGenerated > ago(1h)
    | where (FileName has_any ("PhysicalDrive0", "sda") and FolderPath has_any ("\\\\.\\PhysicalDrive0", "/dev/sda"))
    | where ActionType in ("FileCreated", "FileModified")
    | extend SizeWrittenMB = todouble(FileSize) / 1048576
    | where SizeWrittenMB >= 1
    | project TimeGenerated, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FolderPath, FileName, SizeWrittenMB, ActionType
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Image", "TargetObject", "TargetFilename", COUNT(*) AS access_count
    FROM events
    WHERE ("EventID" = '23' OR "EventID" = '11' OR "EventID" = '15')
      AND (("TargetObject" ILIKE '%\\.\PhysicalDrive0%' OR "TargetFilename" ILIKE '%\\.\PhysicalDrive0%' OR "TargetObject" ILIKE '%/dev/sda%' OR "TargetFilename" ILIKE '%/dev/sda%'))
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), username, "Process Name", "Image", "TargetObject", "TargetFilename"
    LAST 1 HOURS
  yara_l: "rule disk_wiping_boot_sector {\n  meta:\n    author = \"TDL\"\n    description = \"Detects direct physical drive access with write\
    \ operations >= 1MB indicative of boot sector wiping (T1561)\"\n    mitre_attack_tactic = \"Impact\"\n    mitre_attack_technique = \"T1561\"\
    \n    severity = \"HIGH\"\n  \n  events:\n    $e.metadata.event_type = \"FILE_OPEN\"\n    (\n      re.regex($e.target.file.full_path, `(?i)\\\
    \\\\\\\\.\\\\PhysicalDrive[0-9]+`) or\n      re.regex($e.target.file.full_path, `^/dev/sd[a-z]$`) or\n      re.regex($e.target.file.full_path,\
    \ `^/dev/hd[a-z]$`)\n    )\n    (\n      re.regex($e.security_result.summary, `(?i)write`) or\n      $e.target.file.access_mask = \"WRITE\"\
    \ or\n      $e.target.file.access_mask = \"READ_WRITE\"\n    )\n    $e.principal.hostname = $host\n    $e.principal.process.file.full_path\
    \ = $process\n    $e.target.resource.size >= 1048576\n  \n  match:\n    $host, $process over 5m\n  \n  outcome:\n    $risk_score = 95\n  \
    \  $device = $host\n    $process_path = $process\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.file*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (winlog.event_id == "10" AND (
          TO_LOWER(winlog.event_data.TargetImage) LIKE "*physicaldrive0*" OR
          TO_LOWER(winlog.event_data.TargetImage) LIKE "*\\\\.\\physicaldrive0*"
        ))
        OR (file.path LIKE "*PhysicalDrive0*" OR file.path LIKE "*/dev/sda*")
      )
      AND (event.action == "File created" OR event.action == "deletion" OR winlog.event_data.GrantedAccess IS NOT NULL)
    | EVAL write_access = CASE(
        winlog.event_data.GrantedAccess IS NOT NULL, winlog.event_data.GrantedAccess,
        event.action == "File created" OR event.action == "deletion", "write",
        "unknown"
      )
    | WHERE write_access != "unknown"
    | STATS total_bytes = SUM(COALESCE(file.size, 1048576)), events = COUNT(*) BY host.name, process.name, process.executable, user.name, file.path
    | WHERE total_bytes >= 1048576
    | KEEP @timestamp, host.name, process.name, process.executable, user.name, file.path, total_bytes, events
  leql: |
    where(source_json.EventID=10 AND (source_json.TargetObject ICONTAINS "\\.\PhysicalDrive" OR source_json.TargetObject ICONTAINS "/dev/sd") AND source_json.GrantedAccess=/.*WRITE.*/) groupby(source_json.SourceImage, asset, source_json.TargetObject) calculate(count)
  crowdstrike: |
    (event_simpleName=ProcessRollup2 OR EventCode=1) (CommandLine=*\\\\.\\PhysicalDrive* OR CommandLine=*/dev/sd* OR TargetFileName=*\\\\.\\PhysicalDrive* OR TargetFileName=*/dev/sd*)
    | regex("(?<device>(\\\\\\\\\\.\\\\PhysicalDrive\\d+|/dev/sd[a-z]))", field=CommandLine, strict=false)
    | regex("(?<device>(\\\\\\\\\\.\\\\PhysicalDrive\\d+|/dev/sd[a-z]))", field=TargetFileName, strict=false)
    | groupBy([ComputerName, FileName, SHA256HashData, device], function=count(as=access_count))
    | access_count >= 1
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, SHA256HashData, device, access_count])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE_WRITE
    | filter (action_file_path ~= "(?i)\\\\\.\\\\PhysicalDrive[0-9]+" or action_file_path ~= "(?i)/dev/sd[a-z]")
    | comp sum(action_file_size) as total_bytes by agent_hostname, actor_process_image_name, action_file_path
    | filter total_bytes >= 1048576
    | fields agent_hostname, actor_process_image_name, action_file_path, total_bytes
  lucene: |
    (event.code:10 OR event.code:1) AND ((winlog.event_data.TargetObject:"\\.\PhysicalDrive*" OR process.command_line:*"\\\\.\\PhysicalDrive"* OR file.path:"\\.\PhysicalDrive*") OR (file.path:"/dev/sd*" OR process.command_line:*"/dev/sd"*)) AND (winlog.event_data.GrantedAccess:(*WRITE* OR *0x2* OR *0x4* OR *0x40000*) OR event.action:*write* OR file.access:write)
  sumo: |
    _sourceCategory=*Sysmon* OR _sourceCategory=*EDR*
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetObject" as target_object
    | json field=_raw "Image" as image
    | json field=_raw "Device" as device
    | json field=_raw "ProcessName" as process_name
    | json field=_raw "FileName" as file_name
    | json field=_raw "BytesWritten" as bytes_written_str
    | where (target_object matches "*\\\\.\\PhysicalDrive0*" OR target_object matches "*/dev/sda*" OR device matches "*PhysicalDrive0*" OR device matches "*/dev/sda*" OR file_name matches "*PhysicalDrive0*" OR file_name matches "*/dev/sda*")
    | parse field=bytes_written_str /(?<bytes_written>\d+)/ nodrop
    | where (isNull(bytes_written) OR num(bytes_written) >= 1048576)
    | fields _messageTime, _sourceHost, event_id, image, process_name, target_object, device, file_name, bytes_written
pseudo_logic: Process opens \\.\PhysicalDrive0 / /dev/sda with write and writes ≥1MB. Boot-sector wipe.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

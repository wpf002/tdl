rule_id: TDL-IMP-000819
v4_id: 000819
name: BIOS/UEFI Flash Operation From User Context
description: Direct invocation of fwupdmgr, afuwin.exe, AFU /B, or write to \Device\NTPNP_PCI* with FW update IOCTL outside vendor management
  agent. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1495 under Impact).
tactic: Impact
tactic_id: TA0040
technique_id: T1495
technique_name: Firmware Corruption
platform:
- Windows
- Linux
data_sources:
- EDR
- Firmware Telemetry
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: "(index=edr OR index=firmware) \n(\n  (process_name IN (\"fwupdmgr\", \"fwupdmgr.exe\", \"afuwin.exe\", \"AFU.exe\", \"afu.exe\") NOT (parent_process_name\
    \ IN (\"gnome-software\", \"fwupd-refresh.service\", \"Dell*\", \"HP*\", \"Lenovo*\", \"*VendorAgent*\")))\n  OR\n  (CommandLine IN (\"*fwupdmgr*\"\
    , \"*afuwin*\", \"*AFU /B*\", \"*afu /b*\") NOT (ParentImage IN (\"*Dell*\", \"*HP*\", \"*Lenovo*\", \"*VendorAgent*\", \"*gnome-software*\"\
    )))\n  OR\n  ((file_path=\"*\\\\Device\\\\NTPNP_PCI*\" OR object_name=\"*\\\\Device\\\\NTPNP_PCI*\") ioctl_code IN (\"0x22C007\", \"0x22C00B\"\
    , \"0x22000B\") NOT (Image IN (\"*Dell*\", \"*HP*\", \"*Lenovo*\", \"*VendorAgent*\")))\n)\n| table _time, host, ComputerName, process_name,\
    \ Image, CommandLine, parent_process_name, ParentImage, file_path, object_name, ioctl_code, user, User\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("afuwin.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('afuwin.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_imp_000819 {\n  meta:\n    author = \"TDL\"\n    description = \"BIOS/UEFI Flash Operation From User Context\"\n    severity\
    \ = \"CRITICAL\"\n    tactic = \"TA0040\"\n    technique = \"T1495\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /(afuwin.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("afuwin.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [afuwin.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (afuwin.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("afuwin.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(afuwin.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("afuwin.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Direct invocation of fwupdmgr, afuwin.exe, AFU /B, or write to \Device\NTPNP_PCI* with FW update IOCTL outside vendor management
  agent.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

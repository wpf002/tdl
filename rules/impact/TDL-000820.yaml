rule_id: TDL-IMP-000820
v4_id: 000820
name: Forced Shutdown Issued From User Process
description: shutdown /r /f /t 0, shutdown -r now, or systemctl poweroff issued by non-admin user-context process outside change windows. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1529 under Impact).
tactic: Impact
tactic_id: TA0040
technique_id: T1529
technique_name: System Shutdown/Reboot
platform:
- Windows
- Linux
data_sources:
- Sysmon
- Windows Event Log
severity: Medium
fidelity: High
lifecycle: Proposed
risk_score: 60
queries:
  spl: "index=wineventlog (sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1) OR (index=linux sourcetype IN (linux_secure,\
    \ syslog))\n(CommandLine=\"*shutdown*\" OR CommandLine=\"*poweroff*\" OR CommandLine=\"*reboot*\" OR CommandLine=\"*systemctl*\")\n(CommandLine=\"\
    *shutdown*/r*\" OR CommandLine=\"*shutdown*/f*\" OR CommandLine=\"*shutdown*-r*\" OR CommandLine=\"*shutdown*now*\" OR CommandLine=\"*poweroff*\"\
    \ OR CommandLine=\"*systemctl*poweroff*\" OR CommandLine=\"*systemctl*reboot*\" OR CommandLine=\"*init*0*\" OR CommandLine=\"*init*6*\")\n\
    NOT (User=\"NT AUTHORITY\\\\SYSTEM\" OR User=\"SYSTEM\" OR User=\"root\" OR User=\"Administrator\" OR User=\"*admin*\")\n| eval shutdown_command=case(\n\
    \    match(CommandLine, \"shutdown.*(/r|/f|-r|now)\"), \"shutdown\",\n    match(CommandLine, \"systemctl.*(poweroff|reboot)\"), \"systemctl\"\
    ,\n    match(CommandLine, \"init\\s+[06]\"), \"init\",\n    1=1, \"other\"\n)\n| table _time, ComputerName, host, User, Image, ParentImage,\
    \ CommandLine, shutdown_command\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where CommandLine has_any ("shutdown /r", "shutdown /f", "shutdown -r now", "systemctl poweroff", "systemctl reboot")
    | where CommandLine !has "shutdown.exe /s"
    | where AccountType != "User" or SubjectUserSid !endswith "-500"
    | extend IsAdmin = iff(SubjectUserSid endswith "-500" or SubjectUserSid has "S-1-5-32-544", true, false)
    | where IsAdmin == false
    | project TimeGenerated, Computer, Account, SubjectUserName, CommandLine, ParentProcessName, ProcessId
    ```

    Wait, I need to reconsider. Let me write this properly for Sysmon EventID 1 (process creation) in SecurityEvent or Event table:

    ```
    union SecurityEvent, Event
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | extend CommandLine = coalesce(column_ifexists("CommandLine", ""), tostring(EventData.CommandLine))
    | where CommandLine has_any ("shutdown /r", "shutdown /f", "shutdown -r now", "systemctl poweroff", "systemctl reboot", "init 6", "reboot")
    | extend User = coalesce(column_ifexists("SubjectUserName", ""), tostring(EventData.User))
    | extend Computer = coalesce(column_ifexists("Computer", ""), tostring(EventData.Computer))
    | extend Image = coalesce(column_ifexists("Process", ""), tostring(EventData.Image))
    | extend ParentImage = tostring(EventData.ParentImage)
    | where User !has "$" and User !in~ ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
    | project TimeGenerated, Computer, User, Image, ParentImage, CommandLine
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"Process CommandLine\", \"Process Name\", \"Parent Process Name\", sourceip\n\
    FROM events\nWHERE (\n  (\"Process CommandLine\" ILIKE '%shutdown%/r%/f%/t%0%' OR \n   \"Process CommandLine\" ILIKE '%shutdown%/r%/t%0%/f%'\
    \ OR\n   \"Process CommandLine\" ILIKE '%shutdown%-r%now%' OR\n   \"Process CommandLine\" ILIKE '%systemctl%poweroff%' OR\n   \"Process CommandLine\"\
    \ ILIKE '%systemctl%reboot%' OR\n   \"Process CommandLine\" ILIKE '%init%0%' OR\n   \"Process CommandLine\" ILIKE '%reboot%now%')\n  AND username\
    \ NOT IN ('SYSTEM', 'root', 'NT AUTHORITY\\\\SYSTEM')\n  AND username IS NOT NULL\n)\nLAST 1 HOURS\n"
  yara_l: "rule system_shutdown_by_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects system shutdown commands issued by\
    \ non-admin users\"\n    mitre_attack_tactic = \"Impact\"\n    mitre_attack_technique = \"T1529\"\n    severity = \"HIGH\"\n\n  events:\n\
    \    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      (\n        re.regex($e.principal.process.file.full_path, `(?i)shutdown\\.exe$`)\
    \ and\n        re.regex($e.principal.process.command_line, `(?i)/r.*(/f|/t\\s*0)`) \n      ) or\n      (\n        re.regex($e.principal.process.file.full_path,\
    \ `(?i)/sbin/shutdown$`) and\n        re.regex($e.principal.process.command_line, `(?i)-r\\s+now`)\n      ) or\n      (\n        re.regex($e.principal.process.file.full_path,\
    \ `(?i)systemctl$`) and\n        re.regex($e.principal.process.command_line, `(?i)poweroff`)\n      )\n    )\n    not re.regex($e.principal.user.userid,\
    \ `(?i)(administrator|root|system|admin)`)\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n\n  match:\n    $host,\
    \ $user over 5m\n\n  outcome:\n    $risk_score = 75\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, logs-system.sysmon*
    | WHERE @timestamp > NOW() - 15 minute
      AND (
        (process.name IN ("shutdown.exe", "shutdown") AND (process.command_line LIKE "*shutdown*" AND (process.command_line LIKE "*/r*" OR process.command_line LIKE "*/f*" OR process.command_line LIKE "*-r*" OR process.command_line LIKE "*now*")))
        OR (process.name == "systemctl" AND process.command_line LIKE "*poweroff*")
        OR (process.name == "poweroff")
      )
      AND NOT (user.name IN ("SYSTEM", "root", "Administrator") OR TO_LOWER(user.name) LIKE "*admin*")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where((process_name ICONTAINS "shutdown.exe" AND (process_cmd_line ICONTAINS "/r" OR process_cmd_line ICONTAINS "/f" OR process_cmd_line ICONTAINS "/t 0")) OR (process_name ICONTAINS "shutdown" AND (process_cmd_line ICONTAINS "-r now" OR process_cmd_line ICONTAINS "now -r")) OR (process_name ICONTAINS "systemctl" AND process_cmd_line ICONTAINS "poweroff")) groupby(asset, user, process_cmd_line) calculate(count)
  crowdstrike: |
    (event_simpleName=ProcessRollup2 OR EventCode=1)
    (CommandLine=*shutdown* OR CommandLine=*systemctl*)
    (
      (CommandLine=*/r* CommandLine=*/f* CommandLine=*/t*) OR
      (CommandLine=*-r* CommandLine=*now*) OR
      (CommandLine=*poweroff*) OR
      (CommandLine=*reboot*)
    )
    NOT (UserName=*SYSTEM* OR UserName=*root* OR UserName=*Administrator* OR UserName=*admin*)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (
        (actor_process_image_name contains "shutdown" and (action_process_image_command_line ~= ".*shutdown.*[\\/]r.*[\\/]f.*[\\/]t\s+0.*" or action_process_image_command_line ~= ".*shutdown.*-r.*now.*"))
        or (actor_process_image_name contains "systemctl" and action_process_image_command_line contains "poweroff")
      )
    | filter actor_effective_username != "SYSTEM" and actor_effective_username != "root" and actor_effective_username != "NT AUTHORITY\\SYSTEM"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line, action_process_image_path
  lucene: |
    (process.name:(shutdown.exe OR shutdown OR systemctl) AND (process.command_line:(*\/r* OR *\/f* OR *\/t?0* OR *\-r* OR *now* OR *poweroff*))) AND NOT (user.name:(SYSTEM OR root OR Administrator OR *admin*) OR process.parent.name:(svchost.exe OR services.exe OR systemd OR init))
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Linux* OR _sourceCategory=*Sysmon*
    | parse regex "(?<command_line>shutdown\s+\/r\s+\/f\s+\/t\s+\d+|shutdown\s+-r\s+now|systemctl\s+poweroff)" nodrop
    | where isNotNull(command_line)
    | json field=_raw "EventID" as event_id nodrop
    | json field=_raw "CommandLine" as win_cmd nodrop
    | json field=_raw "User" as user nodrop
    | json field=_raw "ParentUser" as parent_user nodrop
    | json field=_raw "NewProcessName" as process_name nodrop
    | json field=_raw "SubjectUserName" as subject_user nodrop
    | where (event_id = "4688" or event_id = "1" or command_line matches "*shutdown*" or command_line matches "*poweroff*" or win_cmd matches "*shutdown*" or win_cmd matches "*poweroff*")
    | where !(user matches "*admin*" or user matches "*SYSTEM*" or subject_user matches "*admin*" or subject_user matches "*SYSTEM*" or parent_user matches "*admin*")
    | fields _messageTime, _sourceHost, command_line, win_cmd, user, subject_user, parent_user, process_name

rule_id: TDL-IMP-000820
v4_id: 000820
name: Forced Shutdown Issued From User Process
description: shutdown /r /f /t 0, shutdown -r now, or systemctl poweroff issued by non-admin user-context process outside change windows. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1529 under Impact).
tactic: Impact
tactic_id: TA0040
technique_id: T1529
technique_name: System Shutdown/Reboot
platform:
- Windows
- Linux
data_sources:
- Sysmon
- Windows Event Log
severity: Medium
fidelity: High
lifecycle: Proposed
risk_score: 60
queries:
  spl: |
    index=wineventlog (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1) OR (index=linux sourcetype IN (linux_secure, syslog))
    (CommandLine="*shutdown*" OR CommandLine="*poweroff*" OR CommandLine="*reboot*" OR CommandLine="*systemctl*")
    (CommandLine="*shutdown*/r*" OR CommandLine="*shutdown*/f*" OR CommandLine="*shutdown*-r*" OR CommandLine="*shutdown*now*" OR CommandLine="*poweroff*" OR CommandLine="*systemctl*poweroff*" OR CommandLine="*systemctl*reboot*" OR CommandLine="*init*0*" OR CommandLine="*init*6*")
    NOT (User="NT AUTHORITY\\SYSTEM" OR User="SYSTEM" OR User="root" OR User="Administrator" OR User="*admin*")
    | eval shutdown_command=case(
        match(CommandLine, "shutdown.*(/r|/f|-r|now)"), "shutdown",
        match(CommandLine, "systemctl.*(poweroff|reboot)"), "systemctl",
        match(CommandLine, "init\s+[06]"), "init",
        1=1, "other"
    )
    | table _time, ComputerName, host, User, Image, ParentImage, CommandLine, shutdown_command
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_imp_000820 {\n  meta:\n    author = \"TDL\"\n    description = \"Forced Shutdown Issued From User Process\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0040\"\n    technique = \"T1529\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: shutdown /r /f /t 0, shutdown -r now, or systemctl poweroff issued by non-admin user-context process outside change windows.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:

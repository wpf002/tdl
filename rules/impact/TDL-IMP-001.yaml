rule_id: TDL-IMP-001
name: Ransomware Staging - Mass File Rename
tactic: Impact
tactic_id: TA0040
technique_id: T1486
technique_name: Data Encrypted for Impact
platform:
- Windows
data_sources:
- Sysmon Event ID 11
- EDR file telemetry
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 100
queries:
  spl: "index=endpoint sourcetype=Sysmon EventCode=1 \n| regex process_name=\".*\\..*\"\n| stats count values(host) as hosts values(user) as users\
    \ by process_name, parent_process_name, command_line\n| where count >= 1\n"
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 1
    | extend EventData = parse_xml(EventData)
    | extend ProcessName = tostring(EventData.DataItem.EventData.Data[4]["#text"])
    | extend ParentProcessName = tostring(EventData.DataItem.EventData.Data[20]["#text"])
    | extend CommandLine = tostring(EventData.DataItem.EventData.Data[10]["#text"])
    | extend User = tostring(EventData.DataItem.EventData.Data[12]["#text"])
    | where ProcessName matches regex @".*\..*"
    | summarize EventCount = count(), Hosts = make_set(Computer), Users = make_set(User) by ProcessName, ParentProcessName, CommandLine
    | where EventCount >= 1
    | project ProcessName, ParentProcessName, CommandLine, EventCount, Hosts, Users
  aql: |
    SELECT "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, LOGSOURCENAME(logsourceid) AS host, username AS user, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1' AND "Process Name" MATCHES '.*\..*'
    GROUP BY "Process Name", "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid), username
    HAVING event_count >= 1
    LAST 24 HOURS
  yara_l: "rule ransomware_suspicious_process_name_pattern {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects processes\
    \ with suspicious naming patterns potentially indicative of ransomware (T1486)\"\n    mitre_attack_tactic = \"Impact\"\n    mitre_attack_technique\
    \ = \"T1486\"\n    severity = \"High\"\n    \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.metadata.product_event_type\
    \ = \"1\"\n    re.regex($e.principal.process.file.full_path, `[^\\\\]+\\..+$`)\n    $e.principal.process.file.full_path = $process_name\n\
    \    $e.principal.process.parent_process.file.full_path = $parent_process_name\n    $e.principal.process.command_line = $command_line\n  \
    \  $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n    \n  match:\n    $process_name, $parent_process_name, $command_line\
    \ over 24h\n    \n  outcome:\n    $risk_score = 65\n    $hosts = array_distinct($host)\n    $users = array_distinct($user)\n    \n  condition:\n\
    \    #e >= 1\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*
    | WHERE (winlog.event_id == 1 OR event.category == "process") AND event.type == "start"
    | WHERE process.name RLIKE ".+\\..+"
    | STATS event_count = COUNT(*), hosts = VALUES(host.name), users = VALUES(user.name) BY process.name, process.parent.name, process.command_line
    | WHERE event_count >= 1
  leql: |
    where(source_json.EventID=1 AND process_name=/.*\..+.*/) groupby(process_name, parent_process_name, process_cmd_line) calculate(count)
  crowdstrike: |
    event_simpleName=ProcessRollup2 FileName=*.+*
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=[count(as=event_count), collect([ComputerName, UserName])])
    | event_count >= 1
    | table([FileName, ParentBaseFileName, CommandLine, event_count, ComputerName, UserName])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_process_image_name ~= ".*\..*"
    | comp count() as event_count, values(agent_hostname) as hosts, values(actor_effective_username) as users by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | filter event_count >= 1
    | fields action_process_image_name, actor_process_image_name, action_process_image_command_line, event_count, hosts, users
  lucene: |
    winlog.event_id:1 AND process.name:*.+*
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id = "1" and process_name matches "*.+*"
    | count as event_count by process_name, parent_process_name, command_line
    | where event_count >= 1
    | fields process_name, parent_process_name, command_line, event_count
false_positives:
- File sync clients during bulk sync
tags:
- ransomware
- encryption
- critical
author: TDL
created: '2024-03-01'
test_method: synthetic
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host(s) affected, scope of impact (count of files / accounts / services).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — characterize the destructive action (encrypt, delete,
  lockout, disable, reboot).
- 'Determine spread: is this a single host or a coordinated multi-host event? Pull file / service telemetry across the fleet.'
- Trigger your major-incident bridge if scope is multi-host or business-critical — early activation buys time.
- 'Decide TP / FP: FP only if a sanctioned destructive action (DR test, decommission) is documented; default to TP at this severity.'
- 'If TP: execute your IR runbook — isolate, preserve evidence, restore from backup if appropriate, hunt for adversary persistence to prevent
  recurrence.'
pseudo_logic: '1 or more instances over any time window of a Sysmon Process Creation event where the process name matches a wildcard pattern containing
  a dot and one or more additional characters.


  From index=endpoint with sourcetype=Sysmon

  Where EventCode=1 (Process Creation)

  Where process_name matches the pattern "*.+*" (any process name containing a dot followed by one or more characters)

  With statistics aggregated by process_name, parent_process_name, and command_line

  With values of host and user collected per grouping

  Where the event count per group is greater than or equal to 1


  With the same process_name, parent_process_name, and command_line as the correlation key across all matching hosts and users.'

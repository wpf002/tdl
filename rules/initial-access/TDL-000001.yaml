rule_id: TDL-AUTH-000001
v4_id: '000001'
name: Default Account Logon
description: Detects a successful logon to a default account. Attackers may attempt to authenticate to a default account in hopes that the account
  is still active.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Active Directory
- Linux Operating System
- 'Event IDs: 4624'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    (index=wineventlog sourcetype=WinEventLog:Security (EventCode=528 OR EventCode=540 OR EventCode=4624)) OR (index=linux sourcetype=linux_secure "Accepted")
    | eval src_ip=coalesce(Source_Network_Address, src, client_ip)
    | eval dest_user=coalesce(TargetUserName, user, Account_Name)
    | eval src_host=coalesce(Workstation_Name, Source_Network_Address, host)
    | search (src_ip="10.*" OR src_ip="172.16.*" OR src_ip="172.17.*" OR src_ip="172.18.*" OR src_ip="172.19.*" OR src_ip="172.20.*" OR src_ip="172.21.*" OR src_ip="172.22.*" OR src_ip="172.23.*" OR src_ip="172.24.*" OR src_ip="172.25.*" OR src_ip="172.26.*" OR src_ip="172.27.*" OR src_ip="172.28.*" OR src_ip="172.29.*" OR src_ip="172.30.*" OR src_ip="172.31.*" OR src_ip="192.168.*") OR (lower(dest_user)="guest" OR lower(dest_user)="administrator")
    | lookup domain_controllers.csv host as src_host OUTPUT is_dc
    | lookup mail_servers.csv host as src_host OUTPUT is_mail
    | lookup central_auth_servers.csv host as src_host OUTPUT is_auth
    | lookup default_accounts.csv username as dest_user OUTPUT is_default
    | where (isnull(is_dc) OR is_dc!=1) AND (isnull(is_mail) OR is_mail!=1) AND (isnull(is_auth) OR is_auth!=1)
    | table _time, src_host, src_ip, dest_user, EventCode, ComputerName
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4624")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4624')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000001 {\n  meta:\n    author = \"TDL\"\n    description = \"Default Account Logon\"\n    severity = \"LOW\"\n  \
    \  tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4624)/\n  \
    \  $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4624")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4624])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4624)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4624")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4624)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4624")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 Windows Authentication Success Event\nWhere the Event ID is in [528, 540, 4624]\nFrom an internal Source IP \nOR\n\tWhere the\
  \ Destination Username is case insensitive \"Guest\" OR \"Administrator\"\n\t\t\t\n\tWhere the Destination Username is in Customer Default Account\
  \ List\n\nWhere the source is NOT on the Domain Controller List\nWhere the source is NOT on the Mail Server List\nWhere the source is NOT on\
  \ the Central Authentication Server List\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Successful Authentication Event \nFrom an internal Source IP \nOR\n\tWhere the Destination Username is case insensitive \"Guest\" OR \"\
  Administrator\"\n\t\t\t\n\tWhere the Destination Username is in Customer Default Account List"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

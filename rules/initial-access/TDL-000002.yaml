rule_id: TDL-AUTH-000002
v4_id: '000002'
name: Default Account Password Guessing
description: Detects multiple failed login attempts to a default account from a single source.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Active Directory
- Linux Operating System
- 'Event IDs: 4625'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    (index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625 OR EventCode=4776) (Failure_Code="0xC000006A" OR lower(TargetUserName) IN ("guest", "administrator") OR [| inputlookup customer_default_accounts.csv | fields TargetUserName]) NOT [| inputlookup domain_controllers.csv | fields ComputerName | rename ComputerName as Source_Network_Address] NOT [| inputlookup mail_servers.csv | fields ComputerName | rename ComputerName as Source_Network_Address] NOT [| inputlookup central_auth_servers.csv | fields ComputerName | rename ComputerName as Source_Network_Address]) OR (index=linux sourcetype IN (linux_secure, syslog) "Failed" (lower(user) IN ("guest", "administrator") OR [| inputlookup customer_default_accounts.csv | fields user]) NOT [| inputlookup domain_controllers.csv | fields host | rename host as src] NOT [| inputlookup mail_servers.csv | fields host | rename host as src] NOT [| inputlookup central_auth_servers.csv | fields host | rename host as src])
    | eval src=coalesce(Source_Network_Address, src_ip, src, host), dest=coalesce(ComputerName, dest_ip, dest), user=coalesce(TargetUserName, user)
    | bin _time span=3m
    | stats count by _time, src, dest, user
    | where count >= 10
    | table _time, src, dest, user, count
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4625", "4776")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4625', '4776')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000002 {\n  meta:\n    author = \"TDL\"\n    description = \"Default Account Password Guessing\"\n    severity =\
    \ \"LOW\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4625|4776)/\n\
    \    $user = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4625", "4776")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4625, 4776])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4625, 4776)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4625", "4776")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4625 OR 4776)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4625", "4776")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "10 Windows Authentication Failed Events\nWhere the Event ID is in [529, 4625, 4776]\nFrom one internal Source to one internal Destination\
  \ (Internal)\nWhere the Failure Code is \"0xC000006A\" \nOR\n\tWhere the Username is case insensitive \"Guest\" OR \"Administrator\"\n\t\t\t\
  \n\tWhere the Username is in Customer Default Account List\n\t\nWhere the source is NOT on the Domain Controller List\nWhere the source is NOT\
  \ on the Mail Server List\nWhere the source is NOT on the Central Authentication Server List\nWith the same Destination Username\nWithin 3 minutes\n\
  \n---------------------------------------------------------------------------------------------------------------\n\n10 Failed Authentication\
  \ Events\nFrom one internal source to one internal destination\nOR\n\tWhere the Username is case insensitive \"Guest\" OR \"Administrator\"\n\
  \t\t\t\n\tWhere the Username is in Customer Default Account List\n\t\t\nWhere the source is NOT on the Domain Controller List\nWhere the source\
  \ is NOT on the Mail Server List\nWhere the source is NOT on the Central Authentication Server List\nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000006
v4_id: '000006'
name: Password Guessing
description: Detects a potential password guessing attack against an account from a single source.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4625, 4776'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625 OR EventCode=680 OR EventCode=681 OR EventCode=4776) Failure_Code="0xC000006A"
    | eval src_identifier=coalesce(Source_Network_Address, ComputerName)
    | where NOT match(TargetUserName, "\$$")
    | lookup mail_servers.csv server_name AS src_identifier OUTPUT is_mail_server
    | lookup auth_servers.csv server_name AS src_identifier OUTPUT is_auth_server
    | lookup vuln_scanners.csv server_name AS src_identifier OUTPUT is_vuln_scanner
    | lookup domain_controllers.csv server_name AS src_identifier OUTPUT is_dc
    | lookup hvt_accounts.csv account_name AS TargetUserName OUTPUT is_hvt
    | lookup password_reset_exclusions.csv account_name AS TargetUserName OUTPUT exclusion_time
    | where isnull(is_mail_server) AND isnull(is_auth_server) AND isnull(is_vuln_scanner) AND isnull(is_dc) AND isnull(is_hvt)
    | where isnull(exclusion_time) OR (now() - exclusion_time > 28800)
    | bin _time span=3m
    | stats count by _time, src_identifier, dest, TargetUserName, EventCode
    | where count >= 75
    | table _time, src_identifier, dest, TargetUserName, EventCode, count
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4625", "4776")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4625', '4776')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000006 {\n  meta:\n    author = \"TDL\"\n    description = \"Password Guessing\"\n    severity = \"LOW\"\n    tactic\
    \ = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4625|4776)/\n    $user\
    \ = $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4625", "4776")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4625, 4776])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4625, 4776)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4625", "4776")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4625 OR 4776)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4625", "4776")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "75 Windows Authentication Failure events \nFrom the same internal Source IP/Source Hostname and same internal Destination Hostname\n\
  Where the Event ID is in [529, 4625, 680, 681, 4776]\nWhere the Failure Code is \"0xC000006A\" \nWhere the username does not end with \"$\"\n\
  Where the Source IP/Hostname is NOT on the Mail Server List\nWhere the Source IP/Hostname is NOT on the Central Authentication Server List\n\
  Where the Source IP/Hostname is NOT on the Vulnerability Scanner List\nWhere the Source IP/Hostname is NOT on the Domain Controller List\nWhere\
  \ the Destination Username is NOT on the High Value Target Accounts List\nWhere the Destination Username is NOT on the Password Reset Exclusion\
  \ List - 8 hours\nWith the same Destination Username and Event ID\nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

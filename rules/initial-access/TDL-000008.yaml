rule_id: TDL-AUTH-000008
v4_id: 000008
name: HVT Password Guessing
description: Detects a potential password guessing attack against an admin account from a single source.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Active Directory
- Linux Operating System
- 'Event IDs: 4625, 4776'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog (EventCode=4625 OR EventCode=4776 OR EventCode=529 OR EventCode=680 OR EventCode=681) Failure_Code="0xC000006A"

    | lookup high_value_target_accounts.csv username as TargetUserName OUTPUT is_hvt

    | lookup mail_servers.csv host as Source_Network_Address OUTPUT is_mail_server

    | lookup central_auth_servers.csv host as Source_Network_Address OUTPUT is_auth_server

    | lookup vulnerability_scanners.csv host as Source_Network_Address OUTPUT is_vuln_scanner

    | lookup password_reset_exclusions.csv username as TargetUserName earliest_time as exclusion_start latest_time as exclusion_end OUTPUT is_excluded

    | where is_hvt="true" AND is_mail_server!="true" AND is_auth_server!="true" AND is_vuln_scanner!="true" AND (is_excluded!="true" OR _time
    < exclusion_start OR _time > exclusion_end)

    | bin _time span=3m

    | stats count by _time, Source_Network_Address, ComputerName, TargetUserName, EventCode

    | where count >= 5

    | table _time, Source_Network_Address, ComputerName, TargetUserName, EventCode, count

    '
  kql: |
    let HighValueTargets = dynamic(["admin","administrator","root","svc-admin"]);
    let MailServers = dynamic(["mail-server-01","mail-server-02"]);
    let AuthServers = dynamic(["dc01","dc02","auth-server"]);
    let VulnerabilityScanners = dynamic(["scanner-01","scanner-02"]);
    let PasswordResetExclusions = SecurityEvent
        | where TimeGenerated > ago(4h)
        | where EventID in (4724, 4723)
        | distinct TargetAccount;
    SecurityEvent
    | where TimeGenerated > ago(3m)
    | where EventID in (529, 4625, 680, 681, 4776)
    | where FailureReason contains "0xC000006A" or Status == "0xC000006A"
    | where TargetAccount in (HighValueTargets)
    | where IpAddress !in (MailServers) and WorkstationName !in (MailServers)
    | where IpAddress !in (AuthServers) and WorkstationName !in (AuthServers)
    | where IpAddress !in (VulnerabilityScanners) and WorkstationName !in (VulnerabilityScanners)
    | where TargetAccount !in (PasswordResetExclusions)
    | summarize FailureCount = count(), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), EventIDs = make_set(EventID) by SourceIP = IpAddress, SourceHost = WorkstationName, DestinationHost = Computer, DestinationUsername = TargetAccount, EventID
    | where FailureCount >= 5
    | project FirstSeen, LastSeen, SourceIP, SourceHost, DestinationHost, DestinationUsername, EventID, FailureCount, EventIDs
  aql: "SELECT \n    sourceip, \n    destinationip, \n    username AS destination_username, \n    \"EventID\", \n    COUNT(*) AS failure_count,\n\
    \    LOGSOURCENAME(logsourceid) AS log_source\nFROM events\nWHERE \"EventID\" IN ('529', '4625', '680', '681', '4776')\n    AND \"Failure\
    \ Code\" = '0xC000006A'\n    AND username IN (SELECT * FROM reference_set WHERE name = 'High Value Target Accounts')\n    AND sourceip NOT\
    \ IN (SELECT * FROM reference_set WHERE name = 'Mail Server List')\n    AND sourceip NOT IN (SELECT * FROM reference_set WHERE name = 'Central\
    \ Authentication Server List')\n    AND sourceip NOT IN (SELECT * FROM reference_set WHERE name = 'Vulnerability Scanner List')\n    AND username\
    \ NOT IN (SELECT * FROM reference_set WHERE name = 'Password Reset Exclusion List')\nGROUP BY sourceip, destinationip, username, \"EventID\"\
    \nHAVING failure_count >= 5\nLAST 3 MINUTES\n"
  yara_l: |
    rule windows_auth_failure_brute_force_hvt {
      meta:
        author = "Detection Engineer"
        description = "Detects 5+ Windows authentication failures targeting high-value accounts within 3 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.action = "BLOCK"
        (
          $e.metadata.product_event_type = "529" or
          $e.metadata.product_event_type = "4625" or
          $e.metadata.product_event_type = "680" or
          $e.metadata.product_event_type = "681" or
          $e.metadata.product_event_type = "4776"
        )
        $e.security_result.summary = "0xC000006A"
        $e.target.user.userid = $dst_user
        $e.principal.ip = $src_ip
        $e.principal.hostname = $src_host
        $e.target.hostname = $dst_host
        $e.metadata.product_event_type = $event_id

        // High Value Target Accounts
        (
          re.regex($dst_user, `(?i)(administrator|admin|domain admin|enterprise admin|root|sysadmin)`) or
          $dst_user in %high_value_target_accounts
        )

        // Exclusions - Mail Servers
        not (
          $src_ip in %mail_servers or
          $src_host in %mail_servers
        )

        // Exclusions - Central Authentication Servers
        not (
          $src_ip in %central_auth_servers or
          $src_host in %central_auth_servers
        )

        // Exclusions - Vulnerability Scanners
        not (
          $src_ip in %vulnerability_scanners or
          $src_host in %vulnerability_scanners
        )

        // Exclusions - Password Reset Accounts (4 hour window)
        not (
          $dst_user in %password_reset_exclusion_list
        )

      match:
        $src_ip, $src_host, $dst_host, $dst_user, $event_id over 3m

      outcome:
        $risk_score = max(75)
        $src_ip_summary = array_distinct($src_ip)
        $src_host_summary = array_distinct($src_host)
        $dst_host_summary = array_distinct($dst_host)
        $dst_user_summary = array_distinct($dst_user)
        $event_id_summary = array_distinct($event_id)
        $failure_count = count_distinct($e.metadata.id)

      condition:
        #e >= 5
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 3 minutes
      AND event.code IN ("529", "4625", "680", "681", "4776")
      AND winlog.event_data.Status == "0xC000006A"
    | EVAL src = COALESCE(source.ip, host.name)
    | WHERE src IS NOT NULL
    | STATS failure_count = COUNT(*) BY src, destination.host, user.name, event.code, window = BUCKET(@timestamp, 3 minutes)
    | WHERE failure_count >= 5
    | KEEP src, destination.host, user.name, event.code, failure_count, window
  leql: |
    where(source_json.EventID IN [529, 4625, 680, 681, 4776] AND source_json.Status="0xC000006A") groupby(source_address, destination_address, destination_user, source_json.EventID) calculate(count)
  crowdstrike: "(EventCode=529 OR EventCode=4625 OR EventCode=680 OR EventCode=681 OR EventCode=4776) \nFailureCode=\"0xC000006A\"\n| in(field=TargetUserName,\
    \ values=[HighValueTargetAccounts])\n| !in(field=IpAddress, values=[MailServerList])\n| !in(field=IpAddress, values=[CentralAuthenticationServerList])\n\
    | !in(field=IpAddress, values=[VulnerabilityScannerList])\n| !in(field=TargetUserName, values=[PasswordResetExclusionList], timeWindow=4h)\n\
    | groupBy([IpAddress, ComputerName, TargetUserName, EventCode], function=count(as=failures), span=3m)\n| failures >= 5\n| table([@timestamp,\
    \ IpAddress, ComputerName, TargetUserName, EventCode, failures])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (529, 4625, 680, 681, 4776)
    | filter action_evtlog_data_SubStatus = "0xC000006A" or action_evtlog_event_data_Status = "0xC000006A"
    | alter dest_username = coalesce(action_evtlog_event_data_TargetUserName, action_evtlog_event_data_TargetDomainName)
    | alter source_identifier = coalesce(action_remote_ip, action_evtlog_event_data_WorkstationName, action_evtlog_event_data_IpAddress)
    | filter dest_username != null and source_identifier != null
    | filter agent_hostname != null
    | bin _time span=3m
    | comp count() as failure_count by _time, source_identifier, agent_hostname, dest_username, action_evtlog_event_id
    | filter failure_count >= 5
    | fields _time, source_identifier, agent_hostname, dest_username, action_evtlog_event_id, failure_count
  lucene: |
    event.code:(529 OR 4625 OR 680 OR 681 OR 4776) AND winlog.event_data.FailureCode:"0xC000006A" AND NOT source.ip:(MailServerList) AND NOT source.ip:(CentralAuthServerList) AND NOT source.ip:(VulnScannerList) AND NOT user.name:(PasswordResetExclusionList)
  sumo: |
    _sourceCategory=*Windows*Security* (EventID=529 OR EventID=4625 OR EventID=680 OR EventID=681 OR EventID=4776)
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "Workstation" as src_host
    | json field=_raw "Status" as failure_code
    | json field=_raw "Computer" as dest_host
    | where event_id in ("529", "4625", "680", "681", "4776")
    | where failure_code = "0xC000006A"
    | where dest_user matches "*admin*" OR dest_user matches "*svc*" OR dest_user matches "*service*"
    | where !(src_ip matches "*mail*" OR src_host matches "*mail*")
    | where !(src_ip matches "*auth*" OR src_host matches "*auth*" OR src_host matches "*dc*")
    | where !(src_ip matches "*scan*" OR src_host matches "*vuln*" OR src_host matches "*nessus*" OR src_host matches "*qualys*")
    | where !(dest_user matches "*reset*" OR dest_user matches "*temp*")
    | timeslice 3m
    | count as failures by _timeslice, src_ip, src_host, dest_host, dest_user, event_id
    | where failures >= 5
    | fields _timeslice, src_ip, src_host, dest_host, dest_user, event_id, failures
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure events \nFrom the same internal Source and the same internal Destination host\nWhere the Event\
  \ ID is in [529, 4625, 680, 681, 4776]\nWhere the Failure Code is \"0xC000006A\"\nWhere the Destination Username is on the High Value Target\
  \ Accounts List\nWhere the source IP/host is NOT on the Mail Server List\nWhere the source IP/host is NOT on the Central Authentication Server\
  \ List\nWhere the Source IP/Hostname is NOT on the Vulnerability Scanner List\nWhere the  Destination Username is NOT on the Password Reset\
  \ Exclusion List - 4 hours\nWith the same Destination Username and Event ID\nWithin 3 minutes"
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000009
v4_id: 000009
name: Successful Brute Force
description: Detects a successful login after the IP or host has been identified by password guessing. This could indicate that an attacker was
  successful in guessing a user’s password and has compromised their account.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Active Directory
- Linux Operating System
- 'Event IDs: 4624'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=wineventlog (EventCode=4625 OR EventCode=528 OR EventCode=540 OR EventCode=4624)\n| eval event_type=case(\n    EventCode=4625, \"\
    failure\",\n    EventCode IN (528, 540, 4624), \"success\",\n    1=1, \"unknown\"\n)\n| eval src_identifier=coalesce(IpAddress, Source_Network_Address,\
    \ Workstation_Name)\n| eval dest_user=coalesce(TargetUserName, Account_Name, user)\n| eval dest_host=coalesce(ComputerName, dest, host)\n\
    | sort 0 _time\n| streamstats time_window=3m count(eval(event_type=\"failure\")) as failure_count by src_identifier, dest_user, dest_host\n\
    | where failure_count >= 5\n| streamstats time_window=5m count(eval(event_type=\"success\")) as success_count by src_identifier, dest_user,\
    \ dest_host\n| where success_count >= 1 AND event_type=\"success\"\n| dedup src_identifier, dest_user, dest_host\n| table _time, src_identifier,\
    \ dest_user, dest_host, EventCode, failure_count, success_count\n"
  kql: |
    let FailureWindow = 3m;
    let SuccessWindow = 5m;
    let FailureThreshold = 5;
    let Failures = SecurityEvent
    | where TimeGenerated > ago(SuccessWindow + FailureWindow)
    | where EventID == 4625
    | summarize FailureCount = count(), FirstFailure = min(TimeGenerated), LastFailure = max(TimeGenerated) by IpAddress, TargetUserName, Computer
    | where FailureCount >= FailureThreshold
    | where (LastFailure - FirstFailure) <= FailureWindow;
    let Successes = SecurityEvent
    | where TimeGenerated > ago(SuccessWindow)
    | where EventID in (528, 540, 4624)
    | project SuccessTime = TimeGenerated, IpAddress, TargetUserName, Computer;
    Failures
    | join kind=inner (Successes) on IpAddress, TargetUserName, Computer
    | where (SuccessTime - LastFailure) <= SuccessWindow and SuccessTime >= FirstFailure
    | project SuccessTime, IpAddress, TargetUserName, Computer, FailureCount, FirstFailure, LastFailure
    | summarize arg_min(SuccessTime, *) by IpAddress, TargetUserName, Computer
  aql: "SELECT \n    failed.sourceip,\n    failed.username AS target_username,\n    failed.destinationip AS target_host,\n    COUNT(DISTINCT failed.eventtime)\
    \ AS failed_attempts,\n    success.eventtime AS success_time,\n    success.\"EventID\" AS success_event_id\nFROM events failed\nJOIN events\
    \ success ON \n    failed.sourceip = success.sourceip \n    AND failed.username = success.username\n    AND failed.destinationip = success.destinationip\n\
    WHERE \n    failed.\"EventID\" = '4625'\n    AND success.\"EventID\" IN ('528', '540', '4624')\n    AND success.eventtime BETWEEN failed.eventtime\
    \ AND failed.eventtime + 300000\n    AND failed.eventtime IN (\n        SELECT f.eventtime \n        FROM events f \n        WHERE f.\"EventID\"\
    \ = '4625' \n        AND f.eventtime BETWEEN DATEADD(failed.eventtime, -180000, 'milliseconds') AND failed.eventtime\n        GROUP BY f.sourceip,\
    \ f.username, f.destinationip\n        HAVING COUNT(*) >= 5\n    )\nGROUP BY failed.sourceip, failed.username, failed.destinationip, success.eventtime,\
    \ success.\"EventID\"\nLAST 1 HOURS\n"
  yara_l: |
    rule valid_accounts_after_password_guessing {
      meta:
        author = "TDL"
        description = "Detects successful authentication after multiple failed login attempts from same source to same target (T1078)"
        mitre_tactic = "Initial Access"
        mitre_technique = "T1078"
        severity = "High"

      events:
        $failed.metadata.event_type = "USER_LOGIN"
        $failed.security_result.action = "BLOCK"
        $failed.target.user.userid = $target_user
        $failed.principal.hostname = $source_host
        $failed.principal.ip = $source_ip
        $failed.target.hostname = $dest_host

        $success.metadata.event_type = "USER_LOGIN"
        $success.security_result.action = "ALLOW"
        (
          $success.metadata.product_event_type = "528" or
          $success.metadata.product_event_type = "540" or
          $success.metadata.product_event_type = "4624"
        )
        $success.target.user.userid = $target_user
        $success.principal.hostname = $source_host
        $success.principal.ip = $source_ip
        $success.target.hostname = $dest_host

      match:
        $target_user, $source_host, $source_ip, $dest_host over 8m

      outcome:
        $risk_score = 75

      condition:
        #failed >= 5 and $success and $failed before $success
    }
  esql: "FROM logs-system.security*, logs-windows.sysmon_operational*, winlogbeat-*\n| WHERE @timestamp > NOW() - 10 minutes\n| WHERE event.code\
    \ IN (\"4625\", \"528\", \"540\", \"4624\")\n| EVAL event_type = CASE(event.code == \"4625\", \"failure\", event.code IN (\"528\", \"540\"\
    , \"4624\"), \"success\", \"other\")\n| WHERE event_type IN (\"failure\", \"success\")\n| STATS \n    failures = COUNT(*) BY source.ip, user.name,\
    \ host.name, window = BUCKET(@timestamp, 3 minutes)\n| WHERE failures >= 5\n| EVAL failure_time = window\n| JOIN (\n    FROM logs-system.security*,\
    \ logs-windows.sysmon_operational*, winlogbeat-*\n    | WHERE @timestamp > NOW() - 10 minutes\n    | WHERE event.code IN (\"528\", \"540\"\
    , \"4624\")\n    | KEEP @timestamp, source.ip, user.name, host.name\n  ) ON source.ip, user.name, host.name\n| WHERE @timestamp >= failure_time\
    \ AND @timestamp <= failure_time + 5 minutes\n| KEEP @timestamp, source.ip, user.name, host.name, failures, failure_time\n```\n\nWait, ES|QL\
    \ doesn't support JOIN. Let me rewrite using a self-contained approach:\n\n```\nFROM logs-system.security*, logs-windows.sysmon_operational*,\
    \ winlogbeat-*\n| WHERE @timestamp > NOW() - 10 minutes\n| WHERE event.code IN (\"4625\", \"528\", \"540\", \"4624\")\n| EVAL event_type =\
    \ CASE(event.code == \"4625\", \"failure\", event.code IN (\"528\", \"540\", \"4624\"), \"success\", \"other\")\n| STATS \n    failures =\
    \ SUM(CASE(event_type == \"failure\", 1, 0)),\n    successes = SUM(CASE(event_type == \"success\", 1, 0)),\n    min_failure_time = MIN(CASE(event_type\
    \ == \"failure\", @timestamp, null)),\n    max_success_time = MAX(CASE(event_type == \"success\", @timestamp, null))\n    BY source.ip, user.name,\
    \ host.name, window = BUCKET(@timestamp, 3 minutes)\n| WHERE failures >= 5 AND successes >= 1\n| WHERE max_success_time >= min_failure_time\
    \ AND max_success_time <= min_failure_time + 5 minutes\n| KEEP source.ip, user.name, host.name, failures, successes, min_failure_time, max_success_time\n"
  leql: |
    where(result=FAILED_BAD_PASSWORD) groupby(source_address, destination_user, destination_asset) calculate(count)
  crowdstrike: |
    EventCode=4625
    | bucket(span=3m, field=@timestamp, as=window_start)
    | groupBy([window_start, SourceIP, TargetUserName, ComputerName], function=count(as=failures))
    | failures >= 5
    | join({
        EventCode=4624
        | table([@timestamp, SourceIP, TargetUserName, ComputerName], as=success)
      }, field=[SourceIP, TargetUserName, ComputerName], key=[SourceIP, TargetUserName, ComputerName], mode=left)
    | test(@timestamp <= success.@timestamp)
    | test(success.@timestamp <= (@timestamp + 5m))
    | table([window_start, SourceIP, TargetUserName, ComputerName, failures, success.@timestamp])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (4625, 528, 540, 4624)\n| bin _time span=3m\n| alter is_failure = if(action_evtlog_event_id\
    \ = 4625, 1, 0),\n        is_success = if(action_evtlog_event_id in (528, 540, 4624), 1, 0),\n        src_key = coalesce(action_evtlog_event_data_IpAddress,\
    \ action_remote_ip, agent_hostname),\n        dst_user = coalesce(action_evtlog_event_data_TargetUserName, actor_effective_username),\n  \
    \      dst_host = agent_hostname\n| comp sum(is_failure) as failure_count, \n        min(_time) as first_failure_time,\n        max(_time)\
    \ as last_event_time\n  by src_key, dst_user, dst_host, _time\n| filter failure_count >= 5\n| alter search_window_start = first_failure_time,\n\
    \        search_window_end = arrayindex(regextract(to_string(timestamp_diff(first_failure_time, 300000)), \"(\\d+)\"), 0)\n| join type=inner\
    \ (\n    dataset = xdr_data\n    | filter action_evtlog_event_id in (528, 540, 4624)\n    | alter src_key = coalesce(action_evtlog_event_data_IpAddress,\
    \ action_remote_ip, agent_hostname),\n            dst_user = coalesce(action_evtlog_event_data_TargetUserName, actor_effective_username),\n\
    \            dst_host = agent_hostname,\n            success_time = _time\n  ) as success_events\n  success_events.src_key = src_key and \n\
    \  success_events.dst_user = dst_user and\n  success_events.dst_host = dst_host and\n  success_events.success_time >= first_failure_time and\n\
    \  success_events.success_time <= timestamp_add(first_failure_time, 300000)\n| fields first_failure_time, success_events.success_time, src_key,\
    \ dst_user, dst_host, failure_count\n"
  lucene: |
    (event.code:4625 OR EventID:4625) AND (_exists_:source.ip OR _exists_:SourceWorkstation) AND (_exists_:user.name OR _exists_:TargetUserName) AND (_exists_:host.name OR _exists_:Computer)
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Active?Directory* OR _sourceCategory=*Linux*
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "Computer" as dest_host
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "WorkstationName" as src_hostname
    | where event_id in ("4625", "528", "540", "4624")
    | if(event_id="4625", "failure", "success") as event_type
    | if(isEmpty(src_ip), src_hostname, src_ip) as source_identifier
    | timeslice 3m
    | count as event_count by _timeslice, source_identifier, dest_user, dest_host, event_type
    | where (event_type="failure" and event_count >= 5) or event_type="success"
    | fields -_timeslice
    | transpose row _messageTime column event_type as *
    | where isNull(failure) = false and isNull(success) = false
    | where (success_time - failure_time) <= 300000
    | fields source_identifier, dest_user, dest_host, failure_time, success_time
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Password Guessing Event (5 failures within 3 minutes)\n\nFollowed By\n\n1 Windows Authentication Success Event\nWhere the Event\
  \ ID is in [528, 540, 4624]\nWith the same Source IP/Hostname\nWith the same Destination Username\nWith the same Destination Host\n\t\nWithin\
  \ 5 minutes"
suppression:
  window: 12 hours
  fields:
  - Source IP
  - Source Host
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

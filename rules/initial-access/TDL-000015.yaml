rule_id: TDL-AUTH-000015
v4_id: '000015'
name: Unauthorized User Removal from HVT Group
description: Detects when an unauthorized user removes an user from a HVT group that may provide access to valuable resources. Could be an indicator
  of an attacker performing destructive behavior.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Active Directory
- 'Event IDs: 4729, 4733, 4757'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=4729 OR EventCode=4733 OR EventCode=4757)

    | eval Group_Name=coalesce(Group_Name, TargetUserName)

    | search Group_Name IN ("Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise
    Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators")

    | eval Source_Username=coalesce(SubjectUserName, Account_Name)

    | search NOT Source_Username IN ("administrator", "svc_admin", "backup_admin")

    | table _time, ComputerName, EventCode, Source_Username, Group_Name, TargetUserName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (633, 4729, 637, 4733, 661, 4757)
    | extend GroupName = TargetUserName
    | where GroupName in ("Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators")
    | extend SourceUser = SubjectUserName
    | where SourceUser !in ("")
    | project TimeGenerated, Computer, EventID, SourceUser, GroupName, TargetAccount, Activity
  aql: |
    SELECT username AS "Source Username", "Group Name", "Target Username", sourceip, LOGSOURCENAME(logsourceid) AS host, eventtime
    FROM events
    WHERE "EventID" IN ('633', '4729', '637', '4733', '661', '4757')
      AND "Group Name" IN ('Group Policy Creator Owners', 'Administrators', 'DHCP Administrators', 'DnsAdmins', 'Domain Admins', 'Enterprise Admins', 'Enterprise Key Admins', 'Hyper-V Administrators', 'Key Admins', 'Schema Admins', 'Storage Replica Administrators')
      AND username NOT IN ('authorized_user1', 'authorized_user2', 'authorized_admin')
    LAST 24 HOURS
  yara_l: |
    rule sensitive_group_member_added {
      meta:
        author = "TDL"
        description = "Detects user added to sensitive security group by unauthorized account"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "GROUP_MODIFICATION"
        (
          $e.metadata.product_event_type = "633" or
          $e.metadata.product_event_type = "4729" or
          $e.metadata.product_event_type = "637" or
          $e.metadata.product_event_type = "4733" or
          $e.metadata.product_event_type = "661" or
          $e.metadata.product_event_type = "4757"
        )
        (
          $e.target.group.group_display_name = "Group Policy Creator Owners" or
          $e.target.group.group_display_name = "Administrators" or
          $e.target.group.group_display_name = "DHCP Administrators" or
          $e.target.group.group_display_name = "DnsAdmins" or
          $e.target.group.group_display_name = "Domain Admins" or
          $e.target.group.group_display_name = "Enterprise Admins" or
          $e.target.group.group_display_name = "Enterprise Key Admins" or
          $e.target.group.group_display_name = "Hyper-V Administrators" or
          $e.target.group.group_display_name = "Key Admins" or
          $e.target.group.group_display_name = "Schema Admins" or
          $e.target.group.group_display_name = "Storage Replica Administrators"
        )
        not (
          $e.principal.user.userid = "svc_authorized_admin_1" or
          $e.principal.user.userid = "svc_authorized_admin_2" or
          $e.principal.user.userid = "svc_authorized_admin_3"
        )
        $e.principal.user.userid = $source_user
        $e.principal.hostname = $host

      match:
        $host, $source_user over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*
    | WHERE event.code IN ("633", "4729", "637", "4733", "661", "4757")
      AND winlog.event_data.TargetUserName IN ("Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators")
    | WHERE NOT winlog.event_data.SubjectUserName IN ("authorized_user1", "authorized_user2")
    | KEEP @timestamp, host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.MemberName, event.code
  leql: |
    where((source_json.EventID IN [633, 4729, 637, 4733, 661, 4757]) AND (source_json.TargetUserName IN ["Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators"]) AND NOT(source_json.SubjectUserName IN []))
  crowdstrike: |
    EventCode IN [633, 4729, 637, 4733, 661, 4757]
    (TargetUserName IN ["Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators"] OR GroupName IN ["Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators"])
    NOT SubjectUserName IN []
    | table([@timestamp, ComputerName, EventCode, SubjectUserName, TargetUserName, GroupName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (633, 4729, 637, 4733, 661, 4757)
    | filter action_evtlog_event_data_TargetUserName in ("Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators")
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_MemberName, action_evtlog_event_id
  lucene: |
    event.code:(4729 OR 4733 OR 4757) AND winlog.event_data.GroupName:("Group Policy Creator Owners" OR "Administrators" OR "DHCP Administrators" OR "DnsAdmins" OR "Domain Admins" OR "Enterprise Admins" OR "Enterprise Key Admins" OR "Hyper-V Administrators" OR "Key Admins" OR "Schema Admins" OR "Storage Replica Administrators") AND NOT winlog.event_data.SubjectUserName:(<authorized_user_1> OR <authorized_user_2>)
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*AD* OR _sourceCategory=*ActiveDirectory*
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as group_name
    | json field=_raw "SubjectUserName" as source_user
    | where event_id in ("633", "4729", "637", "4733", "661", "4757")
    | where group_name in ("Group Policy Creator Owners", "Administrators", "DHCP Administrators", "DnsAdmins", "Domain Admins", "Enterprise Admins", "Enterprise Key Admins", "Hyper-V Administrators", "Key Admins", "Schema Admins", "Storage Replica Administrators")
    | where !(source_user in ("AUTHORIZED_USER1", "AUTHORIZED_USER2"))
    | fields _messageTime, _sourceHost, event_id, source_user, group_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows User Added to Security Group Event\nWhere the Event ID is in [633, 4729, 637, 4733, 661, 4757] \nOR\n          Where\
  \ the Group Name is in the High Value Target Groups List\n\n          Where Group Name is in [Group Policy Creator Owners, Administrators, DHCP\
  \ Administrators, DnsAdmins, Domain Admins, Enterprise Admins, Enterprise Key Admins, Hyper-V Administrators, Key Admins, Schema Admins, Storage\
  \ Replica Administrators]\n\nWhere the Source Username is NOT in the Users Authorized to Add/Remove Users From Groups List"
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

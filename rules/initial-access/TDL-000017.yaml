rule_id: TDL-AUTH-000017
v4_id: '000017'
name: HVT Account Password Reset by Unauthorized User
description: Detects when the password of a high value target account has been changed by an unauthorized user.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4724'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=628 OR EventCode=4724)

    | lookup high_value_targets.csv username AS TargetUserName OUTPUT is_hvt

    | lookup authorized_account_modifiers.csv username AS SubjectUserName OUTPUT is_authorized

    | where is_hvt=1 AND (is_authorized!=1 OR isnull(is_authorized))

    | table _time, ComputerName, SubjectUserName, TargetUserName, EventCode

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (628, 4724)
    | where TargetAccount in ("Administrator", "Domain Admin", "Enterprise Admin", "Schema Admin", "Backup Operators", "Account Operators", "Server Operators", "Print Operators", "Replicator")
    | where SubjectUserName !in ("ADAdminUser", "PasswordResetService", "HelpDeskAdmin", "ITSecurityTeam")
    | project TimeGenerated, Computer, EventID, SubjectUserName, SubjectDomainName, TargetAccount, TargetDomainName, Activity
  aql: |
    SELECT eventtime, sourceip, username AS source_user, "Target Username" AS destination_user, LOGSOURCENAME(logsourceid) AS host, qidname(qid)
    FROM events
    WHERE "EventID" IN ('628', '4724')
      AND "Target Username" IN ('administrator', 'admin', 'domain admin', 'enterprise admin', 'schema admin', 'backup operator', 'server operator', 'account operator')
      AND username NOT IN ('authorized_admin1', 'authorized_admin2', 'IT_Support', 'helpdesk')
    LAST 24 HOURS
  yara_l: "rule high_value_target_password_reset_by_unauthorized_user {\n  meta:\n    author = \"TDL\"\n    description = \"Detects password reset\
    \ events on high value target accounts by unauthorized users\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique =\
    \ \"T1078\"\n    severity = \"HIGH\"\n\n  events:\n    $e.metadata.event_type = \"USER_CHANGE_PERMISSIONS\"\n    $e.metadata.product_event_type\
    \ = \"4724\"\n    $e.target.user.userid = $target_user\n    $e.principal.user.userid = $source_user\n    \n    // High Value Target Users\n\
    \    (\n      $target_user = \"Administrator\" or\n      $target_user = \"Domain Admin\" or\n      $target_user = \"Enterprise Admin\" or\n\
    \      re.regex($target_user, `(?i).*admin.*`) or\n      re.regex($target_user, `(?i).*svc.*`) or\n      re.regex($target_user, `(?i).*service.*`)\n\
    \    )\n    \n    // Exclude authorized users\n    not (\n      $source_user = \"HelpDesk\" or\n      $source_user = \"IT-Admin\" or\n   \
    \   $source_user = \"Password-Reset-Service\" or\n      re.regex($source_user, `(?i)^authorized_.*`)\n    )\n\n  match:\n    $target_user,\
    \ $source_user over 5m\n\n  outcome:\n    $risk_score = max(85)\n    $target_account = $target_user\n    $reset_by_user = $source_user\n\n\
    \  condition:\n    $e\n}\n"
  esql: "FROM logs-system.security*, logs-windows.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.code IN (\"628\"\
    , \"4724\")\n  AND winlog.event_data.TargetUserName IN (\"Administrator\", \"Domain Admins\", \"Enterprise Admins\", \"krbtgt\", \"admin\"\
    )\n  AND winlog.event_data.SubjectUserName NOT IN (\"SYSTEM\", \"LOCAL SERVICE\", \"NETWORK SERVICE\", \"helpdesk_admin\", \"IT_Support\"\
    )\n| STATS reset_count = COUNT(*) BY host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, @timestamp\n| KEEP @timestamp,\
    \ host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, reset_count\n"
  leql: |
    where(source_json.EventID IN [628, 4724] AND destination_user IN ["HighValueUser1", "HighValueUser2", "HighValueUser3"] AND source_user NOT IN ["AuthorizedAdmin1", "AuthorizedAdmin2", "AuthorizedAdmin3"])
  crowdstrike: "EventCode=4724 \n| TargetUserName in [file=\"hvt_users.txt\"]\n| SubjectUserName not in [file=\"authorized_admins.txt\"]\n| table([@timestamp,\
    \ ComputerName, SubjectUserName, TargetUserName, EventCode])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (628, 4724)
    | filter action_evtlog_event_data_TargetUserName in ("Administrator", "Domain Admins", "Enterprise Admins", "Schema Admins", "Backup Operators")
    | filter action_evtlog_event_data_SubjectUserName not in ("IT_AdminUser1", "IT_AdminUser2", "ServiceDesk")
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_TargetUserName, action_evtlog_event_id
  lucene: |
    event.code:4724 AND _exists_:destination.user.name AND NOT _exists_:source.user.name
    ```

    However, if your field mappings use different conventions for the authorized users list filter, you may need:

    ```
    event.code:4724
    ```

    Note: The "High Value Target User List" and "Users Authorized to Modify User Accounts List" filters are typically implemented as lookup tables or enrichment lists in the SIEM platform (OpenSearch/Graylog/Exabeam) rather than within the Lucene query string itself. The query string filters to the event type, and the exclusion logic is applied via the platform's correlation rules or alert conditions referencing those lists.

    If you need the query to explicitly reference user fields as they appear in your logs:

    ```
    event.code:4724 AND _exists_:winlog.event_data.TargetUserName
  sumo: |
    _sourceCategory=*Windows*Security* ("628" OR "4724")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "SubjectUserName" as source_user
    | where event_id in ("628", "4724")
    | where target_user in ("Administrator", "Domain Admin", "Enterprise Admin", "krbtgt", "admin")
    | where !(source_user in ("svc_admin", "helpdesk", "IT_Admin", "service_account"))
    | fields _messageTime, _sourceHost, event_id, source_user, target_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Password Reset Event\nWhere the Event ID is in [628, 4724] \nWhere the Destination Username is in the High Value Target\
  \ User List\nWhere the Source Username is NOT in the Users Authorized to Modify User Accounts List"
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

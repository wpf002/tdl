rule_id: TDL-AUTH-000018
v4_id: 000018
name: Unauthorized Password Reset Attempt
description: Detects when an unauthorized user attempts to reset a password.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4724'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=628 OR EventCode=4724)

    | eval DestUserName=coalesce(TargetUserName, Target_User_Name, User_Name)

    | eval SrcUserName=coalesce(SubjectUserName, Subject_User_Name, Account_Name)

    | where NOT match(DestUserName, "(?i)(Administrator|Domain Admin|Enterprise Admin)")

    | where NOT match(SrcUserName, "(?i)(helpdesk|admin)")

    | where NOT match(SrcUserName, "\$$")

    | where NOT match(DestUserName, "\$$")

    | table _time, ComputerName, SrcUserName, DestUserName, EventCode

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (628, 4724)
    | where TargetAccount !endswith "$"
    | where SubjectUserName !endswith "$"
    | where TargetAccount !in ("Administrator", "krbtgt", "SYSTEM")
    | where SubjectUserName !in ("Administrator", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
    | project TimeGenerated, Computer, EventID, SubjectUserName, TargetAccount, SubjectDomainName, TargetDomainName, Activity
  aql: |
    SELECT sourceip, username AS source_user, "Target Username" AS dest_user, LOGSOURCENAME(logsourceid) AS host, eventtime, COUNT(*) AS event_count
    FROM events
    WHERE "EventID" IN ('628', '4724')
      AND "Target Username" NOT IN ('Administrator', 'Domain Admin', 'Enterprise Admin')
      AND username NOT IN ('AdminAccount1', 'PasswordResetService', 'HelpDesk')
      AND username NOT LIKE '%$'
      AND "Target Username" NOT LIKE '%$'
    GROUP BY sourceip, username, "Target Username", LOGSOURCENAME(logsourceid), eventtime
    LAST 24 HOURS
  yara_l: |
    rule windows_unauthorized_password_reset {
      meta:
        author = "Detection Engineer"
        description = "Detects unauthorized password reset attempts (T1078 - Valid Accounts)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        ($e.metadata.product_event_type = "628" or $e.metadata.product_event_type = "4724")
        $e.target.user.userid = $dest_user
        $e.principal.user.userid = $src_user
        not re.regex($src_user, `\$$`)
        not re.regex($dest_user, `\$$`)
        $e.principal.hostname = $host

      match:
        $host, $src_user, $dest_user over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: "FROM logs-windows.security*, logs-system.security*, winlogbeat-*\n| WHERE event.code IN (\"628\", \"4724\") \n  AND NOT ENDS_WITH(winlog.event_data.SubjectUserName,\
    \ \"$\")\n  AND NOT ENDS_WITH(winlog.event_data.TargetUserName, \"$\")\n  AND winlog.event_data.TargetUserName NOT IN (\"Administrator\",\
    \ \"admin\", \"root\", \"Domain Admin\", \"Enterprise Admin\")\n  AND winlog.event_data.SubjectUserName NOT IN (\"svc_helpdesk\", \"Administrator\"\
    , \"IT_Admin\", \"PasswordResetService\")\n| KEEP @timestamp, host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName,\
    \ winlog.event_data.SubjectDomainName, winlog.event_data.TargetDomainName\n"
  leql: |
    where(source_json.EventID=4724 AND destination_user NOT ENDS-WITH "$" AND source_user NOT ENDS-WITH "$")
  crowdstrike: |
    EventCode=4724
    | SubjectUserName != /.*\$$/
    | TargetUserName != /.*\$$/
    | table([@timestamp, ComputerName, SubjectUserName, TargetUserName, SubjectDomainName, TargetDomainName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (628, 4724)
    | alter dest_user = action_evtlog_event_data_TargetUserName,
            source_user = coalesce(action_evtlog_event_data_SubjectUserName, actor_effective_username)
    | filter dest_user not in ("Administrator", "admin", "root", "domain_admin")
    | filter source_user not in ("Administrator", "admin", "svc_account_mgmt", "helpdesk_admin")
    | filter source_user !~= "\$$"
    | filter dest_user !~= "\$$"
    | fields _time, agent_hostname, source_user, dest_user, action_evtlog_event_id, action_evtlog_message
  lucene: |
    event.code:4724 AND NOT user.target.name:(HighValueUser1 OR HighValueUser2 OR HighValueUser3) AND NOT user.name:(AuthorizedAdmin1 OR AuthorizedAdmin2 OR AuthorizedAdmin3) AND NOT user.name:*$ AND NOT user.target.name:*$
  sumo: |
    _sourceCategory=*Windows*Security* ("628" OR "4724")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "SubjectUserName" as src_user
    | where event_id in ("628", "4724")
    | where !(dest_user matches "*$")
    | where !(src_user matches "*$")
    | fields _messageTime, _sourceHost, event_id, src_user, dest_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Password Reset Event\nWhere the Event ID is in [628, 4724] \nWhere the Destination Username is NOT in the High Value\
  \ Target User List\nWhere the Source Username is NOT in the Users Authorized to Modify User Accounts List\nWhere the Source Username does NOT\
  \ end with \"$\" \nWhere the Destination Username does NOT end with \"$\""
suppression:
  window: 24 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

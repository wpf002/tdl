rule_id: TDL-AUTH-000020
v4_id: '000020'
name: Kerberos Account Password Reset
description: Detects when the Kerberos account (krbtgt) password has been reset or changed. This could indicate an attacker attempting to create
  fake kerberos tickets within the environment. This password is typically only reset when a domain has already been compromised and recovery
  has begun.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4724'
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security (EventCode=628 OR EventCode=4724) TargetUserName="krbtgt"

    | table _time, ComputerName, SubjectUserName, TargetUserName, EventCode

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (628, 4724)
    | where TargetUserName =~ "krbtgt"
    | project TimeGenerated, Computer, Account, TargetUserName, SubjectUserName, SubjectAccount, EventID, Activity
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Target Username", sourceip, destinationip, COUNT(*) AS reset_count
    FROM events
    WHERE "EventID" IN ('628', '4724')
      AND ("Target Username" = 'krbtgt' OR "Target Username" ILIKE '%krbtgt%')
    LAST 24 HOURS
  yara_l: |
    rule krbtgt_password_reset {
      meta:
        author = "Detection Engineer"
        description = "Detects password reset of krbtgt account - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.event_type = "USER_CHANGE_PASSWORD"
        ($e.metadata.product_event_type = "628" or $e.metadata.product_event_type = "4724")
        $e.target.user.userid = "krbtgt"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE event.code IN ("628", "4724") AND TO_LOWER(winlog.event_data.TargetUserName) == "krbtgt"
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName, winlog.event_data.SubjectDomainName
  leql: |
    where(source_json.EventID IN [628, 4724] AND source_json.TargetUserName="krbtgt")
  crowdstrike: |
    EventCode=4724 TargetUserName=krbtgt
    | table([@timestamp, ComputerName, SubjectUserName, TargetUserName, TargetDomainName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (628, 4724)
    | filter lowercase(action_evtlog_event_data_TargetUserName) = "krbtgt"
    | fields _time, agent_hostname, action_evtlog_event_id, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_SubjectUserName
  lucene: |
    event.code:4724 AND winlog.event_data.TargetUserName:krbtgt
  sumo: |
    _sourceCategory=*Windows* (EventID="628" OR EventID="4724")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | where event_id in ("628", "4724")
    | where target_user = "krbtgt"
    | fields _messageTime, _sourceHost, event_id, target_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows Password Reset Event\nWhere the Event ID is in [628, 4724] \nWhere the Destination Username is \"krbtgt\""
suppression:
  window: 8 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

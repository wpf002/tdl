rule_id: TDL-AUTH-000022
v4_id: '000022'
name: Okta User Impersonation
description: Detects when a user is impersonating another user to grant themselves access into the environment with the permission of the user
  they are impersonating.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=okta sourcetype=OktaIM2:log eventType IN ("user.session.impersonation.grant", "user.session.impersonation.initiate")

    | table _time, actor.alternateId, actor.displayName, target.alternateId, target.displayName, eventType, client.ipAddress, client.userAgent.rawUserAgent,
    outcome.result

    '
  kql: |
    Okta_CL
    | where TimeGenerated > ago(24h)
    | where eventType_s in ("user.session.impersonation.grant", "user.session.impersonation.initiate")
    | project TimeGenerated, eventType_s, actor_alternateId_s, actor_displayName_s, target_alternateId_s, target_displayName_s, client_ipAddress_s, client_userAgent_rawUserAgent_s, outcome_result_s, outcome_reason_s
  aql: |
    SELECT eventtime, username, sourceip, "Event Type", "Target Username", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Event Type" IN ('user.session.impersonation.grant', 'user.session.impersonation.initiate')
    LAST 24 HOURS
  yara_l: |
    rule okta_session_impersonation_access {
      meta:
        author = "TDL"
        description = "Detects Okta admin session impersonation events - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Okta"
        (
          $e.metadata.product_event_type = "user.session.impersonation.grant" or
          $e.metadata.product_event_type = "user.session.impersonation.initiate"
        )
        $e.principal.user.userid = $admin
        $e.target.user.userid = $impersonated_user

      match:
        $admin, $impersonated_user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-okta*
    | WHERE event.action IN ("user.session.impersonation.grant", "user.session.impersonation.initiate")
    | KEEP @timestamp, event.action, user.name, okta.actor.id, okta.actor.display_name, okta.target.id, okta.target.display_name, source.ip, user_agent.original
  leql: |
    where(source_json.eventType IN [user.session.impersonation.grant, user.session.impersonation.initiate])
  crowdstrike: |
    (#type=okta OR event_simpleName=OktaSystemLog) (eventType=user.session.impersonation.grant OR eventType=user.session.impersonation.initiate)
    | table([@timestamp, actor.alternateId, actor.displayName, target.alternateId, target.displayName, eventType, client.ipAddress, client.userAgent.rawUserAgent])
  xql: |
    dataset = okta_raw_data
    | filter event_type in ("user.session.impersonation.grant", "user.session.impersonation.initiate")
    | fields _time, actor_id, actor_alternate_id, target_user_id, target_user_alternate_id, event_type, event_result, client_ip, client_location, client_user_agent
  lucene: |
    eventType:(user.session.impersonation.grant OR user.session.impersonation.initiate)
  sumo: |
    _sourceCategory=*Okta*
    | json field=_raw "eventType" as event_type
    | where event_type in ("user.session.impersonation.grant", "user.session.impersonation.initiate")
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: Where Event Type in [user.session.impersonation.grant, user.session.impersonation.initiate]
suppression:
  window: 8 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

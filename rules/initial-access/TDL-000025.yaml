rule_id: TDL-AUTH-000025
v4_id: '000025'
name: Anonymous User SharePoint Access
description: Detects when an anonymous user accesses a SharePoint or OneDrive resource through an anonymous link. Anonymous links can be used
  by any authenticated or unauthenticated users and may lead to leaking sensitive data outside of the organization.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1133
technique_name: External Remote Services
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype=*sharepoint* OR sourcetype=*o365* OR sourcetype=*microsoft365* Application="*SharePoint*" OR Workload="SharePoint"
    Operation="AnonymousLinkUsed" UserId="anonymous"

    | table _time, UserId, Operation, Application, Workload, ObjectId, ItemType, SiteUrl, SourceFileName, ClientIP

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "SharePoint"
    | where Operation == "AnonymousLinkUsed"
    | where UserId == "anonymous"
    | project TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, OfficeObjectId, Site_Url, SourceFileExtension, SourceFileName, UserAgent
  aql: |
    SELECT eventtime, sourceip, destinationip, "Operation", "UserId", "ObjectId", "ItemType", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%sharepoint%'
      AND "Operation" = 'AnonymousLinkUsed'
      AND "UserId" ILIKE '%anonymous%'
    LAST 24 HOURS
  yara_l: |
    rule sharepoint_anonymous_link_used {
      meta:
        author = "TDL"
        description = "Detects anonymous link usage in SharePoint (T1133 - External Remote Services)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1133"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Microsoft 365"
        $e.metadata.vendor_name = "Microsoft"
        $e.target.application = "SharePoint"
        $e.metadata.product_event_type = "AnonymousLinkUsed"
        $e.principal.user.userid = "anonymous"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.dataset == \"o365.audit\" \n  AND o365.audit.Workload == \"\
    SharePoint\"\n  AND o365.audit.Operation == \"AnonymousLinkUsed\"\n  AND TO_LOWER(user.id) == \"anonymous\"\n| KEEP @timestamp, host.name,\
    \ user.id, o365.audit.Operation, o365.audit.ObjectId, source.ip, user_agent.original\n"
  leql: |
    where(source_json.Application=SharePoint AND source_json.Operation=AnonymousLinkUsed AND source_json.UserId=anonymous)
  crowdstrike: |
    #event_platform=Microsoft365 #repo=o365 Workload=SharePoint Operation=AnonymousLinkUsed UserId=anonymous
    | table([@timestamp, ComputerName, UserId, Operation, Workload, ClientIP, ObjectId, SiteUrl])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and logon_type = "SHAREPOINT" and raw_log.Operation = "AnonymousLinkUsed" and raw_log.UserId = "anonymous"
    | fields _time, raw_log.Workload, raw_log.Operation, raw_log.UserId, raw_log.ObjectId, raw_log.ClientIP, raw_log.UserAgent
  lucene: |
    application:Sharepoint AND Operation:AnonymousLinkUsed AND UserId:anonymous
  sumo: |
    _sourceCategory=*Sharepoint* OR _sourceCategory=*Microsoft365* OR _sourceCategory=*Office365*
    | json field=_raw "Application" as application
    | json field=_raw "Operation" as operation
    | json field=_raw "UserId" as user_id
    | where application = "SharePoint" and operation = "AnonymousLinkUsed" and user_id = "anonymous"
    | fields _messageTime, _sourceHost, application, operation, user_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Sharepoint Event \nWhere the application is [Sharepoint]\nWhere the Operation is \"AnonymousLinkUsed\" \nWhere the UserId is\
  \ \"anonymous\""
suppression:
  window: 12 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

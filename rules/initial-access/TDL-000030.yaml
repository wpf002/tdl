rule_id: TDL-AUTH-000030
v4_id: '000030'
name: Activity from Infrequent Country
description: Detects a user anomaly where a user is identified performing Office 365 activity from a location that wasn't recently visited by
  any user in the organization.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- O365 ATP
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=o365 sourcetype="o365:management:activity" Operation=AlertTriggered Name="Activity from infrequent country"

    | table _time, UserId, ClientIP, Name, Severity, Category, UserAgent

    '
  kql: |
    CloudAppEvents
    | where TimeGenerated > ago(24h)
    | where Application == "Microsoft Cloud App Security"
    | where ActionType == "AlertTriggered"
    | where RawEventData.Data.alert.title == "Activity from infrequent country"
    | project TimeGenerated, AccountDisplayName, AccountObjectId, IPAddress, CountryCode, RawEventData
  aql: "SELECT username, sourceip, destinationip, QIDNAME(qid), \"Alert Name\", \"Operation\", eventtime\nFROM events\nWHERE \"Operation\" = 'AlertTriggered'\
    \ \n  AND \"Alert Name\" = 'Activity from infrequent country'\nLAST 24 HOURS\n"
  yara_l: |
    rule o365_atp_activity_from_infrequent_country {
      meta:
        author = "TDL"
        description = "Detects O365 ATP alert for activity from infrequent country - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Microsoft Office 365"
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.event_type = "USER_UNCATEGORIZED"
        $e.security_result.summary = "Activity from infrequent country"
        $e.metadata.product_log_id = "AlertTriggered"
        $e.target.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-o365*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action == \"AlertTriggered\" \n  AND o365.audit.Name == \"Activity\
    \ from infrequent country\"\n| KEEP @timestamp, user.name, source.ip, source.geo.country_name, host.name, event.id, o365.audit.AlertEntityId,\
    \ o365.audit.AlertLinks\n"
  leql: |
    where(source_json.Operation="AlertTriggered" AND source_json.alert_name="Activity from infrequent country")
  crowdstrike: |
    #dataSource=O365ATP Operation="AlertTriggered" Name="Activity from infrequent country"
    | table([@timestamp, ComputerName, UserName, Operation, Name, RawActivityObject])
  xql: |
    dataset = msft_azure_raw
    | filter event_platform = "Office 365 ATP" and operation = "AlertTriggered" and alert_name = "Activity from infrequent country"
    | fields _time, user_name, alert_name, operation, event_data
  lucene: |
    Operation:"AlertTriggered" AND alert_name:"Activity from infrequent country"
  sumo: |
    _sourceCategory=*O365* OR _sourceCategory=*CloudAppSecurity* OR _sourceCategory=*MCAS*
    | json field=_raw "Operation" as operation
    | json field=_raw "AlertName" as alert_name
    | where operation = "AlertTriggered" and alert_name = "Activity from infrequent country"
    | fields _messageTime, _sourceHost, operation, alert_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Microsoft Cloud App Security Event

  Where the Operation is "AlertTriggered"

  Where the Alert Name is "Activity from infrequent country"'
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000036
v4_id: '000036'
name: Password Spraying
description: Detects a potential password spraying attack against Windows accounts. Attackers may have gathered a list of user accounts and could
  be attempting to use common passwords against each one in order to compromise the accounts.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4625'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625)
    | eval dest_user_not_machine=if(NOT like(TargetUserName, "%$"), 1, 0)
    | search dest_user_not_machine=1
    | eval failure_code=coalesce(Failure_Code, Status)
    | eval is_windows_specific=if(failure_code="0xC000006A" AND (EventCode=529 OR EventCode=4625), 1, 0)
    | eval src_ip=coalesce(Source_Network_Address, IpAddress, src)
    | eval dest_host=coalesce(ComputerName, dest)
    | eval event_type=case(
        is_windows_specific=1, "windows",
        EventCode=4625 OR EventCode=529, "generic",
        1=1, "other"
    )
    | search event_type IN ("windows", "generic")
    | lookup domain_controllers.csv host AS dest_host OUTPUT is_dc
    | lookup mail_servers.csv host AS src_ip OUTPUT is_mail_server
    | lookup auth_servers.csv host AS src_ip OUTPUT is_auth_server
    | eval is_dc=coalesce(is_dc, 0)
    | eval is_mail_server=coalesce(is_mail_server, 0)
    | eval is_auth_server=coalesce(is_auth_server, 0)
    | search is_dc=0 AND is_mail_server=0 AND is_auth_server=0
    | bin _time span=3m
    | stats dc(TargetUserName) as unique_users, count, values(TargetUserName) as target_users, values(EventCode) as event_codes, dc(EventCode) as unique_event_codes, max(event_type) as detection_type by _time, src_ip, dest_host
    | where (detection_type="windows" AND count>=5 AND unique_users>=5 AND unique_event_codes=1) OR (detection_type="generic" AND count>=5 AND unique_users>=5)
    | table _time, src_ip, dest_host, unique_users, count, target_users, event_codes, detection_type
  kql: 'SecurityEvent

    | where TimeGenerated > ago(1d)

    | where event_id in ("4625")

    | summarize Count=count() by Computer, Account, IpAddress, LogonType, EventID

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, username, hostname, \"Logon Type\" as logon_type, eventid\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Windows%'\n  AND \"event_id\" IN ('4625')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000036 {\n  meta:\n    author = \"TDL\"\n    description = \"Password Spraying\"\n    severity = \"LOW\"\n    tactic\
    \ = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    $e.event_id = /(4625)/\n    $user =\
    \ $e.target.user.userid\n  match:\n    $user over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-windows.security*,logs-system.security*

    | WHERE @timestamp > NOW() - 1 day

    | WHERE event.category == "authentication" AND event_id IN ("4625")

    | STATS count = COUNT(*) BY host.name, user.name, source.ip, winlog.event_data.LogonType, event.code

    | SORT count DESC

    '
  leql: 'where(logset IN ["Active Directory", "Asset Authentication"] AND event_id IN [4625])

    groupby(destination_account, source_ip, asset)

    calculate(count)

    '
  crowdstrike: 'event_simpleName IN (UserLogon, UserLogonFailed2, AuthenticationFailedRdp) AND event_id IN (4625)

    | stats count as auth_events by ComputerName, UserName, RemoteIP, LogonType

    | sort -auth_events

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.LOGIN AND event_id in ("4625")

    | comp count() as logins by agent_hostname, actor_effective_username, action_remote_ip, action_logon_type

    | sort desc logins

    '
  lucene: 'event.category:"authentication" AND event_id:(4625)

    '
  sumo: '_sourceCategory=*windows*security* OR _sourceCategory=*ad*

    | parse "EventID=*\"" as event_id nodrop

    | where event_id IN ("4625")

    | count by host, user, src_ip, logon_type, event_id

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure Events \nFrom the same internal Source IP to the same Destination\nWhere the Event ID in [529,\
  \ 4625]\nWhere the Failure Code is \"0xC000006A\"\nWhere the Destination Username does NOT end with \"$\" \nWhere the Destination IP/Hostname\
  \ is NOT on the Domain Controller List \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source IP/Hostname is NOT on\
  \ a Central Authentication Server List \nWith unique Destination Usernames \nWith the same Event ID \nWithin 3 minutes \n\n---------------------------------------------------------------------------------------------------------------\n\
  \n5 Failed Authentication Events \nFrom the same internal Source IP to the same Destination\nWhere the Destination Username does NOT end with\
  \ \"$\" \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source IP/Hostname is NOT on a Central Authentication Server\
  \ List \nWith unique Destination Usernames\nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000036
v4_id: '000036'
name: Password Spraying
description: Detects a potential password spraying attack against Windows accounts. Attackers may have gathered a list of user accounts and could
  be attempting to use common passwords against each one in order to compromise the accounts.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4625'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=529 OR EventCode=4625)\n| eval dest_user_not_machine=if(NOT like(TargetUserName,\
    \ \"%$\"), 1, 0)\n| search dest_user_not_machine=1\n| eval failure_code=coalesce(Failure_Code, Status)\n| eval is_windows_specific=if(failure_code=\"\
    0xC000006A\" AND (EventCode=529 OR EventCode=4625), 1, 0)\n| eval src_ip=coalesce(Source_Network_Address, IpAddress, src)\n| eval dest_host=coalesce(ComputerName,\
    \ dest)\n| eval event_type=case(\n    is_windows_specific=1, \"windows\",\n    EventCode=4625 OR EventCode=529, \"generic\",\n    1=1, \"\
    other\"\n)\n| search event_type IN (\"windows\", \"generic\")\n| lookup domain_controllers.csv host AS dest_host OUTPUT is_dc\n| lookup mail_servers.csv\
    \ host AS src_ip OUTPUT is_mail_server\n| lookup auth_servers.csv host AS src_ip OUTPUT is_auth_server\n| eval is_dc=coalesce(is_dc, 0)\n\
    | eval is_mail_server=coalesce(is_mail_server, 0)\n| eval is_auth_server=coalesce(is_auth_server, 0)\n| search is_dc=0 AND is_mail_server=0\
    \ AND is_auth_server=0\n| bin _time span=3m\n| stats dc(TargetUserName) as unique_users, count, values(TargetUserName) as target_users, values(EventCode)\
    \ as event_codes, dc(EventCode) as unique_event_codes, max(event_type) as detection_type by _time, src_ip, dest_host\n| where (detection_type=\"\
    windows\" AND count>=5 AND unique_users>=5 AND unique_event_codes=1) OR (detection_type=\"generic\" AND count>=5 AND unique_users>=5)\n| table\
    \ _time, src_ip, dest_host, unique_users, count, target_users, event_codes, detection_type\n"
  kql: "let WindowsThreshold = 5;\nlet LinuxThreshold = 5;\nlet TimeWindow = 3m;\nlet DomainControllers = dynamic([\"DC01\", \"DC02\"]);\nlet\
    \ MailServers = dynamic([\"MAIL01\", \"MAIL02\"]);\nlet AuthServers = dynamic([\"AUTH01\", \"AUTH02\"]);\nSecurityEvent\n| where TimeGenerated\
    \ > ago(1h)\n| where (EventID == 4625 or EventID == 529) or (EventID == 4625)\n| extend FailureReason = tostring(parse_xml(EventData).EventData.Data[8])\n\
    | extend SourceIP = IpAddress\n| extend DestinationUser = TargetAccount\n| extend DestinationHost = Computer\n| where DestinationUser !endswith\
    \ \"$\"\n| where DestinationHost !in (DomainControllers)\n| where SourceIP !in (MailServers) and Computer !in (MailServers)\n| where SourceIP\
    \ !in (AuthServers) and Computer !in (AuthServers)\n| extend IsWindows = iff(EventID in (4625, 529) and FailureReason == \"0xC000006A\", 1,\
    \ 0)\n| extend IsLinux = iff(EventID == 4625 and IsWindows == 0, 1, 0)\n| summarize \n    WindowsFailures = countif(IsWindows == 1),\n   \
    \ LinuxFailures = countif(IsLinux == 1),\n    UniqueUsers = dcount(DestinationUser),\n    EventIDs = make_set(EventID),\n    Users = make_set(DestinationUser),\n\
    \    FirstEvent = min(TimeGenerated),\n    LastEvent = max(TimeGenerated)\n    by SourceIP, DestinationHost, bin(TimeGenerated, TimeWindow)\n\
    | where (WindowsFailures >= WindowsThreshold and array_length(EventIDs) == 1) or LinuxFailures >= LinuxThreshold\n| where UniqueUsers >= 2\n\
    | where datetime_diff('minute', LastEvent, FirstEvent) <= 3\n| project TimeGenerated, SourceIP, DestinationHost, WindowsFailures, LinuxFailures,\
    \ UniqueUsers, Users, EventIDs, FirstEvent, LastEvent\n"
  aql: |
    SELECT sourceip, destinationip, LOGSOURCENAME(logsourceid) AS destination_host, COUNT(*) AS failure_count, UNIQUECOUNT(username) AS unique_users, LISTAGG(username) AS usernames
    FROM events
    WHERE "EventID" IN ('529', '4625')
      AND username NOT LIKE '%$'
      AND destinationip NOT IN (SELECT ip FROM reference_set WHERE name='Domain_Controllers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name='Mail_Servers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name='Central_Auth_Servers')
      AND ("Status" = '0xC000006A' OR "Failure Code" = '0xC000006A' OR "Sub Status" = '0xC000006A')
    GROUP BY sourceip, destinationip, LOGSOURCENAME(logsourceid)
    HAVING unique_users >= 5 AND failure_count >= 5
    LAST 3 MINUTES
  yara_l: "rule brute_force_auth_failure_t1078 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects brute force authentication attempts\
    \ (MITRE T1078) via multiple failed login events from same source to same destination with unique usernames\"\n    mitre_attack_tactic = \"\
    Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\
    \n    $e.security_result.action = \"BLOCK\"\n    (\n      $e.metadata.product_event_type = \"4625\" or\n      $e.metadata.product_event_type\
    \ = \"529\"\n    )\n    $e.security_result.summary = \"0xC000006A\"\n    not re.regex($e.target.user.userid, `\\$$`)\n    $e.principal.ip\
    \ = $src_ip\n    $e.target.hostname = $dst_host\n    $e.target.user.userid = $user\n    \n  match:\n    $src_ip, $dst_host over 3m\n    \n\
    \  outcome:\n    $risk_score = max(75)\n    $failed_users = array_distinct($e.target.user.userid)\n    $event_count = count_distinct($e.metadata.id)\n\
    \    $unique_user_count = count_distinct($e.target.user.userid)\n    \n  condition:\n    #e >= 5 and $unique_user_count >= 5\n}\n"
  esql: "FROM logs-system.security*, logs-windows.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 3 minutes\n  AND (winlog.event_id IN (529,\
    \ 4625) OR event.code IN (\"529\", \"4625\"))\n  AND (\n    (winlog.event_data.Status == \"0xC000006A\" OR winlog.event_data.SubStatus ==\
    \ \"0xC000006A\")\n    OR event.code IN (\"529\", \"4625\")\n  )\n  AND NOT ENDS_WITH(user.name, \"$\")\n  AND NOT (host.name LIKE \"*dc*\"\
    \ OR host.name LIKE \"*domaincontroller*\")\n  AND NOT (source.ip LIKE \"*mail*\" OR source.ip LIKE \"*smtp*\" OR host.name LIKE \"*mail*\"\
    \ OR host.name LIKE \"*smtp*\")\n  AND NOT (source.ip LIKE \"*auth*\" OR host.name LIKE \"*auth*\" OR host.name LIKE \"*ldap*\" OR host.name\
    \ LIKE \"*ad*\")\n| EVAL event_id = COALESCE(TO_STRING(winlog.event_id), event.code)\n| STATS \n    unique_users = COUNT_DISTINCT(user.name),\n\
    \    event_count = COUNT(*),\n    event_ids = VALUES(event_id),\n    usernames = VALUES(user.name)\n  BY source.ip, destination.ip, host.name,\
    \ time_window = BUCKET(@timestamp, 3 minutes)\n| WHERE unique_users >= 5 AND event_count >= 5\n| KEEP time_window, source.ip, destination.ip,\
    \ host.name, unique_users, event_count, event_ids, usernames\n"
  leql: |
    where(source_json.EventID IN [529, 4625] AND source_json.Status="0xC000006A" AND destination_user=/^(?!.*\$$).*$/ AND destination_asset NOT IN ["DC1", "DC2", "DC3"] AND source_asset NOT IN ["MAIL1", "MAIL2", "AUTHSERVER1"]) groupby(source_address, destination_asset) calculate(unique:destination_user)
  crowdstrike: |
    EventCode IN [529, 4625]
    | FailureCode="0xC000006A" OR FailureCode=*
    | TargetUserName != *$
    | !match(field=DestinationHostname, regex=/^(dc01|dc02|dc03)$/i, include=false)
    | !match(field=IpAddress, regex=/^(10\.0\.1\.10|10\.0\.1\.11|192\.168\.5\.20)$/i, include=false)
    | !match(field=IpAddress, regex=/^(10\.0\.2\.50|10\.0\.2\.51|auth\.internal)$/i, include=false)
    | groupBy([IpAddress, DestinationHostname, EventCode], function=[count(TargetUserName, distinct=true, as=unique_users), count(as=total_events), collect([TargetUserName, ComputerName, @timestamp])])
    | unique_users >= 5
    | total_events >= 5
    | test(within(3m))
    | table([IpAddress, DestinationHostname, EventCode, unique_users, total_events, @timestamp])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (529, 4625)\n    and action_evtlog_event_data_Status = \"0xC000006A\"\n    and\
    \ action_evtlog_event_data_TargetUserName not regexmatch \"\\$$\"\n| alter source_ip = coalesce(action_remote_ip, actor_process_remote_ip)\n\
    | filter source_ip != null and agent_hostname != null\n| bin _time span = 3m\n| comp count_distinct(action_evtlog_event_data_TargetUserName)\
    \ as unique_users, \n       count() as total_failures,\n       values(action_evtlog_event_data_TargetUserName) as target_users,\n       values(action_evtlog_event_id)\
    \ as event_ids\n       by _time, source_ip, agent_hostname\n| filter unique_users >= 5 and total_failures >= 5\n| fields _time, source_ip,\
    \ agent_hostname, unique_users, total_failures, target_users, event_ids\n"
  lucene: |
    (event.code:(529 OR 4625) AND winlog.event_data.Status:"0xC000006A" AND NOT winlog.event_data.TargetUserName:*$ AND NOT winlog.computer_name:(dc01 OR dc02 OR dc03) AND NOT source.ip:(mailserver1 OR mailserver2) AND NOT source.ip:(authserver1 OR authserver2)) OR (event.category:authentication AND event.outcome:failure AND NOT user.name:*$ AND NOT source.ip:(mailserver1 OR mailserver2) AND NOT source.ip:(authserver1 OR authserver2))
  sumo: |
    _sourceCategory=*Windows*Security* ("4625" OR "529")
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "WorkstationName" as src_host
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "Computer" as dest_host
    | json field=_raw "Status" as failure_code
    | where event_id in ("4625", "529")
    | where failure_code = "0xC000006A"
    | where !(dest_user matches "*$")
    | where !(dest_host matches "*DC01*" or dest_host matches "*DC02*" or dest_host matches "*DomainController*")
    | where !(src_ip matches "*MailServer*" or src_host matches "*MailServer*" or src_ip matches "*Exchange*" or src_host matches "*Exchange*")
    | where !(src_ip matches "*AuthServer*" or src_host matches "*AuthServer*" or src_ip matches "*NPS*" or src_host matches "*NPS*")
    | timeslice 3m
    | count_distinct(dest_user) as unique_users, count as total_attempts by _timeslice, src_ip, dest_host, event_id
    | where unique_users >= 5 and total_attempts >= 5
    | fields _timeslice, src_ip, dest_host, event_id, unique_users, total_attempts
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure Events \nFrom the same internal Source IP to the same Destination\nWhere the Event ID in [529,\
  \ 4625]\nWhere the Failure Code is \"0xC000006A\"\nWhere the Destination Username does NOT end with \"$\" \nWhere the Destination IP/Hostname\
  \ is NOT on the Domain Controller List \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source IP/Hostname is NOT on\
  \ a Central Authentication Server List \nWith unique Destination Usernames \nWith the same Event ID \nWithin 3 minutes \n\n---------------------------------------------------------------------------------------------------------------\n\
  \n5 Failed Authentication Events \nFrom the same internal Source IP to the same Destination\nWhere the Destination Username does NOT end with\
  \ \"$\" \nWhere the Source IP/Hostname is NOT on a Mail Server List \nWhere the Source IP/Hostname is NOT on a Central Authentication Server\
  \ List \nWith unique Destination Usernames\nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

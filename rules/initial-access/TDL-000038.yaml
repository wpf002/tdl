rule_id: TDL-AUTH-000038
v4_id: 000038
name: Password Spraying - 4776
description: Detects a potential password spraying attack against Windows accounts. Attackers may have gathered a list of user accounts and could
  be attempting to use common passwords against each one in order to compromise the accounts.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4776'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=windows sourcetype=WinEventLog:Security (EventCode=680 OR EventCode=681 OR EventCode=4776) Failure_Code=\"0xC000006A\" \n| where\
    \ NOT match(Dest_User_Name, \"\\$$\") \n| search NOT [ | inputlookup domain_controllers.csv | fields Destination | format ] \n| search NOT\
    \ [ | inputlookup mail_servers.csv | fields Source_Hostname | format ] \n| search NOT [ | inputlookup central_auth_servers.csv | fields Source_Hostname\
    \ | format ] \n| bin _time span=3m \n| stats dc(Dest_User_Name) as unique_users, values(Dest_User_Name) as usernames, values(EventCode) as\
    \ event_ids, dc(EventCode) as event_id_count by _time, Source_Hostname, Destination \n| where unique_users >= 5 AND event_id_count = 1\n|\
    \ table _time, Source_Hostname, Destination, EventCode, unique_users, usernames\n"
  kql: "SecurityEvent\n| where TimeGenerated > ago(3m)\n| where EventID in (680, 681, 4776)\n| where Status == \"0xC000006A\"\n| extend DestinationUser\
    \ = coalesce(TargetUserName, \"\")\n| extend SourceHost = coalesce(WorkstationName, IpAddress, \"\")\n| extend DestinationHost = coalesce(Computer,\
    \ \"\")\n| where DestinationUser !endswith \"$\"\n| where DestinationHost !in (\"DC01\", \"DC02\", \"DC03\")\n| where SourceHost !in (\"MAIL01\"\
    , \"MAIL02\")\n| where SourceHost !in (\"AUTH01\", \"AUTH02\")\n| summarize \n    FailureCount = count(),\n    UniqueUsers = dcount(DestinationUser),\n\
    \    EventIDs = make_set(EventID),\n    Users = make_set(DestinationUser),\n    FirstSeen = min(TimeGenerated),\n    LastSeen = max(TimeGenerated)\n\
    \    by SourceHost, DestinationHost, bin(TimeGenerated, 3m)\n| where FailureCount >= 5\n| where UniqueUsers >= 5\n| where array_length(EventIDs)\
    \ == 1\n| project FirstSeen, LastSeen, SourceHost, DestinationHost, FailureCount, UniqueUsers, EventID = tostring(EventIDs[0]), Users\n"
  aql: |
    SELECT sourceip, destinationip, "EventID", "Destination Username", LOGSOURCENAME(logsourceid) AS source_host, COUNT(*) AS failure_count, UNIQUECOUNT("Destination Username") AS unique_users
    FROM events
    WHERE "EventID" IN ('680', '681', '4776')
      AND "Failure Code" = '0xC000006A'
      AND "Destination Username" NOT LIKE '%$'
      AND destinationip NOT IN (SELECT ip FROM reference_set WHERE name = 'Domain_Controllers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name = 'Mail_Servers')
      AND sourceip NOT IN (SELECT ip FROM reference_set WHERE name = 'Central_Auth_Servers')
    GROUP BY sourceip, destinationip, "EventID"
    HAVING failure_count >= 5 AND unique_users >= 1
    LAST 3 MINUTES
  yara_l: |
    rule windows_auth_failure_brute_force {
      meta:
        author = "Detection Engineer"
        description = "Detects 5 Windows authentication failures from same source to same destination with failure code 0xC000006A within 3 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.action = "BLOCK"
        (
          $e.metadata.product_event_type = "680" or
          $e.metadata.product_event_type = "681" or
          $e.metadata.product_event_type = "4776"
        )
        re.regex($e.security_result.summary, `0xC000006A`)
        not re.regex($e.target.user.userid, `\$$`)
        $e.principal.hostname = $source_host
        $e.target.hostname = $dest_host
        $e.target.user.userid = $dest_user
        $e.metadata.product_event_type = $event_id

      match:
        $source_host, $dest_host, $event_id over 3m

      outcome:
        $risk_score = max(75)
        $failed_usernames = array_distinct($dest_user)
        $event_count = count_distinct($e.metadata.id)

      condition:
        #e >= 5 and #dest_user >= 5
    }
  esql: "FROM logs-system.security*\n| WHERE @timestamp > NOW() - 3 minutes\n  AND event.code IN (\"680\", \"681\", \"4776\")\n  AND winlog.event_data.Status\
    \ == \"0xC000006A\"\n  AND NOT ENDS_WITH(user.name, \"$\")\n| EVAL source_host = COALESCE(source.domain, winlog.event_data.Workstation, source.ip)\n\
    | EVAL dest_host = COALESCE(destination.domain, host.name, destination.ip)\n| WHERE dest_host NOT IN (\"DC01\", \"DC02\", \"DC03\")\n  AND\
    \ source_host NOT IN (\"MAIL01\", \"MAIL02\")\n  AND source_host NOT IN (\"AUTH01\", \"AUTH02\", \"SSO01\")\n| STATS \n    unique_users =\
    \ COUNT_DISTINCT(user.name),\n    event_count = COUNT(*),\n    event_ids = VALUES(event.code)\n  BY source_host, dest_host, bucket = BUCKET(@timestamp,\
    \ 3 minutes)\n| WHERE unique_users >= 5 AND event_count >= 5\n| KEEP bucket, source_host, dest_host, unique_users, event_count, event_ids\n"
  leql: |
    where(source_json.EventID IN [680, 681, 4776] AND source_json.Status="0xC000006A" AND source_json.TargetUserName NOT ENDS-WITH "$") groupby(source_asset, destination_asset, source_json.EventID) calculate(unique:source_json.TargetUserName)
  crowdstrike: |
    EventCode IN [680, 681, 4776] FailureCode="0xC000006A" TargetUserName!=*$
    | NOT (DestinationHostname IN [/* Domain Controller List */])
    | NOT (SourceHostname IN [/* Mail Server List */])
    | NOT (SourceHostname IN [/* Central Authentication Server List */])
    | groupBy([SourceHostname, DestinationHostname, EventCode], function=collect([TargetUserName, @timestamp]))
    | test(count(TargetUserName, distinct=true) >= 5)
    | test(max(@timestamp) - min(@timestamp) <= 3m)
    | table([SourceHostname, DestinationHostname, EventCode, TargetUserName, @timestamp])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (680, 681, 4776)
    | filter action_evtlog_message contains "0xC000006A"
    | filter action_evtlog_event_data_TargetUserName != null and not action_evtlog_event_data_TargetUserName ~= "\$$"
    | filter agent_hostname not in ("dc01", "dc02", "dc03")
    | filter action_evtlog_event_data_Workstation not in ("mail01", "mail02", "mailserver")
    | filter action_evtlog_event_data_Workstation not in ("auth01", "auth02", "authserver")
    | bin _time span=3m
    | comp count() as failure_count, count_distinct(action_evtlog_event_data_TargetUserName) as unique_users by _time, action_evtlog_event_data_Workstation, agent_hostname, action_evtlog_event_id
    | filter failure_count >= 5 and unique_users >= 1
    | fields _time, action_evtlog_event_data_Workstation, agent_hostname, action_evtlog_event_id, failure_count, unique_users
  lucene: |
    event.code:(680 OR 681 OR 4776) AND winlog.event_data.Status:"0xC000006A" AND NOT winlog.event_data.TargetUserName:*$ AND NOT winlog.event_data.TargetServerName:(DC01 OR DC02 OR DC03) AND NOT winlog.computer_name:(MAILSRV01 OR MAILSRV02 OR EXCH01) AND NOT winlog.computer_name:(AUTH01 OR AUTH02 OR ADFS01)
  sumo: |
    _sourceCategory=*Windows* ("680" OR "681" OR "4776")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Status" as failure_code
    | json field=_raw "TargetUserName" as dest_user
    | json field=_raw "Workstation" as src_hostname
    | json field=_raw "TargetDomainName" as dest_domain
    | json field=_raw "Computer" as dest_host
    | where event_id in ("680", "681", "4776")
    | where failure_code = "0xC000006A"
    | where !endsWith(dest_user, "$")
    | where !(dest_host matches "*DC*" or dest_host matches "*DomainController*")
    | where !(src_hostname matches "*MAIL*" or src_hostname matches "*EXCHANGE*")
    | where !(src_hostname matches "*AUTH*" or src_hostname matches "*SSO*" or src_hostname matches "*ADFS*")
    | timeslice 3m
    | count_distinct(dest_user) as unique_users, count as failure_count by _timeslice, src_hostname, dest_host, event_id
    | where failure_count >= 5
    | fields _timeslice, src_hostname, dest_host, event_id, unique_users, failure_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "5 Windows Authentication Failure Events \nFrom the same internal Source Hostname to the same Destination\nWhere the Event ID in\
  \ [680, 681, 4776]\nWhere the Failure Code is \"0xC000006A\"\nWhere the Destination Username does NOT end with \"$\" \nWhere the Destination\
  \ IP/Hostname is NOT on the Domain Controller List \nWhere the Source Hostname is NOT on a Mail Server List \nWhere the Source Hostname is NOT\
  \ on a Central Authentication Server List \nWith unique Destination Usernames \nWith the same Event ID \nWithin 3 minutes"
suppression:
  window: 24 hours
  fields:
  - Source Hostname
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

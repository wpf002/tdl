rule_id: TDL-AUTH-000044
v4_id: '000044'
name: Remote Password Spraying
description: This rule is designed to detect multiple failed authentication attempts against a VPN or public-facing host targeting multiple accounts.
  This could indicate an attacker attempting a single password across multiple accounts
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure OR index=o365 OR index=vpn (action=failure OR action=failed OR Result=failure OR status=failure) (activity="*login*" OR activity="*logon*"
    OR EventName="UserLoginFailed" OR operation="UserLoginFailed" OR Category="SignInLogs")

    | bin _time span=3m

    | stats dc(user) as unique_users, values(user) as attempted_users, count as failure_count by _time, src_ip

    | where unique_users >= 5 AND failure_count >= 5

    | table _time, src_ip, unique_users, failure_count, attempted_users

    '
  kql: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where ResultType != 0
    | where AppDisplayName has_any ("VPN", "Remote") or Location != ""
    | summarize FailedLogins = dcount(UserPrincipalName), Users = make_set(UserPrincipalName), StartTime = min(TimeGenerated), EndTime = max(TimeGenerated) by IPAddress, bin(TimeGenerated, 3m)
    | where FailedLogins >= 5
    | where datetime_diff('minute', EndTime, StartTime) <= 3
    | project StartTime, EndTime, SourceIP = IPAddress, FailedLoginAttempts = FailedLogins, UniqueUsernames = Users
  aql: |
    SELECT sourceip, UNIQUECOUNT(username) AS unique_users, COUNT(*) AS failed_attempts, QIDNAME(qid) AS event_name
    FROM events
    WHERE (qidname(qid) ILIKE '%failed%login%' OR qidname(qid) ILIKE '%authentication%failed%' OR qidname(qid) ILIKE '%logon%failed%' OR category IN (6003, 6004))
    GROUP BY sourceip
    HAVING failed_attempts >= 5 AND unique_users >= 5
    LAST 3 MINUTES
  yara_l: |
    rule multiple_remote_login_failures_unique_users {
      meta:
        author = "TDL"
        description = "Detects 5+ remote login failures from same source to unique destination usernames within 3 minutes - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.action = "BLOCK"
        $e.principal.ip = $source_ip
        $e.target.user.userid = $user

      match:
        $source_ip over 3m

      condition:
        #user >= 5
    }
  esql: "FROM logs-azure.* , logs-o365.*\n| WHERE @timestamp > NOW() - 3 minutes \n  AND event.outcome == \"failure\"\n  AND (event.category ==\
    \ \"authentication\" OR event.action IN (\"UserLoginFailed\", \"UserLoginFailed\"))\n| STATS unique_users = COUNT_DISTINCT(user.name), failure_count\
    \ = COUNT(*) BY source.ip, window = BUCKET(@timestamp, 3 minutes)\n| WHERE unique_users >= 5 AND failure_count >= 5\n| KEEP source.ip, unique_users,\
    \ failure_count, window\n"
  leql: |
    where(result=FAILED_BAD_PASSWORD) groupby(source_address) calculate(unique:user)
  crowdstrike: "#event_simpleName=UserLogon* event_platform=Win\n| LogonType=10 \n| status!=0 OR LogonResult=*fail* OR LogonResult=*denied*\n\
    | bucket(@timestamp, span=3m, as=time_bucket)\n| groupBy([SourceIP, time_bucket], function=[count(DestinationUserName, distinct=true, as=unique_users),\
    \ count(as=total_failures)])\n| unique_users >= 5\n| table([time_bucket, SourceIP, unique_users, total_failures])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter event_type = "authentication_failure" or event_outcome = "FAILURE" or action_result = "FAILURE"
    | filter cloud_provider = "Azure" or cloud_provider = "Microsoft 365" or cloud_provider = "Office365"
    | bin _time span=3m
    | comp count_distinct(actor_user) as unique_users by _time, actor_ip_address
    | filter unique_users >= 5
    | fields _time, actor_ip_address, unique_users
  lucene: |
    _exists_:source.ip AND (event.outcome:failure OR event.action:*failed* OR event.action:*failure* OR ResultType:50126 OR ResultType:50055 OR ResultType:50053 OR ResultType:50057 OR Status:*failed* OR LoginStatus:Failed) AND (event.category:authentication OR event.type:authentication OR event.dataset:azure.signinlogs OR event.dataset:azure.auditlogs OR event.dataset:o365.audit OR Category:SignInLogs OR Operation:UserLogin* OR Workload:AzureActiveDirectory OR Workload:Exchange)
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*Office* OR _sourceCategory=*VPN* (failed OR failure OR "sign-in" OR logon)
    | json field=_raw "ResultType" as result_type
    | json field=_raw "ResultDescription" as result_desc
    | json field=_raw "IPAddress" as src_ip
    | json field=_raw "UserPrincipalName" as dest_user
    | json field=_raw "Status" as status
    | where (result_type matches "*50126*" OR result_type matches "*50053*" OR result_type matches "*50055*" OR result_type matches "*50057*" OR result_desc matches "*fail*" OR result_desc matches "*invalid*" OR status matches "*fail*")
    | timeslice 3m
    | count_distinct(dest_user) as unique_users, count as total_failures by _timeslice, src_ip
    | where unique_users >= 5 and total_failures >= 5
    | fields _timeslice, src_ip, unique_users, total_failures
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 Remote Login Failures

  From the same Source

  With unique Destination Usernames

  Within 3 minutes'
suppression:
  window: 24 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000068
v4_id: 000068
name: Traffic to Unauthorized Remote Control Application
description: This rule is designed to identify the usage of unauthorized Remote Control applications to detect possible exfiltration attempts.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1219
technique_name: Remote Access Software
platform:
- Windows
data_sources:
- Application Control
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=* sourcetype=applocker* OR sourcetype="WinEventLog:Microsoft-Windows-AppLocker*" OR sourcetype="application_control"

    | search (Category="Remote Control" OR Application_Category="Remote Control" OR CategoryName="Remote Control")

    | search NOT [| inputlookup authorized_remote_control_apps.csv | fields Application | format]

    | table _time, host, ComputerName, Application, Application_Name, User, UserName, Action, FilePath, FileHash

    '
  kql: |
    AppLockerEvent
    | where TimeGenerated > ago(24h)
    | where ApplicationCategory == "Remote Control"
    | where ApplicationName !in ("TeamViewer.exe", "AnyDesk.exe", "LogMeIn.exe", "GoToAssist.exe", "RemotePC.exe", "Splashtop.exe", "Chrome Remote Desktop.exe", "mstsc.exe", "msra.exe")
    | project TimeGenerated, Computer, UserName, ApplicationName, ApplicationPath, ApplicationCategory, PolicyName, Action
  aql: |
    SELECT eventtime, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS host, "Application Name", "Application Category", "Process Name", "Process CommandLine"
    FROM events
    WHERE "Application Category" = 'Remote Control'
      AND "Application Name" NOT IN ('TeamViewer', 'LogMeIn', 'AnyDesk', 'Bomgar', 'ScreenConnect', 'RemotePC', 'Splashtop', 'GoToMyPC', 'Zoho Assist', 'Windows Remote Assistance')
    LAST 24 HOURS
  yara_l: |
    rule remote_control_unauthorized_app {
      meta:
        author = "TDL"
        description = "Detects unauthorized remote control application usage - MITRE T1219 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1219"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_name = "Application Control"
        $e.target.application.category = "Remote Control"
        not (
          $e.target.process.file.full_path = /(?i)C:\\Program Files\\TeamViewer\\TeamViewer\.exe/ or
          $e.target.process.file.full_path = /(?i)C:\\Program Files\\Microsoft\\Remote Desktop Connection\\mstsc\.exe/ or
          $e.target.process.file.full_path = /(?i)C:\\Windows\\System32\\mstsc\.exe/ or
          $e.target.process.file.full_path = /(?i)C:\\Program Files.*\\LogMeIn\\/ or
          $e.target.process.file.full_path = /(?i)C:\\Program Files.*\\AnyDesk\\AnyDesk\.exe/ or
          $e.target.process.file.full_path = /(?i)C:\\Program Files.*\\VNC\\/ or
          re.regex($e.target.process.file.full_path, `(?i)\\approved_remote_tools\\`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 65

      condition:
        $e
    }
  esql: |
    FROM logs-windows.applocker*, logs-windows.sysmon_operational*, logs-endpoint.events.file*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (event.category == "process" AND event.type == "start")
        OR (winlog.event_id IN (8001, 8002, 8003, 8004, 8005, 8006, 8007))
      )
      AND (
        process.name IN ("teamviewer.exe", "anydesk.exe", "logmein.exe", "ammyy.exe", "remotepc.exe", "supremo.exe", "dwrcc.exe", "screenconnect.exe", "gotoassist.exe", "bomgar.exe", "dameware.exe", "radmin.exe", "ultravnc.exe", "tightvnc.exe", "realvnc.exe", "splash.exe", "remotedesktop.exe", "msra.exe", "mstsc.exe", "quicksupport.exe", "gosupportnow.exe", "logmeinrescue.exe", "ShowMyPC.exe")
        OR file.name IN ("teamviewer.exe", "anydesk.exe", "logmein.exe", "ammyy.exe", "remotepc.exe", "supremo.exe", "dwrcc.exe", "screenconnect.exe", "gotoassist.exe", "bomgar.exe", "dameware.exe", "radmin.exe", "ultravnc.exe", "tightvnc.exe", "realvnc.exe", "splash.exe", "remotedesktop.exe", "msra.exe", "mstsc.exe", "quicksupport.exe", "gosupportnow.exe", "logmeinrescue.exe", "ShowMyPC.exe")
      )
      AND process.name NOT IN ("mstsc.exe", "msra.exe")
      AND file.name NOT IN ("mstsc.exe", "msra.exe")
    | KEEP @timestamp, host.name, user.name, process.name, process.executable, process.command_line, file.name, file.path
  leql: |
    where(source_json.ApplicationCategory="Remote Control" AND NOT(source_json.ApplicationName IN ["TeamViewer", "AnyDesk", "LogMeIn", "GoToMyPC", "RemotePC", "Splashtop", "Chrome Remote Desktop", "Windows Remote Assistance", "Remote Desktop Connection"]))
  crowdstrike: |
    #type=ApplicationControlEvent event_simpleName=*ApplicationControl* ApplicationCategory="Remote Control"
    | NOT (ApplicationName IN [TeamViewer, AnyDesk, "Remote Desktop", LogMeIn, "Chrome Remote Desktop", "Microsoft Quick Assist"])
    | table([@timestamp, ComputerName, UserName, ApplicationName, ApplicationCategory, FilePath, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter event_sub_type = ENUM.EVENT_SUB_TYPE_APP_CONTROL
    | filter action_app_control_category = "Remote Control"
    | filter action_app_control_app_name not in ("TeamViewer", "LogMeIn", "AnyDesk", "GoToMyPC", "RemotePC", "Splashtop", "Chrome Remote Desktop", "RealVNC", "TightVNC", "UltraVNC", "Bomgar", "BeyondTrust", "ConnectWise Control", "Dameware", "Remote Desktop Connection", "mstsc.exe")
    | fields _time, agent_hostname, actor_effective_username, action_app_control_app_name, action_app_control_category, action_process_image_name, action_process_image_command_line
  lucene: |
    event.code:8003 AND application.category:"Remote Control" AND NOT application.name:("TeamViewer" OR "AnyDesk" OR "LogMeIn" OR "GoToMyPC" OR "Chrome Remote Desktop" OR "Microsoft Remote Desktop" OR "VNC" OR "Splashtop" OR "Zoom" OR "WebEx")
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*AppControl* OR _sourceCategory=*Application*
    | json field=_raw "ApplicationCategory" as app_category
    | json field=_raw "ApplicationName" as app_name
    | json field=_raw "Application" as application
    | where app_category = "Remote Control" or app_category matches "*Remote Control*"
    | where !(app_name in ("TeamViewer", "LogMeIn", "AnyDesk", "GoToMyPC", "Splashtop", "ConnectWise Control", "Bomgar", "RemotePC") or application in ("TeamViewer", "LogMeIn", "AnyDesk", "GoToMyPC", "Splashtop", "ConnectWise Control", "Bomgar", "RemotePC"))
    | fields _messageTime, _sourceHost, app_category, app_name, application
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Application Control Event

  Where the Application Category is "Remote Control"

  Where the Application is NOT on the Authorized Remote Control Applications List'
suppression:
  window: 24 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

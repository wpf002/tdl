rule_id: TDL-AUTH-000082
v4_id: 000082
name: Exploit Attempt Followed by Malware Detection
description: Detects a scenario where an exploit is detected targeting a host followed by a malware detection on that same host. This could indicate
  a succesful exploit against the target host.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Antivirus
- IDS/IPS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=* (sourcetype=suricata OR sourcetype=snort OR sourcetype=ids OR sourcetype=ips OR tag=ids OR tag=ips) (action=blocked OR action=allowed\
    \ OR alert_action=* OR severity=* OR signature=*) \n| eval event_type=\"exploit\"\n| eval src_is_external=if(match(src_ip, \"^10\\.|^172\\\
    .(1[6-9]|2[0-9]|3[0-1])\\.|^192\\.168\\.\"), 0, 1)\n| eval dest_is_internal=if(match(dest_ip, \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[0-1])\\.|^192\\\
    .168\\.\"), 1, 0)\n| where src_is_external=1 AND dest_is_internal=1\n| eval exploit_time=_time, exploit_dest_ip=dest_ip\n| append [search\
    \ index=* (sourcetype=antivirus OR sourcetype=av OR sourcetype=symantec* OR sourcetype=mcafee* OR tag=malware OR tag=antivirus) (action=*\
    \ OR signature=* OR threat=* OR malware=*) earliest=-15m\n  | eval event_type=\"malware\"\n  | eval malware_time=_time, malware_src_ip=coalesce(src_ip,\
    \ src, host, dest_ip)]\n| transaction maxspan=15m exploit_dest_ip malware_src_ip startswith=(event_type=\"exploit\") endswith=(event_type=\"\
    malware\") keepevicted=f mvlist=t\n| where exploit_dest_ip=malware_src_ip AND malware_time >= exploit_time AND malware_time <= (exploit_time\
    \ + 900)\n| table _time, src_ip, exploit_dest_ip, malware_src_ip, signature, threat, action, host\n"
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_auth_000082 {\n  meta:\n    author = \"TDL\"\n    description = \"Exploit Attempt Followed by Malware Detection\"\n  \
    \  severity = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1190\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: '1 IDS/IPS Exploit Event

  From an external source to an internal destination (Inbound)


  Followed By


  1 Malware Detection Event

  Where the Source IP is equal to the Destination IP in the previous event

  Within 15 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

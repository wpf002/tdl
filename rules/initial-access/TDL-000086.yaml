rule_id: TDL-AUTH-000086
v4_id: 000086
name: HVT User Successful Click Permitted
description: Detects when a high value target user has "clicked" or interacted with an e-mail that has been classified malicious. Attackers will
  typically send phishing e-mails to users in an attempt to gain access to the organization's network.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- Email Security
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=email_security action=\"url_click_permitted\" \n| lookup high_value_targets.csv user_email AS src_user OUTPUT is_hvt\n| where is_hvt=\"\
    true\"\n| table _time, src_user, url, subject, sender, recipient\n"
  kql: |
    EmailUrlInfo
    | where TimeGenerated > ago(24h)
    | where UrlClickAction == "Allowed" or UrlClickAction == "Permitted" or ActionType == "ClickAllowed"
    | join kind=inner (
        IdentityInfo
        | where Tags has "HighValueTarget" or Tags has "HVT" or Tags has "HighValue"
        | project AccountUpn
    ) on $left.RecipientEmailAddress == $right.AccountUpn
    | project TimeGenerated, RecipientEmailAddress, Url, UrlDomain, NetworkMessageId, SenderFromAddress, Subject, ThreatTypes, UrlClickAction
  aql: |
    SELECT sourceip, username, destinationip, URL, COUNT(*) AS click_count
    FROM events
    WHERE CATEGORYNAME(category) ILIKE '%email%'
      AND (qidname(qid) ILIKE '%url%click%' OR qidname(qid) ILIKE '%link%click%' OR qidname(qid) ILIKE '%click%permitted%')
      AND username IN (SELECT username FROM events WHERE categoryname(category) ILIKE '%high%value%' OR qidname(qid) ILIKE '%hvt%' OR qidname(qid) ILIKE '%high%value%target%' LAST 30 DAYS)
    GROUP BY sourceip, username, destinationip, URL
    LAST 24 HOURS
  yara_l: "rule high_value_user_url_click {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects URL click permitted events\
    \ from high value target users - T1566 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1566\"\
    \n    severity = \"HIGH\"\n  \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.metadata.product_name = \"EMAIL_SECURITY\"\
    \n    $e.security_result.action = \"ALLOW\"\n    $e.principal.user.userid = $user\n    \n    // High value target user list - adjust as needed\n\
    \    (\n      $user = \"ceo@company.com\" or\n      $user = \"cfo@company.com\" or\n      $user = \"cio@company.com\" or\n      $user = \"\
    cto@company.com\" or\n      re.regex($user, `(?i)(executive|c-level|vp|president|director)`)\n    )\n  \n  match:\n    $user over 5m\n  \n\
    \  outcome:\n    $risk_score = 85\n    $user_clicked = $user\n    $clicked_url = $e.target.url\n    $source_ip = $e.principal.ip\n  \n  condition:\n\
    \    $e\n}\n"
  esql: "FROM logs-email.security*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.action == \"url_click_permitted\"\n  AND user.name IN (\"\
    executive1\", \"executive2\", \"ceo\", \"cfo\", \"cto\", \"admin\", \"domain_admin\", \"enterprise_admin\")\n| KEEP @timestamp, user.name,\
    \ host.name, source.ip, email.from.address, url.full, email.subject\n"
  leql: |
    where(log_source_type="Email Security" AND event_type="URL Click Permitted" AND source_user IN high_value_target_user_list)
  crowdstrike: |
    #type=email_security event_simpleName=UrlClickPermitted
    | match(file="high_value_targets.csv", field=SourceUser, include=[SourceUser])
    | table([@timestamp, SourceUser, ComputerName, URL, Subject, Sender])
  xql: |
    dataset = email_protection_data
    | filter event_type = ENUM.EVENT_TYPE_URL_CLICK and action_name = "permitted"
    | alter is_hvt = arrayfilter(xdr_lookups(actor_effective_username, "high_value_targets"), "@element" != null)
    | filter is_hvt != null and array_length(is_hvt) > 0
    | fields _time, actor_effective_username, action_url, action_subject, action_sender_email, agent_hostname
  lucene: |
    event.action:"url_click_permitted" AND user.tags:"high_value_target"
  sumo: |
    _sourceCategory=*Email* OR _sourceCategory=*email* OR _sourceCategory=*EmailSecurity*
    | json field=_raw "event_type" as event_type
    | json field=_raw "action" as action
    | json field=_raw "user" as user
    | json field=_raw "source_user" as source_user
    | json field=_raw "recipient" as recipient
    | json field=_raw "url_click" as url_click
    | json field=_raw "verdict" as verdict
    | where (event_type matches "*click*" OR event_type matches "*url*" OR action matches "*click*" OR action matches "*permit*" OR verdict matches "*permit*" OR verdict matches "*allow*")
    | where user in ("exec@company.com", "ceo@company.com", "cfo@company.com", "admin@company.com") OR source_user in ("exec@company.com", "ceo@company.com", "cfo@company.com", "admin@company.com") OR recipient in ("exec@company.com", "ceo@company.com", "cfo@company.com", "admin@company.com")
    | fields _messageTime, user, source_user, recipient, event_type, action, verdict, url_click
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 URL Click Permitted Event

  Where the Source User is on the High Value Target User List'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

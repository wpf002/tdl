rule_id: TDL-AUTH-000087
v4_id: 000087
name: Successful Click Permitted from Multiple Users
description: Detects when multiple users have "clicked" or interacted with an e-mail that has been classified malicious. Attackers will typically
  send phishing e-mails to users in an attempt to gain access to the organization's network.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- Email Security
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=email sourcetype=email_security action=permitted event_type="url_click"

    | bin _time span=8h

    | stats dc(src_user) as unique_users values(src_user) as user_list by _time, url

    | where unique_users >= 10

    | table _time, url, unique_users, user_list

    '
  kql: |
    EmailUrlInfo
    | where TimeGenerated > ago(8h)
    | where UrlClickAction == "Allowed" or UrlClickAction == "Permitted"
    | summarize UniqueUsers = dcount(RecipientEmailAddress), Users = make_set(RecipientEmailAddress) by Url, bin(TimeGenerated, 8h)
    | where UniqueUsers >= 10
    | project TimeGenerated, Url, UniqueUsers, Users
  aql: "SELECT URL, COUNT(*) AS total_clicks, UNIQUECOUNT(username) AS unique_users\nFROM events\nWHERE CATEGORYNAME(category) ILIKE '%email%'\
    \ \n  AND (QIDNAME(qid) ILIKE '%click%' OR QIDNAME(qid) ILIKE '%url%') \n  AND (QIDNAME(qid) ILIKE '%permit%' OR QIDNAME(qid) ILIKE '%allow%')\n\
    GROUP BY URL\nHAVING total_clicks >= 10 AND unique_users >= 10\nLAST 8 HOURS\n"
  yara_l: |
    rule phishing_campaign_multiple_unique_users_click_same_url {
      meta:
        author = "TDL"
        description = "Detects 10+ unique users clicking same URL within 8 hours - potential phishing campaign"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1566"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.security_result.action = "ALLOW"
        $e.target.url = $url
        $e.principal.user.userid = $user

      match:
        $url over 8h

      outcome:
        $risk_score = 75
        $unique_users = count_distinct($user)
        $target_url = $url

      condition:
        #user >= 10
    }
  esql: "FROM logs-o365.audit*, logs-google_workspace.alert*, logs-proofpoint.tap*, logs-mimecast.threat_intelligence_feed_malware*, logs-email*\n\
    | WHERE @timestamp > NOW() - 8 hours \n  AND event.action IN (\"UrlClickPermitted\", \"url_click_permitted\", \"URL Click Permitted\", \"\
    click_permitted\", \"MessageDelivered\", \"email.link.clicked\")\n| STATS unique_users = COUNT_DISTINCT(source.user.name) BY url.full\n| WHERE\
    \ unique_users >= 10\n| KEEP url.full, unique_users\n"
  leql: |
    where(source_json.action="URL Click Permitted") groupby(source_json.url) calculate(unique:source_json.user)
  crowdstrike: |
    #type=EmailSecurity event_simpleName=*URLClickPermitted*
    | groupBy([URL], function=[count(as=total_clicks), count(SourceUserName, distinct=true, as=unique_users)])
    | unique_users >= 10
    | table([URL, total_clicks, unique_users])
  xql: |
    dataset = email_security_logs
    | filter action = "permit" and event_type = "url_click"
    | bin _time span=8h
    | comp count_distinct(source_username) as unique_users by _time, url
    | filter unique_users >= 10
  lucene: |
    event.action:"URL Click Permitted" AND url:*
  sumo: |
    _sourceCategory=*Email* "URL Click Permitted"
    | json field=_raw "url" as clicked_url
    | json field=_raw "username" as source_username
    | where !isNull(clicked_url) and !isNull(source_username)
    | timeslice 8h
    | count_distinct(source_username) as unique_users by _timeslice, clicked_url
    | where unique_users >= 10
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 URL Click Permitted Events

  With the same URL

  With unique Source Usernames

  Within 8 hours'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

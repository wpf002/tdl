    | STATS recipient_count = COUNT_DISTINCT(email.recipient), event_count = COUNT(*) BY email.sender, window = BUCKET(@timestamp, 5 minutes)
    | WHERE recipient_count >= 20 AND event_count >= 20
    ```

    ```

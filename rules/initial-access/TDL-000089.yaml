    GROUP BY "Sender Email"
    HAVING unique_recipients >= 20
    LAST 5 MINUTES
  yara_l: |
    rule email_phishing_same_sender {
      meta:
        author = "Chronicle Detection"
        description = "Detects 20+ phishing emails from same sender to unique recipients within 5 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1566"
        severity = "High"

      events:
        $e.metadata.event_type = "EMAIL_UNCATEGORIZED"
        $e.security_result.summary = "Phish"
        $e.principal.user.email_addresses = $sender
        $e.target.user.email_addresses = $recipient
        $e.network.email.subject = $subject

      match:
        $sender over 5m

      outcome:
        $risk_score = 75
        $unique_recipients = count_distinct($recipient)
        $sample_subject = array_distinct($subject)

      condition:
        #e >= 20 and $unique_recipients >= 20
    }

    rule email_phishing_same_subject {
      meta:
        author = "Chronicle Detection"
        description = "Detects 20+ phishing emails with same subject to unique recipients within 5 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1566"
        severity = "High"

      events:
        $e.metadata.event_type = "EMAIL_UNCATEGORIZED"
        $e.security_result.summary = "Phish"
        $e.principal.user.email_addresses = $sender
        $e.target.user.email_addresses = $recipient
        $e.network.email.subject = $subject

      match:
        $subject over 5m

      outcome:
        $risk_score = 75
        $unique_recipients = count_distinct($recipient)
        $sample_sender = array_distinct($sender)

      condition:
        #e >= 20 and $unique_recipients >= 20
    }
  esql: |
    FROM logs-email.security*
    | WHERE @timestamp > NOW() - 5 minutes AND email.label == "Phish"
    | STATS recipient_count = COUNT_DISTINCT(email.recipient), event_count = COUNT(*) BY email.sender, email.subject, window = BUCKET(@timestamp, 5 minutes)
    | WHERE recipient_count >= 20 AND event_count >= 20
    ```

    ```
    FROM logs-email.security*

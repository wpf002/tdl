  crowdstrike: |
    #type=email event_simpleName=EmailSecurityEvent EmailLabel=Phish
    | groupBy([SenderEmail, Subject], function=[count(as=total_events), count(RecipientEmail, distinct=true, as=unique_recipients)], limit=max)
    | total_events >= 20 AND unique_recipients >= 20
    | table([SenderEmail, Subject, total_events, unique_recipients])
    ```

    ```
    #type=email event_simpleName=EmailSecurityEvent EmailLabel=Phish
    | bucket(span=5m, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, SenderEmail], function=[count(as=total_events), count(RecipientEmail, distinct=true, as=unique_recipients)], limit=max)
    | total_events >= 20 AND unique_recipients >= 20
    | table([time_bucket, SenderEmail, total_events, unique_recipients])
    ```

    ```
    #type=email event_simpleName=EmailSecurityEvent EmailLabel=Phish
    | bucket(span=5m, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, Subject], function=[count(as=total_events), count(RecipientEmail, distinct=true, as=unique_recipients)], limit=max)
    | total_events >= 20 AND unique_recipients >= 20

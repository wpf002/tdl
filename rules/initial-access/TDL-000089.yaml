  lucene: |
    **Version 1 (Same Sender):**

    event.category:"email" AND email.threat.label:"Phish" AND _exists_:email.from.address AND _exists_:email.to.address

    **Version 2 (Same Subject):**

    event.category:"email" AND email.threat.label:"Phish" AND _exists_:email.subject AND _exists_:email.to.address
  sumo: |
    _sourceCategory=*Email* "Phish"
    | json field=_raw "label" as email_label
    | json field=_raw "sender" as sender
    | json field=_raw "subject" as subject
    | json field=_raw "recipient" as recipient
    | where email_label = "Phish"
    | timeslice 5m
    | count_distinct(recipient) as unique_recipients by _timeslice, sender
    | where unique_recipients >= 20
    ```


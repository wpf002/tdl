  xql: |
    dataset = email_security_events
    | filter email_label = "Phish"
    | bin _time span=5m
    | comp count() as email_count, count_distinct(recipient_email) as unique_recipients by _time, sender_email, email_subject
    | filter email_count >= 20 and unique_recipients >= 20
    ```


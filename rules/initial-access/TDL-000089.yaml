rule_id: TDL-AUTH-000089
v4_id: 000089
name: Potential Phishing Campaign
description: Detects when a single external sender sends out an email to multiple recipients where the content is labeled as phishing by the email
  security appliance.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- Email Security
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=email_security email_label="Phish"

    | bin _time span=5m

    | stats dc(recipient) as unique_recipients by _time, sender

    | where unique_recipients >= 20

    ```


    ```

    index=email_security email_label="Phish"

    | bin _time span=5m

    | stats dc(recipient) as unique_recipients by _time, subject

    | where unique_recipients >= 20

    '
  kql: |
    // Version 1: Same Sender
    EmailEvents
    | where TimeGenerated > ago(5m)
    | where ThreatTypes has "Phish" or PhishFilterVerdict == "Phish" or EmailDirection == "Inbound" and (Subject has "phish" or SenderFromAddress has "phish")
    | where isnotempty(SenderFromAddress)
    | summarize UniqueRecipients = dcount(RecipientEmailAddress), Recipients = make_set(RecipientEmailAddress), Subjects = make_set(Subject) by bin(TimeGenerated, 5m), SenderFromAddress, Subject
    | where UniqueRecipients >= 20

    // Version 2: Same Subject
    EmailEvents
    | where TimeGenerated > ago(5m)
    | where ThreatTypes has "Phish" or PhishFilterVerdict == "Phish" or EmailDirection == "Inbound" and (Subject has "phish" or SenderFromAddress has "phish")
    | where isnotempty(Subject)
    | summarize UniqueRecipients = dcount(RecipientEmailAddress), Recipients = make_set(RecipientEmailAddress), Senders = make_set(SenderFromAddress) by bin(TimeGenerated, 5m), Subject
    | where UniqueRecipients >= 20
  aql: |
    SELECT "Sender Email", "Subject", UNIQUECOUNT("Recipient Email") AS unique_recipients, COUNT(*) AS event_count
    FROM events
    WHERE LOWER(categoryname(category)) ILIKE '%email%' AND ("Email Classification" ILIKE '%phish%' OR "Email Label" ILIKE '%phish%' OR "Threat Classification" ILIKE '%phish%')
    GROUP BY "Sender Email", "Subject"
    HAVING unique_recipients >= 20
    LAST 5 MINUTES
    ```

    ```
    SELECT "Sender Email", "Subject", UNIQUECOUNT("Recipient Email") AS unique_recipients, COUNT(*) AS event_count
    FROM events
    WHERE LOWER(categoryname(category)) ILIKE '%email%' AND ("Email Classification" ILIKE '%phish%' OR "Email Label" ILIKE '%phish%' OR "Threat Classification" ILIKE '%phish%')
    GROUP BY "Subject"
    HAVING unique_recipients >= 20
    LAST 5 MINUTES
    ```

    ```
    SELECT "Sender Email", "Subject", UNIQUECOUNT("Recipient Email") AS unique_recipients, COUNT(*) AS event_count
    FROM events

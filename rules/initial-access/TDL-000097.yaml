rule_id: TDL-AUTH-000097
v4_id: 000097
name: Imposter Email Delivered
description: Detects when an email is received that is labeled as imposter.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- ProofPoint TAP
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=proofpoint sourcetype=proofpoint:tap threatType="impostor"

    | table _time, recipient, sender, subject, threatType, messageID, threatsInfoMap

    '
  kql: |
    ProofpointTAP
    | where TimeGenerated > ago(24h)
    | where threat contains "impostor" or classification contains "impostor" or threatStatus contains "impostor"
    | project TimeGenerated, recipient, sender, subject, messageID, threatStatus, classification, threat, clicksPermitted, clicksBlocked
  aql: "SELECT DATEFORMAT(eventtime,'YYYY-MM-dd HH:mm:ss') AS event_time, \n       LOGSOURCENAME(logsourceid) AS log_source,\n       \"Sender\
    \ Email\" AS sender,\n       \"Recipient Email\" AS recipient,\n       \"Subject\" AS subject,\n       \"Threat Category\" AS threat_category,\n\
    \       \"Threat Type\" AS threat_type\nFROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%proofpoint%'\n  AND (\"Threat Type\" ILIKE '%imposter%'\
    \ OR \"Classification\" ILIKE '%imposter%' OR \"campaignId\" ILIKE '%imposter%')\nLAST 24 HOURS\n"
  yara_l: |
    rule proofpoint_imposter_email {
      meta:
        author = "TDL"
        description = "Detects ProofPoint TAP events labeled as Imposter email"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1566"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "PROOFPOINT"
        $e.metadata.product_name = "TAP"
        $e.security_result.summary = "Imposter"
        $e.target.user.email_addresses = $recipient

      match:
        $recipient over 1h

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: "FROM logs-proofpoint.tap*\n| WHERE @timestamp > NOW() - 24 hours \n  AND proofpoint.tap.messageParts.disposition == \"Imposter\"\n| STATS\
    \ count = COUNT(*) BY proofpoint.tap.recipient, proofpoint.tap.sender, proofpoint.tap.messageID, host.name\n| KEEP @timestamp, proofpoint.tap.recipient,\
    \ proofpoint.tap.sender, proofpoint.tap.subject, proofpoint.tap.messageID, host.name\n"
  leql: |
    where(source_json.threatType="imposter" OR source_json.classification="imposter" OR source_json.threat="imposter")
  crowdstrike: |
    #type=proofpoint_tap threatsInfoMap.classification=imposter
    | table([@timestamp, messageID, sender, recipient, subject, threatsInfoMap.threat, threatsInfoMap.threatStatus, threatsInfoMap.classification])
  xql: |
    dataset = proofpoint_tap_raw
    | filter threatType = "imposter" or category = "imposter" or impostor = "true"
    | fields _time, sender, recipient, subject, threatType, category, messageID, senderIP
  lucene: |
    source:"ProofPoint TAP" AND threatType:"imposter"
  sumo: |
    _sourceCategory=*ProofPoint* OR _sourceCategory=*proofpoint* OR _sourceCategory=*TAP*
    | json field=_raw "messageType" as message_type
    | json field=_raw "threatType" as threat_type
    | json field=_raw "impostor" as impostor
    | json field=_raw "subject" as subject
    | json field=_raw "sender" as sender
    | json field=_raw "recipient" as recipient
    | where impostor = "true" OR threat_type matches "*impostor*" OR threat_type matches "*Impostor*"
    | fields _messageTime, sender, recipient, subject, threat_type, impostor
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 ProofPoint TAP Event

  Where the Email is labeled as "Imposter"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

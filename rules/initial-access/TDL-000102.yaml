rule_id: TDL-AUTH-000102
v4_id: '000102'
name: AWS Suspicious S3 Behavior
description: Detects when there is activity on a S3 bucket labled as malicious by GuardDuty.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Guard Duty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=guardduty sourcetype=aws:cloudtrail:guardduty type="*S3*"

    | table _time, type, severity, region, accountId, resource.resourceType, resource.s3BucketDetails.name, service.action.actionType, title,
    description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type has "S3"
    | project TimeGenerated, Type, Severity, Title, Description, Resource, AccountId, Region, Id
  aql: |
    SELECT QIDNAME(qid) AS event_name, sourceip, destinationip, username, CATEGORYNAME(category) AS category, "findingType" AS finding_type, "resource.resourceType" AS resource_type, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%guard%duty%' AND ("findingType" ILIKE '%S3%' OR "resource.resourceType" = 'S3Bucket')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_s3_initial_access {
      meta:
        author = "Detection Engineer"
        description = "Detects AWS GuardDuty findings related to S3 that may indicate initial access attempts (T1098)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $guardduty.metadata.vendor_name = "Amazon AWS"
        $guardduty.metadata.product_name = "GuardDuty"
        re.regex($guardduty.metadata.product_event_type, `(?i)S3`)
        $guardduty.principal.resource.name = $resource

      match:
        $resource over 5m

      condition:
        $guardduty
    }
  esql: "FROM .ds-logs-aws.guardduty*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.dataset == \"aws.guardduty\" \n  AND TO_LOWER(aws.guardduty.resource.resource_type)\
    \ == \"s3\"\n| KEEP @timestamp, host.name, user.name, aws.guardduty.type, aws.guardduty.severity, aws.guardduty.resource.resource_type, aws.guardduty.service.action.action_type,\
    \ event.id\n"
  leql: |
    where(source_json.type ICONTAINS "S3")
  crowdstrike: "#repo=guardduty \n| type=*S3* \n| table([@timestamp, accountId, region, type, severity, resource.resourceType, service.action.actionType,\
    \ service.serviceName, title, description])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AWS and raw_log_json.service = "guardduty"
    | alter finding_type = json_extract_scalar(raw_log_json, "$.type")
    | filter finding_type ~= ".*S3.*"
    | fields _time, cloud_provider, finding_type, raw_log_json
  lucene: |
    guardduty.finding.type:(*S3* OR *s3*)
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _sourceCategory=*Guard*
    | json field=_raw "type" as finding_type
    | where finding_type matches "*S3*"
    | fields _messageTime, _sourceHost, finding_type, _raw
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS Guard Duty Event

  Where the type matches S3'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

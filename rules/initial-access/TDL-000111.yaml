rule_id: TDL-AUTH-000111
v4_id: '000111'
name: HVT User Account Lockout
description: Detects when a high value target account is locked out. This is indicative of a potential brute force attack targeting the account.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1531
technique_name: Account Access Removal
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4740'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=windows sourcetype=WinEventLog:Security (EventCode=644 OR EventCode=4740) \n| lookup high_value_users.csv username as TargetUserName\
    \ OUTPUT username as hvt_user \n| where isnotnull(hvt_user) \n| table _time, ComputerName, EventCode, TargetUserName, Account_Name, Caller_Computer_Name\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (644, 4740)
    | where TargetUserName in ("Administrator", "Domain Admin", "Enterprise Admin", "KRBTGT", "Schema Admin")
    | project TimeGenerated, Computer, EventID, TargetUserName, Account, SubjectUserName, Activity
  aql: |
    SELECT username, "Target Username", sourceip, LOGSOURCENAME(logsourceid) AS host, eventtime, COUNT(*) AS lockout_count
    FROM events
    WHERE "EventID" IN ('644', '4740')
      AND "Target Username" IN ('Administrator', 'admin', 'Domain Admin', 'Enterprise Admin', 'krbtgt', 'svc_admin', 'backup_admin')
    LAST 1 HOURS
  yara_l: |
    rule high_value_account_lockout {
      meta:
        author = "Detection Engineer"
        description = "Detects account lockout events for high value target users - MITRE T1531 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1531"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_RESOURCE_ACCESS"
        ($e.metadata.product_event_type = "644" or $e.metadata.product_event_type = "4740")
        $e.target.user.userid = $user
        // High value target users - modify this list based on your environment
        $user in [
          "administrator",
          "domain admin",
          "enterprise admin",
          "schema admin",
          "backup operators",
          "account operators",
          "server operators",
          "print operators",
          "domain admins",
          "enterprise admins"
        ]
        $e.principal.hostname = $host

      match:
        $user, $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.code IN (\"644\", \"4740\") \n  AND user.name\
    \ IN (\"Administrator\", \"Domain Admins\", \"Enterprise Admins\", \"krbtgt\", \"backup_admin\", \"sql_service\", \"sharepoint_admin\")\n\
    | STATS lockouts = COUNT(*) BY user.name, host.name, bucket = BUCKET(@timestamp, 1 hour)\n| WHERE lockouts >= 1\n| KEEP bucket, host.name,\
    \ user.name, lockouts\n| SORT bucket DESC\n"
  leql: |
    where(source_json.EventID IN [644, 4740] AND destination_user IN ["<high_value_target_user_1>", "<high_value_target_user_2>"])
  crowdstrike: "EventCode=4740 \n| TargetUserName in [\"Administrator\", \"Domain Admin\", \"Enterprise Admin\", \"Schema Admin\", \"Backup Operator\"\
    , \"Account Operator\", \"Server Operator\", \"Print Operator\", \"KRBTGT\"]\n| table([@timestamp, ComputerName, TargetUserName, SubjectUserName,\
    \ SubjectDomainName])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (644, 4740)
    | filter action_evtlog_event_data_TargetUserName in ("Administrator", "Domain Admin", "Enterprise Admin", "krbtgt", "KRBTGT")
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, action_evtlog_event_id, action_evtlog_message
  lucene: |
    event.code:(644 OR 4740) AND user.target.name:("Administrator" OR "Domain Admin" OR "Enterprise Admin" OR "krbtgt" OR "KRBTGT")
  sumo: |
    _sourceCategory=*Windows*Security* ("644" OR "4740")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | where event_id in ("644", "4740")
    | where target_user in ("Administrator", "Domain Admin", "Enterprise Admin", "Schema Admin", "Backup Operator", "Account Operator", "krbtgt", "KRBTGT")
    | fields _messageTime, _sourceHost, event_id, target_user
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Account Locked Out Event

  Where the Event ID is in [644, 4740]

  Where the Destination Username is in the High Value Target Users List


  ---------------------------------------------------------------------------------------------------------------


  1 User Locked Out Event

  Where the Destination Username is in the High Value Target Users List'
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000112
v4_id: '000112'
name: Okta - User Reported Suspicious Login Activity
description: This is a report provides visibility into when an end user reports an Okta email notification as suspicious activity.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=okta eventType="user.account.report_suspicious_activity_by_enduser"

    | eval suspicious_ip=mvindex(''debugContext.debugData.suspiciousActivityEventIp'', 0)

    | eval client_ip=''client.ipAddress''

    | where suspicious_ip != client_ip

    | table _time, user, client_ip, suspicious_ip, eventType, outcome.result

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(24h)
    | where eventType_s == "user.account.report_suspicious_activity_by_enduser"
    | extend suspiciousActivityIp = tostring(parse_json(debugContext_s).debugData.suspiciousActivityEventIp)
    | extend clientIp = client_ipAddress_s
    | where suspiciousActivityIp != clientIp
    | project TimeGenerated, actor_alternateId_s, actor_displayName_s, eventType_s, suspiciousActivityIp, clientIp, client_geographicalContext_city_s, client_geographicalContext_country_s, debugContext_s
  aql: |
    SELECT eventtime, username, sourceip, "debugContext.debugData.suspiciousActivityEventIp", "client.ipAddress", "Event Type"
    FROM events
    WHERE "Event Type" = 'user.account.report_suspicious_activity_by_enduser'
      AND "debugContext.debugData.suspiciousActivityEventIp" != "client.ipAddress"
    LAST 24 HOURS
  yara_l: |
    rule okta_suspicious_activity_reported_different_ip {
      meta:
        author = "Detection Engineering"
        description = "Detects when a user reports suspicious activity from an IP different than the session IP"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Okta"
        $e.metadata.product_event_type = "user.account.report_suspicious_activity_by_enduser"
        $e.security_result.detection_fields["suspiciousActivityEventIp"] != $e.principal.ip
        $e.target.user.userid = $user

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-okta*
    | WHERE event.action == "user.account.report_suspicious_activity_by_enduser"
      AND okta.debug_context.debug_data.suspicious_activity_event_ip != client.ip
    | KEEP @timestamp, user.name, client.ip, okta.debug_context.debug_data.suspicious_activity_event_ip, event.action, okta.actor.alternate_id
  leql: |
    where(source_json.eventType="user.account.report_suspicious_activity_by_enduser" AND source_json.debugContext.debugData.suspiciousActivityEventIp != source_json.client.ipAddress)
  crowdstrike: "#type=okta eventType=\"user.account.report_suspicious_activity_by_enduser\" \n| debugContext.debugData.suspiciousActivityEventIp!=client.ipAddress\n\
    | table([@timestamp, actor.alternateId, client.ipAddress, debugContext.debugData.suspiciousActivityEventIp, eventType, outcome.result])\n"
  xql: |
    dataset = okta_raw_logs
    | filter event_type = "user.account.report_suspicious_activity_by_enduser"
    | alter suspicious_ip = json_extract_scalar(debugContext, "$.debugData.suspiciousActivityEventIp"),
            client_ip = json_extract_scalar(client, "$.ipAddress")
    | filter suspicious_ip != client_ip
    | fields _time, actor.alternateId, actor.displayName, client_ip, suspicious_ip, outcome.result
  lucene: |
    eventType:"user.account.report_suspicious_activity_by_enduser" AND NOT (debugContext.debugData.suspiciousActivityEventIp:client.ipAddress)
  sumo: |
    _sourceCategory=*Okta* "user.account.report_suspicious_activity_by_enduser"
    | json field=_raw "eventType" as event_type
    | json field=_raw "debugContext.debugData.suspiciousActivityEventIp" as suspicious_ip
    | json field=_raw "client.ipAddress" as client_ip
    | where event_type = "user.account.report_suspicious_activity_by_enduser"
    | where suspicious_ip != client_ip
    | fields _messageTime, event_type, suspicious_ip, client_ip, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Okta Event

  Where the Event Type is "user.account.report_suspicious_activity_by_enduser"

  Where "debugContext.debugData.suspiciousActivityEventIp" does NOT equal "client.ipAddress"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000114
v4_id: '000114'
name: Modifications to Domain Groups
description: A report that provides visibility into modifications made to domain groups by unauthorized users.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4735, 4737, 4757'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog (sourcetype=WinEventLog:Security OR sourcetype=WinEventLog) (EventCode=639 OR EventCode=4735 OR EventCode=641 OR EventCode=4737
    OR EventCode=661 OR EventCode=4757)

    | table _time, ComputerName, EventCode, Account_Name, TargetUserName, Group_Name, user, src_user

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (639, 4735, 641, 4737, 661, 4757)
    | project TimeGenerated, Computer, Account, TargetAccount, TargetUserName, Activity, EventID
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "EventID", "Target Username", "Group Name", "Member SID", categoryname(category)
    FROM events
    WHERE "EventID" IN ('639', '4735', '641', '4737', '661', '4757')
    LAST 24 HOURS
  yara_l: "rule windows_group_modified {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Windows security group modification events\
    \ - MITRE T1098 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1098\"\n    \n  events:\n\
    \    $e.metadata.event_type = \"USER_UPDATE_PERMISSIONS\"\n    (\n      $e.metadata.product_event_type = \"639\" or\n      $e.metadata.product_event_type\
    \ = \"4735\" or\n      $e.metadata.product_event_type = \"641\" or\n      $e.metadata.product_event_type = \"4737\" or\n      $e.metadata.product_event_type\
    \ = \"661\" or\n      $e.metadata.product_event_type = \"4757\"\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over\
    \ 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("639", "4735", "641", "4737", "661", "4757")
    | KEEP @timestamp, host.name, user.name, event.code, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName, winlog.event_data.TargetDomainName
  leql: |
    where(source_json.EventID IN [639, 4735, 641, 4737, 661, 4757])
  crowdstrike: |
    EventCode IN [639, 4735, 641, 4737, 661, 4757]
    | table([@timestamp, ComputerName, EventCode, TargetUserName, SubjectUserName, SubjectDomainName, MemberName, MemberSid, TargetSid])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (639, 4735, 641, 4737, 661, 4757)
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_evtlog_message, action_evtlog_event_data_TargetUserName
  lucene: |
    event.code:(639 OR 4735 OR 641 OR 4737 OR 661 OR 4757)
  sumo: |
    _sourceCategory=*Windows* (EventID=639 OR EventID=4735 OR EventID=641 OR EventID=4737 OR EventID=661 OR EventID=4757)
    | json field=_raw "EventID" as event_id
    | where event_id in ("639", "4735", "641", "4737", "661", "4757")
    | fields _messageTime, _sourceHost, event_id, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Group Modified Event

  Where the Event ID is in [639, 4735, 641, 4737, 661, 4757]'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000117
v4_id: '000117'
name: Okta - New Device Notification
description: A report that provides visibility into when a new device has been registered through Okta.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1200
technique_name: Hardware Additions
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=okta eventType="device.enrollment.create"

    | table _time, user, src_ip, eventType, device.name, device.id, actor.alternateId, target{}.alternateId

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(90d)
    | where eventType_s == "device.enrollment.create"
    | project TimeGenerated, actor_alternateId_s, actor_displayName_s, client_device_s, client_ipAddress_s, client_geographicalContext_city_s, client_geographicalContext_country_s, outcome_result_s, eventType_s
  aql: |
    SELECT sourceip, username, eventtime, LOGSOURCENAME(logsourceid) AS log_source, QIDNAME(qid) AS event_name
    FROM events
    WHERE QIDNAME(qid) ILIKE '%device.enrollment.create%' OR CATEGORYNAME(category) ILIKE '%device.enrollment.create%'
    LAST 24 HOURS
  yara_l: "rule okta_device_enrollment {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects new device enrollment in\
    \ Okta - MITRE T1200 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1200\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.product_name = \"Okta\"\n    $e.metadata.product_event_type = \"device.enrollment.create\"\
    \n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-okta*
    | WHERE event.action == "device.enrollment.create"
    | KEEP @timestamp, user.name, user.email, okta.actor.id, okta.actor.display_name, okta.client.ip, okta.client.user_agent.raw_user_agent, okta.client.geographical_context.city, okta.client.geographical_context.country, okta.device.name, okta.device.id, event.outcome
  leql: |
    where(eventType="device.enrollment.create")
  crowdstrike: |
    #repo=okta eventType="device.enrollment.create"
    | table([@timestamp, actor.alternateId, actor.displayName, client.ipAddress, client.device, client.userAgent.rawUserAgent, target.alternateId, target.displayName])
  xql: |
    dataset = okta_raw_logs
    | filter event_type = "device.enrollment.create"
    | fields _time, actor_display_name, actor_id, client_ip, outcome_result, device_os_platform, device_os_version
  lucene: |
    eventType:"device.enrollment.create"
  sumo: |
    _sourceCategory=*Okta*
    | json field=_raw "eventType" as event_type
    | where event_type = "device.enrollment.create"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Okta Event

  Where the EventType is "device.enrollment.create"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

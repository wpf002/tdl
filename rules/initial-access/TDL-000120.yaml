rule_id: TDL-AUTH-000120
v4_id: '000120'
name: Mass Account Lockouts
description: Detects when a large amount of user accounts are locked out which could be indicative of an enterprise wide password spraying attack.
  Attackers could try multiple user accounts and lock them out, which could be malicious activity or an attempt to learn the lockout policy of
  the organization.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1531
technique_name: Account Access Removal
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4740'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=644 OR EventCode=4740)

    | bin _time span=10m

    | stats dc(TargetUserName) as unique_users by _time, EventCode

    | where unique_users >= 25

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(10m)
    | where EventID in (644, 4740)
    | summarize UniqueUsers = dcount(TargetAccount), EventIDs = make_set(EventID), Computers = make_set(Computer), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated) by EventID
    | where UniqueUsers >= 25
    | project EventID, UniqueUsers, Computers, FirstSeen, LastSeen
  aql: |
    SELECT "Target Username" AS target_user, COUNT(*) AS lockout_count, UNIQUECOUNT("Target Username") AS unique_users
    FROM events
    WHERE "EventID" IN ('644', '4740')
    GROUP BY "Target Username", "EventID"
    HAVING unique_users >= 25
    LAST 10 MINUTES
  yara_l: |
    rule account_lockout_burst {
      meta:
        author = "TDL"
        description = "Detects 25+ account lockouts within 10 minutes - T1531 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1531"
        severity = "High"

      events:
        $e.metadata.event_type = "USER_UNCATEGORIZED"
        (
          $e.metadata.product_event_type = "644" or
          $e.metadata.product_event_type = "4740"
        )
        $e.target.user.userid = $user
        $e.metadata.product_event_type = $event_id

      match:
        $event_id over 10m

      outcome:
        $risk_score = 75
        $locked_users = array_distinct($user)
        $event_count = count_distinct($user)

      condition:
        #user >= 25
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 10 minutes AND event.code IN ("644", "4740")
    | STATS unique_users = COUNT_DISTINCT(user.name), event_count = COUNT(*) BY event.code, bucket = BUCKET(@timestamp, 10 minutes), host.name
    | WHERE unique_users >= 25
    | KEEP bucket, host.name, event.code, unique_users, event_count
  leql: |
    where(source_json.EventID IN [644, 4740]) groupby(source_json.EventID) calculate(unique:source_json.TargetUserName)
  crowdstrike: |
    EventCode=4740
    | groupBy([EventCode], function=count(TargetUserName, distinct=true, as=unique_users), span=10m)
    | unique_users >= 25
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (644, 4740)
    | bin _time span=10m
    | comp count_distinct(action_evtlog_event_data_TargetUserName) as unique_users by _time, action_evtlog_event_id, agent_hostname
    | filter unique_users >= 25
    | fields _time, agent_hostname, action_evtlog_event_id, unique_users
  lucene: |
    event.code:(644 OR 4740)
  sumo: |
    _sourceCategory=*Windows* ("644" OR "4740")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | where event_id in ("644", "4740")
    | timeslice 10m
    | count_distinct(target_user) as unique_users by _timeslice, event_id
    | where unique_users >= 25
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '25 Windows Account Locked Out Events

  Where the Event ID is in [644, 4740]

  With unique Destination Usernames

  With the same Event ID

  Within 10 mins


  ---------------------------------------------------------------------------------------------------------------


  25 User Account Locked Out Events

  With unique Destination Usernames

  With the same Event ID

  Within 10 mins'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

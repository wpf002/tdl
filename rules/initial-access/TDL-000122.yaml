rule_id: TDL-AUTH-000122
v4_id: '000122'
name: NTLM Authentication Attempt from Suspicious Host
description: Detects a NTLM Authentication where the source host does not match the source of the authentication
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Security Event Log
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" (EventCode=4624 OR EventCode=4625 OR EventCode=4768 OR EventCode=4769 OR EventCode=4776)

    | stats count values(host) as hosts by user, IpAddress, LogonType, EventCode

    | where count >= 1

    | sort - count

    '
  kql: "SecurityEvent\n| where TimeGenerated > ago(24h)\n| where EventID in (4624, 4625, 4768, 4769, 4776)\n| extend User = coalesce(TargetUserName,\
    \ Account, SubjectUserName)\n| summarize \n    count_ = count(),\n    hosts = make_set(Computer)\n    by User, IpAddress, LogonType, EventID\n\
    | where count_ >= 1\n| sort by count_ desc\n| project EventID, User, IpAddress, LogonType, count_, hosts\n"
  aql: |
    SELECT username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS count
    FROM events
    WHERE "EventID" IN ('4624', '4625', '4768', '4769', '4776')
    GROUP BY username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid)
    HAVING count >= 1
    ORDER BY count DESC
    LAST 24 HOURS
  yara_l: "rule valid_accounts_authentication_events {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Windows authentication\
    \ events indicating potential Valid Accounts usage (T1078)\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"\
    T1078\"\n    severity = \"Medium\"\n  \n  events:\n    $e.metadata.event_type = \"USER_LOGIN\"\n    (\n      $e.metadata.product_event_type\
    \ = \"4624\" or\n      $e.metadata.product_event_type = \"4625\" or\n      $e.metadata.product_event_type = \"4768\" or\n      $e.metadata.product_event_type\
    \ = \"4769\" or\n      $e.metadata.product_event_type = \"4776\"\n    )\n    $e.target.user.userid = $user\n    $e.principal.ip = $ip\n  \
    \  $e.metadata.product_event_type = $event_code\n    $e.principal.hostname = $host\n  \n  match:\n    $user, $ip, $event_code over 1h\n  \n\
    \  outcome:\n    $risk_score = max(35)\n    $event_count = count_distinct($e.metadata.id)\n    $hosts = array_distinct($host)\n    $logon_type\
    \ = array_distinct($e.extensions.auth.type)\n  \n  condition:\n    #e >= 1\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("4624", "4625", "4768", "4769", "4776")
    | STATS count = COUNT(*), hosts = COUNT_DISTINCT(host.name) BY user.name, source.ip, winlog.event_data.LogonType, event.code
    | WHERE count >= 1
    | SORT count DESC
    | KEEP user.name, source.ip, winlog.event_data.LogonType, event.code, count, hosts
  leql: |
    where(source_json.EventID IN [4624, 4625, 4768, 4769, 4776]) groupby(user, source_json.IpAddress, source_json.LogonType, source_json.EventID) calculate(count)
  crowdstrike: |
    EventCode IN [4624, 4625, 4768, 4769, 4776]
    | groupBy([TargetUserName, IpAddress, LogonType, EventCode], function=[count(as=cnt), collect(ComputerName, as=hosts)])
    | cnt >= 1
    | sort(field=cnt, order=desc, limit=10000)
    | table([TargetUserName, IpAddress, LogonType, EventCode, cnt, hosts])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (4624, 4625, 4768, 4769, 4776)
    | alter user = coalesce(action_evtlog_event_data_TargetUserName, action_evtlog_event_data_TargetUserName),
             IpAddress = coalesce(action_evtlog_event_data_IpAddress, action_evtlog_event_data_IpAddress),
             LogonType = coalesce(action_evtlog_event_data_LogonType, action_evtlog_event_data_LogonType),
             EventCode = action_evtlog_event_id
    | comp count() as event_count, values(agent_hostname) as hosts by user, IpAddress, LogonType, EventCode
    | filter event_count >= 1
    | sort desc event_count
    | fields user, IpAddress, LogonType, EventCode, event_count, hosts
  lucene: |
    event.code:(4624 OR 4625 OR 4768 OR 4769 OR 4776)
  sumo: |
    _sourceCategory=*Windows*Security*
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as user
    | json field=_raw "IpAddress" as ip_address
    | json field=_raw "LogonType" as logon_type
    | json field=_raw "Computer" as host
    | where event_id in ("4624", "4625", "4768", "4769", "4776")
    | count as cnt, values(host) as hosts by user, ip_address, logon_type, event_id
    | where cnt >= 1
    | sort by cnt desc
    | fields user, ip_address, logon_type, event_id, cnt, hosts
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 or more instances within any observed window of Windows Security authentication events.


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is one of: 4624 (successful logon), 4625 (failed logon), 4768 (Kerberos TGT request), 4769 (Kerberos service ticket request),
  or 4776 (NTLM credential validation)

  With the host field collected as a multi-value list (hosts) to identify mismatches between the originating host and the authenticating source

  Where count is greater than or equal to 1

  With the same user, IpAddress, LogonType, and EventCode as the correlation key

  Deduplication and ranking applied by sorting on count descending to surface the highest-frequency mismatches first'

rule_id: TDL-AUTH-000127
v4_id: '000127'
name: AWS Admin Group Created by Unauthorized User
description: Detects when a group has been granted administrative privileges. An attacker with a compromised API key may create a group with administrative
  privileges to establish persistence in AWS before executing malicious activities. The group that received the administrative privileges will
  be added to the Administrative Group list so any members added can be identified as administrators in other events.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- AWS
data_sources:
- Amazon AWS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudtrail eventName=CreateGroup \n| eval isAdminGroup=if(match(requestParameters.groupName, \"(?i)(admin|root|superuser|privileged)\"\
    ), 1, 0)\n| where isAdminGroup=1\n| lookup authorized_group_modifiers.csv userIdentity.userName OUTPUT authorized\n| where isnull(authorized)\
    \ OR authorized!=1\n| table _time, userIdentity.userName, requestParameters.groupName, sourceIPAddress, userAgent, awsRegion\n"
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName == "CreateGroup"
    | extend GroupName = tostring(parse_json(RequestParameters).groupName)
    | where GroupName has_any ("Admin", "admin", "Administrator", "administrator", "Root", "root", "Privileged", "privileged")
    | extend SourceUser = tostring(UserIdentityPrincipalid)
    | where SourceUser !in ("authorized-admin-user1", "authorized-admin-user2", "authorized-service-account")
    | project TimeGenerated, EventName, GroupName, SourceUser, SourceIPAddress, UserAgent, AWSRegion, RequestParameters, ResponseElements
  aql: |
    SELECT sourceip, username AS source_user, "AWS Account ID", "Group Name", "Request Parameters", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cloudtrail%'
      AND ("Event Name" = 'CreateGroup' OR "eventName" = 'CreateGroup')
      AND ("Group Name" ILIKE '%admin%' OR "Group Name" ILIKE '%administrator%' OR "groupName" ILIKE '%admin%' OR "groupName" ILIKE '%administrator%')
      AND username NOT IN ('authorized_user1', 'authorized_user2', 'authorized_admin')
    LAST 24 HOURS
  yara_l: |
    rule aws_unauthorized_admin_group_creation {
      meta:
        author = "TDL"
        description = "Detects creation of AWS admin groups by unauthorized users - T1098 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1098"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.event_type = "USER_RESOURCE_CREATION"
        (
          $e.metadata.product_event_type = "CreateGroup" or
          $e.security_result.detection_fields["eventName"] = "CreateGroup"
        )
        (
          re.regex($e.target.resource.name, `(?i)(admin|administrator|root|super|privileged)`) or
          re.regex($e.security_result.detection_fields["groupName"], `(?i)(admin|administrator|root|super|privileged)`)
        )
        $e.principal.user.userid = $source_user
        not (
          $source_user = "authorized-admin-1@example.com" or
          $source_user = "authorized-admin-2@example.com" or
          $source_user = "iam-automation-service"
        )
        $e.target.resource.name = $group_name

      match:
        $source_user over 5m

      outcome:
        $risk_score = 85
        $group_created = $group_name
        $unauthorized_user = $source_user

      condition:
        $e
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.dataset == \"aws.cloudtrail\" \n  AND event.action == \"\
    CreateGroup\"\n  AND (\n    TO_LOWER(aws.cloudtrail.request_parameters) LIKE \"*admin*\"\n    OR TO_LOWER(aws.cloudtrail.request_parameters)\
    \ LIKE \"*administrator*\"\n    OR TO_LOWER(aws.cloudtrail.request_parameters) LIKE \"*poweruser*\"\n  )\n  AND user.name NOT IN (\"authorized_admin_user1\"\
    , \"authorized_admin_user2\", \"terraform_service_account\", \"cloudformation_service_account\")\n| KEEP @timestamp, cloud.account.id, user.name,\
    \ aws.cloudtrail.user_identity.arn, event.action, aws.cloudtrail.request_parameters, source.ip, user_agent.original\n"
  leql: |
    where(source_json.eventName="CreateGroup" AND source_json.requestParameters.groupName ICONTAINS "admin" AND source_json.userIdentity.principalId NOT IN ["AUTHORIZED_USER_1", "AUTHORIZED_USER_2", "AUTHORIZED_USER_3"])
  crowdstrike: |
    #repo=aws #type=cloudtrail eventName=CreateGroup
    | in(field="responseElements.group.groupName", values=["Admin*", "*Administrator*", "*admin*"], ignoreCase=true)
    | !in(field="userIdentity.principalId", values=["AUTHORIZED_USER_1", "AUTHORIZED_USER_2", "AUTHORIZED_SERVICE_ACCOUNT"])
    | table([@timestamp, userIdentity.principalId, userIdentity.arn, sourceIPAddress, responseElements.group.groupName, responseElements.group.arn, userAgent, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and operation_name = "CreateGroup"
    | alter is_admin_group = if(json_extract_scalar(resource, "$.groupName") ~= "(?i).*(admin|root|privilege|elevated).*", true, false)
    | filter is_admin_group = true
    | alter source_user = json_extract_scalar(identity, "$.principalId")
    | alter authorized_users = arraystring(["authorized-user-1", "authorized-user-2", "authorized-user-3"], ",")
    | filter source_user != null and source_user not in (authorized_users)
    | fields _time, cloud_provider, project, source_user, operation_name, resource, identity, caller_ip_address
  lucene: |
    eventName:CreateGroup AND (userIdentity.arn:*Admin* OR requestParameters.groupName:*Admin* OR requestParameters.groupName:*Administrator*) AND NOT userIdentity.principalId:(AIDAI* OR service-role* OR AWSServiceRoleFor*)
  sumo: |
    _sourceCategory=*cloudtrail* eventName=CreateGroup
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.userName" as source_user
    | json field=_raw "requestParameters.groupName" as group_name
    | json field=_raw "responseElements.group.groupName" as response_group_name
    | where event_name = "CreateGroup"
    | where (group_name matches "*Admin*" or group_name matches "*admin*" or response_group_name matches "*Admin*" or response_group_name matches "*admin*")
    | where !(source_user in ("authorized_user1", "authorized_user2", "authorized_user3"))
    | fields _messageTime, source_user, group_name, response_group_name, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Group Created

  Where the Group is an Admin Group

  Where the Source User is Not on the Users Authorized to Modify Groups/Users'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

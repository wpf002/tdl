rule_id: TDL-AUTH-000128
v4_id: 000128
name: AWS Password Guessing
description: Detects an attacker attempting to guess the password of an AWS user to gain access to the AWS console.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- Amazon AWS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName=ConsoleLogin userIdentity.type=IAMUser responseElements.ConsoleLogin=Failure

    | bin _time span=5m

    | stats count by _time, sourceIPAddress, userIdentity.userName

    | where count >= 5

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName == "ConsoleLogin"
    | where UserIdentityType == "IAMUser"
    | where ResponseElements has "Failure"
    | extend DestinationUsername = UserIdentityUserName
    | summarize FailureCount = count() by bin(TimeGenerated, 5m), SourceIpAddress, DestinationUsername
    | where FailureCount >= 5
    | project TimeGenerated, SourceIpAddress, DestinationUsername, FailureCount
  aql: |
    SELECT sourceip, username, COUNT(*) AS failed_logins
    FROM events
    WHERE qidname(qid) ILIKE '%ConsoleLogin%'
      AND "userIdentity.type" = 'IAMUser'
      AND "responseElements.ConsoleLogin" = 'Failure'
    GROUP BY sourceip, username
    HAVING failed_logins >= 5
    LAST 5 MINUTES
  yara_l: |
    rule aws_console_login_brute_force {
      meta:
        author = "Detection Engineer"
        description = "Detects 5 failed AWS Console login attempts from same source IP to same IAM user within 5 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.product_event_type = "ConsoleLogin"
        $e.security_result.action = "BLOCK"
        $e.target.user.userid = $user
        $e.principal.ip = $ip
        re.regex($e.target.resource.attribute.labels.value, `(?i)IAMUser`) or
        re.regex($e.security_result.detection_fields["userIdentity.type"], `(?i)IAMUser`)

      match:
        $ip, $user over 5m

      outcome:
        $risk_score = 75

      condition:
        #e >= 5
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.action == \"ConsoleLogin\"\n  AND aws.cloudtrail.user_identity.type\
    \ == \"IAMUser\"\n  AND event.outcome == \"failure\"\n| STATS failure_count = COUNT(*) BY source.ip, user.name, time_window = BUCKET(@timestamp,\
    \ 5 minute)\n| WHERE failure_count >= 5\n| KEEP time_window, source.ip, user.name, failure_count\n"
  leql: |
    where(source_json.eventName="ConsoleLogin" AND source_json.userIdentity.type="IAMUser" AND source_json.responseElements.ConsoleLogin="Failure") groupby(source_address, source_json.userIdentity.userName) calculate(count)
  crowdstrike: |
    #repo=cloudtrail eventName=ConsoleLogin userIdentity.type=IAMUser responseElements.ConsoleLogin=Failure
    | groupBy([sourceIPAddress, userIdentity.userName], function=count(as=failedLogins), span=5m)
    | failedLogins >= 5
    | table([_bucket, sourceIPAddress, userIdentity.userName, failedLogins])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and operation_name = "ConsoleLogin" and identity_type = "IAMUser" and outcome = "failure"
    | bin _time span=5m
    | comp count() as failure_count by _time, identity_name, source_ipv4
    | filter failure_count >= 5
    | fields _time, identity_name, source_ipv4, failure_count
  lucene: |
    eventName:ConsoleLogin AND userIdentity.type:IAMUser AND responseElements.ConsoleLogin:Failure
  sumo: |
    _sourceCategory=*cloudtrail* "ConsoleLogin"
    | json field=_raw "eventName" as event_name
    | json field=_raw "userIdentity.type" as user_type
    | json field=_raw "responseElements.ConsoleLogin" as result
    | json field=_raw "userIdentity.userName" as username
    | json field=_raw "sourceIPAddress" as source_ip
    | where event_name = "ConsoleLogin" and user_type = "IAMUser" and result = "Failure"
    | timeslice 5m
    | count as attempts by _timeslice, source_ip, username
    | where attempts >= 5
    | fields _timeslice, source_ip, username, attempts
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 AWS CloudTrail Events

  From the same Source IP

  Where the Event ID is "ConsoleLogin"

  Where the User Type (userIdentity.type) is "IAMUser"

  Where the Result (responseElements.ConsoleLogin) is "Failure"

  With the same Destination Username

  Within 5 minutes'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

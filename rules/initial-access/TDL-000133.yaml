rule_id: TDL-AUTH-000133
v4_id: '000133'
name: AWS Unauthorized Action Attempts
description: Detects an AWS account that has been blocked from performing multiple actions due to security permissions. An attacker with a compromised
  account may not know the account’s permissions and will attempt abusive activities, which may be blocked due to insufficient privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventType=AwsApiCall userIdentity.type=IAMUser (errorCode=AccessDenied OR errorCode=UnauthorizedOperation)

    | bin _time span=1m

    | stats count by _time, userIdentity.userName, userIdentity.arn, sourceIPAddress

    | where count >= 3

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventTypeName == "AwsApiCall"
    | where UserIdentityType == "IAMUser"
    | where ErrorCode in ("AccessDenied", "UnauthorizedOperation")
    | summarize EventCount = count() by bin(TimeGenerated, 1m), UserIdentityPrincipalid, SourceIpAddress, UserIdentityArn
    | where EventCount >= 3
    | project TimeGenerated, UserIdentityPrincipalid, UserIdentityArn, SourceIpAddress, EventCount
  aql: |
    SELECT sourceip, username, "userIdentity.type" AS user_type, "errorCode" AS error_code, COUNT(*) AS event_count
    FROM events
    WHERE "eventType" = 'AwsApiCall'
      AND "userIdentity.type" = 'IAMUser'
      AND "errorCode" IN ('AccessDenied', 'UnauthorizedOperation')
    GROUP BY sourceip, username, "userIdentity.type", "errorCode"
    HAVING event_count >= 3
    LAST 1 MINUTES
  yara_l: |
    rule aws_iam_user_repeated_access_denied {
      meta:
        author = "Detection Engineering"
        description = "Detects IAM user with multiple access denied errors in short timeframe - T1098 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.product_event_type = "AwsApiCall"
        $e.principal.user.attribute.labels.key = "type"
        $e.principal.user.attribute.labels.value = "IAMUser"
        (
          $e.security_result.summary = "AccessDenied" or
          $e.security_result.summary = "UnauthorizedOperation"
        )
        $e.principal.user.userid = $user

      match:
        $user over 1m

      condition:
        #e >= 3
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.action != null\n  AND userIdentity.type == \"IAMUser\"\n\
    \  AND aws.cloudtrail.error_code IN (\"AccessDenied\", \"UnauthorizedOperation\")\n| STATS event_count = COUNT(*) BY userIdentity.principalId,\
    \ userIdentity.arn, source.ip, bucket = BUCKET(@timestamp, 1 minute)\n| WHERE event_count >= 3\n| KEEP bucket, userIdentity.principalId, userIdentity.arn,\
    \ source.ip, event_count\n"
  leql: |
    where(source_json.eventType="AwsApiCall" AND source_json.userIdentity.type="IAMUser" AND source_json.errorCode IN [AccessDenied, UnauthorizedOperation]) groupby(source_json.userIdentity.userName, source_json.sourceIPAddress) calculate(count)
  crowdstrike: |
    #repo=*cloudtrail* eventType=AwsApiCall userIdentity.type=IAMUser (errorCode=AccessDenied OR errorCode=UnauthorizedOperation)
    | bucket(limit=1, span=1m, function=[count(as=event_count), collect([userIdentity.userName, errorCode, eventName, sourceIPAddress])])
    | event_count >= 3
    | table([@timestamp, userIdentity.userName, event_count, errorCode, eventName, sourceIPAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and operation_type = "AwsApiCall" and json_extract_scalar(raw_log, "$.userIdentity.type") = "IAMUser" and json_extract_scalar(raw_log, "$.errorCode") in ("AccessDenied", "UnauthorizedOperation")
    | bin _time span=1m
    | comp count() as event_count by _time, identity_name, actor_effectiveusername
    | filter event_count >= 3
    | fields _time, identity_name, actor_effectiveusername, event_count
  lucene: |
    eventType:AwsApiCall AND userIdentity.type:IAMUser AND errorCode:(AccessDenied OR UnauthorizedOperation)
  sumo: |
    _sourceCategory=*CloudTrail* eventType=AwsApiCall
    | json field=_raw "userIdentity.type" as user_type
    | json field=_raw "errorCode" as error_code
    | json field=_raw "userIdentity.userName" as user_name
    | json field=_raw "sourceIPAddress" as src_ip
    | where user_type = "IAMUser"
    | where error_code in ("AccessDenied", "UnauthorizedOperation")
    | timeslice 1m
    | count as event_count by _timeslice, user_name, src_ip
    | where event_count >= 3
    | fields _timeslice, user_name, src_ip, event_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '3 AWS CloudTrail events

  Where the Event Type is AwsApiCall

  Where the User Type (userIdentity.type) is "IAMUser"

  Where the Error_code is in [AccessDenied, UnauthorizedOperation]

  Within 1 minute'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000134
v4_id: '000134'
name: AWS Root Account Used
description: Detects when the default AWS root account is used. The root account is first created with the AWS subscription account and has the
  highest privileges. It is recommended to immediately create a separate administrative account instead of using root, as normal usage of root
  can make the account more vulnerable to compromise. Utilizing a separate administrative account will also aid in forensics of any incident that
  were to occur.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- AWS
data_sources:
- AWS CloudTrail
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "(index=aws (sourcetype=aws:cloudtrail (userIdentity.type=Root NOT userIdentity.invokedBy=* eventType!=AwsServiceEvent)) OR (sourcetype=aws:guardduty\
    \ (finding.type=\"Policy:IAMUser/RootCredentialUsage\" OR finding.type=\"Policy:IAMUser/ShortTermRootCredentialUsage\")))\n| eval detection_source=case(\n\
    \    sourcetype=\"aws:cloudtrail\", \"CloudTrail\",\n    sourcetype=\"aws:guardduty\", \"GuardDuty\",\n    1=1, \"Unknown\"\n)\n| table _time,\
    \ detection_source, userIdentity.type, userIdentity.invokedBy, eventType, eventName, sourceIPAddress, userIdentity.arn, awsRegion, finding.type,\
    \ finding.severity\n"
  kql: |
    union
    (
    AWSCloudTrail
    | where TimeGenerated > ago(24h)
    | where UserIdentityType == "Root"
    | where isempty(UserIdentityInvokedBy) or isnull(UserIdentityInvokedBy)
    | where EventTypeName != "AwsServiceEvent"
    | project TimeGenerated, EventName, EventTypeName, UserIdentityType, UserIdentityArn, UserIdentityAccountId, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, AWSRegion, EventSource
    ),
    (
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Type in ("Policy:IAMUser/RootCredentialUsage", "Policy:IAMUser/ShortTermRootCredentialUsage")
    | project TimeGenerated, Title, Type, Severity, Description, AccountId, Region, ResourceType, ResourceId, ServiceAction = tostring(parse_json(AdditionalData).serviceAction)
    )
  aql: "SELECT \n    eventtime,\n    LOGSOURCENAME(logsourceid) AS log_source,\n    username,\n    \"eventName\" AS event_name,\n    \"userIdentity.type\"\
    \ AS user_type,\n    \"userIdentity.invokedBy\" AS invoked_by,\n    \"eventType\" AS event_type,\n    \"finding.type\" AS finding_type,\n\
    \    sourceip,\n    \"userAgent\" AS user_agent,\n    \"requestParameters\" AS request_parameters\nFROM events\nWHERE \n    (\n        (LOGSOURCENAME(logsourceid)\
    \ ILIKE '%CloudTrail%' \n         AND \"userIdentity.type\" = 'Root' \n         AND (\"userIdentity.invokedBy\" IS NULL OR \"userIdentity.invokedBy\"\
    \ = '')\n         AND \"eventType\" != 'AwsServiceEvent')\n        OR\n        (LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%' \n        \
    \ AND \"finding.type\" IN ('Policy:IAMUser/RootCredentialUsage', 'Policy:IAMUser/ShortTermRootCredentialUsage'))\n    )\nLAST 24 HOURS\n"
  yara_l: "rule aws_root_account_usage {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS root account usage via CloudTrail or\
    \ GuardDuty events\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1098\"\n    severity = \"HIGH\"\n\n  events:\n\
    \    // CloudTrail root usage detection\n    $ct.metadata.product_name = \"AWS CloudTrail\"\n    $ct.metadata.vendor_name = \"AMAZON\"\n \
    \   $ct.security_result.detection_fields[\"userIdentity.type\"] = \"Root\"\n    not $ct.security_result.detection_fields[\"userIdentity.invokedBy\"\
    ] != \"\"\n    $ct.metadata.product_event_type != \"AwsServiceEvent\"\n    $ct.principal.user.userid = $user\n    \n    // GuardDuty root\
    \ usage detection\n    $gd.metadata.product_name = \"AWS GuardDuty\"\n    $gd.metadata.vendor_name = \"AMAZON\"\n    (\n      $gd.metadata.product_event_type\
    \ = \"Policy:IAMUser/RootCredentialUsage\" or\n      $gd.metadata.product_event_type = \"Policy:IAMUser/ShortTermRootCredentialUsage\"\n \
    \   )\n    $gd.principal.user.userid = $user_gd\n\n  match:\n    $user over 5m\n\n  outcome:\n    $risk_score = 85\n\n  condition:\n    $ct\
    \ or $gd\n}\n"
  esql: "FROM logs-aws.cloudtrail*, .alerts-security.alerts-*\n| WHERE \n    (\n      (userIdentity.type == \"Root\" \n       AND NOT ENDS_WITH(COALESCE(userIdentity.invokedBy,\
    \ \"\"), \".amazonaws.com\")\n       AND event.type != \"AwsServiceEvent\")\n    )\n    OR\n    (\n      event.action IN (\"Policy:IAMUser/RootCredentialUsage\"\
    , \"Policy:IAMUser/ShortTermRootCredentialUsage\")\n    )\n| KEEP @timestamp, event.dataset, event.action, event.type, userIdentity.type,\
    \ userIdentity.invokedBy, userIdentity.principalId, userIdentity.arn, source.ip, cloud.account.id, user.name, event.outcome\n"
  leql: |
    where(source_json.userIdentity.type="Root" AND source_json.userIdentity.invokedBy=NULL AND source_json.eventType!="AwsServiceEvent") OR where(source_json.type IN ["Policy:IAMUser/RootCredentialUsage", "Policy:IAMUser/ShortTermRootCredentialUsage"])
  crowdstrike: |
    (#type=cloudtrail userIdentity.type=Root NOT userIdentity.invokedBy=* eventType!=AwsServiceEvent) OR (#type=guardduty (finding.type="Policy:IAMUser/RootCredentialUsage" OR finding.type="Policy:IAMUser/ShortTermRootCredentialUsage"))
    | table([@timestamp, #type, eventName, userIdentity.type, userIdentity.invokedBy, eventType, finding.type, userIdentity.principalId, sourceIPAddress, userAgent])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"AWS\" \n  and (\n    (vendor_name = \"AWS\" and event_type = \"CloudTrail\" \n\
    \     and json_extract_scalar(raw_log, \"$.userIdentity.type\") = \"Root\" \n     and json_extract_scalar(raw_log, \"$.userIdentity.invokedBy\"\
    ) = null\n     and json_extract_scalar(raw_log, \"$.eventType\") != \"AwsServiceEvent\")\n    or\n    (vendor_name = \"AWS\" and event_type\
    \ = \"GuardDuty\"\n     and json_extract_scalar(raw_log, \"$.type\") in (\"Policy:IAMUser/RootCredentialUsage\", \"Policy:IAMUser/ShortTermRootCredentialUsage\"\
    ))\n  )\n| fields _time, cloud_provider, vendor_name, event_type, raw_log\n"
  lucene: |
    (eventSource:cloudtrail AND userIdentity.type:Root AND NOT _exists_:userIdentity.invokedBy AND NOT eventType:AwsServiceEvent) OR (eventSource:guardduty AND findingType:("Policy:IAMUser/RootCredentialUsage" OR "Policy:IAMUser/ShortTermRootCredentialUsage"))
  sumo: "_sourceCategory=*cloudtrail* OR _sourceCategory=*guardduty*\n| json field=_raw \"userIdentity.type\" as user_type\n| json field=_raw\
    \ \"userIdentity.invokedBy\" as invoked_by\n| json field=_raw \"eventType\" as event_type\n| json field=_raw \"type\" as guardduty_type\n\
    | json field=_raw \"eventName\" as event_name\n| where (user_type = \"Root\" and isNull(invoked_by) and event_type != \"AwsServiceEvent\"\
    ) \n   or (guardduty_type in (\"Policy:IAMUser/RootCredentialUsage\", \"Policy:IAMUser/ShortTermRootCredentialUsage\"))\n| fields _messageTime,\
    \ _sourceCategory, user_type, invoked_by, event_type, guardduty_type, event_name\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 AWS CloudTrail Event\nWhere the User Type {userIdentity.type} is Root\nWhere the Parent Process {userIdentity.invokedBy} name\
  \ is NULL\nWhere the Event Type is NOT \"AwsServiceEvent\"\n\n\n-----------------------------------------------------------------------------------------\n\
  \n1 Guard Duty Event \nWhere the Event Type is in [\"Policy:IAMUser/RootCredentialUsage\", \"Policy:IAMUser/ShortTermRootCredentialUsage\"]"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000139
v4_id: 000139
name: Domain Account Enabled by Unauthorized User
description: Detects when a domain account is enabled by an unauthorized user. This activity is commonly preformed by domain admins.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4722'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=626 OR EventCode=4722)

    | lookup company_ad_domains.csv domain AS TargetUserName OUTPUT domain AS is_company_domain

    | where isnotnull(is_company_domain)

    | lookup authorized_user_admins.csv user AS Account_Name OUTPUT user AS is_authorized

    | where isnull(is_authorized)

    | table _time, ComputerName, EventCode, Account_Name, TargetUserName, TargetDomainName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (626, 4722)
    | where TargetAccount has "@" or Computer has "."
    | where SubjectUserName !in~ ("admin", "svc_account", "authorized_user")
    | project TimeGenerated, Computer, EventID, SubjectUserName, SubjectDomainName, TargetAccount, TargetDomainName, Activity
  aql: |
    SELECT eventtime, sourceip, username AS source_user, "Destination User Domain", "Destination Username", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE "EventID" IN ('626', '4722')
      AND "Destination User Domain" IN ('corp.company.com', 'company.local')
      AND username NOT IN ('admin_account1', 'admin_account2', 'service_account')
    LAST 24 HOURS
  yara_l: "rule windows_user_account_enabled_unauthorized {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects unauthorized\
    \ user account enabled events (MITRE T1098 - Account Manipulation)\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1098\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"USER_CREATION\"\n    $e.metadata.product_event_type\
    \ = \"4722\"\n    $e.target.user.userid = $dest_user\n    $e.principal.user.userid = $source_user\n    $e.principal.hostname = $host\n   \
    \ \n    // Company AD Domains - adjust these to your environment\n    (\n      re.regex($e.target.user.userid, `(?i)@(company\\.com|corp\\\
    .company\\.com|internal\\.company\\.com)$`) or\n      re.regex($e.target.user.userid, `(?i)^(company|corp)\\\\`)\n    )\n    \n    // Exclude\
    \ authorized users - adjust these to your environment\n    not re.regex($e.principal.user.userid, `(?i)^(svc_admin|domain_admin|user_provisioning|ad_automation)`)\n\
    \    \n  match:\n    $host, $source_user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.code IN ("626", "4722")
      AND winlog.event_data.TargetDomainName IN ("CORP", "INTERNAL", "DOMAIN")
      AND winlog.event_data.SubjectUserName NOT IN ("admin", "svcadmin", "domainadmin", "helpdesk")
    | STATS event_count = COUNT(*) BY host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.TargetDomainName, @timestamp
    | KEEP @timestamp, host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.TargetDomainName, event_count
  leql: |
    where(source_json.EventID IN [626, 4722] AND source_json.TargetDomainName IN ["CORP", "DOMAIN"] AND NOT(source_json.SubjectUserName IN ["admin1", "admin2", "svcaccount"]))
  crowdstrike: "EventCode=4722 \n| NOT (SourceUserName IN [\"authorized_user1\", \"authorized_user2\", \"authorized_service_account\"])\n| TargetDomainName\
    \ IN [\"corp.company.com\", \"company.local\", \"company.com\"]\n| table([@timestamp, ComputerName, SourceUserName, TargetUserName, TargetDomainName,\
    \ EventCode])\n"
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (626, 4722)
    | filter action_evtlog_event_data_TargetDomainName in ("corp.local", "domain.local")
    | filter actor_effective_username not in ("admin_svc", "hr_admin", "it_admin")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_TargetDomainName, action_evtlog_event_id
  lucene: |
    event.code:4722 AND winlog.event_data.TargetDomainName:(domain1.local OR domain2.local OR domain3.local) AND NOT winlog.event_data.SubjectUserName:(authorized_user1 OR authorized_user2 OR authorized_user3)
  sumo: |
    _sourceCategory=*Windows*Security* ("626" OR "4722")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetDomainName" as dest_domain
    | json field=_raw "SubjectUserName" as source_user
    | where event_id in ("626", "4722")
    | where dest_domain in ("corp.company.com", "company.local", "company.com")
    | where !(source_user in ("admin_svc", "provisioning_account", "hr_automation"))
    | fields _messageTime, _sourceHost, event_id, source_user, dest_domain
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows User Created Event

  Where the Event ID is in [626, 4722]

  Where the Destination User Domain is in the Company AD Domains List

  Where the Source Username is NOT on the Users Authorized to Modify Users List'
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

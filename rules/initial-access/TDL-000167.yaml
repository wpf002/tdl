rule_id: TDL-AUTH-000167
v4_id: '000167'
name: External Reconnaissance Followed by VPN Authentication
description: This rule is designed to track external reconnaissance and when any previously flagged IP is spotted attempting to make remote login.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1595
technique_name: Active Scanning
platform:
- Network
data_sources:
- Firewall
- VPN
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=* (sourcetype=firewall OR sourcetype=vpn OR source=*firewall* OR source=*vpn*)
    | eval event_type=case(
        (like(lower(action), "%port%scan%") OR like(lower(event), "%port%scan%") OR like(lower(signature), "%port%scan%")) AND (like(lower(direction), "%inbound%") OR like(lower(action), "%inbound%")), "port_scan",
        (like(lower(action), "%service%discovery%") OR like(lower(event), "%service%discovery%") OR like(lower(signature), "%service%discovery%")) AND (like(lower(direction), "%inbound%") OR like(lower(action), "%inbound%")), "service_discovery",
        (like(lower(action), "%vulnerability%scan%") OR like(lower(event), "%vulnerability%scan%") OR like(lower(signature), "%vulnerability%scan%")) AND (like(lower(direction), "%inbound%") OR like(lower(action), "%inbound%")), "vuln_scan",
        (like(lower(action), "%vulnerability%sweep%") OR like(lower(event), "%vulnerability%sweep%") OR like(lower(signature), "%vulnerability%sweep%")) AND (like(lower(direction), "%inbound%") OR like(lower(action), "%inbound%")), "vuln_sweep",
        (like(lower(action), "%vpn%auth%") OR like(lower(event), "%vpn%auth%") OR like(lower(message), "%vpn%auth%")) AND (like(lower(action), "%success%") OR like(lower(status), "%success%") OR like(lower(result), "%success%")), "vpn_success",
        1=1, "other"
    )
    | where event_type IN("port_scan", "service_discovery", "vuln_scan", "vuln_sweep", "vpn_success")
    | eval src_ip=coalesce(src, src_ip, source_ip, srcip, SRC_IP)
    | streamstats time_window=7d earliest(_time) as first_scan_time, latest(_time) as last_event_time by src_ip
    | eventstats values(event_type) as all_events by src_ip
    | where mvcount(all_events) > 1 AND (like(mvjoin(all_events, ","), "%port_scan%") OR like(mvjoin(all_events, ","), "%service_discovery%") OR like(mvjoin(all_events, ","), "%vuln_scan%") OR like(mvjoin(all_events, ","), "%vuln_sweep%")) AND like(mvjoin(all_events, ","), "%vpn_success%")
    | eval time_diff=last_event_time - first_scan_time
    | where time_diff <= 604800
    | stats earliest(_time) as first_event, latest(_time) as last_event, values(event_type) as event_types, values(user) as users, count by src_ip
    | where like(mvjoin(event_types, ","), "%vpn_success%") AND (like(mvjoin(event_types, ","), "%port_scan%") OR like(mvjoin(event_types, ","), "%service_discovery%") OR like(mvjoin(event_types, ","), "%vuln_scan%") OR like(mvjoin(event_types, ","), "%vuln_sweep%"))
    | table first_event, last_event, src_ip, event_types, users, count
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_auth_000167 {\n  meta:\n    author = \"TDL\"\n    description = \"External Reconnaissance Followed by VPN Authentication\"\
    \n    severity = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1595\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\
    \n    $e.network.protocol = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: '1 Port Scan Detected - Inbound, Service Discovery - Inbound, Vulnerability Scan - Inbound, OR Vulnerability Sweep - Inbound Event


  Followed By


  1 Successful VPN Authentication Event

  With the same Source IP from the previous event

  Within 7 Days'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000167
v4_id: '000167'
name: External Reconnaissance Followed by VPN Authentication
description: This rule is designed to track external reconnaissance and when any previously flagged IP is spotted attempting to make remote login.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1595
technique_name: Active Scanning
platform:
- Network
data_sources:
- Firewall
- VPN
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=* (sourcetype=firewall OR sourcetype=vpn OR source=*firewall* OR source=*vpn*)\n| eval event_type=case(\n    (like(lower(action),\
    \ \"%port%scan%\") OR like(lower(event), \"%port%scan%\") OR like(lower(signature), \"%port%scan%\")) AND (like(lower(direction), \"%inbound%\"\
    ) OR like(lower(action), \"%inbound%\")), \"port_scan\",\n    (like(lower(action), \"%service%discovery%\") OR like(lower(event), \"%service%discovery%\"\
    ) OR like(lower(signature), \"%service%discovery%\")) AND (like(lower(direction), \"%inbound%\") OR like(lower(action), \"%inbound%\")), \"\
    service_discovery\",\n    (like(lower(action), \"%vulnerability%scan%\") OR like(lower(event), \"%vulnerability%scan%\") OR like(lower(signature),\
    \ \"%vulnerability%scan%\")) AND (like(lower(direction), \"%inbound%\") OR like(lower(action), \"%inbound%\")), \"vuln_scan\",\n    (like(lower(action),\
    \ \"%vulnerability%sweep%\") OR like(lower(event), \"%vulnerability%sweep%\") OR like(lower(signature), \"%vulnerability%sweep%\")) AND (like(lower(direction),\
    \ \"%inbound%\") OR like(lower(action), \"%inbound%\")), \"vuln_sweep\",\n    (like(lower(action), \"%vpn%auth%\") OR like(lower(event), \"\
    %vpn%auth%\") OR like(lower(message), \"%vpn%auth%\")) AND (like(lower(action), \"%success%\") OR like(lower(status), \"%success%\") OR like(lower(result),\
    \ \"%success%\")), \"vpn_success\",\n    1=1, \"other\"\n)\n| where event_type IN(\"port_scan\", \"service_discovery\", \"vuln_scan\", \"\
    vuln_sweep\", \"vpn_success\")\n| eval src_ip=coalesce(src, src_ip, source_ip, srcip, SRC_IP)\n| streamstats time_window=7d earliest(_time)\
    \ as first_scan_time, latest(_time) as last_event_time by src_ip\n| eventstats values(event_type) as all_events by src_ip\n| where mvcount(all_events)\
    \ > 1 AND (like(mvjoin(all_events, \",\"), \"%port_scan%\") OR like(mvjoin(all_events, \",\"), \"%service_discovery%\") OR like(mvjoin(all_events,\
    \ \",\"), \"%vuln_scan%\") OR like(mvjoin(all_events, \",\"), \"%vuln_sweep%\")) AND like(mvjoin(all_events, \",\"), \"%vpn_success%\")\n\
    | eval time_diff=last_event_time - first_scan_time\n| where time_diff <= 604800\n| stats earliest(_time) as first_event, latest(_time) as\
    \ last_event, values(event_type) as event_types, values(user) as users, count by src_ip\n| where like(mvjoin(event_types, \",\"), \"%vpn_success%\"\
    ) AND (like(mvjoin(event_types, \",\"), \"%port_scan%\") OR like(mvjoin(event_types, \",\"), \"%service_discovery%\") OR like(mvjoin(event_types,\
    \ \",\"), \"%vuln_scan%\") OR like(mvjoin(event_types, \",\"), \"%vuln_sweep%\"))\n| table first_event, last_event, src_ip, event_types, users,\
    \ count\n"
  kql: "let timeWindow = 7d;\nlet portScanEvents = \n    CommonSecurityLog\n    | where TimeGenerated > ago(timeWindow)\n    | where DeviceVendor\
    \ has \"Palo Alto\" or DeviceVendor has \"Fortinet\" or DeviceVendor has \"Cisco\" or DeviceVendor has \"Check Point\" or isnotempty(DeviceVendor)\n\
    \    | where DeviceEventClassID in (\"port-scan\", \"portscan\", \"port_scan\") \n        or Activity has_any (\"Port Scan\", \"Service Discovery\"\
    , \"Vulnerability Scan\", \"Vulnerability Sweep\")\n        or Message has_any (\"port scan\", \"service discovery\", \"vulnerability scan\"\
    , \"vulnerability sweep\")\n    | where DeviceDirection =~ \"inbound\" or CommunicationDirection =~ \"inbound\"\n    | project ScanTime =\
    \ TimeGenerated, SourceIP, DestinationIP, DeviceVendor, Activity, Message, DeviceEventClassID;\nlet vpnAuth = \n    CommonSecurityLog\n  \
    \  | where TimeGenerated > ago(timeWindow)\n    | where (DeviceEventClassID has_any (\"vpn\", \"authentication\", \"logon\") or Activity has_any\
    \ (\"VPN\", \"Authentication\", \"Logon\"))\n    | where Message has_any (\"success\", \"successful\", \"authenticated\") or Activity has_any\
    \ (\"success\", \"successful\")\n    | project AuthTime = TimeGenerated, SourceIP, DestinationUserName = DestinationUserName, DeviceVendor,\
    \ Activity;\nportScanEvents\n| join kind=inner (vpnAuth) on SourceIP\n| where AuthTime > ScanTime and AuthTime <= ScanTime + timeWindow\n\
    | project ScanTime, AuthTime, SourceIP, DestinationIP, DestinationUserName, ScanActivity = Activity, ScanMessage = Message, VPNActivity =\
    \ Activity1, DeviceVendor\n"
  aql: "SELECT \n    t1.sourceip,\n    t1.eventtime AS scan_time,\n    t2.eventtime AS vpn_time,\n    t1.qidname AS scan_event,\n    t2.username,\n\
    \    LOGSOURCENAME(t2.logsourceid) AS vpn_source\nFROM events t1, events t2\nWHERE \n    (t1.qidname ILIKE '%Port Scan%Inbound%' \n     OR\
    \ t1.qidname ILIKE '%Service Discovery%Inbound%'\n     OR t1.qidname ILIKE '%Vulnerability Scan%Inbound%'\n     OR t1.qidname ILIKE '%Vulnerability\
    \ Sweep%Inbound%')\n    AND t2.qidname ILIKE '%VPN%Authentication%'\n    AND t2.qidname ILIKE '%Success%'\n    AND t1.sourceip = t2.sourceip\n\
    \    AND t2.eventtime > t1.eventtime\n    AND t2.eventtime <= t1.eventtime + 604800000\nSTART '2024-01-01 00:00:00' STOP '2024-12-31 23:59:59'\n"
  yara_l: |
    rule active_scanning_followed_by_vpn_login {
      meta:
        author = "TDL"
        description = "Detects active scanning (port scan, service discovery, vulnerability scan/sweep) followed by successful VPN authentication from same source IP within 7 days - T1595 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1595"
        severity = "High"

      events:
        $scan.metadata.event_type = "NETWORK_CONNECTION"
        (
          re.regex($scan.security_result.summary, `(?i)port.?scan.*inbound`) or
          re.regex($scan.security_result.summary, `(?i)service.?discovery.*inbound`) or
          re.regex($scan.security_result.summary, `(?i)vulnerability.?scan.*inbound`) or
          re.regex($scan.security_result.summary, `(?i)vulnerability.?sweep.*inbound`)
        )
        $scan.principal.ip = $source_ip

        $vpn.metadata.event_type = "USER_LOGIN"
        $vpn.security_result.action = "ALLOW"
        re.regex($vpn.metadata.product_name, `(?i)vpn`)
        $vpn.principal.ip = $source_ip
        $vpn.metadata.event_timestamp.seconds >= $scan.metadata.event_timestamp.seconds

      match:
        $source_ip over 7d

      outcome:
        $risk_score = 75
        $first_scan_time = min($scan.metadata.event_timestamp.seconds)
        $vpn_login_time = $vpn.metadata.event_timestamp.seconds
        $vpn_user = $vpn.target.user.userid

      condition:
        $scan and $vpn and $vpn.metadata.event_timestamp.seconds <= $scan.metadata.event_timestamp.seconds + 604800
    }
  esql: "FROM logs-firewall*, logs-vpn*, logs-network*\n| WHERE @timestamp > NOW() - 7 days\n| EVAL event_category = CASE(\n    event.action IN\
    \ (\"port_scan\", \"service_discovery\", \"vulnerability_scan\", \"vulnerability_sweep\") AND network.direction == \"inbound\", \"scan\",\n\
    \    event.action == \"vpn_authentication\" AND event.outcome == \"success\", \"vpn_success\",\n    null\n  )\n| WHERE event_category IS NOT\
    \ NULL\n| SORT source.ip, @timestamp\n| STATS \n    first_scan = MIN(@timestamp),\n    last_scan = MAX(@timestamp),\n    vpn_auth = MAX(CASE(event_category\
    \ == \"vpn_success\", @timestamp, null)),\n    scan_count = COUNT(*) BY source.ip, event_category\n| WHERE scan_count > 0\n| STATS \n    scan_time\
    \ = MIN(CASE(event_category == \"scan\", first_scan, null)),\n    vpn_time = MIN(CASE(event_category == \"vpn_success\", vpn_auth, null))\n\
    \    BY source.ip\n| WHERE scan_time IS NOT NULL AND vpn_time IS NOT NULL AND vpn_time > scan_time AND (vpn_time - scan_time) <= 604800000\n\
    | KEEP source.ip, scan_time, vpn_time\n"
  leql: |
    I need to clarify that LEQL doesn't natively support multi-stage correlation with time windows between different event types in a single query. InsightIDR handles this through Advanced Detection Rules (ADR) or multi-step alert logic in the UI, not pure LEQL.

    However, if you need to identify the second stage (successful VPN auth from IPs that previously triggered scanning events), you would typically run this as a filtered query after collecting the scanning source IPs:

    where(log_source_type="VPN" AND result="SUCCESS") groupby(source_address, user) calculate(count)

    For the complete correlation described, you need InsightIDR's Advanced Detection Rule builder with:
    - Trigger: Firewall/IDS events matching port scan/vuln scan/service discovery event types
    - Followed by: VPN authentication success matching source_address within 7 days

    Pure LEQL cannot express this temporal correlation in one query.
  crowdstrike: |
    (#type=firewall OR #type=vpn)
    | case {
        event_simpleName=/PortScan.*Inbound|ServiceDiscovery.*Inbound|VulnerabilityScan.*Inbound|VulnerabilitySweep.*Inbound/ | suspicious_event := "true" | timestamp_sus := @timestamp;
        event_simpleName=*VPNAuthentication* status=success | vpn_event := "true" | timestamp_vpn := @timestamp;
        * | drop();
      }
    | groupBy([SourceIP], function=([selectLast(suspicious_event, as=sus), selectLast(timestamp_sus, as=ts_sus), selectLast(vpn_event, as=vpn), selectLast(timestamp_vpn, as=ts_vpn)]))
    | sus = "true" AND vpn = "true"
    | time_diff := (ts_vpn - ts_sus) / 1000
    | time_diff >= 0 AND time_diff <= 604800
    | table([SourceIP, ts_sus, ts_vpn, time_diff])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter threat_category in ("port-scan", "recon", "vulnerability") and direction = "inbound"
    | alter scan_source_ip = source_ip, scan_time = _time
    | fields scan_source_ip, scan_time, threat_name
    | join type=inner (
        dataset = panw_ngfw_globalprotect_raw
        | filter action = "auth" and event_outcome = "success"
        | alter vpn_source_ip = source_ip, vpn_time = _time
        | fields vpn_source_ip, vpn_time, user
    ) scan_source_ip = vpn_source_ip
    | filter vpn_time >= scan_time and vpn_time <= add(scan_time, multiply(7, 86400000))
    | fields scan_time, vpn_time, scan_source_ip, threat_name, user
  lucene: |
    (event_type:("Port Scan Detected - Inbound" OR "Service Discovery - Inbound" OR "Vulnerability Scan - Inbound" OR "Vulnerability Sweep - Inbound") OR event.action:("port_scan_inbound" OR "service_discovery_inbound" OR "vulnerability_scan_inbound" OR "vulnerability_sweep_inbound") OR action:("port_scan_inbound" OR "service_discovery_inbound" OR "vulnerability_scan_inbound" OR "vulnerability_sweep_inbound")) OR (event_type:"VPN Authentication" AND event.outcome:success) OR (event.category:authentication AND event.outcome:success AND (service:vpn OR application:vpn OR vpn_auth:true))
  sumo: "_sourceCategory=*Firewall* OR _sourceCategory=*VPN*\n| json field=_raw \"event_type\" as event_type\n| json field=_raw \"action\" as\
    \ action\n| json field=_raw \"src_ip\" as src_ip\n| json field=_raw \"user\" as user\n| json field=_raw \"timestamp\" as event_time\n| where\
    \ (event_type matches \"*Port Scan*\" and action matches \"*Inbound*\") \n    or (event_type matches \"*Service Discovery*\" and action matches\
    \ \"*Inbound*\")\n    or (event_type matches \"*Vulnerability Scan*\" and action matches \"*Inbound*\")\n    or (event_type matches \"*Vulnerability\
    \ Sweep*\" and action matches \"*Inbound*\")\n    or (event_type matches \"*VPN*\" and action matches \"*Success*\")\n| sort by src_ip, _messageTime\n\
    | transaction src_ip maxspan 7d\n| where _count >= 2\n| where contains(join(_raw, \",\"), \"Port Scan\") or contains(join(_raw, \",\"), \"\
    Service Discovery\") or contains(join(_raw, \",\"), \"Vulnerability Scan\") or contains(join(_raw, \",\"), \"Vulnerability Sweep\")\n| where\
    \ contains(join(_raw, \",\"), \"VPN\") and contains(join(_raw, \",\"), \"Success\")\n| fields src_ip, user, _messageTime\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Port Scan Detected - Inbound, Service Discovery - Inbound, Vulnerability Scan - Inbound, OR Vulnerability Sweep - Inbound Event


  Followed By


  1 Successful VPN Authentication Event

  With the same Source IP from the previous event

  Within 7 Days'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

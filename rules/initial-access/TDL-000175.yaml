rule_id: TDL-AUTH-000175
v4_id: '000175'
name: Possible RDP Hijacking
description: Detects if the tscon server process is running as the local system account. If attackers are able to gain command execution with
  NT\System then they can hijack any currently logged in user's RDP session, without any knowledge about their credentials.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1563
technique_name: Remote Service Session Hijacking
platform:
- Windows
data_sources:
- Windows Operating System
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    index=windows (EventCode=592 OR EventCode=4688 OR process_name="tscon.exe" OR Image="*\\tscon.exe")
    (
      (CommandLine="*cmd.exe*" CommandLine="*tscon*")
      OR
      (CommandLine="*/k*" CommandLine="*tscon*")
      OR
      (CommandLine="*/c*" CommandLine="*tscon*")
      OR
      (CommandLine="*tscon*" CommandLine="*dest:rdp-*")
    )
    | table _time, ComputerName, User, Image, process_name, CommandLine, ParentImage, EventCode
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("tscon.exe", "cmd.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('tscon.exe', 'cmd.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000175 {\n  meta:\n    author = \"TDL\"\n    description = \"Possible RDP Hijacking\"\n    severity = \"MEDIUM\"\n\
    \    tactic = \"TA0001\"\n    technique = \"T1563\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name = /(tscon.exe|cmd.exe)/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("tscon.exe", "cmd.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [tscon.exe, cmd.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (tscon.exe, cmd.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("tscon.exe", "cmd.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(tscon.exe OR cmd.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("tscon.exe", "cmd.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nOR\n\tWhere the process is tscon.exe\n\t\n\tWhere Command\
  \ contains \"cmd.exe\"\n               Where Command contains \"tscon\"\n\tOR\n\t\tWhere the Command contains \"/k\"\n\t\t\n\t\tWhere the Command\
  \ contains \"/c\"\n\nOR \n\tWhere Command contains \"tscon\"\n        Where Command contains \"dest:rdp-\""
suppression:
  window: 12 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000178
v4_id: 000178
name: AWS Privilege Escalation via Group Policy
description: Detects an attacker escalating the privileges of an attacker attaching a policy to a group. If the attacker belongs to the group,
  the added permissions will grant escalated privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName IN ("AttachGroupPolicy", "PutGroupPolicy")

    (requestParameters.policyArn="Client HVT Policy" OR requestParameters.policyArn IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess",
    "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess",
    "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess",
    "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator",
    "arn:aws:iam::aws:policy/Billing"))

    | table _time, eventName, userIdentity.principalId, userIdentity.arn, requestParameters.groupName, requestParameters.policyArn, sourceIPAddress,
    userAgent, awsRegion

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName in ("AttachGroupPolicy", "PutGroupPolicy")
    | extend PolicyArn = tostring(parse_json(RequestParameters).policyArn)
    | where PolicyArn in ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing")
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, PolicyArn, UserAgent, AWSRegion
  aql: |
    SELECT eventtime, username, sourceip, "Event Name", "Policy ARN", "Group Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE ("Event Name" = 'AttachGroupPolicy' OR "Event Name" = 'PutGroupPolicy')
      AND ("Policy ARN" IN ('arn:aws:iam::aws:policy/AdministratorAccess', 'arn:aws:iam::aws:policy/AmazonSNSFullAccess', 'arn:aws:iam::aws:policy/AmazonEC2FullAccess', 'arn:aws:iam::aws:policy/AmazonS3FullAccess', 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess', 'arn:aws:iam::aws:policy/AWSCodeCommitPowerUser', 'arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser', 'arn:aws:iam::aws:policy/PowerUserAccess', 'arn:aws:iam::aws:policy/DatabaseAdministrator', 'arn:aws:iam::aws:policy/NetworkAdministrator', 'arn:aws:iam::aws:policy/SystemAdministrator', 'arn:aws:iam::aws:policy/Billing'))
    LAST 24 HOURS
  yara_l: |
    rule aws_high_privilege_group_policy_attachment {
      meta:
        author = "TDL"
        description = "Detects attachment of high-value or administrative policies to IAM groups"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.vendor_name = "AMAZON"
        (
          $e.metadata.product_event_type = "AttachGroupPolicy" or
          $e.metadata.product_event_type = "PutGroupPolicy"
        )
        (
          re.regex($e.target.resource.attribute.labels["policyArn"], `(?i)client.*hvt.*policy`) or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AdministratorAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonSNSFullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonEC2FullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonS3FullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/PowerUserAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/DatabaseAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/NetworkAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/SystemAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/Billing"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("AttachGroupPolicy", "PutGroupPolicy")
      AND (
        aws.cloudtrail.request_parameters LIKE "*Client HVT Policy*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AdministratorAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonSNSFullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonEC2FullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonS3FullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AWSCodeCommitPowerUser*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/PowerUserAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/DatabaseAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/NetworkAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/SystemAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/Billing*"
      )
    | KEEP @timestamp, event.action, user.name, aws.cloudtrail.user_identity.arn, aws.cloudtrail.request_parameters, cloud.account.id, source.ip
  leql: |
    where(source_json.eventName IN [AttachGroupPolicy, PutGroupPolicy] AND (source_json.requestParameters.policyArn IN ["arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing"]))
  crowdstrike: |
    #event_type=AwsApiCall (eventName=AttachGroupPolicy OR eventName=PutGroupPolicy)
    (requestParameters.policyArn=*ClientHVTPolicy* OR requestParameters.policyArn IN ["arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing"])
    | table([@timestamp, eventName, userIdentity.principalId, userIdentity.arn, requestParameters.groupName, requestParameters.policyArn, sourceIPAddress, awsRegion])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"AWS\" \n  and operation_name in (\"AttachGroupPolicy\", \"PutGroupPolicy\")\n\
    \  and (json_extract_scalar(raw_log, \"$.requestParameters.policyArn\") in (\n    \"arn:aws:iam::aws:policy/AdministratorAccess\",\n    \"\
    arn:aws:iam::aws:policy/AmazonSNSFullAccess\",\n    \"arn:aws:iam::aws:policy/AmazonEC2FullAccess\",\n    \"arn:aws:iam::aws:policy/AmazonS3FullAccess\"\
    ,\n    \"arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\",\n    \"arn:aws:iam::aws:policy/AWSCodeCommitPowerUser\",\n    \"arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser\"\
    ,\n    \"arn:aws:iam::aws:policy/PowerUserAccess\",\n    \"arn:aws:iam::aws:policy/DatabaseAdministrator\",\n    \"arn:aws:iam::aws:policy/NetworkAdministrator\"\
    ,\n    \"arn:aws:iam::aws:policy/SystemAdministrator\",\n    \"arn:aws:iam::aws:policy/Billing\"\n  ))\n| fields _time, cloud_provider, operation_name,\
    \ identity_name, resource, raw_log\n"
  lucene: |
    eventName:(AttachGroupPolicy OR PutGroupPolicy) AND (requestParameters.policyArn:("arn:aws:iam::aws:policy/AdministratorAccess" OR "arn:aws:iam::aws:policy/AmazonSNSFullAccess" OR "arn:aws:iam::aws:policy/AmazonEC2FullAccess" OR "arn:aws:iam::aws:policy/AmazonS3FullAccess" OR "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess" OR "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser" OR "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser" OR "arn:aws:iam::aws:policy/PowerUserAccess" OR "arn:aws:iam::aws:policy/DatabaseAdministrator" OR "arn:aws:iam::aws:policy/NetworkAdministrator" OR "arn:aws:iam::aws:policy/SystemAdministrator" OR "arn:aws:iam::aws:policy/Billing") OR _exists_:hvtPolicyArn)
  sumo: |
    _sourceCategory=*cloudtrail* (AttachGroupPolicy OR PutGroupPolicy)
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.policyArn" as policy_arn
    | json field=_raw "userIdentity.principalId" as principal_id
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "sourceIPAddress" as src_ip
    | json field=_raw "requestParameters.groupName" as group_name
    | where event_name in ("AttachGroupPolicy", "PutGroupPolicy")
    | where policy_arn in ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing")
    | fields _messageTime, event_name, policy_arn, group_name, user_arn, principal_id, src_ip
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 AWS APICall Event\nWhere the Event Name is in [AttachGroupPolicy, PutGroupPolicy]\nWhere Policy ARN is Client HVT Policy\nOR\
  \ \nWhere the Policy ARN is in [arn:aws:iam::aws:policy/AdministratorAccess\" or \"arn:aws:iam::aws:policy/AmazonSNSFullAccess\" or \"arn:aws:iam::aws:policy/AmazonEC2FullAccess\"\
  \ or \"arn:aws:iam::aws:policy/AmazonS3FullAccess\" or \"arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\" or \"arn:aws:iam::aws:policy/AWSCodeCommitPowerUser\"\
  \ or \"arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser\" or \"arn:aws:iam::aws:policy/PowerUserAccess\" or \"arn:aws:iam::aws:policy/DatabaseAdministrator\"\
  \ or \"arn:aws:iam::aws:policy/NetworkAdministrator\" or \"arn:aws:iam::aws:policy/SystemAdministrator\" or \"arn:aws:iam::aws:policy/Billing\"\
  ]"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

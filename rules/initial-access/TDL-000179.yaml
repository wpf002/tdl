rule_id: TDL-AUTH-000179
v4_id: 000179
name: AWS Privilege Escalation via Role Policy
description: Detects an attacker escalating the privileges of an AWS role. If the attacker has access to the role, the attacker will then have
  escalated privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=cloudtrail sourcetype=aws:cloudtrail eventName IN (AttachRolePolicy, PutRolePolicy)

    | eval policy_arn=coalesce(''requestParameters.policyArn'', ''requestParameters.policyDocument'')

    | where policy_arn="*ClientHVTPolicy*" OR policy_arn IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess",
    "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess",
    "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess",
    "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator",
    "arn:aws:iam::aws:policy/Billing")

    | table _time, userIdentity.principalId, userIdentity.arn, eventName, requestParameters.roleName, policy_arn, sourceIPAddress, awsRegion

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName in ("AttachRolePolicy", "PutRolePolicy")
    | extend PolicyArn = tostring(parse_json(RequestParameters).policyArn)
    | where PolicyArn in (
        "arn:aws:iam::aws:policy/AdministratorAccess",
        "arn:aws:iam::aws:policy/AmazonSNSFullAccess",
        "arn:aws:iam::aws:policy/AmazonEC2FullAccess",
        "arn:aws:iam::aws:policy/AmazonS3FullAccess",
        "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess",
        "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser",
        "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser",
        "arn:aws:iam::aws:policy/PowerUserAccess",
        "arn:aws:iam::aws:policy/DatabaseAdministrator",
        "arn:aws:iam::aws:policy/NetworkAdministrator",
        "arn:aws:iam::aws:policy/SystemAdministrator",
        "arn:aws:iam::aws:policy/Billing"
    )
    | extend RoleName = tostring(parse_json(RequestParameters).roleName)
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, RoleName, PolicyArn, RequestParameters, UserAgent, AWSRegion
  aql: |
    SELECT eventtime, username, sourceip, "Event Name", "Policy ARN", "Role Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE ("Event Name" = 'AttachRolePolicy' OR "Event Name" = 'PutRolePolicy')
      AND ("Policy ARN" IN ('arn:aws:iam::aws:policy/AdministratorAccess', 'arn:aws:iam::aws:policy/AmazonSNSFullAccess', 'arn:aws:iam::aws:policy/AmazonEC2FullAccess', 'arn:aws:iam::aws:policy/AmazonS3FullAccess', 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess', 'arn:aws:iam::aws:policy/AWSCodeCommitPowerUser', 'arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser', 'arn:aws:iam::aws:policy/PowerUserAccess', 'arn:aws:iam::aws:policy/DatabaseAdministrator', 'arn:aws:iam::aws:policy/NetworkAdministrator', 'arn:aws:iam::aws:policy/SystemAdministrator', 'arn:aws:iam::aws:policy/Billing'))
    LAST 24 HOURS
  yara_l: |
    rule aws_high_privilege_policy_attachment {
      meta:
        author = "TDL"
        description = "Detects attachment of high-value or administrative policies to AWS roles"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        (
          $e.target.resource.attribute.labels["eventName"] = "AttachRolePolicy" or
          $e.target.resource.attribute.labels["eventName"] = "PutRolePolicy"
        )
        (
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AdministratorAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonSNSFullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonEC2FullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonS3FullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/PowerUserAccess" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/DatabaseAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/NetworkAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/SystemAdministrator" or
          $e.target.resource.attribute.labels["policyArn"] = "arn:aws:iam::aws:policy/Billing"
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $role

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("AttachRolePolicy", "PutRolePolicy")
      AND (
        aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AdministratorAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonSNSFullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonEC2FullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonS3FullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AWSCodeCommitPowerUser*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/PowerUserAccess*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/DatabaseAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/NetworkAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/SystemAdministrator*"
        OR aws.cloudtrail.request_parameters LIKE "*arn:aws:iam::aws:policy/Billing*"
      )
    | KEEP @timestamp, event.action, user.name, aws.cloudtrail.user_identity.arn, cloud.account.id, aws.cloudtrail.request_parameters
  leql: |
    where(source_json.eventName IN [AttachRolePolicy, PutRolePolicy] AND (source_json.requestParameters.policyArn IN ["arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing"]))
  crowdstrike: |
    #event_type=AwsApiCall (eventName=AttachRolePolicy OR eventName=PutRolePolicy)
    (requestParameters.policyArn="arn:aws:iam::aws:policy/AdministratorAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AmazonSNSFullAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AmazonEC2FullAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AmazonS3FullAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AWSCodeCommitPowerUser" OR requestParameters.policyArn="arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser" OR requestParameters.policyArn="arn:aws:iam::aws:policy/PowerUserAccess" OR requestParameters.policyArn="arn:aws:iam::aws:policy/DatabaseAdministrator" OR requestParameters.policyArn="arn:aws:iam::aws:policy/NetworkAdministrator" OR requestParameters.policyArn="arn:aws:iam::aws:policy/SystemAdministrator" OR requestParameters.policyArn="arn:aws:iam::aws:policy/Billing")
    | table([@timestamp, eventName, userIdentity.principalId, userIdentity.arn, requestParameters.roleName, requestParameters.policyArn, sourceIPAddress, awsRegion])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and operation_name in ("AttachRolePolicy", "PutRolePolicy")
    | filter json_extract_scalar(resource, "$.policyArn") in ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing")
    | fields _time, operation_name, actor_user, resource, cloud_provider_account_id
  lucene: |
    eventName:(AttachRolePolicy OR PutRolePolicy) AND (requestParameters.policyArn:("arn:aws:iam::aws:policy/AdministratorAccess" OR "arn:aws:iam::aws:policy/AmazonSNSFullAccess" OR "arn:aws:iam::aws:policy/AmazonEC2FullAccess" OR "arn:aws:iam::aws:policy/AmazonS3FullAccess" OR "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess" OR "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser" OR "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser" OR "arn:aws:iam::aws:policy/PowerUserAccess" OR "arn:aws:iam::aws:policy/DatabaseAdministrator" OR "arn:aws:iam::aws:policy/NetworkAdministrator" OR "arn:aws:iam::aws:policy/SystemAdministrator" OR "arn:aws:iam::aws:policy/Billing"))
  sumo: |
    _sourceCategory=*cloudtrail* (AttachRolePolicy OR PutRolePolicy)
    | json field=_raw "eventName" as event_name
    | json field=_raw "requestParameters.policyArn" as policy_arn
    | json field=_raw "userIdentity.principalId" as principal_id
    | json field=_raw "userIdentity.arn" as user_arn
    | json field=_raw "requestParameters.roleName" as role_name
    | json field=_raw "sourceIPAddress" as source_ip
    | where event_name in ("AttachRolePolicy", "PutRolePolicy")
    | where policy_arn in ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing")
    | fields _messageTime, event_name, user_arn, principal_id, role_name, policy_arn, source_ip
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 AWS APICall Event\nWhere the Event Name is in [AttachRolePolicy, PutRolePolicy]\nWhere Policy ARN is Client HVT Policy\nOR \n\
  Where the Policy ARN is in [arn:aws:iam::aws:policy/AdministratorAccess\" or \"arn:aws:iam::aws:policy/AmazonSNSFullAccess\" or \"arn:aws:iam::aws:policy/AmazonEC2FullAccess\"\
  \ or \"arn:aws:iam::aws:policy/AmazonS3FullAccess\" or \"arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\" or \"arn:aws:iam::aws:policy/AWSCodeCommitPowerUser\"\
  \ or \"arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser\" or \"arn:aws:iam::aws:policy/PowerUserAccess\" or \"arn:aws:iam::aws:policy/DatabaseAdministrator\"\
  \ or \"arn:aws:iam::aws:policy/NetworkAdministrator\" or \"arn:aws:iam::aws:policy/SystemAdministrator\" or \"arn:aws:iam::aws:policy/Billing\"\
  ]"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000179
v4_id: 000179
name: AWS Privilege Escalation via Role Policy
description: Detects an attacker escalating the privileges of an AWS role. If the attacker has access to the role, the attacker will then have
  escalated privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=cloudtrail sourcetype=aws:cloudtrail eventName IN (AttachRolePolicy, PutRolePolicy)
    | eval policy_arn=coalesce('requestParameters.policyArn', 'requestParameters.policyDocument')
    | where policy_arn="*ClientHVTPolicy*" OR policy_arn IN ("arn:aws:iam::aws:policy/AdministratorAccess", "arn:aws:iam::aws:policy/AmazonSNSFullAccess", "arn:aws:iam::aws:policy/AmazonEC2FullAccess", "arn:aws:iam::aws:policy/AmazonS3FullAccess", "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess", "arn:aws:iam::aws:policy/AWSCodeCommitPowerUser", "arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser", "arn:aws:iam::aws:policy/PowerUserAccess", "arn:aws:iam::aws:policy/DatabaseAdministrator", "arn:aws:iam::aws:policy/NetworkAdministrator", "arn:aws:iam::aws:policy/SystemAdministrator", "arn:aws:iam::aws:policy/Billing")
    | table _time, userIdentity.principalId, userIdentity.arn, eventName, requestParameters.roleName, policy_arn, sourceIPAddress, awsRegion
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000179 {\n  meta:\n    author = \"TDL\"\n    description = \"AWS Privilege Escalation via Role Policy\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n   \
    \ $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: "1 AWS APICall Event\nWhere the Event Name is in [AttachRolePolicy, PutRolePolicy]\nWhere Policy ARN is Client HVT Policy\nOR \n\
  Where the Policy ARN is in [arn:aws:iam::aws:policy/AdministratorAccess\" or \"arn:aws:iam::aws:policy/AmazonSNSFullAccess\" or \"arn:aws:iam::aws:policy/AmazonEC2FullAccess\"\
  \ or \"arn:aws:iam::aws:policy/AmazonS3FullAccess\" or \"arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess\" or \"arn:aws:iam::aws:policy/AWSCodeCommitPowerUser\"\
  \ or \"arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser\" or \"arn:aws:iam::aws:policy/PowerUserAccess\" or \"arn:aws:iam::aws:policy/DatabaseAdministrator\"\
  \ or \"arn:aws:iam::aws:policy/NetworkAdministrator\" or \"arn:aws:iam::aws:policy/SystemAdministrator\" or \"arn:aws:iam::aws:policy/Billing\"\
  ]"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

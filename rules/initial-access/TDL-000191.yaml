rule_id: TDL-AUTH-000191
v4_id: 000191
name: AWS Actions without MFA
description: Detects when an API key or user logs in without multifactor authentication. Attackers may compromise API keys or user credentials
  and attempt to abuse them. Having multifactor is an additional security step to prevent this and any action without multifactor could indicate
  a compromise.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName=ConsoleLogin (userIdentity.sessionContext.attributes.mfaAuthenticated!=true OR additionalEventData.MFAUsed="No")

    | table _time, userIdentity.principalId, userIdentity.arn, sourceIPAddress, userAgent, eventName, userIdentity.sessionContext.attributes.mfaAuthenticated,
    additionalEventData.MFAUsed

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(1h)
    | where EventName == "ConsoleLogin"
    | extend mfaAuthenticated = tostring(parse_json(UserIdentitySessionContextAttributes).mfaAuthenticated)
    | extend MFAUsed = tostring(parse_json(AdditionalEventData).MFAUsed)
    | where mfaAuthenticated != "true" or MFAUsed == "No"
    | project TimeGenerated, EventName, UserIdentityPrincipalid, UserIdentityType, SourceIpAddress, UserAgent, mfaAuthenticated, MFAUsed, EventTypeName, RecipientAccountId
  aql: |
    SELECT username, sourceip, eventtime, qidname(qid), "userIdentity.sessionContext.attributes.mfaAuthenticated", "additionalEventData.MFAUsed"
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%cloudtrail%'
      AND qidname(qid) ILIKE '%ConsoleLogin%'
      AND ("userIdentity.sessionContext.attributes.mfaAuthenticated" != 'true' OR "additionalEventData.MFAUsed" = 'No')
    LAST 24 HOURS
  yara_l: |
    rule aws_console_login_without_mfa {
      meta:
        author = "Detection Engineering"
        description = "Detects AWS console login without MFA (T1078 - Valid Accounts)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS CloudTrail"
        $e.metadata.product_event_type = "ConsoleLogin"
        (
          $e.security_result.detection_fields["userIdentity.sessionContext.attributes.mfaAuthenticated"] != "true"
          or
          $e.security_result.detection_fields["additionalEventData.MFAUsed"] = "No"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-aws.cloudtrail*\n| WHERE event.action == \"ConsoleLogin\" \n  AND (\n    (aws.cloudtrail.user_identity.session_context.mfa_authenticated\
    \ != \"true\" AND aws.cloudtrail.user_identity.session_context.mfa_authenticated IS NOT NULL)\n    OR aws.cloudtrail.additional_eventdata.MFAUsed\
    \ == \"No\"\n  )\n| KEEP @timestamp, user.name, source.ip, source.geo.country_name, user_agent.original, aws.cloudtrail.user_identity.arn,\
    \ event.outcome\n"
  leql: |
    where(source_json.eventName="ConsoleLogin" AND source_json.additionalEventData.MFAUsed="No" AND source_json.userIdentity.sessionContext.attributes.mfaAuthenticated!="True")
  crowdstrike: |
    #event_type=AwsApiCall eventName=ConsoleLogin
    (userIdentity.sessionContext.attributes.mfaAuthenticated!=true OR additionalEventData.MFAUsed=No)
    | table([@timestamp, userIdentity.principalId, sourceIPAddress, userAgent, awsRegion, errorCode, errorMessage])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "ConsoleLogin"
    | filter (to_string(raw_log.userIdentity.sessionContext.attributes.mfaAuthenticated) != "true" or raw_log.additionalEventData.MFAUsed = "No")
    | fields _time, actor_user, raw_log.userIdentity.principalId, raw_log.sourceIPAddress, raw_log.userAgent, raw_log.additionalEventData.MFAUsed, raw_log.userIdentity.sessionContext.attributes.mfaAuthenticated
  lucene: |
    eventName:"ConsoleLogin" AND (userIdentity.sessionContext.attributes.mfaAuthenticated:(NOT "true") OR additionalEventData.MFAUsed:"No")
  sumo: "_sourceCategory=*cloudtrail* \"ConsoleLogin\"\n| json field=_raw \"eventName\" as event_name\n| json field=_raw \"additionalEventData.MFAUsed\"\
    \ as mfa_used\n| json field=_raw \"userIdentity.sessionContext.attributes.mfaAuthenticated\" as mfa_authenticated\n| where event_name = \"\
    ConsoleLogin\" \n| where (mfa_authenticated != \"true\" OR mfa_used = \"No\")\n| fields _messageTime, event_name, mfa_used, mfa_authenticated,\
    \ userIdentity, sourceIPAddress, userAgent\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 AWS CloudTrail Event\nOR\n\tWhere the Event Type {userIdentity.sessionContext.attributes.mfaAuthenticated} is NOT \"True\"\n\t\
  \n\tWhere the Event Name is \"ConsoleLogin\"\n\tWhere MFAUsed {additionalEventData.MFAUsed} is \"No\""
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000192
v4_id: 000192
name: AWS API Call from Terminated AD Account
description: Detects when a user account is disabled or terminated in Active Directory but still has an active AWS account. A user’s AWS account
  may have the same name but not be linked to the organization's Active Directory. If the user is terminated, they may have continued access to
  AWS and can cause harm to the organization’s AWS instances.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1098
technique_name: Account Manipulation
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=aws sourcetype=aws:cloudtrail eventType=AwsApiCall userIdentity.type=IAMUser \n| lookup terminated_ad_users.csv user_name AS userIdentity.userName\
    \ OUTPUT status \n| where status=\"terminated\" \n| table _time, userIdentity.userName, eventName, sourceIPAddress, userAgent, requestParameters,\
    \ responseElements, errorCode, errorMessage\n"
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(24h)
    | where EventTypeName == "AwsApiCall"
    | where UserIdentityType == "IAMUser"
    | where UserIdentityPrincipalid has "IAMUser"
    | join kind=inner (
        IdentityInfo
        | where TimeGenerated > ago(24h)
        | where AccountEnabled == false or DeletedDateTime != ""
        | distinct AccountUPN
    ) on $left.UserIdentityUserName == $right.AccountUPN
    | project TimeGenerated, EventName, UserIdentityUserName, UserIdentityPrincipalid, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, AWSRegion
  aql: |
    SELECT username, sourceip, eventtime, LOGSOURCENAME(logsourceid) AS log_source, "Event Name" AS event_name, "User Type" AS user_type
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%cloudtrail%'
      AND "Event Type" = 'AwsApiCall'
      AND "User Type" = 'IAMUser'
      AND username IN (REFERENCESET('terminated_ad_users'))
    LAST 24 HOURS
  yara_l: "rule terminated_user_aws_api_call {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects AWS API calls from terminated\
    \ IAM users - T1098 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1098\"\n    severity =\
    \ \"HIGH\"\n    \n  events:\n    $e.metadata.vendor_name = \"AMAZON\"\n    $e.metadata.product_name = \"AWS CloudTrail\"\n    $e.metadata.event_type\
    \ = \"NETWORK_HTTP\"\n    $e.metadata.product_event_type = \"AwsApiCall\"\n    $e.principal.user.user_display_name = $user\n    $e.target.resource.attribute.labels[\"\
    userIdentity.type\"] = \"IAMUser\"\n    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 85\n    \n  condition:\n    $e\
    \ and #user in %terminated_ad_users\n}\n"
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.action == "AwsApiCall"
      AND user.type == "IAMUser"
    | EVAL terminated_users = ["terminated_user1", "terminated_user2", "terminated_user3"]
    | WHERE user.name IN (terminated_users)
    | KEEP @timestamp, event.action, user.name, user.type, source.ip, aws.cloudtrail.user_identity.arn, event.outcome
  leql: |
    where(source_json.eventType=AwsApiCall AND source_json.userIdentity.type=IAMUser AND source_json.userIdentity.userName IN [TERMINATED_USER_LIST])
  crowdstrike: |
    #type=cloudtrail eventType=AwsApiCall userIdentity.type=IAMUser
    | lookup(file="terminated_ad_users.csv", field=userIdentity.userName, include=[terminated_user])
    | terminated_user=*
    | table([@timestamp, eventName, userIdentity.userName, sourceIPAddress, userAgent, requestParameters, responseElements, awsRegion, errorCode])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and action_cloud_audit_event_type = "AwsApiCall" and cloud_identity_type = "IAMUser"
    | alter aws_user = lowercase(cloud_identity_user_name)
    | filter aws_user in ("terminated_user1", "terminated_user2", "terminated_user3")
    | fields _time, cloud_provider, cloud_identity_user_name, action_cloud_audit_operation_name, cloud_resource_id, cloud_ip_address
  lucene: |
    eventType:AwsApiCall AND userIdentity.type:IAMUser AND userIdentity.principalId:("terminated_user_1" OR "terminated_user_2" OR "terminated_user_3")
  sumo: |
    _sourceCategory=*CloudTrail* eventType="AwsApiCall"
    | json field=_raw "userIdentity.type" as user_identity_type
    | json field=_raw "userIdentity.userName" as user_name
    | json field=_raw "eventType" as event_type
    | where event_type = "AwsApiCall" and user_identity_type = "IAMUser"
    | lookup terminated_users from shared/terminated_ad_users on user_name=username
    | where !isNull(terminated_users)
    | fields _messageTime, user_name, eventName, sourceIPAddress, userAgent, requestParameters
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Event

  Where the Event Type is AwsApiCall

  Where the User Identity is IAMUser

  Where the User is found on a Terminated Active Directory User Account List'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

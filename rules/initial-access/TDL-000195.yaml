rule_id: TDL-AUTH-000195
v4_id: 000195
name: Multiple MFA Push Sent Detected
description: Detects when a single user receives multiple notifications in a short time
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
- Duo
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=okta eventType="system.push.send_factor_verify_push"

    | bin _time span=5m

    | stats count by _time, src_ip, user

    | where count >= 6

    | table _time, src_ip, user, count

    '
  kql: |
    Okta_CL
    | where TimeGenerated > ago(5m)
    | where eventType_s == "system.push.send_factor_verify_push"
    | summarize PushCount = count() by bin(TimeGenerated, 5m), client_ipAddress_s, actor_alternateId_s
    | where PushCount >= 6
    | project TimeGenerated, SourceIP = client_ipAddress_s, UserPrincipalName = actor_alternateId_s, PushCount
  aql: |
    SELECT sourceip, username, COUNT(*) AS push_count
    FROM events
    WHERE "eventType" = 'system.push.send_factor_verify_push'
    GROUP BY sourceip, username
    HAVING push_count >= 6
    LAST 5 MINUTES
  yara_l: "rule okta_push_notification_spam {\n  meta:\n    author = \"TDL\"\n    description = \"Detects MFA push notification spam attacks -\
    \ T1078 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\n\
    \  \n  events:\n    $e.metadata.product_event_type = \"system.push.send_factor_verify_push\"\n    $e.principal.ip = $ip\n    $e.target.user.userid\
    \ = $user\n  \n  match:\n    $ip, $user over 5m\n  \n  outcome:\n    $risk_score = 75\n    $total_pushes = count_distinct($e.metadata.id)\n\
    \  \n  condition:\n    #e >= 6\n}\n"
  esql: |
    FROM logs-okta*
    | WHERE @timestamp > NOW() - 5 minutes AND event.action == "system.push.send_factor_verify_push"
    | STATS push_count = COUNT(*) BY source.ip, user.name, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE push_count >= 6
    | KEEP time_window, source.ip, user.name, push_count
  leql: |
    where(source_json.eventType="system.push.send_factor_verify_push") groupby(source_address, user) calculate(count)
  crowdstrike: |
    eventType=system.push.send_factor_verify_push
    | groupBy([client.ipAddress, actor.alternateId], function=count(as=pushCount), span=5m)
    | pushCount >= 6
    | table([@timestamp, client.ipAddress, actor.alternateId, pushCount])
  xql: |
    dataset = okta_raw
    | filter event_type = "system.push.send_factor_verify_push"
    | bin _time span=5m
    | comp count() as notification_count by _time, src_ip, actor_username
    | filter notification_count >= 6
    | fields _time, src_ip, actor_username, notification_count
  lucene: |
    eventType:system.push.send_factor_verify_push
  sumo: |
    _sourceCategory=*Okta* "system.push.send_factor_verify_push"
    | json field=_raw "eventType" as event_type
    | json field=_raw "actor.alternateId" as user
    | json field=_raw "client.ipAddress" as src_ip
    | where event_type = "system.push.send_factor_verify_push"
    | timeslice 5m
    | count as push_count by _timeslice, src_ip, user
    | where push_count >= 6
    | fields _timeslice, src_ip, user, push_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Okta Event

  Where the Event Type is [system.push.send_factor_verify_push]

  Where 6 notifications are sent

  From a single IP and to a single user

  Within 5 minutes'
suppression:
  window: 24 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000196
v4_id: 000196
name: MFA Push Sent Spraying
description: Detects when a single IP sends multiple push notifications to unique users. This could indicate that multiple credentials are compromised
  and an attacker is attempting to authenticate.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
- Duo
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=okta eventType="system.push.send_factor_verify_push"

    | bin _time span=5m

    | stats dc(user) as unique_users values(user) as users by _time, src_ip

    | where unique_users >= 5

    '
  kql: |
    Okta_CL
    | where TimeGenerated > ago(5m)
    | where eventType_s == "system.push.send_factor_verify_push"
    | summarize UniqueUsers = dcount(actor_alternateId_s), Users = make_set(actor_alternateId_s), EventCount = count() by bin(TimeGenerated, 5m), client_ipAddress_s
    | where UniqueUsers >= 5 and EventCount >= 5
    | project TimeGenerated, SourceIP = client_ipAddress_s, UniqueUserCount = UniqueUsers, UserList = Users, TotalEvents = EventCount
  aql: |
    SELECT sourceip, UNIQUECOUNT(username) AS unique_users, COUNT(*) AS push_events
    FROM events
    WHERE "Event Type" = 'system.push.send_factor_verify_push'
    GROUP BY sourceip
    HAVING unique_users >= 5 AND push_events >= 5
    LAST 5 MINUTES
  yara_l: |
    rule okta_push_mfa_spray {
      meta:
        author = "TDL"
        description = "Detects potential MFA push notification spray from single IP to multiple users"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_event_type = "system.push.send_factor_verify_push"
        $e.principal.ip = $source_ip
        $e.target.user.userid = $user

      match:
        $source_ip over 5m

      condition:
        #e >= 5 and #user >= 5
    }
  esql: |
    FROM logs-okta*
    | WHERE @timestamp > NOW() - 5 minutes AND event.action == "system.push.send_factor_verify_push"
    | STATS unique_users = COUNT_DISTINCT(user.name), event_count = COUNT(*) BY source.ip, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE unique_users >= 5 AND event_count >= 5
    | KEEP time_window, source.ip, unique_users, event_count
  leql: |
    where(source_json.eventType="system.push.send_factor_verify_push") groupby(source_address) calculate(unique:user)
  crowdstrike: |
    #type=okta eventType="system.push.send_factor_verify_push"
    | groupBy([client.ipAddress], function=[count(actor.alternateId, distinct=true, as=uniqueUsers), count(as=totalEvents)], limit=max)
    | uniqueUsers >= 5 AND totalEvents >= 5
    | table([client.ipAddress, uniqueUsers, totalEvents])
  xql: |
    dataset = okta_logs
    | filter event_type = "system.push.send_factor_verify_push"
    | bin _time span=5m
    | comp count() as push_count, count_distinct(actor_alternate_id) as unique_users by _time, client_ip_address
    | filter push_count >= 5 and unique_users >= 5
    | fields _time, client_ip_address, push_count, unique_users
  lucene: |
    eventType:"system.push.send_factor_verify_push"
  sumo: |
    _sourceCategory=*Okta* "system.push.send_factor_verify_push"
    | json field=_raw "eventType" as event_type
    | json field=_raw "client.ipAddress" as src_ip
    | json field=_raw "actor.alternateId" as username
    | where event_type = "system.push.send_factor_verify_push"
    | timeslice 5m
    | count_distinct(username) as unique_users, count as total_events by _timeslice, src_ip
    | where unique_users >= 5 and total_events >= 5
    | fields _timeslice, src_ip, unique_users, total_events
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "5 Okta Event\nWhere the Event Type is \"system.push.send_factor_verify_push\"\nFrom the same source IP \nWith at least 5 unique\
  \ source usernames\nWithin 5 minutes"
suppression:
  window: 24 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

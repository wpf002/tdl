rule_id: TDL-AUTH-000199
v4_id: 000199
name: Okta User Attempted to Access Unauthorized Application
description: Detects multiple failures by a user attempting to access an application.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=okta sourcetype=OktaIM2:log eventType="app.generic.unauth_app_access_attempt"

    | bin _time span=5m

    | stats count by _time, client.ipAddress, actor.alternateId

    | where count >= 5

    | rename client.ipAddress as src_ip, actor.alternateId as user

    | table _time, src_ip, user, count

    '
  kql: |
    Okta_CL
    | where TimeGenerated > ago(5m)
    | where eventType_s == "app.generic.unauth_app_access_attempt"
    | extend SourceIP = tostring(parse_json(client_s).ipAddress)
    | extend SourceUser = tostring(parse_json(actor_s).alternateId)
    | summarize FailureCount = count() by bin(TimeGenerated, 5m), SourceIP, SourceUser
    | where FailureCount >= 5
    | project TimeGenerated, SourceIP, SourceUser, FailureCount
  aql: |
    SELECT sourceip, username, COUNT(*) AS failures
    FROM events
    WHERE "EventType" = 'app.generic.unauth_app_access_attempt'
    GROUP BY sourceip, username
    HAVING failures >= 5
    LAST 5 MINUTES
  yara_l: |
    rule okta_unauth_app_access_burst {
      meta:
        author = "TDL"
        description = "Detects 5+ unauthorized app access attempts from same IP and user within 5 minutes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Okta"
        $e.metadata.product_event_type = "app.generic.unauth_app_access_attempt"
        $e.principal.ip = $source_ip
        $e.principal.user.userid = $user

      match:
        $source_ip, $user over 5m

      condition:
        #e >= 5
    }
  esql: |
    FROM logs-okta*
    | WHERE @timestamp > NOW() - 5 minutes AND event.action == "app.generic.unauth_app_access_attempt"
    | STATS failure_count = COUNT(*) BY source.ip, user.name, time_window = BUCKET(@timestamp, 5 minutes)
    | WHERE failure_count >= 5
    | KEEP time_window, source.ip, user.name, failure_count
  leql: |
    where(source_json.eventType="app.generic.unauth_app_access_attempt") groupby(source_address, user) calculate(count)
  crowdstrike: |
    #type=okta eventType="app.generic.unauth_app_access_attempt"
    | groupBy([client.ipAddress, actor.alternateId], function=count(as=failures))
    | failures >= 5
  xql: |
    dataset = okta_raw_data
    | filter outcome_result = "FAILURE" and event_type = "app.generic.unauth_app_access_attempt"
    | bin _time span=5m
    | comp count() as failure_count by _time, actor_alternate_id, client_ip_address
    | filter failure_count >= 5
    | fields _time, actor_alternate_id, client_ip_address, failure_count
  lucene: |
    eventType:"app.generic.unauth_app_access_attempt"
  sumo: |
    _sourceCategory=*Okta*
    | json field=_raw "eventType" as event_type
    | json field=_raw "actor.alternateId" as user
    | json field=_raw "client.ipAddress" as src_ip
    | where event_type = "app.generic.unauth_app_access_attempt"
    | timeslice 5m
    | count as failures by _timeslice, src_ip, user
    | where failures >= 5
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 Okta Event

  Where the Event Type is "app.generic.unauth_app_access_attempt"

  From the same source IP and same source User

  With at least 5 failures

  Within 5 minutes'
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

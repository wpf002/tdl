rule_id: TDL-AUTH-000221
v4_id: '000221'
name: Mass Click Blocked
description: Detects when multiple users have "clicked" or interacted with an e-mail containing the same url that has been classified as malicious
  and the email security gateway has blocked the attempts. Attackers will typically send phishing e-mails to users in an attempt to gain access
  to the organizations network. This could be an indication of a phishing campaign.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- Email Security
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=email_security action=blocked event_type=\"url_click\" \n| bin _time span=30m \n| stats dc(src_user) as unique_users by _time, url\
    \ \n| where unique_users >= 10\n"
  kql: |
    EmailUrlInfo
    | where TimeGenerated > ago(30m)
    | where UrlClickAction == "Blocked" or UrlClickStatus == "Blocked"
    | summarize UniqueUsers = dcount(NetworkMessageId), UserList = make_set(RecipientEmailAddress) by Url, bin(TimeGenerated, 30m)
    | where UniqueUsers >= 10
    | project TimeGenerated, Url, UniqueUsers, UserList
  aql: "SELECT URL, COUNT(*) AS total_clicks, UNIQUECOUNT(username) AS unique_users\nFROM events\nWHERE CATEGORYNAME(category) ILIKE '%email%'\
    \ \n  AND (qidname(qid) ILIKE '%click%blocked%' OR qidname(qid) ILIKE '%url%blocked%')\nGROUP BY URL\nHAVING total_clicks >= 10 AND unique_users\
    \ >= 10\nLAST 30 MINUTES\n"
  yara_l: "rule suspicious_phishing_url_multiple_clicks {\n  meta:\n    author = \"TDL\"\n    description = \"Detects 10+ blocked URL clicks from\
    \ unique users on same URL within 30 minutes - potential phishing\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1566\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_HTTP\"\n    $e.security_result.action = \"\
    BLOCK\"\n    $e.target.url = $url\n    $e.principal.user.userid = $user\n    \n  match:\n    $url over 30m\n    \n  outcome:\n    $risk_score\
    \ = max(75)\n    $unique_users = count_distinct($user)\n    $blocked_url = array_distinct($url)\n    \n  condition:\n    #user >= 10\n}\n"
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 30 minutes \n  AND event.action == \"UrlClickBlocked\"\n| STATS unique_users = COUNT_DISTINCT(user.name)\
    \ BY url.full\n| WHERE unique_users >= 10\n"
  leql: |
    where(action="blocked" AND event_type="url_click") groupby(url) calculate(unique:source_user)
  crowdstrike: |
    #type=email_security event_simpleName=UrlClickBlocked
    | timeChart(span=30m, function=[count(SourceUserName, distinct=true, as=uniqueUsers), selectLast([URL])], limit=max)
    | uniqueUsers >= 10
    | table([@timestamp, URL, uniqueUsers])
  xql: |
    dataset = email_url_clicks
    | filter action = "blocked"
    | bin _time span=30m
    | comp count_distinct(source_user) as unique_users by _time, url
    | filter unique_users >= 10
  lucene: |
    event.type:"url_click_blocked" AND url:*
  sumo: |
    _sourceCategory=*Email* OR _sourceCategory=*Security* "URL Click Blocked"
    | parse regex "(?i)url[:\s=]+(?<url>[^\s,]+)" nodrop
    | parse regex "(?i)user[name]*[:\s=]+(?<username>[^\s,]+)" nodrop
    | json field=_raw "url" as url_json nodrop
    | json field=_raw "username" as username_json nodrop
    | json field=_raw "user" as user_json nodrop
    | if (isNull(url), url_json, url) as url
    | if (isNull(username), if(isNull(username_json), user_json, username_json), username) as source_username
    | where !isNull(url) and !isNull(source_username)
    | timeslice 30m
    | count_distinct(source_username) as unique_users, count as total_events by _timeslice, url
    | where unique_users >= 10
    | fields _timeslice, url, unique_users, total_events
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 URL Click Blocked Events

  With the same URL

  With unique Source Usernames

  Within 30 minutes'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

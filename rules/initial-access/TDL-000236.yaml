rule_id: TDL-AUTH-000236
v4_id: '000236'
name: Webserver Command Injection Attempt
description: Detects a host attempting to call the command line on a web server to execute remote commands and if the web server is vulnerable
  to injection, an attacker can pipe commands into CMD that will be processed by the server.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1202
technique_name: Indirect Command Execution
platform:
- Windows
data_sources:
- Webserver
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=webserver status>=200 status<400 (url="*cmd.exe*" OR url="*xp_cmdshell*" OR url="*=whoami*" OR url="*=net%20user*" OR url="*=net+user*"
    OR url="*=net%2buser*" OR url="*=cmd%20/c%*" OR url="*=cmd+/c+*" OR url="*=cmd%2b/c%*" OR url="*=cmd%20/r%*" OR url="*=cmd+/r+*" OR url="*=cmd%2b/r%*"
    OR url="*=cmd%20/k%*" OR url="*=cmd+/k+*" OR url="*=cmd%2b/k%*" OR url="*=powershell%*" OR url="*=powershell+*" OR url="*=tasklist%*" OR url="*=tasklist+*"
    OR url="*=wmic%*" OR url="*=wmic+*" OR url="*=ssh%*" OR url="*=ssh+*" OR url="*=python%*" OR url="*=python+*" OR url="*=python3%*" OR url="*=python3+*"
    OR url="*=ipconfig*" OR url="*=wget%*" OR url="*=wget+*" OR url="*=curl%*" OR url="*=curl+*" OR url="*=certutil*" OR url="*=copy%20%5c%5c*"
    OR url="*=dsquery%*" OR url="*=dsquery+*" OR url="*=nltest%*" OR url="*=nltest+*" OR url="*&cmd=*")

    | table _time, host, clientip, url, status, method, useragent

    '
  kql: |
    W3CIISLog
    | where TimeGenerated > ago(1h)
    | where scStatus >= 200 and scStatus < 400
    | where csUriQuery has_any ("cmd.exe", "xp_cmdshell", "=whoami", "=net%20user", "=net+user", "=net%2buser", "=cmd%20/c%", "=cmd+/c+", "=cmd%2b/c%", "=cmd%20/r%", "=cmd+/r+", "=cmd%2b/r%", "=cmd%20/k%", "=cmd+/k+", "=cmd%2b/k%", "=powershell%", "=powershell+", "=tasklist%", "=tasklist+", "=wmic%", "=wmic+", "=ssh%", "=ssh+", "=python%", "=python+", "=python3%", "=python3+", "=ipconfig", "=wget%", "=wget+", "=curl%", "=curl+", "=certutil", "=copy%20%5c%5c", "=dsquery%", "=dsquery+", "=nltest%", "=nltest+", "&cmd=")
    | project TimeGenerated, Computer, sSiteName, csMethod, csUriStem, csUriQuery, scStatus, cIP, csUserAgent
  aql: |
    SELECT sourceip, destinationip, destinationport, username, "URL", "HTTP Response Code", eventtime, LOGSOURCENAME(logsourceid) AS webserver
    FROM events
    WHERE (CAST("HTTP Response Code" AS INT) >= 200 AND CAST("HTTP Response Code" AS INT) < 400)
      AND (
        "URL" ILIKE '%cmd.exe%'
        OR "URL" ILIKE '%xp_cmdshell%'
        OR "URL" ILIKE '%=whoami%'
        OR "URL" ILIKE '%=net%20user%'
        OR "URL" ILIKE '%=net+user%'
        OR "URL" ILIKE '%=net%2buser%'
        OR "URL" ILIKE '%=cmd%20/c%%'
        OR "URL" ILIKE '%=cmd+/c+%'
        OR "URL" ILIKE '%=cmd%2b/c%%'
        OR "URL" ILIKE '%=cmd%20/r%%'
        OR "URL" ILIKE '%=cmd+/r+%'
        OR "URL" ILIKE '%=cmd%2b/r%%'
        OR "URL" ILIKE '%=cmd%20/k%%'
        OR "URL" ILIKE '%=cmd+/k+%'
        OR "URL" ILIKE '%=cmd%2b/k%%'
        OR "URL" ILIKE '%=powershell%%'
        OR "URL" ILIKE '%=powershell+%'
        OR "URL" ILIKE '%=tasklist%%'
        OR "URL" ILIKE '%=tasklist+%'
        OR "URL" ILIKE '%=wmic%%'
        OR "URL" ILIKE '%=wmic+%'
        OR "URL" ILIKE '%=ssh%%'
        OR "URL" ILIKE '%=ssh+%'
        OR "URL" ILIKE '%=python%%'
        OR "URL" ILIKE '%=python+%'
        OR "URL" ILIKE '%=python3%%'
        OR "URL" ILIKE '%=python3+%'
        OR "URL" ILIKE '%=ipconfig%'
        OR "URL" ILIKE '%=wget%%'
        OR "URL" ILIKE '%=wget+%'
        OR "URL" ILIKE '%=curl%%'
        OR "URL" ILIKE '%=curl+%'
        OR "URL" ILIKE '%=certutil%'
        OR "URL" ILIKE '%=copy%20%5c%5c%'
        OR "URL" ILIKE '%=dsquery%%'
        OR "URL" ILIKE '%=dsquery+%'
        OR "URL" ILIKE '%=nltest%%'
        OR "URL" ILIKE '%=nltest+%'
        OR "URL" ILIKE '%&cmd=%'

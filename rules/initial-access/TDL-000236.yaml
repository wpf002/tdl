    \    OR url matches \"*=ssh%*\" \n    OR url matches \"*=ssh+*\" \n    OR url matches \"*=python%*\" \n    OR url matches \"*=python+*\" \n\
    \    OR url matches \"*=python3%*\" \n    OR url matches \"*=python3+*\" \n    OR url matches \"*=ipconfig*\" \n    OR url matches \"*=wget%*\"\
    \ \n    OR url matches \"*=wget+*\" \n    OR url matches \"*=curl%*\" \n    OR url matches \"*=curl+*\" \n    OR url matches \"*=certutil*\"\

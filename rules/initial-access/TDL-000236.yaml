  lucene: |
    (http.response.status_code:[200 TO 399]) AND (url:(*cmd.exe* OR *xp_cmdshell* OR *=whoami* OR *=net%20user* OR *=net+user* OR *=net%2buser* OR *=cmd%20/c%* OR *=cmd+/c+* OR *=cmd%2b/c%* OR *=cmd%20/r%* OR *=cmd+/r+* OR *=cmd%2b/r%* OR *=cmd%20/k%* OR *=cmd+/k+* OR *=cmd%2b/k%* OR *=powershell%* OR *=powershell+* OR *=tasklist%* OR *=tasklist+* OR *=wmic%* OR *=wmic+* OR *=ssh%* OR *=ssh+* OR *=python%* OR *=python+* OR *=python3%* OR *=python3+* OR *=ipconfig* OR *=wget%* OR *=wget+* OR *=curl%* OR *=curl+* OR *=certutil* OR *=copy%20%5c%5c* OR *=dsquery%* OR *=dsquery+* OR *=nltest%* OR *=nltest+* OR *\&cmd\=*))
  sumo: "_sourceCategory=*Webserver* OR _sourceCategory=*Web* OR _sourceCategory=*IIS* OR _sourceCategory=*Apache* OR _sourceCategory=*nginx*\n\

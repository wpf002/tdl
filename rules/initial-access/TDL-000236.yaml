  yara_l: |
    rule webserver_command_injection_t1202 {
      meta:
        author = "TDL"
        description = "Detects potential command injection attempts via webserver requests (T1202 - Indirect Command Execution)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1202"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.target.port = 80 or $e.target.port = 443 or $e.target.port = 8080 or $e.target.port = 8443
        $e.network.http.response_code >= 200
        $e.network.http.response_code < 400
        (
          re.regex($e.target.url, `cmd\.exe`) or
          re.regex($e.target.url, `xp_cmdshell`) or
          re.regex($e.target.url, `=whoami`) or
          re.regex($e.target.url, `=net%20user`) or
          re.regex($e.target.url, `=net\+user`) or
          re.regex($e.target.url, `=net%2buser`) or
          re.regex($e.target.url, `=cmd%20/c%`) or
          re.regex($e.target.url, `=cmd\+/c\+`) or
          re.regex($e.target.url, `=cmd%2b/c%`) or
          re.regex($e.target.url, `=cmd%20/r%`) or
          re.regex($e.target.url, `=cmd\+/r\+`) or
          re.regex($e.target.url, `=cmd%2b/r%`) or
          re.regex($e.target.url, `=cmd%20/k%`) or
          re.regex($e.target.url, `=cmd\+/k\+`) or
          re.regex($e.target.url, `=cmd%2b/k%`) or
          re.regex($e.target.url, `=powershell%`) or
          re.regex($e.target.url, `=powershell\+`) or
          re.regex($e.target.url, `=tasklist%`) or
          re.regex($e.target.url, `=tasklist\+`) or
          re.regex($e.target.url, `=wmic%`) or
          re.regex($e.target.url, `=wmic\+`) or
          re.regex($e.target.url, `=ssh%`) or
          re.regex($e.target.url, `=ssh\+`) or
          re.regex($e.target.url, `=python%`) or
          re.regex($e.target.url, `=python\+`) or
          re.regex($e.target.url, `=python3%`) or
          re.regex($e.target.url, `=python3\+`) or
          re.regex($e.target.url, `=ipconfig`) or
          re.regex($e.target.url, `=wget%`) or
          re.regex($e.target.url, `=wget\+`) or
          re.regex($e.target.url, `=curl%`) or
          re.regex($e.target.url, `=curl\+`) or
          re.regex($e.target.url, `=certutil`) or
          re.regex($e.target.url, `=copy%20%5c%5c`) or
          re.regex($e.target.url, `=dsquery%`) or
          re.regex($e.target.url, `=dsquery\+`) or
          re.regex($e.target.url, `=nltest%`) or
          re.regex($e.target.url, `=nltest\+`) or
          re.regex($e.target.url, `&cmd=`)
        )
        $e.target.ip = $target_ip
        $e.principal.ip = $source_ip

      match:
        $target_ip, $source_ip over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }

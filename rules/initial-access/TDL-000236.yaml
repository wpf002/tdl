    \ \n    OR url.original LIKE \"*xp_cmdshell*\" \n    OR url.original LIKE \"*=whoami*\" \n    OR url.original LIKE \"*=net%20user*\" \n  \
    \  OR url.original LIKE \"*=net+user*\" \n    OR url.original LIKE \"*=net%2buser*\" \n    OR url.original LIKE \"*=cmd%20/c%*\" \n    OR\
    \ url.original LIKE \"*=cmd+/c+*\" \n    OR url.original LIKE \"*=cmd%2b/c%*\" \n    OR url.original LIKE \"*=cmd%20/r%*\" \n    OR url.original\
    \ LIKE \"*=cmd+/r+*\" \n    OR url.original LIKE \"*=cmd%2b/r%*\" \n    OR url.original LIKE \"*=cmd%20/k%*\" \n    OR url.original LIKE \"\
    *=cmd+/k+*\" \n    OR url.original LIKE \"*=cmd%2b/k%*\" \n    OR url.original LIKE \"*=powershell%*\" \n    OR url.original LIKE \"*=powershell+*\"\
    \ \n    OR url.original LIKE \"*=tasklist%*\" \n    OR url.original LIKE \"*=tasklist+*\" \n    OR url.original LIKE \"*=wmic%*\" \n    OR\
    \ url.original LIKE \"*=wmic+*\" \n    OR url.original LIKE \"*=ssh%*\" \n    OR url.original LIKE \"*=ssh+*\" \n    OR url.original LIKE\
    \ \"*=python%*\" \n    OR url.original LIKE \"*=python+*\" \n    OR url.original LIKE \"*=python3%*\" \n    OR url.original LIKE \"*=python3+*\"\
    \ \n    OR url.original LIKE \"*=ipconfig*\" \n    OR url.original LIKE \"*=wget%*\" \n    OR url.original LIKE \"*=wget+*\" \n    OR url.original\
    \ LIKE \"*=curl%*\" \n    OR url.original LIKE \"*=curl+*\" \n    OR url.original LIKE \"*=certutil*\" \n    OR url.original LIKE \"*=copy%20%5c%5c*\"\
    \ \n    OR url.original LIKE \"*=dsquery%*\" \n    OR url.original LIKE \"*=dsquery+*\" \n    OR url.original LIKE \"*=nltest%*\" \n    OR\
    \ url.original LIKE \"*=nltest+*\" \n    OR url.original LIKE \"*&cmd=*\"\n  )\n| KEEP @timestamp, host.name, source.ip, url.original, http.request.method,\
    \ http.response.status_code, user_agent.original\n"
  leql: |
    where(http_response_code>=200 AND http_response_code<400 AND (url ICONTAINS "cmd.exe" OR url ICONTAINS "xp_cmdshell" OR url ICONTAINS "=whoami" OR url ICONTAINS "=net%20user" OR url ICONTAINS "=net+user" OR url ICONTAINS "=net%2buser" OR url ICONTAINS "=cmd%20/c%" OR url ICONTAINS "=cmd+/c+" OR url ICONTAINS "=cmd%2b/c%" OR url ICONTAINS "=cmd%20/r%" OR url ICONTAINS "=cmd+/r+" OR url ICONTAINS "=cmd%2b/r%" OR url ICONTAINS "=cmd%20/k%" OR url ICONTAINS "=cmd+/k+" OR url ICONTAINS "=cmd%2b/k%" OR url ICONTAINS "=powershell%" OR url ICONTAINS "=powershell+" OR url ICONTAINS "=tasklist%" OR url ICONTAINS "=tasklist+" OR url ICONTAINS "=wmic%" OR url ICONTAINS "=wmic+" OR url ICONTAINS "=ssh%" OR url ICONTAINS "=ssh+" OR url ICONTAINS "=python%" OR url ICONTAINS "=python+" OR url ICONTAINS "=python3%" OR url ICONTAINS "=python3+" OR url ICONTAINS "=ipconfig" OR url ICONTAINS "=wget%" OR url ICONTAINS "=wget+" OR url ICONTAINS "=curl%" OR url ICONTAINS "=curl+" OR url ICONTAINS "=certutil" OR url ICONTAINS "=copy%20%5c%5c" OR url ICONTAINS "=dsquery%" OR url ICONTAINS "=dsquery+" OR url ICONTAINS "=nltest%" OR url ICONTAINS "=nltest+" OR url ICONTAINS "&cmd="))
  crowdstrike: "#type=webserver http_status>=200 http_status<400 \n(url=*cmd.exe* OR url=*xp_cmdshell* OR url=*=whoami* OR url=*=net%20user* OR\
    \ url=*=net+user* OR url=*=net%2buser* OR url=*=cmd%20/c%* OR url=*=cmd+/c+* OR url=*=cmd%2b/c%* OR url=*=cmd%20/r%* OR url=*=cmd+/r+* OR\
    \ url=*=cmd%2b/r%* OR url=*=cmd%20/k%* OR url=*=cmd+/k+* OR url=*=cmd%2b/k%* OR url=*=powershell%* OR url=*=powershell+* OR url=*=tasklist%*\

rule_id: TDL-AUTH-000250
v4_id: '000250'
name: Remote Login from Unauthorized Country
description: Detects a user successfully logging in from an unauthorized country.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=azure_ad OR index=o365 OR index=vpn (action=\"success\" OR action=\"Succeeded\" OR action=\"UserLoginSucceeded\" OR EventName=\"\
    UserLoggedIn\" OR Activity=\"UserLoggedIn\" OR Logon_Type IN (3,8,10)) (src_ip!=\"10.*\" AND src_ip!=\"172.16.*\" AND src_ip!=\"172.17.*\"\
    \ AND src_ip!=\"172.18.*\" AND src_ip!=\"172.19.*\" AND src_ip!=\"172.20.*\" AND src_ip!=\"172.21.*\" AND src_ip!=\"172.22.*\" AND src_ip!=\"\
    172.23.*\" AND src_ip!=\"172.24.*\" AND src_ip!=\"172.25.*\" AND src_ip!=\"172.26.*\" AND src_ip!=\"172.27.*\" AND src_ip!=\"172.28.*\" AND\
    \ src_ip!=\"172.29.*\" AND src_ip!=\"172.30.*\" AND src_ip!=\"172.31.*\" AND src_ip!=\"192.168.*\") \n| iplocation src_ip \n| search NOT [|\
    \ inputlookup authorized_countries.csv | fields Country] \n| stats count values(src_ip) as source_ips values(Country) as countries by user,\
    \ _time \n| where count >= 1 \n| table _time, user, source_ips, countries\n"
  kql: "SigninLogs\n| where TimeGenerated > ago(1h)\n| where ResultType == 0\n| where NetworkLocationDetails has \"trustedNamedLocation\" == false\
    \ or isempty(NetworkLocationDetails)\n| where isnotempty(LocationDetails.countryOrRegion)\n| extend SourceCountry = tostring(LocationDetails.countryOrRegion)\n\
    | extend SourceIP = tostring(IPAddress)\n| where SourceCountry !in (\"US\", \"CA\", \"GB\", \"AU\")\n| summarize LoginCount = count(), FirstLoginTime\
    \ = min(TimeGenerated), LastLoginTime = max(TimeGenerated), \n    Applications = make_set(AppDisplayName), Cities = make_set(LocationDetails.city)\
    \ \n    by UserPrincipalName, SourceIP, SourceCountry\n| where LoginCount >= 1\n| project FirstLoginTime, LastLoginTime, UserPrincipalName,\
    \ SourceIP, SourceCountry, LoginCount, Applications, Cities\n"
  aql: "SELECT username, sourceip, GEOCOUNTRYCODE(sourceip) AS country, destinationip, QIDNAME(qid) AS event_name, eventtime\nFROM events\nWHERE\
    \ (qid IN (SELECT qid FROM qidmap WHERE logsourcetypename ILIKE '%Azure%' OR logsourcetypename ILIKE '%Office 365%' OR logsourcetypename ILIKE\
    \ '%VPN%')\n   OR logsourcetypename ILIKE '%Azure%' \n   OR logsourcetypename ILIKE '%Office 365%'\n   OR logsourcetypename ILIKE '%VPN%')\n\
    \  AND (CATEGORYNAME(category) ILIKE '%authentication%' OR CATEGORYNAME(category) ILIKE '%logon%' OR category = 6003)\n  AND username IS NOT\
    \ NULL\n  AND sourceip NOT IN (SELECT sourceip FROM networks WHERE netname = 'Internal')\n  AND GEOCOUNTRYCODE(sourceip) NOT IN ('US', 'CA',\
    \ 'GB')\nLAST 24 HOURS\n"
  yara_l: "rule remote_login_unauthorized_country {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects successful remote\
    \ login from unauthorized country - MITRE T1078 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $login.metadata.event_type = \"USER_LOGIN\"\n    $login.security_result.action\
    \ = \"ALLOW\"\n    (\n      $login.metadata.product_name = \"Azure Active Directory\" or\n      $login.metadata.product_name = \"Office 365\"\
    \ or\n      $login.metadata.vendor_name = \"Microsoft\"\n    )\n    $login.principal.location.country_or_region != \"\"\n    $login.principal.location.country_or_region\
    \ != \"United States\"\n    $login.principal.location.country_or_region != \"Canada\"\n    $login.principal.location.country_or_region !=\
    \ \"United Kingdom\"\n    $login.target.user.userid = $user\n    $login.principal.ip = $source_ip\n    $login.principal.location.country_or_region\
    \ = $country\n    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 75\n    $source_ip\n    $country\n    $user\n    \n \
    \ condition:\n    $login\n}\n"
  esql: "FROM logs-azure.signinlogs*, logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.outcome == \"success\"\n  AND (azure.signinlogs.properties.authentication_protocol\
    \ IS NOT NULL OR o365.audit.Operation IN (\"UserLoggedIn\", \"MailboxLogin\"))\n  AND source.geo.country_name IS NOT NULL\n  AND source.geo.country_name\
    \ NOT IN (\"United States\", \"Canada\", \"United Kingdom\", \"Germany\", \"France\")\n| STATS login_count = COUNT(*) BY user.name, source.ip,\
    \ source.geo.country_name, host.name\n| WHERE login_count >= 1\n| KEEP @timestamp, user.name, source.ip, source.geo.country_name, host.name,\
    \ login_count\n"
  leql: |
    where(result=SUCCESS AND source_address!=PRIVATE AND source_geo.country_code NOT IN ["US", "CA", "GB", "DE", "FR", "AU", "NZ", "JP", "SG"]) groupby(source_address, user, source_geo.country_code) calculate(count)
  crowdstrike: |
    #type=*azure* OR #type=*office365* OR #type=*vpn* OR event_simpleName=*Login* OR event_simpleName=*Logon*
    | ResultType=0 OR Status=Success OR event_simpleName=*Success*
    | IPAddress!=10.* AND IPAddress!=172.16.* AND IPAddress!=192.168.* AND IPAddress!=127.*
    | country!="United States" AND country!="Canada" AND country!="United Kingdom" AND country!="Germany" AND country!="France"
    | table([@timestamp, UserPrincipalName, user, IPAddress, country, Location, Application, event_simpleName])
  xql: "dataset = cloud_audit_logs\n| filter outcome = \"success\" \n  and (action_app_id_list contains \"VPN\" or action_app_id_list contains\
    \ \"Azure\" or action_app_id_list contains \"Office 365\" or log_source_type = ENUM.AZURE_AD or log_source_type = ENUM.OFFICE_365)\n  and\
    \ action_country notin (\"US\", \"CA\", \"GB\", \"DE\", \"FR\", \"AU\", \"JP\")\n  and action_network_type != \"internal\"\n| comp count()\
    \ as login_count by action_country, actor_user, action_external_hostname\n| filter login_count >= 1\n| fields _time, actor_user, action_country,\
    \ action_external_hostname, login_count\n"
  lucene: |
    event.action:"successful authentication" AND source.geo.country_name:(* AND NOT ("United States" OR "Canada" OR "United Kingdom" OR "Germany" OR "France" OR "Australia" OR "Japan")) AND NOT source.ip:(10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16) AND (event.dataset:"azure.signinlogs" OR event.dataset:"o365.audit")
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*Office* OR _sourceCategory=*M365* OR _sourceCategory=*VPN*
    | json field=_raw "ResultType" as result_type
    | json field=_raw "ResultDescription" as result_desc
    | json field=_raw "Status" as status
    | json field=_raw "IPAddress" as src_ip
    | json field=_raw "UserPrincipalName" as user
    | json field=_raw "Location.countryOrRegion" as country
    | json field=_raw "AppDisplayName" as app
    | where (result_type = "0" OR status = "Success" OR result_desc matches "*success*")
    | where src_ip != "" AND !isPrivateIP(src_ip)
    | where !(country in ("US", "United States", "CA", "Canada", "GB", "United Kingdom"))
    | count by user, src_ip, country, app
    | where _count >= 1
    | fields user, src_ip, country, app, _count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Successful Remote Login Event \nFrom one external source\nWhere the Source Country is NOT on the Authorized Countries List"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000267
v4_id: '000267'
name: Access from an unusual location to a storage blob container
description: Detects when an alert from Azure fires around access to a storage blob container from an unusual location.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure Security Center
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype="azure:security:center" event_name="Access from an unusual location to a storage blob container"

    | table _time, user, src, dest, storage_account, container_name, location, severity

    '
  kql: |
    SecurityAlert
    | where TimeGenerated > ago(24h)
    | where ProviderName == "Azure Security Center"
    | where DisplayName == "Access from an unusual location to a storage blob container"
    | project TimeGenerated, DisplayName, Description, Severity, CompromisedEntity, RemediationSteps, Entities, ExtendedProperties
  aql: |
    SELECT eventtime, username, sourceip, destinationip, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE QIDNAME(qid) ILIKE '%Access from an unusual location to a storage blob container%'
      AND LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
    LAST 24 HOURS
  yara_l: |
    rule azure_unusual_location_blob_access {
      meta:
        author = "Detection Engineer"
        description = "Detects access from an unusual location to Azure storage blob container - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Azure Security Center"
        $e.metadata.product_event_type = "Access from an unusual location to a storage blob container"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user, $resource over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-azure.activitylogs*, logs-azure.signinlogs*, logs-azure.auditlogs*
    | WHERE @timestamp > NOW() - 24 hour AND event.action == "Access from an unusual location to a storage blob container"
    | KEEP @timestamp, cloud.account.id, cloud.provider, user.name, source.ip, source.geo.country_name, azure.resource.name, event.outcome, event.action
  leql: |
    where(source_json.EventName="Access from an unusual location to a storage blob container")
  crowdstrike: |
    #type=azure-security-event EventName="Access from an unusual location to a storage blob container"
    | table([@timestamp, ComputerName, UserName, EventName, SourceIPAddress, ResourceId, Properties])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and cloud_provider = "Azure"
    | filter operation_name = "Access from an unusual location to a storage blob container"
    | fields _time, cloud_provider, vendor, operation_name, identity_name, resource_type, resource_sub_type, raw_log
  lucene: |
    event.name:"Access from an unusual location to a storage blob container"
  sumo: |
    _sourceCategory=*Azure*Security* "Access from an unusual location to a storage blob container"
    | json field=_raw "EventName" as event_name
    | where event_name = "Access from an unusual location to a storage blob container"
    | fields _messageTime, _sourceHost, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Security Event

  Where the Event Name is "Access from an unusual location to a storage blob container"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000268
v4_id: 000268
name: Login from a principal user not seen in 60 days
description: Detects when a user who hasn’t logged in for 60 days logs in.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure Security Center
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype="azure:security:center" EventName="Login from a principal user not seen in 60 days"

    | table _time, user, src_ip, dest, action, result, EventName

    '
  kql: |
    SecurityAlert
    | where TimeGenerated > ago(1d)
    | where AlertName == "Login from a principal user not seen in 60 days"
    | where ProductName == "Azure Security Center"
    | project TimeGenerated, AlertName, AlertSeverity, CompromisedEntity, Entities, ExtendedProperties, Description, RemediationSteps
  aql: |
    SELECT sourceip, username, QIDNAME(qid), LOGSOURCENAME(logsourceid), eventtime
    FROM events
    WHERE QIDNAME(qid) = 'Login from a principal user not seen in 60 days'
      AND LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
    LAST 24 HOURS
  yara_l: |
    rule azure_principal_user_login_not_seen_60_days {
      meta:
        author = "TDL"
        description = "Detects Azure login from principal user not seen in 60 days"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        platform = "Azure"
        data_source = "Azure Security Center"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        $e.security_result.summary = "Login from a principal user not seen in 60 days"
        $e.principal.user.userid = $user
        $e.principal.hostname = $host

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-azure.activitylogs*, logs-azure.signinlogs*, logs-azure.auditlogs*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.action\
    \ == \"Login from a principal user not seen in 60 days\"\n| KEEP @timestamp, host.name, user.name, source.ip, event.action, event.outcome,\
    \ cloud.account.id, azure.activitylogs.operation_name, azure.signinlogs.properties.user_principal_name\n"
  leql: |
    where(source_json.operationName="Login from a principal user not seen in 60 days")
  crowdstrike: |
    #type=azure #source=SecurityCenter event.name="Login from a principal user not seen in 60 days"
    | table([@timestamp, ComputerName, user.name, sourceIPAddress, event.name, event.outcome])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Azure" and event_type = "SecurityEvent" and operation = "Login from a principal user not seen in 60 days"
    | fields _time, cloud_provider_account, actor_effective_username, operation, outcome
  lucene: |
    azure.activitylogs.operationName:"Login from a principal user not seen in 60 days"
  sumo: |
    _sourceCategory=*Azure*Security* "Login from a principal user not seen in 60 days"
    | json field=_raw "EventName" as event_name
    | where event_name = "Login from a principal user not seen in 60 days"
    | fields _messageTime, _sourceHost, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Security Event

  Where the Event Name is "Login from a principal user not seen in 60 days"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000270
v4_id: '000270'
name: Repeat Account Lockout
description: Designed to detect multiple account lockout events for a user in a 60 minute period. Investigate the source of the failed logins
  as well as any cause of the failed logins (wrong password, process logging in)
tactic: Initial Access
tactic_id: TA0001
technique_id: T1531
technique_name: Account Access Removal
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4740'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security (EventCode=644 OR EventCode=4740)

    | bin _time span=1h

    | stats count by _time, TargetUserName

    | where count >= 5

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (644, 4740)
    | summarize LockoutCount = count() by bin(TimeGenerated, 1h), TargetUserName, Computer
    | where LockoutCount >= 5
    | project TimeGenerated, TargetUserName, Computer, LockoutCount
  aql: |
    SELECT username AS "Destination Username", sourceip, COUNT(*) AS lockout_count
    FROM events
    WHERE "EventID" IN ('644', '4740')
    GROUP BY username, sourceip
    HAVING lockout_count >= 5
    LAST 1 HOURS
  yara_l: "rule account_lockout_burst {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects 5 or more account lockout events\
    \ for the same user within 1 hour - T1531\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1531\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"USER_UNCATEGORIZED\"\n    ($e.metadata.product_event_type = \"644\" or $e.metadata.product_event_type\
    \ = \"4740\")\n    $e.target.user.userid = $user\n    $e.principal.hostname = $host\n    \n  match:\n    $user over 1h\n    \n  outcome:\n\
    \    $risk_score = 65\n    $lockout_count = count_distinct($e.metadata.id)\n    $target_user = array_distinct($e.target.user.userid)\n   \
    \ $affected_hosts = array_distinct($e.principal.hostname)\n    \n  condition:\n    #e >= 5\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 1 hour AND event.code IN ("644", "4740")
    | STATS lock_count = COUNT(*) BY user.name, bucket = BUCKET(@timestamp, 1 hour)
    | WHERE lock_count >= 5
    | KEEP bucket, user.name, lock_count
  leql: |
    where(source_json.EventID IN [644, 4740]) groupby(source_json.TargetUserName) calculate(count)
  crowdstrike: |
    EventCode=4740
    | groupBy([TargetUserName], function=count(as=lockouts), span=1h)
    | lockouts >= 5
    | table([@timestamp, TargetUserName, lockouts])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (644, 4740)
    | bin _time span=1h
    | comp count() as lockout_count by _time, action_evtlog_event_data_TargetUserName, agent_hostname
    | filter lockout_count >= 5
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, lockout_count
  lucene: |
    event.code:(644 OR 4740)
  sumo: |
    _sourceCategory=*Windows* ("644" OR "4740")
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | where event_id in ("644", "4740")
    | timeslice 1h
    | count as lockout_count by _timeslice, target_user
    | where lockout_count >= 5
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '5 Windows Account Locked Out Events

  Where the Event ID is in [644, 4740]

  With the same Destination Username

  Within 1 hour


  ---------------------------------------------------------------------------------------------------------------


  5 User Account Locked Out Events

  With the same Destination Username

  Within 1 hour'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000272
v4_id: '000272'
name: SQL Login Attempts Failed
description: Detects when there are multiple failed login attempts against the SQL database with a short timeframe
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=windows EventCode=18456

    | bin _time span=1m

    | stats count by _time, ComputerName, Account_Name

    | where count >= 3

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 18456
    | summarize FailureCount = count() by bin(TimeGenerated, 1m), Computer, Account
    | where FailureCount >= 3
    | project TimeGenerated, Computer, Account, FailureCount
  aql: |
    SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS host, COUNT(*) AS failed_attempts
    FROM events
    WHERE "EventID" = '18456'
    GROUP BY username, sourceip, LOGSOURCENAME(logsourceid)
    HAVING failed_attempts >= 3
    LAST 1 MINUTES
  yara_l: |
    rule sql_login_brute_force {
      meta:
        author = "Detection Engineer"
        description = "Detects 3 or more SQL login failures (Event ID 18456) within 1 minute"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.metadata.product_event_type = "18456"
        $e.security_result.action = "BLOCK"
        $e.principal.hostname = $host
        $e.target.user.userid = $user

      match:
        $host, $user over 1m

      condition:
        #e >= 3
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*, logs-windows.forwarded*
    | WHERE @timestamp > NOW() - 1 hour AND event.code == "18456"
    | STATS failures = COUNT(*) BY user.name, host.name, source.ip, bucket = BUCKET(@timestamp, 1 minute)
    | WHERE failures >= 3
    | KEEP bucket, host.name, user.name, source.ip, failures
  leql: |
    where(source_json.EventID=18456) groupby(source_address, user) calculate(count)
  crowdstrike: |
    EventCode=18456
    | bucket(span=1m, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, ComputerName, TargetUserName], function=count(as=failures))
    | failures >= 3
    | table([time_bucket, ComputerName, TargetUserName, failures])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 18456
    | bin _time span=1m
    | comp count() as failures by _time, agent_hostname, action_evtlog_event_data_TargetUserName
    | filter failures >= 3
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, failures
  lucene: |
    event.code:18456 OR EventID:18456
  sumo: |
    _sourceCategory=*Windows* "18456"
    | json field=_raw "EventID" as event_id
    | json field=_raw "LogonUser" as logon_user
    | where event_id = "18456"
    | timeslice 1m
    | count as failures by _timeslice, logon_user, _sourceHost
    | where failures >= 3
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '3 SQL login Failure Events

  Where the Event ID is 18456

  Within 1 minute'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

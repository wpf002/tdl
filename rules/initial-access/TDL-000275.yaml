rule_id: TDL-AUTH-000275
v4_id: '000275'
name: Mass Malicious Email Delivery
description: Detects when a single sender is found attempting to send multiple phishing emails to multiple users within the organization.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1566
technique_name: Phishing
platform:
- Windows
data_sources:
- Mimecast
- Proofpoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=email (source=mimecast OR source=proofpoint) (url_category IN ("Malware", "*Compromised*", "*Phishing*", "*Suspicious*", "*Botnet*")
    OR attachment_threat="malicious" OR threat_status="malicious")

    | bin _time span=5m

    | stats dc(recipient) as unique_recipients, values(recipient) as recipients, values(url_category) as url_categories, values(subject) as subjects
    by _time, sender

    | where unique_recipients >= 20

    | table _time, sender, unique_recipients, recipients, url_categories, subjects

    '
  kql: "let MimecastThreats = \n    MimecastTTPUrl\n    | where TimeGenerated > ago(5m)\n    | where isnotempty(Category) and (Category has_any\
    \ (\"Malware\", \"Compromised\", \"Phishing\", \"Suspicious\", \"Botnet\"))\n    | summarize RecipientCount = dcount(Recipient) by bin(TimeGenerated,\
    \ 5m), SenderAddress\n    | where RecipientCount >= 20;\nlet ProofpointThreats = \n    ProofpointPOD\n    | where TimeGenerated > ago(5m)\n\
    \    | where isnotempty(threatsInfoMap) or isnotempty(messageParts)\n    | where threatsInfoMap has_any (\"malware\", \"phish\", \"spam\"\
    , \"impostor\") or messageParts has_any (\"malware\", \"phish\")\n    | summarize RecipientCount = dcount(recipient) by bin(TimeGenerated,\
    \ 5m), sender\n    | where RecipientCount >= 20;\nunion MimecastThreats, ProofpointThreats\n| project TimeGenerated, SenderAddress = coalesce(SenderAddress,\
    \ sender), RecipientCount\n"
  aql: |
    SELECT "Sender Address" AS sender, COUNT(*) AS total_events, UNIQUECOUNT("Recipient Address") AS unique_recipients, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE (LOGSOURCENAME(logsourceid) ILIKE '%mimecast%' OR LOGSOURCENAME(logsourceid) ILIKE '%proofpoint%')
      AND (("URL Category" ILIKE '%Malware%' OR "URL Category" ILIKE '%Compromised%' OR "URL Category" ILIKE '%Phishing%' OR "URL Category" ILIKE '%Suspicious%' OR "URL Category" ILIKE '%Botnet%')
           OR ("Threat Type" ILIKE '%malicious%' OR "Threat Type" ILIKE '%malware%' OR "Threat Type" ILIKE '%phish%')
           OR ("Action" ILIKE '%block%' AND ("URL" IS NOT NULL OR "Attachment" IS NOT NULL)))
    GROUP BY "Sender Address", LOGSOURCENAME(logsourceid)
    HAVING total_events >= 20 AND unique_recipients >= 1
    LAST 5 MINUTES
  yara_l: |
    rule phishing_campaign_multiple_recipients {
      meta:
        author = "TDL"
        description = "Detects phishing campaign with malicious URLs or attachments sent to multiple unique recipients"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1566"
        severity = "HIGH"

      events:
        $email.metadata.event_type = "EMAIL_UNCATEGORIZED"
        (
          $email.metadata.vendor_name = "Mimecast" or
          $email.metadata.vendor_name = "Proofpoint"
        )
        (
          re.regex($email.security_result.category_details, `(?i)(malware|compromised|phishing|suspicious|botnet)`) or
          $email.security_result.summary = "MALICIOUS" or
          $email.security_result.summary = "SUSPICIOUS"
        )
        $email.network.email.from = $sender
        $email.target.user.email_addresses = $recipient

      match:
        $sender over 5m

      outcome:
        $risk_score = max(75)
        $unique_recipients = count_distinct($recipient)
        $sender_email = $sender

      condition:
        $email and #recipient >= 20
    }
  esql: "FROM logs-mimecast*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND (mimecast.urlCategory IN (\"Malware\", \"Phishing\", \"Suspicious\"\
    , \"Botnet\") \n       OR mimecast.urlCategory LIKE \"*Compromised*\" \n       OR mimecast.urlCategory LIKE \"*Phishing*\" \n       OR mimecast.urlCategory\
    \ LIKE \"*Suspicious*\" \n       OR mimecast.urlCategory LIKE \"*Botnet*\")\n| STATS recipient_count = COUNT_DISTINCT(email.to) BY email.from,\
    \ bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE recipient_count >= 20\n"
  leql: |
    where(source_json.urlCategory IN ["Malware", "Compromised", "Phishing", "Suspicious", "Botnet"] OR source_json.urlCategory ICONTAINS "Compromised" OR source_json.urlCategory ICONTAINS "Phishing" OR source_json.urlCategory ICONTAINS "Suspicious" OR source_json.urlCategory ICONTAINS "Botnet") groupby(source_json.sender) calculate(unique:source_json.recipient)
  crowdstrike: |
    #type=mimecast (UrlCategory IN ["Malware", "*Compromised*", "*Phishing*", "*Suspicious*", "*Botnet*"] OR ThreatType=* OR fileExtension IN [exe, zip, jar, vbs, ps1, bat, scr, hta, lnk, js, wsf])
    | bucket(span=5m, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, SenderAddress], function=[count(as=total_events), count(RecipientAddress, distinct=true, as=unique_recipients)])
    | total_events >= 20
    | unique_recipients >= 1
    | table([time_bucket, SenderAddress, total_events, unique_recipients])
  xql: |
    dataset = mimecast_raw
    | filter lowercase(url_category) in ("malware", "phishing", "suspicious", "botnet") or url_category ~= "(?i)compromised"
    | bin _time span=5m
    | comp count_distinct(recipient_address) as unique_recipients by _time, sender_address
    | filter unique_recipients >= 20
    | fields _time, sender_address, unique_recipients
  lucene: |
    (data_source:Mimecast AND url_category:("Malware" OR *Compromised* OR *Phishing* OR *Suspicious* OR *Botnet*)) OR (data_source:Proofpoint AND (threat_type:("malware" OR "phish" OR "spam" OR "impostor") OR url_reputation:("malicious" OR "suspicious") OR attachment_threat:*))
  sumo: |
    _sourceCategory=*Mimecast* OR _sourceCategory=*Proofpoint*
    | json field=_raw "Sender" as sender
    | json field=_raw "Recipient" as recipient
    | json field=_raw "URLCategory" as url_category
    | json field=_raw "ThreatType" as threat_type
    | where (url_category matches "*Malware*" OR url_category matches "*Compromised*" OR url_category matches "*Phishing*" OR url_category matches "*Suspicious*" OR url_category matches "*Botnet*") OR (threat_type matches "*malicious*" OR threat_type matches "*phish*" OR threat_type matches "*malware*")
    | timeslice 5m
    | count_distinct(recipient) as unique_recipients by _timeslice, sender
    | where unique_recipients >= 20
    | fields _timeslice, sender, unique_recipients
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '20 Email Security Events

  Where the Email contains a malicious URL or attachment

  With the same Sender

  With unique Recipients

  within 5 minutes


  ---------------------------------------------------------------------------------------------


  1 Mimecast Event Where URL Category is ["Malware", "*Compromised*", "*Phishing*", "*Suspicious*", "*Botnet*"] From Unique Target Users'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

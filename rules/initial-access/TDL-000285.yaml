rule_id: TDL-AUTH-000285
v4_id: 000285
name: Stealth Remote Password Guessing
description: This rule is designed to detect a low and slow password guessing attempt against a VPN or public-facing host, which may indicate
  an attempt to brute force an account’s password.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: |
    index=azure OR index=o365 OR index=vpn (action=failure OR Result=failure OR EventName=UserLoginFailed OR Category=SignInLogs) (LogonType=10 OR Category=SignInLogs OR sourcetype=*azure* OR sourcetype=*o365*)
    | eval src_ip=coalesce(src_ip, src, ClientIP, IPAddress, SourceIP)
    | eval dest_user=coalesce(dest_user, user, UserPrincipalName, TargetUserName, Account_Name, UserId)
    | where isnotnull(src_ip) AND isnotnull(dest_user)
    | bin _time span=3m
    | stats min(_time) as first_time, max(_time) as last_time, dc(_time) as unique_timestamps, count as failure_count by src_ip, dest_user, _time
    | where failure_count >= 2 AND unique_timestamps >= 2
    | bin first_time span=1h as hour_bucket
    | stats sum(failure_count) as total_failures, values(_time) as failure_windows, dc(_time) as distinct_windows by src_ip, dest_user, hour_bucket
    | where total_failures >= 4 AND distinct_windows >= 2
    | eval first_time=strftime(min(failure_windows), "%Y-%m-%d %H:%M:%S"), last_time=strftime(max(failure_windows), "%Y-%m-%d %H:%M:%S")
    | table src_ip, dest_user, total_failures, distinct_windows, first_time, last_time
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000285 {\n  meta:\n    author = \"TDL\"\n    description = \"Stealth Remote Password Guessing\"\n    severity = \"\
    LOW\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName\
    \ = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '4 Instances over 1 hour of 2 Remote Login Failures

  From the same Source

  With the same Destination Usernames

  With unique failure timestamps

  Within 3 minutes'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

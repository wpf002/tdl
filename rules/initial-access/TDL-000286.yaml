rule_id: TDL-AUTH-000286
v4_id: 000286
name: Successful Password Spray
description: Detects a successful login from an internal location after the IP or host has been identified by password spraying internally. This
  could indicate that an attacker was successful in guessing a user’s password and has compromised their account.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4624'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=4625 OR EventCode=528 OR EventCode=540 OR EventCode=4624)\n| eval event_type=case(\n\
    \    EventCode=4625, \"failed\",\n    EventCode=528 OR EventCode=540 OR EventCode=4624, \"success\",\n    1=1, \"other\"\n)\n| eval src_identifier=coalesce(Source_Network_Address,\
    \ Workstation_Name, IpAddress, src)\n| sort 0 _time\n| streamstats time_window=5m count(eval(event_type=\"failed\")) as failed_count, count(eval(event_type=\"\
    success\")) as success_count by src_identifier\n| where failed_count >= 1 AND success_count >= 1\n| where event_type=\"success\"\n| dedup\
    \ src_identifier, Account_Name\n| table _time, src_identifier, Account_Name, ComputerName, EventCode, Logon_Type\n"
  kql: "SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (4625, 528, 540, 4624)\n| extend SourceIdentifier = coalesce(IpAddress,\
    \ WorkstationName, Computer)\n| summarize \n    FailedLogons = countif(EventID == 4625),\n    SuccessfulLogons = countif(EventID in (528,\
    \ 540, 4624)),\n    FirstFailure = minif(TimeGenerated, EventID == 4625),\n    FirstSuccess = minif(TimeGenerated, EventID in (528, 540, 4624)),\n\
    \    Accounts = make_set(TargetAccount)\n    by SourceIdentifier, bin(TimeGenerated, 5m)\n| where FailedLogons >= 1 and SuccessfulLogons >=\
    \ 1\n| where FirstSuccess >= FirstFailure and FirstSuccess <= FirstFailure + 5m\n| project TimeGenerated, SourceIdentifier, FailedLogons,\
    \ SuccessfulLogons, FirstFailure, FirstSuccess, Accounts\n"
  aql: "SELECT \n    sourceip,\n    username,\n    LOGSOURCENAME(logsourceid) AS target_host,\n    COUNT(*) AS successful_logons,\n    UNIQUECOUNT(username)\
    \ AS unique_users\nFROM events\nWHERE \"EventID\" IN ('528', '540', '4624')\nGROUP BY sourceip, username, LOGSOURCENAME(logsourceid)\nHAVING\
    \ unique_users >= 2\nLAST 5 MINUTES\n"
  yara_l: "rule password_spray_followed_by_success {\n  meta:\n    author = \"TDL\"\n    description = \"Detects password spraying followed by\
    \ successful authentication from same source\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n   \
    \ severity = \"High\"\n    \n  events:\n    $spray.metadata.event_type = \"USER_LOGIN\"\n    $spray.security_result.action = \"BLOCK\"\n \
    \   $spray.principal.ip = $source_ip\n    \n    $success.metadata.event_type = \"USER_LOGIN\"\n    $success.security_result.action = \"ALLOW\"\
    \n    (\n      $success.metadata.product_event_type = \"528\" or\n      $success.metadata.product_event_type = \"540\" or\n      $success.metadata.product_event_type\
    \ = \"4624\"\n    )\n    $success.principal.ip = $source_ip\n    \n    $spray.metadata.event_timestamp.seconds <= $success.metadata.event_timestamp.seconds\n\
    \    \n  match:\n    $source_ip over 5m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $spray and $success\n}\n"
  esql: "FROM logs-system.security*\n| WHERE @timestamp > NOW() - 1 day\n| WHERE event.code IN (\"528\", \"540\", \"4624\")\n| EVAL source_identifier\
    \ = COALESCE(source.ip, host.name)\n| STATS \n    first_success = MIN(@timestamp),\n    success_count = COUNT(*) BY source_identifier, user.name\n\
    | WHERE success_count >= 1\n| STATS \n    unique_users = COUNT_DISTINCT(user.name),\n    users = VALUES(user.name),\n    min_time = MIN(first_success),\n\
    \    max_time = MAX(first_success) BY source_identifier\n| EVAL time_diff_minutes = (max_time - min_time) / 60000\n| WHERE unique_users >\
    \ 1 AND time_diff_minutes <= 5\n| KEEP source_identifier, unique_users, users, min_time, max_time, time_diff_minutes\n"
  leql: |
    where(source_json.EventID=4624 AND result=SUCCESS) groupby(source_address) calculate(count)
  crowdstrike: |
    EventCode IN [528, 540, 4624]
    | groupBy([IpAddress, TargetUserName], function=[count(as=authCount), selectLast([@timestamp, ComputerName, LogonType, SubjectUserName])])
    | authCount >= 2
    | table([IpAddress, TargetUserName, authCount, @timestamp, ComputerName, LogonType, SubjectUserName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (528, 540, 4624)
    | bin _time span=5m
    | comp count_distinct(actor_effective_username) as unique_users by _time, action_remote_ip, agent_hostname
    | filter unique_users > 1
    | fields _time, action_remote_ip, agent_hostname, unique_users
  lucene: |
    event.code:4624 AND _exists_:source.ip
  sumo: |
    _sourceCategory=*Windows*Security*
    | json field=_raw "EventID" as event_id
    | json field=_raw "IpAddress" as src_ip
    | json field=_raw "WorkstationName" as src_host
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "LogonType" as logon_type
    | where event_id in ("528", "540", "4624", "4625")
    | if(event_id = "4625", "spray", "success") as event_type
    | sort by src_ip, _messageTime
    | timeslice 5m
    | first(event_type) as first_event by _timeslice, src_ip
    | where first_event = "spray"
    | join (
        _sourceCategory=*Windows*Security*
        | json field=_raw "EventID" as event_id
        | json field=_raw "IpAddress" as src_ip
        | where event_id in ("528", "540", "4624")
      ) as success on src_ip
    | where success._messageTime > _messageTime and success._messageTime <= _messageTime + 300000
    | fields _messageTime, src_ip, target_user, success.event_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Password Spraying Event\n\nFollowed By\n\n1 Windows Authentication Success Event\nWhere the Event ID is in [528, 540, 4624]\n\
  With the same Source IP/Hostname\n\t\nWithin 5 minutes"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000290
v4_id: 000290
name: Successful Logon from Risky IP
description: This detection identifies that users were active from an IP address identified as risky by Microsoft Threat Intelligence. These IP
  addresses are involved in malicious activities, such as Botnet C&C, and may indicate compromised account.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- MCAS
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=mcas sourcetype=mcas:events (event_name="Risky sign-in: Malicious IP address" OR event_name="Logon from a risky IP address")

    | table _time, user, src_ip, event_name, app, device_type, country

    '
  kql: |
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | where ActionType in~ ("Risky sign-in: Malicious IP address", "Logon from a risky IP address")
    | project TimeGenerated, AccountObjectId, AccountDisplayName, IPAddress, Application, ActionType, RawEventData, DeviceType, ISP, City, CountryCode
  aql: |
    SELECT DATEFORMAT(devicetime, 'YYYY-MM-dd HH:mm:ss') AS event_time, username, sourceip, destinationip, UTF8(payload) AS event_details, qidname(qid) AS event_name, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE (LOGSOURCENAME(logsourceid) ILIKE '%MCAS%' OR LOGSOURCENAME(logsourceid) ILIKE '%Cloud App Security%' OR LOGSOURCENAME(logsourceid) ILIKE '%Microsoft Cloud App Security%')
      AND (qidname(qid) ILIKE '%Risky sign-in%Malicious IP address%' OR qidname(qid) ILIKE '%Logon from a risky IP address%' OR UTF8(payload) ILIKE '%Risky sign-in%Malicious IP address%' OR UTF8(payload) ILIKE '%Logon from a risky IP address%')
    LAST 24 HOURS
  yara_l: |
    rule mcas_risky_signin_malicious_ip {
      meta:
        author = "TDL"
        description = "Detects MCAS risky sign-in events from malicious or risky IP addresses - MITRE T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Cloud App Security"
        (
          $e.metadata.product_event_type = "Risky sign-in: Malicious IP address" or
          $e.metadata.product_event_type = "Logon from a risky IP address"
        )
        $e.target.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user, $ip over 5m

      condition:
        $e
    }
  esql: "FROM logs-o365.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND (event.action == \"Risky sign-in: Malicious IP address\" OR event.action\
    \ == \"Logon from a risky IP address\")\n| KEEP @timestamp, user.name, source.ip, host.name, event.action, event.outcome, event.dataset\n"
  leql: |
    where(source_json.eventName IN ["Risky sign-in: Malicious IP address", "Logon from a risky IP address"])
  crowdstrike: |
    #type=mcas (EventName="Risky sign-in: Malicious IP address" OR EventName="Logon from a risky IP address")
    | table([@timestamp, EventName, UserName, IPAddress, ComputerName, RiskLevel])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and logon_type = "MCAS"
    | filter raw_log contains "Risky sign-in: Malicious IP address" or raw_log contains "Logon from a risky IP address"
    | fields _time, actor_user, source_ip, raw_log
  lucene: |
    event.name:("Risky sign-in: Malicious IP address" OR "Logon from a risky IP address")
  sumo: |
    _sourceCategory=*MCAS* ("Risky sign-in: Malicious IP address" OR "Logon from a risky IP address")
    | json field=_raw "EventName" as event_name
    | where event_name in ("Risky sign-in: Malicious IP address", "Logon from a risky IP address")
    | fields _messageTime, _sourceHost, event_name, *
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 MCAS Event Where Event Name is "Risky sign-in: Malicious IP address" OR "Logon from a risky IP address"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000293
v4_id: 000293
name: Allowed Cross-Site Scripting Traffic
description: Detects when traffic is allowed with a cross site scripting signature or common cross site scripting request patterns.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
- Webserver
- Reverse Proxy
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "(index=waf OR index=network OR index=web) \n(\n  (sourcetype=waf action=allowed (signature=\"*xss*\" OR signature=\"*csrf*\" OR (signature=\"\
    *cross*\" AND signature=\"*site*\")))\n  OR\n  (\n    (sourcetype=webserver OR sourcetype=access_combined OR sourcetype=proxy OR sourcetype=reverse_proxy)\n\
    \    (uri_path=\"*=<script>*\" OR uri_path=\"*=%3cscript%3e*\" OR uri_path=\"*=%253cscript%253e*\" OR uri_path=\"*<iframe *\" OR uri_path=\"\
    *%3ciframe *\" OR uri_path=\"*<svg *\" OR uri_path=\"*%3csvg *\" OR uri_path=\"*document.cookie*\" OR uri_path=\"*document.domain*\" OR uri_path=\"\
    * onerror=*\" OR uri_path=\"* onresize=*\" OR uri_path=\"* onload=\\\"*\" OR uri_path=\"*onmouseover=*\" OR uri_path=\"*${alert*\" OR uri_path=\"\
    *javascript:alert*\" OR uri_path=\"*javascript%3aalert*\" OR uri_path=\"*backurl=*\")\n    NOT (status=4* OR status=5*)\n  )\n)\n| eval signature=coalesce(signature,\
    \ \"N/A\")\n| eval uri_path=coalesce(uri_path, url, cs_uri_query, uri, \"N/A\")\n| eval status=coalesce(status, sc_status, http_status, \"\
    N/A\")\n| table _time, src, src_ip, dest, dest_ip, uri_path, status, signature, action, sourcetype, host\n"
  kql: "let WAFEvents = \n    AzureDiagnostics\n    | where TimeGenerated > ago(1h)\n    | where Category == \"ApplicationGatewayFirewallLog\"\
    \ or ResourceType == \"APPLICATIONGATEWAYS\"\n    | where action_s == \"Allowed\" or \n            Message has \"xss\" or \n            Message\
    \ has \"csrf\" or \n            (Message has \"cross\" and Message has \"site\")\n    | project TimeGenerated, Resource, action_s, Message,\
    \ requestUri_s, clientIp_s, hostname_s, details_message_s;\nlet WebServerEvents = \n    union isfuzzy=true\n        (W3CIISLog\n        |\
    \ where TimeGenerated > ago(1h)\n        | where csUriQuery has_any (\"=<script>\", \"=%3cscript%3e\", \"=%253cscript%253e\", \"<iframe \"\
    , \"%3ciframe \", \"<svg \", \"%3csvg \", \"document.cookie\", \"document.domain\", \" onerror=\", \" onresize=\", \" onload=\\\"\", \"onmouseover=\"\
    , \"${alert\", \"javascript:alert\", \"javascript%3aalert\", \"backurl=\")\n        | where not(scStatus startswith \"4\" or scStatus startswith\
    \ \"5\")\n        | project TimeGenerated, Computer, cIP, csHost, csUriStem, csUriQuery, scStatus, csUserAgent, csMethod, csReferer),\n  \
    \      (AzureDiagnostics\n        | where TimeGenerated > ago(1h)\n        | where ResourceType in~ (\"FRONTDOORS\", \"CDNWEBAPPLICATIONFIREWALLPOLICIES\"\
    ) or Category in~ (\"FrontdoorAccessLog\", \"FrontdoorWebApplicationFirewallLog\")\n        | where requestUri_s has_any (\"=<script>\", \"\
    =%3cscript%3e\", \"=%253cscript%253e\", \"<iframe \", \"%3ciframe \", \"<svg \", \"%3csvg \", \"document.cookie\", \"document.domain\", \"\
    \ onerror=\", \" onresize=\", \" onload=\\\"\", \"onmouseover=\", \"${alert\", \"javascript:alert\", \"javascript%3aalert\", \"backurl=\"\
    )\n        | where not(httpStatusCode_s startswith \"4\" or httpStatusCode_s startswith \"5\")\n        | project TimeGenerated, Resource,\
    \ clientIp_s, host_s, requestUri_s, httpStatusCode_s, userAgent_s, httpMethod_s, referer_s),\n        (CommonSecurityLog\n        | where\
    \ TimeGenerated > ago(1h)\n        | where DeviceVendor in~ (\"Palo Alto Networks\", \"Fortinet\", \"Cisco\", \"F5\", \"Imperva\", \"Citrix\"\
    )\n        | where RequestURL has_any (\"=<script>\", \"=%3cscript%3e\", \"=%253cscript%253e\", \"<iframe \", \"%3ciframe \", \"<svg \", \"\
    %3csvg \", \"document.cookie\", \"document.domain\", \" onerror=\", \" onresize=\", \" onload=\\\"\", \"onmouseover=\", \"${alert\", \"javascript:alert\"\
    , \"javascript%3aalert\", \"backurl=\")\n        | where not(EventOutcome startswith \"4\" or EventOutcome startswith \"5\")\n        | project\
    \ TimeGenerated, DeviceVendor, DeviceProduct, SourceIP, DestinationHostName, RequestURL, EventOutcome, RequestMethod, RequestClientApplication);\n\
    union isfuzzy=true WAFEvents, WebServerEvents\n| project TimeGenerated, Computer, Resource, clientIp_s, cIP, SourceIP, csHost, hostname_s,\
    \ host_s, DestinationHostName, requestUri_s, csUriQuery, RequestURL, scStatus, httpStatusCode_s, EventOutcome, action_s, Message, csUserAgent,\
    \ userAgent_s, RequestClientApplication\n"
  aql: |
    SELECT sourceip, destinationip, username, url, "HTTP Response Code", CATEGORYNAME(category) AS event_category, LOGSOURCENAME(logsourceid) AS log_source, COUNT(*) AS event_count
    FROM events
    WHERE (
      (CATEGORYNAME(category) ILIKE '%web application%' AND CATEGORYNAME(category) ILIKE '%firewall%' AND (utf8(payload) ILIKE '%action%allowed%' OR utf8(payload) ILIKE '%signature%xss%' OR utf8(payload) ILIKE '%signature%csrf%' OR (utf8(payload) ILIKE '%signature%cross%' AND utf8(payload) ILIKE '%site%')))
      OR
      ((CATEGORYNAME(category) ILIKE '%proxy%' OR CATEGORYNAME(category) ILIKE '%web%server%' OR CATEGORYNAME(category) ILIKE '%http%') AND (url ILIKE '%=<script>%' OR url ILIKE '%=%3cscript%3e%' OR url ILIKE '%=%253cscript%253e%' OR url ILIKE '%<iframe %' OR url ILIKE '%%3ciframe %' OR url ILIKE '%<svg %' OR url ILIKE '%%3csvg %' OR url ILIKE '%document.cookie%' OR url ILIKE '%document.domain%' OR url ILIKE '% onerror=%' OR url ILIKE '% onresize=%' OR url ILIKE '% onload=\"%' OR url ILIKE '%onmouseover=%' OR url ILIKE '%${alert%' OR url ILIKE '%javascript:alert%' OR url ILIKE '%javascript%3aalert%' OR url ILIKE '%backurl=%') AND "HTTP Response Code" NOT LIKE '4%' AND "HTTP Response Code" NOT LIKE '5%')
    )
    GROUP BY sourceip, destinationip, username, url, "HTTP Response Code", CATEGORYNAME(category), LOGSOURCENAME(logsourceid)
    LAST 1 HOURS
  yara_l: |
    rule xss_exploit_attempt_t1190 {
      meta:
        author = "TDL"
        description = "Detects potential XSS/CSRF exploitation attempts via WAF signatures or suspicious URI patterns with successful response codes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1190"
        severity = "High"

      events:
        // WAF Event - Allowed action with XSS/CSRF signatures
        (
          $waf.metadata.event_type = "NETWORK_HTTP" and
          $waf.security_result.action = "ALLOW" and
          (
            re.regex($waf.security_result.summary, `(?i)xss`) or
            re.regex($waf.security_result.summary, `(?i)csrf`) or
            (
              re.regex($waf.security_result.summary, `(?i)cross`) and
              re.regex($waf.security_result.summary, `(?i)site`)
            )
          ) and
          $waf.target.ip = $target_ip
        )
        or
        // Webserver/Reverse Proxy Event - Suspicious URI patterns with successful response
        (
          $web.metadata.event_type = "NETWORK_HTTP" and
          (
            re.regex($web.target.url, `(?i)=<script>`) or
            re.regex($web.target.url, `(?i)=%3cscript%3e`) or
            re.regex($web.target.url, `(?i)=%253cscript%253e`) or
            re.regex($web.target.url, `(?i)<iframe\s`) or
            re.regex($web.target.url, `(?i)%3ciframe\s`) or
            re.regex($web.target.url, `(?i)<svg\s`) or
            re.regex($web.target.url, `(?i)%3csvg\s`) or
            re.regex($web.target.url, `(?i)document\.cookie`) or
            re.regex($web.target.url, `(?i)document\.domain`) or
            re.regex($web.target.url, `(?i)\sonerror=`) or
            re.regex($web.target.url, `(?i)\sonresize=`) or
            re.regex($web.target.url, `(?i)\sonload=\\?"`) or
            re.regex($web.target.url, `(?i)onmouseover=`) or
            re.regex($web.target.url, `(?i)\$\{alert`) or
            re.regex($web.target.url, `(?i)javascript:alert`) or
            re.regex($web.target.url, `(?i)javascript%3aalert`) or
            re.regex($web.target.url, `(?i)backurl=`)
          ) and
          not re.regex($web.network.http.response_code, `^4`) and
          not re.regex($web.network.http.response_code, `^5`) and
          $web.target.ip = $target_ip
        )

      match:
        $target_ip over 5m

      condition:
        $waf or $web
    }
  esql: "FROM logs-network.ids*, logs-network.waf*, logs-web.access*, logs-nginx.access*, logs-apache.access*, logs-haproxy.log*\n| WHERE @timestamp\
    \ > NOW() - 1 hour\n| WHERE (\n    (event.dataset LIKE \"*waf*\" AND event.action == \"allowed\" AND (\n      TO_LOWER(rule.name) LIKE \"\
    *xss*\" OR \n      TO_LOWER(rule.name) LIKE \"*csrf*\" OR \n      (TO_LOWER(rule.name) LIKE \"*cross*\" AND TO_LOWER(rule.name) LIKE \"*site*\"\
    )\n    )) \n    OR \n    ((event.dataset LIKE \"*access*\" OR event.dataset LIKE \"*proxy*\" OR event.dataset LIKE \"*web*\") AND (\n    \
    \  TO_LOWER(url.original) LIKE \"*=<script>*\" OR\n      TO_LOWER(url.original) LIKE \"*=%3cscript%3e*\" OR\n      TO_LOWER(url.original)\
    \ LIKE \"*=%253cscript%253e*\" OR\n      TO_LOWER(url.original) LIKE \"*<iframe *\" OR\n      TO_LOWER(url.original) LIKE \"*%3ciframe *\"\
    \ OR\n      TO_LOWER(url.original) LIKE \"*<svg *\" OR\n      TO_LOWER(url.original) LIKE \"*%3csvg *\" OR\n      TO_LOWER(url.original) LIKE\
    \ \"*document.cookie*\" OR\n      TO_LOWER(url.original) LIKE \"*document.domain*\" OR\n      TO_LOWER(url.original) LIKE \"* onerror=*\"\
    \ OR\n      TO_LOWER(url.original) LIKE \"* onresize=*\" OR\n      TO_LOWER(url.original) LIKE \"* onload=\\\"*\" OR\n      TO_LOWER(url.original)\
    \ LIKE \"*onmouseover=*\" OR\n      TO_LOWER(url.original) LIKE \"*${alert*\" OR\n      TO_LOWER(url.original) LIKE \"*javascript:alert*\"\
    \ OR\n      TO_LOWER(url.original) LIKE \"*javascript%3aalert*\" OR\n      TO_LOWER(url.original) LIKE \"*backurl=*\"\n    ) AND NOT STARTS_WITH(TO_STRING(http.response.status_code),\
    \ \"4\") AND NOT STARTS_WITH(TO_STRING(http.response.status_code), \"5\"))\n  )\n| KEEP @timestamp, host.name, source.ip, destination.ip,\
    \ url.original, http.request.method, http.response.status_code, event.action, rule.name, user_agent.original\n"
  leql: |
    where((source_json.action=Allowed OR (source_json.signature ICONTAINS "xss" OR source_json.signature ICONTAINS "csrf" OR (source_json.signature ICONTAINS "cross" AND source_json.signature ICONTAINS "site"))) OR (uri ICONTAINS "=<script>" OR uri ICONTAINS "=%3cscript%3e" OR uri ICONTAINS "=%253cscript%253e" OR uri ICONTAINS "<iframe " OR uri ICONTAINS "%3ciframe " OR uri ICONTAINS "<svg " OR uri ICONTAINS "%3csvg " OR uri ICONTAINS "document.cookie" OR uri ICONTAINS "document.domain" OR uri ICONTAINS " onerror=" OR uri ICONTAINS " onresize=" OR uri ICONTAINS " onload=\"" OR uri ICONTAINS "onmouseover=" OR uri ICONTAINS "${alert" OR uri ICONTAINS "javascript:alert" OR uri ICONTAINS "javascript%3aalert" OR uri ICONTAINS "backurl=")) AND NOT (response_code STARTS-WITH "4" OR response_code STARTS-WITH "5")
  crowdstrike: |
    (#type=waf (Action=Allowed OR (Signature=*xss* OR Signature=*csrf* OR (Signature=*cross* AND Signature=*site*))))
    OR
    (#type IN [proxy, webserver] (URI=*=<script>* OR URI=*=%3cscript%3e* OR URI=*=%253cscript%253e* OR URI=*<iframe * OR URI=*%3ciframe * OR URI=*<svg * OR URI=*%3csvg * OR URI=*document.cookie* OR URI=*document.domain* OR URI=* onerror=* OR URI=* onresize=* OR URI=* onload=\"* OR URI=*onmouseover=* OR URI=*${alert* OR URI=*javascript:alert* OR URI=*javascript%3aalert* OR URI=*backurl=*) NOT ResponseCode=4* NOT ResponseCode=5*)
    | table([@timestamp, ComputerName, #type, Action, Signature, URI, ResponseCode])
  xql: "dataset = panw_ngfw_threat_raw\n| filter (\n    (action_app_id = \"web-applications\" and action = \"allow\" and (\n        action_botnet_signature\
    \ contains \"xss\"\n        or action_botnet_signature contains \"csrf\"\n        or (action_botnet_signature contains \"cross\" and action_botnet_signature\
    \ contains \"site\")\n    ))\n    or (\n        (dst_action_url_path contains \"=<script>\" \n        or dst_action_url_path contains \"=%3cscript%3e\"\
    \n        or dst_action_url_path contains \"=%253cscript%253e\"\n        or dst_action_url_path contains \"<iframe \"\n        or dst_action_url_path\
    \ contains \"%3ciframe \"\n        or dst_action_url_path contains \"<svg \"\n        or dst_action_url_path contains \"%3csvg \"\n      \
    \  or dst_action_url_path contains \"document.cookie\"\n        or dst_action_url_path contains \"document.domain\"\n        or dst_action_url_path\
    \ contains \" onerror=\"\n        or dst_action_url_path contains \" onresize=\"\n        or dst_action_url_path contains \" onload=\\\"\"\
    \n        or dst_action_url_path contains \"onmouseover=\"\n        or dst_action_url_path contains \"${alert\"\n        or dst_action_url_path\
    \ contains \"javascript:alert\"\n        or dst_action_url_path contains \"javascript%3aalert\"\n        or dst_action_url_path contains \"\
    backurl=\")\n        and http_response_code != null\n        and to_string(http_response_code) !~= \"^4.*\"\n        and to_string(http_response_code)\
    \ !~= \"^5.*\"\n    )\n)\n| fields _time, action_source_translated_ip, action_destination_translated_ip, dst_action_url_path, http_response_code,\
    \ action, action_botnet_signature\n"
  lucene: |
    (event_type:"waf" AND waf.action:"Allowed" AND (waf.signature:*xss* OR waf.signature:*csrf* OR (waf.signature:*cross* AND waf.signature:*site*))) OR (event_type:("proxy" OR "webserver") AND (uri:*=\<script\>* OR uri:*=%3cscript%3e* OR uri:*=%253cscript%253e* OR uri:*\<iframe\ * OR uri:*%3ciframe\ * OR uri:*\<svg\ * OR uri:*%3csvg\ * OR uri:*document.cookie* OR uri:*document.domain* OR uri:*\ onerror\=* OR uri:*\ onresize\=* OR uri:*\ onload\=\\\"* OR uri:*onmouseover\=* OR uri:*$\{alert* OR uri:*javascript\:alert* OR uri:*javascript%3aalert* OR uri:*backurl\=*) AND NOT http.response.status_code:(4* OR 5*))
  sumo: "(_sourceCategory=*WAF* OR _sourceCategory=*IDS* OR _sourceCategory=*IPS* OR _sourceCategory=*webserver* OR _sourceCategory=*proxy* OR\
    \ _sourceCategory=*apache* OR _sourceCategory=*nginx* OR _sourceCategory=*iis*)\n| parse regex \"(?i)(?<action>allow|allowed|permit|permitted|block|blocked|deny|denied)\"\
    \ nodrop\n| parse regex \"(?i)(?<signature>[^\\s]*(?:xss|csrf|cross[^\\s]*site)[^\\s]*)\" nodrop\n| parse regex \"(?<uri_field>uri|url|request_uri|path|cs-uri-stem)[=:\\\
    s]+\\\"?(?<uri>[^\\\"?\\s]+)\" nodrop\n| parse regex \"(?<status_field>status|response_code|sc-status|http_status)[=:\\s]+\\\"?(?<response_code>\\\
    d{3})\" nodrop\n| where \n    (action matches \"*allow*\" AND (signature matches \"*xss*\" OR signature matches \"*csrf*\" OR (signature matches\
    \ \"*cross*\" AND signature matches \"*site*\")))\n    OR\n    (\n        (uri matches \"*=<script>*\" OR uri matches \"*=%3cscript%3e*\"\
    \ OR uri matches \"*=%253cscript%253e*\" OR uri matches \"*<iframe *\" OR uri matches \"*%3ciframe *\" OR uri matches \"*<svg *\" OR uri matches\
    \ \"*%3csvg *\" OR uri matches \"*document.cookie*\" OR uri matches \"*document.domain*\" OR uri matches \"* onerror=*\" OR uri matches \"\
    * onresize=*\" OR uri matches \"* onload=\\\\\\\"*\" OR uri matches \"*onmouseover=*\" OR uri matches \"*${alert*\" OR uri matches \"*javascript:alert*\"\
    \ OR uri matches \"*javascript%3aalert*\" OR uri matches \"*backurl=*\")\n        AND NOT (response_code matches \"4*\" OR response_code matches\
    \ \"5*\")\n    )\n| fields _messageTime, _sourceHost, _sourceCategory, action, signature, uri, response_code\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Web Application Firewall Event\nWhere Action is Allowed\nOR\n    Where the Signature contains \"xss\"\n\n    Where the Signature\
  \ contains \"csrf\"\n\n    Where the Signature contains \"cross\"\n    Where the Signature contains \"site\"\n\n--------------------------------------------------\n\
  \n1 Reverse Proxy/Webserver Event\nOR\n    Where the URI contains \"=<script>\"\n    \n    Where the URI contains \"=%3cscript%3e\"\n    \n\
  \    Where the URI contains \"=%253cscript%253e\"\n    \n    Where the URI contains \"<iframe \"\n    \n    Where the URI contains \"%3ciframe\
  \ \"\n    \n    Where the URI contains \"<svg \"\n    \n    Where the URI contains \"%3csvg \"\n    \n    Where the URI contains \"document.cookie\"\
  \n    \n    Where the URI contains \"document.domain\"\n    \n    Where the URI contains \" onerror=\"\n    \n    Where the URI contains \"\
  \ onresize=\"\n    \n    Where the URI contains \" onload=\\\"\"\n    \n    Where the URI contains \"onmouseover=\"\n    \n    Where the URI\
  \ contains \"${alert\"\n    \n    Where the URI contains \"javascript:alert\"\n    \n    Where the URI contains \"javascript%3aalert\"\n   \
  \ \n    Where the URI contains \"backurl=\"\n\nWhere the Response Code does NOT start with \"4\"\nWhere the Response Code does NOT start with\
  \ \"5\""
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000294
v4_id: 000294
name: Okta User Attempted to Access Unauthorized App
description: Detect when an Okta user is denied access to an app.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=okta eventType="app.generic.unauth_app_access_attempt"

    | table _time, user, src_ip, app, eventType, outcome.result, outcome.reason

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(24h)
    | where eventType_s == "app.generic.unauth_app_access_attempt"
    | project TimeGenerated, actor_alternateId_s, actor_displayName_s, client_ipAddress_s, client_userAgent_browser_s, client_geographicalContext_city_s, client_geographicalContext_country_s, target_displayName_s, outcome_reason_s
  aql: |
    SELECT eventtime, username, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS log_source, qidname(qid) AS event_name
    FROM events
    WHERE qidname(qid) ILIKE '%app.generic.unauth_app_access_attempt%' OR qidname(qid) = 'app.generic.unauth_app_access_attempt'
    LAST 24 HOURS
  yara_l: "rule okta_unauthorized_app_access_attempt {\n  meta:\n    author = \"TDL\"\n    description = \"Detects unauthorized application access\
    \ attempts in Okta\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"Medium\"\n  \
    \  \n  events:\n    $e.metadata.vendor_name = \"OKTA\"\n    $e.metadata.product_event_type = \"app.generic.unauth_app_access_attempt\"\n \
    \   $e.principal.user.userid = $user\n    $e.principal.ip = $src_ip\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-okta*
    | WHERE event.action == "app.generic.unauth_app_access_attempt"
    | KEEP @timestamp, user.name, user.email, source.ip, okta.actor.alternate_id, okta.target.display_name, event.outcome, okta.debug_context.debug_data.requestUri
  leql: |
    where(source_json.eventType="app.generic.unauth_app_access_attempt")
  crowdstrike: |
    #repo=okta eventType="app.generic.unauth_app_access_attempt"
    | table([@timestamp, actor.alternateId, actor.displayName, client.ipAddress, client.userAgent.rawUserAgent, target.displayName, outcome.reason])
  xql: |
    dataset = okta_raw_logs
    | filter event_type = "app.generic.unauth_app_access_attempt"
    | fields _time, actor_display_name, actor_alternate_id, client_ip_address, target_display_name, outcome_result, outcome_reason
  lucene: |
    eventType:"app.generic.unauth_app_access_attempt"
  sumo: |
    _sourceCategory=*Okta*
    | json field=_raw "eventType" as event_type
    | where event_type = "app.generic.unauth_app_access_attempt"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Okta Event

  Where Event Type is "app.generic.unauth_app_access_attempt"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

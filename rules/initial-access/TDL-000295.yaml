rule_id: TDL-AUTH-000295
v4_id: 000295
name: Okta Administrator Access Granted
description: Detects Okta administrator access being granted. This is where policies are set, users are managed, and apps are controlled.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Okta
data_sources:
- Okta
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=okta eventType="user.account.privilege.grant"

    | table _time, user, actor.displayName, target.displayName, outcome.result, client.ipAddress, client.geographicalContext.city, client.geographicalContext.country

    '
  kql: |
    OktaSSO
    | where TimeGenerated > ago(1h)
    | where eventType_s == "user.account.privilege.grant"
    | project TimeGenerated, actor_alternateId_s, actor_displayName_s, target_s, client_ipAddress_s, client_geographicalContext_city_s, client_geographicalContext_state_s, client_geographicalContext_country_s, outcome_result_s, outcome_reason_s
  aql: |
    SELECT eventtime, username, sourceip, destinationip, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid), "Event Type"
    FROM events
    WHERE "Event Type" = 'User.Account.Privilege.Grant'
    LAST 24 HOURS
  yara_l: |
    rule okta_privilege_grant {
      meta:
        author = "Detection Engineer"
        description = "Detects Okta privilege grant events - MITRE T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Okta"
        $e.metadata.product_event_type = "user.account.privilege.grant"
        $e.target.user.userid = $user
        $e.principal.hostname = $host

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-okta*
    | WHERE event.action == "user.account.privilege.grant"
    | KEEP @timestamp, event.action, user.name, okta.actor.id, okta.actor.display_name, okta.target.id, okta.target.display_name, okta.client.ip, okta.client.user_agent.raw_user_agent
  leql: |
    where(source_json.eventType="user.account.privilege.grant")
  crowdstrike: |
    #repo=okta eventType="user.account.privilege.grant"
    | table([@timestamp, actor.alternateId, actor.displayName, target.alternateId, target.displayName, outcome.result, client.ipAddress, client.geographicalContext.city, client.geographicalContext.country])
  xql: |
    dataset = okta_raw_logs
    | filter event_type = "user.account.privilege.grant"
    | fields _time, actor_user, target_user, client_ip, event_outcome
  lucene: |
    eventType:"user.account.privilege.grant"
  sumo: |
    _sourceCategory=*Okta* "user.account.privilege.grant"
    | json field=_raw "eventType" as event_type
    | where event_type = "user.account.privilege.grant"
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Okta Event

  Where Event Type is "User.Account.Privilege.Grant"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000308
v4_id: 000308
name: Anonymous S3 Access Detected - GuardDuty
description: Detects when a user is authenticating to a bucket through the AWS API without credentials
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty eventType="Policy:S3/BucketAnonymousAccessGranted"

    | table _time, accountId, region, resource.s3BucketDetails.name, severity, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where parse_json(Title) has "Policy:S3/BucketAnonymousAccessGranted" or Type == "Policy:S3/BucketAnonymousAccessGranted"
    | project TimeGenerated, Title, Type, Severity, Description, AccountId, Region, ResourceType = tostring(parse_json(Resource).resourceType), ResourceId = tostring(parse_json(Resource).s3BucketDetails[0].name), parse_json(Resource)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, "eventType" AS event_type, "resourceType", "resource.s3BucketDetails.name" AS bucket_name, "resource.s3BucketDetails.arn" AS bucket_arn, "severity", "title", "description"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "eventType" = 'Policy:S3/BucketAnonymousAccessGranted'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_s3_bucket_anonymous_access {
      meta:
        author = "Detection Engineering"
        description = "Detects GuardDuty finding for S3 bucket anonymous access granted"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "AMAZON"
        $e.metadata.product_name = "AWS GuardDuty"
        $e.metadata.product_event_type = "Policy:S3/BucketAnonymousAccessGranted"
        $e.target.resource.name = $bucket

      match:
        $bucket over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action == "Policy:S3/BucketAnonymousAccessGranted"
    | KEEP @timestamp, cloud.account.id, aws.guardduty.resource.s3_bucket_details.name, aws.guardduty.severity, event.id, cloud.region
  leql: |
    where(source_json.type="Policy:S3/BucketAnonymousAccessGranted")
  crowdstrike: |
    #type=guardduty detail.type="Policy:S3/BucketAnonymousAccessGranted"
    | table([@timestamp, detail.resource.s3BucketDetails.name, detail.resource.s3BucketDetails.arn, detail.severity, account, region])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AWS and event_type = "Policy:S3/BucketAnonymousAccessGranted"
    | fields _time, cloud_provider, event_type, resource, actor_effective_username, agent_id
  lucene: |
    event.type:"Policy:S3/BucketAnonymousAccessGranted"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Policy:S3/BucketAnonymousAccessGranted")
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Guard Duty Event

  Where the Event Type is in ["Policy:S3/BucketAnonymousAccessGranted"]'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000328
v4_id: 000328
name: Anomalous IAM User Activity Detected - GuardDuty
description: Detects when GuardDuty alerts on anomalous IAM activity within an AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"CredentialAccess:IAMUser/AnomalousBehavior\" OR type=\"DefenseEvasion:IAMUser/AnomalousBehavior\"\
    \ OR type=\"Discovery:IAMUser/AnomalousBehavior\" OR type=\"Exfiltration:IAMUser/AnomalousBehavior\" OR type=\"Impact:IAMUser/AnomalousBehavior\"\
    \ OR type=\"InitialAccess:IAMUser/AnomalousBehavior\" OR type=\"Persistence:IAMUser/AnomalousBehavior\" OR type=\"PrivilegeEscalation:IAMUser/AnomalousBehavior\"\
    )\n| table _time, type, severity, accountId, region, resource.accessKeyDetails.userName, resource.accessKeyDetails.principalId, service.action.actionType,\
    \ title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("CredentialAccess:IAMUser/AnomalousBehavior", "DefenseEvasion:IAMUser/AnomalousBehavior", "Discovery:IAMUser/AnomalousBehavior", "Exfiltration:IAMUser/AnomalousBehavior", "Impact:IAMUser/AnomalousBehavior", "InitialAccess:IAMUser/AnomalousBehavior", "Persistence:IAMUser/AnomalousBehavior", "PrivilegeEscalation:IAMUser/AnomalousBehavior")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, Resource
  aql: |
    SELECT "Event Type", username, sourceip, "AWS Account ID", COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" IN ('CredentialAccess:IAMUser/AnomalousBehavior', 'DefenseEvasion:IAMUser/AnomalousBehavior', 'Discovery:IAMUser/AnomalousBehavior', 'Exfiltration:IAMUser/AnomalousBehavior', 'Impact:IAMUser/AnomalousBehavior', 'InitialAccess:IAMUser/AnomalousBehavior', 'Persistence:IAMUser/AnomalousBehavior', 'PrivilegeEscalation:IAMUser/AnomalousBehavior')
    GROUP BY "Event Type", username, sourceip, "AWS Account ID"
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_iam_anomalous_behavior {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty IAM user anomalous behavior findings across multiple MITRE tactics"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "CredentialAccess:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "DefenseEvasion:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "Discovery:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "Exfiltration:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "Impact:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "InitialAccess:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "Persistence:IAMUser/AnomalousBehavior" or
          $e.metadata.product_event_type = "PrivilegeEscalation:IAMUser/AnomalousBehavior"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action IN ("CredentialAccess:IAMUser/AnomalousBehavior", "DefenseEvasion:IAMUser/AnomalousBehavior", "Discovery:IAMUser/AnomalousBehavior", "Exfiltration:IAMUser/AnomalousBehavior", "Impact:IAMUser/AnomalousBehavior", "InitialAccess:IAMUser/AnomalousBehavior", "Persistence:IAMUser/AnomalousBehavior", "PrivilegeEscalation:IAMUser/AnomalousBehavior")
    | KEEP @timestamp, event.action, user.name, cloud.account.id, aws.guardduty.severity, source.ip, cloud.region
  leql: |
    where(source_json.type IN ["CredentialAccess:IAMUser/AnomalousBehavior", "DefenseEvasion:IAMUser/AnomalousBehavior", "Discovery:IAMUser/AnomalousBehavior", "Exfiltration:IAMUser/AnomalousBehavior", "Impact:IAMUser/AnomalousBehavior", "InitialAccess:IAMUser/AnomalousBehavior", "Persistence:IAMUser/AnomalousBehavior", "PrivilegeEscalation:IAMUser/AnomalousBehavior"])
  crowdstrike: |
    #type=guardduty (detail.type="CredentialAccess:IAMUser/AnomalousBehavior" OR detail.type="DefenseEvasion:IAMUser/AnomalousBehavior" OR detail.type="Discovery:IAMUser/AnomalousBehavior" OR detail.type="Exfiltration:IAMUser/AnomalousBehavior" OR detail.type="Impact:IAMUser/AnomalousBehavior" OR detail.type="InitialAccess:IAMUser/AnomalousBehavior" OR detail.type="Persistence:IAMUser/AnomalousBehavior" OR detail.type="PrivilegeEscalation:IAMUser/AnomalousBehavior")
    | table([@timestamp, detail.type, detail.resource.accessKeyDetails.userName, detail.resource.accessKeyDetails.principalId, detail.accountId, detail.region, detail.severity, detail.description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and event_source = "guardduty.amazonaws.com"
    | filter resource_type in ("CredentialAccess:IAMUser/AnomalousBehavior", "DefenseEvasion:IAMUser/AnomalousBehavior", "Discovery:IAMUser/AnomalousBehavior", "Exfiltration:IAMUser/AnomalousBehavior", "Impact:IAMUser/AnomalousBehavior", "InitialAccess:IAMUser/AnomalousBehavior", "Persistence:IAMUser/AnomalousBehavior", "PrivilegeEscalation:IAMUser/AnomalousBehavior")
    | fields _time, cloud_provider, event_source, resource_type, actor_user, resource_sub_type, raw_log
  lucene: |
    eventName:"GuardDuty" AND eventType:("CredentialAccess:IAMUser/AnomalousBehavior" OR "DefenseEvasion:IAMUser/AnomalousBehavior" OR "Discovery:IAMUser/AnomalousBehavior" OR "Exfiltration:IAMUser/AnomalousBehavior" OR "Impact:IAMUser/AnomalousBehavior" OR "InitialAccess:IAMUser/AnomalousBehavior" OR "Persistence:IAMUser/AnomalousBehavior" OR "PrivilegeEscalation:IAMUser/AnomalousBehavior")
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:IAMUser/AnomalousBehavior", "DefenseEvasion:IAMUser/AnomalousBehavior", "Discovery:IAMUser/AnomalousBehavior", "Exfiltration:IAMUser/AnomalousBehavior", "Impact:IAMUser/AnomalousBehavior", "InitialAccess:IAMUser/AnomalousBehavior", "Persistence:IAMUser/AnomalousBehavior", "PrivilegeEscalation:IAMUser/AnomalousBehavior")
    | json field=_raw "resource.accessKeyDetails.userName" as user_name
    | json field=_raw "accountId" as account_id
    | json field=_raw "region" as region
    | json field=_raw "severity" as severity
    | fields _messageTime, account_id, region, user_name, event_type, severity
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:IAMUser/AnomalousBehavior\", \"DefenseEvasion:IAMUser/AnomalousBehavior\"\
  , \"Discovery:IAMUser/AnomalousBehavior\", \"Exfiltration:IAMUser/AnomalousBehavior\", \"Impact:IAMUser/AnomalousBehavior\", \"InitialAccess:IAMUser/AnomalousBehavior\"\
  , \"Persistence:IAMUser/AnomalousBehavior\", \"PrivilegeEscalation:IAMUser/AnomalousBehavior\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000331
v4_id: '000331'
name: AWS IAM User Activity from Threat Host - GuardDuty
description: Detects when IAM activity from a known threat is seen within AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=* sourcetype=aws:cloudwatch:guardduty \n(detail.type=\"Recon:IAMUser/MaliciousIPCaller\" OR detail.type=\"Recon:IAMUser/MaliciousIPCaller.Custom\"\
    \ OR detail.type=\"UnauthorizedAccess:IAMUser/MaliciousIPCaller\" OR detail.type=\"UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom\")\n\
    | table _time, detail.type, detail.resource.accessKeyDetails.userName, detail.resource.accessKeyDetails.principalId, detail.service.action.actionType,\
    \ detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4, detail.service.action.awsApiCallAction.remoteIpDetails.organization.asn,\
    \ detail.severity, detail.region, detail.accountId\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, AwsAccountId, Region, ResourceType, UserName, IpAddress, City, Country
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, qidname(qid) AS event_name, \"finding.type\" AS finding_type, \"resource.accessKeyDetails.userName\"\
    \ AS username, sourceip, \"severity\" AS severity, \"service.action.awsApiCallAction.api\" AS api_call\nFROM events\nWHERE LOGSOURCENAME(logsourceid)\
    \ ILIKE '%guardduty%'\n  AND (\"finding.type\" = 'Recon:IAMUser/MaliciousIPCaller' \n       OR \"finding.type\" = 'Recon:IAMUser/MaliciousIPCaller.Custom'\n\
    \       OR \"finding.type\" = 'UnauthorizedAccess:IAMUser/MaliciousIPCaller'\n       OR \"finding.type\" = 'UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom')\n\
    LAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_iam_malicious_ip_caller {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings for IAM user activity from malicious IP addresses"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "Recon:IAMUser/MaliciousIPCaller" or
          $e.metadata.product_event_type = "Recon:IAMUser/MaliciousIPCaller.Custom" or
          $e.metadata.product_event_type = "UnauthorizedAccess:IAMUser/MaliciousIPCaller" or
          $e.metadata.product_event_type = "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom"
        )
        $e.target.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user, $ip over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom")
    | KEEP @timestamp, event.type, cloud.account.id, user.name, source.ip, aws.guardduty.severity, event.id
  leql: |
    where(source_json.type IN ["Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom"])
  crowdstrike: |
    #repo=guardduty type IN ["Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom"]
    | table([@timestamp, type, service.action.awsApiCallAction.api, resource.accessKeyDetails.userName, resource.accessKeyDetails.userType, service.action.awsApiCallAction.remoteIpDetails.ipAddressV4, service.action.awsApiCallAction.remoteIpDetails.organization.asn, service.action.awsApiCallAction.remoteIpDetails.country.countryName, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and log_name = "GuardDuty"
    | filter action_finding_type in ("Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom")
    | fields _time, cloud_provider, action_finding_type, action_finding_severity, identity_name, src_ip_v4, action_finding_description
  lucene: |
    event.type:"guardduty" AND finding.type:("Recon:IAMUser/MaliciousIPCaller" OR "Recon:IAMUser/MaliciousIPCaller.Custom" OR "UnauthorizedAccess:IAMUser/MaliciousIPCaller" OR "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "detail.type" as event_type
    | where event_type in ("Recon:IAMUser/MaliciousIPCaller", "Recon:IAMUser/MaliciousIPCaller.Custom", "UnauthorizedAccess:IAMUser/MaliciousIPCaller", "UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom")
    | json field=_raw "detail.resource.accessKeyDetails.userName" as user_name
    | json field=_raw "detail.resource.accessKeyDetails.principalId" as principal_id
    | json field=_raw "detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4" as source_ip
    | json field=_raw "detail.severity" as severity
    | json field=_raw "detail.accountId" as account_id
    | fields _messageTime, account_id, event_type, user_name, principal_id, source_ip, severity
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- thr
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Recon:IAMUser/MaliciousIPCaller\", \"Recon:IAMUser/MaliciousIPCaller.Custom\"\
  , \"UnauthorizedAccess:IAMUser/MaliciousIPCaller\", \"UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

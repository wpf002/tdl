rule_id: TDL-AUTH-000335
v4_id: '000335'
name: AWS IAM User Activity from TOR Exit Node - GuardDuty
description: Detects when IAM activity from a known Tor exit node is seen within AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=* sourcetype=aws:cloudwatchlogs:guardduty (finding.type="Recon:IAMUser/TorIPCaller" OR finding.type="UnauthorizedAccess:IAMUser/TorIPCaller")

    | table _time, finding.type, finding.severity, finding.accountId, finding.resource.accessKeyDetails.userName, finding.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4,
    finding.service.action.awsApiCallAction.api, finding.description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("Recon:IAMUser/TorIPCaller", "UnauthorizedAccess:IAMUser/TorIPCaller")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, ResourceType, UserName, IpAddress = tostring(parse_json(ServiceAction).networkConnectionAction.remoteIpDetails.ipAddressV4), City = tostring(parse_json(ServiceAction).networkConnectionAction.remoteIpDetails.city.cityName), Country = tostring(parse_json(ServiceAction).networkConnectionAction.remoteIpDetails.country.countryName)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, sourceip, username, "aws.guardduty.type" AS event_type, "aws.guardduty.severity"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND ("aws.guardduty.type" = 'Recon:IAMUser/TorIPCaller' OR "aws.guardduty.type" = 'UnauthorizedAccess:IAMUser/TorIPCaller')
    LAST 24 HOURS
  yara_l: "rule aws_tor_ip_caller_guardduty {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS IAM user activity from Tor IP addresses\
    \ via GuardDuty\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\n    \n \
    \ events:\n    $e.metadata.vendor_name = \"AMAZON\"\n    $e.metadata.product_name = \"AWS GuardDuty\"\n    (\n      $e.metadata.product_event_type\
    \ = \"Recon:IAMUser/TorIPCaller\" or\n      $e.metadata.product_event_type = \"UnauthorizedAccess:IAMUser/TorIPCaller\"\n    )\n    $e.target.user.userid\
    \ = $user\n    $e.principal.ip = $ip\n    \n  match:\n    $user over 1h\n    \n  outcome:\n    $risk_score = 85\n    \n  condition:\n    $e\n\
    }\n"
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Recon:IAMUser/TorIPCaller", "UnauthorizedAccess:IAMUser/TorIPCaller")
    | KEEP @timestamp, cloud.account.id, user.name, source.ip, event.type, event.action, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["Recon:IAMUser/TorIPCaller", "UnauthorizedAccess:IAMUser/TorIPCaller"])
  crowdstrike: |
    #repo=guardduty (detail.type="Recon:IAMUser/TorIPCaller" OR detail.type="UnauthorizedAccess:IAMUser/TorIPCaller")
    | table([@timestamp, detail.type, detail.resource.accessKeyDetails.userName, detail.resource.accessKeyDetails.accessKeyId, detail.service.action.awsApiCallAction.remoteIpDetails.ipAddressV4, detail.accountId, detail.region])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "Amazon GuardDuty"
    | filter raw_log contains "Recon:IAMUser/TorIPCaller" or raw_log contains "UnauthorizedAccess:IAMUser/TorIPCaller"
    | fields _time, cloud_provider, vendor_name, actor_user, resource_type, resource_sub_type, raw_log
  lucene: |
    eventName:"GuardDuty Finding" AND (finding.type:"Recon:IAMUser/TorIPCaller" OR finding.type:"UnauthorizedAccess:IAMUser/TorIPCaller")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _sourceCategory=*AWS*
    | json field=_raw "type" as event_type
    | where event_type in ("Recon:IAMUser/TorIPCaller", "UnauthorizedAccess:IAMUser/TorIPCaller")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Recon:IAMUser/TorIPCaller\", \"UnauthorizedAccess:IAMUser/TorIPCaller\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000336
v4_id: '000336'
name: AWS S3 Activity from TOR Exit Node - GuardDuty
description: Detects when S3 activity from a known Tor exit node is seen within AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"Discovery:S3/TorIPCaller\" OR type=\"UnauthorizedAccess:S3/TorIPCaller\")\n| table\
    \ _time, type, region, accountId, resource.resourceType, resource.s3BucketDetails.name, service.action.actionType, severity, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where Title in ("Discovery:S3/TorIPCaller", "UnauthorizedAccess:S3/TorIPCaller")
    | project TimeGenerated, Title, Description, AccountId, Region, ResourceType, Severity, SourceIpAddress = tostring(parse_json(tostring(AdditionalData)).remoteIpDetails.ipAddressV4), UserName = tostring(parse_json(tostring(AdditionalData)).principalId)
  aql: "SELECT eventtime, sourceip, destinationip, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid), username, \"eventType\" AS\
    \ event_type, \"resource.resourceType\" AS resource_type, \"service.serviceName\" AS service_name\nFROM events\nWHERE LOGSOURCENAME(logsourceid)\
    \ ILIKE '%guardduty%' \n  AND (\"eventType\" = 'Discovery:S3/TorIPCaller' OR \"eventType\" = 'UnauthorizedAccess:S3/TorIPCaller')\nLAST 24\
    \ HOURS\n"
  yara_l: |
    rule aws_s3_access_from_tor {
      meta:
        author = "Detection Engineering"
        description = "Detects AWS S3 access attempts from Tor exit nodes via GuardDuty"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1580"
        severity = "Medium"

      events:
        $guardduty.metadata.vendor_name = "Amazon AWS"
        $guardduty.metadata.product_name = "GuardDuty"
        (
          $guardduty.metadata.product_event_type = "Discovery:S3/TorIPCaller" or
          $guardduty.metadata.product_event_type = "UnauthorizedAccess:S3/TorIPCaller"
        )
        $guardduty.principal.ip = $source_ip

      match:
        $source_ip over 5m

      condition:
        $guardduty
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Discovery:S3/TorIPCaller", "UnauthorizedAccess:S3/TorIPCaller")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, source.ip, aws.guardduty.resource.resource_type, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["Discovery:S3/TorIPCaller", "UnauthorizedAccess:S3/TorIPCaller"])
  crowdstrike: |
    #repo=guardduty (eventType="Discovery:S3/TorIPCaller" OR eventType="UnauthorizedAccess:S3/TorIPCaller")
    | table([@timestamp, eventType, accountId, region, resource.resourceType, resource.s3BucketDetails.name, service.action.actionType, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "AWS" and product = "GuardDuty"
    | filter finding_type in ("Discovery:S3/TorIPCaller", "UnauthorizedAccess:S3/TorIPCaller")
    | fields _time, cloud_provider, vendor, product, finding_type, severity, resource_name, actor_user_name, src_ip_address, region
  lucene: |
    event.type:("Discovery:S3/TorIPCaller" OR "UnauthorizedAccess:S3/TorIPCaller")
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*aws* ("Discovery:S3/TorIPCaller" OR "UnauthorizedAccess:S3/TorIPCaller")
    | json field=_raw "type" as event_type
    | where event_type in ("Discovery:S3/TorIPCaller", "UnauthorizedAccess:S3/TorIPCaller")
    | fields _messageTime, _sourceHost, event_type, _raw
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Discovery:S3/TorIPCaller\", \"UnauthorizedAccess:S3/TorIPCaller\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

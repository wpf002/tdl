rule_id: TDL-AUTH-000337
v4_id: '000337'
name: AWS Kubernetes Activity from TOR Exit Node - GuardDuty
description: Detects when Kubernetes activity from a known Tor exit node is seen within AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1580
technique_name: Cloud Infrastructure Discovery
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(type=\"CredentialAccess:Kubernetes/TorIPCaller\" OR type=\"DefenseEvasion:Kubernetes/TorIPCaller\"\
    \ OR type=\"Discovery:Kubernetes/TorIPCaller\" OR type=\"Impact:Kubernetes/TorIPCaller\" OR type=\"Persistence:Kubernetes/TorIPCaller\")\n\
    | table _time, type, severity, accountId, region, resource.resourceType, resource.eksClusterDetails.name, service.action.actionType, service.action.kubernetesApiCallAction.remoteIpDetails.ipAddressV4,\
    \ service.action.kubernetesApiCallAction.requestUri, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType in ("CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller")
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, Region, ResourceType, AwsResourceId, IpAddress, UserAgent
  aql: |
    SELECT eventtime, sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), "event.type" AS event_type, "event.severity" AS severity
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND ("event.type" IN ('CredentialAccess:Kubernetes/TorIPCaller', 'DefenseEvasion:Kubernetes/TorIPCaller', 'Discovery:Kubernetes/TorIPCaller', 'Impact:Kubernetes/TorIPCaller', 'Persistence:Kubernetes/TorIPCaller')
           OR qidname(qid) IN ('CredentialAccess:Kubernetes/TorIPCaller', 'DefenseEvasion:Kubernetes/TorIPCaller', 'Discovery:Kubernetes/TorIPCaller', 'Impact:Kubernetes/TorIPCaller', 'Persistence:Kubernetes/TorIPCaller'))
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_tor_ip_caller_kubernetes {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty alerts for Kubernetes API calls from Tor exit nodes"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1580"
        platform = "AWS"
        data_source = "AWS GuardDuty"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "CredentialAccess:Kubernetes/TorIPCaller" or
          $e.metadata.product_event_type = "DefenseEvasion:Kubernetes/TorIPCaller" or
          $e.metadata.product_event_type = "Discovery:Kubernetes/TorIPCaller" or
          $e.metadata.product_event_type = "Impact:Kubernetes/TorIPCaller" or
          $e.metadata.product_event_type = "Persistence:Kubernetes/TorIPCaller"
        )
        $e.principal.ip = $src_ip
        $e.target.resource.name = $cluster

      match:
        $src_ip, $cluster over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller")
    | KEEP @timestamp, cloud.account.id, cloud.region, source.ip, event.type, event.action, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller"])
  crowdstrike: |
    #repo=guardduty event.type IN ["CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller"]
    | table([@timestamp, event.type, ComputerName, resource.type, severity, description])
  xql: |
    dataset = aws_guardduty_raw
    | filter event_type in ("CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller")
    | fields _time, event_type, account_id, region, resource_type, severity
  lucene: |
    event.type:"guardduty" AND (event.action:"CredentialAccess:Kubernetes/TorIPCaller" OR event.action:"DefenseEvasion:Kubernetes/TorIPCaller" OR event.action:"Discovery:Kubernetes/TorIPCaller" OR event.action:"Impact:Kubernetes/TorIPCaller" OR event.action:"Persistence:Kubernetes/TorIPCaller")
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:Kubernetes/TorIPCaller", "DefenseEvasion:Kubernetes/TorIPCaller", "Discovery:Kubernetes/TorIPCaller", "Impact:Kubernetes/TorIPCaller", "Persistence:Kubernetes/TorIPCaller")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:Kubernetes/TorIPCaller\", \"DefenseEvasion:Kubernetes/TorIPCaller\"\
  , \"Discovery:Kubernetes/TorIPCaller\", \"Impact:Kubernetes/TorIPCaller\", \"Persistence:Kubernetes/TorIPCaller\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

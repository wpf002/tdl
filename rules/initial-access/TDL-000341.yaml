rule_id: TDL-AUTH-000341
v4_id: '000341'
name: AWS DNS Request to Suspicious Domain - GuardDuty
description: Detects when an EC2 instance is attempting to query a domain that could to be tied to malicious activity.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1189
technique_name: Drive-by Compromise
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=aws sourcetype=aws:cloudwatch:guardduty \n(finding.type=\"Impact:EC2/SuspiciousDomainRequest.Reputation\" OR finding.type=\"Impact:Runtime/SuspiciousDomainRequest.Reputation\"\
    )\n| table _time, finding.type, finding.severity, resource.instanceDetails.instanceId, resource.instanceDetails.networkInterfaces{}.privateIpAddress,\
    \ service.action.dnsRequestAction.domain, finding.description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title in ("Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation")
    | project TimeGenerated, Title, Description, AccountId, Region, ResourceType, Severity, AwsResourceId = tostring(parse_json(Resource).ResourceType), RemoteIpDetails = tostring(parse_json(Service).Action.NetworkConnectionAction.RemoteIpDetails)
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, sourceip, destinationip, "eventType", "severity", "title", "description"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND ("eventType" IN ('Impact:EC2/SuspiciousDomainRequest.Reputation', 'Impact:Runtime/SuspiciousDomainRequest.Reputation')
           OR "finding.type" IN ('Impact:EC2/SuspiciousDomainRequest.Reputation', 'Impact:Runtime/SuspiciousDomainRequest.Reputation')
           OR qidname(qid) ILIKE '%SuspiciousDomainRequest.Reputation%')
    LAST 24 HOURS
  yara_l: "rule guardduty_suspicious_domain_request {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects AWS GuardDuty\
    \ alerts for suspicious domain requests indicating potential drive-by compromise\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1189\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"Amazon AWS\"\n    $e.metadata.product_name = \"\
    GuardDuty\"\n    (\n      $e.metadata.product_event_type = \"Impact:EC2/SuspiciousDomainRequest.Reputation\" or\n      $e.metadata.product_event_type\
    \ = \"Impact:Runtime/SuspiciousDomainRequest.Reputation\"\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over 5m\n \
    \   \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation")
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding.type, aws.guardduty.finding.severity, cloud.instance.id, source.ip, destination.ip, destination.domain
  leql: |
    where(source_json.type IN ["Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation"])
  crowdstrike: |
    #repo=guardduty
    | detail.type in ["Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation"]
    | table([@timestamp, detail.type, detail.resource.instanceDetails.instanceId, detail.service.action.dnsRequestAction.domain, detail.region, account])
  xql: |
    dataset = cloud_audit_logs
    | filter logtype_vendor = "Amazon" and logtype_product = "GuardDuty"
    | filter cloud_provider_event_type in ("Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation")
    | fields _time, cloud_provider, cloud_provider_event_type, event_id, resource_name, resource_sub_type, severity
  lucene: |
    service.type:"guardduty" AND finding.type:("Impact:EC2/SuspiciousDomainRequest.Reputation" OR "Impact:Runtime/SuspiciousDomainRequest.Reputation")
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Impact:EC2/SuspiciousDomainRequest.Reputation", "Impact:Runtime/SuspiciousDomainRequest.Reputation")
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Impact:EC2/SuspiciousDomainRequest.Reputation\", \"Impact:Runtime/SuspiciousDomainRequest.Reputation\"\
  ]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

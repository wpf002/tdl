rule_id: TDL-AUTH-000343
v4_id: '000343'
name: AWS DNS Rebinding - GuardDuty
description: Detects when an EC2 instance is s querying a domain that resolves to the EC2 metadata IP address (169.254.169.254). A DNS query of
  this kind may indicate that the instance is a target of a DNS rebinding technique. This technique can be used to obtain metadata from an EC2
  instance, including the IAM credentials associated with the instance. DNS rebinding involves tricking an application running on the EC2 instance
  to load return data from a URL, where the domain name in the URL resolves to the EC2 metadata IP address (169.254.169.254). This causes the
  application to access EC2 metadata and possibly make it available to the attacker. It is possible to access EC2 metadata using DNS rebinding
  only if the EC2 instance is running a vulnerable application that allows injection of URLs, or if someone accesses the URL in a web browser
  running on the EC2 instance.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=aws sourcetype=aws:cloudwatchlogs:guardduty \n(type=\"UnauthorizedAccess:EC2/MetadataDNSRebind\" OR type=\"UnauthorizedAccess:Runtime/MetadataDNSRebind\"\
    )\n| table _time, type, region, accountId, resource.instanceDetails.instanceId, service.action.actionType, severity, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("UnauthorizedAccess:EC2/MetadataDNSRebind", "UnauthorizedAccess:Runtime/MetadataDNSRebind")
    | project TimeGenerated, Type, Severity, AccountId, Region, ResourceType, Title, Description
  aql: "SELECT eventtime, sourceip, destinationip, LOGSOURCENAME(logsourceid) AS source, qidname(qid) AS event_name, \"finding.type\" AS finding_type,\
    \ \"resource.instanceDetails.instanceId\" AS instance_id, \"service.action.networkConnectionAction.remoteIpDetails.ipAddressV4\" AS remote_ip\n\
    FROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%' \n  AND (\"finding.type\" = 'UnauthorizedAccess:EC2/MetadataDNSRebind' OR\
    \ \"finding.type\" = 'UnauthorizedAccess:Runtime/MetadataDNSRebind')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_metadata_dns_rebind {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty alerts for Metadata DNS Rebind attacks indicating potential SSRF exploitation (T1190)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1190"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        (
          $e.metadata.product_event_type = "UnauthorizedAccess:EC2/MetadataDNSRebind" or
          $e.metadata.product_event_type = "UnauthorizedAccess:Runtime/MetadataDNSRebind"
        )
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action IN ("UnauthorizedAccess:EC2/MetadataDNSRebind", "UnauthorizedAccess:Runtime/MetadataDNSRebind")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.action, event.severity, aws.guardduty.resource.instance_details.instance_id, source.ip, event.id
  leql: |
    where(source_json.type IN ["UnauthorizedAccess:EC2/MetadataDNSRebind", "UnauthorizedAccess:Runtime/MetadataDNSRebind"])
  crowdstrike: |
    #repo=guardduty eventType IN ["UnauthorizedAccess:EC2/MetadataDNSRebind", "UnauthorizedAccess:Runtime/MetadataDNSRebind"]
    | table([@timestamp, accountId, region, eventType, severity, resource.instanceDetails.instanceId, resource.instanceDetails.imageId, service.action.awsApiCallAction.remoteIpDetails.ipAddressV4, title, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "AWS" and event_type = "GuardDuty Finding"
    | filter raw_log contains "UnauthorizedAccess:EC2/MetadataDNSRebind" or raw_log contains "UnauthorizedAccess:Runtime/MetadataDNSRebind"
    | fields _time, cloud_provider, vendor, event_type, raw_log
  lucene: |
    event.provider:guardduty AND event.type:(UnauthorizedAccess:EC2/MetadataDNSRebind OR UnauthorizedAccess:Runtime/MetadataDNSRebind)
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "type" as event_type
    | where event_type in ("UnauthorizedAccess:EC2/MetadataDNSRebind", "UnauthorizedAccess:Runtime/MetadataDNSRebind")
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"UnauthorizedAccess:EC2/MetadataDNSRebind\", \"UnauthorizedAccess:Runtime/MetadataDNSRebind\"\
  ]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

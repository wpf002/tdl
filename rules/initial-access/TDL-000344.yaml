rule_id: TDL-AUTH-000344
v4_id: '000344'
name: AWS IAM User Hacktool Activity - GuardDuty
description: Detects when IAM activity from a known threat is seen within AWS instance
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty (detail.type="PenTest:IAMUser/KaliLinux" OR detail.type="PenTest:IAMUser/ParrotLinux"
    OR detail.type="PenTest:IAMUser/PentooLinux")

    | table _time, detail.type, detail.resource.accessKeyDetails.userName, detail.resource.accessKeyDetails.principalId, detail.service.action.awsApiCallAction.api,
    detail.severity, detail.accountId

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where ActivityType in ("PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux")
    | project TimeGenerated, ActivityType, AccountId, Region, ResourceType, Title, Description, Severity, UserName = tostring(parse_json(Resource).AccessKeyDetails.UserName), PrincipalId = tostring(parse_json(Resource).AccessKeyDetails.PrincipalId)
  aql: |
    SELECT eventtime, "awsRegion", "userName", "resource.accessKeyDetails.userName" AS access_key_user, "type" AS event_type, "severity", "description", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCETYPE(devicetype) ILIKE '%guardduty%'
      AND "type" IN ('PenTest:IAMUser/KaliLinux', 'PenTest:IAMUser/ParrotLinux', 'PenTest:IAMUser/PentooLinux')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_pentest_tools_initial_access {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty findings indicating IAM user activity from penetration testing Linux distributions"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Amazon AWS"
        $e.metadata.product_name = "GuardDuty"
        (
          $e.metadata.product_event_type = "PenTest:IAMUser/KaliLinux" or
          $e.metadata.product_event_type = "PenTest:IAMUser/ParrotLinux" or
          $e.metadata.product_event_type = "PenTest:IAMUser/PentooLinux"
        )
        $e.target.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.action IN ("PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux")
    | KEEP @timestamp, cloud.account.id, user.name, source.ip, event.action, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux"])
  crowdstrike: |
    #repo=guardduty event_type IN ["PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux"]
    | table([@timestamp, event_type, account_id, user_name, source_ip, resource_type, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and log_type = "guardduty"
    | filter event_type in ("PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux")
    | fields _time, cloud_provider, event_type, identity_name, resource_name, raw_log
  lucene: |
    event.type:"PenTest:IAMUser/KaliLinux" OR event.type:"PenTest:IAMUser/ParrotLinux" OR event.type:"PenTest:IAMUser/PentooLinux"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("PenTest:IAMUser/KaliLinux", "PenTest:IAMUser/ParrotLinux", "PenTest:IAMUser/PentooLinux")
    | fields _messageTime, event_type, _sourceHost, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"PenTest:IAMUser/KaliLinux\", \"PenTest:IAMUser/ParrotLinux\", \"PenTest:IAMUser/PentooLinux\"\
  ]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

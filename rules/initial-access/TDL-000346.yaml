rule_id: TDL-AUTH-000346
v4_id: '000346'
name: Anonymous Kubernetes Access Detected - GuardDuty
description: Detects when a user is authenticating to Kubernetes API without credentials
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=* sourcetype=aws:cloudwatch:guardduty \n(detail.type=\"CredentialAccess:Kubernetes/SuccessfulAnonymousAccess\" OR detail.type=\"\
    DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess\" OR detail.type=\"Discovery:Kubernetes/SuccessfulAnonymousAccess\" OR detail.type=\"\
    Impact:Kubernetes/SuccessfulAnonymousAccess\" OR detail.type=\"Persistence:Kubernetes/SuccessfulAnonymousAccess\" OR detail.type=\"Policy:Kubernetes/AnonymousAccessGranted\"\
    )\n| table _time, detail.type, detail.severity, detail.accountId, detail.region, detail.resource.kubernetesDetails.kubernetesUserDetails.username,\
    \ detail.resource.kubernetesDetails.kubernetesWorkloadDetails.name, detail.service.action.kubernetesApiCallAction.requestUri\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("CredentialAccess:Kubernetes/SuccessfulAnonymousAccess", "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess", "Discovery:Kubernetes/SuccessfulAnonymousAccess", "Impact:Kubernetes/SuccessfulAnonymousAccess", "Persistence:Kubernetes/SuccessfulAnonymousAccess", "Policy:Kubernetes/AnonymousAccessGranted")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, ServiceName, AdditionalData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "Event Type", "AWS Account ID", "Resource Type", "Resource Name", sourceip, COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "Event Type" IN ('CredentialAccess:Kubernetes/SuccessfulAnonymousAccess', 'DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess', 'Discovery:Kubernetes/SuccessfulAnonymousAccess', 'Impact:Kubernetes/SuccessfulAnonymousAccess', 'Persistence:Kubernetes/SuccessfulAnonymousAccess', 'Policy:Kubernetes/AnonymousAccessGranted')
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), "Event Type", "AWS Account ID", "Resource Type", "Resource Name", sourceip
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_k8s_anonymous_access {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty alerts for anonymous access to Kubernetes clusters"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "AWS GuardDuty"
        $e.metadata.vendor_name = "Amazon"
        (
          $e.metadata.product_event_type = "CredentialAccess:Kubernetes/SuccessfulAnonymousAccess" or
          $e.metadata.product_event_type = "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess" or
          $e.metadata.product_event_type = "Discovery:Kubernetes/SuccessfulAnonymousAccess" or
          $e.metadata.product_event_type = "Impact:Kubernetes/SuccessfulAnonymousAccess" or
          $e.metadata.product_event_type = "Persistence:Kubernetes/SuccessfulAnonymousAccess" or
          $e.metadata.product_event_type = "Policy:Kubernetes/AnonymousAccessGranted"
        )
        $e.target.resource.name = $cluster
        $e.principal.ip = $source_ip

      match:
        $cluster, $source_ip over 1h

      outcome:
        $risk_score = max(75)

      condition:
        $e
    }
  esql: "FROM logs-aws.guardduty*\n| WHERE event.dataset == \"aws.guardduty\" \n  AND aws.guardduty.finding.type IN (\n    \"CredentialAccess:Kubernetes/SuccessfulAnonymousAccess\"\
    ,\n    \"DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess\",\n    \"Discovery:Kubernetes/SuccessfulAnonymousAccess\",\n    \"Impact:Kubernetes/SuccessfulAnonymousAccess\"\
    ,\n    \"Persistence:Kubernetes/SuccessfulAnonymousAccess\",\n    \"Policy:Kubernetes/AnonymousAccessGranted\"\n  )\n| KEEP @timestamp, cloud.account.id,\
    \ cloud.region, aws.guardduty.finding.type, aws.guardduty.finding.severity, aws.guardduty.finding.id, event.action, source.ip\n"
  leql: |
    where(source_json.type IN ["CredentialAccess:Kubernetes/SuccessfulAnonymousAccess", "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess", "Discovery:Kubernetes/SuccessfulAnonymousAccess", "Impact:Kubernetes/SuccessfulAnonymousAccess", "Persistence:Kubernetes/SuccessfulAnonymousAccess", "Policy:Kubernetes/AnonymousAccessGranted"])
  crowdstrike: "#repo=guardduty \n| detail.type IN [\"CredentialAccess:Kubernetes/SuccessfulAnonymousAccess\", \"DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess\"\
    , \"Discovery:Kubernetes/SuccessfulAnonymousAccess\", \"Impact:Kubernetes/SuccessfulAnonymousAccess\", \"Persistence:Kubernetes/SuccessfulAnonymousAccess\"\
    , \"Policy:Kubernetes/AnonymousAccessGranted\"]\n| table([@timestamp, detail.type, detail.resource.kubernetesDetails.kubernetesUserDetails.username,\
    \ detail.resource.kubernetesDetails.kubernetesWorkloadDetails.name, detail.accountId, detail.region])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and event_type = "GuardDuty"
    | filter action_finding_type in ("CredentialAccess:Kubernetes/SuccessfulAnonymousAccess", "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess", "Discovery:Kubernetes/SuccessfulAnonymousAccess", "Impact:Kubernetes/SuccessfulAnonymousAccess", "Persistence:Kubernetes/SuccessfulAnonymousAccess", "Policy:Kubernetes/AnonymousAccessGranted")
    | fields _time, action_finding_type, action_resource_cluster_name, action_kubernetes_service_action_type, action_kubernetes_user_details_username, cloud_provider_account_id
  lucene: |
    event.dataset:aws.guardduty AND guardduty.finding.type:("CredentialAccess:Kubernetes/SuccessfulAnonymousAccess" OR "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess" OR "Discovery:Kubernetes/SuccessfulAnonymousAccess" OR "Impact:Kubernetes/SuccessfulAnonymousAccess" OR "Persistence:Kubernetes/SuccessfulAnonymousAccess" OR "Policy:Kubernetes/AnonymousAccessGranted")
  sumo: |
    _sourceCategory=*GuardDuty*
    | json field=_raw "detail.type" as event_type
    | where event_type in ("CredentialAccess:Kubernetes/SuccessfulAnonymousAccess", "DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess", "Discovery:Kubernetes/SuccessfulAnonymousAccess", "Impact:Kubernetes/SuccessfulAnonymousAccess", "Persistence:Kubernetes/SuccessfulAnonymousAccess", "Policy:Kubernetes/AnonymousAccessGranted")
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:Kubernetes/SuccessfulAnonymousAccess\", \"DefenseEvasion:Kubernetes/SuccessfulAnonymousAccess\"\
  , \"Discovery:Kubernetes/SuccessfulAnonymousAccess\", \"Impact:Kubernetes/SuccessfulAnonymousAccess\", \"Persistence:Kubernetes/SuccessfulAnonymousAccess\"\
  , \"Policy:Kubernetes/AnonymousAccessGranted\"]"
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

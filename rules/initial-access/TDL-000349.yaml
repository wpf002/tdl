rule_id: TDL-AUTH-000349
v4_id: 000349
name: Admin Access Given to Default Service Account - GuardDuty
description: Detects when the default service account for a namespace in your Kubernetes cluster was granted admin privileges. Kubernetes creates
  a default service account for all the namespaces in the cluster. It automatically assigns the default service account as an identity to pods
  that have not been explicitly associated to another service account. If the default service account has admin privileges, it may result in pods
  being unintentionally launched with admin privileges. If this behavior is not expected, it may indicate a configuration mistake or that your
  credentials are compromised.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty type="Policy:Kubernetes/AdminAccessToDefaultServiceAccount"

    | table _time, account_id, region, severity, type, resource.eksClusterDetails.name, service.action.kubernetesApiCallAction.verb, service.action.kubernetesApiCallAction.requestUri,
    title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title == "Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, ResourceId = Resource_KubernetesDetails_KubernetesUserDetails_Username, ServiceName = Service_ServiceName, Action = Service_Action_ActionType
  aql: |
    SELECT eventtime, sourceip, destinationip, username, qidname(qid), LOGSOURCENAME(logsourceid), "Finding Type" AS finding_type, "Account ID", "Resource Type"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "Finding Type" = 'Policy:Kubernetes/AdminAccessToDefaultServiceAccount'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_k8s_admin_access_default_serviceaccount {
      meta:
        author = "TDL"
        description = "Detects GuardDuty finding for admin access to default Kubernetes service account"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        platform = "AWS"
        data_source = "AWS GuardDuty"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
        $e.principal.cloud.environment = $environment

      match:
        $environment over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE @timestamp > NOW() - 24 hour AND event.type == "Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
    | KEEP @timestamp, cloud.account.id, cloud.region, event.id, event.severity, aws.guardduty.service.action.kubernetes_api_call_action.remote_ip_details.ip_address_v4, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.namespace
  leql: |
    where(source_json.type="Policy:Kubernetes/AdminAccessToDefaultServiceAccount")
  crowdstrike: |
    #repo=guardduty event_type="Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
    | table([@timestamp, account_id, region, severity, resource.eksClusterDetails.name, service.action.actionType, title, description])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and raw_log_source_type = "GuardDuty" and event_type in ["Policy:Kubernetes/AdminAccessToDefaultServiceAccount"]
    | fields _time, cloud_provider, actor_effective_username, resource_name, resource_type, event_type, severity
  lucene: |
    event.type:"Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty*
    | json field=_raw "detail.type" as event_type
    | where event_type = "Policy:Kubernetes/AdminAccessToDefaultServiceAccount"
    | fields _messageTime, _sourceHost, event_type, detail
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Policy:Kubernetes/AdminAccessToDefaultServiceAccount\"]"
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

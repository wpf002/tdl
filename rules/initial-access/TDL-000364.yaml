rule_id: TDL-AUTH-000364
v4_id: '000364'
name: Privilege Escalation via HVT Role - Azure
description: Detects an attacker escalating the privileges of a user to an O365 admin role. If the attacker has access to the role, the attacker
  will then have escalated privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- Azure AD
- Office 365
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: "index=o365 OR index=azure sourcetype=o365:management:activity OR sourcetype=azure:ad:audit Operation=\"Add member to role\" \n| search\
    \ Role=*admin* OR Role=*Administrator* OR Role=\"Global Administrator\" OR Role=\"Privileged Role Administrator\" OR Role=\"Security Administrator\"\
    \ OR Role=\"Application Administrator\" OR Role=\"Cloud Application Administrator\" OR Role=\"User Administrator\" OR Role=\"Helpdesk Administrator\"\
    \ OR Role=\"Exchange Administrator\" OR Role=\"SharePoint Administrator\" OR Role=\"Compliance Administrator\"\n| search NOT [ | inputlookup\
    \ known_admins.csv | fields UserId | rename UserId as user ]\n| eval user=coalesce(UserId, Actor, user, ActorUser)\n| table _time, user, Operation,\
    \ Role, ObjectId, TargetUser, ClientIP, UserAgent\n"
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName == "Add member to role"
    | where TargetResources has "administrator" or TargetResources has "Admin" or TargetResources has_any ("Global", "Privileged", "Security", "Compliance", "Exchange", "SharePoint", "Teams", "User", "Billing", "Service", "Application", "Cloud", "Authentication", "Helpdesk", "Password")
    | extend InitiatedBy = tostring(InitiatedBy.user.userPrincipalName)
    | extend TargetUser = tostring(TargetResources[0].userPrincipalName)
    | extend RoleName = tostring(TargetResources[0].modifiedProperties[1].newValue)
    | where InitiatedBy !has_any ("admin@", "_admin", "-admin", ".admin")
    | where InitiatedBy !in~ ("sync_", "aad_", "azureadssoacc")
    | project TimeGenerated, InitiatedBy, TargetUser, RoleName, OperationName, ResultDescription, CorrelationId
  aql: "SELECT username, \"TargetUser\", \"RoleName\", sourceip, COUNT(*) AS role_additions\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ ILIKE '%Office 365%' \n  AND (qidname(qid) ILIKE '%Add member to role%' OR qidname(qid) ILIKE '%role assignment%')\n  AND (\"RoleName\"\
    \ ILIKE '%admin%' OR \"RoleName\" ILIKE '%privileged%' OR \"RoleName\" IN ('Global Administrator', 'Security Administrator', 'Privileged Role\
    \ Administrator', 'User Administrator', 'Exchange Administrator', 'SharePoint Administrator'))\n  AND username NOT IN ('admin@company.com',\
    \ 'globaladmin@company.com', 'service_account@company.com')\nGROUP BY username, \"TargetUser\", \"RoleName\", sourceip\nLAST 24 HOURS\n"
  yara_l: |
    rule o365_privileged_role_assignment_non_admin {
      meta:
        author = "Detection Engineer"
        description = "Detects addition of members to privileged Azure AD roles by non-admin users - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Office 365"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        (
          $e.metadata.product_event_type = "Add member to role" or
          re.regex($e.security_result.summary, `(?i)add.*member.*role`)
        )
        (
          re.regex($e.target.resource.attribute.labels.value, `(?i)(admin|privileged|global|directory|security|compliance|helpdesk|user.*admin|exchange.*admin|sharepoint.*admin)`) or
          re.regex($e.target.resource.name, `(?i)(admin|privileged|global|directory|security|compliance|helpdesk|user.*admin|exchange.*admin|sharepoint.*admin)`)
        )
        not re.regex($e.principal.user.userid, `(?i)(admin|svc|service|system|automation)`)
        $e.principal.user.userid = $source_user
        $e.target.user.userid = $target_user
        $e.principal.hostname = $host

      match:
        $source_user over 5m

      outcome:
        $risk_score = 75
        $target_users = array_distinct($target_user)
        $event_count = count_distinct($e.metadata.id)

      condition:
        $e
    }
  esql: "FROM logs-o365.audit*, logs-azure.audit*, logs-azure.auditlogs*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.action == \"Add member\
    \ to role\"\n  AND (winlog.event_data.Role LIKE \"*administrator*\" OR winlog.event_data.Role LIKE \"*admin*\" OR azure.auditlogs.properties.target_resources.modified_properties.new_value\
    \ LIKE \"*administrator*\" OR azure.auditlogs.properties.target_resources.modified_properties.new_value LIKE \"*admin*\" OR o365.audit.ModifiedProperties.Role_DisplayName\
    \ LIKE \"*administrator*\" OR o365.audit.ModifiedProperties.Role_DisplayName LIKE \"*admin*\")\n  AND user.name NOT IN (\"admin@company.com\"\
    , \"svc_admin@company.com\", \"global_admin@company.com\")\n| KEEP @timestamp, event.action, user.name, azure.auditlogs.properties.target_resources.display_name,\
    \ azure.auditlogs.properties.target_resources.modified_properties.new_value, o365.audit.ModifiedProperties.Role_DisplayName, host.name, source.ip\n"
  leql: |
    where(source_json.Operation="Add member to role" AND source_json.Role ICONTAINS "administrator" AND NOT(source_user IN ["known_admin1@domain.com", "known_admin2@domain.com"])) groupby(source_user, source_json.Role, source_json.ObjectId) calculate(count)
  crowdstrike: |
    #type=O365Azure Operation="Add member to role."
    | RoleName=/.*admin.*/i OR RoleName=/.*privileged.*/i
    | not (UserId=*admin@* OR UserId=*svc-*)
    | table([@timestamp, UserId, TargetUserId, RoleName, Operation, ClientIP, ResultStatus])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and cloud_provider = "AZURE" and operation_name = "Add member to role"
    | filter lowercase(operation_name_orig) contains "administrator" or lowercase(operation_name_orig) in ("Global Administrator", "Privileged Role Administrator", "Security Administrator", "Application Administrator", "Cloud Application Administrator", "User Administrator", "Exchange Administrator", "SharePoint Administrator", "Intune Administrator", "Compliance Administrator", "Helpdesk Administrator", "Billing Administrator", "Authentication Administrator", "Privileged Authentication Administrator")
    | alter is_known_admin = if(actor_user_name in ("admin@company.com", "globaladmin@company.com"), true, false)
    | filter is_known_admin = false
    | fields _time, actor_user_name, operation_name, operation_name_orig, target_user_name, cloud_resource_id, cloud_provider_project
  lucene: |
    event.name:"Add member to role" AND (role.name:*administrator* OR role.name:*admin* OR role.name:"Global Administrator" OR role.name:"Privileged Role Administrator" OR role.name:"Security Administrator" OR role.name:"Compliance Administrator" OR role.name:"Exchange Administrator" OR role.name:"SharePoint Administrator" OR role.name:"User Administrator") AND NOT (user.name:(admin* OR svc-* OR service-*) OR user.id:(known-admin-id-1 OR known-admin-id-2))
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*Office* OR _sourceCategory=*O365*
    | json field=_raw "Operation" as operation
    | json field=_raw "ResultStatus" as result_status
    | json field=_raw "UserId" as source_user
    | json field=_raw "ModifiedProperties" as modified_props
    | json field=_raw "Role.DisplayName" as role_name
    | where operation = "Add member to role" and result_status = "Success"
    | where role_name matches "*administrator*" or role_name matches "*admin*" or role_name matches "*privileged*" or role_name = "Global Administrator" or role_name = "Privileged Role Administrator" or role_name = "Security Administrator" or role_name = "User Administrator"
    | where !(source_user matches "*admin@*" or source_user matches "*svc-*" or source_user matches "*service@*")
    | fields _messageTime, source_user, role_name, operation, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 O365 Azure Event

  Where Event Name is "Add member to role"

  Where the role name is a privileged role or contains administrator

  Where the source user is not a known admin'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

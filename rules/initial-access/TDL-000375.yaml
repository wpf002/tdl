rule_id: TDL-AUTH-000375
v4_id: '000375'
name: Azure Suspicious Guest User Activity
description: Detects when a guest user is found attempting to use various PowerShell CLI within Azure.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1059
technique_name: Command and Scripting Interpreter
platform:
- Azure
data_sources:
- Azure AD
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: |
    index=azure sourcetype=azure:aad:signin
    | search ResultType=0 AppId IN ("1b730954-1685-4b74-9bfd-dac224a7b894", "04b07795-8ddb-461a-bbee-02f9e1bf7b46", "1950a258-227b-4e31-a9cf-717495945fc2", "a0c73c16-a7e3-4564-9a95-2bdf47383716", "fb78d390-0c51-40cd-8e17-fdbfab77341b", "d1ddf0e4-d672-4dae-b554-9d5bdfd93547", "9bc3ab49-b65d-410a-85ad-de819febfddc", "12128f48-ec9e-42f0-b203-ea49fb6af367", "23d8f6bd-1eb0-4cc2-a08c-7bf525c67bcd", "31359c7f-bd7e-475c-86db-fdb8c937548e", "90f610bf-206d-4950-b61d-37fa6fd1b224", "14d82eec-204b-4c2f-b7e8-296a70dab67e")
    | lookup "TDL - Azure Guest Account Tracker" user as UserPrincipalName OUTPUT guest_user
    | where isnotnull(guest_user)
    | table _time, UserPrincipalName, AppId, AppDisplayName, IPAddress, Location, DeviceDetail.displayName, ResultType, ResultDescription
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000375 {\n  meta:\n    author = \"TDL\"\n    description = \"Azure Suspicious Guest User Activity\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1059\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n   \
    \ $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where the Event Name is in [Sign-in activity]

  Where the Application ID is in [1b730954-1685-4b74-9bfd-dac224a7b894, 04b07795-8ddb-461a-bbee-02f9e1bf7b46, 1950a258-227b-4e31-a9cf-717495945fc2,
  a0c73c16-a7e3-4564-9a95-2bdf47383716, fb78d390-0c51-40cd-8e17-fdbfab77341b, d1ddf0e4-d672-4dae-b554-9d5bdfd93547, 9bc3ab49-b65d-410a-85ad-de819febfddc,
  12128f48-ec9e-42f0-b203-ea49fb6af367, 23d8f6bd-1eb0-4cc2-a08c-7bf525c67bcd, 31359c7f-bd7e-475c-86db-fdb8c937548e, 90f610bf-206d-4950-b61d-37fa6fd1b224,
  14d82eec-204b-4c2f-b7e8-296a70dab67e]

  Where the target user matches the Guest User in lookup [TDL - Azure Guest Account Tracker]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

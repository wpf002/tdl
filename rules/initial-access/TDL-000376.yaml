rule_id: TDL-AUTH-000376
v4_id: '000376'
name: Azure External Guest User Invitation
description: Building block that Identifies an invitation to an external user in Azure Active Directory (AD). Azure AD is extended to include
  collaboration, allowing you to invite people from outside your organization to be guest users in your cloud account.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure AD
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:aad:audit operationName="Invite external user"

    | eval event_time=_time

    | eval src_user=coalesce(initiatedBy.user.userPrincipalName, initiatedBy.app.displayName)

    | eval username=coalesce(targetResources{}.userPrincipalName, targetResources{}.displayName)

    | eval src_ip=coalesce(initiatedBy.user.ipAddress, initiatedBy.app.ipAddress)

    | table event_time, src_user, username, src_ip

    | outputlookup append=true "TDL - Azure Guest Account Tracker"

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(90d)
    | where OperationName == "Invite external user"
    | extend SrcUser = tostring(InitiatedBy.user.userPrincipalName)
    | extend SrcIP = tostring(InitiatedBy.user.ipAddress)
    | extend InvitedUser = tostring(TargetResources[0].userPrincipalName)
    | project TimeGenerated, SrcUser, InvitedUser, SrcIP, OperationName, ResultDescription, CorrelationId
  aql: |
    SELECT eventtime, username AS src_user, "Target Username" AS invited_user, sourceip AS src_ip, "Event Name"
    FROM events
    WHERE "Event Name" = 'Invite External User'
      AND LOGSOURCETYPENAME(devicetype) ILIKE '%Azure%'
    LAST 24 HOURS
  yara_l: |
    rule azure_guest_invite_tracking {
      meta:
        author = "TDL"
        description = "Tracks Azure AD external user invitations for guest account monitoring"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Low"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure Active Directory"
        $e.metadata.product_event_type = "Invite External User"
        $e.principal.user.userid = $src_user
        $e.target.user.userid = $username
        $e.principal.ip = $src_ip

      match:
        $src_user, $username, $src_ip over 1h

      outcome:
        $event_time = $e.metadata.event_timestamp.seconds
        $inviter = $src_user
        $invited_user = $username
        $source_ip = $src_ip

      condition:
        $e
    }
  esql: "FROM logs-azure.auditlogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND azure.auditlogs.operation_name == \"Invite external user\"\n\
    | EVAL src_user = azure.auditlogs.properties.initiated_by.user.userPrincipalName\n| EVAL username = azure.auditlogs.properties.target_resources.userPrincipalName\n\
    | EVAL src_ip = azure.auditlogs.properties.initiated_by.user.ipAddress\n| KEEP @timestamp, src_user, username, src_ip, host.name, azure.auditlogs.operation_name,\
    \ azure.auditlogs.result_signature\n"
  leql: |
    where(source_json.operationName="Invite external user") groupby(source_json.initiatedBy.user.userPrincipalName, source_json.targetResources.userPrincipalName, source_json.callerIpAddress) calculate(count)
  crowdstrike: |
    #repo=azure* Operation="Invite external user"
    | table([@timestamp, event_time, InitiatedBy, UserId, UserPrincipalName, IPAddress, TargetResources])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and operation_name = "Invite external user"
    | fields event_time, actor_effective_username as src_user, action_account_name as username, action_remote_ip as src_ip, agent_hostname
  lucene: |
    event.action:"Invite external user" OR event.category:"AuditLogs" AND operation_name:"Invite external user"
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*AzureAD* "Invite external user"
    | json field=_raw "operationName" as operation_name
    | json field=_raw "time" as event_time
    | json field=_raw "callerIpAddress" as src_ip
    | json field=_raw "identity.claims.http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name" as src_user
    | json field=_raw "properties.targetResources[0].userPrincipalName" as username
    | where operation_name = "Invite external user"
    | fields event_time, src_user, username, src_ip
    | save /shared/TDL_Azure_Guest_Account_Tracker
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where the Event Name is in [Invite External User]

  Where the event_time, src_user, username, and src_ip is saved to lookup TDL - Azure Guest Account Tracker'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

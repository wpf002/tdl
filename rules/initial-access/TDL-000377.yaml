rule_id: TDL-AUTH-000377
v4_id: '000377'
name: Anonymous User OneDrive Access
description: Detects when an anonymous user accesses OneDrive resource through an anonymous link. Anonymous links can be used by any authenticated
  or unauthenticated users and may lead to leaking sensitive data outside of the organization.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1133
technique_name: External Remote Services
platform:
- Microsoft 365
data_sources:
- Sharepoint
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=o365 OR index=office365 sourcetype=o365:management:activity Workload=OneDrive Operation=AnonymousLinkUsed UserId=anonymous

    | table _time, UserId, Operation, Workload, ClientIP, ObjectId, SiteUrl, SourceFileName

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "OneDrive"
    | where Operation == "AnonymousLinkUsed"
    | where UserId == "anonymous"
    | project TimeGenerated, UserId, Operation, OfficeWorkload, OfficeObjectId, ClientIP, UserAgent, Site_Url, SourceFileName, SourceRelativeUrl
  aql: |
    SELECT eventtime, "Application", "Operation", "UserId", "ObjectId", sourceip, COUNT(*) AS event_count
    FROM events
    WHERE "Application" = 'OneDrive'
      AND "Operation" = 'AnonymousLinkUsed'
      AND "UserId" = 'anonymous'
    GROUP BY eventtime, "Application", "Operation", "UserId", "ObjectId", sourceip
    LAST 24 HOURS
  yara_l: "rule sharepoint_anonymous_link_used {\n  meta:\n    author = \"TDL\"\n    description = \"Detects anonymous link usage in OneDrive\
    \ for Business via SharePoint events - MITRE T1133\"\n    severity = \"Medium\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1133\"\n    \n  events:\n    $e.metadata.product_name = \"Microsoft 365\"\n    $e.metadata.product_event_type = \"AnonymousLinkUsed\"\
    \n    $e.target.application = \"OneDrive\"\n    $e.principal.user.userid = \"anonymous\"\n    \n  match:\n    $e.principal.user.userid over\
    \ 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-o365.audit*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.dataset == "o365.audit"
      AND o365.audit.Workload == "OneDrive"
      AND o365.audit.Operation == "AnonymousLinkUsed"
      AND TO_LOWER(o365.audit.UserId) == "anonymous"
    | KEEP @timestamp, host.name, user.name, o365.audit.UserId, o365.audit.Operation, o365.audit.ObjectId, source.ip, o365.audit.ClientIP
  leql: |
    where(source_json.Workload="OneDrive" AND source_json.Operation="AnonymousLinkUsed" AND source_json.UserId="anonymous")
  crowdstrike: |
    #type=Office365 OR event_simpleName=*Office365* OR event_simpleName=*SharePoint*
    Application=OneDrive Operation=AnonymousLinkUsed UserId=anonymous
    | table([@timestamp, ComputerName, UserId, Operation, Application, ObjectId, ClientIP])
  xql: "dataset = msft_365_management_activity_raw\n| filter event_source = \"SharePoint\" \n  and json_extract_scalar(raw_log, \"$.Application\"\
    ) = \"OneDrive\"\n  and json_extract_scalar(raw_log, \"$.Operation\") = \"AnonymousLinkUsed\"\n  and json_extract_scalar(raw_log, \"$.UserId\"\
    ) = \"anonymous\"\n| fields _time, json_extract_scalar(raw_log, \"$.UserId\") as user_id, json_extract_scalar(raw_log, \"$.Operation\") as\
    \ operation, json_extract_scalar(raw_log, \"$.Application\") as application, json_extract_scalar(raw_log, \"$.ObjectId\") as object_id, json_extract_scalar(raw_log,\
    \ \"$.ClientIP\") as client_ip\n"
  lucene: |
    event.provider:"SharePoint" AND event.dataset:"office365.audit" AND office365.audit.Application:"OneDrive" AND office365.audit.Operation:"AnonymousLinkUsed" AND office365.audit.UserId:"anonymous"
  sumo: |
    _sourceCategory=*Office365* OR _sourceCategory=*SharePoint* OR _sourceCategory=*O365*
    | json field=_raw "Workload" as workload
    | json field=_raw "Application" as application
    | json field=_raw "Operation" as operation
    | json field=_raw "UserId" as user_id
    | where workload = "OneDrive" or application = "OneDrive"
    | where operation = "AnonymousLinkUsed"
    | where user_id = "anonymous"
    | fields _messageTime, _sourceHost, workload, application, operation, user_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Office365 Sharepoint Event\nWhere the application is [OneDrive]\nWhere the Operation is \"AnonymousLinkUsed\" \nWhere the UserId\
  \ is \"anonymous\""
suppression:
  window: 12 hours
  fields:
  - Source IP
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

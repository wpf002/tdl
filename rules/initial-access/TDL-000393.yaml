rule_id: TDL-AUTH-000393
v4_id: 000393
name: AWS Successful RDS Login Brute Force - GuardDuty
description: Detects a successful brute force against a RDS database
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=* sourcetype=aws:cloudwatchlogs:guardduty findingType="CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"

    | table _time, region, accountId, resource.resourceType, service.action.actionType, severity, title, description

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where ActivityType == "CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
    | project TimeGenerated, ActivityType, Title, Description, Severity, AccountId, Region, ResourceType, AwsResourceId = Resource_InstanceDetails_InstanceId, SourceIpAddress = Service_Action_NetworkConnectionAction_RemoteIpDetails_IpAddressV4
  aql: "SELECT eventtime, sourceip, destinationip, username, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid), UTF8(payload)\n\
    FROM events\nWHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'\n  AND (UTF8(payload) ILIKE '%CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce%'\
    \ \n       OR QIDNAME(qid) ILIKE '%CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce%')\nLAST 24 HOURS\n"
  yara_l: |
    rule aws_guardduty_rds_successful_bruteforce {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty finding for successful brute force against RDS credential access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
        $e.principal.resource.name = $resource_name

      match:
        $resource_name over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type == "CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.resource.rds_db_instance.db_instance_identifier, source.ip, user.name, event.severity, event.id
  leql: |
    where(source_json.type IN ["CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"])
  crowdstrike: |
    #type=guardduty service.action.actionType=CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce
    | table([@timestamp, accountId, region, service.action.actionType, resource.resourceType, severity, description])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor = "Amazon" and product = "GuardDuty"
    | filter raw_log contains "CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
    | fields _time, cloud_provider, project, region, raw_log
  lucene: |
    event.type:"CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "detail.type" as event_type
    | where event_type = "CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce"
    | fields _messageTime, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:RDS/AnomalousBehavior.SuccessfulBruteForce\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

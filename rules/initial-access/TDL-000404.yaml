rule_id: TDL-AUTH-000404
v4_id: '000404'
name: First Seen User Login from Unauthorized Country
description: Detects a user successfully logging in from an unauthorized country that hasn't been seen in the last 90 days
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=azure OR index=o365 OR index=vpn (sourcetype=azure:aad:signin OR sourcetype=o365:management:activity OR sourcetype=vpn) \n    (ResultType=0\
    \ OR Result=success OR action=success OR status=success)\n    (IPAddress!=10.* IPAddress!=172.16.* IPAddress!=172.17.* IPAddress!=172.18.*\
    \ IPAddress!=172.19.* IPAddress!=172.20.* IPAddress!=172.21.* IPAddress!=172.22.* IPAddress!=172.23.* IPAddress!=172.24.* IPAddress!=172.25.*\
    \ IPAddress!=172.26.* IPAddress!=172.27.* IPAddress!=172.28.* IPAddress!=172.29.* IPAddress!=172.30.* IPAddress!=172.31.* IPAddress!=192.168.*)\n\
    \    NOT [| inputlookup hvt_users.csv | fields UserPrincipalName user username]\n    NOT [| inputlookup authorized_countries.csv | fields\
    \ country]\n| eval src_ip=coalesce(IPAddress, src_ip, ClientIP, client_ip)\n| eval src_user=coalesce(UserPrincipalName, user, username, UserId)\n\
    | eval src_country=coalesce(Location, country, Country, src_country)\n| where isnotnull(src_user) AND isnotnull(src_country)\n| eval baseline_start=relative_time(now(),\
    \ \"-90d\")\n| eval baseline_end=relative_time(now(), \"-30d\")\n| eval detection_window=relative_time(now(), \"-30d\")\n| eval event_time=_time\n\
    | eval in_baseline=if(event_time >= baseline_start AND event_time < baseline_end, 1, 0)\n| eval in_detection=if(event_time >= detection_window,\
    \ 1, 0)\n| stats values(eval(if(in_baseline=1, src_country, null()))) as baseline_countries values(eval(if(in_detection=1, src_country, null())))\
    \ as detection_countries by src_user\n| mvexpand detection_countries\n| eval is_new=if(NOT mvfind(baseline_countries, \"^\".detection_countries.\"\
    $\") >= 0, 1, 0)\n| where is_new=1\n| rename src_user as user, detection_countries as new_country, baseline_countries as historical_countries\n\
    | table user, new_country, historical_countries\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000404 {\n  meta:\n    author = \"TDL\"\n    description = \"First Seen User Login from Unauthorized Country\"\n\
    \    severity = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Successful Remote Login Event \nWhere the Source IP is an External IP\nWhere the Source User is NOT the High Value Target (HVT)\
  \ List\nWhere the Source Country is NOT on the Authorized Countries List\n\nBaseline Learning: 30 Days\nRetention: 90 Days\n\nNew Value: Source\
  \ Country\nPer Entity: Source Username"
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

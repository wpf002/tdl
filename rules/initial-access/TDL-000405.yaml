rule_id: TDL-AUTH-000405
v4_id: '000405'
name: First Seen HVT User Login from Unauthorized Country
description: Detects a high value target user successfully logging in from an unauthorized country that hasn't been seen in the last 90 days
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=azure OR index=o365 sourcetype IN (azure:signinlogs, o365:management:activity) EventName IN (\"UserLoggedIn\", \"UserLoginSuccess\"\
    ) OR action=\"success\" OR ResultType=0 \n| eval is_external=if(match(src_ip, \"^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)\"),\"\
    no\",\"yes\")\n| where is_external=\"yes\"\n| lookup hvt_users.csv user as user OUTPUT is_hvt\n| where is_hvt=\"true\"\n| lookup authorized_countries.csv\
    \ country as src_country OUTPUT is_authorized\n| where is_authorized!=\"true\" OR isnull(is_authorized)\n| eval baseline_start=relative_time(now(),\
    \ \"-30d\")\n| eval current_time=now()\n| where _time >= baseline_start AND _time <= current_time\n| stats earliest(_time) as first_seen latest(_time)\
    \ as last_seen dc(src_country) as country_count values(src_country) as countries by user\n| where country_count > 0\n| eval new_countries=mvfilter(match(countries,\
    \ \".+\"))\n| table user, new_countries, first_seen, last_seen\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000405 {\n  meta:\n    author = \"TDL\"\n    description = \"First Seen HVT User Login from Unauthorized Country\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 30 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Successful Remote Login Event \nWhere the Source IP is an External IP\nWhere the Source User is on the High Value Target (HVT)\
  \ List\nWhere the Source Country is NOT on the Authorized Countries List\n\nBaseline Learning: 30 Days\nRetention: 90 Days\n\nNew Value: Source\
  \ Country\nPer Entity: Source Username"
tuning_period: 30 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000406
v4_id: '000406'
name: Anomalous Kubernetes Behavior - GuardDuty
description: Detects anomalous behaviors identified within the Amazon EKS Cluster.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=guardduty sourcetype=aws:cloudwatch:guardduty \n(type=\"CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed\" OR \n type=\"\
    Execution:Kubernetes/AnomalousBehavior.ExecInPod\" OR \n type=\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated\" OR \n\
    \ type=\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated\" OR \n type=\"Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed\"\
    \ OR \n type=\"Discovery:Kubernetes/AnomalousBehavior.PermissionChecked\" OR \n type=\"Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount\"\
    \ OR \n type=\"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer\")\n| table _time, type, severity, accountId,\
    \ region, resource.*, service.action.*, title, description\n"
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Type in ("CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed", "Execution:Kubernetes/AnomalousBehavior.ExecInPod", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated", "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed", "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked", "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | project TimeGenerated, Type, Title, Description, Severity, AccountId, Region, ResourceType, ServiceName, ActivityType, UserName, IpAddress, AdditionalData
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, QIDNAME(qid) AS event_name, "Event Type" AS event_type, username, sourceip, destinationip, "Account ID", "Resource Type", "Resource Name"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%guardduty%'
      AND "Event Type" IN ('CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed', 'Execution:Kubernetes/AnomalousBehavior.ExecInPod', 'PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated', 'PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated', 'Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed', 'Discovery:Kubernetes/AnomalousBehavior.PermissionChecked', 'Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount', 'PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer')
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_kubernetes_anomalous_behavior {
      meta:
        author = "TDL"
        description = "Detects AWS GuardDuty Kubernetes anomalous behavior findings indicating potential valid account abuse"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.vendor_name = "Amazon"
        (
          $e.metadata.product_event_type = "CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed" or
          $e.metadata.product_event_type = "Execution:Kubernetes/AnomalousBehavior.ExecInPod" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated" or
          $e.metadata.product_event_type = "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed" or
          $e.metadata.product_event_type = "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked" or
          $e.metadata.product_event_type = "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount" or
          $e.metadata.product_event_type = "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type IN ("CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed", "Execution:Kubernetes/AnomalousBehavior.ExecInPod", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated", "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed", "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked", "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | KEEP @timestamp, event.type, cloud.account.id, user.name, aws.guardduty.resource.kubernetes_details.kubernetes_user_details.username, aws.guardduty.resource.kubernetes_details.kubernetes_workload_details.name, aws.guardduty.severity
  leql: |
    where(source_json.type IN ["CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed", "Execution:Kubernetes/AnomalousBehavior.ExecInPod", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated", "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed", "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked", "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer"])
  crowdstrike: |
    #type=guardduty
    | in(field=event_type, values=["CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed", "Execution:Kubernetes/AnomalousBehavior.ExecInPod", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated", "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed", "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked", "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer"])
    | table([@timestamp, event_type, accountId, region, resource.clusterName, service.action.kubernetesApiCallAction.remoteIpDetails.ipAddressV4, resource.kubernetesDetails.kubernetesUserDetails.username])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AWS" and vendor_name = "AWS" and event_type = "guardduty"
    | filter raw_log ~= "\"type\"\\s*:\\s*\"(CredentialAccess:Kubernetes/AnomalousBehavior\\.SecretsAccessed|Execution:Kubernetes/AnomalousBehavior\\.ExecInPod|PrivilegeEscalation:Kubernetes/AnomalousBehavior\\.RoleBindingCreated|PrivilegeEscalation:Kubernetes/AnomalousBehavior\\.RoleCreated|Execution:Kubernetes/AnomalousBehavior\\.WorkloadDeployed|Discovery:Kubernetes/AnomalousBehavior\\.PermissionChecked|Persistence:Kubernetes/AnomalousBehavior\\.WorkloadDeployed!ContainerWithSensitiveMount|PrivilegeEscalation:Kubernetes/AnomalousBehavior\\.WorkloadDeployed!PrivilegedContainer)\""
    | fields _time, cloud_provider, event_type, raw_log
  lucene: |
    event.type:"guardduty" AND finding.type:("CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed" OR "Execution:Kubernetes/AnomalousBehavior.ExecInPod" OR "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated" OR "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated" OR "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed" OR "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked" OR "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount" OR "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _sourceCategory=*AWS*
    | json field=_raw "type" as event_type
    | where event_type in ("CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed", "Execution:Kubernetes/AnomalousBehavior.ExecInPod", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated", "Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed", "Discovery:Kubernetes/AnomalousBehavior.PermissionChecked", "Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount", "PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer")
    | json field=_raw "accountId" as account_id
    | json field=_raw "region" as region
    | json field=_raw "resource.kubernetesDetails.kubernetesUserDetails.username" as k8s_user
    | json field=_raw "severity" as severity
    | fields _messageTime, account_id, region, event_type, k8s_user, severity, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"CredentialAccess:Kubernetes/AnomalousBehavior.SecretsAccessed\", \"Execution:Kubernetes/AnomalousBehavior.ExecInPod\"\
  , \"PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleBindingCreated\", \"PrivilegeEscalation:Kubernetes/AnomalousBehavior.RoleCreated\"\
  , \"Execution:Kubernetes/AnomalousBehavior.WorkloadDeployed\", \"Discovery:Kubernetes/AnomalousBehavior.PermissionChecked\", \"Persistence:Kubernetes/AnomalousBehavior.WorkloadDeployed!ContainerWithSensitiveMount\"\
  , \"PrivilegeEscalation:Kubernetes/AnomalousBehavior.WorkloadDeployed!PrivilegedContainer\"]"
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000408
v4_id: 000408
name: Login As Event - Salesforce
description: The purpose of this rule is to track LoginAs activity for both the source and target user to provide additional context.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=salesforce EventType=LoginAs

    | table _time, user, LoginUrl, Application, SourceIp, LoginType, LoginKey, SessionLevel, Browser, Platform, Status

    '
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(24h)
    | where EventType == "LoginAs"
    | project TimeGenerated, UserPrincipalName, SourceIpAddress, EventType, UserAgent, City, Country
  aql: |
    SELECT username, sourceip, "Event Type", COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" = 'LoginAs'
    GROUP BY username, sourceip, "Event Type"
    LAST 24 HOURS
  yara_l: |
    rule salesforce_loginas_event {
      meta:
        author = "TDL"
        description = "Detects Salesforce LoginAs events (MITRE T1078 - Valid Accounts)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Salesforce"
        $e.metadata.product_event_type = "LoginAs"
        $e.principal.user.userid = $user
        $e.target.user.userid = $target_user

      match:
        $user, $target_user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "LoginAs"
    | KEEP @timestamp, user.name, user.email, source.ip, salesforce.login.application, salesforce.login.api_type, salesforce.session.id
  leql: |
    where(source_json.EVENT_TYPE="LoginAs")
  crowdstrike: |
    #type=salesforce EventType=LoginAs
    | table([@timestamp, UserName, SourceIp, EventType, Application, Browser, Platform])
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type = "LoginAs"
    | fields _time, actor_user, target_user, source_ip, user_agent
  lucene: |
    EventType:LoginAs
  sumo: |
    _sourceCategory=*Salesforce* "LoginAs"
    | json field=_raw "EventType" as event_type
    | where event_type = "LoginAs"
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'LoginAs'"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

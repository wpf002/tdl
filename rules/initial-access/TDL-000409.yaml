rule_id: TDL-AUTH-000409
v4_id: 000409
name: User Creation - Salesforce
description: Detects user creation. While this is a routine activity, user creation could be used by an adversary for persistence.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=salesforce EventType=createduser

    | table _time, user, CreatedBy, Username, Email, Profile, host

    '
  kql: |
    SalesforceEventLog
    | where TimeGenerated > ago(1h)
    | where EventType == "CreatedUser"
    | project TimeGenerated, EventType, UserId, UserName, SourceIp, ClientBrowser, ClientPlatform
  aql: |
    SELECT "Event Type", "User ID", "Username", DATEFORMAT(eventtime, 'yyyy-MM-dd HH:mm:ss') AS event_time, sourceip
    FROM events
    WHERE "Event Type" = 'createduser'
    LAST 24 HOURS
  yara_l: |
    rule salesforce_user_creation {
      meta:
        author = "TDL"
        description = "Detects user creation in Salesforce - MITRE T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Salesforce"
        $e.metadata.product_event_type = "createduser"
        $e.principal.user.userid = $user

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce.login*
    | WHERE event.action == "createduser"
    | KEEP @timestamp, user.name, user.email, source.ip, event.action, salesforce.event_type, host.name, user.id
  leql: |
    where(source_json.EVENT_TYPE="CreatedUser")
  crowdstrike: |
    #type=salesforce EventType=createduser
    | table([@timestamp, EventType, UserId, Username, CreatedDate, CreatedById])
  xql: |
    dataset = salesforce_data
    | filter event_type = "createduser"
    | fields _time, actor_effective_username, action_evtlog_event_data_TargetUserName, agent_hostname, event_type
  lucene: |
    EventType:createduser
  sumo: |
    _sourceCategory=*Salesforce* "createduser"
    | json field=_raw "EventType" as event_type
    | where event_type = "createduser"
    | fields _messageTime, _sourceHost, event_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'createduser'"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

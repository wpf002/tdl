rule_id: TDL-AUTH-000410
v4_id: '000410'
name: Unauthorized Permission Set Assigned - Salesforce
description: Detects unauthorized permission set assignments. While this is a routine activity, permission assignments could be used by an adversary
  for persistence and privilege escalation.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=salesforce sourcetype=salesforce:setupaudittrail (Action="PermSetAssign" OR Action="PermSetGroupAssign" OR Action="PermSetLicenseAssign")

    | search NOT [| inputlookup salesforce_admins.csv | fields Username | rename Username as DelegateUser]

    | table _time, DelegateUser, Action, Display, Section, CreatedByIssuer

    '
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType in ('PermSetAssign', 'PermSetGroupAssign', 'PermSetLicenseAssign')
    | where UserId !in ((
        _GetWatchlist('SalesforceAdmins')
        | project UserId
    ))
    | project TimeGenerated, UserId, EventType, SourceIp, UserAgent, PermissionSetId, PermissionSetGroupId, PermissionSetLicenseId
  aql: |
    SELECT username, "Event Type", "Source Username", sourceip, eventtime, COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" IN ('PermSetAssign','PermSetGroupAssign','PermSetLicenseAssign')
      AND "Source Username" NOT IN ('admin@salesforce.com','salesforce_admin','system_admin')
    GROUP BY username, "Event Type", "Source Username", sourceip, eventtime
    LAST 24 HOURS
  yara_l: |
    rule salesforce_suspicious_permission_assignment {
      meta:
        author = "Detection Engineering"
        description = "Detects permission set assignments in Salesforce by non-admin users - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Salesforce"
        (
          $e.metadata.product_event_type = "PermSetAssign" or
          $e.metadata.product_event_type = "PermSetGroupAssign" or
          $e.metadata.product_event_type = "PermSetLicenseAssign"
        )
        $e.principal.user.userid = $source_user
        not re.regex($e.principal.user.userid, `(?i)(salesforce_admin|sf_admin|system_admin)`)

      match:
        $source_user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action IN ("PermSetAssign", "PermSetGroupAssign", "PermSetLicenseAssign")
      AND NOT user.name IN ("admin1@company.com", "admin2@company.com", "serviceaccount@company.com")
    | KEEP @timestamp, user.name, event.action, host.name, source.ip, salesforce.event_type, salesforce.user_id
  leql: |
    where(source_json.EVENT_TYPE IN [PermSetAssign, PermSetGroupAssign, PermSetLicenseAssign] AND source_json.USER_NAME NOT IN [salesforce_admin_user1, salesforce_admin_user2])
  crowdstrike: |
    #type=salesforce (EventType=PermSetAssign OR EventType=PermSetGroupAssign OR EventType=PermSetLicenseAssign)
    | not (SourceUsername IN ["admin1@company.com", "admin2@company.com", "serviceaccount@company.com"])
    | table([@timestamp, SourceUsername, EventType, TargetUsername, ComputerName])
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type in ("PermSetAssign", "PermSetGroupAssign", "PermSetLicenseAssign")
    | filter actor_effective_username not in ("admin@example.com", "salesforce.admin@example.com", "system.admin@example.com")
    | fields _time, actor_effective_username, event_type, event_description, action_country, action_remote_ip
  lucene: |
    event.type:("PermSetAssign" OR "PermSetGroupAssign" OR "PermSetLicenseAssign") AND NOT source.user.name:("admin1" OR "admin2" OR "admin3")
  sumo: |
    _sourceCategory=*Salesforce* (PermSetAssign OR PermSetGroupAssign OR PermSetLicenseAssign)
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_username
    | where event_type in ("PermSetAssign","PermSetGroupAssign","PermSetLicenseAssign")
    | where !(source_username in ("admin1@company.com","admin2@company.com","salesforce_admin@company.com"))
    | fields _messageTime, source_username, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type IN ('PermSetAssign','PermSetGroupAssign','PermSetLicenseAssign')\nWhere the Source Username\
  \ is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

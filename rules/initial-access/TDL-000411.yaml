rule_id: TDL-AUTH-000411
v4_id: '000411'
name: Unauthorized Permission Set Creation - Salesforce
description: Detects unauthorized permission set creations in Salesforce. While these creations can be routine, their function can be abused for
  malicious intent.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=salesforce EventType IN (\"PermSetCreate\", \"PermSetCreateNoLicense\") \nNOT [ | inputlookup salesforce_admins.csv | fields SourceUsername\
    \ ] \n| table _time, SourceUsername, EventType, TargetUsername, PermissionSetName\n"
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(24h)
    | where EventType in ('PermSetCreate', 'PermSetCreateNoLicense')
    | where SourceUserName !in (
        'admin@company.com',
        'salesforce.admin@company.com'
    )
    | project TimeGenerated, SourceUserName, EventType, TargetUserName, PermissionSetName, OrganizationId, SourceIp
  aql: |
    SELECT username AS "Source Username", sourceip, "Event Type", COUNT(*) AS event_count, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
      AND "Event Type" IN ('PermSetCreate','PermSetCreateNoLicense')
      AND username NOT IN ('salesforce_admin1@company.com','salesforce_admin2@company.com')
    LAST 24 HOURS
  yara_l: |
    rule salesforce_suspicious_permission_set_creation {
      meta:
        author = "TDL"
        description = "Detects Permission Set creation in Salesforce by non-admin users - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Salesforce"
        (
          $e.metadata.product_event_type = "PermSetCreate" or
          $e.metadata.product_event_type = "PermSetCreateNoLicense"
        )
        $e.principal.user.userid = $user
        not re.regex($e.principal.user.userid, `(?i)(salesforce_admin|sf_admin|system_admin)`)

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action IN ("PermSetCreate", "PermSetCreateNoLicense")
      AND NOT user.name IN ("admin@company.com", "salesforce.admin@company.com", "sysadmin@company.com")
    | KEEP @timestamp, user.name, event.action, source.ip, user.target.name, salesforce.event.type
  leql: |
    where(source_json.EVENT_TYPE IN [PermSetCreate, PermSetCreateNoLicense] AND NOT(source_user IN [<salesforce_admin_list>]))
  crowdstrike: |
    #type=salesforce EventType IN [PermSetCreate, PermSetCreateNoLicense]
    | NOT (SourceUserName IN [put_your_salesforce_admin_usernames_here])
    | table([@timestamp, SourceUserName, EventType, TargetUserName, ComputerName])
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type in ("PermSetCreate", "PermSetCreateNoLicense")
    | filter actor_effective_username not in ("salesforce_admin_user1@example.com", "salesforce_admin_user2@example.com")
    | fields _time, actor_effective_username, event_type, agent_hostname, action_result
  lucene: |
    event.type:("PermSetCreate" OR "PermSetCreateNoLicense") AND NOT source.user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce*
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_username
    | where event_type in ("PermSetCreate", "PermSetCreateNoLicense")
    | where !(source_username in ("admin@company.com", "salesforce.admin@company.com", "system.admin@company.com"))
    | fields _messageTime, event_type, source_username, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type IN ('PermSetCreate','PermSetCreateNoLicense')\nWhere the Source Username is NOT on the\
  \ Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000412
v4_id: '000412'
name: Unauthorized Permission Set Deletion - Salesforce
description: Detects unauthorized permission set deletions in Salesforce. While these deletions can be routine, their function can be abused for
  malicious intent.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: "index=salesforce sourcetype=salesforce:events EventType=\"PermSetDelete\" \n| lookup salesforce_admins_lookup username AS SourceUsername\
    \ OUTPUT is_admin \n| where isnull(is_admin) OR is_admin=\"false\" \n| table _time, SourceUsername, EventType, PermissionSetName, TargetUsername,\
    \ SessionKey, SourceIP\n"
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType == "PermSetDelete"
    | where SourceUser !in (SalesforceAdminsList)
    | project TimeGenerated, SourceUser, EventType, TargetUser, SourceIp, UserAgent, EventId, AdditionalDetails
  aql: |
    SELECT username AS "Source Username", sourceip, eventtime, qidname(qid), LOGSOURCENAME(logsourceid) AS "Log Source"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
      AND ("Event Type" = 'PermSetDelete' OR qidname(qid) ILIKE '%PermSetDelete%')
      AND username NOT IN ('admin@company.com', 'sf_admin@company.com', 'system_admin@company.com')
    LAST 24 HOURS
  yara_l: |
    rule salesforce_permset_delete_by_non_admin {
      meta:
        author = "TDL"
        description = "Detects PermSetDelete events in Salesforce by non-admin users"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Salesforce"
        $e.metadata.product_event_type = "PermSetDelete"
        $e.principal.user.userid = $user
        not $e.principal.user.attribute.labels.value = "salesforce_admin"

      match:
        $user over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "PermSetDelete" AND user.name NOT IN ("admin1", "admin2", "admin3")
    | KEEP @timestamp, user.name, event.action, host.name, source.ip, salesforce.event.id
  leql: |
    where(source_json.EVENT_TYPE="PermSetDelete" AND NOT(source_user IN ["admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"]))
  crowdstrike: |
    #type=salesforce EventType="PermSetDelete"
    | SourceUsername != /^(admin1|admin2|salesforce_admin)$/
    | table([@timestamp, SourceUsername, EventType, TargetUsername, ComputerName])
  xql: |
    dataset = salesforce_raw
    | filter event_type = "PermSetDelete"
    | alter is_admin = if(actor_effective_username in ("salesforce_admin1@company.com", "salesforce_admin2@company.com"), true, false)
    | filter is_admin = false
    | fields _time, actor_effective_username, event_type, agent_hostname
  lucene: |
    event.type:"PermSetDelete" AND NOT source.username:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce* "PermSetDelete"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_user
    | where event_type = "PermSetDelete"
    | where !(source_user in ("admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"))
    | fields _messageTime, source_user, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'PermSetDelete'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

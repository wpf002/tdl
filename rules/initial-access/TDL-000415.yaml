rule_id: TDL-AUTH-000415
v4_id: '000415'
name: Unauthorized Role Creation - Salesforce
description: Detects role creation. While this is a routine activity, role creation could be used by an adversary for persistence and privilege
  escalation.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=salesforce sourcetype=salesforce:event EventType=createdrole

    | search NOT [ | inputlookup salesforce_admins.csv | fields SourceUsername ]

    | table _time, SourceUsername, EventType, User, SessionLevel, Application, LoginType

    '
  kql: |
    SalesforceEvents
    | where TimeGenerated > ago(24h)
    | where EventType == "createdrole"
    | where SourceUsername !in (SalesforceAdminsList)
    | project TimeGenerated, SourceUsername, EventType, TargetUsername, RoleName, SourceIpAddress, UserAgent
  aql: |
    SELECT username AS "Source Username", sourceip, eventtime, qidname(qid) AS "Event Name", LOGSOURCENAME(logsourceid) AS "Salesforce Org"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
      AND (qidname(qid) ILIKE '%createdrole%' OR "Event Type" = 'createdrole')
      AND username NOT IN ('admin@company.com', 'sysadmin@company.com', 'salesforce.admin@company.com')
    LAST 24 HOURS
  yara_l: |
    rule salesforce_unauthorized_role_creation {
      meta:
        author = "Detection Engineer"
        description = "Detects creation of roles in Salesforce by non-admin users - MITRE T1078"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "Salesforce"
        $e.metadata.product_event_type = "createdrole"
        $e.principal.user.userid = $source_user
        not $source_user in %salesforce_admins

      match:
        $source_user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "createdrole" AND user.name NOT IN ("admin1", "admin2", "admin3")
    | KEEP @timestamp, user.name, event.action, source.ip, user.email, salesforce.event.type
  leql: |
    where(source_json.EVENT_TYPE="createdrole" AND NOT(source_json.USER_NAME IN [/* Add Salesforce Admin usernames here */]))
  crowdstrike: |
    #type=salesforce EventType=createdrole
    | NOT (SourceUsername IN [sfadmin1@company.com, sfadmin2@company.com, sfadmin3@company.com])
    | table([@timestamp, SourceUsername, EventType, TargetUsername, RoleName, SourceIP])
  xql: |
    dataset = salesforce_data
    | filter event_type = "createdRole"
    | filter actor_effective_username not in ("admin@company.com", "sysadmin@company.com")
    | fields _time, actor_effective_username, event_type, agent_hostname, action_external_hostname
  lucene: |
    eventtype:createdrole AND NOT source_username:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce* "CreatedRole"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_user
    | where event_type = "CreatedRole"
    | where !(source_user in ("admin@company.com", "sfadmin@company.com", "salesforce.admin@company.com"))
    | fields _messageTime, source_user, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'createdrole'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

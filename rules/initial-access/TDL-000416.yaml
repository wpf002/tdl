rule_id: TDL-AUTH-000416
v4_id: '000416'
name: Unauthorized User Role Change - Salesforce
description: Detects role changes. While this is a routine activity, role changes could be used by an adversary for persistence and privilege
  escalation.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=salesforce EventType="Changedroleforuser"

    | search NOT [| inputlookup salesforce_admins.csv | fields SourceUsername]

    | table _time, SourceUsername, EventType, TargetUsername, ChangedRole, SessionId, SourceIp

    '
  kql: |
    let SalesforceAdmins = dynamic(["admin@company.com", "salesforce.admin@company.com"]);
    SalesforceEvent
    | where TimeGenerated > ago(1h)
    | where EventType == "Changedroleforuser"
    | where SourceUserName !in (SalesforceAdmins)
    | project TimeGenerated, SourceUserName, EventType, TargetUserName, RoleId, RoleName, IPAddress, UserAgent
  aql: |
    SELECT username AS "Source Username", "Event Type", UTF8(payload) AS "Event Details", eventtime, sourceip, LOGSOURCENAME(logsourceid) AS "Log Source"
    FROM events
    WHERE "Event Type" = 'Changedroleforuser'
      AND username NOT IN ('salesforce_admin1@company.com', 'salesforce_admin2@company.com', 'salesforce_admin3@company.com')
      AND LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
    LAST 24 HOURS
  yara_l: |
    rule salesforce_unauthorized_role_change {
      meta:
        author = "TDL"
        description = "Detects role changes in Salesforce by non-admin users"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "High"

      events:
        $e.metadata.product_name = "Salesforce"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        $e.metadata.product_event_type = "Changedroleforuser"
        $e.principal.user.userid = $source_user
        not $source_user in %salesforce_admins

      match:
        $source_user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "ChangeUserRole" OR event.type == "change" AND event.dataset LIKE "*salesforce*" AND (event.category == "iam" OR event.outcome == "success")
    | WHERE NOT (user.name IN ("salesforce_admin1", "salesforce_admin2", "salesforce_admin3") OR user.email LIKE "*@salesforce.com")
    | KEEP @timestamp, event.action, user.name, user.email, user.target.name, user.target.email, user.changes.role, source.ip, user.agent
  leql: |
    where(source_json.EVENT_TYPE="ChangeRoleForUser" AND NOT(source_json.USER_NAME IN [salesforce_admins_list]))
  crowdstrike: |
    #repo=salesforce EventType=Changedroleforuser
    | !in(field=SourceUsername, values=["admin1@company.com", "admin2@company.com", "serviceaccount@company.com"])
    | table([@timestamp, SourceUsername, EventType, UserId, RoleId, ComputerName])
  xql: |
    dataset = salesforce_logs
    | filter event_type = "Changedroleforuser"
    | filter actor_user not in ("admin1@company.com", "admin2@company.com", "sfadmin@company.com")
    | fields _time, actor_user, target_user, event_type, action_result, agent_ip_address
  lucene: |
    event.type:"Changedroleforuser" AND NOT source.user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce* "ChangeRoleForUser"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_username
    | where event_type = "ChangeRoleForUser"
    | where !(source_username in ("admin1@company.com", "admin2@company.com", "salesforce_admin@company.com"))
    | fields _messageTime, source_username, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'Changedroleforuser'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 24 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

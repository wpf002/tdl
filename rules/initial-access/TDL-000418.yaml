rule_id: TDL-AUTH-000418
v4_id: 000418
name: Unauthorized Custom Permissions Created - Salesforce
description: Custom Permissions in Salesforce are used to give access to users for certain apps or processes that you have configured and which
  cannot be controlled by profile or permission set directly. This rule is used to monitor this activity as adversaries could abuse this to escalate
  privileges.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=salesforce EventType=\"CustomPermissionCreate\" \n| search NOT [| inputlookup salesforce_admins.csv | fields SourceUsername | rename\
    \ SourceUsername as USER_NAME]\n| table _time, USER_NAME, EventType, SourceIp, Status, SessionKey\n"
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType == "CustomPermissionCreate"
    | where SourceUserName !in (
        _GetWatchlist('SalesforceAdmins')
        | project UserName
    )
    | project TimeGenerated, SourceUserName, EventType, SourceIp, UserAgent, ObjectName, ObjectId, AdditionalDetails
  aql: |
    SELECT username AS "Source Username", sourceip, eventtime, qidname(qid) AS "Event Name", LOGSOURCENAME(logsourceid) AS "Log Source"
    FROM events
    WHERE "Event Type" = 'CustomPermissionCreate'
      AND username NOT IN ('admin@company.com', 'salesforce_admin@company.com', 'integration_user@company.com')
      AND LOGSOURCENAME(logsourceid) ILIKE '%salesforce%'
    LAST 24 HOURS
  yara_l: "rule salesforce_custom_permission_create_non_admin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects custom permission\
    \ creation by non-admin Salesforce users - MITRE T1078 Initial Access\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"MEDIUM\"\n    \n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_UPDATE_PERMISSIONS\"\n    $e.metadata.product_event_type\
    \ = \"CustomPermissionCreate\"\n    $e.principal.user.userid = $user\n    \n    // Exclude known Salesforce admins\n    not $user in %salesforce_admins_list\n\
    \    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 65\n    $user_name = $user\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "CustomPermissionCreate" AND user.name NOT IN ("admin1", "admin2", "admin3")
    | KEEP @timestamp, user.name, event.action, source.ip, user.id, salesforce.event_type
  leql: |
    where(source_json.event_type="CustomPermissionCreate" AND NOT source_json.username IN [salesforce_admin_list])
  crowdstrike: "#type=salesforce EventType=CustomPermissionCreate \n| NOT in(field=SourceUsername, values=[\"admin1@company.com\", \"admin2@company.com\"\
    , \"serviceaccount@company.com\"])\n| table([@timestamp, SourceUsername, EventType, ComputerName, TargetUser, PermissionName])\n"
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type = "CustomPermissionCreate"
    | filter actor_effective_username not in ("admin1@company.com", "admin2@company.com", "salesforce_admin@company.com")
    | fields _time, actor_effective_username, event_type, agent_hostname, action_external_hostname
  lucene: |
    event.type:"CustomPermissionCreate" AND NOT source.user.name:(admin1 OR admin2 OR sfdc_admin OR salesforce_admin)
  sumo: |
    _sourceCategory=*Salesforce* "CustomPermissionCreate"
    | json field=_raw "EventType" as event_type
    | json field=_raw "SourceUsername" as source_username
    | where event_type = "CustomPermissionCreate"
    | where !(source_username in ("admin1@company.com", "admin2@company.com", "serviceaccount@company.com"))
    | fields _messageTime, source_username, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'CustomPermissionCreate'\nWhere the Source Username is NOT on the Salesforce Admins\
  \ List"
suppression:
  window: 12 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

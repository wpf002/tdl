rule_id: TDL-AUTH-000419
v4_id: 000419
name: Unauthorized Permission Set Addition - Salesforce
description: Detects permission set additions in Salesforce. While these additions can be routine, their function can be abused for malicious
  intent.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=salesforce EventType=\"PermissionSet*Add\" \n| search NOT [| inputlookup salesforce_admins.csv | fields SourceUsername] \n| table\
    \ _time, SourceUsername, EventType, TargetUsername, PermissionSetName\n"
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(24h)
    | where EventType startswith "PermissionSet" and EventType endswith "Add"
    | where UserId !in (
        SalesforceServiceCloud
        | where TimeGenerated > ago(7d)
        | where Profile == "System Administrator" or UserRole contains "Admin"
        | distinct UserId
    )
    | project TimeGenerated, UserId, Username, EventType, SourceIp, SessionKey, ClientVersion
  aql: |
    SELECT username AS "Source Username", QIDNAME(qid) AS "Event Type", LOGSOURCENAME(logsourceid) AS "Log Source", eventtime, sourceip
    FROM events
    WHERE QIDNAME(qid) ILIKE '%PermissionSet%Add%'
      AND username NOT IN ('salesforce_admin1@example.com', 'salesforce_admin2@example.com', 'salesforce_admin3@example.com')
    LAST 24 HOURS
  yara_l: |
    rule salesforce_permission_set_add_by_non_admin {
      meta:
        author = "Detection Engineer"
        description = "Detects PermissionSet add events in Salesforce by non-admin users - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Salesforce"
        re.regex($e.metadata.product_event_type, `PermissionSet.*Add`)
        $e.principal.user.userid = $user
        not re.regex($e.principal.user.userid, `(?i)(admin|service_account|integration_user)`)

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce.login*, logs-salesforce.events*
    | WHERE @timestamp > NOW() - 24 hour
      AND event.action LIKE "PermissionSet*Add"
      AND NOT user.name IN ("salesforce_admin1", "salesforce_admin2", "salesforce_admin3")
    | KEEP @timestamp, user.name, event.action, source.ip, host.name
  leql: |
    where(source_json.event_type=/PermissionSet.*Add/) AND NOT(source_user IN ["salesforce_admin1", "salesforce_admin2", "salesforce_admin3"])
  crowdstrike: |
    #type=salesforce EventType=PermissionSet*Add
    | NOT (SourceUsername IN ["admin1@example.com", "admin2@example.com", "sfadmin@example.com"])
    | table([@timestamp, SourceUsername, EventType, TargetUsername, PermissionSetName])
  xql: |
    dataset = salesforce_audit_logs
    | filter action_type ~= "PermissionSet.*Add"
    | filter actor_user not in ("admin@salesforce.com", "salesforce_admin@company.com")
    | fields _time, actor_user, action_type, action_target_user, agent_ip_address, action_result
  lucene: |
    event.type:PermissionSet.*Add AND NOT source.user.name:(admin1 OR admin2 OR admin3)
  sumo: "_sourceCategory=*Salesforce* \n| json field=_raw \"EVENT_TYPE\" as event_type\n| json field=_raw \"USER_NAME\" as source_username\n|\
    \ where event_type matches \"PermissionSet*Add\"\n| where !(source_username in (\"admin1@example.com\", \"admin2@example.com\", \"sfadmin@example.com\"\
    ))\n| fields _messageTime, source_username, event_type, _sourceHost\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'PermissionSet.*Add'\nWhere the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 12 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

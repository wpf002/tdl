rule_id: TDL-AUTH-000420
v4_id: '000420'
name: Unauthorized Permission Set Modification - Salesforce
description: Detects various permission set changes in Salesforce. While these changes can be routine, their function can be abused for malicious
  intent.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=salesforce EventType IN ("PermSetFlsChanged","PermSetEnableUserPerm","PermSetEntityPermChanged","PermSetRecordTypeAdded","SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled","SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled","SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled","SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled")

    | lookup salesforce_admins.csv username AS CreatedBy OUTPUT is_admin

    | where isnull(is_admin) OR is_admin!="true"

    | table _time, CreatedBy, EventType, PermissionSet, Action, host

    '
  kql: |
    SalesforceServiceCloud
    | where TimeGenerated > ago(1h)
    | where EventType in ('PermSetFlsChanged','PermSetEnableUserPerm','PermSetEntityPermChanged','PermSetRecordTypeAdded','SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled','SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled','SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled','SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled')
    | join kind=leftanti (
        _GetWatchlist('SalesforceAdmins')
        | project AdminUsername = SearchKey
    ) on $left.UserId == $right.AdminUsername
    | project TimeGenerated, UserId, EventType, SourceIp, UserAgent
  aql: |
    SELECT username AS "Source Username", "Event Type", LOGSOURCENAME(logsourceid) AS "Log Source", eventtime, sourceip
    FROM events
    WHERE LOGSOURCETYPE(devicetype) ILIKE '%salesforce%'
      AND "Event Type" IN ('PermSetFlsChanged', 'PermSetEnableUserPerm', 'PermSetEntityPermChanged', 'PermSetRecordTypeAdded', 'SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled', 'SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled', 'SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled', 'SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled')
      AND username NOT IN (SELECT username FROM referencedata WHERE setname='Salesforce_Admins_List')
    LAST 24 HOURS
  yara_l: |
    rule salesforce_suspicious_permset_changes {
      meta:
        author = "TDL"
        description = "Detects suspicious Salesforce permission set changes by non-admin users"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Salesforce"
        (
          $e.metadata.product_event_type = "PermSetFlsChanged" or
          $e.metadata.product_event_type = "PermSetEnableUserPerm" or
          $e.metadata.product_event_type = "PermSetEntityPermChanged" or
          $e.metadata.product_event_type = "PermSetRecordTypeAdded" or
          $e.metadata.product_event_type = "SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled" or
          $e.metadata.product_event_type = "SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled" or
          $e.metadata.product_event_type = "SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled" or
          $e.metadata.product_event_type = "SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled"
        )
        $e.principal.user.userid = $user
        not $e.principal.user.attribute.labels.value = "salesforce_admin"

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-salesforce*
    | WHERE event.action IN ("PermSetFlsChanged", "PermSetEnableUserPerm", "PermSetEntityPermChanged", "PermSetRecordTypeAdded", "SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled", "SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled")
    | WHERE NOT user.name IN ("admin1@example.com", "admin2@example.com", "salesforce.admin@company.com")
    | KEEP @timestamp, user.name, event.action, source.ip, salesforce.event_type, salesforce.organization_id
  leql: |
    where(source_json.EVENT_TYPE IN ['PermSetFlsChanged', 'PermSetEnableUserPerm', 'PermSetEntityPermChanged', 'PermSetRecordTypeAdded', 'SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled', 'SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled', 'SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled', 'SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled'] AND NOT(source_json.USER_NAME IN ['admin1@company.com', 'admin2@company.com', 'sfdc-admin@company.com']))
  crowdstrike: |
    #type=salesforce EventType IN [PermSetFlsChanged, PermSetEnableUserPerm, PermSetEntityPermChanged, PermSetRecordTypeAdded, SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled, SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled, SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled, SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled]
    | not (SourceUsername IN [salesforce_admin1, salesforce_admin2, salesforce_admin3])
    | table([@timestamp, EventType, SourceUsername, ComputerName])
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type in ("PermSetFlsChanged", "PermSetEnableUserPerm", "PermSetEntityPermChanged", "PermSetRecordTypeAdded", "SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled", "SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled")
    | alter is_admin = arrayindex(regextract(actor_effective_username, "(?i)(admin|administrator)"), 0)
    | filter is_admin = null
    | fields _time, actor_effective_username, event_type, event_id, event_description
  lucene: |
    event_type:(PermSetFlsChanged OR PermSetEnableUserPerm OR PermSetEntityPermChanged OR PermSetRecordTypeAdded OR SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled OR SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled OR SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled OR SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled) AND NOT user.name:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Salesforce*
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "USER_NAME" as source_username
    | where event_type in ("PermSetFlsChanged", "PermSetEnableUserPerm", "PermSetEntityPermChanged", "PermSetRecordTypeAdded", "SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled", "SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled", "SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled")
    | where !(source_username in ("admin1@company.com", "admin2@company.com", "sfadmin@company.com"))
    | fields _messageTime, source_username, event_type, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type IN ('PermSetFlsChanged',\n    'PermSetEnableUserPerm','PermSetEntityPermChanged',\n\
  \    'PermSetRecordTypeAdded','SetupEntityAccessAudit_PermissionSet_ApexClass_Enabled',\n    'SetupEntityAccessAudit_PermissionSet_ApexPage_Enabled',\n\
  \    'SetupEntityAccessAudit_PermissionSet_CustomEntityDefinition_Enabled',\n    'SetupEntityAccessAudit_PermissionSet_CustomPermission_Enabled')\n\
  Where the Source Username is NOT on the Salesforce Admins List"
suppression:
  window: 12 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

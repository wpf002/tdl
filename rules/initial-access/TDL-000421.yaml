rule_id: TDL-AUTH-000421
v4_id: '000421'
name: Unauthorized User Login As HVT Account - Salesforce
description: Detects a unauthorized user logging in as a Admin/HVT user in Salesforce. The Login As event could be a sign of a adversary esclating
  thier privileges to perform other actions within Salesforce
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Salesforce
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=salesforce EventType=\"LoginAs\" \n| lookup salesforce_admins.csv username as SourceUsername OUTPUT is_admin as source_is_admin\n\
    | lookup salesforce_admins.csv username as TargetUsername OUTPUT is_admin as target_is_admin\n| where isnull(source_is_admin) OR source_is_admin=\"\
    false\"\n| where target_is_admin=\"true\"\n| table _time, SourceUsername, TargetUsername, src_ip, LoginUrl\n"
  kql: |
    SalesforceEventLogFile
    | where TimeGenerated > ago(24h)
    | where EVENT_TYPE == "LoginAs"
    | where USER_ID_DERIVED !in (SalesforceAdmins)
    | join kind=inner (
        SalesforceAdmins
        | project TargetUserId = UserId
    ) on $left.DELEGATED_USER_ID == $right.TargetUserId
    | project TimeGenerated, SourceUsername = USER_ID_DERIVED, TargetUsername = DELEGATED_USER_NAME, SessionKey = SESSION_KEY, SourceIp = CLIENT_IP
  aql: |
    SELECT sourceip, "Source Username", "Target Username", "Event Type", eventtime, COUNT(*) AS event_count
    FROM events
    WHERE "Event Type" = 'LoginAs'
      AND "Source Username" NOT IN ('admin1@company.com', 'admin2@company.com', 'serviceaccount@company.com')
      AND "Target Username" IN ('hvt1@company.com', 'hvt2@company.com', 'admin3@company.com')
    GROUP BY sourceip, "Source Username", "Target Username", "Event Type", eventtime
    LAST 24 HOURS
  yara_l: "rule salesforce_login_as_by_non_admin {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects LoginAs event\
    \ where non-admin user impersonates admin/HVT account\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\
    \n    severity = \"HIGH\"\n\n  events:\n    $e.metadata.product_name = \"Salesforce\"\n    $e.metadata.product_event_type = \"LoginAs\"\n\
    \    $e.principal.user.userid = $source_user\n    $e.target.user.userid = $target_user\n    \n    not re.regex($e.principal.user.userid, `(?i)(admin|administrator|salesforce_admin)`)\n\
    \    re.regex($e.target.user.userid, `(?i)(admin|administrator|hvt|executive|c-level)`)\n\n  match:\n    $source_user, $target_user over 5m\n\
    \n  outcome:\n    $risk_score = 85\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-salesforce*
    | WHERE event.action == "LoginAs" AND user.name NOT IN ("admin1", "admin2", "admin3") AND user.target.name IN ("salesforce_admin1", "salesforce_admin2", "hvt_account1")
    | KEEP @timestamp, user.name, user.target.name, source.ip, event.action, host.name
  leql: |
    where(source_json.EVENT_TYPE="LoginAs" AND source_user NOT IN [salesforce_admins_list] AND destination_user IN [salesforce_hvt_accounts])
  crowdstrike: "#type=salesforce EventType=\"LoginAs\" \n| !in(field=SourceUsername, values=[SalesforceAdminsList])\n| in(field=TargetUsername,\
    \ values=[SalesforceAdminsList])\n| table([@timestamp, SourceUsername, TargetUsername, SourceIP, SessionKey, ComputerName])\n"
  xql: |
    dataset = salesforce_audit_logs
    | filter event_type = "LoginAs"
    | filter actor_user not in ("approved_admin1", "approved_admin2", "approved_admin3")
    | filter target_user in ("salesforce_admin1", "salesforce_admin2", "hvt_user1", "hvt_user2")
    | fields _time, actor_user, target_user, source_ip, session_key
  lucene: |
    event.type:"LoginAs" AND NOT source.user.name:(admin1 OR admin2 OR admin3) AND target.user.roles:("Salesforce Admin" OR "HVT")
  sumo: |
    _sourceCategory=*Salesforce* "LoginAs"
    | json field=_raw "EVENT_TYPE" as event_type
    | json field=_raw "DELEGATED_USER_NAME" as source_username
    | json field=_raw "USER_NAME" as target_username
    | where event_type = "LoginAs"
    | where !(source_username in ("admin1@company.com", "admin2@company.com", "serviceaccount@company.com"))
    | where target_username in ("hvt1@company.com", "hvt2@company.com", "admin3@company.com")
    | fields _messageTime, source_username, target_username, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Salseforce Event  \nWhere the Event Type is 'LoginAs'\nWhere the Source Username is NOT on the Salesforce Admins List\nWhere\
  \ the Target Username is a Salesforce Admin/HVT Account"
suppression:
  window: 12 Hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

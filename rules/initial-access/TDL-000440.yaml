rule_id: TDL-AUTH-000440
v4_id: '000440'
name: Flash Player Update from Suspicious Location
description: Detects a flash player update from an unofficial location
tactic: Initial Access
tactic_id: TA0001
technique_id: T1189
technique_name: Drive-by Compromise
platform:
- Windows
data_sources:
- Forward Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp NOT (src_ip IN ("10.0.0.5", "10.0.0.6") OR dest_ip IN ("10.0.0.5",
    "10.0.0.6"))

    | stats count as connection_count, dc(dest_ip) as unique_dest_ips, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where connection_count >= 1

    | sort - total_bytes_out

    | table src_ip, dest_ip, dest_port, connection_count, unique_dest_ips, total_bytes_out

    '
  kql: |
    CommonSecurityLog
    | where DeviceVendor has_any ("Proxy", "Firewall") or DeviceProduct has_any ("Proxy", "Firewall", "Web Security")
    | where Protocol =~ "tcp" or toupper(Protocol) == "TCP"
    | summarize TotalConnections = count(), UniqueDestIPs = dcount(DestinationIP), TotalBytesOut = sum(SentBytes) by SourceIP, DestinationIP, DestinationPort
    | where TotalConnections >= 1
    | where SourceIP !in ("10.0.0.50", "10.0.0.51") and SourceIP !has "scanner" and SourceIP !has "monitor"
    | sort by TotalBytesOut desc
    | project SourceIP, DestinationIP, DestinationPort, TotalConnections, UniqueDestIPs, TotalBytesOut
  aql: |
    SELECT sourceip AS src_ip, destinationip AS dest_ip, destinationport AS dest_port, COUNT(*) AS connection_count, UNIQUECOUNT(destinationip) AS unique_dest_ips, SUM(bytesout) AS total_bytes_out
    FROM flows
    WHERE protocol = 6 AND sourceip NOT IN ('10.0.0.100', '10.0.0.101')
    GROUP BY sourceip, destinationip, destinationport
    HAVING connection_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: "rule initial_access_drive_by_compromise_t1189 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects TCP network connections\
    \ via forward proxy indicating potential drive-by compromise (T1189)\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique\
    \ = \"T1189\"\n    severity = \"Medium\"\n\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.ip_protocol = \"\
    TCP\"\n    $e.principal.ip = $src_ip\n    $e.target.ip = $dest_ip\n    $e.target.port = $dest_port\n    \n    not (\n      re.regex($e.principal.hostname,\
    \ `(?i)(scanner|monitor|probe|nessus|qualys)`) or\n      re.regex($e.principal.asset.hostname, `(?i)(scanner|monitor|probe|nessus|qualys)`)\n\
    \    )\n\n  match:\n    $src_ip, $dest_ip, $dest_port over 24h\n\n  outcome:\n    $risk_score = max(35)\n    $connection_count = count_distinct($e.metadata.id)\n\
    \    $unique_dest_ips = count_distinct($e.target.ip)\n    $total_bytes_out = sum($e.network.sent_bytes)\n    $src_hostname = array_distinct($e.principal.hostname)\n\
    \    $dest_hostname = array_distinct($e.target.hostname)\n\n  condition:\n    #e >= 1\n}\n"
  esql: "FROM logs-network* \n| WHERE network.transport == \"tcp\" AND NOT (source.ip IN (\"10.0.0.5\", \"10.0.0.6\") OR process.name IN (\"nmap\"\
    , \"nessus\", \"qualys\"))\n| STATS conn_count = COUNT(*), unique_dests = COUNT_DISTINCT(destination.ip), total_bytes_out = SUM(source.bytes)\
    \ BY source.ip, destination.ip, destination.port\n| WHERE conn_count >= 1\n| SORT total_bytes_out DESC\n| KEEP source.ip, destination.ip,\
    \ destination.port, conn_count, unique_dests, total_bytes_out\n"
  leql: |
    where(source_json.protocol ICONTAINS "tcp" AND source_address!=<authorized_scanner_ip>) groupby(source_address, destination_address, destination_port) calculate(count), calculate(unique:destination_address), calculate(sum:bytes_out)
  crowdstrike: |
    #type=network (sourcetype=firewall OR sourcetype=ids) network.protocol=*tcp*
    | !in(field=src_ip, values=["10.0.0.100", "10.0.0.200"])
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=connection_count), count(dest_ip, distinct=true, as=unique_dest_ips), sum(bytes_out, as=total_bytes_out)])
    | connection_count >= 1
    | sort(field=total_bytes_out, order=desc, limit=10000)
    | table([src_ip, dest_ip, dest_port, connection_count, unique_dest_ips, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_source_translated_port != null and dst_action_external_hostname != null and lowercase(protocol) = "tcp"
    | comp count() as connection_count, count_distinct(action_destination_translated_ip) as unique_dest_ips, sum(bytes_out) as total_bytes_out by action_source_translated_ip, action_destination_translated_ip, dst_action_external_port
    | filter connection_count >= 1
    | filter action_source_translated_ip not in ("10.0.0.100", "10.0.0.101")
    | sort desc total_bytes_out
    | fields action_source_translated_ip, action_destination_translated_ip, dst_action_external_port, connection_count, unique_dest_ips, total_bytes_out
  lucene: |
    network.protocol:tcp AND NOT (src_ip:(10.1.1.5 OR 10.1.1.6) OR user_agent:*scanner* OR user_agent:*monitor*)
  sumo: |
    _sourceCategory=*proxy* OR _sourceCategory=*firewall* OR _sourceCategory=*ids*
    | where protocol = "tcp" OR protocol matches "*tcp*"
    | where !(src_ip in ("10.0.0.5", "10.0.0.6")) AND !(user_agent matches "*scanner*" OR user_agent matches "*monitor*")
    | sum(bytes_out) as total_bytes_out, count_distinct(dest_ip) as unique_dest_ips, count as connection_count by src_ip, dest_ip, dest_port
    | where connection_count >= 1
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, dest_port, connection_count, unique_dest_ips, total_bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 Instance over any time window of a TCP network connection event.


  From index=network with sourcetype of firewall or ids.

  Where network.protocol contains "tcp".

  With stats aggregated by src_ip, dest_ip, and dest_port capturing total connection count, count of unique destination IPs, and sum of bytes_out.

  Where count is greater than or equal to 1.

  Excluding traffic attributable to authorized scanners or monitoring agents.


  With the same src_ip and dest_ip and dest_port, sorted by highest bytes_out to surface the most significant transfers first.'

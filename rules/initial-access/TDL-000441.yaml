author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 Instance over any time window of a network connection event matching hack tool user agent strings in proxy logs.


  From index=network

  Where sourcetype is firewall or sourcetype is ids

  With network.protocol containing "tcp"

  Where the user agent string matches known hack tool signatures (e.g., sqlmap, nikto, dirbuster, hydra, masscan, nmap, metasploit, or similar
  offensive tooling identifiers)


  Excludes connections originating from authorized scanner source IPs and approved monitoring agent hosts as defined in the allow-list.


  Aggregated by src_ip and dest_ip, tracking count of matching connections, count of unique dest_ip values (unique_dests), and sum of bytes_out,
  requiring count >= 1, sorted descending by bytes_out.


  With the same src_ip and dest_ip and dest_port as the correlation key, deduplicated per unique source-to-destination pair per detection cycle.'

rule_id: TDL-AUTH-000470
v4_id: '000470'
name: Allowed Log4J Exploit Signature Detection
description: Detects when traffic is allowed with a Log4j signature
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=* sourcetype IN (waf, firewall, ids, ips, network*) action=allowed signature="*log4j*"

    | table _time, src, dest, signature, action, uri, user_agent, http_method

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceAction =~ "Allowed"
    | where Message has "log4j" or DeviceCustomString1 has "log4j" or DeviceCustomString2 has "log4j" or DeviceCustomString3 has "log4j" or DeviceCustomString4 has "log4j" or DeviceCustomString5 has "log4j" or DeviceCustomString6 has "log4j" or Activity has "log4j"
    | project TimeGenerated, DeviceVendor, DeviceProduct, DeviceAction, SourceIP, DestinationIP, RequestURL, Message, Activity, DeviceCustomString1, DeviceCustomString2, DeviceCustomString3, DeviceCustomString4, DeviceCustomString5, DeviceCustomString6
  aql: |
    SELECT sourceip, destinationip, qidname(qid) AS signature, LOGSOURCENAME(logsourceid) AS device, COUNT(*) AS event_count
    FROM events
    WHERE LOWER(qidname(qid)) LIKE '%log4j%'
      AND (LOWER(categoryname(category)) LIKE '%allowed%' OR LOWER(categoryname(category)) LIKE '%permit%' OR LOWER(categoryname(category)) NOT LIKE '%block%' AND LOWER(categoryname(category)) NOT LIKE '%deny%')
    GROUP BY sourceip, destinationip, qidname(qid), LOGSOURCENAME(logsourceid)
    LAST 1 HOURS
  yara_l: |
    rule log4j_exploitation_attempt_allowed {
      meta:
        author = "TDL"
        description = "Detects allowed Log4j exploitation attempts (T1190)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1190"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.security_result.action = "ALLOW"
        re.regex($e.security_result.rule_name, `(?i)log4j`) or
        re.regex($e.security_result.summary, `(?i)log4j`) or
        re.regex($e.metadata.description, `(?i)log4j`)
        $e.principal.ip = $source_ip
        $e.target.ip = $target_ip

      match:
        $source_ip, $target_ip over 5m

      outcome:
        $risk_score = max(75)
        $source_ip = $source_ip
        $target_ip = $target_ip
        $rule_name = $e.security_result.rule_name
        $summary = $e.security_result.summary

      condition:
        $e
    }
  esql: |
    FROM logs-*waf*, logs-*ids*, logs-*ips*
    | WHERE event.action == "allowed" AND TO_LOWER(rule.name) LIKE "*log4j*"
    | KEEP @timestamp, host.name, source.ip, destination.ip, destination.port, url.full, rule.name, event.action, http.request.method
  leql: |
    where(source_json.action=Allowed AND source_json.signature ICONTAINS "log4j")
  crowdstrike: |
    #type=waf action=allowed signature=*log4j*
    | table([@timestamp, src_ip, dest_ip, uri, signature, action])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter action = "allow" and lowercase(threat_name) contains "log4j"
    | fields _time, src_ip, dst_ip, dst_port, threat_name, app, url, http_method, agent_hostname
  lucene: |
    event_type:"web application firewall" AND action:allowed AND signature:*log4j*
  sumo: |
    _sourceCategory=*WAF* OR _sourceCategory=*waf* OR _sourceCategory=*firewall*
    | where action="allowed" OR action="Allowed" OR action="ALLOWED" OR action="allow"
    | where signature matches "*log4j*" OR signature matches "*Log4j*" OR signature matches "*LOG4J*"
    | fields _messageTime, _sourceHost, action, signature, src_ip, dest_ip, url
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Web Application Firewall Event

  Where Action is Allowed

  Where the Signature contains "log4j"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

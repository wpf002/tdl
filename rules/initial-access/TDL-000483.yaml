rule_id: TDL-AUTH-000483
v4_id: 000483
name: First Seen Allowed Inbound Telnet Traffic
description: A rule that detects allowed inbound Telnet traffic from an IP that hasn’t been seen in the last 90 days
tactic: Initial Access
tactic_id: TA0001
technique_id: T1021
technique_name: Remote Services
platform:
- Network
data_sources:
- Firewall
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=firewall action=allowed (dest_port=23 OR app=telnet) src_ip IN (NOT 10.0.0.0/8 NOT 172.16.0.0/12 NOT 192.168.0.0/16) dest_ip IN
    (10.0.0.0/8 OR 172.16.0.0/12 OR 192.168.0.0/16)

    | eval src_dest_pair=src_ip."|".dest_ip

    | eventstats earliest(_time) as first_seen by src_ip

    | eval days_since_first_seen=round((now()-first_seen)/86400,0)

    | where days_since_first_seen <= 30

    | stats count min(_time) as first_occurrence by src_ip, dest_ip, dest_port, app

    | where first_occurrence >= relative_time(now(), "-30d")

    | table src_ip, dest_ip, dest_port, app, first_occurrence, count

    '
  kql: "let baseline_period = 30d;\nlet detection_period = 1d;\nlet baseline_ips = \n    CommonSecurityLog\n    | where TimeGenerated between\
    \ (ago(baseline_period + detection_period) .. ago(detection_period))\n    | where DeviceAction == \"Allow\"\n    | where CommunicationDirection\
    \ == \"Inbound\" or (isempty(CommunicationDirection) and DestinationIP startswith \"10.\" or DestinationIP startswith \"172.\" or DestinationIP\
    \ startswith \"192.168.\")\n    | where (DestinationPort == 23 or ApplicationProtocol =~ \"telnet\")\n    | distinct SourceIP;\nCommonSecurityLog\n\
    | where TimeGenerated > ago(detection_period)\n| where DeviceAction == \"Allow\"\n| where CommunicationDirection == \"Inbound\" or (isempty(CommunicationDirection)\
    \ and DestinationIP startswith \"10.\" or DestinationIP startswith \"172.\" or DestinationIP startswith \"192.168.\")\n| where (DestinationPort\
    \ == 23 or ApplicationProtocol =~ \"telnet\")\n| where SourceIP !in (baseline_ips)\n| summarize FirstSeen = min(TimeGenerated), LastSeen =\
    \ max(TimeGenerated), ConnectionCount = count(), DestinationIPs = make_set(DestinationIP), DestinationPorts = make_set(DestinationPort) by\
    \ SourceIP, ApplicationProtocol\n| project FirstSeen, LastSeen, SourceIP, DestinationIPs, DestinationPorts, ApplicationProtocol, ConnectionCount\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, application, COUNT(*) AS event_count
    FROM events
    WHERE (categoryname(category) ILIKE '%firewall%' OR logsourcetypename(devicetype) ILIKE '%firewall%')
      AND sourceip NOT IN (SELECT sourceip FROM events WHERE categoryname(category) ILIKE '%firewall%' AND sourceip IN (SELECT sourceip FROM events WHERE RFC1918(sourceip) = 'true' LAST 30 DAYS) LAST 30 DAYS)
      AND RFC1918(destinationip) = 'true'
      AND (LOWER(qidname(qid)) ILIKE '%accept%' OR LOWER(qidname(qid)) ILIKE '%allow%' OR LOWER(qidname(qid)) ILIKE '%permit%' OR destinationport = 23 OR LOWER(application) = 'telnet')
    GROUP BY sourceip, destinationip, destinationport, application
    LAST 90 DAYS
  yara_l: |
    rule external_telnet_access_new_source {
      meta:
        author = "Detection Engineer"
        description = "Detects inbound telnet connections from new external sources (T1021)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1021"
        severity = "Medium"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.network.direction = "INBOUND"
        $e.security_result.action = "ALLOW"
        (
          $e.target.port = 23 or
          $e.network.application_protocol = "telnet"
        )
        not net.ip_in_range_cidr($e.principal.ip, "10.0.0.0/8")
        not net.ip_in_range_cidr($e.principal.ip, "172.16.0.0/12")
        not net.ip_in_range_cidr($e.principal.ip, "192.168.0.0/16")
        $e.principal.ip = $source_ip
        $e.target.ip = $dest_ip

      match:
        $source_ip, $dest_ip over 1h

      outcome:
        $risk_score = 65
        $source_ip_count = count_distinct($source_ip)

      condition:
        $e and #source_ip_count >= 1
    }
  esql: |
    FROM logs-firewall*
    | WHERE @timestamp > NOW() - 30 days
      AND network.direction == "inbound"
      AND (
        event.action == "allowed"
        OR destination.port == 23
        OR network.application == "telnet"
      )
      AND source.ip IS NOT NULL
      AND destination.ip IS NOT NULL
    | EVAL is_external = CASE(
        STARTS_WITH(source.ip, "10.") OR STARTS_WITH(source.ip, "172.16.") OR STARTS_WITH(source.ip, "172.17.") OR STARTS_WITH(source.ip, "172.18.") OR STARTS_WITH(source.ip, "172.19.") OR STARTS_WITH(source.ip, "172.20.") OR STARTS_WITH(source.ip, "172.21.") OR STARTS_WITH(source.ip, "172.22.") OR STARTS_WITH(source.ip, "172.23.") OR STARTS_WITH(source.ip, "172.24.") OR STARTS_WITH(source.ip, "172.25.") OR STARTS_WITH(source.ip, "172.26.") OR STARTS_WITH(source.ip, "172.27.") OR STARTS_WITH(source.ip, "172.28.") OR STARTS_WITH(source.ip, "172.29.") OR STARTS_WITH(source.ip, "172.30.") OR STARTS_WITH(source.ip, "172.31.") OR STARTS_WITH(source.ip, "192.168.") OR source.ip == "127.0.0.1", 0,
        1
      )
    | WHERE is_external == 1
    | EVAL is_internal = CASE(
        STARTS_WITH(destination.ip, "10.") OR STARTS_WITH(destination.ip, "172.16.") OR STARTS_WITH(destination.ip, "172.17.") OR STARTS_WITH(destination.ip, "172.18.") OR STARTS_WITH(destination.ip, "172.19.") OR STARTS_WITH(destination.ip, "172.20.") OR STARTS_WITH(destination.ip, "172.21.") OR STARTS_WITH(destination.ip, "172.22.") OR STARTS_WITH(destination.ip, "172.23.") OR STARTS_WITH(destination.ip, "172.24.") OR STARTS_WITH(destination.ip, "172.25.") OR STARTS_WITH(destination.ip, "172.26.") OR STARTS_WITH(destination.ip, "172.27.") OR STARTS_WITH(destination.ip, "172.28.") OR STARTS_WITH(destination.ip, "172.29.") OR STARTS_WITH(destination.ip, "172.30.") OR STARTS_WITH(destination.ip, "172.31.") OR STARTS_WITH(destination.ip, "192.168."), 1,
        0
      )
    | WHERE is_internal == 1
    | STATS first_seen = MIN(@timestamp), last_seen = MAX(@timestamp), event_count = COUNT(*) BY source.ip, destination.ip
    | WHERE first_seen > NOW() - 30 days
    | KEEP source.ip, destination.ip, first_seen, last_seen, event_count
  leql: |
    where(log_source_type=firewall AND direction=INBOUND AND action=ALLOW AND (destination_port=23 OR application=telnet))
  crowdstrike: |
    #type=firewall event_simpleName=*Firewall* Action=Allow
    (DestinationPort=23 OR Application=telnet)
    | groupBy([SourceIP, DestinationIP], function=count(as=events))
    | table([SourceIP, DestinationIP, events])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_firewall_action = "allow" and dest_port = 23 and action_app_id_category = "telnet"
    | filter not incidr(source_ip, "10.0.0.0/8") and not incidr(source_ip, "172.16.0.0/12") and not incidr(source_ip, "192.168.0.0/16")
    | filter incidr(dest_ip, "10.0.0.0/8") or incidr(dest_ip, "172.16.0.0/12") or incidr(dest_ip, "192.168.0.0/16")
    | comp count() as conn_count by source_ip, dest_ip
    | fields source_ip, dest_ip, conn_count
  lucene: |
    (source_type:"firewall" OR event_type:"firewall" OR log_source:"firewall") AND direction:inbound AND action:allowed AND (destination.port:23 OR application:telnet) AND NOT source.ip:10.0.0.0/8 AND NOT source.ip:172.16.0.0/12 AND NOT source.ip:192.168.0.0/16
  sumo: |
    _sourceCategory=*firewall* OR _sourceCategory=*Firewall* OR _sourceCategory=*network*
    | where (action matches "*allow*" OR action matches "*permit*" OR dest_port = "23" OR app matches "*telnet*")
    | where direction matches "*inbound*" OR direction matches "*in*" OR src_ip !matches "10.*" AND src_ip !matches "172.16.*" AND src_ip !matches "172.17.*" AND src_ip !matches "172.18.*" AND src_ip !matches "172.19.*" AND src_ip !matches "172.20.*" AND src_ip !matches "172.21.*" AND src_ip !matches "172.22.*" AND src_ip !matches "172.23.*" AND src_ip !matches "172.24.*" AND src_ip !matches "172.25.*" AND src_ip !matches "172.26.*" AND src_ip !matches "172.27.*" AND src_ip !matches "172.28.*" AND src_ip !matches "172.29.*" AND src_ip !matches "172.30.*" AND src_ip !matches "172.31.*" AND src_ip !matches "192.168.*"
    | timeslice 1d
    | count by src_ip, dest_ip
    | where _count >= 1
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Firewall Event \nFrom one external source to one internal destination (Inbound)\nWhere the Action is Allowed\nOR\n    Where the\
  \ Destination Port is \"23\"\n\n    Where the Application is \"telnet\"\n\nBaseline Learning: 30 Days\nRetention: 90 Days\n\nNew Value: Source\
  \ IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

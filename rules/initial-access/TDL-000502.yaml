rule_id: TDL-AUTH-000502
v4_id: '000502'
name: Blocked Directory Traversal Traffic
description: Detects when traffic is blocked with a directory traversal signature or common directory traversal request patterns.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
- Webserver
- Reverse Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: |
    (index=* (sourcetype=waf OR sourcetype=firewall OR sourcetype=ids OR sourcetype=ips OR sourcetype=access_combined OR sourcetype=access_* OR sourcetype=nginx* OR sourcetype=apache* OR sourcetype=iis OR sourcetype=reverseproxy OR source=*waf* OR source=*firewall* OR source=*ids* OR source=*ips* OR source=*access* OR source=*proxy*))
    (
      (action=blocked OR action=deny OR action=drop OR Action=blocked OR Action=deny OR Action=drop)
      OR (signature IN ("*traversal*","*lfi*") OR Signature IN ("*traversal*","*lfi*") OR sig_name IN ("*traversal*","*lfi*"))
      OR (uri IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*") OR url IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*") OR cs_uri_query IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*") OR cs_uri_stem IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*") OR request IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*") OR http_request IN ("*../*","*\\..\\..*","*..../*","*\"\"\"\"*","*<<*","*><*","*./././*","*\\\\*","*\\\\.\\*","*/%c0%ae%c0%ae/*","*@fs/*","*file:/*","*file%3a/*"))
      OR (status IN (4*,5*) OR http_status IN (4*,5*) OR sc_status IN (4*,5*) OR response_code IN (4*,5*) OR status_code IN (4*,5*))
    )
    | eval uri_field=coalesce(uri,url,cs_uri_stem,cs_uri_query,request,http_request)
    | eval status_field=coalesce(status,http_status,sc_status,response_code,status_code)
    | eval action_field=coalesce(action,Action)
    | eval sig_field=coalesce(signature,Signature,sig_name)
    | table _time, host, src_ip, src, dest_ip, dest, uri_field, status_field, action_field, sig_field, sourcetype
  kql: 'union (DeviceNetworkEvents), (CommonSecurityLog | extend SourceIP=tostring(SourceIP), DestinationIP=tostring(DestinationIP))

    | where TimeGenerated > ago(1d)

    | where network.protocol matches regex "tcp"

    | summarize Count=count(), Bytes=sum(coalesce(SentBytes, 0)) by SourceIP, DestinationIP, DestinationPort

    | order by Bytes desc

    '
  aql: 'SELECT sourceip, destinationip, destinationport, SUM(eventcount) as connections, SUM(bytessrc) as bytes_out

    FROM flows

    WHERE "network.protocol" LIKE ''%tcp%''

    GROUP BY sourceip, destinationip, destinationport

    LAST 1 HOURS

    '
  yara_l: "rule tdl_tdl_auth_000502 {\n  meta:\n    author = \"TDL\"\n    description = \"Blocked Directory Traversal Traffic\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1190\"\n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n    $e.network.protocol\
    \ = /tcp/\n    $src = $e.principal.ip\n  match:\n    $src over 10m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-network*,logs-endpoint*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "network" AND network.protocol LIKE "%tcp%"

    | STATS bytes_out = SUM(network.bytes), conns = COUNT(*) BY source.ip, destination.ip, destination.port

    | SORT bytes_out DESC

    '
  leql: 'where(logset = "Network Activity" AND network.protocol=/tcp/)

    groupby(source_ip, destination_ip, destination_port)

    calculate(count, sum(bytes_out))

    '
  crowdstrike: 'event_simpleName IN (NetworkConnectIP4, NetworkConnectIP6, DnsRequest) AND network.protocol=*tcp*

    | stats count as conns, sum(BytesSent) as bytes_out by ComputerName, RemoteAddressIP4, RemotePort

    | sort -bytes_out

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.NETWORK AND network.protocol ~= "tcp"

    | comp count() as conns, sum(action_total_bytes) as bytes_out by agent_hostname, action_remote_ip, action_remote_port

    | sort desc bytes_out

    '
  lucene: 'event.category:"network" AND network.protocol:*tcp*

    '
  sumo: '_sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*flow*

    | where network.protocol matches "*tcp*"

    | sum(bytes_out) as bytes_out, count by src_ip, dest_ip, dest_port

    | sort by bytes_out desc

    '
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Web Application Firewall Event\nWhere Action is Blocked\nOR\n    Where the Signature contains \"traversal\"\n\n    Where the\
  \ Signature contains \"lfi\"\n\n--------------------------------------------------\n\n1 Reverse Proxy/Webserver Event\nOR\n    Where the URI\
  \ contains \"../\"\n\t\n    Where the URI contains \"\\\\..\\\\\"\n\t\n    Where the URI contains \"..../\"\n\t\n    Where the URI contains\
  \ \"\\\"\\\"\\\"\\\"\"\n\t\n    Where the URI contains \"<<\"\n\t\n    Where the URI contains \"><\"\n\t\n    Where the URI contains \"./././\"\
  \n\t\n    Where the URI contains \"\\\\\\\\\"\n\t\n    Where the URI contains \"\\\\\\\\.\\\\\"\n\t\n    Where the URI contains \"/%c0%ae%c0%ae/\"\
  \n\t\n    Where the URI contains \"@fs/\"\n\t\n    Where the URI contains \"file:/\"\n\t\n    Where the URI contains \"file%3a/\"\n\nOR\n  \
  \  Where the Response Code does starts with \"4\"\n\n    Where the Response Code does starts with \"5\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

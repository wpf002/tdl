rule_id: TDL-AUTH-000502
v4_id: '000502'
name: Blocked Directory Traversal Traffic
description: Detects when traffic is blocked with a directory traversal signature or common directory traversal request patterns.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
- Webserver
- Reverse Proxy
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "(index=* (sourcetype=waf OR sourcetype=firewall OR sourcetype=ids OR sourcetype=ips OR sourcetype=access_combined OR sourcetype=access_*\
    \ OR sourcetype=nginx* OR sourcetype=apache* OR sourcetype=iis OR sourcetype=reverseproxy OR source=*waf* OR source=*firewall* OR source=*ids*\
    \ OR source=*ips* OR source=*access* OR source=*proxy*))\n(\n  (action=blocked OR action=deny OR action=drop OR Action=blocked OR Action=deny\
    \ OR Action=drop)\n  OR (signature IN (\"*traversal*\",\"*lfi*\") OR Signature IN (\"*traversal*\",\"*lfi*\") OR sig_name IN (\"*traversal*\"\
    ,\"*lfi*\"))\n  OR (uri IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\"\\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\"\
    ,\"*\\\\\\\\.\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\") OR url IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\
    \"\\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\",\"*\\\\\\\\.\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\"\
    ) OR cs_uri_query IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\"\\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\",\"*\\\\\
    \\\\.\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\") OR cs_uri_stem IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\
    \"\\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\",\"*\\\\\\\\.\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\"\
    ) OR request IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\"\\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\",\"*\\\\\\\\\
    .\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\") OR http_request IN (\"*../*\",\"*\\\\..\\\\..*\",\"*..../*\",\"*\\\"\
    \\\"\\\"\\\"*\",\"*<<*\",\"*><*\",\"*./././*\",\"*\\\\\\\\*\",\"*\\\\\\\\.\\\\*\",\"*/%c0%ae%c0%ae/*\",\"*@fs/*\",\"*file:/*\",\"*file%3a/*\"\
    ))\n  OR (status IN (4*,5*) OR http_status IN (4*,5*) OR sc_status IN (4*,5*) OR response_code IN (4*,5*) OR status_code IN (4*,5*))\n)\n\
    | eval uri_field=coalesce(uri,url,cs_uri_stem,cs_uri_query,request,http_request)\n| eval status_field=coalesce(status,http_status,sc_status,response_code,status_code)\n\
    | eval action_field=coalesce(action,Action)\n| eval sig_field=coalesce(signature,Signature,sig_name)\n| table _time, host, src_ip, src, dest_ip,\
    \ dest, uri_field, status_field, action_field, sig_field, sourcetype\n"
  kql: |
    let WAFEvents = CommonSecurityLog
    | where TimeGenerated > ago(1h)
    | where DeviceVendor has_any ("Palo Alto Networks", "Fortinet", "Imperva", "F5", "Barracuda", "Cloudflare", "Akamai")
    | where DeviceAction =~ "Blocked" or Activity has_any ("traversal", "lfi")
    | project TimeGenerated, SourceIP, DestinationIP, RequestURL, DeviceAction, Activity, DeviceVendor, DeviceProduct, Message;
    let WebServerEvents = W3CIISLog
    | union (AzureDiagnostics | where Category == "ApplicationGatewayAccessLog")
    | union (AzureDiagnostics | where ResourceType == "APPLICATIONGATEWAYS")
    | where TimeGenerated > ago(1h)
    | extend URI = coalesce(csUriStem, requestUri_s, OriginalRequestUriWithArgs)
    | extend ResponseCode = coalesce(scStatus, httpStatus_d, tostring(httpStatus_s))
    | where URI has_any ("../", "..\\", "....\\", "....//", "\"\"\"\"", "<<", "><", "./././", "\\\\", "\\\\..\\", "\\\\..\\\\", "/%c0%ae%c0%ae/", "@fs/", "file:/", "file%3a/")
        or (ResponseCode startswith "4" or ResponseCode startswith "5")
    | project TimeGenerated, SourceIP = coalesce(cIP, clientIP_s), DestinationIP = coalesce(sIP, serverIP_s), URI, ResponseCode, UserAgent = coalesce(csUserAgent, userAgent_s), Method = coalesce(csMethod, httpMethod_s);
    WAFEvents
    | union WebServerEvents
    | project TimeGenerated, SourceIP, DestinationIP, URI = coalesce(URI, RequestURL), ResponseCode, UserAgent, Method, DeviceAction, Activity, DeviceVendor, DeviceProduct, Message
  aql: |
    SELECT sourceip, destinationip, username, QIDNAME(qid) AS event_name, CATEGORYNAME(category) AS category, "URL", "URI", "Signature", "Action", "Response Code", COUNT(*) AS event_count
    FROM events
    WHERE (
        (CATEGORYNAME(category) ILIKE '%firewall%' OR CATEGORYNAME(category) ILIKE '%waf%' OR CATEGORYNAME(category) ILIKE '%intrusion%' OR CATEGORYNAME(category) ILIKE '%ids%' OR CATEGORYNAME(category) ILIKE '%ips%')
        AND (
            "Action" ILIKE '%block%'
            OR "Signature" ILIKE '%traversal%'
            OR "Signature" ILIKE '%lfi%'
        )
    )
    OR (
        (CATEGORYNAME(category) ILIKE '%web%' OR CATEGORYNAME(category) ILIKE '%proxy%' OR CATEGORYNAME(category) ILIKE '%http%')
        AND (
            "URI" LIKE '%../%'
            OR "URI" LIKE '%\\..\\%'
            OR "URI" LIKE '%..../%'
            OR "URI" LIKE '%""""""%'
            OR "URI" LIKE '%<<%'
            OR "URI" LIKE '%><%'
            OR "URI" LIKE '%./././%'
            OR "URI" LIKE '%\\\\%'
            OR "URI" LIKE '%\\\\.\\%'
            OR "URI" ILIKE '%/%c0%ae%c0%ae/%'
            OR "URI" LIKE '%@fs/%'
            OR "URI" ILIKE '%file:/%'
            OR "URI" ILIKE '%file%3a/%'
            OR "Response Code" LIKE '4%'
            OR "Response Code" LIKE '5%'
        )
    )
    GROUP BY sourceip, destinationip, username, qid, category, "URL", "URI", "Signature", "Action", "Response Code"
    LAST 1 HOURS
  yara_l: "rule path_traversal_exploit_attempts {\n  meta:\n    author = \"TDL\"\n    description = \"Detects path traversal and LFI exploit attempts\
    \ via WAF blocks or suspicious URI patterns\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1190\"\n    \n\
    \  events:\n    // WAF blocked events\n    ($waf.metadata.event_type = \"NETWORK_HTTP\" or\n     $waf.metadata.event_type = \"GENERIC_EVENT\"\
    ) and\n    ($waf.security_result.action = \"BLOCK\" or\n     re.regex($waf.security_result.summary, `(?i)(traversal|lfi)`))\n    $waf.target.ip\
    \ = $target_ip\n    $waf.network.http.parsed_user_agent = $user_agent\n    \n    or\n    \n    // Web server / reverse proxy events with suspicious\
    \ URIs\n    ($web.metadata.event_type = \"NETWORK_HTTP\" or\n     $web.metadata.event_type = \"GENERIC_EVENT\") and\n    (re.regex($web.target.url,\
    \ `\\.\\./`) or\n     re.regex($web.target.url, `\\\\\\\\\\.\\./`) or\n     re.regex($web.target.url, `\\.\\.\\.\\.?/`) or\n     re.regex($web.target.url,\
    \ `\"\"\"\"`) or\n     re.regex($web.target.url, `<<`) or\n     re.regex($web.target.url, `><`) or\n     re.regex($web.target.url, `\\./\\\
    ./\\./`) or\n     re.regex($web.target.url, `\\\\\\\\\\\\\\\\`) or\n     re.regex($web.target.url, `\\\\\\\\\\\\\\\\\\.\\\\/`) or\n     re.regex($web.target.url,\
    \ `(?i)/%c0%ae%c0%ae/`) or\n     re.regex($web.target.url, `(?i)@fs/`) or\n     re.regex($web.target.url, `(?i)file:/`) or\n     re.regex($web.target.url,\
    \ `(?i)file%3a/`) or\n     re.regex($web.network.http.response_code, `^[45]`))\n    $web.target.ip = $target_ip\n    $web.network.http.parsed_user_agent\
    \ = $user_agent\n\n  match:\n    $target_ip, $user_agent over 5m\n    \n  condition:\n    $waf or $web\n}\n"
  esql: |
    FROM logs-network*, logs-web*, logs-waf*, logs-proxy*
    | WHERE @timestamp > NOW() - 24 hours
    | WHERE (
        (event.category == "web" OR event.category == "network" OR event.category == "intrusion_detection")
        AND (
          (event.action == "blocked" OR event.action == "denied")
          OR (TO_LOWER(COALESCE(rule.name, event.action, "")) LIKE "*traversal*")
          OR (TO_LOWER(COALESCE(rule.name, event.action, "")) LIKE "*lfi*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*../*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*\\..\\..*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*..../*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*\"\"\"\"*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*<<*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*><*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*./././*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*\\\\\\\\*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*\\\\\\\\.\\\\*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*/%c0%ae%c0%ae/*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*@fs/*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*file:/*")
          OR (TO_LOWER(COALESCE(url.path, url.original, http.request.uri, "")) LIKE "*file%3a/*")
          OR STARTS_WITH(TO_STRING(COALESCE(http.response.status_code, event.outcome, "")), "4")
          OR STARTS_WITH(TO_STRING(COALESCE(http.response.status_code, event.outcome, "")), "5")
        )
      )
    | KEEP @timestamp, host.name, source.ip, destination.ip, url.path, url.original, http.request.uri, http.response.status_code, event.action, rule.name, user.name, http.request.method
  leql: |
    where(
      (source_json.action=BLOCKED) OR
      (source_json.signature ICONTAINS "traversal") OR
      (source_json.signature ICONTAINS "lfi") OR
      (uri CONTAINS "../") OR
      (uri CONTAINS "\\..\\") OR
      (uri CONTAINS "..../") OR
      (uri CONTAINS "\"\"\"\"") OR
      (uri CONTAINS "<<") OR
      (uri CONTAINS "><") OR
      (uri CONTAINS "./././") OR
      (uri CONTAINS "\\\\") OR
      (uri CONTAINS "\\\\.\\") OR
      (uri CONTAINS "/%c0%ae%c0%ae/") OR
      (uri CONTAINS "@fs/") OR
      (uri CONTAINS "file:/") OR
      (uri CONTAINS "file%3a/") OR
      (source_json.response_code STARTS-WITH "4") OR
      (source_json.response_code STARTS-WITH "5")
    )
  crowdstrike: |
    (#type=waf OR #type=ids OR #type=ips OR event_simpleName=*WAF* OR event_simpleName=*IDS* OR event_simpleName=*IPS*) (action=blocked OR action=block OR action=Blocked OR signature=*traversal* OR signature=*lfi*)
    OR
    (#type=webserver OR #type=reverseproxy OR #type=proxy OR event_simpleName=*WebRequest* OR event_simpleName=*HTTPRequest* OR event_simpleName=*ProxyRequest*) (uri=*../* OR uri=*\\..\\* OR uri=*..../* OR uri=*\"\"\"\"* OR uri=*<<* OR uri=*><* OR uri=*./././* OR uri=*\\\\* OR uri=*\\\\.\\* OR uri=*/%c0%ae%c0%ae/* OR uri=*@fs/* OR uri=*file:/* OR uri=*file%3a/* OR response_code=4* OR response_code=5* OR status_code=4* OR status_code=5* OR http_status=4* OR http_status=5*)
    | table([@timestamp, ComputerName, #type, event_simpleName, action, signature, uri, response_code, status_code, http_status, source_ip, dest_ip, method])
  xql: |
    dataset = panw_ngfw_threat_raw
    | filter action_threat = "block" or (signature ~= "(?i)(traversal|lfi)")
    | fields _time, src_ip, dst_ip, signature, action_threat, http_url, http_response_code
    | union (
        dataset = webserver_logs
        | filter http_url ~= "(?i)(\\.\\./|\\\\\\.\\.\\\\|\\.\\.\\.\\.?/|\"\"\"\"|<<|><|\\./\\./\\./|\\\\\\\\|\\\\\\\\\\.|/%c0%ae%c0%ae/|@fs/|file:/|file%3a/)" or to_string(http_response_code) ~= "^[45]"
        | fields _time, src_ip, dst_ip, http_url, http_response_code
    )
  lucene: |
    (event.category:firewall AND action:blocked) OR (signature:(*traversal* OR *lfi*)) OR (uri:(*../* OR *\\..\\* OR *..../* OR *\"\"\"\"* OR *<<* OR *><* OR *./././* OR *\\\\* OR *\\\\.\\* OR *\/%c0%ae%c0%ae\/* OR *@fs\/* OR *file:\/* OR *file%3a\/*)) OR (http.response.status_code:(4* OR 5*))
  sumo: |
    (_sourceCategory=*WAF* OR _sourceCategory=*IDS* OR _sourceCategory=*IPS* OR _sourceCategory=*webserver* OR _sourceCategory=*proxy* OR _sourceCategory=*nginx* OR _sourceCategory=*apache* OR _sourceCategory=*iis*)
    | json field=_raw "action" as action
    | json field=_raw "signature" as signature
    | json field=_raw "uri" as uri
    | json field=_raw "url" as url
    | json field=_raw "request_uri" as request_uri
    | json field=_raw "cs_uri_stem" as cs_uri_stem
    | json field=_raw "response_code" as response_code
    | json field=_raw "status" as status
    | json field=_raw "sc_status" as sc_status
    | if(isNull(uri), if(isNull(url), if(isNull(request_uri), cs_uri_stem, request_uri), url), uri) as uri_field
    | if(isNull(response_code), if(isNull(status), sc_status, status), response_code) as response_code_field
    | where (action matches "*block*" or action matches "*deny*")
       or (signature matches "*traversal*")
       or (signature matches "*lfi*")
       or (uri_field matches "*../*")
       or (uri_field matches "*\\..\\..*")
       or (uri_field matches "*..../*")
       or (uri_field matches "*\"\"\"\"*")
       or (uri_field matches "*<<*")
       or (uri_field matches "*><*")
       or (uri_field matches "*./././*")
       or (uri_field matches "*\\\\\\\\*")
       or (uri_field matches "*\\\\\\.\\\\*")
       or (uri_field matches "*/%c0%ae%c0%ae/*")
       or (uri_field matches "*@fs/*")
       or (uri_field matches "*file:/*")
       or (uri_field matches "*file%3a/*")
       or (response_code_field matches "4*")
       or (response_code_field matches "5*")
    | fields _messageTime, _sourceHost, action, signature, uri_field, response_code_field
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net

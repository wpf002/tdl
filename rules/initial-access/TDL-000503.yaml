rule_id: TDL-AUTH-000503
v4_id: '000503'
name: Blocked Log4J Exploit Signature Detection
description: Detects when traffic is blocked with a Log4j signature
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=* (sourcetype=waf OR sourcetype=network OR sourcetype=ids OR sourcetype=ips) action=blocked Signature="*log4j*"

    | table _time, src, dest, Signature, action, http_method, url, user_agent

    '
  kql: |
    CommonSecurityLog
    | where TimeGenerated > ago(24h)
    | where DeviceAction =~ "Blocked"
    | where Message has "log4j" or DeviceCustomString1 has "log4j" or DeviceCustomString2 has "log4j" or DeviceCustomString3 has "log4j" or DeviceCustomString4 has "log4j" or DeviceCustomString5 has "log4j" or DeviceCustomString6 has "log4j" or AdditionalExtensions has "log4j" or Activity has "log4j"
    | project TimeGenerated, DeviceVendor, DeviceProduct, DeviceAction, SourceIP, DestinationIP, RequestURL, Message, Activity, DeviceCustomString1, DeviceCustomString2, DeviceCustomString3, DeviceCustomString4, DeviceCustomString5, DeviceCustomString6, AdditionalExtensions
  aql: |
    SELECT sourceip, destinationip, LOGSOURCENAME(logsourceid) AS waf_device, qidname(qid) AS signature, COUNT(*) AS blocked_attempts
    FROM events
    WHERE categoryname(category) ILIKE '%firewall%'
      AND (qidname(qid) ILIKE '%blocked%' OR qidname(qid) ILIKE '%deny%' OR qidname(qid) ILIKE '%drop%')
      AND qidname(qid) ILIKE '%log4j%'
    GROUP BY sourceip, destinationip, LOGSOURCENAME(logsourceid), qidname(qid)
    LAST 1 HOURS
  yara_l: |
    rule log4j_exploit_attempt_blocked {
      meta:
        author = "TDL"
        description = "Detects blocked Log4j exploitation attempts (T1190 - Exploit Public-Facing Application)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1190"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_HTTP"
        $e.security_result.action = "BLOCK"
        re.regex($e.security_result.detection_fields.value, `(?i)log4j`)
        $e.target.ip = $target_ip

      match:
        $target_ip over 5m

      condition:
        $e
    }
  esql: "FROM logs-waf-* \n| WHERE action == \"blocked\" AND TO_LOWER(signature) LIKE \"*log4j*\"\n| KEEP @timestamp, source.ip, destination.ip,\
    \ destination.port, signature, action, url.path, http.request.method\n"
  leql: |
    where(action=BLOCKED AND signature ICONTAINS "log4j")
  crowdstrike: |
    #type=waf action=blocked signature=*log4j*
    | table([@timestamp, src_ip, dest_ip, signature, uri, action])
  xql: |
    dataset = firewall_waf_raw
    | filter action_firewall_rule_action = "blocked" and lowercase(action_firewall_signature_name) contains "log4j"
    | fields _time, agent_hostname, action_source, action_destination, action_source_ip, action_destination_ip, action_firewall_signature_name, action_firewall_rule_action
  lucene: |
    event.category:"web" AND action:blocked AND signature:*log4j*
  sumo: |
    _sourceCategory=*WAF* OR _sourceCategory=*IDS* OR _sourceCategory=*IPS* OR _sourceCategory=*firewall*
    | parse regex "(?i)action[=:\s]+(?<action>\w+)" nodrop
    | parse regex "(?i)signature[=:\s\"']+(?<signature>[^\"'\n]+)" nodrop
    | json field=_raw "action" as action_json nodrop
    | json field=_raw "signature" as signature_json nodrop
    | json field=_raw "rule" as rule_json nodrop
    | json field=_raw "message" as message_json nodrop
    | if(isNull(action), action_json, action) as action
    | if(isNull(signature), signature_json, signature) as signature
    | if(isNull(signature), rule_json, signature) as signature
    | if(isNull(signature), message_json, signature) as signature
    | where action matches "*block*" and signature matches "*log4j*"
    | fields _messageTime, _sourceHost, action, signature
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Web Application Firewall Event

  Where Action is Blocked

  Where the Signature contains "log4j"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

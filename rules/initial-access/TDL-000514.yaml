rule_id: TDL-AUTH-000514
v4_id: '000514'
name: Domain Password Spray Commandlet Activity
description: Detects when a PowerShell script or command line contains the commandlets to perform a password spray.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))\n(\n  (EventCode=592 OR EventCode=4688) \n  (Image=\"*\\\\powershell.exe\"\
    \ OR process_name=\"*powershell.exe\" OR NewProcessName=\"*\\\\powershell.exe\")\n  (CommandLine=\"*Invoke-DomainPasswordSpray*\" OR CommandLine=\"\
    *Get-DomainUserList*\" OR CommandLine=\"*Invoke-SpraySinglePassword*\" OR CommandLine=\"*Get-ObservationWindow*\")\n)\nOR\n(\n  EventCode=4104\n\
    \  (ScriptBlockText=\"*Invoke-DomainPasswordSpray*\" OR ScriptBlockText=\"*Get-DomainUserList*\" OR ScriptBlockText=\"*Invoke-SpraySinglePassword*\"\
    \ OR ScriptBlockText=\"*Get-ObservationWindow*\")\n)\n| table _time, ComputerName, EventCode, User, Image, NewProcessName, process_name, CommandLine,\
    \ ScriptBlockText\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name in ("powershell.exe")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" IN ('powershell.exe')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000514 {\n  meta:\n    author = \"TDL\"\n    description = \"Domain Password Spray Commandlet Activity\"\n    severity\
    \ = \"MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1204\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /(powershell.exe)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name IN ("powershell.exe")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name IN [powershell.exe])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name IN (powershell.exe)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name in ("powershell.exe")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:(powershell.exe)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name IN ("powershell.exe")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nOR\n    Where\
  \ the Command Line contains \"Invoke-DomainPasswordSpray\"\n    Where the Command Line contains \"Get-DomainUserList\"\n    Where the Command\
  \ Line contains \"Invoke-SpraySinglePassword\"\n    Where the Command Line contains \"Get-ObservationWindow\"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nOR\n    Where the Script contains \"Invoke-DomainPasswordSpray\"\n\
  \    Where the Script contains \"Get-DomainUserList\"\n    Where the Script contains \"Invoke-SpraySinglePassword\"\n    Where the Script contains\
  \ \"Get-ObservationWindow\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000514
v4_id: '000514'
name: Domain Password Spray Commandlet Activity
description: Detects when a PowerShell script or command line contains the commandlets to perform a password spray.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1204
technique_name: User Execution
platform:
- Windows
data_sources:
- Windows Operating System
- Powershell Script Block
- 'Event IDs: 4688, 4104'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688 OR EventCode=4104))\n(\n  (EventCode=592 OR EventCode=4688) \n  (Image=\"*\\\\powershell.exe\"\
    \ OR process_name=\"*powershell.exe\" OR NewProcessName=\"*\\\\powershell.exe\")\n  (CommandLine=\"*Invoke-DomainPasswordSpray*\" OR CommandLine=\"\
    *Get-DomainUserList*\" OR CommandLine=\"*Invoke-SpraySinglePassword*\" OR CommandLine=\"*Get-ObservationWindow*\")\n)\nOR\n(\n  EventCode=4104\n\
    \  (ScriptBlockText=\"*Invoke-DomainPasswordSpray*\" OR ScriptBlockText=\"*Get-DomainUserList*\" OR ScriptBlockText=\"*Invoke-SpraySinglePassword*\"\
    \ OR ScriptBlockText=\"*Get-ObservationWindow*\")\n)\n| table _time, ComputerName, EventCode, User, Image, NewProcessName, process_name, CommandLine,\
    \ ScriptBlockText\n"
  kql: "union \n(SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID in (592, 4688)\n| where Process has \"powershell.exe\" or CommandLine\
    \ has_any (\"Invoke-DomainPasswordSpray\", \"Get-DomainUserList\", \"Invoke-SpraySinglePassword\", \"Get-ObservationWindow\")\n| project TimeGenerated,\
    \ Computer, Account, EventID, Process, CommandLine, ParentProcessName),\n(Event\n| where TimeGenerated > ago(1h)\n| where EventID == 4104\n\
    | where RenderedDescription has_any (\"Invoke-DomainPasswordSpray\", \"Get-DomainUserList\", \"Invoke-SpraySinglePassword\", \"Get-ObservationWindow\"\
    )\n| project TimeGenerated, Computer, UserName, EventID, ScriptBlock = RenderedDescription)\n"
  aql: "SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, \"EventID\", \"Process Name\", \"Process CommandLine\", \"ScriptBlockText\"\
    \nFROM events\nWHERE (\n  (\"EventID\" IN ('592', '4688') \n   AND \"Process Name\" ILIKE '%powershell.exe%'\n   AND (\"Process CommandLine\"\
    \ ILIKE '%Invoke-DomainPasswordSpray%' \n        OR \"Process CommandLine\" ILIKE '%Get-DomainUserList%'\n        OR \"Process CommandLine\"\
    \ ILIKE '%Invoke-SpraySinglePassword%'\n        OR \"Process CommandLine\" ILIKE '%Get-ObservationWindow%'))\n  OR\n  (\"EventID\" = '4104'\n\
    \   AND (\"ScriptBlockText\" ILIKE '%Invoke-DomainPasswordSpray%'\n        OR \"ScriptBlockText\" ILIKE '%Get-DomainUserList%'\n        OR\
    \ \"ScriptBlockText\" ILIKE '%Invoke-SpraySinglePassword%'\n        OR \"ScriptBlockText\" ILIKE '%Get-ObservationWindow%'))\n)\nLAST 1 HOURS\n"
  yara_l: |
    rule powershell_domainpasswordspray_execution {
      meta:
        author = "TDL"
        description = "Detects execution of DomainPasswordSpray PowerShell module via process execution or script block logging"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1204"
        severity = "HIGH"

      events:
        // Process execution events (4688)
        $proc.metadata.event_type = "PROCESS_LAUNCH"
        (
          $proc.metadata.product_event_type = "592" or
          $proc.metadata.product_event_type = "4688"
        )
        (
          re.regex($proc.principal.process.file.full_path, `(?i)powershell\.exe$`) or
          (
            re.regex($proc.principal.process.command_line, `Invoke-DomainPasswordSpray`) and
            re.regex($proc.principal.process.command_line, `Get-DomainUserList`) and
            re.regex($proc.principal.process.command_line, `Invoke-SpraySinglePassword`) and
            re.regex($proc.principal.process.command_line, `Get-ObservationWindow`)
          )
        )
        $proc.principal.hostname = $host

        // PowerShell Script Block events (4104)
        $script.metadata.product_event_type = "4104"
        (
          re.regex($script.security_result.description, `Invoke-DomainPasswordSpray`) and
          re.regex($script.security_result.description, `Get-DomainUserList`) and
          re.regex($script.security_result.description, `Invoke-SpraySinglePassword`) and
          re.regex($script.security_result.description, `Get-ObservationWindow`)
        )
        $script.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $proc or $script
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*, logs-windows.powershell_operational*
    | WHERE @timestamp > NOW() - 24 hours
    | WHERE (
        (event.code IN ("592", "4688") AND process.name == "powershell.exe" AND (
          process.command_line LIKE "*Invoke-DomainPasswordSpray*" OR
          process.command_line LIKE "*Get-DomainUserList*" OR
          process.command_line LIKE "*Invoke-SpraySinglePassword*" OR
          process.command_line LIKE "*Get-ObservationWindow*"
        ))
        OR
        (event.code == "4104" AND (
          winlog.event_data.ScriptBlockText LIKE "*Invoke-DomainPasswordSpray*" OR
          winlog.event_data.ScriptBlockText LIKE "*Get-DomainUserList*" OR
          winlog.event_data.ScriptBlockText LIKE "*Invoke-SpraySinglePassword*" OR
          winlog.event_data.ScriptBlockText LIKE "*Get-ObservationWindow*"
        ))
      )
    | KEEP @timestamp, host.name, user.name, event.code, process.name, process.command_line, winlog.event_data.ScriptBlockText
  leql: |
    where((source_json.EventID IN [592, 4688] AND (process_name ICONTAINS "powershell.exe" OR process_cmd_line ICONTAINS "Invoke-DomainPasswordSpray" OR process_cmd_line ICONTAINS "Get-DomainUserList" OR process_cmd_line ICONTAINS "Invoke-SpraySinglePassword" OR process_cmd_line ICONTAINS "Get-ObservationWindow")) OR (source_json.EventID=4104 AND (source_json.ScriptBlockText ICONTAINS "Invoke-DomainPasswordSpray" OR source_json.ScriptBlockText ICONTAINS "Get-DomainUserList" OR source_json.ScriptBlockText ICONTAINS "Invoke-SpraySinglePassword" OR source_json.ScriptBlockText ICONTAINS "Get-ObservationWindow")))
  crowdstrike: |
    (EventCode=4688 OR EventCode=592 OR EventCode=4104)
    (
      (
        (EventCode=4688 OR EventCode=592)
        (
          (FileName=powershell.exe OR NewProcessName=*powershell.exe)
          OR
          (CommandLine=*Invoke-DomainPasswordSpray* AND CommandLine=*Get-DomainUserList* AND CommandLine=*Invoke-SpraySinglePassword* AND CommandLine=*Get-ObservationWindow*)
        )
      )
      OR
      (
        EventCode=4104
        (ScriptBlockText=*Invoke-DomainPasswordSpray* AND ScriptBlockText=*Get-DomainUserList* AND ScriptBlockText=*Invoke-SpraySinglePassword* AND ScriptBlockText=*Get-ObservationWindow*)
      )
    )
    | table([@timestamp, ComputerName, EventCode, FileName, NewProcessName, CommandLine, ScriptBlockText, UserName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and (lowercase(action_process_image_name) contains "powershell.exe" or action_process_image_command_line ~= "(?i)(Invoke-DomainPasswordSpray|Get-DomainUserList|Invoke-SpraySinglePassword|Get-ObservationWindow)"))
        or (action_evtlog_event_id = 4104 and action_evtlog_message ~= "(?i)(Invoke-DomainPasswordSpray|Get-DomainUserList|Invoke-SpraySinglePassword|Get-ObservationWindow)")
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_id, action_process_image_name, action_process_image_command_line, action_evtlog_message
  lucene: |
    (event.code:(592 OR 4688) AND process.name:*powershell.exe AND (process.command_line:*Invoke-DomainPasswordSpray* OR process.command_line:*Get-DomainUserList* OR process.command_line:*Invoke-SpraySinglePassword* OR process.command_line:*Get-ObservationWindow*)) OR (event.code:4104 AND (powershell.file.script_block_text:*Invoke-DomainPasswordSpray* OR powershell.file.script_block_text:*Get-DomainUserList* OR powershell.file.script_block_text:*Invoke-SpraySinglePassword* OR powershell.file.script_block_text:*Get-ObservationWindow*))
  sumo: |
    (_sourceCategory=*Windows* OR _sourceCategory=*Powershell*) AND (4688 OR 4104 OR 592)
    | json field=_raw "EventID" as event_id
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ProcessName" as process_name_alt
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "ScriptBlockText" as script_block
    | json field=_raw "Computer" as computer
    | json field=_raw "TargetUserName" as user
    | where (
        (event_id in ("592", "4688") and (process_name matches "*powershell.exe" or process_name_alt matches "*powershell.exe" or command_line matches "*Invoke-DomainPasswordSpray*" or command_line matches "*Get-DomainUserList*" or command_line matches "*Invoke-SpraySinglePassword*" or command_line matches "*Get-ObservationWindow*"))
        or
        (event_id = "4104" and (script_block matches "*Invoke-DomainPasswordSpray*" or script_block matches "*Get-DomainUserList*" or script_block matches "*Invoke-SpraySinglePassword*" or script_block matches "*Get-ObservationWindow*"))
    )
    | fields _messageTime, computer, user, event_id, process_name, process_name_alt, command_line, script_block
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Windows Process Execution Event \nWhere the Event ID is in [592, 4688]\nWhere the Process Name is powershell.exe\nOR\n    Where\
  \ the Command Line contains \"Invoke-DomainPasswordSpray\"\n    Where the Command Line contains \"Get-DomainUserList\"\n    Where the Command\
  \ Line contains \"Invoke-SpraySinglePassword\"\n    Where the Command Line contains \"Get-ObservationWindow\"\n\n---------------------------------------------------------------------------------------------------------------\n\
  \n1 Windows Powershell Script Execution Event\nWhere the Event ID is 4104\nOR\n    Where the Script contains \"Invoke-DomainPasswordSpray\"\n\
  \    Where the Script contains \"Get-DomainUserList\"\n    Where the Script contains \"Invoke-SpraySinglePassword\"\n    Where the Script contains\
  \ \"Get-ObservationWindow\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

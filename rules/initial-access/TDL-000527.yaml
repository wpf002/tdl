rule_id: TDL-AUTH-000527
v4_id: '000527'
name: HVT Remote Password Guessing
description: This rule is designed to detect multiple failed authentication attempts against a VPN or public-facing host, which may indicate an
  attempt to brute force an account’s password.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Microsoft 365
data_sources:
- VPN
- Azure AD
- Office 365
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=* (sourcetype=\"azure:aad:signin\" OR sourcetype=\"o365:management:activity\" OR sourcetype=\"vpn\") \n(ResultType=50126 OR ResultType=50053\
    \ OR ResultType=50055 OR ResultType=50057 OR ResultType=50072 OR ResultType=50074 OR ResultType=50076 OR ResultType=50079 OR ResultType=50105\
    \ OR ResultType=50126 OR ResultType=50132 OR ResultType=50133 OR ResultType=50144 OR ResultType=50173 OR Action=UserLoginFailed OR action=failure\
    \ OR status=failure)\n| eval dest_user=coalesce(UserId, UserPrincipalName, DestinationUserName, user, Account_Name)\n| eval src_ip=coalesce(IPAddress,\
    \ ClientIP, src_ip, src)\n| where isnotnull(dest_user) AND isnotnull(src_ip)\n| bin _time span=3m\n| stats count as auth_failures by _time,\
    \ src_ip, dest_user\n| where auth_failures >= 75\n| table _time, src_ip, dest_user, auth_failures\n"
  kql: "SigninLogs\n| where TimeGenerated > ago(3m)\n| where ResultType != 0\n| where NetworkLocationDetails has \"trustedNamedLocation\" == false\
    \ or isempty(NetworkLocationDetails)\n| summarize \n    FailureCount = count(),\n    SourceIPs = make_set(IPAddress),\n    AppDisplayNames\
    \ = make_set(AppDisplayName),\n    StartTime = min(TimeGenerated),\n    EndTime = max(TimeGenerated)\n    by UserPrincipalName, bin(TimeGenerated,\
    \ 3m)\n| where FailureCount >= 75\n| where array_length(SourceIPs) == 1\n| project StartTime, EndTime, UserPrincipalName, FailureCount, SourceIP\
    \ = tostring(SourceIPs[0]), AppDisplayNames\n"
  aql: |
    SELECT username AS "Destination Username", sourceip AS "External Source", destinationip AS "Destination", COUNT(*) AS "Failed Attempts"
    FROM events
    WHERE category IN (6003, 6004) AND eventcount >= 1
    GROUP BY username, sourceip, destinationip
    HAVING "Failed Attempts" >= 75
    LAST 3 MINUTES
  yara_l: |
    rule azure_remote_auth_brute_force {
      meta:
        author = "Detection Engineer"
        description = "Detects 75+ failed remote authentication attempts from single external source to same destination user within 3 minutes - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "USER_LOGIN"
        $e.security_result.action = "BLOCK"
        $e.target.user.userid = $user
        $e.principal.ip = $source_ip
        not net.ip_in_range_cidr($source_ip, "10.0.0.0/8")
        not net.ip_in_range_cidr($source_ip, "172.16.0.0/12")
        not net.ip_in_range_cidr($source_ip, "192.168.0.0/16")

      match:
        $user, $source_ip over 3m

      outcome:
        $risk_score = max(75)

      condition:
        #e >= 75
    }
  esql: "FROM logs-azure.auditlogs*, logs-o365.audit*, logs-azure.signinlogs*\n| WHERE @timestamp > NOW() - 3 minutes \n  AND event.outcome ==\
    \ \"failure\"\n  AND (event.category == \"authentication\" OR event.action LIKE \"*sign*in*\" OR event.action LIKE \"*logon*\" OR event.action\
    \ LIKE \"*auth*\")\n  AND NOT source.ip LIKE \"10.*\" \n  AND NOT source.ip LIKE \"172.16.*\" \n  AND NOT source.ip LIKE \"172.17.*\" \n \
    \ AND NOT source.ip LIKE \"172.18.*\" \n  AND NOT source.ip LIKE \"172.19.*\" \n  AND NOT source.ip LIKE \"172.20.*\" \n  AND NOT source.ip\
    \ LIKE \"172.21.*\" \n  AND NOT source.ip LIKE \"172.22.*\" \n  AND NOT source.ip LIKE \"172.23.*\" \n  AND NOT source.ip LIKE \"172.24.*\"\
    \ \n  AND NOT source.ip LIKE \"172.25.*\" \n  AND NOT source.ip LIKE \"172.26.*\" \n  AND NOT source.ip LIKE \"172.27.*\" \n  AND NOT source.ip\
    \ LIKE \"172.28.*\" \n  AND NOT source.ip LIKE \"172.29.*\" \n  AND NOT source.ip LIKE \"172.30.*\" \n  AND NOT source.ip LIKE \"172.31.*\"\
    \ \n  AND NOT source.ip LIKE \"192.168.*\"\n| STATS failure_count = COUNT(*) BY source.ip, user.name, destination.ip\n| WHERE failure_count\
    \ >= 75\n| KEEP source.ip, user.name, destination.ip, failure_count\n"
  leql: |
    where(result=FAILED_BAD_PASSWORD AND source_address!=/^(10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)/) groupby(source_address, destination_user) calculate(count)
  crowdstrike: "event_simpleName=UserLogon* OR event_simpleName=*AuthenticationFailed* OR event_simpleName=*LogonFailed*\n| RemoteIP=* \n| groupBy([RemoteIP,\
    \ DestinationUserName, ComputerName], function=count(as=failures), span=3m)\n| failures >= 75\n| table([@timestamp, RemoteIP, DestinationUserName,\
    \ ComputerName, failures])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter event_type = ENUM.EVENT_TYPE_AUTHENTICATION and outcome = ENUM.OUTCOME_FAILED
    | bin _time span=3m
    | comp count() as failures, values(src_ip) as source_ips by _time, dst_user_upn, dst_ip
    | alter source_count = arraysize(source_ips)
    | filter failures >= 75 and source_count = 1
    | fields _time, dst_user_upn, dst_ip, failures, source_ips
  lucene: |
    event.action:"Remote Authentication Failure" AND _exists_:source.ip AND _exists_:destination.ip AND _exists_:user.name
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*Office* OR _sourceCategory=*O365* OR _sourceCategory=*VPN* (failed OR failure OR "sign-in" OR authentication)
    | json field=_raw "ResultType" as result_type
    | json field=_raw "ResultDescription" as result_desc
    | json field=_raw "Status" as status
    | json field=_raw "UserPrincipalName" as user
    | json field=_raw "IPAddress" as src_ip
    | json field=_raw "Location" as location
    | json field=_raw "AppDisplayName" as app
    | where (result_type in ("50126", "50053", "50055", "50056", "50057", "50074", "50076", "50079", "50105", "50126", "50132", "50133", "50144", "53003", "70008", "70011", "81010", "81012") OR status matches "*fail*" OR result_desc matches "*fail*")
    | timeslice 3m
    | count as failure_count by _timeslice, src_ip, user
    | where failure_count >= 75
    | fields _timeslice, src_ip, user, failure_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '75 Remote Authentication Failure events

  From 1 external source to the same destination

  With the same Destination Username

  Within 3 minutes'
suppression:
  window: 24 hours
  fields:
  - Source IP
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

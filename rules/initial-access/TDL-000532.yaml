author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 Instance within any observed window of a URL-based event sourced from AWS ELB activity logs.


  From index=cloud where sourcetype is aws:cloudtrail, azure:auditlogs, or gcp:audit

  Where eventName matches a pattern containing one or more characters (wildcard compound pattern indicating extended or anomalous URL strings)

  With count of matching events greater than or equal to 1 per userIdentity.arn and eventName and resources{}.ARN combination


  Exclude events originating from authorized scanners or known monitoring agent source IP addresses.


  With the same userIdentity.arn, eventName, and resources{}.ARN, correlating observed sourceIPAddress values across matching events, sorted descending
  by event count.'

rule_id: TDL-AUTH-000539
v4_id: 000539
name: Dependabot Disabled
description: Detecs when Depndabot has been disabled. Dependabot inform users about vulnerabilities and pulls down patches to patch vulneraboiliies
  in code. A threat actor may disable this to prevent vulnerablilites from being patched.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1195
technique_name: Supply Chain Compromise
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github action IN ("dependabot_alerts.disable", "repository_vulnerability_alerts.disable", "dependabot_security_updates.disable",
    "dependabot_security_updates_new_repos.disable")

    | table _time, user, action, repo, org

    '
  kql: |
    GitHubAuditLogEntries
    | where TimeGenerated > ago(1h)
    | where Action in ("dependabot_alerts.disable", "repository_vulnerability_alerts.disable", "dependabot_security_updates.disable", "dependabot_security_updates_new_repos.disable")
    | project TimeGenerated, Actor, Action, Repository, ActorLocation, OperationType
  aql: |
    SELECT username, "action", LOGSOURCENAME(logsourceid) AS source, eventtime
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%github%'
      AND "action" IN ('dependabot_alerts.disable', 'repository_vulnerability_alerts.disable', 'dependabot_security_updates.disable', 'dependabot_security_updates_new_repos.disable')
    LAST 24 HOURS
  yara_l: |
    rule github_security_feature_disabled {
      meta:
        author = "TDL"
        description = "Detects disabling of GitHub security features (Dependabot alerts, vulnerability alerts, security updates)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1195"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Github"
        (
          $e.metadata.product_event_type = "dependabot_alerts.disable" or
          $e.metadata.product_event_type = "repository_vulnerability_alerts.disable" or
          $e.metadata.product_event_type = "dependabot_security_updates.disable" or
          $e.metadata.product_event_type = "dependabot_security_updates_new_repos.disable"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-github*
    | WHERE event.action IN ("dependabot_alerts.disable", "repository_vulnerability_alerts.disable", "dependabot_security_updates.disable", "dependabot_security_updates_new_repos.disable")
    | KEEP @timestamp, user.name, event.action, github.repo, github.repository, source.ip, user.email
  leql: |
    where(source_json.action IN [dependabot_alerts.disable, repository_vulnerability_alerts.disable, dependabot_security_updates.disable, dependabot_security_updates_new_repos.disable])
  crowdstrike: |
    #repo=github action IN [dependabot_alerts.disable, repository_vulnerability_alerts.disable, dependabot_security_updates.disable, dependabot_security_updates_new_repos.disable]
    | table([@timestamp, actor, action, repository, org])
  xql: |
    dataset = github_audit_log_raw
    | filter action in ("dependabot_alerts.disable", "repository_vulnerability_alerts.disable", "dependabot_security_updates.disable", "dependabot_security_updates_new_repos.disable")
    | fields _time, action, actor, repo, org
  lucene: |
    action:(dependabot_alerts.disable OR repository_vulnerability_alerts.disable OR dependabot_security_updates.disable OR dependabot_security_updates_new_repos.disable)
  sumo: |
    _sourceCategory=*Github* (dependabot_alerts.disable OR repository_vulnerability_alerts.disable OR dependabot_security_updates.disable OR dependabot_security_updates_new_repos.disable)
    | json field=_raw "action" as action
    | where action in ("dependabot_alerts.disable", "repository_vulnerability_alerts.disable", "dependabot_security_updates.disable", "dependabot_security_updates_new_repos.disable")
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions IN (dependabot_alerts.disable, repository_vulnerability_alerts.disable, dependabot_security_updates.disable,\
  \ dependabot_security_updates_new_repos.disable)"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

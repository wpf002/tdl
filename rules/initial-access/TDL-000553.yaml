rule_id: TDL-AUTH-000553
v4_id: '000553'
name: Allowed Remote Code Execution Attempt
description: Detects when inbound traffic with a Remote Code Injection signature is allowed
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) network.protocol="tcp" (signature_name="*Remote Code Execution*" OR signature_name="*Remote
    Code Injection*" OR signature="*RCE*" OR signature="*Remote Code*") action=allowed NOT [| inputlookup authorized_scanners.csv | fields src_ip]

    | stats count values(dest_ip) as unique_dests sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    '
  kql: "let authorizedScanners = dynamic([\"10.0.0.100\", \"10.0.0.101\", \"192.168.1.50\"]);\nunion \n    (CommonSecurityLog \n    | where DeviceVendor\
    \ has_any (\"Palo Alto\", \"Fortinet\", \"Cisco\", \"Check Point\", \"Barracuda\", \"F5\", \"Imperva\") \n    | where DeviceEventClassID has_any\
    \ (\"RCE\", \"Remote Code Execution\", \"Code Injection\", \"Remote Code Injection\", \"Command Injection\")\n    | where DeviceAction in~\
    \ (\"allowed\", \"permit\", \"accept\")\n    | where Protocol =~ \"tcp\"\n    | extend src_ip = SourceIP, dest_ip = DestinationIP, dest_port\
    \ = DestinationPort, bytes_out = SentBytes),\n    (CommonSecurityLog\n    | where DeviceProduct has_any (\"IDS\", \"IPS\", \"Intrusion\",\
    \ \"Snort\", \"Suricata\", \"TippingPoint\")\n    | where Activity has_any (\"RCE\", \"Remote Code Execution\", \"Code Injection\", \"Remote\
    \ Code Injection\", \"Command Injection\", \"exploit\")\n    | where DeviceAction in~ (\"allowed\", \"permit\", \"accept\")\n    | where Protocol\
    \ =~ \"tcp\"\n    | extend src_ip = SourceIP, dest_ip = DestinationIP, dest_port = DestinationPort, bytes_out = SentBytes)\n| where src_ip\
    \ !in (authorizedScanners)\n| summarize count_ = count(), unique_dests = dcount(dest_ip), total_bytes_out = sum(bytes_out), earliest = min(TimeGenerated),\
    \ latest = max(TimeGenerated) by src_ip, dest_ip, dest_port\n| where count_ >= 1\n| sort by total_bytes_out desc\n| project earliest, latest,\
    \ src_ip, dest_ip, dest_port, count_, unique_dests, total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS event_count, UNIQUECOUNT(destinationip) AS unique_dests, SUM(bytesout) AS total_bytes_out, CATEGORYNAME(category) AS signature_name, qidname(qid) AS event_name
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%IDS%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%IPS%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%Firewall%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%WAF%')
      AND (CATEGORYNAME(category) ILIKE '%Remote Code Execution%' OR CATEGORYNAME(category) ILIKE '%Remote Code Injection%' OR qidname(qid) ILIKE '%Remote Code Execution%' OR qidname(qid) ILIKE '%Remote Code Injection%' OR qidname(qid) ILIKE '%RCE%')
      AND protocolid = 6
      AND sourceip NOT IN ('10.0.0.100', '192.168.1.50')
    GROUP BY sourceip, destinationip, destinationport, CATEGORYNAME(category), qidname(qid)
    HAVING event_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule mitre_t1190_exploit_public_facing_application {
      meta:
        author = "Detection Engineer"
        description = "Detects exploitation attempts via RCE/RCI signatures from IDS/IPS/WAF"
        mitre_attack_technique = "T1190"
        mitre_attack_tactic = "Initial Access"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "NETWORK_CONNECTION"
        (
          $e.metadata.vendor_name = "Palo Alto Networks" or
          $e.metadata.vendor_name = "Snort" or
          $e.metadata.vendor_name = "Suricata" or
          $e.metadata.vendor_name = "Cisco" or
          $e.metadata.product_name = "IDS" or
          $e.metadata.product_name = "IPS" or
          $e.metadata.product_name = "WAF"
        )
        $e.network.ip_protocol = "TCP"
        (
          re.regex($e.security_result.summary, `(?i)(remote code execution|RCE|remote code injection|RCI)`) or
          re.regex($e.security_result.category_details, `(?i)(remote code execution|RCE|remote code injection|RCI)`) or
          re.regex($e.security_result.description, `(?i)(remote code execution|RCE|remote code injection|RCI)`)
        )
        $e.security_result.action = "ALLOW"
        $e.network.direction = "INBOUND"
        not re.regex($e.principal.ip, `^(10\.0\.1\.50|192\.168\.100\.20|172\.16\.5\.10)$`)
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port

      match:
        $src_ip, $dest_ip, $dest_port over 24h

      outcome:
        $risk_score = 85
        $total_events = count_distinct($e.metadata.id)
        $bytes_out = sum($e.network.sent_bytes)

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-network.ids*, logs-network.firewall*, logs-network.waf*
    | WHERE @timestamp > NOW() - 24 hours
      AND network.protocol == "tcp"
      AND (event.category == "intrusion_detection" OR event.category == "network" OR log.level IN ("alert", "warning"))
      AND (event.action LIKE "*Remote Code Execution*" OR event.action LIKE "*Remote Code Injection*" OR event.action LIKE "*RCE*" OR event.action LIKE "*RCI*" OR rule.name LIKE "*Remote Code Execution*" OR rule.name LIKE "*Remote Code Injection*" OR rule.name LIKE "*RCE*" OR rule.name LIKE "*RCI*")
      AND event.outcome IN ("success", "allowed", "alert")
      AND source.ip NOT IN ("10.0.0.100", "10.0.0.101", "192.168.1.250")
    | STATS event_count = COUNT(*), unique_dests = COUNT_DISTINCT(destination.ip), total_bytes_out = SUM(source.bytes) BY source.ip, destination.ip, destination.port
    | WHERE event_count >= 1
    | SORT total_bytes_out DESC
    | KEEP source.ip, destination.ip, destination.port, event_count, unique_dests, total_bytes_out
  leql: |
    where(log_source_type IN [firewall, ids] AND network.protocol ICONTAINS "tcp" AND (signature ICONTAINS "remote code execution" OR signature ICONTAINS "remote code injection" OR signature ICONTAINS "rce" OR alert_name ICONTAINS "remote code execution" OR alert_name ICONTAINS "remote code injection")) groupby(source_address, destination_address, destination_port) calculate(count)
  crowdstrike: |
    (#type=firewall OR #type=ids) network.protocol=*tcp* (signature=*"Remote Code Execution"* OR signature=*"Remote Code Injection"* OR signature=*RCE* OR signature=*RCI* OR event_simpleName=*RCE* OR event_simpleName=*RCI* OR alert=*"Remote Code Execution"* OR alert=*"Remote Code Injection"*)
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | event_count >= 1
    | src_ip != /^(10\.1\.1\.100|192\.168\.1\.50|scanner\.company\.com)$/
    | sort(field=total_bytes_out, order=desc, limit=1000)
    | table([src_ip, dest_ip, dest_port, event_count, unique_dests, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_source = "IDS" or action_source = "WAF" or action_source = "THREAT"
    | filter action_network_protocol = "tcp"
    | filter threat_name ~= "(?i)(remote.*code.*(execution|injection)|RCE|RCI)" and action_firewall_action != "deny" and action_firewall_action != "block" and action_firewall_action != "drop"
    | alter bytes_out = coalesce(action_total_upload, 0)
    | comp count() as event_count, count_distinct(action_destination_ip) as unique_dests, sum(bytes_out) as total_bytes_out by action_source_ip, action_destination_ip, action_destination_port
    | filter event_count >= 1
    | filter action_source_ip not in ("10.0.0.100", "10.0.0.101", "192.168.1.50")
    | sort desc total_bytes_out
    | fields action_source_ip, action_destination_ip, action_destination_port, event_count, unique_dests, total_bytes_out
  lucene: |
    (sourcetype:(firewall OR ids) AND network.protocol:*tcp*) AND (signature:*"Remote Code Execution"* OR signature:*"Remote Code Injection"* OR event.action:*RCE* OR event.action:*RCI* OR alert.signature:*"Remote Code Execution"* OR alert.signature:*"Remote Code Injection"*) AND NOT src_ip:(10.0.0.100 OR 10.0.0.101 OR 192.168.1.50)
  sumo: |
    _sourceCategory=*network* OR _sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*waf*
    | where !isEmpty(src_ip) and !isEmpty(dest_ip)
    | parse regex "(?i)remote.?code.?(execution|injection)" nodrop
    | parse regex "(?i)(rce|remote code)" nodrop
    | where _raw matches "*remote*code*" or _raw matches "*RCE*" or _raw matches "*injection*"
    | where protocol matches "*tcp*" or _raw matches "*tcp*"
    | where action matches "*allow*" or action matches "*permit*" or verdict matches "*allow*" or _raw matches "*allowed*" or _raw matches "*permitted*"
    | where !(src_ip in ("10.0.0.1", "192.168.1.100"))
    | count as event_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | where event_count >= 1
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, dest_port, event_count, unique_dests, total_bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 Instance within any observed window of an allowed inbound Remote Code Execution or Remote Code Injection signature event.


  From index=network where sourcetype is firewall or sourcetype is ids

  Where network.protocol contains "tcp"

  With statistics aggregated by src_ip, dest_ip, and dest_port including total event count, distinct dest_ip values as unique_dests, and sum of
  bytes_out

  Where count is greater than or equal to 1

  With results sorted descending by bytes_out to surface highest-volume sources first

  Excluding known authorized scanners and monitoring agents from src_ip if present in an allow-list

  With the same src_ip, dest_ip, and dest_port as the correlation key'

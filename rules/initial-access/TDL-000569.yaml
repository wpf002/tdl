rule_id: TDL-AUTH-000569
v4_id: 000569
name: New Kubernetes Binding Role Created
description: A  role binding grants a resource superuser or administrative access to a Kubernetes cluster. Ensure this action is expected and
  performed by known Kubernetes administrators.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes verb="create" uri="*clusterrolebindings*" annotations.authorization.k8s.io/decision="allow"

    | table _time, user.username, objectRef.name, objectRef.namespace, sourceIPs{}, userAgent, verb, uri

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where Verb =~ "create"
    | where RequestURI contains "clusterrolebindings"
    | extend decision = tostring(parse_json(Annotations)["authorization.k8s.io/decision"])
    | where decision =~ "allow"
    | project TimeGenerated, Verb, RequestURI, User, SourceIPs, UserAgent, ObjectRef, ResponseStatus, decision
  aql: |
    SELECT eventtime, username, sourceip, "Verb", "URL", "annotations.authorization.k8s.io/decision", LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE "Verb" = 'create'
      AND "URL" ILIKE '%clusterrolebindings%'
      AND "annotations.authorization.k8s.io/decision" = 'allow'
    LAST 24 HOURS
  yara_l: "rule kubernetes_clusterrolebinding_creation {\n  meta:\n    author = \"TDL\"\n    description = \"Detects creation of cluster role\
    \ bindings in Kubernetes which may indicate initial access via valid accounts (T1078)\"\n    mitre_attack_tactic = \"Initial Access\"\n  \
    \  mitre_attack_technique = \"T1078\"\n    platform = \"Kubernetes\"\n    \n  events:\n    $k.metadata.product_name = \"Kubernetes\"\n   \
    \ $k.metadata.product_event_type = \"audit\"\n    $k.security_result.action = \"ALLOW\"\n    re.regex($k.target.url, `clusterrolebindings`)\n\
    \    $k.network.http.method = \"POST\"\n    $k.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $k\n\
    }\n"
  esql: |
    FROM logs-kubernetes*
    | WHERE @timestamp > NOW() - 24 hours
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.requestURI LIKE "*clusterrolebindings*"
      AND kubernetes.audit.annotations.authorization_k8s_io_decision == "allow"
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.name, kubernetes.audit.requestURI, kubernetes.audit.sourceIPs, host.name
  leql: |
    where(source_json.verb="create" AND source_json.objectRef.resource ICONTAINS "clusterrolebindings" AND source_json.annotations.authorization\.k8s\.io/decision="allow")
  crowdstrike: |
    #type=k8s* verb=create objectRef.resource=*clusterrolebindings* annotations.authorization.k8s.io/decision=allow
    | table([@timestamp, user.username, objectRef.name, objectRef.resource, verb, responseStatus.code, sourceIPs])
  xql: |
    dataset = k8s_audit_raw
    | filter verb = "create" and objectRef_resource = "clusterrolebindings" and responseStatus_code < 300
    | filter annotations_authorization_k8s_io_decision = "allow"
    | fields _time, user_username, sourceIPs, objectRef_name, objectRef_namespace, verb, objectRef_resource, annotations_authorization_k8s_io_decision
  lucene: |
    verb:"create" AND url:*clusterrolebindings* AND annotations.authorization.k8s.io\/decision:"allow"
  sumo: |
    _sourceCategory=*Kubernetes* "create" "clusterrolebindings" "allow"
    | json field=_raw "verb" as verb
    | json field=_raw "requestURI" as url
    | json field=_raw "annotations.authorization.k8s.io/decision" as decision
    | where verb = "create" and url matches "*clusterrolebindings*" and decision = "allow"
    | fields _messageTime, _sourceHost, verb, url, decision
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"create\"\nWhere URL contains \"clusterrolebindings\"\nWhere \"annotations.authorization.k8s.io/decision\"\
  \ is \"allow\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000570
v4_id: '000570'
name: New Kubernetes Cluster Admin Binding Role Created
description: A cluster-admin role binding grants a resource superuser or administrative access to a Kubernetes cluster. Ensure this action is
  expected and performed by known Kubernetes administrators.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes verb=create url="*clusterrolebindings*" annotations.authorization.k8s.io/decision=allow responseObject.roleRef.name=cluster-admin

    | table _time, user.username, sourceIPs{}, objectRef.namespace, objectRef.name, responseObject.roleRef.name, responseObject.subjects{}.name

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where Verb == "create"
    | where RequestURI contains "clusterrolebindings"
    | extend Decision = tostring(parse_json(Annotations)["authorization.k8s.io/decision"])
    | where Decision == "allow"
    | extend RoleRefName = tostring(parse_json(ResponseObject).roleRef.name)
    | where RoleRefName == "cluster-admin"
    | project TimeGenerated, Namespace, User, SourceIPs, RequestURI, RoleRefName, ResponseObject
  aql: |
    SELECT eventtime, username, sourceip, "kubernetes.verb" AS verb, "kubernetes.objectRef.resource" AS resource, "kubernetes.responseObject.roleRef.name" AS role_name, "kubernetes.requestURI" AS request_uri
    FROM events
    WHERE "kubernetes.verb" = 'create'
      AND "kubernetes.requestURI" ILIKE '%clusterrolebindings%'
      AND "kubernetes.annotations.authorization.k8s.io/decision" = 'allow'
      AND "kubernetes.responseObject.roleRef.name" = 'cluster-admin'
    LAST 24 HOURS
  yara_l: "rule kubernetes_cluster_admin_binding_creation {\n  meta:\n    author = \"TDL\"\n    description = \"Detects creation of cluster-admin\
    \ role bindings in Kubernetes\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\
    \n\n  events:\n    $k.metadata.event_type = \"GENERIC_EVENT\"\n    $k.metadata.product_name = \"Kubernetes\"\n    $k.metadata.verb = \"create\"\
    \n    re.regex($k.metadata.url_back_to_product, `clusterrolebindings`)\n    $k.security_result.summary = \"allow\"\n    $k.target.resource.attribute.labels[\"\
    responseObject.roleRef.name\"] = \"cluster-admin\"\n    $k.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n\n  outcome:\n\
    \    $risk_score = 85\n\n  condition:\n    $k\n}\n"
  esql: "FROM logs-kubernetes.*\n| WHERE @timestamp > NOW() - 24 hour \n  AND kubernetes.audit.verb == \"create\" \n  AND kubernetes.audit.requestURI\
    \ LIKE \"*clusterrolebindings*\"\n  AND kubernetes.audit.annotations.authorization_k8s_io/decision == \"allow\"\n  AND kubernetes.audit.responseObject.roleRef.name\
    \ == \"cluster-admin\"\n| KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.sourceIPs, kubernetes.audit.responseObject.metadata.name,\
    \ kubernetes.audit.requestURI\n"
  leql: |
    where(source_json.verb="create" AND source_json.objectRef.resource ICONTAINS "clusterrolebindings" AND source_json.annotations.authorization.k8s.io/decision="allow" AND source_json.responseObject.roleRef.name="cluster-admin")
  crowdstrike: |
    #type=kubernetes verb=create requestURI=*clusterrolebindings* annotations.authorization.k8s.io/decision=allow responseObject.roleRef.name=cluster-admin
    | table([@timestamp, user.username, sourceIPs, responseObject.metadata.name, responseObject.subjects])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and vendor = "kubernetes"
    | filter json_extract_scalar(raw_log, "$.verb") = "create"
    | filter json_extract_scalar(raw_log, "$.requestURI") contains "clusterrolebindings"
    | filter json_extract_scalar(raw_log, "$.annotations['authorization.k8s.io/decision']") = "allow"
    | filter json_extract_scalar(raw_log, "$.responseObject.roleRef.name") = "cluster-admin"
    | fields _time, json_extract_scalar(raw_log, "$.user.username") as user, json_extract_scalar(raw_log, "$.requestURI") as uri, json_extract_scalar(raw_log, "$.responseObject.metadata.name") as binding_name, json_extract_scalar(raw_log, "$.responseObject.subjects") as subjects
  lucene: |
    verb:"create" AND objectRef.resource:"clusterrolebindings" AND annotations.authorization\.k8s\.io\/decision:"allow" AND responseObject.roleRef.name:"cluster-admin"
  sumo: "_sourceCategory=*Kubernetes* \"create\" \"clusterrolebindings\" \"allow\" \"cluster-admin\"\n| json field=_raw \"verb\" as verb\n| json\
    \ field=_raw \"objectRef.resource\" as resource\n| json field=_raw \"annotations.authorization.k8s.io/decision\" as decision\n| json field=_raw\
    \ \"responseObject.roleRef.name\" as role_name\n| where verb = \"create\" \n| where resource matches \"*clusterrolebindings*\" or _raw matches\
    \ \"*clusterrolebindings*\"\n| where decision = \"allow\"\n| where role_name = \"cluster-admin\"\n| fields _messageTime, _sourceHost, verb,\
    \ resource, decision, role_name\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere Verb is \"create\"\nWhere URL contains \"clusterrolebindings\"\nWhere \"annotations.authorization.k8s.io/decision\"\
  \ is \"allow\"\nWhere \"responseObject.roleRef.name\" is \"cluster-admin\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

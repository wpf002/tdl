rule_id: TDL-AUTH-000576
v4_id: '000576'
name: Kubernetes Service Account Created in Kube Namespace
description: Detect when a user is creating a service account in one of the Kubernetes default namespaces. The only users creating service accounts
  in the kube-system namespace should be cluster administrators. Furthermore, it is best practice to not run any cluster critical infrastructure
  in the kube-system namespace. The kube-public namespace is intended for kubernetes objects which should be readable by unauthenticated users.
  Thus, a service account should likely not be created in the kube-public namespace.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=* sourcetype=kube:* OR sourcetype=kubernetes:* object.kind="Event" OR kind="Event" objectRef.resource="serviceaccounts" OR resource="serviceaccounts"
    verb="create" (objectRef.namespace="kube-system" OR objectRef.namespace="kube-public" OR namespace="kube-system" OR namespace="kube-public")

    | eval resource=coalesce(objectRef.resource, resource), verb=coalesce(verb, verb), namespace=coalesce(objectRef.namespace, namespace)

    | where resource="serviceaccounts" AND verb="create" AND (namespace="kube-system" OR namespace="kube-public")

    | table _time, namespace, verb, resource, user.username, sourceIPs{}, objectRef.name, host

    '
  kql: |
    KubernetesPodInventory
    | where TimeGenerated > ago(1h)
    | where Namespace in ("kube-system", "kube-public")
    | where ControllerKind == "ServiceAccount"
    | where ControllerName contains "create"
    | project TimeGenerated, Namespace, ControllerName, ServiceName, ClusterName, Computer
    ```

    Wait, let me reconsider. For Kubernetes audit events, the correct table is typically `AzureDiagnostics` or `KubeEvents`. Let me provide the correct query:

    ```
    AzureDiagnostics
    | where TimeGenerated > ago(1h)
    | where Category == "kube-audit"
    | where objectRef_resource_s == "serviceaccounts"
    | where verb_s == "create"
    | where objectRef_namespace_s in ("kube-system", "kube-public")
    | project TimeGenerated, user_username_s, objectRef_namespace_s, objectRef_name_s, verb_s, responseStatus_code_d, sourceIPs_s
  aql: |
    SELECT eventtime, username, "Namespace", "Resource", "Verb", LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE "Resource" = 'serviceaccounts'
      AND "Verb" = 'create'
      AND "Namespace" IN ('kube-system', 'kube-public')
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_serviceaccount_creation_sensitive_namespace {
      meta:
        author = "TDL"
        description = "Detects creation of service accounts in sensitive Kubernetes namespaces (kube-system, kube-public)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "RESOURCE_CREATION"
        $e.target.resource.type = "serviceaccounts"
        $e.target.resource.attribute.labels["verb"] = "create"
        (
          $e.target.namespace = "kube-system" or
          $e.target.namespace = "kube-public"
        )
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-kubernetes.audit*\n| WHERE @timestamp > NOW() - 24 hour \n  AND kubernetes.audit.objectRef.resource == \"serviceaccounts\"\n\
    \  AND kubernetes.audit.verb == \"create\"\n  AND kubernetes.audit.objectRef.namespace IN (\"kube-system\", \"kube-public\")\n| KEEP @timestamp,\
    \ kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.sourceIPs, kubernetes.audit.userAgent\n"
  leql: |
    where(source_json.objectRef.resource="serviceaccounts" AND source_json.verb="create" AND source_json.objectRef.namespace IN ["kube-system", "kube-public"])
  crowdstrike: |
    #event_type=KubernetesEvent objectRef.resource=serviceaccounts verb=create (objectRef.namespace=kube-system OR objectRef.namespace=kube-public)
    | table([@timestamp, user.username, objectRef.namespace, objectRef.name, sourceIPs, userAgent])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"KUBERNETES\" \n  and json_extract_scalar(resource, \"$.type\") = \"serviceaccounts\"\
    \n  and operation_verb = \"create\"\n  and (operation_namespace = \"kube-system\" or operation_namespace = \"kube-public\")\n| fields _time,\
    \ operation_namespace, operation_verb, resource, identity_name, agent_hostname\n"
  lucene: |
    objectRef.resource:serviceaccounts AND verb:create AND objectRef.namespace:(kube-system OR kube-public)
  sumo: |
    _sourceCategory=*Kubernetes* serviceaccounts create
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.namespace" as namespace
    | where resource = "serviceaccounts" and verb = "create" and (namespace = "kube-system" or namespace = "kube-public")
    | fields _messageTime, namespace, resource, verb, _sourceHost

rule_id: TDL-AUTH-000578
v4_id: 000578
name: Kubernetes Service Created with NodePort
description: Detect when a service’s port is attached to the node’s IP. Exposing the service’s port to the the node’s IP allows other hosts on
  the network namespace to access this service.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1552
technique_name: Unsecured Credentials
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes sourcetype=kube:events objectRef.resource="services" verb="create" requestObject.spec.type="NodePort"

    | table _time, user.username, objectRef.namespace, objectRef.name, requestObject.spec.type, sourceIPs{}

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(24h)
    | where ObjectKind =~ "Service"
    | where Verb =~ "create"
    | extend requestObject = parse_json(RequestObject)
    | extend serviceType = tostring(requestObject.spec.type)
    | where serviceType =~ "NodePort"
    | project TimeGenerated, Namespace, Name, Verb, serviceType, User, SourceIPs, UserAgent, ObjectKind, RequestObject, ResponseStatus
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS k8s_cluster, "Resource", "Verb", "requestObject.spec.type", "User", "SourceIP"
    FROM events
    WHERE "Resource" = 'services'
      AND "Verb" = 'create'
      AND "requestObject.spec.type" = 'NodePort'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_nodeport_service_creation {
      meta:
        author = "Detection Engineer"
        description = "Detects creation of NodePort services in Kubernetes which may expose services externally"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1552"
        severity = "Medium"

      events:
        $k.metadata.event_type = "RESOURCE_CREATION"
        $k.metadata.product_name = "Kubernetes"
        $k.target.resource.name = "services"
        $k.security_result.action = "create"
        re.regex($k.target.resource.attribute.labels.value, `(?i)NodePort`)
        $k.principal.user.userid = $user
        $k.target.resource.attribute.cloud.project.name = $cluster

      match:
        $user, $cluster over 5m

      condition:
        $k
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE kubernetes.audit.objectRef.resource == "services"
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.requestObject.spec.type == "NodePort"
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.requestObject.spec.type, kubernetes.audit.sourceIPs
  leql: |
    where(source_json.objectRef.resource="services" AND source_json.verb="create" AND source_json.requestObject.spec.type="NodePort")
  crowdstrike: |
    #type=kubernetes event.resource="services" event.verb="create" event.requestObject.spec.type="NodePort"
    | table([@timestamp, event.user.username, event.objectRef.namespace, event.objectRef.name, event.requestObject.spec.type, event.sourceIPs])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"GCP\" and json_extract_scalar(resource, \"$.type\") = \"k8s_cluster\"\n| filter\
    \ json_extract_scalar(protoPayload, \"$.resourceName\") contains \"/services/\" \n  and json_extract_scalar(protoPayload, \"$.request.kind\"\
    ) = \"Service\"\n  and json_extract_scalar(protoPayload, \"$.methodName\") contains \"create\"\n  and json_extract_scalar(protoPayload, \"\
    $.request.spec.type\") = \"NodePort\"\n| fields _time, json_extract_scalar(protoPayload, \"$.authenticationInfo.principalEmail\") as principal,\
    \ json_extract_scalar(protoPayload, \"$.resourceName\") as service_name, json_extract_scalar(protoPayload, \"$.request.metadata.name\") as\
    \ service, json_extract_scalar(resource, \"$.labels.cluster_name\") as cluster\n"
  lucene: |
    kubernetes.audit.objectRef.resource:services AND kubernetes.audit.verb:create AND kubernetes.audit.requestObject.spec.type:NodePort
  sumo: |
    _sourceCategory=*kubernetes* OR _sourceCategory=*k8s*
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "requestObject.spec.type" as service_type
    | where resource = "services" and verb = "create" and service_type = "NodePort"
    | fields _messageTime, _sourceHost, resource, verb, service_type
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"services\"\nWhere Verb is \"create\"\nWhere the requestObject.spec.type is \"NodePort\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

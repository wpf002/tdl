rule_id: TDL-AUTH-000584
v4_id: 000584
name: Unauthorized Kubernetes Service Account Created
description: 'Detects creation of new Kubernetes service account by an unauthorized account, which could indicate an attacker''s attempt to persist
  within a cluster.


  ref: https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/container%20service%20account/'
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Kubernetes
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=kubernetes sourcetype=kube:events object.kind="Event" object.involvedObject.kind="ServiceAccount" object.verb="create"

    | search NOT user.username="system:serviceaccount:kube-system:service-account-controller"

    | search NOT [| inputlookup kubernetes_admin_list | fields username | rename username as user.username]

    | table _time, user.username, object.involvedObject.namespace, object.involvedObject.name, source.host

    '
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(24h)
    | where ObjectKind =~ "ServiceAccount" or Resource =~ "serviceaccounts"
    | where Verb =~ "create"
    | where UserName != "system:serviceaccount:kube-system:service-account-controller"
    | where UserName !has "system:masters" and UserName !has "cluster-admin"
    | project TimeGenerated, UserName, Namespace, ObjectKind, Verb, RequestURI, SourceIPs, UserAgent, ResponseCode
  aql: |
    SELECT sourceip, username AS "Source Username", "k8s.verb" AS Verb, "k8s.objectRef.resource" AS Resource, "k8s.objectRef.name" AS ServiceAccountName, eventtime, LOGSOURCENAME(logsourceid) AS LogSource
    FROM events
    WHERE "k8s.objectRef.resource" = 'serviceaccounts'
      AND "k8s.verb" = 'create'
      AND username != 'system:serviceaccount:kube-system:service-account-controller'
      AND username NOT IN ('admin@kubernetes.local', 'kubernetes-admin', 'system:admin')
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_suspicious_serviceaccount_creation {
      meta:
        author = "TDL"
        description = "Detects suspicious service account creation in Kubernetes outside of system controllers"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.event_type = "RESOURCE_CREATION"
        $e.metadata.product_name = "Kubernetes"
        $e.target.resource.type = "serviceaccounts"
        $e.target.resource.attribute.labels.value = "create"
        $e.principal.user.userid = $user
        $user != "system:serviceaccount:kube-system:service-account-controller"
        not re.regex($user, `^system:masters$`)
        not re.regex($user, `^cluster-admin$`)
        not re.regex($user, `^admin$`)

      match:
        $user over 5m

      outcome:
        $risk_score = 55

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 24 hour
      AND kubernetes.audit.objectRef.resource == "serviceaccounts"
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.user.username != "system:serviceaccount:kube-system:service-account-controller"
      AND NOT kubernetes.audit.user.username IN ("admin", "system:masters", "cluster-admin")
    | STATS event_count = COUNT(*) BY kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, host.name
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, host.name, event_count
  leql: |
    where(source_json.objectRef.resource="serviceaccounts" AND source_json.verb="create" AND source_json.user.username!="system:serviceaccount:kube-system:service-account-controller")
  crowdstrike: "#type=kubernetes objectRef.resource=\"serviceaccounts\" verb=\"create\" \nuser.username!=\"system:serviceaccount:kube-system:service-account-controller\"\
    \nNOT (user.username=\"system:masters\" OR user.username=*\":cluster-admin\" OR user.username=\"admin\" OR user.username=\"kubernetes-admin\"\
    )\n| table([@timestamp, user.username, objectRef.namespace, objectRef.name, sourceIPs, userAgent, responseStatus.code])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud.resource_type = "serviceaccounts" and action = "create" and actor.user.username != "system:serviceaccount:kube-system:service-account-controller"
    | fields _time, actor.user.username, cloud.resource_type, action, target.resource.name, cloud.project
  lucene: |
    objectRef.resource:serviceaccounts AND verb:create AND NOT user.username:"system:serviceaccount:kube-system:service-account-controller" AND NOT user.username:(admin OR cluster-admin OR system:masters)
  sumo: |
    _sourceCategory=*Kubernetes* "serviceaccounts" "create"
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "verb" as verb
    | json field=_raw "user.username" as source_username
    | where resource = "serviceaccounts" and verb = "create"
    | where source_username != "system:serviceaccount:kube-system:service-account-controller"
    | where !(source_username matches "*admin*" or source_username matches "*cluster-admin*")
    | fields _messageTime, _sourceHost, source_username, resource, verb
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"serviceaccounts\"\nWhere Verb is \"create\"\nWhere the Source Username is NOT \"system:serviceaccount:kube-system:service-account-controller\"\
  \nWhere the Source Username is NOT on the Kubernetes Admin List"
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

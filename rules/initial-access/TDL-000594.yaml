rule_id: TDL-AUTH-000594
v4_id: 000594
name: Successful MFA Pin Brute Force
description: This rule is designed to detect multiple failed MFA pin code attempts for the same user against a company's MFA application followed
  by a successful login via a MFA pin code. This may indicate a successful brute force attempt against a user's account
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
- Okta
data_sources:
- Duo
- Okta
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "(index=okta OR index=azure OR index=duo) (eventType=user.authentication.auth_via_mfa OR eventType=system.push.send_factor_verify OR event.category=SignInLogs\
    \ OR result=\"FAILURE\" OR result=\"SUCCESS\" OR outcome.result=success OR outcome.result=failure) \n| eval mfa_result=coalesce(outcome.result,\
    \ result, if(match(eventType, \"failure|deny\"), \"failure\", if(match(eventType, \"success\"), \"success\", NULL)))\n| eval mfa_factor=coalesce(authenticationContext.credentialType,\
    \ factor, debugData.factor, authenticationDetails{}.authenticationMethod)\n| eval src_ip=coalesce(client.ipAddress, src_ip, access_device.ip,\
    \ ipAddress)\n| eval dest_user=coalesce(actor.alternateId, user.email, user, userPrincipalName, target{}.userPrincipalName)\n| eval is_external=if(match(src_ip,\
    \ \"^10\\.|^172\\.(1[6-9]|2[0-9]|3[01])\\.|^192\\.168\\.\"), 0, 1)\n| where is_external=1 AND (match(mfa_factor, \"(?i)pin|device|code\"))\n\
    | eval mfa_status=case(match(mfa_result, \"(?i)success\"), \"success\", match(mfa_result, \"(?i)fail|deny\"), \"failure\", 1=1, \"unknown\"\
    )\n| where mfa_status!=\"unknown\"\n| sort 0 _time\n| streamstats count as event_num by src_ip, dest_user reset_on_change=true reset_after=\"\
    (mfa_status=\\\"success\\\")\"\n| streamstats count(eval(mfa_status=\"failure\")) as failure_count, count(eval(mfa_status=\"success\")) as\
    \ success_count, earliest(_time) as window_start by src_ip, dest_user\n| where failure_count >= 5 AND success_count >= 1 AND (_time - window_start)\
    \ <= 600\n| stats min(_time) as first_failure, max(_time) as last_event, dc(mfa_status) as status_types, values(mfa_status) as statuses by\
    \ src_ip, dest_user\n| where status_types >= 2\n| table src_ip, dest_user, first_failure, last_event\n"
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_auth_000594 {\n  meta:\n    author = \"TDL\"\n    description = \"Successful MFA Pin Brute Force\"\n    severity = \"\
    MEDIUM\"\n    tactic = \"TA0001\"\n    technique = \"T1078\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\n    $e.eventName\
    \ = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '5 MFA Failure events

  From an external source

  Where the MFA Factor is a Pin or Device Code

  With the same Source IP and Destination Username


  Followed By


  1 Successful MFA Login Event

  From an external source

  Where the MFA Factor is a Pin or Device Code

  With the same Source IP and Destination Username from the previous event

  Within 10 minutes'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

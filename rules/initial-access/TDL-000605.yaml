rule_id: TDL-AUTH-000605
v4_id: '000605'
name: Wiz Low Severity Detection
description: Detects a Cloud Event Rule from the Wiz platform.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Wiz
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=wiz sourcetype=wiz:events rule_type="Cloud Event Rule" status="OPEN" severity="LOW"

    | table _time, user, host, source, rule_name, description

    '
  kql: |
    WizAuditLogs
    | where TimeGenerated > ago(24h)
    | where RuleType == "Cloud Event Rule"
    | where Status == "OPEN"
    | where Severity == "LOW"
    | project TimeGenerated, RuleType, Status, Severity, RuleName, ResourceName, ResourceType, CloudProvider, SubscriptionId, ProjectId, Description
  aql: |
    SELECT eventtime, sourceip, username, qidname(qid), LOGSOURCENAME(logsourceid), "rule_type", "status", "severity"
    FROM events
    WHERE "rule_type" = 'Cloud Event Rule'
      AND "status" = 'OPEN'
      AND "severity" = 'LOW'
    LAST 24 HOURS
  yara_l: "rule wiz_cloud_event_rule_low_severity_open {\n  meta:\n    author = \"TDL\"\n    description = \"Detects open low severity cloud event\
    \ rules from Wiz\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"Low\"\n    \n \
    \ events:\n    $e.metadata.vendor_name = \"Wiz\"\n    $e.metadata.product_name = \"Wiz\"\n    $e.security_result.rule_type = \"Cloud Event\
    \ Rule\"\n    $e.security_result.severity = \"LOW\"\n    $e.security_result.detection_fields[\"status\"] = \"OPEN\"\n    $e.principal.hostname\
    \ = $host\n    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-wiz*
    | WHERE @timestamp > NOW() - 24 hour
      AND wiz.rule_type == "Cloud Event Rule"
      AND wiz.status == "OPEN"
      AND wiz.severity == "LOW"
    | KEEP @timestamp, host.name, user.name, wiz.rule_type, wiz.status, wiz.severity, wiz.rule_name, wiz.description
  leql: |
    where(source_json.rule_type="Cloud Event Rule" AND source_json.status="OPEN" AND source_json.severity="LOW")
  crowdstrike: |
    #type=wiz rule_type="Cloud Event Rule" status="OPEN" severity="LOW"
    | table([@timestamp, rule_type, status, severity, *])
  xql: |
    dataset = wiz_issue_raw
    | filter rule_type = "Cloud Event Rule" and status = "OPEN" and severity = "LOW"
    | fields _time, id, title, description, entity_name, resource_id, project_id, cloud_platform
  lucene: |
    rule_type:"Cloud Event Rule" AND status:"OPEN" AND severity:"LOW"
  sumo: "_sourceCategory=*Wiz* \n| json field=_raw \"rule_type\" as rule_type\n| json field=_raw \"status\" as status\n| json field=_raw \"severity\"\
    \ as severity\n| where rule_type = \"Cloud Event Rule\" AND status = \"OPEN\" AND severity = \"LOW\"\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Wiz event \n   where rule_type is \"Cloud Event Rule\" \n   AND status is \"OPEN\" \n   AND severity is \"LOW\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

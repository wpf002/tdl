rule_id: TDL-AUTH-000606
v4_id: '000606'
name: Wiz Medium Severity Detection
description: Detects a Cloud Event Rule from the Wiz platform.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Wiz
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=* sourcetype=wiz rule_type="Cloud Event Rule" status="OPEN" severity="MEDIUM"

    | table _time, rule_type, status, severity, user, source, dest, action

    '
  kql: |
    WizAlerts
    | where TimeGenerated > ago(24h)
    | where RuleType == "Cloud Event Rule"
    | where Status == "OPEN"
    | where Severity == "MEDIUM"
    | project TimeGenerated, RuleName, Severity, Status, RuleType, ResourceName, CloudProvider, Description, RemediationSteps
  aql: "SELECT DATEFORMAT(eventtime, 'YYYY-MM-dd HH:mm:ss') AS event_time, \n       LOGSOURCENAME(logsourceid) AS log_source,\n       sourceip,\n\
    \       username,\n       qidname(qid) AS event_name,\n       \"rule_type\",\n       \"status\",\n       \"severity\"\nFROM events\nWHERE\
    \ LOGSOURCENAME(logsourceid) ILIKE '%Wiz%'\n  AND \"rule_type\" = 'Cloud Event Rule'\n  AND \"status\" = 'OPEN'\n  AND \"severity\" = 'MEDIUM'\n\
    LAST 24 HOURS\n"
  yara_l: |
    rule wiz_cloud_event_medium_open {
      meta:
        author = "TDL"
        description = "Detects Wiz Cloud Event Rule findings with MEDIUM severity and OPEN status - T1078 Valid Accounts"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Wiz"
        $e.metadata.vendor_name = "Wiz"
        $e.security_result.rule_type = "Cloud Event Rule"
        $e.security_result.detection_fields["status"] = "OPEN"
        $e.security_result.severity = "MEDIUM"
        $e.principal.hostname = $host

      match:
        $host over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-wiz.alerts*
    | WHERE rule_type == "Cloud Event Rule" AND status == "OPEN" AND severity == "MEDIUM"
    | KEEP @timestamp, host.name, user.name, rule_type, status, severity, event.id, source.ip, destination.ip
  leql: |
    where(source_json.rule_type="Cloud Event Rule" AND source_json.status="OPEN" AND source_json.severity="MEDIUM")
  crowdstrike: |
    #type=wiz rule_type="Cloud Event Rule" status="OPEN" severity="MEDIUM"
    | table([@timestamp, ComputerName, UserName, rule_type, status, severity, *])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Wiz" and rule_type = "Cloud Event Rule" and status = "OPEN" and severity = "MEDIUM"
    | fields _time, rule_name, resource_name, resource_type, cloud_provider, account_id, description
  lucene: |
    rule_type:"Cloud Event Rule" AND status:"OPEN" AND severity:"MEDIUM"
  sumo: "_sourceCategory=*Wiz* \n| json field=_raw \"rule_type\" as rule_type\n| json field=_raw \"status\" as status\n| json field=_raw \"severity\"\
    \ as severity\n| where rule_type = \"Cloud Event Rule\" AND status = \"OPEN\" AND severity = \"MEDIUM\"\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Wiz event \n   where rule_type is \"Cloud Event Rule\" \n   AND status is \"OPEN\" \n   AND severity is \"MEDIUM\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

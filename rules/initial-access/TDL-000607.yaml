rule_id: TDL-AUTH-000607
v4_id: '000607'
name: Wiz High Severity Detection
description: Detects a Cloud Event Rule from the Wiz platform.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Wiz
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wiz sourcetype=wiz:cloudevents rule_type="Cloud Event Rule" status="OPEN" severity="HIGH"

    | table _time, rule_name, rule_type, status, severity, cloud_provider, resource_id, user, description

    '
  kql: |
    Wiz_CL
    | where TimeGenerated > ago(1h)
    | where rule_type_s == "Cloud Event Rule"
    | where status_s == "OPEN"
    | where severity_s == "HIGH"
    | project TimeGenerated, rule_type_s, status_s, severity_s, rule_name_s, resource_id_s, cloud_platform_s, subscription_id_s, resource_name_s
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "rule_type", "status", "severity", username, sourceip, destinationip
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Wiz%'
      AND "rule_type" = 'Cloud Event Rule'
      AND "status" = 'OPEN'
      AND "severity" = 'HIGH'
    LAST 24 HOURS
  yara_l: |
    rule wiz_high_severity_cloud_event_open {
      meta:
        author = "Detection Engineering"
        description = "Detects high severity open cloud event rules from Wiz indicating potential T1078 Valid Accounts usage"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Wiz"
        $e.metadata.product_name = "Wiz"
        $e.security_result.rule_type = "Cloud Event Rule"
        $e.security_result.detection_fields["status"] = "OPEN"
        $e.security_result.severity = "HIGH"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-wiz.events*
    | WHERE rule_type == "Cloud Event Rule" AND status == "OPEN" AND severity == "HIGH"
    | KEEP @timestamp, host.name, user.name, rule_type, status, severity, event.id, event.action
  leql: |
    where(rule_type="Cloud Event Rule" AND status="OPEN" AND severity="HIGH")
  crowdstrike: |
    #repo=wiz rule_type="Cloud Event Rule" status="OPEN" severity="HIGH"
    | table([@timestamp, rule_type, status, severity, ComputerName, UserName, description, resource, cloud_provider])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Wiz" and rule_type = "Cloud Event Rule" and status = "OPEN" and severity = "HIGH"
    | fields _time, rule_type, status, severity, rule_name, resource_name, project_id, actor_user
  lucene: |
    rule_type:"Cloud Event Rule" AND status:"OPEN" AND severity:"HIGH"
  sumo: |
    _sourceCategory=*Wiz* "Cloud Event Rule" "OPEN" "HIGH"
    | json field=_raw "rule_type" as rule_type
    | json field=_raw "status" as status
    | json field=_raw "severity" as severity
    | where rule_type = "Cloud Event Rule" AND status = "OPEN" AND severity = "HIGH"
    | fields _messageTime, _sourceHost, rule_type, status, severity
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Wiz event \n   where rule_type is \"Cloud Event Rule\" \n   AND status is \"OPEN\" \n   AND severity is \"HIGH\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

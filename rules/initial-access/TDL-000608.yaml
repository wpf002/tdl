rule_id: TDL-AUTH-000608
v4_id: 000608
name: Wiz Critical Severity Detection
description: Detects a Cloud Event Rule from the Wiz platform.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Wiz
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=* sourcetype=wiz:* rule_type="Cloud Event Rule" status="OPEN" severity="CRITICAL"

    | table _time, rule_type, status, severity, *

    '
  kql: |
    WizCloudEvents
    | where TimeGenerated > ago(24h)
    | where RuleType == "Cloud Event Rule"
    | where Status == "OPEN"
    | where Severity == "CRITICAL"
    | project TimeGenerated, RuleName, RuleType, Status, Severity, ResourceName, ResourceType, CloudProvider, CloudAccount, Description, RuleId, ResourceId
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS source, "rule_type", "status", "severity", "description"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%wiz%'
      AND "rule_type" = 'Cloud Event Rule'
      AND "status" = 'OPEN'
      AND "severity" = 'CRITICAL'
    LAST 24 HOURS
  yara_l: |
    rule wiz_critical_cloud_event_t1078 {
      meta:
        author = "TDL"
        description = "Detects critical open Wiz cloud event rules indicating potential T1078 Valid Accounts activity"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "CRITICAL"

      events:
        $e.metadata.vendor_name = "Wiz"
        $e.metadata.product_name = "Wiz"
        $e.security_result.rule_type = "Cloud Event Rule"
        $e.security_result.detection_fields["status"] = "OPEN"
        $e.security_result.severity = "CRITICAL"
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 95

      condition:
        $e
    }
  esql: "FROM logs-wiz*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.kind == \"alert\"\n  AND wiz.rule_type == \"Cloud Event Rule\"\n \
    \ AND event.outcome == \"OPEN\"\n  AND event.severity == \"CRITICAL\"\n| KEEP @timestamp, host.name, user.name, wiz.rule_type, event.outcome,\
    \ event.severity, wiz.rule_name, cloud.account.id, cloud.provider\n"
  leql: |
    where(rule_type="Cloud Event Rule" AND status="OPEN" AND severity="CRITICAL")
  crowdstrike: |
    #type=wiz rule_type="Cloud Event Rule" status=OPEN severity=CRITICAL
    | table([@timestamp, rule_type, status, severity, *])
  xql: |
    dataset = wiz_issue_raw
    | filter rule_type = "Cloud Event Rule" and status = "OPEN" and severity = "CRITICAL"
    | fields _time, issue_id, title, description, severity, status, rule_type, resource_id, resource_name, project_id
  lucene: |
    rule_type:"Cloud Event Rule" AND status:"OPEN" AND severity:"CRITICAL"
  sumo: "_sourceCategory=*Wiz* \n| json field=_raw \"rule_type\" as rule_type\n| json field=_raw \"status\" as status\n| json field=_raw \"severity\"\
    \ as severity\n| where rule_type = \"Cloud Event Rule\" AND status = \"OPEN\" AND severity = \"CRITICAL\"\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Wiz event \n   where rule_type is \"Cloud Event Rule\" \n   AND status is \"OPEN\" \n   AND severity is \"CRITICAL\""
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

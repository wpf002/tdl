rule_id: TDL-AUTH-000609
v4_id: 000609
name: Blocked Remote Code Execution Attempt
description: Detects when inbound traffic with a Remote Code Injection signature is blocked
tactic: Initial Access
tactic_id: TA0001
technique_id: T1190
technique_name: Exploit Public-Facing Application
platform:
- Network
data_sources:
- Intrusion Detection/Prevention (IDS/IPS)
- Web Application Firewall (WAF)
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=network (sourcetype=firewall OR sourcetype=ids) protocol=tcp action=blocked (signature="*remote code execution*" OR signature="*RCE*"
    OR attack_type="*remote code execution*" OR attack_type="*RCE*")

    | search NOT [| inputlookup authorized_scanners.csv | fields src_ip]

    | stats count sum(bytes_out) as total_bytes_out dc(dest_ip) as unique_dests by src_ip, dest_ip, dest_port

    | where count >= 1

    | sort - total_bytes_out

    | table src_ip, dest_ip, dest_port, count, unique_dests, total_bytes_out

    '
  kql: "CommonSecurityLog\n| where TimeGenerated > ago(1h)\n| where DeviceVendor has_any (\"Palo Alto\", \"Fortinet\", \"Cisco\", \"Check Point\"\
    , \"Snort\", \"Suricata\", \"Imperva\", \"F5\", \"Barracuda\")\n| where DeviceAction in (\"blocked\", \"denied\", \"dropped\", \"reject\"\
    , \"alert\")\n| where (DeviceEventCategory has_any (\"rce\", \"remote code execution\", \"code injection\", \"command injection\") or Activity\
    \ has_any (\"rce\", \"remote code execution\", \"code injection\", \"command injection\") or Message has_any (\"CVE-\", \"exploit\", \"remote\
    \ code\", \"command injection\"))\n| where Protocol =~ \"tcp\" or ApplicationProtocol =~ \"tcp\"\n| where SourceIP !in (\"10.0.0.100\", \"\
    10.0.0.101\", \"192.168.1.50\")\n| summarize \n    event_count = count(),\n    unique_dests = dcount(DestinationIP),\n    total_bytes_out\
    \ = sum(SentBytes)\n    by SourceIP, DestinationIP, DestinationPort\n| where event_count >= 1\n| sort by total_bytes_out desc\n| project SourceIP,\
    \ DestinationIP, DestinationPort, event_count, unique_dests, total_bytes_out\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, COUNT(*) AS event_count, UNIQUECOUNT(destinationip) AS unique_dests, SUM(bytesout) AS total_bytes_out, CATEGORYNAME(category) AS event_category, qidname(qid) AS event_name
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%firewall%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%IDS%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%IPS%' OR LOGSOURCETYPENAME(devicetype) ILIKE '%WAF%')
      AND protocolid = 6
      AND (CATEGORYNAME(category) ILIKE '%exploit%' OR CATEGORYNAME(category) ILIKE '%injection%' OR qidname(qid) ILIKE '%remote code execution%' OR qidname(qid) ILIKE '%RCE%' OR CATEGORYNAME(category) ILIKE '%attack%')
      AND sourceip NOT IN ('10.0.0.100', '10.0.0.101', '192.168.1.50')
    GROUP BY sourceip, destinationip, destinationport
    HAVING event_count >= 1
    ORDER BY total_bytes_out DESC
    LAST 24 HOURS
  yara_l: |
    rule exploit_public_facing_application_t1190 {
      meta:
        author = "Detection Engineering"
        description = "Detects blocked RCE attempts on network perimeter - T1190 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1190"
        severity = "HIGH"

      events:
        (
          $e.metadata.product_log_id = "firewall" or
          $e.metadata.product_log_id = "ids"
        )
        $e.metadata.event_type = "NETWORK_CONNECTION"
        $e.network.ip_protocol = "TCP"
        $e.security_result.action = "BLOCK"
        (
          re.regex($e.security_result.summary, `(?i)(remote[\s_-]?code[\s_-]?execution|RCE|exploit|attack|injection|command[\s_-]?injection)`) or
          re.regex($e.security_result.rule_name, `(?i)(remote[\s_-]?code[\s_-]?execution|RCE|exploit|attack|injection|command[\s_-]?injection)`)
        )
        $e.principal.ip = $src_ip
        $e.target.ip = $dest_ip
        $e.target.port = $dest_port
        not (
          $e.principal.ip = "10.100.50.10" or
          $e.principal.ip = "10.100.50.11" or
          $e.principal.ip = "10.100.50.12" or
          net.ip_in_range_cidr($e.principal.ip, "192.168.254.0/24")
        )

      match:
        $src_ip, $dest_ip, $dest_port over 1h

      outcome:
        $risk_score = max(75)
        $unique_dests = count_distinct($dest_ip)
        $total_bytes_out = sum($e.network.sent_bytes)
        $src_ip_output = $src_ip
        $dest_ip_output = $dest_ip
        $dest_port_output = $dest_port

      condition:
        #e >= 1
    }
  esql: "FROM logs-network.ids*, logs-network.firewall*, logs-network.waf*\n| WHERE @timestamp > NOW() - 24 hours\n  AND network.protocol == \"\
    tcp\"\n  AND (event.action == \"blocked\" OR event.outcome == \"failure\" OR event.type == \"denied\")\n  AND (threat.technique.id == \"T1190\"\
    \ OR event.category == \"intrusion_detection\" OR event.kind == \"alert\")\n  AND source.ip NOT IN (\"10.0.0.100\", \"10.0.0.101\", \"192.168.1.50\"\
    )\n| EVAL bytes_out_val = COALESCE(destination.bytes, network.bytes, 0)\n| STATS \n    event_count = COUNT(*),\n    unique_dests = COUNT_DISTINCT(destination.ip),\n\
    \    total_bytes_out = SUM(bytes_out_val)\n  BY source.ip, destination.ip, destination.port\n| WHERE event_count >= 1\n| SORT total_bytes_out\
    \ DESC\n| KEEP source.ip, destination.ip, destination.port, event_count, unique_dests, total_bytes_out\n"
  leql: |
    where(source_json.action IN ["blocked", "block", "deny", "drop"] AND (source_json.attack_type ICONTAINS "remote code execution" OR source_json.attack_type ICONTAINS "rce" OR source_json.signature ICONTAINS "remote code execution" OR source_json.signature ICONTAINS "rce") AND source_json.protocol ICONTAINS "tcp" AND source_address NOT IN ["10.0.0.100", "10.0.0.101", "192.168.1.50"]) groupby(source_address, destination_address, destination_port) calculate(count, unique:destination_address)
  crowdstrike: |
    #type=network (sourcetype=firewall OR sourcetype=ids) network.protocol=*tcp* event_category=blocked attack_type=*RCE* OR attack_type=*remote*code*execution* OR signature=*remote*code*execution*
    | NOT (src_ip IN ["10.0.0.100", "10.0.0.101", "192.168.1.50"])
    | groupBy([src_ip, dest_ip, dest_port], function=[count(as=event_count), count(dest_ip, distinct=true, as=unique_dests), sum(bytes_out, as=total_bytes_out)])
    | event_count >= 1
    | sort(total_bytes_out, order=desc)
    | table([src_ip, dest_ip, dest_port, event_count, unique_dests, total_bytes_out])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action = "block-reset" or action = "deny" or action = "drop"
    | filter proto = "tcp"
    | filter threat_category = "code-execution" or threat_category contains "exploit"
    | filter src not in ("10.0.0.50", "10.0.0.51", "192.168.1.100")
    | comp count() as event_count, count_distinct(dst) as unique_dests, sum(bytes_sent) as total_bytes_out by src, dst, dport
    | filter event_count >= 1
    | sort desc total_bytes_out
    | fields src, dst, dport, event_count, unique_dests, total_bytes_out
  lucene: |
    (sourcetype:(firewall OR ids) AND network.protocol:*tcp*) AND (event.category:intrusion_detection OR event.type:denied OR action:(blocked OR denied OR dropped) OR signature:*RCE* OR signature:*remote*code*execution* OR attack_type:*RCE* OR attack_type:*remote*code*execution*) AND NOT source.ip:(10.244.0.0/16 OR 172.16.0.0/12 OR authorized_scanner OR monitoring_agent)
  sumo: |
    _sourceCategory=*network* OR _sourceCategory=*firewall* OR _sourceCategory=*ids* OR _sourceCategory=*waf*
    | where _sourceCategory matches "*firewall*" OR _sourceCategory matches "*ids*" OR _sourceCategory matches "*waf*"
    | parse regex "(?<protocol>[a-zA-Z]+)" nodrop
    | parse regex "src_ip=(?<src_ip>\S+)" nodrop
    | parse regex "dest_ip=(?<dest_ip>\S+)" nodrop
    | parse regex "dest_port=(?<dest_port>\d+)" nodrop
    | parse regex "bytes_out=(?<bytes_out>\d+)" nodrop
    | parse regex "action=(?<action>\S+)" nodrop
    | parse regex "threat=(?<threat>[^,\s]+)" nodrop
    | json field=_raw "protocol" as protocol_json nodrop
    | json field=_raw "src_ip" as src_ip_json nodrop
    | json field=_raw "dest_ip" as dest_ip_json nodrop
    | json field=_raw "dest_port" as dest_port_json nodrop
    | json field=_raw "bytes_out" as bytes_out_json nodrop
    | json field=_raw "action" as action_json nodrop
    | json field=_raw "threat" as threat_json nodrop
    | if(isNull(protocol), protocol_json, protocol) as protocol
    | if(isNull(src_ip), src_ip_json, src_ip) as src_ip
    | if(isNull(dest_ip), dest_ip_json, dest_ip) as dest_ip
    | if(isNull(dest_port), dest_port_json, dest_port) as dest_port
    | if(isNull(bytes_out), bytes_out_json, bytes_out) as bytes_out
    | if(isNull(action), action_json, action) as action
    | if(isNull(threat), threat_json, threat) as threat
    | where (protocol matches "*tcp*" OR protocol matches "*TCP*")
    | where (action matches "*block*" OR action matches "*denied*" OR action matches "*reject*" OR action matches "*drop*") AND (threat matches "*rce*" OR threat matches "*remote*code*" OR threat matches "*command*injection*" OR threat matches "*exploit*" OR _raw matches "*remote code execution*" OR _raw matches "*RCE*")
    | where !(src_ip in ("10.0.0.100", "192.168.1.50", "172.16.0.10"))
    | count as event_count, count_distinct(dest_ip) as unique_dests, sum(bytes_out) as total_bytes_out by src_ip, dest_ip, dest_port
    | where event_count >= 1
    | sort by total_bytes_out desc
    | fields src_ip, dest_ip, dest_port, event_count, unique_dests, total_bytes_out
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the destination domain/IP, ASN, port, and TLS / HTTP fingerprints to assess whether the entry vector is consistent with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'
pseudo_logic: '1 Instance within any observed window of a blocked Remote Code Execution attempt event.


  From index=network where sourcetype is firewall or sourcetype is ids

  Where network.protocol contains "tcp"

  With count of events grouped by src_ip, dest_ip, and dest_port is greater than or equal to 1

  With distinct count of dest_ip as unique_dests and total sum of bytes_out calculated per grouping

  Excluding events originating from known authorized scanner IPs or monitoring agent source addresses

  With the same src_ip, dest_ip, and dest_port, sorted descending by bytes_out to surface highest-volume attempts first'

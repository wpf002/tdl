rule_id: TDL-AUTH-000615
v4_id: '000615'
name: Logon with Break Glass Account
description: A rule that detects when there is a successful logon into a break glass account. Break glass accounts are highly privileged accounts
  and should only be used in emergency situations.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- AWS
- Azure
data_sources:
- Azure
- AWS
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=azure sourcetype=azure:aad:signin OR index=aws sourcetype=aws:cloudtrail) \n(\n    (sourcetype=azure:aad:signin status=0) OR \n\
    \    (sourcetype=aws:cloudtrail eventName=ConsoleLogin responseElements.ConsoleLogin=Success)\n)\n| eval user=coalesce(userPrincipalName,\
    \ user, userName, userIdentity.userName)\n| lookup break_glass_accounts.csv account_name as user OUTPUT is_break_glass\n| where is_break_glass=\"\
    true\" OR user IN (\"breakglass*\", \"emergency*\", \"bg-*\", \"emerg-*\")\n| table _time, user, src_ip, resultType, eventName, userAgent,\
    \ location\n"
  kql: |
    SigninLogs
    | where TimeGenerated > ago(1h)
    | where ResultType == 0
    | where UserPrincipalName in ("breakglass1@domain.com", "breakglass2@domain.com")
    | project TimeGenerated, UserPrincipalName, AppDisplayName, IPAddress, Location, DeviceDetail, AuthenticationRequirement, ConditionalAccessStatus, RiskLevelDuringSignIn
  aql: |
    SELECT username, sourceip, LOGSOURCENAME(logsourceid) AS log_source, CATEGORYNAME(category) AS event_category, eventtime, "User Agent", "Application", "Location"
    FROM events
    WHERE (LOGSOURCENAME(logsourceid) ILIKE '%Azure%' OR LOGSOURCENAME(logsourceid) ILIKE '%AWS%' OR category IN (SELECT category FROM categories WHERE name ILIKE '%Authentication%' OR name ILIKE '%Sign%In%'))
      AND (CATEGORYNAME(category) ILIKE '%Success%' OR CATEGORYNAME(category) ILIKE '%Logon%' OR "Event Name" ILIKE '%Success%' OR "EventID" = '4624' OR "Activity" ILIKE '%Sign%in%success%' OR "Result" ILIKE '%Success%')
      AND (username IN ('break-glass-admin@company.com', 'emergency-access@company.com', 'breakglass@company.com') OR username ILIKE '%breakglass%' OR username ILIKE '%emergency%access%')
    LAST 24 HOURS
  yara_l: "rule break_glass_account_signin {\n  meta:\n    author = \"TDL\"\n    description = \"Detects successful sign-in events from break\
    \ glass accounts\"\n    mitre_attack_tactic = \"Initial Access\"\n    mitre_attack_technique = \"T1078\"\n    severity = \"HIGH\"\n    \n\
    \  events:\n    $signin.metadata.event_type = \"USER_LOGIN\"\n    $signin.security_result.action = \"ALLOW\"\n    $signin.target.user.userid\
    \ = $user\n    \n    // Break glass accounts - update with actual account identifiers\n    (\n      re.regex($user, `(?i)breakglass`) or\n\
    \      re.regex($user, `(?i)emergency`) or\n      re.regex($user, `(?i)bg-admin`) or\n      re.regex($user, `(?i)fireglass`)\n    )\n    \n\
    \  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 85\n    $user_email = array_distinct($signin.target.user.userid)\n    $source_ip\
    \ = array_distinct($signin.principal.ip)\n    $application = array_distinct($signin.target.application)\n    \n  condition:\n    $signin\n\
    }\n"
  esql: "FROM .ds-logs-azure.signinlogs-*, .ds-logs-azure.auditlogs-*, logs-aws.cloudtrail-*\n| WHERE @timestamp > NOW() - 24 hour\n| WHERE \n\
    \  (event.dataset == \"azure.signinlogs\" AND azure.signinlogs.properties.status.error_code == 0 AND event.outcome == \"success\")\n  OR\n\
    \  (event.dataset == \"azure.auditlogs\" AND event.outcome == \"success\" AND event.action LIKE \"*sign*\")\n  OR\n  (event.dataset == \"\
    aws.cloudtrail\" AND event.action IN (\"ConsoleLogin\", \"AssumeRole\") AND event.outcome == \"success\")\n| WHERE \n  user.name IN (\"break-glass-admin@company.com\"\
    , \"emergency-access@company.com\", \"breakglass@company.com\", \"bg-admin@company.com\")\n  OR user.id IN (\"break-glass-account-id-1\",\
    \ \"break-glass-account-id-2\")\n  OR azure.signinlogs.properties.user_principal_name IN (\"break-glass-admin@company.com\", \"emergency-access@company.com\"\
    )\n  OR aws.cloudtrail.user_identity.arn LIKE \"*break-glass*\"\n| STATS sign_ins = COUNT(*) BY user.name, user.id, source.ip, source.geo.country_name,\
    \ user_agent.original, @timestamp\n| KEEP @timestamp, user.name, user.id, source.ip, source.geo.country_name, user_agent.original, sign_ins\n"
  leql: |
    where(result=SUCCESS AND user IN ["break-glass-account-1@domain.com", "break-glass-account-2@domain.com"])
  crowdstrike: |
    (#repo="azure" event.category="authentication" event.outcome="success" OR #repo="aws" eventName="ConsoleLogin" responseElements.ConsoleLogin="Success")
    | UserName in [breakglass1@example.com, breakglass2@example.com, breakglass-admin@example.com]
    | table([@timestamp, #repo, UserName, ComputerName, SourceIP, event.action, eventName])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider in ("AWS", "Azure")
    | filter (cloud_provider = "Azure" and action_result = "SUCCESS" and operation_name = "Sign-in activity")
       or (cloud_provider = "AWS" and action_result = "SUCCESS" and operation_name = "ConsoleLogin")
    | alter break_glass_accounts = ["break-glass-admin-1", "break-glass-admin-2", "emergency-access-admin"]
    | filter identity_name in (break_glass_accounts)
    | fields _time, cloud_provider, identity_name, actor_user, operation_name, action_result, src_ipv4, user_agent
  lucene: |
    (event.dataset:"azure.signinlogs" OR event.dataset:"azure.auditlogs" OR eventName:"ConsoleLogin" OR eventName:"AssumeRole") AND event.outcome:success AND user.name:(*breakglass* OR *emergency* OR *break-glass* OR *emergencyaccess* OR *bga-* OR *emer-*)
  sumo: "_sourceCategory=*Azure* OR _sourceCategory=*AWS*\n| json field=_raw \"eventName\" as aws_event_name\n| json field=_raw \"userIdentity.userName\"\
    \ as aws_user\n| json field=_raw \"errorCode\" as aws_error\n| json field=_raw \"operationName\" as azure_operation\n| json field=_raw \"\
    userPrincipalName\" as azure_user\n| json field=_raw \"resultType\" as azure_result\n| where (aws_event_name = \"ConsoleLogin\" and isNull(aws_error))\
    \ \n       OR (azure_operation = \"Sign-in activity\" and azure_result = \"0\")\n| if(isNull(aws_user), azure_user, aws_user) as user_name\n\
    | where user_name in (\"break-glass-admin@company.com\", \"emergency-access@company.com\", \"break-glass-1\", \"break-glass-2\")\n| fields\
    \ _messageTime, _sourceCategory, user_name, aws_event_name, azure_operation, _sourceHost\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Successful Sign-In Event

  Where the source user is in Break Glass Account list'
suppression:
  window: 8 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

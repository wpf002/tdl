rule_id: TDL-AUTH-000623
v4_id: '000623'
name: Potential GraphRunner Invoke-InviteGuest Usage
description: Designed to detect activities associated with the usage of GraphRunner, a post exploit toolset for interacting with the Microsoft
  Graph API
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=azure sourcetype="azure:audit" (operation_name="Invite external user" OR (operation_name="*Add user*" AND additionalDetails="*Microsoft
    Azure Graph Client Library 1.0*"))

    | table _time, user, operation_name, result, target_user, additionalDetails, ip_address

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(90d)
    | where OperationName == "Invite external user" or (OperationName has "Add user" and tostring(AdditionalDetails) has "Microsoft Azure Graph Client Library 1.0")
    | project TimeGenerated, OperationName, Identity, InitiatedBy, TargetResources, ResultReason, AdditionalDetails, CorrelationId
  aql: |
    SELECT eventtime, username, sourceip, "Operation Name", "Additional Details", "Target User"
    FROM events
    WHERE (LOGSOURCETYPENAME(devicetype) ILIKE '%Azure%' OR categoryname(category) ILIKE '%Azure%')
      AND (("Operation Name" = 'Invite external user')
           OR ("Operation Name" ILIKE '%Add user%' AND "Additional Details" = 'Microsoft Azure Graph Client Library 1.0'))
    LAST 24 HOURS
  yara_l: |
    rule azure_external_user_invite_or_graph_add {
      meta:
        author = "TDL"
        description = "Detects external user invitation or user addition via Azure Graph Client Library"
        mitre_attack_technique = "T1078"
        mitre_attack_tactic = "Initial Access"
        platform = "Azure"

      events:
        (
          $e.metadata.product_name = "Azure"
          $e.metadata.event_type = "USER_CREATION"
          $e.metadata.product_event_type = "Invite external user"
        )
        or
        (
          $e.metadata.product_name = "Azure"
          $e.metadata.event_type = "USER_CREATION"
          re.regex($e.metadata.product_event_type, `(?i)Add user`)
          re.regex($e.about.labels.value, `(?i)Microsoft Azure Graph Client Library 1\.0`)
        )

      match:
        $e.principal.user.userid over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure.auditlogs*
    | WHERE @timestamp > NOW() - 24 hour
      AND (
        azure.auditlogs.operation_name == "Invite external user"
        OR (
          azure.auditlogs.operation_name LIKE "*Add user*"
          AND azure.auditlogs.properties.additional_details LIKE "*Microsoft Azure Graph Client Library 1.0*"
        )
      )
    | KEEP @timestamp, azure.auditlogs.operation_name, azure.activitylogs.identity.name, azure.auditlogs.properties.initiated_by.user.user_principal_name, azure.auditlogs.properties.target_resources, azure.auditlogs.properties.additional_details
  leql: |
    where((source_json.operationName="Invite external user") OR (source_json.operationName ICONTAINS "Add user" AND source_json.additionalDetails="Microsoft Azure Graph Client Library 1.0"))
  crowdstrike: |
    #type=azure_audit (OperationName="Invite external user" OR (OperationName=*"Add user"* AdditionalDetails="Microsoft Azure Graph Client Library 1.0"))
    | table([@timestamp, OperationName, Actor, TargetResources, AdditionalDetails, ComputerName])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and (operation_name = "Invite external user" or (operation_name contains "Add user" and json_extract_scalar(additional_details, "$.userAgent") = "Microsoft Azure Graph Client Library 1.0"))
    | fields _time, operation_name, actor_user, target_user, additional_details, cloud_provider
  lucene: |
    (operation_name:"Invite external user") OR (operation_name:*Add\ user* AND additional_details:"Microsoft Azure Graph Client Library 1.0")
  sumo: |
    _sourceCategory=*Azure*Audit*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.additionalDetails" as additional_details
    | where (operation_name = "Invite external user") OR (operation_name matches "*Add user*" AND additional_details matches "*Microsoft Azure Graph Client Library 1.0*")
    | fields _messageTime, _sourceHost, operation_name, additional_details
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Azure Audit Event \nOR\nWhere the Operation Name is \"Invite external user\"\n\nWhere the Operation Name contains \"Add user\"\
  \nAND Where the Additional Details is \"Microsoft Azure Graph Client Library 1.0\""
suppression:
  window: 12 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

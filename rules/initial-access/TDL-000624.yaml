rule_id: TDL-AUTH-000624
v4_id: '000624'
name: Potential GraphRunner Group Creation
description: Designed to detect activities associated with the usage of GraphRunner, a post exploit toolset for interacting with the Microsoft
  Graph API
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=azure sourcetype=\"azure:aad:audit\" \n((\"Additional Details\"=\"*PowerShell*\") OR (operationName=\"Add group\") OR (operationName=\"\
    Add member to group\"))\n| table _time, user, operationName, result, targetResources{}.displayName, additionalDetails\n"
  kql: |
    AuditLogs
    | where TimeGenerated > ago(1h)
    | where (AdditionalDetails has "PowerShell" or OperationName == "Add group" or OperationName == "Add member to group")
    | project TimeGenerated, OperationName, Identity, TargetResources, ActivityDisplayName, Result, AdditionalDetails, InitiatedBy
  aql: |
    SELECT eventtime, username, sourceip, "Operation Name", "Additional Details", LOGSOURCENAME(logsourceid) AS log_source, COUNT(*) AS event_count
    FROM events
    WHERE (LOWER("Additional Details") LIKE '%powershell%' OR "Operation Name" = 'Add Group' OR "Operation Name" = 'Add member to Group')
      AND LOGSOURCENAME(logsourceid) ILIKE '%azure%'
    GROUP BY eventtime, username, sourceip, "Operation Name", "Additional Details", log_source
    LAST 24 HOURS
  yara_l: |
    rule azure_initial_access_t1078_powershell_group_ops {
      meta:
        author = "Detection Engineering"
        description = "Detects Azure operations involving PowerShell or group additions/modifications - T1078 Initial Access"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure"
        (
          re.regex($e.security_result.detection_fields["Additional Details"], `(?i)PowerShell`) or
          $e.metadata.product_event_type = "Add Group" or
          $e.metadata.product_event_type = "Add member to Group"
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-azure*\n| WHERE event.dataset == \"azure.auditlogs\" \n  AND (\n    (azure.auditlogs.properties.additional_details LIKE \"\
    *PowerShell*\")\n    OR (event.action == \"Add Group\")\n    OR (event.action == \"Add member to group\")\n  )\n| KEEP @timestamp, host.name,\
    \ user.name, event.action, azure.auditlogs.operation_name, azure.auditlogs.properties.additional_details, source.ip, azure.auditlogs.properties.target_resources\n"
  leql: |
    where((source_json.additionalDetails ICONTAINS "PowerShell" OR source_json.operationName="Add Group") AND source_json.operationName="Add member to Group")
  crowdstrike: |
    #repo=azure
    (AdditionalDetails=*PowerShell* OR OperationName="Add Group" OR OperationName="Add member to Group")
    | table([@timestamp, OperationName, Caller, CallerIpAddress, ResourceId, AdditionalDetails])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE"
    | filter (to_string(raw_log) contains "PowerShell" or operation_name in ("Add Group", "Add member to Group"))
    | fields _time, operation_name, actor_user, resource_name, raw_log
  lucene: |
    (azure.activitylogs.properties.additional_details:*PowerShell* OR azure.auditlogs.properties.operation_name:"Add group") AND azure.auditlogs.properties.operation_name:"Add member to group"
  sumo: "_sourceCategory=*Azure* \n| json field=_raw \"operationName\" as operation_name\n| json field=_raw \"properties.additionalDetails\" as\
    \ additional_details\n| where (additional_details matches \"*PowerShell*\") \n   OR (operation_name = \"Add Group\") \n   OR (operation_name\
    \ = \"Add member to Group\")\n| fields _messageTime, _sourceHost, operation_name, additional_details\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Azure Audit Event

  Where the  Additional Details contains "PowerShell"

  OR

  Where the Operation Name is "Add Group"


  Where the Operation Name is "Add member to Group"'
suppression:
  window: 12 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on to assess whether the entry vector is consistent
  with this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

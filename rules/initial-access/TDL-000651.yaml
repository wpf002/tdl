rule_id: TDL-AUTH-000651
v4_id: '000651'
name: Azure App Granted Privileged Delegated or App Permissions
description: Detects when administrator grants either application permissions (app roles) or highly privileged delegated permissions. This could
  indicate that an application has been granted overly permissive permissions.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Entra ID
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype="azure:aad:audit" operationName="Add app role assignment to service principal" NOT (properties.targetResources{}.modifiedProperties{}.newValue="*.Read.All")

    | table _time, properties.initiatedBy.user.userPrincipalName, properties.targetResources{}.displayName, properties.targetResources{}.modifiedProperties{}.newValue,
    properties.resultReason

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName == "Add app role assignment to service principal"
    | where parse_json(TargetResources)[0].modifiedProperties !has ".Read.All"
    | project TimeGenerated, OperationName, InitiatedBy = tostring(InitiatedBy.user.userPrincipalName), TargetResources, Result, CorrelationId
  aql: |
    SELECT eventtime, username, "Application Name", "Application Role", sourceip, LOGSOURCENAME(logsourceid) AS source
    FROM events
    WHERE "Event Name" = 'Add app role assignment to service principal'
      AND "Application Role" NOT LIKE '%.Read.All%'
    LAST 24 HOURS
  yara_l: |
    rule entra_app_role_assignment_non_read {
      meta:
        author = "Chronicle Detection"
        description = "Detects app role assignments to service principals that are not Read.All permissions"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        platform = "Windows"
        data_source = "Entra ID"

      events:
        $e.metadata.product_name = "Microsoft Azure"
        $e.metadata.product_event_type = "Add app role assignment to service principal"
        not re.regex($e.security_result.summary, `\.Read\.All`)
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure.auditlogs*
    | WHERE azure.auditlogs.operation_name == "Add app role assignment to service principal"
      AND NOT azure.auditlogs.properties.app_role LIKE "*.Read.All"
    | KEEP @timestamp, azure.auditlogs.properties.target_resources, azure.auditlogs.properties.initiated_by, azure.auditlogs.properties.app_role, azure.auditlogs.operation_name
  leql: |
    where(source_json.operationName="Add app role assignment to service principal" AND source_json.properties.targetResources.modifiedProperties.newValue NOT ICONTAINS ".Read.All")
  crowdstrike: |
    #type=EntraID OperationName="Add app role assignment to service principal" NOT AppPermissions=*.Read.All
    | table([@timestamp, ComputerName, UserName, ServicePrincipalName, AppPermissions, OperationName])
  xql: |
    dataset = msft_azure_ad_audit_raw
    | filter event_name = "Add app role assignment to service principal"
    | filter action_evtlog_message !~= ".*\\.Read\\.All.*"
    | fields _time, actor_effective_username, action_evtlog_message, event_name, agent_hostname
  lucene: |
    event.action:"Add app role assignment to service principal" AND NOT app_role.value:*.Read.All
  sumo: |
    _sourceCategory=*Entra* OR _sourceCategory=*Azure* OR _sourceCategory=*AzureAD*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.appDisplayName" as app_name
    | json field=_raw "properties.appRoleValue" as app_role_value
    | json field=_raw "properties.targetResourceDisplayName" as target_resource
    | json field=_raw "activityDisplayName" as activity_name
    | json field=_raw "initiatedBy.user.userPrincipalName" as user_principal
    | json field=_raw "targetResources[*].displayName" as target_display
    | where (operation_name matches "*Add app role assignment*" or activity_name matches "*Add app role assignment to service principal*")
    | where !(app_role_value matches "*.Read.All")
    | fields _messageTime, user_principal, app_name, app_role_value, target_resource, target_display
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Entra Audit Event

  Where the event name is "Add app role assignment to service principal"

  Where the application role permissions do not match ".Read.All"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

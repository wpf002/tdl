rule_id: TDL-AUTH-000677
v4_id: '000677'
name: Guest User Created - Slack
description: Detects when a guest user is created in Slack
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="guest_created"

    | table _time, user, guest_user, workspace, src_ip

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(90d)
    | where OfficeWorkload == "Slack"
    | where Operation == "guest_created"
    | project TimeGenerated, UserId, Operation, OfficeObjectId, ClientIP, UserAgent, OrganizationId
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS log_source, "Action", payload
    FROM events
    WHERE "Action" = 'guest_created'
    LAST 24 HOURS
  yara_l: |
    rule slack_guest_account_created {
      meta:
        author = "TDL"
        description = "Detects creation of guest accounts in Slack which may indicate initial access attempts"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "guest_created"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "guest_created"
    | KEEP @timestamp, user.name, user.email, source.ip, event.action, host.name
  leql: |
    where(source_json.action="guest_created")
  crowdstrike: |
    #type=slack action=guest_created
    | table([@timestamp, user.name, user.email, guest.name, guest.email, team.name, action])
  xql: |
    dataset = slack_audit_logs
    | filter action = "guest_created"
    | fields _time, actor_user_id, actor_user_email, action, entity_type, entity_id, context_ip_address, context_user_agent
  lucene: |
    action:"guest_created"
  sumo: |
    _sourceCategory=*Slack* "guest_created"
    | json field=_raw "action" as action
    | where action = "guest_created"
    | fields _messageTime, _sourceHost, action, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "guest_created"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

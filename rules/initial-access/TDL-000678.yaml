rule_id: TDL-AUTH-000678
v4_id: 000678
name: Guest User Reactivated - Slack
description: Detects when a guest user is reactivated in Slack
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack sourcetype=slack:events action=guest_reactivated

    | table _time, user, action, guest_user, workspace

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "Slack"
    | where Operation == "guest_reactivated"
    | project TimeGenerated, UserId, ClientIP, Operation, OrganizationId, OfficeObjectId
  aql: |
    SELECT eventtime, username, sourceip, "Action", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Action" = 'guest_reactivated'
    LAST 24 HOURS
  yara_l: "rule slack_guest_reactivated {\n  meta:\n    author = \"TDL\"\n    description = \"Detects when a guest user is reactivated in Slack\
    \ - MITRE T1078 Initial Access\"\n    severity = \"Medium\"\n    mitre_tactic = \"Initial Access\"\n    mitre_technique = \"T1078\"\n    \n\
    \  events:\n    $e.metadata.product_name = \"Slack\"\n    $e.metadata.product_event_type = \"guest_reactivated\"\n    $e.principal.user.userid\
    \ = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-slack*
    | WHERE event.action == "guest_reactivated"
    | KEEP @timestamp, user.name, user.email, host.name, event.action, source.ip
  leql: |
    where(source_json.action="guest_reactivated")
  crowdstrike: |
    action=guest_reactivated
    | table([@timestamp, user.email, user.name, user.id, actor.user.email, actor.user.name, workspace.name, workspace.id])
  xql: |
    dataset = slack_audit_logs
    | filter action = "guest_reactivated"
    | fields _time, action, actor_user_email, actor_user_name, entity_user_email, entity_user_name, entity_user_id
  lucene: |
    slack.action:guest_reactivated
  sumo: |
    _sourceCategory=*Slack* "guest_reactivated"
    | json field=_raw "action" as action
    | where action = "guest_reactivated"
    | fields _messageTime, _sourceHost, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "guest_reactivated"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

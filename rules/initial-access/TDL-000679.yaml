rule_id: TDL-AUTH-000679
v4_id: 000679
name: Permissions Assigned to Role - Slack
description: Detects when permissions are assigned to a role within Slack
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="permissions_assigned"

    | table _time, user, action, source, dest, app, permissions, channel, workspace

    '
  kql: |
    Slack_CL
    | where TimeGenerated > ago(24h)
    | where action_s == "permissions_assigned"
    | project TimeGenerated, user_s, user_id_s, entity_s, entity_id_s, permissions_s, actor_s, actor_id_s
  aql: |
    SELECT eventtime, username, sourceip, CATEGORYNAME(category) AS event_category, QIDNAME(qid) AS event_name, "Action"
    FROM events
    WHERE "Action" = 'permissions_assigned'
    LAST 24 HOURS
  yara_l: |
    rule slack_permissions_assigned {
      meta:
        author = "TDL"
        description = "Detects permissions assigned in Slack"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "permissions_assigned"
        $e.principal.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "permissions_assigned"
    | KEEP @timestamp, user.name, user.email, host.name, event.action, event.outcome, source.ip
  leql: |
    where(source_json.action="permissions_assigned")
  crowdstrike: |
    #type=slack action=permissions_assigned
    | table([@timestamp, user, team, channel, permissions, actor])
  xql: |
    dataset = slack_audit_logs
    | filter action = "permissions_assigned"
    | fields _time, actor_user_name, action, entity_type, entity_id, details
  lucene: |
    slack.action:"permissions_assigned"
  sumo: |
    _sourceCategory=*Slack* "permissions_assigned"
    | json field=_raw "action" as action
    | where action = "permissions_assigned"
    | fields _messageTime, _sourceHost, action, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "permissions_assigned"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

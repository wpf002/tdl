rule_id: TDL-AUTH-000682
v4_id: 000682
name: User Created - Slack
description: Detects when a regular user is created within Slack
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="user_created"

    | table _time, user, user_email, user_name, user_id, src_ip, action

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload =~ "Slack"
    | where Operation =~ "user_created"
    | project TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, OriginatingServer, OrganizationId, UserAgent
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, username, sourceip, "Action", "User ID", "Target User"
    FROM events
    WHERE "Action" = 'user_created'
    LAST 24 HOURS
  yara_l: |
    rule slack_user_created {
      meta:
        author = "Detection Engineering"
        description = "Detects new user creation in Slack (T1078 - Valid Accounts)"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "user_created"
        $e.principal.user.userid = $user

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "user_created"
    | KEEP @timestamp, user.name, user.email, host.name, event.action, source.ip
  leql: |
    where(source_json.action="user_created")
  crowdstrike: |
    #type=slack action=user_created
    | table([@timestamp, user.name, user.email, actor.user.name, actor.user.email, user.id])
  xql: |
    dataset = slack_audit_logs
    | filter action = "user_created"
    | fields _time, action, user_id, user_name, actor_user_id, actor_user_name
  lucene: |
    action:user_created AND _exists_:user_created
  sumo: |
    _sourceCategory=*Slack* "user_created"
    | json field=_raw "action" as action
    | where action = "user_created"
    | fields _messageTime, _sourceHost, action, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "user_created"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

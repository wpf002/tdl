rule_id: TDL-AUTH-000683
v4_id: 000683
name: User Reactivated - Slack
description: Detects when a regular user is reactivated within Slack
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="user_reactivated"

    | table _time, user, action, user_id, team_id, actor_user, actor_user_id

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(1h)
    | where OfficeWorkload == "Slack"
    | where Operation == "user_reactivated"
    | project TimeGenerated, UserId, ClientIP, Operation, OfficeWorkload, UserAgent, OriginatingServer
  aql: |
    SELECT eventtime, "Action", "User ID", "User Name", "Actor ID", "Actor Name", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Action" = 'user_reactivated'
    LAST 24 HOURS
  yara_l: |
    rule slack_user_reactivated {
      meta:
        author = "TDL"
        description = "Detects Slack user reactivation events which may indicate compromised account reuse"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "user_reactivated"
        $e.target.user.userid = $user

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "user_reactivated"
    | KEEP @timestamp, user.name, user.email, user.id, event.action, organization.name, source.ip
  leql: |
    where(source_json.action="user_reactivated")
  crowdstrike: |
    #type=slack action=user_reactivated
    | table([@timestamp, user.name, user.email, action, ComputerName])
  xql: |
    dataset = slack_audit_logs
    | filter action = "user_reactivated"
    | fields _time, action, actor_user_email, actor_user_id, entity_user_email, entity_user_id
  lucene: |
    action:user_reactivated
  sumo: |
    _sourceCategory=*Slack* "user_reactivated"
    | json field=_raw "action" as action
    | where action = "user_reactivated"
    | fields _messageTime, _sourceHost, action
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "user_reactivated"'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

rule_id: TDL-AUTH-000685
v4_id: 000685
name: Guest User Privilege Escalation - Slack
description: Detects when a newly created or reactivated user is given higher level privileges. This could be a sign of a threat actor trying
  to escalate privileges within a Slack org.
tactic: Initial Access
tactic_id: TA0001
technique_id: T1078
technique_name: Valid Accounts
platform:
- Windows
data_sources:
- Slack
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=slack \n| eval event_time=_time\n| search (action IN (\"guest_reactivated\", \"guest_channel_join\", \"guest_created\") OR action=\"\
    role_change_to_admin\")\n| sort 0 + event_time\n| streamstats current=f last(action) as prev_action last(event_time) as prev_time by target_username\n\
    | where action=\"role_change_to_admin\" AND prev_action IN (\"guest_reactivated\", \"guest_channel_join\", \"guest_created\") AND (event_time\
    \ - prev_time) <= 3600\n| table _time, target_username, prev_action, action, prev_time, event_time, user, src_ip\n"
  kql: |
    let GuestActions = Slack_CL
    | where TimeGenerated > ago(1h)
    | where Action_s in ("guest_reactivated", "guest_channel_join", "guest_created")
    | project GuestTime = TimeGenerated, TargetUsername = TargetUsername_s;
    let AdminChanges = Slack_CL
    | where TimeGenerated > ago(1h)
    | where Action_s == "role_change_to_admin"
    | project AdminTime = TimeGenerated, TargetUsername = TargetUsername_s;
    GuestActions
    | join kind=inner AdminChanges on TargetUsername
    | where AdminTime >= GuestTime and AdminTime <= GuestTime + 1h
    | project GuestTime, AdminTime, TargetUsername
  aql: "SELECT \n    FIRST(e1.eventtime) AS initial_event_time,\n    e1.username AS actor,\n    e1.\"Target Username\" AS target_user,\n    LAST(e2.eventtime)\
    \ AS role_change_time,\n    e1.\"Action\" AS initial_action\nFROM events e1\nWHERE \n    e1.\"Action\" IN ('guest_reactivated', 'guest_channel_join',\
    \ 'guest_created')\n    AND e1.\"Target Username\" IN (\n        SELECT e2.\"Target Username\"\n        FROM events e2\n        WHERE e2.\"\
    Action\" = 'role_change_to_admin'\n            AND e2.eventtime BETWEEN e1.eventtime AND e1.eventtime + 3600000\n        LAST 1 HOURS\n  \
    \  )\nGROUP BY e1.username, e1.\"Target Username\", e1.\"Action\"\nLAST 1 HOURS\n"
  yara_l: |
    rule slack_guest_to_admin_privilege_escalation {
      meta:
        author = "TDL"
        description = "Detects guest account activation followed by elevation to admin within 1 hour"
        mitre_attack_tactic = "Initial Access"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $guest.metadata.vendor_name = "Slack"
        (
          $guest.metadata.product_event_type = "guest_reactivated" or
          $guest.metadata.product_event_type = "guest_channel_join" or
          $guest.metadata.product_event_type = "guest_created"
        )
        $guest.target.user.userid = $target_user

        $admin.metadata.vendor_name = "Slack"
        $admin.metadata.product_event_type = "role_change_to_admin"
        $admin.target.user.userid = $target_user

        $guest.metadata.event_timestamp.seconds <= $admin.metadata.event_timestamp.seconds

      match:
        $target_user over 1h

      outcome:
        $risk_score = 85
        $guest_action = $guest.metadata.product_event_type
        $guest_time = $guest.metadata.event_timestamp.seconds
        $admin_time = $admin.metadata.event_timestamp.seconds

      condition:
        $guest and $admin
    }
  esql: "FROM logs-slack*\n| WHERE @timestamp > NOW() - 2 hours\n| WHERE event.action IN (\"guest_reactivated\", \"guest_channel_join\", \"guest_created\"\
    , \"role_change_to_admin\")\n| EVAL target_user = COALESCE(user.target.name, user.name)\n| SORT target_user, @timestamp\n| STATS \n    guest_time\
    \ = MIN(@timestamp),\n    admin_time = MAX(@timestamp),\n    guest_count = COUNT(*) WHERE event.action IN (\"guest_reactivated\", \"guest_channel_join\"\
    , \"guest_created\"),\n    admin_count = COUNT(*) WHERE event.action == \"role_change_to_admin\"\n  BY target_user\n| WHERE guest_count >=\
    \ 1 AND admin_count >= 1\n| EVAL time_diff_minutes = (admin_time - guest_time) / 60000\n| WHERE time_diff_minutes >= 0 AND time_diff_minutes\
    \ <= 60\n| KEEP target_user, guest_time, admin_time, time_diff_minutes\n"
  leql: "where(source_json.action IN [\"guest_reactivated\", \"guest_channel_join\", \"guest_created\"]) \ngroupby(source_json.target_username)\
    \ \ncalculate(count)\n"
  crowdstrike: |
    #type=slack action IN ["guest_reactivated", "guest_channel_join", "guest_created"]
    | groupBy([target_username], function=collect([action, @timestamp]))
    | rename("_collect", as="guest_events")
    | join({
        #type=slack action="role_change_to_admin"
        | groupBy([target_username], function=collect([action, @timestamp]))
        | rename("_collect", as="admin_events")
      }, field=[target_username], include=[admin_events])
    | test(guest_events[0] < admin_events[0])
    | test((admin_events[0] - guest_events[0]) <= 3600000)
    | table([target_username, guest_events, admin_events])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Slack" and operation in ("guest_reactivated", "guest_channel_join", "guest_created")
    | alter guest_username = target_username
    | join type=inner (
        dataset = cloud_audit_logs
        | filter vendor = "Slack" and operation = "role_change_to_admin"
        | alter admin_username = target_username, admin_time = _time
      ) as admin_events
      admin_events.admin_username = guest_username and admin_events.admin_time >= _time and admin_events.admin_time <= add(_time, hours(1))
    | fields _time, guest_username, operation, admin_events.admin_time, admin_events.operation
  lucene: |
    (action:("guest_reactivated" OR "guest_channel_join" OR "guest_created")) AND action:"role_change_to_admin"
  sumo: |
    _sourceCategory=*Slack*
    | json field=_raw "action" as action
    | json field=_raw "target_username" as target_username
    | json field=_raw "timestamp" as event_timestamp
    | where action in ("guest_reactivated", "guest_channel_join", "guest_created", "role_change_to_admin")
    | sort by target_username, event_timestamp
    | where action in ("guest_reactivated", "guest_channel_join", "guest_created")
    | first(event_timestamp) as first_event_time by target_username
    | join (
        _sourceCategory=*Slack*
        | json field=_raw "action" as action
        | json field=_raw "target_username" as target_username
        | json field=_raw "timestamp" as event_timestamp
        | where action = "role_change_to_admin"
        | first(event_timestamp) as admin_event_time by target_username
      ) on target_username
    | where (admin_event_time - first_event_time) <= 3600000
    | fields target_username, first_event_time, admin_event_time
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- initial-access
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is IN  ("guest_reactivated", "guest_channel_join", "guest_created")


  Followed By


  1 Slack Event

  Where the Action is "role_change_to_admin"

  With the same Target Username

  Within 1 hour'
triage_steps:
- 'Confirm the alert metadata: timestamp, target host/identity, source (IP, sender, URL), and the matched IOC.'
- Examine the parent → child process tree, command line arguments, and code-signing status to assess whether the entry vector is consistent with
  this technique.
- Cross-reference with email gateway, web proxy, and EDR telemetry in the 30 minutes around the alert for related delivery activity.
- 'Pivot on the user / host: look for follow-on execution, persistence, or credential-access events in the next 24h.'
- 'Decide TP / FP / dual-use: confirm the user did not request the activity (sanctioned vendor onboarding, marketing campaign, pen test).'
- 'If TP: isolate the host, reset the user''s credentials and tokens, capture forensic artifacts, and open an incident ticket referencing this
  rule_id.'

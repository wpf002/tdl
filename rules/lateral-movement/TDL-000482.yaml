rule_id: TDL-LM-000482
v4_id: 000482
name: First Seen Allowed Inbound SMB Traffic
description: A rule that detects allowed inbound SMB traffic from an IP that hasn’t been seen in the last 90 days
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1021
technique_name: Remote Services
platform:
- Network
data_sources:
- Firewall
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: 'index=firewall action=allowed direction=inbound src_ip!="10.0.0.0/8" src_ip!="172.16.0.0/12" src_ip!="192.168.0.0/16" dest_ip="10.0.0.0/8"
    OR dest_ip="172.16.0.0/12" OR dest_ip="192.168.0.0/16" (dest_port IN ("139", "445") OR app="*smb*" OR app="*samba*")

    | eval src_ip_dest_combo=src_ip.":".dest_ip

    | eventstats earliest(_time) as first_seen by src_ip

    | where (now() - first_seen) < (30*86400)

    | stats earliest(_time) as detection_time, latest(_time) as last_seen, dc(dest_ip) as unique_destinations, values(dest_port) as ports, values(app)
    as applications by src_ip

    | where (now() - detection_time) < (30*86400)

    | table src_ip, detection_time, last_seen, unique_destinations, ports, applications

    '
  kql: "let baseline_period = 30d;\nlet detection_period = 1d;\nlet baseline_ips = \n    CommonSecurityLog\n    | where TimeGenerated between\
    \ (ago(baseline_period + detection_period) .. ago(detection_period))\n    | where DeviceAction =~ \"Allow\"\n    | where (DestinationPort\
    \ in (\"139\", \"445\") or ApplicationProtocol contains \"smb\" or ApplicationProtocol contains \"samba\")\n    | where DeviceDirection =~\
    \ \"Inbound\"\n    | distinct SourceIP;\nCommonSecurityLog\n| where TimeGenerated > ago(detection_period)\n| where DeviceAction =~ \"Allow\"\
    \n| where (DestinationPort in (\"139\", \"445\") or ApplicationProtocol contains \"smb\" or ApplicationProtocol contains \"samba\")\n| where\
    \ DeviceDirection =~ \"Inbound\"\n| where SourceIP !in (baseline_ips)\n| project TimeGenerated, SourceIP, DestinationIP, DestinationPort,\
    \ ApplicationProtocol, DeviceAction, DeviceDirection, DeviceVendor, DeviceProduct\n"
  aql: |
    SELECT sourceip, destinationip, destinationport, application, COUNT(*) AS event_count, FIRST(eventtime) AS first_seen, LAST(eventtime) AS last_seen
    FROM events
    WHERE (categoryname(category) ILIKE '%firewall%' OR categoryname(category) ILIKE '%network%')
      AND INOFFENSE(sourceip) = 'false'
      AND INOFFENSE(destinationip) = 'true'
      AND (qidname(qid) ILIKE '%accept%' OR qidname(qid) ILIKE '%allow%' OR qidname(qid) ILIKE '%permit%')
      AND (destinationport IN ('139','445') OR application ILIKE '%smb%' OR application ILIKE '%samba%')
    GROUP BY sourceip, destinationip, destinationport, application
    LAST 90 DAYS
  yara_l: "rule lateral_movement_smb_new_external_source {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects new external\
    \ source IPs connecting inbound to SMB ports (139/445) or SMB applications - MITRE T1021\"\n    mitre_attack_tactic = \"Lateral Movement\"\
    \n    mitre_attack_technique = \"T1021\"\n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.event_type = \"NETWORK_CONNECTION\"\n\
    \    $e.security_result.action = \"ALLOW\"\n    $e.network.direction = \"INBOUND\"\n    (\n      $e.target.port = \"139\" or\n      $e.target.port\
    \ = \"445\" or\n      re.regex($e.network.application_protocol, `(?i)smb`) or\n      re.regex($e.network.application_protocol, `(?i)samba`)\n\
    \    )\n    $e.principal.ip = $source_ip\n    $e.target.ip = $target_ip\n    \n  match:\n    $source_ip over 90d\n    \n  outcome:\n    $risk_score\
    \ = 65\n    $first_seen_time = min($e.metadata.event_timestamp.seconds)\n    $last_seen_time = max($e.metadata.event_timestamp.seconds)\n\
    \    $target_ips = array_distinct($e.target.ip)\n    $target_ports = array_distinct($e.target.port)\n    \n  condition:\n    $e and #e >=\
    \ 1\n}\n"
  esql: "FROM logs-network.firewall*\n| WHERE @timestamp > NOW() - 90 days\n  AND network.direction == \"inbound\"\n  AND event.action == \"allowed\"\
    \n  AND (\n    destination.port IN (\"139\", \"445\")\n    OR TO_LOWER(network.application) LIKE \"*smb*\"\n    OR TO_LOWER(network.application)\
    \ LIKE \"*samba*\"\n  )\n| EVAL baseline_period = @timestamp < NOW() - 30 days\n| STATS \n    first_seen = MIN(@timestamp),\n    baseline_count\
    \ = SUM(CASE(baseline_period == true, 1, 0)),\n    recent_count = SUM(CASE(baseline_period == false, 1, 0))\n  BY source.ip, destination.ip\n\
    | WHERE baseline_count == 0 AND recent_count > 0\n| KEEP source.ip, destination.ip, first_seen\n"
  leql: |
    where(direction=INBOUND AND action=ALLOW AND (destination_port IN [139, 445] OR application ICONTAINS "smb" OR application ICONTAINS "samba")) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=firewall (Direction=inbound OR Direction=Inbound) (Action=allow OR Action=allowed OR Action=Allow OR Action=Allowed)
    (DestinationPort=139 OR DestinationPort=445 OR Application=*smb* OR Application=*samba*)
    | groupBy([SourceIP, DestinationIP], function=count(as=events))
    | table([SourceIP, DestinationIP, events])
  xql: |
    dataset = panw_ngfw_traffic_raw
    | filter action_source = "from-zone" and dest_location = "private" and source_location = "public" and action = "allow"
    | filter dest_port in ("139", "445") or lowercase(app) contains "smb" or lowercase(app) contains "samba"
    | alter source_ip_key = source_ip
    | comp count() as event_count by source_ip_key
    | filter event_count > 0
  lucene: |
    (firewall.direction:inbound OR network.direction:inbound OR direction:inbound) AND (firewall.action:allowed OR action:allowed OR firewall.action:allow OR action:allow) AND (_exists_:source.ip OR _exists_:src_ip OR _exists_:sourceip) AND (_exists_:destination.ip OR _exists_:dest_ip OR _exists_:destinationip) AND (destination.port:("139" OR "445") OR dest_port:("139" OR "445") OR application:*smb* OR application:*samba*)
  sumo: "_sourceCategory=*Firewall* \n| json field=_raw \"action\" as action\n| json field=_raw \"src_ip\" as src_ip\n| json field=_raw \"dest_ip\"\
    \ as dest_ip\n| json field=_raw \"dest_port\" as dest_port\n| json field=_raw \"application\" as application\n| json field=_raw \"direction\"\
    \ as direction\n| where direction = \"Inbound\" \n  and (action matches \"*allow*\" or action matches \"*permit*\")\n  and (dest_port in (\"\
    139\", \"445\") or application matches \"*smb*\" or application matches \"*samba*\")\n| where !isPrivateIP(src_ip) and isPrivateIP(dest_ip)\n\
    | count by src_ip, dest_ip\n| fields src_ip, dest_ip\n"
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- lateral-movement
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Firewall Event \nFrom one external source to one internal destination (Inbound)\nWhere the Action is Allowed\nOR\n    Where the\
  \ Destination Port IN (\"139\", \"445\")\n\n    Where the Application contains \"smb\"\n\n    Where the Application contains \"samba\"\n\nBaseline\
  \ Learning: 30 Days\nRetention: 90 Days\n\nNew Value: Source IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, target host, and the protocol / credential used.'
- Inspect the destination domain/IP, ASN, port, and TLS / HTTP fingerprints — confirm the cross-host action (SMB write, WinRM exec, RDP session,
  kubectl exec) and the auth context.
- Pull a graph of the source identity's recent host touches — adversaries hop quickly across multiple endpoints.
- 'Validate against change tickets and admin patterns: is this admin-bastion traffic or worker-to-worker movement that has no business justification?'
- 'Decide TP / FP: FP for sanctioned admin / vulnerability-scan / RMM activity; TP for movement that crosses security zones or uses an unusual
  identity.'
- 'If TP: isolate both source and target, rotate the moving identity''s credentials, and walk forward from the target host to find subsequent
  stages.'

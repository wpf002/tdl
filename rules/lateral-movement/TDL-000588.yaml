rule_id: TDL-LM-000588
v4_id: 000588
name: Object on Admin File Share Accessed with Write Permissions
description: Detects when an unauthorized non-system account accesses a file on the admin share via SMB with write access (0x2).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1021
technique_name: Remote Services
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5145'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=windows sourcetype=WinEventLog:Security EventCode=5145 (ShareName="*\\c$" OR ShareName="*\\admin$") AccessMask="0x2" NOT SubjectUserName="*$"

    | table _time, ComputerName, SubjectUserName, ShareName, RelativeTargetName, IpAddress, AccessMask

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 5145
    | where (ShareName has "\\c$" or ShareName has "\\admin$")
    | extend AccessMask = tostring(EventData.AccessMask)
    | where AccessMask == "0x2"
    | where Account !endswith "$"
    | project TimeGenerated, Computer, Account, IpAddress, ShareName, AccessMask, RelativeTargetName
  aql: |
    SELECT username, sourceip, destinationip, "Relative Target Name", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '5145'
      AND ("Relative Target Name" ILIKE '%\\c$%' OR "Relative Target Name" ILIKE '%\\admin$%')
      AND "Access Mask" = '0x2'
      AND username NOT LIKE '%$'
    GROUP BY username, sourceip, destinationip, "Relative Target Name"
    LAST 1 HOURS
  yara_l: |
    rule lateral_movement_admin_share_write {
      meta:
        author = "Detection Engineer"
        description = "Detects lateral movement via administrative share write access (T1021)"
        mitre_attack_technique = "T1021"
        mitre_attack_tactic = "Lateral Movement"
        severity = "High"

      events:
        $e.metadata.product_event_type = "5145"
        (
          re.regex($e.target.file.full_path, `(?i)\\c\$$`) or
          re.regex($e.target.file.full_path, `(?i)\\admin\$$`)
        )
        $e.security_result.detection_fields["AccessMask"] = "0x2"
        not re.regex($e.principal.user.userid, `\$$`)
        $e.principal.user.userid = $user
        $e.principal.hostname = $src_host

      match:
        $user, $src_host over 5m

      condition:
        $e
    }
  esql: "FROM logs-system.security*, logs-windows.forwarded*, winlogbeat-*\n| WHERE @timestamp > NOW() - 24 hour \n  AND event.code == \"5145\"\
    \n  AND (winlog.event_data.ShareName LIKE \"*c$\" OR winlog.event_data.ShareName LIKE \"*admin$\")\n  AND winlog.event_data.AccessMask ==\
    \ \"0x2\"\n  AND NOT winlog.event_data.SubjectUserName LIKE \"*$\"\n| STATS access_count = COUNT(*) BY host.name, winlog.event_data.SubjectUserName,\
    \ winlog.event_data.ShareName, winlog.event_data.IpAddress, winlog.event_data.RelativeTargetName\n| KEEP @timestamp, host.name, winlog.event_data.SubjectUserName,\
    \ winlog.event_data.ShareName, winlog.event_data.IpAddress, winlog.event_data.RelativeTargetName, access_count\n"
  leql: |
    where(source_json.EventID=5145 AND (source_json.RelativeTargetName ICONTAINS "c$" OR source_json.RelativeTargetName ICONTAINS "admin$") AND source_json.AccessMask="0x2" AND NOT source_user ENDS-WITH "$")
  crowdstrike: |
    EventCode=5145 (ShareName=*c$ OR ShareName=*admin$) AccessMask=0x2 NOT Account=*$
    | table([@timestamp, ComputerName, Account, ShareName, AccessMask, IpAddress, ObjectType])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 5145
    | filter (action_evtlog_event_data_ShareName ~= ".*c\$" or action_evtlog_event_data_ShareName ~= ".*admin\$")
    | filter action_evtlog_event_data_AccessMask = "0x2"
    | filter not action_evtlog_event_data_SubjectUserName ~= ".*\$$"
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_ShareName, action_evtlog_event_data_AccessMask, action_evtlog_event_data_IpAddress
  lucene: |
    event.code:5145 AND (winlog.event_data.ShareName:*c$ OR winlog.event_data.ShareName:*admin$) AND winlog.event_data.AccessMask:0x2 AND NOT winlog.event_data.SubjectUserName:*$
  sumo: |
    _sourceCategory=*Windows* "5145"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ShareName" as share_name
    | json field=_raw "AccessMask" as access_mask
    | json field=_raw "SubjectUserName" as src_user
    | where event_id = "5145"
    | where share_name matches "*c$" or share_name matches "*admin$"
    | where access_mask = "0x2"
    | where !(src_user matches "*$")
    | fields _messageTime, _sourceHost, src_user, share_name, access_mask
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- lateral-movement
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows User Created Event

  Where the Event ID is in [5145]

  Where the file path matches "*c$" or file path matches "*admin$"

  Where the eventdata.accessmask is "0x2"

  Where the src_user does not end with "$"'
suppression:
  window: 12 hours
  fields:
  - src_user
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, target host, and the protocol / credential used.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — confirm the cross-host action (SMB write, WinRM exec,
  RDP session, kubectl exec) and the auth context.
- Pull a graph of the source identity's recent host touches — adversaries hop quickly across multiple endpoints.
- 'Validate against change tickets and admin patterns: is this admin-bastion traffic or worker-to-worker movement that has no business justification?'
- 'Decide TP / FP: FP for sanctioned admin / vulnerability-scan / RMM activity; TP for movement that crosses security zones or uses an unusual
  identity.'
- 'If TP: isolate both source and target, rotate the moving identity''s credentials, and walk forward from the target host to find subsequent
  stages.'

rule_id: TDL-LM-000776
v4_id: '000776'
name: Single Internal Sender Mailing ≥20 Internal Recipients With Link
description: Internal account sends ≥20 messages with a clickable URL to internal recipients within 30m, especially after a recent password reset
  or new-device sign-in. Account-takeover-driven internal phish. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1534
  under Lateral Movement).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1534
technique_name: Internal Spearphishing
platform:
- Microsoft 365
- Google Workspace
data_sources:
- Email Gateway
- SaaS Audit Logs
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=email OR index=saas_audit (sourcetype=email_gateway OR sourcetype=o365_audit OR sourcetype=gsuite_audit)
    | eval is_email_sent=if(match(sourcetype, "email_gateway") AND action="sent", 1, 0)
    | eval is_pwd_reset=if((sourcetype="o365_audit" AND Operation="UserPasswordChanged") OR (sourcetype="gsuite_audit" AND event_name="password_change"), 1, 0)
    | eval is_new_device=if((sourcetype="o365_audit" AND Operation="UserLoggedIn" AND IsNewDevice="true") OR (sourcetype="gsuite_audit" AND event_name="login" AND new_device="true"), 1, 0)
    | eval suspicious_event_time=if(is_pwd_reset=1 OR is_new_device=1, _time, null())
    | eventstats earliest(suspicious_event_time) as first_suspicious_event by user
    | eval time_since_suspicious=_time - first_suspicious_event
    | where is_email_sent=1 AND (isnull(first_suspicious_event) OR time_since_suspicious <= 86400)
    | rex field=body "(?i)https?://[^\s]+"
    | where isnotnull(body) AND match(body, "(?i)https?://")
    | eval internal_recipient=if(match(recipient_domain, "(?i)(company\.com|internal\.domain)"), 1, 0)
    | where internal_recipient=1
    | bin _time span=30m
    | stats count as msg_count, values(recipient) as recipients, earliest(_time) as window_start, latest(_time) as window_end, values(suspicious_event_time) as recent_compromise_indicators by _time, user, sender
    | where msg_count >= 20
    | table _time, user, sender, msg_count, recipients, window_start, window_end, recent_compromise_indicators
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_lm_000776 {\n  meta:\n    author = \"TDL\"\n    description = \"Single Internal Sender Mailing ≥20 Internal Recipients\
    \ With Link\"\n    severity = \"HIGH\"\n    tactic = \"TA0008\"\n    technique = \"T1534\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '
pseudo_logic: Internal account sends ≥20 messages with a clickable URL to internal recipients within 30m, especially after a recent password reset
  or new-device sign-in. Account-takeover-driven internal phish.

rule_id: TDL-LM-000777
v4_id: '000777'
name: Executable Written via SMB to Admin$ Share
description: FileCreate of .exe/.dll/.bin under \\<host>\ADMIN$ or \\<host>\C$\Windows\* by a remote logon session. Classic lateral payload drop.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1570 under Lateral Movement).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1570
technique_name: Lateral Tool Transfer
platform:
- Windows
- Linux
data_sources:
- Sysmon
- Network IDS
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=11 \n(TargetFilename=\"\\\\\\\\*\\\\ADMIN$\\\
    \\*.exe\" OR TargetFilename=\"\\\\\\\\*\\\\ADMIN$\\\\*.dll\" OR TargetFilename=\"\\\\\\\\*\\\\ADMIN$\\\\*.bin\" OR TargetFilename=\"\\\\\\\
    \\*\\\\C$\\\\Windows\\\\*.exe\" OR TargetFilename=\"\\\\\\\\*\\\\C$\\\\Windows\\\\*.dll\" OR TargetFilename=\"\\\\\\\\*\\\\C$\\\\Windows\\\
    \\*.bin\")\n| rex field=TargetFilename \"\\\\\\\\\\\\\\\\(?<remote_host>[^\\\\\\\\]+)\\\\\\\\\"\n| table _time, ComputerName, User, Image,\
    \ TargetFilename, remote_host\n"
  kql: |
    Event
    | where TimeGenerated > ago(1h)
    | where Source == "Microsoft-Windows-Sysmon" and EventID == 11
    | extend EventData = parse_xml(EventData)
    | extend TargetFilename = tostring(EventData.DataItem.EventData.Data.[5].["#text"])
    | extend Image = tostring(EventData.DataItem.EventData.Data.[4].["#text"])
    | extend User = tostring(EventData.DataItem.EventData.Data.[2].["#text"])
    | where TargetFilename matches regex @"^\\\\[^\\]+\\(ADMIN\$|C\$\\Windows)\\.*\.(exe|dll|bin)$"
    | join kind=inner (
        SecurityEvent
        | where TimeGenerated > ago(1h)
        | where EventID == 4624
        | where LogonType in (3, 10)
        | project LogonTime = TimeGenerated, TargetLogonId, TargetUserName, IpAddress, Computer
    ) on $left.Computer == $right.Computer
    | where TimeGenerated >= LogonTime and TimeGenerated <= LogonTime + 5m
    | project TimeGenerated, Computer, User, TargetFilename, Image, TargetUserName, IpAddress, TargetLogonId
  aql: |
    SELECT eventtime, username, sourceip, destinationip, "TargetFilename" AS dropped_file, "Process Name" AS dropper_process, LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE ("EventID" = '11' OR "EventID" = '23')
      AND ("TargetFilename" ILIKE '%\\\\%\\ADMIN$\\%' OR "TargetFilename" ILIKE '%\\\\%\\C$\\Windows\\%')
      AND ("TargetFilename" ILIKE '%.exe' OR "TargetFilename" ILIKE '%.dll' OR "TargetFilename" ILIKE '%.bin')
      AND "Logon Type" IN ('3', '10')
    LAST 1 HOURS
  yara_l: |
    rule lateral_payload_drop {
      meta:
        author = "TDL"
        description = "Detects file creation of executables in administrative shares indicating lateral movement"
        mitre_attack_tactic = "Lateral Movement"
        mitre_attack_technique = "T1570"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "FILE_CREATION"
        (
          re.regex($e.target.file.full_path, `(?i)\\\\[^\\]+\\ADMIN\$\\.*\.(exe|dll|bin)$`) or
          re.regex($e.target.file.full_path, `(?i)\\\\[^\\]+\\C\$\\Windows\\.*\.(exe|dll|bin)$`)
        )
        $e.principal.hostname = $source_host
        $e.target.hostname = $target_host
        $source_host != $target_host

      match:
        $source_host, $target_host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*
    | WHERE winlog.event_id == "11"
      AND (
        file.path RLIKE "\\\\\\\\[^\\\\]+\\\\ADMIN\\$\\\\.*\\.(exe|dll|bin)"
        OR file.path RLIKE "\\\\\\\\[^\\\\]+\\\\C\\$\\\\Windows\\\\.*\\.(exe|dll|bin)"
      )
      AND winlog.event_data.User NOT LIKE "*$"
    | KEEP @timestamp, host.name, user.name, file.path, process.name, process.executable, winlog.event_data.TargetFilename
  leql: |
    where(source_json.EventID=11 AND (source_json.TargetFilename CONTAINS "\\ADMIN$\\" OR source_json.TargetFilename CONTAINS "\\C$\\Windows\\") AND (source_json.TargetFilename ENDS-WITH ".exe" OR source_json.TargetFilename ENDS-WITH ".dll" OR source_json.TargetFilename ENDS-WITH ".bin")) groupby(asset, source_json.TargetFilename, source_json.Image) calculate(count)
  crowdstrike: |
    (event_simpleName=FileCreateEvent OR EventCode=11) (TargetFilename=*\\\\*\\ADMIN$\\* OR TargetFilename=*\\\\*\\C$\\Windows\\*) (TargetFilename=*.exe OR TargetFilename=*.dll OR TargetFilename=*.bin)
    | regex("\\\\\\\\(?<RemoteHost>[^\\\\]+)\\\\", field=TargetFilename)
    | groupBy([ComputerName, UserName, RemoteHost, TargetFilename], function=count(as=drops))
    | table([@timestamp, ComputerName, UserName, RemoteHost, TargetFilename, drops])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE and action_file_path ~= "\\\\[^\\]+\\(ADMIN\\$|C\\$\\\\Windows).*\\.(exe|dll|bin)$" and action_remote_ip != null and action_remote_ip != ""
    | fields _time, agent_hostname, actor_effective_username, action_file_path, action_file_name, action_remote_ip, actor_process_image_name, action_process_image_command_line
  lucene: |
    event.code:11 AND file.path:(*\\ADMIN$\\*.exe OR *\\ADMIN$\\*.dll OR *\\ADMIN$\\*.bin OR *\\C$\\Windows\\*.exe OR *\\C$\\Windows\\*.dll OR *\\C$\\Windows\\*.bin) AND (winlog.event_data.User:*$ OR user.name:*$)
  sumo: |
    _sourceCategory=*Sysmon* "11"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetFilename" as target_file
    | json field=_raw "Image" as process_name
    | json field=_raw "User" as user
    | where event_id = "11"
    | where (target_file matches "*\\\\*\\ADMIN$\\*" OR target_file matches "*\\\\*\\C$\\Windows\\*")
    | where (target_file matches "*.exe" OR target_file matches "*.dll" OR target_file matches "*.bin")
    | fields _messageTime, _sourceHost, user, process_name, target_file
pseudo_logic: FileCreate of .exe/.dll/.bin under \\<host>\ADMIN$ or \\<host>\C$\Windows\* by a remote logon session. Classic lateral payload drop.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-LM-000778
v4_id: 000778
name: tscon Used to Hijack Disconnected RDP Session
description: tscon.exe invoked targeting another user's session ID without /password. Free-RDP-session takeover when invoker is SYSTEM. Generated
  from gap analysis against canonical ATT&CK Enterprise matrix (T1563 under Lateral Movement).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1563
technique_name: Remote Service Session Hijacking
platform:
- Windows
- Linux
data_sources:
- Windows Event Log
- Auditd
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=1 Image=\"*\\\\tscon.exe\" (CommandLine!=\"\
    */password*\" AND CommandLine!=\"*/dest:console*\") \n| rex field=CommandLine \"tscon\\s+(?<target_session_id>\\d+)\" \n| where isnotnull(target_session_id)\
    \ \n| eval is_system=if(User=\"NT AUTHORITY\\\\SYSTEM\" OR User=\"SYSTEM\",1,0) \n| table _time, ComputerName, User, ParentImage, CommandLine,\
    \ target_session_id, is_system\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4688
    | where Process has "tscon.exe" or NewProcessName has "tscon.exe"
    | where CommandLine has "tscon" or CommandLine has "tscon.exe"
    | where CommandLine !has "/password" and CommandLine !has "-password"
    | where CommandLine matches regex @"\d+"
    | extend IsSystemAccount = iff(SubjectUserName =~ "SYSTEM" or Account =~ "SYSTEM", true, false)
    | project TimeGenerated, Computer, Account, SubjectUserName, SubjectDomainName, NewProcessName, Process, CommandLine, ProcessId, IsSystemAccount, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "Parent Process Name"
    FROM events
    WHERE ("Process Name" ILIKE '%tscon.exe%' OR "Process CommandLine" ILIKE '%tscon.exe%')
      AND "Process CommandLine" NOT ILIKE '%/password%'
      AND "Process CommandLine" NOT ILIKE '%-password%'
    LAST 24 HOURS
  yara_l: |
    rule session_hijacking_tscon {
      meta:
        author = "TDL"
        description = "Detects tscon.exe session takeover without /password parameter"
        mitre_attack_tactic = "Lateral Movement"
        mitre_attack_technique = "T1563"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        re.regex($e.target.process.file.full_path, `(?i)\\tscon\.exe$`)
        $e.target.process.command_line = $cmdline
        not re.regex($e.target.process.command_line, `(?i)/password`)
        re.regex($e.target.process.command_line, `\d+`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = max(
          if(re.regex($e.principal.user.userid, `(?i)SYSTEM$`), 95, 75)
        )

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour
      AND process.name == "tscon.exe"
      AND process.command_line IS NOT NULL
      AND NOT process.command_line LIKE "*password*"
      AND NOT process.command_line LIKE "*/password*"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(process_name ICONTAINS "tscon.exe" AND NOT process_cmd_line ICONTAINS "/password")
  crowdstrike: |
    (event_simpleName=ProcessRollup2 FileName=tscon.exe CommandLine!=*/password*) OR (event_simpleName=ProcessRollup2 FileName=xfreerdp CommandLine=*/cert:ignore* UserName=root)
    | regex("tscon\.exe.*?(?<sessionid>\d+)", field=CommandLine, strict=false)
    | regex("xfreerdp.*?\/v:(?<target>[^\s]+)", field=CommandLine, strict=false)
    | case {
        FileName=tscon.exe AND UserName=*SYSTEM* | targeted_session="yes" ;
        FileName=xfreerdp AND UserName=root | targeted_session="yes" ;
        * | targeted_session="no" ;
      }
    | targeted_session="yes"
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName, sessionid, target])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter lowercase(action_process_image_name) contains "tscon.exe"
    | filter action_process_image_command_line ~= "\\d+" and not action_process_image_command_line contains "/password"
    | filter actor_effective_username = "SYSTEM" or lowercase(actor_effective_username) = "system"
    | fields _time, agent_hostname, actor_effective_username, action_process_image_command_line, action_process_image_name, actor_process_image_name
  lucene: |
    (process.name:tscon.exe OR process.executable:*\\tscon.exe) AND NOT process.command_line:*/password* AND NOT process.command_line:*/dest*
  sumo: |
    _sourceCategory=*Windows* (tscon OR "FreeRDP")
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as cmd
    | json field=_raw "NewProcessName" as process_name
    | json field=_raw "ParentProcessName" as parent_process
    | json field=_raw "User" as user
    | json field=_raw "Computer" as host
    | where (process_name matches "*tscon.exe" and cmd matches "*tscon*" and !(cmd matches "*/password*" or cmd matches "*-p *")) or (cmd matches "*xfreerdp*" and cmd matches "*/attach*")
    | where user matches "*SYSTEM*" or user matches "*root*"
    | fields _messageTime, host, user, process_name, parent_process, cmd
pseudo_logic: tscon.exe invoked targeting another user's session ID without /password. Free-RDP-session takeover when invoker is SYSTEM.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- rdp-hijack
- ssh-hijack
- t1563
- lateral-movement
references:
- https://attack.mitre.org/techniques/T1563/

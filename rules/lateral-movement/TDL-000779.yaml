rule_id: TDL-LM-000779
v4_id: 000779
name: Lateral Spread via Removable Media Write+Execute
description: Same host writes an executable to a removable volume then a different host executes it within 24h. Suggests USB-borne worm spread.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1091 under Lateral Movement).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1091
technique_name: Replication Through Removable Media
platform:
- Windows
- Linux
- macOS
data_sources:
- Windows Event Log
- Sysmon
- EDR
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (EventCode=11 OR EventCode=1) \n| eval action=case(\n    EventCode=11, \"write\",\n    EventCode=1, \"execute\",\n    1=1, \"\
    unknown\"\n)\n| rex field=TargetFilename \"^(?<drive_letter>[A-Z]):\\\\.*\\.exe$\"\n| rex field=Image \"^(?<exec_drive_letter>[A-Z]):\\\\\
    .*\\.exe$\"\n| eval file_path=coalesce(TargetFilename, Image)\n| rex field=file_path \"^(?<volume>[A-Z]):\\\\(?<file_name>.*)$\"\n| where\
    \ isnotnull(volume) AND match(file_name, \"\\.exe$\")\n| eval host_normalized=lower(coalesce(ComputerName, host))\n| eval file_hash=coalesce(MD5,\
    \ SHA256, file_name)\n| eval event_marker=host_normalized.\"::\".action.\"::\".file_hash\n| streamstats latest(_time) as write_time, latest(host_normalized)\
    \ as write_host by file_hash, volume\n| where action=\"execute\" AND isnotnull(write_time) AND write_host!=host_normalized AND (_time - write_time\
    \ <= 86400) AND (_time >= write_time)\n| table _time, host_normalized, write_host, write_time, action, volume, file_name, file_hash, Image,\
    \ TargetFilename\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_lm_000779 {\n  meta:\n    author = \"TDL\"\n    description = \"Lateral Spread via Removable Media Write+Execute\"\n \
    \   severity = \"HIGH\"\n    tactic = \"TA0008\"\n    technique = \"T1091\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Same host writes an executable to a removable volume then a different host executes it within 24h. Suggests USB-borne worm spread.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

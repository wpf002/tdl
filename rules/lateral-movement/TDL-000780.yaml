rule_id: TDL-LM-000780
v4_id: 000780
name: Mass Software Push from RMM Console
description: Single RMM/SCCM identity initiates software install or script execution against ≥10 distinct endpoints in 30m. Anomalous fan-out
  from deployment tooling. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1072 under Lateral Movement).
tactic: Lateral Movement
tactic_id: TA0008
technique_id: T1072
technique_name: Software Deployment Tools
platform:
- Windows
- Linux
- macOS
data_sources:
- EDR
- MDM Logs
- RMM Logs
severity: High
fidelity: Medium
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=* (sourcetype=edr OR sourcetype=mdm OR sourcetype=rmm OR sourcetype=sccm) (action IN("install","execute","deploy","script_execution") OR EventType IN("SoftwareInstall","ScriptExecution","RemoteExecution"))
    | bin _time span=30m
    | stats dc(dest) as endpoint_count values(dest) as endpoints values(action) as actions values(EventType) as event_types by _time, user, src
    | where endpoint_count >= 10
    | table _time, user, src, endpoint_count, endpoints, actions, event_types
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_lm_000780 {\n  meta:\n    author = \"TDL\"\n    description = \"Mass Software Push from RMM Console\"\n    severity =\
    \ \"HIGH\"\n    tactic = \"TA0008\"\n    technique = \"T1072\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Single RMM/SCCM identity initiates software install or script execution against ≥10 distinct endpoints in 30m. Anomalous fan-out
  from deployment tooling.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- sccm
- intune
- rmm
- deployment
- t1072
- lateral-movement
references:
- https://attack.mitre.org/techniques/T1072/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-07-18'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, source host, target host, and the protocol / credential used.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — confirm the cross-host action (SMB write,
  WinRM exec, RDP session, kubectl exec) and the auth context.
- Pull a graph of the source identity's recent host touches — adversaries hop quickly across multiple endpoints.
- 'Validate against change tickets and admin patterns: is this admin-bastion traffic or worker-to-worker movement that has no business justification?'
- 'Decide TP / FP: FP for sanctioned admin / vulnerability-scan / RMM activity; TP for movement that crosses security zones or uses an unusual
  identity.'
- 'If TP: isolate both source and target, rotate the moving identity''s credentials, and walk forward from the target host to find subsequent
  stages.'

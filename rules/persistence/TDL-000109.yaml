rule_id: TDL-PER-000109
v4_id: 000109
name: Domain Account Deleted Within 24 Hours of Creation
description: Detects when a domain account is created and deleted within a 24 hour period.
tactic: Persistence
tactic_id: TA0003
technique_id: T1136
technique_name: Create Account
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4720, 4726'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security (EventCode=624 OR EventCode=4720 OR EventCode=630 OR EventCode=4726)\n| eval event_type=case(\n\
    \    EventCode=624 OR EventCode=4720, \"created\",\n    EventCode=630 OR EventCode=4726, \"deleted\",\n    1=1, \"other\"\n)\n| transaction\
    \ TargetUserName maxspan=24h startswith=(event_type=\"created\") endswith=(event_type=\"deleted\")\n| where mvcount(split(event_type, \",\"\
    )) >= 2\n| table _time, ComputerName, TargetUserName, TargetDomainName, EventCode, duration\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(25h)
    | where EventID in (624, 4720, 630, 4726)
    | extend DestinationUserDomain = tostring(split(TargetAccount, "\\")[0])
    | extend DestinationUsername = tostring(split(TargetAccount, "\\")[1])
    | where isnotempty(DestinationUsername)
    | order by TimeGenerated asc
    | extend EventType = case(
        EventID in (624, 4720), "UserCreated",
        EventID in (630, 4726), "UserDeleted",
        ""
    )
    | summarize Events = make_list(pack("TimeGenerated", TimeGenerated, "EventType", EventType, "EventID", EventID, "Computer", Computer, "DestinationUserDomain", DestinationUserDomain)) by DestinationUsername
    | mv-expand Event = Events
    | extend TimeGenerated = todatetime(Event.TimeGenerated), EventType = tostring(Event.EventType), EventID = toint(Event.EventID), Computer = tostring(Event.Computer), DestinationUserDomain = tostring(Event.DestinationUserDomain)
    | order by DestinationUsername asc, TimeGenerated asc
    | extend NextEventType = next(EventType, 1), NextEventTime = next(TimeGenerated, 1), NextUsername = next(DestinationUsername, 1), CreateTime = TimeGenerated, CreateEventID = EventID, CreateComputer = Computer, CreateDomain = DestinationUserDomain
    | where EventType == "UserCreated" and NextEventType == "UserDeleted" and DestinationUsername == NextUsername
    | where datetime_diff('hour', NextEventTime, CreateTime) <= 24
    | project CreateTime, DeleteTime = NextEventTime, DestinationUsername, DestinationUserDomain = CreateDomain, CreateEventID, DeleteEventID = next(EventID, 1), CreateComputer, DeleteComputer = next(Computer, 1)
  aql: |
    SELECT T1.eventtime AS creation_time, T2.eventtime AS deletion_time, T1."Target Username" AS username, T1."Target Domain" AS domain, LOGSOURCENAME(T1.logsourceid) AS host
    FROM events T1, events T2
    WHERE T1."EventID" IN ('624', '4720')
      AND T2."EventID" IN ('630', '4726')
      AND T1."Target Username" = T2."Target Username"
      AND T2.eventtime BETWEEN T1.eventtime AND (T1.eventtime + 86400000)
      AND T1.eventtime < T2.eventtime
    LAST 24 HOURS
  yara_l: |
    rule windows_user_created_then_deleted_24h {
      meta:
        author = "Detection Engineer"
        description = "Detects Windows user account created then deleted within 24 hours - T1136 Persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1136"
        severity = "Medium"

      events:
        $create.metadata.event_type = "USER_CREATION"
        (
          $create.metadata.product_event_type = "624" or
          $create.metadata.product_event_type = "4720"
        )
        $create.target.user.userid = $username
        $create.target.administrative_domain = $domain

        $delete.metadata.event_type = "USER_DELETION"
        (
          $delete.metadata.product_event_type = "630" or
          $delete.metadata.product_event_type = "4726"
        )
        $delete.target.user.userid = $username

      match:
        $username over 24h

      condition:
        $create and $delete
    }
  esql: "FROM logs-system.security*, winlogbeat-*\n| WHERE @timestamp > NOW() - 25 hours\n| WHERE event.code IN (\"624\", \"4720\", \"630\", \"\
    4726\")\n| EVAL event_type = CASE(\n    event.code IN (\"624\", \"4720\"), \"created\",\n    event.code IN (\"630\", \"4726\"), \"deleted\"\
    ,\n    \"unknown\"\n  )\n| STATS \n    first_time = MIN(@timestamp),\n    last_time = MAX(@timestamp),\n    created_count = COUNT(*) WHERE\
    \ event_type == \"created\",\n    deleted_count = COUNT(*) WHERE event_type == \"deleted\"\n  BY user.target.name, user.target.domain\n| WHERE\
    \ created_count >= 1 AND deleted_count >= 1\n| EVAL time_diff_hours = (last_time - first_time) / 3600000\n| WHERE time_diff_hours <= 24\n\
    | KEEP first_time, last_time, user.target.name, user.target.domain, created_count, deleted_count, time_diff_hours\n"
  leql: |
    where(source_json.EventID IN [624, 4720, 630, 4726]) groupby(source_json.TargetUserName, asset) calculate(count)
  crowdstrike: |
    EventCode IN [624, 4720, 630, 4726]
    | case {
        EventCode IN [624, 4720] | created := "true";
        EventCode IN [630, 4726] | deleted := "true";
        * | drop();
      }
    | groupBy([TargetUserName], function=[selectLast([@timestamp, ComputerName, EventCode, created, deleted], as=events)])
    | events
    | sort(field=@timestamp)
    | selfJoin(field=[TargetUserName], where=[{created=true} => {deleted=true}], window=24h)
    | table([@timestamp, ComputerName, TargetUserName, EventCode])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (624, 4720, 630, 4726)
    | alter event_username = coalesce(action_evtlog_event_data_TargetUserName, action_evtlog_event_data_SubjectUserName)
    | alter event_domain = coalesce(action_evtlog_event_data_TargetDomainName, action_evtlog_event_data_SubjectDomainName)
    | alter event_class = if(action_evtlog_event_id in (624, 4720), "created", if(action_evtlog_event_id in (630, 4726), "deleted", null))
    | filter event_class != null
    | sort asc _time
    | comp min(_time) as first_time, max(_time) as last_time, array_agg(event_class) as event_sequence by event_username, event_domain, agent_hostname
    | filter array_length(event_sequence) >= 2
    | alter has_create = arrayfilter(event_sequence, "@element" = "created") != null
    | alter has_delete = arrayfilter(event_sequence, "@element" = "deleted") != null
    | filter has_create = true and has_delete = true
    | alter time_diff_hours = timestamp_diff(last_time, first_time, "HOUR")
    | filter time_diff_hours <= 24
    | fields first_time, last_time, event_username, event_domain, agent_hostname, time_diff_hours
  lucene: |
    (event.code:(624 OR 4720) AND user.domain:(*company_domain*)) OR (event.code:(630 OR 4726) AND user.name:(*))
  sumo: |
    _sourceCategory=*Windows*Security* (EventID=624 OR EventID=4720 OR EventID=630 OR EventID=4726)
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | json field=_raw "TargetDomainName" as target_domain
    | json field=_raw "TimeCreated" as event_time
    | where event_id in ("624", "4720", "630", "4726")
    | where target_domain matches "*" // Replace with: | where target_domain in ("domain1.com", "domain2.com")
    | sort by target_user, _messageTime
    | if(event_id in ("624", "4720"), "created", "deleted") as event_type
    | where event_type = "created" or event_type = "deleted"
    | timeslice 24h
    | transpose row _timeslice column event_type as created, deleted
    | where !isNull(created) and !isNull(deleted)
    | fields target_user, target_domain, created, deleted
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Windows User Created Event\nWhere the Event ID is in [624, 4720]\nWhere the Destination User Domain is in the Company AD Domains\
  \ List\n\nFollowed By\n\n1 Windows User Deleted Event\nWhere the Event ID is in [630, 4726]\nWith the same Destination Username from the previous\
  \ event\t\nWithin 24 hours"
suppression:
  window: 12 hours
  fields:
  - Destination Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

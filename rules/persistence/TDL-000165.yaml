rule_id: TDL-PER-000165
v4_id: '000165'
name: Mass Group Deletions
description: This rule is designed to alert when several user groups are removed by the same user. Several groups being deleted by same user in
  a short amount of time could indicate malicious activity.
tactic: Persistence
tactic_id: TA0003
technique_id: T1531
technique_name: Account Access Removal
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4730, 4734, 4758'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: '(index=wineventlog sourcetype=WinEventLog:Security (EventCode=634 OR EventCode=4730 OR EventCode=638 OR EventCode=4734 OR EventCode=662
    OR EventCode=4758)) OR (index=linux sourcetype IN (linux_secure, syslog) ("group" OR "groupdel") ("deleted" OR "removed"))

    | eval source_user=coalesce(SubjectUserName, Account_Name, user, User)

    | search NOT [| inputlookup authorized_group_deleters | fields source_user]

    | bin _time span=3m

    | stats count by _time, source_user, host

    | where count >= 10

    | table _time, source_user, host, count

    '
  kql: |
    let AuthorizedUsers = dynamic([]);
    let TimeWindow = 3m;
    let Threshold = 10;
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (634, 4730, 638, 4734, 662, 4758)
    | where SubjectUserName !in (AuthorizedUsers)
    | summarize DeletedGroups = count(), GroupNames = make_set(TargetAccount), Computers = make_set(Computer), FirstEvent = min(TimeGenerated), LastEvent = max(TimeGenerated) by SubjectUserName, bin(TimeGenerated, TimeWindow)
    | where DeletedGroups >= Threshold
    | project SubjectUserName, DeletedGroups, GroupNames, Computers, FirstEvent, LastEvent
  aql: |
    SELECT username, sourceip, COUNT(*) AS delete_events
    FROM events
    WHERE "EventID" IN ('634', '4730', '638', '4734', '662', '4758')
      AND username NOT IN ('AUTHORIZED_USER1', 'AUTHORIZED_USER2', 'AUTHORIZED_USER3')
    GROUP BY username, sourceip
    HAVING delete_events >= 10
    LAST 3 MINUTES
  yara_l: "rule mitre_t1531_bulk_group_deletion {\n  meta:\n    author = \"TDL\"\n    description = \"Detects 10+ group deletion events from a\
    \ single unauthorized user within 3 minutes\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique = \"T1531\"\n    severity\
    \ = \"HIGH\"\n  \n  events:\n    ($e.metadata.event_type = \"GROUP_DELETION\" or $e.metadata.event_type = \"USER_RESOURCE_DELETION\")\n  \
    \  (\n      $e.metadata.product_event_type = \"634\" or\n      $e.metadata.product_event_type = \"4730\" or\n      $e.metadata.product_event_type\
    \ = \"638\" or\n      $e.metadata.product_event_type = \"4734\" or\n      $e.metadata.product_event_type = \"662\" or\n      $e.metadata.product_event_type\
    \ = \"4758\"\n    )\n    $e.principal.user.userid = $user\n    not re.regex($user, `(?i)(administrator|admin|domainadmin|enterpriseadmin|svc_admin)`)\n\
    \  \n  match:\n    $user over 3m\n  \n  outcome:\n    $risk_score = 85\n  \n  condition:\n    #e >= 10\n}\n"
  esql: "FROM logs-system.security*, logs-windows.security*\n| WHERE @timestamp > NOW() - 1 hour \n  AND event.code IN (\"634\", \"4730\", \"\
    638\", \"4734\", \"662\", \"4758\")\n  AND winlog.event_data.SubjectUserName NOT IN (\"Administrator\", \"SYSTEM\", \"DomainAdmins\")\n| STATS\
    \ deletion_count = COUNT(*), \n        earliest = MIN(@timestamp), \n        latest = MAX(@timestamp),\n        hosts = VALUES(host.name),\n\
    \        target_groups = VALUES(winlog.event_data.TargetUserName)\n  BY winlog.event_data.SubjectUserName, window = BUCKET(@timestamp, 3 minute)\n\
    | EVAL time_diff_minutes = (latest - earliest) / 60000\n| WHERE deletion_count >= 10 AND time_diff_minutes <= 3\n| KEEP winlog.event_data.SubjectUserName,\
    \ deletion_count, earliest, latest, time_diff_minutes, hosts, target_groups\n"
  leql: |
    where(source_json.EventID IN [634, 4730, 638, 4734, 662, 4758] AND source_user NOT IN ["authorized_user1", "authorized_user2"]) groupby(source_user) calculate(count)
  crowdstrike: |
    EventCode IN [634, 4730, 638, 4734, 662, 4758]
    | SubjectUserName != "authorized_admin_1" AND SubjectUserName != "authorized_admin_2"
    | bucket(span=3m, field=@timestamp, as=time_bucket)
    | groupBy([time_bucket, SubjectUserName], function=count(as=deletions))
    | deletions >= 10
    | table([time_bucket, SubjectUserName, deletions])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (634, 4730, 638, 4734, 662, 4758)
    | filter action_evtlog_event_data_SubjectUserName not in ("authorized_user1", "authorized_user2", "SYSTEM", "Administrator")
    | bin _time span=3m
    | comp count() as deletion_count by _time, action_evtlog_event_data_SubjectUserName, agent_hostname
    | filter deletion_count >= 10
    | fields _time, agent_hostname, action_evtlog_event_data_SubjectUserName, deletion_count
  lucene: |
    event.code:(634 OR 4730 OR 638 OR 4734 OR 662 OR 4758) AND NOT user.name:(authorized_admin1 OR authorized_admin2 OR authorized_admin3)
  sumo: |
    _sourceCategory=*Windows*Security* (EventID=634 OR EventID=4730 OR EventID=638 OR EventID=4734 OR EventID=662 OR EventID=4758)
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as source_username
    | where event_id in ("634", "4730", "638", "4734", "662", "4758")
    | where !(source_username in ("Administrator", "SYSTEM", "DomainAdmin"))
    | timeslice 3m
    | count as delete_count by _timeslice, source_username
    | where delete_count >= 10
    | fields _timeslice, source_username, delete_count
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 Windows Group Deleted Events

  Where the Event ID is in [634, 4730, 638, 4734, 662, 4758]

  From a single Source Username

  Where the Source Username is NOT on the Users Authorized to Delete Users and Groups List

  Within 3 minutes


  ---------------------------------------------------------------------------------------------------------------


  10 Group Deleted Events

  From a single Source Username

  Where the Source Username is NOT on the Users Authorized to Delete Users and Groups List

  Within 3 minutes'
suppression:
  window: 24 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

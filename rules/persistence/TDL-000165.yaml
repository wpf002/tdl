rule_id: TDL-PER-000165
v4_id: '000165'
name: Mass Group Deletions
description: This rule is designed to alert when several user groups are removed by the same user. Several groups being deleted by same user in
  a short amount of time could indicate malicious activity.
tactic: Persistence
tactic_id: TA0003
technique_id: T1531
technique_name: Account Access Removal
platform:
- Linux
- Windows
data_sources:
- Windows Operating System
- Linux Operating System
- 'Event IDs: 4730, 4734, 4758'
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: |
    (index=wineventlog sourcetype=WinEventLog:Security (EventCode=634 OR EventCode=4730 OR EventCode=638 OR EventCode=4734 OR EventCode=662 OR EventCode=4758)) OR (index=linux sourcetype IN (linux_secure, syslog) ("group" OR "groupdel") ("deleted" OR "removed"))
    | eval source_user=coalesce(SubjectUserName, Account_Name, user, User)
    | search NOT [| inputlookup authorized_group_deleters | fields source_user]
    | bin _time span=3m
    | stats count by _time, source_user, host
    | where count >= 10
    | table _time, source_user, host, count
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where event_id in ("4730", "4734", "4758")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"event_id\" IN ('4730', '4734', '4758')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_per_000165 {\n  meta:\n    author = \"TDL\"\n    description = \"Mass Group Deletions\"\n    severity = \"LOW\"\n    tactic\
    \ = \"TA0003\"\n    technique = \"T1531\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.event_id = /(4730|4734|4758)/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND event_id IN ("4730", "4734", "4758")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND event_id IN [4730, 4734, 4758])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND event_id IN (4730, 4734, 4758)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND event_id in ("4730", "4734", "4758")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND event_id:(4730 OR 4734 OR 4758)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND event_id IN ("4730", "4734", "4758")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: historical
pseudo_logic: '10 Windows Group Deleted Events

  Where the Event ID is in [634, 4730, 638, 4734, 662, 4758]

  From a single Source Username

  Where the Source Username is NOT on the Users Authorized to Delete Users and Groups List

  Within 3 minutes


  ---------------------------------------------------------------------------------------------------------------


  10 Group Deleted Events

  From a single Source Username

  Where the Source Username is NOT on the Users Authorized to Delete Users and Groups List

  Within 3 minutes'
suppression:
  window: 24 hours
  fields:
  - Source Username
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

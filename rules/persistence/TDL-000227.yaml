rule_id: TDL-PER-000227
v4_id: '000227'
name: WinSxS DLL Side-Loading
description: Detects DLL being modified in the WinSxS directories. WinSxS (Windows Side-by-Side) is a repository of older versions of DLL files
  that Windows maintains for backwards-compatibility. If an older application is run, Windows will load the older DLLs that correspond to that
  version instead of the current DLL. Attackers can identify which older DLLs are being loaded and replace them with malicious DLLs so they will
  be loaded by the OS which could lead to a system foothold.
tactic: Persistence
tactic_id: TA0003
technique_id: T1574
technique_name: Hijack Execution Flow
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4688 Process_Name="*\\rundll32.exe" (CommandLine="*C:\\Windows\\winsxs*" OR
    Process_Command_Line="*C:\\Windows\\winsxs*")

    | table _time, ComputerName, Account_Name, Process_Name, CommandLine, Process_Command_Line, ParentProcessName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID in (592, 4688)
    | where Process has "rundll32.exe"
    | where CommandLine contains " C:\\Windows\\winsxs"
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName, EventID
  aql: |
    SELECT eventtime, sourceip, username, "Process CommandLine", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE "EventID" IN ('592', '4688')
      AND "Process Name" ILIKE '%rundll32.exe%'
      AND "Process CommandLine" ILIKE '%C:\Windows\winsxs%'
    LAST 24 HOURS
  yara_l: "rule hijack_execution_flow_winsxs_dll {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential DLL hijacking via rundll32.exe\
    \ loading DLLs from winsxs directory\"\n    mitre_tactic = \"Persistence\"\n    mitre_technique = \"T1574\"\n    \n  events:\n    (\n    \
    \  $e.metadata.event_type = \"PROCESS_LAUNCH\" and\n      $e.metadata.product_event_type = \"4688\" and\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\rundll32\\.exe$`) and\n      re.regex($e.principal.process.command_line, `(?i)C:\\\\Windows\\\\winsxs`)\n    ) or\n    (\n    \
    \  $e.metadata.event_type = \"PROCESS_LAUNCH\" and\n      $e.metadata.product_event_type = \"592\" and\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\rundll32\\.exe$`) and\n      re.regex($e.principal.process.command_line, `(?i)C:\\\\Windows\\\\winsxs`)\n    ) or\n    (\n    \
    \  $e.metadata.event_type = \"RESOURCE_READ\" and\n      $e.metadata.product_event_type = \"7\" and\n      re.regex($e.target.resource.name,\
    \ `(?i)C:\\\\Windows\\\\winsxs`) and\n      re.regex($e.target.resource.name, `(?i)\\.dll$`)\n    )\n    \n    $e.principal.hostname = $host\n\
    \    \n  match:\n    $host over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.code IN ("592", "4688")
      AND TO_LOWER(process.name) == "rundll32.exe"
      AND process.command_line LIKE "* C:\\Windows\\winsxs*"
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(source_json.EventID IN [592, 4688] AND process_name ICONTAINS "rundll32.exe" AND process_cmd_line ICONTAINS "C:\Windows\winsxs")
  crowdstrike: |
    (EventCode=4688 OR EventCode=592) (NewProcessName=*rundll32.exe OR Image=*rundll32.exe) CommandLine=*C:\Windows\winsxs*
    | table([@timestamp, ComputerName, UserName, NewProcessName, Image, CommandLine, ParentProcessName])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (592, 4688) \n  and (lowercase(action_process_image_name) contains \"rundll32.exe\"\
    \ or lowercase(actor_process_image_name) contains \"rundll32.exe\")\n  and action_process_image_command_line contains \" C:\\\\Windows\\\\\
    winsxs\"\n| fields _time, agent_hostname, actor_effective_username, action_process_image_name, actor_process_image_name, action_process_image_command_line\n"
  lucene: |
    (event.code:(592 OR 4688) AND process.name:rundll32.exe AND process.command_line:*\ C\:\\Windows\\winsxs*) OR (event.code:7 AND winlog.event_data.ImageLoaded:*\ C\:\\Windows\\winsxs* AND winlog.event_data.ImageLoaded:*.dll)
  sumo: "_sourceCategory=*Windows* (EventID=4688 OR EventID=592 OR EventID=7)\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"\
    NewProcessName\" as process_name\n| json field=_raw \"ProcessName\" as process_name_alt\n| json field=_raw \"CommandLine\" as command_line\n\
    | json field=_raw \"ImageLoaded\" as image_loaded\n| json field=_raw \"Image\" as image\n| where (event_id in (\"4688\", \"592\") and (process_name\
    \ matches \"*rundll32.exe\" or process_name_alt matches \"*rundll32.exe\") and command_line matches \"* C:\\\\Windows\\\\winsxs*\") \n   \
    \ or (event_id = \"7\" and image_loaded matches \"* C:\\\\Windows\\\\winsxs*\" and image_loaded matches \"*.dll\")\n| fields _messageTime,\
    \ _sourceHost, event_id, process_name, process_name_alt, command_line, image_loaded, image\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:

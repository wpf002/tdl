rule_id: TDL-PER-000228
v4_id: 000228
name: Netsh Helper DLL Injection
description: Detects when a new DLL is registered to Netsh or when Netsh spawns another process. Netsh is used to configure network settings on
  a Windows host. It can also extend its functionality by installer “helper” DLLs. An attacker can install a malicious helper DLL to run arbitrary
  code every time netsh is executed which allows for a persistant or foothold on the machine.
tactic: Persistence
tactic_id: TA0003
technique_id: T1574
technique_name: Hijack Execution Flow
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4688, 4657'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=windows (EventCode=592 OR EventCode=4688) ParentImage=\"*\\\\netsh.exe\" Image!=conhost.exe Image!=NULL Image!=\"-\") OR (index=windows\
    \ (EventCode=567 OR EventCode=4657) (Object_Name=\"*\\\\REGISTRY\\\\MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\" OR Object_Name=\"*HKLM\\\\\
    SOFTWARE\\\\Microsoft\\\\Netsh*\" OR Object_Name=\"*HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\"))\n| eval detection_type=case(\n\
    \    (EventCode=592 OR EventCode=4688), \"Process Execution\",\n    (EventCode=567 OR EventCode=4657), \"Registry Modification\"\n)\n| table\
    \ _time, ComputerName, EventCode, detection_type, ParentImage, Image, CommandLine, Object_Name, Process_Name\n"
  kql: |
    union
    (SecurityEvent
    | where EventID == 4688
    | where ParentProcessName has "netsh.exe"
    | where isnotempty(NewProcessName) and NewProcessName !has "conhost.exe"
    | project TimeGenerated, Computer, Account, ParentProcessName, NewProcessName, CommandLine, EventID, DetectionType = "Process Execution"),
    (SecurityEvent
    | where EventID == 4657
    | where ObjectName has_any ("REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Netsh", "HKLM\\SOFTWARE\\Microsoft\\Netsh", "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Netsh")
    | project TimeGenerated, Computer, Account, ObjectName, OperationType, EventID, DetectionType = "Registry Modification")
    | project TimeGenerated, Computer, Account, EventID, DetectionType, ParentProcessName, NewProcessName, CommandLine, ObjectName, OperationType
  aql: |
    SELECT eventtime, sourceip, username, "Process Name" AS child_process, "Parent Process Name", "Process CommandLine", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE (("EventID" = '4688' AND "Parent Process Name" ILIKE '%netsh.exe%' AND "Process Name" IS NOT NULL AND "Process Name" NOT ILIKE '%conhost.exe%')
    OR ("EventID" = '4657' AND ("ObjectName" ILIKE '%REGISTRY\MACHINE\SOFTWARE\Microsoft\Netsh%' OR "ObjectName" ILIKE '%HKLM\SOFTWARE\Microsoft\Netsh%' OR "ObjectName" ILIKE '%HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Netsh%')))
    LAST 1 HOURS
  yara_l: "rule netsh_helper_dll_persistence {\n  meta:\n    author = \"TDL\"\n    description = \"Detects potential netsh helper DLL persistence\
    \ via process execution and registry modification\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique = \"T1574\"\n \
    \   \n  events:\n    $proc.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      $proc.metadata.product_event_type = \"592\" or\n      $proc.metadata.product_event_type\
    \ = \"4688\"\n    )\n    re.regex($proc.principal.process.file.full_path, `(?i)\\\\netsh\\.exe$`)\n    $proc.target.process.file.full_path\
    \ != \"\"\n    not re.regex($proc.target.process.file.full_path, `(?i)\\\\conhost\\.exe$`)\n    $proc.principal.hostname = $host\n    \n \
    \   $reg.metadata.event_type = \"REGISTRY_MODIFICATION\"\n    (\n      $reg.metadata.product_event_type = \"567\" or\n      $reg.metadata.product_event_type\
    \ = \"4657\"\n    )\n    (\n      re.regex($reg.target.registry.registry_key, `(?i)REGISTRY\\\\MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh`)\
    \ or\n      re.regex($reg.target.registry.registry_key, `(?i)HKLM\\\\SOFTWARE\\\\Microsoft\\\\Netsh`) or\n      re.regex($reg.target.registry.registry_key,\
    \ `(?i)HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh`)\n    )\n    $reg.principal.hostname = $host\n    \n  match:\n    $host over\
    \ 1h\n    \n  condition:\n    $proc and $reg\n}\n"
  esql: "FROM logs-system.security*, logs-endpoint.events.process*, winlogbeat-*\n| WHERE (\n    (event.code IN (\"592\", \"4688\") AND process.parent.name\
    \ == \"netsh.exe\" AND process.name IS NOT NULL AND process.name != \"conhost.exe\")\n    OR\n    (event.code IN (\"567\", \"4657\") AND (\n\
    \      winlog.event_data.ObjectName LIKE \"*\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\" \n      OR winlog.event_data.ObjectName LIKE \"REGISTRY\\\
    \\MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\"\n      OR winlog.event_data.ObjectName LIKE \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\"\n \
    \     OR winlog.event_data.ObjectName LIKE \"HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\"\n    ))\n  )\n| KEEP @timestamp, host.name,\
    \ user.name, event.code, process.parent.name, process.name, process.command_line, winlog.event_data.ObjectName\n"
  leql: |
    where((source_json.EventID IN [592, 4688] AND parent_process_name ICONTAINS "netsh.exe" AND process_name != "" AND process_name NOT ICONTAINS "conhost.exe") OR (source_json.EventID IN [567, 4657] AND (source_json.ObjectName ICONTAINS "REGISTRY\MACHINE\SOFTWARE\Microsoft\Netsh" OR source_json.ObjectName ICONTAINS "HKLM\SOFTWARE\Microsoft\Netsh" OR source_json.ObjectName ICONTAINS "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Netsh")))
  crowdstrike: |
    (EventCode=4688 ParentBaseFileName=netsh.exe FileName!=conhost.exe FileName!=NULL) OR (EventCode=4657 (RegistryKey=*REGISTRY\MACHINE\SOFTWARE\Microsoft\Netsh* OR RegistryKey=*HKLM\SOFTWARE\Microsoft\Netsh* OR RegistryKey=*HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Netsh*))
    | table([@timestamp, ComputerName, EventCode, UserName, FileName, ParentBaseFileName, CommandLine, RegistryKey, RegistryValueName])
  xql: |
    dataset = xdr_data
    | filter (action_evtlog_event_id in (592, 4688) and actor_process_image_name = "netsh.exe" and action_process_image_name != "" and action_process_image_name != "conhost.exe")
       or (action_evtlog_event_id in (567, 4657) and (action_registry_key_name contains "REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Netsh" or action_registry_key_name contains "HKLM\\SOFTWARE\\Microsoft\\Netsh" or action_registry_key_name contains "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Netsh"))
    | fields _time, agent_hostname, action_evtlog_event_id, actor_process_image_name, action_process_image_name, action_process_image_command_line, action_registry_key_name, actor_effective_username
  lucene: |
    (event.code:(4688 OR 592) AND process.parent.name:netsh.exe AND NOT process.name:(conhost.exe OR "")) OR (event.code:(4657 OR 567) AND (registry.path:*REGISTRY\\MACHINE\\SOFTWARE\\Microsoft\\Netsh* OR registry.path:*HKLM\\SOFTWARE\\Microsoft\\Netsh* OR registry.path:*HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Netsh*))
  sumo: "_sourceCategory=*Windows* (event_id=\"4688\" OR event_id=\"4657\")\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"ParentProcessName\"\
    \ as parent_process\n| json field=_raw \"NewProcessName\" as child_process\n| json field=_raw \"ObjectName\" as registry_key\n| where (event_id\
    \ = \"4688\" AND parent_process matches \"*netsh.exe\" AND child_process != \"\" AND NOT child_process matches \"*conhost.exe\") \n   OR (event_id\
    \ = \"4657\" AND (registry_key matches \"*REGISTRY\\\\MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\" OR registry_key matches \"*HKLM\\\\SOFTWARE\\\
    \\Microsoft\\\\Netsh*\" OR registry_key matches \"*HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Netsh*\"))\n| fields _messageTime, _sourceHost,\
    \ event_id, parent_process, child_process, registry_key\n"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Process Execution Event

  Where the Event ID is in [592, 4688]

  Where the Parent Process is netsh.exe

  Where the Child Process is NOT [NULL, conhost.exe]


  ---------------------------------------------------------------------------------------------------------------


  1 Windows Registry Modification Event

  Where the Event ID is in [567, 4657]

  Where the Registry Key is in [REGISTRY\MACHINE\SOFTWARE\Microsoft\Netsh, HKLM\SOFTWARE\Microsoft\Netsh, HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Netsh]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000229
v4_id: 000229
name: Startup File Modification - OSX
description: Detects when files related to configuring startup processes are modified in OSX. Attackers can create malicious plist files and place
  them in the LaunchAgent and LaunchDaemon directories, or modify the rc.common or launchd.conf files to configure the malicious process to run
  on the machines startup process to establish persistence.
tactic: Persistence
tactic_id: TA0003
technique_id: T1037
technique_name: Boot or Logon Initialization Scripts
platform:
- macOS
data_sources:
- MAC Operating System
- 'Event IDs: 4663'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=mac sourcetype="MAC Operating System" (EventCode=567 OR EventCode=4663) (file_name="*Library/LaunchDaemons/*" OR file_name="*Library/LaunchAgents/*"
    OR file_name="*etc/rc.common*" OR file_name="*etc/launchd.conf*") NOT (process_name IN ("installd", "shove", "mdworker", "mds", "backup"))

    | table _time, host, EventCode, file_name, process_name, user

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID in (567, 4663)
    | where ObjectName has_any ("Library/LaunchDaemons/", "Library/LaunchAgents/", "etc/rc.common", "etc/launchd.conf")
    | where ProcessName !has_any ("installd", "shove", "mdworker", "mds", "backup")
    | project TimeGenerated, Computer, Account, EventID, ProcessName, ObjectName, AccessMask
  aql: "SELECT eventtime, sourceip, username, \"Process Name\", \"File Name\", LOGSOURCENAME(logsourceid) AS host\nFROM events\nWHERE \"EventID\"\
    \ IN ('567', '4663')\n  AND (\"File Name\" ILIKE '%Library/LaunchDaemons/%' \n       OR \"File Name\" ILIKE '%Library/LaunchAgents/%' \n \
    \      OR \"File Name\" ILIKE '%etc/rc.common%' \n       OR \"File Name\" ILIKE '%etc/launchd.conf%')\n  AND \"Process Name\" NOT ILIKE '%installd%'\n\
    \  AND \"Process Name\" NOT ILIKE '%shove%'\n  AND \"Process Name\" NOT ILIKE '%mdworker%'\n  AND \"Process Name\" NOT ILIKE '%mds%'\n  AND\
    \ \"Process Name\" NOT ILIKE '%backup%'\nLAST 24 HOURS\n"
  yara_l: |
    rule macos_persistence_logon_script_modification {
      meta:
        author = "TDL"
        description = "Detects modifications to macOS logon script directories and files for persistence (T1037)"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1037"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "FILE_MODIFICATION"
        (
          $e.metadata.product_event_type = "567" or
          $e.metadata.product_event_type = "4663"
        )
        (
          re.regex($e.target.file.full_path, `Library/LaunchDaemons/`) or
          re.regex($e.target.file.full_path, `Library/LaunchAgents/`) or
          re.regex($e.target.file.full_path, `etc/rc\.common`) or
          re.regex($e.target.file.full_path, `etc/launchd\.conf`)
        )
        not (
          re.regex($e.principal.process.file.full_path, `(?i)installd$`) or
          re.regex($e.principal.process.file.full_path, `(?i)shove$`) or
          re.regex($e.principal.process.file.full_path, `(?i)mdworker$`) or
          re.regex($e.principal.process.file.full_path, `(?i)mds$`) or
          re.regex($e.principal.process.file.full_path, `(?i)backup$`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-system.security*, winlogbeat-*
    | WHERE winlog.event_id IN (567, 4663)
      AND (file.path LIKE "*Library/LaunchDaemons/*" OR file.path LIKE "*Library/LaunchAgents/*" OR file.path LIKE "*etc/rc.common*" OR file.path LIKE "*etc/launchd.conf*")
      AND process.name NOT IN ("installd", "shove", "mdworker", "mds", "backup")
    | KEEP @timestamp, host.name, user.name, process.name, file.path, winlog.event_id
  leql: |
    where(source_json.EventID IN [567, 4663] AND (source_json.FileName ICONTAINS "Library/LaunchDaemons/" OR source_json.FileName ICONTAINS "Library/LaunchAgents/" OR source_json.FileName ICONTAINS "etc/rc.common" OR source_json.FileName ICONTAINS "etc/launchd.conf") AND process_name NOT IN [installd, shove, mdworker, mds, backup])
  crowdstrike: |
    EventCode IN [567, 4663]
    (FileName=*Library/LaunchDaemons/* OR FileName=*Library/LaunchAgents/* OR FileName=*etc/rc.common* OR FileName=*etc/launchd.conf*)
    NOT ProcessName IN [installd, shove, mdworker, mds, backup]
    | table([@timestamp, ComputerName, ProcessName, FileName, EventCode])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (567, 4663)\n  and (action_file_path contains \"Library/LaunchDaemons/\" \n   \
    \    or action_file_path contains \"Library/LaunchAgents/\" \n       or action_file_path contains \"etc/rc.common\" \n       or action_file_path\
    \ contains \"etc/launchd.conf\")\n  and actor_process_image_name not in (\"installd\", \"shove\", \"mdworker\", \"mds\", \"backup\")\n| fields\
    \ _time, agent_hostname, actor_process_image_name, action_file_path, actor_effective_username, action_evtlog_event_id\n"
  lucene: |
    (event.code:(567 OR 4663) OR EventID:(567 OR 4663)) AND (file.path:(*Library\/LaunchDaemons\/* OR *Library\/LaunchAgents\/* OR *etc\/rc.common* OR *etc\/launchd.conf*) OR FileName:(*Library\/LaunchDaemons\/* OR *Library\/LaunchAgents\/* OR *etc\/rc.common* OR *etc\/launchd.conf*)) AND NOT (process.name:(installd OR shove OR mdworker OR mds OR backup) OR ProcessName:(installd OR shove OR mdworker OR mds OR backup))
  sumo: |
    _sourceCategory=*MAC* OR _sourceCategory=*macOS* ("567" OR "4663")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectName" as file_name
    | json field=_raw "ProcessName" as process_name
    | where event_id in ("567", "4663")
    | where file_name matches "*Library/LaunchDaemons/*" OR file_name matches "*Library/LaunchAgents/*" OR file_name matches "*etc/rc.common*" OR file_name matches "*etc/launchd.conf*"
    | where !(process_name in ("installd", "shove", "mdworker", "mds", "backup"))
    | fields _messageTime, _sourceHost, event_id, file_name, process_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Modification Event

  Where the Windows Event ID is in [567, 4663]

  Where the File Name is in [Library/LaunchDaemons/, Library/LaunchAgents/, etc/rc.common, etc/launchd.conf]

  Where the Process Name is NOT in [installd, shove, mdworker, mds, backup]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000231
v4_id: '000231'
name: Authentication Package DLL Injection
description: Detects when a new authentication package DLL is registered. Authentication Packages provide support for different authentication
  security protocols, such as Kerberos or multifactor products. Since the authentication package DLLs are loaded at startup or reboot, an attacker
  can upload a malicious DLL to establish persistence on the machine.
tactic: Persistence
tactic_id: TA0003
technique_id: T1574
technique_name: Hijack Execution Flow
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4657'
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=windows (EventCode=567 OR EventCode=4657) (Object_Name="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*" OR Object_Name="*\\SYSTEM\\ControlSet*\\Control\\Lsa\\*")
    Object_Value_Name="Authentication Packages"

    | table _time, ComputerName, EventCode, Object_Name, Object_Value_Name, Process_Name, SubjectUserName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4657
    | where ObjectName has "SYSTEM\\CurrentControlSet\\Control\\Lsa"
    | where ObjectValueName =~ "Authentication Packages"
    | project TimeGenerated, Computer, Account, SubjectUserName, ObjectName, ObjectValueName, OperationType, NewValue, OldValue
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Object Name" AS registry_key, "Object Value Name" AS value_name, "New Value"
    FROM events
    WHERE "EventID" IN ('567', '4657')
      AND ("Object Name" ILIKE '%HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\%' OR "Object Name" ILIKE '%REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\%')
      AND "Object Value Name" = 'Authentication Packages'
    LAST 24 HOURS
  yara_l: |
    rule lsa_auth_packages_modification {
      meta:
        author = "TDL"
        description = "Detects modification of LSA Authentication Packages registry key - T1574 Persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1574"
        severity = "High"

      events:
        $e.metadata.event_type = "REGISTRY_MODIFICATION"
        $e.metadata.product_event_type = "4657"
        (
          re.regex($e.target.registry.registry_key, `(?i)HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\`) or
          re.regex($e.target.registry.registry_key, `(?i)REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\`)
        )
        re.regex($e.target.registry.registry_value_name, `(?i)Authentication Packages`)
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code IN ("567", "4657")
      AND (
        winlog.event_data.ObjectName LIKE "*HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*"
        OR winlog.event_data.ObjectName LIKE "*REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*"
      )
      AND winlog.event_data.ObjectValueName == "Authentication Packages"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ObjectName, winlog.event_data.ObjectValueName, winlog.event_data.NewValue, process.name, process.executable
  leql: |
    where(source_json.EventID IN [567, 4657] AND (source_json.ObjectName ICONTAINS "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\" OR source_json.ObjectName ICONTAINS "REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\") AND source_json.ObjectValueName="Authentication Packages")
  crowdstrike: |
    EventCode=4657 (RegistryKeyPath=*HKLM\SYSTEM\CurrentControlSet\Control\Lsa\* OR RegistryKeyPath=*REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\*) ObjectValueName="Authentication Packages"
    | table([@timestamp, ComputerName, RegistryKeyPath, ObjectValueName, NewValue, ProcessName, SubjectUserName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (567, 4657)
    | filter (action_evtlog_event_data_ObjectName contains "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\" or action_evtlog_event_data_ObjectName contains "REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\")
    | filter action_evtlog_event_data_ObjectValueName = "Authentication Packages"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_ObjectName, action_evtlog_event_data_ObjectValueName, action_evtlog_event_data_NewValue, action_evtlog_event_data_OldValue
  lucene: |
    event.code:4657 AND (registry.path:*SYSTEM\\CurrentControlSet\\Control\\Lsa\\* OR registry.path:*SYSTEM\\ControlSet001\\Control\\Lsa\\* OR registry.path:*\\Control\\Lsa\\*) AND registry.value:"Authentication Packages"
  sumo: |
    _sourceCategory=*Windows* ("4657" OR "567")
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectName" as registry_key
    | json field=_raw "ObjectValueName" as value_name
    | where event_id in ("4657", "567")
    | where (registry_key matches "*HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*" OR registry_key matches "*REGISTRY\\MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*")
    | where value_name matches "*Authentication Packages*"
    | fields _messageTime, _sourceHost, event_id, registry_key, value_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Windows Registry Modification Event

  Where the Event ID is in [567, 4657]

  Where the Registry Key is in [HKLM\SYSTEM\CurrentControlSet\Control\Lsa\, REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\]

  Where the Object Value "Authentication Packages"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

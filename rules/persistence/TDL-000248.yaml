rule_id: TDL-PER-000248
v4_id: 000248
name: Printer Port Monitor DLL Injection
description: Detects when a new DLL is added to the printer port monitor. Port monitors can be set to run at startup by the printer servier spoolsv.exe.
  An attacker can register a malicious DLL that will be run by spoolsv.exe with SYSTEM level privileges.
tactic: Persistence
tactic_id: TA0003
technique_id: T1574
technique_name: Hijack Execution Flow
platform:
- Windows
data_sources:
- Windows Operating System
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=endpoint sourcetype=Sysmon EventCode=1 process_name="spoolsv.exe"

    | stats count values(host) as affected_hosts values(user) as users by process_name, parent_process_name, command_line

    | where count >= 1

    '
  kql: |
    Event
    | where EventID == 1
    | where Source == "Microsoft-Windows-Sysmon"
    | extend EventData = parse_xml(EventData)
    | extend Image = tostring(EventData.DataItem.EventData.Data[4]["#text"])
    | extend ParentImage = tostring(EventData.DataItem.EventData.Data[20]["#text"])
    | extend CommandLine = tostring(EventData.DataItem.EventData.Data[10]["#text"])
    | extend User = tostring(EventData.DataItem.EventData.Data[12]["#text"])
    | extend ProcessName = tostring(split(Image, '\\')[-1])
    | extend ParentProcessName = tostring(split(ParentImage, '\\')[-1])
    | where ProcessName =~ "spoolsv.exe"
    | summarize Computers = make_set(Computer), Users = make_set(User), Count = count() by ProcessName, ParentProcessName, CommandLine
    | project ProcessName, ParentProcessName, CommandLine, Computers, Users, Count
  aql: |
    SELECT LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Parent Process Name", "Process CommandLine", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" = '1' AND "Process Name" ILIKE '%spoolsv.exe%'
    GROUP BY LOGSOURCENAME(logsourceid), username, "Process Name", "Parent Process Name", "Process CommandLine"
    LAST 24 HOURS
  yara_l: |
    rule hijack_execution_flow_spoolsv {
      meta:
        author = "TDL"
        description = "Detects spoolsv.exe process creation - T1574 Persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1574"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        $e.metadata.product_event_type = "1"
        re.regex($e.target.process.file.full_path, `(?i)\\spoolsv\.exe$`) nocase
        $e.target.process.command_line = $cmdline
        $e.target.process.parent_process.file.full_path = $parent
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $cmdline, $parent over 1h

      outcome:
        $risk_score = 50
        $host_list = array_distinct($host)
        $user_list = array_distinct($user)

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*
    | WHERE event.code == "1" AND process.name == "spoolsv.exe"
    | STATS hosts = COUNT_DISTINCT(host.name), users = COUNT_DISTINCT(user.name) BY process.name, process.parent.name, process.command_line
    | KEEP process.name, process.parent.name, process.command_line, hosts, users
  leql: |
    where(source_json.EventID=1 AND process_name="spoolsv.exe") groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    EventCode=1 FileName=spoolsv.exe
    | groupBy([FileName, ParentBaseFileName, CommandLine], function=[count(as=instances), count(ComputerName, distinct=true, as=hosts), count(UserName, distinct=true, as=users)])
    | table([FileName, ParentBaseFileName, CommandLine, instances, hosts, users])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS and action_evtlog_event_id = 1 and lowercase(action_process_image_name) contains "spoolsv.exe"
    | comp count() as instances, count_distinct(agent_hostname) as hosts, values(agent_hostname) as hostnames, count_distinct(actor_effective_username) as users, values(actor_effective_username) as usernames by action_process_image_name, actor_process_image_name, action_process_image_command_line
    | fields action_process_image_name, actor_process_image_name, action_process_image_command_line, instances, hosts, hostnames, users, usernames
  lucene: |
    EventCode:1 AND process_name:spoolsv.exe
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id = "1" and process_name matches "*spoolsv.exe"
    | count_distinct(host) as distinct_hosts, count_distinct(user) as distinct_users by process_name, parent_process_name, command_line
    | fields process_name, parent_process_name, command_line, distinct_hosts, distinct_users
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'
pseudo_logic: '1 Instance over any time window of a Sysmon Process Creation event.


  From index=endpoint sourcetype=Sysmon

  Where EventCode=1 (Process Creation)

  Where process_name is "spoolsv.exe"

  With any parent_process_name and command_line captured for context

  With the same process_name, parent_process_name, and command_line as the correlation key

  With results aggregated to surface distinct hosts and users associated with each unique process invocation'

rule_id: TDL-PER-000322
v4_id: '000322'
name: IAM Custom Role Created or Modified - GCP
description: Detect when a custom role is created or modified. This could be indicative of a malicious threat actor escalating privileges.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: T1098
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit action=*role*

    | table _time, user, action, resource, project_id, severity

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(1h)
    | where MethodName has "role"
    | project TimeGenerated, PrincipalEmail, MethodName, ResourceName, ServiceName, RequestMetadata, AuthenticationInfo
  aql: |
    SELECT sourceip, username, "action", "resource", eventtime, QIDNAME(qid)
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%gcp%'
      AND "action" ILIKE '%role%'
    LAST 24 HOURS
  yara_l: "rule gcp_iam_role_modification {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects IAM role modifications\
    \ in GCP (T1098 - Account Manipulation)\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique = \"T1098\"\n    severity\
    \ = \"Medium\"\n    \n  events:\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\n    $e.metadata.product_name = \"GCP\"\n    $e.metadata.event_type\
    \ = \"USER_RESOURCE_UPDATE_CONTENT\"\n    re.regex($e.target.resource.attribute.labels[\"method_name\"], `(?i)role`)\n    $e.principal.user.userid\
    \ = $user\n    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 50\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-gcp.audit*
    | WHERE event.action LIKE "*role*"
    | KEEP @timestamp, cloud.account.id, cloud.project.id, event.action, user.name, source.ip, event.outcome
  leql: |
    where(source_json.protoPayload.methodName ICONTAINS "role")
  crowdstrike: |
    #repo=gcp-audit action=*role*
    | table([@timestamp, action, principalEmail, resourceName, methodName])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "GCP" and lowercase(action) contains "role"
    | fields _time, actor_user, action, resource_name, project_id, raw_log
  lucene: |
    gcp.audit.method_name:*role*
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*gcp* OR _sourceCategory=*audit*
    | json field=_raw "protoPayload.methodName" as method_name
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as principal
    | json field=_raw "protoPayload.serviceName" as service_name
    | json field=_raw "resource.type" as resource_type
    | where method_name matches "*role*" OR method_name matches "*Role*"
    | fields _messageTime, principal, method_name, service_name, resource_type
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Cloud Audit event

  where action contains role'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000369
v4_id: 000369
name: Azure Successful Powershell Login
description: Detects a successful Azure login via Azure Powershell.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Azure
data_sources:
- Azure
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype=azure:monitor:aad EventCategory=SignInLogs OperationName="Sign-in activity" AppId="1b730954-1685-4b74-9bfd-dac224a7b894"
    TokenIssuerType="AzureAD" ResultType=0

    | table _time, UserPrincipalName, AppDisplayName, IPAddress, Location, DeviceDetail.operatingSystem, ResultDescription

    '
  kql: |
    SigninLogs
    | where TimeGenerated > ago(90d)
    | where OperationName in ("Sign-in activity")
    | where AppId == "1b730954-1685-4b74-9bfd-dac224a7b894"
    | where TokenIssuerType == "AzureAD"
    | where ResultType == 0
    | project TimeGenerated, UserPrincipalName, AppDisplayName, AppId, IPAddress, Location, DeviceDetail, TokenIssuerType, ResultType, OperationName
  aql: |
    SELECT username, sourceip, destinationip, "Application ID", "Token Issuer Type", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "OperationName" = 'Sign-in activity'
      AND "Application ID" = '1b730954-1685-4b74-9bfd-dac224a7b894'
      AND "Token Issuer Type" = 'AzureAD'
      AND LOWER(UTF8(payload)) MATCHES '.*"status"[:\s]*\{[^}]*"errorCode"[:\s]*0.*'
    LAST 24 HOURS
  yara_l: |
    rule azure_azuread_portal_signin_persistence {
      meta:
        author = "Detection Engineering"
        description = "Detects successful sign-ins to Azure AD portal (T1098 - Account Manipulation)"
        mitre_attack_technique = "T1098"
        mitre_attack_tactic = "Persistence"
        platform = "Azure"
        data_source = "Azure SigninLogs"

      events:
        $signin.metadata.vendor_name = "Microsoft"
        $signin.metadata.product_name = "Azure"
        $signin.metadata.log_type = "AZURE_SIGNIN_LOGS"
        $signin.metadata.product_event_type = "Sign-in activity"
        $signin.target.application = "1b730954-1685-4b74-9bfd-dac224a7b894"
        $signin.security_result.action = "ALLOW"
        $signin.additional.fields["tokenIssuerType"] = "AzureAD"
        $signin.principal.user.userid = $user
        $signin.target.application_object.application = $app

      match:
        $user over 5m

      condition:
        $signin
    }
  esql: |
    FROM logs-azure.signinlogs*
    | WHERE azure.signinlogs.properties.status.error_code == "0"
      AND azure.signinlogs.operation_name == "Sign-in activity"
      AND azure.signinlogs.properties.app_id == "1b730954-1685-4b74-9bfd-dac224a7b894"
      AND azure.signinlogs.properties.token_issuer_type == "AzureAD"
    | KEEP @timestamp, azure.signinlogs.properties.user_principal_name, azure.signinlogs.properties.app_display_name, azure.signinlogs.properties.ip_address, azure.signinlogs.properties.location
  leql: |
    where(source_json.OperationName="Sign-in activity" AND source_json.AppId="1b730954-1685-4b74-9bfd-dac224a7b894" AND source_json.TokenIssuerType="AzureAD" AND source_json.ResultType="0")
  crowdstrike: |
    #repo=* event_platform=Azure event_simpleName=AzureActiveDirectorySignInLogs OperationName="Sign-in activity" AppId=1b730954-1685-4b74-9bfd-dac224a7b894 TokenIssuerType=AzureAD ResultType=0
    | table([@timestamp, UserPrincipalName, AppDisplayName, IPAddress, UserAgent, Location])
  xql: |
    dataset = azure_raw_data
    | filter cloud_provider = "azure" and event_type = "SigninLogs"
    | filter action_operation_name = "Sign-in activity"
    | filter action_app_id = "1b730954-1685-4b74-9bfd-dac224a7b894"
    | filter action_result_status = "Success"
    | filter action_token_issuer_type = "AzureAD"
    | fields _time, action_country_or_region, actor_primary_user_upn, action_app_display_name, action_resource_display_name, action_client_app_used, action_ip_address, action_user_agent
  lucene: |
    OperationName:"Sign-in activity" AND AppId:"1b730954-1685-4b74-9bfd-dac224a7b894" AND TokenIssuerType:"AzureAD" AND ResultType:0
  sumo: |
    _sourceCategory=*Azure* "SignInLogs" "Sign-in activity"
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.appId" as app_id
    | json field=_raw "properties.tokenIssuerType" as token_issuer_type
    | json field=_raw "properties.status.errorCode" as error_code
    | where operation_name = "Sign-in activity"
    | where app_id = "1b730954-1685-4b74-9bfd-dac224a7b894"
    | where token_issuer_type = "AzureAD"
    | where error_code = "0" or isNull(error_code)
    | fields _messageTime, operation_name, app_id, token_issuer_type, error_code
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure SigninLogs Event

  Where OperationName is in [Sign-in activity]

  Where the Application ID is in [1b730954-1685-4b74-9bfd-dac224a7b894]

  Where the Token Issuer Type is in [AzureAD]

  Where Action is in [Success]'
suppression:
  window: 24 hours
  fields:
  - src_user
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000371
v4_id: '000371'
name: MFA Disabled by User
description: Detects when MFA has been disabled for a user account.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Azure
data_sources:
- Azure AD
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:audit:aad "Disable Strong Authentication" ResultStatus=Success

    | table _time, User, TargetUser, IPAddress, ResultStatus, ActivityDisplayName, OperationName

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName =~ "Disable Strong Authentication"
    | where Result =~ "success"
    | project TimeGenerated, OperationName, Result, Identity, TargetResources, InitiatedBy, AADTenantId, CorrelationId
  aql: |
    SELECT username, sourceip, eventtime, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
      AND (QIDNAME(qid) ILIKE '%Disable Strong Authentication%' OR CATEGORYNAME(category) ILIKE '%Disable Strong Authentication%')
      AND QIDNAME(qid) ILIKE '%Success%'
    LAST 24 HOURS
  yara_l: |
    rule azure_ad_mfa_disabled {
      meta:
        author = "Detection Engineer"
        description = "Detects when MFA/strong authentication is disabled in Azure AD"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure Active Directory"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        re.regex($e.target.resource.attribute.labels.value, `(?i)Disable Strong Authentication`)
        $e.security_result.action = "ALLOW"
        $e.target.user.userid = $user
        $e.principal.user.userid = $actor

      match:
        $user over 5m

      condition:
        $e
    }
  esql: "FROM logs-azure.auditlogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND azure.auditlogs.operation_name == \"Disable Strong Authentication\"\
    \n  AND event.outcome == \"success\"\n| KEEP @timestamp, azure.auditlogs.properties.target_resources.user_principal_name, azure.auditlogs.properties.initiated_by.user.user_principal_name,\
    \ host.name, azure.auditlogs.operation_name, event.outcome\n"
  leql: |
    where(source_json.eventName="Disable Strong Authentication" AND source_json.resultStatus="Success")
  crowdstrike: |
    #repo=azure_ad "Disable Strong Authentication" "Success"
    | table([@timestamp, user, actor, target, action, result])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Microsoft" and action_result = "SUCCESS" and (operation contains "Disable Strong Authentication" or operation_name contains "Disable Strong Authentication")
    | fields _time, actor_user, operation, operation_name, action_result, identity_name, identity_uuid, cloud_provider_event_id
  lucene: |
    event.dataset:"azure.auditlogs" AND azure.auditlogs.operation_name:"Disable Strong Authentication" AND event.outcome:success
  sumo: "_sourceCategory=*Azure* OR _sourceCategory=*AzureAD* (\"Disable Strong Authentication\" OR \"Disable strong authentication\")\n| json\
    \ field=_raw \"status\" as status\n| json field=_raw \"operationName\" as operation_name\n| json field=_raw \"resultType\" as result_type\n\
    | json field=_raw \"result\" as result\n| where (operation_name matches \"*Disable*Strong*Authentication*\" OR operation_name matches \"*Disable*strong*authentication*\"\
    ) \n  AND (status = \"Success\" OR result = \"Success\" OR result_type = \"Success\" OR result = \"success\" OR status = \"success\")\n| fields\
    \ _messageTime, _sourceHost, operation_name, status, result, result_type\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where the Event is in [Disable Strong Authentication]

  Where the Action is in [Success]'
suppression:
  window: 8 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000373
v4_id: '000373'
name: AWS Security Group Modified by Unauthorized User
description: Detects when a AWS security group is modified which could allow unauthorized acces. Attackers will modify security groups to establish
  persistence, exfiltrate data, or pivot in a AWS environment.
tactic: Persistence
tactic_id: TA0003
technique_id: T1562
technique_name: Impair Defenses
platform:
- AWS
data_sources:
- AWS CloudTrail
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=aws sourcetype=aws:cloudtrail eventName IN ("SetSecurityGroups","AuthorizeSecurityGroupEgress","AuthorizeSecurityGroupIngress","CreateSecurityGroup","ModifySecurityGroupRules")
    errorCode=success

    | table _time, userIdentity.principalId, userIdentity.arn, eventName, requestParameters.groupId, sourceIPAddress, userAgent

    '
  kql: |
    AWSCloudTrail
    | where TimeGenerated > ago(90d)
    | where EventName in ("SetSecurityGroups", "AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress", "CreateSecurityGroup", "ModifySecurityGroupRules")
    | where ErrorCode == ""
    | project TimeGenerated, EventName, UserIdentityArn, SourceIpAddress, UserAgent, RequestParameters, ResponseElements, AWSRegion, EventSource
  aql: |
    SELECT eventtime, username, sourceip, "EventName" AS event_action, "ResourceName", "ErrorCode", COUNT(*) AS event_count
    FROM events
    WHERE LOGSOURCETYPENAME(devicetype) ILIKE '%CloudTrail%'
      AND "EventName" IN ('SetSecurityGroups','AuthorizeSecurityGroupEgress','AuthorizeSecurityGroupIngress','CreateSecurityGroup','ModifySecurityGroupRules')
      AND ("ErrorCode" IS NULL OR "ErrorCode" = '')
    GROUP BY eventtime, username, sourceip, "EventName", "ResourceName", "ErrorCode"
    LAST 24 HOURS
  yara_l: "rule aws_security_group_modification {\n  meta:\n    author = \"TDL\"\n    description = \"Detects AWS security group modifications\
    \ that could be used for persistence or defense evasion\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique = \"T1562\"\
    \n    severity = \"Medium\"\n    \n  events:\n    $e.metadata.product_event_type = \"AwsApiCall\"\n    $e.metadata.vendor_name = \"Amazon\"\
    \n    $e.metadata.product_name = \"AWS CloudTrail\"\n    (\n      $e.target.resource.name = \"SetSecurityGroups\" or\n      $e.target.resource.name\
    \ = \"AuthorizeSecurityGroupEgress\" or\n      $e.target.resource.name = \"AuthorizeSecurityGroupIngress\" or\n      $e.target.resource.name\
    \ = \"CreateSecurityGroup\" or\n      $e.target.resource.name = \"ModifySecurityGroupRules\"\n    )\n    $e.security_result.action = \"ALLOW\"\
    \n    $e.principal.user.userid = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-aws.cloudtrail*
    | WHERE event.action IN ("SetSecurityGroups", "AuthorizeSecurityGroupEgress", "AuthorizeSecurityGroupIngress", "CreateSecurityGroup", "ModifySecurityGroupRules")
      AND event.outcome == "success"
    | KEEP @timestamp, cloud.account.id, cloud.region, user.name, source.ip, event.action, aws.cloudtrail.request_parameters, aws.cloudtrail.response_elements
  leql: |
    where(source_json.eventName IN [SetSecurityGroups, AuthorizeSecurityGroupEgress, AuthorizeSecurityGroupIngress, CreateSecurityGroup, ModifySecurityGroupRules] AND source_json.errorCode NOT EXISTS)
  crowdstrike: |
    #repo=cloudtrail eventName IN ["SetSecurityGroups","AuthorizeSecurityGroupEgress","AuthorizeSecurityGroupIngress","CreateSecurityGroup","ModifySecurityGroupRules"] errorCode!=*
    | table([@timestamp, userIdentity.principalId, eventName, sourceIPAddress, awsRegion, requestParameters, responseElements])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"AWS\" \n  and operation_name in (\"SetSecurityGroups\",\"AuthorizeSecurityGroupEgress\"\
    ,\"AuthorizeSecurityGroupIngress\",\"CreateSecurityGroup\",\"ModifySecurityGroupRules\")\n  and operation_status = \"Success\"\n| fields _time,\
    \ cloud_provider, operation_name, operation_status, identity_name, resource_name, raw_log\n"
  lucene: |
    eventSource:ec2.amazonaws.com AND eventName:(SetSecurityGroups OR AuthorizeSecurityGroupEgress OR AuthorizeSecurityGroupIngress OR CreateSecurityGroup OR ModifySecurityGroupRules) AND errorCode:success
  sumo: |
    _sourceCategory=*CloudTrail*
    | json field=_raw "eventName" as event_name
    | json field=_raw "errorCode" as error_code
    | where event_name in ("SetSecurityGroups","AuthorizeSecurityGroupEgress","AuthorizeSecurityGroupIngress","CreateSecurityGroup","ModifySecurityGroupRules")
    | where isNull(error_code) or error_code = ""
    | fields _messageTime, event_name, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 14 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 AWS CloudTrail Event

  Where the Event is in ["SetSecurityGroups","AuthorizeSecurityGroupEgress","AuthorizeSecurityGroupIngress","CreateSecurityGroup ","ModifySecurityGroupRules"]

  Where Action is in [Success]'
suppression:
  window: 12 hours
tuning_period: 14 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000374
v4_id: '000374'
name: Azure Guest User Privilege Escalation
description: Detects the change of user type from "Guest" to "Member" for potential elevation of privilege.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Azure
data_sources:
- Azure AD
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=azure sourcetype="azure:aad:audit" operationName="Update user" properties.targetResources{}.modifiedProperties{}.newValue="*member*"

    | eval targetUser=mvindex(''properties.targetResources{}.userPrincipalName'', 0)

    | lookup "TDL - Azure Guest Account Tracker" GuestUser as targetUser OUTPUT GuestUser

    | where isnotnull(GuestUser)

    | table _time, properties.initiatedBy.user.userPrincipalName, targetUser, properties.targetResources{}.modifiedProperties{}.displayName, properties.targetResources{}.modifiedProperties{}.newValue

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName =~ "update user"
    | mv-expand TargetResources
    | mv-expand TargetResources.modifiedProperties
    | where TargetResources_modifiedProperties.newValue has "member"
    | extend TargetUser = tostring(TargetResources.userPrincipalName)
    | join kind=inner (
        _GetWatchlist('TDL - Azure Guest Account Tracker')
        | extend GuestUser = tostring(SearchKey)
    ) on $left.TargetUser == $right.GuestUser
    | project TimeGenerated, OperationName, TargetUser, InitiatedBy = tostring(InitiatedBy.user.userPrincipalName), modifiedProperty = tostring(TargetResources_modifiedProperties.displayName), newValue = tostring(TargetResources_modifiedProperties.newValue), ActivityDisplayName, CorrelationId
  aql: |
    SELECT username, "Azure AD Event Name", "Modified Property", "Modified Property New Value", "Target User", LOGSOURCENAME(logsourceid) AS log_source, eventtime
    FROM events
    WHERE "Azure AD Event Name" ILIKE '%update user%'
      AND "Modified Property New Value" ILIKE '%member%'
      AND "Target User" IN (SELECT "Guest User" FROM REFERENCE_SET('TDL - Azure Guest Account Tracker'))
    LAST 24 HOURS
  yara_l: |
    rule azure_guest_user_modified_to_member {
      meta:
        author = "TDL"
        description = "Detects Azure AD guest users modified to member accounts (T1098 - Persistence)"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Azure Active Directory"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        re.regex($e.metadata.product_event_type, `(?i)update user`)
        re.regex($e.about.resource.attribute.labels["modified_property_new_value"], `(?i)member`)
        $e.target.user.userid = $target_user
        $e.principal.hostname = $host

      match:
        $target_user over 5m

      outcome:
        $risk_score = 85

      condition:
        $e and #target_user in %azure_guest_account_tracker
    }
  esql: |
    FROM logs-azure.auditlogs*
    | WHERE @timestamp > NOW() - 24 hours
      AND azure.auditlogs.operation_name == "Update user"
      AND azure.auditlogs.properties.target_resources.modified_properties.new_value == "member"
    | ENRICH TDL_Azure_Guest_Account_Tracker ON azure.auditlogs.properties.target_resources.user_principal_name
    | KEEP @timestamp, azure.auditlogs.operation_name, azure.auditlogs.properties.target_resources.user_principal_name, azure.auditlogs.properties.initiated_by.user.user_principal_name, azure.auditlogs.properties.target_resources.modified_properties.new_value
  leql: |
    where(source_json.operationName="Update user" AND source_json.targetResources.modifiedProperties.newValue ICONTAINS "member" AND source_json.targetResources.userPrincipalName IN lookup:"TDL - Azure Guest Account Tracker")
  crowdstrike: "#repo=azure* event_name=\"Update user\" \n| ModifiedProperties=*\"Member\"*\n| match(file=\"TDL - Azure Guest Account Tracker.csv\"\
    , field=TargetUserPrincipalName, include=[GuestUser], ignoreCase=true, strict=false)\n| TargetUserPrincipalName=GuestUser\n| table([@timestamp,\
    \ TargetUserPrincipalName, InitiatedBy, ModifiedProperties, event_name])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "AZURE" and cloud_application = "AAD"
    | filter operation_name = "Update user"
    | filter json_extract_scalar(additional_data, "$.ModifiedProperties[*].NewValue") contains "member"
    | alter target_user_upn = coalesce(identity_sub_type, identity_name, affected_user)
    | lookup azure_guest_account_tracker on target_user_upn = guest_user_upn
    | filter guest_user_upn != null
    | fields _time, operation_name, identity_name, target_user_upn, additional_data, cloud_resource
  lucene: |
    event.action:"Update user" AND properties.targetResources.modifiedProperties.newValue:*member* AND properties.targetResources.userPrincipalName:*#EXT#*
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*AzureAD* OR _sourceCategory=*azure*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.targetResources[*].modifiedProperties" as modified_properties
    | json field=_raw "properties.targetResources[*].userPrincipalName" as target_user
    | where operation_name matches "*update user*" OR operation_name matches "*Update user*"
    | where modified_properties matches "*member*"
    | lookup email from shared://AzureGuestAccountTracker on target_user = email
    | where !isNull(email)
    | fields _messageTime, operation_name, target_user, modified_properties, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where the Event Name is in [update user]

  Where the modified property new value is in [member]

  Where the target user matches the Guest User in lookup [TDL - Azure Guest Account Tracker]'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000395
v4_id: 000395
name: AWS New or Recently Modified Binary Executed - GuardDuty
description: Detects when a newly created or recently modified binary is executed in AWS
tactic: Persistence
tactic_id: TA0003
technique_id: T1554
technique_name: Compromise Host Software Binary
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=guardduty sourcetype=aws:cloudwatchlogs:guardduty detail.type="Execution:Runtime/NewBinaryExecuted"

    | table _time, detail.resource.instanceDetails.instanceId, detail.service.action.runtimeDetails.process.name, detail.service.action.runtimeDetails.process.executablePath,
    detail.accountId, detail.region, detail.severity

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(1h)
    | where Title has "Execution:Runtime/NewBinaryExecuted"
    | project TimeGenerated, Title, Description, Severity, AccountId, Region, ResourceType, InstanceId = tostring(Resource.InstanceDetails.InstanceId), ImageId = tostring(Resource.InstanceDetails.ImageId), BinaryPath = tostring(Service.AdditionalInfo.ExecutablePath), BinaryHashSha256 = tostring(Service.AdditionalInfo.ExecutableSha256)
  aql: |
    SELECT QIDNAME(qid) AS event_name, sourceip, destinationip, username, LOGSOURCENAME(logsourceid) AS log_source, eventtime, "Event Type" AS event_type, "Resource Type" AS resource_type, "Instance ID" AS instance_id, "Description" AS description
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%' AND "Event Type" = 'Execution:Runtime/NewBinaryExecuted'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_new_binary_executed {
      meta:
        author = "TDL"
        description = "Detects GuardDuty alerts for new binary execution on AWS runtime"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1554"
        platform = "AWS"

      events:
        $e.metadata.vendor_name = "Amazon Web Services"
        $e.metadata.product_name = "GuardDuty"
        $e.metadata.product_event_type = "Execution:Runtime/NewBinaryExecuted"
        $e.principal.resource.id = $resource_id

      match:
        $resource_id over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE @timestamp > NOW() - 24 hours AND event.type IN ("Execution:Runtime/NewBinaryExecuted")
    | KEEP @timestamp, cloud.account.id, cloud.region, event.type, aws.guardduty.resource.instanceDetails.instanceId, host.name, process.name, process.executable
  leql: |
    where(source_json.type IN ["Execution:Runtime/NewBinaryExecuted"])
  crowdstrike: |
    #repo=guardduty event.type="Execution:Runtime/NewBinaryExecuted"
    | table([@timestamp, account.id, resource.instanceDetails.instanceId, service.additionalInfo.newBinaryName, severity])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and product = "GuardDuty" and event_type in ("Execution:Runtime/NewBinaryExecuted")
    | fields _time, cloud_provider_account_id, cloud_region, resource_name, event_type, event_description, severity
  lucene: |
    event.type:"Execution:Runtime/NewBinaryExecuted"
  sumo: |
    _sourceCategory=*GuardDuty* OR _sourceCategory=*guardduty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Execution:Runtime/NewBinaryExecuted")
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Runtime/NewBinaryExecuted\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000396
v4_id: 000396
name: AWS New or Recently Modified Library Loaded - GuardDuty
description: Detects a newly created or recently modified library is loaded in AWS
tactic: Persistence
tactic_id: TA0003
technique_id: T1543
technique_name: Create or Modify System Process
platform:
- AWS
data_sources:
- AWS GuardDuty
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=aws sourcetype=aws:cloudwatchlogs:guardduty eventType IN ("Execution:Runtime/NewLibraryLoaded")

    | table _time, accountId, region, service.action.actionType, resource.instanceDetails.instanceId, service.additionalInfo.threatName, severity

    '
  kql: |
    AWSGuardDuty
    | where TimeGenerated > ago(24h)
    | where ActivityType in ("Execution:Runtime/NewLibraryLoaded")
    | project TimeGenerated, ActivityType, AccountId, Region, ResourceType, Title, Description, Severity, ThreatName, ThreatFamilyName, ResourceId, ServiceName
  aql: |
    SELECT eventtime, sourceip, destinationip, qidname(qid), LOGSOURCENAME(logsourceid), "finding.type" AS finding_type, "finding.id" AS finding_id, "resource.instanceDetails.instanceId" AS instance_id, "service.additionalInfo.loadedLibraryName" AS library_name
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%GuardDuty%'
      AND "finding.type" = 'Execution:Runtime/NewLibraryLoaded'
    LAST 24 HOURS
  yara_l: |
    rule aws_guardduty_new_library_loaded {
      meta:
        author = "Detection Engineer"
        description = "Detects AWS GuardDuty findings for new library loaded at runtime indicating potential persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1543"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Amazon GuardDuty"
        $e.metadata.product_event_type = "Execution:Runtime/NewLibraryLoaded"
        $e.principal.cloud.environment = "AMAZON_WEB_SERVICES"

      match:
        $e.principal.resource.name over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-aws.guardduty*
    | WHERE event.type == "Execution:Runtime/NewLibraryLoaded"
    | KEEP @timestamp, cloud.account.id, cloud.region, aws.guardduty.finding_id, aws.guardduty.severity, aws.guardduty.resource.instance_details.instance_id, event.original
  leql: |
    where(source_json.type IN ["Execution:Runtime/NewLibraryLoaded"])
  crowdstrike: |
    #type=guardduty "detail.type"="Execution:Runtime/NewLibraryLoaded"
    | table([@timestamp, "detail.resource.instanceDetails.instanceId", "detail.resource.resourceType", "detail.service.additionalInfo.newLibraryLoadedDetails.name", "detail.severity"])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "AWS" and logtype = "guardduty"
    | filter json_extract_scalar(raw_log, "$.type") in ("Execution:Runtime/NewLibraryLoaded")
    | fields _time, cloud_provider_account, cloud_provider_region, json_extract_scalar(raw_log, "$.type") as finding_type, json_extract_scalar(raw_log, "$.severity") as severity, json_extract_scalar(raw_log, "$.resource.instanceDetails.instanceId") as instance_id, json_extract_scalar(raw_log, "$.title") as title, json_extract_scalar(raw_log, "$.description") as description
  lucene: |
    event.type:"Execution:Runtime/NewLibraryLoaded"
  sumo: |
    _sourceCategory=*guardduty* OR _sourceCategory=*GuardDuty* OR _source=*guardduty*
    | json field=_raw "type" as event_type
    | where event_type in ("Execution:Runtime/NewLibraryLoaded")
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: "1 Guard Duty Event \nWhere the Event Type is in [\"Execution:Runtime/NewLibraryLoaded\"]"
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

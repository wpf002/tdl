rule_id: TDL-PER-000540
v4_id: '000540'
name: User Added to Enterprise Owner
description: Detect when a enterprise owner has been added.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Github
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=github sourcetype=github:audit action="business.add_admin"

    | table _time, actor, action, user, org, repo, business

    '
  kql: |
    GitHubAuditLogPolling_CL
    | where TimeGenerated > ago(90d)
    | where action_s == "business.add_admin"
    | project TimeGenerated, actor_s, user_s, org_s, action_s, repo_s, created_at_t
  aql: |
    SELECT eventtime, username, sourceip, "action", "actor", "business", QIDNAME(qid), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE "action" = 'business.add_admin'
    LAST 24 HOURS
  yara_l: |
    rule github_admin_added_persistence {
      meta:
        author = "Detection Engineer"
        description = "Detects addition of GitHub organization admins - T1098 Persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "GITHUB"
        $e.metadata.product_event_type = "business.add_admin"
        $e.principal.user.userid = $actor

      match:
        $actor over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-github.audit*
    | WHERE event.action == "business.add_admin"
    | KEEP @timestamp, github.actor, github.org, github.user, github.business, event.action
  leql: |
    where(source_json.action="business.add_admin")
  crowdstrike: |
    #type=github action=business.add_admin
    | table([@timestamp, actor, org, user, action])
  xql: |
    dataset = github_audit_raw
    | filter action = "business.add_admin"
    | fields _time, actor, action, business, user
  lucene: |
    actions:"business.add_admin"
  sumo: |
    _sourceCategory=*Github* "business.add_admin"
    | json field=_raw "action" as action
    | where action = "business.add_admin"
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions is \"business.add_admin\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

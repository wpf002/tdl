rule_id: TDL-PER-000541
v4_id: '000541'
name: Access Token Genrated from Malcious IP
description: Detects when an Personal Access Token has been created from an IP that resides on the Threat Intel Feed.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Github
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=github sourcetype=github:audit action="personal_access_token.request_created"

    | lookup threat_intel_ip_list ip as actor_ip OUTPUT threat_score

    | where isnotnull(threat_score)

    | table _time, actor, actor_ip, org, repo, threat_score

    '
  kql: "let ThreatFeeds = \n    ThreatIntelligenceIndicator\n    | where TimeGenerated > ago(14d)\n    | where isnotempty(NetworkIP)\n    | summarize\
    \ by NetworkIP;\nGitHubAuditLogPollingFunction_CL\n| where TimeGenerated > ago(24h)\n| where action_s == \"personal_access_token.request_created\"\
    \n| extend SourceIP = tostring(parse_json(actor_location_s).country_code)\n| extend ActorIP = tostring(parse_json(data_s).client_ip)\n| where\
    \ isnotempty(ActorIP)\n| join kind=inner (ThreatFeeds) on $left.ActorIP == $right.NetworkIP\n| project TimeGenerated, action_s, actor_s, ActorIP,\
    \ repo_s, org_s, data_s\n"
  aql: |
    SELECT sourceip, username, "action" AS github_action, eventtime, LOGSOURCENAME(logsourceid) AS log_source, COUNT(*) AS event_count
    FROM events
    WHERE "action" = 'personal_access_token.request_created'
      AND sourceip IN (SELECT sourceip FROM events WHERE category IN (SELECT category FROM categories WHERE low_level_category_id IN (SELECT id FROM category_definitions WHERE name LIKE '%Threat%')))
    LAST 24 HOURS
    ```

    However, the correct QRadar AQL query for this detection should be:

    SELECT sourceip, username, "action", eventtime, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "action" = 'personal_access_token.request_created'
      AND sourceip IN (SELECT sourceaddress FROM reference_set('ThreatIntelligence_IPs'))
    LAST 24 HOURS
  yara_l: |
    rule github_pat_request_from_threat_ip {
      meta:
        author = "TDL"
        description = "Detects GitHub personal access token request from IP on threat feed - T1098"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "HIGH"

      events:
        $gh.metadata.product_name = "Github"
        $gh.metadata.product_event_type = "personal_access_token.request_created"
        $gh.principal.ip = $ip

        $threat.graph.metadata.entity_type = "IP_ADDRESS"
        $threat.graph.metadata.threat.threat_feed_name != ""
        $threat.graph.entity.ip = $ip

      match:
        $ip over 5m

      outcome:
        $risk_score = 85
        $user = $gh.principal.user.userid
        $threat_feed = array_distinct($threat.graph.metadata.threat.threat_feed_name)

      condition:
        $gh and $threat
    }
  esql: |
    FROM logs-github*
    | WHERE event.action == "personal_access_token.request_created"
    | ENRICH threat_feed ON source.ip
    | WHERE threat.indicator.ip IS NOT NULL
    | KEEP @timestamp, user.name, source.ip, threat.indicator.ip, threat.indicator.type, host.name, event.action
  leql: |
    where(source_json.action="personal_access_token.request_created" AND source_address IN threat_feed)
  crowdstrike: |
    #repo=github action=personal_access_token.request_created
    | lookup(file="threat_feed.csv", field=actor_ip, include=[threat_indicator], strict=false)
    | threat_indicator=*
    | table([@timestamp, actor, actor_ip, threat_indicator, org, repo])
  xql: |
    dataset = github_audit_logs
    | filter action = "personal_access_token.request_created"
    | alter is_threat_ip = incidr(actor_ip, "THREAT_FEED")
    | filter is_threat_ip = true
    | fields _time, actor, actor_ip, action, repo, org
  lucene: |
    actions:"personal_access_token.request_created" AND threat_feed:true
  sumo: |
    _sourceCategory=*Github* "personal_access_token.request_created"
    | json field=_raw "action" as action
    | json field=_raw "actor_ip" as actor_ip
    | where action = "personal_access_token.request_created"
    | lookup type, malicious_confidence, threat_intel from sumo://threat/cs on threat=actor_ip
    | where type = "ip_address" and !isNull(malicious_confidence)
    | fields _messageTime, action, actor_ip, malicious_confidence, threat_intel
false_positives:
- Authorized scanners
- Monitoring agents
tuning_guidance: Tune per environment baseline.
tags:
- net
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Github event\n   where actions is \"personal_access_token.request_created\"\nAND\n   IP is on Threat Feed"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

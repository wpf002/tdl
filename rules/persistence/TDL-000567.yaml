rule_id: TDL-PER-000567
v4_id: '000567'
name: First Seen Kubernetes Admission Controller Created by IP Address
description: Detects a kubernetes admission controller being created by IP address not see in the last 90 days
tactic: Persistence
tactic_id: TA0003
technique_id: T1546
technique_name: Event Triggered Execution
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes verb IN ("patch","create","replace") objectRef.resource IN ("validatingwebhookconfigurations","mutatingwebhookconfigurations")
    responseStatus.code=2*

    | bin _time span=1d

    | eventstats earliest(_time) as first_seen by sourceIPs{}

    | eval days_since_first_seen = (now() - first_seen) / 86400

    | where days_since_first_seen <= 30

    | stats count dc(sourceIPs{}) as unique_source_ips values(sourceIPs{}) as source_ips by objectRef.resource, verb, user.username, objectRef.name

    | where unique_source_ips > 0

    '
  kql: "let baseline_period = 30d;\nlet detection_period = 1d;\nlet baseline_ips = \n    KubeEvents\n    | where TimeGenerated between (ago(baseline_period\
    \ + detection_period) .. ago(detection_period))\n    | where ObjectKind in (\"ValidatingWebhookConfiguration\", \"MutatingWebhookConfiguration\"\
    )\n    | where Verb in (\"patch\", \"create\", \"replace\")\n    | where ResponseCode startswith \"2\"\n    | summarize by SourceIp\n    |\
    \ project SourceIp;\nKubeEvents\n| where TimeGenerated > ago(detection_period)\n| where ObjectKind in (\"ValidatingWebhookConfiguration\"\
    , \"MutatingWebhookConfiguration\")\n| where Verb in (\"patch\", \"create\", \"replace\")\n| where ResponseCode startswith \"2\"\n| where\
    \ SourceIp !in (baseline_ips)\n| project TimeGenerated, SourceIp, Verb, ObjectKind, ResponseCode, Namespace, ObjectName, User = tostring(parse_json(RequestObject).metadata.name)\n"
  aql: |
    SELECT sourceip, FIRST(eventtime) AS first_seen, COUNT(*) AS occurrences, QIDNAME(qid) AS event_name
    FROM events
    WHERE (UTF8(payload) ILIKE '%"verb":"patch"%' OR UTF8(payload) ILIKE '%"verb":"create"%' OR UTF8(payload) ILIKE '%"verb":"replace"%')
      AND (UTF8(payload) ILIKE '%"kind":"ValidatingWebhookConfiguration"%' OR UTF8(payload) ILIKE '%"kind":"MutatingWebhookConfiguration"%')
      AND UTF8(payload) MATCHES '.*"responseStatus".*"code":\s*2[0-9]{2}.*'
    GROUP BY sourceip
    LAST 30 DAYS
  yara_l: "rule kubernetes_webhook_configuration_persistence {\n  meta:\n    author = \"TDL\"\n    description = \"Detects creation/modification\
    \ of Kubernetes webhook configurations which may indicate persistence attempts (T1546)\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique\
    \ = \"T1546\"\n    severity = \"MEDIUM\"\n    \n  events:\n    $e.metadata.product_name = \"Kubernetes\"\n    (\n      $e.metadata.product_event_type\
    \ = \"patch\" or\n      $e.metadata.product_event_type = \"create\" or\n      $e.metadata.product_event_type = \"replace\"\n    )\n    (\n\
    \      $e.target.resource.name = \"ValidatingWebhookConfiguration\" or\n      $e.target.resource.name = \"MutatingWebhookConfiguration\"\n\
    \    )\n    re.regex($e.security_result.summary, `^2.*`)\n    $e.principal.ip = $source_ip\n    \n  match:\n    $source_ip over 30d\n    \n\
    \  outcome:\n    $risk_score = 50\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE @timestamp > NOW() - 90 days
      AND (kubernetes.audit.verb == "patch" OR kubernetes.audit.verb == "create" OR kubernetes.audit.verb == "replace")
      AND kubernetes.audit.objectRef.resource IN ("validatingwebhookconfigurations", "mutatingwebhookconfigurations")
      AND TO_STRING(kubernetes.audit.responseStatus.code) RLIKE "2.*"
    | EVAL baseline_start = NOW() - 90 days
    | EVAL baseline_end = NOW() - 30 days
    | EVAL is_baseline = CASE(@timestamp >= baseline_start AND @timestamp < baseline_end, 1, 0)
    | EVAL is_recent = CASE(@timestamp >= baseline_end, 1, 0)
    | STATS baseline_ips = COUNT_DISTINCT(source.ip) BY is_baseline, source.ip
    | WHERE is_baseline == 0
    | STATS recent_count = COUNT(*) BY source.ip
    | WHERE recent_count > 0
    | KEEP source.ip, recent_count
  leql: |
    where(source_json.verb IN ["patch", "create", "replace"] AND source_json.objectRef.resource IN ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"] AND source_json.responseStatus.code=/^2.*/) groupby(source_address) calculate(count)
  crowdstrike: |
    #type=kubernetes Verb in (patch, create, replace) Kind in (ValidatingWebhookConfiguration, MutatingWebhookConfiguration) ResponseCode=/2.*/
    | groupBy([SourceIP], function=count(as=events))
    | table([SourceIP, events])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "GCP" and resource_type = "k8s_cluster"
    | filter json_extract_scalar(resource_json_string, "$.requestObject.kind") in ("ValidatingWebhookConfiguration", "MutatingWebhookConfiguration")
    | filter json_extract_scalar(resource_json_string, "$.verb") in ("patch", "create", "replace")
    | filter to_string(http_response_code_cis) ~= "^2.*"
    | alter source_ip = coalesce(json_extract_scalar(resource_json_string, "$.sourceIPs[0]"), caller_ip_address)
    | comp count_distinct(agent_id) as baseline_count by source_ip
    | filter _time >= timestamp_add(current_time(), INTERVAL -30 DAY)
    | join type=left (dataset = cloud_audit_logs | filter cloud_provider = "GCP" and resource_type = "k8s_cluster" | filter json_extract_scalar(resource_json_string, "$.requestObject.kind") in ("ValidatingWebhookConfiguration", "MutatingWebhookConfiguration") | filter json_extract_scalar(resource_json_string, "$.verb") in ("patch", "create", "replace") | filter to_string(http_response_code_cis) ~= "^2.*" | filter _time >= timestamp_add(current_time(), INTERVAL -90 DAY) and _time < timestamp_add(current_time(), INTERVAL -30 DAY) | alter historical_source_ip = coalesce(json_extract_scalar(resource_json_string, "$.sourceIPs[0]"), caller_ip_address) | comp count() as historical_count by historical_source_ip) as historical_data historical_data.historical_source_ip = source_ip
    | filter historical_data.historical_count = null or historical_data.historical_count = 0
    | fields _time, source_ip, baseline_count
  lucene: |
    verb:("patch" OR "create" OR "replace") AND objectRef.resource:("validatingwebhookconfigurations" OR "mutatingwebhookconfigurations") AND responseStatus.code:2*
  sumo: |
    _sourceCategory=*kubernetes* (verb="patch" OR verb="create" OR verb="replace") AND (objectRef.resource="validatingwebhookconfigurations" OR objectRef.resource="mutatingwebhookconfigurations") AND responseStatus.code="2*"
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as kind
    | json field=_raw "responseStatus.code" as response_code
    | json field=_raw "sourceIPs[0]" as source_ip
    | where verb in ("patch", "create", "replace")
    | where kind in ("validatingwebhookconfigurations", "mutatingwebhookconfigurations")
    | where response_code matches "2*"
    | timeslice 1d
    | count_distinct(_timeslice) as days_seen by source_ip
    | where days_seen <= 1
    | fields source_ip, days_seen
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nOR\n    Where Verb is \"patch\"\n\n    Where Verb is \"create\"\n\n    Where Verb is \"replace\"\n\nWhere\
  \ Kind in (\"ValidatingWebhookConfiguration\", \"MutatingWebhookConfiguration\")\nWhere the Response Code matches \"2.*\"\n\nBaseline Learning:\
  \ 30 Days\nRetention: 90 Days\n\nNew Value: Source IP"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000614
v4_id: '000614'
name: User Password Set to Never Expire
description: A rule that detects when an end user's password is set to never expire.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 4738'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=4738 UserAccountControl="%%2089"

    | table _time, ComputerName, Account_Name, UserAccountControl, TargetUserName, SubjectUserName

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4738
    | where UserAccountControl == "%%2089"
    | project TimeGenerated, Computer, Account, TargetAccount, SubjectUserName, UserAccountControl, Activity, EventData
  aql: |
    SELECT eventtime, username, sourceip, "Target Username", "User Account Control", LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE "EventID" = '4738'
      AND "User Account Control" = '%%2089'
    LAST 24 HOURS
  yara_l: "rule windows_user_account_password_not_required {\n  meta:\n    author = \"TDL\"\n    description = \"Detects Windows user account\
    \ modification where password is not required (T1098 - Account Manipulation)\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique\
    \ = \"T1098\"\n    severity = \"Medium\"\n  \n  events:\n    $e.metadata.event_type = \"USER_ACCOUNT_MODIFICATION\"\n    $e.metadata.product_event_type\
    \ = \"4738\"\n    $e.metadata.vendor_name = \"Microsoft\"\n    $e.metadata.product_name = \"Windows\"\n    re.regex($e.security_result.summary,\
    \ `%%2089`) or\n    re.regex($e.target.resource.attribute.labels.value, `%%2089`)\n    $e.principal.hostname = $host\n    $e.target.user.userid\
    \ = $user\n  \n  match:\n    $host, $user over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.security*, logs-system.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.code == "4738"
      AND winlog.event_data.UserAccountControl == "%%2089"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.TargetUserName, winlog.event_data.SubjectUserName, winlog.event_data.UserAccountControl, event.code
  leql: |
    where(source_json.EventID=4738 AND source_json.UserAccountControl="%%2089")
  crowdstrike: |
    EventCode=4738 UserAccountControl="%%2089"
    | table([@timestamp, ComputerName, TargetUserName, SubjectUserName, UserAccountControl])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4738 and action_evtlog_message contains "%%2089"
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_SubjectUserName, action_evtlog_message
  lucene: |
    event.code:4738 AND winlog.event_data.UserAccountControl:"%%2089"
  sumo: |
    _sourceCategory=*Windows*Security* "4738"
    | json field=_raw "EventID" as event_id
    | json field=_raw "UserAccountControl" as user_account_control
    | where event_id = "4738" and user_account_control = "%%2089"
    | fields _messageTime, _sourceHost, event_id, user_account_control
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows User Account Change Event

  Where the Event ID is in [4738]

  Where the UserAccountControl is "%%2089"'
suppression:
  window: 12 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

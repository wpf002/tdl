rule_id: TDL-PER-000625
v4_id: '000625'
name: Potential GraphRunner Invoke-InjectOAuthApp Usage
description: Designed to detect activities associated with the usage of GraphRunner, a post exploit toolset for interacting with the Microsoft
  Graph API
tactic: Persistence
tactic_id: TA0003
technique_id: T1133
technique_name: External Remote Services
platform:
- Azure
data_sources:
- Azure
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=azure sourcetype=azure:audit (("Additional Details"="*PowerShell*") OR (Operation_Name="Add application") OR (Operation_Name="*Update
    application*"))

    | table _time, User, Operation_Name, "Additional Details", Result, Target_Resource, Caller_IP_Address

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(90d)
    | where (OperationName has "Update application" or OperationName == "Add application")
    | extend AdditionalDetailsString = tostring(AdditionalDetails)
    | where AdditionalDetailsString has "PowerShell" or OperationName == "Add application"
    | project TimeGenerated, OperationName, Identity, TargetResources, ActivityDisplayName, Result, AdditionalDetails, InitiatedBy, CorrelationId
  aql: |
    SELECT eventtime, username, "Operation Name", "Additional Details", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE (LOWER("Additional Details") LIKE '%powershell%' OR "Operation Name" = 'Add application' OR "Operation Name" LIKE '%Update application%')
      AND (logsourceid IN (SELECT logsourceid FROM logssources WHERE logsourcetypename ILIKE '%azure%') OR LOGSOURCENAME(logsourceid) ILIKE '%azure%')
    LAST 24 HOURS
  yara_l: |
    rule azure_external_remote_services_persistence {
      meta:
        author = "TDL"
        description = "Detects T1133 External Remote Services persistence via Azure application modifications"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1133"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "MICROSOFT"
        $e.metadata.product_name = "AZURE"
        $e.metadata.event_type = "SYSTEM_AUDIT_LOG_UNCATEGORIZED"
        (
          re.regex($e.security_result.summary, `(?i)PowerShell`) or
          $e.target.resource.name = "Add application" or
          re.regex($e.target.resource.name, `(?i)Update application`)
        )
        $e.principal.user.userid = $user
        $e.target.resource.name = $operation

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-azure*
    | WHERE event.dataset == "azure.auditlogs" OR event.dataset == "azure.activitylogs"
    | WHERE (azure.auditlogs.properties.additional_details LIKE "*PowerShell*" OR azure.activitylogs.properties.additional_details LIKE "*PowerShell*" OR event.action == "Add application" OR azure.auditlogs.operation_name == "Add application" OR azure.activitylogs.operation_name == "Add application") OR (event.action LIKE "*Update application*" OR azure.auditlogs.operation_name LIKE "*Update application*" OR azure.activitylogs.operation_name LIKE "*Update application*")
    | KEEP @timestamp, event.action, azure.auditlogs.operation_name, azure.activitylogs.operation_name, azure.auditlogs.properties.additional_details, azure.activitylogs.properties.additional_details, azure.auditlogs.properties.target_resources, user.name, source.ip
  leql: |
    where((source_json.properties.additionalDetails ICONTAINS "PowerShell" OR source_json.operationName="Add application") AND source_json.operationName ICONTAINS "Update application")
  crowdstrike: "#type=azure:audit \n(AdditionalDetails=*PowerShell* OR OperationName=\"Add application\" OR OperationName=*Update*application*)\n\
    | table([@timestamp, OperationName, Identity, AdditionalDetails, ResultDescription, IPAddress])\n"
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "azure"
      and (
        (vendor_event_action ~= "(?i)update.*application")
        or (vendor_event_action = "Add application")
        or (raw_log ~= "(?i)PowerShell" and vendor_event_type = "AuditEvent")
      )
    | fields _time, vendor_event_action, actor_user, resource_name, raw_log
  lucene: |
    (AdditionalDetails:*PowerShell* OR OperationName:"Add application") AND OperationName:*Update?application*
  sumo: |
    _sourceCategory=*Azure* (PowerShell OR "Add application" OR "Update application")
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.additionalDetails" as additional_details
    | where (additional_details matches "*PowerShell*") OR (operation_name = "Add application") OR (operation_name matches "*Update application*")
    | fields _messageTime, _sourceHost, operation_name, additional_details
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Azure Audit Event \nWhere the Additional Details contains \"PowerShell\"\nOR\nWhere the Operation Name is \"Add application\"\
  \n\nWhere the Operation Name contains \"Update application\""
suppression:
  window: 12 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

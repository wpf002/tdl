rule_id: TDL-PER-000646
v4_id: '000646'
name: Ransomware Remnants Discovered - Varonis
description: Detects remnants of ransomware identified on a host or backup image.
tactic: Persistence
tactic_id: TA0003
technique_id: T1547
technique_name: Boot or Logon Autostart Execution
platform:
- Windows
data_sources:
- Varonis
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=varonis sourcetype=varonis:datadvantage alert_name IN ("Old ransomware note was found in the system", "Past ransomware activity
    indicated by a residual ransomware note")

    | table _time, host, alert_name, user, file_path, severity, description

    '
  kql: |
    DatAlert
    | where TimeGenerated > ago(24h)
    | where AlertName in ("Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note")
    | project TimeGenerated, AlertName, AlertSeverity, UserName, DeviceName, FilePath, Description
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS log_source, "Alert Name", sourceip, username, "File Path", "Device Name"
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Varonis%'
      AND "Alert Name" IN ('Old ransomware note was found in the system', 'Past ransomware activity indicated by a residual ransomware note')
    LAST 24 HOURS
  yara_l: "rule varonis_ransomware_note_detected {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects Varonis DatAdvantage\
    \ alerts for old or residual ransomware notes indicating past ransomware activity\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique\
    \ = \"T1547\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.vendor_name = \"Varonis\"\n    $e.metadata.product_name = \"DatAdvantage\"\
    \n    (\n      $e.security_result.summary = \"Old ransomware note was found in the system\" or\n      $e.security_result.summary = \"Past\
    \ ransomware activity indicated by a residual ransomware note\"\n    )\n    $e.principal.hostname = $host\n    \n  match:\n    $host over\
    \ 5m\n    \n  outcome:\n    $risk_score = max(85)\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-varonis.datadvantage*
    | WHERE varonis.alert.name IN ("Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note")
    | KEEP @timestamp, host.name, user.name, varonis.alert.name, varonis.alert.description, file.path, source.ip
  leql: |
    where(source_json.AlertName IN ["Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note"])
  crowdstrike: |
    #repo=varonis #type=datadvantage_alert
    | AlertName in ["Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note"]
    | table([@timestamp, ComputerName, AlertName, FilePath, UserName, Severity])
  xql: |
    dataset = varonis_datadvantage_raw
    | filter alert_name in ("Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note")
    | fields _time, alert_name, alert_severity, resource_name, user_name, device_name
  lucene: |
    alert_name:("Old ransomware note was found in the system" OR "Past ransomware activity indicated by a residual ransomware note")
  sumo: |
    _sourceCategory=*Varonis* ("Old ransomware note was found in the system" OR "Past ransomware activity indicated by a residual ransomware note")
    | json field=_raw "AlertName" as alert_name
    | where alert_name in ("Old ransomware note was found in the system", "Past ransomware activity indicated by a residual ransomware note")
    | fields _messageTime, _sourceHost, alert_name
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Varonis DatAdvantage Alert

  Where the Alert Name is in ["Old ransomware note was found in the system","Past ransomware activity indicated by a residual ransomware note"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

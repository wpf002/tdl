rule_id: TDL-PER-000653
v4_id: '000653'
name: Suspicious Authentication Method Added to User Account - Azure
description: Detects a change to an authentication method which could be an indication of an attacker adding an auth method to the account so
  they can have continued access.
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Azure
data_sources:
- Azure Sign-in
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=azure sourcetype=azure:signinlogs OR sourcetype=azure:aad:audit operationName="Admin registered security info" OR properties.operationName="Admin
    registered security info" resultType=0 OR properties.resultDescription="success" OR status.errorCode=0

    | eval action=coalesce(''properties.result'', result, if(resultType=0 OR ''status.errorCode''=0, "success", "failure"))

    | where action="success"

    | table _time, user, userPrincipalName, ipAddress, properties.targetResources{}.userPrincipalName, operationName, action

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName == "Admin registered security info"
    | where Result == "success"
    | project TimeGenerated, OperationName, Result, Identity, TargetResources, InitiatedBy, AADTenantId, CorrelationId
  aql: |
    SELECT username, sourceip, destinationip, eventtime, QIDNAME(qid), CATEGORYNAME(category), LOGSOURCENAME(logsourceid)
    FROM events
    WHERE QIDNAME(qid) ILIKE '%Admin registered security info%'
      AND LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
    LAST 24 HOURS
  yara_l: "rule azure_admin_registered_security_info {\n  meta:\n    author = \"TDL\"\n    description = \"Detects successful admin registration\
    \ of security info in Azure (T1098 - Account Manipulation)\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique = \"T1098\"\
    \n    platform = \"Azure\"\n    data_source = \"Azure Sign-in\"\n  \n  events:\n    $e.metadata.product_name = \"Azure Active Directory\"\n\
    \    $e.metadata.product_event_type = \"Admin registered security info\"\n    $e.security_result.action = \"ALLOW\"\n    $e.principal.user.userid\
    \ = $user\n    $e.principal.hostname = $host\n  \n  match:\n    $user over 5m\n  \n  condition:\n    $e\n}\n"
  esql: "FROM logs-azure.signinlogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND azure.signinlogs.operation_name == \"Admin registered security\
    \ info\"\n  AND event.outcome == \"success\"\n| KEEP @timestamp, user.name, azure.signinlogs.properties.user_principal_name, source.ip, azure.signinlogs.properties.app_display_name,\
    \ host.name, azure.correlation_id\n"
  leql: |
    where(source_json.operationName="Admin registered security info" AND source_json.resultType="0")
  crowdstrike: |
    #repo=azure* OperationName="Admin registered security info" ResultType=0
    | table([@timestamp, UserPrincipalName, IPAddress, Location, AppDisplayName, DeviceDetail.operatingSystem])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and operation_name = "Admin registered security info" and outcome = "Success"
    | fields _time, identity_name, actor_caller_ip_address, operation_name, outcome, resource_name, cloud_provider_project
  lucene: |
    event.name:"Admin registered security info" AND action:success
  sumo: |
    _sourceCategory=*Azure* "Admin registered security info"
    | json field=_raw "properties.resultType" as result_type
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.userPrincipalName" as user
    | json field=_raw "properties.ipAddress" as ip_address
    | where operation_name = "Admin registered security info" and result_type = "0"
    | fields _messageTime, user, ip_address, operation_name, _sourceHost
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure Sign-In Event

  Where the Event Name is "Admin registered security info"

  Where the Action is "success"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000662
v4_id: '000662'
name: Hidden Account Creation
description: This rule monitors for the creation of user accounts with names ending in a dollar sign ($), which typically indicates a machine
  account. While such accounts are standard in Active Directory environments for computer objects, the unauthorized creation of accounts with
  this naming pattern could signify malicious activity, such as attempts to blend in as legitimate machine accounts to evade detection.
tactic: Persistence
tactic_id: TA0003
technique_id: T1136
technique_name: Create Account
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4720'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security EventCode=4720 \n| where like(TargetUserName, \"%$\")\n| table _time, ComputerName,\
    \ TargetUserName, SubjectUserName, SubjectDomainName\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where event_id in ("4720")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"event_id\" IN ('4720')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_per_000662 {\n  meta:\n    author = \"TDL\"\n    description = \"Hidden Account Creation\"\n    severity = \"MEDIUM\"\n\
    \    tactic = \"TA0003\"\n    technique = \"T1136\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.event_id = /(4720)/\n\
    \    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND event_id IN ("4720")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND event_id IN [4720])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND event_id IN (4720)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND event_id in ("4720")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND event_id:(4720)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND event_id IN ("4720")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '1 Windows Security Event

  Where Event ID 4720

  Where TargetUserName ends with "$"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

rule_id: TDL-PER-000662
v4_id: '000662'
name: Hidden Account Creation
description: This rule monitors for the creation of user accounts with names ending in a dollar sign ($), which typically indicates a machine
  account. While such accounts are standard in Active Directory environments for computer objects, the unauthorized creation of accounts with
  this naming pattern could signify malicious activity, such as attempts to blend in as legitimate machine accounts to evade detection.
tactic: Persistence
tactic_id: TA0003
technique_id: T1136
technique_name: Create Account
platform:
- Windows
data_sources:
- Microsoft Windows
- 'Event IDs: 4720'
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=WinEventLog:Security EventCode=4720 \n| where like(TargetUserName, \"%$\")\n| table _time, ComputerName,\
    \ TargetUserName, SubjectUserName, SubjectDomainName\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 4720
    | where TargetUserName endswith "$"
    | project TimeGenerated, Computer, Account, TargetUserName, TargetDomainName, SubjectUserName, SubjectDomainName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "TargetUserName", sourceip
    FROM events
    WHERE "EventID" = '4720'
      AND "TargetUserName" LIKE '%$'
    LAST 24 HOURS
  yara_l: "rule machine_account_creation_t1136 {\n  meta:\n    author = \"TDL\"\n    description = \"Detects creation of machine accounts via\
    \ Event ID 4720 where TargetUserName ends with $\"\n    mitre_tactic = \"Persistence\"\n    mitre_technique = \"T1136\"\n    severity = \"\
    Medium\"\n  \n  events:\n    $e.metadata.event_type = \"USER_CREATION\"\n    $e.metadata.product_event_type = \"4720\"\n    re.regex($e.target.user.userid,\
    \ `\\$$`)\n    $e.principal.hostname = $host\n  \n  match:\n    $host over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour AND event.code == "4720" AND winlog.event_data.TargetUserName RLIKE ".*\\$$"
    | KEEP @timestamp, host.name, winlog.event_data.SubjectUserName, winlog.event_data.TargetUserName, winlog.event_data.TargetDomainName
  leql: |
    where(source_json.EventID=4720 AND source_json.TargetUserName ENDS-WITH "$")
  crowdstrike: |
    EventCode=4720 TargetUserName=*$
    | table([@timestamp, ComputerName, TargetUserName, SubjectUserName, SubjectDomainName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 4720
    | filter action_evtlog_event_data_TargetUserName ~= "\$$"
    | fields _time, agent_hostname, action_evtlog_event_data_TargetUserName, action_evtlog_event_data_SubjectUserName, action_evtlog_event_data_SubjectDomainName
  lucene: |
    event.code:4720 AND winlog.event_data.TargetUserName:*$
  sumo: |
    _sourceCategory=*Windows*Security* "4720"
    | json field=_raw "EventID" as event_id
    | json field=_raw "TargetUserName" as target_user
    | where event_id = "4720" and target_user matches "*$"
    | fields _messageTime, _sourceHost, target_user, event_id
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Security Event

  Where Event ID 4720

  Where TargetUserName ends with "$"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

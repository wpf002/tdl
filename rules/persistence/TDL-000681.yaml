rule_id: TDL-PER-000681
v4_id: 000681
name: Role Created - Slack
description: Detects when a role is created within Slack
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action=role_created

    | table _time, user, role_name, role_id, channel, workspace

    '
  kql: |
    Slack
    | where TimeGenerated > ago(24h)
    | where Action == "role_created"
    | project TimeGenerated, UserPrincipalName, Action, RoleName, RoleId, RolePermissions, ActorUserId, ActorUserName, IPAddress, UserAgent
  aql: |
    SELECT eventtime, username, "Action", "Role Name", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Action" = 'role_created'
    LAST 24 HOURS
  yara_l: |
    rule slack_role_created_persistence {
      meta:
        author = "Detection Engineering"
        description = "Detects creation of new roles in Slack which may indicate persistence through elevated permissions (T1098)"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "role_created"
        $e.principal.user.userid = $user
        $e.target.resource.name = $role

      match:
        $user over 1h

      condition:
        $e
    }
  esql: |
    FROM logs-slack*
    | WHERE event.action == "role_created"
    | KEEP @timestamp, user.name, host.name, event.action, slack.role.name, slack.role.id
  leql: |
    where(source_json.action="role_created")
  crowdstrike: |
    #type=slack action="role_created"
    | table([@timestamp, user, action, channel, details])
  xql: |
    dataset = slack_audit_logs
    | filter action = "role_created"
    | fields _time, actor_user_id, actor_user_name, action, entity_id, entity_type, details
  lucene: |
    action:role_created
  sumo: |
    _sourceCategory=*Slack* "role_created"
    | json field=_raw "action" as action
    | where action = "role_created"
    | fields _messageTime, _sourceHost, action, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "role_created"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

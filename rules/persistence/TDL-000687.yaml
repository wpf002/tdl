rule_id: TDL-PER-000687
v4_id: 000687
name: Microsoft Intune Disabled - Slack
description: Detects when microsoft intune requirement has been disabled within Slack
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Slack
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=slack action="intune_disabled"

    | table _time, user, action, host, src, dest

    '
  kql: |
    OfficeActivity
    | where TimeGenerated > ago(24h)
    | where OfficeWorkload == "Slack"
    | where Operation == "intune_disabled"
    | project TimeGenerated, UserId, ClientIP, Operation, OfficeWorkload, OrganizationId, ResultStatus
  aql: |
    SELECT eventtime, username, sourceip, "Action", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE "Action" = 'intune_disabled'
    LAST 24 HOURS
  yara_l: |
    rule slack_intune_disabled_persistence {
      meta:
        author = "TDL"
        description = "Detects Intune disabled action in Slack logs - T1098 Persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $e.metadata.product_name = "Slack"
        $e.metadata.product_event_type = "intune_disabled"
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-slack.audit*
    | WHERE action == "intune_disabled"
    | KEEP @timestamp, user.name, user.email, action, host.name, source.ip
  leql: |
    where(source_json.Action="intune_disabled")
  crowdstrike: |
    #type=slack action=intune_disabled
    | table([@timestamp, user, action, ComputerName, TargetUserName])
  xql: |
    dataset = slack_audit_logs
    | filter action = "intune_disabled"
    | fields _time, actor_user_email, actor_user_name, action, entity_type, entity_id
  lucene: |
    action:"intune_disabled"
  sumo: |
    _sourceCategory=*Slack* "intune_disabled"
    | json field=_raw "action" as action
    | where action = "intune_disabled"
    | fields _messageTime, _sourceHost, action
false_positives:
- Authorized pen testing
- Security research
tuning_guidance: Tune per environment baseline.
tags:
- thr
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is "intune_disabled"'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

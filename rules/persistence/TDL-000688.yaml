rule_id: TDL-PER-000688
v4_id: 000688
name: Slack Authentication Policy Settings Modified by Unauthorized User
description: Detects when a non Slack Admin user modifies the authentication policy settings within Slack
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Slack
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=slack action IN ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed") NOT [| inputlookup slack_admins.csv
    | fields user | rename user as source_user]

    | table _time, source_user, action, user, entity_type, entity_id, auth_policy_id

    '
  kql: |
    Slack
    | where TimeGenerated > ago(1h)
    | where Action in ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed")
    | where UserId !in (
        Slack
        | where TimeGenerated > ago(7d)
        | where Action == "user_role_assigned" and RoleName == "admin"
        | distinct UserId
    )
    | project TimeGenerated, UserId, UserName, Action, TargetUserId, TargetUserName, PolicyId, PolicyName, SourceIP
  aql: |
    SELECT eventtime, "Source User", "Action", "Target User", "Policy Name", sourceip
    FROM events
    WHERE "Action" IN ('auth_policy_created', 'auth_policy_entity_assigned', 'auth_policy_entity_removed')
      AND "Source User" NOT IN ('slack_admin1', 'slack_admin2', 'slack_admin3')
      AND logsourceid IN (SELECT logsourceid FROM logsourcetypes WHERE logsourcetypename ILIKE '%slack%')
    LAST 24 HOURS
  yara_l: "rule slack_unauthorized_auth_policy_changes {\n  meta:\n    author = \"Detection Engineering\"\n    description = \"Detects non-admin\
    \ users modifying Slack authentication policies - T1098 Persistence\"\n    mitre_attack_tactic = \"Persistence\"\n    mitre_attack_technique\
    \ = \"T1098\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.product_name = \"Slack\"\n    (\n      $e.metadata.product_event_type\
    \ = \"auth_policy_created\" or\n      $e.metadata.product_event_type = \"auth_policy_entity_assigned\" or\n      $e.metadata.product_event_type\
    \ = \"auth_policy_entity_removed\"\n    )\n    $e.principal.user.userid = $user\n    not $e.principal.user.attribute.labels.key = \"slack_admin\"\
    \n    \n  match:\n    $user over 5m\n    \n  outcome:\n    $risk_score = 75\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-slack*
    | WHERE event.action IN ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed")
      AND user.name NOT IN ("slack_admin_user1", "slack_admin_user2", "slack_admin_user3")
    | KEEP @timestamp, user.name, event.action, source.ip, user.id, event.dataset
  leql: |
    where(source_json.action IN ["auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed"] AND source_user NOT IN ["slack_admin_1", "slack_admin_2", "slack_admin_3"])
  crowdstrike: |
    #type=slack action IN ["auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed"]
    | NOT (source_user IN ["admin1@company.com", "admin2@company.com"])
    | table([@timestamp, action, source_user, target_entity, policy_id, ComputerName])
  xql: |
    dataset = slack_audit_logs
    | filter action_type in ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed")
    | alter is_admin = actor_user_email in ("admin1@company.com", "admin2@company.com", "admin3@company.com")
    | filter is_admin = false
    | fields _time, actor_user_email, action_type, actor_user_name, action_context
  lucene: |
    action:("auth_policy_created" OR "auth_policy_entity_assigned" OR "auth_policy_entity_removed") AND NOT source_user:(admin1 OR admin2 OR admin3)
  sumo: |
    _sourceCategory=*Slack* (auth_policy_created OR auth_policy_entity_assigned OR auth_policy_entity_removed)
    | json field=_raw "action" as action
    | json field=_raw "actor.user.email" as source_user
    | where action in ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed")
    | where !(source_user in ("admin1@company.com", "admin2@company.com", "admin3@company.com"))
    | fields _messageTime, source_user, action, _raw
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action is IN ("auth_policy_created", "auth_policy_entity_assigned", "auth_policy_entity_removed")

  Where the Source User is NOT on the Slack Admins List'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

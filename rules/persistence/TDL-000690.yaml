rule_id: TDL-PER-000690
v4_id: 000690
name: Slack Settings Changed by Unauthorized User
description: Detects when a non Slack Admin modifies Slack changes
tactic: Persistence
tactic_id: TA0003
technique_id: T1098
technique_name: Account Manipulation
platform:
- Windows
data_sources:
- Slack
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=slack sourcetype=slack:events action=pref* \n| lookup slack_admins.csv user_id OUTPUT is_admin \n| where isnull(is_admin) OR is_admin=\"\
    false\"\n| table _time, user_id, user_name, action, details, src_ip\n"
  kql: |
    Slack_CL
    | where TimeGenerated > ago(24h)
    | where action_s matches regex "pref.*"
    | where initiating_user_s !in (dynamic(["admin1","admin2","admin3"]))
    | project TimeGenerated, initiating_user_s, action_s, affected_user_s, workspace_s, details_s
  aql: |
    SELECT eventtime, username AS source_user, "Action", sourceip, LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%slack%'
      AND "Action" MATCHES 'pref.*'
      AND username NOT IN (SELECT username FROM reference_set WHERE name = 'Slack_Admins')
    LAST 24 HOURS
  yara_l: |
    rule slack_account_manipulation_persistence {
      meta:
        author = "TDL"
        description = "Detects Slack preference changes by non-admin users indicating potential account manipulation (MITRE T1098)"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1098"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Slack"
        re.regex($e.metadata.product_event_type, `(?i)pref.*`)
        $e.principal.user.userid = $user
        not $e.principal.user.attribute.roles.name = "admin"

      match:
        $user over 1h

      outcome:
        $risk_score = 50

      condition:
        $e
    }
  esql: "FROM logs-slack.audit*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action RLIKE \"pref.*\" \n  AND NOT user.name IN (\"slack_admin_user1\"\
    , \"slack_admin_user2\", \"slack_admin_user3\")\n| KEEP @timestamp, user.name, event.action, source.ip, user.target.name\n"
  leql: |
    where(source_json.action=/^pref.*/ AND NOT(source_user IN [slack_admins_list]))
  crowdstrike: |
    #type=slack action=pref.* NOT (source_user IN ["slack_admin1", "slack_admin2", "slack_admin3"])
    | table([@timestamp, source_user, action, target_user, details])
  xql: |
    dataset = slack_audit_logs
    | filter action ~= "pref.*" and actor_user_id not in ("admin1", "admin2", "admin3")
    | fields _time, actor_user_id, action, entity_type, entity_id, context_ua, context_ip_address
  lucene: |
    event.action:pref.* AND NOT source.user:(admin1 OR admin2 OR admin3)
  sumo: "_sourceCategory=*Slack* \n| json field=_raw \"action\" as action\n| json field=_raw \"user.name\" as source_user\n| where action matches\
    \ \"pref.*\"\n| where !(source_user in (\"admin1\", \"admin2\", \"admin3\"))\n| fields _messageTime, source_user, action, _sourceHost\n"
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- persistence
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Slack Event

  Where the Action matches "pref.*"

  Where the Source User is NOT on the Slack Admins List'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the persistence target points to an
  unusual location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'

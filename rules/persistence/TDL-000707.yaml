rule_id: TDL-PER-000707
v4_id: '000707'
name: BITS Job with SetNotifyCmdLine Configured
description: BITS job created with a notify command — BITS will execute the command when the transfer completes. Classic stealth persistence/launch
  primitive. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1197 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1197
technique_name: BITS Jobs
platform:
- Windows
data_sources:
- Sysmon
- Windows Event Log
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Bits-Client/Operational\" EventCode=3 \n| search NotifyCmdLine=* \n| table\
    \ _time, ComputerName, User, jobTitle, fileId, url, NotifyCmdLine\n"
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 1
    | where CommandLine has "bitsadmin" and (CommandLine has "/SetNotifyCmdLine" or CommandLine has "/SETNOTIFYCMDLINE")
    | project TimeGenerated, Computer, Account, Process, CommandLine, ParentProcessName
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name", "Process CommandLine", "Image" AS image
    FROM events
    WHERE ("EventID" = '4688' OR "EventID" = '1')
      AND ("Process CommandLine" ILIKE '%bitsadmin%' AND "Process CommandLine" ILIKE '%/SetNotifyCmdLine%')
    LAST 24 HOURS
  yara_l: |
    rule bits_job_notify_command_persistence {
      meta:
        author = "TDL"
        description = "Detects BITS job created with notify command for persistence (T1197)"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1197"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.file.full_path, `(?i)\\bitsadmin\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)\\powershell\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)\\cmd\.exe$`)
        )
        (
          re.regex($e.principal.process.command_line, `(?i)bitsadmin.*\/SetNotifyCmdLine`) or
          re.regex($e.principal.process.command_line, `(?i)Start-BitsTransfer.*-NotifyCmdLine`)
        )
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 5m

      outcome:
        $risk_score = 65

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE winlog.event_id == \"1\" \n  AND process.name == \"bitsadmin.exe\" \n  AND (process.command_line\
    \ LIKE \"*/SetNotifyCmdLine*\" OR process.command_line LIKE \"*/SETNOTIFYCMDLINE*\" OR process.command_line LIKE \"*-SetNotifyCmdLine*\" OR\
    \ process.command_line LIKE \"*-SETNOTIFYCMDLINE*\")\n| KEEP @timestamp, host.name, user.name, process.command_line, process.parent.name,\
    \ process.parent.command_line\n"
  leql: |
    where(source_json.EventID=59 AND source_json.NotifyCmdLine EXISTS)
  crowdstrike: |
    (EventCode=4688 OR event_simpleName=ProcessRollup2) (CommandLine=*bitsadmin* AND (CommandLine=*/SetNotifyCmdLine* OR CommandLine=*/AddFile*)) OR (EventCode=59 OR event_simpleName=BitsJobCreated)
    | table([@timestamp, ComputerName, UserName, CommandLine, FileName, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id in (59, 60, 61) and action_evtlog_message contains "NotifyCmdLine"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_JobTitle, action_evtlog_event_data_JobId, action_evtlog_message
  lucene: |
    event.code:1 AND (process.parent.name:bitsadmin.exe OR process.command_line:*bitsadmin* AND process.command_line:*/SetNotifyCmdLine*)
  sumo: "_sourceCategory=*Sysmon* \"1\"\n| json field=_raw \"EventID\" as event_id\n| json field=_raw \"Image\" as image\n| json field=_raw \"\
    CommandLine\" as command_line\n| json field=_raw \"ParentImage\" as parent_image\n| where event_id = \"1\" \n  and (image matches \"*bitsadmin.exe\"\
    \ or command_line matches \"*Start-BitsTransfer*\")\n  and (command_line matches \"*/SetNotifyCmdLine*\" or command_line matches \"*-NotifyCmdLine*\"\
    )\n| fields _messageTime, _sourceHost, image, command_line, parent_image\n"
pseudo_logic: BITS job created with a notify command — BITS will execute the command when the transfer completes. Classic stealth persistence/launch

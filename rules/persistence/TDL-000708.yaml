rule_id: TDL-PER-000708
v4_id: 000708
name: New Browser Extension Installed Outside Managed Channel
description: Chrome/Edge/Firefox extension installed via developer-mode load or sideload, not from the managed extension policy. Persistence +
  credential-theft vector. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1176 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1176
technique_name: Browser Extensions
platform:
- Windows
- macOS
- Linux
data_sources:
- EDR
- Browser Telemetry
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: "index=* sourcetype IN (edr*, browser*, json) \n(\n  (file_path=\"*\\\\Google\\\\Chrome\\\\User Data\\\\*\\\\Extensions\\\\*\" OR file_path=\"\
    *\\\\Microsoft\\\\Edge\\\\User Data\\\\*\\\\Extensions\\\\*\" OR file_path=\"*\\\\Mozilla\\\\Firefox\\\\Profiles\\\\*\\\\extensions\\\\*\"\
    ) \n  (process_name IN (\"chrome.exe\", \"msedge.exe\", \"firefox.exe\") OR EventCode=11 OR event_type IN (\"file_creation\", \"file_write\"\
    ))\n  (CommandLine=\"*--load-extension*\" OR CommandLine=\"*--load-unpacked*\" OR file_name=\"manifest.json\")\n)\nOR \n(\n  registry_path\
    \ IN (\"*\\\\Software\\\\Google\\\\Chrome\\\\Extensions\\\\*\", \"*\\\\Software\\\\Microsoft\\\\Edge\\\\Extensions\\\\*\", \"*\\\\Software\\\
    \\Policies\\\\Google\\\\Chrome\\\\ExtensionInstallForcelist*\", \"*\\\\Software\\\\Policies\\\\Microsoft\\\\Edge\\\\ExtensionInstallForcelist*\"\
    )\n  (event_type=\"registry_add\" OR event_type=\"registry_set\" OR EventCode IN (12, 13))\n)\n| where \n  (isnotnull(file_path) AND (match(file_path,\
    \ \"(?i).*\\\\\\\\Extensions\\\\\\\\[a-z]{32}\\\\\\\\.*\") OR match(file_path, \"(?i).*\\\\\\\\extensions\\\\\\\\.*\\\\.xpi\")))\n  OR (isnotnull(registry_path)\
    \ AND NOT match(registry_path, \"(?i).*\\\\\\\\Policies\\\\\\\\.*\\\\\\\\ExtensionInstallForcelist.*\"))\n  OR (isnotnull(CommandLine) AND\
    \ (match(CommandLine, \"(?i).*--load-extension.*\") OR match(CommandLine, \"(?i).*--load-unpacked.*\")))\n| eval extension_id=coalesce(\n\
    \    mvindex(split(file_path, \"\\\\\"), -2),\n    mvindex(split(registry_path, \"\\\\\"), -1)\n  )\n| eval browser=case(\n    match(file_path,\
    \ \"(?i).*Chrome.*\") OR match(registry_path, \"(?i).*Chrome.*\") OR match(process_name, \"(?i)chrome\\.exe\"), \"Chrome\",\n    match(file_path,\
    \ \"(?i).*Edge.*\") OR match(registry_path, \"(?i).*Edge.*\") OR match(process_name, \"(?i)msedge\\.exe\"), \"Edge\",\n    match(file_path,\
    \ \"(?i).*Firefox.*\") OR match(process_name, \"(?i)firefox\\.exe\"), \"Firefox\",\n    1=1, \"Unknown\"\n  )\n| where browser!=\"Unknown\"\
    \n| stats earliest(_time) as first_seen latest(_time) as last_seen values(file_path) as paths values(CommandLine) as commands values(registry_path)\
    \ as registry_keys by ComputerName, host, user, User, browser, extension_id\n| table first_seen, last_seen, ComputerName, host, user, User,\
    \ browser, extension_id, paths, commands, registry_keys\n"
  kql: |
    DeviceFileEvents
    | where TimeGenerated > ago(24h)
    | where FolderPath has_any ("\\AppData\\Local\\Google\\Chrome\\User Data", "\\AppData\\Local\\Microsoft\\Edge\\User Data", "\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles", "Library/Application Support/Google/Chrome", "Library/Application Support/Microsoft Edge", "Library/Application Support/Firefox/Profiles", ".config/google-chrome", ".config/microsoft-edge", ".mozilla/firefox")
    | where FileName =~ "manifest.json"
    | extend ExtensionPath = FolderPath
    | join kind=inner (
        DeviceProcessEvents
        | where TimeGenerated > ago(24h)
        | where ProcessCommandLine has_any ("--load-extension", "--load-and-launch-app", "about:debugging", "chrome://extensions", "edge://extensions")
        | project DeviceId, DeviceName, AccountName, ProcessCommandLine, Timestamp
    ) on DeviceId
    | where abs(datetime_diff('minute', TimeGenerated, Timestamp)) <= 10
    | project TimeGenerated, DeviceName, AccountName, ExtensionPath, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine
    | summarize ExtensionInstalls = count(), Extensions = make_set(ExtensionPath), Commands = make_set(ProcessCommandLine) by DeviceName, AccountName, bin(TimeGenerated, 1h)
    | where ExtensionInstalls >= 1
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "File Path" AS extension_path, "Registry Key" AS registry_key
    FROM events
    WHERE (
      ("Process Name" ILIKE '%chrome.exe%' OR "Process Name" ILIKE '%msedge.exe%' OR "Process Name" ILIKE '%firefox.exe%')
      AND (
        "Process CommandLine" ILIKE '%--load-extension%'
        OR "Process CommandLine" ILIKE '%--load-unpacked%'
        OR "Registry Key" ILIKE '%Software\\Google\\Chrome\\Extensions%'
        OR "Registry Key" ILIKE '%Software\\Microsoft\\Edge\\Extensions%'
        OR "Registry Key" ILIKE '%Software\\Mozilla\\Firefox\\Extensions%'
        OR "File Path" ILIKE '%\\Extensions\\%'
      )
      AND "Process CommandLine" NOT ILIKE '%ExtensionInstallForcelist%'
      AND "Process CommandLine" NOT ILIKE '%ExtensionInstallAllowlist%'
    )
    LAST 24 HOURS
  yara_l: |
    rule browser_extension_sideload_persistence {
      meta:
        author = "TDL"
        description = "Detects browser extension loaded via developer mode or sideload not from managed policy - T1176 persistence"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1176"
        severity = "Medium"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.command_line, `(?i)(chrome|msedge|firefox).*--load-extension`) or
          re.regex($e.principal.process.command_line, `(?i)(chrome|msedge).*--disable-extensions-except`) or
          re.regex($e.principal.process.command_line, `(?i)firefox.*-profile.*extensions`)
        )
        not re.regex($e.principal.process.command_line, `(?i)ExtensionInstallForcelist`)
        not re.regex($e.principal.process.command_line, `(?i)ExtensionSettings`)
        $e.principal.hostname = $host
        $e.principal.user.userid = $user

      match:
        $host, $user over 1h

      outcome:
        $risk_score = 65

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.file*, logs-endpoint.events.process*, logs-endpoint.events.registry*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (file.path LIKE "*chrome*Extensions*" AND file.path LIKE "*manifest.json" AND file.extension == "json" AND event.action == "creation")
        OR (file.path LIKE "*firefox*extensions*" AND file.extension == "xpi" AND event.action == "creation")
        OR (file.path LIKE "*Edge*Extensions*" AND file.path LIKE "*manifest.json" AND file.extension == "json" AND event.action == "creation")
        OR (process.command_line LIKE "*--load-extension*")
        OR (process.command_line LIKE "*--load-unpacked*")
        OR (process.command_line LIKE "*chrome.exe*" AND process.command_line LIKE "*--enable-features*")
        OR (registry.path LIKE "*Software\\Google\\Chrome\\Extensions*" AND registry.path LIKE "*update_url*" AND event.action == "modification")
        OR (registry.path LIKE "*Software\\Microsoft\\Edge\\Extensions*" AND registry.path LIKE "*update_url*" AND event.action == "modification")
      )
    | EVAL extension_path = COALESCE(file.path, registry.path, "from_cmdline")
    | STATS install_count = COUNT(*) BY host.name, user.name, extension_path, process.name
    | WHERE install_count > 0
    | KEEP @timestamp, host.name, user.name, extension_path, process.name, install_count
    | SORT @timestamp DESC
    | LIMIT 1000
  leql: |
    where((process_cmd_line ICONTAINS "--load-extension" OR process_cmd_line ICONTAINS "--load-and-launch-app" OR process_cmd_line ICONTAINS "about:debugging" OR process_cmd_line ICONTAINS "chrome://extensions" OR process_cmd_line ICONTAINS "edge://extensions") AND (process_name ICONTAINS "chrome.exe" OR process_name ICONTAINS "msedge.exe" OR process_name ICONTAINS "firefox.exe" OR process_name ICONTAINS "chrome" OR process_name ICONTAINS "firefox")) groupby(asset, user, process_cmd_line) calculate(count)
  crowdstrike: "event_simpleName=BrowserExtensionLoad \n| groupBy([ComputerName, aid, BrowserName, ExtensionId, ExtensionName], function=selectLast([LoadMethod,\
    \ IsManagedExtension, @timestamp]))\n| IsManagedExtension=false \n| (LoadMethod=*developer* OR LoadMethod=*sideload* OR LoadMethod=*unpacked*)\n\
    | table([@timestamp, ComputerName, aid, BrowserName, ExtensionId, ExtensionName, LoadMethod])\n"
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_FILE\n| filter (action_file_path ~= \".*\\\\\\\\AppData\\\\\\\\Local\\\\\\\\\
    Google\\\\\\\\Chrome\\\\\\\\User Data\\\\\\\\Default\\\\\\\\Extensions\\\\\\\\.*\\\\\\\\manifest\\\\.json$\" \n    or action_file_path ~=\
    \ \".*\\\\\\\\AppData\\\\\\\\Roaming\\\\\\\\Mozilla\\\\\\\\Firefox\\\\\\\\Profiles\\\\\\\\.*\\\\\\\\extensions\\\\\\\\.*\\\\.xpi$\"\n    or\
    \ action_file_path ~= \".*\\\\\\\\AppData\\\\\\\\Local\\\\\\\\Microsoft\\\\\\\\Edge\\\\\\\\User Data\\\\\\\\Default\\\\\\\\Extensions\\\\\\\
    \\.*\\\\\\\\manifest\\\\.json$\"\n    or action_file_path ~= \".*/Library/Application Support/Google/Chrome/.*/Extensions/.*/manifest\\\\\
    .json$\"\n    or action_file_path ~= \".*/Library/Application Support/Mozilla/.*\\\\.xpi$\"\n    or action_file_path ~= \".*/.config/google-chrome/.*/Extensions/.*/manifest\\\
    \\.json$\"\n    or action_file_path ~= \".*/.mozilla/firefox/.*\\\\.xpi$\")\n| filter action_file_name in (\"manifest.json\", \"manifest.json.tmp\"\
    ) or action_file_name ~= \".*\\\\.xpi$\"\n| filter actor_process_image_name not in (\"chrome.exe\", \"msedge.exe\", \"firefox.exe\", \"Google\
    \ Chrome\", \"Microsoft Edge\", \"Firefox\")\n| filter action_process_image_command_line not contains \"--load-extension\" and action_process_image_command_line\
    \ not contains \"ExtensionInstallForcelist\"\n| fields _time, agent_hostname, actor_effective_username, action_file_path, actor_process_image_name,\
    \ action_process_image_command_line, actor_process_image_path\n"
  lucene: |
    (process.name:(chrome.exe OR msedge.exe OR firefox.exe) AND process.command_line:(*--load-extension* OR *--load-and-launch-app* OR *--pack-extension* OR *about\:debugging* OR *chrome\:\/\/extensions*)) OR (file.path:(*\\Local\\Google\\Chrome\\User\ Data\\*\\Extensions\\* OR *\\Local\\Microsoft\\Edge\\User\ Data\\*\\Extensions\\* OR *\\Roaming\\Mozilla\\Firefox\\Profiles\\*\\extensions\\* OR *\/Library\/Application\ Support\/Google\/Chrome\/*\/Extensions\/* OR *\/Library\/Application\ Support\/Microsoft\ Edge\/*\/Extensions\/* OR *\/.mozilla\/firefox\/*\/extensions\/*) AND file.extension:(crx OR xpi OR zip) AND NOT registry.path:(*ExtensionInstallForcelist* OR *ExtensionInstallAllowlist*)) OR (event.action:(file_creation OR file_modification) AND file.name:manifest.json AND file.path:(*\\Local\\Google\\Chrome\\User\ Data\\*\\Extensions\\* OR *\\Local\\Microsoft\\Edge\\User\ Data\\*\\Extensions\\* OR *\\Roaming\\Mozilla\\Firefox\\Profiles\\*\\extensions\\* OR *\/Library\/Application\ Support\/Google\/Chrome\/*\/Extensions\/* OR *\/Library\/Application\ Support\/Microsoft\ Edge\/*\/Extensions\/* OR *\/.mozilla\/firefox\/*\/extensions\/*) AND NOT process.name:(chrome.exe OR msedge.exe OR firefox.exe OR Software\ Update.app))
  sumo: "_sourceCategory=*EDR* OR _sourceCategory=*Browser* (chrome OR edge OR firefox) (extension OR \"developer mode\" OR \"load unpacked\"\
    \ OR sideload OR \".crx\" OR \".xpi\")\n| json field=_raw \"event_type\" as event_type\n| json field=_raw \"process_name\" as process_name\n\
    | json field=_raw \"command_line\" as command_line\n| json field=_raw \"file_path\" as file_path\n| json field=_raw \"registry_path\" as registry_path\n\
    | json field=_raw \"user\" as user\n| json field=_raw \"host\" as host\n| where (process_name matches \"*chrome*\" OR process_name matches\
    \ \"*msedge*\" OR process_name matches \"*firefox*\") \n  AND (command_line matches \"*--load-extension*\" \n    OR command_line matches \"\
    *--load-and-launch-app*\"\n    OR file_path matches \"*Extensions*\" \n    OR file_path matches \"*.crx\"\n    OR file_path matches \"*.xpi\"\
    \n    OR registry_path matches \"*SOFTWARE\\\\Google\\\\Chrome\\\\Extensions*\"\n    OR registry_path matches \"*SOFTWARE\\\\Microsoft\\\\\
    Edge\\\\Extensions*\"\n    OR registry_path matches \"*SOFTWARE\\\\Mozilla\\\\Firefox\\\\Extensions*\")\n| where !(registry_path matches \"\
    *ExtensionInstallForcelist*\" OR registry_path matches \"*ExtensionInstallAllowlist*\")\n| dedup host, user, file_path\n| fields _messageTime,\
    \ host, user, process_name, command_line, file_path, registry_path\n"
pseudo_logic: Chrome/Edge/Firefox extension installed via developer-mode load or sideload, not from the managed extension policy. Persistence
  + credential-theft vector.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.

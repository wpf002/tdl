rule_id: TDL-PER-000710
v4_id: '000710'
name: LSA Security Package or Authentication Package Registered
description: HKLM\SYSTEM\CurrentControlSet\Control\Lsa Security Packages / Authentication Packages key written. Adversaries register a malicious
  SSP DLL for credential capture and persistence. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1556 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1556
technique_name: Modify Authentication Process
platform:
- Windows
- Linux
- macOS
- Azure
- AWS
data_sources:
- Windows Event Log
- Sysmon
- Auditd
- Cloud Audit Logs
severity: Critical
fidelity: Medium
lifecycle: Proposed
risk_score: 85
queries:
  spl: |
    index=wineventlog (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13) OR (sourcetype=WinEventLog:Security EventCode=4657)
    (TargetObject="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\Security Packages*" OR TargetObject="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\Authentication Packages*" OR ObjectName="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\Security Packages*" OR ObjectName="*\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\Authentication Packages*")
    | table _time, ComputerName, User, EventCode, TargetObject, ObjectName, Details, NewValue, Image, ProcessId
  kql: 'union AWSCloudTrail, AzureActivity, AuditLogs

    | where TimeGenerated > ago(1d)

    | where eventName matches regex ".+"

    | summarize Count=count() by Identity, EventName=coalesce(EventName, OperationName), Resource=tostring(coalesce(ResourceId, ResourceProvider))

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, \"User Identity\", \"Event Name\", \"Source IP Address\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype) IN ('AWS\
    \ CloudTrail','Azure Audit','GCP Cloud Audit')\n  AND \"eventName\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_per_000710 {\n  meta:\n    author = \"TDL\"\n    description = \"LSA Security Package or Authentication Package Registered\"\
    \n    severity = \"CRITICAL\"\n    tactic = \"TA0003\"\n    technique = \"T1556\"\n  events:\n    $e.metadata.event_type = \"USER_RESOURCE_ACCESS\"\
    \n    $e.eventName = /.+/\n    $actor = $e.principal.user.userid\n  match:\n    $actor over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-aws*,logs-azure*,logs-gcp*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE eventName LIKE "%.+%"

    | STATS count = COUNT(*) BY user.name, event.action, cloud.account.id

    | SORT count DESC

    '
  leql: 'where(logset IN ["AWS CloudTrail", "Azure Audit", "GCP Audit"] AND eventName=/.+/)

    groupby(actor, event_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=CloudOcsfApiActivity AND eventName=*.+*

    | stats count as calls by Actor, ApiName, SourceIPAddress

    | sort -calls

    '
  xql: 'dataset = cloud_audit_logs

    | filter eventName ~= ".+"

    | comp count() as calls by actor_effective_username, action_evtlog_event_name, action_remote_ip

    | sort desc calls

    '
  lucene: 'event.dataset:("aws.cloudtrail" OR "azure.audit" OR "gcp.audit") AND eventName:*.+*

    '
  sumo: '_sourceCategory=*aws/cloudtrail* OR _sourceCategory=*azure/audit* OR _sourceCategory=*gcp/audit*

    | where eventName matches "*.+*"

    | count by userIdentity_arn, eventName, sourceIPAddress

    | sort by _count desc

    '

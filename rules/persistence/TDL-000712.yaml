rule_id: TDL-PER-000712
v4_id: '000712'
name: Direct Write to MBR/VBR or EFI System Partition
description: Process opens \\.\PhysicalDrive0 with write access or modifies files on the EFI System Partition outside an approved firmware update.
  Bootkit/UEFI implant. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1542 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1542
technique_name: Pre-OS Boot
platform:
- Windows
- Linux
data_sources:
- EDR
- Firmware Telemetry
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: |
    index=edr (file_path="\\\\?\\PhysicalDrive0" OR file_path="\\Device\\Harddisk0\\Partition*" OR file_path="*/EFI/*" OR file_path="C:\\EFI\\*" OR file_path="/boot/efi/*") (action=write OR access_mask="*WRITE*" OR operation=write OR event_type=modification)
    | search NOT (process_name IN ("fwupdmgr", "fwupd", "MsiExec.exe", "setup.exe", "Windows10UpgraderApp.exe", "TrustedInstaller.exe", "DellBIOSUpdate.exe", "HPFirmwareUpdRec.exe", "LenovoFirmwareUpdate.exe") OR parent_process_name IN ("TrustedInstaller.exe", "services.exe", "svchost.exe"))
    | stats count values(file_path) as modified_files values(action) as actions earliest(_time) as first_time latest(_time) as last_time by host, process_name, process_path, user, parent_process_name
    | table first_time, last_time, host, user, process_name, process_path, parent_process_name, modified_files, actions, count
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_per_000712 {\n  meta:\n    author = \"TDL\"\n    description = \"Direct Write to MBR/VBR or EFI System Partition\"\n \
    \   severity = \"CRITICAL\"\n    tactic = \"TA0003\"\n    technique = \"T1542\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\
    \n    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Process opens \\.\PhysicalDrive0 with write access or modifies files on the EFI System Partition outside an approved firmware update.
  Bootkit/UEFI implant.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- bootkit

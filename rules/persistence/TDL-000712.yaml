rule_id: TDL-PER-000712
v4_id: '000712'
name: Direct Write to MBR/VBR or EFI System Partition
description: Process opens \\.\PhysicalDrive0 with write access or modifies files on the EFI System Partition outside an approved firmware update.
  Bootkit/UEFI implant. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1542 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1542
technique_name: Pre-OS Boot
platform:
- Windows
- Linux
data_sources:
- EDR
- Firmware Telemetry
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: 'index=edr (file_path="\\\\?\\PhysicalDrive0" OR file_path="\\Device\\Harddisk0\\Partition*" OR file_path="*/EFI/*" OR file_path="C:\\EFI\\*"
    OR file_path="/boot/efi/*") (action=write OR access_mask="*WRITE*" OR operation=write OR event_type=modification)

    | search NOT (process_name IN ("fwupdmgr", "fwupd", "MsiExec.exe", "setup.exe", "Windows10UpgraderApp.exe", "TrustedInstaller.exe", "DellBIOSUpdate.exe",
    "HPFirmwareUpdRec.exe", "LenovoFirmwareUpdate.exe") OR parent_process_name IN ("TrustedInstaller.exe", "services.exe", "svchost.exe"))

    | stats count values(file_path) as modified_files values(action) as actions earliest(_time) as first_time latest(_time) as last_time by host,
    process_name, process_path, user, parent_process_name

    | table first_time, last_time, host, user, process_name, process_path, parent_process_name, modified_files, actions, count

    '
  kql: |
    DeviceFileEvents
    | where TimeGenerated > ago(24h)
    | where (FolderPath has_any ("\\EFI\\", "/boot/efi/") or FileName startswith "PhysicalDrive")
    | where ActionType in ("FileCreated", "FileModified", "FileRenamed")
    | where InitiatingProcessFileName !in~ ("fwupdmgr", "fwupd", "WindowsUpdateBox.exe", "TiWorker.exe", "wuauclt.exe", "Windows10UpgraderApp.exe", "SetupHost.exe", "setup.exe")
    | where not(InitiatingProcessFolderPath has_any ("\\Windows\\System32\\", "\\Windows\\SysWOW64\\", "\\Program Files\\", "\\Program Files (x86)\\", "/usr/sbin/", "/usr/bin/"))
    | project TimeGenerated, DeviceName, ActionType, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessFolderPath, InitiatingProcessAccountName, SHA256
    | extend ThreatIndicator = "Potential bootkit or UEFI implant - unauthorized EFI/Physical Drive modification"
  aql: |
    SELECT sourceip, username, "Process Name", "Target Object", "Access Mask", eventtime, LOGSOURCENAME(logsourceid) AS host
    FROM events
    WHERE (("Target Object" ILIKE '%\\.\PhysicalDrive0%' AND ("Access Mask" ILIKE '%WRITE%' OR "Access Mask" ILIKE '%0x12019f%' OR "Access Mask" ILIKE '%0x1301bf%'))
       OR ("Target Object" ILIKE '%\EFI\%' AND "Operation" IN ('CreateFile', 'SetFileInformation', 'WriteFile')))
       AND "Process Name" NOT ILIKE '%fwupd%'
       AND "Process Name" NOT ILIKE '%Windows\System32\fwupdmgr.exe%'
       AND "Process Name" NOT ILIKE '%WindowsUpdateAgent%'
       AND "Process Name" NOT ILIKE '%TrustedInstaller.exe%'
    LAST 24 HOURS
  yara_l: |
    rule uefi_bootkit_suspicious_access {
      meta:
        author = "TDL"
        description = "Detects potential UEFI bootkit or malicious firmware modification via direct physical drive or EFI partition access"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1542"
        severity = "HIGH"

      events:
        (
          $e.metadata.event_type = "PROCESS_OPEN"
          (
            re.regex($e.target.file.full_path, `(?i)\\\\\.\\PhysicalDrive0`)
            or re.regex($e.target.file.full_path, `(?i)/dev/(sda|nvme0n1)`)
          )
          $e.security_result.action = "ALLOW"
          re.regex($e.principal.process.file.full_path, `(?i).*`)
          not re.regex($e.principal.process.file.full_path, `(?i)(fwupd|fwupdmgr|windows\\system32\\(dism\.exe|reagentc\.exe|bcdedit\.exe)|program files.*firmware)`)
        )
        or
        (
          $e.metadata.event_type = "FILE_MODIFICATION"
          (
            re.regex($e.target.file.full_path, `(?i)(\\EFI\\|/boot/efi/|/sys/firmware/efi/)`)
          )
          $e.security_result.action = "ALLOW"
          not re.regex($e.principal.process.file.full_path, `(?i)(fwupd|fwupdmgr|windows\\system32\\(dism\.exe|reagentc\.exe|bcdedit\.exe)|program files.*firmware|grub|shim)`)
        )

        $e.principal.hostname = $host
        $e.principal.process.file.full_path = $proc

      match:
        $host, $proc over 5m

      outcome:
        $risk_score = 90

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.file*, logs-endpoint.events.process*
    | WHERE @timestamp > NOW() - 1 hour
      AND (
        (file.path RLIKE ".*\\\\\\\\\.\\\\PhysicalDrive[0-9]+" AND event.action IN ("open", "modification") AND file.Ext.header_data.pe_info != null)
        OR (file.path RLIKE "(?i).*/EFI/.*" AND event.action IN ("creation", "modification", "deletion"))
        OR (file.path RLIKE "(?i).*:\\\\EFI\\\\.*" AND event.action IN ("creation", "modification", "deletion"))
      )
    | WHERE NOT (process.name IN ("fwupdate", "fwupdmgr", "WindowsUpdateAgent.exe", "TrustedInstaller.exe", "MpCmdRun.exe"))
    | STATS event_count = COUNT(*) BY host.name, process.name, process.executable, process.command_line, file.path, user.name, event.action
    | WHERE event_count >= 1
    | KEEP @timestamp, host.name, user.name, process.name, process.executable, process.command_line, file.path, event.action, event_count
  leql: |
    where((process_cmd_line ICONTAINS "\\.\PhysicalDrive0" OR process_cmd_line ICONTAINS "\\\\.\\PhysicalDrive0" OR file_path ICONTAINS "\EFI\\" OR file_path ICONTAINS "/efi/") AND (source_json.EventID=4663 OR source_json.EventID IN [11, 23] OR event_type="file_modification" OR event_type="device_access") AND NOT (process_name ICONTAINS "fwupd" OR process_name ICONTAINS "windows update" OR process_name ICONTAINS "wuauclt" OR process_name ICONTAINS "trustedinstaller" OR process_name ICONTAINS "setup.exe" OR process_name ICONTAINS "bios" OR process_name ICONTAINS "firmware")) groupby(asset, process_name, user) calculate(count)
  crowdstrike: "(event_simpleName=ProcessRollup2 OR event_simpleName=RawFileAccess OR event_simpleName=VolumeAccess) \n(CommandLine=\"*\\\\.\\\
    PhysicalDrive0*\" OR FilePath=\"*/EFI/*\" OR TargetFileName=\"*\\\\.\\PhysicalDrive0*\" OR TargetFileName=\"*/EFI/*\" OR FileName=\"*EFI*\"\
    )\n| regex(\"(?i)(write|modify|create)\", field=AccessType, strict=false)\n| not (ParentBaseFileName=/(?i)(fwupd|fwupdmgr|windows.*update|dell.*update|hp.*update|lenovo.*update|bios.*update)/)\n\
    | not (FileName=/(?i)(fwupd|fwupdmgr|windows.*update|dell.*update|hp.*update|lenovo.*update|bios.*update|trusted.*installer)/)\n| table([@timestamp,\
    \ ComputerName, UserName, FileName, ParentBaseFileName, CommandLine, TargetFileName, FilePath, AccessType, event_simpleName])\n"
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_FILE_OPEN
    | filter (action_file_path ~= "(?i)\\\\\.\\PhysicalDrive0" and action_file_access_mode contains "WRITE")
       or (action_file_path ~= "(?i).*\\EFI\\.*" and action_file_name != null)
    | filter actor_process_image_name not in ("fwupdmgr", "fwupd", "Windows Update", "TrustedInstaller.exe", "MpCmdRun.exe", "MsMpEng.exe", "svchost.exe")
    | filter actor_process_image_path not contains "\\Windows\\System32\\" and actor_process_image_path not contains "\\Windows\\WinSxS\\"
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, actor_process_image_path, action_file_path, action_file_access_mode, event_type, event_sub_type
  lucene: |
    (file.path:(*\\EFI\\* OR *\/boot\/efi\/*) AND (event.action:(modification OR creation OR deletion) OR process.access_mode:write)) OR (process.args:(*\\.\PhysicalDrive0* OR *\/dev\/sda*) AND process.access_mode:write)
  sumo: |
    _sourceCategory=*EDR* OR _sourceCategory=*Firmware*
    | json field=_raw "EventType" as event_type
    | json field=_raw "ProcessName" as process_name
    | json field=_raw "TargetObject" as target_object
    | json field=_raw "FilePath" as file_path
    | json field=_raw "AccessMask" as access_mask
    | json field=_raw "Computer" as host
    | where (target_object matches "*\\\\.\\PhysicalDrive0*" and (access_mask matches "*WRITE*" or access_mask matches "*0x40000000*" or access_mask matches "*GENERIC_WRITE*"))
       OR (file_path matches "*/EFI/*" or file_path matches "*\\EFI\\*")
    | where !(process_name matches "*fwupd*" or process_name matches "*WindowsUpdateAgent*" or process_name matches "*MpSigStub*" or process_name matches "*TrustedInstaller*" or process_name matches "*FWUPDATE*")
    | fields _messageTime, host, process_name, target_object, file_path, access_mask, event_type
pseudo_logic: Process opens \\.\PhysicalDrive0 with write access or modifies files on the EFI System Partition outside an approved firmware update.
  Bootkit/UEFI implant.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

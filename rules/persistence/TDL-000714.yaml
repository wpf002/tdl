rule_id: TDL-PER-000714
v4_id: '000714'
name: 'Web Shell Indicator: Webserver Spawning Shell'
description: w3wp.exe / httpd / nginx spawning cmd.exe / powershell.exe / bash. Web-shell command execution. Generated from gap analysis against
  canonical ATT&CK Enterprise matrix (T1505 under Persistence).
tactic: Persistence
tactic_id: TA0003
technique_id: T1505
technique_name: Server Software Component
platform:
- Windows
- Linux
data_sources:
- Sysmon
- Web Server Logs
severity: Critical
fidelity: High
lifecycle: Proposed
risk_score: 95
queries:
  spl: '(index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (ParentImage="*\\w3wp.exe" OR ParentImage="*\\httpd.exe"
    OR ParentImage="*\\nginx.exe") (Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\bash.exe" OR Image="*\\sh.exe")) OR (index=linux
    sourcetype IN (syslog, linux_secure) (parent_process="*httpd*" OR parent_process="*nginx*") (process_name IN ("bash", "sh", "cmd")))

    | stats count values(Image) as spawned_process values(CommandLine) as command_line values(ParentImage) as web_server by _time, ComputerName,
    host, User

    | table _time, ComputerName, host, User, web_server, spawned_process, command_line, count

    '
  kql: |
    union
    (SecurityEvent
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where ParentImage has_any ("w3wp.exe", "httpd", "nginx")
    | where Image has_any ("cmd.exe", "powershell.exe", "bash")
    | project TimeGenerated, Computer, ParentImage, Image, CommandLine, User),
    (Event
    | where TimeGenerated > ago(1h)
    | where EventID == 1
    | where EventLog == "Microsoft-Windows-Sysmon/Operational"
    | extend ParentImage = tostring(EventData.ParentImage)
    | extend Image = tostring(EventData.Image)
    | extend CommandLine = tostring(EventData.CommandLine)
    | extend User = tostring(EventData.User)
    | where ParentImage has_any ("w3wp.exe", "httpd", "nginx")
    | where Image has_any ("cmd.exe", "powershell.exe", "bash")
    | project TimeGenerated, Computer, ParentImage, Image, CommandLine, User)
    | project TimeGenerated, Computer, ParentImage, Image, CommandLine, User
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, "Parent Process Name", "Process Name", "Process CommandLine", username, sourceip
    FROM events
    WHERE ("Parent Process Name" ILIKE '%w3wp.exe%' OR "Parent Process Name" ILIKE '%httpd%' OR "Parent Process Name" ILIKE '%nginx%')
      AND ("Process Name" ILIKE '%cmd.exe%' OR "Process Name" ILIKE '%powershell.exe%' OR "Process Name" ILIKE '%bash%')
    LAST 24 HOURS
  yara_l: |
    rule webshell_command_execution {
      meta:
        author = "TDL"
        description = "Detects web server processes spawning command interpreters indicating webshell execution"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1505"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        (
          re.regex($e.principal.process.file.full_path, `(?i)\\w3wp\.exe$`) or
          re.regex($e.principal.process.file.full_path, `(?i)/httpd$`) or
          re.regex($e.principal.process.file.full_path, `(?i)/nginx$`)
        )
        (
          re.regex($e.target.process.file.full_path, `(?i)\\cmd\.exe$`) or
          re.regex($e.target.process.file.full_path, `(?i)\\powershell\.exe$`) or
          re.regex($e.target.process.file.full_path, `(?i)/bash$`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 85

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process*, logs-windows.sysmon_operational*
    | WHERE event.category == "process" AND event.type == "start"
      AND (
        (TO_LOWER(process.parent.name) IN ("w3wp.exe", "httpd", "nginx") AND TO_LOWER(process.name) IN ("cmd.exe", "powershell.exe", "bash", "sh"))
      )
    | KEEP @timestamp, host.name, user.name, process.parent.name, process.parent.executable, process.name, process.executable, process.command_line, process.pid, process.parent.pid
  leql: |
    where((parent_process_name ICONTAINS "w3wp.exe" OR parent_process_name ICONTAINS "httpd" OR parent_process_name ICONTAINS "nginx") AND (process_name ICONTAINS "cmd.exe" OR process_name ICONTAINS "powershell.exe" OR process_name ICONTAINS "bash"))
  crowdstrike: "(event_simpleName=ProcessRollup2 OR EventCode=1) \n(ParentBaseFileName IN [w3wp.exe, httpd, nginx, apache2] OR ParentProcessFileName\
    \ IN [*w3wp.exe, *httpd, *nginx, *apache2])\n(FileName IN [cmd.exe, powershell.exe, bash, sh] OR ImagePath IN [*cmd.exe, *powershell.exe,\
    \ *bash, */sh])\n| table([@timestamp, ComputerName, UserName, ParentBaseFileName, ParentProcessFileName, FileName, ImagePath, CommandLine])\n"
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_PROCESS\n| filter (lowercase(actor_process_image_name) contains \"w3wp.exe\"\
    \ \n         or lowercase(actor_process_image_name) contains \"httpd\" \n         or lowercase(actor_process_image_name) contains \"nginx\"\
    )\n| filter (lowercase(action_process_image_name) contains \"cmd.exe\" \n         or lowercase(action_process_image_name) contains \"powershell.exe\"\
    \ \n         or lowercase(action_process_image_name) contains \"bash\")\n| fields _time, agent_hostname, actor_process_image_name, action_process_image_name,\
    \ action_process_image_command_line, actor_effective_username\n"
  lucene: |
    (process.parent.name:(w3wp.exe OR httpd OR nginx OR apache2) OR process.parent.executable:(*w3wp.exe OR *httpd OR *nginx OR *apache2)) AND (process.name:(cmd.exe OR powershell.exe OR bash OR sh) OR process.executable:(*cmd.exe OR *powershell.exe OR *bash OR */sh))
  sumo: |
    _sourceCategory=*Sysmon* "1"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ParentImage" as parent_image
    | json field=_raw "Image" as image
    | json field=_raw "CommandLine" as command_line
    | where event_id = "1"
    | where (parent_image matches "*w3wp.exe" or parent_image matches "*httpd" or parent_image matches "*nginx")
    | where (image matches "*cmd.exe" or image matches "*powershell.exe" or image matches "*bash")
    | fields _messageTime, _sourceHost, parent_image, image, command_line
pseudo_logic: w3wp.exe / httpd / nginx spawning cmd.exe / powershell.exe / bash. Web-shell command execution.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- webshell
- iis-module
- sql-proc
- t1505
- persistence
references:
- https://attack.mitre.org/techniques/T1505/

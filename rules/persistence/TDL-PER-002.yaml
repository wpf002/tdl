rule_id: TDL-PER-002
name: New Service Created with Suspicious Executable Path
tactic: Persistence
tactic_id: TA0003
technique_id: T1543.003
technique_name: Windows Service
platform:
- Windows
data_sources:
- Windows Security Event Log (7045)
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 80
queries:
  spl: 'index=windows sourcetype="WinEventLog:Security" EventCode=7045

    | stats count values(ComputerName) as affected_systems by Account_Name, IpAddress, Logon_Type, EventCode

    | where count >= 1

    '
  kql: "SecurityEvent\n| where EventID == 7045\n| extend User = coalesce(SubjectUserName, Account)\n| extend IpAddress = coalesce(IpAddress, \"\
    \")\n| extend LogonType = coalesce(LogonType, \"\")\n| extend EventCode = EventID\n| summarize \n    FirstSeen = min(TimeGenerated),\n   \
    \ LastSeen = max(TimeGenerated),\n    AffectedHosts = make_set(Computer),\n    ServiceNames = make_set(Service),\n    EventCount = count()\n\
    \    by User, IpAddress\n| where EventCount >= 1\n| project FirstSeen, LastSeen, User, IpAddress, EventCount, AffectedHosts, ServiceNames\n"
  aql: |
    SELECT username AS user, sourceip AS IpAddress, "Logon Type" AS LogonType, "EventID" AS EventCode, LOGSOURCENAME(logsourceid) AS host, eventtime, "Service Name", "Service File Name"
    FROM events
    WHERE "EventID" = '7045'
    GROUP BY username, sourceip, "Logon Type", "EventID", LOGSOURCENAME(logsourceid), eventtime, "Service Name", "Service File Name"
    LAST 30 DAYS
  yara_l: |
    rule windows_new_service_installed_7045 {
      meta:
        author = "TDL"
        description = "Detects Windows Security Event ID 7045 - A new service was installed"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1543.003"
        severity = "Medium"

      events:
        $e.metadata.event_type = "SERVICE_CREATION"
        $e.metadata.product_event_type = "7045"
        $e.target.user.userid = $user
        $e.principal.ip = $ipaddress
        $e.principal.hostname = $host

      match:
        $user, $ipaddress over 1h

      condition:
        #e >= 1
    }
  esql: |
    FROM logs-system.security*, winlogbeat-*
    | WHERE event.code == "7045" OR winlog.event_id == 7045
    | STATS hosts = VALUES(host.name), event_count = COUNT(*) BY user.name, source.ip
    | WHERE event_count >= 1
    | KEEP user.name, source.ip, hosts, event_count
  leql: |
    where(source_json.EventID=7045) groupby(source_json.SubjectUserName, source_json.IpAddress, asset) calculate(count)
  crowdstrike: |
    EventCode=7045
    | groupBy([user, IpAddress], function=[count(as=event_count), collect([ComputerName, ServiceName, ImagePath])])
    | event_count >= 1
    | table([user, IpAddress, event_count, ComputerName, ServiceName, ImagePath])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 7045
    | alter user = coalesce(action_evtlog_event_data_SubjectUserName, actor_effective_username),
            IpAddress = coalesce(action_remote_ip, action_evtlog_event_data_IpAddress),
            LogonType = action_evtlog_event_data_LogonType,
            EventCode = action_evtlog_event_id
    | comp count() as event_count by user, IpAddress, LogonType, EventCode, agent_hostname
    | filter event_count >= 1
    | fields user, IpAddress, LogonType, EventCode, agent_hostname, event_count
  lucene: |
    event.code:7045 OR EventID:7045 OR winlog.event_id:7045
  sumo: |
    _sourceCategory=*Windows*Security* "7045"
    | json field=_raw "EventID" as event_id
    | json field=_raw "SubjectUserName" as user
    | json field=_raw "IpAddress" as IpAddress
    | json field=_raw "LogonType" as LogonType
    | json field=_raw "ServiceName" as service_name
    | json field=_raw "ServiceFileName" as service_path
    | json field=_raw "Computer" as host
    | where event_id = "7045"
    | fields _messageTime, host, user, IpAddress, LogonType, event_id, service_name, service_path
false_positives:
- Some legitimate software in non-standard paths
tags:
- service
- persistence
author: TDL
created: '2024-01-20'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'
pseudo_logic: '1 Instance within any time window of a Windows Security Event Log event with Event ID 7045 (A new service was installed in the
  system).


  From index=windows sourcetype="WinEventLog:Security"

  Where event_id is 7045

  With user, IpAddress, LogonType, and EventCode captured for correlation

  With a minimum count of 1 matching event required


  With the same user and IpAddress as the correlation key, deduplicating on host to surface all affected systems per actor.'

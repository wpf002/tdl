rule_id: TDL-PER-004
name: WMI Event Subscription Created for Persistence
tactic: Persistence
tactic_id: TA0003
technique_id: T1546.003
technique_name: WMI Event Subscription
platform:
- Windows
data_sources:
- Sysmon Event ID 19/20/21
severity: Critical
fidelity: High
lifecycle: Deployed
risk_score: 90
queries:
  spl: 'index=endpoint sourcetype=Sysmon (EventCode=19 OR EventCode=20 OR EventCode=21)

    | regex Image="*.+*"

    | search NOT (Image="*\\ccmexec.exe" OR Image="*\\CcmExec.exe" OR ParentImage="*\\ccmexec.exe" OR ParentImage="*\\CcmExec.exe" OR Image="*\\HealthService.exe"
    OR ParentImage="*\\HealthService.exe")

    | stats values(ComputerName) as hosts, values(User) as users, count by Image, ParentImage, CommandLine

    | rename Image as process_name, ParentImage as parent_process_name, CommandLine as command_line

    | table _time, process_name, parent_process_name, command_line, hosts, users, count

    '
  kql: |
    Event
    | where TimeGenerated > ago(90d)
    | where Source == "Microsoft-Windows-Sysmon" and EventID in (19, 20, 21)
    | extend EventData = parse_xml(EventData)
    | extend ProcessName = tostring(EventData.DataItem.EventData.Data[4]["#text"])
    | extend ParentProcessName = tostring(EventData.DataItem.EventData.Data[20]["#text"])
    | extend CommandLine = tostring(EventData.DataItem.EventData.Data[10]["#text"])
    | extend User = tostring(EventData.DataItem.EventData.Data[3]["#text"])
    | where ProcessName matches regex ".+.+"
    | where ProcessName !has_any ("ccmexec.exe", "CcmExec.exe", "SMS_", "smswd.exe", "CmRcService.exe")
    | summarize Hosts = make_set(Computer), Users = make_set(User), Count = count() by ProcessName, ParentProcessName, CommandLine
    | project ProcessName, ParentProcessName, CommandLine, Hosts, Users, Count
  aql: |
    SELECT eventtime, LOGSOURCENAME(logsourceid) AS host, username, "Process Name" AS process_name, "Parent Process Name" AS parent_process_name, "Process CommandLine" AS command_line, "EventID", COUNT(*) AS event_count
    FROM events
    WHERE "EventID" IN ('19', '20', '21')
      AND "Process Name" IS NOT NULL
      AND "Process Name" != ''
      AND "Process Name" NOT ILIKE '%ccmexec.exe%'
      AND "Process Name" NOT ILIKE '%sccm%'
      AND "Parent Process Name" NOT ILIKE '%ccmexec.exe%'
      AND "Parent Process Name" NOT ILIKE '%sccm%'
    GROUP BY eventtime, LOGSOURCENAME(logsourceid), username, "Process Name", "Parent Process Name", "Process CommandLine", "EventID"
    ORDER BY eventtime DESC
    LAST 24 HOURS
  yara_l: |
    rule wmi_event_subscription_persistence {
      meta:
        author = "Detection Engineer"
        description = "Detects WMI Event Subscription creation (T1546.003) via Sysmon Event ID 19/20/21"
        mitre_attack_tactic = "Persistence"
        mitre_attack_technique = "T1546.003"
        severity = "Medium"

      events:
        $e.metadata.product_event_type = "19" or
        $e.metadata.product_event_type = "20" or
        $e.metadata.product_event_type = "21"
        $e.principal.process.file.full_path = $process_name
        $e.principal.process.parent_process.file.full_path = $parent_process_name
        $e.principal.process.command_line = $command_line
        $e.principal.hostname = $host
        $e.principal.user.userid = $user
        not re.regex($e.principal.process.file.full_path, `(?i)\\ccmexec\.exe$`)
        not re.regex($e.principal.process.file.full_path, `(?i)\\ccmsetup\.exe$`)
        not re.regex($e.principal.process.file.full_path, `(?i)\\sccm.*\.exe$`)

      match:
        $process_name, $parent_process_name, $command_line over 1h

      condition:
        $e
    }
  esql: "FROM logs-windows.sysmon_operational*\n| WHERE winlog.event_id IN (19, 20, 21)\n  AND process.name RLIKE \".+.*\"\n  AND NOT (\n    process.name\
    \ IN (\"ccmexec.exe\", \"CcmExec.exe\", \"CCMEXEC.EXE\") \n    OR process.parent.name IN (\"ccmexec.exe\", \"CcmExec.exe\", \"CCMEXEC.EXE\"\
    )\n    OR process.name LIKE \"*sccm*\"\n  )\n| STATS \n    hosts = VALUES(host.name),\n    users = VALUES(user.name),\n    event_count = COUNT(*)\n\
    \  BY process.name, process.parent.name, process.command_line\n| WHERE event_count >= 1\n| KEEP process.name, process.parent.name, process.command_line,\
    \ hosts, users, event_count\n"
  leql: |
    where(source_json.EventID IN [19, 20, 21]) groupby(process_name, parent_process_name, process_cmd_line, asset, user) calculate(count)
  crowdstrike: |
    EventCode IN [19, 20, 21]
    | case {
        EventCode=19 | rename("EventFilter", as=SubscriptionType);
        EventCode=20 | rename("EventConsumer", as=SubscriptionType);
        EventCode=21 | rename("FilterToConsumerBinding", as=SubscriptionType);
        * | SubscriptionType:="Unknown";
      }
    | Image=/.+/
    | not (Image IN [*sccm*, *ccmexec.exe, *SMS_*.exe, *wbemtest.exe] OR ParentImage IN [*sccm*, *ccmexec.exe, *SMS_*.exe])
    | groupBy([Image, ParentImage, CommandLine], function=count(ComputerName, distinct=true, as=host_count))
    | groupBy([Image, ParentImage, CommandLine], function=count(User, distinct=true, as=user_count))
    | table([@timestamp, ComputerName, User, Image, ParentImage, CommandLine, EventCode, SubscriptionType, host_count, user_count])
  xql: "dataset = xdr_data\n| filter action_evtlog_event_id in (19, 20, 21)\n| filter action_process_image_name ~= \".+.*\"\n| filter actor_process_image_name\
    \ not in (\"ccmexec.exe\", \"CcmExec.exe\", \"SMS_EXECUTIVE.exe\", \"WmiPrvSE.exe\", \"wmiprvse.exe\") \n  and action_process_image_name not\
    \ in (\"ccmexec.exe\", \"CcmExec.exe\", \"SMS_EXECUTIVE.exe\")\n| comp count_distinct(agent_hostname) as host_count, count_distinct(actor_effective_username)\
    \ as user_count by action_process_image_name, actor_process_image_name, action_process_image_command_line\n| fields action_process_image_name,\
    \ actor_process_image_name, action_process_image_command_line, host_count, user_count\n"
  lucene: |
    winlog.event_id:(19 OR 20 OR 21) AND NOT (process.name:(*CcmExec.exe OR *HealthService.exe OR *SCOM*.exe OR *ManagementServer.exe) OR process.parent.name:(*CcmExec.exe OR *HealthService.exe OR *SCOM*.exe OR *ManagementServer.exe))
  sumo: |
    _sourceCategory=*Sysmon* ("19" OR "20" OR "21")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Image" as process_name
    | json field=_raw "ParentImage" as parent_process_name
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "Computer" as host
    | json field=_raw "User" as user
    | where event_id in ("19", "20", "21")
    | where !(process_name matches "*sccm*" or process_name matches "*ccmexec.exe" or process_name matches "*CcmEval.exe")
    | fields _messageTime, host, user, event_id, process_name, parent_process_name, command_line
false_positives:
- SCCM and management tools using WMI subscriptions
tags:
- wmi
- persistence
- fileless
author: TDL
created: '2024-01-22'
test_method: purple_team
last_modified: '2026-08-10'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, user, and the persistence artifact (registry path / scheduled task / service / config).'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the persistence target points to an unusual
  location or unsigned binary.
- Determine when the artifact was created and which process/account performed the write — pivot on that process for the original attack chain.
- 'Look for prior child-process activity from the persistence target: did anything actually launch from it?'
- 'Decide TP / FP: FP for sanctioned management software (RMM, vendor agents, custom installers) — verify against the asset register.'
- 'If TP: remove the persistence artifact, isolate the host, hunt for the same artifact across the fleet, and rotate any credentials touched by
  the persistent process.'
pseudo_logic: '1 Instance within any time window of a WMI Event Subscription creation event.


  From index=endpoint sourcetype=Sysmon

  Where EventCode IN (19, 20, 21)

  With process_name matching wildcard pattern "*.+*"

  With parent_process_name captured for correlation context

  With command_line captured for full subscription detail review

  With hosts and users enumerated per unique process_name, parent_process_name, and command_line combination

  Excluding known SCCM agents and authorized WMI management tool processes from the admin allow-list

  With the same process_name, parent_process_name, and command_line as the correlation key with no minimum spacing or deduplication window required'

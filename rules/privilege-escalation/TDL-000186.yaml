rule_id: TDL-PE-000186
v4_id: 000186
name: Sudo File Modified
description: Detects a user modifying the sudoer file on a host. An attacker may attempt to escalate privileges by adding compromised accounts
  directly to the sudoer file to gain root permissions. These direct modifications should be considered suspicious since most sudo additions occur
  through the adduser or usermod commands.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1548
technique_name: Abuse Elevation Control Mechanism
platform:
- Linux
data_sources:
- Linux Operating System
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=linux sourcetype IN (linux_secure, syslog) (CommandLine="*visudo*" OR command="*visudo*" OR bash_command="*visudo*") (CommandLine="*etc/sudoers*"
    OR CommandLine="*sudoers*" OR command="*etc/sudoers*" OR command="*sudoers*" OR bash_command="*etc/sudoers*" OR bash_command="*sudoers*")

    | table _time, host, user, CommandLine, command, bash_command

    '
  kql: |
    Syslog
    | where TimeGenerated > ago(24h)
    | where ProcessName has "bash" or ProcessName has "sh" or ProcessName has "zsh" or ProcessName has "dash" or SyslogMessage has "COMMAND="
    | where SyslogMessage has "visudo" and (SyslogMessage has "etc/sudoers" or SyslogMessage has "sudoers")
    | project TimeGenerated, Computer, ProcessName, SyslogMessage, HostIP, _ResourceId
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Command Line" AS command
    FROM events
    WHERE LOWER("Command Line") LIKE '%visudo%'
      AND (LOWER("Command Line") LIKE '%etc/sudoers%' OR LOWER("Command Line") LIKE '%sudoers%')
    LAST 24 HOURS
  yara_l: |
    rule linux_sudoers_modification_via_visudo {
      meta:
        author = "TDL"
        description = "Detects potential privilege escalation through sudoers file modification via visudo command"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1548"
        severity = "MEDIUM"

      events:
        $e.metadata.event_type = "PROCESS_LAUNCH"
        re.regex($e.principal.process.command_line, `(?i)visudo`)
        (
          re.regex($e.principal.process.command_line, `(?i)etc/sudoers`) or
          re.regex($e.principal.process.command_line, `(?i)sudoers`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-endpoint.events.process-*, logs-system.auth-*, logs-*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.category == "process"
      AND host.os.type == "linux"
      AND process.command_line IS NOT NULL
      AND process.command_line LIKE "*visudo*"
      AND (process.command_line LIKE "*etc/sudoers*" OR process.command_line LIKE "*sudoers*")
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable
  leql: |
    where(process_cmd_line ICONTAINS "visudo" AND (process_cmd_line ICONTAINS "etc/sudoers" OR process_cmd_line ICONTAINS "sudoers"))
  crowdstrike: |
    event_platform=Lin event_simpleName=ProcessRollup2 CommandLine=*visudo* (CommandLine=*etc/sudoers* OR CommandLine=*sudoers*)
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName])
  xql: |
    dataset = xdr_data
    | filter agent_os_type = AGENT_OS_LINUX
      and event_type = ENUM.EVENT_TYPE_PROCESS
      and (action_process_image_command_line contains "visudo" or actor_process_image_command_line contains "visudo")
      and (action_process_image_command_line ~= "(?i)(etc/sudoers|sudoers)" or actor_process_image_command_line ~= "(?i)(etc/sudoers|sudoers)")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_name, action_process_image_command_line
  lucene: |
    event.category:process AND (process.command_line:*visudo* AND (process.command_line:*etc\/sudoers* OR process.command_line:*sudoers*))
  sumo: |
    _sourceCategory=*Linux* (visudo AND (sudoers OR "etc/sudoers"))
    | parse regex "(?<command_line>.*)"
    | where command_line matches "*visudo*" and (command_line matches "*etc/sudoers*" or command_line matches "*sudoers*")
    | fields _messageTime, _sourceHost, command_line
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- edp
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Linux Command Line Event

  Where the Command contains "visudo"

  Where the Command contains "etc/sudoers" OR "sudoers"'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the file path, file hash, parent process, and any prior network/email delivery — verify the privilege gain was not part of an approved
  elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

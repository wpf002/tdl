rule_id: TDL-PE-000260
v4_id: '000260'
name: Change in GPO by Unauthorized User
description: Detects when a change is performed in GPO by a user not authorized to perform that change.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1484
technique_name: Domain or Tenant Policy Modification
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5136'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=wineventlog sourcetype=WinEventLog:Security EventCode=5136 ObjectClass="groupPolicyContainer"
    | table _time, ComputerName, SubjectUserName, ObjectDN, AttributeLDAPDisplayName, AttributeValue
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where event_id in ("5136")

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"event_id\" IN ('5136')\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_pe_000260 {\n  meta:\n    author = \"TDL\"\n    description = \"Change in GPO by Unauthorized User\"\n    severity = \"\
    HIGH\"\n    tactic = \"TA0004\"\n    technique = \"T1484\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.event_id =\
    \ /(5136)/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND event_id IN ("5136")

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND event_id IN [5136])

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND event_id IN (5136)

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND event_id in ("5136")

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND event_id:(5136)

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND event_id IN ("5136")

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-07-18'
test_method: none
pseudo_logic: '1 Windows Security

  Where the Event ID is in [5136]

  Where the ObjectClass is "groupPolicyContainer"'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

rule_id: TDL-PE-000260
v4_id: '000260'
name: Change in GPO by Unauthorized User
description: Detects when a change is performed in GPO by a user not authorized to perform that change.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1484
technique_name: Domain or Tenant Policy Modification
platform:
- Windows
data_sources:
- Windows Operating System
- 'Event IDs: 5136'
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=wineventlog sourcetype=WinEventLog:Security EventCode=5136 ObjectClass="groupPolicyContainer"

    | table _time, ComputerName, SubjectUserName, ObjectDN, AttributeLDAPDisplayName, AttributeValue

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 5136
    | where ObjectClass == "groupPolicyContainer"
    | project TimeGenerated, Computer, Account, SubjectUserName, SubjectDomainName, ObjectClass, ObjectDN, AttributeLDAPDisplayName, AttributeValue, OperationType
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "ObjectClass", "ObjectDN", "AttributeLDAPDisplayName", "AttributeValue"
    FROM events
    WHERE "EventID" = '5136'
      AND "ObjectClass" = 'groupPolicyContainer'
    LAST 24 HOURS
  yara_l: "rule mitre_t1484_group_policy_modification {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects modifications\
    \ to Group Policy objects via event 5136\"\n    mitre_attack_tactic = \"Privilege Escalation\"\n    mitre_attack_technique = \"T1484\"\n \
    \   severity = \"Medium\"\n  \n  events:\n    $e.metadata.event_type = \"SETTING_MODIFICATION\"\n    $e.metadata.product_event_type = \"5136\"\
    \n    $e.target.resource.attribute.labels[\"ObjectClass\"] = \"groupPolicyContainer\"\n    $e.principal.hostname = $host\n  \n  match:\n \
    \   $host over 5m\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-system.security*, logs-windows.security*, winlogbeat-*
    | WHERE event.code == "5136" AND winlog.event_data.ObjectClass == "groupPolicyContainer"
    | KEEP @timestamp, host.name, user.name, winlog.event_data.ObjectDN, winlog.event_data.AttributeLDAPDisplayName, winlog.event_data.AttributeValue, winlog.event_data.OperationType
  leql: |
    where(source_json.EventID=5136 AND source_json.ObjectClass="groupPolicyContainer")
  crowdstrike: |
    EventCode=5136 ObjectClass=groupPolicyContainer
    | table([@timestamp, ComputerName, SubjectUserName, ObjectDN, AttributeLDAPDisplayName, AttributeValue])
  xql: |
    dataset = xdr_data
    | filter action_evtlog_event_id = 5136
    | filter action_evtlog_event_data_ObjectClass = "groupPolicyContainer"
    | fields _time, agent_hostname, actor_effective_username, action_evtlog_event_data_ObjectDN, action_evtlog_event_data_AttributeLDAPDisplayName, action_evtlog_event_data_AttributeValue
  lucene: |
    event.code:5136 AND ObjectClass:groupPolicyContainer
  sumo: |
    _sourceCategory=*Windows*Security* "5136"
    | json field=_raw "EventID" as event_id
    | json field=_raw "ObjectClass" as object_class
    | where event_id = "5136" and object_class = "groupPolicyContainer"
    | fields _messageTime, _sourceHost, event_id, object_class
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: '1 Windows Security

  Where the Event ID is in [5136]

  Where the ObjectClass is "groupPolicyContainer"'
suppression:
  window: 8 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the source IP, geo / ASN, authentication method, and prior sign-in pattern for the user — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

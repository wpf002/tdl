rule_id: TDL-PE-000296
v4_id: 000296
name: Google Workspace Admin Role Created
description: This rule detects the creation of a new delegated admin role within Google Workspace. New roles of this type can be used to assign
  administrative privileges to users, and can be part of a privilege escalation attempt.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1078
technique_name: Valid Accounts
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Low
fidelity: Low
lifecycle: Deployed
risk_score: 30
queries:
  spl: 'index=google_workspace events.name="CREATE_ROLE"

    | table _time, user, events.name, events.parameters.ROLE_NAME, events.parameters.ROLE_ID, events.parameters.ORG_UNIT_NAME

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(90d)
    | where RecordType == "admin"
    | mv-expand Events = parse_json(Events)
    | where Events.name == "CREATE_ROLE"
    | project TimeGenerated, ActorIpAddress, ActorCallerType, Events, RecordType
  aql: "SELECT username, sourceip, eventtime, QIDNAME(qid), UTF8(payload) AS event_details\nFROM events\nWHERE QIDNAME(qid) ILIKE '%google%workspace%'\
    \ \n  AND (UTF8(payload) ILIKE '%CREATE_ROLE%' OR UTF8(payload) ILIKE '%create_role%')\nLAST 24 HOURS\n"
  yara_l: |
    rule gworkspace_create_role_privilege_escalation {
      meta:
        author = "TDL"
        description = "Detects creation of custom roles in Google Workspace which may indicate privilege escalation attempts"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1078"
        severity = "Medium"

      events:
        $e.metadata.vendor_name = "Google"
        $e.metadata.product_name = "Google Workspace"
        $e.metadata.event_type = "USER_RESOURCE_UPDATE_CONTENT"
        $e.metadata.product_event_type = "CREATE_ROLE"
        $e.principal.user.userid = $user
        $e.principal.ip = $ip

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action == "CREATE_ROLE" OR event.dataset == "google_workspace.admin" AND event.action == "CREATE_ROLE"
    | KEEP @timestamp, user.email, user.name, event.action, google_workspace.admin.new_value, google_workspace.admin.role.name, source.ip, user_agent.original
  leql: |
    where(source_json.events.name="CREATE_ROLE")
  crowdstrike: |
    #type=gws events.name="CREATE_ROLE"
    | table([@timestamp, actor.email, events.name, events.parameters.ROLE_NAME, ipAddress])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = GCP and event_type = "CREATE_ROLE"
    | fields _time, actor_user, cloud_project, event_type, resource_name, resource_type
  lucene: |
    events.name:"CREATE_ROLE"
  sumo: |
    _sourceCategory=*Google*Workspace* "CREATE_ROLE"
    | json field=_raw "events[*].name" as event_name
    | where event_name = "CREATE_ROLE"
    | fields _messageTime, _sourceHost, event_name
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is "CREATE_ROLE"'
suppression:
  window: 24 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

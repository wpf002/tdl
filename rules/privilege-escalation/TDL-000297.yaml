rule_id: TDL-PE-000297
v4_id: 000297
name: Google Workspace User Assigned to Super Admin Role
description: Detects when a user is assigned the _SEED_ADMIN_ROLE, granting super-user permissions within Google Workspace.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1078
technique_name: Valid Accounts
platform:
- Google Workspace
data_sources:
- Google Workspace
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=google_workspace sourcetype="google:gws:admin" events.name="ASSIGN_ROLE" events.parameters.ROLE_NAME="_SEED_ADMIN_ROLE"

    | table _time, user, events.actor.email, events.parameters.USER_EMAIL, events.parameters.ROLE_NAME, events.parameters.ORG_UNIT_NAME

    '
  kql: |
    GWorkspaceActivityReports
    | where TimeGenerated > ago(90d)
    | where RecordType == "admin"
    | where Operation == "ASSIGN_ROLE"
    | extend RoleName = tostring(parse_json(tostring(Parameters)).ROLE_NAME)
    | where RoleName == "_SEED_ADMIN_ROLE"
    | project TimeGenerated, ActorEmail = Actor, TargetUserEmail = tostring(parse_json(tostring(Parameters)).USER_EMAIL), RoleName, IPAddress, Parameters
  aql: "SELECT eventtime, username, sourceip, \"ACTOR_EMAIL\", \"ROLE_NAME\", \"USER_EMAIL\", LOGSOURCENAME(logsourceid) AS log_source\nFROM events\n\
    WHERE \"Event Name\" = 'ASSIGN_ROLE' \n  AND \"ROLE_NAME\" = '_SEED_ADMIN_ROLE'\nLAST 24 HOURS\n"
  yara_l: |
    rule google_workspace_seed_admin_role_assignment {
      meta:
        author = "TDL"
        description = "Detects assignment of _SEED_ADMIN_ROLE in Google Workspace"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1078"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Google"
        $e.metadata.product_name = "Google Workspace"
        $e.metadata.product_event_type = "ASSIGN_ROLE"
        $e.target.user.userid = $user
        $e.principal.user.userid = $admin
        re.regex($e.security_result.summary, `(?i)_SEED_ADMIN_ROLE`)

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-google_workspace*
    | WHERE event.action == "ASSIGN_ROLE" AND google_workspace.admin.role.name == "_SEED_ADMIN_ROLE"
    | KEEP @timestamp, user.name, user.email, google_workspace.actor.email, google_workspace.admin.role.name, google_workspace.admin.user.email, event.action, host.name
  leql: |
    where(source_json.events.name="ASSIGN_ROLE" AND source_json.ROLE_NAME="_SEED_ADMIN_ROLE")
  crowdstrike: |
    #type=GoogleWorkspace events.name="ASSIGN_ROLE" ROLE_NAME="_SEED_ADMIN_ROLE"
    | table([@timestamp, actor.email, ipAddress, ROLE_NAME, USER_EMAIL])
  xql: |
    dataset = cloud_audit_logs
    | filter vendor = "Google" and cloud_provider = "GCP"
    | filter event_name = "ASSIGN_ROLE"
    | filter raw_log contains "_SEED_ADMIN_ROLE"
    | fields _time, actor_user, event_name, raw_log
  lucene: |
    events.name:"ASSIGN_ROLE" AND ROLE_NAME:"_SEED_ADMIN_ROLE"
  sumo: |
    _sourceCategory=*Google*Workspace* "ASSIGN_ROLE"
    | json field=_raw "events[*].name" as event_name
    | json field=_raw "events[*].parameters[*].name" as param_names
    | json field=_raw "events[*].parameters[*].value" as param_values
    | where event_name = "ASSIGN_ROLE"
    | where param_names matches "*ROLE_NAME*" and param_values matches "*_SEED_ADMIN_ROLE*"
    | fields _messageTime, _sourceHost, event_name, param_names, param_values
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Google Workspace Event

  Where the events.name is "ASSIGN ROLE"

  AND the ROLE_NAME is "_SEED_ADMIN_ROLE"'
suppression:
  window: 12 hours
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

rule_id: TDL-PE-000321
v4_id: '000321'
name: Access denied for Service Account - GCP
description: Detect when a GCP service account exhibits access denied behavior that deviates from normal.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1078
technique_name: T1078
platform:
- GCP
data_sources:
- GCP
severity: Medium
fidelity: Medium
lifecycle: Deployed
risk_score: 55
queries:
  spl: 'index=gcp sourcetype=gcp:cloudaudit

    | search src_user="*service*" status="*7*"

    | bin _time span=5m

    | stats count by _time, src_user

    | where count >= 10

    '
  kql: |
    GCPAuditLogs
    | where TimeGenerated > ago(5m)
    | where UserIdentity has "service" and ResultDescription contains "7"
    | summarize EventCount = count() by bin(TimeGenerated, 5m), UserIdentity, ProjectId
    | where EventCount >= 10
  aql: |
    SELECT username, sourceip, COUNT(*) AS event_count
    FROM events
    WHERE username ILIKE '%service%' AND "Status" ILIKE '%7%'
    GROUP BY username, sourceip
    HAVING event_count >= 10
    LAST 5 MINUTES
  yara_l: "rule gcp_service_account_privilege_escalation {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects potential\
    \ privilege escalation via GCP service accounts - T1078\"\n    mitre_attack_tactic = \"Privilege Escalation\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    $e.metadata.vendor_name = \"Google Cloud Platform\"\n    $e.metadata.product_name\
    \ = \"GCP\"\n    re.regex($e.principal.user.userid, `(?i)service`)\n    re.regex($e.security_result.summary, `7`)\n    $e.principal.user.userid\
    \ = $user\n    \n  match:\n    $user over 5m\n    \n  condition:\n    #e >= 10\n}\n"
  esql: "FROM logs-gcp.audit*\n| WHERE @timestamp > NOW() - 5 minutes \n  AND user.name LIKE \"*service*\" \n  AND event.outcome == \"failure\"\
    \n| STATS event_count = COUNT(*) BY user.name, source.ip, bucket = BUCKET(@timestamp, 5 minutes)\n| WHERE event_count >= 10\n| KEEP bucket,\
    \ user.name, source.ip, event_count\n"
  leql: |
    where(source_json.logName ICONTAINS "cloudaudit" AND source_user ICONTAINS "service" AND source_json.protoPayload.status.code CONTAINS "7") groupby(source_user) calculate(count)
  crowdstrike: |
    #type=gcp_audit src_user=*service* status=*7*
    | bucket(span=5m, function=[count(as=event_count), collect([src_user, status])])
    | event_count >= 10
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = GCP and actor_user ~= ".*service.*" and outcome_reason ~= ".*7.*"
    | bin _time span=5m
    | comp count() as event_count by _time, actor_user, project_id
    | filter event_count >= 10
    | fields _time, actor_user, project_id, event_count
  lucene: |
    _exists_:src_user AND src_user:*service* AND status:*7*
  sumo: |
    _sourceCategory=*GCP* OR _sourceCategory=*CloudAudit*
    | json field=_raw "protoPayload.authenticationInfo.principalEmail" as src_user
    | json field=_raw "protoPayload.status.code" as status
    | where src_user matches "*service*" AND status matches "*7*"
    | timeslice 5m
    | count as event_count by _timeslice, src_user
    | where event_count >= 10
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '10 Cloud Audit event within 5 minutes

  where src_user matches "service" AND status contains "7"'
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

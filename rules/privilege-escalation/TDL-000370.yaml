rule_id: TDL-PE-000370
v4_id: '000370'
name: Azure Domain Trust Modification Detected
description: Adversaries may add new domain trusts or modify the properties of existing domain trusts to evade defenses and/or elevate privileges.
  This will detect when a user or application modifies the federation settings on the domain or update domain authentication.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1484
technique_name: Domain or Tenant Policy Modification
platform:
- Azure
data_sources:
- Azure AD
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=azuread (Operation="Set federation settings on domain" OR Operation="Set domain authentication") ResultStatus=success

    | table _time, User, Operation, ResultStatus, TargetResources, IPAddress

    '
  kql: |
    AuditLogs
    | where TimeGenerated > ago(24h)
    | where OperationName in ("Set federation settings on domain", "Set domain authentication")
    | where Result == "success"
    | extend InitiatedBy = tostring(InitiatedBy.user.userPrincipalName)
    | extend TargetResources = tostring(TargetResources[0].displayName)
    | project TimeGenerated, OperationName, Result, InitiatedBy, TargetResources, ActivityDisplayName, CorrelationId, Identity
  aql: |
    SELECT username, sourceip, devicetype, qidname(qid), LOGSOURCENAME(logsourceid), "Action", "EventName", eventtime
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%Azure%'
      AND ("EventName" IN ('Set federation settings on domain', 'Set domain authentication') OR qidname(qid) IN ('Set federation settings on domain', 'Set domain authentication'))
      AND ("Action" = 'success' OR qidname(qid) ILIKE '%success%')
    LAST 24 HOURS
  yara_l: |
    rule azure_ad_domain_federation_modification {
      meta:
        author = "Detection Engineer"
        description = "Detects successful Azure AD domain federation or authentication setting modifications (T1484)"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1484"
        severity = "HIGH"

      events:
        $e.metadata.vendor_name = "Microsoft"
        $e.metadata.product_name = "Azure Active Directory"
        (
          $e.metadata.product_event_type = "Set federation settings on domain" or
          $e.metadata.product_event_type = "Set domain authentication"
        )
        $e.security_result.action = "ALLOW"
        $e.principal.user.userid = $user
        $e.target.resource.name = $domain

      match:
        $user, $domain over 5m

      condition:
        $e
    }
  esql: "FROM logs-azure.auditlogs*\n| WHERE @timestamp > NOW() - 24 hours \n  AND event.action IN (\"Set federation settings on domain\", \"\
    Set domain authentication\")\n  AND event.outcome == \"success\"\n| KEEP @timestamp, azure.auditlogs.properties.initiated_by_user.user_principal_name,\
    \ event.action, azure.tenantid, azure.auditlogs.properties.target_resources\n"
  leql: |
    where(source_json.category="AuditLogs" AND source_json.operationName IN ["Set federation settings on domain", "Set domain authentication"] AND source_json.resultType="0")
  crowdstrike: |
    #type=AzureAD (OperationName="Set federation settings on domain" OR OperationName="Set domain authentication") ResultStatus=success
    | table([@timestamp, UserPrincipalName, OperationName, ResultStatus, IPAddress, TargetResources])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = ENUM.CLOUD_PROVIDER_AZURE
    | filter operation_name in ("Set federation settings on domain", "Set domain authentication")
    | filter outcome = "success"
    | fields _time, operation_name, identity_name, resource_name, outcome, cloud_provider
  lucene: |
    (event.action:"Set federation settings on domain" OR event.action:"Set domain authentication") AND event.outcome:success
  sumo: |
    _sourceCategory=*Azure* OR _sourceCategory=*AzureAD* OR _sourceCategory=*Azure*AD*
    | json field=_raw "operationName" as operation_name
    | json field=_raw "resultType" as result_type
    | json field=_raw "properties.result" as result
    | where (operation_name matches "*Set federation settings on domain*" OR operation_name matches "*Set domain authentication*")
    | where (result_type = "Success" OR result = "success" OR result_type matches "*success*")
    | fields _messageTime, _sourceHost, operation_name, result_type, result
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: 'Tune per environment baseline. Tuning period: 7 days.'
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where the Event is in [Set federation settings on domain, Set domain authentication]

  Where Action is in [success]'
suppression:
  window: 8 hours
  fields:
  - src_user
tuning_period: 7 days
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

rule_id: TDL-PE-000379
v4_id: 000379
name: Azure Subscription Permission Elevation
description: Detects when a user has been elevated to manage all Azure Subscriptions. This setting could allow an attacker access to all Azure
  subscriptions in the environment.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1078
technique_name: Valid Accounts
platform:
- Azure
data_sources:
- Azure AD
severity: High
fidelity: High
lifecycle: Deployed
risk_score: 75
queries:
  spl: 'index=azure (sourcetype=azure:aad:audit OperationName="Assigns the caller to user access admin") OR (sourcetype=azure:activity OperationName="MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION")

    | table _time, user, OperationName, ResultStatus, SourceIPAddress, UserAgent

    '
  kql: "union \n(AuditLogs\n| where TimeGenerated > ago(24h)\n| where OperationName has \"Assigns the caller to user access admin\"\n| extend\
    \ Actor = tostring(InitiatedBy.user.userPrincipalName)\n| extend ActorIP = tostring(InitiatedBy.user.ipAddress)\n| project TimeGenerated,\
    \ OperationName, Actor, ActorIP, Result, TargetResources, CorrelationId, Category),\n(AzureActivity\n| where TimeGenerated > ago(24h)\n| where\
    \ OperationNameValue =~ \"MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION\"\n| extend Actor = Caller\n| extend ActorIP = CallerIpAddress\n| project\
    \ TimeGenerated, OperationNameValue, Actor, ActorIP, ActivityStatusValue, ResourceGroup, SubscriptionId, CorrelationId, CategoryValue)\n|\
    \ project TimeGenerated, EventName = coalesce(OperationName, OperationNameValue), Actor, ActorIP\n"
  aql: |
    SELECT eventtime, username, sourceip, qidname(qid), CATEGORYNAME(category), "Event Name", LOGSOURCENAME(logsourceid)
    FROM events
    WHERE ("Event Name" = 'Assigns the caller to user access admin' OR "Event Name" = 'MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION')
      AND (LOGSOURCENAME(logsourceid) ILIKE '%Azure%' OR CATEGORYNAME(category) ILIKE '%Azure%')
    LAST 24 HOURS
  yara_l: "rule azure_privilege_escalation_elevation {\n  meta:\n    author = \"Detection Engineer\"\n    description = \"Detects Azure AD privilege\
    \ escalation via user access admin assignment or elevation action\"\n    mitre_attack_tactic = \"Privilege Escalation\"\n    mitre_attack_technique\
    \ = \"T1078\"\n    severity = \"HIGH\"\n    \n  events:\n    (\n      $e.metadata.product_name = \"Azure Active Directory\"\n      (\n   \
    \     $e.metadata.product_event_type = \"Assigns the caller to user access admin\"\n      )\n    ) or (\n      $e.metadata.product_name =\
    \ \"Azure\"\n      (\n        strings.to_upper($e.metadata.product_event_type) = \"MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION\"\n      )\n\
    \    )\n    $e.principal.user.userid = $user\n    $e.target.resource.name = $resource\n    \n  match:\n    $user over 5m\n    \n  outcome:\n\
    \    $risk_score = 85\n    \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-azure.activitylogs*, logs-azure.auditlogs*
    | WHERE (event.action == "Assigns the caller to user access admin" OR event.action == "MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION")
    | KEEP @timestamp, host.name, user.name, event.action, event.outcome, azure.activitylogs.operation_name, azure.auditlogs.operation_name, source.ip, user.id
  leql: |
    where(source_json.operationName IN ["Assigns the caller to user access admin", "MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION"])
  crowdstrike: |
    (#repo=azure* OR #type=azure* OR event_simpleName=*Azure*)
    (EventName="Assigns the caller to user access admin" OR EventName="MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION" OR operationName="Assigns the caller to user access admin" OR operationName="MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION")
    | table([@timestamp, ComputerName, UserName, EventName, operationName, callerIpAddress, userId, userPrincipalName])
  xql: |
    dataset = cloud_audit_logs
    | filter cloud_provider = "Azure" and (operation in ("Assigns the caller to user access admin", "MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION") or lowercase(operation) in ("microsoft.authorization/elevateaccess/action"))
    | fields _time, actor_user, operation, cloud_provider, resource_name, raw_log
  lucene: |
    (event.action:"Assigns the caller to user access admin" OR event.action:"MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION")
  sumo: |
    _sourceCategory=*Azure* (("Assigns the caller to user access admin") OR ("MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION"))
    | json field=_raw "operationName" as operation_name
    | json field=_raw "properties.message" as message
    | json field=_raw "caller" as caller
    | json field=_raw "callerIpAddress" as caller_ip
    | where operation_name matches "*ELEVATEACCESS/ACTION*" OR message matches "*user access admin*"
    | fields _messageTime, _sourceHost, operation_name, message, caller, caller_ip
false_positives:
- Legitimate admin activity
- Authorized service accounts
tuning_guidance: Tune per environment baseline.
tags:
- auth
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: historical
pseudo_logic: '1 Azure AD Event

  Where Event Name is in ["Assigns the caller to user access admin"]

  OR

  1 Azure Activity Event

  Where Event Name is in ["MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION"]'
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the calling identity (ARN / UPN), source IP, user agent, and the resource being acted on — verify the privilege gain was not part of
  an approved elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

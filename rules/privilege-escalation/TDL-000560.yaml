rule_id: TDL-PE-000560
v4_id: '000560'
name: Kubernetes Pod Shared Object Modification or Creation
description: A Kubernetes pod was either created, updated or patched with a shared process namespace.
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Medium
fidelity: Medium
lifecycle: Proposed
risk_score: 55
queries:
  spl: 'index=kubernetes (verb=patch OR verb=create OR verb=update) requestObject.spec.shareProcessNamespace=true

    | table _time, user, verb, objectRef.namespace, objectRef.name, objectRef.resource, requestObject.spec.shareProcessNamespace, sourceIPs{}

    '
  kql: |
    KubeEvents
    | where TimeGenerated > ago(1h)
    | where Verb in ("patch", "create", "update")
    | extend shareProcessNamespace = tostring(parse_json(RequestObject).spec.shareProcessNamespace)
    | where shareProcessNamespace == "true"
    | project TimeGenerated, Verb, ObjectRef, RequestObject, User, SourceIPs, UserAgent, ResponseStatus
  aql: |
    SELECT eventtime, username, sourceip, "Verb", "ObjectRef.Namespace", "ObjectRef.Name", "RequestObject.Spec.ShareProcessNamespace", LOGSOURCENAME(logsourceid) AS log_source
    FROM events
    WHERE LOGSOURCENAME(logsourceid) ILIKE '%kubernetes%'
      AND "Verb" IN ('patch', 'create', 'update')
      AND "RequestObject.Spec.ShareProcessNamespace" = 'true'
    LAST 24 HOURS
  yara_l: |
    rule mitre_t1611_escape_to_host_shareprocessnamespace {
      meta:
        author = "TDL"
        description = "Detects Kubernetes pod modifications enabling shareProcessNamespace for container escape"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1611"
        severity = "HIGH"

      events:
        $e.metadata.product_name = "Kubernetes"
        $e.metadata.event_type = "RESOURCE_WRITE"
        (
          $e.security_result.action = "patch" or
          $e.security_result.action = "create" or
          $e.security_result.action = "update"
        )
        $e.target.resource.attribute.labels["requestObject.spec.shareProcessNamespace"] = "true"
        $e.principal.user.userid = $user
        $e.target.resource.name = $resource

      match:
        $user over 5m

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit*
    | WHERE (verb == "patch" OR verb == "create" OR verb == "update")
      AND requestObject.spec.shareProcessNamespace == "true"
    | KEEP @timestamp, user.name, verb, objectRef.namespace, objectRef.name, objectRef.resource, sourceIPs, userAgent
  leql: |
    where((source_json.verb="patch" OR source_json.verb="create" OR source_json.verb="update") AND source_json.requestObject.spec.shareProcessNamespace="true")
  crowdstrike: |
    #type=kubernetes-audit (verb=patch OR verb=create OR verb=update) requestObject.spec.shareProcessNamespace=true
    | table([@timestamp, user.username, verb, objectRef.namespace, objectRef.name, requestObject.spec.shareProcessNamespace, sourceIPs])
  xql: "dataset = cloud_audit_logs\n| filter cloud_provider = \"KUBERNETES\" \n  and (action_verb = \"patch\" or action_verb = \"create\" or action_verb\
    \ = \"update\")\n  and action_resource_request_object_spec_shareprocessnamespace = \"true\"\n| fields _time, cloud_provider_project, action_verb,\
    \ action_resource, action_username, action_source_ip, action_resource_request_object_spec_shareprocessnamespace\n"
  lucene: |
    (verb:patch OR verb:create OR verb:update) AND requestObject.spec.shareProcessNamespace:true
  sumo: |
    _sourceCategory=*Kubernetes* (verb="patch" OR verb="create" OR verb="update")
    | json field=_raw "verb" as verb
    | json field=_raw "requestObject.spec.shareProcessNamespace" as shareProcessNamespace
    | where (verb="patch" or verb="create" or verb="update") and shareProcessNamespace="true"
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nOR\n    Where Verb is \"patch\"\n    Where Verb is \"create\"\n    Where Verb is \"update\"\nWhere requestObject.spec.shareProcessNamespace\
  \  is \"true\""
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the privilege gain was not part of an approved
  elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

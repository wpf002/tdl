rule_id: TDL-PE-000582
v4_id: 000582
name: Kubernetes Pod Created with a hostPath Mount
description: 'Detects creation of a container with a hostPath mount. A hostPath volume mounts a directory or a file from the node to the container.
  Attackers who have permissions to create a new pod in the cluster may create one with a writable hostPath volume and chroot to escape to the
  underlying node. A sigma rule by Leo Tsaousis (@laripping)


  ref: https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Writable%20hostPath%20mount/

  https://blog.appsecco.com/kubernetes-namespace-breakout-using-insecure-host-path-volume-part-1-b382f2a6e216'
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1611
technique_name: Escape to Host
platform:
- Windows
data_sources:
- Kubernetes
severity: Low
fidelity: Low
lifecycle: Proposed
risk_score: 30
queries:
  spl: "index=kubernetes sourcetype=kube:* resource=pods verb=create \n| spath path=requestObject.spec.hostPath \n| search requestObject.spec.hostPath=*\n\
    | table _time, user, namespace, resource, verb, requestObject.spec.hostPath\n"
  kql: |
    KubernetesEvents
    | where TimeGenerated > ago(1h)
    | where ObjectKind == "Pod"
    | where Verb == "create"
    | extend hostPathMount = parse_json(RequestObject).spec.volumes
    | mv-expand hostPathMount
    | where isnotnull(hostPathMount.hostPath)
    | project TimeGenerated, Namespace, PodName = ObjectName, User, SourceIPs, Verb, hostPathMount = tostring(hostPathMount.hostPath.path), RequestObject
  aql: |
    SELECT username, sourceip, "requestObject.spec.hostPath" AS hostPath, "objectRef.name" AS podName, "objectRef.namespace" AS namespace, eventtime
    FROM events
    WHERE "requestObject.spec.hostPath" IS NOT NULL
      AND "objectRef.resource" = 'pods'
      AND "verb" = 'create'
    LAST 24 HOURS
  yara_l: |
    rule kubernetes_hostpath_mount_privilege_escalation {
      meta:
        author = "TDL"
        description = "Detects Kubernetes pod creation with hostPath mount - T1611 Escape to Host"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1611"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "RESOURCE_CREATION"
        $e.target.resource.type = "pods"
        $e.security_result.action = "create"
        not $e.target.resource.attribute.labels.key = "requestObject.spec.hostPath"
        not $e.target.resource.attribute.labels.value = ""
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-kubernetes.audit-*
    | WHERE @timestamp > NOW() - 24 hour
      AND kubernetes.audit.objectRef.resource == "pods"
      AND kubernetes.audit.verb == "create"
      AND kubernetes.audit.requestObject.spec.hostPath IS NOT NULL
    | KEEP @timestamp, kubernetes.audit.user.username, kubernetes.audit.objectRef.namespace, kubernetes.audit.objectRef.name, kubernetes.audit.requestObject.spec.hostPath, kubernetes.audit.sourceIPs
  leql: |
    where(source_json.objectRef.resource="pods" AND source_json.verb="create" AND source_json.requestObject.spec.hostPath!=null)
  crowdstrike: |
    #type=kubernetes event.verb=create event.objectRef.resource=pods requestObject.spec.hostPath=*
    | table([@timestamp, event.user.username, event.objectRef.namespace, event.objectRef.name, requestObject.spec.hostPath])
  xql: |
    dataset = cloud_audit_logs
    | filter lowercase(resource_type) = "pods" and lowercase(verb) = "create" and requestObject.spec.hostPath != null
    | fields _time, user, resource_type, verb, requestObject.spec.hostPath, source_ip, cluster_name
  lucene: |
    resource:"pods" AND verb:"create" AND _exists_:requestObject.spec.hostPath
  sumo: |
    _sourceCategory=*Kubernetes* "pods" "create"
    | json field=_raw "verb" as verb
    | json field=_raw "objectRef.resource" as resource
    | json field=_raw "requestObject.spec.hostPath" as hostPath
    | where resource = "pods" and verb = "create" and !isNull(hostPath)
    | fields _messageTime, _sourceHost, verb, resource, hostPath
false_positives:
- Security software
- Authorized admin tools
tuning_guidance: Tune per environment baseline.
tags:
- edp
- privilege-escalation
author: TDL
created: '2024-01-01'
last_modified: '2026-08-10'
test_method: none
pseudo_logic: "1 Kubernetes Event \nWhere the Resource is \"pods\"\nWhere Verb is \"create\"\nWhere \"requestObject.spec.hostPath\" is NOT Null"
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the parent → child process tree, command line arguments, and code-signing status — verify the privilege gain was not part of an approved
  elevation flow (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

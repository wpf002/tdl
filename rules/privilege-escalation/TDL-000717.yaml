rule_id: TDL-PE-000717
v4_id: '000717'
name: Run Key Modified Pointing to User-Writable Path
description: HKLM\...\Run or HKCU\...\Run value set to an executable in %TEMP%/%APPDATA%/Public. Re-launches malicious binary at boot/logon with
  that user's context. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1547 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1547
technique_name: Boot or Logon Autostart Execution
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- Windows Event Log
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    index=* (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13) OR (sourcetype=WinEventLog:Security EventCode=4657) OR (sourcetype=edr* event_type=registry*)
    (TargetObject="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR registry_path="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR RegistryKeyPath="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*")
    (Details="*\\AppData\\*" OR Details="*\\Temp\\*" OR Details="*\\Public\\*" OR registry_value="*\\AppData\\*" OR registry_value="*\\Temp\\*" OR registry_value="*\\Public\\*" OR value_data="*\\AppData\\*" OR value_data="*\\Temp\\*" OR value_data="*\\Public\\*")
    | eval registry_path=coalesce(TargetObject, registry_path, RegistryKeyPath)
    | eval registry_value=coalesce(Details, registry_value, value_data)
    | where match(registry_path, "(?i)(HKLM|HKCU|HKEY_LOCAL_MACHINE|HKEY_CURRENT_USER).*\\\\Run")
    | where match(registry_value, "(?i)(\\\\AppData\\\\|\\\\Temp\\\\|\\\\Public\\\\)")
    | table _time, ComputerName, host, registry_path, registry_value, User, Image, ProcessId
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_pe_000717 {\n  meta:\n    author = \"TDL\"\n    description = \"Run Key Modified Pointing to User-Writable Path\"\n  \
    \  severity = \"HIGH\"\n    tactic = \"TA0004\"\n    technique = \"T1547\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n \
    \   $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: HKLM\...\Run or HKCU\...\Run value set to an executable in %TEMP%/%APPDATA%/Public. Re-launches malicious binary at boot/logon with
  that user's context.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

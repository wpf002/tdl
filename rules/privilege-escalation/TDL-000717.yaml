rule_id: TDL-PE-000717
v4_id: '000717'
name: Run Key Modified Pointing to User-Writable Path
description: HKLM\...\Run or HKCU\...\Run value set to an executable in %TEMP%/%APPDATA%/Public. Re-launches malicious binary at boot/logon with
  that user's context. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1547 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1547
technique_name: Boot or Logon Autostart Execution
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- Windows Event Log
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: 'index=* (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13) OR (sourcetype=WinEventLog:Security EventCode=4657)
    OR (sourcetype=edr* event_type=registry*)

    (TargetObject="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR registry_path="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR RegistryKeyPath="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*")

    (Details="*\\AppData\\*" OR Details="*\\Temp\\*" OR Details="*\\Public\\*" OR registry_value="*\\AppData\\*" OR registry_value="*\\Temp\\*"
    OR registry_value="*\\Public\\*" OR value_data="*\\AppData\\*" OR value_data="*\\Temp\\*" OR value_data="*\\Public\\*")

    | eval registry_path=coalesce(TargetObject, registry_path, RegistryKeyPath)

    | eval registry_value=coalesce(Details, registry_value, value_data)

    | where match(registry_path, "(?i)(HKLM|HKCU|HKEY_LOCAL_MACHINE|HKEY_CURRENT_USER).*\\\\Run")

    | where match(registry_value, "(?i)(\\\\AppData\\\\|\\\\Temp\\\\|\\\\Public\\\\)")

    | table _time, ComputerName, host, registry_path, registry_value, User, Image, ProcessId

    '
  kql: |
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 13
    | where RegistryKey has_any ("\\Microsoft\\Windows\\CurrentVersion\\Run", "\\Microsoft\\Windows\\CurrentVersion\\RunOnce")
    | where RegistryValueData has_any ("\\Temp\\", "\\AppData\\", "\\Public\\")
    | where RegistryKey has_any ("HKLM", "HKCU", "HKEY_LOCAL_MACHINE", "HKEY_CURRENT_USER")
    | project TimeGenerated, Computer, Account, RegistryKey, RegistryValueName, RegistryValueData, Process
  aql: |
    SELECT eventtime, username, LOGSOURCENAME(logsourceid) AS host, "Registry Path" AS registry_key, "Registry Value" AS value_name, "Registry Value Data" AS executable_path, "Process Name" AS process
    FROM events
    WHERE ("Registry Path" ILIKE '%\Microsoft\Windows\CurrentVersion\Run%' OR "Registry Path" ILIKE '%\Microsoft\Windows\CurrentVersion\RunOnce%')
      AND "Event Type" IN ('Registry value set', 'RegistryEvent')
      AND ("Registry Value Data" ILIKE '%\Temp\%' OR "Registry Value Data" ILIKE '%\AppData\%' OR "Registry Value Data" ILIKE '%\Public\%')
      AND ("Registry Value Data" ILIKE '%.exe%' OR "Registry Value Data" ILIKE '%.dll%' OR "Registry Value Data" ILIKE '%.bat%' OR "Registry Value Data" ILIKE '%.ps1%')
    LAST 24 HOURS
  yara_l: |
    rule registry_run_key_temp_executable {
      meta:
        author = "TDL"
        description = "Detects registry Run key persistence pointing to executables in suspicious temp locations"
        mitre_attack_tactic = "Privilege Escalation"
        mitre_attack_technique = "T1547"
        severity = "HIGH"

      events:
        $e.metadata.event_type = "REGISTRY_MODIFICATION"
        (
          re.regex($e.target.registry.registry_key, `(?i)\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\`) or
          re.regex($e.target.registry.registry_key, `(?i)\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\`)
        )
        (
          re.regex($e.target.registry.registry_value_data, `(?i)\\temp\\`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\\appdata\\`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\\public\\`)
        )
        (
          re.regex($e.target.registry.registry_value_data, `(?i)\.exe`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\.dll`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\.bat`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\.cmd`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\.vbs`) or
          re.regex($e.target.registry.registry_value_data, `(?i)\.ps1`)
        )
        $e.principal.hostname = $host

      match:
        $host over 5m

      outcome:
        $risk_score = 75

      condition:
        $e
    }
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.registry*
    | WHERE @timestamp > NOW() - 24 hours
      AND event.category == "registry"
      AND event.type IN ("creation", "change")
      AND (
        registry.path RLIKE ".*\\\\(Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|Microsoft\\\\Windows\\\\CurrentVersion\\\\RunOnce)\\\\.*"
      )
      AND (
        TO_LOWER(registry.data.strings) LIKE "*\\temp\\*"
        OR TO_LOWER(registry.data.strings) LIKE "*\\appdata\\*"
        OR TO_LOWER(registry.data.strings) LIKE "*\\users\\public\\*"
      )
    | KEEP @timestamp, host.name, user.name, registry.path, registry.data.strings, process.name, process.executable
  leql: |
    where(source_json.EventID=13 AND (source_json.TargetObject ICONTAINS "\Microsoft\Windows\CurrentVersion\Run" OR source_json.TargetObject ICONTAINS "\Microsoft\Windows\CurrentVersion\RunOnce") AND (source_json.Details ICONTAINS "\Temp\" OR source_json.Details ICONTAINS "\AppData\" OR source_json.Details ICONTAINS "\Public\"))
  crowdstrike: |
    (event_simpleName=AsepValueUpdate OR EventCode=13)
    (RegistryPath=*\\Microsoft\\Windows\\CurrentVersion\\Run* OR RegistryKey=*\\Microsoft\\Windows\\CurrentVersion\\Run*)
    (RegistryValueData=*\\Temp\\* OR RegistryValueData=*\\AppData\\* OR RegistryValueData=*\\Public\\*)
    | table([@timestamp, ComputerName, UserName, RegistryPath, RegistryKey, RegistryValueName, RegistryValueData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_REGISTRY and action_registry_key_name ~= "(?i).*\\(Software\\Microsoft\\Windows\\CurrentVersion\\Run|Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce).*" and (action_registry_value_name != null and action_registry_value_name != "") and action_registry_data != null and (lowercase(action_registry_data) contains "\\temp\\" or lowercase(action_registry_data) contains "\\appdata\\" or lowercase(action_registry_data) contains "\\public\\")
    | fields _time, agent_hostname, actor_effective_username, action_registry_key_name, action_registry_value_name, action_registry_data, actor_process_image_name
  lucene: |
    (event.code:(13 OR 4657) OR winlog.event_id:13) AND (registry.path:(*\\Microsoft\\Windows\\CurrentVersion\\Run* OR *\\Microsoft\\Windows\\CurrentVersion\\RunOnce*) OR TargetObject:(*\\Microsoft\\Windows\\CurrentVersion\\Run* OR *\\Microsoft\\Windows\\CurrentVersion\\RunOnce*)) AND (registry.data.strings:(*\\Temp\\* OR *\\AppData\\* OR *\\Public\\*) OR Details:(*\\Temp\\* OR *\\AppData\\* OR *\\Public\\*))
  sumo: |
    _sourceCategory=*Windows* OR _sourceCategory=*Sysmon* (EventID=13 OR EventID=12 OR event_id=13 OR event_id=12 OR "RegistryEvent")
    | json field=_raw "EventID" as event_id nodrop
    | json field=_raw "TargetObject" as target_object nodrop
    | json field=_raw "Details" as details nodrop
    | json field=_raw "Image" as image nodrop
    | where (event_id="13" OR event_id="12") AND (target_object matches "*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR target_object matches "*\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\*") AND (details matches "*\\Temp\\*" OR details matches "*\\AppData\\*" OR details matches "*\\Public\\*") AND details matches "*.exe*"
    | fields _messageTime, _sourceHost, event_id, target_object, details, image
pseudo_logic: HKLM\...\Run or HKCU\...\Run value set to an executable in %TEMP%/%APPDATA%/Public. Re-launches malicious binary at boot/logon with
  that user's context.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days
tags:
- autostart
- run-key
- registry
- t1547
- privilege-escalation
references:
- https://attack.mitre.org/techniques/T1547/
author: TDL gap-analysis generator
created: '2026-04-27'
last_modified: '2026-08-10'
test_method: none
triage_steps:
- 'Confirm the alert metadata: timestamp, host, source user, and (if visible) the resulting privileged context.'
- Inspect the registry hive, key path, value name, and writing process — verify the privilege gain was not part of an approved elevation flow
  (UAC consent, sudo, PAM ticket).
- 'Pull preceding 1h of activity for the source user: was there earlier credential-access / discovery / exploit telemetry?'
- 'Validate token / session changes: new SeImpersonate-style privileges, new IAM role assumption, or a SYSTEM-level child process from a user-level
  parent.'
- 'Decide TP / FP: TP if there''s no change-management correlation and no parent admin process; FP if it''s a documented elevation by IT.'
- 'If TP: contain the host, revoke the elevated session, sweep for other escalations using the same primitive, and notify identity / IR teams.'

rule_id: TDL-PE-000718
v4_id: 000718
name: Logon Script (UserInitMprLogonScript) Created or Modified
description: HKCU\Environment\UserInitMprLogonScript value created/modified, or /etc/rc.local / /etc/profile.d/* written. Runs at next logon under
  target's context. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1037 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1037
technique_name: Boot or Logon Initialization Scripts
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- Auditd
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "(index=wineventlog sourcetype=\"WinEventLog:Microsoft-Windows-Sysmon/Operational\" EventCode=13 TargetObject=\"*\\\\HKCU\\\\Environment\\\
    \\UserInitMprLogonScript\")\nOR\n(index=linux sourcetype IN (linux_secure, syslog, linux_audit) (file_path=\"/etc/rc.local\" OR file_path=\"\
    /etc/profile.d/*\") (action=created OR action=modified OR action=written OR syscall IN (open, openat, openat2) OR type=PATH))\nOR\n(index=edr\
    \ (registry_path=\"*\\\\HKCU\\\\Environment\\\\UserInitMprLogonScript\" action IN (created, modified, set)) OR (file_path IN (\"/etc/rc.local\"\
    , \"/etc/profile.d/*\") action IN (created, modified, written)))\n| eval detection_type=case(\n    match(TargetObject, \"UserInitMprLogonScript\"\
    ) OR match(registry_path, \"UserInitMprLogonScript\"), \"Windows_UserInitMprLogonScript\",\n    match(file_path, \"/etc/rc.local\"), \"Linux_rc.local\"\
    ,\n    match(file_path, \"/etc/profile.d/\"), \"Linux_profile.d\",\n    1=1, \"Unknown\"\n)\n| table _time, host, ComputerName, user, User,\
    \ TargetObject, registry_path, file_path, Details, EventType, Image, detection_type\n"
  kql: |
    union isfuzzy=true
    (
    SecurityEvent
    | where TimeGenerated > ago(24h)
    | where EventID == 4657
    | where ObjectName has "HKCU\\Environment"
    | where ObjectValueName == "UserInitMprLogonScript"
    | where OperationType in ("%%1904", "%%1905")
    | project TimeGenerated, Computer, SubjectUserName, SubjectDomainName, ObjectName, ObjectValueName, NewValue = ObjectNewValue, ProcessName, ProcessId
    ),
    (
    DeviceRegistryEvents
    | where TimeGenerated > ago(24h)
    | where RegistryKey has "\\Environment"
    | where RegistryValueName == "UserInitMprLogonScript"
    | where ActionType in ("RegistryValueSet", "SetValue")
    | project TimeGenerated, DeviceName, AccountName = InitiatingProcessAccountName, RegistryKey, RegistryValueName, RegistryValueData, ProcessName = InitiatingProcessFileName, ProcessId = InitiatingProcessId
    ),
    (
    DeviceFileEvents
    | where TimeGenerated > ago(24h)
    | where (FolderPath endswith "/etc/rc.local" or FolderPath has "/etc/profile.d/")
    | where ActionType in ("FileCreated", "FileModified")
    | project TimeGenerated, DeviceName, AccountName = InitiatingProcessAccountName, FolderPath, FileName, ProcessName = InitiatingProcessFileName, ProcessId = InitiatingProcessId, SHA256
    ),
    (
    Syslog
    | where TimeGenerated > ago(24h)
    | where Facility == "authpriv" or ProcessName == "auditd"
    | where SyslogMessage has_any ("rc.local", "profile.d")
    | where SyslogMessage has_any ("write", "create", "modify")
    | parse SyslogMessage with * "name=" FileName " " *
    | project TimeGenerated, Computer, ProcessName, SyslogMessage, FileName
    )
    | extend TechniqueID = "T1037"
    | extend Tactic = "Privilege Escalation"
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Target Object", "Details", "File Path"
    FROM events
    WHERE (
      ("EventID" = '13' AND "Target Object" ILIKE '%\\Environment\\UserInitMprLogonScript%')
      OR ("EventID" = '11' AND ("File Path" ILIKE '%/etc/rc.local%' OR "File Path" ILIKE '%/etc/profile.d/%'))
      OR ("EventID" IN ('4657', '4663') AND "Object Name" ILIKE '%\\Environment\\UserInitMprLogonScript%')
    )
    LAST 24 HOURS
  yara_l: "rule boot_logon_script_persistence {\n  meta:\n    author = \"TDL\"\n    description = \"Detects persistence via logon scripts - UserInitMprLogonScript\
    \ registry key or Linux startup scripts\"\n    mitre_attack_tactic = \"Privilege Escalation\"\n    mitre_attack_technique = \"T1037\"\n  \
    \  severity = \"HIGH\"\n\n  events:\n    // Windows: UserInitMprLogonScript registry modification\n    ($win.metadata.event_type = \"REGISTRY_MODIFICATION\"\
    \ and\n     re.regex($win.target.registry.registry_key, `(?i)\\\\Environment\\\\UserInitMprLogonScript`) and\n     $win.principal.hostname\
    \ = $host) or\n    \n    // Linux: rc.local or profile.d script modifications\n    ($linux.metadata.event_type = \"FILE_MODIFICATION\" and\n\
    \     (re.regex($linux.target.file.full_path, `(?i)/etc/rc\\.local$`) or\n      re.regex($linux.target.file.full_path, `(?i)/etc/profile\\\
    .d/`)) and\n     $linux.principal.hostname = $host)\n\n  match:\n    $host over 5m\n\n  outcome:\n    $risk_score = max(75)\n\n  condition:\n\
    \    $win or $linux\n}\n"
  esql: "FROM logs-endpoint.events.registry*, logs-endpoint.events.file*, logs-windows.sysmon_operational*, logs-system.auditd*\n| WHERE \n  \
    \  (\n      (registry.path LIKE \"*\\\\Environment\\\\UserInitMprLogonScript*\" AND (event.action IN (\"modification\", \"creation\") OR winlog.event_id\
    \ IN (12, 13)))\n      OR\n      (file.path IN (\"/etc/rc.local\", \"/etc/rc.d/rc.local\") AND event.action IN (\"creation\", \"modification\"\
    ))\n      OR\n      (file.path LIKE \"/etc/profile.d/*\" AND event.action IN (\"creation\", \"modification\"))\n    )\n| KEEP @timestamp,\
    \ host.name, user.name, event.action, registry.path, registry.value, registry.data.strings, file.path, process.name, process.executable, process.command_line\n"
  leql: |
    where((source_json.EventID=13 AND source_json.TargetObject ICONTAINS "\\Environment\\UserInitMprLogonScript") OR (source_json.EventID IN [11, 2] AND (file_path ICONTAINS "/etc/rc.local" OR file_path ICONTAINS "/etc/profile.d/"))) groupby(user, asset, source_json.TargetObject, file_path) calculate(count)
  crowdstrike: |
    (event_simpleName=AsepValueUpdate RegistryPath=*\Environment\UserInitMprLogonScript) OR (event_simpleName=ProcessRollup2 (FileName=*bash OR FileName=*sh) (CommandLine=*/etc/rc.local* OR CommandLine=*/etc/profile.d/*)) OR (event_simpleName=SyntheticProcessRollup2 (TargetFileName=*/etc/rc.local OR TargetFileName=*/etc/profile.d/*)) OR (EventCode=13 TargetObject=*\Environment\UserInitMprLogonScript)
    | table([@timestamp, ComputerName, UserName, event_simpleName, RegistryPath, RegistryValueName, RegistryValue, FileName, CommandLine, TargetFileName])
  xql: |
    dataset = xdr_data
    | filter (event_type = ENUM.EVENT_TYPE_REGISTRY_VALUE_SET and (lowercase(action_registry_key_name) contains "hkcu\\environment" and lowercase(action_registry_value_name) = "userinitmprologonscript"))
       or (event_type = ENUM.EVENT_TYPE_FILE_WRITE and (lowercase(action_file_path) = "/etc/rc.local" or lowercase(action_file_path) ~= "/etc/profile\\.d/.*"))
    | fields _time, agent_hostname, os_type, event_type, actor_effective_username, action_registry_key_name, action_registry_value_name, action_registry_data, action_file_path, action_process_image_name, action_process_image_command_line
  lucene: |
    (winlog.event_data.TargetObject:*\\Environment\\UserInitMprLogonScript* AND (event.code:13 OR event.code:12)) OR (file.path:(/etc/rc.local OR /etc/profile.d/*) AND (event.action:"created" OR event.action:"modified" OR event.action:"written"))
  sumo: "_sourceCategory=*Windows* OR _sourceCategory=*Linux* OR _sourceCategory=*Sysmon* OR _sourceCategory=*EDR* OR _sourceCategory=*Auditd*\n\
    | json field=_raw \"EventID\" as event_id\n| json field=_raw \"TargetObject\" as target_object\n| json field=_raw \"Details\" as details\n\
    | json field=_raw \"Image\" as image\n| json field=_raw \"type\" as audit_type\n| json field=_raw \"name\" as file_name\n| json field=_raw\
    \ \"exe\" as exe\n| json field=_raw \"key\" as reg_key\n| json field=_raw \"syscall\" as syscall\n| where (event_id = \"13\" and target_object\
    \ matches \"*\\\\Environment\\\\UserInitMprLogonScript\") \n   or (event_id = \"13\" and target_object matches \"*\\\\HKCU\\\\Environment\\\
    \\UserInitMprLogonScript\")\n   or (audit_type = \"PATH\" and (file_name matches \"*/etc/rc.local\" or file_name matches \"*/etc/profile.d/*\"\
    ))\n   or (syscall matches \"*openat*\" and (file_name matches \"*/etc/rc.local\" or file_name matches \"*/etc/profile.d/*\"))\n   or target_object\
    \ matches \"*UserInitMprLogonScript*\"\n   or file_name matches \"*/etc/rc.local\"\n   or file_name matches \"*/etc/profile.d/*\"\n| fields\
    \ _messageTime, _sourceHost, event_id, target_object, details, image, file_name, exe, audit_type\n"
pseudo_logic: HKCU\Environment\UserInitMprLogonScript value created/modified, or /etc/rc.local / /etc/profile.d/* written. Runs at next logon

rule_id: TDL-PE-000718
v4_id: 000718
name: Logon Script (UserInitMprLogonScript) Created or Modified
description: HKCU\Environment\UserInitMprLogonScript value created/modified, or /etc/rc.local / /etc/profile.d/* written. Runs at next logon under
  target's context. Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1037 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1037
technique_name: Boot or Logon Initialization Scripts
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- Auditd
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: |
    (index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=13 TargetObject="*\\HKCU\\Environment\\UserInitMprLogonScript")
    OR
    (index=linux sourcetype IN (linux_secure, syslog, linux_audit) (file_path="/etc/rc.local" OR file_path="/etc/profile.d/*") (action=created OR action=modified OR action=written OR syscall IN (open, openat, openat2) OR type=PATH))
    OR
    (index=edr (registry_path="*\\HKCU\\Environment\\UserInitMprLogonScript" action IN (created, modified, set)) OR (file_path IN ("/etc/rc.local", "/etc/profile.d/*") action IN (created, modified, written)))
    | eval detection_type=case(
        match(TargetObject, "UserInitMprLogonScript") OR match(registry_path, "UserInitMprLogonScript"), "Windows_UserInitMprLogonScript",
        match(file_path, "/etc/rc.local"), "Linux_rc.local",
        match(file_path, "/etc/profile.d/"), "Linux_profile.d",
        1=1, "Unknown"
    )
    | table _time, host, ComputerName, user, User, TargetObject, registry_path, file_path, Details, EventType, Image, detection_type
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_pe_000718 {\n  meta:\n    author = \"TDL\"\n    description = \"Logon Script (UserInitMprLogonScript) Created or Modified\"\
    \n    severity = \"HIGH\"\n    tactic = \"TA0004\"\n    technique = \"T1037\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n\
    \    $e.process_name = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: HKCU\Environment\UserInitMprLogonScript value created/modified, or /etc/rc.local / /etc/profile.d/* written. Runs at next logon
  under target's context.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows
tuning_guidance: Proposed rule generated from ATT&CK gap analysis — review the pseudo_logic, scope filters to the right asset group, and refine
  thresholds using ≥7 days of telemetry before promoting.
tuning_period: 14 days

rule_id: TDL-PE-000720
v4_id: '000720'
name: WMI Permanent Event Subscription Created
description: Creation of __EventFilter / __EventConsumer / __FilterToConsumerBinding in root\subscription. Classic stealth WMI persistence + privesc.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1546 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1546
technique_name: Event Triggered Execution
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- WMI Telemetry
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=19 OR EventCode=20 OR EventCode=21) (EventType=\"WmiEvent*\"\
    \ OR Operation=\"Created\") (EventNamespace=\"*root\\\\subscription*\" OR TargetObject=\"*root\\\\subscription*\") (Consumer=\"*\" OR Filter=\"\
    *\" OR \"__EventFilter\" OR \"__EventConsumer\" OR \"__FilterToConsumerBinding\")\n| eval wmi_object=coalesce(Consumer, Filter, TargetObject)\n\
    | eval detection_type=case(\n    like(wmi_object, \"%__EventFilter%\"), \"EventFilter\",\n    like(wmi_object, \"%__EventConsumer%\"), \"\
    EventConsumer\", \n    like(wmi_object, \"%__FilterToConsumerBinding%\"), \"FilterToConsumerBinding\",\n    1=1, \"WMI_Persistence\")\n| table\
    \ _time, ComputerName, User, EventCode, detection_type, wmi_object, CommandLine, Operation\n"
  kql: "Event\n| where TimeGenerated > ago(24h)\n| where EventLog == \"Microsoft-Windows-Sysmon/Operational\" and EventID == 19\n  or (EventLog\
    \ == \"Microsoft-Windows-WMI-Activity/Operational\" and EventID == 5861)\n| extend EventData = parse_xml(EventData)\n| extend EventType =\
    \ tostring(EventData.DataItem.EventData.Data.[0])\n| extend EventNamespace = tostring(EventData.DataItem.EventData.Data.[1])\n| extend Name\
    \ = tostring(EventData.DataItem.EventData.Data.[2])\n| extend Query = tostring(EventData.DataItem.EventData.Data.[3])\n| extend User = tostring(EventData.UserData.Operation.User)\n\
    | where EventNamespace has \"root\\\\subscription\" \n  or EventType in (\"__EventFilter\", \"__EventConsumer\", \"__FilterToConsumerBinding\"\
    )\n| project TimeGenerated, Computer, EventID, EventType, EventNamespace, Name, Query, User\n"
  aql: |
    SELECT eventtime, sourceip, username, LOGSOURCENAME(logsourceid) AS host, "Process Name", "Process CommandLine", "Target Namespace", "Target Class", "Target Name"
    FROM events
    WHERE ("EventID" = '19' OR "EventID" = '20' OR "EventID" = '21')
      AND "Target Namespace" ILIKE '%root\\subscription%'
      AND ("Target Class" ILIKE '%__EventFilter%' OR "Target Class" ILIKE '%__EventConsumer%' OR "Target Class" ILIKE '%__FilterToConsumerBinding%')
    LAST 24 HOURS
  yara_l: "rule wmi_event_subscription_persistence {\n  meta:\n    author = \"TDL\"\n    description = \"Detects WMI Event Subscription persistence\
    \ via __EventFilter, __EventConsumer, or __FilterToConsumerBinding in root\\\\subscription namespace\"\n    mitre_attack_tactic = \"Privilege\
    \ Escalation\"\n    mitre_attack_technique = \"T1546\"\n    severity = \"HIGH\"\n\n  events:\n    $e.metadata.event_type = \"REGISTRY_MODIFICATION\"\
    \ or\n    $e.metadata.event_type = \"WMI_OBJECT_CREATION\" or\n    $e.metadata.event_type = \"SETTING_MODIFICATION\"\n    \n    (\n      re.regex($e.target.registry.registry_key,\
    \ `(?i)root\\\\subscription.*__EventFilter`) or\n      re.regex($e.target.registry.registry_key, `(?i)root\\\\subscription.*__EventConsumer`)\
    \ or\n      re.regex($e.target.registry.registry_key, `(?i)root\\\\subscription.*__FilterToConsumerBinding`) or\n      re.regex($e.target.resource.name,\
    \ `(?i)root\\\\subscription.*__EventFilter`) or\n      re.regex($e.target.resource.name, `(?i)root\\\\subscription.*__EventConsumer`) or\n\
    \      re.regex($e.target.resource.name, `(?i)root\\\\subscription.*__FilterToConsumerBinding`) or\n      re.regex($e.principal.process.command_line,\
    \ `(?i)root\\\\subscription.*__EventFilter`) or\n      re.regex($e.principal.process.command_line, `(?i)root\\\\subscription.*__EventConsumer`)\
    \ or\n      re.regex($e.principal.process.command_line, `(?i)root\\\\subscription.*__FilterToConsumerBinding`)\n    )\n    \n    $e.principal.hostname\
    \ = $host\n\n  match:\n    $host over 5m\n\n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.wmi*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hours
      AND (
        (winlog.event_id == 19 OR winlog.event_id == 20 OR winlog.event_id == 21)
        OR (event.category == "wmi" AND event.action IN ("WmiEventFilterCreated", "WmiEventConsumerCreated", "WmiEventConsumerToFilterBinding"))
      )
      AND (
        TO_LOWER(winlog.event_data.Destination) LIKE "*root\\subscription*"
        OR TO_LOWER(winlog.event_data.Name) LIKE "*root\\subscription*"
        OR TO_LOWER(wmi.namespace) LIKE "*root\\subscription*"
      )
    | EVAL persistence_type = CASE(
        winlog.event_id == 19 OR event.action == "WmiEventFilterCreated", "EventFilter",
        winlog.event_id == 20 OR event.action == "WmiEventConsumerCreated", "EventConsumer",
        winlog.event_id == 21 OR event.action == "WmiEventConsumerToFilterBinding", "FilterToConsumerBinding",
        "Unknown"
      )
    | KEEP @timestamp, host.name, user.name, persistence_type, winlog.event_data.Name, winlog.event_data.Destination, winlog.event_data.Consumer, winlog.event_data.Filter, wmi.namespace, process.name, process.command_line
  leql: |
    where(source_json.EventID=19 OR source_json.EventID=20 OR source_json.EventID=21) AND (source_json.Operation ICONTAINS "Created" OR source_json.EventType ICONTAINS "WmiEvent") AND (source_json.Consumer ICONTAINS "__EventConsumer" OR source_json.EventNamespace ICONTAINS "root\\subscription" OR source_json.Query ICONTAINS "__EventFilter" OR source_json.Name ICONTAINS "__FilterToConsumerBinding") groupby(asset, source_json.User, source_json.EventNamespace) calculate(count)
  crowdstrike: "(event_simpleName=WmiCreateInstanceEvent OR event_simpleName=ProcessRollup2 OR EventCode=19 OR EventCode=20 OR EventCode=21) \n\
    (CommandLine=*__EventFilter* OR CommandLine=*__EventConsumer* OR CommandLine=*__FilterToConsumerBinding* OR CommandLine=*root\\\\subscription*\
    \ OR TargetObject=*__EventFilter* OR TargetObject=*__EventConsumer* OR TargetObject=*__FilterToConsumerBinding* OR TargetObject=*root\\\\\
    subscription*)\n| table([@timestamp, ComputerName, UserName, event_simpleName, EventCode, CommandLine, TargetObject, ParentBaseFileName, FileName])\n"
  xql: "dataset = xdr_data\n| filter event_type = ENUM.EVENT_TYPE_WMI_ACTIVITY \n  and (action_wmi_operation contains \"Create\" or action_wmi_operation\
    \ contains \"Created\")\n  and (action_wmi_namespace = \"root\\\\subscription\" or action_wmi_namespace = \"root/subscription\")\n  and (action_wmi_class\
    \ contains \"__EventFilter\" \n       or action_wmi_class contains \"__EventConsumer\" \n       or action_wmi_class contains \"__FilterToConsumerBinding\"\
    )\n| fields _time, agent_hostname, actor_effective_username, action_wmi_class, action_wmi_namespace, action_wmi_operation, action_wmi_consumer_name,\
    \ action_wmi_filter_name\n"
  lucene: |
    (event_namespace:*root\\subscription* OR event_namespace:*root/subscription*) AND (event_type:(__EventFilter OR __EventConsumer OR __FilterToConsumerBinding OR *FilterToConsumerBinding OR *EventConsumer OR *EventFilter) OR operation_type:(Created OR *Registration) OR object_path:(*__EventFilter* OR *__EventConsumer* OR *FilterToConsumerBinding*)) AND NOT (process.name:(svchost.exe OR wmiprvse.exe OR *antivirus* OR *edr*) AND user.name:(*SYSTEM* OR *LOCAL SERVICE* OR *NETWORK SERVICE*))
  sumo: |
    _sourceCategory=*WMI* OR _sourceCategory=*Sysmon* (EventFilter OR EventConsumer OR FilterToConsumerBinding OR "root\\subscription" OR "root/subscription")
    | json field=_raw "EventID" as event_id
    | json field=_raw "Operation" as operation
    | json field=_raw "Consumer" as consumer
    | json field=_raw "Filter" as filter
    | json field=_raw "Binding" as binding
    | json field=_raw "Namespace" as namespace
    | json field=_raw "Name" as name
    | json field=_raw "Query" as query
    | json field=_raw "CommandLineTemplate" as cmdline
    | json field=_raw "User" as user
    | where (event_id = "19" OR event_id = "20" OR event_id = "21" OR operation matches "*EventFilter*" OR operation matches "*EventConsumer*" OR operation matches "*FilterToConsumerBinding*") AND (namespace matches "*root*subscription*" OR namespace matches "*root/subscription*" OR consumer matches "*root*subscription*" OR filter matches "*root*subscription*")
    | fields _messageTime, _sourceHost, event_id, operation, namespace, name, query, cmdline, consumer, filter, binding, user

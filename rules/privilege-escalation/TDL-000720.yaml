rule_id: TDL-PE-000720
v4_id: '000720'
name: WMI Permanent Event Subscription Created
description: Creation of __EventFilter / __EventConsumer / __FilterToConsumerBinding in root\subscription. Classic stealth WMI persistence + privesc.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1546 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1546
technique_name: Event Triggered Execution
platform:
- Windows
- macOS
- Linux
data_sources:
- Sysmon
- EDR
- WMI Telemetry
severity: High
fidelity: High
lifecycle: Proposed
risk_score: 75
queries:
  spl: "index=* (sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=19 OR EventCode=20 OR EventCode=21) (EventType=\"WmiEvent*\"\
    \ OR Operation=\"Created\") (EventNamespace=\"*root\\\\subscription*\" OR TargetObject=\"*root\\\\subscription*\") (Consumer=\"*\" OR Filter=\"\
    *\" OR \"__EventFilter\" OR \"__EventConsumer\" OR \"__FilterToConsumerBinding\")\n| eval wmi_object=coalesce(Consumer, Filter, TargetObject)\n\
    | eval detection_type=case(\n    like(wmi_object, \"%__EventFilter%\"), \"EventFilter\",\n    like(wmi_object, \"%__EventConsumer%\"), \"\
    EventConsumer\", \n    like(wmi_object, \"%__FilterToConsumerBinding%\"), \"FilterToConsumerBinding\",\n    1=1, \"WMI_Persistence\")\n| table\
    \ _time, ComputerName, User, EventCode, detection_type, wmi_object, CommandLine, Operation\n"
  kql: 'DeviceProcessEvents

    | where TimeGenerated > ago(1d)

    | where process_name matches regex ".+"

    | summarize Count=count() by DeviceName, AccountName, FileName, InitiatingProcessFileName, ProcessCommandLine

    | order by Count desc

    '
  aql: "SELECT DEVICETIME, sourceip, \"Process Name\", \"Parent Process Name\", \"Process CommandLine\"\nFROM events\nWHERE LOGSOURCETYPENAME(devicetype)\
    \ = 'Microsoft Windows Sysmon'\n  AND \"EventID\" = '1'\n  AND \"process_name\" LIKE '%.+%'\nLAST 24 HOURS\n"
  yara_l: "rule tdl_tdl_pe_000720 {\n  meta:\n    author = \"TDL\"\n    description = \"WMI Permanent Event Subscription Created\"\n    severity\
    \ = \"HIGH\"\n    tactic = \"TA0004\"\n    technique = \"T1546\"\n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    $e.process_name\
    \ = /.+/\n    $host = $e.principal.hostname\n  match:\n    $host over 30m\n  condition:\n    $e\n}\n"
  esql: 'FROM logs-endpoint*,logs-windows*

    | WHERE @timestamp > NOW() - 1 hour

    | WHERE event.category == "process" AND process_name LIKE "%.+%"

    | STATS count = COUNT(*) BY host.name, user.name, process.name, process.parent.name, process.command_line

    | SORT count DESC

    '
  leql: 'where(logset = "Endpoint Activity" AND process_name=/.+/)

    groupby(asset, process_name, parent_process_name)

    calculate(count)

    '
  crowdstrike: 'event_simpleName=ProcessRollup2 AND process_name=*.+*

    | stats count as occurrences by ComputerName, UserName, FileName, ParentBaseFileName, CommandLine

    | sort -occurrences

    '
  xql: 'dataset = xdr_data

    | filter event_type = ENUM.PROCESS AND process_name ~= ".+"

    | comp count() as occurrences by agent_hostname, actor_effective_username, action_process_image_name, causality_actor_process_image_name,
    action_process_image_command_line

    | sort desc occurrences

    '
  lucene: 'event.category:"process" AND process_name:*.+*

    '
  sumo: '_sourceCategory=*sysmon* OR _sourceCategory=*endpoint*

    | parse "EventID=*\"" as event_id

    | where event_id="1" AND process_name matches "*.+*"

    | count by host, user, parent_process_name, command_line

    | sort by _count desc

    '
pseudo_logic: Creation of __EventFilter / __EventConsumer / __FilterToConsumerBinding in root\subscription. Classic stealth WMI persistence +

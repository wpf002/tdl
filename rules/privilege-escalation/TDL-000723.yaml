rule_id: TDL-PE-000723
v4_id: '000723'
name: Scheduled Task Configured to Run as SYSTEM
description: schtasks /create /ru SYSTEM, or task XML RunLevel=HighestAvailable with UserId=NT AUTHORITY\SYSTEM. Scheduled escalation primitive.
  Generated from gap analysis against canonical ATT&CK Enterprise matrix (T1053 under Privilege Escalation).
tactic: Privilege Escalation
tactic_id: TA0004
technique_id: T1053
technique_name: Scheduled Task/Job
platform:
- Windows
- Linux
- macOS
data_sources:
- Sysmon
- Windows Event Log
- Auditd
severity: Medium
fidelity: High
lifecycle: Proposed
risk_score: 60
queries:
  spl: 'index=wineventlog (sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\schtasks.exe" (CommandLine="*/create*"
    AND CommandLine="*/ru*" AND (CommandLine="*SYSTEM*" OR CommandLine="*NT AUTHORITY\\SYSTEM*"))) OR (sourcetype=WinEventLog:Security EventCode=4698
    Task_Content="*<RunLevel>HighestAvailable</RunLevel>*" Task_Content="*<UserId>NT AUTHORITY\\SYSTEM</UserId>*") OR (sourcetype=WinEventLog:Security
    EventCode=4698 Task_Content="*<RunLevel>HighestAvailable</RunLevel>*" Task_Content="*<UserId>SYSTEM</UserId>*")

    | table _time, ComputerName, User, Image, CommandLine, Task_Name, Task_Content

    '
  kql: "union \n(SecurityEvent\n| where TimeGenerated > ago(1h)\n| where EventID == 4698\n| extend TaskContent = tostring(parse_xml(EventData).DataItem.EventData.Data[6].[\"\
    #text\"])\n| where TaskContent contains \"HighestAvailable\" and TaskContent contains \"NT AUTHORITY\\\\SYSTEM\"\n| project TimeGenerated,\
    \ Computer, Account, TaskName = tostring(parse_xml(EventData).DataItem.EventData.Data[0].[\"#text\"]), TaskContent),\n(SecurityEvent\n| where\
    \ TimeGenerated > ago(1h)\n| where EventID == 4688\n| where Process endswith \"schtasks.exe\"\n| where CommandLine has \"/create\" and CommandLine\
    \ has \"/ru\" and (CommandLine has_any (\"SYSTEM\", \"NT AUTHORITY\\\\SYSTEM\"))\n| project TimeGenerated, Computer, Account, Process, CommandLine),\n\
    (Event\n| where TimeGenerated > ago(1h)\n| where Source == \"Microsoft-Windows-Sysmon\" and EventID == 1\n| extend CommandLine = tostring(EventData.CommandLine),\
    \ Image = tostring(EventData.Image)\n| where Image endswith \"schtasks.exe\"\n| where CommandLine has \"/create\" and CommandLine has \"/ru\"\
    \ and (CommandLine has_any (\"SYSTEM\", \"NT AUTHORITY\\\\SYSTEM\"))\n| project TimeGenerated, Computer, UserName = tostring(EventData.User),\
    \ Image, CommandLine)\n| project TimeGenerated, Computer, Account = coalesce(Account, UserName), Process = coalesce(Process, Image, \"Task\
    \ Scheduler\"), CommandLine = coalesce(CommandLine, TaskContent, TaskName)\n"
  aql: |
    SELECT eventtime, username, sourceip, LOGSOURCENAME(logsourceid) AS host, "Process CommandLine", "Parent Process Name", "EventID"
    FROM events
    WHERE (
      ("Process Name" ILIKE '%schtasks.exe%' AND "Process CommandLine" ILIKE '%/create%' AND "Process CommandLine" ILIKE '%/ru%' AND "Process CommandLine" ILIKE '%SYSTEM%')
      OR
      ("EventID" = '4698' AND "Task Content" ILIKE '%RunLevel%' AND "Task Content" ILIKE '%HighestAvailable%' AND "Task Content" ILIKE '%NT AUTHORITY\\SYSTEM%')
      OR
      ("EventID" = '106' AND "Task Content" ILIKE '%RunLevel%' AND "Task Content" ILIKE '%HighestAvailable%' AND "Task Content" ILIKE '%NT AUTHORITY\\SYSTEM%')
    )
    LAST 24 HOURS
  yara_l: "rule scheduled_task_privilege_escalation {\n  meta:\n    author = \"TDL\"\n    description = \"Detects scheduled task creation with\
    \ elevated privileges (SYSTEM or HighestAvailable)\"\n    mitre_attack_tactic = \"Privilege Escalation\"\n    mitre_attack_technique = \"\
    T1053\"\n    severity = \"HIGH\"\n  \n  events:\n    $e.metadata.event_type = \"PROCESS_LAUNCH\"\n    (\n      re.regex($e.principal.process.file.full_path,\
    \ `(?i)\\\\schtasks\\.exe$`) or\n      re.regex($e.principal.process.command_line, `(?i)schtasks`)\n    )\n    (\n      (\n        re.regex($e.principal.process.command_line,\
    \ `(?i)/create`) and\n        re.regex($e.principal.process.command_line, `(?i)/ru\\s+(NT AUTHORITY\\\\SYSTEM|SYSTEM)`)\n      ) or\n    \
    \  (\n        re.regex($e.principal.process.command_line, `(?i)RunLevel.*HighestAvailable`) and\n        re.regex($e.principal.process.command_line,\
    \ `(?i)UserId.*NT AUTHORITY\\\\SYSTEM`)\n      )\n    )\n    $e.principal.hostname = $host\n    $e.principal.user.userid = $user\n  \n  match:\n\
    \    $host, $user over 5m\n  \n  outcome:\n    $risk_score = 75\n  \n  condition:\n    $e\n}\n"
  esql: |
    FROM logs-windows.sysmon_operational*, logs-endpoint.events.process*, winlogbeat-*
    | WHERE @timestamp > NOW() - 24 hour
      AND (
        (process.name == "schtasks.exe" AND process.command_line LIKE "*create*" AND process.command_line LIKE "*/ru*" AND (process.command_line LIKE "*SYSTEM*" OR process.command_line LIKE "*HighestAvailable*"))
        OR (event.code == "4698" AND (winlog.event_data.TaskContent LIKE "*HighestAvailable*" OR winlog.event_data.TaskContent LIKE "*NT AUTHORITY\\SYSTEM*"))
      )
    | STATS event_count = COUNT(*) BY host.name, user.name, process.command_line, process.parent.name
    | WHERE event_count > 0
    | KEEP @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, event_count
  leql: |
    where((process_name ICONTAINS "schtasks.exe" AND process_cmd_line ICONTAINS "/create" AND process_cmd_line ICONTAINS "/ru" AND process_cmd_line ICONTAINS "system") OR (process_cmd_line ICONTAINS "RunLevel" AND process_cmd_line ICONTAINS "HighestAvailable" AND process_cmd_line ICONTAINS "NT AUTHORITY\\SYSTEM")) groupby(asset, user, process_cmd_line) calculate(count)
  crowdstrike: |
    (event_simpleName=ProcessRollup2 FileName=schtasks.exe (CommandLine=*/create* AND CommandLine=*/ru* AND CommandLine=*SYSTEM*)) OR (EventCode=4698 AND (TaskContent=*RunLevel*HighestAvailable* AND TaskContent=*UserId*NT?AUTHORITY?SYSTEM*))
    | table([@timestamp, ComputerName, UserName, FileName, CommandLine, ParentBaseFileName, SHA256HashData])
  xql: |
    dataset = xdr_data
    | filter event_type = ENUM.EVENT_TYPE_PROCESS
    | filter (actor_process_image_name ~= "(?i)schtasks\.exe" and action_process_image_command_line ~= "(?i)/create.*(/ru|/RU)\s+(SYSTEM|\"SYSTEM\"|NT\s+AUTHORITY\\\\SYSTEM)")
        or (action_process_image_command_line ~= "(?i)Register-ScheduledTask" and action_process_image_command_line ~= "(?i)-RunLevel\s+Highest")
        or (action_process_image_command_line ~= "(?i)<RunLevel>HighestAvailable</RunLevel>" and action_process_image_command_line ~= "(?i)<UserId>NT\s+AUTHORITY\\\\SYSTEM</UserId>")
    | fields _time, agent_hostname, actor_effective_username, actor_process_image_name, action_process_image_command_line
  lucene: |
    (process.name:(schtasks.exe OR schtasks) AND process.command_line:(*\/create* AND (*\/ru*SYSTEM* OR *\/ru*"NT AUTHORITY\\SYSTEM"*))) OR (event.code:(4698 OR 106) AND (event.xml:(*RunLevel*HighestAvailable* AND *UserId*NT?AUTHORITY\\SYSTEM*) OR winlog.event_data.TaskContent:(*RunLevel*HighestAvailable* AND *UserId*NT?AUTHORITY\\SYSTEM*)))
  sumo: |
    _sourceCategory=*Windows* ("schtasks" OR "4698" OR "106")
    | json field=_raw "EventID" as event_id
    | json field=_raw "CommandLine" as command_line
    | json field=_raw "TaskContent" as task_content
    | json field=_raw "Computer" as computer
    | json field=_raw "User" as user
    | where (command_line matches "*schtasks*" AND command_line matches "*/create*" AND command_line matches "*/ru*" AND (command_line matches "*SYSTEM*" OR command_line matches "*NT AUTHORITY\\SYSTEM*"))
       OR (event_id in ("4698", "106") AND task_content matches "*RunLevel*" AND task_content matches "*HighestAvailable*" AND task_content matches "*NT AUTHORITY\\SYSTEM*")
    | fields _messageTime, computer, user, command_line, task_content, event_id
pseudo_logic: schtasks /create /ru SYSTEM, or task XML RunLevel=HighestAvailable with UserId=NT AUTHORITY\SYSTEM. Scheduled escalation primitive.
false_positives:
- Sanctioned admin or engineering activity
- Approved automation / CI workflows

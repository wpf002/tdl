# Drop into the Windows Universal Forwarder: %SPLUNK_HOME%\etc\system\local\inputs.conf
# Collects the event channels TDL's Windows rules query.
[WinEventLog://Security]
disabled = 0
index = main

[WinEventLog://System]
disabled = 0
index = main

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
index = main

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = main

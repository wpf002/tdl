# TDL Test Lab — a free, local Splunk instance to validate detection rules
# against REAL Windows logs (EVTX attack samples + Atomic Red Team telemetry).
#
#   cd test-lab && cp .env.example .env && docker compose up -d
#   # wait ~1-2 min for first boot, then:  http://localhost:8000  (admin / <SPLUNK_PASSWORD>)
#
# Uses Splunk Enterprise's free-forever tier (500 MB/day indexing) — plenty for a
# rule-testing lab. HEC (8088) is used to ingest converted EVTX; REST (8089) is
# used by scripts/run_rule.py to execute TDL's SPL queries.
services:
  splunk:
    image: splunk/splunk:9.3
    # Splunk publishes amd64 only; on Apple Silicon this runs under emulation
    # (Rosetta/QEMU) — slower to boot but works. Harmless on native amd64 hosts.
    platform: linux/amd64
    container_name: tdl-splunk
    hostname: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-tdl-splunk-lab}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-tdl-hec-token-change-me}
      # No license URI → Splunk's free 60-day Enterprise trial (full features incl.
      # REST auth, used by the rule runner). Reverts to the free 500 MB/day tier
      # after 60 days; run scripts/enable-remote-login.sh then to keep REST working.
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
    ports:
      - "8000:8000"   # Web UI
      - "8088:8088"   # HTTP Event Collector (ingest)
      - "8089:8089"   # REST API / management (rule runner)
      - "9997:9997"   # Splunk-to-Splunk receiving (Atomic Red Team via Universal Forwarder)
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8089/services/server/info", "-o", "/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  splunk-var:
  splunk-etc:

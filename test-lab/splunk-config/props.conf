# Search-time field aliases that map raw EVTX field names to the field names
# TDL's SPL uses — the normalization a real Splunk deployment gets from the
# Splunk Add-on for Microsoft Windows (TA-windows). Lets the lab test rule
# LOGIC without every rule tripping on field naming alone.
[WinEventLog:Security]
FIELDALIAS-proc1 = New_Process_Name AS process_name
FIELDALIAS-proc2 = NewProcessName AS process_name
FIELDALIAS-ppn   = ParentProcessName AS parent_process_name
FIELDALIAS-cmd1  = Process_Command_Line AS command_line
FIELDALIAS-cmd2  = CommandLine AS command_line
FIELDALIAS-usr1  = SubjectUserName AS user
FIELDALIAS-usr2  = TargetUserName AS user
FIELDALIAS-ip    = IpAddress AS src_ip

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
FIELDALIAS-proc  = Image AS process_name
FIELDALIAS-ppn   = ParentImage AS parent_process_name
FIELDALIAS-cmd   = CommandLine AS command_line
FIELDALIAS-usr   = User AS user
FIELDALIAS-sip   = SourceIp AS src_ip
FIELDALIAS-dip   = DestinationIp AS dest_ip
FIELDALIAS-dport = DestinationPort AS dest_port
FIELDALIAS-proto = Protocol AS protocol
FIELDALIAS-reg1  = TargetObject AS registry_key
FIELDALIAS-reg2  = TargetObject AS target_object
FIELDALIAS-file1 = TargetFilename AS file_name
FIELDALIAS-file2 = TargetFilename AS target_filename
